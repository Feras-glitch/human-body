ست السبب ولا تُلام أبداً؛ المسؤولية على الكبار. ومن أخبر فعل الصواب، فأخبر كبيراً موثوقاً، وإن لم يسمعك فأخبر غيره.","level":"A","rubric":"R1"},{"id":"U10.L03.C6","objective":"U10.L03.O5","type":"explain_open","prompt":"{اذكر|اذكري} طريقتين {تحترم|تحترمين} بهما خصوصية غيرك{|ِ} في البيت أو المدرسة.","answer":"أطرق الباب وأستأذن قبل الدخول، ولا أنظر إلى أحد وهو يبدّل ملابسه، ولا أصوّر أحداً بلا إذنه، ولا أسخر من جسم أحد.","level":"A","rubric":"R1"}],"concepts":[{"id":"private_parts","term":{"ar":"الأجزاء الخاصة","en":"Private parts","zh":"隐私部位","pinyin":"yǐnsī bùwèi","match":["الأجزاء الخاصة","أجزاؤك الخاصة","أجزاءك الخاصة","أجزائك الخاصة"]},"priority":"core","atlas":{"layer":"body","element":"private_parts"},"card":{"A":"أجزاء الجسم التي تغطيها الملابس الداخلية، ومنها الأعضاء التناسلية. لا يراها أحد ولا يلمسها، إلا للمساعدة في النظافة أو العلاج.","B":"في الشرع اسمها العورة، وحدودها عند الكبار أوسع من الملابس الداخلية؛ ويتعلمها الطفل مع أهله."}},{"id":"privacy","term":{"ar":"الخصوصية","en":"Privacy","zh":"隐私","pinyin":"yǐnsī","match":["الخصوصية","خصوصية","خصوصيتك"]},"priority":"core","atlas":{"layer":"body","element":"privacy"},"card":{"A":"حق كل إنسان أن يكون جسمه وأشياؤه الخاصة له: لا يُنظر إليها ولا تُلمس ولا تُصوَّر إلا بإذنه.","B":"ومنها خصوصية الصور والمعلومات على الشاشات."}},{"id":"boundaries","term":{"ar":"الحدود","en":"Boundaries","zh":"界限","pinyin":"jièxiàn","match":["الحدود","حدودك","حدود"]},"priority":"core","atlas":{"layer":"body","element":"personal_space"},"card":{"A":"ما يقبله كل واحد وما لا يقبله في جسمه ومكانه؛ ونحترم حدود غيرنا كما نريد أن تُحترم حدودنا.","B":"الحدود تُقال بأدب ووضوح: «لا، لا أريد»."}},{"id":"trusted_adult","term":{"ar":"الكبير الموثوق","en":"Trusted adult","zh":"可信赖的大人","pinyin":"kě xìnlài de dàrén","match":["الكبير الموثوق","كبيراً موثوقاً","الكبار الموثوقين","كبار موثوقين"]},"priority":"core","atlas":{"layer":"body","element":"trusted_adult"},"card":{"A":"كبير تعرفه وتطمئن إليه، يسمعك ويساعدك: أحد والديك، أو جدّتك، أو معلمك، أو غيرهم ممن تختاره مع أهلك.","B":"يحتاج كل طفل أربعة أو خمسة منهم، فإن لم يسمعه واحد أخبر الآخر."}},{"id":"unsafe_secret","term":{"ar":"السر المزعج","en":"Unsafe secret","zh":"不安全的秘密","pinyin":"bù ānquán de mìmì","match":["السر المزعج","سراً مزعجاً","الأسرار المزعجة"]},"priority":"supporting","atlas":{"layer":"body","element":"secret"},"card":{"A":"سرّ يُطلب منك كتمانه ويجعلك قلقاً أو خائفاً أو حزيناً. لا يُكتم، بل تخبر به كبيراً موثوقاً.","B":"بخلاف المفاجأة السعيدة التي تُكشف قريباً ويفرح بها الجميع."}}],"experiment":{"title":"يد الأمان: خمسة كبار أثق بهم","materials":["ورقة بيضاء وقلم","أقلام تلوين","ولي الأمر معك"],"steps":["{ارسم|ارسمي} حول كفّك{|ِ} على الورقة بالقلم.","مع ولي أمرك{|ِ}، {اكتب|اكتبي} على كل إصبع اسم كبير {تثق|تثقين} به ويسمعك، واحداً على الأقل خارج البيت (معلم، جدة، خالة…).","{اكتب|اكتبي} في وسط الكف القاعدة بكلماتك{|ِ}: لا، ابتعد، أخبر.","يقرأ عليك{|ِ} ولي أمرك{|ِ} ثلاثة مواقف قصيرة من الدرس، و{تقول|تقولين} في كل واحد: أهو آمن أم لا؟ وماذا {تفعل|تفعلين}؟ ولمن {تقول|تقولين}؟","{علّق|علّقي} اليد في مكان {تراه|ترينه}، و{راجعها|راجعيها} مع أهلك{|ِ} بعد أشهر."],"safety":["النشاط مع ولي الأمر، بالكلام والرسم فقط؛ لا تمثيل للمس.","لا يُسمّى في المواقف شخص حقيقي على أنه مؤذٍ؛ المواقف متخيَّلة.","إن تذكّر الطفل شيئاً أزعجه فعلاً، يسمعه ولي الأمر بهدوء ويشكره ويصدّقه، ويطلب المساعدة من مختص."],"expected":"يد عليها خمسة أسماء، والقاعدة في وسطها، وجواب الطفل في المواقف الثلاثة: أي موقف غير آمن، وما يفعله، ومن يخبره.","explain":"حين يحتاج الإنسان المساعدة قد ينسى من يسأل. اليد تذكّرك{|ِ}: خمسة أصابع، خمسة كبار. وإن لم يسمعك{|ِ} الأول فالثاني، حتى يسمعك{|ِ} أحد. والقاعدة في الوسط لأنها لا تتغير مع أي شخص.","record":"أسماء يد الأمان: 1 ___ 2 ___ 3 ___ 4 ___ 5 ___ — القاعدة بكلماتي: ___ — موقف غير آمن عرفته: ___","alternatives":["من لا يستطيع الرسم: يعدّ الأسماء على أصابعه بصوته مع ولي أمره.","في الصف: يرسم كل طفل يده ويكتب الأسماء في البيت مع أهله، لا أمام زملائه."]},"find_the_error":[{"id":"FE1","atlas_variant":"stranger_only","error":"ملصق: «احذر الغريب فقط، ومن تعرفه افعل ما يقول»","answer":"القاعدة واحدة مع الجميع، الغريب والمعروف: لا أحد يرى أجزاءك الخاصة أو يلمسها","detects":"M111"},{"id":"FE2","atlas_variant":"keep_promise_secret","error":"بطاقة: «الوعد وعد، فاكتم كل سر وعدت به»","answer":"المفاجأة تُكتم قليلاً، والسر المزعج لا وعد فيه ويُخبر به كبير موثوق","detects":"M112"},{"id":"FE3","atlas_variant":"child_blamed","error":"جملة في دفتر: «إن حدث لي شيء مزعج فأنا المخطئ»","answer":"الطفل لا يُلام أبداً، والمسؤولية على الكبار","detects":"M113"}],"numbers":[{"text":"خمسة كبار موثوقين: بعدد أصابع يدك{|ِ}. إن لم يسمعك{|ِ} الأول فالثاني، حتى يسمعك{|ِ} أحد.","source":["S3"]}],"true_size":[{"text":"خمسة أصابع، خمسة كبار موثوقين: يدك{|ِ} معك{|ِ} دائماً، فلا {تنسى|تنسين} من {تخبر|تخبرين}.","source":["S3"]}],"animal":null,"organ_letter":{"from":"جسمك{|ِ}","text":"مرحباً، أنا جسمك{|ِ}. {عرفتني|عرفتِني} عظاماً وعضلات وقلباً ورئتين وجلداً، وأنا أكبر معك{|ِ} كل يوم. وأنا أمانة عندك{|ِ}: {احفظني|احفظيني}. حين يقلقك{|ِ} شيء أرسل لك{|ِ} إنذاراً: قلباً يسرع وبطناً ينقبض، {فاستمع|فاستمعي} إليّ. وإن طلب منك{|ِ} أحد شيئاً يخص أجزائي الخاصة {فقل|فقولي}: لا، {وابتعد|وابتعدي}، {وأخبر|وأخبري}. ولا {تكتم|تكتمي} سراً يزعجك{|ِ}، ولا {تلم|تلومي} نفسك{|ِ} أبداً. وكما {تحفظني|تحفظينني}، {احفظ|احفظي} خصوصية غيرك{|ِ}: {اطرق|اطرقي} الباب، و{استأذن|استأذني}."},"history":[{"who":"الإمام أبو حامد الغزالي","origin":"طوس (إيران اليوم)","where_when":"طوس وبغداد، 1058–1111؛ كتابه «إحياء علوم الدين»","did":"كتب فصلاً في تربية الأطفال: أن الحياء حين يظهر في الطفل علامة على أن عقله بدأ يستنير، وأن يُعوَّد الستر، وأن حمايته من رفقة السوء أصل تربيته، وأن يُترك يلعب بعد الدرس ليستريح ولا يملّ.","did_not":"لم يكتب عن علم النفس ولا عن الدراسات التي تقارن الأطفال، وبعض نصائحه في الطعام والنوم والملبس تخص زمنه وتختلف فيها نصائح الأطباء اليوم.","method_lesson":"أن ننظر إلى الطفل كله: جسمه وعقله وحياءه وصحبته، لا جسمه وحده.","source":["S6"]}],"how_we_know":{"text":"كيف عرفنا أن تعليم الأمان يساعد الأطفال؟ جمع باحثون أربعاً وعشرين تجربة في سبع دول على نحو ستة آلاف طفل، تعلّم بعضهم قواعد الأمان في المدرسة ولم يتعلمها غيرهم، ثم قارنوا: الذين تعلّموها عرفوا أكثر وتصرفوا بأمان أكثر، ولم يصيروا أكثر خوفاً.","limit_question":"لماذا نعيد الحديث عن قواعد الأمان مع الأهل بعد أشهر؟"},"what_changed":["كان كثيرون يعلّمون الأطفال «لا تكلّم الغريب» وحده؛ واليوم نعلّمهم أن القاعدة واحدة مع كل الناس، الغريب والمعروف، وأن يخبروا كبيراً موثوقاً.","كان يُظن أن الحديث مع الأطفال عن أجسامهم يخيفهم؛ ووجدت الدراسات أن تعليم الأمان بهدوء لا يزيد خوفهم."],"model_limits":["«يد الأمان» تذكير بخمسة أسماء، لا قائمة ثابتة؛ قد يتغير الكبار الموثوقون، فتُراجع مع الأهل.","المواقف في الدرس متخيَّلة وقصيرة؛ والحياة فيها مواقف أعقد، والقاعدة فيها كلها: إن أزعجك شيء فأخبر.","إنذار الجسم يساعد ولا يكفي وحده: قد لا يحسّ الطفل به، ومع ذلك يخبر بكل ما يخص أجزاءه الخاصة."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لِيَسْتَـْٔذِنكُمُ ٱلَّذِينَ مَلَكَتْ أَيْمَـٰنُكُمْ وَٱلَّذِينَ لَمْ يَبْلُغُوا۟ ٱلْحُلُمَ مِنكُمْ ثَلَـٰثَ مَرَّٰتٍۢ ۚ مِّن قَبْلِ صَلَوٰةِ ٱلْفَجْرِ وَحِينَ تَضَعُونَ ثِيَابَكُم مِّنَ ٱلظَّهِيرَةِ وَمِنۢ بَعْدِ صَلَوٰةِ ٱلْعِشَآءِ ۚ ثَلَـٰثُ عَوْرَٰتٍۢ لَّكُمْ ۚ لَيْسَ عَلَيْكُمْ وَلَا عَلَيْهِمْ جُنَاحٌۢ بَعْدَهُنَّ ۚ طَوَّٰفُونَ عَلَيْكُم بَعْضُكُمْ عَلَىٰ بَعْضٍۢ ۚ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْـَٔايَـٰتِ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ","reference":"النور 58","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} أدب من آداب البيت: أن يستأذن الصغار قبل أن يدخلوا على أهلهم في ثلاثة أوقات يخلو فيها الإنسان بنفسه: آخر الليل قبل الفجر، ووقت راحة الظهر، وبعد العشاء. فالخصوصية أدب علّمنا إياه القرآن، حتى بين أهل البيت الواحد. واليوم نتعلم كيف نحفظ خصوصية أجسامنا وخصوصية غيرنا. متى {تطرق|تطرقين} الباب قبل أن {تدخل|تدخلي} في بيتكم؟","reviewed":false,"quran_key":"24:58","hl_words":[3,13],"highlight":"ليستأذنكم الذين ملكت أيمانكم والذين لم يبلغوا الحلم منكم ثلاث مرات","level":"ترغيب","concept":"الاستئذان وحفظ الخصوصية أدب قرآني حتى بين أهل البيت.","avoid":"لا نفصّل أحكام الإماء والعبيد ولا خلاف الفقهاء في الآية؛ ولا نقول إن العلم أثبتها. ويُترك للمراجع الشرعي: هل يُعرض الأمر في الآية للطفل أدباً مرغَّباً فيه أم حكماً واجباً.","cards":[]},"closing":{"text":"لا ينظر الرجل إلى عورة الرجل، ولا المرأة إلى عورة المرأة، ولا يُفضي الرجل إلى الرجل في ثوب واحد، ولا تُفضي المرأة إلى المرأة في الثوب الواحد","reference":"مسلم 338","grade":"صحيح","usage":"حكم","reflection":"الحديث في البطاقة يعلّمنا أن للجسم ستراً حتى بين الرجال، وحتى بين النساء: لا ينظر أحد إلى عورة غيره، ولكل واحد غطاؤه وثوبه، فلا يتعرّى أحد أمام أحد ولا يلتصق جلده بجلده تحت غطاء واحد. وهذه قاعدتنا اليوم نفسها: أجزاؤك{|ِ} الخاصة لك{|ِ}، وأجزاء غيرك{|ِ} له. والحديث لا يتكلم عن الإنترنت ولا عن الأسرار؛ لكنه يجعل حفظ العورة أدباً يعيشه المسلم كل يوم. كيف {تحفظ|تحفظين} خصوصيتك{|ِ} في غرفة تبديل الملابس؟","reviewed":false,"hadith_key":"muslim:338","highlight":"لا ينظر الرجل إلى عورة الرجل، ولا المرأة إلى عورة المرأة","level":"نهي","concept":"حفظ العورة: لا ينظر أحد إلى عورة غيره، ولكل واحد غطاؤه.","avoid":"لا نشرح «يُفضي» بأكثر من «يلتصق جلده بجلده تحت غطاء واحد»، ولا نربط الحديث بأي إيذاء، ولا نخيف الطفل من أهله؛ ولا نقول إن العلم أثبته.","lead":"عن أبي سعيد الخدري رضي الله عنه أن رسول الله ﷺ قال:","narration":false,"source":"مسلم 338","grader":"","cards":[]}},"life":[{"situation":"في غرفة تبديل الملابس بعد الرياضة، أخرج زميل هاتفه ليصوّر ولداً وهو يبدّل ملابسه، وضحك الآخرون.","science":"لكل إنسان خصوصية جسمه، والصورة تُنشر ولا تُحذف من عند الآخرين؛ والسخرية من الجسم تؤذي صاحبها كما يؤذيه الضرب.","action":"أقول للزميل بهدوء: لا، هذه خصوصيته، وأقف بجانب الولد، وأخبر المعلم إن أصرّ.","value":"لا سخرية، ولا تصوير بلا إذن، وحفظ العورة.","why":"لماذا لا أضحك مع الآخرين؟ لأن الضحك على جسم أحد يجرحه، والصورة قد تبقى سنوات. وفي الآية في البطاقة نهي عن السخرية من الناس، فقد يكون من نسخر منه خيراً منا.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]},{"situation":"قريب كبير أعطاني هدية وقال: «لا تخبر أمك أنني دخلت غرفتك وأغلقت الباب».","science":"هذا سر مزعج: معه هدية وطلب كتمان، ويخص مكاني الخاص؛ وجسمي قد ينذرني بقلق في البطن.","action":"لا أكتم السر، وأخبر أمي أو كبيراً موثوقاً آخر اليوم، وأعرف أنني لن أكون في مشكلة.","value":"الصدق والإخبار، ولا لوم على الطفل.","why":"لماذا أخبر وهو قريب أحبه؟ لأن القاعدة واحدة مع الجميع، والكبار الموثوقون هم الذين يحمونني، والسر المزعج لا وعد فيه.","cards":[],"verses":[]}],"open_questions":[{"q":"هل تبقى معرفة الأطفال بقواعد الأمان سنوات بعد أن يتعلموها؟","why_open":"الدراسات قاست أثرها بعد شهر إلى ستة أشهر، ولم تقس أثرها البعيد؛ ولذلك نعيد الحديث فيها مع الأهل مرات."}],"notebook":{"draw":"{ارسم|ارسمي} كفّك{|ِ}، و{اكتب|اكتبي} على كل إصبع اسم كبير موثوق مع أهلك{|ِ}، وفي وسطها: لا، ابتعد، أخبر. ثم {ارسم|ارسمي} صندوقين: صندوق «مفاجأة» فيه هدية، وصندوق «سر مزعج» عليه علامة: أخبر. المستوى ب: {ارسم|ارسمي} هاتفاً وعليه قاعدة: لا صور، ولا عنوان، وأخبر أهلي.","label":["الأجزاء الخاصة","الخصوصية","الحدود","الكبير الموثوق","مفاجأة","السر المزعج","لا، ابتعد، أخبر","— ب: الأمان على الشاشات"],"write":"أشرح: ما أجزائي الخاصة، ومتى يُقبل أن يلمسها أحد؟ وما الفرق بين المفاجأة والسر المزعج؟ ومن الكبار الخمسة الذين أخبرهم؟ وكيف أحترم خصوصية غيري؟"},"imgs":["U10.L03-E1","U10.L03-E2","U10.L03-E3","U10.L03-E4","U10.L03-E5","U10.L03-E6","U10.L03-exp","U10.L03-hist1","U10.L03-letter","U10.L03-life","U10.L03-title-boy","U10.L03-title-girl"]};
