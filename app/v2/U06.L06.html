<script>
const LD = {"id":"U06.L06","first":false,"title":"ماذا آكل؟ الطبق المتوازن","driving_question":"{اسم}، {عرفت|عرفتِ} كيف يصير الطعام في دمك{|ِ}. لكن لماذا لا يكفي أن {تأكل|تأكلي} ما {تحبه|تحبينه} حتى {تشبع|تشبعي}؟","central_fact":"في الطعام مواد غذائية مختلفة، لكل منها عمل في الجسم، ولا يعطيها كلها طعام واحد؛ والطبق المتوازن نصفه خضار وفاكهة والنصف الآخر حبوب وبروتين مع الماء، والسكر المضاف يُقلَّل.","next":null,"nexts":[],"hook":{"text":"{اسم}، لو {أكلت|أكلتِ} طعامك{|ِ} المفضل وحده كل يوم، ماذا سيحدث لجسمك{|ِ}؟","options":["لا شيء، ما دمت أشبع","سينقصه شيء يحتاجه","سيصير أقوى","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive"],"highlight":["small_intestine"],"zoom":"body"},"text":"في هذه الوحدة {تتبعت|تتبعتِ} اللقمة حتى عبرت إلى الدم. فماذا يعبر؟ في الطعام مواد مختلفة يأخذها الجسم ليعمل وينمو، اسمها المواد الغذائية. النشويات والسكريات في الخبز والأرز والمعكرونة والفاكهة تعطي الطاقة، لأن الجسم يكسرها إلى سكر تستعمله الخلايا، كما {عرفت|عرفتِ} في درس الخلية. والبروتين في اللحم والسمك والبيض والحليب والعدس والفول يبني العضلات والأعضاء ويجددها. والدهون في الزيت والمكسرات والسمك تخزّن الطاقة، ومنها تُصنع أغشية الخلايا."},{"id":"E2","level":"A","atlas":{"layers":["skeleton","circulatory"],"highlight":["bones","blood"],"zoom":"body"},"text":"ومن المواد الغذائية ما يحتاجه الجسم بكميات صغيرة جداً لكنه لا يستغني عنه: الفيتامينات والمعادن. الكالسيوم في الحليب واللبن والخضار الورقية يبني عظاماً قوية. والحديد في اللحم والدجاج والفول والخضار الورقية. وهناك الماء، والألياف التي {عرفتها|عرفتِها} في درس سكان الأمعاء. ولا يوجد طعام واحد فيه كل شيء، فالطريق إليها كلها أن ننوّع الطعام والألوان."},{"id":"E3","level":"A","atlas":{"layers":["digestive"],"highlight":["stomach"],"zoom":"body"},"text":"كيف {تجمع|تجمعين} ذلك في وجبة؟ بالطبق المتوازن: {املأ|املئي} نصف الطبق خضاراً وفاكهة بألوان مختلفة، و{اجعل|اجعلي} ربعه حبوباً، والخبز الأسمر والبرغل أحسن، وربعه بروتيناً كالدجاج أو السمك أو البيض أو العدس. و{اشرب|اشربي} معه الماء. والطبق المتوازن ليس قاعدة لكل لقمة؛ المهم طعام اليوم كله. والحلوى ليست ممنوعة، لكنها أحياناً وبقدر."},{"id":"E4","level":"A","atlas":{"layers":["digestive"],"highlight":["small_intestine"],"zoom":"body"},"text":"والسكر؟ السكر المضاف هو الذي يُضاف في المصنع أو المطبخ، كسكر المشروبات الغازية والحلوى، ويُحسب معه سكر العصير والعسل. وتوصي جمعية القلب الأمريكية من في عمرك{|ِ} بأقل من ست ملاعق صغيرة منه في اليوم كله. وفي علبة مشروب محلى واحدة قد يكون مثلها أو أكثر! وكيف {تعرف|تعرفين}؟ من ملصق الغذاء على العلبة: {انظر|انظري} إلى حجم الحصة أولاً، ثم إلى السكر بالغرامات؛ وكل أربعة غرامات نحو ملعقة صغيرة. والمكونات مكتوبة من الأكثر إلى الأقل."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"كيف عرف العلماء أن نقص شيء في الطعام يُمرض؟ كان البحارة قديماً يمرضون في الرحلات الطويلة بمرض اسمه الإسقربوط: تنزف لثاتهم ويتعبون. سنة 1747 اختار الطبيب جيمس ليند على سفينته اثني عشر بحاراً مرضهم في المرحلة نفسها، وأعطى كل اثنين منهم علاجاً مختلفاً، واثنين برتقالاً وليموناً. فتحسن هذان أسرع من الجميع، وعاد أحدهما إلى عمله بعد ستة أيام. هذا نقص الغذاء: أن ينقص في الطعام شيء يحتاجه الجسم مدة طويلة. لكن البحرية لم تأخذ بنصيحة ليند إلا بعد نحو خمسين سنة."},{"id":"E6","level":"B","atlas":{"layers":["digestive"],"highlight":["small_intestine"],"zoom":"body"},"text":"للمستوى ب: في الملصق نسبة اسمها «القيمة اليومية». إن كانت 5% أو أقل فالطعام فيه قليل من تلك المادة، وإن كانت 20% أو أكثر ففيه كثير. فيمكن أن {تبحث|تبحثي} عن الكثير من الألياف والكالسيوم، والقليل من السكر المضاف والملح. لكن النسبة محسوبة لغذاء إنسان كبير، فحاجتك{|ِ} قد تختلف. و{تذكّر|تذكّري}: لا تُقاس صحة الطعام بمادة واحدة؛ الجسم يحتاج المواد معاً، ونقص واحدة لا تعوّضه زيادة أخرى."}],"practice":[{"id":"U06.L06.P1","after":"E1","objective":"U06.L06.O1","type":"choose","prompt":"أي مادة غذائية تبني العضلات وتجددها؟","options":["السكر في الحلوى","البروتين","الماء البارد في الكوب","الملح في الطعام"],"answer":1,"explanation":"البروتين يبني أنسجة الجسم ويجددها، ومنه أكثر العضلات.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: ماذا في اللحم والعدس والبيض؟","feedback_by_option":{"0":"السكر يعطي طاقة سريعة.","2":"الماء ضروري، لكنه لا يبني العضلات.","3":"الملح بقدر قليل، ولا يبني العضلات."}},{"id":"U06.L06.P2","after":"E2","objective":"U06.L06.O1","type":"choose","prompt":"كيف {تحصل|تحصلين} على الفيتامينات والمعادن كلها؟","options":["من طعام واحد آكله كل يوم","بتنويع الطعام والألوان","من الحلوى الملونة","من حبوب الفيتامين بدل الطعام"],"answer":1,"explanation":"لا يوجد طعام فيه كل شيء؛ التنوع هو الطريق.","level":"A","feedback_wrong":"هل في الجزر ما في الحليب؟","feedback_by_option":{"0":"لا يوجد طعام واحد فيه كل شيء.","2":"ألوان الحلوى ليست ألوان الخضار والفاكهة.","3":"الطعام المتنوع أحسن، والحبوب من الطبيب عند الحاجة."},"detects":"M134"},{"id":"U06.L06.P3","after":"E3","objective":"U06.L06.O2","type":"choose","prompt":"أي طبق أقرب إلى الطبق المتوازن؟","options":["أرز كثير يملأ الطبق وقطعة دجاج صغيرة","نصفه خضار وفاكهة، والباقي خبز وعدس","بطاطس مقلية كثيرة مع قطعة حلوى كبيرة","فاكهة ولا شيء معها في الطبق كله"],"answer":1,"explanation":"نصفه خضار وفاكهة، وربعه حبوب، وربعه بروتين.","level":"A","feedback_wrong":"كم من الطبق للخضار والفاكهة؟","feedback_by_option":{"0":"لا خضار ولا فاكهة فيه.","2":"ينقصه البروتين والخضار والفاكهة.","3":"ينقصه البروتين والحبوب."}},{"id":"U06.L06.P4","after":"E4","objective":"U06.L06.O3","type":"choose","prompt":"على ملصق مشروب: السكر 24 غراماً في الحصة. كم ملعقة صغيرة تقريباً؟","options":["ملعقتان","ست ملاعق","أربع وعشرون ملعقة","ملعقة واحدة"],"answer":1,"explanation":"كل أربعة غرامات نحو ملعقة: 24 ÷ 4 = 6، وهذا حدّ اليوم كله تقريباً.","level":"A","feedback_wrong":"{اقسم|اقسمي} على 4.","feedback_by_option":{"0":"24 غراماً أكثر من ذلك بكثير.","2":"الغرامات ليست ملاعق؛ نقسم على 4.","3":"ملعقة نحو 4 غرامات فقط."}},{"id":"U06.L06.P5","after":"E5","objective":"U06.L06.O4","type":"sequence","prompt":"{رتّب|رتّبي} خطوات تجربة ليند.","options":["بحارة يمرضون بالإسقربوط في الرحلة","يختار اثني عشر في المرحلة نفسها","يعطي كل اثنين علاجاً مختلفاً","صاحبا البرتقال والليمون يتحسنان أسرع"],"answer":[0,1,2,3],"explanation":"المشكلة، ثم اختيار متشابهين، ثم علاجات مختلفة، ثم المقارنة.","level":"A","feedback_wrong":"ماذا فعل قبل أن يعطي العلاج؟"}],"check":[{"id":"U06.L06.C1","objective":"U06.L06.O1","type":"explain_open","prompt":"{اذكر|اذكري} ثلاث مواد غذائية، وعمل كل منها، وطعاماً فيه.","answer":"النشويات للطاقة، في الخبز؛ والبروتين للبناء، في العدس والبيض؛ والكالسيوم للعظام، في الحليب.","level":"A","rubric":"R1"},{"id":"U06.L06.C2","objective":"U06.L06.O2","type":"explain_open","prompt":"{صف|صفي} طبق غداء متوازناً من طعام بيتكم.","answer":"مثال: نصفه سلطة وخيار وبرتقالة، وربعه أرز أو خبز أسمر، وربعه دجاج أو فول، مع كوب ماء.","level":"A","rubric":"R1"},{"id":"U06.L06.C3","objective":"U06.L06.O3","type":"true_false_why","prompt":"«العصير الطبيعي مثل الفاكهة، فأشرب منه ما أشاء». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ سكر العصير يُحسب مع السكر المضاف، وأكثر العصائر فيها سكر كثير بلا ألياف الفاكهة؛ الحبة الكاملة أحسن، والعصير كوب صغير على الأكثر.","level":"A","rubric":"R1"},{"id":"U06.L06.C4","objective":"U06.L06.O4","type":"explain_open","prompt":"ما الذي جعل تجربة ليند عادلة؟","answer":"اختار بحارة مرضهم في المرحلة نفسها، وأعطى كل اثنين علاجاً مختلفاً، فلم يختلفوا إلا في العلاج.","level":"A","rubric":"R1"},{"id":"U06.L06.C5","objective":"U06.L06.O2","type":"true_false_why","prompt":"«الحلوى ليست ممنوعة، لكنها أحياناً وبقدر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الأكل الصحي تنوع وتوازن، والحلوى مكان صغير أحياناً؛ المهم طعام اليوم كله.","level":"A","rubric":"R1"},{"id":"U06.L06.C6","objective":"U06.L06.O1","type":"fix_model","prompt":"قالت سلمى: «سأترك كل الدهون لأنها مضرة». {صحّح|صحّحي} لها.","answer":"الجسم يحتاج الدهون للطاقة المخزونة وأغشية الخلايا وحماية الأعصاب؛ نختار مصادرها كالمكسرات والزيتون والسمك.","level":"A","rubric":"R1"}],"concepts":[{"id":"nutrient","term":{"ar":"المادة الغذائية","en":"Nutrient","zh":"营养素","pinyin":"yíngyǎngsù","match":["المادة الغذائية","المواد الغذائية","مواد غذائية"]},"priority":"core","atlas":{"layer":"digestive","element":"small_intestine"},"card":{"A":"ما يأخذه الجسم من الطعام ليعمل وينمو: النشويات والسكريات، والبروتين، والدهون، والفيتامينات، والمعادن، والماء.","B":"يحتاج الجسم بعضها بكميات كبيرة (النشويات والبروتين والدهون) وبعضها بكميات صغيرة جداً (الفيتامينات والمعادن)."}},{"id":"balanced_plate","term":{"ar":"الطبق المتوازن","en":"Balanced plate","zh":"均衡餐盘","pinyin":"jūnhéng cānpán","match":["الطبق المتوازن","طبق متوازن","طبقاً متوازناً"]},"priority":"core","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"طبق نصفه خضار وفاكهة ملونة، وربعه حبوب، وربعه بروتين، ومعه ماء.","B":"الحبوب الكاملة أفضل من المقشورة، والبروتين قد يكون من النبات (العدس والفول) أو من الحيوان."}},{"id":"added_sugar","term":{"ar":"السكر المضاف","en":"Added sugar","zh":"添加糖","pinyin":"tiānjiā táng","match":["السكر المضاف","سكر مضاف"]},"priority":"core","atlas":{"layer":"digestive","element":"small_intestine"},"card":{"A":"سكر يُضاف إلى الطعام والشراب في المصنع أو المطبخ، كسكر المشروبات الغازية والحلوى. ويُحسب معه سكر العصير والعسل.","B":"السكر الذي في حبة الفاكهة نفسها ومعه الألياف ليس سكراً مضافاً."}},{"id":"food_label","term":{"ar":"ملصق الغذاء","en":"Food label","zh":"食品标签","pinyin":"shípǐn biāoqiān","match":["ملصق الغذاء","الملصق","ملصق"]},"priority":"core","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"بطاقة على علبة الطعام تذكر ما فيه: حجم الحصة، والسكر، والمواد الغذائية، والمكونات من الأكثر إلى الأقل.","B":"نسبة «القيمة اليومية» 5% أو أقل تعني قليلاً، و20% أو أكثر تعني كثيراً."}},{"id":"deficiency","term":{"ar":"نقص الغذاء","en":"Nutrient deficiency","zh":"营养缺乏","pinyin":"yíngyǎng quēfá","match":["نقص الغذاء"]},"priority":"supporting","atlas":{"layer":"digestive","element":"small_intestine"},"card":{"A":"أن ينقص في الطعام شيء يحتاجه الجسم مدة طويلة، فيمرض.","B":"كالإسقربوط عند البحارة قديماً حين لم يأكلوا فاكهة ولا خضاراً طازجة أشهراً."}}],"experiment":{"title":"كم ملعقة سكر في مشروبي؟","materials":["علب مشروبات فارغة عليها ملصق (عصير، مشروب غازي، حليب بنكهة، ماء)","ملعقة صغيرة وقليل من السكر في صحن (لا يؤكل)","دفتر الأطلس وقلم"],"steps":["مع كبير، {اقرأ|اقرئي} على ملصق كل علبة حجم الحصة، ثم السكر بالغرامات.","{اقسم|اقسمي} الغرامات على 4 تقريباً لتعرف{|ي} عدد الملاعق الصغيرة.","{ضع|ضعي} في صحن نظيف عدد الملاعق من السكر بجانب كل علبة، ولا {تأكل|تأكلي} منه.","{قارن|قارني} بست ملاعق: أقصى السكر المضاف في اليوم كله لمن في عمرك{|ِ}.","{اكتب|اكتبي}: أي مشروب {تختاره|تختارينه} مع الغداء غداً؟ ولماذا؟"],"safety":["السكر في الصحن للعرض لا للأكل، ويُرمى بعد التجربة.","العلب فارغة ونظيفة، والقراءة مع كبير.","لا نعلّق على ما يشربه أحد في بيته؛ نتعلم الاختيار لأنفسنا."],"expected":"بعض المشروبات المحلاة فيها في العلبة الواحدة سكر قريب من ست ملاعق أو أكثر، والماء لا سكر فيه.","explain":"السكر المضاف يصل إلى الجسم بسرعة في المشروبات، فيمكن أن نبلغ حدّ اليوم كله بمشروب واحد؛ ولذلك الماء أول الشراب، والحليب غير المحلى، والعصير كوب صغير على الأكثر.","record":"المشروب ___ حجم الحصة ___ السكر ___ غرام ≈ ___ ملعقة — المشروب ___ ... — اختياري غداً: ___ لأن ___","alternatives":["من لا يجد علباً: صور ملصقات في المشهد يقرؤها مع المعلم.","المستوى ب: قراءة نسبة القيمة اليومية للسكر والصوديوم."]},"find_the_error":[{"id":"FE1","atlas_variant":"juice_free","error":"لوحة: العصير الطبيعي اشرب منه ما شئت","answer":"سكر العصير يُحسب مع السكر المضاف؛ كوب صغير على الأكثر، والحبة الكاملة أحسن","detects":"M132"},{"id":"FE2","atlas_variant":"fat_bad","error":"جملة في دفتر: الدهون كلها مضرة","answer":"الجسم يحتاج الدهون للطاقة المخزونة وأغشية الخلايا","detects":"M133"},{"id":"FE3","atlas_variant":"pill_plate","error":"إعلان: حبة واحدة بدل الخضار والفاكهة","answer":"التنوع هو الطريق، وفي الطعام ألياف وماء لا تعطيهما الحبة","detects":"M134"}],"numbers":[{"text":"ست ملاعق صغيرة: أقصى ما يُنصح به لمن في عمرك{|ِ} من السكر المضاف في اليوم كله.","source":["S7"]},{"text":"بعد ستة أيام من البرتقال والليمون عاد بحار مريض إلى عمله، بعد أن كان الإسقربوط يقعده.","source":["S9"]}],"true_size":[{"text":"في علبة مشروب محلى واحدة قد تجد ست ملاعق صغيرة من السكر أو أكثر: حدّ يومك{|ِ} كله في دقائق.","source":["S7"]}],"animal":null,"organ_letter":{"from":"الأمعاء الدقيقة","text":"مرحباً، أنا أمعاؤك{|ِ} الدقيقة. كل يوم {ترسل|ترسلين} إليّ طعاماً، فأفتحه وأمرّر ما فيه إلى الدم. وأنا أحب التنوع: النشويات تعطي خلاياك{|ِ} الطاقة، والبروتين يبني عضلاتك{|ِ}، والدهون تصنع أغشية خلاياك{|ِ}، والفيتامينات والمعادن تعمل أعمالاً صغيرة لا يستغني عنها جسمك{|ِ}، والألياف يحبها سكاني الصغار. لكن إن {أرسلت|أرسلتِ} إليّ مشروباً محلى كبيراً، صببت في دمك{|ِ} سكراً كثيراً بسرعة. {فاملأ|فاملئي} نصف طبقك{|ِ} خضاراً وفاكهة، و{اشرب|اشربي} الماء، و{اترك|اتركي} للحلوى مكاناً صغيراً أحياناً."},"history":[{"who":"جيمس ليند","origin":"إدنبرة، اسكتلندا","where_when":"السفينة سالزبري، 1747؛ «رسالة في الإسقربوط» 1753","did":"اختار اثني عشر بحاراً مرضى بالإسقربوط في مرحلة متشابهة، وأعطى كل اثنين علاجاً مختلفاً، فتحسن صاحبا البرتقال والليمون أسرع من الجميع.","did_not":"لم يعرف أن السبب نقص الفيتامين ج، ولم يقنع البحرية في حياته؛ وعُرف الفيتامين بعد ذلك بزمن طويل.","method_lesson":"أن نقارن بعدل بين مجموعات متشابهة لا تختلف إلا في العلاج.","source":["S9","S10"]}],"how_we_know":{"text":"كيف عرفنا أن نقص شيء في الطعام يُمرض؟ سنة 1747 كان البحارة يمرضون بالإسقربوط في الرحلات الطويلة: تنزف لثاتهم ويتعبون. فاختار الطبيب جيمس ليند على سفينته اثني عشر بحاراً مرضهم في المرحلة نفسها، وأعطى كل اثنين علاجاً مختلفاً: خلاً، أو ماء بحر، أو عصير تفاح مخمراً، أو غيرها، واثنين برتقالاً وليموناً. فتحسن صاحبا البرتقال والليمون أسرع من الجميع.","limit_question":"لماذا لا تكفي تجربة على اثني عشر بحاراً لنعرف كل ما يحتاجه الجسم من الطعام؟"},"what_changed":["كان الناس يظنون أن الإسقربوط من الهواء الرطب أو الكسل؛ ثم أظهرت المقارنة أنه من نقص في الطعام، وعُرف الفيتامين ج بعد ذلك بزمن طويل.","كانت النصيحة قديماً «كُل كثيراً لتقوى»؛ واليوم النصيحة التنوع والتوازن والإصغاء للشبع."],"model_limits":["الطبق المتوازن نموذج تقريبي: وجبة واحدة قد لا تكون متوازنة، والمهم طعام اليوم والأسبوع كله.","تقسيم الطعام إلى مجموعات يبسّط: البقول فيها بروتين ونشويات معاً، والحليب فيه بروتين ودهون وسكر وكالسيوم.","ملعقة السكر في التجربة تقريب: الأرقام على الملصق بالغرامات."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَـٰتِ مَا رَزَقْنَـٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ","reference":"البقرة 172","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} دعوة إلى الأكل من الطيبات التي رزقنا الله، وإلى شكره عليها. واليوم نتعلم كيف نختار من هذه الطيبات ما يحتاجه جسمنا: ألواناً كثيرة وطبقاً متوازناً. والآية لا تذكر البروتين ولا الفيتامينات، والعلم لا يشرح الآية؛ لكنها تعلّمنا أن الطعام نعمة نختار منها الطيب ونشكر عليها. كيف {تشكر|تشكرين} على طعامك{|ِ} اليوم؟","reviewed":false,"quran_key":"2:172","hl_words":[3,9],"highlight":"كلوا من طيبات ما رزقناكم واشكروا لله","level":"ترغيب","concept":"الطعام نعمة نختار منها الطيب ونشكر عليها.","avoid":"لا نقول إن الآية تحدد طبقاً متوازناً أو مواد غذائية بعينها، ولا نجعل العلم دليلاً عليها.","cards":[]},"closing":{"text":"كنت غلاماً في حَجر رسول الله ﷺ، وكانت يدي تطيش في الصَّحفة، فقال لي رسول الله ﷺ: «يا غلام، سمِّ الله، وكل بيمينك، وكل مما يليك». فما زالت تلك طِعمتي بعد","reference":"البخاري 5376؛ مسلم 2022","grade":"صحيح (متفق عليه)","usage":"قيمة","reflection":"عرفنا اليوم ماذا نأكل. والحديث في البطاقة يعلّمنا كيف نأكل: نسمّي الله، ونأكل باليمين، ومما يلينا من الطعام. وكان عمر بن أبي سلمة غلاماً صغيراً مثلك{|ِ}، فبقي يأكل هكذا طول حياته. والحديث لا يتكلم عن السكر ولا عن الطبق المتوازن؛ لكنه يعلّمنا أدب المائدة واحترام الطعام ومن يشاركنا فيه. أي أدب من آداب المائدة {ستحفظه|ستحفظينه} هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:5376","highlight":"سمِّ الله، وكل بيمينك، وكل مما يليك","level":"ترغيب","concept":"أدب المائدة: التسمية والأكل باليمين ومما يلينا.","avoid":"لا نربط الحديث بالتغذية علمياً، ولا نعيّر طفلاً يأكل بيده اليسرى لعذر.","lead":"عن عمر بن أبي سلمة رضي الله عنه قال:","narration":true,"source":"البخاري 5376؛ مسلم 2022","grader":"","cards":[]}},"life":[{"situation":"في الفسحة سخر زملائي من صديقي لأن علبة غدائه فيها فول وخضار، وقالوا: طعام قديم!","science":"الفول فيه بروتين ونشويات وألياف، والخضار فيها فيتامينات ومعادن؛ وطعام صديقي أقرب إلى الطبق المتوازن من كثير غيره.","action":"أقول لهم بلطف: هذا طعام مفيد ولذيذ، وكل بيت له طعامه؛ وأجلس مع صديقي، ولا أعيب طعام أحد.","value":"لا نعيب طعاماً، ونحترم ما يأكله غيرنا.","why":"لماذا لا أعيب طعاماً حتى لو لم يعجبني؟ لأن النبي ﷺ ما عاب طعاماً قط، كما في الحديث في البطاقة: إن اشتهاه أكله، وإن كرهه تركه.","hadith":["bukhari:5409"],"cards":[{"key":"bukhari:5409","lead":"عن أبي هريرة رضي الله عنه قال:","text":"ما عاب النبي ﷺ طعاماً قط، إن اشتهاه أكله، وإن كرهه تركه","narration":true,"source":"البخاري 5409","grade":"صحيح (متفق عليه)","grader":""}],"verses":[]},{"situation":"في البيت ثلاجة فيها مشروبات غازية وعصائر، وأنا أشرب منها كلما عطشت.","science":"في علبة مشروب محلى واحدة قد يكون حدّ السكر المضاف لليوم كله؛ والماء يروي العطش بلا سكر.","action":"أجعل الماء شرابي حين أعطش، والمشروب المحلى أحياناً وقليلاً؛ وأقرأ ملصقه مع أهلي.","value":"الاعتدال في الطعام والشراب.","why":"لماذا لا أشرب ما أحب كلما عطشت؟ لأن الإسراف في الأكل والشرب منهي عنه كما في الآية في البطاقة، والمشروب الحلو الكثير يُكثر السكر في يومي.","reference":"الأعراف 31","quran":["7:31"],"cards":[],"verses":["7:31"]}],"open_questions":[{"q":"لماذا يحب بعض الأطفال طعاماً يكرهه إخوتهم، مع أنهم في البيت نفسه؟","why_open":"للتذوق صلة بالوراثة وبما اعتاده الطفل وبحاسة الشم، والعلماء ما زالوا يدرسون كيف تجتمع هذه الأسباب."}],"notebook":{"draw":"{ارسم|ارسمي} دائرة طبق، و{قسّمها|قسّميها} نصفاً وربعين، و{ارسم|ارسمي} فيها طعاماً من بيتك{|ِ}، و{ارسم|ارسمي} بجانبها كوب ماء. المستوى ب: {ارسم|ارسمي} ملصقاً و{ضع|ضعي} دائرة حول حجم الحصة والسكر.","label":["المادة الغذائية","النشويات","البروتين","الدهون","الفيتامينات والمعادن","الطبق المتوازن","السكر المضاف","ملصق الغذاء","— ب: القيمة اليومية"],"write":"أشرح: لماذا لا يكفي طعام واحد؟ وأكتب طبقي المتوازن، وكم ملعقة سكر وجدت في مشروب قرأت ملصقه."},"imgs":["U06.L06-E1","U06.L06-E2","U06.L06-E3","U06.L06-E4","U06.L06-E5","U06.L06-E6","U06.L06-exp","U06.L06-hist1","U06.L06-letter","U06.L06-life","
