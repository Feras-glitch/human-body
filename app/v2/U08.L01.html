<script>
const LD = {"id":"U08.L01","first":true,"title":"الدماغ والأعصاب: شبكة الرسائل","driving_question":"{اسم}، لمست{|ِ} قدراً ساخناً فسحبت{|ِ} يدك{|ِ} قبل أن {تقول|تقولي} «آه». كيف عرفت يدك{|ِ} ما تفعل قبل أن {تفكر|تفكري}؟","central_fact":"الجهاز العصبي شبكة رسائل: الحواس ترسل إلى الدماغ عبر الأعصاب والحبل الشوكي، والدماغ يقرر ويأمر العضلات؛ والرسالة كهربائية سريعة تحتاج زمناً، وبعض الاستجابات منعكسات لا تنتظر القرار.","next":"U08.L02","nexts":[{"id":"U08.L02","gated":false},{"id":"U08.L03","gated":false},{"id":"U08.L04","gated":false},{"id":"U08.L05","gated":false},{"id":"U08.L06","gated":false},{"id":"U08.L07","gated":false}],"hook":{"text":"{اسم}، لمست{|ِ} قدراً ساخناً فسحبت{|ِ} يدك{|ِ} ثم أحسست{|ِ} بالحرارة. من أمر يدك{|ِ} أن تبتعد؟","options":["الدماغ فكّر بسرعة وقرر","اليد نفسها، لأنها أحسّت الحرارة","أمر وصل من مكان قبل الدماغ","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","skeleton"],"highlight":["brain","spinal_cord","nerves"],"zoom":"body"},"text":"في جسمك{|ِ} شبكة رسائل لا تهدأ ليلاً ولا نهاراً. في رأسك{|ِ}، داخل الجمجمة، الدماغ: مركز القيادة. ومن أسفله ينزل حبل طري داخل فقرات ظهرك{|ِ} إلى أسفل الظهر: الحبل الشوكي. ومنهما تخرج الأعصاب، خيوط رفيعة تتفرع حتى تصل كل جزء فيك{|ِ}: أطراف أصابعك{|ِ}، وجلدك{|ِ} كله، وعضلاتك{|ِ}، وقلبك{|ِ} وأمعاءك{|ِ}. الجمجمة تحمي الدماغ، والفقرات التي عددناها في درس الهيكل تحمي الحبل الشوكي. وانتبه{|ي}: الحبل الشوكي ليس نخاع العظم؛ النخاع داخل العظام يصنع الدم، والحبل الشوكي طريق الرسائل."},{"id":"E2","level":"A","atlas":{"layers":["nervous"],"highlight":["eye","brain","nerves","hand_muscles"],"zoom":"body","animate":"signal_path"},"text":"تخيّل{|ي} كرة قادمة نحوك{|ِ}. عينك{|ِ} تراها، فتنطلق رسالة في عصب إلى الدماغ. الدماغ يعرف أنها كرة ويقرر: أمسكها! فيرسل أمراً في عصب آخر إلى عضلات ذراعك{|ِ} ويدك{|ِ}، فتنقبض وتتحرك اليد. بعض الأعصاب يحمل الرسائل إلى الدماغ، وبعضها يحمل الأوامر منه. والرسالة في العصب إشارة كهربائية صغيرة سريعة جداً، لكنها ليست لحظية: تحتاج زمناً، ولو كان جزءاً صغيراً من الثانية."},{"id":"E3","level":"A","atlas":{"layers":["nervous"],"highlight":["hand","spinal_cord","arm_muscles"],"zoom":"arm_spine","animate":"reflex_arc"},"text":"لكن القدر الساخن مختلف! حين لمست{|ِ} يدُك{|ِ} الحرارة انطلقت رسالة إلى الحبل الشوكي، فردّ هو فوراً بأمر إلى عضلات الذراع: اسحبي اليد! ووصلت الرسالة إلى الدماغ بعد ذلك بقليل، فأحسست{|ِ} بالحرارة وقلت{|ِ} «آه». هذا هو المنعكس: استجابة سريعة بلا قرار، تحمينا قبل أن يكبر الأذى. ومن المنعكسات الرمش حين يقترب شيء من عينك{|ِ}، وارتفاع الساق حين يُضرب تحت الركبة ضربة خفيفة. أما مسك الكرة وكتابة اسمك{|ِ} واختيار الجواب فحركات {تقررها|تقررينها}."},{"id":"E4","level":"A","atlas":{"layers":["nervous"],"highlight":["brain_top","cerebellum","brainstem"],"zoom":"head"},"text":"للدماغ أجزاء لكل منها عمل. الجزء الأكبر المتجعّد في الأعلى تفكر{|ين} به وتتذكر{|ين} و{تتكلم|تتكلمين} و{تشعر|تشعرين}، وتصل إليه رسائل العين والأذن والجلد، ومنه تخرج أوامر الحركة التي {تقررها|تقررينها}. وفي الخلف تحته المخيخ: يحفظ توازنك{|ِ} ويجعل حركتك{|ِ} متناسقة حين {تركض|تركضين} أو {تكتب|تكتبين}. وفي الأسفل جذع الدماغ، متصلاً بالحبل الشوكي: يدير التنفس ونبض القلب والبلع وأنت{|ِ} لا تفكر{|ين} فيها، حتى وأنت{|ِ} {نائم|نائمة}. ويقول بعض الناس إننا نستعمل عُشر دماغنا فقط؛ وهذا غير صحيح: صور الدماغ الحديثة تُظهر أن أجزاءه كلها تعمل، كل جزء في المهمة التي يحتاجها. ولذلك نحميه: خوذة على الدراجة، وحزام في السيارة."},{"id":"E5","level":"B","atlas":{"layers":["cells"],"highlight":["neuron","gap"],"zoom":"neuron"},"text":"الأعصاب مبنية من خلايا خاصة: الخلية العصبية. لها جسم، وزوائد قصيرة كأغصان الشجرة تستقبل الرسالة، وذيل طويل يرسلها. وبين خلية والتي تليها فجوة صغيرة جداً، تطلق فيها الأولى مواد كيميائية فتلتقطها الثانية، فتكمل الرسالة طريقها. في دماغ الكبير نحو 86 مليار خلية عصبية. وبعض الخلايا العصبية يمتد ذيلها من أسفل الظهر حتى إصبع القدم! والأعصاب تختلف في سرعتها: أسرعها ينقل الرسالة نحو مئة متر في الثانية، وأبطؤها نحو متر واحد في الثانية، ولذلك {تحس|تحسين} أحياناً باللمسة قبل الألم."},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["left_brain","right_body"],"zoom":"body"},"text":"عجيبة أخرى: النصف الأيسر من الدماغ يحرّك الجانب الأيمن من الجسم، والنصف الأيمن يحرّك الأيسر، لأن كثيراً من الطرق تتقاطع في طريقها. والدماغ عند الكبير نحو كيلوغرام وثلث، أي نحو 2 في المئة من وزن الجسم، لكنه وهو في الراحة يستهلك نحو خُمس ما يستهلكه الجسم من الأكسجين والطاقة. تذكّر{|ي} وحدة الخلية: الخلايا تُطلق الطاقة من الغذاء بالأكسجين؛ والخلايا العصبية من أكثر خلايا الجسم حاجة إليها، ولذلك يحتاج الدماغ دماً لا ينقطع."}],"practice":[{"id":"U08.L01.P1","objective":"U08.L01.O1","type":"choose","prompt":"أين الحبل الشوكي؟","options":["داخل عظم الفخذ مع النخاع","في الصدر خلف القلب","في الذراعين بجانب العضلات","داخل فقرات الظهر"],"answer":3,"explanation":"الحبل الشوكي داخل فقرات العمود الفقري، من أسفل الدماغ إلى أسفل الظهر.","level":"A","feedback_wrong":"أين قلنا إن الفقرات تحمي شيئاً طرياً؟","feedback_by_option":{"0":"داخل العظم الطويل نخاع يصنع الدم؛ والحبل الشوكي داخل الفقرات.","1":"خلف القلب أوعية كبيرة والمريء؛ والحبل الشوكي داخل فقرات الظهر.","2":"في الذراعين أعصاب تخرج منه؛ أما هو فداخل فقرات الظهر."}},{"id":"U08.L01.P2","objective":"U08.L01.O2","type":"choose","prompt":"{رأيت|رأيتِ} صديق{ك|تكِ} {فلوّحت|فلوّحتِ} له. ما الذي حمل الأمر إلى عضلات ذراعك{|ِ}؟","options":["الدم القادم من القلب","عصب خارج من الدماغ والحبل الشوكي","العين نفسها","الهواء في الرئتين"],"answer":1,"explanation":"الدماغ يقرر، ثم يحمل عصب الأمر إلى عضلات الذراع فتنقبض.","level":"A","feedback_wrong":"من أين خرج الأمر، وفي أي خيط سار؟","feedback_by_option":{"0":"الدم يحمل الأكسجين والغذاء إلى العضلة؛ أما الأمر فيحمله عصب.","2":"العين أرسلت ما رأته إلى الدماغ؛ والأمر خرج من الدماغ في عصب.","3":"الهواء يعطي الدم الأكسجين؛ والأمر يحمله عصب."}},{"id":"U08.L01.P3","objective":"U08.L01.O3","type":"choose_reason","prompt":"أيّ هذه منعكس لا ننتظر فيه قراراً؟","options":["رمي الكرة إلى زميل","كتابة الاسم في الدفتر","الرمش حين تقترب ذبابة","اختيار لون القلم"],"answer":2,"explanation":"الرمش يحدث وحده بسرعة ليحمي العين؛ والبقية حركات نقررها.","level":"A","feedback_wrong":"أيّ هذه يحدث قبل أن {تفكر|تفكري}؟","feedback_by_option":{"0":"رمي الكرة نقرر متى وإلى من؛ هذا قرار.","1":"الكتابة نقررها ونتعلمها؛ ليست منعكساً.","3":"اختيار اللون قرار، ويأخذ وقتاً."},"detects":"M79"},{"id":"U08.L01.P4","objective":"U08.L01.O4","type":"choose","prompt":"{تمشي|تمشين} على خط مرسوم على الأرض دون أن {تقع|تقعي}. أيّ جزء في دماغك{|ِ} يعمل أكثر؟","options":["المخيخ","جذع الدماغ وحده","الحبل الشوكي وحده","لا شيء، القدمان وحدهما"],"answer":0,"explanation":"المخيخ يحفظ التوازن وتناسق الحركة.","level":"A","feedback_wrong":"أيّ جزء قلنا إنه للتوازن؟","feedback_by_option":{"1":"جذع الدماغ يدير التنفس والقلب؛ والتوازن للمخيخ.","2":"الحبل الشوكي ينقل الرسائل؛ والتوازن يحفظه المخيخ.","3":"القدمان تنفّذان، والأمر والتوازن من الدماغ."}},{"id":"U08.L01.P5","objective":"U08.L01.O5","type":"predict","prompt":"في عصب ينقل الرسالة 100 متر في الثانية، كم تأخذ رسالة من إصبع قدم الكبير إلى دماغه (نحو متر ونصف)؟","options":["نحو جزء من مئة من الثانية","نحو ثانية كاملة","نحو دقيقة","لا تأخذ أي زمن"],"answer":0,"explanation":"متر ونصف ÷ 100 متر في الثانية = 0.015 ثانية: جزء صغير من الثانية، لكنه ليس صفراً.","level":"B","feedback_wrong":"اقسم{|ي} المسافة على السرعة.","feedback_by_option":{"1":"ثانية كاملة تكفي لـ100 متر في هذا العصب، لا لمتر ونصف.","2":"أبطأ بكثير مما يحدث؛ احسب{|ي} المسافة على السرعة.","3":"سريعة جداً، لكن لكل رسالة زمن."},"detects":"M81"}],"check":[{"id":"U08.L01.C1","objective":"U08.L01.O1","type":"true_false_why","prompt":"«الأعصاب في اليدين والقدمين فقط، لأنهما ما نلمس به». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الأعصاب تصل كل جزء في الجسم: الجلد كله والعضلات والقلب والأمعاء والعينين.","level":"A","rubric":"R1"},{"id":"U08.L01.C2","objective":"U08.L01.O2","type":"explain_open","prompt":"اشرح{|ي} رحلة الرسالة حين {تسمع|تسمعين} من يناديك{|ِ} {فتلتفت|فتلتفتين} إليه.","answer":"الأذن تلتقط الصوت، فتنطلق رسالة في عصب إلى الدماغ، فيعرف الصوت ويقرر الالتفات، فيرسل أمراً في عصب إلى عضلات الرقبة فتنقبض ويلتفت الرأس.","level":"A","rubric":"R1"},{"id":"U08.L01.C3","objective":"U08.L01.O3","type":"true_false_why","prompt":"«نسحب اليد عن الحار بعد أن نحسّ الألم ونقرر». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ هذا منعكس: الحبل الشوكي يأمر العضلات بالسحب قبل أن تصل الرسالة إلى الدماغ ونحسّ الألم.","level":"A","rubric":"R1"},{"id":"U08.L01.C4","objective":"U08.L01.O4","type":"true_false_why","prompt":"«جذع الدماغ يدير التنفس ونبض القلب ونحن نائمون». صح أم خطأ؟ ولماذا؟","answer":"صح؛ هذه أعمال تلقائية لا نفكر فيها، يديرها جذع الدماغ ليلاً ونهاراً.","level":"A","rubric":"R1"},{"id":"U08.L01.C5","objective":"U08.L01.O4","type":"fix_model","prompt":"كتب زميل{ك|تكِ} تحت رسم الدماغ: «نستعمل عُشره فقط، والباقي احتياط نائم». {صحّح|صحّحي} العبارة.","answer":"نستعمل الدماغ كله: كل جزء يعمل في مهمته، وصور الدماغ تُظهر ذلك؛ ولا يوجد جزء نائم احتياطاً.","level":"A","rubric":"R1"},{"id":"U08.L01.C6","objective":"U08.L01.O5","type":"explain_open","prompt":"ارسم{|ي} خلية عصبية بالكلمات: ما أجزاؤها؟ وكيف تنتقل الرسالة إلى الخلية التالية؟","answer":"جسم، وزوائد قصيرة تستقبل، وذيل طويل يرسل؛ وعند نهاية الذيل فجوة صغيرة تعبرها الرسالة بمواد كيميائية إلى الخلية التالية.","level":"B","rubric":"R1"},{"id":"U08.L01.C7","objective":"U08.L01.O6","type":"explain_open","prompt":"في تجربة المسطرة: ما الذي يجب أن يبقى كما هو بين المسك البسيط والمسك بقرار، وما الذي نغيّره؟","answer":"تبقى المسطرة والشخص والشريك وطريقة الإفلات وعدد المحاولات وأخذ الرقم الأوسط كما هي؛ ونغيّر شيئاً واحداً: وجود القرار («الآن» أو «لا»).","level":"B","rubric":"R2"}],"concepts":[{"id":"brain","term":{"ar":"الدماغ","en":"Brain","zh":"脑","pinyin":"nǎo","match":["الدماغ","دماغ","دماغك","دماغي","دماغه","دماغها","دماغنا"]},"priority":"core","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"مركز القيادة في الجسم، داخل الجمجمة: يستقبل رسائل الحواس، ويفكر ويتذكر ويقرر، ويرسل الأوامر إلى العضلات، ويدير التنفس ونبض القلب بلا أن نفكر.","B":"يزن عند الكبير نحو كيلوغرام وثلث، أي نحو 2 في المئة من وزن الجسم، ويستهلك وهو في الراحة نحو خُمس ما يستهلكه الجسم من الأكسجين والطاقة؛ وفيه نحو 86 مليار خلية  ___","alternatives":["بلا طاولة عالية: اجلس{|ي} على كرسي و{ضع|ضعي} ساقاً فوق الأخرى، فتتدلى العليا حرة.","بلا شريك: يصفّق أحد أهلك{|ِ} بكفيه على بعد شبرين من وجهك{|ِ} بلا لمس، {فتلاحظ|فتلاحظين} أن عينيك{|ِ} ترمشان قبل أن {تقرر|تقرري}."]},"find_the_error":[{"id":"FE1","atlas_variant":"marrow_label","error":"سهم على العمود الفقري مكتوب عليه: نخاع العظم يصنع الدم هنا","answer":"داخل الفقرات الحبل الشوكي، طريق الرسائل؛ ونخاع العظم الذي يصنع الدم داخل العظام","detects":"M41"},{"id":"FE2","atlas_variant":"brain_reflex","error":"طريق سحب اليد عن الحار مرسوم يصعد إلى الدماغ أولاً ثم ينزل إلى اليد","answer":"في المنعكس يردّ الحبل الشوكي مباشرة، والرسالة تصل إلى الدماغ بعد ذلك","detects":"M79"},{"id":"FE3","atlas_variant":"ten_percent","error":"رسم دماغ عُشره ملوّن وتحته: الجزء الذي نستعمله","answer":"نستعمل الدماغ كله؛ كل جزء يعمل في مهمته","detects":"M78"}],"numbers":[{"text":"في دماغك{|ِ} عشرات المليارات من الخلايا العصبية: نحو 86 ملياراً عند الكبير، أكثر من عشرة أضعاف عدد الناس على الأرض.","source":["S3"]},{"text":"الدماغ نحو 2 في المئة من وزن الجسم، لكنه وأنت{|ِ} {جالس|جالسة} يستهلك نحو خُمس ما {تتنفسه|تتنفسينه} من أكسجين.","source":["S4"]},{"text":"أسرع الأعصاب ينقل الرسالة أسرع من سيارة على طريق سريع بثلاث مرات أو أكثر: نحو مئة متر في الثانية.","source":["S5"]}],"true_size":[{"text":"ضع{|ي} قبضتيك{|ِ} متلاصقتين: هذا تقريباً حجم دماغ الكبير، ووزنه كوزن ست حبات تفاح متوسطة.","source":["S1"]}],"animal":{"text":"للأخطبوط نحو 500 مليون خلية عصبية، وأكثر من نصفها ليس في رأسه بل في أذرعه الثمانية! لذلك تستطيع الذراع أن تتحسس وتتذوق وتمسك بشيء دون أن ينتظر كل حركة أمرٌ من الرأس. أما نحن فأكثر خلايانا العصبية في الدماغ.","source":["S9"]},"organ_letter":{"from":"عصب في إصبعك{|ِ}","text":"مرحباً، أنا عصب صغير في طرف إصبعك{|ِ}. أنا خيط رفيع جداً، لكني أطول مما {تظن|تظنين}: أمتد من إصبعك{|ِ} حتى الحبل الشوكي في ظهرك{|ِ}. حين {تلمس|تلمسين} شيئاً ناعماً أرسل الخبر إلى الدماغ فيعرف النعومة، وحين {تلمس|تلمسين} شيئاً حاراً أسبق الدماغ: أخبر الحبل الشوكي فيسحب يدك{|ِ} فوراً، ثم يصل الخبر إلى الدماغ فتقول{|ين} «آه». لا {تغضب|تغضبي} مني إن تأخر إحساسك{|ِ} بالألم جزءاً من الثانية؛ كنت مشغولاً بحمايتك{|ِ}. احمِ{|ي} يدك{|ِ} من الجروح والحروق، وأنا أحرسها ليلاً ونهاراً."},"history":[{"who":"هرمان فون هلمهولتز","origin":"ألمانيا","where_when":"كونيغسبرغ (مختبره)، وأرسل تقريريه إلى برلين في يناير وديسمبر 1850","did":"قاس زمن الرسالة في عصب ضفدع: نبّه العصب من موضعين وقاس متى تنقبض العضلة، فوجد سرعة عشرات الأمتار في الثانية؛ ثم قدّرها في أعصاب الإنسان الحسية بقياس زمن رد الفعل بعد تنبيه الجلد.","did_not":"لم يعرف كيف تسري الرسالة في العصب، ولا أن الأعصاب تختلف في سرعتها كثيراً؛ عرف العلماء ذلك بعده.","method_lesson":"ما لا تراه العين قد يُقاس بالزمن والمسافة.","source":["S8"]},{"who":"سانتياغو رامون إي كاخال","origin":"إسبانيا","where_when":"إسبانيا، بدأ عمله بالصبغة سنة 1887، ونال نوبل سنة 1906 (1852–1934)","did":"صبغ الخلايا العصبية بطريقة الفضة التي اكتشفها الإيطالي غولجي، ونظر إليها بالمجهر ورسم آلاف الرسوم الدقيقة، وقال إن كل خلية عصبية وحدة مستقلة، والرسالة تنتقل من خلية إلى أخرى في موضع لقائهما.","did_not":"لم يرَ الفجوة بين الخليتين نفسها؛ رآها العلماء بالمجهر الإلكتروني بعد موته. واقتسم الجائزة مع غولجي الذي كان يرى أن الخلايا شبكة متصلة.","method_lesson":"الرسم الدقيق لما نراه دليل، والعالمان المختلفان قد يُكرَّمان معاً.","source":["S7"]}],"how_we_know":{"text":"كيف عرف العلماء أن الرسالة في العصب ليست لحظية؟ ظنّ كثيرون قديماً أنها أسرع من أن تُقاس. وفي عام 1850 قاسها العالم الألماني هلمهولتز: نبّه عصب ضفدع عند موضعين، قريب من العضلة وبعيد عنها، وقاس متى تنقبض العضلة في كل مرة. الفرق في الزمن مع الفرق في المسافة أعطاه السرعة: عشرات الأمتار في الثانية. ثم قاس في الناس: لمس الجلد في مواضع مختلفة، وقاس متى يحرك الشخص يده. وبعده بنحو أربعين سنة نظر الإسباني كاخال بالمجهر في خلايا عصبية صُبغت بالفضة، ورسم آلاف الرسوم، فقال إن كل خلية منفصلة، وإن الرسالة تعبر بينها في موضع لقائهما.","limit_question":"ما الذي لا يُظهره رسم الأعصاب خطوطاً صفراء قليلة؟"},"what_changed":["كان يُظن أن الرسالة في العصب لحظية لا تُقاس؛ ثم قاسها هلمهولتز عام 1850.","اختلف العلماء: هل الخلايا العصبية شبكة واحدة متصلة أم خلايا منفصلة؟ رسوم كاخال رجّحت الانفصال، وأكدته المجاهر الإلكترونية بعد ذلك.","يتكرر أننا نستعمل عُشر الدماغ؛ وصور الدماغ الحديثة تُظهر أن أجزاءه كلها تعمل."],"model_limits":["الرسم يُظهر أعصاباً قليلة كخطوط؛ في الجسم آلاف الأعصاب تتفرع في كل مكان.","الأعصاب في الرسم ملوّنة بالأصفر لتُرى؛ في الجسم بيضاء مائلة إلى الصفرة.","«الدماغ يقرر» في الرسم سهم واحد؛ في الحقيقة تعمل مناطق كثيرة معاً.","الخلية العصبية في الرسم مكبّرة آلاف المرات، وذيلها في الحقيقة أطول بكثير من أن يُرسم."],"faith":{"opening":{"text":"وَٱللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَـٰتِكُمْ لَا تَعْلَمُونَ شَيْـًۭٔا وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَـٰرَ وَٱلْأَفْـِٔدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ","reference":"النحل 78","grade":"قرآن","usage":"تفكر","reflection":"وُلد كل واحد منا لا يعرف اسمه ولا اسم أمه، ثم صار يسمع ويرى ويفهم ويتعلم. والآية التي أمامك{|ِ} تذكّرنا بأن الله أخرجنا من بطون أمهاتنا لا نعلم شيئاً، وجعل لنا وسائل العلم، لعلنا نشكر. واليوم ننظر نظرة علم في شيء مما نتعلم به: الدماغ والأعصاب التي تحمل إليه ما {تسمعه|تسمعينه} و{تراه|ترينه}. والآية لا تصف الدماغ ولا الأعصاب، والعلم لا يشرح الآية؛ لكن من عرف كم رسالة تسري فيه كل لحظة عرف قدر النعمة. ماذا تعلّمت{|ِ} هذا الأسبوع لم تكن{|ي} تعرفه؟","reviewed":false,"quran_key":"16:78","hl_words":[8,14],"highlight":"وجعل لكم السمع والأبصار والأفئدة لعلكم تشكرون","level":"تفكر","concept":"وُلدنا لا نعلم شيئاً، ووسائل العلم نعمة تستحق الشكر.","avoid":"لا نقول إن «الأفئدة» هي الدماغ، ولا إن الآية تصف الأعصاب أو الحواس تشريحياً؛ هي تذكير بنعمة العلم ووسائله ودعوة إلى الشكر.","cards":[]},"closing":null},"life":[{"situation":"ضُرب رأسي بالكرة في الملعب، وبعدها أحسست بصداع ودوار، لكني أريد أن أكمل اللعب.","science":"الدماغ طري داخل الجمجمة، والضربة القوية قد تهزّه فتؤذيه حتى لو لم يظهر جرح؛ ومن علامات ذلك الصداع والدوار والتعب والضيق والغثيان. والدماغ يحتاج وقتاً ليشفى.","action":"أتوقف عن اللعب، وأخبر المعلم أو أهلي فوراً بما حدث وبما أحسّ به، ولا أخفي الصداع لأكمل المباراة. وألبس الخوذة دائماً على الدراجة.","value":"حفظ النفس: الجسد أمانة، ولا نضرّ أنفسنا ولا غيرنا.","why":"لماذا أتوقف وأنا أشعر أني بخير تقريباً؟ لأن إصابة الدماغ قد لا تُرى، والضربة الثانية قبل أن يشفى أخطر من الأولى. والنبي ﷺ نهى عن الضرر وعن مقابلة الضرر بالضرر، كما في البطاقة؛ ومن الضرر أن يؤذي المرء نفسه ليكمل لعبة.","reference":"ابن ماجه 2341","hadith":["ibnmajah:2341"],"cards":[{"key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","text":"لا ضرر ولا ضرار","narration":false,"source":"ابن ماجه 2341","grade":"حسن","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني"}],"verses":[]},{"situation":"سقط زميلي في الصف فجأة، وصار جسمه يرتجف ارتجافاً شديداً، وبعض الأولاد يضحكون ويصوّرون.","science":"قد تكون هذه نوبة: اضطراب قصير في رسائل الدماغ يجعل العضلات ترتجف بلا قرار من صاحبها، وتنتهي غالباً خلال دقائق. لا ذنب له فيها، ولا تُعدي.","action":"أنادي المعلم فوراً، وأبعد عنه الكراسي والأشياء الصلبة، ولا أضع شيئاً في فمه ولا أمسكه بقوة، وأنظر إلى الساعة كم تدوم. ولا أضحك ولا أصوّر، وأطلب من غيري ألا يفعل.","value":"نصرة الأخ وستره وعدم خذلانه أو احتقاره.","why":"لماذا لا نضع شيئاً في فمه، ولماذا نحسب الوقت؟ لأن ما يوضع في الفم قد يؤذيه، ولأن الكبار يحتاجون أن يعرفوا كم دامت النوبة؛ فإن طالت أكثر من خمس دقائق طلبوا الإسعاف. والنبي ﷺ جعل المسلم أخاً للمسلم لا يظلمه ولا يخذله ولا يحقره، كما في البطاقة؛ والضحك منه وتصويره وهو لا يملك جسده احتقار وخذلان.","reference":"مسلم 2564","hadith":["muslim:2564/akhu"],"cards":[{"key":"muslim:2564/akhu","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"«لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً، المسلم أخو المسلم: لا يظلمه، ولا يخذله، ولا يحقره، التقوى ها هنا» ويشير إلى صدره ثلاث مرات، «بحسب امرئ من الشر أن يحقر أخاه المسلم، كل المسلم على المسلم حرام: دمه، وماله، وعرضه»","narration":true,"source":"مسلم 2564","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كيف تصير رسائل كهربائية في الدماغ شعوراً {تحسه|تحسينه}: ألماً أو فرحاً أو لوناً أحمر؟","why_open":"يعرف العلماء أين تنشط الخلايا العصبية ومتى، لكن كيف يصير نشاطها إحساساً نعيشه سؤال كبير لم يُجب عنه بعد."}],"notebook":{"draw":"ارسم{|ي} جسمك{|ِ} من الأمام بخطوط بسيطة: دائرة الدماغ في الرأس، وخطاً من أسفله ينزل في وسط الظهر للحبل الشوكي، وخيوطاً صفراء تتفرع منه إلى اليدين والقدمين. ثم ارسم{|ي} بلون آخر طريق المنعكس من اليد إلى الحبل الشوكي ثم إلى عضلة الذراع، وطريق القرار من العين إلى الدماغ ثم إلى اليد. المستوى ب: ارسم{|ي} خلية عصبية بزوائدها وذيلها، وفجوة بينها وبين خلية أخرى.","label":["الدماغ","الحبل الشوكي","الأعصاب","طريق المنعكس","طريق القرار","المخيخ","جذع الدماغ","— ب: الخلية العصبية والفجوة"],"write":"أشرح: لماذا أسحب يدي عن الحار قبل أن أحسّ الألم؟ وما الفرق بين المنعكس والحركة التي أقررها؟ وأكتب أرقامي في تجربة المسطرة."},"imgs":["U08.L01-E1","U08.L01-E2","U08.L01-E3","U08.L01-E4","U08.L01-E5","U08.L01-E6","U08.L01-exp","U08.L01-hist1","U08.L01-hist2","U08.L01-letter","U08.L01-life","U08.L01-title-boy","U08.L01-title-girl"]};
