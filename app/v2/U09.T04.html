<script>
const LD = {"id":"U09.T04","lesson":"U09.L04","first":false,"title":"اختبار: اللقاحات، وقضية الوحدة: كيف نحمي من لا يستطيع حماية نفسه؟","lessonTitle":"اللقاحات، وقضية الوحدة: كيف نحمي من لا يستطيع حماية نفسه؟","concepts":[],"check":[],"items":[{"id":"U09.L04.A1.a","objective":"U09.L04.O1","level":"A","type":"choose_reason","prompt":"ما في اللقاح؟","options":["المرض نفسه بقوته الكاملة","جزء من الميكروب أو نسخة ضعيفة أو غير نشطة منه","فيتامينات تقوّي العضلات","خلايا دم من إنسان آخر"],"answer":1,"explanation":"جزء أو نسخة ضعيفة أو غير نشطة، لا تسبب المرض، فيتدرب الجسم.","feedback_by_option":{"0":"لا يسبب المرض؛ هذا معنى «ضعيفة أو غير نشطة».","2":"ليس فيتامينات.","3":"ليس دماً."},"detects":"M104","alt":{"prompt":"بعد اللقاح يصنع الجسم:","options":["أجساماً مضادة وذاكرة","عظاماً جديدة","ميلانين أكثر","عرقاً كثيراً"],"answer":0,"explanation":"يتدرب الدفاع المتخصص فيصنع أجساماً مضادة ويتذكر.","feedback_by_option":{"1":"العظام لا علاقة لها باللقاح.","2":"الميلانين للون الجلد.","3":"العرق للتبريد."}}},{"id":"U09.L04.A1.b","objective":"U09.L04.O1","level":"A","type":"true_false_why","prompt":"«بعض اللقاحات تحتاج أكثر من جرعة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لتبقى الأجسام المضادة والذاكرة قوية وقتاً طويلاً.","rubric":"R1","alt":{"prompt":"«من أخذ اللقاح يحتاج أياماً ليعرف الميكروب حين يلقاه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الذاكرة تجعله يعرفه بسرعة ويصنع الأجسام المضادة فوراً، فلا يمرض غالباً."}},{"id":"U09.L04.A1.c","objective":"U09.L04.O1","level":"A","type":"explain_open","prompt":"شبّه طفل اللقاح بتدريب الفريق على طريقة لعب الخصم قبل المباراة. {وضّح|وضّحي} التشبيه.","answer":"اللقاح يُري الجسم صورة الميكروب بلا مرض، فيتدرب ويصنع أجساماً مضادة وذاكرة؛ فإذا جاء الميكروب الحقيقي عرفه وردّ بسرعة، كالفريق الذي تدرب.","rubric":"R1"},{"id":"U09.L04.A2.a","objective":"U09.L04.O2","level":"A","type":"choose_reason","prompt":"قال ولد: «أنا قوي، ولقاحي يحميني أنا فقط». ما الصواب؟","options":["صدق، لا علاقة لغيره به","أخطأ؛ لقاحه يقطع الطريق على الميكروب إلى من لا يستطيع التلقح","صدق، فالأقوياء لا يمرضون أبداً","أخطأ؛ لقاحه يمرض غيره"],"answer":1,"explanation":"الحماية الجماعية: الملقّحون يحمون الضعفاء من حولهم.","feedback_by_option":{"0":"لقاحه يحمي من حوله أيضاً.","2":"المرض يصيب الأقوياء أيضاً.","3":"اللقاح لا يمرض أحداً."},"detects":"M105","alt":{"prompt":"من الذي تحميه الحماية الجماعية خاصة؟","options":["من لا يستطيع التلقح لضعف مناعته أو حساسيته","الأطباء فقط","من لا يغسل يديه","الحيوانات الأليفة"],"answer":0,"explanation":"من ضعفت مناعته أو عنده حساسية شديدة يُحمى بالملقّحين حوله.","feedback_by_option":{"1":"تحمي غير الأطباء أيضاً.","2":"الغسل مهم للجميع.","3":"الكلام عن الناس."}}},{"id":"U09.L04.A2.b","objective":"U09.L04.O2","level":"A","type":"true_false_why","prompt":"«الحماية الجماعية تحمي من لا يستطيع التلقح حماية كاملة لا خطر بعدها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تقلّل الخطر كثيراً لكنها ليست كاملة، فنستمر في غسل الأيدي والعطاس في المرفق.","rubric":"R1","alt":{"prompt":"«المرض المعدي يحتاج طريقاً من شخص إلى شخص». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ولذلك حين يتلقح أكثر الناس ينقطع الطريق."}},{"id":"U09.L04.A2.c","objective":"U09.L04.O2","level":"A","type":"explain_open","prompt":"في لعبة الانتشار مرض العشرون كلهم في الجولة الأولى، وقليلون في الثانية. {فسّر|فسّري} الفرق.","answer":"في الثانية كان أكثر الأشخاص ملقّحين لا يمرضون ولا ينقلون، فانقطع طريق المرض وتوقف عند أول ملقّح.","rubric":"R1"},{"id":"U09.L04.A3.a","objective":"U09.L04.O3","level":"A","type":"choose","prompt":"أول مرض قُضي عليه في العالم كله باللقاح:","options":["الزكام","الجدري","التسوس","حرق الشمس"],"answer":1,"explanation":"أُعلن القضاء على الجدري سنة 1980.","feedback_by_option":{"0":"الزكام ما زال يصيب الناس.","2":"التسوس من بكتيريا والسكر، ولا لقاح له.","3":"حرق الشمس ليس مرضاً معدياً."},"alt":{"prompt":"في أيّ سنة أُعلن القضاء على الجدري؟","options":["1796","1868","1980","2023"],"answer":2,"explanation":"1796 تجربة جينر، و1980 إعلان القضاء.","feedback_by_option":{"0":"سنة تجربة جينر.","1":"سنة فوندرليش ورقم 37.","3":"سنة دراسة الحرارة الحديثة."}}},{"id":"U09.L04.A3.b","objective":"U09.L04.O3","level":"A","type":"choose_reason","prompt":"ماذا فعل الرازي في قصة الجدري؟","options":["صنع أول لقاح","كتب أول وصف سريري دقيق للجدري والحصبة وعلاماتهما","أعلن القضاء على الجدري","اكتشف الفيروس بالمجهر"],"answer":1,"explanation":"وصف المرضين بعلاماتهما في «رسالة في الجدري والحصبة».","feedback_by_option":{"0":"اللقاح جاء بعده بنحو تسعة قرون مع جينر.","2":"أعلنته منظمة الصحة العالمية سنة 1980.","3":"لم يكن في زمنه مجهر."},"alt":{"prompt":"ماذا فعل جينر سنة 1796؟","options":["جرّب جدري البقر على طفل فحماه من الجدري","وصف الحصبة أول مرة","قاس حرارة مليون إنسان","غسل أيدي الأطباء"],"answer":0,"explanation":"لقّح جيمس فيبس بجدري البقر ثم عرّضه للجدري فلم يمرض.","feedback_by_option":{"1":"هذا من عمل الرازي قبله بقرون.","2":"هذا فوندرليش.","3":"هذا زيملفايس."}}},{"id":"U09.L04.A3.c","objective":"U09.L04.O3","level":"A","type":"true_false_why","prompt":"«منع لقاح الحصبة نحو 60 مليون وفاة بين 2000 و2023». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كانت الحصبة تقتل نحو 2.6 مليون كل عام قبل لقاحها، والتلقيح منع نحو 60 مليون وفاة في تلك السنين.","rubric":"R1","alt":{"prompt":"«الجدري كان مرضاً خفيفاً لا يقتل أحداً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قتل مئات الملايين، وواحداً على الأقل من كل ثلاثة أصيبوا به."}},{"id":"U09.L04.A4.a","objective":"U09.L04.O4","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} إسعاف حرق صغير بماء ساخن.","options":["أبعد المصاب عن الحرارة وأنادي الكبار","أضع الحرق تحت ماء جارٍ بارد 20 دقيقة","أنزع الخاتم أو الكم القريب إن لم يلتصق","أغطيه بغلاف شفاف يوضع ولا يُلفّ"],"answer":[0,1,2,3],"explanation":"بعيداً عن الحرارة، ثم ماء جارٍ بارد 20 دقيقة، ثم ما قرب الحرق، ثم غطاء خفيف.","alt":{"prompt":"{رتّب|رتّبي} إسعاف جرح ينزف.","options":["أغسل يديّ إن استطعت","أضغط على الجرح بقماش نظيف","أستمر في الضغط وأنادي الكبار","إن لم يتوقف بعد عشر دقائق نطلب الإسعاف"],"answer":[0,1,2,3],"explanation":"يد نظيفة، فضغط مباشر، فاستمرار مع الكبار، ثم الإسعاف إن لم يتوقف."}},{"id":"U09.L04.A4.b","objective":"U09.L04.O4","level":"A","type":"choose","prompt":"أيّ هذه لا يوضع على الحرق؟","options":["ماء جارٍ بارد","غلاف شفاف خفيف بعد التبريد","الزبدة أو المعجون","لا شيء مما سبق"],"answer":2,"explanation":"لا زبدة ولا معجون ولا كريم ولا زيت.","feedback_by_option":{"0":"الماء الجاري البارد هو الإسعاف.","1":"يوضع بعد التبريد دون لفّ.","3":"الزبدة والمعجون لا يوضعان."},"detects":"M106","alt":{"prompt":"كم دقيقة نضع الحرق تحت الماء الجاري البارد؟","options":["دقيقة واحدة","20 دقيقة","ساعتين","لا نضعه تحت الماء"],"answer":1,"explanation":"20 دقيقة في أسرع وقت.","feedback_by_option":{"0":"قليل جداً.","2":"أكثر من اللازم.","3":"الماء الجاري البارد هو الإسعاف."}}},{"id":"U09.L04.A4.c","objective":"U09.L04.O4","level":"A","type":"explain_open","prompt":"غاب زميلك{|ِ} بالحصبة أسبوعين وعاد بإذن الطبيب، وبعض الأولاد يسخرون منه. ماذا {تفعل|تفعلين}؟ ولماذا؟","answer":"أستقبله وأجلس معه وأساعده فيما فاته، وأقول للأولاد إن المرض يصيب الجميع ولا عيب فيه؛ لأن الرعاية بلا لوم من حماية الضعيف، والسخرية تؤذيه.","rubric":"R1"},{"id":"U09.L04.A5.a","objective":"U09.L04.O5","level":"B","type":"choose","prompt":"أيّ هذه ليس من أنواع اللقاحات؟","options":["ميكروب حي ضعيف","ميكروب غير نشط","جزء من الميكروب","مضاد حيوي يقتل البكتيريا"],"answer":3,"explanation":"المضاد الحيوي دواء، لا لقاح.","feedback_by_option":{"0":"هذا نوع من اللقاحات.","1":"هذا نوع من اللقاحات.","2":"هذا نوع من اللقاحات."},"alt":{"prompt":"بعض اللقاحات الأحدث فيها:","options":["تعليمات تجعل خلايانا تصنع جزءاً من الميكروب فترة قصيرة","دم من إنسان مريض","مضاد حيوي قوي","فيتامين د"],"answer":0,"explanation":"فيتعرف الجسم على ذلك الجزء ويصنع أجساماً مضادة.","feedback_by_option":{"1":"لا دم فيها.","2":"المضاد الحيوي دواء آخر.","3":"ليست فيتامينات."}}},{"id":"U09.L04.A5.b","objective":"U09.L04.O5","level":"B","type":"true_false_why","prompt":"«أكثر الآثار الجانبية للقاحات خفيف يزول في أيام». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كألم في الذراع أو حرارة قليلة، والتفاعلات الخطيرة نادرة جداً وتُراقب باستمرار.","rubric":"R1","alt":{"prompt":"«النسبة اللازمة من الملقّحين واحدة لكل الأمراض». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تختلف من مرض إلى آخر، وتكون أعلى في الأمراض التي تنتقل بسهولة كبيرة."}},{"id":"U09.L04.A5.c","objective":"U09.L04.O5","level":"B","type":"explain_open","prompt":"لماذا يحتاج المرض الذي ينتقل بسهولة كبيرة نسبة أعلى من الملقّحين لتعمل الحماية الجماعية؟","answer":"لأن كل مريض يعدي كثيرين، فيجد المرض طرقاً كثيرة؛ ولا ينقطع إلا إذا كان أكثر الناس ملقّحين.","rubric":"R1"}],"transfer":[{"id":"U09.L04.T1","objective":"U09.L04.O2","type":"explain_open","prompt":"في مدرسة تلقح فيها قليل من الأطفال ظهرت الحصبة، وأصابت طفلاً رضيعاً لأخ أحدهم. {فسّر|فسّري} ما حدث بما {تعلّمته|تعلّمتِه} عن الحماية الجماعية، و{اقترح|اقترحي} ما يحمي الرضّع.","answer":"قلة الملقّحين تركت طرقاً كثيرة للمرض، فوصل إلى البيت والرضيع الذي لا يستطيع أن يحمي نفسه؛ ويحميهم أن يتلقح أكثر من حولهم كما يقرر الأطباء، مع غسل الأيدي والعطاس في المرفق.","level":"A","rubric":"R1"},{"id":"U09.L04.T2","objective":"U09.L04.O5","type":"explain_open","prompt":"قال شخص: «سمعت عن طفل أصابه أثر شديد بعد لقاح، فاللقاحات كلها خطيرة». كيف {تناقشه|تناقشينه} بالعلم بأدب؟","answer":"الآثار الشديدة ممكنة لكنها نادرة جداً وتُراقب باستمرار، وأكثر الآثار خفيف؛ ونقارنها بخطر المرض نفسه كالجدري والحصبة التي قتلت الملايين؛ والطبيب يقرر لكل طفل ما يناسبه.","level":"B","rubric":"R1"}],"recall":[{"id":"U09.L04.D1","objective":"U09.L04.O1","type":"choose","prompt":"اللقاح:","options":["يعطي المرض نفسه","يدرّب الجسم بلا مرض","يقتل كل الميكروبات في الجسم إلى الأبد"],"answer":1,"explanation":"أجسام مضادة وذاكرة بلا مرض.","level":"A","feedback_by_option":{"0":"لا يسبب المرض.","2":"يدرّب على ميكروب بعينه."}},{"id":"U09.L04.D2","objective":"U09.L04.O2","type":"choose","prompt":"لقاحي يحمي:","options":["أنا فقط، ولا علاقة لغيري به","أنا ومن حولي","لا أحد"],"answer":1,"explanation":"الحماية الجماعية.","level":"A","feedback_by_option":{"0":"يحمي من حولك أيضاً.","2":"يحمي كثيرين."}},{"id":"U09.L04.D3","objective":"U09.L04.O3","type":"choose","prompt":"قُضي على الجدري سنة:","options":["1796","1980","2020"],"answer":1,"explanation":"1796 جينر، و1980 القضاء.","level":"A","feedback_by_option":{"0":"سنة تجربة جينر.","2":"قبلها بأربعين سنة."}},{"id":"U09.L04.D4","objective":"U09.L04.O4","type":"choose","prompt":"الحرق الصغير:","options":["زبدة","ماء جارٍ بارد 20 دقيقة","نفقأ الفقاعات ونتركه مكشوفاً ليجف"],"answer":1,"explanation":"وطلب الكبار.","level":"A","feedback_by_option":{"0":"لا زبدة.","2":"لا تُفقأ."}},{"id":"U09.L04.D5","objective":"U09.L04.O3","type":"choose","prompt":"الرازي:","options":["وصف الجدري والحصبة","صنع أول لقاح ضد الجدري في العالم","اكتشف الفيروس"],"answer":0,"explanation":"أول وصف سريري لهما.","level":"A","feedback_by_option":{"1":"اللقاح مع جينر.","2":"لم يكن عنده مجهر."}},{"id":"U09.L04.D6","objective":"U09.L04.O5","type":"choose","prompt":"الآثار الخطيرة للقاحات:","options":["شائعة تصيب أكثر من يتلقح","نادرة جداً وتُراقب","لا تُراقب"],"answer":1,"explanation":"وأكثر الآثار خفيف يزول في أيام.","level":"B","feedback_by_option":{"0":"الخطيرة نادرة جداً.","2":"تُراقب باستمرار."}}]};
