<script>
const LD = {"id":"U07.T03","lesson":"U07.L03","first":false,"title":"اختبار: الماء في جسمي: الميزان والعطش","lessonTitle":"الماء في جسمي: الميزان والعطش","concepts":[],"check":[],"items":[{"id":"U07.L03.A1.a","objective":"U07.L03.O1","level":"A","type":"choose","prompt":"أين أكثر الماء في جسمك{|ِ}؟","options":["داخل الخلايا","في المعدة بعد الشرب","في المثانة قبل الحمام","في العظام والأسنان"],"answer":0,"explanation":"أكثر ماء الجسم داخل الخلايا نفسها، والباقي في الدم وبين الخلايا.","feedback_by_option":{"1":"في المعدة ماء قليل يمرّ؛ أكثره داخل الخلايا.","2":"في المثانة بول ينتظر الخروج؛ وأكثر ماء الجسم داخل الخلايا.","3":"في العظام ماء قليل؛ أكثره داخل الخلايا."},"alt":{"prompt":"عند من تكون نسبة الماء في الجسم أكبر؟","options":["عند الكبير","عند الرضيع","متساوية عند الجميع","عند من يشرب أكثر وحده"],"answer":1,"explanation":"نحو ثلاثة أرباع وزن الرضيع ماء، ونحو النصف أو أكثر قليلاً عند الكبير.","feedback_by_option":{"0":"عند الكبير نحو النصف؛ وعند الرضيع أكثر.","2":"النسبة تختلف بالعمر؛ أكبرها عند الرضيع.","3":"الزائد من الشرب تُخرجه الكليتان؛ النسبة تختلف بالعمر."}}},{"id":"U07.L03.A1.b","objective":"U07.L03.O1","level":"A","type":"true_false_why","prompt":"«الجسم يخزّن الماء الزائد لوقت الحاجة، فيكفي أن نشرب كثيراً مرة واحدة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الكليتان تُخرجان الزائد خلال ساعات، فنحتاج ماءً جديداً كل يوم ونشرب على مراحل.","rubric":"R1","detects":"M77","alt":{"prompt":"«نحو نصف وزن الكبير أو أكثر ماء». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو 50 إلى 60 في المئة عند الكبير، ونحو 75 في المئة عند الرضيع."}},{"id":"U07.L03.A1.c","objective":"U07.L03.O1","level":"A","type":"explain_open","prompt":"اذكر{|ي} عملين يقوم بهما الماء في جسمك{|ِ}.","answer":"يحمل الغذاء والأكسجين في الدم، ويحمل الفضلات إلى الكليتين، ويبرّد الجسم بالعرق، ويملأ الخلايا لتعمل.","rubric":"R1"},{"id":"U07.L03.A2.a","objective":"U07.L03.O2","level":"A","type":"choose_reason","prompt":"أيّ قائمة فيها كل الطرق التي يخرج منها الماء؟","options":["البول وحده لأنه ما نراه يخرج كل يوم","البول والعرق في الأيام الحارة","البول والعرق والنفَس والجلد والبراز","العرق والدموع حين نلعب أو نبكي"],"answer":2,"explanation":"يخرج الماء بالبول والعرق، ومع النفَس، ومن الجلد بلا عرق ظاهر، وفي البراز.","feedback_by_option":{"0":"البول أكبر الطرق، لكنه ليس الوحيد؛ وبعض الطرق لا نراه.","1":"نسيت{|ِ} النفَس والجلد والبراز؛ وهي تُخرج الماء كل يوم لا في الحر وحده.","3":"نسيت{|ِ} البول، وهو أكبر الطرق."},"detects":"M75","alt":{"prompt":"{نفخت|نفختِ} على مرآة باردة فصارت ضبابية. ماذا يعني هذا؟","options":["في النفَس بخار ماء يخرج من الجسم","كانت المرآة متسخة","في النفَس دخان","المرآة صنعت الماء"],"answer":0,"explanation":"في كل زفير بخار ماء لا نراه، فإذا لامس المرآة الباردة صار قطرات صغيرة.","feedback_by_option":{"1":"الضباب يظهر على المرآة النظيفة أيضاً؛ إنه ماء النفَس.","2":"لا دخان في نفَسنا؛ الضباب بخار ماء.","3":"المرآة لا تصنع ماءً؛ جاء الماء من النفَس."},"detects":"M75"}},{"id":"U07.L03.A2.b","objective":"U07.L03.O2","level":"A","type":"choose","prompt":"عند الكبير، كم يدخل جسمه من الماء كل يوم تقريباً؟","options":["عشرة لترات كاملة","مئة لتر كل يوم","كوب واحد صغير","نحو لترين ونصف"],"answer":3,"explanation":"يدخل نحو لترين ونصف من الشراب والطعام وما يصنعه الجسم، ويخرج نحو ذلك.","feedback_by_option":{"0":"عشرة لترات أكثر بكثير من الحاجة.","1":"مئة لتر أكثر من ذلك بكثير؛ تذكّر{|ي} أن ما يُرشَّح في الكلية شيء والشرب شيء آخر.","2":"كوب واحد أقل بكثير من الحاجة."},"alt":{"prompt":"أي جزء من الماء الذي نحتاجه يأتي من الطعام تقريباً؟","options":["قليل جداً لا يُذكر","نحو الخُمس إلى الربع","النصف","كله"],"answer":1,"explanation":"نحو 20 إلى 30 في المئة من الماء يأتي من الطعام، والباقي من الشراب.","feedback_by_option":{"0":"في الخضار والفاكهة والحساء ماء كثير؛ نحو الخُمس إلى الربع.","2":"أقل من النصف؛ أكثره من الشراب.","3":"لا يكفي الطعام وحده؛ أكثر الماء من الشراب."}}},{"id":"U07.L03.A2.c","objective":"U07.L03.O2","level":"A","type":"true_false_why","prompt":"«في الخضار والفاكهة ماء يدخل أجسامنا». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو خُمس ما نحتاجه من الماء أو أكثر يأتي من الطعام، والخضار والفاكهة غنية بالماء.","rubric":"R1","alt":{"prompt":"«إذا لم نعرق فلا نفقد ماءً من الجلد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يتبخر من الجلد ماء بلا عرق ظاهر، ويخرج بخار مع النفَس أيضاً."}},{"id":"U07.L03.A3.a","objective":"U07.L03.O3","level":"A","type":"sequence","prompt":"رتّب{|ي} ما يحدث حين ينقص ماء الجسم.","options":["ينقص الماء ويتركز الدم","تشعر حسّاسات الدماغ","نعطش، وتصل الكليتين رسالة","تعيد الكليتان ماءً أكثر ويقلّ البول","نشرب فيعود الميزان"],"answer":[0,1,2,3,4],"explanation":"يتركز الدم، فتشعر حسّاسات الدماغ، فنعطش وتصل الكليتين رسالة، فتعيدان الماء، ثم نشرب فيعود الميزان.","alt":{"prompt":"رتّب{|ي} ما يحدث حين {تشرب|تشربين} أكثر من حاجتك{|ِ}.","options":["يزيد الماء في الدم","يتوقف الدماغ عن إرسال الرسالة","تُخرج الكليتان الزائد","يكثر البول ويفتح لونه"],"answer":[0,1,2,3],"explanation":"يزيد الماء في الدم، فيتوقف الدماغ عن الرسالة، فتُخرج الكليتان الزائد، فيكثر البول ويفتح لونه."}},{"id":"U07.L03.A3.b","objective":"U07.L03.O3","level":"A","type":"choose_reason","prompt":"ميزان الماء في الجسم:","options":["ثابت كالحجر لا يتحرك","يتأرجح قليلاً ثم يعود","يتغير بلا حدود ولا يعود","يتوقف حين ننام"],"answer":1,"explanation":"الماء ينقص ويزيد قليلاً طوال اليوم، والدماغ والكليتان يعيدانه إلى نطاقه.","feedback_by_option":{"0":"الماء يتغير قليلاً مع كل شرب وعرق، ثم يعود.","2":"الجسم يعيده دائماً إلى نطاقه بالعطش والكليتين.","3":"الميزان يعمل في النوم أيضاً؛ ولذلك نستيقظ ببول أغمق."},"detects":"M20","alt":{"prompt":"{شربت|شربتِ} كوبين كبيرين، وبعد ساعة كثر بولك{|ِ}. هل اختلّ ميزانك{|ِ}؟","options":["نعم؛ الكليتان مريضتان","لا؛ الميزان يعمل: أخرجت الكليتان الزائد","نعم؛ الماء نزل مباشرة إلى المثانة","لا؛ لأن البول لا علاقة له بالشرب"],"answer":1,"explanation":"زاد الماء فأخرجت الكليتان الزائد؛ هذا هو الميزان يعمل، لا خلل فيه.","feedback_by_option":{"0":"كثرة البول بعد شرب كثير علامة على كليتين تعملان.","2":"الماء مرّ في الدم أولاً، ثم أخرجت الكليتان الزائد.","3":"البول يتغير بالشرب: يكثر حين نشرب أكثر."},"detects":"M20"}},{"id":"U07.L03.A3.c","objective":"U07.L03.O3","level":"A","type":"true_false_why","prompt":"«العطش رسالة من الدماغ حين ينقص ماء الدم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ حسّاسات الدماغ تشعر بتركز الدم، فتُشعرنا بالعطش لنشرب.","rubric":"R1","alt":{"prompt":"«العطش يأتي من المعدة حين تفرغ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العطش رسالة من الدماغ حين يتركز الدم؛ والمعدة الفارغة تُشعرنا بالجوع لا بالعطش."}},{"id":"U07.L03.A4.a","objective":"U07.L03.O4","level":"A","type":"choose","prompt":"كم كوباً من السوائل يُنصح به طفل في العاشرة كل يوم تقريباً؟","options":["كوب واحد في اليوم كله","نحو 3 أكواب صغيرة","نحو 7 إلى 8 أكواب","نحو 20 كوباً"],"answer":2,"explanation":"يُنصح من هو أكبر من ثماني سنوات بنحو 7 إلى 8 أكواب من السوائل يومياً، وأكثر في الحر والرياضة.","feedback_by_option":{"0":"أقل بكثير من الحاجة.","1":"أقل من الحاجة؛ نحو 7 إلى 8 أكواب.","3":"أكثر بكثير من الحاجة؛ الكليتان تُخرجان الزائد."},"alt":{"prompt":"طفلة في السادسة. كم كوباً من السوائل تحتاج تقريباً كل يوم؟","options":["نحو 5 أكواب","كوب واحد","نحو 15 كوباً","لا تحتاج إلا حين تمرض"],"answer":0,"explanation":"يُنصح الأطفال من 4 إلى 8 سنوات بنحو 5 أكواب من السوائل يومياً.","feedback_by_option":{"1":"أقل بكثير من الحاجة.","2":"أكثر من الحاجة بكثير.","3":"الماء يخرج كل يوم، فنحتاجه كل يوم."}}},{"id":"U07.L03.A4.b","objective":"U07.L03.O4","level":"A","type":"choose_reason","prompt":"لماذا الماء أفضل من المشروب الغازي لعطشك{|ِ} اليومي؟","options":["لأن الماء أبرد دائماً","لأن المشروب الغازي لا ماء فيه","لأنه يروي بلا سكر","لأن الماء أغلى ثمناً"],"answer":2,"explanation":"الماء يروي بلا سكر؛ والمشروب الغازي فيه ماء لكن فيه سكراً كثيراً يضر الأسنان والجسم.","feedback_by_option":{"0":"البرودة ليست السبب؛ السكر هو الفرق.","1":"فيه ماء، لكن فيه سكراً كثيراً.","3":"الماء غالباً أرخص؛ والسبب أنه بلا سكر."},"detects":"M76","alt":{"prompt":"{تريد|تريدين} طعماً في الماء بلا سكر. ماذا {تفعل|تفعلين}؟","options":["أضيف ملعقتي سكر","أخلطه بمشروب غازي","أضيف شريحة ليمون أو خيار","أشرب العصير المعلّب بدلاً منه"],"answer":2,"explanation":"شريحة ليمون أو خيار أو حبات توت تعطي الماء طعماً بلا سكر.","feedback_by_option":{"0":"السكر المضاف هو ما نريد أن نبتعد عنه.","1":"المشروب الغازي فيه سكر كثير.","3":"العصير المعلّب فيه سكر كثير؛ الماء بطعم الفاكهة أفضل."},"detects":"M76"}},{"id":"U07.L03.A4.c","objective":"U07.L03.O4","level":"A","type":"true_false_why","prompt":"«الأفضل أن نشرب ماء اليوم كله دفعة واحدة في الصباح». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الجسم لا يخزّن الزائد فتُخرجه الكليتان؛ نشرب على مراحل طوال اليوم.","rubric":"R1","detects":"M77","alt":{"prompt":"«في الحر والرياضة نحتاج إلى ماء أكثر من المعتاد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نفقد ماءً أكثر بالعرق والنفَس، فنشرب قبل أن يشتد العطش وعلى مراحل."}},{"id":"U07.L03.A5.a","objective":"U07.L03.O5","level":"B","type":"choose","prompt":"من أين يأتي الهرمون المضاد لإدرار البول؟","options":["من غدة صغيرة تحت الدماغ","من الكليتين نفسيهما حين تمتلئان","من المعدة","من المثانة"],"answer":0,"explanation":"يُطلق من غدة صغيرة تحت الدماغ حين تقيس حسّاسات الدماغ أن الدم صار مركّزاً.","feedback_by_option":{"1":"الكليتان تستقبلان الرسالة، ولا تصنعانها.","2":"المعدة لا علاقة لها بهذه الرسالة.","3":"المثانة تخزّن البول فقط."},"alt":{"prompt":"ماذا يحدث للهرمون المضاد لإدرار البول حين {تشرب|تشربين} أكثر من حاجتك{|ِ}؟","options":["يزيد فيقلّ البول","لا يتغير","يقلّ فتُخرج الكليتان الزائد","يتحول إلى بول"],"answer":2,"explanation":"حين يزيد الماء يقلّ الهرمون، فتُخرج الكليتان الزائد ويكثر البول.","feedback_by_option":{"0":"هذا ما يحدث حين ينقص الماء، لا حين يزيد.","1":"الهرمون يتغير بحسب الماء؛ هذا معنى الميزان.","3":"الهرمون رسالة في الدم، لا يصير بولاً."}}},{"id":"U07.L03.A5.b","objective":"U07.L03.O5","level":"B","type":"explain_open","prompt":"اشرح{|ي} لماذا يشبه ميزان الماء في الجسم مكيّف الهواء في الغرفة.","answer":"كلاهما تغذية راجعة: حين يبتعد الشيء عن حدّه (حرارة الغرفة أو تركيز الدم) يعمل الجهاز ليعيده، فإذا عاد توقف.","rubric":"R1"},{"id":"U07.L03.A5.c","objective":"U07.L03.O5","level":"B","type":"true_false_why","prompt":"«حين يتركز الدم تقلّ رسالة الدماغ إلى الكليتين فيكثر البول». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العكس: يزيد الهرمون فتعيد الكليتان ماءً أكثر ويقلّ البول.","rubric":"R1","alt":{"prompt":"«الدماغ والكليتان يعملان معاً في ميزان الماء». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدماغ يقيس ويرسل الهرمون، والكليتان تعيدان الماء أو تُخرجانه."}},{"id":"U07.L03.A6.a","objective":"U07.L03.O6","level":"B","type":"choose","prompt":"كيف عرف سانتوريو أن الجسم يفقد ماءً لا يُرى؟","options":["رأى بعينه الماء يخرج من جلده كل يوم وهو جالس","وزن نفسه وطعامه وشرابه وما يُخرجه سنوات","سأل مرضاه كم يعرقون في اليوم","نظر إلى جلده بالمجهر"],"answer":1,"explanation":"قارن بالميزان ما يدخل بما يخرج مما يُرى، فوجد فرقاً استنتج أنه يخرج من الجلد والنفَس.","feedback_by_option":{"0":"الماء الذي يخرج بلا عرق لا يُرى؛ الميزان كشفه.","2":"لم يعتمد على السؤال؛ وزن بنفسه سنوات.","3":"لم يستعمل المجهر؛ استعمل الميزان."},"alt":{"prompt":"وجد سانتوريو أن ما يُخرجه مما يُرى أقل مما يأكل ويشرب. أين ذهب الفرق كما استنتج؟","options":["بقي مخزوناً في جسمه","خرج من الجلد والنفَس بلا أن يُرى","اختفى بلا سبب","تحوّل إلى عظم"],"answer":1,"explanation":"استنتج أن الفرق يخرج من الجلد ومع النفَس بلا أن يُرى، وسمّاه التعرّق غير المحسوس.","feedback_by_option":{"0":"لو بقي مخزوناً لزاد وزنه كل يوم؛ لكن وزنه لم يزد هكذا.","2":"الماء لا يختفي بلا سبب؛ يخرج بطريق لا نراه.","3":"العظم لا يصنع من الماء الزائد."}}},{"id":"U07.L03.A6.b","objective":"U07.L03.O6","level":"B","type":"explain_open","prompt":"صمّم{|ي} قياساً بسيطاً تعرف{|ين} به أن النفَس يُخرج ماءً.","answer":"أنفخ على مرآة أو ملعقة باردة فتظهر قطرات أو ضباب؛ وأقارن بمرآة لم أنفخ عليها.","rubric":"R1"},{"id":"U07.L03.A6.c","objective":"U07.L03.O6","level":"B","type":"true_false_why","prompt":"«قياس ما يدخل وما يخرج يكشف ما لا نراه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ هكذا عرف سانتوريو بالميزان أن جزءاً من الماء يخرج بلا أن يُرى.","rubric":"R1","alt":{"prompt":"«ما لا نراه يخرج من الجسم لا نستطيع أن نعرفه أبداً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ نعرفه بالقياس: الميزان، والمرآة الباردة، والكيس على اليد.
