const LD = {"id":"U08.T01","lesson":"U08.L01","first":false,"title":"اختبار: الدماغ والأعصاب: شبكة الرسائل","lessonTitle":"الدماغ والأعصاب: شبكة الرسائل","concepts":[],"check":[],"items":[{"id":"U08.L01.A1.a","objective":"U08.L01.O1","level":"A","type":"choose","prompt":"ما الذي يوجد داخل فقرات العمود الفقري؟","options":["نخاع العظم الذي يصنع الدم","الحبل الشوكي","شريان كبير يحمل الدم","عضلات الظهر"],"answer":1,"explanation":"داخل الفقرات الحبل الشوكي، طريق الرسائل بين الجسم والدماغ.","feedback_by_option":{"0":"النخاع يصنع الدم داخل العظام؛ أما داخل الفقرات فالحبل الشوكي.","2":"الشرايين الكبيرة أمام العمود الفقري لا داخله.","3":"عضلات الظهر حول الفقرات من الخارج."},"detects":"M41","alt":{"prompt":"ماذا يحمي الدماغ؟","options":["الأضلاع","عضلات الرقبة","الجمجمة، وحوله سائل","الشعر والجلد وحدهما"],"answer":2,"explanation":"الجمجمة تحمي الدماغ، وحوله أغشية وسائل تخفف الصدمات.","feedback_by_option":{"0":"الأضلاع تحمي القلب والرئتين.","1":"عضلات الرقبة تحرك الرأس؛ والجمجمة تحمي الدماغ.","3":"الجلد والشعر لا يكفيان؛ الجمجمة هي الدرع."}}},{"id":"U08.L01.A1.b","objective":"U08.L01.O1","level":"A","type":"true_false_why","prompt":"«الأعصاب تصل الجلد كله والعضلات والقلب والأمعاء». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الأعصاب تخرج من الدماغ والحبل الشوكي وتتفرع حتى تصل كل جزء في الجسم.","rubric":"R1","alt":{"prompt":"«الحبل الشوكي ونخاع العظم اسمان لشيء واحد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الحبل الشوكي طريق رسائل داخل الفقرات، ونخاع العظم يصنع الدم داخل العظام."}},{"id":"U08.L01.A1.c","objective":"U08.L01.O1","level":"A","type":"choose_reason","prompt":"سقط رجل سقطة شديدة على ظهره. لماذا يطلب المسعفون ألا يُحرَّك ظهره وعنقه؟","options":["لأن عظام الظهر طرية تنكسر بسهولة","لأن داخلها الحبل الشوكي، وإصابته تقطع الرسائل","لأن عضلات الظهر تتمزق إن تحركت بعد السقوط","لأن الحركة تؤلمه فيبكي ويخاف أكثر"],"answer":1,"explanation":"داخل الفقرات الحبل الشوكي؛ إن أُصيب انقطعت الرسائل بين الدماغ وما تحت الإصابة.","feedback_by_option":{"0":"عظام الظهر قوية؛ والخوف على الحبل الشوكي داخلها.","2":"قد يؤلمه التحريك، لكن الخطر الأكبر على الحبل الشوكي.","3":"الألم مهم، لكن السبب الأكبر حماية الحبل الشوكي."},"alt":{"prompt":"ماذا يحدث إن أُصيب الحبل الشوكي إصابة شديدة في أسفل الظهر؟","options":["تضعف حركة الساقين وإحساسهما","يتوقف القلب عن النبض فوراً","تضعف رؤية العينين وسمع الأذنين","ينسى كل ما تعلّمه في المدرسة"],"answer":0,"explanation":"الرسائل بين الدماغ والساقين تمرّ في الحبل الشوكي؛ إن انقطعت ضعفت حركتهما وإحساسهما.","feedback_by_option":{"1":"القلب يديره جذع الدماغ من أعلى؛ أسفل الظهر يخدم الساقين.","2":"العينان والأذنان أعصابهما في الرأس؛ أسفل الظهر يخدم الساقين.","3":"الذاكرة في الدماغ؛ أسفل الظهر يخدم الساقين."}}},{"id":"U08.L01.A2.a","objective":"U08.L01.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة الرسالة حين {ترى|ترين} الكرة قادمة {فتمدّ|فتمدّين} يدك{|ِ} لتمسكها.","options":["العين ترى الكرة","رسالة في عصب إلى الدماغ","الدماغ يقرر: أمسكها!","أمر في عصب إلى عضلات اليد","العضلات تنقبض فتتحرك اليد"],"answer":[0,1,2,3,4],"explanation":"حاسة، ثم عصب إلى الدماغ، ثم قرار، ثم عصب إلى العضلة، ثم حركة.","alt":{"prompt":"رتّب{|ي} ما يحدث حين {تشم|تشمين} رائحة الخبز {فتلتفت|فتلتفتين} نحو المطبخ.","options":["الأنف يلتقط الرائحة","رسالة في عصب إلى الدماغ","الدماغ يعرفها ويقرر الالتفات","أمر في عصب إلى عضلات الرقبة","الرأس يلتفت"],"answer":[0,1,2,3,4],"explanation":"حاسة، ثم عصب إلى الدماغ، ثم قرار، ثم عصب إلى العضلات، ثم حركة."}},{"id":"U08.L01.A2.b","objective":"U08.L01.O2","level":"A","type":"choose","prompt":"الرسالة التي تسري في العصب:","options":["دم يجري من القلب داخل العصب","هواء يُنفخ في أنبوب العصب","صوت خفيف يسري داخل العصب","إشارة كهربائية سريعة"],"answer":3,"explanation":"الرسالة في العصب إشارة كهربائية صغيرة سريعة.","feedback_by_option":{"0":"الدم يغذي العصب كما يغذي كل الجسم، لكنه ليس الرسالة.","1":"العصب ليس أنبوب هواء؛ الرسالة إشارة كهربائية.","2":"لا صوت في العصب؛ الرسالة إشارة كهربائية."},"alt":{"prompt":"أيّ هذه يحمل أمر الدماغ إلى عضلات القدم؟","options":["الوتر في أسفل الساق","الوعاء الدموي في الساق","عصب يخرج إلى القدم","عظم الساق"],"answer":2,"explanation":"الأمر يسري في عصب يخرج من الحبل الشوكي إلى عضلات القدم.","feedback_by_option":{"0":"الوتر ينقل شدّ العضلة إلى العظم، لا أوامر الدماغ.","1":"الوعاء يحمل الدم؛ والأمر يحمله عصب.","3":"العظم يدعم؛ والأمر يحمله عصب."}}},{"id":"U08.L01.A2.c","objective":"U08.L01.O2","level":"A","type":"true_false_why","prompt":"«الرسالة تصل من القدم إلى الدماغ في لحظة بلا أي زمن». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ هي سريعة جداً لكنها تحتاج زمناً يُقاس: نحو جزء من مئة من الثانية في العصب السريع، وأطول في البطيء.","rubric":"R1","detects":"M81","alt":{"prompt":"«الأمر الذي يخرج من الدماغ إلى عضلة الساق يسري في عصب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الأمر يسري في عصب ينزل في الحبل الشوكي ثم يخرج إلى عضلات الساق."}},{"id":"U08.L01.A3.a","objective":"U08.L01.O3","level":"A","type":"choose_reason","prompt":"لمست{|ِ} مكواة ساخنة فسحبت{|ِ} يدك{|ِ}، وبعد لحظة أحسست{|ِ} بالألم. لماذا سحبتها قبل أن {تحس|تحسي} بالألم؟","options":["لأن العضلة أحسّت الحرارة فتحركت وحدها","لأن الدماغ فكّر بسرعة وقرر الهرب","لأن الحبل الشوكي ردّ قبل الدماغ","لأن الجلد يدفع اليد بعيداً بنفسه"],"answer":2,"explanation":"هذا منعكس: الرسالة وصلت الحبل الشوكي فردّ فوراً، ثم وصلت الدماغ فأحسست{|ِ} بالألم.","feedback_by_option":{"0":"العضلة لا تحسّ الحرارة ولا تقرر؛ تنتظر أمراً في عصب.","1":"لو انتظرت{|ِ} قرار الدماغ لتأخرت{|ِ}؛ الحبل الشوكي ردّ أولاً.","3":"الجلد يحسّ ويرسل الرسالة؛ والعضلة تسحب اليد بأمر من الحبل الشوكي."},"detects":"M79","alt":{"prompt":"أيّ هذه منعكس؟","options":["اختيار جواب في الامتحان","رمي الكرة إلى زميل","كتابة الاسم في الدفتر","الرمش حين تقترب كرة"],"answer":3,"explanation":"الرمش يحدث وحده بسرعة ليحمي العين؛ والبقية قرارات.","feedback_by_option":{"0":"اختيار الجواب قرار يحتاج تفكيراً.","1":"رمي الكرة نقرر متى وإلى من.","2":"الكتابة حركة نقررها ونتعلمها."},"detects":"M79"}},{"id":"U08.L01.A3.b","objective":"U08.L01.O3","level":"A","type":"true_false_why","prompt":"«المنعكس يحمينا لأنه أسرع من الحركة التي نقررها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ طريقه أقصر ولا ينتظر قرار الدماغ، فيسحب اليد أو يغمض العين قبل أن يكبر الأذى.","rubric":"R1","alt":{"prompt":"«نستطيع دائماً أن نمنع الرمش إذا اقترب شيء من العين فجأة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الرمش منعكس يحدث بلا قرار، ويصعب منعه حين يأتي الشيء فجأة."}},{"id":"U08.L01.A3.c","objective":"U08.L01.O3","level":"A","type":"explain_open","prompt":"اذكر{|ي} منعكسين في جسمك{|ِ}، و{قل|قولي} كيف يحميك{|ِ} كل منهما.","answer":"الرمش يحمي العين من الأجسام والضوء القوي؛ سحب اليد عن الحار يحميها من الحرق؛ العطاس والسعال يُخرجان ما دخل الأنف والقصبة الهوائية.","rubric":"R1"},{"id":"U08.L01.A4.a","objective":"U08.L01.O4","level":"A","type":"choose","prompt":"{تقف|تقفين} على قدم واحدة دون أن {تقع|تقعي}. أيّ جزء في دماغك{|ِ} يحفظ توازنك{|ِ}؟","options":["جذع الدماغ","المخيخ","الحبل الشوكي","الجزء الأكبر المتجعّد"],"answer":1,"explanation":"المخيخ في خلف الدماغ يحفظ التوازن وتناسق الحركة.","feedback_by_option":{"0":"جذع الدماغ يدير التنفس والقلب؛ والتوازن للمخيخ.","2":"الحبل الشوكي ينقل الرسائل؛ والتوازن يحفظه المخيخ.","3":"الجزء الأكبر يقرر الحركة؛ والمخيخ يحفظ توازنها."},"alt":{"prompt":"أيّ جزء يدير التنفس ونبض القلب وأنت{|ِ} {نائم|نائمة}؟","options":["المخيخ","الجزء الأكبر المتجعّد وحده","العضلات نفسها بلا دماغ","جذع الدماغ"],"answer":3,"explanation":"جذع الدماغ يدير الأعمال التلقائية كالتنفس ونبض القلب.","feedback_by_option":{"0":"المخيخ للتوازن وتناسق الحركة.","1":"الجزء الأكبر للتفكير والحركة التي نقررها.","2":"العضلات تنفّذ؛ والأمر من جذع الدماغ."},"detects":"M80"}},{"id":"U08.L01.A4.b","objective":"U08.L01.O4","level":"A","type":"true_false_why","prompt":"«نستعمل عُشر دماغنا فقط، والباقي لا يعمل». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ صور الدماغ الحديثة تُظهر أن أجزاءه كلها تعمل، كل جزء في مهمته، ولا يوجد جزء نائم احتياطاً.","rubric":"R1","detects":"M78","alt":{"prompt":"«الدماغ يعمل ونحن نائمون». صح أم خطأ؟ ولماذا؟","answer":"صح؛ جذع الدماغ يدير التنفس والقلب، وأجزاء أخرى تعمل في النوم أيضاً."}},{"id":"U08.L01.A4.c","objective":"U08.L01.O4","level":"A","type":"choose_reason","prompt":"لماذا لا {تحتاج|تحتاجين} أن {تتذكر|تتذكري} التنفس وأنت{|ِ} {نائم|نائمة}؟","options":["لأن الرئتين تتنفسان وحدهما بلا أوامر","لأن جذع الدماغ يأمر بلا تفكير","لأن النائم لا يحتاج أكسجيناً","لأن القلب يتنفس عن الرئتين"],"answer":1,"explanation":"جذع الدماغ يرسل أوامر التنفس إلى عضلات الصدر والحجاب الحاجز بلا أن نفكر.","feedback_by_option":{"0":"الرئتان لا عضلات فيهما تنفخهما؛ عضلات الصدر تعمل بأمر من جذع الدماغ.","2":"النائم يحتاج أكسجيناً دائماً؛ ولذلك لا يتوقف التنفس.","3":"القلب يدفع الدم؛ والتنفس بأمر من جذع الدماغ."},"detects":"M80","alt":{"prompt":"أيّ هذه ليس من أعمال الدماغ؟","options":["إدارة التنفس ونبض القلب","حفظ التوازن في الجري","ضخّ الدم إلى الجسم","التذكر واتخاذ القرار"],"answer":2,"explanation":"ضخّ الدم عمل القلب؛ والدماغ يدير سرعته.","feedback_by_option":{"0":"هذا من أعمال جذع الدماغ.","1":"هذا من أعمال المخيخ.","3":"هذا من أعمال الجزء الأكبر من الدماغ."},"detects":"M80"}},{"id":"U08.L01.A5.a","objective":"U08.L01.O5","level":"B","type":"choose","prompt":"أيّ وصف يناسب الخلية العصبية؟","options":["مستديرة بلا زوائد، تسبح في الدم","قرص مقعّر يحمل الأكسجين","لها زوائد وذيل طويل جداً","مسطحة تغطي سطح الجلد"],"answer":2,"explanation":"للخلية العصبية جسم وزوائد قصيرة تستقبل وذيل طويل يرسل.","feedback_by_option":{"0":"هذه أقرب إلى خلايا الدم؛ الخلية العصبية لها زوائد وذيل.","1":"هذه الكرية الحمراء.","3":"هذه من خلايا الجلد؛ الخلية العصبية طويلة متفرعة."},"alt":{"prompt":"كيف تنتقل الرسالة من خلية عصبية إلى التي تليها؟","options":["تعبر فجوة صغيرة بمواد كيميائية","يجري الدم من خلية إلى أخرى","الخليتان خيط واحد متصل بلا فاصل","تقفز الخلية الأولى إلى الثانية"],"answer":0,"explanation":"بين الخليتين فجوة صغيرة جداً تعبرها الرسالة بمواد كيميائية.","feedback_by_option":{"1":"الدم يغذي الخلايا؛ والرسالة تعبر الفجوة بمواد كيميائية.","2":"هذا ما ظنه بعض العلماء قبل كاخال؛ بينهما فجوة.","3":"الخلايا ثابتة في مكانها؛ الرسالة هي التي تعبر."}}},{"id":"U08.L01.A5.b","objective":"U08.L01.O5","level":"B","type":"true_false_why","prompt":"«في دماغ الكبير عشرات المليارات من الخلايا العصبية». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو 86 ملياراً بحسب عدّ العلماء.","rubric":"R1","alt":{"prompt":"«كل الأعصاب تنقل الرسائل بالسرعة نفسها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أسرعها نحو مئة متر في الثانية، وأبطؤها نحو متر واحد أو أقل."}},{"id":"U08.L01.A5.c","objective":"U08.L01.O5","level":"B","type":"explain_open","prompt":"{تلمس|تلمسين} أحياناً شيئاً حاراً {فتحس|فتحسين} باللمسة أولاً ثم بالألم بعد قليل. فسّر{|ي} ذلك بسرعة الأعصاب.","answer":"رسالة اللمس تسري في أعصاب سريعة فتصل أولاً، ورسالة الحرارة والألم البطيء تسري في أعصاب أبطأ فتصل بعدها.","rubric":"R1"},{"id":"U08.L01.A6.a","objective":"U08.L01.O6","level":"B","type":"choose","prompt":"قاس هلمهولتز سنة 1850 الرسالة في عصب ضفدع. ماذا وجد؟","options":["أنها تصل في لحظة بلا زمن","أنها أبطأ من مشي الإنسان","أن الأعصاب لا تحمل رسائل","أن لها زمناً يُقاس"],"answer":3,"explanation":"وجد أن الرسالة تسري عشرات الأمتار في الثانية: سريعة، لكن لها زمن يُقاس.","feedback_by_option":{"0":"هذا ما ظنه كثيرون قبله؛ هو قاس زمنها.","1":"عشرات الأمتار في الثانية أسرع من المشي بكثير.","2":"بل قاس زمن الرسالة التي يحملها العصب."},"detects":"M81","alt":{"prompt":"ماذا رأى كاخال بالمجهر في الخلايا العصبية المصبوغة؟","options":["أنها خلايا منفصلة بينها فجوات","أنها شبكة واحدة متصلة بلا حدود","أنها مملوءة بالدم الأحمر","أنها أنابيب يجري فيها الهواء"],"answer":0,"explanation":"رسم كاخال الخلايا العصبية فرآها منفصلة، والرسالة تعبر بينها في موضع لقائها.","feedback_by_option":{"1":"هذا ما ظنه بعض العلماء؛ ورسوم كاخال رجّحت أنها منفصلة.","2":"الخلايا العصبية ليست مملوءة بالدم.","3":"لا هواء في الأعصاب."}}},{"id":"U08.L01.A6.b","objective":"U08.L01.O6","level":"B","type":"choose_reason","prompt":"قاست مريم زمن مسك المسطرة مرة بلا قرار ومرة بقاعدة «الآن أو لا». ما الذي يجعل مقارنتها عادلة؟","options":["أن تمسك بيدها الأخرى في المرة الثانية","المسطرة والشريك نفسهما، والرقم الأوسط","أن تستعمل مسطرة أطول في المرة الثانية","أن تكتفي بمحاولة واحدة في كل حالة"],"answer":1,"explanation":"تُثبَّت المسطرة والشريك واليد وطر
