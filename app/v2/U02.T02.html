قل تماسكاً."}}},{"id":"U02.L02.A3.c","objective":"U02.L02.O3","type":"choose_reason","prompt":"زميل يسحب ذراع زميله بقوة إلى الخلف «مزاحاً». ما الخطر؟","answer":2,"explanation":"السحب العنيف قد يتجاوز ما يحتمله الرباط فيتمزق، أو يخرج رأس العظم من مكانه فيُخلع المفصل.","feedback_by_option":{"0":"الكتف واسع الحركة، لكن الأربطة تمنعه أن يتحرك خارج مداه، وإجبارها يمزقها.","1":"إجبار المفصل لا يقويه؛ قد يمزق رباطاً أو يخلع المفصل.","3":"الخطر ليس على الغضروف وحده: السحب العنيف قد يمزق رباطاً أو يُخرج العظم من مكانه."},"level":"A","options":["لا خطر لأن الكتف مرن","يصير الكتف أقوى","قد يتمزق رباط أو يُخلع المفصل","يُكسر الغضروف، أما الأربطة فلا تتأثر"],"detects":"M36","alt":{"prompt":"في الرياضة يطلب المدرب ألا نثني مفصلاً أبعد مما يسمح به. لماذا؟","options":["لأن كل حركة للمفصل تضره","لا سبب؛ المفصل المرن يُثنى كما نريد","لأن الثني الزائد يُتعب العضلة، ولا خطر على المفصل","لأن الأربطة قد تتمزق إذا تجاوزنا مدى الحركة"],"answer":3,"explanation":"لكل مفصل مدى حركة تحفظه الأربطة؛ فإذا أُجبر على أبعد منه قد يتمزق الرباط أو يُخلع المفصل.","feedback_by_option":{"0":"الحركة في مداها مفيدة للمفصل؛ الخطر في تجاوز المدى.","1":"المرونة لها حدود: الأربطة تمنع الحركة خارج المدى، وإجبارها يمزقها.","2":"التعب يزول بالراحة؛ أما تجاوز المدى فقد يمزق رباطاً."},"detects":"M36"}},{"id":"U02.L02.A4.a","objective":"U02.L02.O4","type":"choose_reason","prompt":"لماذا المرفق أثبت من الكتف؟","answer":3,"explanation":"المفصل الرزّي يتحرك في اتجاه واحد فقط، فيصعب أن يخرج العظم من مكانه.","level":"B","options":["لأنه أصغر من الكتف فلا يتحرك كثيراً","لأن عضلاته أقوى من عضلات الكتف كلها","لأنه أقرب إلى اليد فنستعمله أكثر فيقوى","لأن الرزّي محدود الحركة فيصعب خروجه"],"feedback_by_option":{"0":"الحجم ليس السبب؛ السبب نوع المفصل: في كم اتجاهاً يتحرك؟","1":"عضلات الكتف قوية وكثيرة. الثبات هنا يأتي من شكل المفصل ونوع حركته.","2":"كثرة الاستعمال لا تجعل المفصل أثبت. انظر{|ي} إلى عدد الاتجاهات التي يتحرك فيها."},"alt":{"prompt":"مفصلان: الأول يتحرك في اتجاهات كثيرة، والثاني في اتجاه واحد. أيهما أثبت غالباً؟ ولماذا؟","options":["الثاني، لأن الحركة المحدودة تجعل خروج العظم أصعب","الأول، لأن الحركة الكثيرة تقوّيه","يتساويان في الثبات","الأول، لأن عضلات كثيرة قوية تحيط به من كل جهة فتمسكه"],"answer":0,"explanation":"كلما اتسعت حركة المفصل قلّ ثباته غالباً: الكتف يتحرك في كل اتجاه ويُخلع أسهل من المرفق الذي ينثني في اتجاه واحد.","feedback_by_option":{"1":"الحركة الواسعة لها ثمن: المفصل الذي يتحرك في كل اتجاه أسهل خروجاً.","2":"لا يتساويان: كلما اتسعت الحركة قلّ الثبات غالباً.","3":"العضلات تساعد، لكن المفصل الواسع الحركة يبقى أسهل خروجاً من المحدود الحركة."}}},{"id":"U02.L02.A4.b","objective":"U02.L02.O4","type":"explain_open","prompt":"يدور رأسك{|ِ} يميناً ويساراً مع أن كل فقرة تتحرك قليلاً. ما المفصل المسؤول عن معظم الدوران؟","answer":"مفصل محوري بين الفقرة الأولى والثانية.","level":"B","rubric":"R1"},{"id":"U02.L02.A4.c","objective":"U02.L02.O4","type":"true_false_why","prompt":"«طقطقة الأصابع تسبب التهاب المفاصل». صح أم خطأ؟ وكيف نعرف؟","answer":"خطأ؛ الدراسات لم تجد ارتباطاً؛ الطقطقة فقاعات غاز في سائل المفصل. اعتقاد شائع فحصه العلم.","level":"B","detects":"M37","rubric":"R1","alt":{"prompt":"«ما دام كثير من الناس يقولون إن الطقطقة تضر المفاصل، فلا بد أنه صحيح». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ كثرة من يقول شيئاً لا تثبته. الدراسات التي قارنت من يطقطقون أصابعهم بمن لا يطقطقون لم تجد عندهم التهاب مفاصل أكثر.","detects":"M37"}},{"id":"U02.L02.A5.a","objective":"U02.L02.O5","type":"choose_reason","prompt":"لماذا يختلف عدد المفاصل بين كتاب وآخر؟","answer":0,"explanation":"العدد يتبع التعريف: من يعدّ المفاصل المتحركة فقط يحصل على رقم أصغر ممن يعدّ كل التقاء بين عظمين.","level":"B","options":["لأن تعريف «المفصل» يختلف: متحرك فقط أم كل التقاء بين عظمين","لأن أحدهما أخطأ في العدّ","لأن عدد العظام يختلف بين الناس كثيراً","لأن المفاصل تتحرك فلا تُعدّ"],"feedback_by_option":{"1":"قد يكون العدّان صحيحين معاً. اسأل{|ي}: ماذا عدّ كل واحد؟","2":"الناس متشابهون في عدد عظامهم تقريباً، فلا يفسّر هذا فرقاً كبيراً بين الكتب.","3":"المفاصل تُعدّ كما تُعدّ العظام، تحركت أم لم تتحرك. الفرق في ما نسمّيه مفصلاً."},"alt":{"prompt":"يختلف عدد مفاصل الرضيع عن عدد مفاصل البالغ. لماذا؟","options":["لأن الرضيع لا يحتاج إلى مفاصل","لأن بعض عظام الرضيع تلتحم مع النمو","لأن مفاصل جديدة تنمو في الجسم كل سنة حتى البلوغ","لأن الرضيع لا يتحرك"],"answer":1,"explanation":"يولد الرضيع بعظام أكثر، ثم يلتحم بعضها ببعض مع النمو، فتقلّ المواضع التي يلتقي فيها عظمان.","feedback_by_option":{"0":"الرضيع يحتاج إلى مفاصله ليتحرك وينمو؛ الفرق في العدد لا في الحاجة.","2":"لا تنمو مفاصل جديدة؛ بل تلتحم بعض العظام فيقلّ عدد المواضع التي يلتقي فيها عظمان.","3":"الرضيع يتحرك كثيراً! الفرق يأتي من التحام بعض عظامه مع النمو."}}},{"id":"U02.L02.A5.b","objective":"U02.L02.O5","type":"explain_open","prompt":"عددت{|ِ} مفاصل يدك{|ِ} فحصلت{|ِ} على 15 ثم على أكثر من 25. اشرح{|ي} ماذا تغيّر بين العدّين.","answer":"في الأول عددتُ المتحركة فقط؛ في الثاني أضفتُ الوصلات الصغيرة بين عظام الرسغ والكف.","level":"B","rubric":"R1"},{"id":"U02.L02.A5.c","objective":"U02.L02.O5","type":"explain_open","prompt":"اذكر{|ي} مثالاً آخر من حياتك{|ِ} يختلف فيه الناس في رقم لأنهم اختلفوا في التعريف.","answer":"مثل: كم غرفة في البيت (هل المطبخ غرفة؟)، كم لاعباً في الفريق (هل الاحتياط؟)، كم كتاباً قرأت (هل القصص القصيرة؟).","level":"B","rubric":"R1"}],"transfer":[{"id":"U02.L02.T1","objective":"U02.L02.O2","type":"explain_open","prompt":"ذراع الرافعة (الونش) فيها مفصل ينثني في اتجاه واحد وقاعدة تدور دورة كاملة. أي مفصل في جسمك{|ِ} يشبه كلاً منهما؟","answer":"المفصل الرزّي (المرفق) والكروي (الكتف).","level":"A","rubric":"R1"},{"id":"U02.L02.T2","objective":"U02.L02.O4","type":"explain_open","prompt":"الدجاجة تدير رأسها كثيراً لكن جسمها لا ينحني كثيراً، والثعبان ينحني في كل مكان. فسّر{|ي} بالمفاصل.","answer":"للثعبان مئات الفقرات ومفاصلها، وللدجاجة رقبة طويلة الفقرات وجذع فقراته ملتحمة قليلة الحركة.","level":"B","rubric":"R1"},{"id":"U02.L02.T3","objective":"U02.L02.O5","type":"explain_open","prompt":"في المزرعة اختلف عاملان: أحدهما يقول عندنا 40 رأساً من الغنم والآخر 52. كيف يمكن أن يكون كلاهما صادقاً؟ وكيف تحسم{|ين
