const LD = {"id":"U10.L04","first":false,"title":"من البداية إلى الشيخوخة","driving_question":"{اسم}، كيف كنت{|ِ} قبل أن {تولد|تولدي}؟ وكيف سيتغير جسمك{|ِ} حتى {تكبر|تكبري} جداً مثل جدك{|ِ}؟","central_fact":"يبدأ الإنسان خلية واحدة اجتمعت فيها خلية من الأم وخلية من الأب، ثم ينمو جنيناً في الرحم نحو أربعين أسبوعاً، ثم يمر بمراحل العمر حتى الشيخوخة، فيتغير العظم والعضلة والعين والأذن؛ والحركة تبطئ ذلك، والبر يعين الكبار.","next":"U10.L05","nexts":[{"id":"U10.L05","gated":false}],"hook":{"text":"{اسم}، قبل أن {تولد|تولدي} بسنة، أين كنت{|ِ}؟","options":["في معدة أمي","لم أكن موجوداً بعد","في الرحم","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"كل واحد منا بدأ خلية واحدة صغيرة جداً، لا تُرى بالعين، اجتمعت فيها خلية من الأم وخلية من الأب. ولهذا {تشبه|تشبهين} أمك{|ِ} وأباك{|ِ}، كما {عرفت|عرفتِ} في درس الوراثة. ثم انقسمت الخلية مرات كثيرة كما {عرفت|عرفتِ} في درس النمو، وانتقلت إلى الرحم. والرحم عضو في بطن الأم ينمو فيه الجنين حتى يولد. والجنين هو الإنسان وهو ينمو في رحم أمه."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["vessels"],"zoom":"body"},"text":"كيف يأكل الجنين ويتنفس وهو في الرحم؟ لا يأكل بفمه ولا يتنفس الهواء. يصله بأمه الحبل السري، فيأتيه منه الغذاء والأكسجين من دم أمه. وبعد الولادة يُقطع، ويبقى أثره: سرّتك{|ِ}! وفي نحو الأسبوع الثاني عشر تكون أكثر أعضاء الجنين قد تكونت، ثم يكبر ويكبر، ويولد عادة بعد نحو أربعين أسبوعاً، أي نحو تسعة أشهر. وهو في الرحم يسمع أصواتاً، ومنها صوت أمه."},{"id":"E3","level":"A","atlas":{"layers":["skeleton"],"highlight":["bones"],"zoom":"body"},"text":"وبعد الولادة يمر الإنسان بمراحل العمر: الرضاعة، يتعلم فيها الرضيع أن يجلس ويحبو ويمشي. ثم الطفولة، وهي مرحلتك{|ِ} الآن: {تطول|تطولين} و{تتعلم|تتعلمين} كثيراً. ثم البلوغ الذي {عرفته|عرفتِه} في الدرس السابق. ثم الرشد: يتوقف الطول، ويعمل الإنسان ويرعى غيره. ثم الشيخوخة، وهي آخر مراحل العمر، يتغير فيها الجسم شيئاً فشيئاً. وحدود المراحل تقريبية، والناس يختلفون فيها."},{"id":"E4","level":"A","atlas":{"layers":["skeleton","muscles"],"highlight":["bones","leg_muscles"],"zoom":"body"},"text":"ماذا يتغير في الشيخوخة؟ العظم يفقد من كثافته، والعضلة تفقد من قوتها، والمفاصل تتيبس، وينقص الطول قليلاً. والعين يصعب عليها النظر إلى القريب، فتعينها نظارة القراءة. والأذن قد يضعف فيها سماع الأصوات الحادة. ويقل الإحساس بالحر والبرد. لكن الحركة والرياضة من أفضل ما يبطئ ذلك، والغذاء المتوازن وترك التدخين يعينان. وكثير من الكبار يمشون ويعملون ويتعلمون، ويعرفون ما لا نعرف."},{"id":"E5","level":"A","atlas":{"layers":["nervous"],"highlight":["ear"],"zoom":"body"},"text":"فكيف {تعين|تعينين} الكبار؟ {كلّمهم|كلّميهم} بوضوح ووجهك{|ِ} إليهم، بلا صراخ. {احمل|احملي} عنهم الثقيل. {امش|امشي} معهم، فالحركة تنفعهم. {اجعل|اجعلي} الضوء جيداً حين يقرؤون. {زرهم|زوريهم} {واسمع|واسمعي} قصصهم. ولا {تسخر|تسخري} من بطئهم، ولا {تحكم|تحكمي} على أحد بعمره. وتقول منظمة الصحة العالمية إن الظن بأن الكبار ضعفاء أو عبء يضر بصحتهم. وبحلول 2030 سيكون واحد من كل ستة أشخاص في العالم في الستين أو أكثر."},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["ear"],"zoom":"body"},"text":"للمستوى ب: كيف عرف العلماء أن المولود يعرف صوت أمه وهو لا يتكلم؟ في تجربة دي كاسبر وفايفر (1980) أعطوا المولود لهاية: إذا مصها بطريقة سمع صوت أمه تقرأ، وبطريقة أخرى صوت امرأة أخرى. فتعلم الأطفال أن يُسمعوا أنفسهم صوت الأم أكثر. ولأنهم كانوا حديثي الولادة، رأى الباحثون أنهم عرفوا صوتها وهم في الرحم. والحبل السري متصل بعضو في الرحم اسمه المشيمة، وفيه يأخذ دم الجنين الغذاء والأكسجين من دم الأم."}],"practice":[{"id":"U10.L04.P1","after":"E1","objective":"U10.L04.O1","type":"choose","prompt":"أين ينمو الجنين؟","options":["في معدة أمه","في الرحم","في رئة أمه","في قلب أمه"],"answer":1,"explanation":"الرحم عضو في بطن الأم ينمو فيه الجنين.","level":"A","feedback_wrong":"{تذكّر|تذكّري} تعريف الرحم.","feedback_by_option":{"0":"المعدة للطعام.","2":"الرئة للهواء.","3":"القلب يضخ الدم."},"detects":"M147"},{"id":"U10.L04.P2","after":"E2","objective":"U10.L04.O1","type":"choose","prompt":"كيف يصل الغذاء والأكسجين إلى الجنين؟","op ما سأفعله: ___","alternatives":["من لا يعرف كبيراً قريباً: يقرأ قصة كبير متخيَّل في المشهد.","المستوى ب: يحسب بالأسابيع والأشهر مدة الحمل، ويرسمها على الشريط."]},"find_the_error":[{"id":"FE1","atlas_variant":"fetus_stomach","error":"رسم: الجنين داخل معدة أمه","answer":"الجنين في الرحم، وغذاؤه عبر الحبل السري","detects":"M147"},{"id":"FE2","atlas_variant":"elder_no_exercise","error":"لوحة: الرياضة للصغار فقط","answer":"الرياضة تبطئ ضعف العظم والعضلة في الكبر","detects":"M149"},{"id":"FE3","atlas_variant":"shout_elder","error":"طفل يصرخ في أذن جده من الخلف","answer":"نكلمه بوضوح ووجهنا إليه بلا صراخ","detects":"M150"}],"numbers":[{"text":"نحو أربعين أسبوعاً في الرحم، أي نحو تسعة أشهر.","source":["S1"]},{"text":"واحد من كل ستة أشخاص في العالم في الستين أو أكثر بحلول 2030.","source":["S4"]}],"true_size":[{"text":"بدأت{|ِ} خلية واحدة لا تُرى بالعين، وصار جسمك{|ِ} اليوم من عدد هائل من الخلايا.","source":["S1"]}],"animal":null,"organ_letter":{"from":"العظام","text":"مرحباً، نحن عظامك{|ِ}. حين {كنت|كنتِ} جنيناً في الرحم كنا طرية، ثم قسونا وطلنا معك{|ِ}، وما زلنا نطول. وبعد سنين طويلة، حين {تكبر|تكبرين}، سنفقد شيئاً من قوتنا، كما حدث لعظام جدك{|ِ} وجدتك{|ِ}. لكن لنا سرّاً: كلما {تحركت|تحركتِ} و{أكلت|أكلتِ} طعاماً متوازناً الآن، صرنا أقوى، وبقينا أقوى في الكبر. فإذا {رأيت|رأيتِ} كبيراً يمشي ببطء، {امش|امشي} معه، و{احمل|احملي} عنه الثقيل؛ فعظامه تشكرك{|ِ}، ونحن أيضاً."},"history":[{"who":"أنتوني دي كاسبر وويليام فايفر","origin":"الولايات المتحدة","where_when":"جامعة نورث كارولاينا، 1980","did":"صمما تجربة يختار فيها المولود الصوت الذي يسمعه بطريقة مصه اللهاية، فاختار المواليد صوت أمهاتهم أكثر من صوت امرأة أخرى.","did_not":"لم يقيسا ما يسمعه الجنين في الرحم مباشرة؛ استدلا عليه من سلوك المولود.","method_lesson":"إذا لم يستطع من ندرسه أن يتكلم، نبحث عن سلوك يستطيعه ونجعله «جواباً».","source":["S5","S6"]}],"how_we_know":{"text":"كيف عرف العلماء أن المولود يعرف صوت أمه؟ المولود لا يتكلم، لكنه يمص. في تجربة دي كاسبر وفايفر (1980) أعطوا المولود لهاية: إذا مصها بطريقة سمع صوت أمه تقرأ، وإذا مصها بطريقة أخرى سمع صوت امرأة أخرى. فتعلم الأطفال الطريقة التي تُسمعهم صوت الأم، واختاروه أكثر. ولأنهم كانوا حديثي الولادة، رأى الباحثون أنهم تعلموا صوتها وهم في الرحم.","limit_question":"لماذا قال الباحثون إن الأطفال تعلموا الصوت قبل الولادة، لا بعدها؟"},"what_changed":["كان بعض الناس يظنون أن المولود لا يعرف شيئاً عن العالم؛ واليوم نعرف أنه يولد وقد سمع أصواتاً وهو في الرحم.","كان يُظن أن الضعف في الكبر لا حيلة فيه؛ واليوم نعرف أن الحركة والغذاء تبطئ كثيراً منه."],"model_limits":["الخط الزمني للنمو في الرحم تقريبي؛ كل جنين يختلف قليلاً.","حدود مراحل العمر تقريبية؛ والناس يختلفون في سرعة الشيخوخة كثيراً."],"faith":{"opening":{"text":"وَٱللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَـٰتِكُمْ لَا تَعْلَمُونَ شَيْـًۭٔا وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَـٰرَ وَٱلْأَفْـِٔدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ","reference":"النحل 78","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} تذكير بالبداية: أن الله أخرجنا من بطون أمهاتنا. واليوم نتعلم كيف نما كل واحد منا قبل أن يولد، وكيف يتغير الجسم حتى الكبر. والآية لا تشرح الخلايا ولا الحبل السري، والعلم لا يشرح الآية؛ لكن من عرف رحلته من خلية واحدة إلى ما هو عليه عرف قدر النعمة، وقدر أمه التي حملته. ماذا {تقول|تقولين} لأمك{|ِ} اليوم؟","reviewed":false,"quran_key":"16:78","hl_words":[0,4],"highlight":"والله أخرجكم من بطون أمهاتكم","level":"ترغيب","concept":"البداية نعمة، والأم حملتنا.","avoid":"لا نجعل الآية شرحاً علمياً لمراحل الجنين، ولا نجعل العلم دليلاً عليها، ولا نحرج من لا يعيش مع أمه.","cards":[]},"closing":{"text":"ليس منا من لم يرحم صغيرنا، ويوقر كبيرنا","reference":"الترمذي 1919","grade":"صحيح بمجموع طرقه (الألباني، السلسلة الصحيحة 2196)","usage":"قيمة","reflection":"عرفنا اليوم أن الجسم يتغير في الكبر، فيضعف العظم والعضلة والسمع والبصر. والحديث في البطاقة يجمع الصغير والكبير: نرحم الصغير ونوقّر الكبير. والحديث لا يشرح الشيخوخة، والعلم لا يشرحه؛ لكنه يعلّمنا أن نعين الكبار ونحترمهم. كيف {توقّر|توقّرين} كبيراً تعرفه هذا الأسبوع؟","reviewed":false,"hadith_key":"tirmidhi:1919","highlight":"ليس منا من لم ي
