const LD = {"id":"U06.T03","lesson":"U06.L03","first":false,"title":"اختبار: الأعضاء المساعدة: الكبد والبنكرياس والمرارة","lessonTitle":"الأعضاء المساعدة: الكبد والبنكرياس والمرارة","concepts":[],"check":[],"items":[{"id":"U06.L03.A1.a","objective":"U06.L03.O1","level":"A","type":"true_false_why","prompt":"«الطعام يمرّ بالكبد ليُنظَّف». صح أم خطأ؟","answer":"خطأ؛ الدم من الأمعاء يمرّ به؛ الطعام يبقى في الأنبوب.","rubric":"R1","detects":"M58","alt":{"prompt":"«الكبد خارج أنبوب الهضم: يصله الدم القادم من الأمعاء، ويرسل الصفراء إلى الأمعاء عبر أنبوب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الطعام لا يدخل الكبد أبداً؛ يمرّ به الدم الذي يحمل ما امتُصّ، ويصبّ هو الصفراء في الأمعاء.","detects":"M58"}},{"id":"U06.L03.A1.b","objective":"U06.L03.O1","level":"A","type":"choose","prompt":"أين الكبد؟","options":["أسفل البطن يساراً قرب الأمعاء الغليظة","في الصدر بين الرئتين فوق القلب","أعلى البطن يميناً تحت الأضلاع","خلف المعدة في منتصف الظهر"],"answer":2,"explanation":"الكبد في أعلى البطن من جهة اليمين، تحت الأضلاع.","feedback_by_option":{"0":"الكبد في الأعلى، من جهة اليمين.","1":"الكبد تحت الحجاب الحاجز في البطن، لا في الصدر.","3":"خلف المعدة البنكرياس؛ والكبد أعلى البطن يميناً."},"alt":{"prompt":"أين البنكرياس؟","options":["في الصدر قرب القلب","أعلى البطن يميناً تحت الأضلاع","تحت الكبد مباشرة، ككيس صغير","خلف المعدة"],"answer":3,"explanation":"البنكرياس خلف المعدة، والكبد أعلى البطن يميناً، والمرارة تحت الكبد.","feedback_by_option":{"0":"البنكرياس في البطن لا في الصدر.","1":"هذا موضع الكبد.","2":"هذا موضع المرارة."}}},{"id":"U06.L03.A1.c","objective":"U06.L03.O1","level":"A","type":"explain_open","prompt":"كيف تصل عصارات الكبد والبنكرياس إلى الطعام إن كان لا يمرّ بهما؟","answer":"عبر أنابيب رفيعة تصبّ في أول الأمعاء الدقيقة.","rubric":"R1"},{"id":"U06.L03.A2.a","objective":"U06.L03.O2","level":"A","type":"choose_reason","prompt":"أي عضو يصنع عصارة تكسّر الأنواع الثلاثة؟","options":["المعدة","الكبد","المرارة","البنكرياس"],"answer":3,"explanation":"البنكرياس يصنع عصارة تكسّر النشا والبروتين والدهون.","feedback_by_option":{"0":"المعدة تبدأ البروتين فقط.","1":"الكبد يصنع الصفراء التي تفتّت الدهون ولا تكسّرها.","2":"المرارة تخزّن الصفراء ولا تصنع عصارة."},"alt":{"prompt":"بعد وجبة فيها خبز ولحم وزيت، أي عصارة تكسّر الثلاثة في الأمعاء؟","options":["الصفراء","عصارة البنكرياس","اللعاب","حمض المعدة"],"answer":1,"explanation":"عصارة البنكرياس تكسّر النشا والبروتين والدهون في الأمعاء الدقيقة.","feedback_by_option":{"0":"الصفراء تفتّت الدهون فقط ولا تكسّرها.","2":"اللعاب يبدأ النشا في الفم فقط.","3":"حمض المعدة يبدأ البروتين فقط."}}},{"id":"U06.L03.A2.b","objective":"U06.L03.O2","level":"A","type":"explain_open","prompt":"لماذا تحتاج الأمعاء شيئاً يهدّئ الحمض القادم من المعدة؟","answer":"لأن جدارها بلا حماية المعدة السميكة؛ عصارة البنكرياس تعادل الحمض.","rubric":"R1"},{"id":"U06.L03.A2.c","objective":"U06.L03.O2","level":"A","type":"true_false_why","prompt":"«عصارة البنكرياس تُصبّ في أول الأمعاء الدقيقة لا في المعدة». صح أم خطأ؟","answer":"صح؛ تصل عبر قناة إلى أول الأمعاء الدقيقة، وتهدّئ الحمض القادم من المعدة.","rubric":"R1","alt":{"prompt":"«عصارة البنكرياس تكسّر النشا وحده، ولا عمل لها في البروتين والدهون». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ عصارة البنكرياس تكسّر الأنواع الثلاثة: النشا والبروتين والدهون، وتهدّئ الحمض القادم من المعدة."}},{"id":"U06.L03.A3.a","objective":"U06.L03.O3","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة الصفراء.","options":["يصنعها الكبد","تخزّنها المرارة","تصل دهون إلى الأمعاء","تعصرها المرارة في الأمعاء","تفتّت الدهون قطرات"],"answer":[0,1,2,3,4],"explanation":"يصنع الكبد الصفراء، وتخزّنها المرارة، فإذا وصلت دهون إلى الأمعاء عصرتها المرارة فيها، فتفتّت الدهون قطرات.","alt":{"prompt":"رتّب{|ي} ما يحدث لدهون قطعة جبن في الأمعاء.","options":["تصل الدهون إلى أول الأمعاء الدقيقة","تعصر المرارة الصفراء عليها","تتفتّت الدهون قطرات صغيرة","تكسّرها عصارة البنكرياس"],"answer":[0,1,2,3],"explanation":"تصل الدهون إلى الأمعاء، فتعصر المرارة الصفراء عليها فتفتّتها قطرات صغيرة، ثم تكسّرها عصارة البنكرياس بسرعة لأن سطحها صار أكبر."}},{"id":"U06.L03.A3.b","objective":"U06.L03.O3","level":"A","type":"true_false_why","prompt":"«الصفراء تهضم الدهون كيميائياً». صح أم خطأ؟","answer":"خطأ؛ تفتّت فقط لتزيد السطح؛ التكسير لعصارة البنكرياس.","rubric":"R1","detects":"M61","alt":{"prompt":"«الصفراء لا تكسّر الدهون، بل تفتّتها قطرات صغيرة لتعمل عليها عصارة البنكرياس». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الصفراء تزيد سطح الدهون كما يفعل الصابون بالزيت، والتكسير عمل عصارة البنكرياس.","detects":"M61"}},{"id":"U06.L03.A3.c","objective":"U06.L03.O3","level":"A","type":"explain_open","prompt":"لماذا يسرّع تفتيت الدهون هضمها؟","answer":"العصارة تعمل على السطح فقط؛ قطرات كثيرة صغيرة سطحها أكبر بكثير من كتلة واحدة.","rubric":"R1"},{"id":"U06.L03.A4.a","objective":"U06.L03.O4","level":"A","type":"choose_reason","prompt":"لماذا لا ينفد سكر دمك{|ِ} بين الوجبات؟","options":["لأن الكبد خزّن الفائض ويُطلقه","لأن المعدة تحتفظ بالطعام","لأن الهواء فيه سكر","لأن الدم يصنع سكراً"],"answer":0,"explanation":"الكبد خزّن الفائض من السكر بعد الوجبات، ويُطلقه بينها.","feedback_by_option":{"1":"المعدة تُفرغ الطعام بعد ساعات؛ الذي يُبقي السكر في الدم هو الكبد: يخزّن الفائض ويُطلقه بين الوجبات.","2":"الهواء فيه أكسجين لا سكر.","3":"الدم ينقل السكر ولا يصنعه."},"detects":"M60","alt":{"prompt":"طفل صام من الفجر إلى المغرب، فبقي سكر دمه في مداه. كيف؟","options":["احتفظت المعدة بطعام السحور طول اليوم ثم أطلقته ببطء","أطلق الكبد من مخزونه وصنع سكراً جديداً","أعطاه الهواء سكراً","الجسم لا يحتاج السكر وهو صائم"],"answer":1,"explanation":"الكبد يُطلق من مخزونه بين الوجبات، وحين يقلّ مخزنه يصنع سكراً جديداً من مواد أخرى ويستعمل الجسم دهنه؛ فيبقى سكر الدم في مداه عند السليم.","feedback_by_option":{"0":"المعدة تُفرغ الطعام خلال ساعات؛ والذي يحفظ السكر عضو آخر.","2":"الهواء فيه أكسجين لا سكر.","3":"الخلايا تحتاج السكر دائماً، صائماً كان صاحبها أو غير صائم."},"detects":"M60"}},{"id":"U06.L03.A4.b","objective":"U06.L03.O4","level":"A","type":"true_false_why","prompt":"«الكبد مصفاة بثقوب تحبس الأوساخ». صح أم خطأ؟","answer":"خطأ؛ يعالج كيميائياً: يحوّل ويخزّن ويفكك.","rubric":"R1","detects":"M59","alt":{"prompt":"«الكبد يعالج ما يدخل الدم كيميائياً: يفكك ما يضر، ويخزّن ما ينفع». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكبد ليس مصفاة بثقوب؛ يغيّر المواد كيميائياً، فيفكك ما يضر ويخزّن السكر والفيتامينات.","detects":"M59"}},{"id":"U06.L03.A4.c","objective":"U06.L03.O4","level":"A","type":"explain_open","prompt":"اشرح{|ي} لأخ أصغر لماذا لا يأخذ حبة دواء وجدها.","answer":"ما يدخل الدم يمرّ بالكبد ليفككه، والدواء الزائد أو الخطأ يُثقل الكبد ويضر الجسم؛ الدواء بأمر الأهل والطبيب.","rubric":"R1"},{"id":"U06.L03.A5.a","objective":"U06.L03.O5","level":"B","type":"choose","prompt":"أين يصبّ البنكرياس رسالته التي تضبط السكر؟","options":["في الأمعاء","في الدم","في المعدة","في المرارة"],"answer":1,"explanation":"البنكرياس يصبّ رسالته التي تضبط السكر في الدم، فتصل إلى خلايا الجسم كلها.","feedback_by_option":{"0":"في الأمعاء يصبّ عصارته؛ والرسالة تصل الخلايا كلها، فكيف تصلها؟","2":"المعدة لا تحمل رسائل إلى الخلايا.","3":"المرارة تخزّن الصفراء."},"alt":{"prompt":"بعد وجبة حلوة يرتفع السكر في الدم. ما الذي يساعده على دخول الخلايا؟","options":["رسالة من البنكرياس في الدم","الصفراء التي تصبّها المرارة في الأمعاء","حمض المعدة","اللعاب"],"answer":0,"explanation":"البنكرياس يرسل رسالة (هرموناً) في الدم، تفتح أبواب الخلايا للسكر.","feedback_by_option":{"1":"الصفراء تفتّت الدهون في الأمعاء.","2":"حمض المعدة يبقى في المعدة ويبدأ البروتين.","3":"اللعاب في الفم يبدأ النشا."}}},{"id":"U06.L03.A5.b","objective":"U06.L03.O5","level":"B","type":"explain_open","prompt":"اذكر{|ي} عملين للكبد غير صنع الصفراء.","answer":"تخزين السكر وإطلاقه، تفكيك ما يضر، صنع بروتينات الدم، تخزين فيتامينات وحديد.","rubric":"R1"},{"id":"U06.L03.A5.c","objective":"U06.L03.O5","level":"B","type":"true_false_why","prompt":"«لو قُطع جزء من الكبد لا يعود أبداً». صح أم خطأ؟","answer":"خطأ؛ يتجدد خلال أسابيع؛ لذلك يمكن التبرع بجزء منه.","rubric":"R1","alt":{"prompt":"«الكبد أكبر عضو داخل الجسم، ويستطيع أن ينمو من جديد إذا قُطع جزء منه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكبد أكبر عضو داخلي، وله مئات الأعمال، ويتجدد خلال أسابيع؛ لذلك يمكن التبرع بجزء منه."}},{"id":"U06.L03.A6.a","objective":"U06.L03.O6","level":"B","type":"choose","prompt":"ما الذي قارنه برنار؟","options":["سكر الطعام وسكر البول","حجم الكبد قبل الأكل وبعده","سكر الدم الداخل إلى الكبد والخارج منه","لون الصفراء"],"answer":2,"explanation":"قارن برنار السكر في الدم الداخل إلى الكبد بالسكر في الدم الخارج منه، فوجد الكبد يُطلق سكراً.","feedback_by_option":{"0":"برنار قاس السكر في الدم عند الكبد نفسه: ما يدخله وما يخرج منه.","1":"الحجم لا يكشف صنع السكر؛ برنار قاس السكر في الدم.","3":"اللون لا يكشف صنع السكر؛ برنار قاس السكر في الدم."},"alt":{"prompt":"وجد برنار أن الدم الخارج من الكبد فيه سكر أكثر من الداخل إليه، مع أن الكلب لم يأكل سكراً. ماذا استنتج؟","options":["أن السكر جاء من الهواء","أن الكبد يأكل السكر","أن قياسه خطأ لا محالة","أن الكبد يصنع السكر ويضيفه إلى الدم"],"answer":3,"explanation":"الدم خرج من الكبد بسكر أكثر مما دخله، والطعام بلا سكر؛ فالفرق صنعه الكبد وأضافه إلى الدم.","feedback_by_option":{"0":"الهواء لا يحمل سكراً.","1":"لو أكل الكبد السكر لخرج الدم منه بسكر أقل لا أكثر.","2":"كرّر برنار قياسه وجرّب تجارب أخرى، فثبتت النتيجة."}}},{"id":"U06.L03.A6.b","objective":"U06.L03.O6","level":"B","type":"explain_open","prompt":"لماذا كان مهماً أن يكون طعام الكلب لحماً في تجربة برنار؟","answer":"لأن اللحم ليس فيه سكر جاهز تقريباً، فيختبر هل يأتي سكر الدم من سكر الطعام فقط. ومع مقارنة الدم الداخل والخارج وتجاربه الأخرى دلّ ذلك على أن الكبد يصنع السكر ويضيفه إلى الدم.","rubric":"R1"},{"id":"U06.L03.A6.c","objective":"U06.L03.O6","level":"B","type":"true_false_why","prompt":"«قياس ما يدخل عضواً وما يخرج منه يكشف ما يفعله». صح أم خطأ؟","answer":"صح؛ هذه قاعدة برنار، وقاعدة لافوازييه قبله في التنفس.","rubric":"R1","alt":{"prompt":"«لو دخل عضواً دمٌ فيه سكر قليل، وخرج منه بسكر أكثر، فالعضو أضاف السكر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مقارنة ما يدخل العضو بما يخرج منه تكشف ما يفعله؛ وهذه قاعدة برنار."}}],"transfer":[{"id":"U06.L03.T1","objective":"U06.L03.O3","type":"explain_open","prompt":"لماذا يُغسل الصحن الدهني بالصابون لا بالماء وحده؟ وما علاقة ذلك بالصفراء؟","answer":"الماء لا يذيب الدهن؛ الصابون يفتّته قطرات تنجرف مع الماء — كما تفتّت الصفراء الدهون ليعمل عليها العصارة.","level":"A","rubric":"R1"},{"id":"U06.L03.T2","objective":"U06.L03.O4","type":"explain_open","prompt":"مريض أُزيلت مرارته يستطيع أن يأكل عادياً لكنه يتعب من وجبة دسمة جداً. فسّر{|ي}.","answer":"الصفراء تصل من الكبد باستمرار لكن بلا مخزون يُعصر دفعة؛ فالدهون الكثيرة مرة واحدة تجد صفراء أقل.","level":"B","rubric":"R1"}],"recall":[{"id":"U06.L03.D1","objective":"U06.L03.O1","type":"choose","prompt":"ما الذي يمرّ بالكبد؟","options":["الدم من الأمعاء","الطعام نفسه ليُنظَّف","الهواء الذي نتنفسه"],"answer":0,"explanation":"الذي يمرّ بالكبد هو الدم القادم من الأمعاء، لا الطعام نفسه.","level":"A","feedback_by_option":{"1":"الطعام يبقى في أنبوب الهضم؛ الذي يصل الكبد ما امتُصّ منه في الدم.","2":"الهواء يدخل الرئتين لا الكبد."}},{"id":"U06.L03.D2","objective":"U06.L03.O3","type":"choose","prompt":"الصفراء:","options":["تهضم البروتين كيميائياً","تفتّت الدهون كالصابون","تصنع السكر من الدهون"],"answer":1,"explanation":"الصفراء تفتّت الدهون كالصابون ولا تهضمها.","level":"A","feedback_by_option":{"0":"البروتين تبدأ تكسيره المعدة وتكمله عصارة البنكرياس؛ والصفراء تعمل على الدهون.","2":"الصفراء لا تصنع سكراً؛ تفتّت الدهون إلى قطرات."}},{"id":"U06.L03.D3","objective":"U06.L03.O5","type":"choose","prompt":"رسالة البنكرياس إلى الدم:","options":["تكسّر الدهون","تصنع الصفراء","تفتح أبواب الخلايا للسكر"],"answer":2,"explanation":"رسالة البنكرياس تفتح أبواب الخلايا للسكر.","level":"B","feedback_by_option":{"0":"تكسير الدهون عمل عصارة البنكرياس في الأمعاء، لا رسالته في الدم.","1":"الصفراء يصنعها الكبد."}},{"id":"U06.L03.D4","objective":"U06.L03.O2","level":"A","type":"choose","prompt":"أين تصل عصارة البنكرياس الهاضمة؟","options":["إلى المعدة","إلى أول الأمعاء الدقيقة عبر أنبوب","إلى الدم مباشرة","إلى الرئتين"],"answer":1,"explanation":"البنكرياس يصبّ عصارته في أول الأمعاء الدقيقة عبر أنب
