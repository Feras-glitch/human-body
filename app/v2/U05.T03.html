const LD = {"id":"U05.T03","lesson":"U05.L03","first":false,"title":"اختبار: قضية الوحدة: من لقمة الخبز إلى القفزة","lessonTitle":"قضية الوحدة: من لقمة الخبز إلى القفزة","concepts":[],"check":[],"items":[{"id":"U05.L03.A1.a","objective":"U05.L03.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة اللقمة إلى القفزة.","options":["الأمعاء: سكر إلى الدم","القلب يدفع إلى الساق","الخلية تطلق الطاقة","العضلة تسحب العظم"],"answer":[0,1,2,3],"explanation":"الأمعاء ترسل السكر إلى الدم، فيدفعه القلب إلى الساق، فتُطلق الخلية الطاقة، فتسحب العضلة العظم.","alt":{"prompt":"رتّب{|ي} رحلة ثاني أكسيد الكربون من عضلة الساق بعد القفزة.","options":["خلية العضلة تُطلق الطاقة فيبقى ثاني أكسيد الكربون","يدخل الدم في الشعيرة","يعود الدم إلى القلب","يدفعه القلب إلى الرئتين","يخرج مع الزفير"],"answer":[0,1,2,3,4],"explanation":"تُطلق خلية العضلة الطاقة فيبقى ثاني أكسيد الكربون، فيدخل الدم في الشعيرة، ويعود إلى القلب الذي يدفعه إلى الرئتين، فيخرج مع الزفير."}},{"id":"U05.L03.A1.b","objective":"U05.L03.O1","level":"A","type":"choose","prompt":"أين يلتقي السكر والأكسجين؟","options":["في الخلية","في المعدة","في الرئة","في القلب"],"answer":0,"explanation":"السكر والأكسجين يلتقيان داخل الخلية، وهناك تُطلق الطاقة.","feedback_by_option":{"1":"المعدة تبدأ الهضم؛ وإطلاق الطاقة داخل كل خلية.","2":"في الرئة يدخل الأكسجين الدم؛ والالتقاء لإطلاق الطاقة في مكان آخر.","3":"القلب يدفع الدم الذي يحملهما؛ والالتقاء لإطلاق الطاقة داخل الخلايا."},"alt":{"prompt":"في أي محطة تُطلق الطاقة من السكر؟","options":["في الرئتين","في الأمعاء","داخل خلية العضلة","في الدم وهو يجري"],"answer":2,"explanation":"الطاقة تُطلق داخل الخلية حيث يلتقي السكر والأكسجين؛ وما قبلها توصيل.","feedback_by_option":{"0":"في الرئتين يدخل الأكسجين الدم.","1":"في الأمعاء يدخل السكر الدم.","3":"الدم ينقل السكر والأكسجين إلى الخلايا، وهي التي تُطلق الطاقة."}}},{"id":"U05.L03.A1.c","objective":"U05.L03.O1","level":"A","type":"explain_open","prompt":"لماذا يظهر القلب في مسار السكر ومسار الأكسجين ومسار ثاني أكسيد الكربون كلها؟","answer":"لأنه الناقل: يدفع الدم الذي يحمل الثلاثة؛ بلا دفعه لا يصل شيء ولا يعود شيء.","rubric":"R1"},{"id":"U05.L03.A2.a","objective":"U05.L03.O2","level":"A","type":"choose_reason","prompt":"{اختر|اختاري} الخطأ في النموذج: «الرئة تنفخ الهواء مباشرة في عضلة الساق».","options":["لا خطأ","الأكسجين يصل العضلة بالدم لا بالهواء","العضلة لا تحتاج أكسجيناً","الهواء يصل بالأعصاب"],"answer":1,"explanation":"لا أنبوب من الرئة إلى الساق؛ الأكسجين يصل إلى العضلة محمولاً في الدم.","feedback_by_option":{"0":"في الجملة خطأ: الرئة لا تنفخ الهواء في الساق؛ الأكسجين يدخل الدم في الرئة، والدم يحمله إلى العضلة.","2":"العضلة تحتاج الأكسجين لتُطلق طاقة الغذاء.","3":"الأعصاب تحمل الإشارات، لا الهواء ولا الأكسجين."},"detects":"M03","alt":{"prompt":"{اختر|اختاري} الخطأ في النموذج: «الأكسجين يذهب من الرئة إلى العضلة في أنبوب هواء».","options":["الأكسجين يصل بالأعصاب","لا خطأ","العضلة تأخذ الأكسجين من الجلد","لا أنبوب هواء خارج الرئة؛ الدم يحمل الأكسجين"],"answer":3,"explanation":"الهواء يبقى في الرئة؛ الأكسجين يعبر إلى الدم، والدم يحمله إلى العضلة.","feedback_by_option":{"0":"الأعصاب تحمل الإشارات.","1":"هناك خطأ: الهواء لا يخرج من الرئة إلى العضلة.","2":"الجلد لا يعطي العضلات ما تحتاجه من أكسجين."},"detects":"M03"}},{"id":"U05.L03.A2.b","objective":"U05.L03.O2","level":"A","type":"choose_reason","prompt":"{اختر|اختاري} الخطأ: «العضلة تدفع عظم الساق فتقفز».","options":["لا خطأ","العظم يتحرك وحده","العضلة تسحب فقط عبر الوتر","الوتر يدفع"],"answer":2,"explanation":"العضلة لا تدفع؛ تسحب العظم عبر الوتر فقط.","feedback_by_option":{"0":"في الجملة خطأ: العضلة لا تدفع أبداً؛ تسحب العظم عبر الوتر.","1":"العظم لا يتحرك وحده؛ العضلة تسحبه.","3":"الوتر ينقل سحب العضلة إلى العظم، ولا يدفع."},"detects":"M01","alt":{"prompt":"{اختر|اختاري} الخطأ: «عضلة واحدة تثني الركبة وتمدّها».","options":["العضلة تسحب فقط؛ فالحركتان تحتاجان عضلتين","لا خطأ","الركبة لا تنثني","المدّ يحدث بالعظم وحده، يعود حين ترتخي العضلة"],"answer":0,"explanation":"العضلة تسحب فقط؛ فعضلة خلف الفخذ تثني الركبة، وعضلة أمامه تمدّها.","feedback_by_option":{"1":"هناك خطأ: العضلة لا تدفع، فلا تمدّ ما ثنته.","2":"الركبة مفصل رزّي ينثني ويمتد.","3":"العظم لا يتحرك وحده؛ عضلة تسحبه."},"detects":"M01"}},{"id":"U05.L03.A2.c","objective":"U05.L03.O2","level":"A","type":"explain_open","prompt":"اذكر{|ي} خطأين في: «الطعام يذهب إلى الرئة ليحترق فتخرج الطاقة من الهواء».","answer":"1) الطعام يصير سكراً في الأمعاء ويدخل الدم لا الرئة؛ 2) الإطلاق في الخلية؛ 3) الطاقة في السكر لا في الهواء.","rubric":"R1","detects":"M48"},{"id":"U05.L03.A3.a","objective":"U05.L03.O3","level":"A","type":"choose_reason","prompt":"السبب المشترك للهاث والنبض السريع والدفء بعد الحركة؟","options":["القلب تعب فصار يدق ويسخن","الهواء ساخن في الخارج فيدخل الصدر","الرئة صغيرة فلا تكفي الحركة","خلايا العضلات طلبت طاقة أكثر"],"answer":3,"explanation":"سبب واحد للثلاثة: خلايا العضلات طلبت طاقة أكثر.","feedback_by_option":{"0":"تعب القلب لا يفسّر الدفء واللهاث معاً.","1":"يحدث هذا في البرد أيضاً؛ السبب من داخل الجسم.","2":"الرئة تكفي في الراحة والحركة؛ الذي تغيّر حاجة العضلات."},"alt":{"prompt":"سبّاح خرج من الماء بعد سباق: يلهث، ونبضه سريع، ووجهه دافئ. ما السبب الواحد؟","options":["قلبه خاف من الماء","الماء البارد أتعب رئتيه","الشمس أدفأته فقط","عضلاته طلبت طاقة أكثر"],"answer":3,"explanation":"سبب واحد للثلاثة: خلايا عضلاته طلبت طاقة أكثر، فاحتاجت أكسجيناً ونقلاً أسرع، وخرج جزء من الطاقة حرارة.","feedback_by_option":{"0":"القلب لا يخاف؛ يسرع لأن العضلات طلبت أكثر.","1":"الماء البارد لا يفسّر الدفء؛ السبب من داخله.","2":"الشمس قد تدفئ، لكنها لا تفسّر اللهاث وسرعة النبض."}}},{"id":"U05.L03.A3.b","objective":"U05.L03.O3","level":"A","type":"true_false_why","prompt":"«الدفء بعد الركض يأتي من حرارة تخرج مع إطلاق الطاقة في خلايا العضلات». صح أم خطأ؟","answer":"صح؛ لا من احتكاك الملابس؛ كل إطلاق للطاقة في الخلية يُخرج حرارة.","rubric":"R1","alt":{"prompt":"«الدفء بعد الركض يأتي من احتكاك الملابس بالجلد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الدفء من حرارة تخرج مع إطلاق الطاقة في خلايا العضلات العاملة."}},{"id":"U05.L03.A3.c","objective":"U05.L03.O3","level":"A","type":"explain_open","prompt":"لماذا يهدأ التنفس والنبض بعد دقائق من الجلوس؟","answer":"قلّ طلب الخلايا للطاقة فقلّ الأكسجين المطلوب وثاني أكسيد الكربون المنتَج، فأمر الدماغ بالتهدئة.","rubric":"R1"},{"id":"U05.L03.A4.a","objective":"U05.L03.O4","level":"A","type":"explain_open","prompt":"اكتب{|ي} شرحك{|ِ} للطفل الأصغر في ثلاث جمل بلا كلمة علمية صعبة.","answer":"الطعام وقود، والهواء يُشعل الوقود بهدوء داخل جسمنا، والدم يوصلهما إلى العضلات فنتحرك.","rubric":"R2"},{"id":"U05.L03.A4.b","objective":"U05.L03.O4","level":"A","type":"choose","prompt":"أي بند من قائمة التحقق نسيه شرح: «نأكل فيصير الطعام سكراً، وينقله الدم إلى العضلة فتتحرك»؟","options":["من أين الأكسجين وأين تُطلَق الطاقة","من أين يأتي السكر الذي في الخبز","من ينقل السكر من المعدة إلى الدم","كيف تتحرك العضلة وتنقبض حين يصلها السكر"],"answer":0,"explanation":"الشرح ذكر الطعام والسكر والدم والعضلة، لكنه لم يذكر من أين يأتي الأكسجين، ولا أن الطاقة تُطلق في الخلية.","feedback_by_option":{"1":"الشرح ذكر أن الطعام يصير سكراً؛ هذا موجود.","2":"الشرح ذكر أن الدم ينقله؛ هذا موجود.","3":"هذا تفصيل يمكن إضافته، لكن الأهم الناقص: من أين الأكسجين، وأين تُطلق الطاقة."},"alt":{"prompt":"أي بند من قائمة التحقق نسيه هذا الشرح: «الطعام يعطينا وقوداً، والهواء يعطينا أكسجيناً، فنتحرك»؟","options":["من أين يأتي الأكسجين","من أين يأتي الوقود","من يوصل الوقود والأكسجين إلى العضلات","ماذا نفعل بالطاقة بعد أن تصل إلى العضلات"],"answer":2,"explanation":"الشرح ذكر الوقود والأكسجين والحركة، لكنه نسي الناقل: الدم الذي يدفعه القلب إلى العضلات.","feedback_by_option":{"0":"الشرح قال إن الهواء يعطي الأكسجين.","1":"الشرح قال إن الطعام يعطي الوقود.","3":"الشرح قال «فنتحرك»؛ والناقص كيف يصل الوقود والأكسجين إلى العضلات."}}},{"id":"U05.L03.A4.c","objective":"U05.L03.O4","level":"A","type":"explain_open","prompt":"سألك{|ِ} أخوك{|ِ} الصغير: «ولماذا أخرج هواءً حين أتنفس؟» ماذا تجيب{|ين}؟","answer":"ما يخرج هو ما بقي بعد إطلاق الطاقة في الخلايا: ثاني أكسيد الكربون، يعود بالدم إلى الرئة فنُخرجه.","rubric":"R1"},{"id":"U05.L03.A5.a","objective":"U05.L03.O5","level":"B","type":"predict","prompt":"لو ضعف القلب فلم يدفع إلا نصف ما يدفع، ماذا يحدث عند صعود الدرج؟","options":["قوة أكبر لأن القلب يستريح فيوفّر طاقته","تعب ولهاث من جهد قليل لأن النقل قلّ","يصعد كما كان، لأن الرئتين تعوّضان عمل القلب"],"answer":1,"explanation":"إذا قلّ ما يدفعه القلب قلّ ما يصل إلى العضلات من أكسجين ووقود، فيتعب الجسم ويلهث من جهد قليل.","feedback_by_option":{"0":"القلب الضعيف يدفع دماً أقل، فيصل العضلات أكسجين ووقود أقل.","2":"الرئتان تأخذان الأكسجين، لكن لا شيء ينقله إلى العضلات إلا الدم الذي يدفعه القلب."},"alt":{"prompt":"طفل لم يأكل شيئاً يوماً كاملاً، ثم حاول الركض مساءً. تتوقع{|ين}:","options":["لا يستطيع أن يتحرك أبداً","يركض، لكنه يتعب أسرع من المعتاد","يركض أسرع لأن معدته خفيفة","لا يتغير شيء"],"answer":1,"explanation":"الجسم يخزّن بعض الوقود فيتحرك ساعات، لكن بضعف متزايد؛ فالوقود ضروري كل يوم.","feedback_by_option":{"0":"الجسم يخزّن بعض الوقود، فيتحرك؛ لكن بضعف.","2":"خفّة المعدة لا تعطي طاقة.","3":"الوقود ضروري كل يوم؛ ونقصه يُضعف الحركة."},"detects":"M50"}},{"id":"U05.L03.A5.b","objective":"U05.L03.O5","level":"B","type":"explain_open","prompt":"متسلق في مكان مرتفع يأكل جيداً لكنه يتعب بسرعة. فسّر{|ي} بالسلسلة.","answer":"الهواء قليل الأكسجين فتصل الخلايا كمية أقل فتطلق طاقة أقل رغم توفر السكر؛ حلقة الرئة ضعفت.","rubric":"R1"},{"id":"U05.L03.A5.c","objective":"U05.L03.O5","level":"B","type":"choose_reason","prompt":"عصب الساق أُصيب فلا يأمر العضلة. الوقود والأكسجين يصلان. هل تقفز الساق؟","options":["نعم لأن الوقود موجود","نعم ببطء","لا؛ الحلقة الأخيرة (أمر الانقباض) تعطلت","لا لأن الدم توقف"],"answer":2,"explanation":"الوقود والأكسجين لا يكفيان؛ العضلة لا تنقبض إلا بأمر يصلها عبر العصب، وهذه الحلقة تعطلت.","feedback_by_option":{"0":"الوقود موجود، لكن العضلة لا تنقبض إلا بأمر.","1":"بلا أمر من العصب لا تنقبض العضلة، لا بسرعة ولا ببطء.","3":"الدم لم يتوقف؛ الوقود والأكسجين يصلان. الذي تعطّل حلقة أخرى."},"alt":{"prompt":"طفل أصاب أمعاءه مرض، فلا يدخل دمَه من طعامه إلا القليل مع أنه يأكل. أي حلقة ضعفت؟","options":["حلقة الهضم","حلقة الرئة","حلقة القلب","حلقة العصب"],"answer":0,"explanation":"الطعام لا ينفع حتى يُهضم ويدخل الدم؛ فإذا ضعفت الأمعاء دخل الدم من الطعام أقل مما يحتاجه الجسم، ولو أكل جيداً.","feedback_by_option":{"1":"رئتاه سليمتان؛ المشكلة فيما يدخل من الطعام.","2":"قلبه سليم؛ المشكلة قبل الدم.","3":"أعصابه سليمة؛ المشكلة فيما يدخل من الطعام."}}},{"id":"U05.L03.A6.a","objective":"U05.L03.O6","level":"B","type":"true_false_why","prompt":"«المحطات تعمل كقطار: تنتهي محطة فتبدأ التالية». صح أم خطأ؟","answer":"خطأ؛ كلها تعمل معاً باستمرار؛ الخريطة خط والحقيقة شبكة.","rubric":"R1","detects":"M22","alt":{"prompt":"«حين أقفز يعمل الهضم والتنفس والقلب والعضلات كلها في الوقت نفسه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ المحطات كلها تعمل معاً باستمرار، والجسم يخزّن وقوداً فلا تنتظر القفزة الهضم؛ الخريطة خط والحقيقة شبكة.","detects":"M22"}},{"id":"U05.L03.A6.b","objective":"U05.L03.O6","level":"B","type":"choose_reason","prompt":"لماذا تستطيع{|ين} الركض صباحاً قبل الفطور؟","options":["لأن الركض لا يحتاج طاقة","لأن الهواء يعطي طاقة","لأن المعدة فارغة أخف","لأن الجسم خزّن وقوداً من وجبات الأمس"],"answer":3,"explanation":"الجسم يخزّن وقوداً من وجبات الأمس، فيستعمله صباحاً قبل الفطور.","feedback_by_option":{"0":"الركض يحتاج طاقة، والجسم يأخذها صباحاً من وقود خزّنه من وجبات الأمس.","1":"الطاقة في الغذاء لا في الهواء؛ والجسم خزّن وقوداً من وجبات الأمس.","2":"خفّة المعدة لا تعطي طاقة؛ الطاقة من وقود خزّنه الجسم."},"detects":"M50","alt":{"prompt":"لماذا لا يسقط الإنسان من الجوع بين الغداء والعشاء؟","options":["لأن الهواء يعطيه طاقة","لأن الجسم خزّن وقوداً يستعمله بين الوجبات","لأنه لا يحتاج طاقة بين الوجبات","لأن القلب يصنع السكر"],"answer":1,"explanation":"الجسم يخزّن بعض الوقود من الوجبات ويستعمله بينها، فيبقى السكر في الدم في مداه.","feedback_by_option":{"0":"الهواء يعطي الأكسجين لا الطاقة.","2":"الحاجة إلى الطاقة دائمة، حتى بين الوجبات.","3":"القلب يدفع الدم ولا يصنع السكر."},"detects":"M50"}},{"id":"U05.L03.A6.c","objective":"U05.L03.O6","level":"B","type":"explain_open","prompt":"لماذا يضعف من لا
