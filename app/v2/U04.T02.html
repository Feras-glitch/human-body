 رقيقان متلاصقان يسمحان بعبور الغازين.","rubric":"R1","alt":{"prompt":"«جدار الحويصلة سميك متين ليحميها من التمزق». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ جدار الحويصلة رقيق جداً، ليعبره الأكسجين وثاني أكسيد الكربون بسهولة."}},{"id":"U04.L02.A2.a","objective":"U04.L02.O2","level":"A","type":"choose","prompt":"أي غاز يخرج من الدم إلى الحويصلة؟","options":["الأكسجين الذي جاء من العضلات","ثاني أكسيد الكربون","بخار الماء، وثاني أكسيد الكربون يبقى في الدم","لا يعبر غاز من الدم؛ الغازات تدخل إليه ولا تخرج"],"answer":1,"explanation":"ثاني أكسيد الكربون كثير في الدم القادم من الجسم، فيعبر إلى الحويصلة ويخرج مع الزفير.","feedback_by_option":{"0":"الأكسجين يعبر في الاتجاه المعاكس: من الحويصلة إلى الدم.","2":"في الزفير بخار ماء فعلاً، لكن الغاز الذي يعبر من الدم ليخرج غاز آخر تصنعه الخلايا.","3":"الدم القادم من الجسم يحمل غازاً تصنعه الخلايا، فيعبر إلى الحويصلة ليخرج."},"alt":{"prompt":"في الحويصلة، أي غاز يعبر من الهواء إلى الدم؟","options":["الدخان","ثاني أكسيد الكربون","الأكسجين","بخار الماء"],"answer":2,"explanation":"الأكسجين يعبر من هواء الحويصلة إلى الدم، وثاني أكسيد الكربون من الدم إلى الهواء ليخرج مع الزفير.","feedback_by_option":{"0":"الدخان ليس مما يحتاجه الجسم، وهو يؤذي الحويصلات.","1":"ثاني أكسيد الكربون يعبر في الاتجاه المعاكس: من الدم إلى الهواء.","3":"بخار الماء يخرج مع الزفير؛ أما الذي يعبر إلى الدم فغاز يحتاجه الجسم."}}},{"id":"U04.L02.A2.b","objective":"U04.L02.O2","level":"A","type":"fix_model","prompt":"رسم فيه سهمان كلاهما من الهواء إلى الدم. صحّح{|ي}.","answer":"الأكسجين إلى الدم، وثاني أكسيد الكربون من الدم إلى الهواء.","rubric":"R1"},{"id":"U04.L02.A2.c","objective":"U04.L02.O2","level":"A","type":"explain_open","prompt":"لماذا يجب أن يكون جدار الحويصلة رقيقاً جداً؟","answer":"ليعبره الغاز بسرعة؛ الجدار السميك يبطئ التبادل أو يمنعه.","rubric":"R1"},{"id":"U04.L02.A3.a","objective":"U04.L02.O3","level":"A","type":"sequence","prompt":"رتّب{|ي} طريق الأكسجين.","options":["الهواء في الحويصلة","الدم في الشعيرة","يسار القلب","شعيرة في العضلة"],"answer":[0,1,2,3],"explanation":"من هواء الحويصلة إلى الدم في الشعيرة، ثم إلى يسار القلب، ثم إلى شعيرة في العضلة.","detects":"M03","alt":{"prompt":"رتّب{|ي} رحلة ثاني أكسيد الكربون من العضلة إلى خارج الجسم.","options":["شعيرة في العضلة","وريد","يمين القلب","الحويصلة","الزفير"],"answer":[0,1,2,3,4],"explanation":"يدخل ثاني أكسيد الكربون الدم في شعيرة العضلة، فيعود في وريد إلى يمين القلب، الذي يدفعه إلى الرئتين فيعبر إلى الحويصلة ويخرج مع الزفير."}},{"id":"U04.L02.A3.b","objective":"U04.L02.O3","level":"A","type":"choose_reason","prompt":"لماذا لا نستطيع التنفس تحت الماء؟","options":["لأن رئتينا تأخذان الأكسجين من الهواء لا من الماء","لأن الماء يمنع الرئة من صنع الأكسجين","لأن الماء بارد","لأن القلب يتوقف"],"answer":0,"explanation":"رئتانا تأخذان الأكسجين من الهواء، ولا تستطيعان أخذه من الماء.","feedback_by_option":{"1":"الرئة لا تصنع الأكسجين أصلاً؛ تأخذه من الهواء، ولا تستطيع أخذه من الماء.","2":"حتى في الماء الدافئ لا نستطيع التنفس؛ رئتانا تحتاجان هواءً.","3":"القلب لا يتوقف بمجرد النزول في الماء؛ المشكلة أن لا هواء نتنفسه."},"detects":"M02","alt":{"prompt":"من أين يأتي الأكسجين الذي يصل إلى عضلاتك{|ِ}؟","options":["من الهواء الخارجي، عبر الرئتين ثم الدم","تصنعه الرئتان من الهواء ثم ترسله إلى الدم","تصنعه العضلات","يأتي من الطعام"],"answer":0,"explanation":"الأكسجين من الهواء الخارجي: يدخل الرئتين، فيعبر إلى الدم، فيحمله الدم إلى العضلات.","feedback_by_option":{"1":"الرئتان تنقلان الأكسجين إلى الدم ولا تصنعانه.","2":"العضلات تستعمل الأكسجين ولا تصنعه.","3":"الطعام يعطي الغذاء؛ والأكسجين من الهواء."},"detects":"M02"}},{"id":"U04.L02.A3.c","objective":"U04.L02.O3","level":"A","type":"true_false_why","prompt":"«الرئتان ترسلان الأكسجين إلى عضلة الذراع مباشرة». صح أم خطأ؟","answer":"خطأ؛ عبر الدم فقط: حويصلة ← شعيرة ← قلب ← شريان ← شعيرة في العضلة.","rubric":"R1","detects":"M03","alt":{"prompt":"«الأكسجين لا يصل إلى عضلة الذراع إلا بعد أن يمرّ بالقلب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يعبر من الحويصلة إلى الدم، فيعود إلى يسار القلب، فيدفعه في شريان إلى شعيرات العضلة.","detects":"M03"}},{"id":"U04.L02.A4.a","objective":"U04.L02.O4","level":"A","type":"choose","prompt":"ضباب المرآة أمام الفم هو:","options":["ثاني أكسيد الكربون","قطرات ماء من الزفير الرطب","أكسجين","دخان"],"answer":1,"explanation":"هواء الزفير رطب، فبخار الماء فيه يصير على المرآة الباردة قطرات صغيرة.","feedback_by_option":{"0":"ثاني أكسيد الكربون غاز لا يُرى ولا يتكثف على المرآة.","2":"الأكسجين غاز لا يُرى؛ والضباب قطرات من شيء آخر في الزفير.","3":"الزفير ليس دخاناً؛ والضباب يزول بعد لحظات لأنه ماء."},"alt":{"prompt":"لماذا نرى «بخاراً» يخرج من أفواهنا في الشتاء ولا نراه في الصيف؟","options":["لأننا نتنفس أكثر في الشتاء","لأن ماء الزفير يتكثف قطرات في الهواء البارد","لأن الزفير في الشتاء دخان","لأن الأكسجين يصير أبيض في البرد"],"answer":1,"explanation":"هواء الزفير دافئ رطب؛ فإذا خرج إلى هواء بارد تكثّف بخار الماء فيه قطرات دقيقة فرأيناه، كما يتضبب سطح المرآة الباردة.","feedback_by_option":{"0":"عدد الأنفاس ليس السبب؛ السبب برودة الهواء الخارجي.","2":"الزفير ليس دخاناً؛ هو هواء رطب.","3":"الأكسجين غاز لا يُرى في أي جو."}}},{"id":"U04.L02.A4.b","objective":"U04.L02.O4","level":"A","type":"explain_open","prompt":"اذكر{|ي} فرقين بين الهواء الذي يدخل والهواء الذي يخرج.","answer":"الخارج أدفأ وأرطب، وفيه أكسجين أقل وثاني أكسيد كربون أكثر.","rubric":"R1"},{"id":"U04.L02.A4.c","objective":"U04.L02.O4","level":"A","type":"choose_reason","prompt":"رسم الحويصلة في الدرس بحجم الكف. ما الصواب؟","options":["الحويصلة بهذا الحجم فعلاً، فهي كالكرة في الصدر","الرسم أصغر من الحقيقة لأن الرئة كبيرة جداً","الرسم مكبَّر كثيراً؛ الحقيقية لا تُرى بالعين","الحجم في النموذج لا يهم، فلا داعي لذكره"],"answer":2,"explanation":"الرسم مكبَّر كثيراً لنرى الحويصلة؛ الحويصلة الحقيقية أصغر من أن تراها العين.","feedback_by_option":{"0":"الرسم نموذج مكبَّر كثيراً؛ الحويصلة الحقيقية أصغر من أن تراها العين.","1":"العكس: الرسم أكبر من الحقيقة بكثير، فالحويصلة الحقيقية لا تُرى بالعين.","3":"الحجم مهم لنفهم الحقيقة؛ النموذج يكبّر ليوضح، ويجب أن نعرف أنه مكبَّر."},"detects":"M25","alt":{"prompt":"أي جملة صحيحة عن رسم الحويص
