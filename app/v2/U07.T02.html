const LD = {"id":"U07.T02","lesson":"U07.L02","first":false,"title":"اختبار: طريق البول: الحالبان والمثانة والعاصرة","lessonTitle":"طريق البول: الحالبان والمثانة والعاصرة","concepts":[],"check":[],"items":[{"id":"U07.L02.A1.a","objective":"U07.L02.O1","level":"A","type":"choose_reason","prompt":"ما عمل المثانة؟","options":["تصنع البول من الدم","تخزّن البول حتى نُفرغه","ترشّح الماء المشروب","تدفع البول إلى الكليتين"],"answer":1,"explanation":"المثانة تخزّن البول ساعات حتى نُفرغه؛ الكليتان تصنعانه، والحالبان ينقلانه إليها.","feedback_by_option":{"0":"الكليتان تصنعان البول من الدم؛ المثانة تخزّنه.","2":"الترشيح في الكليتين، لا في المثانة.","3":"البول يمشي من الكليتين إلى المثانة، لا العكس."},"detects":"M74","alt":{"prompt":"{رسمت|رسمتِ} طريق البول. أين يُصنع البول؟","options":["في المثانة","في الحالبين","في الكليتين","في الإحليل"],"answer":2,"explanation":"البول يُصنع في الكليتين من الدم، ثم ينزل في الحالبين إلى المثانة.","feedback_by_option":{"0":"المثانة تخزّن البول ولا تصنعه.","1":"الحالبان ينقلان البول بعد أن يُصنع.","3":"الإحليل آخر الطريق؛ يُخرج البول."},"detects":"M74"}},{"id":"U07.L02.A1.b","objective":"U07.L02.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} محطات البول من أعلى الجسم إلى خارجه.","options":["الكلية","الحالب","المثانة","الإحليل"],"answer":[0,1,2,3],"explanation":"يبدأ البول في الكلية، وينزل في الحالب إلى المثانة، ثم يخرج في الإحليل.","alt":{"prompt":"رتّب{|ي} ما يحدث لقطرة بول من صنعها حتى خروجها.","options":["تُصنع في الكلية","تنزل في الحالب بموجات","تنتظر في المثانة","تخرج في الإحليل"],"answer":[0,1,2,3],"explanation":"تُصنع في الكلية، ويدفعها الحالب بموجات إلى المثانة فتنتظر فيها، ثم تخرج في الإحليل."}},{"id":"U07.L02.A1.c","objective":"U07.L02.O1","level":"A","type":"true_false_why","prompt":"«المثانة في الظهر بجانب الكليتين». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ المثانة في أسفل البطن من الأمام داخل الحوض، والكليتان في الظهر تحت الأضلاع، ويصل بينها الحالبان.","rubric":"R1","alt":{"prompt":"«الحالب ينزل من الكلية في الظهر ثم يتجه إلى الأمام نحو المثانة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكليتان في الظهر والمثانة في أسفل البطن من الأمام، والحالب يصل بينهما."}},{"id":"U07.L02.A2.a","objective":"U07.L02.O2","level":"A","type":"choose_reason","prompt":"كيف يصل البول من الكلية إلى المثانة؟","options":["يدفعه الحالب بموجات عضلية","يسقط إلى الأسفل كالماء في الأنبوب","تشفطه المثانة كالإسفنجة","يدفعه القلب مع الدم"],"answer":0,"explanation":"الحالب أنبوب عضلي يدفع البول بموجات متتابعة، كما يدفع المريء اللقمة.","feedback_by_option":{"1":"لو كان يسقط فقط لما وصل ونحن مستلقون؛ الحالب يدفعه.","2":"المثانة لا تشفط؛ تتمدد كلما دُفع إليها البول.","3":"القلب يدفع الدم في الأوعية؛ البول في الحالب لا في الدم."},"detects":"M71","alt":{"prompt":"رائد فضاء في مركبة لا جاذبية فيها. هل يصل بوله من كليتيه إلى مثانته؟","options":["لا؛ يبقى في الكليتين","نعم؛ الحالبان يدفعانه بموجات","لا؛ يحتاج إلى أن يقف","نعم؛ المثانة تشفطه إليها"],"answer":1,"explanation":"الحالبان يدفعان البول بموجات عضلية، فلا يحتاج البول إلى الجاذبية ليصل إلى المثانة.","feedback_by_option":{"0":"الحالبان يدفعانه ولو بلا جاذبية.","2":"الوقوف لا يلزم؛ الدفع من عضلات الحالب.","3":"المثانة لا تشفط؛ الحالبان يدفعان."},"detects":"M71"}},{"id":"U07.L02.A2.b","objective":"U07.L02.O2","level":"A","type":"true_false_why","prompt":"«عضلات الحالب تعمل كعضلات المريء: موجة بعد موجة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كلاهما أنبوب عضلي يدفع ما فيه بموجات، لا بالثقل.","rubric":"R1","alt":{"prompt":"«إذا نمنا مستلقين يتوقف البول عن النزول إلى المثانة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الحالبان يدفعانه بموجات، فيصل إلى المثانة ونحن مستلقون."}},{"id":"U07.L02.A2.c","objective":"U07.L02.O2","level":"A","type":"explain_open","prompt":"لماذا يصل البول إلى المثانة وأنت{|ِ} {مستلقٍ|مستلقية} في سريرك{|ِ}؟","answer":"لأن الحالب أنبوب عضلي يدفع البول بموجات متتابعة، كما يدفع المريء اللقمة؛ فلا يعتمد على الجاذبية.","rubric":"R1"},{"id":"U07.L02.A3.a","objective":"U07.L02.O3","level":"A","type":"sequence","prompt":"رتّب{|ي} ما يحدث من امتلاء المثانة حتى خروج البول.","options":["تمتلئ المثانة وتتمدد","تصل الدماغ إشارة","نصل إلى الحمام ونقرر","تنفتح العاصرة وتنقبض المثانة","يخرج البول في الإحليل"],"answer":[0,1,2,3,4],"explanation":"تتمدد المثانة فترسل إشارة إلى الدماغ، فنذهب ونقرر، فتنفتح العاصرة وتنقبض المثانة، فيخرج البول.","alt":{"prompt":"رتّب{|ي} كيف يتعلم الطفل التحكم في البول.","options":["رضيع تفرغ مثانته وحدها","طفل صغير يشعر بالإشارة","يتعلم أن يُبقي العاصرة مغلقة","يصل إلى الحمام في الوقت المناسب"],"answer":[0,1,2,3],"explanation":"عند الرضيع تفرغ المثانة وحدها، ثم يشعر الطفل بالإشارة، ثم يتعلم دماغه إبقاء العاصرة مغلقة حتى الحمام."}},{"id":"U07.L02.A3.b","objective":"U07.L02.O3","level":"A","type":"choose_reason","prompt":"ما عمل العاصرة؟","options":["تصنع البول في المثانة","تدفع البول في الحالب نحو المثانة","ترسل إشارة الامتلاء إلى الدماغ","تُبقي مخرج المثانة مغلقاً حتى نقرر"],"answer":3,"explanation":"العاصرة عضلات على شكل حلقة حول مخرج المثانة، تبقى مغلقة كالباب حتى نقرر.","feedback_by_option":{"0":"البول يُصنع في الكليتين؛ العاصرة باب عند المخرج.","1":"الحالب هو الذي يدفع البول بموجات.","2":"حسّاسات جدار المثانة ترسل الإشارة؛ العاصرة تُبقي الباب مغلقاً."},"alt":{"prompt":"لماذا لا يخرج البول وأنت{|ِ} في الصف مع أن الكليتين تعملان؟","options":["لأن الكليتين تتوقفان في الصف","لأن المثانة تخزّنه والعاصرة مغلقة","لأن البول يعود إلى الدم","لأن الحالبين يُغلَقان"],"answer":1,"explanation":"المثانة تخزّن البول وتتمدد، والعاصرة تبقى مغلقة حتى نصل إلى الحمام ونقرر.","feedback_by_option":{"0":"الكليتان تعملان دائماً، في الصف وفي النوم.","2":"البول لا يعود إلى الدم بعد أن يصل المثانة.","3":"الحالبان يبقيان مفتوحين يدفعان البول إلى المثانة."}}},{"id":"U07.L02.A3.c","objective":"U07.L02.O3","level":"A","type":"true_false_why","prompt":"«الرضيع لا يتحكم في العاصرة بعد، والتحكم مهارة يتعلمها الطفل». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مثانة الرضيع تفرغ وحدها حين تمتلئ، ثم يتعلم الدماغ أن يُبقي العاصرة مغلقة حتى الحمام.","rubric":"R1","alt":{"prompt":"«المثانة تُفرغ نفسها كلما نزلت إليها قطرة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تتمدد وتخزّن البول ساعات، والعاصرة مغلقة حتى نقرر."}},{"id":"U07.L02.A4.a","objective":"U07.L02.O4","level":"A","type":"choose_reason","prompt":"أيّ لون للبول يقول غالباً: شربتُ كفايتي؟","options":["أصفر فاتح كالقش","أصفر غامق كالعسل","بنّي كالشاي الثقيل","أحمر"],"answer":0,"explanation":"البول الفاتح الوفير قليل الرائحة علامة غالباً على شرب كافٍ.","feedback_by_option":{"1":"الغامق يقول غالباً: أحتاج ماءً.","2":"البنّي قد يعني نقص ماء شديداً؛ نشرب ونخبر الأهل إن استمر.","3":"الأحمر قد يكون دماً أو من طعام ملوّن؛ نخبر الأهل."},"detects":"M73","alt":{"prompt":"{رأيت|رأيتِ} بولك{|ِ} أصفر غامقاً قليلاً بعد يوم حار. ماذا {تفعل|تفعلين} أولاً؟","options":["أتوقف عن الشرب","أخاف لأن كليتي مريضة حتماً","أشرب ماءً وأراقب لونه بعد ساعات","أتجاهله لأن اللون بلا معنى"],"answer":2,"explanation":"البول الغامق بعد يوم حار يقول غالباً: أحتاج ماءً. نشرب ونراقب، فيعود فاتحاً بعد ساعات.","feedback_by_option":{"0":"قلة الشرب تزيده غمقاً؛ الجسم يحتاج ماءً.","1":"الغامق بعد الحر غالباً حاجة إلى الماء لا مرض؛ الألم أو الدم نخبر بهما الأهل.","3":"اللون رسالة بسيطة عن الماء؛ لا نتجاهلها."},"detects":"M73"}},{"id":"U07.L02.A4.b","objective":"U07.L02.O4","level":"A","type":"choose","prompt":"{تحتاج|تحتاجين} إلى الحمام في أول الاستراحة. ما الأفضل؟","options":["أكتم حتى أعود إلى البيت","أذهب في الاستراحة","أشرب أقل حتى لا أحتاج الحمام","أنتظر حتى أشعر بألم"],"answer":1,"explanation":"نذهب في وقت مناسب كالاستراحة؛ الكتم ساعات طويلة كل يوم قد يُضعف عضلة المثانة.","feedback_by_option":{"0":"الكتم ساعات طويلة كل يوم قد يُضعف عضلة المثانة.","2":"قلة الشرب تُتعب الجسم وتُغمق البول؛ الحل أن نذهب في الوقت المناسب.","3":"الألم علامة متأخرة؛ نذهب قبله بكثير."},"detects":"M72","alt":{"prompt":"زميل يكتم البول ساعات طويلة كل يوم في المدرسة. ماذا قد يحدث مع الوقت؟","options":["تقوى كليتاه","لا يتغير شيء لأن المثانة تتسع كثيراً","يقلّ ما تصنعه كليتاه من البول","قد تضعف عضلة مثانته"],"answer":3,"explanation":"الكتم الطويل المتكرر قد يُضعف عضلة المثانة فلا تُفرغها كلها؛ نذهب في وقت مناسب.","feedback_by_option":{"0":"الكتم لا يقوّي الكليتين؛ المثانة هي التي تتعب.","1":"اتساع المثانة يعطينا وقتاً قصيراً، لا ساعات طويلة كل يوم.","2":"الكليتان تصنعان البول بحسب ما شربنا، لا بحسب الكتم."},"detects":"M72"}},{"id":"U07.L02.A4.c","objective":"U07.L02.O4","level":"A","type":"true_false_why","prompt":"«بعض الفيتامينات والأدوية تغيّر لون البول». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ولذلك فاللون دليل بسيط على الشرب، وليس حكماً نهائياً.","rubric":"R1","alt":{"prompt":"«البول الأصفر الغامق يعني أن الكليتين مريضتان». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يعني غالباً أن الجسم يحتاج ماءً؛ وإن رأينا دماً أو شعرنا بألم نخبر الأهل."}},{"id":"U07.L02.A5.a","objective":"U07.L02.O5","level":"B","type":"choose","prompt":"عند الكبير، تأتي الإشارة الأولى بالحاجة والمثانة فيها:","options":["لتران كاملان","قطرة واحدة","نحو 150 مل، وتتسع لأكثر بكثير","ما يملؤها حتى آخرها"],"answer":2,"explanation":"الإشارة الأولى عند نحو 150 مل، والمثانة تتسع لنحو 500 إلى 600 مل؛ فلدينا وقت.","feedback_by_option":{"0":"المثانة لا تتسع للترين؛ والإشارة تأتي قبل ذلك بكثير.","1":"قطرة لا تكفي لتمديد الجدار؛ الإشارة عند نحو 150 مل.","3":"الإشارة الأولى مبكرة، والمثانة بعيدة عن الامتلاء."},"alt":{"prompt":"لماذا نستطيع أن ننتظر قليلاً بعد الإشارة الأولى؟","options":["لأن الإشارة تأتي والمثانة بعيدة عن الامتلاء","لأن الكليتين تتوقفان حين نشعر بالحاجة","لأن البول يعود إلى الدم","لأن العاصرة تقوى مع الانتظار"],"answer":0,"explanation":"الإشارة مبكرة والمثانة تتسع لأكثر بكثير؛ لكن الانتظار القصير غير الكتم الطويل المتكرر.","feedback_by_option":{"1":"الكليتان لا تتوقفان؛ تبقيان تصنعان البول.","2":"البول في المثانة لا يعود إلى الدم.","3":"الكتم الطويل لا يقوّي شيئاً؛ قد يُضعف عضلة المثانة."}}},{"id":"U07.L02.A5.b","objective":"U07.L02.O5","level":"B","type":"choose_reason","prompt":"أيّ هذه علامة نخبر بها الأهل ليعرضونا على الطبيب؟","options":["بول فاتح بعد شرب كثير","بول أغمق قليلاً في الصباح","الحاجة إلى الحمام بعد الاستيقاظ","حرقة عند التبول أو دم في البول"],"answer":3,"explanation":"الحرقة أو الألم أو الدم أو الحرارة أو الحاجة الملحّة المتكررة علامات نخبر بها الأهل.","feedback_by_option":{"0":"هذا طبيعي: شربنا كثيراً فأخرجت الكليتان الزائد.","1":"هذا شائع لأننا لم نشرب في الليل.","2":"هذا طبيعي: المثانة امتلأت في أثناء النوم."},"alt":{"prompt":"صديقك يشعر بحرقة عند التبول ويستحيي أن يخبر أحداً. بماذا تنصحه؟","options":["أن يشرب أقل","أن يخبر أهله ليعرضوه على الطبيب","أن يكتم البول","أن ينتظر أسبوعاً"],"answer":1,"explanation":"الحرقة علامة يعرفها الطبيب ويعالجها؛ إخبار الأهل ليس عيباً.","feedback_by_option":{"0":"قلة الشرب لا تعالج الحرقة.","2":"الكتم لا يساعد، وقد يزيد الأمر سوءاً.","3":"الانتظار يؤخر العلاج؛ نخبر الأهل الآن."}}},{"id":"U07.L02.A5.c","objective":"U07.L02.O5","level":"B","type":"true_false_why","prompt":"«كتم البول ساعات طويلة مرة بعد مرة قد يُضعف عضلة المثانة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ولذلك نذهب في وقت مناسب، ونأخذ وقتنا حتى تفرغ المثانة كلها.","rubric":"R1","alt":{"prompt":"«الإشارة الأولى بالحاجة تعني أن المثانة امتلأت حتى آخرها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تأتي مبكرة والمثانة بعيدة عن الامتلاء، فلدينا وقت نذهب فيه بهدوء."}},{"id":"U07.L02.A6.a","objective":"U07.L02.O6","level":"B","type":"choose","prompt":"ماذا كان إسحاق الإسرائيلي في القيروان يلاحظ في البول؟","options":["وزن المريض بالميزان","لونه وصفاءه وكميته","حرارته بمقياس الحرارة","ما فيه بالمجهر"],"answer":1,"explanation":"لاحظ لون البول وصفاءه وكميته وسجّلها، وفرّق بين ما يغيّره الطعام وما يغيّره الجسم.","feedback_by_option":{"0":"كتابه في البول نفسه، لا في وزن المريض.","2":"مقياس الحرارة لم يكن قد اختُرع بعد.","3":"المجهر جاء بعده بقرون."},"alt":{"prompt":"كيف يفحص المختبر البول اليوم؟","options":["بالنظر إلى لونه","بالنظر ثم الشريط الملوّن ثم المجهر","بقياس حرارته","بوزن الكوب"],"answer":1,"explanation":"ينظر إليه أولاً، ثم يغمس فيه شريطاً تتغير ألوانه، ثم ينظر إلى قطرة منه تحت المجهر.","feedback_by_option":{"0":"النظر خطوة أولى؛ ويضيف المختبر الشريط والمجهر.","2":"الحرارة لا تكشف ما في البول.","3":"الوزن لا يكشف ما في البول."}}},{"id":"U07.L02.A6.b","objective":"U07.L02.O6","level":"B","type":"explain_ope
