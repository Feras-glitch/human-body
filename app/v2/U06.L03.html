const LD = {"id":"U06.L03","first":false,"title":"الأعضاء المساعدة: الكبد والبنكرياس والمرارة","driving_question":"{اسم}، الطعام لا يمرّ بالكبد ولا بالبنكرياس أبداً — فلماذا لا يكتمل الهضم بدونهما؟ ولماذا لا ينفد السكر من دمك{|ِ} بين الوجبات؟","central_fact":"ثلاثة أعضاء لا يمرّ بها الطعام تصنع ما لا يكتمل الهضم بدونه: البنكرياس عصارة تكسّر الأنواع الثلاثة، والكبد الصفراء التي تفتّت الدهون، والمرارة تخزّنها؛ والدم القادم من الأمعاء يمرّ بالكبد الذي يخزّن السكر ويعالج ما دخل.","next":"U06.L04","hook":{"text":"{اسم}، الطعام لا يدخل الكبد ولا البنكرياس أبداً. فهل هما من الجهاز الهضمي أصلاً؟","options":["لا، لأن الطعام لا يمرّ بهما","نعم، يرسلان إلى الأمعاء ما لا يكتمل الهضم بدونه","نعم، لأنهما قرب المعدة","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive"],"highlight":["liver","pancreas","gallbladder","duodenum"],"zoom":"abdomen","animate":"ducts"},"text":"المعدة تُطلق دفعاتها إلى أول الأمعاء الدقيقة. وهناك، في أول متر، يُصبّ على الطعام ما يغيّر كل شيء — من ثلاثة أعضاء لا يدخلها الطعام أبداً. الكبد: أكبر عضو داخل جسمك{|ِ}، في أعلى البطن إلى اليمين تحت الأضلاع. وتحته كيس صغير: المرارة. وخلف المعدة عضو طويل ناعم: البنكرياس. الثلاثة تصبّ عصاراتها عبر أنابيب رفيعة تلتقي وتفتح في الأمعاء. أعضاء مساعدة: لا يمرّ بها الطعام، لكن بلا عصاراتها لا يكتمل هضمه."},{"id":"E2","level":"A","atlas":{"layers":["digestive"],"highlight":["pancreas"],"zoom":"pancreas","animate":"pancreatic_juice"},"text":"البنكرياس أولاً. عصارة المعدة بدأت البروتين فقط، واللعاب بدأ النشا فقط. أما عصارة البنكرياس ففيها مواد لكل شيء: تكسّر النشا إلى قطع سكرية صغيرة يُكمل جدار الأمعاء تحويلها، والبروتين إلى قطع صغيرة، والدهون إلى أجزاء أصغر. وتهدّئ حمض المعدة حتى لا يحرق الأمعاء. تصل عبر أنبوب يفتح في أول الأمعاء — في الوقت المناسب: حين تصل الدفعة من المعدة تُرسل الأمعاء رسالة إلى البنكرياس: الآن."},{"id":"E3","level":"A","atlas":{"layers":["digestive"],"highlight":["liver","gallbladder"],"zoom":"liver","animate":"bile"},"text":"لكن للدهون مشكلة: لا تذوب في الماء، فتتجمع كتلة كبيرة لا تستطيع العصارة أن تعمل إلا على سطحها. الحل من الكبد: يصنع سائلاً أخضر مصفرّاً اسمه الصفراء، تخزّنه المرارة بين الوجبات. حين تصل دهون تعصر المرارة الصفراء في الأمعاء، فتفتّت الدهون إلى آلاف القطرات الصغيرة — تماماً كما يفعل الصابون بالزيت في تجربتك{|ِ}. الصفراء لا تهضم؛ تُهيّئ. والتكسير بعدها لعصارة البنكرياس."},{"id":"E4","level":"A","atlas":{"layers":["digestive","circulatory"],"highlight":["intestine","portal_vein","liver"],"zoom":"abdomen","animate":"portal_flow"},"text":"والآن الوعد الذي قطعناه في الوحدة الماضية. حين يُمتَص السكر من الأمعاء إلى الدم — سنرى كيف في الدرس القادم — لا يذهب الدم إلى القلب مباشرة، بل يمرّ أولاً بالكبد في وعاء خاص. الكبد يفحص ما جاءه: السكر الفائض يخزّنه في خلاياه، ثم يُطلقه قطرة قطرة بين الوجبات — لذلك يبقى سكر دمك{|ِ} في مداه بين الوجبات وفي النوم، وتركض{|ين} قبل الفطور. وإن طال الجوع وقلّ المخزن، صنع الكبد سكراً جديداً من مواد أخرى واستعمل الجسم دهنه. وما يضر يفككه الكبد ويحوّله إلى شيء يخرج من الجسم. ولذلك قاعدة البيت: لا دواء بلا أهلك{|ِ} — الدواء الزائد يُثقل الكبد."},{"id":"E5","level":"B","atlas":{"layers":["digestive","circulatory"],"highlight":["pancreas","blood"],"zoom":"abdomen"},"text":"للمستوى ب: للبنكرياس عمل ثانٍ من نوع مختلف. لا يصبّه في الأمعاء بل في الدم: رسالة كيميائية (هرمون) تقول للخلايا: افتحوا الأبواب للسكر. بعد الوجبة يرتفع السكر فيرسل البنكرياس الرسالة فتأخذه الخلايا ويخزّن الكبد الفائض. وبعض الناس لا يصنع بنكرياسهم هذه الرسالة فيأخذونها بالحقن ويعيشون حياة كاملة — ربما تعرف{|ين} أحدهم. والكبد نفسه عجيب: مئات الأعمال — يصنع بروتينات الدم، يخزّن فيتامينات وحديداً، يفكك السموم — ولو قُطع جزء منه لنما من جديد خلال أسابيع. والفيتامينات مواد يحتاجها الجسم بكميات صغيرة جداً لتعمل خلاياه وينمو، ونأخذها من طعام متنوع: خضار وفاكهة وحليب وبيض ولحم وسمك؛ ويخزّن الكبد بعضها، مثل فيتامين ب12، سنوات. لذلك يستطيع إنسان أن يتبرع بجزء من كبده."},{"id":"E6","level":"B","atlas":{"layers":["digestive"],"highlight":["liver"],"zoom":"liver"},"text":"ولماذا نقول «يعالج» ولا نقول «يصفّي»؟ لأن المصفاة شبكة ثقوب تحبس الكبير وتمرّر الصغير، والكبد ليس كذلك: خلاياه تأخذ المواد وتغيّرها كيميائياً — تحوّل السكر إلى مخزون والمخزون إلى سكر، وتحوّل ما يضر إلى شيء آخر تُخرجه الكلية أو الصفراء. وليس كل ما «يُنظَّف» يُحبَس: بعضه يُغيَّر ويُعاد إلى الدم. كلمة واحدة خاطئة تصنع صورة خاطئة في الرأس."}],"practice":[{"id":"U06.L03.P1","objective":"U06.L03.O1","type":"choose_reason","prompt":"هل يمرّ الطعام بالكبد؟","options":["نعم؛ يمرّ الطعام في الكبد ليُنظَّف من الأوساخ ثم يعود إلى الأمعاء","لا؛ يمرّ به الدم القادم من الأمعاء، لا الطعام نفسه","نعم، لكن في الليل فقط حين ننام","لا أعرف"],"answer":1,"explanation":"الطعام لا يدخل الكبد؛ الدم القادم من الأمعاء يحمل ما امتُصّ من الغذاء إلى الكبد.","level":"A","feedback_wrong":"ما الذي يسير في الأنبوب من الكبد: طعام أم صفراء؟","feedback_by_option":{"0":"الطعام لا يدخل الكبد؛ يبقى في أنبوب الهضم، والدم يحمل ما امتُصّ منه.","2":"الطعام لا يمرّ بالكبد ليلاً ولا نهاراً؛ الدم هو الذي يمرّ.","3":"تذكّر{|ي}: الطعام في أنبوب الهضم، والكبد خارجه يصله الدم."}},{"id":"U06.L03.P2","objective":"U06.L03.O2","type":"choose_reason","prompt":"عصارة البنكرياس تكسّر:","options":["النشا، أما البروتين والدهون فلا","البروتين، وتترك النشا والدهون كما هي","النشا والبروتين والدهون","لا تكسّر طعاماً؛ عملها أن تهدّئ الحمض"],"answer":2,"explanation":"حين تصل الدفعة من المعدة يبقى فيها نشا وبروتين ودهون لم تُكسّر كلها، وعصارة البنكرياس تكسّر الثلاثة.","level":"A","feedback_wrong":"ما الذي لم يُكسَّر بعد حين تصل الدفعة من المعدة؟","feedback_by_option":{"0":"تكسّر النشا، وأكثر من ذلك.","1":"تكسّر البروتين، وأكثر من ذلك.","3":"تهدّئ الحمض فعلاً، لكنها تكسّر أيضاً."}},{"id":"U06.L03.P3","objective":"U06.L03.O3","type":"choose_reason","prompt":"ماذا تفعل الصفراء بالدهون؟","options":["تكسّرها كيميائياً إلى قطع صغيرة","تذيبها فتختفي","تفتّتها إلى قطرات صغيرة لتزيد سطحها كالصابون بالزيت","تجمعها كتلة واحدة"],"answer":2,"explanation":"الصفراء تفتّت الدهون إلى قطرات صغيرة كما يفتّت الصابون الزيت، فيزيد سطحها، لكنها لا تهضمها.","level":"A","feedback_wrong":"هل اختفى الزيت مع الصابون أم تفتت؟","feedback_by_option":{"0":"التكسير الكيميائي لعصارة البنكرياس؛ والصفراء تفتّت فقط.","1":"الدهون لا تختفي؛ تصير قطرات صغيرة كثيرة.","3":"العكس: تفرّقها قطرات صغيرة، كما يفعل الصابون بالزيت."}},{"id":"U06.L03.P4","objective":"U06.L03.O4","type":"predict","prompt":"لم تأكل{|ي} منذ أربع ساعات. سكر دمك{|ِ}:","options":["نفد تماماً لأن آخر وجبة هُضمت كلها","ما زال موجوداً لأن الكبد يُطلق من مخزونه","ارتفع كثيراً لأن الجسم جائع فيسحب السكر إلى الدم"],"answer":1,"explanation":"الكبد خزّن الفائض من السكر بعد الوجبة، ويُطلق منه بين الوجبات، فيبقى في الدم سكر.","level":"A","feedback_wrong":"من يعصر الإسفنجة بين الوجبات؟","feedback_by_option":{"0":"سكر الدم لا ينفد عند السليم؛ الكبد يُطلق من مخزونه.","2":"الجوع لا يرفع سكر الدم كثيراً؛ الكبد يُطلق ما يحفظه في مداه."}},{"id":"U06.L03.P5","objective":"U06.L03.O5","type":"choose_reason","prompt":"رسالة البنكرياس إلى الدم تقول للخلايا:","options":["افتحوا الأبواب للسكر","اصنعوا سكراً","توقفوا عن العمل","أرسلوا الدهون"],"answer":0,"explanation":"بعد الوجبة يرتفع السكر في الدم، ورسالة البنكرياس تقول للخلايا: افتحوا الأبواب للسكر.","level":"B","feedback_wrong":"ماذا يحدث للسكر بعد الوجبة؟","feedback_by_option":{"1":"الرسالة لا تطلب صنع سكر؛ تساعد السكر الموجود في الدم على دخول الخلايا.","2":"الخلايا لا تتوقف؛ الرسالة تساعدها على أخذ السكر.","3":"الرسالة عن السكر لا الدهون."}}],"check":[{"id":"U06.L03.C1","objective":"U06.L03.O1","type":"explain_open","prompt":"لماذا نسمّي الكبد والبنكرياس والمرارة «أعضاء مساعدة» مع أن الطعام لا يمرّ بها؟","answer":"لأنها تصبّ في الأمعاء عصارات لا يكتمل الهضم بدونها عبر أنابيب.","level":"A","rubric":"R1"},{"id":"U06.L03.C2","objective":"U06.L03.O2","type":"true_false_why","prompt":"«المعدة تكسّر كل أنواع الطعام فلا حاجة للبنكرياس». صح أم خطأ؟","answer":"خطأ؛ المعدة تبدأ البروتين فقط؛ البنكرياس يكسّر الأنواع الثلاثة ويهدّئ الحمض.","level":"A","rubric":"R1"},{"id":"U06.L03.C3","objective":"U06.L03.O3","type":"fix_model","prompt":"رسم زميل{ك|تكِ} الصفراء «تذيب الدهون فتختفي». أصلح{|ي}.","answer":"تفتّتها إلى قطرات صغيرة فيزيد سطحها؛ لا تختفي؛ التكسير لعصارة البنكرياس.","level":"A","rubric":"R1"},{"id":"U06.L03.C4","objective":"U06.L03.O4","type":"explain_open","prompt":"لماذا تستطيع{|ين} الركض صباحاً قبل الفطور؟ اذكر{|ي} العضو والفعل.","answer":"الكبد خزّن سكر وجبة الأمس ويُطلقه بين الوجبات.","level":"A","rubric":"R1"},{"id":"U06.L03.C5","objective":"U06.L03.O4","type":"choose_reason","prompt":"لماذا لا نأخذ دواء بلا أهلنا؟ (من الدرس)","options":["لأن طعمه مرّ والأطفال لا يحبونه فيرفضون أخذه","لأن الكبد يعالج ما يدخل الدم، والزائد يضره","لأنه غالٍ ويجب أن يحفظه الكبار","لأن المعدة تهضمه قبل أن يعمل"],"answer":1,"explanation":"الكبد يعالج ما يدخل الدم ومنه الدواء، والزائد منه يثقل عليه ويضره؛ لذلك يعطينا الدواء الكبار وبالكمية الصحيحة.","level":"A","feedback_by_option":{"0":"الطعم ليس السبب؛ الدواء يدخل الدم والكبد يعالجه، والزائد يضره.","2":"الثمن ليس السبب؛ الخطر على الجسم.","3":"كثير من الدواء يدخل الدم ويعمل؛ والزائد منه يضر الكبد."}},{"id":"U06.L03.C6","objective":"U06.L03.O5","type":"explain_open","prompt":"اذكر{|ي} عملي البنكرياس المختلفين وأين يصبّ كلاً منهما.","answer":"عصارة هضمية في الأمعاء عبر أنبوب؛ ورسالة (هرمون) في الدم تضبط دخول السكر إلى الخلايا.","level":"B","rubric":"R1"},{"id":"U06.L03.C7","objective":"U06.L03.O6","type":"explain_open","prompt":"كيف أثبت برنار أن الكبد يصنع السكر؟ اشرح{|ي} منطق «الداخل والخارج».","answer":"قاس السكر في الدم الداخل إلى الكبد والخارج منه؛ الخارج فيه أكثر حتى لحيوان لم يأكل سكراً؛ الفرق صنعه الكبد.","level":"B","rubric":"R1"}],"concepts":[{"id":"liver","term":{"ar":"الكبد","en":"Liver","zh":"肝脏","pinyin":"gānzàng","match":["الكبد","كبد","كبدك"]},"priority":"core","atlas":{"layer":"digestive","element":"liver"},"card":{"A":"أكبر عضو داخل جسمك{|ِ}، في أعلى البطن إلى اليمين تحت الأضلاع. يصنع الصفراء، ويخزّن السكر ويُطلقه بين الوجبات، ويعالج ما يدخل الدم من الأمعاء.","B":"مئات الأعمال: يصنع بروتينات الدم، يخزّن فيتامينات، ويفكك ما يضر؛ ويستطيع أن يتجدد بعد أن يُقطع جزء منه."}},{"id":"pancreas","term":{"ar":"البنكرياس","en":"Pancreas","zh":"胰腺","pinyin":"yíxiàn","match":["البنكرياس","بنكرياس"]},"priority":"core","atlas":{"layer":"digestive","element":"pancreas"},"card":{"A":"عضو طويل خلف المعدة؛ يصنع عصارة فيها مواد تكسّر النشا والبروتين والدهون، ويصبّها في الأمعاء الدقيقة عبر أنبوب.","B":"ويرسل إلى الدم رسالة (هرموناً) تضبط دخول السكر إلى الخلايا."}},{"id":"bile","term":{"ar":"الصفراء","en":"Bile","zh":"胆汁","pinyin":"dǎnzhī","match":["الصفراء","صفراء"]},"priority":"core","atlas":{"layer":"digestive","element":"gallbladder"},"card":{"A":"سائل أخضر مصفرّ يصنعه الكبد وتخزّنه المرارة؛ يفتّت الدهون إلى قطرات صغيرة جداً — كما يفعل الصابون بالزيت — فتستطيع العصارات تكسيرها.","B":"لا تكسّر الدهون كيميائياً؛ تزيد سطحها فقط. وتُعاد معظمها إلى الكبد لتُستعمل من جديد."}},{"id":"gallbladder","term":{"ar":"المرارة","en":"Gallbladder","zh":"胆囊","pinyin":"dǎnnáng","match":["المرارة","مرارة"]},"priority":"supporting","atlas":{"layer":"digestive","element":"gallbladder"},"card":{"A":"كيس صغير تحت الكبد يخزّن الصفراء بين الوجبات ويعصرها إلى الأمعاء حين تأكل{|ين} دهوناً.","B":"يمكن العيش بدونها: تصل الصفراء من الكبد مباشرة، لكن بلا مخزون."}}],"experiment":{"title":"الصابون والزيت: ماذا تفعل الصفراء؟ ومخزن الكبد","materials":["زجاجتان شفافتان بغطاء","ماء وزيت طعام","قطرة صابون سائل","ملعقة وورقة","(اختياري) إسفنجة وكوب ماء ملوّن"],"steps":["ضع{|ي} في كل زجاجة ماءً وقليلاً من الزيت. {رجّهما|رجّيهما} وانتظر{|ي} نصف دقيقة. ماذا حدث للزيت؟","{أضف|أضيفي} قطرة صابون سائل إلى زجاجة واحدة فقط ورجّ{|ي} الاثنتين من جديد. قارن{|ي}: أين بقيت قطرات الزيت صغيرة مشتتة أطول؟","الصابون يمثل الصفراء. هل اختفى الزيت أم تفتت فقط؟ هذا فرق مهم.","(اختياري) مخزن الكبد: اغمس{|ي} إسفنجة في ماء ملوّن — هذه وجبة. ثم {اعصرها|اعصريها} قليلاً قليلاً على مدى دقيقة في كوب: هذا ما يفعله الكبد بين الوجبات. متى تنتهي الإسفنجة؟","ضع{|ي} يدك{|ِ} اليمنى تحت أضلاعك{|ِ} اليمنى: هنا كبدك{|ِ}. ويدك{|ِ} اليسرى على أعلى البطن يساراً: المعدة، وخلفها البنكرياس. أيهما أكبر؟","اكتب{|ي}: ماذا يفعل الصابون بالزيت؟ وماذا تفعل الصفراء بالدهون؟ وما الذي لا يفعله الصابون ولا الصفراء؟"],"safety":["الصابون لا يُشرب ولا يلمس العين؛ تُغسل اليدان.","لا يُضغط على البطن بقوة عند تحديد المواضع.","من كان لديه أو لقريبه مرض سكري أو كبد يُستقبل سؤاله بحفاوة وبلا تفاصيل طبية."],"expected":"الزيت يطفو ويتجمع طبقة؛ مع الصابون يبقى قطرات صغيرة مشتتة أطول؛ الزيت لا يختفي. الإسفنجة تُعطي دفعات صغيرة ثم تنفد.","explain":"بلا صابون يتجمع الزيت كتلة واحدة سطحها صغير؛ الصابون — كالصفراء — يفتّته إلى آلاف القطرات الصغيرة فيصير سطحه ضخماً. وهنا الفكرة: عصارة البنكرياس تكسّر الدهون من سطحها فقط، فكلما زاد السطح أسرع التكسير. الصفراء لا تهضم؛ تُهيّئ. وقد صنعها كبدك{|ِ} وخزّنتها مرارتك{|ِ} حتى جاءت الدهون. والإسفنجة مثل كبدك{|ِ}: يمتلئ سكراً بعد الوجبة ويُطلقه دفعات بين الوجبات. لكن الإسفنجة تفرغ، أما الكبد فحين يقلّ مخزنه يصنع سكراً جديداً من مواد أخرى ويستعمل الجسم دهنه، فيبقى سكر دمك{|ِ} في مداه — و{تبقى|تبقين} {محتاجاً|محتاجةً} إلى وجبتك{|ِ} {لتنمو|لتنمي} وتتحرك{|ي}.","record":"حالة الزيت في الزجاجتين، والجواب على السؤالين، ومواضع الأعضاء الثلاثة.","alternatives":["بلا زجاجات: كأسان شفافان وملعقة.","بلا إسفنجة: صورة مخزن يمتلئ ويفرغ."]},"find_the_error":[{"id":"FE1","atlas_variant":"food_into_liver","error":"سهم الطعام يدخل الكبد","answer":"يدخله الدم من الأمعاء؛ الكبد يرسل الصفراء إلى الأمعاء","detects":"M58"},{"id":"FE2","atlas_variant":"liver_sieve","error":"الكبد مرسوم مصفاة بثقوب","answer":"يعالج كيميائياً ويخزّن ويفكك؛ ليس شبكة","detects":"M59"},{"id":"FE3","atlas_variant":"bile_digests","error":"«الصفراء تهضم الدهون»","answer":"تفتّت فقط؛ عصارة البنكرياس تكسّر","detects":"M61"}],"numbers":[{"text":"الكبد في الكبار نحو كيلو ونصف — أثقل عضو داخلي؛ وفيك{|ِ} الآن بحجم كفيك{|ِ} معاً تحت أضلاعك{|ِ} اليمنى.","source":["S2"]},{"text":"يصنع الكبد نحو نصف لتر إلى لتر من الصفراء يومياً، ومعظمها يُعاد إليه ويُستعمل من جديد.","source":["S2"]}],"true_size":[{"text":"ضع{|ي} كفيك{|ِ} معاً تحت أضلاعك{|ِ} اليمنى: هذا حجم كبدك{|ِ} الآن تقريباً — وهو يعمل في هذه اللحظة على آخر وجبة {أكلتها|أكلتِها}.","source":["S2"]}],"animal":{"text":"الفأر والجرذ ليسا الحيوان نفسه: للفأر مرارة، أما الجرذ فبلا مرارة. في الحيوان الذي لا يملك مرارة تصل الصفراء من الكبد إلى الأمعاء دون أن تخزن فيها. لا نفسر وجود المرارة أو غيابها من عدد الوجبات وحده.","source":["S4"]},"organ_letter":{"from":"كبدك{|ِ}","text":"أنا الأكبر بينهم ولا يمرّ بي طعامك{|ِ} قط. يمرّ بي دمك{|ِ} القادم من الأمعاء محمّلاً بأكثر ما امتُصّ من طعامك{|ِ}، فأخزّن السكر الفائض وأعطيه حين تجوع{|ين}، وأصنع الصفراء لدهونك{|ِ}، وأفكك ما يضرك{|ِ} — بصمت، آلاف التفاعلات في الثانية. لا {تُثقلني|تُثقليني} بدواء لم يأمر به أهلك{|ِ}، ولا بإسراف. ولو أُخذ مني جزء لعدت ونموت. مع التحية، أكبر عامل صامت فيك{|ِ}."},"history":[{"who":"كلود برنار","origin":"فرنسا","where_when":"باريس، 1849–1857","did":"قارن السكر في الدم الداخل إلى الكبد والخارج منه فاستدلّ أن الكبد يضيف سكراً (أعلنه 1849)، ثم بيّن بتجربة الكبد المغسول (1855) أن فيه مخزوناً يتحول إلى سكر سمّاه الجليكوجين؛ وتكلّم عن الدم بوصفه «بيئة داخلية» تعيش فيها أجزاء الجسم.","did_not":"لم يعرف الإنسولين (1921) ولا آلية الخلية؛ وتجاربه على الحيوان كانت قاسية بمعايير اليوم.","method_lesson":"قِس الداخل والخارج؛ فإن اختلفا فالعضو غيّر شيئاً — ثم ثبّت النتيجة بتجارب أخرى.","source":["S3"]},{"who":"ابن سينا","origin":"بخارى (أوزبكستان اليوم)","where_when":"980–1037","did":"جعل في «القانون» الكبد مبدأً للتغذية وموضعاً لما سمّاه «الهضم الثاني» بعد هضم المعدة، ووصف في فصل «ديانيطس» العطش وكثرة الشرب وكثرة البول.","did_not":"اعتمد نظرية الأخلاط (الصفراء والسوداء كمزاج) وهي خاطئة؛ ولم يعرف الإنزيمات ولا الجليكوجين.","method_lesson":"الملاحظة الطبية الدقيقة تصمد حتى لو كانت النظرية التي فسّرتها خاطئة.","source":["S5","S6"]}],"how_we_know":{"text":"كيف عرفنا أن الكبد يصنع السكر ولا يمرّره فقط؟ في منتصف القرن التاسع عشر كان رأيٌ شائع بين العلماء أن الحيوان لا يصنع السكر، بل يأخذه جاهزاً من طعامه النباتي. قاس كلود برنار السكر في الدم الداخل إلى الكبد من الأمعاء، وفي الدم الخارج منه نحو القلب، فوجد في الخارج سكراً أكثر، حتى عند كلاب طعامها لحم، واللحم ليس فيه سكر تقريباً. أعلن ذلك سنة 1849: الكبد يضيف سكراً إلى الدم. وفي تجربة أخرى سنة 1855 غسل كبداً حتى زال منه السكر، فعاد السكر يظهر فيه؛ فاستدلّ أن في الكبد مادة مخزونة تتحول إلى سكر، ثم عزلها وسمّاها الجليكوجين: مخزن الوقود. لم يكتفِ برنار بتجربة واحدة؛ جمع تجارب يكمّل بعضها بعضاً. قاعدة برنار: قِس ما يدخل وما يخرج؛ فإن اختلفا فالعضو غيّر شيئاً.","limit_question":"ما الذي يُوحي به رسم «المخزن» في الكبد خطأً؟"},"what_changed":["ظُن أن الحيوان لا يصنع سكراً بل يأخذه من النبات فقط؛ برنار بيّن أن الكبد يصنعه ويخزنه.","ظُنت الصفراء «خلطاً» يسبب المزاج والغضب (الطب القديم)؛ الصواب أنها سائل لهضم الدهون."],"model_limits":["الرسم يُظهر الأنابيب واضحة؛ الحقيقة قنوات رفيعة تلتقي في أنبوب واحد يصبّ في أول الأمعاء.","لون الصفراء والعصارة في الرسم ترميز.","«المخزن» في الكبد ليس حجرة؛ هو مادة داخل خلاياه.","الإسفنجة والمحاكي يُظهران التخزين والإطلاق؛ أما صنع الكبد سكراً جديداً حين يقلّ المخزن فيُذكر في المحاكي كلاماً ولا تُظهره الإسفنجة.","(صورة title-boy) البنكرياس مكشوف تعليميًا مع إزالة شفافية جزء من المعدة؛ هو خلفها لا أمامها. الأخضر والأصفر للقنوات لا للدم. الوصلات الدقيقة قرب الاثني عشر رمزية ولا تمثل كل الاختلافات التشريحية.","(صورة title-girl) البنكرياس مكشوف تعليميًا مع إزالة شفافية جزء من المعدة؛ هو خلفها لا أمامها. الأخضر والأصفر للقنوات لا للدم. الوصلات الدقيقة قرب الاثني عشر رمزية ولا تمثل كل الاختلافات التشريحية.","(صورة title-girl) تبقى لمعة سماوية صغيرة ملاصقة للقناة الخضراء قرب فتحة الاثني عشر؛ ليست ترميزًا لدم أزرق ويُفضّل ضبطها لونيًا عند التحرير النهائي.","(صورة E1) المساران منفصلان: قنوات عصارات إلى الاثني عشر ودم بابي من الأمعاء إلى الكبد؛ تم فك تراكب أجزاء الاثني عشر والقنوات لتسهيل القراءة. مسار الطعام لا يدخل الكبد أو البنكرياس.","(صورة E2) المقصات الصغيرة رموز للإنزيمات وليست أجسامًا حقيقية؛ البروتين يُستكمل تفكيكه في الأمعاء. تهدئة الحمض رمز لعمل البيكربونات، وليس اختفاء الحمض بالماء وحده.","(صورة E3) الزجاجتان تشبيه للاستحلاب بعد الرج؛ الزيت يبقى في قطيرات ولا يختفي، ولا تمثل الزجاجة المعادلات الكيميائية داخل الأمعاء.","(صورة E4) الغلوكوز المخزن يُمثّل سلاسل غليكوجين داخل خلايا الكبد. القوس إلى القلب اختصار للدوران ولا يوضح كل الأوردة أو الرئتين. الدواء يُحوَّل ويُطرح بطرق تختلف حسب المادة، ولا يجعله الكبد آمنًا دائمًا.","(صورة E5) الرسالة رمز للإنسولين؛ فتح الباب تبسيط لاستجابة أنسجة مثل العضلات والنسيج الدهني، وليس حاجة كل خلايا الجسم إلى الإنسولين لإدخال السكر. مشهد قلم الحقن صغير ورمزي وليس إرشادًا للجرعة أو الموضع.","(صورة E6) المصفاة مشطوبة، وورشة الخلايا رمز للتحويل الكيميائي؛ ليس الكبد مصفاة ثقوب أو غرفة تخزين. بعض المواد قد تتحول إلى نواتج ضارة وليس كل دواء إلى مادة غير ضارة.","(صورة exp) الصابون نموذج للاستحلاب وليس مادة للهضم أو الشرب. الإسفنجة تشبيه للتخزين/العصر وليست نموذجًا كاملًا للكبد. قد توجد قطيرات في زجاجتي البداية بسبب الحركة.","(صورة letter) الوجه تشخيص قصصي مسموح في رسالة العضو فقط؛ الأحجام والابتسامات ليست تشريحًا حقيقيًا.","(صورة hist1) لون السائلين رمز للمقارنة، لا طريقة بصرية موثوقة لمعرفة مقدار السكر. لا حيوان ظاهر.","(صورة hist1) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة hist2) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة life) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات."],"faith":{"opening":null,"closing":null},"life":[{"situation":"وجدت علبة دواء في البيت وأحس بصداع.","science":"الدواء يدخل الدم ويمرّ بالكبد ليفككه؛ الجرعة الخطأ أو الزائدة تُثقل الكبد وقد تضر، ودواء الكبار ليس للأطفال.","action":"لا آخذ شيئاً بنفسي؛ أخبر أمي أو أبي بما أحس.","value":"حفظ النفس أمانة؛ نهانا الله عن قتل أنفسنا (سورة النساء: الآية 29).","why":"لماذا لا آخذه مع أنه «للصداع»؟ لأن ما يدخل دمي يعالجه كبدي بقدر، والجرعة التي تناسب أمي قد تضرّني، وبعض الأدوية خطر مع بعض. وحفظ النفس أمانة، والدواء بلا علم قد يضر ولو حسنت النية؛ والنبي ﷺ نهى عن الضرر.","reference":"ابن ماجه 2341","hadith":["ibnmajah:2341"],"cards":[{"key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","text":"لا ضرر ولا ضرار","narration":false,"source":"ابن ماجه 2341","grade":"حسن","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني"}],"verses":[]},{"situation":"زميلي يأخذ حقنة قبل الغداء ويقول إن عنده سكري.","science":"بنكرياسه لا يصنع رسالة السكر فيأخذها حقناً؛ يعيش حياة كاملة ويلعب مثلنا، وقد يحتاج أحياناً أن يأكل شيئاً سريعاً.","action":"لا أحدّق ولا أسأل أمام الناس؛ إن أحب أن يحكي سمعت؛ وإن احتاج شيئاً سريعاً ساعدته وأخبرت المعلم.","value":"الستر والرحمة؛ المريض أخي.","why":"لماذا لا أسأل أمام الجميع؟ لأن جسمه شأنه، والسؤال أمام الناس يحرجه؛ والنبي ﷺ وعد من يستر أخاه المسلم أن يستره الله يوم القيامة.","reference":"البخاري 2442","hadith":["bukhari:2442"],"cards":[{"key":"bukhari:2442","lead":"عن عبد الله بن عمر رضي الله عنهما أن رسول الله ﷺ قال:","text":"المسلم أخو المسلم، لا يظلمه ولا يُسلمه، ومن كان في حاجة أخيه كان الله في حاجته، ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة، ومن ستر مسلماً ستره الله يوم القيامة","narration":false,"source":"البخاري 2442؛ ومسلم 2580 بلفظ قريب","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كيف «يعرف» الكبد أن يتوقف عن التجدد حين يعود إلى حجمه الصحيح؟","why_open":"إشارات الحجم ما زالت تُدرَس؛ فهمها قد يساعد في الطب."}],"notebook":{"draw":"ارسم{|ي} المعدة وأول الأمعاء، والكبد فوق يميناً والمرارة تحته والبنكرياس خلف المعدة، وأنابيب العصارات إلى الأمعاء بلون، ووعاء الدم من الأمعاء إلى الكبد بلون آخر. المستوى ب: {أضف|أضيفي} رسالة البنكرياس إلى الدم.","label":["الكبد","المرارة","البنكرياس","أنبوب الصفراء","أنبوب البنكرياس","الدم إلى الكبد","— ب: رسالة إلى الدم"],"write":"أشرح بكلماتي: لماذا لا يمرّ الطعام نفسه بالكبد؟ وماذا يفعل البنكرياس؟ وكيف تساعد الصفراء دون أن تهضم؟ وكيف يبقى في دمي سكر بين الوجبات؟ ولماذا لا آخذ دواء إلا مع أهلي؟"},"imgs":["U06.L03-E1","U06.L03-E2","U06.L03-E3","U06.L03-E4","U06.L03-E5","U06.L03-E6","U06.L03-exp","U06.L03-hist1","U06.L03-hist2","U06.L03-letter","U06.L03-life","U06.L03-title-boy","U06.L03-title-girl"]};
