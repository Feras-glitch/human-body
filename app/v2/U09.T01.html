const LD = {"id":"U09.T01","lesson":"U09.L01","first":false,"title":"اختبار: الجلد: درع حي يتجدد","lessonTitle":"الجلد: درع حي يتجدد","concepts":[],"check":[],"items":[{"id":"U09.L01.A1.a","objective":"U09.L01.O1","level":"A","type":"choose","prompt":"الطبقة الخارجية من الجلد اسمها:","options":["الأدمة","طبقة الدهن","البشرة","الغشاء"],"answer":2,"explanation":"البشرة في الخارج، والأدمة تحتها.","feedback_by_option":{"0":"الأدمة تحت البشرة.","1":"طبقة الدهن تحت الأدمة.","3":"الغشاء يحيط بالخلية الواحدة."},"alt":{"prompt":"الطبقة التي فيها الأوعية والأعصاب وجذور الشعر:","options":["البشرة","الأدمة","سطح الجلد","العظم"],"answer":1,"explanation":"الأدمة تحت البشرة وفيها الأوعية والأعصاب وغدد العرق وجذور الشعر.","feedback_by_option":{"0":"البشرة فوقها، بلا أوعية.","2":"السطح خلايا ميتة.","3":"العظم ليس من الجلد."}}},{"id":"U09.L01.A1.b","objective":"U09.L01.O1","level":"A","type":"true_false_why","prompt":"«بشرتي تتبدل كلها تقريباً كل شهر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ خلايا جديدة تتكوّن في أسفل البشرة وتصعد إلى السطح في نحو أربعة أسابيع، والقديمة تتساقط.","rubric":"R1","detects":"M97","alt":{"prompt":"«خلايا سطح الجلد حية تنقسم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ خلايا السطح ميتة مسطحة تتساقط، والحية تنقسم في أسفل البشرة."}},{"id":"U09.L01.A1.c","objective":"U09.L01.O1","level":"A","type":"choose_reason","prompt":"نلصق شريطاً لاصقاً شفافاً على ظهر اليد وننزعه برفق، فنرى عليه بالعدسة قشوراً صغيرة جداً. ما هي؟","options":["غبار من الهواء فقط","خلايا ميتة من سطح البشرة","قطرات عرق جفّت على الجلد","جذور شعر صغيرة انقلعت"],"answer":1,"explanation":"سطح البشرة خلايا ميتة تتساقط كل يوم دون أن نراها بالعين وحدها.","feedback_by_option":{"0":"قد يعلق غبار، لكن القشور الكثيرة خلايا من الجلد.","2":"العرق ماء يجف ولا يصنع قشوراً.","3":"جذور الشعر في الأدمة، والشريط لا يصلها."},"detects":"M29","alt":{"prompt":"لماذا لا نرى خلايا الجلد وهي تتساقط؟","options":["لأنها لا تتساقط أصلاً","لأنها أصغر من أن تراها العين وحدها","لأنها تذوب في العرق فوراً","لأنها تتساقط في النوم فقط"],"answer":1,"explanation":"الخلايا أصغر من أن تُرى بالعين وحدها؛ العدسة والمجهر يكشفانها.","feedback_by_option":{"0":"تتساقط كل يوم، والشريط يكشفها.","2":"لا تذوب؛ تتساقط قشوراً صغيرة.","3":"تتساقط طوال اليوم."}}},{"id":"U09.L01.A2.a","objective":"U09.L01.O2","level":"A","type":"choose","prompt":"أيّ هذه ليس من أعمال الجلد؟","options":["يمنع الماء أن يتسرّب من الجسم","يخبر الدماغ باللمس والحرارة","يضخ الدم إلى الجسم","يمنع الميكروبات أن تدخل"],"answer":2,"explanation":"القلب يضخ الدم؛ الجلد حاجز يحسّ.","feedback_by_option":{"0":"هذا من أعماله: حاجز للماء.","1":"هذا من أعماله: أعصاب الأدمة تحسّ.","3":"هذا من أعماله: حاجز للميكروبات."},"alt":{"prompt":"أيّ هذه من أعمال الجلد؟","options":["يهضم الطعام","يصنع خلايا الدم","يحسّ بالبرد والألم","ينقل الأكسجين إلى الخلايا"],"answer":2,"explanation":"في الأدمة أعصاب تحسّ باللمس والدفء والبرد والألم.","feedback_by_option":{"0":"الهضم في الجهاز الهضمي.","1":"خلايا الدم تُصنع في نخاع العظم.","3":"الدم ينقل الأكسجين."}}},{"id":"U09.L01.A2.b","objective":"U09.L01.O2","level":"A","type":"true_false_why","prompt":"«لو لم يكن لنا جلد لفقد جسمنا ماءه بسرعة ودخلته الميكروبات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الجلد حاجز يحفظ ماء الجسم ويمنع الميكروبات، ولذلك يحتاج من أصاب الحرق جلده رعاية خاصة.","rubric":"R1","alt":{"prompt":"«طبقة الدهن تحت الجلد لا عمل لها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تخفف الصدمات وتحفظ دفء الجسم."}},{"id":"U09.L01.A2.c","objective":"U09.L01.O2","level":"A","type":"explain_open","prompt":"{لمست|لمستِ} كوب شاي ساخن ف{أبعدت|أبعدتِ} يدك{|ِ}. ما دور الجلد في ذلك؟","answer":"أعصاب في الأدمة أحسّت بالحرارة وأخبرت الحبل الشوكي والدماغ، فسُحبت اليد قبل أن يحترق الجلد.","rubric":"R1"},{"id":"U09.L01.A3.a","objective":"U09.L01.O3","level":"A","type":"choose_reason","prompt":"قال ولد: «جلدي أفتح من جلد صديقي، إذن أنا أقوى منه». ما الصواب؟","options":["صدق، فالأفتح أقوى دائماً","أخطأ؛ اللون من كمية الميلانين ولا علاقة له بالقوة","صدق، فالأغمق أضعف في الشمس","أخطأ؛ الأغمق هو الأقوى دائماً"],"answer":1,"explanation":"اللون من كمية الميلانين، وعدد الخلايا الصانعة متقارب؛ لا قوة ولا قيمة في اللون.","feedback_by_option":{"0":"اللون لا يصنع القوة.","2":"الميلانين الأكثر يحمي من الشمس أكثر، ولا يُضعف.","3":"ولا الأغمق أقوى؛ اللون لا يصنع القوة."},"detects":"M98","alt":{"prompt":"الناس الذين جلدهم أغمق عندهم:","options":["خلايا جلد أكثر بكثير","ميلانين أكثر تصنعه خلاياهم","دم أكثر تحت الجلد","عظام أقوى من غيرهم"],"answer":1,"explanation":"عدد الخلايا الصانعة متقارب؛ الفرق في كمية الميلانين.","feedback_by_option":{"0":"عدد الخلايا الصانعة متقارب.","2":"كمية الدم ليست سبب اللون.","3":"اللون لا علاقة له بالعظام."}}},{"id":"U09.L01.A3.b","objective":"U09.L01.O3","level":"A","type":"choose","prompt":"يوم غائم في رحلة إلى الشاطئ. ما التصرف الصحيح؟","options":["لا حاجة إلى وقاية لأن الشمس مختفية","أحمي جلدي بالقبعة والملابس وواقي الشمس، فالأشعة تعبر الغيوم","أبقى في الشمس طويلاً لأسمرّ فأتحمّى","أضع الواقي مرة واحدة في الصباح فيكفي اليوم كله"],"answer":1,"explanation":"جزء كبير من الأشعة يعبر الغيوم؛ والواقي يُعاد كل ساعتين وبعد السباحة.","feedback_by_option":{"0":"يمكن أن نحترق في يوم غائم.","2":"السمرة لا تكفي للوقاية، وتكرار الحرق يؤذي الجلد.","3":"يُعاد كل ساعتين وبعد السباحة والعرق."},"alt":{"prompt":"متى نبحث عن الظل أكثر في الأيام المشمسة؟","options":["في الصباح الباكر جداً","في منتصف النهار","بعد غروب الشمس","في الليل"],"answer":1,"explanation":"الأشعة أقوى في منتصف النهار، فنقلل البقاء في الشمس حينها.","feedback_by_option":{"0":"الأشعة أضعف في الصباح الباكر.","2":"لا أشعة شمس بعد الغروب.","3":"لا شمس في الليل."}}},{"id":"U09.L01.A3.c","objective":"U09.L01.O3","level":"A","type":"true_false_why","prompt":"«الميلانين يحمي خلايا الجلد من جزء من أشعة الشمس الضارة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يمتص جزءاً من الأشعة فوق البنفسجية فيحمي الخلايا، لكنه لا يكفي وحده.","rubric":"R1","alt":{"prompt":"«السمرة تعني أن الجلد صار محمياً تماماً من الشمس». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ السمرة ميلانين زاد بعد التعرض للشمس، ولا يكفي وحده، فنستمر في الوقاية."}},{"id":"U09.L01.A4.a","objective":"U09.L01.O4","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} مراحل التئام الخدش.","options":["يتخثر الدم فيتوقف النزف","يجفّ فيصير قشرة","يحمرّ المكان قليلاً لأن الجسم يدافع عنه","يُبنى جلد جديد تحت القشرة","تسقط القشرة وحدها"],"answer":[0,1,2,3,4],"explanation":"تخثر، فقشرة، فاحمرار ودفاع، فجلد جديد، ثم تسقط القشرة.","alt":{"prompt":"{رتّب|رتّبي} ما {تفعله|تفعلينه} حين {تنخدش|تنخدشين}.","options":["أضغط برفق إن خرج دم","أغسل الخدش بماء وصابون لطيف","أغطيه بضمادة نظيفة","أترك القشرة حتى تسقط وحدها"],"answer":[0,1,2,3],"explanation":"أوقف الدم، ثم أنظّف، ثم أغطي، ثم أترك القشرة."}},{"id":"U09.L01.A4.b","objective":"U09.L01.O4","level":"A","type":"choose_reason","prompt":"لماذا لا ننزع قشرة الجرح؟","options":["لأنها جميلة فنتركها","لأنها تحمي ما تحتها حتى يُبنى الجلد الجديد","لأن الجرح لا يلتئم إلا إذا بقيت سنة","لأن نزعها يجعل الدم يتوقف"],"answer":1,"explanation":"القشرة غطاء يحمي من الميكروبات، ونزعها يبطئ الالتئام ويزيد الأثر.","feedback_by_option":{"0":"السبب حمايتها لا شكلها.","2":"تسقط وحدها بعد أسابيع حين يُبنى الجلد.","3":"نزعها قد يعيد النزف."},"detects":"M99","alt":{"prompt":"خدش في ركبتك{|ِ} عليه قشرة تحكّك{|ِ}. ماذا {تفعل|تفعلين}؟","options":["أنزعها لأرتاح","أتركها وأغطيها إن احتاجت","أحكّها بقوة حتى تسقط","أضع عليها تراباً لتجف"],"answer":1,"explanation":"القشرة تحمي، والحكة من علامات البناء تحتها.","feedback_by_option":{"0":"نزعها يبطئ الالتئام ويزيد الأثر.","2":"الحكّ ينزعها ويؤذي الجلد الجديد.","3":"التراب يُدخل الميكروبات."}}},{"id":"U09.L01.A4.c","objective":"U09.L01.O4","level":"A","type":"explain_open","prompt":"متى {تخبر|تخبرين} الكبار فوراً عن جرح؟ {اذكر|اذكري} علامتين.","answer":"إن لم يتوقف النزف بعد عشر دقائق من الضغط، أو زاد الاحمرار والألم والانتفاخ، أو ظهر صديد أصفر أو أخضر، أو كان الجرح عميقاً أو كبيراً.","rubric":"R1"},{"id":"U09.L01.A5.a","objective":"U09.L01.O5","level":"B","type":"choose","prompt":"المادة القوية التي تملأ خلايا البشرة وهي تصعد، ومنها الشعر والأظفار:","options":["الميلانين","الكيراتين","الأدرينالين","اللعاب"],"answer":1,"explanation":"الكيراتين يجعل خلايا البشرة صلبة، ومنه الشعر والأظفار.","feedback_by_option":{"0":"الميلانين يصنع اللون.","2":"الأدرينالين مادة الخوف.","3":"اللعاب في الفم."},"alt":{"prompt":"أين تكون البشرة أسمك؟","options":["عند المرفق","في باطن القدم","على الجفن","خلف الركبة"],"answer":1,"explanation":"باطن القدم يحمل الوزن، فبشرته قد تبلغ أربعة مليمترات.","feedback_by_option":{"0":"عند المرفق نحو ثلث مليمتر.","2":"الجفن من أرقّ المواضع.","3":"خلف الركبة رقيقة نحو ثلث مليمتر."}}},{"id":"U09.L01.A5.b","objective":"U09.L01.O5","level":"B","type":"true_false_why","prompt":"«الندبة جلد مثل الجلد الأصلي تماماً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الندبة نسيج يسدّ الجرح العميق، أصغر منه لكنه أضعف وأقل مرونة من الجلد حوله.","rubric":"R1","alt":{"prompt":"«الخدش السطحي في البشرة يعود غالباً جلداً كما كان». صح أم خطأ؟ ولماذا؟","answer":"صح؛ البشرة تتجدد من أسفلها، فالخدش الذي لا يصل الأدمة يُبنى مكانه جلد جديد."}},{"id":"U09.L01.A5.c","objective":"U09.L01.O5","level":"B","type":"explain_open","prompt":"لماذا تحتاج البشرة في باطن القدم أن تكون أسمك منها عند المرفق؟","answer":"باطن القدم يحمل وزن الجسم ويحتك بالأرض كل يوم، فالبشرة الأسمك بالكيراتين تحميه؛ والمرفق يحتاج جلداً رقيقاً يتمدد مع الثني.","rubric":"R1"}],"transfer":[{"id":"U09.L01.T1","objective":"U09.L01.O4","type":"explain_open","prompt":"أخوك{|ِ} الصغير سقط في الحديقة فانخدشت يده، وفي الخدش تراب. ماذا {تفعل|تفعلين} خطوة خطوة؟ ولماذا؟","answer":"أطمئنه، وأغسل يديّ، ثم أغسل الخدش بماء وصابون لطيف لأزيل التراب والميكروبات، وأضغط برفق إن نزف، وأغطيه بضمادة نظيفة، وأخبر الكبار؛ ولا ينزع القشرة لأنها تحمي الجلد الجديد.","level":"A","rubric":"R1"},{"id":"U09.L01.T2","objective":"U09.L01.O5","type":"explain_open","prompt":"عامل يمشي حافياً سنوات صار باطن قدمه سميكاً قاسياً. {فسّر|فسّري} ذلك بما {تعرفه|تعرفينه} عن البشرة.","answer":"البشرة تتجدد باستمرار، ومع الاحتكاك الكثير تصير أسمك بخلايا ممتلئة بالكيراتين تحمي ما تحتها.","level":"B","rubric":"R1"}],"recall":[{"id":"U09.L01.D1","objective":"U09.L01.O1","type":"choose","prompt":"خلايا سطح الجلد:","options":["حية تنقسم","ميتة تتساقط","أعصاب تحسّ"],"answer":1,"explanation":"الحية في أسفل البشرة، والسطح ميت يتساقط.","level":"A","feedback_by_option":{"0":"الحية في أسفل البشرة.","2":"الأعصاب في الأدمة."}},{"id":"U09.L01.D2","objective":"U09.L01.O1","type":"choose","prompt":"الطبقة التي فيها الأوعية وجذور الشعر:","options":["البشرة","طبقة الدهن","الأدمة"],"answer":2,"explanation":"الأدمة تحت البشرة.","level":"A","feedback_by_option":{"0":"البشرة فوقها بلا أوعية.","1":"طبقة الدهن تحت الأدمة."}},{"id":"U09.L01.D3","objective":"U09.L01.O2","type":"choose","prompt":"من أعمال الجلد:","options":["يمنع الماء والميكروبات","يضخ الدم","يهضم الطعام"],"answer":0,"explanation":"الجلد حاجز يحسّ.","level":"A","feedback_by_option":{"1":"القلب يضخ الدم.","2":"الهضم في الجهاز الهضمي."}},{"id":"U09.L01.D4","objective":"U09.L01.O3","type":"choose","prompt":"لون الجلد يأتي من:","options":["عدد العظام","كمية الميلانين","قوة الجسم"],"answer":1,"explanation":"كمية الميلانين التي تصنعها الخلايا.","level":"A","feedback_by_option":{"0":"العظام لا تصنع اللون.","2":"اللون لا علاقة له بالقوة."}},{"id":"U09.L01.D5","objective":"U09.L01.O4","type":"choose","prompt":"قشرة الجرح:","options":["أنزعها لأشفى أسرع","أتركها تحمي الجرح","أحكّها حتى تسقط"],"answer":1,"explanation":"تحمي ما تحتها حتى يُبنى الجلد الجديد.","level":"A","feedback_by_option":{"0":"نزعها يبطئ الالتئام.","2":"الحكّ ينزعها."}},{"id":"U09.L01.D6","objective":"U09.L01.O3","type":"choose","prompt":"في يوم غائم:","options":["يمكن أن أحترق بالشمس","لا أحترق أبداً","لا أحتاج قبعة"],"answer":0,"explanation":"جزء كبير من الأشعة يعبر الغيوم.","level":"A","feedback_by_option":{"1":"الأشعة تعبر الغيوم.","2":"القبعة تحمي في الغيم أيضاً."}},{"id":"U09.L01.D7","objective":"U09.L01.O5","type":"choose","prompt":"الجرح العميق قد يلتئم بـ:","options":["ندبة أضعف من الجلد حوله","جلد أقوى من الأصلي","عظم صغير"],"answer":0,"explanation":"الندبة تسدّ الجرح العميق، لكنها أضعف وأقل مرونة.","level":"B","feedback_by_option":{"1":"الندبة أضعف لا أقوى.","2":"لا يتكوّن عظم في الجلد."}}]};
