const LD = {"id":"U06.L04","first":false,"title":"الامتصاص ونهاية الطريق","driving_question":"{اسم}، كيف يعبر السكر من داخل الأمعاء إلى الدم؟ ولماذا أمعاؤك{|ِ} الدقيقة أطول منك{|ِ} أربع مرات وملفوفة كالمنشفة؟ وماذا يبقى في النهاية؟","central_fact":"الامتصاص في الأمعاء الدقيقة: الغذاء المهضوم يعبر جداراً رقيقاً مبطّناً بملايين الخملات إلى الدم؛ ثم تمتص الأمعاء الغليظة الماء وتحوّل الباقي إلى براز يخرج.","next":"U06.L05","nexts":[{"id":"U06.L05","gated":false},{"id":"U06.L06","gated":false}],"hook":{"text":"{اسم}، لو مددنا أمعاءك{|ِ} الدقيقة على الأرض، فكم طولها برأيك{|ِ}؟","options":["بطول ذراعي","بطولي تقريباً","أطول مني مرتين إلى أربع مرات","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive"],"highlight":["small_intestine"],"zoom":"abdomen","animate":"unroll"},"text":"خرجت الدفعة من المعدة، وصُبّت عليها عصارات البنكرياس والصفراء في أول متر — والآن هي في الأمعاء الدقيقة: أنبوب رفيع كإصبعك{|ِ} لكنه طويل جداً: نحو 3 إلى 5 أمتار في الكبار، أطول منك{|ِ} مرتين إلى أربع مرات، ملفوف في بطنك{|ِ} كخرطوم في صندوق. وهي «دقيقة» لرفعها لا لقصرها. هنا، على مدى ساعات، يكتمل الهضم: النشا صار سكراً، والبروتين قطعاً صغيرة، والدهون أجزاء أصغر. كل شيء جاهز للعبور."},{"id":"E2","level":"A","atlas":{"layers":["digestive","circulatory"],"highlight":["villus","capillary"],"zoom":"villus","animate":"absorb"},"text":"والعبور هو الامتصاص: اللحظة التي يصير فيها الطعام جزءاً منك{|ِ}. جدار الأمعاء الدقيقة رقيق جداً، وخلفه مباشرة شعيرات دموية رفيعة الجدار كالتي رأيناها في الرئة. السكر والقطع الصغيرة تعبر الجدار وتدخل الدم. وتذكّر{|ي}: هذا الدم يذهب أولاً إلى الكبد الذي يخزّن ويعالج، ثم إلى القلب فإلى كل خلية. اللقمة التي {أكلتها|أكلتِها} صباحاً صارت الآن سكراً في دمك{|ِ} — هذا هو الجواب الذي وعدناك{|ِ} به منذ الوحدة الماضية."},{"id":"E3","level":"A","atlas":{"layers":["digestive"],"highlight":["villi"],"zoom":"villus","animate":"zoom_villi"},"text":"لكن لماذا كل هذا الطول؟ وانظر{|ي} إلى الجدار من الداخل بالعدسة: ليس أملس. مطوي، وعلى الطيات ملايين النتوءات الدقيقة كالأصابع اسمها الخملات، وفي كل خملة شعيرات دموية. تذكّر{|ي} الحويصلات في الرئة: مئات الملايين من الأكياس الصغيرة بدل كيسين — للسطح. الفكرة نفسها هنا: منشفة لا ورقة. كل هذا الطول وكل هذه النتوءات لشيء واحد: سطح ضخم يعبر منه الغذاء بسرعة — نحو ثلاثين متراً مربعاً، غرفة كاملة مطوية في بطنك{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["digestive"],"highlight":["large_intestine","rectum"],"zoom":"abdomen","animate":"water_absorb"},"text":"وما لم يُمتَص يتابع إلى الأمعاء الغليظة: أنبوب أعرض وأقصر، نحو متر ونصف، يحيط بالدقيقة كالإطار. لا عصارات هضمية هنا؛ الهضم انتهى. عملها الأول: امتصاص ما بقي من الماء — الدقيقة أخذت معظمه، لكن ما يدخل الغليظة ما زال سائلاً، فتأخذ منه الماء الأخير إلى الدم على مدى يوم تقريباً فيصير الباقي أثخن. وعملها الثاني: تحويل الباقي إلى براز وتخزينه في آخرها، المستقيم، حتى يخرج. وفيها تريليونات من الميكروبات النافعة تأكل ما لم نهضمه وتصنع لنا فيتامينات — لها درس كامل بعد هذا."},{"id":"E5","level":"A","atlas":{"layers":["digestive"],"highlight":["rectum"],"zoom":"abdomen"},"text":"وماذا في البراز؟ ليس «الطعام الزائد». معظمه ماء؛ وفيه ما لم نستطع هضمه — الألياف من الخضار والفاكهة والحبوب — وميكروبات الأمعاء (كثير منها)، وخلايا متساقطة من بطانة الأمعاء التي تتجدد، وصبغة من الصفراء تعطيه لونه البنّي. حين يمتلئ المستقيم يرسل إشارة: الآن. والاستجابة في وقتها رعاية لجسمك{|ِ}: من كتم طويلاً أخذت الغليظة ماءً أكثر فجفّ وصعب. ثلاثة أصدقاء للخروج السهل: ماء كافٍ، وألياف، وحركة. وبعده: ماء ثم صابون لليدين — نظافة وطهارة معاً. كلمات علمية نقولها بهدوء."},{"id":"E6","level":"B","atlas":{"layers":["digestive","circulatory"],"highlight":["villus","lymph","portal_vein"],"zoom":"villus"},"text":"للمستوى ب: ليس كل ما يُمتَص يسلك الطريق نفسه. السكر والقطع الصغيرة من البروتين تدخل شعيرات الدم في الخملة وتذهب إلى الكبد أولاً. أما أجزاء الدهون فتُعاد تجميعها داخل خلية الجدار وتخرج إلى وعاء آخر في وسط الخملة — ليس دماً بل سائلاً شفافاً اسمه اللمف — يمشي في أنابيبه الخاصة ويصبّ في الدم قرب القلب، متجاوزاً الكبد. طريقان من جدار واحد. وحين نتعلم جهاز الدفاع سنعود إلى هذا السائل."},{"id":"E7","level":"B","atlas":{"layers":["digestive"],"highlight":["villi"],"zoom":"villus"},"text":"وكيف نقيس سطحاً لا نراه؟ طويلاً قالت الكتب: بمساحة ملعب تنس. لكن علماء قاسوا في 2014 بأدوات أدق فوجدوا نحو ثلاثين متراً مربعاً — غرفة لا ملعباً. من أين جاء الرقم القديم؟ من ضرب تقديرات ببعضها: الطول × المحيط × الطيات × الخملات × النتوءات، وكل تقدير فيه مبالغة صغيرة، والمبالغات تتضاعف. الدرس: رقم يتكرر في كل الكتب ليس دليلاً؛ من قاسه؟ وبماذا؟ وربما يتغير مرة أخرى."}],"practice":[{"id":"U06.L04.P1","after":"E4","objective":"U06.L04.O1","type":"choose_reason","prompt":"أين يعبر معظم الغذاء إلى الدم؟","options":["في المعدة","في الأمعاء الغليظة","في الأمعاء الدقيقة","في الكبد"],"answer":2,"explanation":"معظم الغذاء يعبر إلى الدم في الأمعاء الدقيقة، حيث الجدار رقيق والخملات كثيرة.","level":"A","feedback_wrong":"أين الجدار الرقيق والخملات؟","feedback_by_option":{"0":"المعدة تخلط وتبدأ الهضم؛ والامتصاص بعدها.","1":"الغليظة تمتص الماء؛ والغذاء امتُصّ قبلها.","3":"الكبد يستقبل الدم بعد الامتصاص؛ والطعام لا يمرّ به."}},{"id":"U06.L04.P2","after":"E3","objective":"U06.L04.O2","type":"choose_reason","prompt":"لماذا أمعاؤك{|ِ} الدقيقة طويلة ومبطّنة بخملات؟","options":["لتخزين الطعام أياماً حتى نجوع","لتطحن الطعام بالخملات كما تطحنه الأسنان","لأن البطن كبير فيمتلئ بالأمعاء","لزيادة السطح الذي يعبر منه الغذاء"],"answer":3,"explanation":"الطول والخملات يزيدان السطح الذي يعبر منه الغذاء، كما تمتص المنشفة أكثر من الورقة لأن سطحها أكبر.","level":"A","feedback_wrong":"ما الفرق بين المنشفة والورقة؟","feedback_by_option":{"0":"الأمعاء لا تخزّن الطعام أياماً؛ الطول للسطح.","1":"الخملات لا تطحن؛ هي نتوءات تزيد السطح.","2":"البطن ليس كبيراً؛ ولذلك تلتفّ الأمعاء الطويلة فيه كالخرطوم في صندوق."}},{"id":"U06.L04.P3","after":"E4","objective":"U06.L04.O3","type":"choose_reason","prompt":"ماذا تمتص الأمعاء الغليظة؟","options":["الماء","السكر","البروتين","الدهون"],"answer":0,"explanation":"الأمعاء الغليظة تمتص الماء مما بقي من الطعام.","level":"A","feedback_wrong":"ماذا حدث للإسفنجة؟","feedback_by_option":{"1":"السكر يُمتص في الأمعاء الدقيقة.","2":"البروتين يُمتص في الأمعاء الدقيقة.","3":"الدهون تُمتص في الأمعاء الدقيقة."}},{"id":"U06.L04.P4","objective":"U06.L04.O4","type":"predict","prompt":"طفل يشرب قليلاً ويكتم الحاجة ساعات. البراز غالباً:","options":["أجف وأصعب لأن الغليظة أخذت ماءً أكثر","أسهل وألين لأن الماء القليل يجعله أخف","لا يتغير؛ الكتم لا يؤثر في الأمعاء أبداً"],"answer":0,"explanation":"الغليظة تستمر في امتصاص الماء ما دام البراز فيها، فقلة الشرب وكتم الحاجة يجعلانه أجف وأصعب.","level":"A","feedback_wrong":"ما الذي تستمر الغليظة في فعله؟","feedback_by_option":{"1":"الماء القليل يجعل البراز أجف لا ألين.","2":"الغليظة تستمر في أخذ الماء ما دام البراز فيها؛ فالكتم يغيّره."}},{"id":"U06.L04.P5","objective":"U06.L04.O5","type":"choose_reason","prompt":"أجزاء الدهون بعد الامتصاص تذهب:","options":["إلى الدم ثم الكبد مباشرة","إلى المعدة","إلى اللمف ثم الدم قرب القلب","تبقى في الأمعاء"],"answer":2,"explanation":"في وسط الخملة وعاء لمفاوي تدخله أجزاء الدهون، ثم يصبّ اللمف في الدم قرب القلب.","level":"B","feedback_wrong":"أي وعاء في وسط الخملة؟","feedback_by_option":{"0":"هذا طريق السكر؛ والدهون تسلك طريقاً آخر.","1":"لا شيء يعود من الخملة إلى المعدة.","3":"الدهون تُمتص؛ لا تبقى في الأمعاء."}}],"check":[{"id":"U06.L04.C1","objective":"U06.L04.O1","type":"explain_open","prompt":"ما الامتصاص؟ وأين يحدث معظمه؟ ولماذا نقول إنه اللحظة التي يصير فيها الطعام جزءاً منك{|ِ}؟","answer":"عبور الغذاء المهضوم من الأمعاء إلى الدم؛ في الأمعاء الدقيقة عبر جدار رقيق إلى الشعيرات؛ بعده يصل الخلايا.","level":"A","rubric":"R1"},{"id":"U06.L04.C2","objective":"U06.L04.O2","type":"fix_model","prompt":"رسم زميل{ك|تكِ} الأمعاء قصيرة ملساء من الداخل. ما الخطآن؟","answer":"طويلة جداً (نحو 3 إلى 5 أمتار ملفوفة)، ومبطّنة بطيات وخملات لزيادة السطح.","level":"A","rubric":"R1"},{"id":"U06.L04.C3","objective":"U06.L04.O2","type":"explain_open","prompt":"ما الذي يجمع بين الحويصلات في الرئة والخملات في الأمعاء؟","answer":"كلاهما يزيد السطح لتبادل سريع عبر جدار رقيق مع شعيرات دموية.","level":"A","rubric":"R1"},{"id":"U06.L04.C4","objective":"U06.L04.O3","type":"true_false_why","prompt":"«البراز هو الطعام الزائد فقط». صح أم خطأ؟","answer":"خطأ؛ معظمه ماء وألياف لم تُهضم وميكروبات وخلايا متساقطة وصبغة الصفراء.","level":"A","rubric":"R1"},{"id":"U06.L04.C5","objective":"U06.L04.O4","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أصدقاء للخروج السهل، ولماذا الاستجابة في وقتها مهمة.","answer":"ماء وألياف وحركة؛ الكتم يترك الغليظة تأخذ ماءً أكثر فيجف ويصعب.","level":"A","rubric":"R1"},{"id":"U06.L04.C6","objective":"U06.L04.O5","type":"explain_open","prompt":"ارسم{|ي} بالكلمات الطريقين من الخملة.","answer":"سكر وقطع بروتين → شعيرات الدم → الكبد؛ أجزاء الدهون → وعاء اللمف → الدم قرب القلب.","level":"B","rubric":"R1"},{"id":"U06.L04.C7","objective":"U06.L04.O6","type":"true_false_why","prompt":"«سطح الأمعاء بمساحة ملعب تنس لأن كل الكتب تقول ذلك». صح أم خطأ؟","answer":"خطأ؛ قياس 2014 وجد نحو 30 متراً مربعاً؛ تكرار الرقم ليس دليلاً.","level":"B","rubric":"R1"}],"concepts":[{"id":"absorption","term":{"ar":"الامتصاص","en":"Absorption","zh":"吸收","pinyin":"xīshōu","match":["الامتصاص","امتصاص","تمتص","يمتص","يُمتَص"]},"priority":"core","atlas":{"layer":"digestive","element":"small_intestine"},"card":{"A":"عبور الغذاء المهضوم من داخل الأمعاء إلى الدم عبر جدار رقيق جداً. هنا يصير الطعام جزءاً منك{|ِ}.","B":"معظمه في الأمعاء الدقيقة؛ الماء والأملاح أيضاً في الغليظة."}},{"id":"small_intestine","term":{"ar":"الأمعاء الدقيقة","en":"Small intestine","zh":"小肠","pinyin":"xiǎocháng","match":["الأمعاء الدقيقة","أمعاء دقيقة","الدقيقة"]},"priority":"core","atlas":{"layer":"digestive","element":"small_intestine"},"card":{"A":"أنبوب رفيع طويل جداً ملفوف في بطنك{|ِ}؛ فيه يكتمل الهضم ويحدث معظم الامتصاص.","B":"نحو 3 إلى 5 أمتار في الجسم الحي (وتُقاس أطول بعد الوفاة حين ترتخي عضلاتها)؛ «دقيقة» لرفعها لا لقصرها."}},{"id":"villi","term":{"ar":"الخملات","en":"Villi","zh":"绒毛","pinyin":"róngmáo","match":["الخملات","خملات","خملة"]},"priority":"core","atlas":{"layer":"digestive","element":"villus"},"card":{"A":"ملايين النتوءات الدقيقة كالأصابع تبطّن الأمعاء الدقيقة، في كل منها شعيرات دموية؛ تجعل السطح الذي يعبر منه الغذاء ضخماً.","B":"على كل خملة نتوءات أدق؛ طيّات ثم خملات ثم نتوءات دقيقة: ثلاث طبقات من التكبير."}},{"id":"large_intestine","term":{"ar":"الأمعاء الغليظة","en":"Large intestine","zh":"大肠","pinyin":"dàcháng","match":["الأمعاء الغليظة","الغليظة"]},"priority":"core","atlas":{"layer":"digestive","element":"large_intestine"},"card":{"A":"أنبوب أعرض وأقصر يحيط بالدقيقة كالإطار؛ يمتص الماء مما بقي ويحوّل الباقي إلى براز يُخزَّن في آخره (المستقيم) حتى يخرج.","B":"لا عصارات هضمية فيه؛ يسكنه تريليونات الميكروبات النافعة — الدرس القادم."}}],"experiment":{"title":"المنشفة والورقة، وخيط بطول أمعائي","materials":["ورقة ملساء ومنشفة صغيرة بالحجم نفسه","قطّارة أو ملعقة ماء","خيط أو حبل طوله 5 أمتار وصندوق حذاء","إسفنجة وكوب ماء"],"steps":["ضع{|ي} الورقة والمنشفة جنباً إلى جنب. انظر{|ي} إلى المنشفة عن قرب: سطحها مليء بخيوط صغيرة ناتئة. أيهما سطحه أكبر فعلاً مع أن حجمهما واحد؟","قطّر{|ي} القدر نفسه من الماء على كل منهما. أيهما امتص أسرع وأكثر؟ هذه هي فكرة الخملات.","قِس{|ي} طولك{|ِ} بالخيط، ثم مدّ{|ي} الخيط كله (5 أمتار): هذا نحو أطول ما تكون الأمعاء الدقيقة في كبير حيّ. كم مرة طولك{|ِ}؟","الآن الفّ{|ي} الخيط كله ليدخل صندوق الحذاء. دخل؟ هكذا تُلفّ أمعاؤك{|ِ} في بطنك{|ِ}.","إسفنجة مبللة تماماً تمثل ما يدخل الأمعاء الغليظة. {اعصرها|اعصريها} قليلاً: هذا امتصاص الماء. {اعصرها|اعصريها} كثيراً: ماذا يحدث لما يبقى؟ هذا ما يحدث حين نكتم الحاجة طويلاً أو نشرب قليلاً.","اكتب{|ي}: لماذا الأمعاء طويلة ومبطّنة بنتوءات؟ وماذا يفعل الماء في الأمعاء الغليظة؟"],"safety":["الخيط لا يُلفّ حول العنق أو الأصابع.","لا تُسأل الأطفال عن عاداتهم في الحمام أمام الصف؛ الحديث عن الجسم عام وهادئ.","تُغسل اليدان بعد التجربة."],"expected":"المنشفة تمتص أسرع وأكثر لأن سطحها الحقيقي أكبر؛ الخيط نحو 4–5 أضعاف طول الطفل ويدخل الصندوق ملفوفاً؛ الإسفنجة المعصورة كثيراً يصير ما بقي فيها جافاً صلباً.","explain":"المنشفة والورقة بحجم واحد، لكن المنشفة مليئة بنتوءات فسطحها الحقيقي أكبر مرات — وهكذا الأمعاء الدقيقة: مبطّنة بملايين الخملات فتمتص الغذاء بسرعة إلى الدم. وطولها الكبير للسبب نفسه: سطح أكبر ووقت أطول للامتصاص، ملفوفاً كخيطك{|ِ} في الصندوق. وفي الأمعاء الغليظة يُمتَص الماء مما بقي: قليلاً فيبقى الباقي ليناً يخرج بسهولة، أو كثيراً — إن قلّ الشرب أو كتمنا الحاجة طويلاً — فيجف ويصعب. الماء والألياف والحركة ثلاثة أصدقاء للخروج السهل.","record":"أيهما امتص أكثر، ونسبة الخيط إلى طولك{|ِ}، وما حدث للإسفنجة، والجوابان.","alternatives":["بلا خيط: شريط قياس أو خطوات (5 أمتار ≈ 8 خطوات طفل).","بلا منشفة: ورق مطبخ مطوي مقابل ورقة ملساء."]},"find_the_error":[{"id":"FE1","atlas_variant":"short_smooth","error":"أمعاء قصيرة ملساء من الداخل","answer":"طويلة ملفوفة ومبطّنة بخملات","detects":"M63"},{"id":"FE2","atlas_variant":"waste_only","error":"«أنبوب الفضلات» مكتوبة على الأمعاء الدقيقة","answer":"مركز الهضم والامتصاص","detects":"M55"},{"id":"FE3","atlas_variant":"sugar_in_colon","error":"سهم السكر يعبر إلى الدم من الأمعاء الغليظة","answer":"الغليظة تمتص الماء؛ السكر عبر في الدقيقة","detects":"M62"}],"numbers":[{"text":"الأمعاء الدقيقة في الكبار نحو 3 إلى 5 أمتار في الجسم الحي — أطول من غرفة — ملفوفة في بطن بحجم كرة؛ وتُقاس أطول (6–7 أمتار) بعد الوفاة لأن عضلاتها ترتخي: الرقم يتبع طريقة القياس. والغليظة نحو متر ونصف.","source":["S3","S4"]},{"text":"سطح الامتصاص نحو 30 متراً مربعاً: غرفة كاملة من الجدار الرقيق مطوية في بطنك{|ِ}.","source":["S3"]},{"text":"زمن المرور يختلف بين الأشخاص ومع الوجبة؛ لا نضع للطفل مؤقتًا ثابتًا لوصول الطعام أو خروجه.","source":["S1"]}],"true_size":[{"text":"امشِ{|ي} عشر خطوات: هذا طول أمعائك{|ِ} الدقيقة في الكبار تقريباً — كلها ملفوفة الآن تحت سُرّتك{|ِ}.","source":["S4"]}],"animal":{"text":"تكون أمعاء الحيوانات العاشبة غالبًا أطول من أمعاء الحيوانات الآكلة للحيوانات، مع فروق كثيرة بين الأنواع. يساعد الطول ومواضع التخمر ووقت بقاء الطعام معًا في الاستفادة من الغذاء؛ فلا نحكم على غذاء الحيوان من طول أمعائه وحده.","source":["S5"]},"organ_letter":{"from":"خملة واحدة من ملايين","text":"أنا أصغر من حبة رمل، نتوء على جدار أمعائك{|ِ} الدقيقة، وفي داخلي شعيرات دم. حين يمرّ السكر أعبّره إلى دمك{|ِ} — أنا الباب الذي يصير عنده الطعام أنت{|ِ}. لست وحدي: ملايين مثلي تصطف على أمتار كثيرة، ولذلك تكفي وجبة لساعات. {أعطني|أعطيني} ماءً وأليافاً وحركة، ولا {تُطعمني|تُطعميني} على عجل. مع التحية، باب صغير في طريق طويل."},"history":[{"who":"هيلاندر وفاندريكس","origin":"السويد","where_when":"غوتنبرغ، 2014","did":"أعادا قياس مساحة سطح الأمعاء بأدوات حديثة ونشرا تقديراً نحو 30 م² بدل «ملعب التنس».","did_not":"لم يقيسا كل إنسان؛ التقدير متوسط وقد يُراجع.","method_lesson":"الرقم المتكرر يحتاج إعادة قياس لا إعادة نسخ.","source":["S3"]}],"how_we_know":{"text":"كيف نقيس مساحة سطح لا نراه؟ طويلاً قيل إن سطح الأمعاء الدقيقة بمساحة ملعب تنس. لكن ذلك الرقم بُني على تقديرات قديمة ضُربت ببعضها: الطول × المحيط × الطيّات × الخملات × النتوءات. حين عاد علماء في السويد عام 2014 وقاسوا بأدوات أدق في عينات حقيقية وجدوا نحو 30 متراً مربعاً — غرفة لا ملعباً. أقل، لكنه ما زال مدهشاً. الدرس: الرقم الذي يتكرر في الكتب ليس دليلاً؛ ارجع{|ي} إلى من قاس. وربما يتغير الرقم مرة أخرى.","limit_question":"ما الذي يُخفيه رسم الأمعاء المرتّبة الملوّنة عن الحقيقة؟"},"what_changed":["«مساحة ملعب تنس» صُحّحت إلى نحو 30 متراً مربعاً (2014).","ظُنت الأمعاء أنبوب فضلات؛ الصواب أنها مركز الهضم والامتصاص."],"model_limits":["الخملات في الرسم كبيرة كالأصابع؛ الحقيقة أقل من ملّيمتر ولا تُرى إلا بالعدسة.","الأمعاء في الرسم مرتّبة؛ الحقيقة ملفوفة بلا نظام ظاهر وتتحرك.","الألوان ترميز: الدقيقة ليست وردية والغليظة ليست بنّية.","(صورة title-boy) الحبل نموذج للطول والالتفاف، وليس طول أمعاء مقاسًا من الصورة.","(صورة title-girl) الحبل نموذج للطول والالتفاف، وليس طول أمعاء مقاسًا من الصورة.","(صورة title-girl) نُقل تكبير الأمعاء إلى دائرة منفصلة فوق الحبل بدل نافذة البطن؛ بقية الفكرة محفوظة.","(صورة E1) تمثيل مفرود للأمعاء؛ الثنيات أقل عددًا ومنتظمة لتسهيل القراءة ولا تعكس ترتيبها الدقيق أو طولها النسبي الحقيقي.","(صورة E2) السكريات والأحماض الأمينية مبسطة كنقاط/خرز منفصل؛ البروتين الكامل لا يعبر إلى الدم بهذه الصورة. الامتصاص عبر خلايا الظهارة ثم الشعيرات، لا ثقوب مفتوحة. ذُكر الكبد كوجهة تالية.","(صورة E3) تسلسل تكبير مختلف المقاييس؛ الزغيبات الدقيقة على السطح القِمّي للخلايا المبطنة للخملة، وليست خملات ثانية مستقلة بالحجم المرسوم. المنشفة نموذج لزيادة السطح لا لنسيج الأمعاء أو آلية الامتصاص.","(صورة E4) امتصاص الماء ممثل بقطرات خارجية؛ المحتوى لم يُجسّد عمدًا ولا يوجد براز أو مرحاض. أكثر امتصاص الماء يجري أيضًا في الأمعاء الدقيقة، وليس حصرًا في الغليظة. نهاية الأنبوب سهم مجرد.","(صورة E5) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات.","(صورة E6) الوعاء الحليبي يرمز إلى نقل معظم الدهون طويلة السلسلة بعد تعبئتها ككيلوميكرونات؛ توجد استثناءات مثل الأحماض الدهنية القصيرة/المتوسطة إلى الدم البابي. السهم إلى القلب اختصار للعودة اللمفية إلى الأوردة قربه وليس فتحة مباشرة في القلب.","(صورة E7) مقارنة الملعب/الغرفة تقدير تربوي وليست قياسًا لشخص بعينه؛ اعتمدت دراسة ٢٠١٤ تقديرًا وسطيًا قرابة ٣٢ م²، يتغير حسب طريقة الحساب. في الرسم لا يوجد مجهر حديث إلى جوار المقارنة.","(صورة exp) منشفة/ورقة وإسفنجة نماذج للسطح والماء، وليست برهانًا على آلية النقل الخلوي. الكارت الرابع مقسوم داخليًا لإظهار عصر خفيف ثم أقوى.","(صورة letter) الوجه تشخيص قصصي مسموح في رسالة العضو فقط؛ الأحجام والابتسامات ليست تشريحًا حقيقيًا.","(صورة hist1) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة life) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات."],"faith":{"opening":null,"closing":null},"life":[{"situation":"في المدرسة أكتم الحاجة إلى الحمام لأني أستحي أن أستأذن.","science":"الغليظة تستمر في امتصاص الماء فيجف البراز ويصعب ويؤلم؛ والكتم المتكرر يُربك إشارة الجسم.","action":"أستأذن بهدوء؛ الاستئذان للحمام حق عادي لا يستحيي منه أحد.","value":"رعاية الجسد مقدَّمة على حياء في غير موضعه.","why":"لماذا أستأذن ولو استحييت؟ لأن الحياء الذي يضر جسدي ليس هو الحياء الذي يحبه الله؛ والنبي ﷺ علّم الناس آداب قضاء الحاجة، ونهى أن يصلّي المرء وهو يحبس حاجته. فإن كان ذلك في الصلاة فكيف في الدرس؟","reference":"مسلم 560","hadith":["muslim:560"],"cards":[{"key":"muslim:560","lead":"عن عائشة رضي الله عنها قالت: سمعت رسول الله ﷺ يقول:","text":"لا صلاة بحضرة الطعام، ولا هو يدافعه الأخبثان","narration":false,"source":"مسلم 560","grade":"صحيح","grader":""}],"verses":[]},{"situation":"أخي الصغير يخرج من الحمام ويذهب ليأكل بلا غسل يديه.","science":"في البراز تريليونات الميكروبات؛ تنتقل باليد إلى الطعام والفم وتسبب الإسهال والمرض.","action":"أذكّره بلطف: ماء ثم صابون عشرين ثانية، وأفعلها معه.","value":"الطهارة شطر الإيمان؛ والنظافة حماية لي وللناس.","why":"لماذا الصابون وليس الماء فقط؟ لأن الميكروبات تلتصق بالدهون على الجلد والصابون يفتّتها (كما رأينا الصفراء والزيت!) فتنجرف مع الماء. والنبي ﷺ جعل الطهارة شطر الإيمان.","reference":"مسلم 223","hadith":["muslim:223"],"cards":[{"key":"muslim:223","lead":"عن أبي مالك الأشعري رضي الله عنه قال: قال رسول الله ﷺ:","text":"الطُّهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن — أو تملأ — ما بين السماوات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو، فبائع نفسه فمعتقها أو موبقها","narration":false,"source":"مسلم 223","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يختلف الناس في عدد مرات التبرز (من ثلاث في اليوم إلى ثلاث في الأسبوع) وكلهم أصحاء؟","why_open":"الألياف والماء والميكروبات والعضلات والعادات تتداخل؛ لا رقم واحد «صحيحاً» للجميع."}],"notebook":{"draw":"ارسم{|ي} الأمعاء الدقيقة ملفوفة والغليظة تحيط بها كالإطار، ثم دائرة تكبير لقطعة من الجدار بخملات وشعيرة دموية وسهم للسكر يعبر. المستوى ب: {أضف|أضيفي} وعاء اللمف في وسط الخملة بلون آخر.","label":["الأمعاء الدقيقة","الأمعاء الغليظة","المستقيم","خملة","شعيرة دموية","سكر يعبر","— ب: وعاء اللمف"],"write":"أشرح: أين يعبر الغذاء إلى الدم، ولماذا يساعد طول الأمعاء وخملاتها؟ وماذا تفعل الأمعاء الغليظة؟ ثم أكتب ثلاثة أشياء تجعل الخروج سهلاً، ولماذا يفيد كل منها."},"imgs":["U06.L04-E1","U06.L04-E2","U06.L04-E3","U06.L04-E4","U06.L04-E5","U06.L04-E6","U06.L04-E7","U06.L04-exp","U06.L04-hist1","U06.L04-letter","U06.L04-life","U06.L04-title-boy","U06.L04-title-girl"]};
