"],"answer":2,"explanation":"طلب لمس الأجزاء الخاصة مع طلب الكتمان غير مقبول: لا، ابتعد، أخبر.","feedback_by_option":{"0":"المساعدة في النظافة لطفل صغير يحتاجها مقبولة.","1":"فحص الطبيب لسبب صحي وأحد الوالدين حاضر مقبول.","3":"المصافحة تحية لا تخص الأجزاء الخاصة."},"alt":{"prompt":"متى يُقبل أن يفحص الطبيب الجسم؟","options":["في أي وقت بلا سبب","لسبب صحي، وأحد الوالدين حاضر، ويشرح السبب","إن طلب الطبيب أن يبقى ذلك سراً","إن كان الطفل وحده"],"answer":1,"explanation":"لسبب صحي، وأحد الوالدين حاضر، ومع شرح السبب.","feedback_by_option":{"0":"الفحص لسبب صحي.","2":"الطبيب لا يطلب سراً من الطفل.","3":"أحد الوالدين يكون حاضراً."}}},{"id":"U10.L03.A2.b","objective":"U10.L03.O2","level":"A","type":"true_false_why","prompt":"«إن طلب مني أحد أن أنظر إلى صور لأجزاء خاصة فلا بأس ما دام لم يلمسني». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ القاعدة تشمل النظر والصور أيضاً: أقول لا، وأبتعد، وأخبر كبيراً موثوقاً.","rubric":"R1","alt":{"prompt":"«لا أطلب من أحد أن يريني أجزاءه الخاصة، ولا أنظر إلى عورة أحد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ القاعدة نفسها أحترمها مع غيري."}},{"id":"U10.L03.A2.c","objective":"U10.L03.O2","level":"A","type":"explain_open","prompt":"{اذكر|اذكري} الحالتين اللتين يُقبل فيهما أن يلمس أحد أجزاءك{|ِ} الخاصة.","answer":"أن يساعدني أحد والديّ أو من يرعاني في النظافة أو الدواء حين أحتاج، وأن يفحصني الطبيب لسبب صحي وأحد والديّ معي ويشرح السبب.","rubric":"R1"},{"id":"U10.L03.A3.a","objective":"U10.L03.O3","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} ما {تفعله|تفعلينه} إن طلب منك{|ِ} أحد سراً عن جسمك{|ِ}.","options":["أقول: لا","أبتعد إلى مكان فيه ناس","أخبر كبيراً موثوقاً","إن لم يسمعني أخبر غيره"],"answer":[0,1,2,3],"explanation":"لا، ثم ابتعد، ثم أخبر، ثم أخبر غيره حتى يُسمع.","detects":"M112","alt":{"prompt":"إن {أخبرت|أخبرتِ} كبيراً ولم يسمعك{|ِ}:","options":["أسكت وأنسى ما حدث","أخبر كبيراً آخر من يد الأمان","أظن أنني أخطأت حين أخبرت","أنتظر حتى أكبر وأفهم وحدي"],"answer":1,"explanation":"أستمر في الإخبار حتى يسمعني أحد.","feedback_by_option":{"0":"لا تسكت؛ "U10.L03.O4","level":"A","type":"true_false_why","prompt":"«من يطلب سراً عن جسمي يكون غريباً دائماً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قد يكون غريباً وقد يكون شخصاً أعرفه، والقاعدة واحدة مع الجميع.","rubric":"R1","detects":"M111","alt":{"prompt":"«القاعدة نفسها مع الغريب ومع من أعرفه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لا أحد يرى أجزائي الخاصة أو يلمسها، غريباً كان أو معروفاً."}},{"id":"U10.L03.A4.c","objective":"U10.L03.O4","level":"A","type":"true_false_why","prompt":"«إن حدث للطفل شيء مزعج فهو المخطئ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الطفل لا يُلام أبداً، والمسؤولية على الكبار، ومن أخبر فعل الصواب.","rubric":"R1","detects":"M113","alt":{"prompt":"«من أخبر كبيراً موثوقاً بسر مزعج فعل الصواب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الإخبار هو الصواب، ولا يُلام الطفل."}},{"id":"U10.L03.A5.a","objective":"U10.L03.O5","level":"A","type":"choose","prompt":"باب غرفة أختك{|ِ} مغلق. قبل أن {تدخل|تدخلي}:","options":["أدخل بسرعة لآخذ ما أريد ثم أخرج","أطرق الباب وأستأذن","أنظر من الثقب لأعرف إن كانت مشغولة","أنادي من الداخل"],"answer":1,"explanation":"نطرق ونستأذن؛ هذه خصوصيتها.","feedback_by_option":{"0":"قد تكون تبدّل ملابسها؛ الاستئذان يحفظ خصوصيتها.","2":"النظر بلا إذن ليس احتراماً.","3":"تكون قد دخلت قبل أن تستأذن."},"alt":{"prompt":"صورة زميلك{|ِ}:","options":["أنشرها كما أريد","لا أصوّره ولا أنشر صورته بلا إذنه","أرسلها لأضحك الآخرين","أصوّره وهو لا يعلم"],"answer":1,"explanation":"صورة كل إنسان له؛ لا نصوّر ولا ننشر بلا إذن.","feedback_by_option":{"0":"الصورة ليست لك.","2":"السخرية تجرح.","3":"التصوير بلا علمه ليس احتراماً."}}},{"id":"U10.L03.A5.b","objective":"U10.L03.O5","level":"A","type":"true_false_why","prompt":"«لا بأس أن أضحك من جسم زميل ما دمت لا أقصد الأذى». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ السخرية من الجسم تجرح صاحبها وإن لم أقصد، والجسم أمانة لا يُسخر منه.","rubric":"R1","alt":{"prompt":"«أستأذن قبل أن أدخل غرفة مغلقة في بيتنا». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لكل واحد خصوصيته حتى في البيت."}},{"id":"U10.L03.A5.c","objective":"U10.L03.O5","level":"A","type":"explain_open","prompt":"زميلك{|ِ} يريد أن يصوّر ولداً وهو يبدّل ملابسه بعد الرياضة ليضحك الآخرون. ماذا {تقول|تقولين} له؟ ولماذا؟","answer":"أقول له لا، هذه خصوصيته وعورته، ولا نصوّر أحداً بلا إذنه ولا نسخر من جسم أحد؛ وأخبر المعلم إن أصرّ.","rubric":"R1"},{"id":"U10.L03.A6.a","objective":"U10.L03.O6","level":"B","type":"choose","prompt":"شخص على الإنترنت يقول إنه في عمرك{|ِ}، ويطلب صورة لك{|ِ} وعنوان بيتك{|ِ}. ماذا {تفعل|تفعلين}؟","options":["أرسل الصورة وحدها","لا أرد، وأخبر أهلي فوراً","أرسل العنوان وحده","أقابله لأتأكد"],"answer":1,"explanation":"لا صور ولا معلومات، ولا لقاء؛ أخبر أهلك فوراً.","feedback_by_option":{"0":"لا ترسل صوراً شخصية.","2":"العنوان يدل عليك؛ لا ترسله.","3":"لا لقاء بمن عرفته على الإنترنت إلا بإذن أهلك وحضورهم."},"alt":{"prompt":"بعض الناس على الإنترنت:","options":["يقولون الحقيقة في كل ما يكتبون عن أنفسهم","قد يتظاهرون بأنهم أطفال وهم كبار","يعرفون أهلك","أصدقاء موثوقون"],"answer":1,"explanation":"ليس كل ما يُكتب على الإنترنت صحيحاً.","feedback_by_option":{"0":"ليس كل ما يُكتب على الإنترنت صحيحاً.","2":"لا تعرف من هم حقاً.","3":"الموثوق كبير تعرفه في حياتك."}}},{"id":"U10.L03.A6.b","objective":"U10.L03.O6","level":"B","type":"true_false_why","prompt":"«إن أرسل إليّ أحد رسالة تخيفني أرد عليه بقوة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا أرد على الرسائل المخيفة، وأخبر أهلي فوراً، ولن أكون في مشكلة.","rubric":"R1","alt":{"prompt":"«لا أكتب اسم مدرستي أو عنوان بيتي لمن لا أعرفه على الإنترنت». صح أم خطأ؟ ولماذا؟","answer":"صح؛ هذه معلومات تدل عليّ."}},{"id":"U10.L03.A6.c","objective":"U10.L03.O6","level":"B","type":"explain_open","prompt":"صديق عرفته في لعبة على الإنترنت يريد أن يلقاك{|ِ} في الحديقة وحدك{|ِ}، ويقول: «لا تخبر أهلك». ماذا {تفعل|تفعلين}؟ ولماذا؟","answer":"لا أذهب، وأخبر أهلي فوراً؛ لا لقاء بمن عرفته على الإنترنت إلا بإذن أهلي وحضورهم، وطلب الكتمان علامة سر مزعج.","rubric":"R1"}],"transfer":[{"id":"U10.L03.T1","objective":"U10.L03.O4","type":"explain_open","prompt":"قالت لك{|ِ} صديقتك{|ِ} الصغيرة إن شخصاً طلب منها أن تكتم س
