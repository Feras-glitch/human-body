const LD = {"id":"U03.L04","first":false,"title":"قضية الوحدة: أفحص نموذج الدورة الدموية","driving_question":"أعطاك شخص رسماً للدورة الدموية فيه أخطاء. هل تستطيع كشفها كلها؟","central_fact":"لا معرفة جديدة في هذا الدرس: نستعمل ما ثبت في الدروس الثلاثة لفحص نماذج وتفسير مواقف وصياغة السؤال المفتوح للوحدة التالية.","next":null,"hook":{"text":"{اسم}، هذا رسم للدورة الدموية رسمه شخص على عجل، وفيه خمسة أخطاء. أنت{|ِ} الآن المفتش{|ة}. كم خطأً تستطيع{|ين} أن تجد{|ي} قبل أن نبدأ؟","options":["خطأ واحد","اثنان أو ثلاثة","كلها","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["circulatory","skeleton"],"highlight":[],"zoom":"body","animate":"none"},"text":"لن نشرح شيئاً جديداً اليوم. كل ما نحتاجه تعلمناه: أين القلب وماذا يفعل، وما أنواع الأوعية وأين يحدث التبادل، وما في الدم ومن أين يأتي. سنستعمل ذلك لنفحص النموذج ونفسّر مواقف من حياتنا. المفتش الجيد لا يحفظ الرسم الصحيح؛ يعرف لماذا هو صحيح."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["whole_loop"],"zoom":"body","animate":"rbc_trip"},"text":"لنتبع معاً كريّة حمراء واحدة مرة أخيرة في هذه الوحدة: شعيرات الرئتين، يسار القلب، شريان، شعيرة في عضلة الساق، وريد، يمين القلب، ثم الرئتان. في موضعين فقط يحدث التبادل. سمِّ{|ي} نوع الوعاء في كل مرحلة وأنت{|ِ} تتابع{|ين}."},{"id":"E3","level":"B","atlas":{"layers":["circulatory"],"highlight":["left_heart","right_heart"],"zoom":"heart_section","animate":"two_loops"},"text":"سؤال للمستوى ب قبل الفحص: لماذا لم يكتفِ جسمنا بحلقة واحدة كالسمكة؟ فكّر{|ي} في ما يحدث للأكسجين لو اختلط الدم العائد من الجسم بالدم العائد من الرئتين. وفكّر{|ي} لماذا جدار البطين الأيسر أسمك. ستحتاج{|ين} هذين الجوابين في القضية."}],"practice":[{"id":"U03.L04.P1","objective":"U03.L04.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة الكريّة الحمراء ابتداءً من شعيرات الرئتين.","options":["شعيرات الرئتين","يسار القلب","شريان","شعيرة في عضلة الساق","وريد","يمين القلب"],"answer":[0,1,2,3,4,5],"explanation":"تمسك الكريّة الأكسجين في الرئتين وتعود إلى يسار القلب، فيدفعها ف nhuán móxíng","match":["النموذج","نموذج","الدورة"]},"priority":"core","atlas":{"layer":"circulatory","element":"whole_loop"},"card":{"A":"رسم مبسط يجمع القلب والأوعية والدم في حلقة واحدة. كل نموذج يُظهر أشياء ويخفي أخرى.","B":"النموذج أداة للتفكير لا صورة للحقيقة: نسأل دائماً ماذا يُظهر وماذا يخفي وأين قد يُضلّل."}}],"experiment":{"title":"أعلّم شخصاً آخر","materials":["دفتر الأطلس برسومك{|ِ} من الدروس الثلاثة","شخص لم يدرس الوحدة (أخ، أخت، والد، صديق)"],"steps":["{اختر|اختاري} سؤالاً من الثلاثة: لماذا يدق القلب أسرع عند الركض؟ لماذا تبدو الأوردة زرقاء؟ لماذا يتوقف الجرح الصغير وحده؟","اشرح{|ي} الجواب للشخص الآخر برسمك{|ِ} في الدفتر، في دقيقتين، دون أن {تقرأ|تقرئي} من الكتاب.","اطلب{|ي} منه أن يسأل{|ك} سؤالاً واحداً. {أجب|أجيبي} إن عرفت{|ِ}، وإن لم تعرف{|ي} {فقل|فقولي}: «لا أعرف بعد، سأبحث في درس…».","سجّل{|ي} في الدفتر: السؤال الذي {سُئلته|سُئلتِه}، وهل عرفت{|ِ} الجواب.","إن أمكن، سجّل{|ي} شرحك{|ِ} صوتياً ليقيّمه معلمك{|ِ} أو ولي أمرك{|ِ} بالمعيار."],"safety":["لا يُطلب من أحد أن يُجرح أو يركض ليُثبت شيئاً؛ الشرح بالرسم والكلام."],"expected":"يكتشف الطفل أثناء الشرح ما يعرفه فعلاً وما كان يظن أنه يعرفه.","explain":"الشرح للآخر هو أصدق اختبار للفهم: ما استطعت{|ِ} شرحه برسمك{|ِ} فقد {فهمته|فهمتِه}؛ وما تعثرت{|ِ} فيه يدلّك{|ِ} على الدرس الذي تعود{|ين} إليه. والعلماء أنفسهم يفعلون ذلك: يعرضون أفكارهم على غيرهم ليجدوا الثغرات.","record":"سؤال السامع، وهل عرفتُ الجواب، وإلى أي درس أعود.","alternatives":["إن لم يوجد سامع: اشرح{|ي} لنفسك{|ِ} بصوت مسموع أمام المرآة أو سجّل{|ي} صوتك{|ِ}."]},"find_the_error":[{"id":"FE1","atlas_variant":"unit_wrong_model","error":"القلب في البطن","answer":"في الصدر خلف عظم القص","detects":"M05"},{"id":"FE2","atlas_variant":"unit_wrong_model","error":"سهم أكسجين من الشريان الكبير إلى العضلة","answer":"التبادل في الشعيرات فقط","detects":"M03"},{"id":"FE3","atlas_variant":"unit_wrong_model","error":"كلمة «دم أزرق» على الوريد","answer":"أحمر داكن؛ الأزرق ترميز","detects":"M04"},{"id":"FE4","atlas_variant":"unit_wrong_model","error":"سهم «يصنع الد "النموذج لا يُظهر كيف يدخل الأكسجين إلى الدم في الرئتين: هذا سؤالنا المفتوح.","مخطط قلب السمكة يركز على حلقة التدفق والحجرات الرئيسة ولا يمثل كل بناه.","الرسوم الورقية في مشهد التجربة قصصية لا تُستعمل لتتبع كل وعاء."],"faith":{"opening":null,"closing":{"text":"۞ وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَـٰلِحًۭا ۚ قَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ إِلَـٰهٍ غَيْرُهُۥ ۖ هُوَ أَنشَأَكُم مِّنَ ٱلْأَرْضِ وَٱسْتَعْمَرَكُمْ فِيهَا فَٱسْتَغْفِرُوهُ ثُمَّ تُوبُوٓا۟ إِلَيْهِ ۚ إِنَّ رَبِّى قَرِيبٌۭ مُّجِيبٌۭ","reference":"هود 61","grade":"قرآن","usage":"غاية","reflection":"خُلقنا لنعمر الأرض، وعمارتها تبدأ بأن نفهم ما بين أيدينا — وأقرب ما بين أيدينا أجسادنا. من ابن النفيس في القاهرة إلى مالبيغي في بولونيا، بنى العلم من سأل وفحص وقال «لا أعرف بعد» ثم بحث.","reviewed":false,"quran_key":"11:61","highlight":"هو أنشأكم من الأرض واستعمركم فيها","hl_words":[13,18],"cards":[]}},"life":[{"situation":"أخي الأصغر يسألني عن القلب.","science":"الشرح يثبّت ما فهمته ويكشف ما لم أفهمه.","action":"أشرح له برسمي، وأقول «لا أعرف بعد» حين لا أعرف ثم أبحث.","value":"ما تعلّمتُه ليس لي وحدي.","why":"لماذا أشرح وأنا لست معلماً؟ لأن الشرح يكشف ما لم أفهمه: حين أتلعثم أعرف أين الفجوة. والعلم الذي أحتفظ به لنفسي يذبل، والذي أعطيه ينمو عندي وعند أخي. وقول «لا أعرف بعد» ليس عيباً؛ هو أول خطوة في طريق الباحث.","cards":[],"verses":[]}],"open_questions":[{"q":"هل يمكن صنع دم صناعي كامل يغني عن التبرع بالدم؟","why_open":"حُلول جزئية تُجرَّب (بدائل تحمل الأكسجين)، ولم ينجح أحد بعد في صنع دم كامل يقوم بكل وظائف الدم الحقيقي."}],"notebook":{"draw":"ارسم{|ي} النموذج الصحيح كاملاً من الذاكرة: القلب في موضعه، شريان وشعيرات ووريد، الدم أحمر، سهم من نخاع العظم إلى الدم. المستوى ب: الحلقتان والبطين الأيسر أسمك. ثم اكتب{|ي} تحته: «ما لا يُظهره رسمي: …».","label":["القلب","شريان","شعيرات","وريد","نخاع العظم","— ب: الدورة الرئوية، الدورة الجهازية"],"write":"سؤالي المفتوح للوحدة التالية: «كيف …؟» وأين أتوقع الجواب."},"imgs":["U03.L04-E1","U03.L04-E2","U03.L04-E3","U03.L04-exp","U03.L04-hist1","U03.L04-letter","U03.L04-life","U03.L04-title-boy","U03.L04-title-girl"]};
