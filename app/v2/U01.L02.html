d":"U01.L02.P1","objective":"U01.L02.O1","type":"choose","prompt":"أي العبارات ملاحظة لا تخمين؟","answer":3,"explanation":"الملاحظة ما نراه بأعيننا دون تفسير. «ينظر إلى الأرض» نراه؛ أما الحزن والخوف والرغبة فتفسير لما نراه.","level":"A","options":["الطفل حزين","الطفل يريد أن يذهب","الطفل خائف","الطفل ينظر إلى الأرض"],"feedback_wrong":"أيها {تراه|ترينه} بعينك{|ِ} دون أن تفسّر{|ي}؟","feedback_by_option":{"0":"الحزن لا نراه؛ نرى وجهاً أو نظرة ثم نخمّن أنه حزين. ابحث{|ي} عن شيء تراه العين فعلاً.","1":"الرغبة في الذهاب في داخله، لا نراها. ابحث{|ي} عن شيء يفعله ونراه.","2":"الخوف تفسير لما نراه، وقد يكون مخطئاً. أي عبارة تصف ما تراه العين فقط؟"}},{"id":"U01.L02.P2","objective":"U01.L02.O2","type":"choose","prompt":"قراءاتك{|ِ}: 14، 22، 17. ما رقمك{|ِ}؟","answer":1,"explanation":"نرتب القراءات 14، 17، 22 ونأخذ الوسط: 17.","level":"A","options":["14","17","22","53"],"feedback_wrong":"رتّب{|ي} الأرقام من الأصغر إلى الأكبر {واختر|واختاري} الأوسط.","feedback_by_option":{"0":"14 أصغر القراءات. رتّب{|ي} الأرقام من الأصغر إلى الأكبر، ثم خذ{|ي} الذي في الوسط.","2":"22 أكبر القراءات. الرقم الذي نأخذه هو الذي يقع في الوسط بعد الترتيب.","3":"53 مجموع القراءات الثلاث، ونحن لا نجمع: نرتب ونأخذ الوسط."}},{"id":"U01.L02.P3","objective":"U01.L02.O3","type":"choose","prompt":"أي أداة تُظهر عظام اليد دون فتحها؟","answer":1,"explanation":"الأشعة السينية تُظهر العظام عبر الجلد، فنرى عظام اليد دون فتحها.","level":"A","options":["المجهر","الأشعة","السماعة","المسطرة"],"feedback_wrong":"أي أداة ترى عبر الجلد؟","feedback_by_option":{"0":"المجهر يكبّر الأشياء الصغيرة جداً، لكنه لا يرى عبر الجلد. أي أداة تُظهر ما تحت الجلد؟","2":"السماعة تُسمعنا أصواتاً من داخل الجسم، ولا تُظهر صورة العظام.","3":"المسطرة تقيس طول اليد من الخارج، ولا تكشف العظام داخلها."}},{"id":"U01.L02.P4","objective":"U01.L02.O4","type":"choose_reason","prompt":"قاس أحمد يده اليمنى بمسطرة 30 سم ويده اليسرى بمسطرة 20 سم. هل المقارنة عادلة؟","answer":0,"explanation":"في المقارنة العادلة نغيّر شيئاً واحداً فقط. هنا تغيّرت اليد والمسط  الحالتين في الوقت نفسه والحال نفسها وبالمسطرة نفسها.","level":"B","rubric":"R1"}],"concepts":[{"id":"observation","term":{"ar":"الملاحظة","en":"Observation","zh":"观察","pinyin":"guānchá"},"priority":"core","atlas":{"layer":"tools","element":"eye_tool"},"card":{"A":"ما أراه أو أسمعه أو أقيسه فعلاً. «اليد مرفوعة» ملاحظة؛ «يريد أن يسأل» تخمين.","B":"الملاحظة تُسجَّل كما هي؛ الاستنتاج يُبنى عليها ويُفحص. الخلط بينهما أول مصدر للخطأ."}},{"id":"measurement","term":{"ar":"القياس","en":"Measurement","zh":"测量","pinyin":"cèliáng","match":["قياس","نقيس","أقيس","قس"]},"priority":"core","atlas":{"layer":"tools","element":"ruler"},"card":{"A":"وضع رقم على ما نلاحظه بأداة: كم سنتيمتراً، كم مرة، كم ثانية.","B":"القياس يتغير قليلاً في كل مرة؛ نكرر ونأخذ الرقم الوسط، ونذكر الأداة التي قسنا بها."}},{"id":"fair_test","term":{"ar":"المقارنة العادلة","en":"Fair test","zh":"公平测试","pinyin":"gōngpíng cèshì"},"priority":"supporting","atlas":{"layer":"tools","element":"balance"},"card":{"B":"لنعرف أثر شيء واحد نغيّره وحده ونثبّت كل ما عداه. إن تغيّر شيئان معاً لم نعرف أيهما السبب."}},{"id":"instrument","term":{"ar":"الأداة الكاشفة","en":"Instrument","zh":"仪器","pinyin":"yíqì"},"priority":"supporting","atlas":{"layer":"tools","element":"microscope"},"card":{"A":"المجهر يكبّر الصغير، والأشعة السينية ترى العظم تحت الجلد، والسماعة تسمع القلب. الأداة تكشف ما لا تراه العين؛ ولكل أداة خطأ صغير، لذلك نكرر.","B":"كل أداة لها حدود أيضاً؛ ما لا تراه الأداة الحالية قد تراه أداة لاحقة."}}],"experiment":{"title":"أقيس زمن ردّ فعلي بالمسطرة","materials":["مسطرة 50 سم أو متر خشبي (مسطرة 30 سم قد تكون قصيرة للأطفال)","زميل أو بالغ","جدول في دفتر الأطلس"],"steps":["اجلس{|ي} وضع{|ي} مرفقك{|ِ} على الطاولة وافتح{|ي} الإبهام والسبابة قليلاً.","يمسك زميلك{|ِ} المسطرة عمودياً بحيث يكون الصفر بين إصبعيك{|ِ} دون أن {تلمسها|تلمسيها}.","دون إنذار يفلت المسطرة، وأنت{|ِ} {تمسكها|تمسكينها} بأسرع ما تستطيع{|ين}. {اقرأ|اقرئي} الرقم عند إصبعيك{|ِ}: هذه مسافة السقوط.","جرّب{|ي} مرتين للتدريب دون تسجيل، ثم ثلاث مرات مع التسجيل.","رتّب{|ي} الأرقام الثلاثة {واختر|واختاري} الأوسط: هذا رقمك{|ِ}.","من الجدول: 10 سم ≈ 0.14 ث، 15 سم ≈ 0.17 ث، 20 سم ≈ 0.20 ث، 30 سم ≈ 0.25 ث، 45 سم ≈ 0.30 ث، 60 سم ≈ 0.35 ث. إن {أفلتَّ|أفلتِّ} المسطرة كلها فاكتب{|ي} «أكثر من طول المسطرة» — هذا قياس أيضاً.","مقارنة عادلة (مستوى ب): كرر{|ي} باليد الأخرى، مع تثبيت كل شيء آخر. هل الفرق واضح أم ضمن اختلاف المحاولات؟"],"safety":["لا نقارن الأطفال ببعضهم علناً؛ كل طفل يقارن نفسه بنفسه.","المسطرة تُفلت لا تُرمى؛ بعيداً عن الوجه."],"expected":"مسافات بين 15 و45 سم غالباً عند الأطفال (أقصر عند الكبار)، تختلف قليلاً بين المحاولات؛ الرقم الوسط يمثل الطفل أفضل من أي محاولة واحدة.","explain":"بين أن {ترى|تري} المسطرة تتحرك وأن تنقبض عضلات يدك{|ِ} يمر زمن قصير: الضوء يدخل العين، وإشارة تذهب إلى الدماغ، وإشارة تعود إلى اليد. هذا الزمن لا {تحسّه|تحسّينه}، لكن المسطرة تقيسه. ولماذا اختلفت المحاولات؟ لأن القياس يتأثر بأشياء كثيرة صغيرة؛ لذلك نكرر ونأخذ الوسط. كيف تسير الإشارة؟ هذا درس وحدة الأعصاب.","record":"ثلاث قراءات، الرقم الوسط، والزمن من الجدول. وجملة: «لم تكفِ محاولة واحدة لأن…».","alternatives":["من يتعذر عليه الإمساك يقيس بطريقة أخرى: عدّ{|ي} الثواني بين إشارة ضوئية وضغط زر في التطبيق.","يمكن قياس شيء آخر بالطريقة نفسها: عدد مرات القفز في 15 ثانية، ثلاث مرات."]},"find_the_error":[{"id":"FE1","atlas_variant":"single_trial_table","error":"جدول فيه قراءة واحدة وتحتها «النتيجة النهائية»","answer":"نحتاج ثلاث قراءات والرقم الوسط","detects":"M30"}],"numbers":[{"text":"زمن رد فعلك{|ِ} نحو ربع ثانية (وعند الكبار نحو خُمس ثانية). لو كان رد فعل السائق خُمس ثانية فقط لقطعت سيارته بسرعة 60 كم/س نحو 3 أمتار قبل أن يضغط الفرامل؛ وفي الواقع يحتاج السائق نحو ثانية ليلاحظ ويقرر ويحرّك قدمه: أكثر من 15 متراً.","source":["S2"]},{"text":"العين لا ترى ما يصغر عن عُشر مليمتر تقريباً؛ معظم الخلايا أصغر من ذلك بخمس إلى عشر مرات، فلا نراها إلا بالمجهر.","source":["S3"]}],"true_size":[{"text":"انزع{|ي} شعرة من رأسك{|ِ} وانظر{|ي} إلى سُمكها: نحو عُشر مليمتر، قريب من أصغر ما تراه عينك{|ِ}. معظم الخلايا أصغر من سُمك الشعرة بخمس إلى عشر مرات.","source":["S3"]}],"animal":{"text":"زمن رد فعل الذبابة نحو عُشر زمننا؛ لذلك يصعب صيدها بيدك{|ِ}. والقطة تقفز قبل أن تكمل{|ي} حركتك{|ِ}. السرعة في الحيوانات الصغيرة أكبر، والقياس هو ما يخبرنا بذلك لا الانطباع.","source":["S5"]},"organ_letter":{"from":"المسطرة","text":"أنا مسطرة عادية من ثلاثين سنتيمتراً. لا أرى ولا أفكر. لكني اليوم قست شيئاً لا {تحسّه|تحسّينه} أنت{|ِ}: الزمن بين أن {ترى|تري} وأن تمسك{|ي}. سقطتُ 18 سنتيمتراً، فعرفنا أنك{|ِ} تحتاج{|ين} خُمس ثانية. الأرقام لا تجامل؛ لذلك يحبها العلماء."},"history":[{"who":"ابن الهيثم","origin":"البصرة؛ عمل في القاهرة. مسلم","where_when":"القاهرة، نحو 1028–1038","did":"أثبت بتجارب مصمَّمة (الغرفة المظلمة، أثر الضوء القوي على العين) أن الإبصار بدخول الضوء إلى العين لا بخروج أشعة منها، وكتب في وجوب فحص أقوال المتقدمين واختبارها.","did_not":"لم يعرف دور الشبكية ولا العصب البصري وظيفياً كما نعرفه اليوم؛ ولم يخترع الكاميرا الحديثة.","method_lesson":"التجربة المصمَّمة تحسم بين فرضيتين؛ لا تسلّم بما في الكتب حتى تختبره.","source":["S4"]}],"how_we_know":{"text":"قبل ألف سنة في القاهرة، أراد ابن الهيثم أن يعرف: هل نرى لأن أشعة تخرج من أعيننا، أم لأن الضوء يدخل إليها؟ كان الناس يرددون الجواب الأول منذ قرون. لم يكتفِ بالجدل؛ صمّم تجارب: غرفة مظلمة بثقب صغير يدخل منه ضوء مصابيح عدة، فيقع ضوء كل مصباح في موضعه على خط مستقيم ولا يختلط بغيره، وراقب ما يحدث للعين بعد النظر إلى ضوء قوي. وكتب أن طالب الحق يفحص ما في الكتب ويتهمه ويختبره، لا يسلّم به. ثم أجاب: الضوء يدخل العين. هذا الدرس: الاختبار يحسم ما لا يحسمه الكلام.","limit_question":"ما الذي لا يستطيع جدول المسطرة أن يخبرك{|ِ} به عن ردّ فعلك{|ِ}؟"},"what_changed":["كان العلماء منقسمين قروناً: بعضهم يقول تخرج أشعة من العين (إقليدس وبطلميوس)، وبعضهم يقول يدخلها الضوء (أرسطو)؛ حسم ابن الهيثم بالتجربة والهندسة أن الضوء يدخل إليها."],"model_limits":["رسوم الأدوات في الدرس رمزية؛ المجهر الحقيقي والأشعة أجهزة معقدة.","جدول المسطرة تقريبي."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَـٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَـٰدِمِينَ","reference":"الحجرات 6","grade":"قرآن","usage":"قيمة","reflection":"نتبيّن قبل أن نصدّق. اليوم نتعلم كيف نتبيّن: نلاحظ، ونقيس، ونكرر، ونقارن بعدل.","reviewed":false,"quran_key":"49:6","highlight":"فتبينوا","hl_words":[7,7],"cards":[]},"closing":{"text":"كفى بالمرء كذباً أن يحدّث بكل ما سمع","reference":"مسلم، المقدمة 5","grade":"صحيح","usage":"قيمة","reflection":"تعلّمنا أن نفرّق بين ما نراه وما نظنه، وأن القياس الواحد لا يكفي. ومن ينقل كل ما يسمعه دون أن يتثبت فقد شارك في الخطأ. العالم الصغير يقول: «لم أتحقق بعد».","reviewed":false,"full_verified":true,"matn_note":"متن قصير كامل","hadith_key":"muslim:intro-5","lead":"عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","narration":false,"source":"مسلم، المقدمة 5","grader":"","cards":[]}},"life":[{"situation":"رأيت زميلاً يبكي.","science":"ما أراه ملاحظة (يبكي)؛ سببه تخمين (حزين؟ متعب؟) لا أعرفه حتى أسأل.","action":"لا أنشر سبباً خمّنته، ولا أحكم على أحد من نظرة؛ أسأله بلطف أو أخبر بالغاً.","value":"لا أقول ما لا أعلم.","reference":"الإسراء 36","why":"لماذا لا أقول «هو حزين لأن…»؟ لأن ما في قلب الناس لا تراه العين. قد يكون متعباً، أو مريضاً، أو تذكّر{|ي} شيئاً. إن خمّنت ونشرت تخميني فقد أظلمه، وهو في حاجة إلى من يسأله لا من يحكم عليه. والله نهانا أن نتبع ما ليس لنا به علم.","cards":[],"verses":[]},{"situation":"سمعت خبراً عن زميل.","science":"المعلومة الواحدة قد تكون خطأ؛ العلم يكرر ويتثبت.","action":"أتبيّن قبل أن أصدّق أو أنقل.","value":"التثبت قبل التصديق.","reference":"الحجرات 6","why":"لماذا أتبيّن؟ لأن الخبر ينتقل من فم إلى فم ويتغيّر في كل مرة، كما تتغيّر القياسات إن أخذناها مرة واحدة. والخبر الخاطئ عن إنسان قد يؤذيه ويؤذي صداقتنا، ولا نستطيع إرجاع الكلمة بعد خروجها. لذلك أسأل: من رأى؟ ومتى؟","cards":[],"verses":[]}],"open_questions":[{"q":"كيف يقيس الدماغ الزمن القصير جداً (أجزاء الثانية) بلا ساعة داخله؟","why_open":"لا توجد «ساعة» واحدة في الدماغ؛ هناك أفكار كثيرة ولا إجابة متفق عليها بعد."}],"notebook":{"draw":"ارسم{|ي} جدول تجربتك{|ِ}: ثلاث قراءات والرقم الوسط والزمن. وارسم{|ي} بجانبه أداتين تكشفان ما لا تراه العين واكتب{|ي} ماذا تكشف كل منهما.","label":["ملاحظة","تخمين","قياس","الرقم الوسط","— ب: المقارنة العادلة"],"write":"لماذا لم تكفِ محاولة واحدة؟ أكتب السبب بجملة كاملة، ثم مثالاً من حياتي أحتاج فيه أن أكرر القياس قبل أن أثق به."},"imgs":[]};
