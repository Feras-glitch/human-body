<script>
const LD = {"id":"U05.L02","first":false,"title":"الطاقة: لماذا تحتاج الخلية الأكسجين؟","driving_question":"أجّلنا السؤال ثلاث وحدات: لماذا يحتاج جسمك{|ِ} الأكسجين أصلاً؟ ولماذا {تدفأ|تدفئين} حين تركض{|ين}؟","central_fact":"الخلية تطلق الطاقة من السكر باستعمال الأكسجين فينتج ثاني أكسيد الكربون وماء وحرارة؛ لذلك نأكل ونتنفس، ولذلك يزيد التنفس والنبض ويدفأ الجسم حين نركض.","next":"U05.L03","hook":{"text":"{اسم}، شمعة تحت كأس مقلوبة تنطفئ بعد ثوانٍ مع أن فيها شمعاً كثيراً. ما الذي نقص؟ وهل في جسمك{|ِ} شيء يشبه هذا؟","options":["نفد الشمع","قلّ الهواء (الأكسجين)","الكأس بردت الشمعة","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["cell"],"highlight":["cell"],"zoom":"cell","animate":"fuel_in"},"text":"كل ما {تفعله|تفعلينه} — تمشي{|ن}، تفكر{|ين}، تكبر{|ين}، حتى تنام{|ين} — يحتاج إلى طاقة. من أين تأتي؟ من الطعام. الخبز والأرز والفاكهة يتحول في جسمك{|ِ} إلى سكر بسيط نسميه الجلوكوز، يحمله الدم إلى كل خلية. هذا وقود الخلية. لكن الوقود وحده لا يكفي — كما لا يكفي الشمع وحده في الشمعة."},{"id":"E2","level":"A","atlas":{"layers":["cell"],"highlight":["mitochondria"],"zoom":"cell","animate":"respiration"},"text":"وهنا جواب السؤال الذي أجّلناه ثلاث وحدات. الخلية تأخذ السكر والأكسجين معاً، وتُطلق من السكر طاقته — ويخرج من ذلك ثاني أكسيد الكربون وماء. نسمي هذا التنفس الخلوي: سكر + أكسجين ← طاقة + ثاني أكسيد الكربون + ماء. لذلك تتنفس{|ين}: لا لأن الهواء فيه طاقة، بل لأن الأكسجين هو الذي يُطلق الطاقة من الغذاء. ولذلك تُخرج{|ين} ثاني أكسيد الكربون: هو ما يبقى بعد إطلاقها."},{"id":"E3","level":"A","atlas":{"layers":["cell"],"highlight":["mitochondria"],"zoom":"cell"},"text":"يشبه هذا الاحتراق: الشمعة تحتاج شمعاً وأكسجيناً وتُخرج ثاني أكسيد كربون وماء وحرارة — تماماً كخليتك{|ِ}. لكن انتبه{|ي} إلى الفرق: لا لهب في خليتك{|ِ} ولا دخان؛ الطاقة تخرج ببطء على خطوات صغيرة كثيرة، كأنك{|ِ} تنزل{|ين} درجاً درجة درجة بدل أن تقفز{|ي} من السطح. وجزء من هذه الطاقة يخرج حرارة لطيفة: هذا دفء جسمك{|ِ} الدائم، نحو 37 درجة، شتاءً وصيفاً."},{"id":"E4","level":"A","atlas":{"layers":["circulatory","respiratory","digestive","cell"],"highlight":["lungs","heart","blood","cell"],"zoom":"body","animate":"full_loop"},"text":"لنجمع الوحدات كلها في رحلة واحدة. الطعام يعطي السكر فيدخل الدم. الرئة تأخذ الأكسجين من الهواء فيدخل الدم. القلب يدفع الدم إلى شعيرة بجوار الخلية. الخلية تأخذ السكر والأكسجين، تُطلق الطاقة، وتُخرج ثاني أكسيد الكربون إلى الدم. الدم يعود إلى الرئة فيخرج ثاني أكسيد الكربون مع الزفير. حلقة كاملة، عشرين مرة في الدقيقة، طوال العمر."},{"id":"E5","level":"A","atlas":{"layers":["muscles","circulatory","respiratory"],"highlight":["leg_muscle","heart","lungs"],"zoom":"body"},"text":"والآن تفهم{|ين} الركض كله. حين تركض{|ين} تنقبض عضلات ساقيك{|ِ} مرات كثيرة، فتحتاج خلاياها طاقة أكثر: سكراً وأكسجيناً أكثر، وتصنع ثاني أكسيد كربون أكثر. حسّاسات الدماغ تقيس ذلك فتأمر الرئة أن تتنفس أسرع والقلب أن يدق أسرع — معاً، في اللحظة نفسها. وجزء من الطاقة الإضافية يخرج حرارة ف{تدفأ|تدفئين} وتعرق{|ين}. وحين تجلس{|ين} يقلّ الطلب فيهدأ الجميع. ثلاث وحدات في جملة واحدة."},{"id":"E6","level":"B","atlas":{"layers":["cell"],"highlight":["mitochondria","cytoplasm"],"zoom":"cell"},"text":"للمستوى ب: أين يحدث هذا داخل الخلية؟ خطوة أولى في السيتوبلازم، ومعظمه في الميتوكوندريا التي عرفناها — لذلك سمّيناها محطة إطلاق الطاقة. والطاقة لا تُستعمل فوراً كلها؛ تُخزَّن في جزيء صغير اسمه ATP، كعملة صغيرة تنفقها الخلية حين تحتاج: لتنقبض (العضلة)، أو تبني أجزاءً جديدة (حين تنمو أو تُصلح نفسها)، أو ترسل إشارة (العصبية). من جزيء سكر واحد تصنع الخلية عشرات هذه العملات."},{"id":"E7","level":"B","atlas":{"layers":["cell"],"highlight":["heart","brain","lungs"],"zoom":"body"},"text":"وهل تحتاج{|ين} طاقة وأنت{|ِ} نائم{|ة}؟ كثيراً. القلب ينبض، والحجاب الحاجز يسحب الهواء، والدماغ يعمل (نحو خُمس طاقة الجسم في الراحة!)، والخلايا تبني وترمّم ما تلف في النهار، وجسمك{|ِ} يحفظ دفأه. الحركة تزيد الحاجة، لكنها لا تبدأها؛ الحاجة دائمة ما دمت{|ِ} {حياً|حيةً}. لذلك لا يستغني الجسم عن الطعام ولا عن النفس ليلة واحدة."}],"practice":[{"id":"U05.L02.P1","after":"E2","objective":"U05.L02.O1","type":"sequence","prompt":"رتّب{|ي} المعادلة: الوقود، ثم ما يُطلق طاقته، ثم ما ننتفع به، ثم ما يبقى.","options":["سكر","أكسجين","طاقة","ثاني أكسيد الكربون وماء"],"answer":[0,1,2,3],"explanation":"السكر هو الوقود، والأكسجين يُطلق طاقته، فنحصل على الطاقة، ويبقى ثاني أكسيد الكربون والماء.","level":"A","feedback_wrong":"ما الوقود؟ وما الذي يُطلق طاقته؟ وما الذي يبقى بعد الإطلاق؟"},{"id":"U05.L02.P2","objective":"U05.L02.O1","type":"choose_reason","prompt":"لماذا نحتاج الأكسجين؟","options":["لأن فيه طاقة نأخذها مع كل نَفَس ونخزّنها","لأنه يُطلق الطاقة من السكر في الخلية","لأنه يبرّد القلب حين يعمل بسرعة","لأنه يصنع الدم الأحمر في الرئتين"],"answer":1,"explanation":"الطاقة في الغذاء لا في الهواء؛ الأكسجين يُطلق الطاقة من السكر، كما يحتاجه اللهب ليحرق الشمع.","level":"A","feedback_wrong":"أين الطاقة: في الهواء أم في الغذاء؟ وماذا فعل الأكسجين بالشمعة؟","feedback_by_option":{"0":"الطاقة في الغذاء لا في الهواء؛ الأكسجين يُطلقها من السكر.","2":"الأكسجين لا يبرّد شيئاً؛ هو يُطلق الطاقة من السكر.","3":"الدم يُصنع في نخاع العظم؛ والرئتان تعطيانه الأكسجين فقط."}},{"id":"U05.L02.P3","after":"E4","objective":"U05.L02.O2","type":"sequence","prompt":"رتّب{|ي} رحلة الأكسجين والسكر إلى الخلية وما بعدها.","options":["الرئة تأخذ الأكسجين والطعام يعطي السكر","الدم يحملهما والقلب يدفعه","الخلية تطلق الطاقة","ثاني أكسيد الكربون يعود بالدم إلى الرئة ويخرج"],"answer":[0,1,2,3],"explanation":"الرئة تأخذ الأكسجين والطعام يعطي السكر، والدم يحملهما والقلب يدفعه، فتُطلق الخلية الطاقة، ثم يعود ثاني أكسيد الكربون بالدم إلى الرئة ويخرج.","level":"A","feedback_wrong":"ما الذي يدخل أولاً، ومن ينقله، وما الذي يعود؟"},{"id":"U05.L02.P4","objective":"U05.L02.O3","type":"predict","prompt":"ستقفز{|ين} دقيقتين. توقّع{|ي}: ماذا يحدث لجبينك{|ِ} وتنفسك{|ِ} ونبضك{|ِ}؟ ثم جرّب{|ي}.","options":["يدفأ الجبين ويزيد التنفس والنبض معاً","يبرد الجبين ويقلّ التنفس","لا يتغير شيء"],"answer":0,"explanation":"العضلات في القفز تُطلق طاقة أكثر وجزء منها حرارة، فيدفأ الجبين، ويزيد التنفس والنبض ليوصلا الأكسجين.","level":"A","feedback_wrong":"سجّل{|ي} ما أحسست به فعلاً.","feedback_by_option":{"1":"العضلات العاملة تُطلق طاقة أكثر؛ فهل يبرد الجسم ويقلّ التنفس؟","2":"جرّب{|ي}: ضع{|ي} يدك{|ِ} على جبينك{|ِ} وعدّ{|ي} أنفاسك{|ِ} بعد القفز."}},{"id":"U05.L02.P5","objective":"U05.L02.O5","type":"choose_reason","prompt":"لماذا نسمّي الميتوكوندريا «محطة إطلاق الطاقة»؟","options":["لأنها تصنع السكر من الهواء","لأنها تخزّن الأكسجين لوقت الحاجة حين نركض","لأنها تصنع الدم وترسله إلى القلب ليدفعه","لأن معظم إطلاق الطاقة من السكر يحدث فيها"],"answer":3,"explanation":"معظم إطلاق الطاقة من السكر يحدث في الميتوكوندريا، فسمّيناها محطة إطلاق الطاقة.","level":"B","feedback_wrong":"ماذا يحدث فيها بالضبط؟ وما مدخلاته؟","feedback_by_option":{"0":"السكر يأتي من الطعام، لا من الهواء.","1":"الميتوكوندريا تستعمل الأكسجين ولا تخزّنه.","2":"الدم يُصنع في نخاع العظم."}}],"check":[{"id":"U05.L02.C1","objective":"U05.L02.O1","type":"true_false_why","prompt":"«الهواء فيه طاقة، ونحن نتنفس لنأخذها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الطاقة في الغذاء (السكر)، والأكسجين يُطلقها داخل الخلية.","level":"A","rubric":"R1"},{"id":"U05.L02.C2","objective":"U05.L02.O2","type":"fix_model","prompt":"رسم زميل{ك|تكِ} الطعام يذهب من المعدة إلى الرئة ليحترق هناك. ما الخطأ؟","answer":"الطعام يصير سكراً في الدم، والدم يوصله مع الأكسجين إلى كل خلية؛ إطلاق الطاقة في الخلية لا في الرئة.","level":"A","rubric":"R1"},{"id":"U05.L02.C3","objective":"U05.L02.O3","type":"choose_reason","prompt":"لاعبة تلهث وتدفأ وتعرق بعد السباق. السبب الواحد وراء الثلاثة؟","options":["لأن خلايا عضلاتها طلبت طاقة أكثر فزاد الأكسجين والسكر وخرجت حرارة","لأن القلب تعب","لأن الهواء ساخن","لأن الرئة أرسلت أكسجيناً للعضلة مباشرة"],"answer":0,"explanation":"سبب واحد: خلايا عضلاتها طلبت طاقة أكثر، فاحتاجت أكسجيناً وسكراً أكثر، وخرج جزء من الطاقة حرارة.","level":"A","feedback_wrong":"من الذي يطلب الطاقة؟ وماذا يخرج معها؟","feedback_by_option":{"1":"تعب القلب لا يفسّر الدفء والعرق؛ ابحث{|ي} عن سبب واحد للثلاثة.","2":"الهواء الساخن قد يزيد العرق، لكنه لا يفسّر اللهاث؛ السبب من داخلها.","3":"الرئة لا ترسل الأكسجين إلى العضلة مباشرة؛ الدم يحمله."}},{"id":"U05.L02.C4","objective":"U05.L02.O4","type":"explain_open","prompt":"اذكر{|ي} وجه شبه ووجه اختلاف بين الشمعة وخليتك{|ِ}.","answer":"شبه: كلتاهما تحتاج وقوداً وأكسجيناً وتُخرج ثاني أكسيد الكربون وماء وحرارة. اختلاف: لا لهب في الخلية، والطاقة على خطوات صغيرة.","level":"A","rubric":"R1"},{"id":"U05.L02.C5","objective":"U05.L02.O3","type":"true_false_why","prompt":"«جسمك{|ِ} يصنع حرارته من داخله، والملابس تحفظها ولا تصنعها». صح أم خطأ؟","answer":"صح؛ خلاياك{|ِ} تطلق حرارة باستمرار وهي تُطلق طاقة الغذاء، فجسمك{|ِ} نحو 37 درجة دائماً.","level":"A","rubric":"R1"},{"id":"U05.L02.C6","objective":"U05.L02.O5","type":"explain_open","prompt":"اذكر{|ي} عملين تنفق فيهما الخلية «عملات» الطاقة، وأين تُصنع هذه العملات.","answer":"الانقباض، البناء والنمو، إرسال الإشارات؛ تُصنع في الميتوكوندريا (ومرحلة في السيتوبلازم).","level":"B","rubric":"R1"},{"id":"U05.L02.C7","objective":"U05.L02.O6","type":"choose_reason","prompt":"قال طفل: «حين أنام لا أحتاج طاقة». ما الصواب؟","options":["صحيح؛ الجسم يتوقف عن العمل في النوم","خطأ؛ القلب والتنفس والدماغ تعمل وتحتاج طاقة دائماً","صحيح إلا الدماغ؛ فهو وحده يعمل في النوم ليصنع الأحلام","خطأ؛ لأن النوم رياضة تتعب العضلات"],"answer":1,"explanation":"حتى في النوم يعمل القلب والتنفس والدماغ، وكلها تحتاج طاقة دائماً.","level":"B","feedback_wrong":"ما الذي يعمل في جسمك الآن وأنت نائم؟","feedback_by_option":{"0":"القلب والتنفس لا يتوقفان في النوم.","2":"الدماغ يعمل في النوم، والقلب والتنفس أيضاً.","3":"الحكم «خطأ» صحيح، لكن النوم ليس رياضة؛ السبب أن القلب والتنفس والدماغ تعمل دائماً."}}],"concepts":[{"id":"energy","term":{"ar":"الطاقة","en":"Energy","zh":"能量","pinyin":"néngliàng","match":["طاقة","الطاقة"]},"priority":"core","atlas":{"layer":"cell","element":"mitochondria"},"card":{"A":"القدرة على فعل عمل: تحريك عضلة، إرسال إشارة، بناء خلية جديدة، تدفئة الجسم. تأتي من الغذاء ويُطلقها الأكسجين.","B":"الخلية تطلق طاقة الغذاء على خطوات صغيرة وتخزّنها في جزيء صغير (ATP) تنفقه حين تعمل."}},{"id":"glucose","term":{"ar":"السكر (الجلوكوز)","en":"Glucose (sugar)","zh":"葡萄糖","pinyin":"pútáotáng","match":["السكر","سكر","الجلوكوز"]},"priority":"core","atlas":{"layer":"circulatory","element":"blood"},"card":{"A":"وقود الخلية: سكر بسيط يحمله الدم إلى كل خلية، يأتي من الطعام الذي نأكله.","B":"الخبز والأرز والفاكهة تتحول في الهضم إلى جلوكوز يدخل الدم — كيف؟ وحدة الغذاء."}},{"id":"cell_respiration","term":{"ar":"التنفس الخلوي","en":"Cellular respiration","zh":"细胞呼吸","pinyin":"xìbāo hūxī","match":["التنفس الخلوي"]},"priority":"core","atlas":{"layer":"cell","element":"mitochondria"},"card":{"A":"ما تفعله الخلية بالأكسجين: تستعمله لتطلق الطاقة من السكر، فيخرج ثاني أكسيد الكربون وماء. يشبه احتراقاً بطيئاً هادئاً بلا لهب.","B":"سكر + أكسجين ← طاقة + ثاني أكسيد الكربون + ماء. معظمه في الميتوكوندريا."}},{"id":"heat","term":{"ar":"حرارة الجسم","en":"Body heat","zh":"体温","pinyin":"tǐwēn","match":["حرارة","تدفأ","دافئ"]},"priority":"supporting","atlas":{"layer":"cell","element":"mitochondria"},"card":{"A":"جزء من الطاقة التي تطلقها الخلايا يخرج حرارة؛ لذلك جسمك{|ِ} دافئ دائماً ويدفأ أكثر حين تعمل عضلاتك{|ِ}.","B":"كيف يمنع الجسم ارتفاعها (التعرق والجلد)؟ وحدة الجلد والحرارة."}}],"experiment":{"title":"الشمعة تحتاج الهواء، وأنا أدفأ حين أعمل","materials":["شمعة صغيرة في طبق وكأس زجاجية (للبالغ فقط)","ساعة بالثواني","ورقة دفتر الأطلس","(اختياري) مقياس حرارة جلدي"],"steps":["(يفعلها بالغ ويشاهد الأطفال من مسافة متر) يُشعل الشمعة ويقلب الكأس فوقها. عدّ{|ي} الثواني حتى تنطفئ. ماذا نقص؟ لماذا انطفأت وهي ما زالت فيها شمع؟","المس{|ي} جبينك{|ِ} وكفيك{|ِ} وأنت{|ِ} جالس{|ة}: لاحظ{|ي} دفأهما. (اختياري: {اقرأ|اقرئي} مقياس الحرارة الجلدي.)","اقفز{|ي} أو امش{ِ|ي} في مكانك{|ِ} بسرعة دقيقتين.","المس{|ي} جبينك{|ِ} وكفيك{|ِ} مرة أخرى: أدفأ؟ هل ظهر عرق؟ وعدّ{|ي} أنفاسك{|ِ} ونبضك{|ِ} كما تعلمت{|ِ}.","اجلس{|ي} ثلاث دقائق ثم المس{|ي} من جديد. ماذا عاد؟","اكتب{|ي} في الدفتر: الشمعة احتاجت ____ لتستمر، وجسمي احتاج ____ ليعمل أكثر، وأصبحت أدفأ لأن ____."],"safety":["القفز أو المشي السريع: من لديه حالة معروفة في القلب أو التنفس يؤدي الجزء الجالس فقط باتفاق ولي الأمر، ومن يستعمل بخّاخ ربو يكون معه؛ ولا تُجرى في جو حار أو بعد صيام طويل.","توقف{|ي} فوراً واجلس{|ي} إن أحسست{|ِ} بدوار أو ألم أو ضيق نفس، وأخبر{|ي} بالغاً. وإغماء أو ألم في الصدر أو خفقان شديد أثناء الجهد عند طفل = يتوقف ويُعرض على طبيب.","الشمعة والكأس للبالغ وحده؛ الأطفال على بعد متر؛ بعيداً عن الشعر والورق والستائر؛ تُطفأ فوراً بعد الملاحظة.","لا تنفس سريع متعمد ولا حبس نفس؛ من أحسّ بدوار يجلس.","لا نقيس الحرارة الداخلية ولا نقارن الأطفال ببعضهم."],"expected":"تنطفئ الشمعة بعد ثوانٍ حين يقلّ الأكسجين تحت الكأس عن حاجة اللهب؛ يدفأ الجبين والكفان بعد الحركة ويزيد التنفس والنبض معاً، ثم يعود الجميع بعد الراحة.","explain":"الشمعة فيها شمع كثير لكنها انطفأت: لأن ما نقص هو الأكسجين: قلّ تحت الكأس عن حاجة اللهب؛ وبلا أكسجين كافٍ لا يُطلق الوقود طاقته. وأنت{|ِ} مثلها بوجه واحد: السكر في خلاياك{|ِ} وقود، والأكسجين الذي {تتنفسه|تتنفسينه} يُطلق طاقته — لكن بلا لهب، على خطوات هادئة. حين ركضت{|ِ} طلبت خلايا عضلاتك{|ِ} طاقة أكثر، فأخذت سكراً وأكسجيناً أكثر وصنعت ثاني أكسيد كربون أكثر؛ فأمر الدماغ الرئة والقلب أن يعملا أسرع معاً. وجزء من الطاقة خرج حرارة، فدفئت{|ِ} وعرقت{|ِ}. وبعد الراحة قلّ الطلب فعاد كل شيء.","record":"زمن انطفاء الشمعة، وملاحظة الدفء قبل وبعد، وعدد الأنفاس والنبض بعد الحركة، والجملة الناقصة.","alternatives":["إن تعذّرت الشمعة: فيديو الشمعة تحت الكأس أو وصف المعلم.","إن تعذّرت الحركة لطفل: يراقب زميلاً ويلمس جبينه هو بعد أن يفرك يديه بقوة نصف دقيقة (الاحتكاك يدفئ أيضاً — يذكر المعلم أن هذا سبب مختلف)."]},"find_the_error":[{"id":"FE1","atlas_variant":"energy_from_air","error":"سهم «طاقة» من الهواء إلى الرئة ثم إلى العضلة","answer":"الطاقة في الغذاء؛ الأكسجين يُطلقها داخل الخلية","detects":"M48"},{"id":"FE2","atlas_variant":"fire_in_cell","error":"لهب ودخان مرسومان داخل الخلية","answer":"إطلاق هادئ على خطوات بلا لهب؛ الحرارة لطيفة","detects":"M49"},{"id":"FE3","atlas_variant":"burn_in_lung","error":"الطعام يحترق في الرئة","answer":"الإطلاق في كل خلية؛ الرئة محطة الأكسجين فقط","detects":"M03"}],"numbers":[{"text":"من جزيء سكر واحد تُخرج الخلية عشرات «عملات» الطاقة الصغيرة؛ لذلك تكفي قطعة خبز لساعات من اللعب.","source":["S1"]},{"text":"جسمك{|ِ} دافئ نحو 37 درجة دائماً، حتى في الشتاء، لأن خلاياك{|ِ} تطلق الطاقة بلا توقف.","source":["S6"]}],"true_size":[{"text":"ضع{|ي} يدك{|ِ} على خدك{|ِ}: هذا الدفء صنعته خلاياك{|ِ} الآن من آخر وجبة {أكلتها|أكلتِها} وآخر نَفَس {أخذته|أخذتِه}.","source":["S6"]}],"animal":{"text":"الطيور والثدييات تعتمد على الحرارة الناتجة عن عمل الجسم لتبقى دافئة. والسحلية تعتمد بدرجة أكبر على حرارة بيئتها؛ قد تتشمس لتدفأ أو تلجأ إلى الظل لتبرد، وليست باردة دائمًا. والدب في بياته الشتوي يقلل استهلاك الطاقة والنبض ليعيش على مخزونه.","source":["S7","S8"]},"organ_letter":{"from":"ميتوكوندريا في عضلة ساقك{|ِ}","text":"أنا واحدة من مئات في خلية واحدة. تسمّونني محطة إطلاق الطاقة، وليس عندي آلات: عندي سكر يأتيني من طعامك{|ِ}، وأكسجين يأتيني من نَفَسك{|ِ}، وأنا أُطلق الطاقة خطوة خطوة بلا لهب، وأعطيك{|ِ} ما تحرّك{|ين} به ساقك{|ِ}، وأترك ثاني أكسيد الكربون يعود مع الدم. حين تركض{|ين} أعمل أسرع ف{تدفأ|تدفئين}. وحين تنام{|ين} لا أتوقف. مع التحية، شرارة هادئة في عمق خلية."},"history":[{"who":"أنطوان لافوازييه","origin":"فرنسا","where_when":"باريس، 1770s–1790","did":"قاس أن التنفس يستهلك أكسجيناً ويُخرج ثاني أكسيد كربون كالاحتراق، وأن الاستهلاك يزيد مع الجهد؛ وصف التنفس بأنه احتراق بطيء.","did_not":"ظن أن الاحتراق في الرئة لا في الخلايا؛ ولم يعرف الميتوكوندريا ولا ATP (القرن العشرون).","method_lesson":"القياس الدقيق للمدخلات والمخرجات يكشف الآلية قبل رؤيتها.","source":["S5"]}],"how_we_know":{"text":"كيف عرفنا أن الخلية «تحرق» الغذاء بالأكسجين؟ على خطوات امتدت قرنين. لافوازييه قاس في باريس أن الجسم يأخذ من الهواء أكسجيناً ويُخرج ثاني أكسيد كربون كما تفعل الشمعة، وأن الإنسان يأخذ أكثر حين يعمل — فقال: التنفس احتراق بطيء. لكنه ظن أن الاحتراق يحدث في الرئة. ثم اكتشف العلماء أن الدم ينقل الأكسجين إلى كل الأنسجة، وأخيراً — بالمجهر وبالكيمياء في القرن العشرين — أن الاحتراق الهادئ يحدث داخل كل خلية، في الميتوكوندريا، خطوة صغيرة بعد خطوة. سؤال واحد، وأجيال من القياس.","limit_question":"ما الذي لا تُظهره رسوم الميتوكوندريا وتسميتها «محطة إطلاق الطاقة» في هذا الدرس؟"},"what_changed":["ظُن أن التنفس يبرّد القلب؛ القياس بيّن أنه يمدّ الجسم بالأكسجين لإطلاق الطاقة.","ظن لافوازييه أن «الاحتراق» في الرئة؛ الصواب أنه في كل خلية."],"model_limits":["تسمية الميتوكوندريا «محطة إطلاق الطاقة» تشبيه؛ لا آلات ولا عمال، بل مواد كيميائية تتفاعل خطوة خطوة.","الشرارات والوهج في الرسم ترميز للطاقة؛ لا ضوء داخل الخلية.","الشمعة تحت الكأس تشبيه لوجه واحد (الحاجة إلى الأكسجين)؛ الخلية بلا لهب.","الرسم يُظهر خلية واحدة؛ الحقيقة تريليونات تعمل معاً.","(صورة E1) امتصاص السكر من الأمعاء إلى الدم مع إشارة مختصرة للكبد. في الواقع يمر السكر الممتص عبر الدورة البابية والكبد، ثم يعود إلى الجانب الأيمن من القلب ويجتاز الرئتين قبل أن يوزع من الجانب الأيسر. لا تعني خطوط اللقاء أن السكر يدخل مباشرة إلى يسار القلب أو يأتي من الرئة.","(صورة E2) المدخلان والمخرجات حصيلة مبسطة للتنفس الخلوي ككل. يبدأ تحلل الجلوكوز في السيتوبلازم، ثم تستكمل نواتجه مراحل داخل الميتوكوندريا؛ لذلك أضيفت خطوات صغيرة قبل العضية. لا تعني الأيقونة أن جزيء السكر يدخل الميتوكوندريا ويشتعل فيها.","(صورة E3) الشمعة أعلى والخلية أسفل بدلاً من اليسار/اليمين. الدرج مقابل القفزة يشبه إطلاق الطاقة التدريجي، ولا يعني أن التفاعلات الكيميائية درجات مادية أو أن وهج الخلية ضوء مرئي بالعين.","(صورة E4) المخطط أمامي ثابت مع تكبير خلية الفخذ. النقاط الرمادية تلخص رحلة ثاني أكسيد الكربون؛ يحمل الدم معظم نقله بصور كيميائية أخرى، لا كفقاعات غاز حرة مرئية.","(صورة E5) الصور الدائرية تكبيرات منفصلة لا أعضاء عائمة؛ خط التحكم التنفسي يلخص عمل عضلات التنفس، ولا يعني أن الرئتين تنقبضان كعضلة. أزيلت الأوعية الزرقاء وأصبحت حمراء وداكنة.","(صورة E6) عملات الطاقة تمثل ATP، لا نقوداً حقيقية. رُمم غشاء خلية بدلاً من حائط طوب: الخلية الحيوانية ليس لها جدار خلوي نباتي. الميتوكوندريا مصدر مهم للطاقة وليست المكان الوحيد لإنتاج ATP.","(صورة E7) مشهد نوم واحد مع تكبيرات للقلب والتنفس والدماغ وترميم الجلد والخلية، بدلاً من اللوحات الإضافية التي ظهرت في المسودة. الهالة رمز استمرار استخدام الطاقة والدفء، ولا تعني أن الجسم يضيء.","(صورة exp) البالغ يتعامل مع الشمعة والوعاء، والشمع يبقى عند خفوت اللهب. الصورة لا تقيس كمية الأكسجين، ولا تثبت أن كل الأكسجين اختفى؛ ظروف الاحتراق والغازات والحرارة تسهم في الانطفاء. لمس الجبهة ليس قياساً لدرجة حرارة دقيقة.","(صورة hist1) جرسان منفصلان للشمعة والحيوان مع مسعر جليدي وأدوات عصره؛ تصور قصصي للمقارنة وليس رسماً تنفيذياً للتوصيلات أو تجربة تعاد على حيوان. أزيل الأطفال المعاصرون من المشهد.","(صورة letter) الميتوكوندريون ذو الوجه خيال في رسالة العضو فقط. السكر والأكسجين رمزان لمدخلات التنفس الخلوي، مع مراحل سيتوبلازمية لا تظهر في هذه الشخصية. بقية الميتوكوندريا بلا وجوه.","(صورة life) لوحتان رأسيتان: فطور صغير ثم حوار داعم وعرض المساعدة الطبية. إرجاع الطبق عرض لطيف للطعام وليس إجباراً على الأكل، ولا تشخيصاً لسبب رفضه.","(صورة title-boy) الخلية داخل نافذة الفخذ تكبير رمزي وليست خلية بهذا الحجم. الشمعة تشبيه منفصل خارج الجسم؛ لا لهب داخل الخلية."],"faith":{"opening":null,"closing":null},"life":[{"situation":"أريد أن أترك الإفطار لأصل إلى المدرسة مبكراً.","science":"خلايا دماغي وعضلاتي تحتاج سكراً من الطعام لتطلق الطاقة؛ بلا وقود أشعر بتعب وضعف تركيز حتى وجبة التالية.","action":"آكل شيئاً خفيفاً ولو صغيراً، أو آخذه معي.","value":"جسدي أمانة؛ الوقود حق له لا رفاهية.","why":"لماذا لا أتركه؟ لأن الوقود الذي تأخذه خلاياي لا يأتي من الهواء بل من الطعام، وأنا أطلب من دماغي أن يعمل ساعات بلا وقود. والنبي ﷺ علّمنا أن للجسد على صاحبه حقاً — ومن حقه وقوده.","reference":"البخاري 1975","hadith":["bukhari:1975"],"cards":[{"key":"bukhari:1975","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","narration":true,"source":"البخاري 1975","grade":"صحيح","grader":""}],"verses":[]},{"situation":"أخي يقول إن ترك الطعام أياماً ليخفّ وزنه فكرة جيدة.","science":"الحاجة إلى الطاقة دائمة حتى في النوم؛ ترك الطعام طويلاً يُضعف الجسم ولا يُبنى به شيء. أمور الوزن يحدّدها الطبيب لا نحن.","action":"أقول له إن الجسم يحتاج وقوداً كل يوم، وأن من يريد تغييراً في وزنه يسأل طبيباً أو أهله، ولا أسخر من جسمه.","value":"لا أؤذي جسدي ولا أترك أخي يؤذي جسده، ولا أحكم على الأجسام.","why":"لماذا أتدخل؟ لأن الضرر هنا يقع على جسم حي لا يتوقف، والنصيحة بلطف خير من السكوت؛ ولأن الأجسام تختلف ولا يُحتقر أحد بجسمه — والمقياس الصحة لا الشكل. وما يحتاج قراراً طبياً نرجعه إلى أهله.","reference":"مسلم 2564","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا تحتاج الخلايا العصبية طاقة كثيرة حتى حين «لا نفكر» في شيء؟","why_open":"الدماغ يستهلك نحو خمس طاقة الجسم في الراحة؛ ما الذي ينفقها بالضبط ما زال موضع بحث نشط."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة خلية وبجوارها شعيرة دموية، وأسهماً: سكر وأكسجين يدخلان، وثاني أكسيد الكربون يخرج، ورمزاً للطاقة والحرارة. ثم اكتب{|ي} المعادلة بالكلمات. المستوى ب: ارسم{|ي} الميتوكوندريا داخل الخلية والعملات الصغيرة.","label":["سكر →","أكسجين →","← ثاني أكسيد الكربون","طاقة","حرارة","— ب: الميتوكوندريا","— ب: ATP"],"write":"أكتب ما يدخل الخلية وما يخرج منها حين تُطلق الطاقة. ثم أشرح: لماذا أدفأ حين أركض؟ وبماذا تشبه الشمعةُ خليتي، وبماذا تختلف؟"},"imgs":["U05.L02-E1","U05.L02-E2","U05.L02-E3","U05.L02-E4","U05.L02-E5","U05.L02-E6","U05.L02-E7","U05.L02-exp","U05.L02-hist1","U05.L02-letter","U05.L02-life","U05.L02-title-boy","U05.L02-title-girl"]};
