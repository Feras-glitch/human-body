const LD = {"id":"U09.L03","first":false,"title":"الدفاع: كيف يمنع جسمي الميكروبات؟","driving_question":"{اسم}، {أنت|أنتِ} {تلمس|تلمسين} كل يوم مقابض أبواب وأقلاماً ونقوداً عليها ميكروبات، ولا {تمرض|تمرضين} كل يوم. لماذا؟ وماذا يحدث في جسمك{|ِ} حين {تمرض|تمرضين}؟","central_fact":"أكثر الميكروبات لا تمرضنا، وقليل منها يمرض. يمنعها الجسم أولاً بحواجز (الجلد والمخاط والأهداب والدموع والحمض)، فإن عبرت أتى الدم بخلايا بيضاء تبتلعها (الالتهاب)، ثم يصنع دفاع متخصص أجساماً مضادة ويتذكر الميكروب. وغسل اليدين بالصابون يمنع أكثر الطرق التي تنتقل بها.","next":null,"hook":{"text":"{اسم}، على مقبض باب صفّك{|ِ} الآن آلاف الكائنات الصغيرة التي لا تُرى. ماذا يحدث لو {لمسته|لمستِه}؟","options":["أمرض فوراً بلا شك","غالباً لا أمرض، فجسمي له حواجز، وأغسل يدي قبل أن آكل","لا شيء، فلا شيء يعيش على المقابض","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["cells"],"highlight":["bacteria","virus","human_cell"],"zoom":"cells"},"text":"الميكروبات كائنات صغيرة جداً لا تراها عينك{|ِ}، تعيش على جلدك{|ِ} وفي فمك{|ِ} وأمعائك{|ِ} وعلى كل شيء حولك{|ِ}. وأكثرها لا يمرضنا، وبعضها نافع كما {عرفت|عرفتِ} عن سكان الأمعاء. وقليل منها يمرض. من الميكروبات البكتيريا: كائن حي من خلية واحدة. ومنها الفيروس: أصغر من البكتيريا بكثير، يدخل خلايا جسمك{|ِ} ويستعملها ليصنع نسخاً كثيرة من نفسه. من الفيروسات الزكام والإنفلونزا."},{"id":"E2","level":"A","atlas":{"layers":["skin","respiratory","digestive"],"highlight":["skin","nose","eye","stomach"],"zoom":"body"},"text":"فكيف لا {تمرض|تمرضين} كل يوم؟ لجسمك{|ِ} حواجز قبل كل شيء. الجلد السليم سور لا تعبره الميكروبات. وفي الأنف والفم مخاط لزج يحبسها، وأهداب تكنس المخاط إلى الخارج، كما {عرفت|عرفتِ} في درس التنفس. والدموع تغسل العين، والحمض في المعدة يمنع كثيراً منها. فمن أين تدخل؟ من جرح في الجلد، أو حين {تلمس|تلمسين} عينيك{|ِ} وأنفك{|ِ} وفمك{|ِ} بيد عليها ميكروبات من مقبض أو من يد مريض."},{"id":"E3","level":"A","atlas":{"layers":["skin","blood"],"highlight":["splinter","white_cells","skin_vessels"],"zoom":"wound"},"text":"دخلت شظية خشب في إصبعك{|ِ} ومعها ميكروبات. خلال ساعات يحمرّ المكان وينتفخ ويدفأ ويؤلم قليلاً: هذا الالتهاب. ليس الجسم يخسر، بل يعمل: الأوعية تأتي بدم أكثر، ومعه خلايا بيضاء اسمها البلعميات تحيط بالميكروب فتبتلعه داخلها وتهضمه. وهي تفعل ذلك مع كل ميكروب بالطريقة نفسها وبسرعة. وإن زاد الاحمرار وانتشر، أو ظهر صديد، أو اشتد الألم، {فأخبر|فأخبري} الكبار."},{"id":"E4","level":"A","atlas":{"layers":["blood"],"highlight":["lymphocytes","antibodies"],"zoom":"cells"},"text":"فإن لم تكفِ البلعميات، جاء دفاع متخصص أبطأ لكنه أدق. خلايا بيضاء أخرى تتعرّف على الميكروب بعينه، وتصنع له الأجسام المضادة: مواد صغيرة تناسبه كما يناسب المفتاح قفله، فتلتصق به وتجعله غير ضار. وفي المرة الأولى يحتاج هذا أياماً، ولذلك نمرض أياماً. لكن الجسم يتذكر: إن جاء الميكروب نفسه مرة أخرى صنع الأجسام المضادة فوراً، فلا نمرض به غالباً. لهذا لا تصاب ببعض الأمراض إلا مرة."},{"id":"E5","level":"A","atlas":{"layers":["skin"],"highlight":["hands","soap"],"zoom":"hands"},"text":"اليدان أكثر ما ينقل الميكروبات: من المقبض إلى الأنف، ومن يد إلى يد. لذلك {اغسل|اغسلي} يديك{|ِ} قبل الطعام، وبعد الحمام، وبعد العطاس وتنظيف الأنف، وبعد لمس الحيوانات والقمامة. والماء وحده لا يكفي: الميكروبات تلتصق بالدهن على اليد، والصابون يفكّه. {افرك|افركي} 20 ثانية الكفين والظهر وما بين الأصابع وتحت الأظفار، ثم {اشطف|اشطفي} و{جفّف|جفّفي}. وإن أصابك{|ِ} زكام فلا ينفعك المضاد الحيوي: هو دواء يعمل على بعض البكتيريا لا على الفيروسات، ولا يؤخذ إلا بوصفة الطبيب وكما وصفها."},{"id":"E6","level":"B","atlas":{"layers":["blood"],"highlight":["t_cells","b_cells","antibodies"],"zoom":"cells"},"text":"للمستوى ب: الخلايا البيضاء التي تتعرّف على الميكروب بعينه اسمها الخلايا اللمفاوية، وهي نوعان. النوع الأول، الخلايا التائية: بعضها ينشّط غيره، وبعضها يقضي على خلايا الجسم التي دخلها فيروس، وبعضها يبقى خلايا ذاكرة. والنوع الثاني، الخلايا البائية: تنشّطها التائية فتصير خلايا تصنع الأجسام المضادة. والأجسام المضادة تجعل الميكروب غير ضار، وتساعد الخلايا الأخرى عليه، وتنشّط بروتينات مساعدة في الدم."}],"practice":[{"id":"U09.L03.P1","after":"E1","objective":"U09.L03.O1","type":"choose_re ة؟","feedback_by_option":{"0":"الطول لا علاقة له بالمناعة.","2":"نادراً ما يتكرر، والسبب ذاكرة الجسم؛ و«أبداً» كلمة مطلقة.","3":"الغسل مهم، لكن السبب هنا ذاكرة الجسم."}},{"id":"U09.L03.P5","after":"E5","objective":"U09.L03.O4","type":"sequence","prompt":"{رتّب|رتّبي} خطوات غسل اليدين.","options":["أبلّل يديّ وأضع الصابون","أفرك الكفين والظهر وبين الأصابع وتحت الأظفار","أستمر في الفرك 20 ثانية","أشطف بالماء الجاري","أجفف بمنشفة نظيفة"],"answer":[0,1,2,3,4],"explanation":"بلّل وصابون، ثم فرك كل الأماكن 20 ثانية، ثم شطف، ثم تجفيف.","level":"A","feedback_wrong":"ما الذي يأتي قبل الشطف؟"}],"check":[{"id":"U09.L03.C1","objective":"U09.L03.O1","type":"explain_open","prompt":"ما الفرق بين البكتيريا والفيروس؟","answer":"البكتيريا كائن حي من خلية واحدة؛ والفيروس أصغر بكثير، يدخل خلايا الجسم ويستعملها ليصنع نسخاً من نفسه.","level":"A","rubric":"R1"},{"id":"U09.L03.C2","objective":"U09.L03.O2","type":"explain_open","prompt":"{اذكر|اذكري} طريقين يدخل منهما الميكروب إلى الجسم، وحاجزاً يمنعه في كل منهما.","answer":"من الجلد (الحاجز: الجلد السليم، وتنظيف الجرح وتغطيته)، ومن الأنف والفم (الحاجز: المخاط والأهداب، وغسل اليدين قبل لمس الوجه).","level":"A","rubric":"R1"},{"id":"U09.L03.C3","objective":"U09.L03.O3","type":"true_false_why","prompt":"«الجسم يحتاج أياماً ليصنع الأجسام المضادة في أول مرة يلقى فيها ميكروباً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدفاع المتخصص يحتاج وقتاً ليتعرّف على الميكروب ويصنع ما يناسبه، ولذلك نمرض أياماً؛ ثم يتذكره فيردّ أسرع.","level":"A","rubric":"R1"},{"id":"U09.L03.C4","objective":"U09.L03.O4","type":"fix_model","prompt":"قال طفل: «أصابني زكام، فأخذت مضاداً حيوياً من علبة أختي القديمة، وغسلت يديّ بالماء ثانيتين». {صحّح|صحّحي} له.","answer":"الزكام فيروس والمضاد الحيوي لا يعمل عليه، ولا يؤخذ دواء أحد ولا دواء قديم، بل ما وصفه الطبيب له؛ ويغسل يديه بالصابون ويفرك 20 ثانية لأن الماء وحده لا يزيل الميكروبات.","level":"A","rubric":"R1"},{"id":"U09.L03.C5","objective":"U09.L03.O4","type":"explain_open","prompt":"لماذا نغسل اليدين قبل الأكل خاصة؟","answer":"لأن اليد تلمس أشياء كثيرة عليها ميكروبات، والأكل يدخلها إلى الفم مباشرة؛ والصابون مع الفرك يزيلها.","level":"A","rubric":"R1"},{"id":"U09.L03.C6","objective":"U09.L03.O5","type":"explain_open","prompt":"{اذكر|اذكري} عملين للخلايا التائية وعملاً للخلايا البائية.","answer":"التائية: تنشّط خلايا أخرى، وتقضي على الخلايا المصابة، وتبقى خلايا ذاكرة؛ والبائية: تصير خلايا تصنع الأجسام المضادة.","level":"B","rubric":"R1"}],"concepts":[{"id":"virus","term":{"ar":"الفيروس","en":"Virus","zh":"病毒","pinyin":"bìngdú","match":["الفيروس","الفيروسات","فيروسات","فيروس"]},"priority":"core","atlas":{"layer":"cells","element":"virus"},"card":{"A":"ميكروب أصغر بكثير من البكتيريا، لا يُرى إلا بمجاهر قوية جداً؛ يدخل خلايا الجسم ويستعملها ليصنع نسخاً من نفسه. منه الزكام والإنفلونزا.","B":"مادة وراثية داخل غلاف من البروتين؛ ولا يتكاثر وحده خارج الخلايا الحية."}},{"id":"inflammation","term":{"ar":"الالتهاب","en":"Inflammation","zh":"炎症","pinyin":"yánzhèng","match":["الالتهاب","التهاب"]},"priority":"core","atlas":{"layer":"blood","element":"inflammation"},"card":{"A":"احمرار وانتفاخ ودفء وألم حول موضع دخل منه ميكروب، لأن الدم يأتيه أكثر حاملاً خلايا بيضاء تدافع عنه؛ وهو عمل الجسم لا عدوّه.","B":"يبدأ خلال ساعات، ويستجيب بالطريقة نفسها لكل ميكروب؛ لذلك يسمى دفاعاً غير متخصص."}},{"id":"phagocyte","term":{"ar":"الخلية البلعمية","en":"Phagocyte","zh":"吞噬细胞","pinyin":"tūnshì xìbāo","match":["الخلية البلعمية","البلعميات","البلعمية"]},"priority":"core","atlas":{"layer":"blood","element":"phagocyte"},"card":{"A":"خلية بيضاء تحيط بالميكروب فتبتلعه داخلها وتهضمه فيصير غير ضار.","B":"تصل مع الدم إلى موضع الالتهاب، وتنظّف أيضاً بقايا الخلايا الميتة."}},{"id":"antibody","term":{"ar":"الجسم المضاد","en":"Antibody","zh":"抗体","pinyin":"kàngtǐ","match":["الجسم المضاد","الأجسام المضادة","أجساماً مضادة","أجسام مضادة"]},"priority":"core","atlas":{"layer":"blood","element":"antibody"},"card":{"A":"مادة صغيرة تصنعها خلايا بيضاء خاصة، تناسب ميكروباً بعينه كالمفتاح والقفل، فتلتصق به وتجعله غير ضار وتساعد غيرها عليه.","B":"يحتاج الجسم أياماً أول مرة ليصنع الأجسام المضادة المناسبة، ويتذكرها فيصنعها أسرع بعد ذلك."}},{"id":"antibiotic","term":{"ar":"المضاد الحيوي","en":"Antibiotic","zh":"抗生素","pinyin":"kàngshēngsù","match":["المضاد الحيوي","المضادات الحيوية","مضاد حيوي","مضاداً حيوياً"]},"priority":"supporting","atlas":{"layer":"tools","element":"antibiotic"},"card":{"A":"دواء يقتل بعض البكتيريا أو يوقفها، ولا يعمل على الفيروسات كالزكام والإنفلونزا؛ يصفه الطبيب ويؤخذ كما وصفه.","B":"استعماله بلا حاجة قد يجعل البكتيريا لا تتأثر به، وقد يؤذي البكتيريا النافعة في الأمعاء."}}],"experiment":{"title":"الزيت والقرفة: هل يكفي الماء وحده؟","materials":["ملعقة صغيرة من زيت الطبخ","رشة قرفة أو كركم مطحون (تمثّل الميكروبات)","صابون وماء جارٍ","منشفة ورقية أو قماش قديم","مؤقت أو ساعة"],"steps":["{افرك|افركي} كفيك{|ِ} بقليل من الزيت، ثم يرشّ الكبير عليهما رشة قرفة، و{افركهما|افركيهما} حتى تنتشر.","{اشطف|اشطفي} يديك{|ِ} بالماء وحده خمس ثوانٍ بلا صابون، و{انظر|انظري}: ماذا بقي؟","{اغسل|اغسلي} يديك{|ِ} بالصابون، و{افرك|افركي} 20 ثانية: الكفين والظهر وما بين الأصابع وتحت الأظفار.","{اشطف|اشطفي} و{جفّف|جفّفي}، و{انظر|انظري} مرة أخرى.","{سجّل|سجّلي}: كم بقي من القرفة بعد الماء وحده؟ وبعد الصابون؟ وأين بقي أكثر؟"],"safety":["لا نلمس العين أو الوجه واليدان عليهما القرفة؛ ومن لمس عينه يغسلها بماء كثير ويخبر الكبير.","من عنده حساسية من القرفة أو الكركم يستعمل الدقيق بدلاً منهما.","نمسح المغسلة والأرض بعد التجربة كي لا ينزلق أحد بالزيت."],"expected":"بعد الماء وحده يبقى أكثر القرفة لاصقاً بالزيت، خاصة بين الأصابع وتحت الأظفار؛ وبعد الصابون والفرك 20 ثانية تزول كلها تقريباً.","explain":"القرفة لصقت بالزيت كما تلتصق الميكروبات بالدهن والأوساخ على يديك{|ِ}. الماء وحده لا يزيل الزيت، والصابون يفكّه فيأخذه الماء ومعه ما لصق به؛ والفرك يصل إلى الأماكن الخفية.","record":"بعد الماء وحده: بقي ___ (كثير/قليل) وأكثره في ___ — بعد الصابون 20 ثانية: بقي ___","alternatives":["بدل القرفة: دقيق أو مسحوق طباشير ملوّن.","من لا يستطيع التجربة: صور اليدين في المشهد بعد الماء وحده وبعد الصابون."]},"find_the_error":[{"id":"FE1","atlas_variant":"all_germs_bad","error":"لوحة: كل الميكروبات عدوة، نقتلها كلها","answer":"أكثرها لا يمرضنا وبعضها نافع؛ نمنع الضار بالغسل في أوقاته","detects":"M65"},{"id":"FE2","atlas_variant":"water_only_wash","error":"طفل يشطف يديه بالماء ثانيتين قبل الطعام ويقول: نظيفتان","answer":"الماء وحده لا يزيل الميكروبات اللاصقة بالدهن؛ صابون وفرك 20 ثانية","detects":"M102"},{"id":"FE3","atlas_variant":"antibiotic_cold","error":"علبة مضاد حيوي مكتوب عليها: لكل زكام","answer":"الزكام فيروس، والمضاد الحيوي لا يعمل على الفيروسات؛ يصفه الطبيب لعدوى بكتيرية","detects":"M67"}],"numbers":[{"text":"20 ثانية: زمن فرك اليدين بالصابون؛ يكفيه أن {تردد|ترددي} نشيداً قصيراً مرتين.","source":["S2"]},{"text":"في جناح زيملفايس انخفضت وفيات الأمهات من نحو 18 من كل مئة إلى أقل من 2 من كل مئة بعد غسل الأيدي.","source":["S7"]}],"true_size":[],"animal":null,"organ_letter":{"from":"خلية بيضاء في دمك{|ِ}","text":"مرحباً، أنا خلية بيضاء صغيرة أسبح في دمك{|ِ}. لا {تراني|تريني}، لكني أعمل كل يوم. حين {تنخدش|تنخدشين} أو تدخل شظية في إصبعك{|ِ} أصل مع الدم، فأحيط بالميكروب وأبتلعه؛ ولذلك يحمرّ المكان ويدفأ، فلا {تخف|تخافي}، أنا أعمل. وأخواتي يتذكرن كل ميكروب لقيناه، فإن عاد عرفناه بسرعة. ساعد{|ي}نا: {اغسل|اغسلي} يديك{|ِ} بالصابون قبل الطعام وبعد الحمام، ولا {تفرك|تفركي} عينيك{|ِ} بيد غير نظيفة، و{نم|نامي} جيداً. وإن مرضت{|ِ} فلا {تأخذ|تأخذي} دواءً وحدك{|ِ}؛ الطبيب يعرف ما يساعدنا."},"history":[{"who":"إغناتس زيملفايس","origin":"المجر (عمل في النمسا)","where_when":"المستشفى العام في ڤيينا، 1847–1848","did":"لاحظ أن الأمهات يمتن بعد الولادة في جناح الأطباء ثلاثة أضعاف ما يمتن في جناح القابلات، وربط ذلك بموت زميله من جرح التشريح، فألزم الأطباء والطلاب بتطهير أيديهم بماء الكلور قبل فحص الأمهات، فانخفضت الوفيات في جناحه من 18.27% إلى 1.27%.","did_not":"لم يعرف الجراثيم التي تنقلها الأيدي، ولم يستطع أن يقنع أكثر الأطباء في زمنه، ففُصل من عمله سنة 1849، ولم تُقبل فكرته إلا بعد موته حين جاءت أعمال باستور.","method_lesson":"قارن بين مجموعتين تختلفان في شيء واحد، وغيّر ذلك الشيء، ثم قِس النتيجة؛ ولا يكفي أن تكون محقاً، بل تحتاج أن تشرح وتقنع.","source":["S7"]}],"how_we_know":{"text":"كيف عرفنا أن الأيدي تنقل المرض؟ في مستشفى ڤيينا سنة 1847 لاحظ الطبيب زيملفايس أن الأمهات يمتن في جناح الأطباء ثلاثة أضعاف ما يمتن في جناح القابلات. ثم مات زميله بجرح صغير أصابه في أثناء التشريح، بأعراض تشبه أعراض الأمهات. فقال: شيء ينتقل بالأيدي من غرفة التشريح. فألزم الأطباء بتطهير أيديهم قبل فحص الأمهات، فانخفضت الوفيات من نحو 18 في المئة إلى أقل من 2. ولم يصدّقه كثيرون في زمنه، حتى جاءت أعمال باستور عن الجراثيم بعد ذلك.","limit_question":"ما الذي لا تُظهره تجربة الزيت والقرفة عن الميكروبات الحقيقية؟"},"what_changed":["كان كثير من الأطباء في القرن التاسع عشر يرون غسل الأيدي قبل فحص المرضى أمراً لا داعي له؛ واليوم هو أول قاعدة في كل مستشفى.","كان كثيرون يأخذون المضاد الحيوي لكل زكام؛ واليوم نعرف أنه لا يعمل على الفيروسات، وأن أخذه بلا حاجة يضرّ."],"model_limits":["رسم الخلية البيضاء وهي تبتلع الميكروب يُظهرها كبيرة ملونة؛ في الحقيقة لا تُرى إلا بالمجهر، والألوان للتمييز.","«المفتاح والقفل» تشبيه: الجسم المضاد يلتصق بجزء من الميكروب يناسب شكله.","تجربة الزيت والقرفة تُظهر أن ما يلتصق بالدهن على اليد يحتاج الصابون؛ الميكروبات أصغر بكثير من حبيبات القرفة."],"faith":{"opening":null,"closing":{"text":"الطُّهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن — أو تملأ — ما بين السماوات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو، فبائع نفسه فمعتقها أو موبقها","reference":"مسلم 223","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن اليدين أكثر ما ينقل الميكروبات، وأن الصابون والفرك يزيلانها، وأن طبيباً في ڤيينا أنقذ أمهات كثيرات بغسل الأيدي. والحديث في البطاقة يجعل الطُّهور، وهو الطهارة بالوضوء والغسل، شطر الإيمان، أي نصفه. الحديث لا يتكلم عن الميكروبات، والعلم لا يشرح الحديث؛ لكن المسلم الذي يتوضأ خمس مرات كل يوم يعرف أن النظافة عبادة وعادة معاً. متى {تتذكر|تتذكرين} أن {تغسل|تغسلي} يديك{|ِ} اليوم؟","reviewed":false,"hadith_key":"muslim:223","highlight":"الطُّهور شطر الإيمان","level":"ترغيب","concept":"الطهارة من الإيمان، والنظافة عبادة وعادة.","avoid":"لا نقول إن الحديث يتكلم عن الميكروبات أو إن العلم أثبته؛ ولا نجعل الطهارة الشرعية والنظافة الصحية شيئاً واحداً، ولا نخيف الطفل من كل ميكروب.","lead":"عن أبي مالك الأشعري رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 223","grader":"","cards":[]}},"life":[{"situation":"في المدرسة، قبل الغداء، قال صديقي: لا وقت، نشطف أيدينا بالماء ثانيتين ونأكل.","science":"الميكروبات تلتصق بالدهن والأوساخ على اليد، والماء وحده لا يزيلها؛ والصابون مع الفرك 20 ثانية يزيلها، والطعام يدخل ما على اليد إلى الفم مباشرة.","action":"أقول له: تعال نغسل بالصابون ونغني نشيداً قصيراً مرتين، ثم نأكل؛ وأغسل الكفين والظهر وما بين الأصابع وتحت الأظفار.","value":"النظافة عادة وعبادة، وحب الخير للصديق.","why":"لماذا 20 ثانية؟ لأن الفرك يصل إلى الأماكن الخفية ويعطي الصابون وقتاً ليفكّ الدهن؛ وهي ثوانٍ قليلة تحمينا ومن نجلس معهم.","cards":[],"verses":[]},{"situation":"أختي أصابها زكام، فأرادت أن تأخذ مضاداً حيوياً بقي من مرض أخي الشهر الماضي.","science":"الزكام من فيروس، والمضاد الحيوي لا يعمل على الفيروسات ولا يحسّن حال المصاب بها؛ وله آثار جانبية، ولا يؤخذ دواء غيرنا ولا بقايا دواء قديم.","action":"أقول لها بلطف إن المضاد الحيوي لا يشفي الزكام، وأخبر أمي لتقرر ما تحتاجه، وأحضر لها الماء، وأذكّرها بالعطاس في المرفق وغسل اليدين.","value":"الأمانة في الدواء، والرحمة بالمريض.","why":"لماذا لا تأخذه ولو كان في البيت؟ لأنه وُصف لأخي ولمرض آخر، ولا يعمل على الفيروس، وقد يؤذيها؛ والطبيب والأهل يقررون ما يناسبها.","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا يمرض بعض الناس بالزكام كثيراً، ولا يمرض غيرهم إلا نادراً، وهم يعيشون في البيت نفسه؟","why_open":"يعرف العلماء أن النوم والعمر وأشياء في الجسم كله لها دور، لكن كيف تجتمع لتجعل شخصاً بعينه يمرض أو لا يمرض ما زال يُبحث."}],"notebook":{"draw":"ارسم{|ي} جسماً من الأمام، وعليه حواجزه: سور حول الجلد، ومخاطاً في الأنف، ودموعاً عند العين، وحمضاً في المعدة. ثم ارسم{|ي} إصبعاً فيه شظية، وحولها احمرار، وخلية بيضاء تبتلع الميكروب. ثم ارسم{|ي} يدين تحت الماء بالصابون، و{اكتب|اكتبي} 20 ثانية. المستوى ب: ارسم{|ي} جسماً مضاداً كالحرف Y يلتصق بالميكروب.","label":["الجلد","المخاط والأهداب","الدموع","الحمض في المعدة","الالتهاب","البلعميات","الأجسام المضادة","الذاكرة","الصابون 20 ثانية","— ب: الخلايا التائية والبائية"],"write":"أشرح: لماذا لا أمرض كلما لمست شيئاً؟ وماذا يحدث حول الشظية؟ ولماذا لا أصاب ببعض الأمراض مرتين؟ ولماذا لا يكفي الماء وحده؟ وأكتب نتيجة تجربة القرفة."},"imgs":[]};
