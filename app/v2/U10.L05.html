<script>
const LD = {"id":"U10.L05","first":false,"title":"أجسام مختلفة","driving_question":"{اسم}، زميلك{|ِ} يستعمل كرسياً متحركاً، وزميل آخر يحمل بخاخاً للربو. كيف {تكون|تكونين} {صديقاً جيداً|صديقةً جيدةً} لهما؟","central_fact":"تختلف أجسامنا: بعضنا يعيش مع إعاقة حركية أو سمعية أو بصرية، وبعضنا مع مرض مزمن كالربو والسكري والحساسية الشديدة والصرع؛ وهذه لا تُعدي، وأدوات العون وإزالة العوائق والاحترام تجعل كل زميل يتعلم ويلعب معنا.","next":null,"nexts":[],"hook":{"text":"{اسم}، زميل جديد يستعمل كرسياً متحركاً. ما أول ما {تفعله|تفعلينه}؟","options":["أنظر إليه بشفقة","أسلم عليه وأعرّفه بنفسي","أدفع كرسيه فوراً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["skeleton","nervous"],"highlight":["bones","eye"],"zoom":"body"},"text":"أجسامنا تختلف. بعضنا يعيش مع الإعاقة: صعوبة دائمة في الحركة أو السمع أو البصر أو غيرها. ولكل صعوبة أدوات العون: أدوات تعين الإنسان على ما يصعب عليه. في الحركة: الكرسي المتحرك والعكاز. وفي السمع: سماعة الأذن، ولغة الإشارة، وهي لغة كاملة باليدين والوجه يتكلم بها كثير من الصمّ. وفي البصر: النظارة، والعصا البيضاء، وطريقة برايل، وهي كتابة بنقاط بارزة تُقرأ بأطراف الأصابع. وأداة العون جزء من صاحبها، فلا {تلمسها|تلمسيها} بلا إذنه."},{"id":"E2","level":"A","atlas":{"layers":["skeleton"],"highlight":["bones"],"zoom":"body"},"text":"وهل الإعاقة في الجسم وحده؟ {فكّر|فكّري}: زميل على كرسي متحرك أمام درج بلا منحدر لا يصعد؛ وأمام منحدر يصعد بسهولة. فالإعاقة تكبر أو تصغر بحسب ما حول الإنسان من عوائق أو عون. وتقدّر منظمة الصحة العالمية أن نحو واحد من كل ستة أشخاص في العالم يعيش مع إعاقة كبيرة. فإذا أزلنا العوائق، صار الطريق للجميع."},{"id":"E3","level":"A","atlas":{"layers":["respiratory","nervous"],"highlight":["lungs","brain"],"zoom":"body"},"text":"وبعض الزملاء يعيشون مع المرض المزمن: حالة تبقى مدة طويلة، يعيش معها صاحبها ويتعلم ويلعب، بعلاج وخطة من الطبيب. في الربو تنتفخ مجاري الهواء وتضيق، فيسعل أو يصفر صدره؛ ومعه بخاخ يعمل بسرعة. وفي السكري من النوع الأول لا يصنع البنكرياس الرسالة الكيميائية التي تُدخل السكر إلى الخلايا، فيفحص صاحبه سكره ويأخذ علاجه. وفي الحساسية الشديدة يرد جهاز الدفاع رداً شديداً على طعام معين. وفي الصرع تأتي نوبات من اضطراب رسائل الدماغ، كما {عرفت|عرفتِ} في درس الأعصاب."},{"id":"E4","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"body"},"text":"هذه الحالات لا تُعدي، لا باللمس ولا باللعب. ولا ذنب لصاحبها: السكري من النوع الأول مثلاً لا يأتي من الطعام. فكيف {تساعد|تساعدين}؟ في نوبة الربو: {ابق|ابقي} {هادئاً|هادئةً}، و{ساعده|ساعديه} على بخاخه، و{ناد|نادي} كبيراً. ومع صديق عنده حساسية من طعام: لا {تشاركه|تشاركيه} طعامك{|ِ}، و{اغسل|اغسلي} يديك{|ِ} بعد الأكل. وفي نوبة الصرع: {ناد|نادي} كبيراً فوراً، و{أبعد|أبعدي} ما قد يؤذيه، ولا {تضع|تضعي} شيئاً في فمه، ولا {تمسكه|تمسكيه}."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"والأهم: الاحترام. {اسأل|اسألي} قبل أن {تساعد|تساعدي}: «هل تريد عوناً؟»، فقد لا يحتاجه. {كلّم|كلّمي} زميلك{|ِ} نفسه، لا مرافقه. لا {تسخر|تسخري}، ولا {تنظر|تنظري} إليه نظرة شفقة جارحة؛ فهو زميل له هوايات ونكات وأحلام مثلك{|ِ}. {عدّل|عدّلي} اللعبة ليشارك فيها الجميع. وإن {رأيت|رأيتِ} من يسخر منه، فلا {تضحك|تضحكي}، و{أخبر|أخبري} كبيراً."},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["skin_receptors"],"zoom":"body"},"text":"للمستوى ب: تصف منظمة الصحة العالمية الإعاقة بأنها تنتج من التقاء حالة صحية بعوامل في البيئة وفي الشخص. ومثال جميل على إزالة العائق: لويس برايل. فقد بصره صغيراً، وفي نحو الخامسة عشرة، وهو طالب في مدرسة للمكفوفين في باريس، اخترع كتابة كل حرف فيها من ست نقاط بارزة. رفضها بعض المسؤولين أول الأمر، ثم صارت تُستعمل في العالم كله. فالعائق لم يكن في عينيه وحدهما، بل في كتب لا يستطيع قراءتها."}],"practice":[{"id":"U10.L05.P1","after":"E1","objective":"U10.L05.O1","type":"choose","prompt":"زميلة صمّاء. أي هذه قد تعينها على التواصل؟","options":["العصا البيضاء","العكاز","لغة الإشارة","الكرسي المتحرك"],"answer":2,"explanation":"لغة الإشارة لغة كاملة باليدين والوجه.","level":"A","feedback_wrong":"أي أداة للسمع والتواصل؟","feedback_by_option":{"0":"العصا البيضاء للبصر.","1":"العكاز للحركة.","3":"الكرسي للحركة."}},{"id":"U10.L05.P2","after":"E2","objective":"U10.L05.O5","type":"choose","prompt":"أي هذه يزيل عائقاً عن زميل على كرسي متحرك؟","options":["منحدر عند الباب","درج عالٍ","باب ضيق","حقائب في الممر"],"answer":0,"explanation":"المنحدر يفتح الطريق.","level":"A","feedback_wrong":"ما الذي يجعل الطريق للجميع؟","feedback_by_option":{"1":"الدرج عائق.","2":"الباب الضيق عائق.","3":"الحقائب عائق."},"detects":"M152"},{"id":"U10.L05.P3","after":"E3","objective":"U10.L05.O2","type":"choose","prompt":"في الربو:","options":["تنتفخ مجاري الهواء وتضيق","يتوقف القلب","تنكسر العظام","يضعف السمع"],"answer":0,"explanation":"مجاري الهواء تنتفخ وتضيق.","level":"A","feedback_wrong":"أي جهاز يخصه الربو؟","feedback_by_option":{"1":"الربو في مجاري الهواء.","2":"لا علاقة له بالعظام.","3":"لا علاقة له بالسمع."}},{"id":"U10.L05.P4","after":"E4","objective":"U10.L05.O3","type":"choose","prompt":"زميلك{|ِ} في نوبة صرع. ماذا {تفعل|تفعلين}؟","options":["أضع شيئاً في فمه","أمسكه بقوة","أصوّره","أنادي كبيراً وأبعد ما قد يؤذيه"],"answer":3,"explanation":"ننادي كبيراً، ونبعد ما يؤذيه، ولا نضع شيئاً في فمه ولا نمسكه.","level":"A","feedback_wrong":"{تذكّر|تذكّري} ما لا نفعله في النوبة.","feedback_by_option":{"0":"قد يؤذي أسنانه أو يبلعه.","1":"لا نوقف حركته.","2":"لا نصور زميلاً في نوبة."},"detects":"M154"},{"id":"U10.L05.P5","after":"E5","objective":"U10.L05.O4","type":"choose","prompt":"زميل على كرسي متحرك أمام باب ثقيل. ماذا {تفعل|تفعلين} أولاً؟","options":["أدفع كرسيه دون أن أسأل","أسأله: هل تريد عوناً؟","أنتظر أن يطلب المعلم","أبتعد"],"answer":1,"explanation":"نسأل قبل أن نساعد.","level":"A","feedback_wrong":"ما الخطوة الأولى في العون باحترام؟","feedback_by_option":{"0":"الكرسي جزء منه؛ نسأل أولاً.","2":"{تستطيع|تستطيعين} أن {تسأل|تسألي} بنفسك{|ِ}.","3":"العون يبدأ بالسؤال."}}],"check":[{"id":"U10.L05.C1","objective":"U10.L05.O1","type":"explain_open","prompt":"{اذكر|اذكري} ثلاث أدوات عون، وما تعين عليه كل منها.","answer":"الكرسي المتحرك للحركة؛ سماعة الأذن ولغة الإشارة للسمع والتواصل؛ العصا البيضاء وطريقة برايل للبصر.","level":"A","rubric":"R1"},{"id":"U10.L05.C2","objective":"U10.L05.O3","type":"true_false_why","prompt":"«الربو والسكري والصرع لا تُعدي». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لا تنتقل باللمس ولا باللعب، وهي ليست من ميكروبات.","level":"A","rubric":"R1"},{"id":"U10.L05.C3","objective":"U10.L05.O2","type":"explain_open","prompt":"{صل|صلي} كل حالة بالجهاز الذي تخصه: الربو، والسكري من النوع الأول، والحساسية الشديدة، والصرع.","answer":"الربو: مجاري الهواء؛ السكري: البنكرياس وسكر الدم؛ الحساسية: جهاز الدفاع؛ الصرع: رسائل الدماغ.","level":"A","rubric":"R1"},{"id":"U10.L05.C4","objective":"U10.L05.O3","type":"explain_open","prompt":"في الرحلة المدرسية، صديقك{|ِ} عنده حساسية شديدة من طعام. {اذكر|اذكري} ثلاثة أشياء {تفعلها|تفعلينها}.","answer":"لا أشاركه طعامي ولا أدوات أكلي؛ أغسل يدي بعد الأكل؛ أنادي كبيراً فوراً إن صعب عليه التنفس.","level":"A","rubric":"R1"},{"id":"U10.L05.C5","objective":"U10.L05.O4","type":"true_false_why","prompt":"«نسأل الزميل قبل أن نساعده». صح أم خطأ؟ ولماذا؟","answer":"صح؛ قد لا يحتاج عوناً، أو يريده بطريقة معينة؛ وأداته جزء منه.","level":"A","rubric":"R1"},{"id":"U10.L05.C6","objective":"U10.L05.O5","type":"fix_model","prompt":"قال خالد: «الإعاقة في جسم الشخص وحده، ولا نستطيع أن نفعل شيئاً». {صحّح|صحّحي} له.","answer":"الإعاقة تكبر بالعوائق حوله وتصغر بالعون: المنحدر، ولغة الإشارة، وطريقة برايل؛ ونستطيع أن نزيل العوائق.","level":"B","rubric":"R1"}],"concepts":[{"id":"disability","term":{"ar":"الإعاقة","en":"Disability","zh":"残疾","pinyin":"cánjí","match":["الإعاقة","إعاقة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"صعوبة دائمة في الحركة أو السمع أو البصر أو غيرها، تكبر أو تصغر بحسب ما حول الإنسان من عوائق أو عون.","B":"تصفها منظمة الصحة العالمية بأنها تنتج من التقاء حالة صحية بعوامل في البيئة وفي الشخص."}},{"id":"assistive_tool","term":{"ar":"أدوات العون","en":"Assistive products","zh":"辅助器具","pinyin":"fǔzhù qìjù","match":["أدوات العون","أداة العون","أداة عون"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"أدوات تعين الإنسان على ما يصعب عليه: الكرسي المتحرك، والعكاز، والسماعة، والنظارة، والعصا البيضاء.","B":"هي جزء من صاحبها، فلا نلمسها أو نحركها بلا إذنه."}},{"id":"sign_language","term":{"ar":"لغة الإشارة","en":"Sign language","zh":"手语","pinyin":"shǒuyǔ","match":["لغة الإشارة"]},"priority":"supporting","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"لغة كاملة باليدين والوجه، يتكلم بها كثير من الصمّ.","B":"لكل بلد تقريباً لغة إشارة خاصة به، ولها قواعدها."}},{"id":"braille","term":{"ar":"طريقة برايل","en":"Braille","zh":"盲文","pinyin":"mángwén","match":["طريقة برايل","برايل"]},"priority":"supporting","atlas":{"layer":"nervous","element":"skin_receptors"},"card":{"A":"كتابة بنقاط بارزة تُقرأ بأطراف الأصابع، يقرأ بها المكفوفون.","B":"كل حرف من ست نقاط في عمودين، اخترعها لويس برايل في نحو 1824."}},{"id":"chronic_condition","term":{"ar":"المرض المزمن","en":"Chronic condition","zh":"慢性病","pinyin":"mànxìngbìng","match":["المرض المزمن","مرض مزمن","الأمراض المزمنة","أمراض مزمنة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"حالة تبقى مدة طويلة، يعيش معها صاحبها ويتعلم ويلعب، بعلاج وخطة من الطبيب، كالربو والسكري.","B":"لا تُعدي، ولا ذنب لصاحبها فيها."}}],"experiment":{"title":"مدرستنا للجميع: صيد العوائق","materials":["مخطط بسيط للمدرسة","ملصقات حمراء وخضراء","شريط قياس","بطاقات نقاط بارزة (برايل) مصنوعة من أزرار أو صمغ","دفتر الأطلس"],"steps":["مع المعلم: {امش|امشي} في ممرات المدرسة، و{تخيّل|تخيّلي} أنك{|ِ} على كرسي متحرك: أين الدرج بلا منحدر؟ أين الباب الضيق؟","{ضع|ضعي} ملصقاً أحمر عند كل عائق، وأخضر عند كل عون (منحدر، مصعد، باب واسع).","{أغمض|أغمضي} عينيك{|ِ} و{المس|المسي} بطاقة النقاط البارزة: كم حرفاً {تعرف|تعرفين}؟","{تعلّم|تعلّمي} من المعلم إشارة «شكراً» و«صديق» بلغة الإشارة في بلدك{|ِ}.","{اكتب|اكتبي} مع مجموعتك{|ِ} اقتراحاً للمدير يزيل عائقاً واحداً."],"safety":["لا نجلس في كرسي متحرك يملكه زميل ولا نلعب به.","التخيل للتعلم لا للسخرية؛ لا نمثل إعاقة على سبيل المزاح.","إغماض العينين مع زميل يمسك يدك في مكان آمن."],"expected":"في أكثر المدارس عوائق صغيرة يسهل إزالة بعضها، كالأشياء في الممرات.","explain":"الإعاقة تكبر بالعوائق وتصغر بالعون؛ وما نصلحه في المدرسة ينفع الجميع، كالمنحدر الذي ينفع العربات أيضاً.","record":"العوائق ___ — العون ___ — اقتراحنا ___ — إشارتان تعلمتهما ___","alternatives":["من لا يستطيع التجول: يحلل مخطط مدرسة متخيلة في المشهد.","المستوى ب: يكتب اسمه بنقاط برايل من جدول الحروف."]},"find_the_error":[{"id":"FE1","atlas_variant":"seizure_mouth","error":"رسم: طفل يضع ملعقة في فم زميل في نوبة","answer":"لا شيء في الفم ولا إمساك؛ ننادي كبيراً","detects":"M154"},{"id":"FE2","atlas_variant":"contagious_sign","error":"لوحة: لا تلعب مع من عنده سكري حتى لا يُعديك","answer":"السكري لا يُعدي","detects":"M151"},{"id":"FE3","atlas_variant":"stairs_only","error":"مدخل مدرسة بدرج فقط","answer":"نضيف منحدراً ليدخل الجميع","detects":"M152"}],"numbers":[{"text":"نحو واحد من كل ستة أشخاص في العالم يعيش مع إعاقة كبيرة.","source":["S1"]},{"text":"ست نقاط بارزة لكل حرف في طريقة برايل.","source":["S8"]}],"true_size":[{"text":"ست نقاط صغيرة فقط تكفي لكتابة كل حرف بطريقة برايل.","source":["S8"]}],"animal":null,"organ_letter":{"from":"الجلد","text":"مرحباً، أنا جلدك{|ِ}، وفي أطراف أصابعك{|ِ} عندي مستقبِلات كثيرة دقيقة. بعض الناس لا يرون بأعينهم، فيقرؤون بي: يمرّون بأطراف أصابعهم على نقاط بارزة، فيعرفون الحروف. وبعضهم لا يسمعون، فيتكلمون بأيديهم ووجوههم. وبعضهم يمشون بكرسي متحرك، ويسبقونك{|ِ} في السباق! كل جسم يجد طريقه. فإذا {قابلت|قابلتِ} زميلاً مختلفاً، {سلّم|سلّمي} عليه، و{اسأل|اسألي} قبل أن {تساعد|تساعدي}، و{العب|العبي} معه. الأجسام تختلف، والقلوب تتقارب."},"history":[{"who":"لويس برايل","origin":"فرنسا","where_when":"باريس، 1824–1825","did":"اخترع وهو طالب في مدرسة للمكفوفين، في نحو الخامسة عشرة، كتابة بنقاط بارزة كل حرف فيها من ست نقاط، بانياً على كتابة عسكرية بالنقاط.","did_not":"لم تُقبل طريقته في حياته قبولاً عاماً؛ اعتُمدت في العالم بعد وفاته.","method_lesson":"نبني على فكرة غيرنا ونحسّنها بالتجربة، ولا نيأس إن رُفضت الفكرة أول مرة.","source":["S8"]}],"how_we_know":{"text":"كيف صار المكفوفون يقرؤون ويكتبون؟ فقد لويس برايل بصره وهو صغير. وفي مدرسة للمكفوفين في باريس رأى كتابة عسكرية بالنقاط صنعها ضابط ليقرأ الجنود في الظلام، وكانت صعبة. فجرّب وعدّل حتى صنع، وهو في نحو الخامسة عشرة، كتابة كل حرف فيها من ست نقاط بارزة. رفضها بعض الكبار أول الأمر، ثم صارت تُستعمل في العالم كله.","limit_question":"لماذا رفض بعض المسؤولين طريقة برايل أول الأمر، في رأيك{|ِ}؟"},"what_changed":["كان يُظن أن الإعاقة في الشخص وحده؛ واليوم نعرف أن العوائق حوله تكبرها، وأن المنحدر والكتابة البارزة ولغة الإشارة تصغرها.","كان بعض الناس يخافون من الصرع ويظنونه يُعدي؛ واليوم نعرف أنه لا يُعدي، وأن الإسعاف الصحيح بسيط."],"model_limits":["وصف الحالات في الدرس مختصر؛ كل شخص يختلف، وخطته يضعها طبيبه.","أدوات العون أكثر بكثير مما في الدرس."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقْنَـٰكُم مِّن ذَكَرٍۢ وَأُنثَىٰ وَجَعَلْنَـٰكُمْ شُعُوبًۭا وَقَبَآئِلَ لِتَعَارَفُوٓا۟ ۚ إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ ۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۭ","reference":"الحجرات 13","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} أن الناس خُلقوا مختلفين ليتعارفوا، وأن أكرمهم عند الله أتقاهم. واليوم نتعرف على زملاء تختلف أجسامهم: في الحركة أو السمع أو البصر، أو يعيشون مع مرض مزمن. والآية لا تتكلم عن الإعاقة، والعلم لا يشرح الآية؛ لكنها تعلّمنا أن قدر الإنسان ليس في جسمه. كيف {تتعرف|تتعرفين} على زميل مختلف عنك{|ِ} هذا الأسبوع؟","reviewed":false,"quran_key":"49:13","hl_words":[11,15],"highlight":"إن أكرمكم عند الله أتقاكم","level":"ترغيب","concept":"قدر الإنسان بتقواه لا بجسمه.","avoid":"لا نجعل الإعاقة ابتلاءً يُشار به إلى صاحبها أمام الصف، ولا نجعل الآية تفسيراً علمياً.","cards":[]},"closing":{"text":"حق المسلم على المسلم خمس: ردّ السلام، وعيادة المريض، واتباع الجنائز، وإجابة الدعوة، وتشميت العاطس","reference":"البخاري 1240؛ ومسلم 2162 بلفظ قريب","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن بعض زملائنا يعيشون مع مرض مزمن، وأن أجسامنا تختلف. والحديث في البطاقة يذكر حقوقاً بيننا، منها عيادة المريض. والحديث لا يتكلم عن الربو أو السكري بعينهما، والعلم لا يشرحه؛ لكنه يعلّمنا أن نسأل عن الزميل إذا غاب لمرضه، ونزوره، ونكون معه. من {ستسأل|ستسألين} عنه هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:1240","highlight":"وعيادة المريض","level":"ترغيب","concept":"من حقوق المسلم على المسلم عيادة المريض.","avoid":"لا نصف الزميل ذا المرض المزمن بأنه «مريض» دائماً أمام الصف؛ العيادة حين يمرض ويغيب.","lead":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","narration":false,"source":"البخاري 1240؛ ومسلم 2162 بلفظ قريب","grader":"","cards":[]}},"life":[{"situation":"زميل في الصف يمشي بعكاز، وبعض الأولاد يقلدون مشيته ويضحكون.","science":"العكاز أداة عون، والمشي المختلف لا ينقص من قدره؛ والسخرية تؤذي.","action":"لا أضحك، وأقول لهم بهدوء: «هذا يؤذيه»، وأمشي مع زميلي، وأخبر المعلم إن تكرر.","value":"لا سخرية من أحد.","why":"لماذا لا أضحك وهم كلهم يضحكون؟ لأن الله نهانا أن يسخر بعضنا من بعض، كما في الآية في البطاقة، وقد يكون المسخور منه خيراً من الساخرين.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]},{"situation":"زميلتي التي تعيش مع الربو غابت أسبوعاً في المستشفى.","science":"نوبات الربو قد تشتد أحياناً، والراحة والعلاج يعيدانها، والربو لا يُعدي.","action":"أسأل عنها، وأرسل لها مع المعلمة بطاقة، وأحفظ لها ما فاتها من الدروس، وأرحب بها حين تعود.","value":"الإحساس بالآخرين.","why":"لماذا أهتم وهي ليست أختي؟ لأن المؤمنين في تراحمهم كالجسد الواحد، يحس بعضه بألم بعض، كما في الحديث في البطاقة.","hadith":["muslim:2586"],"cards":[{"key":"muslim:2586","lead":"عن النعمان بن بشير رضي الله عنهما قال: قال رسول الله ﷺ:","text":"مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد، إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى","narration":false,"source":"مسلم 2586","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كيف نصمم مدرسة يتعلم فيها كل الأطفال معاً بسهولة؟","why_open":"المصممون والمعلمون يجربون أفكاراً جديدة كل سنة، ولكل مدرسة حاجاتها."}],"notebook":{"draw":"{ارسم|ارسمي} مدرسة للجميع: منحدر، وباب واسع، ولوحة بطريقة برايل، وزملاء يلعبون معاً. المستوى ب: {اكتب|اكتبي} اسمك{|ِ} بنقاط برايل.","label":["الإعاقة","أدوات العون","لغة الإشارة","طريقة برايل","المرض المزمن"],"write":"أشرح: ما الإعاقة؟ وما الأمراض المزمنة التي يعيش معها زملاء؟ وكيف أساعد باحترام؟"},"imgs":["U10.L05-E1","U10.L05-E2","U10.L05-E3","U10.L05-E4","U10.L05-E5","U10.L05-E6"]};
