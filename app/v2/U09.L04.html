const LD = {"id":"U09.L04","first":false,"title":"اللقاحات، وقضية الوحدة: كيف نحمي من لا يستطيع حماية نفسه؟","driving_question":"{اسم}، مرضٌ قديم قتل مئات الملايين من الناس قروناً طويلة، ولا يصيب اليوم أحداً في العالم كله. ما الذي تغيّر؟ ولماذا يُعطى الطفل السليم إبرة تحميه من مرض لم يصبه؟","central_fact":"اللقاح يدرّب الدفاع المتخصص بجزء من الميكروب أو بنسخة ضعيفة أو غير نشطة منه، فيصنع الجسم أجساماً مضادة وذاكرة دون المرض؛ وحين يتلقح أكثر الناس يُحمى من لا يستطيع التلقح. وبهذا قُضي على الجدري سنة 1980، ومنع لقاح الحصبة نحو 60 مليون وفاة بين 2000 و2023.","next":null,"hook":{"text":"{اسم}، طفلة رضيعة في بيت جارك{|ِ} ضعيفة المناعة بسبب مرض، ولا يستطيع الطبيب أن يعطيها كل ما يحمي. كيف يمكن أن يحميها الناس من حولها؟","options":["لا يستطيع أحد أن يحميها","حين يحمي من حولها أنفسهم من المرض، لا يصل إليها","بأن نبتعد عنها إلى الأبد","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["blood"],"highlight":["antibodies","memory_cells"],"zoom":"cells"},"text":"{تذكّر|تذكّري}: حين يلقى جسمك{|ِ} ميكروباً جديداً يحتاج أياماً ليصنع الأجسام المضادة، فتمرض{|ين}، ثم يتذكره. فماذا لو تعلّم جسمك{|ِ} صورة الميكروب قبل أن يلقاه؟ هذا ما يفعله اللقاح: فيه جزء من الميكروب، أو نسخة منه ضعيفة أو غير نشطة لا تسبب المرض. فيتدرب الدفاع المتخصص عليها، ويصنع أجساماً مضادة وذاكرة. فإن جاء الميكروب الحقيقي عرفه الجسم فوراً. وبعض اللقاحات تحتاج أكثر من جرعة لتبقى الذاكرة قوية."},{"id":"E2","level":"A","atlas":{"layers":["body"],"highlight":["people","vaccinated","baby"],"zoom":"community"},"text":"بعض الناس لا يستطيعون أن يتلقحوا: من ضعفت مناعته بمرض، أو من عنده حساسية شديدة من شيء في اللقاح. فمن يحميهم؟ يحميهم من حولهم: المرض المعدي يحتاج طريقاً من شخص إلى شخص، فإذا تلقح أكثر الناس انقطع الطريق، فلا يصل الميكروب بسهولة إلى الضعيف. هذه الحماية الجماعية. فلقاحك{|ِ} لا يحميك{|ِ} وحدك{|ِ}، بل يحمي جدّك{|ِ} وجارك{|ِ} الرضيع ومريض المستشفى. لكنها ليست حماية كاملة، فنستمر في غسل الأيدي والعطاس في المرفق."},{"id":"E3","level":"A","atlas":{"layers":["skin"],"highlight":["skin_spots"],"zoom":"history"},"text":"قصة أعظم انتصار للقاح: الجدري، مرض فيروسي قتل مئات الملايين من الناس عبر القرون، وكان يقتل واحداً على الأقل من كل ثلاثة أصيبوا به. قبل أكثر من ألف سنة كتب الرازي في بغداد أول وصف سريري دقيق للجدري والحصبة، وعلامات كل منهما. وفي سنة 1796 لاحظ الطبيب جينر أن جدري البقر يحمي الحلّابات، فجرّبه على طفل فحماه. ثم لقّح الأطباء الناس في العالم كله، حتى أُعلن سنة 1980 أن الجدري لم يعد يصيب أحداً."},{"id":"E4","level":"A","atlas":{"layers":["skin"],"highlight":["burn","water","pressure"],"zoom":"hand"},"text":"وقضية وحدتنا: كيف نحمي من يتأذى أمامنا؟ هذا الإسعاف الأولي: ما نفعله فوراً قبل أن يصل الطبيب. إن احترقت يد أحد بماء ساخن: {ضعها|ضعيها} تحت ماء جارٍ بارد 20 دقيقة، و{انزع|انزعي} الخاتم أو الكم القريب إن لم يلتصق، ولا {تضع|تضعي} زبدة ولا معجوناً ولا كريماً، ولا {تفقأ|تفقئي} الفقاعات. وإن نزف جرح {اضغط|اضغطي} عليه بقطعة قماش نظيفة. و{اطلب|اطلبي} الكبار فوراً، والإسعاف إن كان الحرق كبيراً أو على الوجه، أو لم يتوقف النزف بعد عشر دقائق."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["people","care"],"zoom":"community"},"text":"وآخر الحماية رعاية بلا لوم. المرض يصيب الجميع: القوي والحريص والطبيب نفسه. فمن مرض لا نسخر منه ولا نلومه، ولا نبتعد عنه إلا بما يقوله الطبيب. وحين يعود زميلك{|ِ} بعد غياب نستقبله ونساعده فيما فاته. وفي تاريخنا مستشفيات اسمها البيمارستانات، في بغداد ودمشق والقاهرة، تعالج الغني والفقير، وكان في بيمارستان القاهرة مسجد للمسلمين وكنيسة للنصارى. هكذا نحمي من لا يستطيع أن يحمي نفسه."},{"id":"E6","level":"B","atlas":{"layers":["blood"],"highlight":["vaccine_types"],"zoom":"cells"},"text":"للمستوى ب: للقاحات أنواع. بعضها فيه ميكروب حي ضعيف، وبعضها ميكروب غير نشط، وبعضها جزء منه فقط، وبعضها الأحدث فيه تعليمات تجعل خلايانا تصنع جزءاً من الميكروب فترة قصيرة. وأي لقاح قد يسبب آثاراً جانبية، أكثرها خفيف كألم الذراع وحرارة قليلة تزول في أيام، والخطيرة نادرة جداً، والهيئات الصحية تراقب السلامة باستمرار. والنسبة اللازمة من الملقّحين لتعمل الحماية الجماعية تختلف من مرض إلى آخر، وتكون أعلى في الأمراض التي تنتقل بسهولة."}],"practice":[ back_wrong":"ما الذي يبرّد الحرق؟","feedback_by_option":{"0":"الزبدة لا توضع على الحرق.","2":"لا تُفقأ الفقاعات.","3":"لا لصقات على الحرق؛ غلاف شفاف يوضع لا يُلفّ."},"detects":"M106"},{"id":"U09.L04.P5","after":"E5","objective":"U09.L04.O4","type":"choose_reason","prompt":"عاد زميلك{|ِ} بعد أسبوع غاب فيه بمرض معدٍ، وقال بعض الأولاد: لا تجلسوا معه. ما الصواب؟","options":["نبتعد عنه دائماً لأنه مرض","نستقبله ونساعده فيما فاته، فالطبيب سمح بعودته","نسأله لماذا أهمل نفسه","نخبر الجميع بمرضه"],"answer":1,"explanation":"المرض يصيب الجميع؛ نرعى بلا لوم، ونحفظ سرّه.","level":"A","feedback_wrong":"هل المرض عيب؟","feedback_by_option":{"0":"عاد بإذن الطبيب؛ لا داعي للبعد.","2":"المرض لا يعني الإهمال.","3":"نحفظ أسرار الناس."},"detects":"M19"}],"check":[{"id":"U09.L04.C1","objective":"U09.L04.O1","type":"true_false_why","prompt":"«اللقاح يعطيك المرض نفسه لتتعوّد عليه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ فيه جزء من الميكروب أو نسخة ضعيفة أو غير نشطة لا تسبب المرض، فيتدرب الجسم ويصنع أجساماً مضادة وذاكرة.","level":"A","rubric":"R1"},{"id":"U09.L04.C2","objective":"U09.L04.O2","type":"explain_open","prompt":"{اشرح|اشرحي} لأخيك{|ِ} الصغير لماذا يحمي لقاحُه جدّته المريضة.","answer":"المرض يحتاج طريقاً من شخص إلى شخص؛ إذا تلقح هو ومن حول الجدة لم يجد الميكروب طريقاً سهلاً إليها، فتُحمى بهم وإن كانت مناعتها ضعيفة.","level":"A","rubric":"R1"},{"id":"U09.L04.C3","objective":"U09.L04.O3","type":"explain_open","prompt":"ما الذي فعله كل من الرازي وجينر في قصة الجدري؟","answer":"الرازي كتب أول وصف سريري دقيق للجدري والحصبة وعلامات كل منهما؛ وجينر جرّب جدري البقر على طفل سنة 1796 فحماه، فبدأ التلقيح الذي قضى على الجدري سنة 1980.","level":"A","rubric":"R1"},{"id":"U09.L04.C4","objective":"U09.L04.O4","type":"fix_model","prompt":"قال طفل: «احترقت يدي بالمكواة، فوضعت عليها معجون أسنان وفقأت الفقاعة لتجف». {صحّح|صحّحي} له.","answer":"يضع يده تحت ماء جارٍ بارد 20 دقيقة، ولا يضع معجوناً ولا زبدة ولا كريماً، ولا يفقأ الفقاعة، ويخبر الكبار، ويغطيه بغلاف شفاف دون لفّ.","level":"A","rubric":"R1"},{"id":"U09.L04.C5","objective":"U09.L04.O4","type":"explain_open","prompt":"متى نطلب الإسعاف فوراً بدل أن نكتفي بإسعاف البيت؟ {اذكر|اذكري} حالتين.","answer":"إذا كان الحرق كبيراً أو عميقاً أو على الوجه أو من كهرباء أو مادة كيميائية، وإذا لم يتوقف النزف بعد عشر دقائق من الضغط.","level":"A","rubric":"R1"},{"id":"U09.L04.C6","objective":"U09.L04.O5","type":"explain_open","prompt":"لماذا تستمر الهيئات الصحية في مراقبة سلامة اللقاحات بعد استعمالها؟","answer":"لأن ملايين الناس يتلقونها، والآثار النادرة جداً لا تظهر إلا في أعداد كبيرة؛ فالمراقبة تجعلنا نعرفها ونتعامل معها، والعلم يراجع نفسه.","level":"B","rubric":"R1"}],"concepts":[{"id":"vaccine","term":{"ar":"اللقاح","en":"Vaccine","zh":"疫苗","pinyin":"yìmiáo","match":["اللقاح","لقاح"]},"priority":"core","atlas":{"layer":"blood","element":"vaccine"},"card":{"A":"مادة فيها جزء من ميكروب أو نسخة ضعيفة أو غير نشطة منه، تدرّب الدفاع المتخصص فيصنع أجساماً مضادة ويتذكر الميكروب، دون أن يصيبنا المرض.","B":"بعض اللقاحات الحديثة فيها تعليمات تجعل خلايانا تصنع جزءاً من الميكروب لفترة قصيرة، فيتدرب الجسم عليه."}},{"id":"herd_immunity","term":{"ar":"الحماية الجماعية","en":"Herd (community) immunity","zh":"群体免疫","pinyin":"qúntǐ miǎnyì","match":["الحماية الجماعية"]},"priority":"core","atlas":{"layer":"body","element":"herd_immunity"},"card":{"A":"حين يتلقح أكثر الناس حول شخص لا يستطيع التلقح، لا يجد الميكروب طريقاً سهلاً إليه، فيُحمى بهم؛ لكنها ليست حماية كاملة.","B":"النسبة اللازمة من الملقّحين تختلف من مرض إلى آخر، وتكون أعلى في الأمراض التي تنتقل بسهولة كبيرة."}},{"id":"smallpox","term":{"ar":"الجدري","en":"Smallpox","zh":"天花","pinyin":"tiānhuā","match":["الجدري","جدري"]},"priority":"supporting","atlas":{"layer":"skin","element":"smallpox"},"card":{"A":"مرض فيروسي شديد كان يقتل نحو واحد من كل ثلاثة أصيبوا به، ويترك آثاراً في الجلد؛ وهو أول مرض يُقضى عليه في العالم كله باللقاح، سنة 1980.","B":"جدري الماء مرض آخر مختلف، أخفّ منه بكثير."}},{"id":"first_aid","term":{"ar":"الإسعاف الأولي","en":"First aid","zh":"急救","pinyin":"jíjiù","match":["الإسعاف الأولي"]},"priority":"supporting","atlas":{"layer":"skin","element":"first_aid"},"card":{"A":"ما نفعله فوراً لمصاب قبل أن يصل الطبيب: تبريد الحرق بالماء، والضغط على الجرح النازف، وطلب الكبار والإسعاف.","B":"الإسعاف الأكبر كالإنعاش يحتاج تدريباً عملياً بإشراف مدرّب."}}],"experiment":{"title":"لعبة الانتشار: من يحمي من؟","materials":["ورقة كبيرة وقلم","20 حبة فاصولياء أو أزرار، أو 20 قطعة ورق صغيرة","قلم أحمر وقلم أزرق"],"steps":["{ارسم|ارسمي} دائرة كبيرة عليها 20 دائرة صغيرة متجاورة: كل دائرة شخص، وكل شخص يلتقي بجاريه فقط.","الجولة الأولى (لا أحد ملقّح): {ضع|ضعي} علامة حمراء على شخص واحد: مريض. في كل دور يمرض جارا كل مريض. {عُدّ|عُدّي} الأدوار حتى يمرض الجميع، و{سجّل|سجّلي} عدد المرضى.","الجولة الثانية: {امسح|امسحي} العلامات، ثم {ضع|ضعي} علامة زرقاء على 15 شخصاً متفرقين: ملقّحون لا يمرضون ولا ينقلون المرض. ولا {تضع|تضعي} الزرقاء على شخص أو شخصين في وسط الملقّحين: هؤلاء لا يستطيعون التلقح.","{ابدأ|ابدئي} بالمريض نفسه، و{طبّق|طبّقي} القاعدة: المرض لا يعبر الشخص الأزرق.","{سجّل|سجّلي}: كم مرض في الجولة الثانية؟ وهل وصل المرض إلى من لا يستطيع التلقح؟"],"safety":["اللعبة على الورق أو بالحبوب، لا بلمس الأشخاص أو تبادل أشياء من الفم.","لا نسمّي أطفالاً حقيقيين في الصف «مرضى» أو «غير ملقّحين»؛ الدوائر أشخاص متخيلون.","حبوب الفاصولياء للعب لا للأكل، وبعيداً عن الأطفال الصغار."],"expected":"في الجولة الأولى يمرض العشرون كلهم في نحو عشرة أدوار. وفي الثانية يتوقف المرض عند أول شخص أزرق، فيمرض قليلون فقط، ولا يصل غالباً إلى من لا يستطيع التلقح إذا كان محاطاً بالملقّحين.","explain":"المرض المعدي يحتاج طريقاً من شخص إلى شخص. حين يتلقح أكثر الناس ينقطع الطريق، فيُحمى معهم من لا يستطيع التلقح: هذه الحماية الجماعية. لكنها في الحقيقة ليست كاملة، لأن الناس يلتقون بكثيرين، ولا يحمي لقاح كل أحد تماماً.","record":"الجولة 1: مرض ___ من 20 في ___ دوراً — الجولة 2: مرض ___ من 20 — هل وصل المرض إلى من لا يستطيع التلقح؟ ___","alternatives":["في الصف: يقف الأطفال في دائرة ويحمل الملقّحون بطاقة زرقاء، وتنتقل «العدوى» بلمس الكتف لا يعبر البطاقة.","من لا يستطيع اللعب: رسم الجولتين في المشهد خطوة خطوة."]},"find_the_error":[{"id":"FE1","atlas_variant":"vaccine_gives_disease","error":"لوحة: اللقاح فيه المرض نفسه ليمرضك قليلاً","answer":"فيه جزء من الميكروب أو نسخة ضعيفة أو غير نشطة لا تسبب المرض","detects":"M104"},{"id":"FE2","atlas_variant":"vaccine_only_me","error":"طفل يقول: لقاحي يحميني أنا وحدي، فلا يهم غيري","answer":"لقاحك يقطع طريق الميكروب إلى من لا يستطيع التلقح؛ هذه الحماية الجماعية","detects":"M105"},{"id":"FE3","atlas_variant":"butter_burn","error":"طفل يضع الزبدة على يد أخته المحروقة","answer":"ماء جارٍ بارد 20 دقيقة، ولا زبدة ولا كريم ولا معجون، ثم طلب الكبار","detects":"M106"}],"numbers":[{"text":"60 مليون إنسان لم يموتوا بالحصبة بين 2000 و2023 بفضل لقاحها: أكثر من عدد سكان بلاد كثيرة.","source":["S1"]},{"text":"20 دقيقة تحت ماء جارٍ بارد: هذا إسعاف الحرق، وليس ثواني قليلة.","source":["S3"]}],"true_size":[],"animal":null,"organ_letter":{"from":"ذاكرة المناعة في جسمك{|ِ}","text":"مرحباً، أنا ذاكرة المناعة: خلايا بيضاء صغيرة تحفظ صور الميكروبات التي لقيتها. حين {مرضت|مرضتِ} بالزكام تعلّمت صورة ذلك الفيروس، فإن عاد عرفته بسرعة. واللقاح يعلّمني صورة الميكروب الخطير قبل أن يأتي، بلا مرض: تدريب قبل المباراة. ربما {تحسّ|تحسّين} بألم في ذراعك{|ِ} يوماً بعد اللقاح، ذلك لأني أتعلم. وحين {تتلقح|تتلقحين} لا أحميك{|ِ} وحدك{|ِ}، بل أقطع الطريق على الميكروب إلى جدّك{|ِ} وإلى الرضيع في بيت جارك{|ِ}. و{اغسل|اغسلي} يديك{|ِ}، و{نم|نامي} جيداً، فأنا أعمل أحسن حين {ترتاح|ترتاحين}."},"history":[{"who":"أبو بكر محمد بن زكريا الرازي","origin":"الري، فارس","where_when":"الري وبغداد، نحو 854 – 925 أو 935","did":"عمل رئيساً للأطباء في مستشفى الري ثم في بغداد، وكتب «رسالة في الجدري والحصبة» فيها أول وصف سريري دقيق للمرضين، وعلامات اقتراب الطفح في كل منهما، فتعلّم الأطباء أن يعرفوا كل مرض بعلاماته. وتُرجمت رسالته إلى اللاتينية واليونانية ولغات كثيرة.","did_not":"لم يعرف أن سبب المرضين فيروسات، ولا كيف تنتقل العدوى، ولم يكن في زمنه لقاح ولا مجهر.","method_lesson":"الوصف الدقيق يفرّق بين ما يبدو متشابهاً؛ سجّل ما تراه في كل مريض.","source":["S5","S6"]},{"who":"إدوارد جينر","origin":"إنجلترا","where_when":"إنجلترا، مايو ويوليو 1796","did":"لاحظ أن الحلّابات اللواتي أصابهن جدري البقر الخفيف لا يمرضن بالجدري، فأخذ مادة من جدري البقر وأدخلها في جلد الطفل جيمس فيبس، ثم عرّضه للجدري بعد شهرين فلم يمرض؛ فكان أول من لُقّح ضد الجدري.","did_not":"لم يعرف الفيروسات ولا الأجسام المضادة؛ وتجربته على طفل لا تُقبل اليوم بلا موافقة ومراجعة أخلاقية.","method_lesson":"ملاحظة في الحياة اليومية تصير فكرة، والفكرة تُختبر بتجربة؛ لكن التجربة على الناس لها اليوم قواعد أخلاقية تحميهم.","source":["S2"]}],"how_we_know":{"text":"كيف عرفنا أن اللقاح يحمي؟ في مايو 1796 أخذ الطبيب الإنجليزي جينر مادة من بثرة جدري البقر في يد حلّابة، وأدخلها في جلد الطفل جيمس فيبس، فمرض مرضاً خفيفاً وتعافى. وبعد شهرين عرّضه لمادة من جدري الإنسان، فلم يمرض. ثم تابع العلماء التلقيح في ملايين الناس قرابة قرنين، حتى أعلنت منظمة الصحة العالمية سنة 1980 أن الجدري لم يعد يصيب أحداً. وقبل جينر بنحو تسعة قرون كتب الرازي في بغداد وصفاً دقيقاً للجدري والحصبة، علّم الأطباء أن يعرفوا كل مرض بعلاماته.","limit_question":"ما الذي لا تُظهره لعبة الانتشار في دائرة عن انتشار المرض بين الناس حقاً؟"},"what_changed":["كان الجدري يقتل واحداً على الأقل من كل ثلاثة أصيبوا به، ولم يكن له علاج؛ واليوم لا يصيب أحداً في العالم، بفضل اللقاح.","كان كثيرون يضعون الزبدة أو المعجون على الحرق؛ واليوم يقول الأطباء: ماء جارٍ بارد 20 دقيقة، ولا زبدة ولا كريم."],"model_limits":["لعبة الانتشار في دائرة يلتقي فيها كل شخص بجاريه فقط؛ في الحقيقة يلتقي الناس بكثيرين، وبعض الأمراض تنتقل أسهل من غيرها.","في اللعبة يحمي الملقّح حماية كاملة؛ في الحقيقة لا يحمي أي لقاح كل الناس تماماً، والحماية الجماعية ليست كاملة.","رسم اللقاح والخلايا البيضاء والأجسام المضادة نموذج مكبّر؛ كلها لا تُرى بالعين."],"faith":{"opening":{"text":"مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنَّهُۥ مَن قَتَلَ نَفْسًۢا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍۢ فِى ٱلْأَرْضِ فَكَأَنَّمَا قَتَلَ ٱلنَّاسَ جَمِيعًۭا وَمَنْ أَحْيَاهَا فَكَأَنَّمَآ أَحْيَا ٱلنَّاسَ جَمِيعًۭا ۚ وَلَقَدْ جَآءَتْهُمْ رُسُلُنَا بِٱلْبَيِّنَـٰتِ ثُمَّ إِنَّ كَثِيرًۭا مِّنْهُم بَعْدَ ذَٰلِكَ فِى ٱلْأَرْضِ لَمُسْرِفُونَ","reference":"المائدة 32","grade":"قرآن","usage":"قيمة","reflection":"الآية في البطاقة تجعل حرمة النفس الواحدة عظيمة: من حفظ حياة إنسان واحد كان كمن حفظ حياة الناس كلهم. واليوم {ستعرف|ستعرفين} كيف حفظ العلم حياة ملايين الناس باللقاح، وكيف {تستطيع|تستطيعين} {أنت|أنتِ} أن تحمي جدّك{|ِ} وجارك{|ِ} الرضيع، وأن {تسعف|تسعفي} من احترقت يده أمامك{|ِ}. الآية لا تتكلم عن اللقاح، والعلم لا يشرح الآية؛ لكن من عرف قيمة النفس في الآية رأى في كل عمل يحفظ الحياة عبادة. من {تستطيع|تستطيعين} أن {تحميه|تحمينه} هذا الأسبوع؟","reviewed":false,"quran_key":"5:32","hl_words":[21,26],"highlight":"ومن أحياها فكأنما أحيا الناس جميعا","level":"تفكر","concept":"حرمة كل نفس إنسانية، وعظمة كل عمل يحفظ الحياة.","avoid":"لا نقول إن الآية تذكر اللقاح أو الإسعاف أو إن العلم أثبتها؛ ولا يُقتبس لفظها خارج البطاقة، ولا يُستعمل سياق بني إسرائيل في الآية للتعميم على أحد.","cards":[]},"closing":{"text":"ما أنزل الله داءً إلا أنزل له شفاءً","reference":"البخاري 5678","grade":"صحيح","usage":"غاية","reflection":"عرفنا اليوم أن الجدري قتل الناس قروناً، ثم جاء العلماء فبحثوا ولاحظوا وجرّبوا، حتى صار مرضاً من الماضي. والحديث في البطاقة يخبرنا أن الله ما أنزل داءً إلا أنزل له شفاءً. فالبحث عن الدواء والوقاية عمل مشروع يُرجى فيه الخير، وكل طبيب وعالِم يبحث عن علاج يمشي في هذا الطريق. والحديث لا يتكلم عن اللقاح بعينه، ولا يعني أن كل دواء نعرفه اليوم. أيّ مرض {تتمنى|تتمنين} أن يجد العلماء شفاءه؟","reviewed":false,"hadith_key":"bukhari:5678","highlight":"ما أنزل الله داءً إلا أنزل له شفاءً","level":"خبر","concept":"لكل داء شفاء يُبحث عنه؛ وطلب العلاج والبحث عنه عمل مشروع.","avoid":"لا نقول إن الحديث يذكر اللقاح أو يثبته العلم، ولا نقول إن كل مرض له علاج معروف الآن؛ ولا نستعمله لترك الوقاية أو لوم مريض لم يُشفَ.","lead":"عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","narration":false,"source":"البخاري 5678","grader":"","cards":[]}},"life":[{"situation":"أختي الصغيرة تبكي لأن موعد لقاحها غداً، وتقول: الإبرة ستمرضني.","science":"اللقاح فيه جزء من الميكروب أو نسخة ضعيفة أو غير نشطة لا تسبب المرض، فيتدرب جسمها ويصنع أجساماً مضادة وذاكرة؛ وقد تؤلمها ذراعها أو ترتفع حرارتها قليلاً يوماً، ثم يزول.","action":"أطمئنها وأشرح لها بالتدريب قبل المباراة، وأقول لها إنها ستحمي جدتنا أيضاً، وأمسك يدها وأعلّمها التنفس البطيء، وأقول للأهل إنها خائفة.","value":"الرحمة بالصغير، وحماية الضعيف.","why":"لماذا أطمئنها ولا أسخر من خوفها؟ لأن الخوف من الإبرة طبيعي، والكلام الهادئ والتنفس البطيء يساعدانها؛ والطبيب والأهل يقررون ما يناسبها.","cards":[],"verses":[]},{"situation":"جدتي انسكب الشاي الساخن على يدها في المطبخ، وصاحت من الألم.","science":"الحرق يؤذي الجلد، والماء الجاري البارد 20 دقيقة يبرّده ويقلّل الأذى؛ والزبدة والمعجون والكريم لا توضع، ولا تُفقأ الفقاعات.","action":"أنادي الكبار، وأساعدها أن تضع يدها تحت ماء الصنبور البارد 20 دقيقة، وأنزع خاتمها إن لم يلتصق، ثم يغطيه الكبير بغلاف شفاف دون لفّ؛ وإن كان كبيراً أو عميقاً نطلب الإسعاف.","value":"حفظ النفس وبرّ الكبير.","why":"لماذا الماء لا الزبدة؟ لأن الماء يأخذ الحرارة من الجلد فيوقف الأذى، والزبدة تحبس الحرارة وقد تُدخل الميكروبات؛ وحفظ النفس من أعظم الأعمال، كما في الآية في البطاقة.","reference":"المائدة 32","quran":["5:32"],"cards":[],"verses":["5:32"]}],"open_questions":[{"q":"لماذا يحمي بعض اللقاحات العمر كله تقريباً، ويحتاج غيرها جرعة كل سنة؟","why_open":"بعض الفيروسات تتغير كل سنة فلا يعرفها الجسم، وبعض الذاكرة تضعف مع الوقت؛ والعلماء يبحثون كيف يصنعون لقاحات تحمي أطول."}],"notebook":{"draw":"ارسم{|ي} قصة في ثلاث صور: (1) جسم يلقى ميكروباً أول مرة فيمرض أياماً، (2) جسم أخذ اللقاح فصنع أجساماً مضادة وذاكرة، (3) الجسم نفسه يلقى الميكروب فيعرفه فوراً. ثم ارسم{|ي} دائرة الأشخاص من لعبة الانتشار بالأحمر والأزرق. ثم ارسم{|ي} يداً تحت الصنبور و{اكتب|اكتبي} 20 دقيقة. المستوى ب: ارسم{|ي} أنواع اللقاحات الأربعة رموزاً.","label":["اللقاح","الأجسام المضادة","الذاكرة","الحماية الجماعية","الجدري 1980","الإسعاف الأولي: ماء بارد 20 دقيقة","ضغط على الجرح","— ب: أنواع اللقاحات"],"write":"أشرح: كيف يحمي اللقاح؟ ولماذا يحمي لقاحي غيري؟ وماذا أفعل حين يحترق أحد أمامي؟ وأكتب نتيجة لعبة الانتشار في الجولتين."},"imgs":[]};
