const LD = {"id":"U08.T07","lesson":"U08.L07","first":false,"title":"اختبار: الشاشات وجسمي","lessonTitle":"الشاشات وجسمي","concepts":[],"check":[],"items":[{"id":"U08.L07.A1.a","objective":"U08.L07.O1","level":"A","type":"choose_reason","prompt":"لماذا نترك الشاشة قبل النوم بساعة؟","options":["لأن الشاشة تسخن","لأنها قد تجعلنا أكثر يقظة وتؤخر هرمون النوم","لأن البطارية تنفد","لأن الغرفة مظلمة"],"answer":1,"explanation":"الشاشة ترفع اليقظة والنبض، وضوؤها قد يعطّل هرمون النوم.","feedback_by_option":{"0":"الحرارة ليست السبب.","2":"البطارية ليست السبب.","3":"الظلام يساعد على النوم."},"detects":"M141","alt":{"prompt":"أين يبقى الهاتف ليلاً؟","options":["خارج غرفة النوم","تحت الوسادة","بجانب الرأس","في اليد"],"answer":0,"explanation":"خارج غرفة النوم ليلاً.","feedback_by_option":{"1":"قريب جداً، ويوقظ.","2":"قريب ويجذب.","3":"يمنع النوم."}}},{"id":"U08.L07.A1.b","objective":"U08.L07.O1","level":"A","type":"true_false_why","prompt":"«ما دمت جالساً فأنا أرتاح، والجلوس ساعات راحة للجسم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ في الجلوس الطويل تتوقف العضلات وتتعب العين؛ الراحة الحقيقية نوم كافٍ، والجلوس يُكسر بالحركة.","rubric":"R1","detects":"M139","alt":{"prompt":"«قاعدة 20-20-20 تريح العين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كل عشرين دقيقة ننظر عشرين ثانية إلى شيء بعيد."}},{"id":"U08.L07.A1.c","objective":"U08.L07.O1","level":"A","type":"explain_open","prompt":"بعد ثلاث ساعات من اللعب على الشاشة ليلاً، لم ينم سليم إلا متأخراً، وكانت عيناه متعبتين. {فسّر|فسّري} ذلك بجزأين من الجسم.","answer":"العين تعبت من النظر القريب الطويل بلا راحة؛ والدماغ بقي يقظاً من الشاشة وتأخر هرمون النوم.","rubric":"R1"},{"id":"U08.L07.A2.a","objective":"U08.L07.O2","level":"A","type":"choose","prompt":"في إرشادات كندا، شاشة الترفيه لمن في عمرك{|ِ}:","options":["ساعتان على الأكثر في اليوم","ست ساعات","بلا حد","نصف يوم"],"answer":0,"explanation":"ساعتان على الأكثر في اليوم.","feedback_by_option":{"1":"أكثر بكثير من التوصية.","2":"لها حد.","3":"أكثر بكثير."},"alt":{"prompt":"شاشة الترفيه هي:","options":["وقت الشاشة للتسلية","وقت الدراسة على الشاشة","وقت النوم","وقت اللعب في الحديقة"],"answer":0,"explanation":"الوقت الذي نقضيه للتسلية، غير الدراسة.","feedback_by_option":{"1":"الدراسة لها شأن آخر.","2":"النوم ليس شاشة.","3":"هذا حركة."}}},{"id":"U08.L07.A2.b","objective":"U08.L07.O2","level":"A","type":"true_false_why","prompt":"«توصي منظمة الصحة العالمية بتقليل الجلوس، وخاصة شاشة الترفيه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ للأطفال من 5 إلى 17 سنة، وهي توصية قوية.","rubric":"R1","alt":{"prompt":"«الاستلقاء بالهاتف يكسر الجلوس الطويل». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الاستلقاء بلا حركة جلوس أيضاً؛ الحركة هي التي تكسره."}},{"id":"U08.L07.A2.c","objective":"U08.L07.O2","level":"A","type":"explain_open","prompt":"{صمّم|صمّمي} ساعتين بعد المدرسة فيهما شاشة وحركة وواجب، و{فسّر|فسّري} ترتيبك{|ِ}.","answer":"مثال: الواجب أولاً، ثم لعب في الخارج نصف ساعة، ثم شاشة ترفيه نصف ساعة مع راحة للعين، ثم مساعدة في البيت.","rubric":"R1"},{"id":"U08.L07.A3.a","objective":"U08.L07.O3","level":"A","type":"choose_reason","prompt":"لماذا يصعب التوقف عن بعض الألعاب؟","options":["لأن اللاعب ضعيف الإرادة","لأن فيها حيلاً مصممة لتطيل البقاء","لأن الشاشة كبيرة","لأن الألوان جميلة فقط"],"answer":1,"explanation":"التصميم الجاذب: تشغيل تلقائي ومكافآت سريعة وتمرير بلا نهاية.","feedback_by_option":{"0":"الحيل تؤثر في الكبار أيضاً.","2":"الحجم ليس السبب.","3":"الألوان جزء صغير؛ الحيل أكبر."},"detects":"M140","alt":{"prompt":"التمرير بلا نهاية:","options":["حيلة تطيل البقاء","زر للتوقف","منبه للنوم","خطة شاشات"],"answer":0,"explanation":"لا يصل إلى آخر، فيطيل البقاء.","feedback_by_option":{"1":"هو عكس ذلك.","2":"ليس منبهاً.","3":"ليس خطة."}}},{"id":"U08.L07.A3.b","objective":"U08.L07.O3","level":"A","type":"true_false_why","prompt":"«إن عرفت الحيلة سهل عليّ أن أغلبها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ إذا عرفت التشغيل التلقائي أطفأته، وإذا عرفت المكافآت وضعت منبهاً قبل أن أبدأ.","rubric":"R1","alt":{"prompt":"«الإعلانات وعروض الشراء في الألعاب صُنعت لمصلحة الأطفال». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تقول الأكاديمية الأمريكية لطب الأطفال إن هذه الحيل لم تُصنع لمصلحتهم."}},{"id":"U08.L07.A3.c","objective":"U08.L07.O3","level":"A","type":"explain_open","prompt":"في تطبيق متخيَّل: «شاهد مقطعاً آخر وتحصل على نجمة!»، والمقطع التالي يبدأ بعد ثلاث ثوانٍ. {سمّ|سمّي} الحيلتين، وماذا {تفعل|تفعلين}.","answer":"المكافأة السريعة (النجمة)، والتشغيل التلقائي؛ أطفئ التشغيل التلقائي، وأتوقف حين ينتهي الوقت الذي اتفقنا عليه.","rubric":"R1"},{"id":"U08.L07.A4.a","objective":"U08.L07.O4","level":"A","type":"choose","prompt":"خطة الشاشات:","options":["اتفاق في البيت على أوقات الشاشات وأماكنها","لعبة جديدة","شاشة أكبر","منع كل شاشة إلى الأبد"],"answer":0,"explanation":"اتفاق تضعه الأسرة على الأوقات والأماكن والتوازن.","feedback_by_option":{"1":"ليست لعبة.","2":"ليست جهازاً.","3":"المطلوب التوازن لا المنع."},"alt":{"prompt":"من قواعد خطة الشاشات المفيدة:","options":["لا شاشة مع الطعام","الهاتف تحت الوسادة","شاشة حتى منتصف الليل","الشاشة بدل اللعب"],"answer":0,"explanation":"الطعام بلا شاشة.","feedback_by_option":{"1":"يمنع النوم.","2":"يؤخر النوم.","3":"الحركة واللعب ضروريان."}}},{"id":"U08.L07.A4.b","objective":"U08.L07.O4","level":"A","type":"true_false_why","prompt":"«الشاشات كلها ضارة، ويجب ألا أستعملها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الشاشة أداة فيها تعلم وتواصل؛ المطلوب التوازن مع الحركة والنوم.","rubric":"R1","detects":"M142","alt":{"prompt":"«تضع الأسرة خطة الشاشات معاً بما يناسبها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ توصي بها الأكاديمية الأمريكية لطب الأطفال بحدود تناسب روتين الأسرة."}},{"id":"U08.L07.A4.c","objective":"U08.L07.O4","level":"A","type":"explain_open","prompt":"{اكتب|اكتبي} رسالة لطيفة لأهلك{|ِ} {تقترح|تقترحين} فيها قاعدتين لخطة شاشات البيت، و{تذكر|تذكرين} السبب.","answer":"مثال: نترك الشاشات قبل النوم بساعة لننام أسرع، ولا شاشة على الطعام لنتحدث معاً.","rubric":"R1"},{"id":"U08.L07.A5.a","objective":"U08.L07.O5","level":"B","type":"choose","prompt":"يقين الدليل:","options":["كم نحن متأكدون من النتيجة","عدد الأطباء","لون الدراسة","سرعة النشر"],"answer":0,"explanation":"كم نحن متأكدون من النتيجة.","feedback_by_option":{"1":"ليس عدد الأطباء.","2":"لا لون للدراسة.","3":"السرعة لا تعني اليقين."},"alt":{"prompt":"توصية منظمة الصحة العالمية بتقليل الجلوس:","options":["قوية بيقين منخفض","ضعيفة بيقين عالٍ","بلا دليل","خاصة بالكبار"],"answer":0,"explanation":"قوية، ويقين أدلتها منخفض.","feedback_by_option":{"1":"العكس.","2":"لها أدلة.","3":"هي للأطفال 5–17."}}},{"id":"U08.L07.A5.b","objective":"U08.L07.O5","level":"B","type":"true_false_why","prompt":"«قال باحثو تجربة الصين إن الأثر أكبر مما توقعوا». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قالوا إنه أقل مما توقعوا لكنه مهم.","rubric":"R1","alt":{"prompt":"«قد ينصح العلماء بشيء قبل أن يتأكدوا تماماً إذا كان ضرره قليلاً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كالحركة بدل الجلوس: نفعها محتمل وضررها قليل."}},{"id":"U08.L07.A5.c","objective":"U08.L07.O5","level":"B","type":"explain_open","prompt":"لماذا قسم الباحثون في الصين المدارس إلى مجموعتين بدل أن يضيفوا الحصة في كل المدارس؟","answer":"ليقارنوا: لو أضافوها في الكل ما عرفوا هل نقص قصر النظر بسبب الحصة أم لسبب آخر؛ المجموعة الأخرى للمقارنة العادلة.","rubric":"R1"}],"transfer":[{"id":"U08.L07.T1","objective":"U08.L07.O1","type":"explain_open","prompt":"أخوك{|ِ} يلعب على الهاتف من بعد العصر إلى ما قبل النوم، ثم لا ينام، ويشكو تعب عينيه، ولا يحب الرياضة. {اقترح|اقترحي} عليه ثلاث عادات و{فسّر|فسّري} كلاً منها.","answer":"راحة 20-20-20 للعين؛ ساعة لعب خارج البيت للعضلات والعين؛ ترك الهاتف قبل النوم بساعة وخارج الغرفة للنوم.","level":"A","rubric":"R1"},{"id":"U08.L07.T2","objective":"U08.L07.O3","type":"explain_open","prompt":"{صمّم|صمّمي} لعبة متخيَّلة «صديقة للأطفال»: ما الذي {تضعه|تضعينه} فيها وما الذي لا {تضعه|تضعينه}؟","answer":"أضع زر توقف واضحاً وتذكيراً بالوقت ونهاية للمرحلة؛ ولا أضع تشغيلاً تلقائياً ولا تمريراً بلا نهاية ولا إعلانات شراء.","level":"A","rubric":"R1"}],"recall":[{"id":"U08.L07.D1","objective":"U08.L07.O1","type":"choose","prompt":"قاعدة راحة العين:","options":["20-20-20","1-1-1","بلا قاعدة"],"answer":0,"explanation":"كل 20 دقيقة، 20 ثانية، 20 قدماً.","level":"A","feedback_by_option":{"1":"ليست هذه.","2":"لها قاعدة."}},{"id":"U08.L07.D2","objective":"U08.L07.O2","type":"choose","prompt":"الجلوس الطويل نكسره بـ:","options":["الحركة","لعبة أخرى","الاستلقاء"],"answer":0,"explanation":"بالحركة.","level":"A","feedback_by_option":{"1":"ما زال جلوساً.","2":"ما زال جلوساً."}},{"id":"U08.L07.D3","objective":"U08.L07.O3","type":"choose","prompt":"التشغيل التلقائي:","options":["حيلة تطيل البقاء","زر توقف","منبه نوم"],"answer":0,"explanation":"حيلة من التصميم الجاذب.","level":"A","feedback_by_option":{"1":"عكسه.","2":"ليس منبهاً."}},{"id":"U08.L07.D4","objective":"U08.L07.O4","type":"choose","prompt":"الشاشة قبل النوم:","options":["أتركها بساعة","أستعملها حتى أنام","أضعها تحت الوسادة"],"answer":0,"explanation":"نتركها قبل النوم بساعة.","level":"A","feedback_by_option":{"1":"تؤخر النوم.","2":"تؤخر النوم."}},{"id":"U08.L07.D5","objective":"U08.L07.O5","type":"choose","prompt":"يقين الدليل يعني:","options":["كم نحن متأكدون","عدد الصفحات","اسم المجلة"],"answer":0,"explanation":"كم نحن متأكدون من النتيجة.","level":"B","feedback_by_option":{"1":"ليس عدد الصفحات.","2":"ليس الاسم."}}]};
