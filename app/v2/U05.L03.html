const LD = {"id":"U05.L03","first":false,"title":"قضية الوحدة: من لقمة الخبز إلى القفزة","driving_question":"{اسم}، أكلت{|ِ} لقمة خبز في الصباح وقفزت{|ِ} في الفسحة. ما الذي حدث بين اللقمة والقفزة؟ {تتبّعه|تتبّعيه} خطوة خطوة بكل ما {تعلمته|تعلمتِه}.","central_fact":"لقمة الخبز تصير سكراً في الدم، والهواء يعطي أكسجيناً في الرئة، والقلب يدفعهما إلى خلايا العضلة التي تطلق الطاقة فتنقبض وتسحب العظم فتقفز، ويعود ثاني أكسيد الكربون مع الزفير — خمسة أجهزة في سلسلة واحدة تعمل معاً.","next":null,"hook":{"text":"{اسم}، تخيّل{|ي} لقمة خبز {أكلتها|أكلتِها} صباحاً، وقفزةً {قفزتها|قفزتِها} في الفسحة. هل بينهما علاقة؟","options":["لا؛ الأكل شيء والقفز شيء آخر","نعم؛ اللقمة صارت وقوداً للقفزة","نعم؛ اللقمة تجعل الجسم ثقيلاً فيقفز أقل","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive","circulatory"],"highlight":["mouth","intestine","blood"],"zoom":"body","animate":"sugar_path"},"text":"المحطة الأولى: اللقمة. {تمضغها|تمضغينها} فتصغر، {وتبلعها|وتبلعينها} إلى المعدة ثم الأمعاء. هناك يتفكك الخبز إلى أشياء صغيرة جداً، منها السكر الذي عرفناه — الجلوكوز — فيعبر جدار الأمعاء إلى الدم. كيف بالضبط؟ وحدة الطعام القادمة. يكفينا الآن: الخبز صار سكراً في دمك{|ِ} بعد نحو ساعة. هذا هو الوقود، في الطريق."},{"id":"E2","level":"A","atlas":{"layers":["respiratory","circulatory"],"highlight":["lungs","alveoli","blood"],"zoom":"chest","animate":"o2_path"},"text":"المحطة الثانية: النَفَس. في الوقت نفسه تتنفس{|ين}، فيصل الهواء إلى الحويصلات، ويعبر الأكسجين إلى الشعيرات ويركب الخلايا الحمراء. والآن في دمك{|ِ} الشيئان اللذان تحتاجهما الخلية: السكر والأكسجين. لكنهما ما زالا في الدم — من يوصلهما إلى الساق؟"},{"id":"E3","level":"A","atlas":{"layers":["circulatory"],"highlight":["heart","aorta","leg_capillary"],"zoom":"body","animate":"pump_to_leg"},"text":"المحطة الثالثة: القلب. يسار القلب يدفع الدم المحمّل بالسكر والأكسجين في الأبهر، ثم في شرايين أصغر وأصغر، حتى شعيرة رفيعة بين خلايا عضلة فخذك{|ِ}. أقل من دقيقة من الرئة إلى الساق. القلب لا يصنع شيئاً — هو الناقل الذي بلا نقله لا تصل البضاعة."},{"id":"E4","level":"A","atlas":{"layers":["cell"],"highlight":["mitochondria"],"zoom":"cell","animate":"respiration"},"text":"المحطة الرابعة: الخلية. هنا يلتقي المساران. السكر والأكسجين يعبران من الشعيرة إلى خلية العضلة، وداخلها — في الميتوكوندريا — يُطلق الأكسجين طاقة السكر على خطوات هادئة، ويخرج ثاني أكسيد الكربون وماء وحرارة. هذه هي محطة التحوّل: دخل طعام وهواء، وخرجت طاقة. كل ما قبلها كان توصيلاً، وكل ما بعدها سيكون استعمالاً."},{"id":"E5","level":"A","atlas":{"layers":["muscles","skeleton"],"highlight":["quadriceps","knee"],"zoom":"leg","animate":"contract_jump"},"text":"المحطة الخامسة: العضلة والمفصل. بالطاقة التي أُطلقت تنقبض خلايا العضلة فتقصر العضلة كلها، فتسحب الوتر، فيسحب الوتر عظم الساق عند الركبة — وتنبسط ساقك{|ِ} فتقفز{|ين}. العضلة تسحب ولا تدفع، فلتثني الركبة بعد القفزة تعمل عضلة الخلف. ولأن كثيراً من الخلايا تعمل معاً تخرج حرارة ف{تدفأ|تدفئين}."},{"id":"E6","level":"A","atlas":{"layers":["circulatory","respiratory"],"highlight":["vein","right_heart","lungs"],"zoom":"body","animate":"co2_return"},"text":"المحطة السادسة والسابعة: العودة والزفير. ما بقي من إطلاق الطاقة — ثاني أكسيد الكربون — يعبر من الخلية إلى الدم، فيعود في الأوردة إلى يمين القلب، فيُدفع إلى الرئتين، فيعبر إلى الحويصلات، ويخرج مع الزفير. اللقمة التي {أكلتها|أكلتِها} صباحاً خرج جزء منها الآن هواءً من أنفك{|ِ}. والدورة لم تتوقف لحظة."},{"id":"E7","level":"B","atlas":{"layers":["all"],"highlight":["body"],"zoom":"body"},"text":"للمستوى ب: سؤالان يكشفان الفهم. الأول: هل تنتظر القفزة هضم الفطور؟ لا — الجسم يخزّن بعض الوقود في الكبد والعضلات، فحين تحتاج{|ين} طاقة فجأة يكون السكر في الدم جاهزاً، ويُعاد المخزون من الوجبة التالية. والثاني: هل تعمل المحطات واحدة بعد واحدة؟ لا — كلها تعمل في اللحظة نفسها بلا توقف؛ الخريطة تُظهر خطاً، والحقيقة شبكة تعمل كلها معاً."},{"id":"E8","level":"B","atlas":{"layers":["all"],"highlight":["body"],"zoom":"body"},"text":"وماذا لو تعطّلت محطة؟ فكّر{|ي} كطبيب{|ة}: لو قلّ الهواء (في مكان مرتفع) → أكسجين أقل → طاقة أقل بسرعة → دوار وتعب رغم أن الطعام موجود. لو ضعف القلب → نقل أقل → تعب من أقل جهد. لو لم تأكل{|ي} يوماً → المخزون يكفي ساعات، ثم يصنع الكبد سكراً من مواد أخرى ويستعمل الجسم دهنه؛ يبقى السكر في مداه، لكنك {تجوع|تجوعين} و{تتعب|تتعبين}، والجسم النامي يحتاج طعامه. لو تضررت العضلة أو عصبها → وقود وأكسجين موجودان ولا قفزة. السلسلة بقوة أضعف حلقاتها — ولذلك نرعى كل حلقة."}],"practice":[{"id":"U05.L03.P1","after":"E6","objective":"U05.L03.O1","type":"sequence","prompt":"رتّب{|ي} محطات اللقمة من الفم إلى القفزة.","options":["الفم والأمعاء: الخبز يصير سكراً في الدم","القلب يدفع الدم بالسكر والأكسجين إلى شعيرة الساق","الخلية تطلق الطاقة","العضلة تنقبض فتسحب العظم: قفزة","ثاني أكسيد الكربون يعود ويخرج مع الزفير"],"answer":[0,1,2,3,4],"explanation":"يتحول الخبز إلى سكر في الدم، والأكسجين يدخل الدم من الرئة في الوقت نفسه، فيدفعهما القلب إلى الساق، فتُطلق الخلية الطاقة، فتسحب العضلة العظم، ثم يخرج ثاني أكسيد الكربون مع الزفير.","level":"A","feedback_wrong":"أين يلتقي السكر والأكسجين؟ ومن ينقلهما إلى هناك؟"},{"id":"U05.L03.P2","objective":"U05.L03.O1","type":"choose_reason","prompt":"أي جهاز مسؤول عن محطة «الخبز يصير سكراً في الدم»؟","level":"A","feedback_wrong":"أين يتفكك الطعام ويُمتَص؟","options":["التنفسي","الدوري","العضلي","الهضمي"],"answer":3,"explanation":"الجهاز الهضمي يفكك الطعام ويمتصه، فيصير الخبز سكراً في الدم.","feedback_by_option":{"0":"الجهاز التنفسي يعطي الأكسجين.","1":"الجهاز الدوري ينقل السكر بعد أن يدخل الدم؛ فمن يحوّل الخبز إليه؟","2":"الجهاز العضلي يستعمل الطاقة في الحركة."}},{"id":"U05.L03.P3","objective":"U05.L03.O3","type":"choose_reason","prompt":"بعد القفزات تلهث{|ين} ويسرع نبضك{|ِ} و{تدفأ|تدفئين}. سبب واحد للثلاثة؟","options":["خلايا العضلات طلبت طاقة أكثر: أكسجيناً ونقلاً أسرع، والطاقة تُخرج حرارة","ثلاثة أسباب لا علاقة بينها: الرئة تتعب، والقلب يخاف، والجلد يسخن من حرّ الشمس","الهواء في الفناء ساخن فيدفأ الجسم ويلهث ويسرع النبض","القلب يتعب من القفز فيدق أسرع ويسحب معه التنفس"],"answer":0,"explanation":"سبب واحد: خلايا العضلات طلبت طاقة أكثر، فاحتاجت أكسجيناً ونقلاً أسرع، وخرج جزء من الطاقة حرارة.","level":"A","feedback_wrong":"من الذي يطلب؟ ولماذا يسرع كل شيء معاً؟","feedback_by_option":{"1":"بينها علاقة؛ سبب واحد يفسّر الثلاثة معاً.","2":"يحدث هذا بعد القفز في يوم بارد أيضاً؛ السبب من داخلك{|ِ}.","3":"القلب لا يسحب التنفس؛ كلاهما يسرع لأن العضلات طلبت أكثر."}},{"id":"U05.L03.P4","objective":"U05.L03.O2","type":"fix_model","prompt":"في نموذج زميل{ك|تكِ}: «الهواء يحمل الطاقة إلى العضلة مباشرة». أصلح{|ي} الجملة.","answer":"الطاقة في السكر من الطعام؛ الأكسجين من الهواء يُطلقها داخل الخلية؛ ولا يصل شيء إلى العضلة إلا بالدم.","level":"A","rubric":"R1"},{"id":"U05.L03.P5","objective":"U05.L03.O5","type":"predict","prompt":"صعد متسلق جبلاً عالياً حيث الهواء قليل الأكسجين. توقّع{|ي}:","options":["يتعب بسرعة ويلهث رغم أنه أكل جيداً","لا يتغير شيء لأنه أكل","يصير أقوى"],"answer":0,"explanation":"الخلية تحتاج الأكسجين مع السكر؛ في هواء قليل الأكسجين تضعف هذه الحلقة، فيتعب المتسلق ويلهث رغم أنه أكل جيداً.","level":"B","feedback_wrong":"أي حلقة ضعفت؟ وماذا تحتاج الخلية مع السكر؟","feedback_by_option":{"1":"الطعام وحده لا يكفي؛ الخلية تحتاج الأكسجين أيضاً لتُطلق طاقته.","2":"قلة الأكسجين تُضعف الحلقة ولا تقوّيها."}}],"check":[{"id":"U05.L03.C1","objective":"U05.L03.O1","type":"sequence","prompt":"رتّب{|ي} طريق الأكسجين من الأنف إلى خلية في الساق.","options":["الأنف والقصبة","الحويصلات","شعيرات الرئة ويسار القلب","الأبهر والشرايين","شعيرة الساق","خلية العضلة"],"answer":[0,1,2,3,4,5],"explanation":"من الأنف والقصبة إلى الحويصلات، ثم إلى شعيرات الرئة ويسار القلب، ثم في الأبهر والشرايين إلى شعيرة الساق، ومنها إلى خلية العضلة.","level":"A"},{"id":"U05.L03.C2","objective":"U05.L03.O2","type":"choose_reason","prompt":"في النموذج الخاطئ خمسة أخطاء. ما الخطأ في: «ثاني أكسيد الكربون يخرج من المعدة»؟","options":["لا خطأ؛ المعدة تُخرج الغازات مع الطعام حين نتجشأ","يخرج من الجلد مع العرق حين نسخن","يخرج من الرئة مع الزفير بعد أن يعود بالدم","يخرج من القلب مع كل ضربة"],"answer":2,"explanation":"ثاني أكسيد الكربون يعود من الخلايا بالدم إلى الرئة، ويخرج مع الزفير، لا من المعدة.","level":"A","feedback_by_option":{"0":"التجشؤ يُخرج هواءً بلعناه، لا ثاني أكسيد الكربون الذي تصنعه الخلايا؛ ذلك يخرج مع الزفير.","1":"العرق ماء وأملاح يبرّد الجسم؛ وثاني أكسيد الكربون يخرج من طريق آخر.","3":"القلب يدفع الدم الذي يحمله، لكنه لا يُخرجه من الجسم."}},{"id":"U05.L03.C3","objective":"U05.L03.O3","type":"true_false_why","prompt":"«اللهاث بعد الركض استجابة طبيعية، لا علامة مرض». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الخلايا طلبت أكسجيناً أكثر وصنعت ثاني أكسيد كربون أكثر، فيتسارع التنفس حتى تعود الحاجة إلى طبيعتها.","level":"A","rubric":"R1"},{"id":"U05.L03.C4","objective":"U05.L03.O1","type":"explain_open","prompt":"في أي محطة «يتحوّل» الطعام والهواء إلى حركة؟ ولماذا نقول إن ما قبلها توصيل وما بعدها استعمال؟","answer":"في الخلية (الميتوكوندريا)؛ قبلها الهضم والرئة والقلب والدم ينقلون فقط، وبعدها العضلة تستعمل الطاقة لتنقبض.","level":"A","rubric":"R1"},{"id":"U05.L03.C5","objective":"U05.L03.O4","type":"explain_open","prompt":"اشرح{|ي} في ثلاث جمل لطفل في السادسة: لماذا نأكل ونتنفس معاً لنتحرك؟","answer":"الطعام يعطينا وقوداً، والهواء يعطينا أكسجيناً يُطلق الوقود، والدم يوصلهما إلى العضلات فتتحرك.","level":"A","rubric":"R1"},{"id":"U05.L03.C6","objective":"U05.L03.O6","type":"true_false_why","prompt":"«لا أستطيع القفز قبل أن يُهضَم فطوري». صح أم خطأ؟","answer":"خطأ؛ الجسم يخزّن وقوداً من الوجبات السابقة فالسكر في الدم جاهز دائماً.","level":"B","rubric":"R1"},{"id":"U05.L03.C7","objective":"U05.L03.O5","type":"choose_reason","prompt":"طفل أكل جيداً وتنفس جيداً وقلبه سليم، لكن ساقه لا تقفز. أي حلقة تعطّلت؟","options":["الهضم؛ لم يصل السكر إلى الساق","الرئة؛ لم يصل الأكسجين إلى الدم","الدم؛ لم يحمل الوقود إلى الساق","العضلة أو العصب الذي يأمرها"],"answer":3,"explanation":"الوقود والأكسجين وصلا، فالخلل في الحلقة الأخيرة: العضلة، أو العصب الذي يأمرها بالانقباض.","level":"B","feedback_wrong":"الوقود والأكسجين وصلا؛ ما الذي لم يحدث؟","feedback_by_option":{"0":"أكل جيداً، فالسكر يصل.","1":"تنفّس جيداً، فالأكسجين يصل.","2":"قلبه سليم، فالدم يحمل الوقود إلى الساق."}}],"concepts":[{"id":"chain","term":{"ar":"سلسلة الطاقة","en":"Energy chain","zh":"能量链","pinyin":"néngliàng liàn","match":["سلسلة الطاقة","السلسلة"]},"priority":"core","atlas":{"layer":"all","element":"body"},"card":{"A":"الرحلة الكاملة من الطعام والهواء إلى الحركة والحرارة: هضم ← دم ← رئة ← قلب ← خلية ← عضلة. كل جهاز حلقة؛ إن ضعفت حلقة ضعفت الحركة.","B":"الحلقات تعمل معاً في اللحظة نفسها، والجسم يخزّن بعض الوقود ليكمل بين الوجبات."}},{"id":"station","term":{"ar":"محطة","en":"Station","zh":"站","pinyin":"zhàn","match":["محطة","محطات"]},"priority":"supporting","atlas":{"layer":"all","element":"body"},"card":{"A":"اسم نعطيه لكل موضع تتحول فيه الرحلة: المعدة والأمعاء، الرئة، القلب، الشعيرة، الخلية، المفصل.","B":"في كل محطة سؤالان: ماذا يدخل؟ وماذا يخرج؟"}}],"experiment":{"title":"أرسم الرحلة على جسمي وأعلّمها لغيري","materials":["ورقة كبيرة أو ورقة الأطلس","أقلام بأربعة ألوان (سكر، أكسجين، ثاني أكسيد الكربون، طاقة)","ملصقات أو أوراق صغيرة للمحطات السبع","هاتف للتسجيل (اختياري)"],"steps":["ارسم{|ي} حدود جسمك{|ِ} على الورقة (أو استعمل{|ي} رسم الأطلس) وضع{|ي} ملصقات المحطات السبع في مواضعها: الفم والأمعاء، الرئة، القلب، الشعيرة في الساق، الخلية العضلية، المفصل (الركبة)، الرئة من جديد للزفير.","بقلم السكر: ارسم{|ي} سهم اللقمة من الفم إلى الأمعاء ثم إلى الدم ثم إلى القلب ثم إلى الشعيرة في الساق.","بقلم الأكسجين: من الأنف إلى الرئة إلى الدم إلى القلب إلى الشعيرة نفسها.","بقلم الطاقة: نجمة صغيرة عند الخلية العضلية وسهم إلى العضلة التي تسحب العظم عند الركبة — القفزة!","بقلم ثاني أكسيد الكربون: من الخلية إلى الدم إلى القلب إلى الرئة إلى الزفير.","اشرح{|ي} الرحلة لأخ أصغر أو لأحد الأهل في دقيقتين بالرسم، وسجّل{|ي} صوتك{|ِ} إن أمكن. ثم قيّم{|ي} شرحك{|ِ} بقائمة التحقق: هل ذكرت{|ِ} من أين السكر؟ من أين الأكسجين؟ من ينقلهما؟ أين تُطلَق الطاقة؟ كيف تتحرك العضلة؟ إلى أين يذهب ثاني أكسيد الكربون؟","اسأل{|ي} من شرحت{|ِ} له سؤالاً واحداً لتتأكد{|ي} أنه فهم: «لماذا نتنفس؟»"],"safety":["لا قفز حقيقي في مكان ضيق؛ القفزة في الدرس رمزية أو في فناء آمن.","لا نقارن رسوم الأطفال بعضها ببعض من حيث الجمال؛ المعيار الصحة العلمية."],"expected":"رسم بأربعة ألوان يُظهر مسارين داخلين (سكر، أكسجين) يلتقيان عند الخلية، ومساراً خارجاً (ثاني أكسيد الكربون)، وطاقة عند العضلة؛ وشرح يستوفي ≥5 من 6 بنود القائمة.","explain":"هذا ليس درساً جديداً؛ هو كل ما {تعلمته|تعلمتِه} في خمس وحدات مجموعاً في رحلة واحدة. ولاحظ{|ي}: المساران الداخلان يلتقيان في مكان واحد — الخلية. هناك يصير الطعام والهواء حركةً ودفئاً. ولاحظ{|ي} أيضاً أن القلب يظهر في كل مسار: هو المحرّك الذي يوصل كل شيء. وأن الرئة تظهر مرتين: تعطي الأكسجين وتُخرج ثاني أكسيد الكربون. ومن استطاع أن يشرح هذا لغيره فقد فهمه فعلاً.","record":"الرسم الملوّن، ونتيجة قائمة التحقق (من 6)، وجواب من شرحت{|ِ} له.","alternatives":["إن لم يوجد من يُشرَح له: يشرح الطفل للتسجيل أو لدمية ويقيّم بنفسه.","إن تعذّر الرسم: ترتيب بطاقات المحطات على الأرض والمشي عليها."]},"find_the_error":[{"id":"FE1","atlas_variant":"food_to_lung","error":"سهم الطعام من المعدة إلى الرئة ليحترق","answer":"الطعام يصير سكراً في الأمعاء ويدخل الدم؛ الإطلاق في الخلية","detects":"M48"},{"id":"FE2","atlas_variant":"energy_from_air","error":"كلمة «طاقة» على سهم الهواء","answer":"الطاقة في السكر؛ الهواء يعطي الأكسجين","detects":"M48"},{"id":"FE3","atlas_variant":"lung_blows_muscle","error":"الرئة تنفخ الهواء في العضلة مباشرة","answer":"الأكسجين ينتقل بالدم فقط","detects":"M03"},{"id":"FE4","atlas_variant":"muscle_pushes","error":"العضلة تدفع العظم","answer":"تسحب فقط عبر الوتر","detects":"M01"},{"id":"FE5","atlas_variant":"co2_from_stomach","error":"ثاني أكسيد الكربون يخرج من المعدة","answer":"يعود بالدم إلى الرئة ويخرج مع الزفير","detects":"M22"}],"numbers":[{"text":"بين أول لقمة من الخبز وبدء ظهور سكرها في دمك{|ِ}: نحو عشر دقائق، ويبلغ السكر في الدم أعلاه بعد نحو ساعة. وبين الأكسجين في رئتك{|ِ} وخلية في ساقك{|ِ}: أقل من دقيقة.","source":["S1","S2","S_ADA"]},{"text":"قفزة واحدة تحتاج انقباض عشرات العضلات معاً، في كل منها آلاف إلى مئات الآلاف من الخلايا العضلية الطويلة، في كل خلية مئات الميتوكوندريا تعمل في اللحظة نفسها.","source":["S3","S4"]}],"true_size":[{"text":"خذ{|ي} نفساً الآن: الأكسجين فيه سيكون في خلية بقدمك{|ِ} قبل أن تنتهي{|َ} من قراءة هذه الجملة الثانية.","source":["S2"]}],"animal":{"text":"الفهد سريع العدو، وعضلاته مثل عضلاتنا تحتاج وقودًا من الغذاء وأكسجينًا من الرئتين ينقلهما الدم. لكن توقف المطاردة لا يعني أن حرارته ارتفعت فوق حد محتمل؛ لم تؤيد القياسات الميدانية هذا التفسير الشائع. نقيس قبل أن نجزم بالسبب.","source":["S7"]},"organ_letter":{"from":"لقمة الخبز","text":"كنت على طبقك{|ِ} صباحاً. {مضغتني|مضغتِني}، ونزلت إلى أمعائك{|ِ} فتفككت إلى سكر، وسبحت في دمك{|ِ}، ودفعني قلبك{|ِ} إلى عضلة فخذك{|ِ}، ودخلت خلية، وهناك جاءني الأكسجين من نَفَسك{|ِ} فأطلق ما فيّ من طاقة — وقفزت{|ِ} بي. وما بقي منّي خرج هواءً من أنفك{|ِ} في الفسحة. رحلة لقمة واحدة: خمسة أجهزة وتريليون خلية. اشكر{|ي} من رزقك{|ِ} بي. مع التحية، لقمة صارت قفزة."},"history":[],"how_we_know":{"text":"كيف نتتبع ما يحدث للغذاء؟ أعطى باحثون متطوعين سكرًا يحمل علامة من كربون مستقر غير مشع، ثم قاسوا ظهور العلامة في ثاني أكسيد الكربون بالزفير. هكذا عرفوا أن بعض الكربون القادم من السكر خرج مع الزفير بعد أن عالجه الجسم. لا تتحول جزيئة السكر كاملة إلى «هواء»؛ نتتبع ذراتها بأدوات دقيقة.","limit_question":"ما الذي تُخفيه خريطة المحطات ذات الخط الواحد عن الحقيقة؟"},"what_changed":["ظُن طويلاً أن الأجهزة مستقلة يُدرَس كل منها وحده؛ الفهم الحديث: شبكة واحدة، والخلية مركزها."],"model_limits":["خريطة المحطات تُظهر خطاً واحداً؛ الحقيقة ملايين المسارات المتوازية في الوقت نفسه.","الأسهم تُوحي بتسلسل زمني؛ الواقع أن المحطات تعمل معاً باستمرار.","الخريطة لا تُظهر الدماغ الذي يأمر وينظّم — وحدة قادمة.","(صورة E1) المشهد العلوي مخطط أمامي بدل الوضع الجانبي أثناء القضم، والسفلي تكبير امتصاص الأمعاء. لقمة الخبز خارج الفم ثم مسار هضم رمزي؛ لا تعبر لقمة كاملة إلى الدم، بل نواتج الهضم المناسبة.","(صورة E2) التركيز على تكبير الحاجز بين الهواء والدم مع رأس ورئة صغيرين. الأكسجين يعبر من الهواء إلى الدم، وتوجد رموز السكر داخل الدم بالفعل. لا تتساوى أحجام التكبيرات ولا تختزل الشعيرة في جدار خلية واحدة مع الحويصلة؛ الحاجز ممثل بطبقتين رقيقتين.","(صورة E3) الحجرة اليسرى من القلب تقع يمين الناظر في المخطط. مسار الخروج إلى الأبهر ثم الوعاء الدقيق مختصر ومبسوط؛ لا يمثل شكل جميع الفروع أو اتصالاً هوائياً من الرئة للعضلة.","(صورة E4) السكر والأكسجين يعبران إلى الخلية، والرمادي يعود منها إلى الشعيرة. موضع العضية وخطوات التفاعل تخطيطيان، والغشاء والطيّات مكبران. مسار السكر يتضمن خطوات سيتوبلازمية قبل نواتجه داخل الميتوكوندريا.","(صورة E5) مقارنة ركبة مثنية ثم ممدودة بدلاً من ساق طفل يقفز فعلياً. الرباعية تسحب عبر وترها والرضفة والرباط الرضفي المتصل بالظنبوب، ولا تدفع العظم. العضلة المقابلة فاتحة وطويلة للدلالة على الارتخاء. الرسم لا يقيس طول الوتر أو زاوية الركبة أو يصف كل أجزاء المفصل.","(صورة E6) الوريد والدم القليل الأكسجين أحمر داكن. العودة إلى يمين القلب ثم الرئة؛ التكبير الجانبي يوضح خروج الرمادي إلى الهواء. الرسم ملخص وليس خريطة لجميع صور نقل ثاني أكسيد الكربون أو الأوعية.","(صورة E7) المخزون في الكبد والعضلات ممثل بسلاسل ذهبية ونافذة مخزن رمزية، لا حجرة أو باباً فعلياً. الطبق فارغ بعد التصحيح. لا يحدد الشكل كمية المخزون أو المدة المتاحة للجري عند شخص بعينه.","(صورة E8) حلقة القلب المتشققة وما بعدها باهت؛ تشبيه ترابط الوظائف وليس تشخيصاً بأن تعب الطفل يعني عطب القلب أو أن الجسم سلسلة باتجاه واحد بلا تنظيم وتعويض.","(صورة exp) أربع بطاقات. المسارات الأربعة رموز اختارها الطفل للمراجعة وليست خرائط أعضاء دقيقة. القائمة ستة مربعات فارغة. صورة الشرح مصغرة ومبسطة، ولا تعني نجاح فحص معرفي تلقائياً.","(صورة letter) اللقمة المسافرة ذات الوجه والحقائب خيال قصصي؛ المسار في ظل جسم خال من الأعضاء حتى لا يفسر كخريطة للمواضع أو لحركة لقمة كاملة داخل الدم.","(صورة life) لوحتان رأسيتان بدل جانبيتين، وثلاث دوائر فقط في ورقة الشرح. اللاهث بعد الجري غير مزرق والرسالة دعم الزميل وعدم السخرية؛ الصورة لا تشخص حالة تنفسية.","(صورة title-boy) المسار من اللقمة إلى رمز القفزة. أزيلت الشمعة والعضيات الزائدة، والمحطات دوائر فارغة ليضع التطبيق ما يلزم؛ لا تمثل هذه الدوائر أعضاء في مواضع تشريحية."],"faith":{"opening":null,"closing":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَـٰتِ مَا رَزَقْنَـٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ","reference":"البقرة 172","grade":"قرآن","usage":"شكر","reflection":"تتبعنا لقمة واحدة: خمسة أجهزة وتريليون خلية عملت معاً لتصير قفزة. في الآية التي أمامك{|ِ} أمران: أن نأكل من الطيبات، وأن نشكر الله — الأكل أمر، والشكر معه. وقد رأيت{|ِ} الآن ما يحدث للقمة بعد أن {تبلعها|تبلعينها}: رحلة لا تُدار بيدك{|ِ} ولا تعرف{|ين} عنها شيئاً وهي تجري. أي شكر يليق بهذا؟ اكتب{|ي} جملة شكر واحدة في دفترك{|ِ} قبل الإهداء.","reviewed":false,"quran_key":"2:172","hl_words":[3,9],"highlight":"كلوا من طيبات ما رزقناكم واشكروا لله","cards":[]}},"life":[{"situation":"أخي الصغير يسألني لماذا يجب أن يأكل الفطور قبل المدرسة.","science":"خلايا دماغه وعضلاته تحتاج سكراً من الطعام وأكسجيناً من النفس لتطلق الطاقة؛ المخزون يُعينه لكن الفطور يجدّده.","action":"أشرح له الرحلة برسم بسيط بثلاث محطات، وأدعه يسألني.","value":"من تعلّم شيئاً علّمه؛ ومن حق الصغير أن يفهم لا أن يُؤمَر فقط.","why":"لماذا أشرح ولا أقول «لأن أمي قالت»؟ لأن الطفل الذي يفهم سبب الأمر يفعله برضا، ولأن تعليم ما تعلمت شكرٌ عملي على العلم؛ والنبي ﷺ أمرنا أن نبلّغ عنه ولو شيئاً يسيراً، والعلم النافع يُبلَّغ.","reference":"البخاري 3461","hadith":["bukhari:3461"],"cards":[{"key":"bukhari:3461","lead":"عن عبد الله بن عمرو رضي الله عنهما أن النبي ﷺ قال:","text":"بلّغوا عني ولو آية، وحدّثوا عن بني إسرائيل ولا حرج، ومن كذب عليّ متعمداً فليتبوأ مقعده من النار","narration":false,"source":"البخاري 3461","grade":"صحيح","grader":""}],"verses":[]},{"situation":"في الفسحة يسخر بعضهم من زميل يلهث بسرعة.","science":"اللهاث استجابة طبيعية لطلب الخلايا؛ يختلف الناس في سرعة التعب بحسب القلب والعضلات والتدريب والصحة، ولا يدل على عيب.","action":"لا أشارك في السخرية، وأقول إن اللهاث يعني أن جسمه يعمل كما ينبغي، وأدعوه يلعب معنا بهدوء.","value":"لا يُحتقر أحد بجسمه؛ الأجسام تختلف والمعيار الصحة.","why":"لماذا أتدخل؟ لأن السخرية بالجسد تؤذي قلباً وتُبعد طفلاً عن الحركة التي يحتاجها؛ نهانا الله في سورة الحجرات (الآية 11) عن التنابز بالألقاب، أي أن ينادي أحدنا الآخر بلقب يكرهه، والنبي ﷺ أخبر أن المسلم أخو المسلم: لا يظلمه، ولا يخذله، ولا يحقره.","reference":"الحجرات 11؛ مسلم 2564","hadith":["muslim:2564/akhu"],"cards":[{"key":"muslim:2564/akhu","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"«لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً، المسلم أخو المسلم: لا يظلمه، ولا يخذله، ولا يحقره، التقوى ها هنا» ويشير إلى صدره ثلاث مرات، «بحسب امرئ من الشر أن يحقر أخاه المسلم، كل المسلم على المسلم حرام: دمه، وماله، وعرضه»","narration":true,"source":"مسلم 2564","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يختلف الناس في سرعة التعب مع التدريب نفسه؟","why_open":"عدد الميتوكوندريا والشعيرات في العضلة يتغير بالتدريب والوراثة؛ تفاصيل التفاعل ما زالت تُدرَس."}],"notebook":{"draw":"ارسم{|ي} خريطة الرحلة كاملة بأربعة ألوان: سكر، أكسجين، ثاني أكسيد الكربون، طاقة. ضع{|ي} المحطات السبع في مواضعها من جسمك{|ِ}. المستوى ب: {أضف|أضيفي} «مخزن الوقود» في الكبد والعضلات، وعلامة ✕ على حلقة واحدة واكتب{|ي} ماذا يحدث لو تعطلت.","label":["الفم والأمعاء","الرئة","القلب","شعيرة الساق","خلية العضلة","العضلة والركبة","الزفير","— ب: مخزن الوقود"],"write":"أحكي رحلة لقمة الخبز ونفَس الهواء حتى أقفز: من أين يأتي السكر؟ ومن أين يأتي الأكسجين؟ ومن يوصلهما؟ وأين تُطلق الطاقة؟ وماذا يخرج مع الزفير؟ ثم أكتب: لماذا نأكل ونتنفس؟"},"imgs":["U05.L03-E1","U05.L03-E2","U05.L03-E3","U05.L03-E4","U05.L03-E5","U05.L03-E6","U05.L03-E7","U05.L03-E8","U05.L03-exp","U05.L03-letter","U05.L03-life","U05.L03-title-boy","U05.L03-title-girl"]};
