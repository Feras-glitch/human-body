<script>
const LD = {"id":"U08.L03","first":false,"title":"السمع والتوازن والشم والذوق واللمس","driving_question":"{اسم}، حين يُصاب أنفك{|ِ} بالزكام يصير طعم الطعام باهتاً، مع أن لسانك{|ِ} سليم. فهل {تتذوق|تتذوقين} بلسانك{|ِ} وحده؟ وكيف تصل الأصوات واللمسات إلى دماغك{|ِ}؟","central_fact":"كل حاسة مستقبلات تحوّل شيئاً من العالم إلى رسائل في الأعصاب: الأذن تحوّل الاهتزاز، والأنف والفم يحوّلان المواد، والجلد يحوّل اللمس؛ والدماغ يجمعها، فالنكهة ذوق وشم معاً، والتوازن من الأذن الداخلية.","next":"U08.L04","nexts":[{"id":"U08.L04","gated":false},{"id":"U08.L05","gated":false},{"id":"U08.L06","gated":false},{"id":"U08.L07","gated":false}],"hook":{"text":"{اسم}، مع الزكام يصير طعم الطعام باهتاً. لماذا؟","options":["لأن اللسان يمرض مع الأنف","لأن الرائحة جزء مما نسميه طعماً","لأن الطعام يتغير","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["ear"],"highlight":["pinna","canal","eardrum","ossicles","cochlea","auditory_nerve"],"zoom":"ear_section","animate":"sound_path"},"text":"الصوت اهتزاز يسري في الهواء. الأذن التي {تراها|ترينها} تلتقطه وتوجهه إلى قناة الأذن، وفي آخر القناة غشاء رقيق مشدود: طبلة الأذن، تهتز حين يصلها الصوت كما يهتز جلد الطبل. وخلف الطبلة ثلاث عظيمات صغيرة تنقل الاهتزاز وتقوّيه، آخرها الركاب، أصغر عظمة في جسمك{|ِ}. ثم يصل الاهتزاز إلى القوقعة، جزء حلزوني مملوء بسائل، فيتموج السائل وتنثني شعيرات على خلايا خاصة فتتكون رسالة كهربائية، يحملها عصب السمع إلى الدماغ، والدماغ يعرف منها الصوت: صوت أمك{|ِ} أو جرس المدرسة. وشمع الأذن ليس قذارة: تصنعه القناة لتنظف نفسها."},{"id":"E2","level":"A","atlas":{"layers":["ear"],"highlight":["semicircular_canals"],"zoom":"inner_ear"},"text":"وفي الأذن الداخلية عمل آخر غير السمع: التوازن. بجانب القوقعة ثلاثة أنابيب صغيرة متصلة: القنوات الهلالية، فيها سائل يتحرك حين يتحرك رأسك{|ِ}، فيثني شعيرات دقيقة تخبر الدماغ بوضع الرأس. لماذا {تدوخ|تدوخين} بعد أن {تدور|تدوري} حول نفسك{|ِ}؟ لأن السائل يبقى يتحرك لحظات بعد أن {تقف|تقفي}، فيظن الدماغ أنك{|ِ} ما زلت{|ِ} {تدور|تدورين}؛ وحين يسكن السائل يزول الدوار."},{"id":"E3","level":"A","atlas":{"layers":["ear"],"highlight":["cochlea"],"zoom":"cochlea","animate":"volume"},"text":"خلايا السمع في القوقعة رقيقة، والصوت العالي جداً أو الطويل يتلفها، وما يتلف منها لا يعود؛ وغالباً بلا ألم. تقول منظمة الصحة العالمية إن صوتاً بقوة 85 ديسيبل يُحتمل حتى ثماني ساعات في اليوم، أما 100 ديسيبل، وهو صوت كثير من الأماكن الصاخبة، فلا يُحتمل أكثر من ربع ساعة. ولذلك {اخفض|اخفضي} صوت السماعات، و{استعملها|استعمليها} أقل من ساعة في اليوم، و{خذ|خذي} راحة قصيرة."},{"id":"E4","level":"A","atlas":{"layers":["mouth","nose"],"highlight":["taste_buds","smell_receptors","back_of_throat"],"zoom":"head_side"},"text":"على لسانك{|ِ} نتوءات صغيرة، وفيها وفي سقف حلقك{|ِ} وأعلى الحلق مجموعات صغيرة من الخلايا: براعم التذوق. تحسّ خمسة طعوم: الحلو والمالح والحامض والمر، والخامس طعم لذيذ كطعم المرق يسميه العلماء «أومامي». وقد {ترى|ترين} في بعض الكتب خريطة للسان: الحلو في طرفه والمر في آخره؛ وهذه خريطة خاطئة: كل موضع فيه براعم تذوق يحسّ الطعوم كلها. وفي أعلى الأنف مستقبلات للروائح. وحين {تمضغ|تمضغين} تصعد روائح الطعام من فمك{|ِ} إلى أنفك{|ِ} من الخلف، فيجمع الدماغ الذوق والرائحة نكهةً واحدة. لذلك يبهت الطعام مع الزكام: اللسان سليم، لكن الرائحة لا تصل."},{"id":"E5","level":"B","atlas":{"layers":["skin"],"highlight":["receptors","fingertip","forearm"],"zoom":"skin"},"text":"وفي جلدك{|ِ} كله مستقبلات حسية: أطراف أعصاب صغيرة تحسّ اللمس والضغط والحرارة والألم. لكن عددها يختلف: في سنتيمتر مربع من طرف إصبعك{|ِ} نحو مئة ضعف ما في مثله من جلد الظهر. لذلك {تميّز|تميّزين} على طرف الإصبع نقطتين متباعدتين 2 إلى 3 مليمترات، أما على الذراع فلا {تميّزهما|تميّزينهما} إلا إذا تباعدتا 35 إلى 40 مليمتراً، وإلا ظننتهما نقطة واحدة. ولأطراف الأصابع مساحة كبيرة في الدماغ تناسب كثرة رسائلها؛ ولذلك {تقرأ|تقرئين} بأطراف أصابعك{|ِ} نقوشاً لا تكاد تُرى، كما يقرأ المكفوفون حروف برايل."},{"id":"E6","level":"B","atlas":{"layers":["nose"],"highlight":["smell_receptors"],"zoom":"nose"},"text":"كيف يميّز أنفك{|ِ} رائحة الخبز من رائحة الياسمين؟ في أعلى الأنف خلايا لكل منها نوع واحد من المستقبلات، وكل رائحة تلتقطها مجموعة مختلفة من الأنواع، كأنها رمز يقرؤه الدماغ. وفي سنة 1991 وجدت ليندا باك وريتشارد أكسل عائلة كبيرة من الجينات تصنع هذه المستقبلات: نحو ألف جين، أي نحو 3 في المئة من جيناتنا؛ ونالا جائزة نوبل سنة 2004."}],"practice":[{"id":"U08.L03.P1","objective":"U08.L03.O1","type":"choose","prompt":"ما الذي يهتز أولاً داخل الأذن حين يصلها الصوت؟","options":["القوقعة","عصب السمع","طبلة الأذن","الأذن الظاهرة كلها"],"answer":2,"explanation":"الصوت يمرّ في القناة فيصل إلى الطبلة فتهتز، ثم تنقل اهتزازها إلى العظيمات.","level":"A","feedback_wrong":"ما الغشاء المشدود في آخر القناة؟","feedback_by_option":{"0":"القوقعة بعد الطبلة والعظيمات.","1":"العصب يحمل الرسالة بعد القوقعة.","3":"الأذن الظاهرة تلتقط الصوت وتوجهه، والطبلة تهتز."}},{"id":"U08.L03.P2","objective":"U08.L03.O2","type":"choose_reason","prompt":"{دُرت|دُرتِ} حول نفسك{|ِ} عشر مرات ثم {وقفت|وقفتِ}، فبدت الغرفة تدور. لماذا؟","options":["لأن الدم صعد إلى الرأس","لأن العينين تعبتا من الدوران","لأن السائل في القنوات الهلالية ما زال يتحرك","لأن الأرض تدور فعلاً"],"answer":2,"explanation":"يبقى السائل يتحرك لحظات بعد التوقف، فيظن الدماغ أنك ما زلت تدور.","level":"A","feedback_wrong":"أين في الأذن عضو التوازن، وماذا يحدث لسائله؟","feedback_by_option":{"0":"الدوار هنا من الأذن الداخلية، لا من الدم.","1":"العينان لم تتعبا؛ الأذن الداخلية تخبر الدماغ بالحركة.","3":"الأرض تدور لكن ببطء لا نحسّه؛ الدوار من سائل الأذن."}},{"id":"U08.L03.P3","objective":"U08.L03.O3","type":"choose","prompt":"أيّ عادة تحمي سمعك{|ِ} مع السماعات؟","options":["رفع الصوت لتغطية الضجيج","النوم والسماعات في الأذنين","خفض الصوت وأقل من ساعة يومياً","الاستماع ساعات ما دامت الأذن لا تؤلم"],"answer":2,"explanation":"منظمة الصحة العالمية تنصح بخفض الصوت وأقل من ساعة يومياً مع راحة قصيرة.","level":"A","feedback_wrong":"ما الذي يتلف خلايا السمع: الصوت العالي أم المنخفض؟","feedback_by_option":{"0":"رفع الصوت يزيد الخطر؛ الأفضل مكان أهدأ.","1":"ساعات طويلة بلا راحة تتعب خلايا السمع.","3":"خلايا السمع تتلف غالباً بلا ألم."},"detects":"M88"},{"id":"U08.L03.P4","objective":"U08.L03.O4","type":"choose","prompt":"أين {تحس|تحسين} طعم المر في لسانك{|ِ}؟","options":["في آخر اللسان فقط","في طرف اللسان فقط","على جانبيه فقط","في كل موضع فيه براعم تذوق"],"answer":3,"explanation":"كل موضع فيه براعم تذوق يحسّ الطعوم الخمسة؛ خريطة اللسان خطأ.","level":"A","feedback_wrong":"هل للسان مناطق لكل طعم؟","feedback_by_option":{"0":"هذه خريطة اللسان الخاطئة؛ المر يُحسّ في كل موضع فيه براعم.","1":"طرف اللسان يحسّ كل الطعوم، لا المر وحده.","2":"الجانبان يحسّان كل الطعوم أيضاً."},"detects":"M86"},{"id":"U08.L03.P5","objective":"U08.L03.O5","type":"predict","prompt":"يلمسك{|ِ} زميل{ك|تكِ} بطرفين بينهما 1 سنتيمتر. أين {تحس|تحسين} أنهما اثنان بسهولة؟","options":["على طرف الإصبع","على ظهر الساعد","على الظهر","لا فرق بين المواضع"],"answer":0,"explanation":"على طرف الإصبع نميّز نقطتين من 2–3 مم، وعلى الذراع نحتاج 35–40 مم.","level":"B","feedback_wrong":"أين المستقبلات أكثر؟","feedback_by_option":{"1":"على الساعد نحتاج مسافة أكبر بكثير من سنتيمتر.","2":"في جلد الظهر مستقبلات أقل بكثير من الإصبع.","3":"عدد المستقبلات يختلف كثيراً بين المواضع."}}],"check":[{"id":"U08.L03.C1","objective":"U08.L03.O1","type":"true_false_why","prompt":"«نسمع بالأذن الظاهرة وحدها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الأذن الظاهرة تلتقط الصوت فقط، ثم تهتز الطبلة والعظيمات، وتحوّل القوقعة الاهتزاز إلى رسائل يحملها عصب السمع إلى الدماغ.","level":"A","rubric":"R1"},{"id":"U08.L03.C2","objective":"U08.L03.O2","type":"explain_open","prompt":"لماذا {تحس|تحسين} بالدوار في الأرجوحة الدوارة حتى بعد أن تتوقف؟","answer":"السائل في القنوات الهلالية يظل يتحرك لحظات بعد التوقف، فيرسل إلى الدماغ أن الرأس ما زال يدور.","level":"A","rubric":"R1"},{"id":"U08.L03.C3","objective":"U08.L03.O3","type":"true_false_why","prompt":"«إذا لم تؤلمني أذني من الصوت العالي فهي لم تتأذَّ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الصوت العالي الطويل يتلف خلايا السمع غالباً بلا ألم، وما يتلف منها لا يعود.","level":"A","rubric":"R1"},{"id":"U08.L03.C4","objective":"U08.L03.O4","type":"fix_model","prompt":"في كتاب قديم رسم للسان: الحلو في طرفه، والمر في آخره، والمالح والحامض على جانبيه. {صحّح|صحّحي} الرسم.","answer":"كل موضع فيه براعم تذوق يحسّ الطعوم الخمسة كلها؛ والطعم الخامس اللذيذ (أومامي) غير موجود في الرسم أصلاً.","level":"A","rubric":"R1"},{"id":"U08.L03.C5","objective":"U08.L03.O4","type":"explain_open","prompt":"لماذا لا {تعرف|تعرفين} التفاح من الكمثرى إذا {سددت|سددتِ} أنفك{|ِ}؟","answer":"اللسان يحسّ حلاوتهما معاً، والذي يميّزهما رائحتهما التي تصعد من الفم إلى الأنف أثناء المضغ؛ فإذا سُدّ الأنف لم تصل الرائحة.","level":"A","rubric":"R1"},{"id":"U08.L03.C6","objective":"U08.L03.O5","type":"explain_open","prompt":"لماذا يقرأ المكفوف حروف برايل بأطراف أصابعه لا بظهر يده؟","answer":"في أطراف الأصابع مستقبلات لمس أكثر بكثير، فتميّز النقاط الصغيرة المتقاربة، ولها مساحة كبيرة في الدماغ.","level":"B","rubric":"R1"},{"id":"U08.L03.C7","objective":"U08.L03.O6","type":"explain_open","prompt":"كيف انتشرت خريطة اللسان الخاطئة عشرات السنين؟ وماذا نتعلم من قصتها؟","answer":"قاس باحث فروقاً صغيرة حول حافة اللسان، ثم أعاد غيره رسم بياناته بلا مقياس دقيق فبدت مناطق منفصلة، فنقلتها الكتب بلا فحص؛ ونتعلم أن نسأل عن الدليل ونعيد التجربة بأنفسنا.","level":"B","rubric":"R2"}],"concepts":[{"id":"eardrum","term":{"ar":"طبلة الأذن","en":"Eardrum","zh":"鼓膜","pinyin":"gǔmó","match":["طبلة الأذن","الطبلة","طبلة أذنك","طبلة"]},"priority":"core","atlas":{"layer":"ear","element":"eardrum"},"card":{"A":"غشاء رقيق مشدود في آخر قناة الأذن، يهتز حين يصله الصوت كما يهتز جلد الطبل، فينقل الاهتزاز إلى ثلاث عظيمات صغيرة خلفه.","B":"العظيمات الثلاث: المطرقة متصلة بالطبلة، ثم السندان، ثم الركاب، وهو أصغر عظمة في الجسم؛ تنقل الاهتزاز وتقوّيه إلى القوقعة."}},{"id":"cochlea","term":{"ar":"القوقعة","en":"Cochlea","zh":"耳蜗","pinyin":"ěrwō","match":["القوقعة","قوقعة","قوقعة الأذن"]},"priority":"core","atlas":{"layer":"ear","element":"cochlea"},"card":{"A":"جزء في الأذن الداخلية على شكل حلزون، مملوء بسائل، فيه خلايا دقيقة لها شعيرات تحوّل الاهتزاز إلى رسائل كهربائية تسري في عصب السمع إلى الدماغ.","B":"الخلايا قرب أول القوقعة تحسّ الأصوات الحادة، والأقرب إلى وسطها تحسّ الأصوات الغليظة؛ والصوت العالي الطويل يؤذي هذه الخلايا أذى لا يعود."}},{"id":"semicircular_canals","term":{"ar":"القنوات الهلالية","en":"Semicircular canals","zh":"半规管","pinyin":"bànguīguǎn","match":["القنوات الهلالية","قنوات هلالية","القنوات الهلالية الثلاث"]},"priority":"core","atlas":{"layer":"ear","element":"semicircular_canals"},"card":{"A":"ثلاثة أنابيب صغيرة متصلة في الأذن الداخلية، فيها سائل يتحرك حين يتحرك الرأس فيثني شعيرات دقيقة، فيعرف الدماغ وضع الرأس ويحفظ التوازن.","B":"بعد الدوران يبقى السائل يتحرك لحظات، فيظن الدماغ أنك ما زلت تدور: هذا هو الدوار."}},{"id":"taste_buds","term":{"ar":"براعم التذوق","en":"Taste buds","zh":"味蕾","pinyin":"wèilěi","match":["براعم التذوق","برعم التذوق","براعم"]},"priority":"core","atlas":{"layer":"mouth","element":"taste_buds"},"card":{"A":"مجموعات صغيرة من الخلايا على اللسان وفي سقف الحلق وأعلى الحلق، تحسّ خمسة طعوم: الحلو والمالح والحامض والمر واللذيذ (أومامي).","B":"كل موضع فيه براعم تذوق يحسّ الطعوم الخمسة كلها؛ وما يُرسم من «خريطة اللسان» خطأ شاع في الكتب."}},{"id":"receptor","term":{"ar":"المستقبِل الحسّي","en":"Sensory receptor","zh":"感受器","pinyin":"gǎnshòuqì","match":["المستقبل الحسي","المستقبلات الحسية","مستقبلات","المستقبلات","مستقبل"]},"priority":"supporting","atlas":{"layer":"skin","element":"receptors"},"card":{"A":"خلية أو طرف عصب صغير يحسّ شيئاً واحداً: لمساً أو ضغطاً أو حرارة أو رائحة أو طعماً، فيرسل رسالة في عصب إلى الدماغ.","B":"عدد المستقبلات يختلف بين المواضع: في سنتيمتر مربع من طرف الإصبع نحو مئة ضعف ما في مثله من جلد الظهر."}}],"experiment":{"title":"الأنف والذوق، ونقطتان على الجلد","materials":["تفاحة وكمثرى مقشرتان، مقطعتان قطعاً صغيرة متساوية","صحنان وشوكة لكل طفل","مشبك ورق يُفتح حتى يصير له طرفان، أو قلما رصاص","مسطرة","شريك: زميل{|ة} أو أحد أهلك{|ِ}"],"steps":["{أغمض|أغمضي} عينيك{|ِ} و{سدّ|سدّي} أنفك{|ِ} بإصبعين. يضع شريكك{|ِ} في فمك{|ِ} قطعة من إحدى الفاكهتين دون أن يقول أيهما. {امضغ|امضغي} و{قل|قولي}: تفاح أم كمثرى؟ ثلاث مرات بترتيب يختاره الشريك، ويسجّل كم أصبت{|ِ}.","{أعد|أعيدي} ثلاث مرات والأنف مفتوح. كم أصبت{|ِ} هذه المرة؟","يفتح الشريك المشبك حتى يكون بين طرفيه نحو سنتيمتر، ويلمس طرف إصبعك{|ِ} وعيناك{|ِ} مغمضتان، مرة بطرف واحد ومرة بطرفين، بترتيب يختاره. {قل|قولي}: واحد أم اثنان؟ عشر لمسات، ويسجّل كم أصبت{|ِ}.","{أعد|أعيدي} اللمسات العشر على ظهر ساعدك{|ِ} بالمسافة نفسها.","قارن{|ي}: متى عرفت{|ِ} الفاكهة أكثر؟ وفي أي موضع ميّزت{|ِ} النقطتين أكثر؟"],"safety":["لا يتذوق من عنده حساسية من أي فاكهة منهما، ولا يُجبر أحد على التذوق؛ ويكفيه أن يكون الشريك أو يجرّب اللمس وحده.","قطع صغيرة تُمضغ جيداً، وكل طفل بشوكته وصحنه، وتُغسل اليدان قبل التجربة.","يلمس المشبك الجلد لمساً خفيفاً بلا ضغط، بعيداً عن الوجه والعينين."],"expected":"مع سدّ الأنف يخلط الطفل غالباً بين التفاح والكمثرى، ومع فتحه يعرفهما. وعلى طرف الإصبع يميّز النقطتين في أكثر اللمسات، وعلى الساعد يظنهما نقطة واحدة في كثير منها.","explain":"اللسان يحسّ الحلاوة في الفاكهتين، أما ما يميّز التفاح من الكمثرى فرائحتهما، تصعد من الفم إلى الأنف من الخلف أثناء المضغ؛ فإذا سُدّ الأنف لم تصل الرائحة إلى مستقبلات الشم. فالنكهة ذوق وشم معاً. وطرف الإصبع فيه مستقبلات لمس أكثر بكثير من الساعد، فتقع كل نقطة على مستقبل مختلف فيعرف الدماغ أنهما اثنتان؛ أما على الساعد فقد تقع النقطتان على مستقبل واحد.","record":"الفاكهة: الأنف مسدود ___ من 3، مفتوح ___ من 3 — النقطتان: الإصبع ___ من 10، الساعد ___ من 10","alternatives":["بلا فاكهة: قطعتان من خبز بنكهتين مختلفتين، أو عصيران مختلفان في كوبين صغيرين.","بلا مشبك: قلما رصاص متلاصقان، أو يلمس الشريك بطرف إصبع واحد أو إصبعين متلاصقين."]},"find_the_error":[{"id":"FE1","atlas_variant":"tongue_map","error":"لسان مقسّم أربع مناطق: الحلو في الطرف، والمر في الآخر، والمالح والحامض على الجانبين","answer":"كل موضع فيه براعم تذوق يحسّ الطعوم الخمسة كلها","detects":"M86"},{"id":"FE2","atlas_variant":"ear_outer_only","error":"سهم من الأذن الظاهرة إلى الدماغ مباشرة، ومكتوب: هنا نسمع","answer":"الصوت يمرّ بالقناة والطبلة والعظيمات والقوقعة، ثم عصب السمع إلى الدماغ","detects":"M87"},{"id":"FE3","atlas_variant":"balance_cochlea","error":"سهم إلى القوقعة مكتوب عليه: عضو التوازن","answer":"التوازن في القنوات الهلالية بجانب القوقعة؛ والقوقعة للسمع"}],"numbers":[{"text":"أصغر عظمة في جسمك{|ِ}، الركاب، في أذنك{|ِ} الوسطى.","source":["S2"]},{"text":"في أنف الكلب ما يصل إلى 300 مليون مستقبل للروائح، وفي أنفك{|ِ} نحو 6 ملايين.","source":["S9"]},{"text":"مئة ديسيبل، صوت كثير من الأماكن الصاخبة، لا تُحتمل أكثر من ربع ساعة.","source":["S3"]}],"true_size":[],"animal":{"text":"في أنف الكلب ما يصل إلى 300 مليون مستقبل للروائح، وفي أنفنا نحو 6 ملايين؛ والجزء الذي يحلل الروائح في دماغه أكبر نسبةً من جزئنا بنحو أربعين مرة. لذلك يستطيع الكلب المدرّب أن يجد شخصاً تائهاً من رائحته.","source":["S9"]},"organ_letter":{"from":"الركاب، أصغر عظمة في جسمك{|ِ}","text":"مرحباً، أنا الركاب، أصغر عظمة في جسمك{|ِ}، أسكن في أذنك{|ِ} الوسطى مع أخويّ المطرقة والسندان. كل صوت {تسمعه|تسمعينه}، ضحكة صديق{ك|تكِ} أو تلاوة الإمام، يمرّ بنا: تهتز الطبلة فنهتز، وأدفع الاهتزاز إلى القوقعة فتحوّله رسائل إلى دماغك{|ِ}. نحن صغار لكننا لا نتوقف. وجارتي القوقعة رقيقة جداً، ويتعبها الصوت العالي الطويل، وما يتلف من خلاياها لا يعود. فإذا {وضعت|وضعتِ} السماعات {فاخفض|فاخفضي} الصوت، و{أرحنا|أريحينا} قليلاً كل ساعة."},"history":[{"who":"غيورغ فون بيكيشي","origin":"المجر","where_when":"بودابست ثم جامعة هارفارد، أبحاثه من 1940 إلى الستينيات، ونوبل 1961 (1899–1972)","did":"راقب اهتزاز أغشية القوقعة مع الصوت بالمجهر، وصوّره صوراً متتابعة، وقاس الشحنات الكهربائية في المستقبلات، فوضّح كيف تُنبَّه القوقعة.","did_not":"لم يعرف تفاصيل ما يجري في الخلايا الشعرية نفسها، ولا أنها تضخّم الاهتزاز؛ عرف العلماء ذلك بعده.","method_lesson":"حين يكون الشيء صغيراً جداً نصنع أدوات تريناه، ونصوّره لنراه مرة بعد مرة.","source":["S8"]},{"who":"ليندا باك وريتشارد أكسل","origin":"الولايات المتحدة","where_when":"جامعة كولومبيا، نيويورك، 1991، ونوبل 2004","did":"وجدا عائلة كبيرة من نحو ألف جين تصنع مستقبلات الروائح في الأنف، فبدأ العلماء يفهمون كيف يميّز الأنف آلاف الروائح.","did_not":"لم يكملا فهم كيف يقرأ الدماغ رموز الروائح ويتذكرها؛ وهذا سؤال ما زال مفتوحاً.","method_lesson":"سؤال قديم بسيط (كيف نشم؟) قد يجيب عنه بحث في أصغر أجزاء الخلية.","source":["S6"]}],"how_we_know":{"text":"كيف عرف العلماء ما يجري داخل القوقعة، وهي أصغر من حبة حمص ومدفونة في العظم؟ في القرن العشرين فتح العالم المجري بيكيشي قوقعات صغيرة بعناية، ونظر بالمجهر إلى أغشيتها وهي تهتز مع الصوت، وصوّرها صوراً متتابعة، فرأى كيف يسري الاهتزاز فيها وأين يكون أقوى؛ ونال جائزة نوبل سنة 1961. وفي الشم بحثت العالمة الأمريكية ليندا باك مع ريتشارد أكسل عن المستقبلات التي تلتقط الروائح، فوجدا سنة 1991 عائلة كبيرة من نحو ألف جين تصنعها. أما خريطة اللسان فقصة خطأ: بحث قديم وجد فروقاً صغيرة في الإحساس، ثم أُعيد رسمه بلا مقياس دقيق، فصدّقه الناس عشرات السنين حتى فحصه العلماء من جديد.","limit_question":"ما الذي لا يُظهره رسم الأذن مفتوحاً على الورق؟"},"what_changed":["تعلّم أجيال أن لكل طعم منطقة في اللسان؛ ثم وجد العلماء أن كل موضع فيه براعم تذوق يحسّ الطعوم كلها.","كان يُعدّ الطعم أربعة؛ واليوم يُعدّ خمسة، والخامس اللذيذ (أومامي).","لم يعرف العلماء كيف يميّز الأنف آلاف الروائح حتى وُجدت جينات مستقبلاتها سنة 1991."],"model_limits":["رسم الأذن يُظهر العظيمات كبيرة لتُرى؛ هي في الحقيقة صغيرة جداً.","القوقعة في الرسم مفتوحة؛ في الجسم ملفوفة ومدفونة في عظم الجمجمة.","رسم اللسان يُظهر البراعم نقاطاً كبيرة؛ هي صغيرة جداً، وكثير منها في جوانب النتوءات الصغيرة على اللسان.","الرسم يُظهر حاسة واحدة كل مرة؛ والدماغ يجمع الحواس معاً، كالذوق والشم."],"faith":{"opening":null,"closing":{"text":"ما عاب النبي ﷺ طعاماً قط، إن اشتهاه أكله، وإن كرهه تركه","reference":"البخاري 5409","grade":"صحيح (متفق عليه)","usage":"قيمة","reflection":"تعلّمت{|ِ} اليوم أن الطعم ذوق وشم معاً، وأن الناس يختلفون في ما يحبون من الطعام. والحديث يخبرنا أن النبي ﷺ ما عاب طعاماً قط: إن اشتهاه أكله، وإن لم يشتهه تركه بلا كلمة سيئة عنه. فإذا لم يعجبك{|ِ} طعام في بيت صديق{ك|تكِ} أو على مائدة أمك{|ِ} فلا {تعبه|تعيبيه}: {اتركه|اتركيه} بأدب، فغيرك{|ِ} قد يحبه، ومن صنعه تعب فيه. والحديث لا يتكلم عن براعم التذوق ولا عن الأنف؛ هو أدب في الكلام عن الطعام.","reviewed":false,"hadith_key":"bukhari:5409","level":"ترغيب","concept":"لا نعيب الطعام: نأكل ما نشتهي ونترك ما لا نشتهي بأدب.","avoid":"لا نقول إن الحديث يمنع الطفل أن يخبر أهله بأن طعاماً لا يعجبه أو بأن عنده منه حساسية؛ ولا نجعل علم الذوق دليلاً على الحديث.","lead":"عن أبي هريرة رضي الله عنه قال:","narration":true,"source":"البخاري 5409","grader":"","cards":[]}},"life":[{"situation":"أنام كل ليلة والسماعات في أذني، والصوت عالٍ لأني أحبه.","science":"خلايا السمع في القوقعة يتلفها الصوت العالي الطويل، غالباً بلا ألم، وما يتلف منها لا يعود؛ وتنصح منظمة الصحة العالمية بخفض الصوت وأقل من ساعة يومياً.","action":"أخفض الصوت، وأستمع أقل من ساعة، وأنزع السماعات قبل النوم، وآخذ راحة قصيرة.","value":"حفظ النعمة ودفع الضرر عن النفس.","why":"لماذا لا أشعر بالأذى؟ لأن خلايا السمع تتلف بهدوء، ولا يظهر النقص إلا بعد وقت. والنبي ﷺ نهى عن الضرر، كما في البطاقة؛ ومن الضرر أن نتلف نعمة السمع بأيدينا.","reference":"ابن ماجه 2341","hadith":["ibnmajah:2341"],"cards":[{"key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","text":"لا ضرر ولا ضرار","narration":false,"source":"ابن ماجه 2341","grade":"حسن","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني"}],"verses":[]},{"situation":"زميل في صفّي يلبس سماعة طبية، وبعض الأولاد يتكلمون خلفه ويضحكون لأنه لا يسمعهم.","science":"السماعة الطبية تقوّي الصوت قبل أن يدخل الأذن ليصل إلى خلايا السمع؛ وصاحبها يسمع أوضح حين نواجهه ونتكلم بوضوح.","action":"أواجهه حين أكلمه، وأتكلم بوضوح بلا صراخ، وأقول للأولاد إن الضحك منه أذى، وأخبر المعلم إن تكرر.","value":"سلامة الناس من ألسنتنا وأيدينا.","why":"لماذا أواجهه؟ لأنه يستعين بالنظر إلى الشفاه والوجه مع ما تقوّيه السماعة. والنبي ﷺ جعل سلامة المسلمين من لسان المسلم ويده علامة إسلامه، كما في البطاقة؛ والضحك منه من خلفه أذى باللسان.","reference":"البخاري 10","hadith":["bukhari:10"],"cards":[{"key":"bukhari:10","lead":"عن عبد الله بن عمرو رضي الله عنهما، عن النبي ﷺ قال:","text":"المسلم من سلم المسلمون من لسانه ويده، والمهاجر من هجر ما نهى الله عنه","narration":false,"source":"البخاري 10؛ ونحوه عند مسلم 40","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كيف يميّز الأنف آلاف الروائح بعدد محدود من أنواع المستقبلات؟ وكيف يتذكر الدماغ رائحة شمّها مرة قبل سنين؟","why_open":"يعرف العلماء أن كل رائحة تنشّط مجموعة من المستقبلات معاً كأنها رمز، لكن كيف يقرأ الدماغ هذه الرموز ويحفظها طويلاً ما زال يُبحث."}],"notebook":{"draw":"ارسم{|ي} مقطع الأذن: الأذن الظاهرة، والقناة، والطبلة، والعظيمات الثلاث، والقوقعة الحلزونية، والقنوات الهلالية الثلاث، وعصب السمع إلى الدماغ؛ وارسم{|ي} سهم الصوت. ثم ارسم{|ي} لساناً واكتب{|ي} عليه كله «الطعوم الخمسة»، وارسم{|ي} سهماً من الفم إلى الأنف من الخلف. المستوى ب: ارسم{|ي} يداً وظهراً، و{ضع|ضعي} على كل منهما نقاطاً بعدد المستقبلات تقريباً.","label":["الأذن الظاهرة","قناة الأذن","طبلة الأذن","العظيمات الثلاث","القوقعة","القنوات الهلالية","عصب السمع","براعم التذوق","— ب: كثافة المستقبلات"],"write":"أشرح: لماذا يبهت الطعام مع الزكام؟ ولماذا لا أرفع صوت السماعات؟ وأكتب نتائج تجربتي."},"imgs":["U08.L03-E1","U08.L03-E2","U08.L03-E3","U08.L03-E4","U08.L03-E5","U08.L03-E6","U08.L03-exp","U08.L03-hist1","U08.L03-hist2","U08.L03-letter","U08.L03-life","U08.L03-title-boy","U08.L03-title-girl"]};
