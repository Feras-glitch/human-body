const LD = {"id":"U07.L01","first":true,"title":"الكليتان: مصفاتان تعيدان ما ينفع","driving_question":"{اسم}، يمرّ دمك{|ِ} في كليتيك{|ِ} مرات كثيرة كل يوم. فلماذا لا يخرج كله بولاً؟ وكيف تعرف الكليتان ما تُبقيان وما تُخرجان؟","central_fact":"الكليتان في الظهر ترشّحان الدم: يعبر الماء وما ذاب فيه من أشياء صغيرة، ثم يعود معظمه إلى الدم (إعادة الامتصاص)، ولا يخرج بولاً إلا ما زاد من الماء والأملاح مع فضلات أهمها اليوريا.","next":"U07.L02","hook":{"text":"{اسم}، يمرّ في كليتيك{|ِ} كل يوم سائل يخرج من دمك{|ِ}. كم تظن{|ين} كميته عند الكبير؟","options":["كوب واحد","زجاجة ماء كبيرة","حوض استحمام تقريباً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["urinary","skeletal"],"highlight":["kidney"],"zoom":"back","animate":"thumbs_to_back"},"text":"ضع{|ي} يديك{|ِ} على خصرك{|ِ}، ثم {أدر|أديري} إبهاميك{|ِ} إلى الخلف واصعد{|ي} بهما قليلاً حتى {تلمس|تلمسي} آخر ضلع. هنا، في عمق ظهرك{|ِ} تحت الإبهامين، الكليتان: اثنتان، واحدة على كل جانب من العمود الفقري. كل كلية بحجم قبضة اليد تقريباً، وشكلها كحبة فاصولياء كبيرة. تحميها الأضلاع السفلية والعضلات وطبقة من الدهن، فلا نراها ولا نلمسها من فوق الجلد. واليمنى أنزل قليلاً من اليسرى، لأن الكبد الكبير يجلس فوقها. انتبه{|ي}: الكليتان ليستا في أسفل البطن من الأمام؛ هناك عضو آخر سنتعرّف إليه في الدرس القادم."},{"id":"E2","level":"A","atlas":{"layers":["urinary","circulatory"],"highlight":["renal_artery","glomerulus"],"zoom":"kidney","animate":"filter"},"text":"الآن تابع{|ي} الدم. يدخل كل كلية من شريان كبير يأتي من القلب، ثم يتفرّع إلى شعيرات دقيقة جداً ملفوفة على نفسها ككُبّة خيط صغيرة. جدار هذه الكبة مصفاة دقيقة: يعبرها الماء وكل ما ذاب فيه من أشياء صغيرة — السكر، والأملاح، وفضلات صغيرة — أما خلايا الدم والبروتينات الكبيرة فلا تعبر، وتبقى في الدم. هذا هو الترشيح. ما يعبر سائل صافٍ يشبه الماء، وكميته مدهشة: نحو 150 إلى 180 لتراً في اليوم عند الكبير، كأن حوض استحمام كاملاً يمرّ في الكليتين كل يوم. كيف يكون ذلك؟ لأن الدم يدور، فيمرّ في الكليتين مرات كثيرة كل يوم."},{"id":"E3","level":"A","atlas":{"layers":["urinary","circulatory"],"highlight":["tubule","capillary"],"zoom":"nephron","animate":"reabsorb"},"text":"لكن مهلاً: لو خرج هذا السائل كله بولاً لاحتجت{|ِ} إلى الحمام كل بضع دقائق، ولفقد جسمك{|ِ} ماءه في ساعات! ما يحدث أن السائل المرشَّح يمشي بعد المصفاة في أنبوب رفيع طويل ملتوٍ، تلتفّ حوله شعيرات دموية. وعلى طول الأنبوب يرجع إلى الدم ما يحتاجه الجسم: معظم الماء، والسكر كله تقريباً، وما يلزم من الأملاح. هذا اسمه إعادة الامتصاص. من كل مئة لتر رُشِّحت يعود نحو تسعة وتسعين، ولا يبقى في آخر الأنبوب إلا لتر أو لتران في اليوم: هذا هو البول. فالكليتان لا تُخرجان كل ما يمرّ بهما؛ إنهما ترشّحان الكثير ثم تختاران بدقة ما يعود."},{"id":"E4","level":"A","atlas":{"layers":["urinary","digestive"],"highlight":["liver","kidney"],"zoom":"abdomen","animate":"urea_path"},"text":"فماذا في البول؟ معظمه ماء، وفيه ما زاد عن حاجة الجسم من الأملاح، وفضلات أهمها اليوريا. من أين تأتي اليوريا؟ تذكّر{|ي} الكبد في درس الطعام: حين يُكسّر الجسم البروتين يصنع الكبد اليوريا، فيحملها الدم إلى الكليتين، فتُخرجانها مع البول. لو بقيت تتراكم في الدم لأضرّت بالجسم. ولهذا يتغير البول مع ما نشرب ونأكل: إذا شربنا كثيراً أبقت الكليتان ما يحتاجه الجسم وأخرجتا الزائد، فكثر البول وصار فاتح اللون؛ وإذا شربنا قليلاً أعادتا ماءً أكثر إلى الدم، فقلّ البول وصار غامقاً."},{"id":"E5","level":"A","atlas":{"layers":["urinary"],"highlight":["kidney"],"zoom":"back","animate":"balance"},"text":"وللكليتين أعمال أخرى صامتة: تساعدان في ضبط ضغط الدم، وتساعدان الجسم على صنع الكريات الحمراء، وتساعدان العظام على أن تبقى قوية. فالكليتان ليستا مكنسة تكنس الأوساخ وكفى؛ إنهما ميزان: تُبقيان في الدم ما يكفي من الماء والأملاح، لا أكثر ولا أقل، وتُخرجان ما زاد مع الفضلات. وتعملان وأنت{|ِ} تلعب{|ين} وتقرأ{|ين} وتنام{|ين}، بلا أن {تأمرهما|تأمريهما}. ونحن نساعدهما بشيئين بسيطين: ماء كافٍ، وألا نكتم البول طويلاً — وسنعرف السبب في الدرس القادم."},{"id":"E6","level":"B","atlas":{"layers":["urinary","circulatory"],"highlight":["nephron","glomerulus","tubule"],"zoom":"nephron"},"text":"للمستوى ب: كيف تعمل المصفاة والأنبوب معاً؟ في كل كلية نحو مليون وحدة صغيرة اسمه البول؟","options":["من تكسير البروتين في الكبد","من الماء الذي نشربه","من خلايا الكلية نفسها","من الهواء الذي نتنفسه"],"answer":0,"explanation":"حين يُكسّر الجسم البروتين يصنع الكبد اليوريا، ويحملها الدم إلى الكليتين فتُخرجانها في البول.","level":"A","feedback_wrong":"أي عضو تذكّرناه في هذا الدرس من درس الطعام؟","feedback_by_option":{"1":"الماء يحمل اليوريا في البول، لكنه ليس مصدرها؛ مصدرها تكسير البروتين.","2":"الكلية تُخرج اليوريا ولا تصنعها؛ يصنعها الكبد.","3":"الهواء يعطينا الأكسجين؛ واليوريا من تكسير البروتين."}},{"id":"U07.L01.P5","after":"E6","objective":"U07.L01.O5","type":"choose","prompt":"أين يحدث الترشيح في النفرون؟","options":["في الأنبوب الطويل الملتوي","في الحالب","في المثانة","في الكبة داخل كأس صغيرة"],"answer":3,"explanation":"الترشيح في الكبة، وهي شعيرات دموية ملفوفة داخل كأس صغيرة؛ والأنبوب بعدها يعيد ما ينفع.","level":"B","feedback_wrong":"ما الجزآن في النفرون؟ وأيهما المصفاة؟","feedback_by_option":{"0":"الأنبوب يعيد ما ينفع إلى الدم؛ الترشيح قبله في الكبة.","1":"الحالب خارج الكلية، ينقل البول بعد أن يكتمل.","2":"المثانة تخزّن البول؛ لا ترشيح فيها."}}],"check":[{"id":"U07.L01.C1","objective":"U07.L01.O1","type":"explain_open","prompt":"صِف{|ي} لزميل{ك|تكِ} كيف يجد موضع كليتيه بيديه.","answer":"يضع يديه على خصره ويدير الإبهامين إلى الخلف حتى آخر ضلع؛ الكليتان في العمق تحت الإبهامين، على جانبي العمود الفقري.","level":"A","rubric":"R1"},{"id":"U07.L01.C2","objective":"U07.L01.O2","type":"fix_model","prompt":"رسم زميل{ك|تكِ} مصفاة الكلية تُخرج خلايا الدم الحمراء مع البول. ما الخطأ؟","answer":"الخلايا كبيرة فلا تعبر المصفاة وتبقى في الدم؛ يعبر الماء وما ذاب فيه من أشياء صغيرة.","level":"A","rubric":"R1"},{"id":"U07.L01.C3","objective":"U07.L01.O3","type":"true_false_why","prompt":"«معظم السائل المرشَّح يعود إلى الدم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يعود نحو 99 في المئة، فلا يبقى بولاً إلا لتر أو لتران في اليوم.","level":"A","rubric":"R1"},{"id":"U07.L01.C4","objective":"U07.L01.O4","type":"explain_open","prompt":"تتبّع{|ي} قطرة ماء من كوبك{|ِ} حتى  المرشَّح في اليوم عند الكبير."}},{"id":"reabsorption","term":{"ar":"إعادة الامتصاص","en":"Reabsorption","zh":"重吸收","pinyin":"chóngxīshōu","match":["إعادة الامتصاص","إعادة امتصاص"]},"priority":"core","atlas":{"layer":"urinary","element":"tubule"},"card":{"A":"رجوع ما يحتاجه الجسم من السائل المرشَّح إلى الدم: معظم الماء، والسكر كله تقريباً، وما يلزم من الأملاح. وما يبقى في آخر الطريق هو البول.","B":"يحدث على طول أنبوب ملتوٍ تحيطه شعيرات دموية؛ يعود نحو 99 في المئة من السائل المرشَّح."}},{"id":"urea","term":{"ar":"اليوريا","en":"Urea","zh":"尿素","pinyin":"niàosù","match":["اليوريا","يوريا"]},"priority":"core","atlas":{"layer":"urinary","element":"urea"},"card":{"A":"فضلة يصنعها الكبد حين يُكسّر الجسم البروتين؛ يحملها الدم إلى الكليتين فتُخرجانها في البول.","B":"لو تراكمت في الدم لأضرّت؛ ولذلك يقيس الأطباء مقدارها في الدم ليطمئنوا على عمل الكليتين."}},{"id":"nephron","term":{"ar":"النفرون","en":"Nephron","zh":"肾单位","pinyin":"shèndānwèi","match":["النفرون","نفرون","النفرونات","نفروناً"]},"priority":"supporting","atlas":{"layer":"urinary","element":"nephron"},"card":{"A":"وحدة ترشيح صغيرة جداً في الكلية، لا تُرى إلا بالمجهر.","B":"في كل كلية نحو مليون نفرون (ويُسمّى أيضاً الوحدة الكلوية)؛ لكل منها كبة تُرشّح وأنبوب يعيد ما ينفع ويُخرج الفضلات."}}],"experiment":{"title":"مصفاة الكلية والمئة حبة","materials":["مصفاة قهوة ورقية أو منديل ورقي في قمع، وكوبان شفافان","ماء وقطرة ملوّن طعام وملعقة حبات أرز أو عدس","مئة حبة فاصولياء أو أزرار، وثلاثة صحون مكتوب عليها: الدم، المرشَّح، البول"],"steps":["{ضع|ضعي} يديك{|ِ} على خصرك{|ِ}، ثم {أدر|أديري} إبهاميك{|ِ} إلى الخلف حتى {تلمس|تلمسي} آخر ضلع. هنا، في العمق، كليتاك{|ِ}. اقبض{|ي} يدك{|ِ}: هذا حجم الكلية تقريباً.","اخلط{|ي} في الكوب الأول ماءً وقطرة ملوّن وحبات الأرز: هذا «دم» فيه ماء وأشياء صغيرة ذائبة (اللون) وخلايا كبيرة (الأرز).","صبّ{|ي} الخليط ببطء في المصفاة فوق الكوب الثاني. ماذا عبر إلى الكوب؟ وماذا بقي فوق المصفاة؟","ضع{|ي} المئة حبة في صحن «المرشَّح»: هذه مئة لتر رُشِّحت. {أعد|أعيدي} إلى صحن «الدم» تسعاً وتسعين حبة، عشرة عشرة ثم واحدة واحدة. كم بقي لصحن «البول»؟","اكتب{|ي}: ماذا يعبر مصفاة الكلية وماذا يبقى؟ ولماذا لا يخرج كل المرشَّح بولاً؟"],"safety":["لا نشرب ولا نتذوق شيئاً من خليط التجربة.","الملوّن يصبغ الملابس والطاولة: نضع ورقاً تحت الأكواب.","تُغسل اليدان بعد التجربة، ولا تُوضع الحبات في الفم أو الأنف."],"expected":"الماء الملوّن يعبر المصفاة ويبقى الأرز فوقها؛ ومن المئة حبة تعود تسع وتسعون ويبقى للبول حبة واحدة.","explain":"مصفاة الكلية تشبه مصفاتك{|ِ}: يعبرها الماء وما ذاب فيه من أشياء صغيرة — مثل اللون في كوبك{|ِ}، ومثل السكر والأملاح واليوريا في الدم — أما الأشياء الكبيرة كخلايا الدم فتبقى. لكن الكلية تفعل شيئاً لا تفعله مصفاة القهوة: بعد الترشيح تعيد ما ينفع إلى الدم. من كل مئة لتر رُشِّحت يعود نحو تسعة وتسعين، ويخرج لتر واحد تقريباً بولاً. هذه إعادة الامتصاص، ولهذا لا نفقد ماءنا في ساعات.","record":"ما عبر المصفاة وما بقي فوقها، وكم حبة عادت وكم بقيت للبول، والجوابان.","alternatives":["بلا مصفاة قهوة: منديل ورقي مطوي مرتين في كوب بلاستيكي مثقوب.","بلا حبات: مئة قصاصة ورق صغيرة، أو رسم مئة مربع وتلوين واحد منها."]},"find_the_error":[{"id":"FE1","atlas_variant":"kidneys_front","error":"الكليتان مرسومتان في أسفل البطن من الأمام","answer":"في الظهر تحت آخر الأضلاع، على جانبي العمود الفقري","detects":"M69"},{"id":"FE2","atlas_variant":"all_out","error":"سهم مكتوب عليه: كل ما يُرشَّح يخرج بولاً","answer":"يعود نحو 99 في المئة إلى الدم؛ ولا يخرج بولاً إلا القليل","detects":"M70"},{"id":"FE3","atlas_variant":"stomach_to_bladder","error":"أنبوب من المعدة إلى المثانة يمرّ فيه الماء المشروب","answer":"لا أنبوب بينهما: الماء يُمتص إلى الدم في الأمعاء، ثم ترشّحه الكليتان","detects":"M13"}],"numbers":[{"text":"نحو 150 إلى 180 لتراً من السائل المرشَّح كل يوم عند الكبير — حوض استحمام تقريباً — ولا يخرج منه بولاً إلا لتر أو لتران.","source":["S2"]},{"text":"في كل كلية نحو مليون نفرون، كل منها أصغر من أن يُرى بالعين.","source":["S1"]},{"text":"وزن الكلية الواحدة في الكبير نحو 115 إلى 175 غراماً — كتفاحة كبيرة — وتأخذ الكليتان معاً نحو ربع ما يضخه القلب ونحن مستريحون.","source":["S3"]}],"true_size":[{"text":"اقبض{|ي} يدك{|ِ}: كل كلية بحجم قبضة اليد تقريباً. {ضع|ضعي} قبضتيك{|ِ} على ظهرك{|ِ} تحت آخر الأضلاع: هنا مكانهما.","source":["S1"]}],"animal":{"text":"الجمل يقضي أياماً في الصحراء بلا شرب. سنامه دهن لا خزان ماء، لكن كليتيه تصنعان بولاً مركّزاً جداً فتحفظان الماء، وبرازه جاف. وفي عمق كليته أنابيب طويلة كثيرة تساعد على إعادة ماء أكثر إلى الدم.","source":["S8","S9"]},"organ_letter":{"from":"كليتك{|ِ} اليسرى","text":"أنا بحجم قبضتك{|ِ}، أختبئ في ظهرك{|ِ} تحت آخر ضلع، وأختي اليمنى أنزل مني قليلاً لأن الكبد يجلس فوقها. يمرّ فيّ دمك{|ِ} مرات كثيرة كل يوم، فأرشّح منه حوض استحمام كاملاً، ثم أعيد إليه تسعة وتسعين جزءاً من كل مئة. لا أُخرج إلا ما زاد: ماءً زائداً، وملحاً زائداً، ويوريا صنعها جارنا الكبد. أعمل وأنت{|ِ} تلعب{|ين}، وأعمل وأنت{|ِ} نائم{|ة}، ولا أطلب كثيراً: ماءً كافياً، وألا {تكتم|تكتمي} حاجتك{|ِ} طويلاً. مع التحية، ميزانك{|ِ} الصامت."},"history":[{"who":"جالينوس","origin":"من برغامون (في تركيا اليوم)","where_when":"روما، القرن الثاني الميلادي","did":"ربط الحالبين في حيوان حي، فامتلأ الحالبان وبقيت المثانة فارغة؛ فلما فكّ الرباط امتلأت المثانة. فالبول يأتي إليها من الكليتين عبر الحالبين، لا من المثانة نفسها.","did_not":"لم يعرف كيف تصنع الكلية البول؛ ظنّها تجذبه من الدم بقوة فيها، والترشيح عُرف بعده بقرون. وتجربة كهذه على حيوان حي لا تُقبل اليوم إلا بقواعد صارمة تمنع الألم.","method_lesson":"سُدّ طريقاً واحداً وراقب: ماذا يمتلئ؟ وماذا يبقى فارغاً؟","source":["S5"]},{"who":"جوزيف ويرن وألفرد ريتشاردز","origin":"الولايات المتحدة","where_when":"فيلادلفيا، 1923 (نُشر 1924)","did":"سحبا بأنبوب زجاجي أدقّ من الشعرة قطرة من السائل حول كبة في كلية ضفدع: خالية من البروتين وفيها سكر؛ وبول المثانة بلا سكر. فالبول يبدأ ترشيحاً، ثم يُعاد السكر إلى الدم في الأنبوب.","did_not":"لم يريا السكر يعود بأعينهما؛ استنتجا ذلك من المقارنة. وأكملت تجارب أخرى بعدهما ما يحدث في كل جزء من الأنبوب.","method_lesson":"قارن ما يدخل بما يخرج لتعرف ما حدث في الوسط الذي لا تراه.","source":["S6","S7"]}],"how_we_know":{"text":"كيف نعرف أن البول يبدأ ترشيحاً من الدم، والأنبوب أدقّ من شعرة لا نراه يعمل؟ في عام 1923 أدخل جوزيف ويرن وألفرد ريتشاردز في أمريكا أنبوباً زجاجياً أدقّ من الشعرة في الكأس الصغيرة حول كبة في كلية ضفدع، وسحبا قطرة من السائل. حللاها: لا بروتين فيها، وفيها سكر كالذي في الدم. ثم حللا البول في المثانة: لا سكر فيه. السكر دخل المصفاة ثم غاب قبل البول — إذن أُعيد إلى الدم في الطريق. مقارنة سائلين كشفت خطوتين لم يرهما أحد بعينه: ترشيح، ثم إعادة امتصاص.","limit_question":"ما الذي يُخفيه رسم كلية واحدة كبيرة ملوّنة فيها نفرون واحد عن الحقيقة؟"},"what_changed":["ظُنّ قديماً أن الكلية «تجذب» البول من الدم بقوة خفية فيها (جالينوس)؛ ثم عرفنا أنها ترشّح بضغط الدم ثم تعيد ما ينفع.","يُقال كثيراً إن الكليتين «تنظفان» الدم؛ والأدق أنهما توازنان الماء والأملاح، وتُخرجان الزائد والفضلات، وتعملان أعمالاً أخرى."],"model_limits":["الكلية في الرسم مكبّرة وملوّنة؛ لونها الحقيقي أحمر بنّي.","النفرون في الرسم واحد كبير؛ في الحقيقة نحو مليون في كل كلية لا تُرى إلا بالمجهر.","مصفاة القهوة ثقوبها ثابتة ولا تعيد شيئاً؛ مصفاة الكلية حيّة تعمل بضغط الدم، وبعدها أنبوب يختار ما يعود.","الكليتان في رسم البطن من الأمام تبدوان أمام الأمعاء؛ هما في الحقيقة خلفها، قرب الظهر."],"faith":{"opening":{"text":"وَإِن تَعُدُّوا۟ نِعْمَةَ ٱللَّهِ لَا تُحْصُوهَآ ۗ إِنَّ ٱللَّهَ لَغَفُورٌۭ رَّحِيمٌۭ","reference":"النحل 18","grade":"قرآن","usage":"تفكر","reflection":"في كل يوم يمرّ في كليتيك{|ِ} سائل يملأ حوض استحمام، فترشّحانه وتعيدان أكثره، وأنت{|ِ} في الصف أو في النوم لا تشعر{|ين} بشيء. والآية التي أمامك{|ِ} تقول إننا لو حاولنا أن نعدّ النعم ما استطعنا أن نحصرها. الآية لا تتكلم عن الكليتين وحدهما؛ لكننا اليوم ننظر في نعمة واحدة منها بعين العلم، فنعرف كم من النعم نعيش فيها ولا ننتبه. ما نعمة في جسمك{|ِ} لا تشعر{|ين} بها عادة؟","reviewed":false,"quran_key":"16:18","hl_words":[0,5],"highlight":"وإن تعدوا نعمة الله لا تحصوها","level":"تفكر","concept":"النعم الخفية أكثر من أن تُحصى؛ النظر فيها يعلّم الشكر.","avoid":"لا نقول إن الآية تذكر الكليتين أو الترشيح، ولا نجعل الأرقام العلمية دليلاً على الآية ولا الآية دليلاً عليها.","cards":[]},"closing":null},"life":[{"situation":"جدتي تذهب إلى المستشفى ثلاث مرات في الأسبوع لغسيل الكلى، وتعود متعبة.","science":"حين تضعف الكليتان يقوم جهاز بترشيح الدم خارج الجسم ساعات، ليُخرج ما كانت الكليتان تُخرجانه بلا توقف؛ ولذلك يُتعبها اليوم الطويل.","action":"أزورها وأجلس معها، وأساعدها في شيء صغير، وأسأل عن حالها بلطف، ولا أقول أمامها كلاماً يخيفها.","value":"عيادة المريض حق له، والكلمة الطيبة تُخفف عنه.","why":"لماذا يتعبها الغسيل وهو يساعدها؟ لأن الجهاز يحاول في ساعات قليلة أن يعمل ما تعمله الكليتان السليمتان كل دقيقة من اليوم والليلة. والنبي ﷺ أمر بعيادة المريض مع إطعام الجائع وفكّ الأسير؛ فزيارتك{|ِ} لها عبادة ورحمة معاً.","reference":"البخاري 5649","hadith":["bukhari:5649"],"cards":[{"key":"bukhari:5649","lead":"عن أبي موسى الأشعري رضي الله عنه قال: قال رسول الله ﷺ:","text":"أطعموا الجائع، وعودوا المريض، وفكّوا العاني","narration":false,"source":"البخاري 5649","grade":"صحيح","grader":""}],"verses":[]},{"situation":"بعد لعب الكرة في يوم حار رأيت بولي قليلاً وغامقاً، فخفت أن تكون كليتاي مريضتين.","science":"فقد جسمك ماءً بالعرق، فأعادت الكليتان ماءً أكثر إلى الدم لتحفظاه؛ فقلّ البول وصار غامقاً. هذه إشارة إلى الحاجة إلى الماء، لا إلى المرض غالباً.","action":"أشرب ماءً بعد اللعب على مراحل، وألاحظ أن البول يعود أفتح بعد ساعات؛ وإن رأيت دماً أو شعرت بألم أو حرقة أخبر أهلي.","value":"الجسد أمانة: نلاحظ إشاراته ونستجيب لها بهدوء.","why":"لماذا لم تُخرج الكليتان الماء كعادتهما؟ لأنهما ميزان: حين ينقص الماء في الدم تعيدان أكثره، فيقلّ البول ويتركّز لونه. فالبول الغامق بعد العرق كأنه رسالة من كليتيك{|ِ}: {اشرب|اشربي}.","cards":[],"verses":[]}],"open_questions":[{"q":"كيف «تعرف» الكلية في كل دقيقة كم تعيد من الماء والملح بالضبط؟","why_open":"نعرف إشارات وهرمونات كثيرة تحمل الخبر إلى الكلية، وما زال العلماء يكتشفون كيف تتفاهم أجزاء النفرون الواحد فيما بينها."}],"notebook":{"draw":"ارسم{|ي} ظهراً من الخلف: العمود الفقري وآخر الأضلاع، والكليتين كحبتي فاصولياء على جانبيه، واليمنى أنزل قليلاً، وأنبوباً ينزل من كل كلية. ثم دائرة تكبير: كبة داخل كأس، وأنبوب ملتوٍ، وسهم «يعود إلى الدم» وسهم «بول». المستوى ب: {اكتب|اكتبي} «نفرون» على التكبير، و«ربع دم القلب» على الشريان.","label":["الكلية اليمنى","الكلية اليسرى","العمود الفقري","آخر الأضلاع","المصفاة (الكبة)","يعود إلى الدم","بول","— ب: النفرون"],"write":"أشرح: ماذا يعبر مصفاة الكلية وماذا يبقى في الدم؟ ولماذا لا يخرج كل السائل المرشَّح بولاً؟ ثم أكتب رحلة اليوريا من البروتين إلى البول."},"imgs":["U07.L01-E1","U07.L01-E2","U07.L01-E3","U07.L01-E4","U07.L01-E5","U07.L01-E6","U07.L01-exp","U07.L01-hist1","U07.L01-hist2","U07.L01-letter","U07.L01-life","U07.L01-title-boy","U07.L01-title-girl"]};
