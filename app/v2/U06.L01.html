const LD = {"id":"U06.L01","first":true,"title":"الفم: أول محطة في الطريق","driving_question":"{اسم}، لماذا تحسّ{|ين} بحلاوة خفيفة لو مضغت{|ِ} خبزاً بلا سكر دقيقتين؟ وماذا يحدث في فمك{|ِ} قبل أن تبلع{|ي}؟","central_fact":"الهضم يبدأ في الفم: الأسنان بأشكالها تقطع وتمزق وتطحن، واللعاب يبلّل ويبدأ تكسير النشا إلى سكر، واللسان يدفع اللقمة للبلع بينما يغلق لسان المزمار طريق الهواء.","next":"U06.L02","nexts":[{"id":"U06.L02","gated":false},{"id":"U06.L03","gated":false},{"id":"U06.L04","gated":false},{"id":"U06.L05","gated":false},{"id":"U06.L06","gated":false}],"hook":{"text":"{اسم}، امضغ{|ي} قطعة خبز دقيقتين بلا بلع. أتوقع{|ين} أن يبقى طعمها كما هو؟","options":["نعم، الخبز خبز","يصير أحلى قليلاً","يصير مرّاً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive"],"highlight":["mouth","teeth"],"zoom":"mouth"},"text":"في الوحدة الماضية وعدناك{|ِ}: سنعرف كيف يصير الخبز سكراً. الرحلة تبدأ هنا، في فمك{|ِ}. أول العاملين الأسنان، وليست كلها سواء. في المقدمة قواطع مسطحة كالسكين تقطع اللقمة. بجانبها أنياب مدببة تمسك وتمزق. بعدها ضواحك لكل منها رأسان تهرس اللقمة. وفي الخلف أضراس عريضة كالرحى تطحن. انظر{|ي} في المرآة: كم نوعاً تجد{|ين}؟ الضواحك تظهر بين العاشرة والثانية عشرة مكان أضراس الطفولة، فقد لا تجد{|ين}ها كلها بعد. ولماذا أشكال مختلفة؟ لأن كل عمل يحتاج أداة."},{"id":"E2","level":"A","atlas":{"layers":["digestive"],"highlight":["salivary_glands","tongue"],"zoom":"mouth","animate":"saliva"},"text":"العامل الثاني لا {تراه|ترينه}: اللعاب. ثلاثة أزواج من الغدد تصبّه في فمك{|ِ} — نحو لتر في اليوم — ويبدأ قبل أن تأكل{|ي}: رائحة الطعام وحدها تجعل فمك{|ِ} يسيل. اللعاب يبلّل اللقمة فتنزلق، وفيه مادة تبدأ تحويل النشا الذي في الخبز إلى سكر. لذلك يصير الخبز حلواً إن {مضغته|مضغتِه} طويلاً. هذا هو الهضم: تكسير الطعام إلى أصغر فأصغر — وقد بدأ في الفم، لا في المعدة."},{"id":"E3","level":"A","atlas":{"layers":["digestive","respiratory"],"highlight":["tongue","epiglottis","esophagus"],"zoom":"throat","animate":"swallow"},"text":"ثم البلع. اللسان — وهو عضلة — يجمع اللقمة ويدفعها إلى الخلف. وهنا مفترق طريقين: أمامها القصبة الهوائية التي عرفناها، وخلفها المريء إلى المعدة. في لحظة البلع يرتفع الحلق ويُطبق غطاء صغير اسمه لسان المزمار على القصبة، فتنزلق اللقمة إلى المريء. ضع{|ي} أصابعك{|ِ} على حلقك{|ِ} وابلع{|ي}: ستحسّ{|ين} بالارتفاع. وإن ضحكت{|ِ} وأنت{|ِ} تبلع{|ين} قد يتأخر الغطاء فتدخل قطرة في القصبة — فتشرق{|ين} وتسعل{|ين}: السعال يُخرجها. لذلك لا نتكلم والفم ملآن."},{"id":"E4","level":"A","atlas":{"layers":["digestive"],"highlight":["tooth"],"zoom":"tooth","animate":"decay"},"text":"والآن سرّ التسوس. السكر لا يكسر السن بنفسه. على أسنانك{|ِ} طبقة لزجة فيها بكتيريا صغيرة جداً، تأكل السكر الذي يبقى بعد الطعام وتصنع منه حمضاً. الحمض يذيب معادن المينا — الطبقة الصلبة الخارجية، أصلب شيء في جسمك{|ِ}. لكن جسمك{|ِ} يصلح: اللعاب فيه معادن تعود إلى السن، والفلورايد في المعجون يساعد. المعركة كل يوم: حمض يأخذ، ولعاب يعيد. من يربح؟ من {تعطيه|تعطينه} الوقت."},{"id":"E5","level":"B","atlas":{"layers":["digestive"],"highlight":["tooth"],"zoom":"tooth"},"text":"للمستوى ب: ما الذي يهزم الإصلاح؟ ليس كمية السكر بل تكراره. كل مرة تدخل سكراً فمك{|ِ} يعمل الحمض نحو نصف ساعة قبل أن يعيد اللعاب التوازن. من يأكل الحلوى مرة ثم ينظف أعطى أسنانه ساعات للإصلاح؛ ومن يرشف مشروباً محلّى طول اليوم أبقى الحمض يعمل طول اليوم. والأخطر السكر بعد تنظيف الليل: في النوم يقل اللعاب فيقل الإصلاح. لذلك: مرتان في اليوم بمعجون فلورايد، والحلوى مع الوجبة لا بينها."},{"id":"E6","level":"B","atlas":{"layers":["digestive"],"highlight":["teeth"],"zoom":"mouth"},"text":"وأسنانك{|ِ} الآن ليست أسنانك{|ِ} النهائية. الطفل له 20 سناً لبنية تبدأ في السقوط نحو السادسة، وتحتها في عظم الفك تنمو 32 سناً دائمة تكتمل بعد سنوات. فهل اللبنية لا تهم لأنها ستسقط؟ تهم: بها تمضغ{|ين} وتنطق{|ين} سنوات، وهي تحفظ المكان للدائمة؛ وتسوسها يؤلم وقد يصل إلى السن الدائمة النامية تحتها. سن اليوم تحرس سن الغد."}],"practice":[{"id":"U06.L01.P1","objective":"U06.L01.O1","type":"choose_reason","prompt":"أي الأسنان تطحن الطعام؟","options":["القواطع الأمامية المسطحة","الأنياب المدببة","الأضراس الخلفية العريضة","كلها بالتساوي"],"answer":2,"explanation":"الأضراس الخلفية عريضة كالرحى، فتطحن الطعام؛ أما القواطع فتقطع والأنياب تمزّق.","level":"A","feedback_wrong":"أي شكل يشبه الرحى؟","feedback_by_option":{"0":"القواطع مسطحة حادة تقطع.","1":"الأنياب مدببة تمزّق.","3":"لكل نوع عمل: القواطع تقطع، والأنياب تمزّق، والأضراس تطحن."}},{"id":"U06.L01.P2","objective":"U06.L01.O2","type":"choose_reason","prompt":"لماذا صار الخبز حلواً بعد دقيقتين من المضغ؟","options":["لأن مادة في اللعاب بدأت تحويل النشا إلى سكر","لأن الأسنان أخرجت سكراً مخبوءاً","لأن اللسان يصنع سكراً","لم يصر حلواً؛ هذا وهم"],"answer":0,"explanation":"اللعاب فيه مادة تبدأ تحويل النشا في الخبز إلى سكر، فيصير الخبز حلواً إذا طال مضغه.","level":"A","feedback_wrong":"ما الذي أُضيف إلى الخبز في فمك؟","feedback_by_option":{"1":"الأسنان تصغّر الخبز ولا تُخرج منه سكراً؛ الذي يغيّره مادة في اللعاب.","2":"اللسان يتذوق ويحرّك اللقمة، ولا يصنع سكراً.","3":"جرّب{|ي} بنفسك{|ِ}: امضغ{|ي} قطعة خبز دقيقتين، وستلاحظ{|ين} الحلاوة."}},{"id":"U06.L01.P3","objective":"U06.L01.O3","type":"sequence","prompt":"رتّب{|ي} خطوات البلع.","options":["اللسان يدفع اللقمة إلى الخلف","الحلق يرتفع ولسان المزمار يغلق القصبة","اللقمة تنزلق إلى المريء","الغطاء ينفتح ويعود التنفس"],"answer":[0,1,2,3],"explanation":"يدفع اللسان اللقمة إلى الخلف، فيرتفع الحلق ويغلق لسان المزمار القصبة، فتنزلق اللقمة في المريء، ثم ينفتح الغطاء ويعود التنفس.","level":"A","feedback_wrong":"ما الذي يجب أن يُغلق قبل أن تمرّ اللقمة؟"},{"id":"U06.L01.P4","objective":"U06.L01.O4","type":"sequence","prompt":"رتّب{|ي} سلسلة التسوس.","options":["سكر يبقى على السن","بكتيريا الطبقة اللزجة تأكله","تصنع حمضاً","الحمض يذيب معادن المينا"],"answer":[0,1,2,3],"explanation":"السكر الباقي على السن تأكله بكتيريا الطبقة اللزجة، فتصنع حمضاً، والحمض يذيب معادن المينا.","level":"A","feedback_wrong":"من يصنع الحمض؟"},{"id":"U06.L01.P5","objective":"U06.L01.O5","type":"predict","prompt":"طفلان: الأول أكل قطعة حلوى كبيرة بعد الغداء ثم نظّف أسنانه؛ الثاني رشف عصيراً محلّى طول اليوم. أسنان من في خطر أكبر؟","options":["الأول؛ لأن الكمية أكبر والسكر أكثر","الثاني؛ لأن الحمض عمل طول اليوم بلا راحة","متساويان؛ السكر نفسه في الحالتين تقريباً"],"answer":1,"explanation":"كل رشفة محلّاة تُطعم البكتيريا فتصنع حمضاً من جديد، فلا يجد اللعاب وقتاً ليصلح المينا بين الرشفات.","level":"B","feedback_wrong":"متى يعمل اللعاب على الإصلاح؟","feedback_by_option":{"0":"الحلوى مرة واحدة يعقبها وقت للإصلاح، وقد نظّف أسنانه بعدها.","2":"ليسا متساويين: المهم عدد مرات هجوم الحمض، لا كمية السكر وحدها."}}],"check":[{"id":"U06.L01.C1","objective":"U06.L01.O1","type":"explain_open","prompt":"لماذا للأسنان أربعة أشكال؟ اذكر{|ي} كل شكل وعمله.","answer":"قواطع مسطحة تقطع، أنياب مدببة تمزق، ضواحك برأسين تهرس، أضراس عريضة تطحن؛ كل عمل يحتاج أداة.","level":"A","rubric":"R1"},{"id":"U06.L01.C2","objective":"U06.L01.O2","type":"true_false_why","prompt":"«الهضم يبدأ في الفم لا في المعدة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ المضغ يصغّر الطعام، واللعاب يبلّله ويبدأ تحويل النشا إلى سكر.","level":"A","rubric":"R1"},{"id":"U06.L01.C3","objective":"U06.L01.O3","type":"choose_reason","prompt":"لماذا نشرق حين نضحك ونحن نأكل؟","options":["لأن الضحك يصنع لعاباً كثيراً فنغص به","لأن المعدة تمتلئ هواءً فترد الطعام","لأن لسان المزمار قد يتأخر فتدخل قطعة طريق الهواء","لأن الأسنان تتوقف عن المضغ فنبلع قطعاً كبيرة دفعة واحدة"],"answer":2,"explanation":"لسان المزمار يغلق القصبة حين نبلع؛ والضحك أثناء الأكل قد يؤخره فتدخل قطعة طريق الهواء.","level":"A","feedback_by_option":{"0":"الضحك لا يصنع لعاباً كثيراً فجأة؛ المشكلة في طريق الهواء.","1":"المعدة لا علاقة لها بالشرقة؛ الشرقة حين يدخل شيء طريق الهواء.","3":"المضغ مهم، لكن الشرقة تحدث حين يتأخر غطاء طريق الهواء."}},{"id":"U06.L01.C4","objective":"U06.L01.O4","type":"fix_model","prompt":"رسم زميل{ك|تكِ}: «السكر يحفر السن». أصلح{|ي} الرسم بالكلمات.","answer":"السكر غذاء للبكتيريا؛ البكتيريا تصنع الحمض؛ الحمض يذيب المينا؛ واللعاب والفلورايد يعيدان المعادن.","level":"A","rubric":"R1"},{"id":"U06.L01.C5","objective":"U06.L01.O4","type":"explain_open","prompt":"اذكر{|ي} حمايتين لأسنانك{|ِ} ولماذا تعمل كل منهما.","answer":"التنظيف مرتين بمعجون فلورايد (يزيل البكتيريا ويعيد المعادن)، وتقليل السكر بين الوجبات (وقت للإصلاح)، والفحص الدوري.","level":"A","rubric":"R1"},{"id":"U06.L01.C6","objective":"U06.L01.O5","type":"true_false_why","prompt":"«حلوى بعد تنظيف الليل لا تضر لأنها قطعة واحدة». صح أم خطأ؟","answer":"خطأ؛ في النوم يقل اللعاب فيضعف الإصلاح، فالحمض يعمل طويلاً بلا مقاومة.","level":"B","rubric":"R1"},{"id":"U06.L01.C7","objective":"U06.L01.O6","type":"choose_reason","prompt":"لماذا تهم الأسنان اللبنية مع أنها تسقط؟","options":["لا تهم كثيراً لأنها ستسقط وتأتي مكانها أسنان جديدة","لأنها أقوى من الدائمة وأصلب منها فتحمي اللثة والفك","لأنها لا تتسوس مهما أكلنا من حلوى","تمضغ وتنطق سنوات، وتحفظ مكان الدائمة، وتسوسها يضرها"],"answer":3,"explanation":"الأسنان اللبنية نمضغ بها وننطق سنوات، وتحفظ مكان الأسنان الدائمة، وتسوّسها يؤلم ويضر.","level":"B","feedback_by_option":{"0":"تبقى سنوات نمضغ بها وننطق، وتحفظ مكان الدائمة.","1":"اللبنية ليست أقوى؛ مينتها أرقّ، فتتسوس أسرع.","2":"الأسنان اللبنية تتسوس، وأسرع من الدائمة لأن مينتها أرقّ."}}],"concepts":[{"id":"digestion","term":{"ar":"الهضم","en":"Digestion","zh":"消化","pinyin":"xiāohuà","match":["الهضم","هضم","يهضم","تهضم"]},"priority":"core","atlas":{"layer":"digestive","element":"mouth"},"card":{"A":"تكسير الطعام إلى قطع أصغر فأصغر حتى تصير صغيرة بما يكفي لتدخل الدم. يبدأ في الفم لا في المعدة.","B":"تكسير بالأسنان والعضلات (ميكانيكي) وتكسير بالعصارات (كيميائي) معاً."}},{"id":"saliva","term":{"ar":"اللعاب","en":"Saliva","zh":"唾液","pinyin":"tuòyè","match":["اللعاب","لعاب"]},"priority":"core","atlas":{"layer":"digestive","element":"mouth"},"card":{"A":"سائل يصنعه الفم ليبلّل الطعام فيسهل بلعه، وفيه مادة تبدأ تحويل النشا إلى سكر، وفيه معادن تصلح الأسنان.","B":"المادة التي تكسّر النشا اسمها الأميليز؛ ويقل اللعاب في النوم."}},{"id":"enamel","term":{"ar":"المينا","en":"Enamel","zh":"牙釉质","pinyin":"yáyòuzhì","match":["المينا","مينا"]},"priority":"core","atlas":{"layer":"digestive","element":"tooth"},"card":{"A":"الطبقة الخارجية الصلبة للسن؛ أصلب شيء في جسمك{|ِ}، لكن الحمض يذيب معادنها.","B":"تفقد المعادن مع الحمض وتستعيدها من اللعاب والفلورايد إن أُعطيت وقتاً."}},{"id":"epiglottis","term":{"ar":"لسان المزمار","en":"Epiglottis","zh":"会厌","pinyin":"huìyàn","match":["لسان المزمار"]},"priority":"supporting","atlas":{"layer":"respiratory","element":"larynx"},"card":{"A":"غطاء صغير في أعلى الحلق يغلق طريق الهواء لحظة البلع حتى لا تدخل اللقمة القصبة.","B":"حين نضحك أو نتكلم ونبلع في اللحظة نفسها قد يتأخر الغطاء فنشرق: السعال يُخرج ما دخل خطأً."}}],"experiment":{"title":"الخبز الحلو وقشر البيض في الخل","materials":["قطعة خبز بلا سكر","مرآة صغيرة","بيضة مسلوقة بقشرها (أو قشر بيض نظيف) وكوب خل وكوب ماء","ساعة"],"steps":["خذ{|ي} قطعة خبز صغيرة {وامضغها|وامضغيها} دقيقتين كاملتين بلا بلع. ماذا حدث للطعم؟ سجّل{|ي}.","أمام المرآة: عدّ{|ي} أسنانك{|ِ} وابحث{|ي} عن الأشكال الأربعة: المسطحة الأمامية (قواطع)، المدببة (أنياب)، ثم ذات الرأسين بعدها (ضواحك)، والعريضة الخلفية (أضراس). إن لم تجد{|ي} الضواحك كلها فلا بأس: هي تظهر بين العاشرة والثانية عشرة. كم من كل نوع؟","اقضم{|ي} تفاحة بالقواطع فقط ثم حاول{|ي} طحنها بالقواطع فقط — ثم بالأضراس. أيهما أسهل لكل عمل؟","(بإشراف) ضع{|ي} قشر بيض في كوب خل وقشراً آخر في كوب ماء، واتركهما ليوم. الخل حمض ضعيف. ماذا تتوقع{|ين}؟","في اليوم التالي: المس{|ي} القشرين. أيهما صار ليّناً؟ ولماذا يشبه هذا ما يفعله حمض البكتيريا بالسن؟","ابلع{|ي} رشفة ماء وأنت{|ِ} تضع{|ين} أصابعك{|ِ} على حلقك{|ِ} بلطف: هل أحسست{|ِ} بشيء يرتفع لحظة البلع؟ ذلك الحنجرة ترتفع ليغلق الغطاء."],"safety":["قشر البيض والخل بإشراف بالغ وغسل اليدين بعدهما؛ لا يُشرب الخل.","لا تُدخل المرآة أو الأصابع عميقاً في الفم.","من لديه حساسية من الخبز أو البيض يراقب زميلاً.","من عنده سنّ تتخلخل لا يقضم بها التفاحة؛ يقضم بالجهة الأخرى أو يشاهد."],"expected":"الخبز يصير حلواً قليلاً بعد دقيقتين؛ القشر في الخل يلين ويفقد صلابته والذي في الماء لا يتغير؛ الحنجرة ترتفع لحظة البلع.","explain":"الحلاوة لأن مادة في لعابك{|ِ} بدأت تحويل نشا الخبز إلى سكر — هذا أول الهضم، وقد حدث في فمك{|ِ} قبل أي معدة. وقشر البيض من مادة تشبه معادن السن: الحمض أذابها فلان القشر؛ هذا ما تفعله أحماض البكتيريا بالمينا حين نتركها، لكن فرق واحد مهم: في فمك{|ِ} لعاب وفلورايد يعيدان المعادن إن أعطيتهما وقتاً، والقشر في الكوب لا أحد يصلحه.","record":"الطعم بعد دقيقتين، وعدد الأسنان من كل نوع، وحالة القشرين، وما أحسست{|ِ} به عند البلع.","alternatives":["بلا خل: صور مقارنة لقشر بيض قبل وبعد.","بلا خبز: بسكويت سادة أو أرز مطبوخ."]},"find_the_error":[{"id":"FE1","atlas_variant":"sugar_drills","error":"سهم من مكعب سكر يحفر السن مباشرة","answer":"البكتيريا تصنع الحمض من السكر؛ الحمض يذيب","detects":"M52"},{"id":"FE2","atlas_variant":"one_tube","error":"طريق واحد من الفم إلى الرئة والمعدة معاً بلا غطاء","answer":"لسان المزمار يغلق القصبة لحظة البلع","detects":"M03"},{"id":"FE3","atlas_variant":"stomach_first","error":"«الهضم يبدأ هنا» مكتوبة على المعدة","answer":"يبدأ في الفم بالأسنان واللعاب","detects":"M51"}],"numbers":[{"text":"20 سناً لبنية ثم 32 دائمة؛ وتصنع{|ين} في اليوم نحو لتر من اللعاب {تبلعه|تبلعينه} بلا أن تشعر{|ي}.","source":["S3","S4"]},{"text":"المينا أصلب من العظم، ومع ذلك يذيبها حمض البكتيريا إن تكرر كل ساعة.","source":["S2"]}],"true_size":[{"text":"مرّر{|ي} لسانك{|ِ} على أسنانك{|ِ} الآن: إن أحسست{|ِ} بسطح ناعم فاللعاب يعمل؛ وإن أحسست{|ِ} بخشونة لزجة فتلك الطبقة التي تحب البكتيريا.","source":["S2"]}],"animal":{"text":"البقرة تعيد بعض الطعام من معدتها لتمضغه مرة أخرى. والطيور بلا أسنان؛ لدى بعضها قانصة عضلية تطحن الطعام وقد تحتوي حصى تساعد على الطحن. القانصة ليست الحوصلة؛ الحوصلة تخزن الطعام قبل وصوله إلى المعدة.","source":["S6"]},"organ_letter":{"from":"ضرس في الخلف","text":"أنا الرحى. القواطع تقطع والأنياب تمزق، وأنا أطحن حتى تصير اللقمة عجينة يسهل بلعها. أعمل منذ سنوات وسأعمل عشرات السنين بعد — إن {تركتني|تركتِني} نظيفاً. كل ليلة تنامين{|ِ} وقد بقي عليّ سكر، تعمل البكتيريا على سطحي وحدها بلا لعاب يصلح. {فرّشني|فرّشيني} مرتين، ولا تنسَ{|ي} ظهري الذي لا {تراه|ترينه} في المرآة. مع التحية، ضرس يريد أن يبقى معك{|ِ}."},"history":[{"who":"الزهراوي — أبو القاسم خلف بن عباس","origin":"الأندلس","where_when":"قرطبة، نحو 936–1013","did":"وصف في كتابه «التصريف» كشط القشور الخشنة المتراكمة على الأسنان (الجير) بأدوات مختلفة للوجه الداخلي والخارجي وما بين الأسنان، ورسم أدواته؛ وأوصى بعلاج السن قبل قلعها، وبالتأكد من السن المؤلمة قبل القلع.","did_not":"لم يعرف دور الميكروبات ولا الحمض الذي تصنعه في تسوّس الأسنان؛ فهذا التفسير عُرف بعد قرون.","method_lesson":"الملاحظة الدقيقة ورسم الأدوات ينقل الخبرة عبر القرون حتى قبل معرفة السبب.","source":["S7","S8"]}],"how_we_know":{"text":"كيف عرفنا أن اللعاب «يهضم»؟ لا بالعين — بل بالتجربة البسيطة التي {ستفعلها|ستفعلينها}: خبز ممضوغ طويلاً يصير حلواً. في القرن التاسع عشر خلط العلماء لعاباً بنشا في أنبوب، فتحوّل النشا إلى سكر بلا فم ولا أسنان؛ إذن في اللعاب نفسه شيء يعمل. ثم عزلوا تلك «المادة العاملة» وسمّوها إنزيماً. القاعدة: إن أردت{|ِ} أن تعرف{|ي} من يعمل، افصل{|ي} الأشياء واختبر{|ي} كلاً وحده.","limit_question":"ما الذي لا يُظهره رسم السن المقطوعة عن حجم البكتيريا الحقيقي؟"},"what_changed":["ظُن أن الهضم يبدأ في المعدة؛ الصواب أنه يبدأ في الفم.","ظُن أن السكر «يأكل» السن مباشرة؛ الصواب أن البكتيريا تصنع الحمض من السكر."],"model_limits":["رسم السن المقطوع يُظهر الطبقات مكبَّرة؛ لا تُرى بالعين.","البكتيريا في الرسم كرات ملوّنة؛ الحقيقة أصغر من رسمها نحو عشرة آلاف مرة في الطول، ولا لون لها.","سهم اللعاب على النشا تبسيط: التحول يبدأ فقط في الفم ويكتمل في الأمعاء.","(صورة title-boy) تكبير الأسنان رمزي؛ لا يمثل عدد الأسنان الحقيقي في فم الطفل أو نسب أحجام الطبقات. غلاف الولد يعرض ثلاثة نماذج أسنان بدل سن واحدة.","(صورة title-girl) تكبير الأسنان رمزي؛ لا يمثل عدد الأسنان الحقيقي في فم الطفل أو نسب أحجام الطبقات. غلاف الولد يعرض ثلاثة نماذج أسنان بدل سن واحدة.","(صورة E1) عرض الفك مفرود تخطيطيًا لتوضيح الأنواع والعد؛ يُمثل ٢٠ سنًا لبنيًا إجمالًا، وليس طقم طفل بعمر محدد أثناء تبدل الأسنان.","(صورة E2) الأزواج البعيدة ممثلة بخط متقطع خلف القريبة؛ مواضع القنوات وإسقاطها مبسطة، واللعاب رمزه قطرة شفافة فاتحة.","(صورة E3) فُصلت القصبة الأمامية والمريء الخلفي وفتحتاهما بصريًا؛ حماية مجرى الهواء أثناء البلع تشمل أيضًا إغلاق الحنجرة، وليست وظيفة لسان المزمار وحده. صورة ثابتة وليست محاكاة لتوقيت الحركة.","(صورة E4) نزع المعادن وإعادتها رمزان متوازنان؛ إعادة المعادن تخص الأذى المبكر بالمينا ولا تعيد بناء حفرة متشكلة. لم تُصوّر البكتيريا بوجوه.","(صورة E5) المقارنة تخص تكرار التعرض للسكر؛ أحجام المشروبات المعروضة لا تمثل كميات متساوية مضبوطة. الساعة تمثل التكرار بلا توقيت علاجي.","(صورة E6) قطاع جزئي من الفك وليس تعدادًا كاملًا. الأسنان الدائمة هنا تحت اللبنية في الفك السفلي؛ لا ينطبق اتجاه تحت على الفك العلوي. امتصاص جذور اللبنية مبسط وغير مفصل.","(صورة exp) الخل قد يبدو ذهبيًا مع إضاءة المطبخ؛ لون الصورة ليس مؤشرًا لتركيز الحمض. قشر البيض نموذج معدني وليس مينا أسنان حقيقية. التجربة بإشراف بالغ ولا يُشرب سائلها.","(صورة letter) الوجه تشخيص قصصي مسموح في رسالة العضو فقط؛ الأحجام والابتسامات ليست تشريحًا حقيقيًا.","(صورة hist1) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة life) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات."],"faith":{"opening":{"text":"فَلْيَنظُرِ ٱلْإِنسَـٰنُ إِلَىٰ طَعَامِهِۦٓ","reference":"عبس 24","grade":"قرآن","usage":"تفكر","reflection":"الآية تدعو الإنسان أن ينظر إلى طعامه: من أين جاء، وكيف أُنبت له (والآيات بعدها تذكر الماء والحب والعنب). واليوم ننظر إلى الطعام من جهة أخرى: ماذا يحدث له حين يدخل فمك{|ِ}. نظرتان إلى نعمة واحدة.","reviewed":false,"quran_key":"80:24","hl_words":[0,3],"highlight":"فلينظر الإنسان إلى طعامه","cards":[]},"closing":null},"life":[{"situation":"أنا متعب في الليل ولا أريد تنظيف أسناني.","science":"في النوم يقل اللعاب فيضعف إصلاح الأسنان؛ ما يبقى من سكر يعمل عليه الحمض ساعات بلا مقاومة.","action":"أنظف دقيقتين قبل النوم ولو كنت متعباً، ولا آكل بعدها.","value":"الجسد أمانة؛ دقيقتان تحفظان سناً تعمل عشرات السنين.","why":"لماذا الليل بالذات؟ لأن الحارس (اللعاب) ينام مع نومي، فأترك أسناني بلا حماية حتى الصباح. والنبي ﷺ علّمنا أن للجسد على صاحبه حقاً.","reference":"البخاري 1975","hadith":["bukhari:1975"],"cards":[{"key":"bukhari:1975","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","narration":true,"source":"البخاري 1975","grade":"صحيح","grader":""}],"verses":[]},{"situation":"أخي يضحك ويمزح والطعام في فمه.","science":"الضحك يفتح طريق الهواء والبلع يغلقه؛ معاً قد تدخل قطعة في القصبة فيشرق.","action":"لا أضحكه وهو يبلع، وإن شرق تركته يسعل ولم أضربه على ظهره بقوة؛ وإن لم يستطع السعال ولا الكلام ناديت بالغاً فوراً.","value":"الأدب عند الطعام حماية لا تكلفاً.","why":"لماذا كان من أدب الطعام ألّا نتكلم والفم ملآن؟ لأن الحلق مفترق طريقين وغطاء واحد؛ والأدب هنا يحمي الحياة. وعلّم النبي ﷺ غلاماً أن يسمّي الله، ويأكل بيمينه ومما يليه — أدب يهدئ المائدة فيُؤكل على مهل.","reference":"البخاري 5376؛ مسلم 2022","hadith":["bukhari:5376"],"cards":[{"key":"bukhari:5376","lead":"عن عمر بن أبي سلمة رضي الله عنه قال:","text":"كنت غلاماً في حَجر رسول الله ﷺ، وكانت يدي تطيش في الصَّحفة، فقال لي رسول الله ﷺ: «يا غلام، سمِّ الله، وكل بيمينك، وكل مما يليك». فما زالت تلك طِعمتي بعد","narration":true,"source":"البخاري 5376؛ مسلم 2022","grade":"صحيح (متفق عليه)","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يحب كثير من الأطفال الحلو ويكرهون المرّ، ولماذا تتغير أذواقنا ونحن نكبر؟","why_open":"يُعتقد أن المرّ إنذار من السموم والحلو إشارة طاقة، لكن سبب تغير الذوق مع العمر ما زال يُدرَس."}],"notebook":{"draw":"ارسم{|ي} فمك{|ِ} مفتوحاً من الأمام وسمِّ{|ي} أنواع الأسنان الأربعة وأشّر{|ي} إلى اللسان ومكان الغدد اللعابية. ثم ارسم{|ي} سناً واحدة مقطوعة: المينا، وطبقة لزجة عليها، وسهم حمض يأخذ وسهم لعاب يعيد. المستوى ب: {أضف|أضيفي} سناً دائمة تنمو تحت لبنية.","label":["قواطع","أنياب","ضواحك","أضراس","اللسان","الغدد اللعابية","المينا","— ب: الدائمة تحت اللبنية"],"write":"أشرح ما يحدث للقمة في فمي: ماذا تفعل الأسنان؟ وماذا يفعل اللعاب؟ ومن يغلق طريق الهواء عند البلع؟ ثم أكتب سلسلة التسوس من السكر حتى ذوبان المينا، وكيف أقطعها."},"imgs":["U06.L01-E1","U06.L01-E2","U06.L01-E3","U06.L01-E4","U06.L01-E5","U06.L01-E6","U06.L01-exp","U06.L01-hist1","U06.L01-letter","U06.L01-life","U06.L01-title-boy","U06.L01-title-girl"]};
