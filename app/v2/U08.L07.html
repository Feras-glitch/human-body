const LD = {"id":"U08.L07","first":false,"title":"الشاشات وجسمي","driving_question":"{اسم}، {جلست|جلستِ} ثلاث ساعات أمام الشاشة: ماذا حدث لعينيك{|ِ} وظهرك{|ِ} وعضلاتك{|ِ} ونومك{|ِ}؟ ولماذا يصعب أن {تتوقف|تتوقفي}؟","central_fact":"الجلوس الطويل أمام الشاشة يجمع على الجسم أشياء: العينان تحتاجان راحة ولعباً خارج البيت، والعضلات لا تعمل، والشاشة قبل النوم تؤخره؛ وكثير من التطبيقات مصمم ليطيل البقاء؛ ولذلك تنصح الإرشادات بتقليل شاشة الترفيه وكسر الجلوس بالحركة، وبخطة شاشات في البيت.","next":null,"nexts":[],"hook":{"text":"{اسم}، لماذا يصعب أن {تترك|تتركي} اللعبة حين يقول أهلك{|ِ} «يكفي»؟","options":["لأني ضعيف الإرادة","لأن اللعبة مصممة لتطيل بقائي","لأن اللعبة مفيدة دائماً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","muscles"],"highlight":["eye","leg_muscles"],"zoom":"body"},"text":"في هذه الوحدة {عرفت|عرفتِ} العين والنوم. فلنجمعها مع العضلات في ساعات أمام الشاشة. العين: في النظر القريب الطويل تتعب، فنتبع قاعدة 20-20-20: كل عشرين دقيقة ننظر عشرين ثانية إلى شيء بعيد نحو ستة أمتار، ونرمش، ونبعد الشاشة مسافة ذراع، كما {عرفت|عرفتِ} في درس العين. والعضلات: في الجلوس الطويل لا تعمل، وهي تقوى بالاستعمال كما {عرفت|عرفتِ} في درس العضلات. والنوم: الشاشة قبله تجعلنا أكثر يقظة، وضوؤها قد يؤخر هرمون النوم، كما {عرفت|عرفتِ} في درس النوم."},{"id":"E2","level":"A","atlas":{"layers":["muscles"],"highlight":["leg_muscles"],"zoom":"body"},"text":"الجلوس الطويل أن نقضي وقتاً طويلاً جالسين أو مستلقين ونحن مستيقظون بلا حركة تُذكر. وهو غير الراحة والنوم اللذين يحتاجهما الجسم. وشاشة الترفيه هي الوقت الذي نقضيه أمام الشاشة للتسلية، غير وقت الدراسة. وتوصي منظمة الصحة العالمية من في عمرك{|ِ} بتقليل الجلوس، وخاصة شاشة الترفيه. وفي إرشادات كندا: ساعتان على الأكثر من شاشة الترفيه في اليوم، وألا يطول الجلوس دون حركة. فكل حين {قم|قومي} و{تحرك|تحركي} دقيقتين: {اقفز|اقفزي}، أو {امش|امشي}، أو {ساعد|ساعدي} في البيت."},{"id":"E3","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"brain"},"text":"لماذا يصعب أن نتوقف؟ ليس لأنك{|ِ} ضعيف{|ة}. كثير من التطبيقات والألعاب فيه التصميم الجاذب: حيل تجذب الانتباه وتطيل البقاء. التشغيل التلقائي يبدأ المقطع التالي قبل أن {تقرر|تقرري}، والتمرير بلا نهاية لا يصل إلى آخر، والمكافآت السريعة والنجوم تدعوك{|ِ} إلى مرة أخرى، والإعلانات وعروض الشراء تظهر فجأة. وتقول الأكاديمية الأمريكية لطب الأطفال إن هذه الحيل لم تُصنع لمصلحة الأطفال، وإنها قد تأخذ من النوم واللعب ووقت الأسرة. فإن {عرفت|عرفتِ} الحيلة سهل عليك{|ِ} أن {تغلبها|تغلبيها}."},{"id":"E4","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"وكيف نغلبها؟ بخطة الشاشات: اتفاق في البيت على أوقات الشاشات وأماكنها. مثلاً: لا شاشة مع الطعام، ولا شاشة قبل النوم بساعة، والهاتف خارج غرفة النوم ليلاً، وساعة حركة ولعب كل يوم، والدراسة أولاً. و{استعمل|استعملي} منبهاً يذكّرك{|ِ} بالتوقف، و{أطفئ|أطفئي} التشغيل التلقائي مع أهلك{|ِ}. والشاشة ليست شراً: فيها تعلم وتواصل مع من نحب؛ المطلوب التوازن."},{"id":"E5","level":"A","atlas":{"layers":["nervous"],"highlight":["eye"],"zoom":"eye"},"text":"وكيف عرف العلماء أن اللعب خارج البيت يحمي العين؟ في الصين قسم الطبيب مينغ غوانغ هي وفريقه اثنتي عشرة مدرسة: في ست منها أضافوا حصة لعب خارج الصف أربعين دقيقة كل يوم، وتركوا الست الأخرى كما هي، وتابعوا الأطفال ثلاث سنوات. فأصيب بقصر النظر أقل في مدارس اللعب خارج الصف: نحو 30 من كل مئة، مقابل نحو 40 من كل مئة في المدارس الأخرى."},{"id":"E6","level":"B","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"للمستوى ب: توصية منظمة الصحة العالمية بتقليل الجلوس توصية قوية، لكنها كتبت أن يقين الدليل عليها منخفض. ويقين الدليل: كم نحن متأكدون من النتيجة. فلماذا ينصح العلماء قبل أن يتأكدوا تماماً؟ لأن النفع محتمل، والضرر من الحركة قليل. وفي تجربة الصين قال الباحثون إن الأثر أقل مما توقعوا لكنه مهم، وقال طبيب آخر إن مدة بقائه غير مؤكدة. هكذا يتكلم العلم الأمين: بما يعرف، وبما لا يعرف بعد."}],"practice":[{"id":"U08.L07.P1","after":"E1","objective":"U08.L07.O1","type":"choose","prompt":"بعد عشرين دقيقة من النظر إلى الشاشة، ماذا {تفعل|تفعلين}؟","options":["أقترب من الشاشة أكثر","أنظر عشرين ثانية إلى شيء بعيد","أغمض عيني ساعة","أزيد سطوع الشاشة"],"answer":1,"explanation":"قاعدة 20-20-20: عشرون ثانية إلى شيء على بعد نحو ستة أمتار.","level":"A","feedback_wrong":"{تذكّر|تذكّري} قاعدة 20-20-20.","feedback_by_option":{"0":"الاقتراب يُتعب العين أكثر.","2":"لا نحتاج ساعة؛ عشرون ثانية تكفي.","3":"السطوع لا يريح العين."}},{"id":"U08.L07.P2","after":"E2","objective":"U08.L07.O2","type":"choose","prompt":"أي هذه يكسر الجلوس الطويل؟","options":["أغيّر اللعبة إلى لعبة أخرى","أقوم وأقفز دقيقتين","أستلقي على السرير بالهاتف","أشاهد مقطعاً أقصر"],"answer":1,"explanation":"الحركة تكسر الجلوس؛ تغيير اللعبة أو الاستلقاء يبقيان الجلوس.","level":"A","feedback_wrong":"ما الذي يحرّك العضلات؟","feedback_by_option":{"0":"ما زلت جالساً.","2":"الاستلقاء بالهاتف جلوس أيضاً.","3":"المقطع الأقصر ما زال جلوساً."},"detects":"M139"},{"id":"U08.L07.P3","after":"E3","objective":"U08.L07.O3","type":"choose","prompt":"أي هذه من حيل التصميم الجاذب؟","options":["زر إيقاف واضح","المقطع التالي يبدأ وحده","تذكير بأن الوقت انتهى","شاشة سوداء بعد ساعة"],"answer":1,"explanation":"التشغيل التلقائي يبدأ التالي قبل أن تقرر، فيطيل البقاء.","level":"A","feedback_wrong":"أي هذه يجعلك تبقى أطول؟","feedback_by_option":{"0":"زر الإيقاف يساعد على التوقف.","2":"التذكير يساعد على التوقف.","3":"هذا يساعد على التوقف."},"detects":"M140"},{"id":"U08.L07.P4","after":"E4","objective":"U08.L07.O4","type":"choose","prompt":"أي قاعدة تصلح لخطة الشاشات في البيت؟","options":["الهاتف في غرفة النوم طوال الليل","لا شاشة قبل النوم بساعة","الشاشة مع كل وجبة","لا وقت للحركة"],"answer":1,"explanation":"ترك الشاشة قبل النوم بساعة يساعد على النوم.","level":"A","feedback_wrong":"ماذا {تعلمت|تعلمتِ} عن النوم والشاشة؟","feedback_by_option":{"0":"الأحسن أن يبقى خارج الغرفة ليلاً.","2":"الطعام بلا شاشة أحسن.","3":"الحركة جزء من الخطة."},"detects":"M141"},{"id":"U08.L07.P5","after":"E5","objective":"U08.L07.O5","type":"sequence","prompt":"{رتّب|رتّبي} خطوات تجربة المدارس في الصين.","options":["اختيار اثنتي عشرة مدرسة","حصة لعب خارج الصف في ست منها","متابعة الأطفال ثلاث سنوات","مقارنة قصر النظر بين المجموعتين"],"answer":[0,1,2,3],"explanation":"الاختيار، ثم التغيير في نصفها، ثم المتابعة، ثم المقارنة.","level":"A","feedback_wrong":"ماذا يأتي قبل المقارنة؟"}],"check":[{"id":"U08.L07.C1","objective":"U08.L07.O1","type":"explain_open","prompt":"{اذكر|اذكري} ثلاثة أجزاء من الجسم تتأثر بساعات الشاشة الطويلة، وماذا يحدث لكل منها.","answer":"العين تتعب في النظر القريب الطويل؛ العضلات لا تعمل في الجلوس؛ النوم يتأخر إن كانت الشاشة قبله.","level":"A","rubric":"R1"},{"id":"U08.L07.C2","objective":"U08.L07.O2","type":"true_false_why","prompt":"«الجلوس ساعات أمام الشاشة راحة للجسم مثل النوم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النوم يحتاجه الجسم، أما الجلوس الطويل فتتوقف فيه العضلات وتتعب العين؛ نكسره بالحركة.","level":"A","rubric":"R1"},{"id":"U08.L07.C3","objective":"U08.L07.O3","type":"explain_open","prompt":"{اذكر|اذكري} حيلتين من حيل التصميم الجاذب، وكيف {تغلب|تغلبين} كلاً منهما.","answer":"التشغيل التلقائي: أطفئه مع أهلي؛ المكافآت السريعة: أضع منبهاً للتوقف قبل أن أبدأ.","level":"A","rubric":"R1"},{"id":"U08.L07.C4","objective":"U08.L07.O4","type":"explain_open","prompt":"{اكتب|اكتبي} ثلاث قواعد لخطة شاشات في بيتكم.","answer":"لا شاشة مع الطعام؛ لا شاشة قبل النوم بساعة والهاتف خارج الغرفة؛ ساعة حركة ولعب كل يوم.","level":"A","rubric":"R1"},{"id":"U08.L07.C5","objective":"U08.L07.O4","type":"true_false_why","prompt":"«الشاشة فيها نفع للتعلم والتواصل، والمطلوب التوازن». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الشاشة أداة، والمطلوب وقت لها ووقت للحركة واللعب ونوم كافٍ.","level":"A","rubric":"R1"},{"id":"U08.L07.C6","objective":"U08.L07.O5","type":"fix_model","prompt":"قال أيمن: «ما دام يقين الدليل منخفضاً فالتوصية بلا قيمة». {صحّح|صحّحي} له.","answer":"قد تكون التوصية قوية مع يقين منخفض إذا كان النفع محتملاً والضرر قليلاً، كالحركة بدل الجلوس؛ والعلماء يقولون ما يعرفون وما لا يعرفون بعد.","level":"B","rubric":"R1"}],"concepts":[{"id":"sedentary","term":{"ar":"الجلوس الطويل","en":"Sedentary behaviour","zh":"久坐行为","pinyin":"jiǔzuò xíngwéi","match":["الجلوس الطويل","جلوس طويل"]},"priority":"core","atlas":{"layer":"muscles","element":"leg_muscles"},"card":{"A":"أن نقضي وقتاً طويلاً جالسين أو مستلقين ونحن مستيقظون، بلا حركة تُذكر، كالجلوس أمام الشاشة.","B":"يختلف عن الراحة والنوم: النوم يحتاجه الجسم، أما الجلوس الطويل فيُستحسن أن يُكسر بالحركة."}},{"id":"recreational_screen","term":{"ar":"شاشة الترفيه","en":"Recreational screen time","zh":"娱乐屏幕时间","pinyin":"yúlè píngmù shíjiān","match":["شاشة الترفيه"]},"priority":"core","atlas":{"layer":"nervous","element":"eye"},"card":{"A":"الوقت الذي نقضيه أمام الشاشة للتسلية، كالألعاب والمقاطع، غير وقت الدراسة.","B":"التوصيات تتكلم عنه خاصة، لأن وقت الدراسة على الشاشة له شأن آخر."}},{"id":"persuasive_design","term":{"ar":"التصميم الجاذب","en":"Persuasive design","zh":"说服式设计","pinyin":"shuōfúshì shèjì","match":["التصميم الجاذب"]},"priority":"core","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"حيل في التطبيقات والألعاب تجذب الانتباه وتطيل البقاء: تشغيل تلقائي، وتمرير بلا نهاية، ومكافآت سريعة، وإعلانات تظهر.","B":"يعرفها المصممون جيداً، ولذلك يصعب التوقف على الكبار أيضاً."}},{"id":"media_plan","term":{"ar":"خطة الشاشات","en":"Family media plan","zh":"家庭媒体计划","pinyin":"jiātíng méitǐ jìhuà","match":["خطة الشاشات","خطة شاشات"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"اتفاق في البيت على أوقات الشاشات وأماكنها: لا شاشة مع الطعام ولا قبل النوم بساعة، ووقت للحركة واللعب.","B":"توصي بها الأكاديمية الأمريكية لطب الأطفال، وتضعها الأسرة معاً بما يناسبها."}},{"id":"evidence_certainty","term":{"ar":"يقين الدليل","en":"Certainty of evidence","zh":"证据确定性","pinyin":"zhèngjù quèdìngxìng","match":["يقين الدليل"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"كم نحن متأكدون من نتيجة دراسة: عالٍ إذا جاءت من تجارب كثيرة عادلة، ومنخفض إذا كانت قليلة أو غير عادلة.","B":"قد ينصح العلماء بشيء نصيحة قوية مع أن يقين الدليل منخفض، إذا كان النفع محتملاً والضرر قليلاً."}}],"experiment":{"title":"يومي في دوائر: الشاشة والحركة والنوم","materials":["ورقة عليها دائرة مقسومة إلى 24 جزءاً (ساعات اليوم)","أقلام ملونة","ساعة","دفتر الأطلس"],"steps":["{سجّل|سجّلي} يوماً عادياً: {لوّن|لوّني} ساعات النوم بالأزرق، والمدرسة بالأصفر، وشاشة الترفيه بالأحمر، والحركة واللعب بالأخضر.","{عُدّ|عُدّي} الساعات الحمراء والخضراء والزرقاء.","{قارن|قارني} بالتوصيات: شاشة الترفيه ساعتان على الأكثر، وحركة ساعة على الأقل، ونوم 9 إلى 11 ساعة.","{ارسم|ارسمي} دائرة ثانية ليوم {تريده|تريدينه}، وفيها راحة للعين كل عشرين دقيقة وحركة بين أوقات الجلوس.","مع أهلك{|ِ}: {اكتبوا|اكتبي} ثلاث قواعد لخطة شاشات البيت."],"safety":["التسجيل لليوم وحده لا للحكم على أحد؛ لا نقارن أيامنا بأيام غيرنا.","الحركة في مكان آمن.","لا اسم تطبيق ولا لعبة؛ نتكلم عن الأوقات لا عن المحتوى."],"expected":"كثير من الأيام فيها ساعات شاشة ترفيه أكثر من ساعات الحركة، وفي بعضها شاشة قريبة من وقت النوم.","explain":"الجلوس الطويل يُتعب العين ويوقف العضلات، والشاشة قبل النوم تؤخره؛ والخطة تعيد التوازن: راحة للعين، وحركة، ونوم كافٍ.","record":"نوم ___ ساعة — شاشة ترفيه ___ — حركة ___ — آخر شاشة قبل النوم بـ ___ — قواعدنا الثلاث: ___","alternatives":["من لا يريد تسجيل يومه: يحلل يوم طفل متخيَّل في المشهد.","المستوى ب: يحسب نسبة كل لون من اليوم بالمئة."]},"find_the_error":[{"id":"FE1","atlas_variant":"sitting_rest","error":"لوحة: الجلوس أمام الشاشة راحة","answer":"الراحة والنوم غير الجلوس الطويل؛ نكسره بالحركة","detects":"M139"},{"id":"FE2","atlas_variant":"screen_sleep","error":"جملة: الهاتف في السرير يساعدني أن أنام","answer":"الشاشة قبل النوم قد تؤخره؛ نتركها قبله بساعة","detects":"M141"},{"id":"FE3","atlas_variant":"weak_will","error":"تعليق: من لا يتوقف عن اللعب ضعيف","answer":"التطبيقات مصممة لتطيل البقاء؛ الخطة تساعد","detects":"M140"}],"numbers":[{"text":"عشرون دقيقة، عشرون ثانية، ستة أمتار: قاعدة راحة العين.","source":["S1"]},{"text":"ساعتان على الأكثر من شاشة الترفيه في اليوم في إرشادات كندا لمن في عمرك{|ِ}.","source":["S4"]}],"true_size":[{"text":"عشرون ثانية فقط كل عشرين دقيقة تكفي لتريح عينيك{|ِ} من النظر القريب.","source":["S1"]}],"animal":null,"organ_letter":{"from":"العينان","text":"مرحباً، نحن عيناك{|ِ}. نحب أن نرى معك{|ِ} كل شيء، حتى الشاشة. لكن حين {تنظر|تنظرين} إليها طويلاً قريباً، نتعب، ونرمش أقل. فكل عشرين دقيقة {انظر|انظري} بنا عشرين ثانية إلى شيء بعيد، و{اخرج|اخرجي} بنا إلى الضوء واللعب كل يوم؛ هذا يحمينا. وأصدقاؤنا العضلات تشتاق إلى الحركة، وصديقنا النوم يحب أن تُطفأ الشاشة قبله بساعة. وإن {وجدت|وجدتِ} صعوبة في التوقف، فليس العيب فيك{|ِ}: التطبيقات مصممة لتطيل بقاءك{|ِ}. {ضع|ضعي} خطة مع أهلك{|ِ}، ونحن معك{|ِ}."},"history":[{"who":"مينغ غوانغ هي وفريقه","origin":"الصين","where_when":"غوانغجو، 2010–2013؛ نُشرت 2015","did":"قسموا اثنتي عشرة مدرسة إلى مجموعتين، وأضافوا حصة لعب خارج الصف أربعين دقيقة كل يوم في ست منها، وتابعوا الأطفال ثلاث سنوات، فقلّ قصر النظر في مدارس اللعب خارج الصف.","did_not":"لم يعرفوا بعدُ كم يبقى الأثر بعد انتهاء التجربة، ولم تكن الدراسة عن الشاشات نفسها.","method_lesson":"أن نغيّر شيئاً واحداً في نصف المجموعات، ونقارن بالنصف الآخر، ونقول بأمانة إن الأثر أقل مما توقعنا.","source":["S7"]}],"how_we_know":{"text":"كيف عرف العلماء أن اللعب خارج البيت يحمي العين؟ في الصين قسم الطبيب مينغ غوانغ هي وفريقه اثنتي عشرة مدرسة: في ست منها أضافوا حصة لعب خارج الصف أربعين دقيقة كل يوم، وتركوا الست الأخرى كما هي، وتابعوا الأطفال ثلاث سنوات. فأصيب بقصر النظر أقل في مدارس اللعب خارج الصف. وقال الباحثون إن الأثر أقل مما توقعوا، لكنه مهم.","limit_question":"لماذا قال الباحثون إن مدة بقاء الأثر غير مؤكدة بعد؟"},"what_changed":["كان الناس يقولون إن الجلوس قريباً من التلفاز يتلف العين؛ واليوم نعرف أنه يُتعب العين ولا يتلفها، وأن الوقت خارج البيت هو ما يحمي.","كانت النصيحة قديماً عن التلفاز وحده؛ واليوم عن الهواتف والألواح والألعاب، وعن التصميم الذي يطيل البقاء."],"model_limits":["جدول اليوم في الدرس نموذج؛ أيام المدرسة والعطلة تختلف، والخطة تضعها كل أسرة بما يناسبها.","الساعتان في إرشادات كندا توصية لا حدّ سحري؛ ما نفعله على الشاشة يهم أيضاً."],"faith":{"opening":{"text":"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۚ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَـٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًۭا","reference":"الإسراء 36","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} أن الأذن والعين والقلب أمانات يُسأل عنها الإنسان. واليوم نتكلم عن ساعات العين أمام الشاشة، وعما ندخله إلى أعيننا وقلوبنا. والآية لا تذكر الشاشات، والعلم لا يشرح الآية؛ لكنها تعلّمنا أن أعيننا أمانة نُسأل عما ننظر به إليه. كيف {تحفظ|تحفظين} عينيك{|ِ} هذا الأسبوع؟","reviewed":false,"quran_key":"17:36","hl_words":[7,15],"highlight":"إن السمع والبصر والفؤاد كل أولئك كان عنه مسئولا","level":"ترغيب","concept":"السمع والبصر والقلب أمانة نُسأل عنها.","avoid":"لا نقول إن الآية تحرّم الشاشات أو تحدد ساعاتها، ولا نجعل العلم دليلاً عليها.","cards":[]},"closing":{"text":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير، احرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن «لو» تفتح عمل الشيطان","reference":"مسلم 2664","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن الشاشة فيها نفع، وأن طول الجلوس أمامها يُتعب العين والجسم والنوم. والحديث في البطاقة يقول: احرص على ما ينفعك، واستعن بالله ولا تعجز. والحديث لا يتكلم عن الشاشات؛ لكنه يعلّمنا أن نختار النافع ونستعين بالله ولا نستسلم حين يصعب التوقف. ما الذي {ستحرص|ستحرصين} عليه بدل ساعة من الشاشة؟","reviewed":false,"hadith_key":"muslim:2664","highlight":"احرص على ما ينفعك واستعن بالله ولا تعجز","level":"ترغيب","concept":"نحرص على النافع ونستعين بالله ولا نعجز.","avoid":"لا نجعل الحديث حكماً على الشاشات، ولا نلوم الطفل الذي يصعب عليه التوقف.","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2664","grader":"","cards":[]}},"life":[{"situation":"كل ليلة آخذ الهاتف إلى السرير، وأنام متأخراً، وأستيقظ متعباً للمدرسة.","science":"الشاشة قبل النوم ترفع اليقظة، وضوؤها قد يعطّل هرمون النوم؛ ومن في عمري يحتاج 9 إلى 11 ساعة نوم.","action":"أضع الهاتف خارج الغرفة قبل النوم بساعة، وأقرأ كتاباً ورقياً أو أتحدث مع أهلي.","value":"حفظ نعمة النوم.","why":"لماذا أترك الهاتف وأنا أحبه؟ لأن النوم راحة جعلها الله لنا، كما في الآية في البطاقة، ولا أريد أن تأخذها مني الشاشة.","reference":"النبأ 9","quran":["78:9"],"cards":[],"verses":["78:9"]},{"situation":"في العطلة أقضي اليوم كله تقريباً على الألعاب، ولا أخرج من البيت.","science":"الجلوس الطويل يوقف العضلات ويُتعب العين، واللعب خارج البيت يحمي العين؛ وتوصية كندا ساعتان على الأكثر من شاشة الترفيه.","action":"أضع مع أهلي خطة للعطلة: وقت للعب خارج البيت كل يوم، ووقت محدد للشاشة، وزيارة أقارب أو رياضة.","value":"الانتفاع بالصحة والفراغ.","why":"لماذا لا أقضي العطلة على الشاشة ما دامت عطلة؟ لأن الصحة والفراغ نعمتان يغفل عنهما كثير من الناس، كما في الحديث في البطاقة، والعطلة فراغ ثمين.","hadith":["bukhari:6412"],"cards":[{"key":"bukhari:6412","lead":"عن ابن عباس رضي الله عنهما قال: قال النبي ﷺ:","text":"نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ","narration":false,"source":"البخاري 6412","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"هل يختلف أثر الشاشة إن كانت للتعلم أو للعب أو للحديث مع الأهل؟","why_open":"أكثر الدراسات تقيس عدد الساعات لا نوع الاستعمال، والعلماء يدرسون ذلك اليوم."}],"notebook":{"draw":"{ارسم|ارسمي} دائرتين ليومين: يومك{|ِ} العادي، ويوماً متوازناً، و{لوّن|لوّني} النوم والمدرسة والشاشة والحركة. المستوى ب: {اكتب|اكتبي} بجانب كل توصية قوتها ويقين دليلها.","label":["الجلوس الطويل","شاشة الترفيه","قاعدة 20-20-20","التصميم الجاذب","خطة الشاشات","— ب: يقين الدليل"],"write":"أشرح: ماذا تفعل ساعات الشاشة بعيني وعضلاتي ونومي؟ ولماذا يصعب التوقف؟ وأكتب خطة شاشاتنا."},"imgs":[]};
