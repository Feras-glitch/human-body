<script>
const LD = {"id":"U09.T03","lesson":"U09.L03","first":false,"title":"اختبار: الدفاع: كيف يمنع جسمي الميكروبات؟","lessonTitle":"الدفاع: كيف يمنع جسمي الميكروبات؟","concepts":[],"check":[],"items":[{"id":"U09.L03.A1.a","objective":"U09.L03.O1","level":"A","type":"true_false_why","prompt":"«كل الميكروبات تمرضنا، ولذلك يجب قتلها كلها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أكثرها لا يمرضنا، وبعضها نافع كسكان الأمعاء يشغل المكان فلا يجد الضار موضعاً؛ وقليل منها يمرض.","rubric":"R1","detects":"M65","alt":{"prompt":"«على جلد الإنسان السليم ميكروبات تعيش عليه دائماً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الميكروبات تعيش على الجلد وفي الفم والأمعاء، وأكثرها لا يمرضنا."}},{"id":"U09.L03.A1.b","objective":"U09.L03.O1","level":"A","type":"choose","prompt":"الفيروس:","options":["أكبر من الخلية ويُرى بالعين","صغير جداً، يدخل خلايا الجسم ويستعملها ليصنع نسخاً منه","نوع من الخلايا البيضاء","دواء يقتل البكتيريا"],"answer":1,"explanation":"الفيروس أصغر من البكتيريا بكثير، ويتكاثر داخل خلايانا.","feedback_by_option":{"0":"أصغر من الخلية بكثير.","2":"الخلايا البيضاء تدافع عن الجسم.","3":"هذا وصف المضاد الحيوي."},"alt":{"prompt":"أيّ هذه من الأمراض التي تسببها الفيروسات؟","options":["الزكام","الكسر","التسوس","حرق الشمس"],"answer":0,"explanation":"الزكام والإنفلونزا من الفيروسات.","feedback_by_option":{"1":"الكسر إصابة في العظم.","2":"التسوس من بكتيريا تصنع حمضاً.","3":"حرق الشمس من الأشعة."}}},{"id":"U09.L03.A1.c","objective":"U09.L03.O1","level":"A","type":"choose_reason","prompt":"خرجت سارة في الريح بلا معطف، وبعد يومين أصابها الزكام. من أين جاء الزكام؟","options":["من البرد نفسه","من فيروس انتقل إليها من شخص مريض أو من شيء لمسه","من المعطف الذي لم تلبسه","من الماء البارد الذي شربته"],"answer":1,"explanation":"الزكام من فيروس ينتقل بالتماس أو بالأسطح أو بالرذاذ؛ البرد لا يصنع الفيروس.","feedback_by_option":{"0":"البرد قد يُتعب، لكنه لا يصنع الفيروس.","2":"المعطف يدفئ، والفيروس يأتي من مريض.","3":"الماء البارد لا يصنع الفيروس."},"detects":"M101","alt":{"prompt":"كيف ينتقل فيروس الزكام غالباً؟","options":["من يد المريض أو الأسطح إلى أنف شخص آخر وعينيه","من الشمس إلى الجلد","من الطعام الحار","من الكتب إذا قُرئت"],"answer":0,"explanation":"بالتماس، وبالأسطح التي يبقى عليها ساعات، وبالرذاذ.","feedback_by_option":{"1":"الشمس لا تنقل الفيروس.","2":"حرارة الطعام لا تصنع الزكام.","3":"القراءة لا تنقله؛ اللمس ثم لمس الوجه قد ينقله."}}},{"id":"U09.L03.A2.a","objective":"U09.L03.O2","level":"A","type":"choose","prompt":"ما عمل المخاط والأهداب في الأنف؟","options":["تحبس الميكروبات والغبار وتكنسها إلى الخارج","تصنع الأكسجين","تهضم الطعام","تصنع خلايا الدم"],"answer":0,"explanation":"المخاط اللزج يحبس، والأهداب تكنس.","feedback_by_option":{"1":"الأكسجين من الهواء.","2":"الهضم في الجهاز الهضمي.","3":"خلايا الدم في نخاع العظم."},"alt":{"prompt":"أيّ هذه حاجز يحمي العين؟","options":["الدموع","الأظفار","العرق","الشعر في الرأس"],"answer":0,"explanation":"الدموع تغسل العين.","feedback_by_option":{"1":"الأظفار تحمي أطراف الأصابع.","2":"العرق للتبريد.","3":"شعر الرأس لا يحمي العين."}}},{"id":"U09.L03.A2.b","objective":"U09.L03.O2","level":"A","type":"true_false_why","prompt":"«فرك العين بيد لم تُغسل قد يُدخل ميكروبات إلى الجسم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ اليد تحمل ميكروبات من الأسطح، والعين والأنف والفم أبواب تدخل منها.","rubric":"R1","alt":{"prompt":"«الجلد السليم يمنع أكثر الميكروبات من الدخول». صح أم خطأ؟ ولماذا؟","answer":"صح؛ سطحه المغلق حاجز، ولذلك ننظّف الجروح ونغطيها لأنها تفتح الطريق."}},{"id":"U09.L03.A2.c","objective":"U09.L03.O2","level":"A","type":"explain_open","prompt":"لماذا ننظّف الجرح ونغطيه، مع أن الجسم يدافع عن نفسه؟","answer":"لأن الجرح فتحة في الحاجز الأول؛ تنظيفه يزيل الميكروبات، وتغطيته تمنع دخول غيرها، فيقلّ ما يحتاج الجسم أن يقاومه.","rubric":"R1"},{"id":"U09.L03.A3.a","objective":"U09.L03.O3","level":"A","type":"choose_reason","prompt":"ما سبب الاحمرار والدفء حول الشظية؟","options":["دم أكثر يأتي بخلايا بيضاء تدافع","الجسم توقف عن العمل","الشظية تسخن وحدها","الجلد يموت كله حولها"],"answer":0,"explanation":"الالتهاب عمل الجسم: الأوعية تأتي بدم وخلايا بيضاء.","feedback_by_option":{"1":"بل يعمل؛ الالتهاب دفاع.","2":"الدفء من الدم الكثير.","3":"الجلد حي ويدافع."},"detects":"M103","alt":{"prompt":"الخلايا البيضاء التي تحيط بالميكروب فتبتلعه اسمها:","options":["البلعميات","الكريّات الحمراء","الصفائح","خلايا الجلد"],"answer":0,"explanation":"البلعميات تبتلع الميكروب وتهضمه.","feedback_by_option":{"1":"الحمراء تحمل الأكسجين.","2":"الصفائح تسدّ الجروح.","3":"خلايا الجلد تغطي."}}},{"id":"U09.L03.A3.b","objective":"U09.L03.O3","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} ما يحدث حين يدخل ميكروب لأول مرة.","options":["يعبر الميكروب الحاجز من جرح","يحمرّ المكان وتأتي البلعميات فتبتلع","يتعرّف دفاع متخصص على الميكروب بعينه","تُصنع أجسام مضادة تناسبه","يتذكره الجسم للمرة القادمة"],"answer":[0,1,2,3,4],"explanation":"حاجز يُعبر، فالتهاب وبلعميات، فدفاع متخصص، فأجسام مضادة، فذاكرة.","alt":{"prompt":"{رتّب|رتّبي} من الأسرع إلى الأبطأ في أول لقاء مع ميكروب.","options":["الحواجز (الجلد والمخاط)","الالتهاب والبلعميات (ساعات)","الأجسام المضادة المتخصصة (أيام)"],"answer":[0,1,2],"explanation":"الحواجز موجودة دائماً، ثم الالتهاب خلال ساعات، ثم الدفاع المتخصص في أيام."}},{"id":"U09.L03.A3.c","objective":"U09.L03.O3","level":"A","type":"explain_open","prompt":"لماذا نمرض بالزكام أياماً ثم نشفى؟","answer":"يحتاج الدفاع المتخصص أياماً ليتعرّف على الفيروس ويصنع الأجسام المضادة المناسبة، فإذا صنعها جعلت الفيروس غير ضار فنشفى.","rubric":"R1"},{"id":"U09.L03.A4.a","objective":"U09.L03.O4","level":"A","type":"choose","prompt":"متى يجب أن {تغسل|تغسلي} يديك{|ِ}؟","options":["قبل الطعام وبعد الحمام وبعد العطاس","مرة واحدة في الأسبوع","حين تبدوان متسختين فقط","بعد النوم فقط"],"answer":0,"explanation":"قبل الطعام، وبعد الحمام، وبعد العطاس وتنظيف الأنف، وبعد لمس الحيوانات والقمامة.","feedback_by_option":{"1":"أكثر بكثير.","2":"الميكروبات لا تُرى، فاليد النظيفة الشكل قد تحملها.","3":"هناك أوقات أهم كثيرة."},"alt":{"prompt":"كم ثانية نفرك اليدين بالصابون على الأقل؟","options":["ثانيتين","20 ثانية","ساعة كاملة","لا نفرك"],"answer":1,"explanation":"20 ثانية على الأقل، كأن تردد نشيداً قصيراً مرتين.","feedback_by_option":{"0":"قليل جداً.","2":"كثير بلا حاجة.","3":"الفرك يصل إلى الأماكن الخفية."}}},{"id":"U09.L03.A4.b","objective":"U09.L03.O4","level":"A","type":"choose_reason","prompt":"لماذا لا يكفي الماء وحده لغسل اليدين؟","options":["لأن الماء يصنع الميكروبات","لأن الميكروبات تلتصق بالدهن على اليد، والصابون يفكّه","لأن الماء البارد يؤذي الجلد","لأن الصابون يبرّد اليد"],"answer":1,"explanation":"الصابون يفكّ الدهن فيأخذه الماء ومعه ما التصق به.","feedback_by_option":{"0":"الماء لا يصنع الميكروبات.","2":"الماء البارد أو الدافئ كلاهما مناسب.","3":"ليس هذا سبب استعماله."},"detects":"M102","alt":{"prompt":"في تجربة الزيت والقرفة، أين بقي أكثر القرفة بعد الماء وحده؟","options":["بين الأصابع وتحت الأظفار","على المرفق","في الشعر","لم يبق شيء"],"answer":0,"explanation":"الأماكن الخفية تحتاج الفرك والصابون.","feedback_by_option":{"1":"لم نضعها على المرفق.","2":"لم نضعها على الشعر.","3":"الماء وحده لا يزيل الزيت."}}},{"id":"U09.L03.A4.c","objective":"U09.L03.O4","level":"A","type":"true_false_why","prompt":"«المضاد الحيوي يشفي الزكام». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الزكام من فيروس، والمضاد الحيوي يعمل على بعض البكتيريا لا على الفيروسات، ولا يحسّن حال المصاب بالزكام.","rubric":"R1","detects":"M67","alt":{"prompt":"«المضاد الحيوي يؤخذ كما وصفه الطبيب، ولا نأخذ مضاد غيرنا». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الطبيب يختار ما يناسب المرض والطفل وكميته، ودواء غيرنا قد لا يناسبنا وقد يؤذينا."}},{"id":"U09.L03.A5.a","objective":"U09.L03.O5","level":"B","type":"choose","prompt":"الخلايا التي تصير خلايا تصنع الأجسام المضادة:","options":["الخلايا البائية","الكريّات الحمراء","خلايا الجلد","الخلايا العصبية"],"answer":0,"explanation":"تنشّطها الخلايا التائية المساعدة فتصنع الأجسام المضادة.","feedback_by_option":{"1":"الحمراء تحمل الأكسجين.","2":"خلايا الجلد تغطي.","3":"العصبية تنقل الرسائل."},"alt":{"prompt":"من أعمال الخلايا التائية:","options":["القضاء على خلايا دخلها فيروس","حمل الأكسجين","صنع العرق","هضم النشا"],"answer":0,"explanation":"وتنشّط غيرها وتبقى خلايا ذاكرة.","feedback_by_option":{"1":"هذا عمل الكريّات الحمراء.","2":"غدد العرق تصنعه.","3":"اللعاب والعصارات تهضم النشا."}}},{"id":"U09.L03.A5.b","objective":"U09.L03.O5","level":"B","type":"true_false_why","prompt":"«الدفاع المتخصص أسرع من الالتهاب في أول لقاء مع الميكروب». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الالتهاب يبدأ خلال ساعات، والدفاع المتخصص يحتاج أياماً أول مرة، لكنه أدق ويتذكر.","rubric":"R1","alt":{"prompt":"«خلايا الذاكرة تجعل الجسم يردّ أسرع على ميكروب لقيه من قبل». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تتذكره فيصنع الجسم ما يناسبه فوراً."}},{"id":"U09.L03.A5.c","objective":"U09.L03.O5","level":"B","type":"explain_open","prompt":"لماذا يُشبَّه الجسم المضاد بالمفتاح؟ وما حدود هذا التشبيه؟","answer":"لأنه يناسب جزءاً من ميكروب بعينه كما يناسب المفتاح قفله؛ لكنه لا يفتح شيئاً، بل يلتصق بالميكروب فيجعله غير ضار ويساعد الخلايا الأخرى عليه.","rubric":"R1"}],"transfer":[{"id":"U09.L03.T1","objective":"U09.L03.O4","type":"explain_open","prompt":"في صفّك{|ِ} انتشر الزكام: ثلاثة أطفال يعطسون. {اقترح|اقترحي} ثلاثة أشياء يفعلها الصف ليقلّ الانتشار، و{فسّر|فسّري} كل واحد.","answer":"غسل الأيدي بالصابون 20 ثانية قبل الأكل وبعد العطاس (يزيل الفيروس من اليد)؛ العطاس في المنديل أو المرفق (يمنع الرذاذ واليد من حمله)؛ مسح الأسطح كالمقابض والطاولات (يبقى عليها ساعات)؛ وراحة المريض في البيت.","level":"A","rubric":"R1"},{"id":"U09.L03.T2","objective":"U09.L03.O5","type":"explain_open","prompt":"لماذا يمرض الطفل الصغير بالزكام مرات كثيرة في سنوات المدرسة الأولى، ثم يقلّ ذلك حين يكبر؟","answer":"في كل مرة يلقى فيروساً جديداً يحتاج دفاعه المتخصص أياماً ليصنع الأجسام المضادة؛ ومع السنين تتجمع عنده ذاكرة لفيروسات كثيرة فيردّ أسرع.","level":"B","rubric":"R1"}],"recall":[{"id":"U09.L03.D1","objective":"U09.L03.O1","type":"choose","prompt":"أكثر الميكروبات:","options":["تمرضنا كلها كلما لمسناها بأيدينا","لا تمرضنا، وبعضها نافع","غير موجودة"],"answer":1,"explanation":"قليل منها يمرض.","level":"A","feedback_by_option":{"0":"قليل منها فقط يمرض.","2":"موجودة في كل مكان."}},{"id":"U09.L03.D2","objective":"U09.L03.O2","type":"choose","prompt":"أول حاجز يمنع الميكروبات:","options":["الجلد السليم","العظم","القلب الذي يضخ الدم في الأوعية"],"answer":0,"explanation":"الجلد السليم سور أول، ومعه المخاط والدموع.","level":"A","feedback_by_option":{"1":"العظم داخل الجسم.","2":"القلب يضخ الدم."}},{"id":"U09.L03.D3","objective":"U09.L03.O3","type":"choose","prompt":"الاحمرار حول الشظية:","options":["الجسم يعمل ويدافع","الجسم خسر وتوقف عن الدفاع عن المكان","لا معنى له"],"answer":0,"explanation":"دم أكثر وخلايا بيضاء.","level":"A","feedback_by_option":{"1":"الالتهاب دفاع.","2":"له معنى: الجسم يدافع."}},{"id":"U09.L03.D4","objective":"U09.L03.O3","type":"choose","prompt":"لا نصاب ببعض الأمراض مرتين لأن:","options":["الجسم يتذكر الميكروب","الميكروبات تنقرض بعد أول مرض","نكبر"],"answer":0,"explanation":"الذاكرة تجعل الجسم يصنع الأجسام المضادة فوراً.","level":"A","feedback_by_option":{"1":"لا تنقرض؛ الجسم يتذكرها.","2":"الطول ليس السبب."}},{"id":"U09.L03.D5","objective":"U09.L03.O4","type":"choose","prompt":"نغسل اليدين:","options":["بالماء ثانيتين","بالصابون وفرك 20 ثانية","مرة واحدة في الأسبوع قبل الاستحمام"],"answer":1,"explanation":"الصابون والفرك يزيلان ما التصق بالدهن.","level":"A","feedback_by_option":{"0":"الماء وحده لا يكفي.","2":"في أوقات كثيرة كل يوم."}},{"id":"U09.L03.D6","objective":"U09.L03.O4","type":"choose","prompt":"المضاد الحيوي للزكام:","options":["يشفيه في يوم واحد","لا يعمل عليه","يمنعه"],"answer":1,"explanation":"الزكام فيروس.","level":"A","feedback_by_option":{"0":"لا يعمل على الفيروسات.","2":"لا يمنع الفيروسات."}},{"id":"U09.L03.D7","objective":"U09.L03.O5","type":"choose","prompt":"الأجسام المضادة تصنعها:","options":["الخلايا البائية","الكريّات الحمراء","الجلد"],"answer":0,"explanation":"تنشّطها التائية فتصنعها.","level":"B","feedback_by_option":{"1":"الحمراء تحمل الأكسجين.","2":"الجلد حاجز."}}]};
