const LD = {"id":"U08.T04","lesson":"U08.L04","first":false,"title":"اختبار: ماذا يحدث في جسمي حين أخاف؟","lessonTitle":"ماذا يحدث في جسمي حين أخاف؟","concepts":[],"check":[],"items":[{"id":"U08.L04.A1.a","objective":"U08.L04.O1","level":"A","type":"choose","prompt":"عند الخوف، ماذا يحدث للهضم؟","options":["يتباطأ أو يتوقف","يسرع جداً","لا يتغير","يتحول إلى المعدة اليسرى"],"answer":0,"explanation":"يتباطأ الهضم لأن الجسم يتجهز للحركة.","feedback_by_option":{"1":"بل يتباطأ؛ وكانون رأى معدة الحيوان الخائف تتوقف.","2":"يتغير: يتباطأ.","3":"للإنسان معدة واحدة؛ والهضم يتباطأ."},"alt":{"prompt":"أيّ هذه ليس من تغيّرات الجسم عند الخوف؟","options":["القلب يسرع","التنفس يسرع","النعاس والاسترخاء","العضلات تشتد"],"answer":2,"explanation":"الخوف يجعل الجسم متيقظاً مشدوداً، لا ناعساً.","feedback_by_option":{"0":"هذا من استجابة الخطر.","1":"هذا من استجابة الخطر.","3":"هذا من استجابة الخطر."}}},{"id":"U08.L04.A1.b","objective":"U08.L04.O1","level":"A","type":"true_false_why","prompt":"«عند الخوف يُخرج الجسم سكراً من مخزونه للطاقة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الأدرينالين يُخرج السكر والدهون المخزونة لتجد العضلات طاقة للهرب أو الدفاع.","rubric":"R1","alt":{"prompt":"«القشعريرة عند الخوف تأتي من عضلات صغيرة عند أصل الشعر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تنقبض فتقف الشعرات، كما تنفش القطة فروها."}},{"id":"U08.L04.A1.c","objective":"U08.L04.O1","level":"A","type":"choose_reason","prompt":"لماذا يجف فمك{|ِ} قبل الامتحان إذا {خفت|خفتِ}؟","options":["لأن الهضم يتباطأ فيقلّ اللعاب","لأنك لم تشرب ماء منذ يومين","لأن اللسان يتعب","لأن الفم يتنفس عن الأنف"],"answer":0,"explanation":"استجابة الخطر تبطئ الهضم، واللعاب أول الهضم.","feedback_by_option":{"1":"قد يجف الفم مع العطش، لكن هنا السبب الخوف.","2":"اللسان لا يتعب؛ اللعاب يقلّ.","3":"قد نتنفس من الفم، لكن السبب الأهم قلة اللعاب."},"alt":{"prompt":"لماذا يتسع البؤبؤ عند الخوف؟","options":["ليرى الألوان أوضح","ليغمض العين","لأن العين تتعب","ليدخل ضوء أكثر فنرى الخطر"],"answer":3,"explanation":"استجابة الخطر تشحذ الحواس، والبؤبؤ يتسع ليدخل ضوء أكثر.","feedback_by_option":{"0":"الألوان تحتاج ضوءاً كافياً، والسبب هنا الانتباه للخطر.","1":"الاتساع لا يغمض العين.","2":"ليس تعباً؛ هو استعداد."}}},{"id":"U08.L04.A2.a","objective":"U08.L04.O2","level":"A","type":"choose","prompt":"لماذا {تقفز|تقفزين} من أمام دراجة قبل أن {تفهم|تفهمي} ما رأيت{|ِ}؟","options":["لأنك قررت بسرعة كبيرة","لأن الإنذار قد يسبق فهم الصورة","لأن الساقين تريان الدراجة","لأن القلب أمر الساقين"],"answer":1,"explanation":"جرس الإنذار يعمل بسرعة، قبل أن يكمل الدماغ فهم ما رأته العين.","feedback_by_option":{"0":"القرار يحتاج وقتاً أطول؛ الإنذار أسبق.","2":"الساقان لا تريان؛ العين ترى والدماغ ينذر.","3":"القلب لا يأمر الساقين؛ الأمر من الدماغ."},"alt":{"prompt":"ما فائدة استجابة الخطر؟","options":["تجهز الجسم للهرب أو الدفاع","تجعل الإنسان ينام","تقوي الهضم","تبطئ القلب"],"answer":0,"explanation":"تجهز العضلات بالدم والأكسجين والسكر للحركة السريعة.","feedback_by_option":{"1":"بل تجعله متيقظاً.","2":"الهضم يتباطأ معها.","3":"القلب يسرع معها."}}},{"id":"U08.L04.A2.b","objective":"U08.L04.O2","level":"A","type":"true_false_why","prompt":"«من يخاف جبان، والشجاع لا يخاف أبداً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الخوف إنذار طبيعي يحمي الجسم؛ والشجاع يخاف ثم يتصرف بحكمة.","rubric":"R1","detects":"M90","alt":{"prompt":"«قد يرنّ إنذار الخوف بلا خطر حقيقي، كسؤال مفاجئ في الصف». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يتصرف الجسم كأن أمامه خطراً، وهذا طبيعي ويمكن تهدئته."}},{"id":"U08.L04.A2.c","objective":"U08.L04.O2","level":"A","type":"explain_open","prompt":"اذكر{|ي} موقفاً أنقذ فيه الخوف إنساناً، وموقفاً رنّ فيه الإنذار بلا خطر.","answer":"أنقذه: الابتعاد عن سيارة مسرعة أو كلب شرس أو حافة عالية. بلا خطر: الخوف من صورة عنكبوت، أو من سؤال مفاجئ، أو من الظلام في غرفة آمنة.","rubric":"R1"},{"id":"U08.L04.A3.a","objective":"U08.L04.O3","level":"A","type":"choose_reason","prompt":"انتهى الفيلم المخيف، لكن قلبك{|ِ} ما زال يدق بسرعة. لماذا؟","options":["لأن مكابح الهدوء تحتاج وقتاً","لأن القلب مريض","لأن الخوف لا ينتهي أبداً","لأنك ما زلت ترى الفيلم"],"answer":0,"explanation":"يحتاج الجسم وقتاً ليعود إلى الهدوء بعد الإنذار.","feedback_by_option":{"1":"هذا طبيعي في القلب السليم.","2":"ينتهي، لكن بعد وقت.","3":"الفيلم انتهى؛ الجسم يحتاج وقتاً."},"alt":{"prompt":"أيّ هذه يساعد مكابح الهدوء؟","options":["القفز السريع","الصراخ","شهيق بطيء وزفير طويل","التفكير في الشيء المخيف"],"answer":2,"explanation":"الزفير الطويل البطيء يساعد جهاز الهدوء.","feedback_by_option":{"0":"يرفع النبض أكثر.","1":"يزيد التوتر غالباً.","3":"يبقي الإنذار رنّاناً."}}},{"id":"U08.L04.A3.b","objective":"U08.L04.O3","level":"A","type":"true_false_why","prompt":"«الكلام مع كبير أثق به يساعدني على الهدوء بعد الخوف». صح أم خطأ؟ ولماذا؟","answer":"صح؛ القرب ممن نحب ونثق به يساعد على الهدوء، كالتنفس البطيء والحركة الهادئة.","rubric":"R1","alt":{"prompt":"«التنفس السريع يهدّئ القلب بعد الفزع». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ التنفس البطيء بزفير طويل هو الذي يساعد مكابح الهدوء."}},{"id":"U08.L04.A3.c","objective":"U08.L04.O3","level":"A","type":"explain_open","prompt":"أختك{|ِ} الصغيرة استيقظت من حلم مخيف وقلبها يدق بسرعة. كيف {تساعدها|تساعدينها}؟ ولماذا ينفع ذلك؟","answer":"أجلس معها وأطمئنها، وأتنفس معها ببطء بزفير طويل، وأنادي أحد الكبار؛ لأن الأمان والتنفس البطيء يساعدان مكابح الهدوء فيبطئ قلبها.","rubric":"R1"},{"id":"U08.L04.A4.a","objective":"U08.L04.O4","level":"A","type":"choose_reason","prompt":"لماذا لا نصنع مقلباً مرعباً ولو كان الجميع سيضحك بعده؟","options":["لأنه يأخذ وقتاً طويلاً","لأن المعلم يغضب فقط","لأنه يطلق إنذاراً كاملاً وقد يؤذي، والنبي ﷺ نهى عن الترويع","لأن الضحك ممنوع"],"answer":2,"explanation":"الفزع المفاجئ يطلق استجابة الخطر وقد يُسقط المفزوع أو يؤذي قلبه نادراً، والنبي ﷺ نهى عن ترويع المسلم.","feedback_by_option":{"0":"الوقت ليس السبب؛ الأذى هو السبب.","1":"السبب أكبر من غضب المعلم: الأذى والنهي.","3":"الضحك جميل إذا ضحك منه الجميع بلا أذى."},"detects":"M91","alt":{"prompt":"أيّ هذه ترويع منهي عنه؟","options":["نكتة مضحكة على العشاء","تقليد صوت قطة للعب مع أخيك الصغير وهو يراك","رسم وجه مضحك","القفز صارخاً على أختك في الظلام"],"answer":3,"explanation":"القفز المفاجئ في الظلام يفزعها ويطلق إنذاراً كاملاً في جسمها.","feedback_by_option":{"0":"النكتة يضحك منها الجميع بلا فزع.","1":"هو يراك ويعرف أنه لعب؛ لا فزع.","2":"الوجه المضحك لا يفزع."},"detects":"M91"}},{"id":"U08.L04.A4.b","objective":"U08.L04.O4","level":"A","type":"true_false_why","prompt":"«التظاهر بطعن صديق بالقلم مزاحاً لا بأس به ما دام القلم لا يلمسه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النبي ﷺ نهى عن الإشارة إلى الأخ بحديدة ولو كان أخاه الشقيق، فالمزاح بالسلاح ممنوع؛ وقد يفزع صاحبه أو يُصاب خطأً.","rubric":"R1","detects":"M91","alt":{"prompt":"«الفزع المفاجئ قد يؤذي القلب نادراً، ولا نعرف مسبقاً من يتأذى». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يرفع النبض والضغط وقد يضطرب نظم القلب، وأكثر ذلك يزول لكنه نادراً شديد."}},{"id":"U08.L04.A4.c","objective":"U08.L04.O4","level":"A","type":"explain_open","prompt":"اكتب{|ي} لأخيك{|ِ} الذي يحب المقالب: ما الحكم؟ وما الأثر في الجسم؟ وما المزاح الذي {تقترحه|تقترحينه} بدلاً منه؟","answer":"الحكم: نهى النبي ﷺ عن ترويع المسلم ولو مزاحاً، والأذى ممنوع مع كل إنسان. الأثر: إنذار كامل، قلب يدق بقوة، وقد يسقط أو يتأذى قلبه نادراً. البديل: لغز أو نكتة أو لعبة يضحك منها الجميع.","rubric":"R2"},{"id":"U08.L04.A5.a","objective":"U08.L04.O5","level":"B","type":"choose","prompt":"أين يبدأ إنذار الخوف؟","options":["في القلب","في المعدة","في الدماغ، في اللوزة","في العضلات"],"answer":2,"explanation":"اللوزة الدماغية تلتقط الخطر وتطلق الإنذار، والقلب يسرع بأمرها.","feedback_by_option":{"0":"القلب يسرع بأمر الدماغ؛ لا يخاف.","1":"المعدة تتباطأ؛ لا تنذر.","3":"العضلات تشتد استجابةً للإنذار."},"detects":"M07","alt":{"prompt":"ما الذي تطلقه الغدتان الكظريتان؟","options":["اللعاب","الأدرينالين","الدم","العرق"],"answer":1,"explanation":"تطلقان الأدرينالين في الدم.","feedback_by_option":{"0":"اللعاب من غدد الفم.","2":"الدم يصنعه نخاع العظم.","3":"العرق من غدد الجلد."}}},{"id":"U08.L04.A5.b","objective":"U08.L04.O5","level":"B","type":"choose_reason","prompt":"غضبت{|ِ} من أخيك{|ِ}. ما الذي يخفف الغضب بحسب مراجعة 154 دراسة؟","options":["ضرب الوسادة بقوة","الصراخ في الغرفة","الجري بسرعة","التنفس العميق وأخذ مهلة"],"answer":3,"explanation":"الأنشطة المهدّئة خففت الغضب، و«التفريغ» لم يخففه وقد زاده.","feedback_by_option":{"0":"ضرب الكيس لم يخفف الغضب وقد زاده.","1":"الصراخ يرفع الإنذار ولا يطفئه.","2":"الجري كان أكثر ما رفع الغضب في الدراسات."},"detects":"M92","alt":{"prompt":"لماذا يشبه الغضبُ الخوفَ في الجسم؟","options":["لأنه يطلق استجابة الخطر نفسها","لأنه يبطئ القلب","لأنه يحدث في المعدة","لا يشبهه"],"answer":0,"explanation":"الغضب يسرّع القلب ويشدّ العضلات بالاستجابة نفسها.","feedback_by_option":{"1":"بل يسرّعه.","2":"الإنذار في الدماغ.","3":"يشبهه في تغيّرات الجسم."}}},{"id":"U08.L04.A5.c","objective":"U08.L04.O5","level":"B","type":"true_false_why","prompt":"«الغدتان الكظريتان تطلقان هرموناً يُبقي الجسم متيقظاً ما دام الخطر قائماً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ثم يقلّ حين يزول الخطر؛ وتكرار الإنذار طويلاً يتعب الجسم.","rubric":"R1","alt":{"prompt":"«القلب هو الذي يقرر أن نخاف». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الدماغ يطلق الإنذار، والقلب يسرع بأمر الأعصاب والأدرينالين."}},{"id":"U08.L04.A6.a","objective":"U08.L04.O6","level":"B","type":"choose","prompt":"ماذا لاحظ كانون بالأشعة في الحيوان الخائف أو الغاضب؟","options":["أن معدته تسرع","أن قلبه يتوقف","أن حركة معدته تتوقف","أن عظامه تتغير"],"answer":2,"explanation":"لاحظ توقفاً تاماً لحركة المعدة مع أي علامة غضب أو خوف.","feedback_by_option":{"0":"بل تتوقف.","1":"القلب يسرع لا يتوقف.","3":"الأشعة أظهرت المعدة، والعظام لا تتغير بالخوف."},"alt":{"prompt":"لماذا استعمل كانون طعاماً فيه مادة تظهر في الأشعة؟","options":["ليرى حركة المعدة في الصور","ليجعل الطعام ألذ","ليعرف وزن الحيوان","ليخيف الحيوان"],"answer":0,"explanation":"المادة تظهر في صور الأشعة، فيرى المعدة وهي تتحرك.","feedback_by_option":{"1":"لم يكن ذلك غرضه.","2":"الوزن لا يحتاج أشعة.","3":"لم يكن غرضه الإخافة؛ كان يدرس الهضم."}}},{"id":"U08.L04.A6.b","objective":"U08.L04.O6","level":"B","type":"choose_reason","prompt":"في تجربة النبض، ما الذي يجعل المقارنة بين الطريقتين عادلة؟","options":["أن نقفز دقيقة في الأولى وثلاثاً في الثانية","القفز نفسه والجلوس نفسه، ويتغير التنفس وحده","أن يقيس شخص آخر في الثانية","ألّا نرتاح بين المرتين"],"answer":1,"explanation":"نثبّت القفز والجلوس والقياس والشخص والراحة، ونغيّر طريقة التنفس وحدها.","feedback_by_option":{"0":"هذا يغيّر شيئين معاً.","2":"تغيير الشخص يغيّر شيئين معاً.","3":"بلا راحة تبدأ الثانية بنبض أعلى."},"alt":{"prompt":"لماذا نرفع النبض بالقفز لا بإخافة أحد؟","options":["لأن القفز أسرع","لأن الإخافة لا ترفع النبض","لأن الترويع منهي عنه وقد يؤذي","لأن القفز يقيس الخوف بدقة"],"answer":2,"explanation":"الترويع منهي عنه وقد يؤذي، والقفز يرفع النبض بلا أذى.","feedback_by_option":{"0":"السرعة ليست السبب.","1":"الإخافة ترفعه، لكنها تؤذي ومنهي عنها.","3":"القفز لا يقيس الخوف؛ يقيس عودة الهدوء."}}},{"id":"U08.L04.A6.c","objective":"U08.L04.O6","level":"B","type":"true_false_why","prompt":"«تجربة القفز تقيس الخوف نفسه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ ترفع النبض بلا خوف وتقيس عودة الجسم إلى الهدوء، لا الخوف.","rubric":"R1","alt":{"prompt":"«إذا لم يظهر فرق بين الطريقتين في مرة واحدة نكتب ما وجدناه بأمانة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العالِم يسجل ما وجده لا ما تمناه، ويعيد التجربة أياماً قبل أن يحكم."}}],"transfer":[{"id":"U08.L04.T1","objective":"U08.L04.O1","type":"explain_open","prompt":"لاعب كرة يقف لتسديد ركلة جزاء في مباراة مهمة، فيجف فمه ويسرع قلبه. فسّر{|ي} ما يحدث، و{اقترح|اقترحي} ما يساعده.","answer":"رنّ الإنذار مع أنه لا خطر على حياته: أدرينالين يسرّع القلب ويبطئ الهضم فيقلّ اللعاب. يساعده تنفس بطيء بزفير طويل قبل الركلة.","level":"A","rubric":"R1"},{"id":"U08.L04.T2","objective":"U08.L04.O5","type":"explain_open","prompt":"لماذا نصح النبي ﷺ من طلب وصية أن لا يغضب، ورددها مراراً؟ فكّر{|ي} في ما يحدث للجسم والقرار عند الغضب.","answer":"الغضب يشغّل استجابة الخطر فيشتد الجسم ويسرع القلب، ويصعب التفكير الهادئ فيقول المرء أو يفعل ما يندم عليه؛ ولذلك نهدأ أولاً ثم نقرر.","level":"B","rubric":"R1"}],"recall":[{"id":"U08.L04.D1","objective":"U08.L04.O1","type":"cho
