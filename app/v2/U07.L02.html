const LD = {"id":"U07.L02","first":false,"title":"طريق البول: الحالبان والمثانة والعاصرة","driving_question":"{اسم}، كليتاك{|ِ} تصنعان البول بلا توقف، ليلاً ونهاراً. فلماذا لا يقطر منك{|ِ} طوال اليوم؟ ومن يقرر متى يخرج؟","central_fact":"يمشي البول في طريق من أربع محطات: الكليتان تصنعانه، والحالبان يدفعانه بموجات عضلية، والمثانة تخزّنه وترسل إشارة حين تمتلئ، والعاصرة تُبقي مخرجها مغلقاً حتى نقرر؛ ولونه رسالة بسيطة عن الماء.","next":"U07.L03","hook":{"text":"{اسم}، لو {نمت|نمتِ} {مستلقياً|مستلقية} طوال الليل، هل ينزل البول من كليتيك{|ِ} إلى الكيس الذي يخزّنه؟","options":["لا، ينزل فقط ونحن واقفون","نعم، شيء ما يدفعه","لا، الكليتان تنامان معنا","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["urinary"],"highlight":["kidney","ureter","bladder","urethra"],"zoom":"abdomen","animate":"urine_road"},"text":"في الدرس الماضي رأينا الكليتين تصنعان البول قطرة قطرة، ليلاً ونهاراً. إلى أين يذهب؟ من كل كلية ينزل أنبوب رفيع اسمه الحالب، طوله عند الكبير قريب من طول مسطرة المدرسة، يمتد في الظهر ثم ينعطف إلى الأمام نحو كيس في أسفل البطن اسمه المثانة. المثانة تخزّن البول ساعات. ثم يخرج البول منها في أنبوب أخير اسمه الإحليل إلى خارج الجسم. طريق من أربع محطات: الكليتان تصنعان، والحالبان ينقلان، والمثانة تخزّن، والإحليل يُخرج. انتبه{|ي}: المثانة لا تصنع البول؛ تخزنه فقط."},{"id":"E2","level":"A","atlas":{"layers":["urinary"],"highlight":["ureter"],"zoom":"ureter","animate":"peristalsis"},"text":"كيف ينزل البول في الحالب؟ قد تظن{|ين} أنه يسقط بثقله كالماء في أنبوب. لكن جدار الحالب عضلات تنقبض موجة بعد موجة، فتدفع البول دفعات صغيرة نحو المثانة — كما يدفع المريء اللقمة إلى المعدة. ولهذا يصل البول إلى المثانة وأنت{|ِ} {مستلقٍ|مستلقية} في سريرك{|ِ}، بل لو {وقفت|وقفتِ} على يديك{|ِ}! والحالب يدخل جدار المثانة مائلاً، فلا يرجع البول منها إلى الكلية."},{"id":"E3","level":"A","atlas":{"layers":["urinary","nervous"],"highlight":["bladder"],"zoom":"pelvis","animate":"bladder_fill"},"text":"المثانة كيس من العضلات: فارغة تكون صغيرة منكمشة، وكلما نزل إليها البول تمدّد جدارها كالبالون. وفي جدارها حسّاسات صغيرة تشعر بالتمدد، فترسل إشارة إلى الدماغ: بدأت أمتلئ. هنا تشعر{|ين} بالحاجة إلى الحمام. والإشارة الأولى تأتي مبكرة، والمثانة ما زالت بعيدة عن الامتلاء، فتستطيع{|ين} أن تُكمل{|ي} ما بيدك{|ِ} قليلاً ثم تذهب{|ي} في وقت مناسب."},{"id":"E4","level":"A","atlas":{"layers":["urinary","nervous"],"highlight":["sphincter","urethra"],"zoom":"pelvis","animate":"sphincter_open"},"text":"فمن يمنع البول من الخروج وأنت{|ِ} في الصف؟ عند مخرج المثانة عضلات على شكل حلقة اسمها العاصرة، تبقى مغلقة كباب محكم. حين تصل{|ين} إلى الحمام وتقرر{|ين}، يرسل دماغك{|ِ} أمرين معاً: تنفتح العاصرة، وتنقبض عضلة المثانة فتدفع البول في الإحليل إلى الخارج. الرضيع لا يتحكم بعد؛ تفرغ مثانته وحدها حين تمتلئ. ثم تعلّم دماغك{|ِ} في طفولتك{|ِ} أن يُبقي الباب مغلقاً حتى تصل{|ي} إلى الحمام — مهارة تعلّمها كما تعلّم المشي والكلام، ولكل طفل وقته فيها."},{"id":"E5","level":"A","atlas":{"layers":["urinary"],"highlight":["bladder"],"zoom":"pelvis","animate":"color_chart"},"text":"والبول نفسه رسالة من جسمك{|ِ}. إذا شربت{|ِ} كفايتك{|ِ} كان فاتحاً وفيراً بلا رائحة قوية؛ وإذا احتاج جسمك{|ِ} ماءً أعادت الكليتان أكثره إلى الدم فصار البول قليلاً وأغمق — كأنه يقول: اشرب{|ي}. لكنه دليل بسيط لا حكم نهائي، لأن بعض الأطعمة والفيتامينات والأدوية تغيّر لونه. وثلاث عادات تحمي مثانتك{|ِ}: أن تشرب{|ي} ماءً كافياً، وألا تكتم{|ي} البول ساعات طويلة، وأن تأخذ{|ي} وقتك{|ِ} في الحمام حتى تفرغ المثانة كلها. ثم الطهارة، وغسل اليدين بالماء والصابون."},{"id":"E6","level":"B","atlas":{"layers":["urinary"],"highlight":["bladder","sphincter"],"zoom":"pelvis"},"text":"للمستوى ب: لماذا تأتي الإشارة مبكرة؟ عند الكبير يشعر الإنسان بالحاجة الأولى حين يكون في المثانة نحو 150 مل، أقل من كوب، وهي تتسع لثلاثة أضعاف ذلك أو أكثر. هذا الهامش يعطينا وقتاً. لكن كتم البول طويلاً مرة بعد مرة قد يُضعف عضلة المثانة فلا تُفرغها كلها. وهناك علامات نخبر بها الأهل ولا نخجل: ألم أو حرقة عند التبول، أو دم في البول، أو حرارة، أو حاجة متكررة ملحّة على غير العادة، أو ألم في أسفل البطن أو في الجنب. هذه أمور يعرفها الطبيب ويعالجها."},{"id":"E7","level":"B","atlas":{"layers":["urinary"],"highlight":["kidney"],"zoom":"lab"},"text":"وكيف يفحص الطبيب البول اليوم؟ ينظر إليه أولاً: صافٍ أم عكر؟ فاتح أم غامق؟ — وهذا ما فعله أطباء حضارتنا قبل أكثر من ألف عام. ثم يغمس فيه المختبر شريطاً عليه مربعات صغيرة تتغير ألوانها إن وُجد سكر أو دم أو علامة التهاب، ثم ينظر إلى قطرة منه تحت المجهر بحثاً عن خلايا أو بلورات أو جراثيم. النظر بداية مفيدة، والشريط والمجهر يريان ما لا تراه العين."}],"practice":[{"id":"U07.L02.P1","objective":"U07.L02.O1","type":"sequence","prompt":"رتّب{|ي} طريق البول من صنعه إلى خروجه.","options":["الكليتان","الحالبان","المثانة","الإحليل","خارج الجسم"],"answer":[0,1,2,3,4],"explanation":"الكليتان تصنعان البول، والحالبان ينقلانه، والمثانة تخزّنه، والإحليل يُخرجه.","level":"A","feedback_wrong":"أين يُصنع البول؟ وأين يُخزَّن؟"},{"id":"U07.L02.P2","objective":"U07.L02.O2","type":"choose_reason","prompt":"{استلقيت|استلقيتِ} في السرير ساعة. هل ينزل البول من الكليتين إلى المثانة؟","options":["لا؛ لا ينزل إلا ونحن واقفون","نعم؛ الحالبان يدفعانه بموجات","لا؛ الكليتان تتوقفان حين نستلقي"],"answer":1,"explanation":"الحالبان أنبوبان عضليان يدفعان البول بموجات، فيصل المثانة ولو كنا مستلقين.","level":"A","feedback_wrong":"ماذا حدث للكرة في الجورب المرفوع؟","feedback_by_option":{"0":"البول لا يعتمد على الوقوف؛ الحالب يدفعه بموجات.","2":"الكليتان تعملان ليلاً ونهاراً، ونحن نيام أيضاً."}},{"id":"U07.L02.P3","objective":"U07.L02.O3","type":"predict","prompt":"تمتلئ المثانة شيئاً فشيئاً في أثناء الحصة. ماذا يحدث أولاً؟","options":["تتوقف الكليتان حتى تفرغ المثانة","تنفتح العاصرة وحدها فوراً","تصل الدماغ إشارة بالحاجة والعاصرة مغلقة"],"answer":2,"explanation":"تتمدد المثانة فتصل الدماغ إشارة مبكرة، وتبقى العاصرة مغلقة حتى نصل إلى الحمام ونقرر.","level":"A","feedback_wrong":"من يقرر متى ينفتح الباب؟","feedback_by_option":{"0":"الكليتان لا تتوقفان؛ المثانة تتمدد وتخزّن.","1":"العاصرة تبقى مغلقة حتى نقرر؛ هذا ما تعلّمه دماغنا في الطفولة."}},{"id":"U07.L02.P4","objective":"U07.L02.O4","type":"choose","prompt":"بولك{|ِ} صباحاً أصفر غامق وقليل. ماذا يعني غالباً؟","options":["أن جسمي يحتاج ماءً","أن كليتي مريضة حتماً","أنني أكلت كثيراً في العشاء","أن اللون لا علاقة له بالشرب"],"answer":0,"explanation":"لم نشرب طوال الليل، فأعادت الكليتان ماءً أكثر إلى الدم؛ فالبول الغامق القليل يقول غالباً: أحتاج ماءً.","level":"A","feedback_wrong":"أي كوب في التجربة قال «أحتاج ماءً»؟","feedback_by_option":{"1":"الغامق صباحاً شائع لأننا لم نشرب في الليل؛ الألم أو الدم هما ما نخبر بهما الأهل.","2":"كمية الأكل لا تغمّق البول عادة؛ قلة الماء هي السبب الأغلب.","3":"اللون يتغير أولاً بالماء: يفتح حين نشرب ويغمق حين نحتاج."}},{"id":"U07.L02.P5","objective":"U07.L02.O6","type":"choose","prompt":"ماذا يكشف الشريط الملوّن في فحص البول؟","options":["طول المثانة","عدد مرات الذهاب إلى الحمام","أشياء لا تراها العين، كالسكر أو الدم","اسم الطعام الذي أكلناه"],"answer":2,"explanation":"مربعات الشريط تتغير ألوانها حين تلامس سكراً أو دماً أو علامة التهاب؛ فيرى المختبر ما لا تراه العين.","level":"B","feedback_wrong":"ما الذي لا تستطيع العين أن تراه في البول؟","feedback_by_option":{"0":"الشريط يُغمس في البول؛ لا يقيس المثانة.","1":"عدد المرات يُعرف بالعدّ لا بالشريط.","3":"الشريط لا يعرف أسماء الأطعمة؛ يكشف مواد في البول."}}],"check":[{"id":"U07.L02.C1","objective":"U07.L02.O1","type":"explain_open","prompt":"ما عمل كل محطة في طريق البول؟","answer":"الكليتان تصنعان البول، والحالبان ينقلانه، والمثانة تخزّنه، والإحليل يُخرجه إلى خارج الجسم.","level":"A","rubric":"R1"},{"id":"U07.L02.C2","objective":"U07.L02.O2","type":"fix_model","prompt":"كتب زميل{ك|تكِ}: البول يسقط في الحالب كما يسقط الماء في أنبوب. ما الذي ينقص كلامه؟","answer":"الحالب أنبوب عضلي يدفع البول بموجات، فيصل ولو كنا مستلقين؛ ليس سقوطاً بالثقل.","level":"A","rubric":"R1"},{"id":"U07.L02.C3","objective":"U07.L02.O3","type":"true_false_why","prompt":"«عند من تعلّم التحكم، تنفتح العاصرة وحدها حين تمتلئ المثانة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تبقى مغلقة حتى نقرر، فيأمرها الدماغ بالانفتاح ويأمر المثانة بالانقباض.","level":"A","rubric":"R1"},{"id":"U07.L02.C4","objective":"U07.L02.O4","type":"explain_open","prompt":"اذكر{|ي} عادتين تحميان المثانة، ولماذا تنفع كل منهما.","answer":"شرب ماء كافٍ (فيبقى البول فاتحاً)، وعدم كتم البول ساعات طويلة (حتى لا تضعف العضلة)، وإفراغ المثانة كلها على مهل.","level":"A","rubric":"R1"},{"id":"U07.L02.C5","objective":"U07.L02.O4","type":"true_false_why","prompt":"«قد يتغير لون البول بعد أخذ بعض الفيتامينات ولو شربنا كفايتنا». صح أم خطأ؟ ولماذا؟","answer":"صح؛ بعض الأطعمة والفيتامينات والأدوية تغيّر اللون، فلوحة الألوان دليل بسيط لا حكم نهائي.","level":"A","rubric":"R1"},{"id":"U07.L02.C6","objective":"U07.L02.O5","type":"explain_open","prompt":"لماذا نستطيع أن ننتظر قليلاً بعد الإشارة الأولى؟ ولماذا لا ننتظر ساعات؟","answer":"الإشارة الأولى تأتي والمثانة بعيدة عن الامتلاء فلدينا وقت؛ لكن الكتم الطويل المتكرر قد يُضعف عضلة المثانة.","level":"B","rubric":"R1"},{"id":"U07.L02.C7","objective":"U07.L02.O6","type":"true_false_why","prompt":"«النظر إلى لون البول يكفي الطبيب ليعرف كل مرض». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النظر بداية مفيدة، لكن الطبيب يحتاج الشريط والمجهر ليرى ما لا تراه العين.","level":"B","rubric":"R1"}],"concepts":[{"id":"ureter","term":{"ar":"الحالب","en":"Ureter","zh":"输尿管","pinyin":"shūniàoguǎn","match":["الحالب","حالب","الحالبان","الحالبين","حالبان"]},"priority":"core","atlas":{"layer":"urinary","element":"ureter"},"card":{"A":"أنبوب عضلي رفيع ينزل من كل كلية إلى المثانة؛ لكل إنسان حالبان.","B":"طوله نحو 30 سنتيمتراً عند الكبير؛ يدفع البول بموجات من عضلاته، لا بالجاذبية."}},{"id":"bladder","term":{"ar":"المثانة","en":"Bladder","zh":"膀胱","pinyin":"pángguāng","match":["المثانة","مثانة","مثانتك","مثانته"]},"priority":"core","atlas":{"layer":"urinary","element":"bladder"},"card":{"A":"كيس من العضلات في أسفل البطن من الأمام، داخل الحوض، يخزّن البول ويتمدد كلما امتلأ.","B":"تتسع عند الكبير لكوب ونصف إلى كوبين براحة، وتأتي الإشارة الأولى قبل ذلك بكثير."}},{"id":"sphincter","term":{"ar":"العاصرة","en":"Sphincter","zh":"括约肌","pinyin":"kuòyuējī","match":["العاصرة","عاصرة","العاصرتان","العاصرتين"]},"priority":"core","atlas":{"layer":"urinary","element":"sphincter"},"card":{"A":"عضلات على شكل حلقة حول مخرج المثانة، تبقى مغلقة كالباب حتى نقرر أن نُفرغ المثانة.","B":"عاصرتان: داخلية تعمل وحدها بلا إرادتنا، وخارجية نتحكم بها؛ تعلّم الدماغ التحكم بها في الطفولة."}},{"id":"urethra","term":{"ar":"الإحليل","en":"Urethra","zh":"尿道","pinyin":"niàodào","match":["الإحليل","إحليل","مجرى البول"]},"priority":"supporting","atlas":{"layer":"urinary","element":"urethra"},"card":{"A":"الأنبوب الذي يخرج فيه البول من المثانة إلى خارج الجسم؛ ويُسمّى مجرى البول.","B":"يختلف شكله وطوله بين الذكر والأنثى؛ والتفصيل في درس النمو."}}],"experiment":{"title":"الجورب والبالون وأكواب الألوان","materials":["جورب طويل قديم وكرة صغيرة (كرة تنس طاولة أو كرة ورق)","بالون وقمع صغير وإبريق ماء وصينية أو حوض، وملقط غسيل","أربعة أكواب شفافة وماء وملوّن طعام أصفر، ولوحة ألوان البول من التطبيق أو مطبوعة"],"steps":["أدخل{|ي} الكرة في الجورب، ثم {ارفع|ارفعي} الجورب إلى الأعلى، و{اعصره|اعصريه} خلف الكرة عصرة بعد عصرة. هل تتقدم الكرة إلى الأعلى؟ هكذا يدفع الحالب البول بموجات.","فوق الصينية: {ضع|ضعي} القمع في فم البالون، واسكب{|ي} الماء ببطء. ماذا يحدث للبالون كلما امتلأ؟ هذه المثانة تتمدد.","أمسك{|ي} عنق البالون بالملقط أو بإصبعين، ثم {أبعد|أبعدي} القمع: هل يخرج الماء؟ هذه العاصرة، والباب لا ينفتح إلا بقرارك{|ِ}.","افتح{|ي} الملقط فوق الحوض، واضغط{|ي} البالون بلطف: هكذا تنفتح العاصرة وتنقبض المثانة معاً.","املأ{|ي} الأكواب الأربعة ماءً، وقطّر{|ي} فيها من الملوّن: قطرة، ثم ثلاثاً، ثم ستاً، ثم عشراً. رتّب{|ي}ها من الأفتح إلى الأغمق وقارن{|ي}ها بلوحة الألوان: أي كوب يقول «شربتُ كفايتي»؟ وأيها يقول «أحتاج ماءً»؟","اكتب{|ي}: كيف يصل البول إلى المثانة؟ ومن يقرر متى يخرج؟ وماذا يخبرني لونه؟"],"safety":["نعمل فوق صينية أو حوض، ولا نملأ البالون كثيراً حتى لا ينفجر قرب الوجه.","لا نستعمل بولاً حقيقياً في التجربة؛ الأكواب ماء وملوّن فقط، ولا نشرب منها.","من عنده حساسية من المطاط يستعمل كيساً بلاستيكياً صغيراً بدل البالون.","تُغسل اليدان بعد التجربة."],"expected":"تتقدم الكرة بالعصر حتى والجورب مرفوع إلى الأعلى؛ البالون يتمدد ويبقى ممتلئاً ما دام عنقه مغلقاً؛ الأكواب تتدرج من الفاتح (يكفي غالباً) إلى الغامق (أحتاج ماءً).","explain":"الكرة تقدمت إلى الأعلى بالعصر، لا بالسقوط: هكذا يدفع الحالب البول بموجات من عضلاته، فيصل إلى المثانة ولو كنا مستلقين. والبالون تمدد كلما امتلأ ولم يخرج منه شيء ما دام عنقه مغلقاً: المثانة تخزّن، والعاصرة باب لا ينفتح إلا بقرارنا. أما الأكواب فتشبه لوحة ألوان البول: الفاتح يقول غالباً إننا شربنا كفايتنا، والغامق يقول إننا نحتاج ماءً. وهو دليل بسيط، لأن بعض الأطعمة والفيتامينات والأدوية تغيّر اللون.","record":"هل تقدمت الكرة إلى الأعلى؟ ماذا حدث للبالون حين أُغلق عنقه؟ ترتيب الأكواب، وأي كوب يقول «يكفي» وأيها «أحتاج ماءً».","alternatives":["بلا جورب: أنبوب معجون أسنان فارغ نظيف تُعصر فيه حبة حمص.","بلا بالون: كيس بلاستيكي صغير يُملأ ماءً ويُمسك عنقه بالأصابع.","بلا ملوّن: شاي خفيف بدرجات مختلفة."]},"find_the_error":[{"id":"FE1","atlas_variant":"bladder_makes","error":"سهم مكتوب عليه: المثانة تصنع البول","answer":"المثانة تخزّنه؛ الكليتان تصنعانه من الدم","detects":"M74"},{"id":"FE2","atlas_variant":"falls_down","error":"رسم شخص مستلقٍ، وتحته: البول لا ينزل إلا ونحن واقفون","answer":"الحالب يدفع البول بموجات عضلية، فينزل ونحن مستلقون","detects":"M71"},{"id":"FE3","atlas_variant":"color_means_nothing","error":"لافتة: لون البول لا يعني شيئاً","answer":"الفاتح غالباً شرب كافٍ، والغامق حاجة إلى الماء؛ وقد يغيّره طعام أو فيتامين أو دواء","detects":"M73"}],"numbers":[{"text":"الحالب نحو 30 سنتيمتراً عند الكبير — بطول مسطرة المدرسة.","source":["S2"]},{"text":"مثانة الكبير تتسع براحة لكوب ونصف إلى كوبين، وتأتي الإشارة الأولى وفيها نحو 150 مل، أقل من كوب.","source":["S1","S2"]},{"text":"نحو طفل من كل عشرة في السابعة يبلل فراشه أحياناً، ومعظمهم يتجاوز ذلك مع النمو.","source":["S6"]}],"true_size":[{"text":"{خذ|خذي} مسطرة المدرسة (30 سنتيمتراً): هذا طول الحالب عند الكبير، من الكلية في الظهر إلى المثانة في أسفل البطن.","source":["S2"]}],"animal":{"text":"معظم الطيور بلا مثانة! بولها عجينة بيضاء قليلة الماء — هي الجزء الأبيض في فضلات الطيور — وتمرّ في آخر أمعائها فيُستعاد منها ماء قبل أن تخرج. أما نحن فنحمل مثانة تخزّن البول ساعات، فنختار وقت إفراغها.","source":["S11"]},"organ_letter":{"from":"مثانتك{|ِ}","text":"أنا كيس من العضلات في أسفل بطنك{|ِ}، خلف عظم الحوض. لا أصنع البول: تصنعه الكليتان في الظهر، ويدفعه إليّ الحالبان بموجات صغيرة، ليلاً ونهاراً. أتمدد قليلاً قليلاً، وحين أبدأ بالامتلاء أرسل إلى دماغك{|ِ} رسالة مبكرة: بعد قليل، من فضلك{|ِ}. بابي العاصرة، ومفتاحه عندك{|ِ}. لا {تتركني|تتركيني} ساعات طويلة كل يوم فتتعب عضلاتي، وحين {تأتي|تأتين} {خذ|خذي} وقتك{|ِ} حتى أفرغ كلي. مع التحية، خزانتك{|ِ} الصبورة."},"history":[{"who":"إسحاق بن سليمان الإسرائيلي","origin":"وُلد في مصر","where_when":"القيروان (تونس اليوم)، نحو 855–932م","did":"طبيب بلاط الأغالبة ثم الفاطميين في القيروان، كتب «كتاب البول» يعلّم الأطباء ملاحظة البول بدقة: لونه وصفاءه وكميته، ويفرّق بين ما يغيّره من الخارج كالطعام وما يغيّره من داخل الجسم. تُرجم كتابه إلى اللاتينية في القرن الحادي عشر ودرسه الأطباء في أوروبا.","did_not":"لم تكن عنده أدوات تكشف ما لا يُرى في البول، وبنى بعض تفسيراته على نظرية الأخلاط التي تركها الطب الحديث.","method_lesson":"سجّل ما تراه بدقة، وفرّق بين ما يغيّره الطعام وما يغيّره الجسم، ثم ابحث عن أداة تكشف ما لا تراه.","source":["S8","S9"]},{"who":"أبو بكر الرازي","origin":"من الري (قرب طهران اليوم)","where_when":"الري وبغداد، القرنان التاسع والعاشر الميلاديان","did":"وصف في كتابه «الحاوي» حصى الكلية والمثانة، وفرّق بالعلامات بين أسباب ثقل الجنب: مع الحصى قد يكون في البول رمل، ومع الانسداد يقلّ البول ويصفو؛ وفرّق بين ألم الكلية وألم القولون.","did_not":"لم تكن عنده الأشعة ولا التحاليل؛ اعتمد على الملاحظة والمقارنة، واليوم تُرى الحصاة نفسها بالأشعة.","method_lesson":"قارن العلامات معاً قبل أن تحكم؛ علامة واحدة قد تضلّلك.","source":["S10"]}],"how_we_know":{"text":"كيف نعرف ما في البول وهو يبدو ماءً أصفر صافياً؟ قديماً نظر الأطباء — ومنهم إسحاق الإسرائيلي في القيروان — في لونه وصفائه وكميته، وسجّلوا ما رأوا بدقة، وفرّقوا بين ما يغيّره الطعام وما يغيّره الجسم. وهذا ما يفعله المختبر اليوم أولاً: صافٍ أم عكر؟ فاتح أم غامق؟ ثم يغمس فيه شريطاً عليه مربعات صغيرة من مواد تتغير ألوانها حين تلامس سكراً أو دماً أو علامة التهاب. ثم ينظر إلى قطرة منه تحت المجهر ليرى خلايا أو بلورات أو جراثيم. العين بداية جيدة؛ والشريط والمجهر يريان ما لا تراه.","limit_question":"ما الذي لا تخبرك به لوحة ألوان البول وحدها؟"},"what_changed":["ظُنّ قديماً أن النظر في البول يكفي لمعرفة أمراض كثيرة؛ واليوم يكشف الشريط والمجهر والتحاليل ما لا تراه العين.","يظن كثيرون أن البول يسقط من الكلية إلى المثانة بثقله؛ والحالب في الحقيقة يدفعه بموجات عضلية."],"model_limits":["طريق البول في الرسم مكشوف وملوّن؛ في الحقيقة الحالبان خلف الأمعاء، والمثانة خلف عظم الحوض.","البالون يتمدد بالضغط وحده؛ جدار المثانة عضلات حيّة تتمدد وتحسّ وتنقبض بأمر.","لوحة ألوان البول دليل تقريبي: تختلف الألوان على الشاشات والورق، وتغيّرها أطعمة وفيتامينات وأدوية.","الإحليل في الرسم مبسّط واحد للجميع؛ شكله وطوله يختلفان بين الذكر والأنثى."],"faith":{"opening":null,"closing":{"text":"أن النبي ﷺ كان إذا خرج من الغائط قال: «غفرانك»","reference":"أبو داود 30","grade":"صحيح","usage":"قيمة","reflection":"حين يخرج البول نتخفف من شيء لو بقي لأضرّ بالجسم، وطريقه كله يعمل بلا أن نأمره: كليتان تصنعان، وحالبان يدفعان، ومثانة تخزّن، وعاصرة تنتظر قرارنا. وكان النبي ﷺ إذا خرج من مكان قضاء الحاجة يسأل الله المغفرة بكلمة واحدة: غفرانك. وذكر العلماء من معانيها أن نعم الله علينا أكبر من شكرنا، ومنها تيسير خروج ما يؤذي. فقضاء الحاجة ليس ذنباً ولا عيباً؛ إنه نعمة نشكرها، ثم نتطهّر ونغسل أيدينا. ما الذي ستقوله اليوم حين تخرج{|ين}؟","reviewed":false,"highlight":"غفرانك","full_verified":true,"level":"خبر","concept":"شكر نعمة تيسير الخروج، والأدب عند الخروج من الخلاء.","avoid":"لا نقول إن قضاء الحاجة ذنب يُستغفر منه، ولا نجعل الحديث دليلاً على علم الكلية؛ النص يعلّم الأدب والشكر.","matn_note":"المتن كاملاً كما في سنن أبي داود، كتاب الطهارة؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://en.tohed.com/hadith/abu-dawud/30/","text_compared_on":"2026-11-19","hadith_key":"abudawud:30","lead":"عن عائشة أم المؤمنين رضي الله عنها:","narration":true,"source":"أبو داود 30","grader":"صحّحه الألباني","cards":[]}},"life":[{"situation":"أستحيي أن أستأذن للذهاب إلى الحمام في أثناء الحصة، فأكتم حتى آخر اليوم.","science":"المثانة تتمدد وتخزّن، لكن الكتم ساعات طويلة كل يوم قد يُضعف عضلتها، ويجعلني أستعجل فلا أُفرغها كلها.","action":"أذهب في الاستراحة، وإن لم أستطع الانتظار أستأذن بهدوء؛ الذهاب إلى الحمام حق عادي.","value":"رعاية الجسد مقدَّمة على حياء في غير موضعه.","why":"لماذا أستأذن ولو استحييت؟ لأن الحياء الذي يضر جسدي ليس هو الحياء المطلوب. والنبي ﷺ نهى أن يصلي المرء وهو يدافع البول والغائط، لأن الحاجة تشغله وتؤذيه؛ فإن كان ذلك في الصلاة فالدرس أولى بألا نكتم فيه.","reference":"مسلم 560","hadith":["muslim:560"],"cards":[{"key":"muslim:560","lead":"عن عائشة رضي الله عنها قالت: سمعت رسول الله ﷺ يقول:","text":"لا صلاة بحضرة الطعام، ولا هو يدافعه الأخبثان","narration":false,"source":"مسلم 560","grade":"صحيح","grader":""}],"verses":[]},{"situation":"أخي الصغير ما زال يبلل فراشه أحياناً في الليل، وبعض أبناء عمي يضحكون عليه.","science":"التحكم في العاصرة مهارة يتعلمها الدماغ، وتأتي عند بعض الأطفال متأخرة في الليل؛ نحو طفل من كل عشرة في السابعة يبلل فراشه أحياناً، وليس ذلك كسلاً ولا عناداً، ومعظمهم يتجاوزه مع النمو.","action":"لا أضحك عليه ولا أخبر أحداً بسرّه، وأطمئنه، وأذكّره بلطف أن يذهب إلى الحمام قبل النوم، وأطلب من الكبار أن يمنعوا السخرية.","value":"الستر والرحمة بالصغير، ولا سخرية من أحد.","why":"لماذا لا نضحك؟ لأن جسمه لم يُكمل تعلّم مهارة بعد، كما تعلّمنا المشي خطوة بعد خطوة؛ والسخرية تؤلمه وتُخجله ولا تساعده. وفي سورة الحجرات نهانا الله عن السخرية من الناس، فقد يكون من نسخر منه خيراً منا.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]}],"open_questions":[{"q":"لماذا يتعلم بعض الأطفال التحكم في الليل متأخرين عن غيرهم مع أنهم أصحاء؟","why_open":"يتداخل نمو المثانة وإشارات الدماغ وعمق النوم والوراثة؛ يعرف العلماء أجزاء من الجواب، ولا يعرفون كيف تجتمع عند كل طفل."}],"notebook":{"draw":"ارسم{|ي} الجذع من الأمام بخط خفيف، ثم الكليتين في الأعلى قرب الظهر، وحالباً ينزل من كل كلية إلى المثانة في أسفل البطن، ثم الإحليل يخرج منها. {ضع|ضعي} حلقة صغيرة عند مخرج المثانة واكتب{|ي}: باب. ثم ارسم{|ي} سهماً صغيراً يمشي في الحالب كموجة. المستوى ب: {ارسم|ارسمي} سهماً من المثانة إلى الدماغ واكتب{|ي}: إشارة مبكرة.","label":["الكليتان","الحالبان","المثانة","العاصرة (الباب)","الإحليل","موجة عضلية","— ب: إشارة إلى الدماغ"],"write":"أشرح: كيف يصل البول إلى المثانة ولو كنت مستلقياً؟ ومن يقرر متى يخرج؟ ثم أكتب ماذا يخبرني لون البول، وما حدّ هذه الرسالة."},"imgs":[]};
