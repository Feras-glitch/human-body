const LD = {"id":"U10.L02","first":false,"title":"تغيّرات قادمة: البلوغ","driving_question":"{اسم}، في السنوات القادمة سيتغيّر جسمك{|ِ}، وقد يسبقك{|ِ} فيه صديقك{|ِ} أو يتأخر عنك{|ِ}. ما الذي سيتغيّر؟ ولماذا؟ وماذا يعني أن {تبلغ|تبلغي}؟","central_fact":"البلوغ سنوات يتحوّل فيها جسم الطفل إلى جسم كبير: يبدؤها الدماغ بهرمونات، ويختلف موعدها كثيراً بين الأطفال. تأتي الجميع طفرة في الطول وعرق أقوى رائحة وحب الشباب وشعر جديد، ولكل جنس تغيّراته الخاصة، وكلها طبيعية لا عيب فيها؛ وبالبلوغ يبدأ التكليف.","next":"U10.L03","nexts":[{"id":"U10.L03","gated":false}],"hook":{"text":"{اسم}، البلوغ في رأيك{|ِ}:","options":["شيء يحدث في يوم واحد","سنوات يتغيّر فيها الجسم خطوة خطوة","مرض يصيب بعض الناس","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","body"],"highlight":["brain","pituitary"],"zoom":"body"},"text":"{عرفت|عرفتِ} أن جسمك{|ِ} يكبر خلية خلية. وفي السنوات القادمة سيأتي تغيّر أكبر اسمه البلوغ: سنوات يتحوّل فيها جسم الطفل إلى جسم كبير. يبدؤه دماغك{|ِ} برسائل كيميائية في الدم اسمها هرمونات البلوغ، تزداد كثيراً في هذه السنوات فتأمر الجسم أن يتغيّر. يبدأ البلوغ عند البنات غالباً بين الثامنة والثالثة عشرة أو الرابعة عشرة، وعند الأولاد بين التاسعة والرابعة عشرة، ويستمر سنتين إلى خمس. ومن بدأ قبل أصدقائه أو بعدهم فهذا طبيعي؛ وإن {قلقت|قلقتِ} {فأخبر|فأخبري} أهلك{|ِ}، والطبيب يطمئنهم."},{"id":"E2","level":"A","atlas":{"layers":["skin","skeleton"],"highlight":["sweat_gland","oil_gland","growth_plate"],"zoom":"body"},"text":"تغيّرات تأتي الجميع، أولاداً وبنات: طفرة النمو، يطول فيها الجسم أسرع من أي وقت بعد الطفولة الأولى. وغدد العرق التي {عرفتها|عرفتِها} في درس الجلد تنشط وتُخرج مواد رائحتها أقوى، فاستحمام كل يوم بصابون لطيف، وملابس نظيفة كل يوم، ومزيل رائحة إن رأى أهلك{|ِ}. والغدد الدهنية تُخرج دهناً أكثر، فتظهر حبوب في الوجه ويصير الشعر دهنياً: نغسل الوجه بلطف، ولا نعصر الحبوب. ويظهر شعر جديد تحت الإبطين وفي أماكن أخرى. وهذا كله ليس قلة نظافة ولا عيباً، بل هرمونات تعمل."},{"id":"E3","level":"A","atlas":{"layers":["body"],"highlight":["puberty"],"zoom":"body"},"text":"ولكل جنس علامات البلوغ الخاصة به. {وللولد تغيّرات خاصة. أولها غالباً أن تكبر الخصيتان: عضوان من الأعضاء التناسلية يصنعان في البلوغ هرموناً اسمه التستوستيرون. ثم تأتي الطفرة، ويعرض الكتفان وتقوى العضلات، ويخشن صوتك وقد يتشقق أياماً، ويظهر شعر في وجهك. وقد تستيقظ يوماً فتجد في ثيابك الداخلية بللاً لزجاً خرج من العضو التناسلي وأنت نائم: هذا الاحتلام، جزء طبيعي من النمو، لا تتحكم فيه، ولا عيب فيه ولا مرض. أخبر أباك أو أمك، وتعلّم طهارته. والبنات أيضاً يمررن بتغيّرات خاصة بهن، يتعلمنها مع أهلهن، ونحترمها ولا نسخر منها.|وللبنت تغيّرات خاصة. أولها غالباً أن يبدأ الصدر ينمو، ثم تأتي الطفرة، ويعرض الوركان. وبعد نحو سنتين من بدء نمو الصدر يأتي الحيض: في جسمك عضو اسمه الرحم، وبجانبه المبيضان. كل شهر تقريباً تثخن بطانة الرحم بأمر الهرمونات، استعداداً لأن يحمل الجسم طفلاً حين تكبرين وتتزوجين؛ فإن لم يكن حمل خرجت هذه البطانة دماً من المهبل نحو خمسة أيام، ثم تعود بعد نحو شهر. يأتي أول حيض عند أكثر البنات نحو الثانية عشرة، وقد يكون قبلها أو بعدها، ولا ينتظم إلا بعد سنتين أو ثلاث. تستعملين فيه فوطاً صحية، ولا يمنعك من اللعب ولا من الحياة؛ أمر طبيعي لا عيب فيه. أخبري أمك من أول مرة، وتعلّمي طهارته. والأولاد أيضاً يمرون بتغيّرات خاصة بهم، يتعلمونها مع أهلهم، ونحترمها ولا نسخر منها.}"},{"id":"E4","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"head"},"text":"والمشاعر تتغيّر أيضاً. قد {تفرح|تفرحين} ثم {تحزن|تحزنين} بسرعة، أو {تغضب|تغضبين} من أمر صغير، أو {تقلق|تقلقين} من شكل جسمك{|ِ}، أو {تحب|تحبين} أن تُترك{|ي} وحدك{|ِ} أكثر من قبل. الهرمونات وتغيّرات الحياة تفسر هذا، وهو يهدأ مع الوقت. {تحدّث|تحدّثي} مع أحد والديك{|ِ} أو كبير موثوق، فإن طال الحزن أو القلق فهم يساعدونك{|ِ}. ولا {تقارن|تقارني} جسمك{|ِ} بجسم أحد، ولا {تسخر|تسخري} من حبوب في وجه زميل أو صوت يتشقق: كلنا نمر بهذا في موعده. وحاجتك{|ِ} إلى الخصوصية حق، كما {عرفت|عرفتِ} في درس «جسمي أمانة»."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["taklif"],"zoom":"body"},"text":"{والبلوغ في الإسلام بداية التكليف: يصير المسلم مسؤولاً أمام الله عن صلاته وصومه وطهارته. وقبله تتعوّد العبادات وتُثاب عليها ولا تؤاخذ بتركها. ومن أحكام الطهارة في البلوغ: إذا احتلمت فوجدت أثراً في ثيابك، اغتسلت غسلاً كاملاً قبل أن تصلي. وفي الشرع للبلوغ علامات أخرى تتعلمها مع أهلك ومعلّمك. وكما في الآية في الافتتاح: إذا بلغت استأذنت قبل أن تدخل على أهلك كما يستأذن الكبار.|والبلوغ في الإسلام بداية التكليف: تصير المسلمة مسؤولة أمام الله عن صلاتها وصومها وطهارتها. وقبله تتعوّدين العبادات وتُثابين عليها ولا تؤاخذين بتركها. ومن أحكام الطهارة في البلوغ: في أيام الحيض لا تصلين ولا تصومين، فإذا انقطع الدم اغتسلت غسلاً كاملاً وعدت إلى الصلاة؛ وما فاتك من صيام رمضان تقضينه بعده، أما الصلاة فلا تُقضى. وفي الشرع للبلوغ علامات أخرى تتعلمينها مع أهلك ومعلّمتك. وكما في الآية في الافتتاح: إذا بلغت استأذنت قبل أن تدخلي على أهلك كما يستأذن الكبار.}"},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["hypothalamus","pituitary"],"zoom":"head"},"text":"للمستوى ب: من يضغط زر البدء؟ جزء في الدماغ اسمه تحت المهاد يرسل هرموناً إلى الغدة النخامية التي تحته، فترسل الغدة النخامية هرمونين في الدم إلى {الخصيتين، فتصنعان التستوستيرون|المبيضين، فيصنعان الإستروجين}؛ وهذا يأمر الجسم بالتغيّرات. وكيف عرفنا أن في الجسم رسائل كيميائية أصلاً؟ في 1902 وجد العالمان بايليس وستارلنغ أن الأمعاء ترسل في الدم مادة تأمر البنكرياس بإفراز عصارته، ولو قُطعت الأعصاب؛ وفي 1905 سمّى ستارلنغ هذه الرسائل «هرمونات»، أي «المحرِّكات»."}],"practice":[{"id":"U10.L02.P1","after":"E1","objective":"U10.L02.O1","type":"choose","prompt":"من يبدأ البلوغ في الجسم؟","options":["المعدة حين نأكل كثيراً","الدماغ برسائل كيميائية اسمها الهرمونات","العضلات حين نتمرن","الجلد حين يحترق بالشمس"],"answer":1,"explanation":"الدماغ يبدأ البلوغ بهرمونات تأمر الجسم أن يتغيّر.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: الهرمون رسالة في الدم. من يرسلها؟","feedback_by_option":{"0":"الطعام لا يبدأ البلوغ.","2":"التمرين يقوّي العضلة، والبلوغ يبدأ من الدماغ.","3":"الشمس لا علاقة لها ببدء البلوغ."}},{"id":"U10.L02.P2","after":"E2","objective":"U10.L02.O2","type":"choose_reason","prompt":"زادت رائحة العرق عند صديقك{|ِ} في البلوغ. أفضل نصيحة:","options":["ألا يستحم كثيراً","استحمام يومي بصابون لطيف وملابس نظيفة كل يوم","أن يسخر منه الأصدقاء ليهتم","أن يتوقف عن الرياضة"],"answer":1,"explanation":"غدد العرق تنشط في البلوغ؛ النظافة اليومية تخفف الرائحة.","level":"A","feedback_wrong":"ما الذي يزيل البكتيريا والعرق؟","feedback_by_option":{"0":"الاستحمام اليومي يزيل البكتيريا التي تساعد في الرائحة.","2":"السخرية تجرح؛ النصيحة بلطف.","3":"الرياضة مفيدة؛ يستحم بعدها."},"detects":"M117"},{"id":"U10.L02.P3","after":"E3","objective":"U10.L02.O3","type":"sequence","prompt":"{رتّب|رتّبي} تغيّرات {الولد|البنت} في البلوغ بترتيبها الغالب.","options":["{تكبر الخصيتان|يبدأ الصدر ينمو}","تأتي طفرة النمو","{يخشن الصوت ويظهر شعر الوجه|يأتي الحيض بعد نحو سنتين}"],"answer":[0,1,2],"explanation":"{الخصيتان أولاً غالباً، ثم الطفرة، ثم خشونة الصوت وشعر الوجه.|الصدر أولاً غالباً، ثم الطفرة، ثم الحيض بعد نحو سنتين.}","level":"A","feedback_wrong":"ما أول علامة غالباً؟"},{"id":"U10.L02.P4","after":"E4","objective":"U10.L02.O4","type":"choose","prompt":"زميلك{|ِ} في وجهه حبوب كثيرة، وبعض الأولاد يسخرون منه. ماذا {تفعل|تفعلين}؟","options":["أضحك معهم","أقف معه وأقول إن هذا من البلوغ ويمر به الجميع","أبتعد عنه حتى لا يسخروا مني","أنصحه أن يعصر الحبوب"],"answer":1,"explanation":"كلنا نمر بالبلوغ في موعده؛ لا نسخر، ونقف مع زميلنا.","level":"A","feedback_wrong":"ما الذي يحفظ كرامة زميلك؟","feedback_by_option":{"0":"السخرية تجرح.","2":"الوقوف معه شجاعة وأمانة.","3":"عصر الحبوب يؤذي الجلد."}},{"id":"U10.L02.P5","after":"E5","objective":"U10.L02.O5","type":"choose","prompt":"{إذا احتلم الشاب فوجد أثراً، فقبل أن يصلي:|في أيام الحيض، المسلمة:}","options":["{يتوضأ فقط|تصلي وتصوم كالعادة}","{يغتسل غسلاً كاملاً|لا تصلي ولا تصوم، ثم تغتسل إذا انقطع الدم}","{يترك الصلاة ذلك اليوم|تقضي الصلاة كلها بعده}","{ينتظر حتى يجف الأثر|تغتسل كل يوم وتصلي}"],"answer":1,"explanation":"{الغسل الكامل من الاحتلام قبل الصلاة.|الحائض لا تصلي ولا تصوم، وتغتسل إذا انقطع الدم، وتقضي الصوم لا الصلاة.}","level":"A","feedback_wrong":"ما حكم الطهارة الذي {تعلّمته|تعلّمتِه}؟","feedback_by_option":{"0":"{الاحتلام يوجب الغسل لا الوضوء وحده.|الحائض لا تصلي ولا تصوم.}","2":"{لا يترك الصلاة؛ يغتسل ويصلي.|الصلاة لا تُقضى، والصوم يُقضى.}","3":"{لا ينتظر؛ يغتسل ثم يصلي.|الغسل حين ينقطع الدم.}"}}],"check":[{"id":"U10.L02.C1","objective":"U10.L02.O1","level":"A","type":"explain_open","prompt":"ما البلوغ؟ ومن يبدؤه في الجسم؟","answer":"سنوات يتحوّل فيها جسم الطفل إلى جسم كبير؛ يبدؤه الدماغ بهرمونات تأمر الجسم أن يتغيّر، ويختلف موعده من طفل لطفل.","rubric":"R1"},{"id":"U10.L02.C2","objective":"U10.L02.O1","level":"A","type":"true_false_why","prompt":"«كل الأطفال يبلغون في العمر نفسه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يبدأ عند البنات بين 8 و13 أو 14 وعند الأولاد بين 9 و14، وكل موعد في هذا المدى طبيعي.","rubric":"R1","alt":{"prompt":"«من يبلغ قبل أصدقائه فيه شيء خطأ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ المدى واسع وطبيعي، ويخبر أهله إن قلق."}},{"id":"U10.L02.C3","objective":"U10.L02.O2","level":"A","type":"explain_open","prompt":"{اذكر|اذكري} تغيّرين يأتيان الجميع في البلوغ، وعادة عناية لكل منهما.","answer":"العرق أقوى رائحة: استحمام يومي وملابس نظيفة. حب الشباب: غسل الوجه بلطف وعدم عصر الحبوب.","rubric":"R1"},{"id":"U10.L02.C4","objective":"U10.L02.O3","level":"A","type":"explain_open","prompt":"{اشرح|اشرحي} بكلماتك{|ِ} ما {الاحتلام|الحيض}، ولماذا لا عيب فيه.","answer":"{سائل يخرج من العضو التناسلي في النوم في البلوغ؛ طبيعي لا أتحكم فيه، وجزء من نموي، فأخبر أهلي وأغتسل قبل الصلاة.|دم يخرج من الرحم أياماً كل نحو شهر لأن بطانته تنزل إن لم يكن حمل؛ طبيعي صحي، فأخبر أمي وأتعلم طهارته.}","rubric":"R1"},{"id":"U10.L02.C5","objective":"U10.L02.O4","type":"fix_model","prompt":"قال طفل: «صوتي يتشقق ووجهي فيه حبوب، أنا أسوأ من الجميع ولن أكلم أحداً». {صحّح|صحّحي} له بلطف.","answer":"هذا من البلوغ، ويمر به الجميع في موعده، ويهدأ مع الوقت؛ لا تقارن نفسك بأحد، وتحدّث مع أهلك أو كبير موثوق.","level":"A","rubric":"R1"},{"id":"U10.L02.C6","objective":"U10.L02.O5","level":"A","type":"explain_open","prompt":"ما معنى أن البلوغ بداية التكليف؟ {واذكر|واذكري} حكماً من أحكام الطهارة فيه.","answer":"{أن يصير المسلم مسؤولاً عن صلاته وصومه وطهارته؛ ومن الأحكام: إذا احتلم فوجد أثراً اغتسل قبل أن يصلي.|أن تصير المسلمة مسؤولة عن صلاتها وصومها وطهارتها؛ ومن الأحكام: الحائض لا تصلي ولا تصوم، وتغتسل إذا انقطع الدم، وتقضي الصوم لا الصلاة.}","rubric":"R1"}],"concepts":[{"id":"puberty","term":{"ar":"البلوغ","en":"Puberty","zh":"青春期","pinyin":"qīngchūnqī","match":["البلوغ","بلوغ","تبلغ","تبلغي"]},"priority":"core","atlas":{"layer":"body","element":"puberty"},"card":{"A":"سنوات يتحوّل فيها جسم الطفل إلى جسم كبير، يبدؤها الدماغ بهرمونات؛ ويختلف موعدها من طفل لطفل.","B":"يبدأ غالباً بين 8 و13 عند البنات وبين 9 و14 عند الأولاد، ويستمر سنتين إلى خمس."}},{"id":"sex_hormones","term":{"ar":"هرمونات البلوغ","en":"Sex hormones","zh":"性激素","pinyin":"xìng jīsù","match":["هرمونات البلوغ","الهرمونات","هرمونات"]},"priority":"core","atlas":{"layer":"nervous","element":"pituitary"},"card":{"A":"رسائل كيميائية في الدم تأمر الجسم أن يتغيّر في البلوغ؛ تزداد كثيراً في هذه السنوات.","B":"عند الأولاد أهمها التستوستيرون، وعند البنات الإستروجين."}},{"id":"growth_spurt","term":{"ar":"طفرة النمو","en":"Growth spurt","zh":"生长突增","pinyin":"shēngzhǎng tūzēng","match":["طفرة النمو","الطفرة","طفرة"]},"priority":"core","atlas":{"layer":"skeleton","element":"growth_plate"},"card":{"A":"سنوات في البلوغ يطول فيها الجسم أسرع من أي وقت بعد الطفولة الأولى.","B":"تبلغ ذروتها عند البنات في المتوسط نحو الثانية عشرة، وعند الأولاد بعدهن بنحو سنتين."}},{"id":"signs_of_puberty","term":{"ar":"علامات البلوغ","en":"Signs of puberty","zh":"青春期征象","pinyin":"qīngchūnqī zhēngxiàng","match":["علامات البلوغ"]},"priority":"core","atlas":{"layer":"body","element":"puberty"},"card":{"A":"{عند الولد: تكبر الخصيتان أولاً، ثم يطول ويخشن صوته، ويحدث الاحتلام: سائل يخرج من العضو التناسلي في النوم، أمر طبيعي لا عيب فيه.|عند البنت: يبدأ الصدر ينمو أولاً، ثم تطول، وبعد نحو سنتين يأتي الحيض: دم يخرج من الرحم أياماً كل نحو شهر، أمر طبيعي لا عيب فيه.}","B":"وفي الشرع للبلوغ علامات يتعلمها الطفل مع أهله، منها {الاحتلام|الحيض}."}},{"id":"taklif","term":{"ar":"التكليف","en":"Religious accountability (taklif)","zh":"宗教责任","pinyin":"zōngjiào zérèn","match":["التكليف","مكلّف","مكلّفة"]},"priority":"core","atlas":{"layer":"body","element":"taklif"},"card":{"A":"أن يصير المسلم مسؤولاً أمام الله عن عباداته كالصلاة والصوم والطهارة، ويبدأ بالبلوغ.","B":"قبل البلوغ يتعوّد الطفل العبادات ويُثاب عليها، ولا يؤاخذ بتركها."}}],"experiment":{"title":"خط زمن البلوغ: متى يبدأ؟ ومتى ينتهي؟","materials":["ورقة طويلة ومسطرة","قلمان بلونين","دفتر الأطلس"],"steps":["{ارسم|ارسمي} خطاً أفقياً طويلاً، و{علّم|علّمي} عليه الأعمار من 8 إلى 17 بمسافات متساوية.","باللون الأول {ارسم|ارسمي} فوق الخط شريطاً للبنات: البدء بين 8 و13، وذروة الطفرة نحو 12، وأول حيض نحو 12 ويمكن قبله أو بعده، وتوقف الطول نحو 14 أو 15.","باللون الثاني {ارسم|ارسمي} تحت الخط شريطاً للأولاد: البدء بين 9 و14، وأسرع الطفرة بين 12 و15، وتوقف الطول نحو 16.","{ضع|ضعي} نجمة على عمرك{|ِ} اليوم.","{قارن|قارني} الشريطين، و{اكتب|اكتبي}: كم سنة بين بداية البنات وبداية الأولاد؟ وكم طول المدى الطبيعي للبدء؟"],"safety":["النشاط على الورق، ولا مقارنة بين أجسام أطفال حقيقيين.","لا يُسأل طفل عن علامات البلوغ في جسمه؛ النجمة على العمر فقط.","الأسئلة الشخصية تُسأل لولي الأمر في خلوة."],"expected":"شريط البنات يبدأ أبكر من شريط الأولاد بنحو سنة، وذروة الطفرة عند الأولاد بعد البنات بنحو سنتين؛ والمدى الطبيعي للبدء خمس سنوات أو ست، فالنجمة قد تقع قبل البدء أو فيه، وكل ذلك طبيعي.","explain":"البلوغ لا يأتي في يوم معين، بل في مدى واسع من السنوات، ولكل طفل موعده كما {عرفت|عرفتِ} في درس النمو. ولذلك لا نقارن أنفسنا بأصدقائنا، ونسأل أهلنا إن قلقنا.","record":"البنات يبدأن بين ___ و___ — الأولاد بين ___ و___ — الفرق نحو ___ سنة — عمري ___، وموقع النجمة: ___","alternatives":["من لا يستطيع الرسم: يقرأ الأعمار في المشهد ويحسب الفرق."]},"find_the_error":[{"id":"FE1","atlas_variant":"puberty_one_day","error":"ملصق: «البلوغ يحدث في ليلة واحدة»","answer":"البلوغ سنوات، من سنتين إلى خمس، تأتي تغيّراته خطوة خطوة","detects":"M118"},{"id":"FE2","atlas_variant":"early_is_wrong","error":"جملة في دفتر: «من يبلغ قبل أصدقائه فيه مرض»","answer":"البدء بين 8 و14 للبنات و9 و14 للأولاد طبيعي، والطبيب يقرر إن قلق الأهل","detects":"M115"},{"id":"FE3","atlas_variant":"acne_dirty","error":"تعليق: «حب الشباب سببه قلة النظافة»","answer":"السبب الأول هرمونات البلوغ التي تنشّط الغدد الدهنية؛ والنظافة تخففه","detects":"M117"}],"numbers":[{"text":"البلوغ يستمر سنتين إلى خمس سنوات: ليس في يوم ولا في شهر، بل خطوة خطوة.","source":["S2"]},{"text":"يبدأ البلوغ عند البنات بين 8 و13 أو 14 سنة، وعند الأولاد بين 9 و14: مدى واسع، وكل موعد فيه طبيعي.","source":["S1"]}],"true_size":[{"text":"الغدة النخامية التي تبدأ البلوغ في قاع دماغك{|ِ} بحجم حبة البازلاء تقريباً، وتحرّك جسمك{|ِ} كله.","source":["S2"]}],"animal":null,"organ_letter":{"from":"دماغك{|ِ}","text":"مرحباً، أنا دماغك{|ِ}. في قاعي جزء صغير اسمه الغدة النخامية، وسيأتي يوم أضغط فيه زر البدء: أرسل هرمونات البلوغ في الدم، فيبدأ جسمك{|ِ} يتحوّل خطوة خطوة إلى جسم كبير. لا {تقلق|تقلقي} إن سبقك{|ِ} صديقك{|ِ} أو {سبقته|سبقتِه}: لكل دماغ موعده. ستتقلب مشاعرك{|ِ} أحياناً، وهذا مني ومن الهرمونات، فحدّث{|ي} أهلك{|ِ}. {اعتنِ|اعتني} بجسمك{|ِ} كل يوم، ولا {تسخر|تسخري} من تغيّرات أحد. وحين {تبلغ|تبلغي} {تصير|تصيرين} {مكلّفاً|مكلّفةً}: هذه ثقة كبيرة، وأنا معك{|ِ}."},"history":[{"who":"وليم بايليس وإرنست ستارلنغ","origin":"إنجلترا","where_when":"إنجلترا، 1902؛ وكلمة «هرمون» 1905","did":"قطعا الأعصاب الواصلة إلى جزء من الأمعاء، فبقي البنكرياس يُفرز عصارته حين يصل إليه الطعام؛ فاستنتجا أن الأمعاء ترسل في الدم مادة سمّياها السكرتين. ثم استعمل ستارلنغ كلمة «هرمون» أول مرة، فبدأ علم الهرمونات.","did_not":"لم يكتشفا هرمونات البلوغ نفسها؛ اكتُشفت بعدهما بعقود. وكانت تجاربهما على الحيوان، وتجارب الحيوان اليوم تخضع لقواعد رحمة ومراجعة أخلاقية.","method_lesson":"أن تقطع طريقاً لتعرف هل الرسالة تمر منه: إن وصلت مع قطعه، فلها طريق آخر.","source":["S7"]}],"how_we_know":{"text":"كيف عرفنا أن رسائل كيميائية تحرّك الجسم؟ في 1902 قطع العالمان بايليس وستارلنغ الأعصاب الواصلة إلى جزء من الأمعاء، ومع ذلك بقي البنكرياس يُفرز عصارته حين يصل إليه الطعام. فاستنتجا أن الأمعاء ترسل مادة في الدم، لا رسالة في الأعصاب، وسمّياها السكرتين. وبعد ثلاث سنوات استعمل ستارلنغ كلمة «هرمون» أول مرة؛ ومن هنا عرفنا أن هرمونات أخرى هي التي تبدأ البلوغ.","limit_question":"لماذا لا يكفي العمر وحده لنعرف هل بدأ بلوغ طفل؟"},"what_changed":["كان كثير من الأهل يتركون الحديث عن البلوغ حتى يقع، فيفاجأ الطفل؛ واليوم ينصح الأطباء أن يعرف الطفل ما سيأتي قبل أن يأتي، بهدوء ومن أهله."],"model_limits":["الأعمار في الدرس مدى لكثير من الأطفال؛ لا تقول وحدها إن طفلاً بعينه مبكر أو متأخر، والطبيب وحده يقرر.","الدرس يذكر التغيّرات بترتيبها الغالب، وقد يختلف الترتيب من طفل لطفل.","سلسلة الرسائل في المستوى ب مبسّطة؛ في الجسم هرمونات أخرى تشارك."],"faith":{"opening":{"text":"وَإِذَا بَلَغَ ٱلْأَطْفَـٰلُ مِنكُمُ ٱلْحُلُمَ فَلْيَسْتَـْٔذِنُوا۟ كَمَا ٱسْتَـْٔذَنَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَـٰتِهِۦ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ","reference":"النور 59","grade":"قرآن","usage":"قيمة","reflection":"في درس «جسمي أمانة» {قرأت|قرأتِ} آية الاستئذان في أوقات ثلاثة. والآية التي أمامك{|ِ} تكمل: حين يكبر الصغار ويبلغون صاروا يستأذنون في كل وقت، كما يستأذن الكبار. فالبلوغ في القرآن بداية أدب جديد ومسؤولية جديدة. واليوم نتعلم ما يحدث في الجسم في البلوغ. الآية لا تشرح الهرمونات، والعلم لا يشرح الآية؛ لكن من عرف أن جسمه سيصير جسم كبير عرف أن أدبه سيكبر معه. كيف {ستستأذن|ستستأذنين} حين {تبلغ|تبلغين}؟","reviewed":false,"quran_key":"24:59","hl_words":[0,5],"highlight":"وإذا بلغ الأطفال منكم الحلم فليستأذنوا","level":"ترغيب","concept":"البلوغ بداية أدب جديد: البالغ يستأذن كما يستأذن الكبار.","avoid":"لا نشرح «الحلم» للطفل بأكثر من «البلوغ»، ولا نقول إن الآية تصف تغيّرات الجسم أو إن العلم أثبتها.","cards":[]},"closing":{"text":"رُفِع القلم عن ثلاثة: عن النائم حتى يستيقظ، وعن الصبي حتى يحتلم، وعن المجنون حتى يعقل","reference":"أبو داود 4403","grade":"صحيح","usage":"حكم","reflection":"الحديث في البطاقة يخبرنا أن ثلاثة لا يُكتب عليهم إثم: النائم حتى يستيقظ، والصبي حتى يبلغ، ومن فقد عقله حتى يعود إليه. فأنت{|ِ} الآن {تتعوّد|تتعوّدين} العبادات {وتُثاب|وتُثابين} عليها، وحين {تبلغ|تبلغين} {تصير|تصيرين} {مسؤولاً|مسؤولةً} عنها. هذه ليست ثقلاً بل ثقة: كما يأتمن الأب ابنه الكبير على أمر مهم. والحديث لا يتكلم عن الهرمونات، والعلم لا يشرحه؛ لكنه يجعل البلوغ يوماً كبيراً في حياة المسلم. ما العبادة التي {تحب|تحبين} أن {تتقنها|تتقنيها} قبل أن {تبلغ|تبلغي}؟","reviewed":false,"hadith_key":"abudawud:4403","highlight":"وعن الصبي حتى يحتلم","level":"خبر","concept":"البلوغ بداية التكليف: الصغير لا يؤاخذ، والبالغ مسؤول عن عباداته.","avoid":"لا نخوّف الطفل من التكليف، ولا نقول إن الصغير لا يُثاب؛ ولا نشرح «المجنون» بأكثر من «من فقد عقله»، ولا نقول إن العلم أثبت الحديث.","lead":"عن علي بن أبي طالب رضي الله عنه، عن النبي ﷺ قال:","narration":false,"source":"أبو داود 4403","grader":"صحّحه الألباني","cards":[]}},"life":[{"situation":"في الصف قرأ زميل جملة بصوت عالٍ فتشقق صوته، فضحك بعض الأولاد وقلّدوه.","science":"في البلوغ يتغيّر الصوت بأمر الهرمونات، وقد يتشقق أياماً ثم يستقر؛ ويمر به كل ولد في موعده.","action":"لا أضحك، وأقول لمن يضحك بهدوء: كلنا سنمر بهذا، وأشجّع زميلي أن يكمل.","value":"لا سخرية من تغيّرات أحد.","why":"لماذا لا أضحك وهو مضحك فعلاً؟ لأن الضحك على شيء لا يملكه صاحبه يجرحه. وفي الآية في البطاقة نهي عن السخرية من الناس، فقد يكون من نسخر منه خيراً منا.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]},{"situation":"{أريد أن أسأل أبي عن الاحتلام، لكني أستحي.|أريد أن أسأل أمي عن الحيض، لكني أستحي.}","science":"ما يحدث في البلوغ طبيعي يمر به كل الناس، والمعرفة قبل أن يأتي تجعله أسهل.","action":"{أختار وقتاً هادئاً، أو أكتب سؤالي في ورقة وأعطيها لأبي أو أمي.|أختار وقتاً هادئاً، أو أكتب سؤالي في ورقة وأعطيها لأمي.}","value":"الحياء لا يمنع السؤال عما ينفعنا.","why":"لماذا أسأل وأنا أستحي؟ لأن الحياء خلق جميل، لكنه لا يمنعنا أن نتعلم ما نحتاجه في أجسامنا وطهارتنا؛ وأهلنا أحق من يجيبنا.","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا يبدأ البلوغ في عمر معين، ولماذا صار يبدأ أبكر في بعض البلاد؟","why_open":"يعرف العلماء أن الوراثة والغذاء ووزن الجسم لها دور، لكن ما الذي يضغط «زر البدء» في الدماغ بالضبط ما زال يُبحث."}],"notebook":{"draw":"{ارسم|ارسمي} خط زمن البلوغ بشريطين: البنات والأولاد، و{ضع|ضعي} نجمة على عمرك{|ِ}. ثم {ارسم|ارسمي} ثلاث أيقونات لعادات العناية: صابون، وملابس نظيفة، ووجه يُغسل بلطف. المستوى ب: {ارسم|ارسمي} سلسلة الرسائل: الدماغ ← الغدة النخامية ← {الخصيتان|المبيضان} ← التغيّرات.","label":["البلوغ","هرمونات البلوغ","طفرة النمو","علامات البلوغ","التكليف","— ب: تحت المهاد، الغدة النخامية"],"write":"أشرح: ما البلوغ؟ ولماذا يختلف موعده؟ وما العادات التي أعتني بها بجسمي؟ وما معنى التكليف؟ وأكتب سؤالاً أحب أن أسأله لأبي أو أمي في خلوة."},"imgs":[]};
