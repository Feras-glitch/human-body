const LD = {"id":"U08.T03","lesson":"U08.L03","first":false,"title":"اختبار: السمع والتوازن والشم والذوق واللمس","lessonTitle":"السمع والتوازن والشم والذوق واللمس","concepts":[],"check":[],"items":[{"id":"U08.L03.A1.a","objective":"U08.L03.O1","level":"A","type":"choose_reason","prompt":"أُصيبت طبلة أذن رجل بثقب كبير، وأذنه الظاهرة سليمة. لماذا ضعف سمعه؟","options":["لأن الأذن الظاهرة لم تعد تلتقط الصوت","لأن الطبلة لم تعد تهتز جيداً فتنقل الصوت","لأن الشمع توقف","لأن التوازن اختل"],"answer":1,"explanation":"الطبلة تهتز وتنقل الاهتزاز إلى العظيمات؛ إن تمزقت ضعف النقل.","feedback_by_option":{"0":"الأذن الظاهرة سليمة وتلتقط الصوت؛ المشكلة بعدها.","2":"الشمع ينظف القناة، لا يسمع.","3":"التوازن في القنوات الهلالية، والسؤال عن السمع."},"detects":"M87","alt":{"prompt":"أيّ هذه ليس من محطات الصوت في الأذن؟","options":["الطبلة","العظيمات الثلاث","القوقعة","القنوات الهلالية"],"answer":3,"explanation":"القنوات الهلالية للتوازن؛ والصوت يمرّ بالطبلة والعظيمات والقوقعة.","feedback_by_option":{"0":"الطبلة أول ما يهتز.","1":"العظيمات تنقل الاهتزاز.","2":"القوقعة تحوّل الاهتزاز إلى رسائل."}}},{"id":"U08.L03.A1.b","objective":"U08.L03.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} طريق صوت الجرس حتى {تسمعه|تسمعينه}.","options":["الأذن الظاهرة تلتقط الصوت","الطبلة تهتز","العظيمات تنقل الاهتزاز","القوقعة تحوّله إلى رسائل","عصب السمع إلى الدماغ"],"answer":[0,1,2,3,4],"explanation":"الأذن الظاهرة، فالطبلة، فالعظيمات، فالقوقعة، ثم عصب السمع إلى الدماغ.","alt":{"prompt":"رتّب{|ي} من الخارج إلى الداخل.","options":["قناة الأذن","طبلة الأذن","الركاب","القوقعة"],"answer":[0,1,2,3],"explanation":"القناة ثم الطبلة في آخرها، ثم العظيمات وآخرها الركاب، ثم القوقعة في الأذن الداخلية."}},{"id":"U08.L03.A1.c","objective":"U08.L03.O1","level":"A","type":"true_false_why","prompt":"«شمع الأذن قذارة يجب إخراجها كل يوم بعود قطني». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تصنعه غدد القناة لتنظيفها وحمايتها من العدوى، وإدخال العود قد يدفعه إلى الداخل ويؤذي الطبلة.","rubric":"R1","alt":{"prompt":"«القوقعة تحوّل الاهتزاز إلى رسائل كهربائية». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يتموج سائلها فتنثني شعيرات على خلاياها فتتكون رسائل يحملها عصب السمع إلى الدماغ."}},{"id":"U08.L03.A2.a","objective":"U08.L03.O2","level":"A","type":"choose","prompt":"ما عضو التوازن في الأذن؟","options":["القنوات الهلالية","الطبلة","القوقعة","الأذن الظاهرة"],"answer":0,"explanation":"القنوات الهلالية الثلاث فيها سائل يخبر الدماغ بحركة الرأس.","feedback_by_option":{"1":"الطبلة للسمع.","2":"القوقعة للسمع؛ والقنوات الهلالية بجانبها للتوازن.","3":"الأذن الظاهرة تلتقط الصوت."},"alt":{"prompt":"بماذا تعرف القنوات الهلالية حركة الرأس؟","options":["بالضوء الداخل من العين","بسائل يتحرك فيثني شعيرات","بالصوت الذي يصلها","بعضلات تنقبض فيها"],"answer":1,"explanation":"السائل يتحرك مع الرأس فيثني شعيرات دقيقة تخبر الدماغ.","feedback_by_option":{"0":"العين تساعد التوازن، لكن القنوات تعمل بالسائل.","2":"الصوت للقوقعة.","3":"لا عضلات فيها تحسّ الحركة؛ السائل والشعيرات."}}},{"id":"U08.L03.A2.b","objective":"U08.L03.O2","level":"A","type":"true_false_why","prompt":"«الدوار بعد الدوران يأتي من سائل الأذن الداخلية الذي يظل يتحرك». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يبقى السائل يتحرك لحظات بعد التوقف، فيظن الدماغ أننا ما زلنا ندور.","rubric":"R1","alt":{"prompt":"«القوقعة هي عضو التوازن». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ القوقعة للسمع، والتوازن في القنوات الهلالية بجانبها."}},{"id":"U08.L03.A2.c","objective":"U08.L03.O2","level":"A","type":"explain_open","prompt":"لاعب التزلج يدور بسرعة ثم يقف ولا يدوخ كثيراً، و{أنت|أنتِ} {تدوخ|تدوخين}. اقترح{|ي} تفسيراً.","answer":"التدريب الطويل يعلّم دماغه أن يعتمد أكثر على عينيه وعضلاته وأن يقلل الثقة برسائل السائل بعد التوقف؛ وأي تفسير يربط الدوار بسائل القنوات والدماغ مقبول.","rubric":"R1"},{"id":"U08.L03.A3.a","objective":"U08.L03.O3","level":"A","type":"choose","prompt":"{تلبس|تلبسين} السماعات في الحافلة الصاخبة. ما الأفضل لسمعك{|ِ}؟","options":["رفع الصوت فوق الضجيج","الاستماع حتى تؤلم الأذن","تبديل الأذنين كل ساعة","خفض الصوت أو الانتظار لمكان أهدأ"],"answer":3,"explanation":"رفع الصوت فوق الضجيج يزيد الخطر؛ نخفضه أو ننتظر مكاناً أهدأ.","feedback_by_option":{"0":"هذا يرفع الصوت إلى حد يؤذي خلايا السمع.","1":"الأذى يحدث غالباً قبل الألم.","2":"الأذن الأخرى تتأذى أيضاً بالصوت العالي."},"detects":"M88","alt":{"prompt":"تقول منظمة الصحة العالمية إن 100 ديسيبل تُحتمل:","options":["ثماني ساعات","ربع ساعة","يوماً كاملاً","بلا حد"],"answer":1,"explanation":"100 ديسيبل لا تُحتمل أكثر من ربع ساعة؛ و85 حتى ثماني ساعات.","feedback_by_option":{"0":"ثماني ساعات لـ85 ديسيبل.","2":"يوم كامل يتلف خلايا السمع.","3":"لكل صوت عالٍ حد."}}},{"id":"U08.L03.A3.b","objective":"U08.L03.O3","level":"A","type":"true_false_why","prompt":"«خلايا السمع التي يتلفها الصوت العالي تنمو من جديد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ ما يتلف منها بالصوت العالي لا يعود، ولذلك نحميها قبل أن تتلف.","rubric":"R1","detects":"M88","alt":{"prompt":"«الراحة القصيرة من السماعات تحمي السمع». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تنصح منظمة الصحة العالمية بفترات راحة قصيرة وبأقل من ساعة يومياً بالسماعات."}},{"id":"U08.L03.A3.c","objective":"U08.L03.O3","level":"A","type":"explain_open","prompt":"أخوك{|ِ} يسمع الأناشيد بالسماعات ساعتين كل ليلة بصوت عالٍ. ماذا {تقترح|تقترحين} عليه؟ ولماذا؟","answer":"يخفض الصوت، ويقلل الاستماع إلى أقل من ساعة، ويأخذ راحة، ولا ينام والسماعات في أذنيه؛ لأن الصوت العالي الطويل يتلف خلايا السمع تلفاً لا يعود.","rubric":"R1"},{"id":"U08.L03.A4.a","objective":"U08.L03.O4","level":"A","type":"choose_reason","prompt":"عند الزكام يبدو الأرز بلا طعم. لماذا؟","options":["لأن براعم التذوق تنام مع الزكام","لأن الأرز يفقد طعمه","لأن الرائحة لا تصل إلى أعلى الأنف","لأن اللسان ينتفخ"],"answer":2,"explanation":"جزء كبير مما نسميه طعماً رائحة تصعد إلى الأنف؛ والزكام يسدها.","feedback_by_option":{"0":"البراعم تعمل؛ الذي غاب هو الرائحة.","1":"الأرز كما هو؛ الذي تغيّر هو أنفك.","3":"اللسان سليم غالباً مع الزكام."},"detects":"M89","alt":{"prompt":"ما النكهة؟","options":["الطعم وحده","الرائحة وحدها","لون الطعام","الذوق والشم معاً"],"answer":3,"explanation":"يجمع الدماغ الذوق والرائحة نكهة واحدة.","feedback_by_option":{"0":"الطعم جزء منها فقط.","1":"الرائحة جزء منها فقط.","2":"اللون قد يغيّر توقعنا، لكن النكهة ذوق وشم."},"detects":"M89"}},{"id":"U08.L03.A4.b","objective":"U08.L03.O4","level":"A","type":"true_false_why","prompt":"«للسان مناطق: الحلو في طرفه فقط، والمر في آخره فقط». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ كل موضع فيه براعم تذوق يحسّ الطعوم الخمسة كلها، والفروق بين المواضع صغيرة جداً.","rubric":"R1","detects":"M86","alt":{"prompt":"«الطعم الخامس، اللذيذ (أومامي)، طعم كطعم المرق». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الطعوم الخمسة: الحلو والمالح والحامض والمر واللذيذ."}},{"id":"U08.L03.A4.c","objective":"U08.L03.O4","level":"A","type":"choose","prompt":"كم طعماً أساسياً تحسّه براعم التذوق؟","options":["طعمين","خمسة","أربعة فقط","مئات"],"answer":1,"explanation":"خمسة: الحلو والمالح والحامض والمر واللذيذ (أومامي).","feedback_by_option":{"0":"أكثر من ذلك.","2":"كان يُقال أربعة، ثم أُضيف الخامس.","3":"الروائح مئات وآلاف؛ الطعوم الأساسية خمسة."},"alt":{"prompt":"أين توجد براعم التذوق؟","options":["في الأنف","في الأسنان","على اللسان وفي سقف الحلق وأعلى الحلق","في المعدة"],"answer":2,"explanation":"على اللسان وفي سقف الحلق اللين وأعلى الحلق.","feedback_by_option":{"0":"في الأنف مستقبلات الروائح.","1":"الأسنان تقطع وتطحن.","3":"المعدة تهضم ولا تتذوق."}}},{"id":"U08.L03.A5.a","objective":"U08.L03.O5","level":"B","type":"choose_reason","prompt":"لماذا {تميّز|تميّزين} نقطتين على طرف الإصبع ولا {تميّزهما|تميّزينهما} على الظهر بالمسافة نفسها؟","options":["لأن جلد الظهر أسمك فقط","لأن الظهر بعيد عن الدماغ","لأن الإصبع أدفأ","لأن مستقبلات الإصبع أكثر بكثير"],"answer":3,"explanation":"في طرف الإصبع نحو مئة ضعف مستقبلات الظهر، فتقع كل نقطة على مستقبل مختلف.","feedback_by_option":{"0":"السبب الأهم عدد المستقبلات.","1":"البعد يؤخر الرسالة قليلاً، ولا يدمج النقطتين.","2":"الحرارة لا تفسر الفرق؛ عدد المستقبلات يفسره."},"alt":{"prompt":"على الذراع نميّز نقطتين إذا تباعدتا نحو:","options":["35–40 مم","2–3 مم","متر","لا نميّزهما أبداً"],"answer":0,"explanation":"على الذراع 35–40 مم، وعلى طرف الإصبع 2–3 مم.","feedback_by_option":{"1":"هذا لطرف الإصبع.","2":"أقل من ذلك بكثير.","3":"نميّزهما إذا تباعدتا بما يكفي."}}},{"id":"U08.L03.A5.b","objective":"U08.L03.O5","level":"B","type":"true_false_why","prompt":"«لأطراف الأصابع مساحة كبيرة في الدماغ تناسب كثرة مستقبلاتها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كلما كثرت المستقبلات في موضع كبرت المساحة التي تستقبل رسائله في الدماغ.","rubric":"R1","alt":{"prompt":"«عدد مستقبلات اللمس واحد في كل جلد الجسم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ في طرف الإصبع نحو مئة ضعف ما في الظهر."}},{"id":"U08.L03.A5.c","objective":"U08.L03.O5","level":"B","type":"explain_open","prompt":"ممرضة تريد أن تعرف هل يحسّ مريض في قدمه. لماذا تلمس أصابع قدمه لا ظهر ساقه؟ (فكّر{|ي} في المستقبلات)","answer":"لأن الأصابع فيها مستقبلات أكثر فتعطي إحساساً أدق، فيظهر الفرق إن ضعف الإحساس؛ وأي تفسير يربط الاختيار بكثرة المستقبلات مقبول.","rubric":"R1"},{"id":"U08.L03.A6.a","objective":"U08.L03.O6","level":"B","type":"choose","prompt":"كيف عرف بيكيشي ما يحدث في القوقعة؟","options":["خمّنه من شكلها","شاهد اهتزاز أغشيتها بالمجهر وصوّرها","سأل الناس عما يسمعون","قاس حرارة الأذن"],"answer":1,"explanation":"راقب الأغشية بالمجهر وصوّرها صوراً متتابعة، ونال نوبل 1961.","feedback_by_option":{"0":"لم يكتفِ بالتخمين؛ شاهد وصوّر.","2":"السؤال لا يكشف ما يجري داخل القوقعة.","3":"الحرارة لا تكشف الاهتزاز."},"alt":{"prompt":"ماذا وجد باك وأكسل سنة 1991؟","options":["أن اللسان مناطق للطعوم","أن الأذن تحفظ التوازن","جينات كثيرة تصنع مستقبلات الروائح","أن الكلب لا يشم"],"answer":2,"explanation":"وجدا عائلة من نحو ألف جين تصنع مستقبلات الروائح، ونالا نوبل 2004.","feedback_by_option":{"0":"هذه الخريطة الخاطئة.","1":"هذا معروف قبلهما، وليس عملهما.","3":"الكلب أقوى شماً منا بكثير."}}},{"id":"U08.L03.A6.b","objective":"U08.L03.O6","level":"B","type":"choose_reason","prompt":"لماذا صدّق الناس خريطة اللسان عشرات السنين؟","options":["لأنها رُسمت بوضوح ونُقلت بلا فحص","لأن كل من جرّبها وجدها صحيحة","لأن اللسان تغيّر","لأن العلماء كذبوا عمداً"],
