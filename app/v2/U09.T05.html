بها الطبيب لشخص بعينه","ورقة لكل الأسرة","إعلان عن دواء","قائمة طعام"],"answer":0,"explanation":"لشخص بعينه: أي دواء، وكم، ومتى.","feedback_by_option":{"1":"ليست للأسرة كلها.","2":"ليست إعلاناً.","3":"ليست طعاماً."}}},{"id":"U09.L05.A2.b","objective":"U09.L05.O2","level":"A","type":"true_false_why","prompt":"«نحفظ ما بقي من المضاد الحيوي للزكام القادم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا نحفظه لوقت لاحق، ونأخذه كما وُصف؛ والزكام من فيروس لا يعمل عليه المضاد الحيوي.","rubric":"R1","alt":{"prompt":"«المضاد الحيوي يعمل على البكتيريا لا على الفيروسات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ولذلك لا يشفي الزكام والإنفلونزا."}},{"id":"U09.L05.A2.c","objective":"U09.L05.O2","level":"A","type":"explain_open","prompt":"عند جدتك{|ِ} دواء، وتقول: «خذ منه، نفعني كثيراً». كيف {ترد|تردين} بأدب؟","answer":"أشكرها بلطف، وأقول إن الطبيب كتبه لها بمقدار يناسبها، وإني آخذ دوائي من يد أبي أو أمي بحسب الطبيب.","rubric":"R1"},{"id":"U09.L05.A3.a","objective":"U09.L05.O3","level":"A","type":"choose_reason","prompt":"لماذا لا نقول لطفل صغير إن الدواء حلوى؟","options":["لأنه قد يبحث عنه ويأكل منه","لأن الحلوى غالية","لأن الدواء مرّ","لأن الطفل لا يحب الحلوى"],"answer":0,"explanation":"قد يظنه حلوى فيأخذ منه وحده.","feedback_by_option":{"1":"السعر ليس السبب.","2":"بعض الأدوية حلوة الطعم، وهذا يزيد الخطر.","3":"أكثر الأطفال يحبون الحلوى."},"detects":"M145","alt":{"prompt":"بعد كل مرة نعطي فيها الدواء:","options":["نغلق غطاء الأمان ونعيده عالياً","نتركه على الطاولة","نضعه بجانب السرير","نتركه مفتوحاً"],"answer":0,"explanation":"نغلق الغطاء ونعيده عالياً.","feedback_by_option":{"1":"يصل إليه الصغير.","2":"قريب من يده.","3":"الغطاء يُغلق."}}},{"id":"U09.L05.A3.b","objective":"U09.L05.O3","level":"A","type":"true_false_why","prompt":"«المنظفات تُحفظ مثل الأدوية بعيداً عن الصغار». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الصغار يستكشفون بأفواههم، والمنظفات قد تؤذيهم.","rubric":"R1","alt":{"prompt":"«تاريخ الانتهاء لا يهم ما دام الدواء في علبته». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا يُستعمل الدواء بعد تاريخ الانتهاء، ويقرؤه الكبير."}},{"id":"U09.L05.A3.c","objective":"U09.L05.O3","level":"A","type":"explain_open","prompt":"زارتكم خالتك{|ِ} ومعها ابنها الصغير، ووضعت حقيبتها على الأرض وفيها أدويتها. ماذا {تقترح|تقترحين} بلطف؟ ولماذا؟","answer":"أن تضع الحقيبة في مكان عالٍ، لأن الصغير قد يفتحها ويأخذ من الأدوية.","rubric":"R1"},{"id":"U09.L05.A4.a","objective":"U09.L05.O4","level":"A","type":"choose_reason","prompt":"ماذا تقول الأكاديمية الأمريكية لطب الأطفال عن مشروبات الطاقة للأطفال؟","options":["لا مكان لها في غذائهم","تعطيهم طاقة كالطعام","مفيدة قبل الامتحان","مثل الماء"],"answer":0,"explanation":"الكافيين والمنبّهات فيها لا مكان لها في غذاء الأطفال.","feedback_by_option":{"1":"الطاقة من الطعام والنوم.","2":"التركيز من النوم والفطور.","3":"الماء أول المشروبات، وهي ليست مثله."},"detects":"M146","alt":{"prompt":"الكافيين:","options":["مادة منبّهة في القهوة والشاي والكولا","فيتامين","نوع من الماء","بروتين"],"answer":0,"explanation":"مادة منبّهة.","feedback_by_option":{"1":"ليس فيتاميناً.","2":"ليس ماء.","3":"ليس بروتيناً."}}},{"id":"U09.L05.A4.b","objective":"U09.L05.O4","level":"A","type":"true_false_why","prompt":"«مشروب الطاقة يعطي الجسم طاقة مثل وجبة متوازنة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الطاقة من الطعام والنوم، ومشروب الطاقة فيه منبّه كثير لا يحتاجه الأطفال.","rubric":"R1","alt":{"prompt":"«الشاي والكولا فيهما كافيين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكافيين في القهوة والشاي والكولا، وكثير جداً في مشروبات الطاقة."}},{"id":"U09.L05.A4.c","objective":"U09.L05.O4","level":"A","type":"explain_open","prompt":"{صمّم|صمّمي} لوحة لنادي الرياضة: ماذا يشرب اللاعبون؟ ولماذا؟","answer":"الماء أولاً، قبل اللعب وبعده؛ لا مشروبات طاقة لأن فيها منبّهاً لا مكان له في غذاء الأطفال.","rubric":"R1"},{"id":"U09.L05.A5.a","objective":"U09.L05.O5","level":"B","type":"choose","prompt":"من شروط ابن سينا لاختبار الدواء:","options":["أن يتكرر أثره في أكثر الحالات","أن يكون لونه جميلاً","أن يُجرَّب مرة واحدة","أن يكون غالياً"],"answer":0,"explanation":"تكرر الأثر في كل الحالات أو أكثرها.","feedback_by_option":{"1":"اللون لا يهم.","2":"المرة الواحدة لا تكفي.","3":"الثمن لا يدل على النفع."},"alt":{"prompt":"لماذا اشترط ابن سينا التجربة على الإنسان؟","options":["لأن الحيوان قد يختلف عنه","لأن الحيوان لا يمرض","لأن الإنسان أكبر","لأن الحيوان يرفض الدواء"],"answer":0,"explanation":"بدن الحيوان قد يتأثر بالدواء بطريقة أخرى.","feedback_by_option":{"1":"الحيوان يمرض.","2":"الحجم ليس السبب.","3":"ليس هذا السبب."}}},{"id":"U09.L05.A5.b","objective":"U09.L05.O5","level":"B","type":"true_false_why","prompt":"«بنى ابن سينا شروطه على نظرية الأخلاط التي تركها العلم اليوم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كان يقسم الأمراض إلى حارة وباردة، والتجارب اليوم فيها مجموعات للمقارنة.","rubric":"R1","alt":{"prompt":"«تجربة مرة واحدة على شخص واحد تكفي لنعرف أن الدواء نافع». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ ربما شُفي وحده أو لسبب آخر؛ نحتاج حالات كثيرة ومقارنة."}},{"id":"U09.L05.A5.c","objective":"U09.L05.O5","level":"B","type":"explain_open","prompt":"لماذا لا يعرف المريض في التجربة اليوم هل أخذ الدواء أم لا؟","answer":"لأن من يظن أنه أخذ دواء قد يشعر بتحسن من ظنه؛ فإذا لم يعرف كانت المقارنة أعدل.","rubric":"R1"}],"transfer":[{"id":"U09.L05.T1","objective":"U09.L05.O3","type":"explain_open","prompt":"أسرتك{|ِ} ذاهبة في رحلة، وأمك{|ِ} تحزم الحقائب ومعها أدوية الأسرة، وأختك{|ِ} الصغيرة معكم. {اقترح|اقترحي} ثلاث قواعد للأدوية في الرحلة.","answer":"الأدوية في حقيبة يحملها الكبير بعيداً عن الصغيرة؛ الأغطية مغلقة؛ لا نقول للصغيرة إنها حلوى، ونعرف رقم الطوارئ في المكان.","level":"A","rubric":"R1"},{"id":"U09.L05.T2","objective":"U09.L05.O1","type":"explain_open","prompt":"رأيت{|ِ} إعلاناً يقول: «هذا الدواء يشفي كل الأمراض!». ماذا {تقول|تقولين} عنه بما {تعلمت|تعلمتِ}؟","answer":"لا دواء يشفي كل الأمراض؛ لكل دواء عمل ومقدار يحدده الطبيب، ونسأل: هل جُرب اختباراً عادلاً؟","level":"A","rubric":"R1"}],"recall":[{"id":"U09.L05.D1","objective":"U09.L05.O1","type":"choose","prompt":"الدواء آخذه من:","options":["يد كبير أثق به","صديق","علبة وجدتها"],"answer":0,"explanation":"من يد كبير بحسب الطبيب.","level":"A","feedback_by_option":{"1":"لا.","2":"لا."}},{"id":"U09.L05.D2","objective":"U09.L05.O2","type":"choose","prompt":"المضاد الحيوي للزكام:","options":["لا يعمل عليه","يشفيه","يمنعه"],"answer":0,"explanation":"الزكام من فيروس.","level":"A","feedback_by_option":{"1":"لا يعمل على الفيروس.","2":"لا يمنعه."}},{"id":"U09.L05.D3","objective":"U09.L05.O3","type":"choose","prompt":"الدواء يُحفظ:","options":["عالياً بعيداً عن الصغار","على الطاولة","بجانب السرير"],"answer":0,"explanation":"عالياً بعيداً عن الأيدي والأعين.","level":"A","feedback_by_option":{"1":"في متناولهم.","2":"قريب منهم."}},{"id":"U09.L05.D4","objective":"U09.L05.O4","type":"choose","prompt":"أول المشروبات:","options":["الماء","مشروب الطاقة","الكولا"],"answer":0,"explanation":"الماء.","level":"A","feedback_by_option":{"1":"ليس للأطفال.","2":"فيها كافيين وسكر."}},{"id":"U09.L05.D5","objective":"U09.L05.O5","type":"choose","prompt":"نعرف أن الدواء نافع إذا:","options":["تكرر أثره في حالات كثيرة","جربه شخص مرة","كان غالياً"],"answer":0,"explanation":"تكرر الأثر في حالات كثيرة.","level":"B","feedback_by_option":{"1":"لا يكفي.","2":"الثمن ليس دليلاً."}}]};
