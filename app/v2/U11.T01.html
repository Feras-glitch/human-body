لا تتغير في الجري.","2":"لون الدم لا يتغير هكذا.","3":"الدم يُصنع في نخاع العظم، لا في العضلة."},"alt":{"prompt":"في العضلة المستريحة، كثير من الشعيرات:","options":["مغلق","مقطوع","مليء بالهواء","مليء بالعرق"],"answer":0,"explanation":"كثير منها مغلق، وينفتح حين تعمل العضلة.","feedback_by_option":{"1":"الشعيرات سليمة، لكنها مغلقة.","2":"الهواء في الرئتين لا في الشعيرات.","3":"العرق في غدد الجلد."}}},{"id":"U11.L01.A2.a","objective":"U11.L01.O2","level":"A","type":"choose_reason","prompt":"لماذا {تعرق|تعرقين} في الجري؟","options":["لأن الجسم مريض ويحتاج إلى دواء","لأن الماء زاد في الجسم فخرج الزائد","لأن العضلات صنعت حرارة","لأن الجلد اتّسخ بالغبار في الملعب"],"answer":2,"explanation":"العضلات وهي تنقبض تصنع حرارة، وتبخّر العرق يبرّد الجلد.","feedback_by_option":{"0":"العرق في الجري عمل صحيح من الجسم.","1":"العرق يُنقص الماء ولا يخرج لأن الماء زاد.","3":"العرق للتبريد لا للتنظيف."},"detects":"M121","alt":{"prompt":"من يأمر غدد العرق بالعمل؟","options":["تحت المهاد","المعدة بعد الطعام","العظام الطويلة","الرئتان في الصدر"],"answer":0,"explanation":"تحت المهاد يقيس الحرارة ويأمر بالعرق.","feedback_by_option":{"1":"المعدة تهضم الطعام.","2":"العظام تحمل الجسم.","3":"الرئتان تُدخلان الهواء."}}},{"id":"U11.L01.A2.b","objective":"U11.L01.O2","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} سلسلة الماء في يوم لعب حار.","options":["العرق يُخرج ماءً من الجسم","يتركز الدم","يشعر الدماغ فيأتي العطش","تستعيد الكليتان الماء فيغمق البول"],"answer":[0,1,2,3],"explanation":"العرق أولاً، فيتركز الدم، فيشعر الدماغ، فيأتي العطش وتحفظ الكليتان الماء.","alt":{"type":"choose","prompt":"بعد العرق الكثير، ماذا تفعل الكليتان؟","options":["تُخرجان بولاً أكثر وأفتح","تستعيدان الماء","تتوقفان عن العمل حتى المساء","تصنعان عرقاً للجلد"],"answer":1,"explanation":"تستعيدان الماء من البول فيقل ويغمق.","feedback_by_option":{"0":"هذا عكس ما يحدث حين يقل الماء.","2":"الكليتان تعملان، وتحفظان الماء.","3":"العرق من غدد الجلد."}}},{"id":"U11.L01.A2.c","objective":"U11.L01.O2","level":"A","type":"choose_reason","prompt":"متى {تشرب|تشربين} الماء في يوم مباراة حار؟","options":["قبل اللعب وفيه وبعده","بعد أن تنتهي المباراة وأعود إلى البيت","حين يدور رأسي من التعب والحر","لا أشرب حتى المساء كي لا أثقل"],"answer":0,"explanation":"يُنصح بالشرب قبل اللعب وفي أثنائه وبعده، خاصة في الحر.","feedback_by_option":{"1":"الجسم يفقد الماء في أثناء اللعب، فالشرب قبله وفيه يمنع الجفاف.","2":"الدوار علامة جفاف؛ الأحسن ألا نصل إليه.","3":"الانتظار طويلاً يُتعب الجسم ويُغمق البول."},"detects":"M122","alt":{"prompt":"بعد اللعب صار بولك{|ِ} غامقاً. ماذا {تفعل|تفعلين}؟","options":["أشرب ماءً","أشرب مشروباً غازياً","أمتنع عن الشرب","ألعب أكثر"],"answer":0,"explanation":"البول الغامق علامة أن الجسم يحتاج ماءً.","feedback_by_option":{"1":"المشروبات الغازية فيها سكر كثير؛ الماء أحسن.","2":"الجسم يحتاج ماءً لا امتناعاً.","3":"الجسم يحتاج أن يعوّض الماء أولاً."}}},{"id":"U11.L01.A3.a","objective":"U11.L01.O3","level":"A","type":"choose","prompt":"ما التعافي؟","options":["أن يتوقف القلب عن العمل بعد الجري","أن يعود النبض والتنفس إلى حدهما","أن نجري أسرع من أصدقائنا في الملعب","أن نشرب ماءً كثيراً قبل أن نبدأ الجري"],"answer":1,"explanation":"التعافي ما يحدث بعد الجهد: يهدأ النبض والتنفس، وتنزل الحرارة، ويعوّض الجسم ما نقص.","feedback_by_option":{"0":"القلب لا يتوقف؛ يهدأ إلى سرعة الراحة.","2":"هذا جهد لا تعافٍ.","3":"الشرب قبل الجري وقاية، والتعافي بعد التوقف."},"alt":{"prompt":"بعد خمس دقائق من الراحة، النبض:","options":["يبقى في أعلاه طوال اليوم","يقترب من نبض الراحة","يتوقف قليلاً ثم يعود","يصير أسرع مما كان في الجري"],"answer":1,"explanation":"يقترب من نبض الراحة؛ هذا التعافي.","feedback_by_option":{"0":"الجسم يعيد النبض إلى حده.","2":"القلب لا يتوقف.","3":"النبض يهدأ بعد التوقف."}}},{"id":"U11.L01.A3.b","objective":"U11.L01.O3","level":"A","type":"true_false_why","prompt":"«النوم بعد يوم نشيط وقت ضائع لا يفيد العضلات». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العضلات تُصلح نفسها وتقوى في الراحة والنوم بعد الجهد، والأطفال النشيطون ينامون أفضل.","rubric":"R1","alt":{"prompt":"«ستون دقيقة من الحركة في اليوم توصية منظمة الصحة العالمية لمن في عمري». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ستون دقيقة على الأقل في المتوسط من نشاط متوسط إلى شديد."}},{"id":"U11.L01.A3.c","objective":"U11.L01.O3","level":"A","type":"explain_open","prompt":"{صمّم|صمّمي} يوماً نشيطاً لنفسك{|ِ} فيه ثلاث عادات، و{فسّر|فسّري} كل عادة بجهاز من أجهزة الجسم.","answer":"ساعة لعب تسرّع النفس لأن القلب والعضلات تقوى بالاستعمال؛ ماء قبل اللعب وفي أثنائه وبعده لأن العرق يُخرج الماء والكليتان تحفظه؛ نوم كافٍ لأن العضلات تُصلح نفسها فيه.","rubric":"R1"},{"id":"U11.L01.A4.a","objective":"U11.L01.O4","level":"A","type":"choose_reason","prompt":"يريد ماجد أن يقارن نبضه قبل الجري وبعده مقارنة عادلة. ماذا يفعل؟","options":["يعدّ مرة 15 ثانية ومرة دقيقة كاملة","يعدّ قبل الجري ثم ينتظر ساعة بعده","يعدّ الزمن نفسه في المرتين","يعدّ نبض صديقه بعد الجري ويقارنه بنبضه"],"answer":2,"explanation":"المقارنة العادلة: الطريقة نفسها والزمن نفسه، ولا يتغير إلا الجري.","feedback_by_option":{"0":"زمنان مختلفان يجعلان الأرقام غير قابلة للمقارنة.","1":"بعد ساعة يكون التعافي قد أعاد النبض.","3":"لكل جسم نبضه؛ يقارن نفسه بنفسه."},"alt":{"prompt":"لماذا نعدّ النبض مرة ثالثة بعد خمس دقائق من الراحة؟","options":["لنرى التعافي","لنتعب أكثر","لأن العدّ الأول خطأ","لنقارن بصديقنا"],"answer":0,"explanation":"العدّ الثالث يُظهر التعافي: عودة النبض نحو حده.","feedback_by_option":{"1":"الراحة لا تُتعب.","2":"العدّ الأول هو البداية للمقارنة.","3":"نقارن أنفسنا بأنفسنا."}}},{"id":"U11.L01.A4.b","objective":"U11.L01.O4","level":"A","type":"true_false_why","prompt":"«بعد الجري زاد النبض والتنفس والعرق، فالسبب عضو واحد هو الرئتان». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النبض من القلب، والتنفس من الرئتين بأمر الدماغ، والعرق من الجلد بأمر تحت المهاد؛ كلها أجهزة تعمل معاً لأن العضلات عملت.","rubric":"R1","detects":"M119","alt":{"prompt":"«لكي نفهم ما يحدث في الجري نحتاج أن ننظر إلى أكثر من جهاز». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدماغ والعضلات والرئتان والقلب والجلد والكليتان كلها تتغير معاً."}},{"id":"U11.L01.A4.c","objective":"U11.L01.O4","level":"A","type":"explain_open","prompt":"قاست ليلى: قبل القفز نبض 90 وأنفاس 20، بعده نبض 150 وأنفاس 40، بعد 5 دقائق نبض 100 وأنفاس 22. {فسّر|فسّري} الأرقام الثلاثة.","answer":"قبل القفز أرقام الراحة؛ بعده زاد النبض والتنفس لأن العضلات طلبت أكسجيناً أكثر؛ بعد الراحة اقتربت الأرقام من البداية، وهذا التعافي.","rubric":"R1"},{"id":"U11.L01.A5.a","objective":"U11.L01.O5","level":"B","type":"choose","prompt":"الاتزان الداخلي هو:","options":["أن يقف الجسم على قدم واحدة مدة طويلة","أن يحفظ الجسم ما في داخله في حدود ثابتة","أن يأكل الجسم كثيراً كلما تعب من اللعب","أن يتوقف الجسم عن الحركة حين يتعب كثيراً"],"answer":1,"explanation":"الاتزان الداخلي: حفظ ما في الداخل في حدود ثابتة، والأجهزة تتعاون عليه.","feedback_by_option":{"0":"هذا توازن الوقوف؛ الاتزان الداخلي لما في الداخل.","2":"الأكل يعوّض الطاقة، والاتزان أوسع من ذلك.","3":"الحركة تُخرج أشياء عن حدها، والاتزان يعيدها."},"alt":{"prompt":"أي هذه مثال على الاتزان الداخلي؟","options":["العرق يعيد الحرارة إلى حدها","القفز على قدم واحدة في الساحة","لعب الكرة مع الأصدقاء بعد المدرسة","النظر في المرآة بعد الاستحمام"],"answer":0,"explanation":"العرق يعيد الحرارة إلى حدها.","feedback_by_option":{"1":"هذا توازن الحركة.","2":"اللعب نشاط، والاتزان ما يفعله الجسم بعده.","3":"لا علاقة له بما في الداخل."}}},{"id":"U11.L01.A5.b","objective":"U11.L01.O5","level":"B","type":"true_false_why","prompt":"«كروغ عرف أن الشعيرات تنفتح في العضلة العاملة بتخمين بلا تجربة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ حقن حبراً أسود في دم الحيوانات فتلوّنت الشعيرات المفتوحة، وعدّها بالمجهر في عضلة مستريحة وعاملة.","rubric":"R1","alt":{"prompt":"«نال كروغ جائزة نوبل لاكتشافه ضبط الشعيرات في العضلات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نالها سنة 1920 لهذا الاكتشاف."}},{"id":"U11.L01.A5.c","objective":"U11.L01.O5","level":"B","type":"explain_open","prompt":"{أعط|أعطي} مثالين من الجري على الاتزان الداخلي، و{اذكر|اذكري} الجهاز الذي يعيد كل شيء إلى حده.","answer":"الحرارة ترتفع فيعيدها العرق وتقريب الدم من الجلد (الجلد وتحت المهاد)؛ الماء ينقص فيعيده العطش والكليتان ه."}},{"id":"U11.L01.D5","objective":"U11.L01.O5","type":"choose","prompt":"حفظ الجسم حرارته وماءه في حدود ثابتة اسمه:","options":["الاتزان الداخلي","انقسام الخلايا","هضم الطعام في المعدة"],"answer":0,"explanation":"الاتزان الداخلي.","level":"B","feedback_by_option":{"1":"الانقسام تكاثر الخلايا.","2":"الهضم تكسير الطعام."}}]};
