.","rubric":"R1"},{"id":"U03.L02.A3.a","objective":"U03.L02.O3","level":"A","type":"choose","prompt":"ما لون الدم في الأوردة؟","options":["أزرق","أحمر داكن","بنفسجي","شفاف"],"answer":1,"explanation":"الدم في الأوردة أحمر داكن، لأنه ترك جزءاً من أكسجينه للخلايا؛ وليس أزرق.","feedback_by_option":{"0":"الدم أحمر دائماً: فاتح حين يكثر فيه الأكسجين، وداكن حين يقلّ. الأزرق في الرسوم رمز فقط.","2":"الدم ليس بنفسجياً؛ يخرج من الوريد أحمر داكناً.","3":"الدم ليس شفافاً؛ يخرج من الوريد أحمر داكناً."},"detects":"M04","alt":{"prompt":"في المختبر يُسحب دم من وريد الذراع في أنبوب مغلق. ما لونه؟","options":["أحمر داكن","أزرق","أحمر فاتح كدم الشريان","أخضر"],"answer":0,"explanation":"دم الوريد أحمر داكن لأنه ترك جزءاً من أكسجينه للخلايا، ويبقى أحمر في الأنبوب المغلق؛ فليس الهواء ما يجعله أحمر.","feedback_by_option":{"1":"الدم لا يكون أزرق أبداً، ولو كان في أنبوب مغلق بعيداً عن الهواء.","2":"دم الوريد ترك جزءاً من أكسجينه للخلايا، فهو أدكن من دم الشريان.","3":"الدم ليس أخضر؛ هو أحمر، فاتح أو داكن."},"detects":"M04"}},{"id":"U03.L02.A3.b","objective":"U03.L02.O3","level":"A","type":"choose_reason","prompt":"لماذا تبدو أوردة اليد مزرقّة؟","options":["لأن الدم فيها أزرق","لأنها باردة","لأن الجلد يعكس الضوء الأزرق أكثر","لأنها فارغة"],"answer":2,"explanation":"الدم في الوريد أحمر داكن؛ أما الزرقة فسببها الضوء والجلد الذي يمر فيه، لا لون الدم.","detects":"M04","feedback_by_option":{"0":"الدم في الوريد أحمر داكن؛ الزرقة يصنعها الضوء والجلد الذي يمر فيه.","1":"البرودة لا تغيّر لون الدم؛ الزرقة من الضوء والجلد.","3":"الأوردة مملوءة بالدم؛ ولو كانت فارغة لما ظهرت."},"alt":{"prompt":"تبدو الأوردة على ظهر اليد مزرقّة. والدم الذي فيها:","options":["أزرق، لأن الأوردة تحمل الفضلات","أحمر داكن، والزرقة من الضوء والجلد","أزرق، لأن الوريد بارد","بلا لون، والجلد يلوّنه"],"answer":1,"explanation":"الدم في الوريد أحمر داكن؛ أما الزرقة فمن الضوء الذي يمرّ في الجلد ويعود منه، لا من لون الدم.","feedback_by_option":{"0":"الفضلات لا تلوّن الدم بالأزرق؛ الدم في الوريد أحمر داكن.","2":"البرودة لا تجعل الدم أزرق.","3":"للدم لون: أحمر، فاتح أو داكن."},"detects":"M04"}},{"id":"U03.L02.A3.c","objective":"U03.L02.O3","level":"A","type":"true_false_why","prompt":"«الأزرق في رسوم الدورة الدموية علامة مقصودة على الدم القليل الأكسجين، لا لونه الحقيقي». صح أم خطأ؟","answer":"صح؛ بشرط أن نعرف أنه ترميز؛ الدم نفسه أحمر دائماً.","rubric":"R2","alt":{"prompt":"«الأوردة تبدو مزرقّة لأن الدم فيها أزرق». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الدم في الأوردة أحمر داكن، والزرقة من الضوء والجلد الذي يمرّ فيه.","detects":"M04"}},{"id":"U03.L02.A4.a","objective":"U03.L02.O4","level":"B","type":"sequence","prompt":"رتّب{|ي} الدورة الجهازية ابتداءً من البطين الأيسر.","options":["البطين الأيسر","الأبهر","شعيرات الجسم","الوريدان الأجوفان","الأذين الأيمن"],"answer":[0,1,2,3,4],"explanation":"البطين الأيسر يدفع الدم في الأبهر إلى شعيرات الجسم، ثم يعود في الوريدين الأجوفين إلى الأذين الأيمن.","alt":{"prompt":"رتّب{|ي} طريق الدم من الأذين الأيسر إلى أن يعود إلى القلب.","options":["الأذين الأيسر","البطين الأيسر","الأبهر","شعيرات الجسم","الوريدان الأجوفان","الأذين الأيمن"],"answer":[0,1,2,3,4,5],"explanation":"من الأذين الأيسر ينزل الدم إلى البطين الأيسر، فيدفعه في الأبهر إلى شعيرات الجسم، ثم يعود في الوريدين الأجوفين إلى الأذين الأيمن."}},{"id":"U03.L02.A4.b","objective":"U03.L02.O4","level":"B","type":"choose","prompt":"أين يأخذ الدم الأكسجين؟","options":["في شعيرات العضلات","في القلب","في الأبهر","في شعيرات الرئتين"],"answer":3,"explanation":"يأخذ الدم الأكسجين في شعيرات الرئتين، ويتركه للخلايا في شعيرات الجسم.","feedback_by_option":{"0":"في شعيرات العضلات يترك الدم أكسجينه، لا يأخذه.","1":"الدم يمر بالقلب ليُدفع، ولا يأخذ فيه أكسجيناً.","2":"الأبهر يحمل دماً أخذ أكسجينه قبل أن يصله، وجداره سميك لا يعبره شيء."},"alt":{"prompt":"أين يترك الدم أكسجينه للخلايا؟","options":["في الأبهر","في شعيرات الرئتين","في شعيرات الجسم","في القلب"],"answer":2,"explanation":"في شعيرات الجسم يترك الدم أكسجينه للخلايا، ثم يعود إلى القلب فالرئتين ليأخذ أكسجيناً جديداً.","feedback_by_option":{"0":"جدار الأبهر سميك لا يعبره ا
