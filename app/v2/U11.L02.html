<script>
const LD = {"id":"U11.L02","first":false,"title":"الدخان والجسم كله","driving_question":"{اسم}، الدخان يدخل من الفم إلى الرئتين فقط. فلماذا يقول الأطباء إنه يؤذي الجسم كله: القلب والدم والدماغ أيضاً؟","central_fact":"الدخان يدخل من الرئتين لكنه يصل إلى الجسم كله: يؤذي الأهداب والحويصلات، وأول أكسيد الكربون يقلل الأكسجين في الدم فيتعب القلب، والنيكوتين يصل إلى الدماغ بسرعة فيسرّع القلب ويصنع الإدمان. ودخان الآخرين والشيشة والسيجارة الإلكترونية ليست آمنة.","next":"U11.L03","nexts":[{"id":"U11.L03","gated":false}],"hook":{"text":"{اسم}، الدخان يدخل الرئتين. فإلى أين يصل أذاه في رأيك{|ِ}؟","options":["إلى الرئتين","إلى الجسم كله تقريباً","لا يؤذي شيئاً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["respiratory","circulatory","nervous"],"highlight":["lungs","heart","brain"],"zoom":"body"},"text":"في درس الهواء {عرفت|عرفتِ} أن الدخان يؤذي الأهداب التي تنظف مجاري الهواء، والحويصلات التي يعبر منها الأكسجين. لكن الرئة ليست آخر الطريق. في دخان التبغ أكثر من سبعة آلاف مادة كيميائية، ومن الحويصلات تعبر بعضها إلى الدم، والدم يجري في الجسم كله، كما {عرفت|عرفتِ} في درس القلب. ولهذا يقول الأطباء إن التدخين يؤذي أعضاء الجسم كلها تقريباً، لا الرئتين وحدهما. فالأجهزة فريق، وما يؤذي واحداً يصل إلى الباقين."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["red_cells","heart"],"zoom":"blood"},"text":"من مواد الدخان غاز سام بلا لون ولا رائحة اسمه أول أكسيد الكربون. حين يصل إلى الدم يأخذ مكاناً في الخلايا الحمراء كان للأكسجين، فتحمل أكسجيناً أقل. {تذكّر|تذكّري} ما {تعلمته|تعلمتِه} في درس الجري: العضلات والقلب نفسه يحتاجون الأكسجين. فإذا قلّ في الدم تعب القلب وهو يحاول أن يوصل ما يكفي، وتعبت العضلات أسرع؛ ولهذا يلهث المدخّن في الرياضة أسرع من غيره."},{"id":"E3","level":"A","atlas":{"layers":["nervous","circulatory"],"highlight":["brain","heart"],"zoom":"body"},"text":"وفي التبغ مادة اسمها النيكوتين. بعد نَفَس الدخان تصل إلى الدماغ بسرعة كبيرة، فتجعل الجسم يُطلق الأدرينالين الذي {عرفته|عرفتِه} في درس الخوف، فيسرع القلب ويرتفع ضغط الدم، ومع الوقت تضيق الأوعية. ثم يتعلم الدماغ أن يطلب النيكوتين مرة بعد مرة، ويصعب على صاحبه أن يتركه مع أنه يعرف ضرره. هذا هو الإدمان. وقد يبدأ عند الصغار في أيام من أول مرة، ودماغ الصغير أسرع تأثراً من دماغ الكبير. فلا يوجد «سيجارة واحدة فقط»، والأسهل ألا نبدأ."},{"id":"E4","level":"A","atlas":{"layers":["respiratory"],"highlight":["lungs"],"zoom":"body"},"text":"وماذا عمن لا يدخّن؟ الدخان الذي يتنفسه من حول المدخّن اسمه دخان الآخرين، ولا قدر منه آمن؛ وهو عند الأطفال يسبب التهابات في الصدر والأذن، ويُحدث نوبات الربو. والشيشة دخان أيضاً: الماء فيها لا ينقّيه، وجلسة ساعة فيها دخان أكثر من سيجارة واحدة بمئة مرة أو أكثر، والفحم فيها يُطلق أول أكسيد الكربون. والسيجارة الإلكترونية ليست بخار ماء: تسخّن سائلاً فيه في الغالب نيكوتين ونكهات ومواد أخرى، فيخرج رذاذ فيه مواد سامة."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"فماذا {تفعل|تفعلين}؟ إن عرض عليك{|ِ} أحد سيجارة أو سيجارة إلكترونية {فقل|فقولي}: لا، شكراً؛ و{تستطيع|تستطيعين} أن {تذكر|تذكري} سبباً، أو أن {تبتعد|تبتعدي} عمن لا يحترم اختيارك{|ِ}. وإن كان في بيتك{|ِ} من يدخّن فهو يحبك{|ِ} و{تحبه|تحبينه}، وربما يحاول أن يترك؛ فاطلب{|ي} منه بلطف ألا يدخّن في الغرفة أو السيارة، و{ادعُ|ادعي} له، ولا {تسخر|تسخري} منه ولا {تحاضره|تحاضريه}. نحب الشخص ونكره ما يؤذيه."},{"id":"E6","level":"B","atlas":{"layers":["respiratory"],"highlight":["lungs"],"zoom":"body"},"text":"للمستوى ب: كيف عرف العلماء أن التدخين يسبب سرطان الرئة؟ سنة 1950 سأل ريتشارد دول وأوستن برادفورد هيل في إنجلترا مرضى بسرطان الرئة ومرضى آخرين عن التدخين، فوجدا التدخين أكثر عند مرضى الرئة. لكن السؤال بعد المرض قد يُخطئ؛ فبدآ سنة 1951 دراسة المتابعة: سألا آلاف الأطباء من يدخّن منهم، ثم تابعا أكثر من أربعة وثلاثين ألفاً منهم خمسين سنة، وقارنا ما حدث للمدخّنين بما حدث لغيرهم."}],"practice":[{"id":"U11.L02.P1","after":"E1","objective":"U11.L02.O1","type":"choose","prompt":"كيف يصل أذى الدخان من الرئتين إلى القلب والدماغ؟","options":["يمشي في الأعصاب من الرئة إلى الدماغ","تعبر مواده إلى الدم","يخرج من الأنف إليهما مع الهواء","لا يصل إليهما بشيء مهما كثر"],"answer":1,"explanation":"بعض مواد الدخان تعبر من الحويصلات إلى الدم، والدم يجري في الجسم كله.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: من الحويصلات إلى أين يعبر الأكسجين؟","feedback_by_option":{"0":"الأعصاب تحمل الرسائل لا الدخان.","2":"الأنف طريق الهواء إلى الرئتين.","3":"يصل بالدم، والتدخين يؤذي الأعضاء كلها تقريباً."},"detects":"M127"},{"id":"U11.L02.P2","after":"E2","objective":"U11.L02.O1","type":"choose_reason","prompt":"لماذا يلهث المدخّن في الرياضة أسرع؟","options":["لأن عضلاته أكبر وأثقل من عضلات زملائه","لأن الأكسجين في دمه أقل","لأنه يشرب ماءً أكثر قبل المباراة","لأن قلبه أصغر من قلوب اللاعبين الآخرين"],"answer":1,"explanation":"أول أكسيد الكربون يقلل الأكسجين الذي تحمله الخلايا الحمراء، فيتعب القلب والعضلات أسرع.","level":"A","feedback_wrong":"ماذا يأخذ أول أكسيد الكربون مكانه في الدم؟","feedback_by_option":{"0":"العضلات ليست السبب؛ الأكسجين أقل.","2":"الماء لا يسبب اللهاث.","3":"حجم القلب لا يتغير هكذا."}},{"id":"U11.L02.P3","after":"E3","objective":"U11.L02.O2","type":"choose_reason","prompt":"قال صديق: «سأجرّب سيجارة واحدة، وأتوقف متى شئت». ما الصحيح؟","options":["صحيح، الواحدة لا تؤثر في الجسم ولا الدماغ","الإدمان قد يبدأ في أيام","الإدمان لا يصيب إلا الكبار في العمر","التوقف سهل على كل الناس إن أرادوا"],"answer":1,"explanation":"قد يبدأ الإدمان في أيام عند الصغار، ويصعب الترك بعده؛ والأسهل ألا نبدأ.","level":"A","feedback_wrong":"هل يتأثر دماغ الصغير أسرع أم أبطأ؟","feedback_by_option":{"0":"الدماغ يتعلم الطلب بسرعة.","2":"الصغار يدمنون أسرع من الكبار.","3":"الترك صعب، وقد يحتاج محاولات وعوناً."},"detects":"M128"},{"id":"U11.L02.P4","after":"E4","objective":"U11.L02.O3","type":"choose","prompt":"أي هذه الجمل صحيحة؟","options":["الماء في الشيشة ينقّي الدخان","السيجارة الإلكترونية بخار ماء فقط","لا قدر آمن من دخان الآخرين","دخان غيري لا يصل إليّ"],"answer":2,"explanation":"لا قدر آمن من دخان الآخرين، والماء لا ينقّي دخان الشيشة، والسيجارة الإلكترونية رذاذ فيه مواد سامة.","level":"A","feedback_wrong":"{فكّر|فكّري} في كل جملة: ماذا قال القياس؟","feedback_by_option":{"0":"الماء لا يرشّح الدخان.","1":"فيها في الغالب نيكوتين ومواد سامة.","3":"يصل ويؤذي، خاصة الأطفال."},"detects":"M130"},{"id":"U11.L02.P5","after":"E5","objective":"U11.L02.O2","type":"sequence","prompt":"{رتّب|رتّبي} حلقة الإدمان.","options":["يصل النيكوتين إلى الدماغ","يشعر المدخّن براحة قصيرة","يقل النيكوتين فيطلبه الدماغ","يدخّن مرة أخرى"],"answer":[0,1,2,3],"explanation":"يصل النيكوتين، ثم راحة قصيرة، ثم يقل فيطلبه الدماغ، فيدخّن مرة أخرى؛ وهكذا تدور الحلقة.","level":"A","feedback_wrong":"ما الذي يحدث أولاً بعد النفَس؟"}],"check":[{"id":"U11.L02.C1","objective":"U11.L02.O1","type":"explain_open","prompt":"{اشرح|اشرحي} بكلماتك{|ِ}: لماذا يؤذي الدخان القلب مع أنه يدخل الرئتين؟","answer":"لأن مواده تعبر من الحويصلات إلى الدم، ومنها أول أكسيد الكربون الذي يقلل الأكسجين في الخلايا الحمراء، فيتعب القلب؛ والنيكوتين يسرّع القلب ويضيّق الأوعية.","level":"A","rubric":"R1"},{"id":"U11.L02.C2","objective":"U11.L02.O2","type":"true_false_why","prompt":"«المدخّن يستطيع أن يترك متى أراد، فلماذا لا يتركه؟». صح أم خطأ أن الترك سهل؟ ولماذا؟","answer":"خطأ؛ النيكوتين يصنع الإدمان، فيطلبه الدماغ مرة بعد مرة، والترك صعب وقد يحتاج محاولات وعوناً؛ فنساعد ولا نلوم.","level":"A","rubric":"R1"},{"id":"U11.L02.C3","objective":"U11.L02.O3","type":"fix_model","prompt":"قال سامر: «الشيشة أخف لأن الدخان يمر بالماء، والسيجارة الإلكترونية بخار ماء». {صحّح|صحّحي} له.","answer":"الماء لا ينقّي دخان الشيشة، وجلسة ساعة فيها دخان أكثر من سيجارة بكثير؛ والسيجارة الإلكترونية رذاذ فيه نيكوتين ومواد سامة، لا بخار ماء.","level":"A","rubric":"R1"},{"id":"U11.L02.C4","objective":"U11.L02.O4","type":"explain_open","prompt":"عرض عليك{|ِ} ولد أكبر منك{|ِ} سيجارة إلكترونية وقال: «جرّبها، الكل يفعل». ماذا {تقول|تقولين} و{تفعل|تفعلين}؟","answer":"أقول: لا، شكراً، لا أريد أن يتعلم دماغي طلب النيكوتين؛ وأبتعد، وأخبر كبيراً موثوقاً إن تكرر الأمر.","level":"A","rubric":"R1"},{"id":"U11.L02.C5","objective":"U11.L02.O3","type":"true_false_why","prompt":"«إذا دخّن أبي في السيارة والنوافذ مفتوحة قليلاً فلا يصلني شيء». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا قدر آمن من دخان الآخرين، وبعضه يبقى في السيارة؛ فأطلب بلطف ألا يدخّن فيها.","level":"A","rubric":"R1"},{"id":"U11.L02.C6","objective":"U11.L02.O4","type":"explain_open","prompt":"لماذا لا نسخر من قريب يدخّن؟","answer":"لأنه قد يكون مدمناً يحاول أن يترك، والسخرية تؤذيه ولا تساعده؛ نحبه ونكره ما يؤذيه، ونطلب بلطف وندعو له.","level":"A","rubric":"R1"}],"concepts":[{"id":"nicotine","term":{"ar":"النيكوتين","en":"Nicotine","zh":"尼古丁","pinyin":"nígǔdīng","match":["النيكوتين","نيكوتين"]},"priority":"core","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"مادة في التبغ وفي أكثر السجائر الإلكترونية، تصل إلى الدماغ بسرعة، وتسرّع القلب، وتجعل الجسم يطلبها مرة بعد مرة.","B":"تحرّك في الدماغ دوائر المكافأة، فيتعلم الدماغ أن يطلبها؛ ودماغ الصغير أسرع تأثراً بها."}},{"id":"carbon_monoxide","term":{"ar":"أول أكسيد الكربون","en":"Carbon monoxide","zh":"一氧化碳","pinyin":"yīyǎnghuàtàn","match":["أول أكسيد الكربون"]},"priority":"core","atlas":{"layer":"circulatory","element":"red_cells"},"card":{"A":"غاز سام بلا لون ولا رائحة في دخان التبغ ودخان الفحم، يقلل الأكسجين الذي تحمله الخلايا الحمراء.","B":"يلتصق بالمادة التي تحمل الأكسجين في الخلية الحمراء أقوى من الأكسجين نفسه."}},{"id":"addiction","term":{"ar":"الإدمان","en":"Addiction","zh":"成瘾","pinyin":"chéngyǐn","match":["الإدمان","يدمن","مدمن"]},"priority":"core","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"أن يطلب الجسم والدماغ مادة مرة بعد مرة، ويصعب تركها مع معرفة ضررها.","B":"المدمن يحتاج عوناً وطبيباً لا لوماً؛ والترك ممكن وقد يحتاج محاولات."}},{"id":"secondhand_smoke","term":{"ar":"دخان الآخرين","en":"Secondhand smoke","zh":"二手烟","pinyin":"èrshǒuyān","match":["دخان الآخرين","دخان غيرك","دخان غيري"]},"priority":"core","atlas":{"layer":"respiratory","element":"lungs"},"card":{"A":"الدخان الذي يتنفسه من لا يدخّن حين يدخّن غيره قربه. لا قدر منه آمن.","B":"يبقى بعضه في الغرفة والسيارة والملابس بعد أن يُطفأ."}},{"id":"cohort_study","term":{"ar":"دراسة المتابعة","en":"Cohort study","zh":"队列研究","pinyin":"duìliè yánjiū","match":["دراسة المتابعة"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"دراسة تتابع مجموعة من الناس سنوات طويلة، وتقارن ما يحدث لمن يفعل شيئاً بما يحدث لمن لا يفعله.","B":"أقوى من سؤال الناس مرة واحدة، لأنها تعرف ما فعلوه قبل أن يمرضوا."}}],"experiment":{"title":"الماصّة الضيقة: كيف يصير التنفس أصعب؟ (نموذج)","materials":["ماصّة شرب عادية لكل طفل","ساعة فيها ثوانٍ","دفتر الأطلس"],"steps":["{اجلس|اجلسي} و{تنفس|تنفسي} عادياً دقيقة، و{لاحظ|لاحظي} كيف تشعر رئتاك{|ِ}.","{أمسك|أمسكي} أنفك{|ِ} بلطف، و{تنفس|تنفسي} من الماصّة وحدها عشرين ثانية وأنت{|ِ} {جالس|جالسة}.","{توقف|توقفي} فوراً إن شعرت{|ِ} بدوار أو ضيق، و{تنفس|تنفسي} عادياً.","{اكتب|اكتبي}: كيف كان التنفس من الماصّة؟ وماذا {تتخيل|تتخيلين} لو كانت مجاري الهواء ضيقة كل يوم؟"],"safety":["من عنده ربو أو مرض في القلب أو الرئة لا يجرّب النشاط، ويكتفي بالمشاهدة أو بقياسات المشهد.","عشرون ثانية فقط وأنت جالس، ولا يُجرّب في الجري ولا في الحر؛ ونتوقف فوراً عند أي دوار.","ماصّة لكل طفل لا تُتبادل؛ ولا نستعمل دخاناً حقيقياً ولا نقترب منه."],"expected":"التنفس من الماصّة أصعب: نحتاج جهداً أكبر، وقد نشعر أن الهواء لا يكفي.","explain":"هذا نموذج: الدخان يؤذي الأهداب ويهيّج مجاري الهواء، ومع السنين قد تضيق وتتعب الرئتان، كما {عرفت|عرفتِ} في درس الهواء. لكن النموذج لا يُظهر الباقي: أول أكسيد الكربون الذي يقلل الأكسجين في الدم، والنيكوتين الذي يسرّع القلب ويصنع الإدمان.","record":"التنفس العادي: سهل / صعب — من الماصّة: سهل / صعب — ما شعرت به: ___ — ما لا يُظهره النموذج: ___","alternatives":["من لا يجرّب النشاط: يشاهد ويصف ما يقوله زملاؤه.","تحليل إعلان متخيَّل لسيجارة إلكترونية بالأسئلة الأربعة من U11.L03."]},"find_the_error":[{"id":"FE1","atlas_variant":"smoke_lungs_only","error":"لوحة: الدخان يؤذي الرئتين فقط","answer":"يصل بالدم إلى القلب والأوعية والدماغ، ويؤذي الأعضاء كلها تقريباً","detects":"M127"},{"id":"FE2","atlas_variant":"vape_water","error":"إعلان: بخار ماء بنكهة الفراولة","answer":"رذاذ فيه في الغالب نيكوتين ومواد سامة، لا بخار ماء","detects":"M129"},{"id":"FE3","atlas_variant":"one_cigarette","error":"جملة: سيجارة واحدة لا تضر وأتوقف متى شئت","answer":"قد يبدأ الإدمان في أيام عند الصغار، والأسهل ألا نبدأ","detects":"M128"}],"numbers":[{"text":"في دخان التبغ أكثر من سبعة آلاف مادة كيميائية.","source":["S1"]},{"text":"جلسة شيشة ساعة واحدة فيها دخان أكثر من سيجارة واحدة بمئة إلى مئتي مرة.","source":["S7"]}],"true_size":[{"text":"في نفَس واحد من دخان التبغ مواد كثيرة لا تُرى، أكثر من سبعة آلاف نوع؛ والذي يُرى منه، الدخان الرمادي، جزء صغير مما يدخل.","source":["S1"]}],"animal":null,"organ_letter":{"from":"الرئتان","text":"مرحباً، نحن رئتاك{|ِ}. نُدخل لك{|ِ} الهواء كل يوم أكثر من عشرين ألف مرة، وأهدابنا الصغيرة تكنس ما يدخل معه. الدخان يتعب أهدابنا ويهيّج أنابيبنا، ولا يقف عندنا: يعبر منا إلى الدم، فيصل إلى صديقنا القلب وإلى الدماغ. فإن عرض عليك{|ِ} أحد دخاناً {فقل|فقولي}: لا، شكراً، و{ابتعد|ابتعدي}. وإن كان من تحبه{|ين} يدخّن، فاطلب{|ي} منه بلطف أن يدخّن بعيداً عنك{|ِ}، و{ادعُ|ادعي} له أن يتركه. نحن نعمل لك{|ِ} طول العمر، فاحفظنا."},"history":[{"who":"ريتشارد دول وأوستن برادفورد هيل","origin":"إنجلترا","where_when":"لندن، 1950؛ ودراسة الأطباء البريطانيين 1951–2001","did":"قارنا التدخين بين مرضى بسرطان الرئة ومرضى آخرين، ثم سألا عشرات آلاف الأطباء عن التدخين وتابعاهم خمسين سنة، فثبتت صلة التدخين بسرطان الرئة وأمراض التنفس والقلب.","did_not":"لم يجرّبا الدخان على أحد، ولم يعرفا كل المواد التي تسبب الأذى؛ وهذا ما بحثه علماء الكيمياء والأحياء بعدهما.","method_lesson":"حين لا يجوز أن نجرّب الأذى على الناس، نتابع من اختاره بنفسه ومن لم يختره سنوات، ونقارن بعدل.","source":["S8","S9"]}],"how_we_know":{"text":"كيف عرف العلماء أن التدخين يسبب سرطان الرئة؟ سنة 1950 سأل ريتشارد دول وأوستن برادفورد هيل في إنجلترا مرضى بسرطان الرئة ومرضى آخرين عن التدخين، فوجدا أن التدخين أكثر بكثير عند مرضى الرئة. ثم أرادا دليلاً أقوى، فتابعا أكثر من أربعة وثلاثين ألف طبيب خمسين سنة، وعرفا من يدخّن منهم قبل أن يمرض، فثبتت الصلة بالرئة والقلب.","limit_question":"لماذا كانت متابعة الأطباء سنوات أقوى من سؤال المرضى بعد أن مرضوا؟"},"what_changed":["كانت السجائر قبل نحو مئة سنة تُعلَن في المجلات كأنها لا تضر، ويدخّن كثير من الأطباء أنفسهم؛ ثم أظهرت دراسات المتابعة ضررها.","ظن الناس أن الماء في الشيشة ينقّي الدخان، وأن السيجارة الإلكترونية بخار ماء؛ والقياس أظهر غير ذلك."],"model_limits":["نشاط الماصّة يجعلنا نشعر بصعوبة مرور الهواء؛ لكنه لا يشبه ما يحدث في رئة المدخّن تماماً، ولا يُظهر أثر النيكوتين ولا أول أكسيد الكربون.","الرسم يُظهر الدخان سهماً من الرئة إلى الدم والقلب والدماغ؛ في الحقيقة هي مواد كثيرة صغيرة تحملها الدم إلى كل مكان."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَـٰطِلِ إِلَّآ أَن تَكُونَ تِجَـٰرَةً عَن تَرَاضٍۢ مِّنكُمْ ۚ وَلَا تَقْتُلُوٓا۟ أَنفُسَكُمْ ۚ إِنَّ ٱللَّهَ كَانَ بِكُمْ رَحِيمًۭا","reference":"النساء 29","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} نهيان: عن أخذ أموال الناس بالباطل، وعن أن يقتل الإنسان نفسه، وتُختم بأن الله رحيم بنا. فنفسك{|ِ} أمانة، والله يريد لها الخير. واليوم نرى كيف يصل أذى الدخان من الرئتين إلى الجسم كله. والآية لا تتكلم عن الدخان بعينه، والعلم لا يشرح الآية؛ لكنها تعلّمنا أن نفوسنا ليست لنا أن نؤذيها. كيف {تحفظ|تحفظين} نفسك{|ِ} من شيء تعرف{|ين} أنه يؤذيها؟","reviewed":false,"quran_key":"4:29","hl_words":[15,22],"highlight":"ولا تقتلوا أنفسكم إن الله كان بكم رحيما","level":"نهي","concept":"النفس أمانة، والله رحيم بنا فلا نؤذي أنفسنا.","avoid":"لا نقول إن الآية نزلت في الدخان أو إن المدخّن قاتل نفسه، ولا نذكر حكم التدخين؛ ولا نجعل العلم دليلاً على الآية.","cards":[]},"closing":{"text":"لا ضرر ولا ضرار","reference":"ابن ماجه 2341","grade":"حسن","usage":"قيمة","reflection":"عرفنا اليوم أن الدخان يؤذي صاحبه، ويؤذي من حوله أيضاً. والحديث في البطاقة قاعدة كبيرة: لا يؤذي المسلم نفسه، ولا يؤذي غيره. والحديث لا يذكر الدخان، ولا نذكر هنا حكماً فيه؛ لكن القاعدة تعلّمنا كيف نختار: نبتعد عما يضرنا، ونحرص ألا نضر غيرنا. ما الذي {ستفعله|ستفعلينه} لتحمي نفسك{|ِ} وتحمي من حولك{|ِ}؟","reviewed":false,"hadith_key":"ibnmajah:2341","highlight":"لا ضرر ولا ضرار","level":"نهي","concept":"لا نضر أنفسنا ولا نضر غيرنا.","avoid":"لا نذكر حكم التدخين (قرار صاحب المشروع)، ولا نصف المدخّن بسوء؛ القاعدة للاختيار لا للحكم على الناس.","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","narration":false,"source":"ابن ماجه 2341","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني","cards":[]}},"life":[{"situation":"في طريق العودة من المدرسة عرض عليّ ولد أكبر مني سيجارة إلكترونية بنكهة حلوة، وقال: كلنا جرّبناها.","science":"فيها في الغالب نيكوتين يصل إلى الدماغ بسرعة، وقد يصنع الإدمان في أيام عند الصغار؛ ورذاذها فيه مواد سامة.","action":"أقول: لا، شكراً؛ وأمشي مع أصدقائي الذين يحترمون اختياري؛ وأخبر أهلي بما حدث.","value":"حفظ النفس، والشجاعة في قول لا.","why":"لماذا أرفض مع أن الجميع جرّبها؟ لأن كثرة من يفعل الشيء لا تجعله نافعاً، ونعمة الصحة أُعطيتها لأحفظها لا لأضيّعها.","hadith":["bukhari:6412"],"cards":[{"key":"bukhari:6412","lead":"عن ابن عباس رضي الله عنهما قال: قال النبي ﷺ:","text":"نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ","narration":false,"source":"البخاري 6412","grade":"صحيح","grader":""}],"verses":[]},{"situation":"خالي يدخّن في الغرفة التي ننام فيها حين يزورنا، وأنا أحبه ولا أريد أن أُغضبه.","science":"لا قدر آمن من دخان الآخرين، وبعضه يبقى في الغرفة؛ وهو عند الأطفال يسبب التهابات الصدر والأذن ونوبات الربو.","action":"أقول له بلطف: أحبك يا خالي، وأرجو أن تدخّن خارج الغرفة لأن صدري يتعب؛ وأطلب من أمي أن تساعدني في ذلك، وأدعو له.","value":"البرّ والرحمة مع حفظ النفس.","why":"لماذا أطلب منه وهو أكبر مني؟ لأن الطلب بأدب لا يؤذيه، ويحميني؛ والقاعدة ألا يضر أحد غيره.","cards":[],"verses":[]}],"open_questions":[{"q":"ما أثر السيجارة الإلكترونية على من يستعملها عشرين أو ثلاثين سنة؟","why_open":"هي حديثة، فلم يمر وقت كافٍ لدراسات متابعة طويلة مثل دراسة الأطباء البريطانيين؛ والعلماء يتابعون اليوم من يستعملها."}],"notebook":{"draw":"{ارسم|ارسمي} جسماً، و{ارسم|ارسمي} طريق الدخان بسهم رمادي: من الفم إلى الرئتين، ثم إلى الدم، ثم إلى القلب والدماغ؛ و{اكتب|اكتبي} عند كل محطة ماذا يحدث. المستوى ب: {ارسم|ارسمي} مجموعتي الأطباء في دراسة المتابعة.","label":["الأهداب","الحويصلات","أول أكسيد الكربون","الخلايا الحمراء","النيكوتين","الإدمان","دخان الآخرين","— ب: دراسة المتابعة"],"write":"أشرح: لماذا يؤذي الدخان الجسم كله؟ ولماذا يصعب تركه؟ وأكتب ردي المهذب إن عرض عليّ أحد سيجارة أو سيجارة إلكترونية."},"imgs":[]};
