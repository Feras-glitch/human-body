const LD = {"id":"U11.T02","lesson":"U11.L02","first":false,"title":"اختبار: الدخان والجسم كله","lessonTitle":"الدخان والجسم كله","concepts":[],"check":[],"items":[{"id":"U11.L02.A1.a","objective":"U11.L02.O1","level":"A","type":"choose_reason","prompt":"الدخان يدخل الرئتين. لماذا يؤذي القلب أيضاً؟","options":["لأن القلب في الرئة","لأن الدخان يخرج من القلب","لأن مواده تعبر إلى الدم","لأن القلب يتنفس"],"answer":2,"explanation":"مواد الدخان تعبر من الحويصلات إلى الدم، والدم يمر بالقلب والجسم كله.","feedback_by_option":{"0":"القلب بين الرئتين، لا داخلهما.","1":"الدخان لا يخرج من القلب.","3":"القلب يضخ الدم، والرئتان تتنفسان."},"detects":"M127","alt":{"prompt":"التدخين يؤذي:","options":["الرئتين ولا يصل إلى غيرهما","أعضاء الجسم كلها تقريباً","الأسنان واللثة ولا شيء غيرهما","الجلد والشعر من الخارج"],"answer":1,"explanation":"التدخين يؤذي أعضاء الجسم وأجهزته كلها تقريباً.","feedback_by_option":{"0":"يصل بالدم إلى غيرهما.","2":"الأسنان تصفرّ، لكن الأذى أوسع.","3":"الأذى أوسع من الجلد."}}},{"id":"U11.L02.A1.b","objective":"U11.L02.O1","level":"A","type":"choose","prompt":"أول أكسيد الكربون في الدخان:","options":["يزيد الأكسجين في الدم ويقوّي القلب","يقلل الأكسجين في الدم","يقوّي العضلات في الرياضة","ينظّف الرئتين من الغبار والجراثيم"],"answer":1,"explanation":"يقلل الأكسجين الذي تحمله الخلايا الحمراء، فيتعب القلب والعضلات.","feedback_by_option":{"0":"يقلله لا يزيده.","2":"العضلات تتعب أسرع.","3":"الدخان يؤذي الرئتين ولا ينظفهما."},"alt":{"prompt":"أول أكسيد الكربون:","options":["غاز سام بلا لون","ماء نقي يخرج مع الدخان","نوع من الأكسجين المفيد","دواء للسعال في الصدر"],"answer":0,"explanation":"غاز سام بلا لون ولا رائحة في دخان التبغ والفحم.","feedback_by_option":{"1":"ليس ماءً.","2":"هو يقلل الأكسجين.","3":"ليس دواءً."}}},{"id":"U11.L02.A1.c","objective":"U11.L02.O1","level":"A","type":"explain_open","prompt":"{تتبّع|تتبّعي} الدخان في ثلاث محطات من الفم إلى القلب.","answer":"الفم ومجاري الهواء حيث يؤذي الأهداب؛ ثم الحويصلات حيث تعبر مواده إلى الدم؛ ثم الدم يحمله إلى القلب فيتعب لأن الأكسجين قلّ.","rubric":"R1"},{"id":"U11.L02.A2.a","objective":"U11.L02.O2","level":"A","type":"choose","prompt":"الإدمان:","options":["أن يحب الإنسان الرياضة ويلعبها كل يوم","أن يطلب الجسم مادة ويصعب تركها","أن ينام الإنسان كثيراً في الليل والنهار","أن يأكل الإنسان طعاماً صحياً في كل وجبة"],"answer":1,"explanation":"أن يطلب الجسم والدماغ مادة مرة بعد مرة، ويصعب تركها مع معرفة ضررها.","feedback_by_option":{"0":"هذا حب نشاط مفيد، لا إدمان.","2":"النوم حاجة طبيعية.","3":"هذا غذاء صحي."},"alt":{"prompt":"النيكوتين يصل إلى الدماغ:","options":["بعد أيام من التدخين","بسرعة","لا يصل إليه بشيء","بعد سنة من البدء"],"answer":1,"explanation":"يدخل الدماغ بسرعة بعد التدخين.","feedback_by_option":{"0":"يصل أسرع بكثير.","2":"يصل ويحرّك الدماغ.","3":"يصل بسرعة."}}},{"id":"U11.L02.A2.b","objective":"U11.L02.O2","level":"A","type":"true_false_why","prompt":"«سيجارة واحدة لا تضر، وأستطيع أن أتوقف متى شئت». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النيكوتين قد يصنع الإدمان في أيام عند الصغار، ودماغهم أسرع تأثراً، والترك بعدها صعب.","rubric":"R1","detects":"M128","alt":{"prompt":"«دماغ الصغير يتأثر بالنيكوتين أسرع من دماغ الكبير». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدماغ ما زال ينمو في الصغر والمراهقة، والصغار يدمنون أسرع."}},{"id":"U11.L02.A2.c","objective":"U11.L02.O2","level":"A","type":"choose_reason","prompt":"لماذا يسرع قلب المدخّن بعد السيجارة؟","options":["لأنه ركض قبلها مسافة طويلة","لأن النيكوتين يُطلق الأدرينالين","لأنه شرب ماءً كثيراً بعدها","لأنه نام قليلاً في الليلة الماضية"],"answer":1,"explanation":"النيكوتين يحرّك الغدتين فوق الكليتين فتُطلقان الأدرينالين، فيسرع القلب ويرتفع الضغط.","feedback_by_option":{"0":"لم يركض؛ المادة هي السبب.","2":"الماء لا يسرّع القلب هكذا.","3":"النوم يبطئ القلب."},"alt":{"prompt":"الأدرينالين الذي يُطلقه النيكوتين:","options":["يبطئ القلب ويخفض الضغط","يسرّع القلب","يجعل الإنسان ينام بسرعة","ينظف الدم من المواد الضارة"],"answer":1,"explanation":"يسرّع القلب ويرفع الضغط، كما في استجابة الخوف.","feedback_by_option":{"0":"يسرّعه لا يبطئه.","2":"يوقظ الجسم لا ينيمه.","3":"لا ينظف الدم."}}},{"id":"U11.L02.A3.a","objective":"U11.L02.O3","level":"A","type":"choose_reason","prompt":"السيجارة الإلكترونية تُطلق:","options":["بخار ماء نقي مثل الإبريق","هواء نظيفاً بنكهة الفاكهة","رذاذاً فيه مواد سامة","أكسجيناً مفيداً للرئتين الصغيرتين"],"answer":2,"explanation":"تسخّن سائلاً فيه في الغالب نيكوتين ونكهات ومواد أخرى، فيخرج رذاذ فيه مواد سامة.","feedback_by_option":{"0":"ليست بخار ماء.","1":"النكهة لا تجعله نظيفاً.","3":"لا تُطلق أكسجيناً."},"detects":"M129","alt":{"prompt":"الماء في الشيشة:","options":["ينقّي الدخان من السموم","لا يرشّحه","يجعلها بخار ماء نقياً","يجعلها دواءً للسعال"],"answer":1,"explanation":"الماء لا يرشّح الدخان، ودخانها سام كدخان السجائر.","feedback_by_option":{"0":"لا ينقّيه.","2":"تبقى دخاناً.","3":"ليست دواءً."}}},{"id":"U11.L02.A3.b","objective":"U11.L02.O3","level":"A","type":"true_false_why","prompt":"«ما دمت لا أدخّن أنا فدخان غيري لا يؤذيني». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا قدر آمن من دخان الآخرين، وهو عند الأطفال يسبب التهابات الصدر والأذن ونوبات الربو.","rubric":"R1","detects":"M130","alt":{"prompt":"«جلسة شيشة ساعة فيها دخان أكثر من سيجارة واحدة بكثير». صح أم خطأ؟ ولماذا؟","answer":"صح؛ فيها دخان أكثر بمئة إلى مئتي مرة، والماء لا ينقّيه."}},{"id":"U11.L02.A3.c","objective":"U11.L02.O3","level":"A","type":"explain_open","prompt":"{صحّح|صحّحي} ثلاث أفكار: الشيشة أخف، والسيجارة الإلكترونية بخار ماء، ودخان غيري لا يصلني.","answer":"الماء لا ينقّي دخان الشيشة؛ والسيجارة الإلكترونية رذاذ فيه نيكوتين ومواد سامة؛ ولا قدر آمن من دخان الآخرين.","rubric":"R1"},{"id":"U11.L02.A4.a","objective":"U11.L02.O4","level":"A","type":"choose_reason","prompt":"عرض عليك{|ِ} زميل سيجارة إلكترونية وقال: «لا تكن جباناً». أي رد أحسن؟","options":["أجرّبها مرة كي لا يقول إني جبان","أضحك منه وأخبر الصف كله","أقول: لا، شكراً، وأبتعد","آخذها وأخبئها"],"answer":2,"explanation":"«لا» مع الابتعاد تكفي، وللطفل أن يبتعد عمن لا يحترم اختياره.","feedback_by_option":{"0":"التجربة الأولى قد تبدأ الإدمان، والشجاعة أن أقول لا.","1":"لا نسخر؛ نرفض ونبتعد.","3":"أخذها خطر؛ أرفض وأخبر كبيراً موثوقاً إن لزم."},"alt":{"prompt":"إن تكرر الضغط عليك{|ِ} لتجرّب الدخان:","options":["أخبر كبيراً موثوقاً","أوافق في النهاية كي يتركني","أسكت وأتحمل كل يوم","أصرخ عليه أمام الجميع"],"answer":0,"explanation":"أخبر كبيراً موثوقاً، وأبتعد.","feedback_by_option":{"1":"لا أوافق على ما يؤذيني.","2":"السكوت لا يوقف الضغط.","3":"الصراخ لا يحل؛ الرفض الهادئ والابتعاد أحسن."}}},{"id":"U11.L02.A4.b","objective":"U11.L02.O4","level":"A","type":"true_false_why","prompt":"«إذا دخّن عمي فالأحسن أن أسخر منه أمام الناس كي يترك». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ السخرية تؤذيه ولا تساعده، وقد يكون مدمناً يحاول؛ نطلب بلطف وندعو له، ونحبه ونكره ما يؤذيه.","rubric":"R1","alt":{"prompt":"«أستطيع أن أطلب بلطف من قريب ألا يدخّن في غرفتي». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لا قدر آمن من دخان الآخرين، والطلب بلطف واحترام حق لي ولا يؤذيه."}},{"id":"U11.L02.A4.c","objective":"U11.L02.O4","level":"A","type":"explain_open","prompt":"{اكتب|اكتبي} ما {تقوله|تقولينه} بلطف لقريب يدخّن في السيارة وأنت{|ِ} معه.","answer":"أحبك، وأرجو ألا تدخّن في السيارة وأنا فيها لأن دخانك يصل إلى صدري؛ وأدعو لك أن تتركه.","rubric":"R1"},{"id":"U11.L02.A5.a","objective":"U11.L02.O5","level":"B","type":"choose","prompt":"ماذا فعل دول وهيل سنة 1951؟","options":["سألا مريضاً واحداً عن حياته كلها","تابعا آلاف الأطباء سنوات","جرّبا الدخان على الأطفال في المدارس","قرأا إعلانات السجائر في المجلات"],"answer":1,"explanation":"تابعا أكثر من 34 ألف طبيب خمسين سنة، وعرفا من يدخّن قبل أن يمرض.","feedback_by_option":{"0":"مريض واحد لا يكفي؛ تابعا آلافاً.","2":"لا يُجرّب الأذى على أحد.","3":"الإعلانات لا تُثبت شيئاً."},"alt":{"prompt":"دراسة المتابعة:","options":["تسأل الناس مرة واحدة في الشارع","تتابع الناس سنوات","تجربة على الحيوانات في المختبر","استطلاع على الإنترنت في يوم واحد"],"answer":1,"explanation":"تتابع مجموعة سنوات، وتقارن من فعل الشيء بمن لم يفعله.","feedback_by_option":{"0":"المتابعة سنوات لا مرة.","2":"هي على الناس.","3":"هي متابعة طويلة منظمة."}}},{"id":"U11.L02.A5.b","objective":"U11.L02.O5","level":"B","type":"true_false_why","prompt":"«سؤال المرضى بعد أن مرضوا أقوى دليلاً من متابعة الأصحاء سنوات». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ المتابعة تعرف ما فعله الناس قبل أن يمرضوا، فلا يخطئون في التذكر؛ ولذلك كانت دراسة الأطباء أقوى.","rubric":"R1","alt":{"prompt":"«بدأ دول وهيل بمقارنة مرضى سرطان الرئة بمرضى آخرين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ سنة 1950 قارنا التدخين بين مرضى سرطان الرئة ومرضى آخرين."}},{"id":"U11.L02.A5.c","objective":"U11.L02.O5","level":"B","type":"explain_open","prompt":"لماذا لم يكفِ العلماء أن يروا مدخّناً واحداً مرض؟","answer":"لأن الواحد قد يمرض لسبب آخر؛ يحتاجون مقارنة بين أعداد كبيرة من المدخّنين وغيرهم، ومتابعة سنوات.","rubric":"R1"}],"transfer":[{"id":"U11.L02.T1","objective":"U11.L02.O1","type":"explain_open","prompt":"لاعب كرة يدخّن يتعب في الشوط الثاني أسرع من زملائه. {فسّر|فسّري} ذلك بثلاثة أجهزة.","answer":"الرئتان: الأهداب والحويصلات متأذية؛ الدم: أول أكسيد الكربون يقلل الأكسجين في الخلايا الحمراء؛ القلب والعضلات: يتعبان لأن الأكسجين أقل، والنيكوتين يسرّع القلب ويضيّق الأوعية.","level":"A","rubric":"R1"},{"id":"U11.L02.T2","objective":"U11.L02.O4","type":"explain_open","prompt":"{صمّم|صمّمي} ملصقاً لصفك{|ِ} عن الدخان بلا صور مخيفة ولا سخرية من أحد. ماذا {تكتب|تكتبين} فيه؟","answer":"مثال: الدخان لا يقف في الرئتين، يصل إلى القلب والدماغ؛ قل: لا، شكراً؛ ونحب من يدخّن ونرجو له الترك.","level":"A","rubric":"R1"}],"recall":[{"id":"U11.L02.D1","objective":"U11.L02.O1","type":"choose","prompt":"أذى الدخان يصل إلى:","options":["الرئتين ولا يتجاوزهما","الجسم كله تقريباً","الأسنان واللثة"],"answer":1,"explanation":"بالدم إلى الجسم كله تقريباً.","level":"A","feedback_by_option":{"0":"يعبر إلى الدم.","2":"الأذى أوسع."}},{"id":"U11.L02.D2","objective":"U11.L02.O2","type":"choose","prompt":"الإدمان عند الصغار:","options":["قد يبدأ في أيام","لا يحدث للصغار","يحتاج سنوات طويلة"],"answer":0,"explanation":"قد يبدأ في أيام من أول استعمال.","level":"A","feedback_by_option":{"1":"يحدث، وأسرع من الكبار.","2":"قد يبدأ أسرع بكثير."}},{"id":"U11.L02.D3","objective":"U11.L02.O3","type":"choose","prompt":"دخان الآخرين:","options":["آمن بقدر قليل","لا قدر آمن منه","يؤذي المدخّن وحده"],"answer":1,"explanation":"لا قدر آمن منه.","level":"A","feedback_by_option":{"0":"لا قدر آمن.","2":"يؤذي من حوله أيضاً."}},{"id":"U11.L02.D4","objective":"U11.L02.O4","type":"choose","prompt":"حين يُعرض عليّ الدخان:","options":["أجرّب مرة واحدة","أقول لا وأبتعد","أسخر ممن عرضه عليّ"],"answer":1,"explanation":"لا، شكراً، وأبتعد.","level":"A","feedback_by_option":{"0":"المرة الأولى قد تبدأ الإدمان.","2":"لا نسخر."}},{"id":"U11.L02.D5","objective":"U11.L02.O5","type":"choose","prompt":"دراسة المتابعة:","options":["تتابع الناس سنوات","تسألهم مرة","تجربة على الحيوان"],"answer":0,"explanation":"تتابع الناس سنوات طويلة.","level":"B","feedback_by_option":{"1":"المتابعة سنوات.","2":"هي على الناس."}}]};
