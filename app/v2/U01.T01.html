const LD = {"id":"U01.T01","lesson":"U01.L01","first":false,"title":"اختبار: جسمي على الخريطة: أجزاء ومناطق ونموذج","lessonTitle":"جسمي على الخريطة: أجزاء ومناطق ونموذج","concepts":[],"check":[],"items":[{"id":"U01.L01.A1.a","objective":"U01.L01.O1","type":"locate_on_atlas","prompt":"حدّد{|ي} الفخذ على هذا الرسم الجانبي.","answer":"thigh","level":"A","atlas_target":"thigh","alt":{"type":"choose","prompt":"أين تقع الساق؟","options":["بين الكتف والمرفق","فوق الركبة","بين المرفق والرسغ","بين الركبة والقدم"],"answer":3,"explanation":"الطرف السفلي من الأعلى: الفخذ حتى الركبة، ثم الساق من الركبة إلى القدم، ثم القدم.","feedback_by_option":{"0":"هذا موضع العضد في الطرف العلوي. الساق في الطرف السفلي.","1":"فوق الركبة الفخذ. والساق الجزء الذي يليه نحو الأسفل.","2":"هذا موضع الساعد في الطرف العلوي. الساق في الطرف السفلي."}}},{"id":"U01.L01.A1.b","objective":"U01.L01.O1","type":"choose","prompt":"«بطني يؤلمني». ما الذي سمّاه القائل؟","answer":1,"explanation":"«البطن» اسم منطقة فيها المعدة والأمعاء والكبد وغيرها، لا اسم عضو واحد.","feedback_by_option":{"0":"المعدة عضو واحد في أعلى البطن؛ أما «البطن» فمنطقة فيها المعدة والأمعاء والكبد وغيرها.","2":"قال «بطني» لا «ظهري»، والبطن في الجهة الأمامية من الجذع. ثم: هل البطن عضو واحد أم منطقة؟","3":"الصدر فوق البطن، وهو منطقة أخرى. القائل سمّى البطن؛ فهل البطن عضو واحد أم منطقة فيها أعضاء؟"},"level":"A","options":["عضواً واحداً هو المعدة","منطقة فيها أعضاء كثيرة","الظهر","الصدر"],"detects":"M08","alt":{"prompt":"قال أخي: «صدري يؤلمني». ما الذي سمّاه؟","options":["منطقة من الجذع فيها أعضاء كثيرة","عضواً واحداً هو القلب","جزءاً من الطرف العلوي","الظهر"],"answer":0,"explanation":"«الصدر» اسم منطقة في أعلى الجذع من الأمام، فيها أعضاء كثيرة منها القلب، لا اسم عضو واحد.","feedback_by_option":{"1":"القلب عضو واحد داخل الصدر، وفي الصدر غيره كثير. فهل سمّى أخوك{|ِ} عضواً أم منطقة؟","2":"الطرف العلوي يبدأ من الكتف: العضد ثم الساعد ثم اليد. والصدر جزء من الجذع.","3":"الظهر في الجهة الخلفية من الجذع، والصدر في الجهة الأمامية."},"detects":"M08"}},{"id":"U01.L01.A1.c","objective":"U01.L01.O1","type":"sequence","prompt":"رتّب{|ي} أجزاء الطرف السفلي من الأعلى إلى الأسفل.","answer":[2,0,1],"explanation":"الطرف السفلي من الأعلى إلى الأسفل: الفخذ فوق الركبة، ثم الساق، ثم القدم.","level":"A","options":["الساق","القدم","الفخذ"],"alt":{"prompt":"رتّب{|ي} أجزاء الطرف العلوي من الكتف إلى أطراف الأصابع.","options":["الساعد","اليد","العضد"],"answer":[2,0,1],"explanation":"الطرف العلوي من الكتف: العضد حتى المرفق، ثم الساعد حتى الرسغ، ثم اليد."}},{"id":"U01.L01.A2.a","objective":"U01.L01.O2","type":"choose","prompt":"أين الظهر بالنسبة إلى الصدر؟","answer":2,"explanation":"الصدر في الجهة الأمامية من الجذع، والظهر في الجهة الخلفية المقابلة له.","level":"A","options":["أعلى","أسفل","خلف","أمام"],"feedback_by_option":{"0":"«أعلى» يعني أقرب إلى الرأس. الصدر والظهر على الارتفاع نفسه تقريباً؛ الفرق بينهما في الجهة: أيهما في الأمام؟","1":"الظهر ليس تحت الصدر؛ هما على الارتفاع نفسه تقريباً. ضع{|ي} يداً على صدرك{|ِ} وأخرى على ظهرك{|ِ}: أين تقع الثانية من الأولى؟","3":"العكس: الصدر هو الذي في الأمام، في جهة الوجه. فأين الظهر منه؟"},"alt":{"prompt":"أين الصدر بالنسبة إلى البطن؟","options":["أسفل","أعلى","خلف","أمام"],"answer":1,"explanation":"الصدر فوق البطن في الجذع، أي أقرب منه إلى الرأس؛ وكلاهما في الجهة الأمامية.","feedback_by_option":{"0":"«أسفل» يعني أقرب إلى القدمين. أيهما أقرب إلى الرأس: الصدر أم البطن؟","2":"الصدر والبطن كلاهما في الجهة الأمامية من الجذع؛ الفرق بينهما في الارتفاع.","3":"الصدر والبطن كلاهما في الأمام. الفرق بينهما: أيهما أقرب إلى الرأس؟"}}},{"id":"U01.L01.A2.b","objective":"U01.L01.O2","type":"choose","prompt":"لو استلقى شخص على الأرض، فهل يبقى رأسه «أعلى» جذعه في لغة الجسم؟","answer":1,"explanation":"الاتجاهات في لغة الجسم تُقاس بالنسبة إلى الجسم نفسه لا إلى الغرفة، فيبقى الرأس «أعلى» الجذع ولو استلقى الشخص.","level":"A","options":["لا؛ صار بجانبه","نعم؛ الاتجاه بالنسبة إلى الجسم","يعتمد على الغرفة"],"feedback_by_option":{"0":"في الغرفة صار بجانبه، لكن لغة الجسم تقيس الاتجاه بالنسبة إلى الجسم نفسه لا إلى الغرفة. هل تغيّر الجسم نفسه حين استلقى؟","2":"لو تغيّرت الاتجاهات بتغيّر الغرفة لما فهم طبيبٌ وصفَ طبيب آخر. لغة الجسم تقيس بالنسبة إلى الجسم نفسه."},"alt":{"prompt":"طفل يقف على يديه ورأسه إلى الأسفل. في لغة الجسم، أين قدماه بالنسبة إلى ركبتيه؟","options":["يتغيّر كلما تحرّك","أعلى؛ لأنهما فوق في الغرفة","أسفل؛ الاتجاه بالنسبة إلى الجسم","لا يمكن أن نقول"],"answer":2,"explanation":"لغة الجسم تقيس بالنسبة إلى الجسم نفسه: القدم أبعد عن الرأس من الركبة، فهي «أسفل» الركبة ولو قلب الطفل جسمه.","feedback_by_option":{"0":"لو تغيّرت الاتجاهات كلما تحرّك الجسم لما فهمنا وصف أي موضع. لغة الجسم تقيس بالنسبة إلى الجسم نفسه.","1":"في الغرفة نعم، لكن لغة الجسم لا تتبع الغرفة. أيهما أقرب إلى رأسه: ركبته أم قدمه؟","3":"يمكن: {قِس|قيسي} بالنسبة إلى جسمه لا إلى الغرفة. أيهما أقرب إلى رأسه؟"}}},{"id":"U01.L01.A2.c","objective":"U01.L01.O2","type":"explain_open","prompt":"صف{|ي} موضع السرّة بثلاث كلمات اتجاه.","answer":"في منتصف البطن، أمام، أسفل الصدر.","level":"A","rubric":"R1"},{"id":"U01.L01.A3.a","objective":"U01.L01.O3","type":"choose","prompt":"رسم الجسم في الكتاب:","answer":0,"explanation":"الرسم نموذج: يُظهر الفكرة المطلوبة ويخفي تفاصيل كثيرة، فهو ليس الجسم نفسه.","feedback_by_option":{"1":"الرسم نموذج: يكبّر ويلوّن ليوضح فكرة، فلا يكون الجسم بالضبط.","2":"الرسم ليس خطأً: هو صحيح فيما أراد أن يُظهره، ويخفي تفاصيل أخرى عن قصد. ماذا نسمّي شيئاً كهذا؟","3":"الصورة الفوتوغرافية تُظهر كل شيء كما هو؛ أما رسم الكتاب فيختار ما يُظهره ويخفي الباقي."},"level":"A","options":["نموذج يُظهر فكرة ويخفي تفاصيل","هو الجسم بالضبط","خطأ، لأنه لا يشبه الجسم الحقيقي","صورة فوتوغرافية"],"detects":"M25","alt":{"prompt":"مجسّم الهيكل العظمي البلاستيكي في المدرسة:","options":["هو الهيكل الحقيقي بالضبط","نموذج يُظهر العظام ويخفي تفاصيل كثيرة","لا فائدة منه لأنه ليس حقيقياً","يُظهر كل ما في الجسم"],"answer":1,"explanation":"المجسّم نموذج: يُظهر شكل العظام ومواضعها، ويخفي أشياء كثيرة، كالعضلات والحركة، وأن العظم الحي ليس من البلاستيك.","feedback_by_option":{"0":"المجسّم من البلاستيك، وعظامه لا تنمو ولا تتحرك وحدها. يشبه الهيكل في الشكل لكنه ليس هو.","2":"النموذج مفيد مع أنه ليس الحقيقة: يُظهر ما نريد أن نتعلمه. ماذا يُظهر المجسّم بوضوح؟","3":"المجسّم يُظهر العظام وحدها؛ أين العضلات والقلب والجلد؟ كل نموذج يُظهر شيئاً ويخفي غيره."},"detects":"M25"}},{"id":"U01.L01.A3.b","objective":"U01.L01.O3","type":"choose_reason","prompt":"تريد{|ين} معرفة موضع الركبة. أي نموذج تختار{|ين}؟","answer":1,"explanation":"النموذج الجيد يُظهر ما نحتاجه فقط؛ لمعرفة موضع الركبة يكفي رسم بسيط للمناطق، والتفاصيل الزائدة تشتّت.","level":"A","options":["صورة فيها حركة وألوان كثيرة","رسم بسيط يُظهر المناطق","رسم للقلب","لا يهم"],"feedback_by_option":{"0":"التفاصيل الكثيرة تشغلك{|ِ} عمّا تبحث{|ين} عنه. ما الذي يلزمك{|ِ} فعلاً لتعرف{|ي} موضع الركبة؟","2":"رسم القلب يُظهر القلب وحده، والركبة ليست فيه. {اختر|اختاري} نموذجاً يُظهر ما تبحث{|ين} عنه.","3":"يهم: كل نموذج يُظهر شيئاً ويخفي غيره، فنختار النموذج الذي يُظهر ما نبحث عنه."},"alt":{"prompt":"تريد{|ين} أن {تعرف|تعرفي} أين يقع البطن من الجسم. أي نموذج يكفيك{|ِ}؟","options":["رسم لعظام اليد","صورة مكبّرة جداً لجلد البطن تحت المجهر","رسم بسيط للجسم تظهر فيه المناطق","فيديو طويل لطفل يركض"],"answer":2,"explanation":"النموذج الجيد يُظهر ما نحتاجه فقط؛ لمعرفة موضع البطن يكفي رسم بسيط للمناطق.","feedback_by_option":{"0":"رسم عظام اليد لا يُظهر البطن أصلاً. {اختر|اختاري} نموذجاً يُظهر ما تبحث{|ين} عنه.","1":"الصورة المكبّرة تُظهر الجلد عن قرب، لكنها لا تُظهر أين يقع البطن من بقية الجسم.","3":"الفيديو مليء بحركة وتفاصيل تشغلك{|ِ} عمّا تبحث{|ين} عنه؛ يكفيك{|ِ} ما يُظهر المناطق."}}},{"id":"U01.L01.A3.c","objective":"U01.L01.O3","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أشياء لا يُظهرها أي رسم للجسم.","answer":"الحجم الحقيقي، الحركة، الاختلاف بين الناس، الداخل، اللون الحقيقي…","level":"A","rubric":"R2"},{"id":"U01.L01.A4.a","objective":"U01.L01.O4","type":"choose","prompt":"في رسم يواجهك{|ِ}، الجانب الأيمن للشخص المرسوم يقع:","answer":1,"explanation":"الشخص المرسوم يواجهك{|ِ}، فجانبه الأيمن يقع على يسار الصفحة.","level":"B","options":["على يمين الصفحة","ع
