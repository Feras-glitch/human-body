const LD = {"id":"U03.L03","first":false,"title":"ماذا في الدم؟ فريق النقل والدفاع والإصلاح","driving_question":"لماذا يتوقف الجرح الصغير عن النزف وحده؟","central_fact":"الدم سائل (البلازما) تسبح فيه ثلاثة أنواع من الخلايا بثلاث وظائف: الحمراء تنقل الأكسجين، والبيضاء تدافع، والصفائح تسدّ الجروح؛ وتُصنع كلها في نخاع العظم.","next":"U03.L04","nexts":[{"id":"U03.L04","gated":false}],"hook":{"text":"{اسم}، حين تُجرح{|ين} جرحاً صغيراً يخرج دم ثم يتوقف وحده بعد دقائق. من أوقفه؟","options":["الجلد أغلق الجرح","شيء في الدم نفسه","القلب توقف عن الدفع","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["blood"],"highlight":["plasma"],"zoom":"tube","animate":"separate"},"text":"تعلّمنا أن الدم أحمر دائماً. لكن مفاجأة: سائل الدم ليس أحمر. لو أخذنا أنبوب دم وأدرناه بسرعة في المختبر لانفصل إلى طبقتين: سائل أصفر فاتح في الأعلى نسميه البلازما، وخلايا في الأسفل. البلازما معظمها ماء، وتحمل المغذيات والفضلات وتسبح فيها الخلايا."},{"id":"E2","level":"A","atlas":{"layers":["blood"],"highlight":["rbc"],"zoom":"cells"},"text":"أكثر الخلايا عدداً: الكريّات الحمراء. أقراص صغيرة مقعّرة، في كل قطرة ملايين منها، وهي التي تجعل الدم أحمر. فيها مادة حمراء تمسك الأكسجين: تلتقطه في الرئتين وتتركه في شعيرات الجسم. الكريّات الحمراء هي ناقلات الأكسجين."},{"id":"E3","level":"A","atlas":{"layers":["blood"],"highlight":["wbc"],"zoom":"cells"},"text":"وبينها خلايا أكبر وأقل عدداً بكثير: الخلايا البيضاء. وظيفتها الدفاع عن الجسم ضد الميكروبات. بعضها يبتلع الميكروب، وبعضها يتعرف عليه. حين نمرض يزداد عددها. سنعرف تفاصيلها في وحدة الدفاع."},{"id":"E4","level":"A","atlas":{"layers":["blood"],"highlight":["platelet"],"zoom":"wound","animate":"clot"},"text":"وهنا جواب سؤالنا. في الدم أجسام صغيرة جداً نسميها الصفائح. حين يتمزق وعاء، تتجمع الصفائح عند التمزق وتلتصق به وببعضها، فتسدّ الثقب ويتوقف النزف. وإن كان الجرح على الجلد جفّ السدّ من فوق وصار قشرة. الصفائح هي فريق الإصلاح."},{"id":"E5","level":"A","atlas":{"layers":["skeleton"],"highlight":["marrow"],"zoom":"bone"},"text":"من أين تأتي كل هذه check":[{"id":"U03.L03.C1","objective":"U03.L03.O1","level":"A","type":"locate_on_atlas","prompt":"في رسم أنبوب الدم المفصول، اضغط{|ي} على طبقة البلازما.","atlas_target":"plasma","answer":"plasma","feedback_wrong":"البلازما سائل؛ هل هو في الأعلى أم في القاع بعد الدوران؟"},{"id":"U03.L03.C2","objective":"U03.L03.O2","level":"A","type":"choose_reason","prompt":"طفل مصاب بعدوى. أي مكوّن يزداد عدده في دمه؟","options":["الكريّات الحمراء","الخلايا البيضاء","الصفائح","البلازما"],"answer":1,"explanation":"الخلايا البيضاء تدافع عن الجسم ضد الميكروبات، فيزداد عددها عند العدوى.","feedback_wrong":"من يدافع ضد الميكروبات؟","feedback_by_option":{"0":"الكريّات الحمراء تحمل الأكسجين؛ والعدوى تحتاج من يدافع.","2":"الصفائح تسدّ الجروح؛ والعدوى تحتاج من يدافع ضد الميكروبات.","3":"البلازما سائل يحمل الخلايا؛ والعدوى تحتاج خلايا تدافع."}},{"id":"U03.L03.C3","objective":"U03.L03.O3","level":"A","type":"true_false_why","prompt":"«الكريّة الحمراء تعيش نحو أربعة أشهر، ثم يصنع نخاع العظم غيرها». صح أم خطأ؟","answer":"صح؛ تُستبدل باستمرار؛ والنخاع يصنع مليارات الخلايا كل يوم.","rubric":"R1"},{"id":"U03.L03.C4","objective":"U03.L03.O4","level":"B","type":"choose_reason","prompt":"لماذا يُنصح بألا ننزع قشرة الجرح؟","options":["لأنها جزء من الجلد سيبقى مكانه إلى الأبد","لأنها تحمل الأكسجين إلى الجرح","لأنها سقف مؤقت يحمي الجلد الجديد تحتها","لأن نزعها يؤلم، أما الجرح فلا يتأثر"],"answer":2,"explanation":"القشرة سقف مؤقت يحمي الجلد الجديد الذي ينمو تحتها، ونزعها يفتح الجرح من جديد.","feedback_wrong":"ماذا يحدث تحت القشرة؟","feedback_by_option":{"0":"القشرة مؤقتة، تسقط وحدها حين يكتمل الجلد الجديد تحتها.","1":"الأكسجين تحمله الكريّات الحمراء في الدم؛ والقشرة غطاء.","3":"النزع يؤلم، ويفتح الجرح أيضاً فيتأخر الشفاء."}},{"id":"U03.L03.C5","objective":"U03.L03.O5","level":"B","type":"fix_model","prompt":"رسم زميل{ك|تكِ} كريّة حمراء تصير زرقاء بعد أن تترك جزءاً من أكسجينها في العضلة. صحّح{|ي}.","answer":"تصير أحمر داكناً لا أزرق؛ الدم أحمر دائماً.","rubric":"R1"}],"concepts":[{"id":"plasma","term":{"ar":"البلازما","en":"Plasma","zh":"血浆","pinyin":"xuèjiāng"},"priority":"core","atlas":{"layer":"blood","element":"plasma"},"card":{"A":"السائل الأصفر الفاتح الذي تسبح فيه خلايا الدم؛ يحمل المغذيات والفضلات والمواد الأخرى.","B":"معظمها ماء، وفيها بروتينات وأملاح وهرمونات ومغذيات وفضلات؛ أكثر من نصف حجم الدم بلازما."}},{"id":"red_blood_cell","term":{"ar":"الكريّة الحمراء","en":"Red blood cell","zh":"红细胞","pinyin":"hóngxìbāo","match":["الكريّات الحمراء","كريّة"]},"priority":"core","atlas":{"layer":"blood","element":"rbc"},"card":{"A":"قرص صغير أحمر يحمل الأكسجين من الرئتين إلى كل الجسم. هي التي تجعل الدم أحمر.","B":"فيها مادة حمراء تمسك الأكسجين (الهيموغلوبين)؛ تلتقطه في الرئتين وتتركه في شعيرات الجسم. تعيش نحو أربعة أشهر وتُصنع في نخاع العظم."}},{"id":"white_blood_cell","term":{"ar":"الخلية البيضاء","en":"White blood cell","zh":"白细胞","pinyin":"báixìbāo","match":["الخلايا البيضاء"]},"priority":"core","atlas":{"layer":"blood","element":"wbc"},"card":{"A":"خلية تدافع عن الجسم ضد الميكروبات. عددها أقل من الحمراء بكثير، لكنها تزداد حين نمرض.","B":"أنواع عدة بأدوار مختلفة؛ بعضها يبتلع الميكروبات وبعضها يتعرف عليها ويتذكرها. تفاصيلها في وحدة الدفاع."}},{"id":"platelet","term":{"ar":"الصفيحة الدموية","en":"Platelet","zh":"血小板","pinyin":"xuèxiǎobǎn","match":["الصفائح"]},"priority":"core","atlas":{"layer":"blood","element":"platelet"},"card":{"A":"قطع صغيرة جداً تتجمع عند الجرح وتلتصق فتوقف النزف.","B":"ليست خلايا كاملة بل شظايا خلايا؛ تلتصق بجدار الوعاء الممزق وببعضها، وتُطلق إشارات تبني شبكة ألياف تمسك الخلايا فتتكون الخثرة (السدادة). وإن تكوّنت خثرة داخل وعاء سليم صارت خطراً — وهذا ما يسميه الناس «جلطة»."}},{"id":"bone_marrow","term":{"ar":"نخاع العظم","en":"Bone marrow","zh":"骨髓","pinyin":"gǔsuǐ"},"priority":"supporting","atlas":{"layer":"skeleton","element":"marrow"},"card":{"A":"النسيج الطري داخل العظام الكبيرة؛ فيه تُصنع خلايا الدم.","B":"يصنع كل يوم مليارات الكريّات الحمراء والصفائح وكثيراً من الخلايا البيضاء لتعويض ما يموت."}}],"experiment":{"title":"أنبوب الدم المنفصل","materials":["كوب زجاجي شفاف","ماء","عصير برتقال مصفّى أو ماء بقطرة لون أصفر (لون البلازما)","حفنة عدس أحمر (كريّات حمراء)","حبّة حمص بيضاء أو اثنتان (خلايا بيضاء)","رشّة سميد أو رمل ناعم ملوّن (صفائح) — السمسم يطفو فلا يصلح"],"steps":["{املأ|املئي} أكثر من نصف الكوب بعصير أو ماء مائل إلى الأصفر: هذه البلازما.","{أضف|أضيفي} حفنة كبيرة من العدس الأحمر: هذه الكريّات الحمراء. لاحظ{|ي} كيف تغيّر لون الكوب كله.","{أضف|أضيفي} حبّة حمص بيضاء واحدة أو اثنتين فقط: هذه الخلايا البيضاء. عددها قليل جداً مقارنة بالحمراء.","رشّ{|ي} قليلاً من السميد: هذه الصفائح، صغيرة وكثيرة.","حرّك{|ي} الكوب ثم {اتركه|اتركيه} ساكناً دقيقة. ماذا يحدث للخلايا؟ وماذا يبقى في الأعلى؟","ارسم{|ي} الكوب في دفتر الأطلس وسمِّ{|ي} الطبقات."],"safety":["نموذج للنظر لا للأكل بعد التجربة.","لا نستعمل دماً حقيقياً ولا نجرح أحداً لنرى الدم.","تُنظَّف الطاولة بعد النشاط."],"expected":"يصبح الكوب كله أحمر مع أن معظمه سائل أصفر، وحين يسكن تنزل الحبوب إلى القاع ويبقى السائل في الأعلى — كما يحدث لأنبوب الدم في جهاز الطرد المركزي.","explain":"الدم أحمر بسبب الكريّات الحمراء الكثيرة جداً، لا لأن سائله أحمر. وحين يُدار أنبوب الدم في المختبر بسرعة تنزل الخلايا إلى القاع وتبقى البلازما الصفراء فوقها. العدس كثير والحمص قليل: هكذا نسبة الحمراء إلى البيضاء في دمك{|ِ}، بل الفرق الحقيقي أكبر بكثير.","record":"رسم الكوب بطبقتيه، وجملة: «الدم أحمر بسبب…».","alternatives":["إن لم تتوفر الحبوب: ورقة ملوّنة تُقص دوائر حمراء كثيرة ودائرة بيضاء واحدة ونقاط صغيرة.","صورة أنبوب دم مفصول في الدرس."]},"find_the_error":[{"id":"FE1","atlas_variant":"heart_makes_blood","error":"سهم «يصنع خلايا الدم» يخرج من القلب","answer":"خلايا الدم تُصنع في نخاع العظم","detects":"M06"},{"id":"FE2","atlas_variant":"equal_counts","error":"رسم فيه عدد الخلايا البيضاء مساوٍ لعدد الحمراء","answer":"الحمراء أكثر بمئات المرات","detects":"M27"}],"numbers":[{"text":"في نقطة دم بحجم رأس الدبوس (مليمتر مكعب واحد) نحو 5 ملايين كريّة حمراء؛ وفي القطرة الواحدة نحو 250 مليوناً.","source":["S10"]},{"text":"تعيش الكريّة الحمراء نحو 120 يوماً، ثم يصنع نخاع عظمك{|ِ} غيرها: نحو مليوني كريّة جديدة كل ثانية.","source":["S1","S5"]},{"text":"الكريّة الحمراء قرص مقعّر من الجهتين بقطر 7 ميكرومتر؛ لو صففت{|ِ} 140 كريّة لبلغت مليمتراً واحداً.","source":["S5"]}],"true_size":[{"text":"خذ{|ي} عبوة ماء 2 لتر وانظر{|ي} إليها: هذا نحو كمية الدم في جسم طفل وزنه 27 كغ. احسب{|ي} كميتك{|ِ} من وزنك{|ِ} (وزنك × 0.075).","source":["S8"]},{"text":"ارسم{|ي} على ورقة دائرة حمراء صغيرة بقطر 7 مم وبجانبها دائرة بيضاء بقطر 12 مم: هذه كريّة حمراء وخلية بيضاء مكبّرتان ألف مرة.","source":["S5"]}],"animal":{"text":"كريّات الدم الحمراء عند الطيور والزواحف فيها نواة، أما عند الثدييات (ومنها نحن) فبلا نواة لتتسع لمزيد من الهيموغلوبين. وبعض الحيوانات مثل الأخطبوط دمها أزرق فعلاً لأن مادته الحاملة للأكسجين تحوي نحاساً لا حديداً. أما دمنا فأحمر دائماً.","source":["S7"]},"organ_letter":{"from":"الكريّة الحمراء","text":"أنا كريّة حمراء، واحدة من ملايين في قطرة. عمري أربعة أشهر فقط، وفي كل دقيقة أكمل رحلة: أحمّل الأكسجين من الرئتين، وأمر بالقلب الذي يدفعني، وأسلّمه لعضلة أو لدماغك{|ِ}، وأعود. لا أختار إلى أين أذهب؛ الدفع والطرق تقرر. وحين أموت لا يحزن أحد: نخاع عظمك{|ِ} يصنع مليوني واحدة مثلي كل ثانية. أنا لا أفكر، لكني أحمل."},"history":[{"who":"يان سفامردام وأنطوني فان ليفينهوك","origin":"هولندا","where_when":"نحو 1658 (التاريخ غير مؤكد) و1674","did":"يُنسب إلى سفامردام أنه أول من رأى كريّات الدم بالمجهر (لم يُنشر في حياته)، ثم وصفها ليفينهوك وقاس حجمها عام 1674.","did_not":"لم يعرفا وظيفتها في حمل الأكسجين (عُرفت في القرن 19).","method_lesson":"رؤية الشيء أول خطوة؛ فهم وظيفته خطوة أخرى قد تحتاج قرنين.","source":["S6"]},{"who":"البيمارستانات","origin":"بغداد ودمشق والقاهرة — الحضارة الإسلامية","where_when":"القرن 9 إلى 13","did":"مستشفيات نصّت وثائق بعضها على علاج المرضى جميعاً بلا تمييز، فيها أقسام وتعليم وسجلات للمرضى.","did_not":"لم تعرف الميكروبات ولا التعقيم؛ كثير من علاجها لم يعد مستعملاً.","method_lesson":"الرعاية للجميع قيمة سبقت كثيراً من العلم، والعلم خدمها لاحقاً.","source":["S9"]}],"how_we_know":{"text":"نحو عام 1658 (والتاريخ غير مؤكد، ولم يُنشر في حياته) نظر الهولندي يان سفامردام بالمجهر إلى قطرة دم فرأى فيها أجساماً صغيرة: يُنسب إليه أنه أول من رأى كريّة دم. ثم وصفها فان ليفينهوك بدقة عام 1674 وقاس حجمها. قبل المجهر كان الدم سائلاً أحمر لا أكثر.","limit_question":"ما الذي لا يُظهره رسم خلايا الدم في هذا الدرس؟ (اذكر{|ي} شيئاً واحداً)"},"what_changed":["اعتُقد أن الدم «يُصنع في الكبد ويُستهلك»؛ هو يدور، وخلاياه تُصنع في نخاع العظم وتُستبدل باستمرار.","اعتُقد قروناً أن إخراج الدم (الفصد) يعالج معظم الأمراض؛ ثبت ضرره في معظم الحالات."],"model_limits":["الخلايا في الرسم مكبّرة آلاف المرات؛ لا تُرى بالعين.","نسب الأعداد في الرسم ليست حقيقية: الحمراء أكثر من البيضاء بنحو 700 مرة.","لا يُظهر الرسم أن البلازما شفافة مائلة إلى الأصفر؛ الدم يبدو أحمر بسبب الكريّات فقط.","نسبة الخلايا البيضاء إلى الحمراء في الرسم اختيرت للوضوح ولا تمثل تعداد دم حقيقياً.","مسار خروج الخلايا من النخاع تكبير رمزي؛ وتوزيع النخاع الأحمر والأصفر يتغير مع العمر.","في صورة الطرد المركزي النسبة بين الطبقتين تقريبية وتختلف بين الأطفال."],"faith":{"opening":null,"closing":{"text":"ما يصيب المسلم من نَصَب ولا وَصَب ولا همّ ولا حزن ولا أذى ولا غمّ، حتى الشوكة يُشاكها، إلا كفّر الله بها من خطاياه","reference":"البخاري 5641","grade":"صحيح","usage":"قيمة","reflection":"تعلّمنا أن خلايا الدم تدافع وتسدّ الجروح، وأن المرض يصيب الجميع. والمرض ليس عيباً ولا ذنباً؛ هو ابتلاء يختبر الله به صبر المريض ويكتب له به حسنات، حتى الشوكة. والصبر خير، لكنه لا يعني ترك العلاج: قال النبي ﷺ «ما أنزل الله داءً إلا أنزل له شفاءً» (البخاري 5678)، فالمريض يصبر ويتداوى معاً. ونحن نسأل عنه ونساعده؛ قال النبي ﷺ: «حق المسلم على المسلم خمس: ردّ السلام، وعيادة المريض، واتباع الجنائز، وإجابة الدعوة، وتشميت العاطس» (البخاري 1240؛ ومسلم 2162 بلفظ قريب).","reviewed":false,"level":"خبر","concept":"المرض ليس عيباً ولا ذنباً؛ هو ابتلاء من الله يختبر به صبر المريض، ويكتب له به حسنات ويمحو عنه خطايا، حتى الشوكة. والصبر على المرض خير، لكنه لا يعني ترك العلاج: الإسلام أمر بالتداوي، فالمريض يصبر ويتداوى معاً.","avoid":"لا نقول للمريض إنه مقصّر أو أن مرضه بسببه، ولا نقول إن الصبر يغني عن الطبيب.","body_effect":"الخلايا البيضاء تدافع، والصفائح تسدّ الجروح، والجسم يحتاج مع ذلك إلى علاج ورعاية ووقت.","full_verified":true,"matn_note":"متن قصير كامل","hadith_key":"bukhari:5641","lead":"عن أبي سعيد الخدري وأبي هريرة رضي الله عنهما، عن النبي ﷺ قال:","narration":false,"source":"البخاري 5641","grader":"","cards":[]}},"life":[{"situation":"جُرح زميلي في الملعب ونزف.","science":"الصفائح تسدّ الجرح الصغير خلال دقائق إن ضغطنا عليه؛ الجرح العميق أو النازف بقوة قد يكون في وعاء كبير.","action":"أضغط على الجرح بقماش نظيف، وأطلب بالغاً فوراً، ولا أصوّره ولا أسخر منه.","value":"إنقاذ الحياة ومساعدة المصاب أعظم من أي لعب.","reference":"المائدة 32","why":"لماذا أضغط ولا أصوّر؟ لأن الصفائح تحتاج إلى سطح ساكن لتبني سدّها، والضغط يبطئ النزف حتى تعمل. وزميلي الجريح خائف؛ الكاميرا أو الضحك يزيدان خوفه ويُسرعان نبضه ونزفه. عظّم الله شأن إنقاذ النفس (سورة المائدة: الآية 32): والمساعدة في لحظة الحاجة من أعظم ما {تفعله|تفعلينه} في يومك{|ِ}.","cards":[],"verses":[]},{"situation":"مرض زميلي وغاب أسبوعاً.","science":"الخلايا البيضاء تزداد لتقاوم العدوى؛ المرض يصيب الجميع وليس عيباً.","action":"أسأل عنه ولا أعيّره بمرضه، وأغسل يدي لأحمي نفسي وغيري.","value":"المرض ليس ذنباً، والعناية بالمريض خير.","why":"المرض يصيب الجميع، الصغير والكبير والقوي والضعيف؛ هو اختبار للمريض بالصبر، واختبار لي بالعناية به. والنبي ﷺ قال إن ما أنزل الله داءً إلا أنزل له شفاء، فالمريض يُعالَج ولا يُعيَّر.","reference":"البخاري 5641؛ البخاري 5678؛ البخاري 1240","hadith":["bukhari:5678"],"cards":[{"key":"bukhari:5678","lead":"عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","text":"ما أنزل الله داءً إلا أنزل له شفاءً","narration":false,"source":"البخاري 5678","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا توجد فصائل الدم (A وB وO) أصلاً؟ وما فائدة اختلافها؟","why_open":"نعرف كيف نفحصها وننقل الدم بأمان، لكن سبب وجود هذه الاختلافات بين الناس وفائدتها لم يُفهم تماماً."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة أنبوب دم مفصولاً إلى طبقتين {وسمِّهما|وسمِّيهما}، ثم ارسم{|ي} بجانبه الخلايا الثلاث بأحجامها النسبية (الحمراء كثيرة، البيضاء قليلة وأكبر، الصفائح صغيرة). المستوى ب: ارسم{|ي} مراحل سدّ الجرح الأربع.","label":["البلازما","كريّة حمراء","خلية بيضاء","صفيحة","نخاع العظم"],"write":"أشرح بكلماتي: لماذا يبدو الدم أحمر مع أن البلازما صفراء؟ وأين تُصنع خلايا الدم، ولماذا يحتاج الجسم أن يصنعها كل يوم؟"},"imgs":["U03.L03-E1","U03.L03-E2","U03.L03-E3","U03.L03-E4","U03.L03-E5","U03.L03-E6","U03.L03-E7","U03.L03-exp","U03.L03-hist1","U03.L03-hist2","U03.L03-letter","U03.L03-life","U03.L03-title-boy","U03.L03-title-girl"]};
