const LD = {"id":"U04.L03","first":false,"title":"قضية الوحدة: الهواء الذي أتنفسه","driving_question":"لماذا تسعل{|ين} في الغبار، ولماذا يلهث عمّك على الدرج، وما الذي {تفعله|تفعلينه} حين يُدخَّن حولك{|ِ}؟","central_fact":"مجاري الهواء تحمي نفسها بالمخاط والأهداب والسعال والعطاس؛ والدخان يُبطل هذه الحماية ويؤذي الحويصلات، ويصل إلى كل من في الغرفة.","next":null,"nexts":[],"hook":{"text":"{اسم}، نفضت{|ِ} سجادة قديمة فسعلت{|ِ} ثلاث مرات. من قرر أن تسعل{|ي}؟ أنت{|ِ} لم تختر{|ي}!","options":["الرئة سعلت وحدها","شيء في مجاري الهواء أحسّ بالغبار وأمر الدماغ بالسعال","الغبار نفسه خرج وحده","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["respiratory"],"highlight":["nose","trachea"],"zoom":"head_chest"},"text":"لا جديد في العلم اليوم؛ سنستعمل ما تعلمناه. تذكّر{|ي}: الهواء يدخل من الأنف فيدفَّأ ويرطَّب ويُنظَّف. كيف يُنظَّف؟ الأنف والمجاري مبطّنة بمخاط لزج يلتقط الغبار والميكروبات، وبأهداب دقيقة جداً — كرموش عينك{|ِ} لكنها لا تُرى إلا بالمجهر — تتحرك كمكنسة فتدفع المخاط إلى الخارج أو إلى الحلق فنبتلعه بلا أن نشعر. هذا دفاع مجاري الهواء، يعمل كل لحظة."},{"id":"E2","level":"A","atlas":{"layers":["respiratory","nervous"],"highlight":["airways","brainstem"],"zoom":"head_chest","animate":"cough"},"text":"فإذا دخل ما هو أكثر من طاقة المخاط — غبار كثير أو دخان أو شيء علق في الحلق — التقطته حسّاسات في جدار المجاري وأرسلت إشارة إلى الدماغ، فأمر عضلات التنفس: شهيق عميق، ثم انغلاق مفاجئ في الحنجرة، ثم دفعة هواء قوية تُخرج المهيّج. هذا السعال. والعطاس مثله لكن المهيّج في الأنف والدفعة من الأنف. لم تقرر{|ي} أنت{|ِ}؛ الدماغ حماك{|ِ} قبل أن تفكر{|ي}. السعال حماية، والمرض هو ما يهيّج."},{"id":"E3","level":"A","atlas":{"layers":["respiratory"],"highlight":["alveoli","bronchioles"],"zoom":"lung_inside"},"text":"والآن الدخان. دخان السجائر والشيشة يشلّ الأهداب فتتوقف المكنسة ويتراكم المخاط — لذلك يسعل المدخّن صباحاً — ويؤذي الأنابيب الدقيقة ويُتلف الحويصلات مع السنين فيقلّ سطح التبادل. وهذا سبب لهاث عمّك على الدرج: حويصلات أقل تحتاج أنفاساً أكثر للأكسجين نفسه. والشيشة ليست أقل ضرراً: الماء لا ينقّي الدخان من مواده الضارة، وجلسة واحدة تُدخل دخاناً كثيراً. هذا ما تقوله منظمة الصحة العالمية بعد قياس لا بعد ظن."},{"id":"E4","level":"A","atlas":{"layers":["respiratory"],"highlight":["alveoli"],"zoom":"room"},"text":"ومن يجلس في غرفة مدخَّنة يتنفس الدخان نفسه: يدخل أنفه ومجاريه وحويصلاته هو أيضاً، وإن لم يدخّن قط. الأطفال أكثر تأثراً لأن رئاتهم ما زالت تنمو. لذلك من حقك{|ِ} أن تطلب{|ي} هواءً نظيفاً — بأدب: تفتح{|ين} نافذة، أو تخرج{|ين}، أو تطلب{|ين} أن يُدخَّن خارج الغرفة، وتخبر{|ين} أمك{|ِ} أو أباك{|ِ}. لا توبيخ ولا محاضرة؛ طلب واحترام."},{"id":"E5","level":"B","atlas":{"layers":["respiratory","circulatory","nervous"],"highlight":["lungs","heart","brainstem"],"zoom":"body"},"text":"للمستوى ب: لنجمع الوحدات الثلاث في موقف واحد. تركض{|ين} فتحتاج عضلاتك{|ِ} أكسجيناً أكثر وتصنع ثاني أكسيد كربون أكثر؛ حسّاسات الدماغ تقيس ذلك فتأمر عضلات التنفس أن تعمل أسرع والقلب أن يدق أسرع، في اللحظة نفسها. الرئة تحمّل الدم، والقلب يدفعه، والدم يسلّم العضلة. لو كانت حويصلات شخص أقل بسبب الدخان، فسيلهث أسرع من غيره على الدرج نفسه ليعوّض السطح الناقص. ثلاثة أنظمة، شبكة واحدة، لا طابور."}],"practice":[{"id":"U04.L03.P1","after":"E2","objective":"U04.L03.O1","type":"sequence","prompt":"رتّب{|ي} ما يحدث حين يدخل غبار كثير إلى مجاري الهواء.","options":["حسّاسات المجاري تلتقط الغبار","إشارة إلى الدماغ","شهيق عميق ثم انغلاق الحنجرة","دفعة هواء قوية تُخرج الغبار"],"answer":[0,1,2,3],"explanation":"حسّاسات المجاري تحسّ بالغبار أولاً، فترسل إشارة إلى الدماغ، فيأمر بشهيق عميق ثم انغلاق الحنجرة، ثم دفعة هواء قوية تُخرج الغبار.","level":"A","feedback_wrong":"من يحسّ أولاً؟ ومن يأمر؟"},{"id":"U04.L03.P2","after":"E3","objective":"U04.L03.O3","type":"choose_reason","prompt":"قال زميل{ك|تكِ}: «الشيشة لا تضر لأن الدخان يمر بالماء». ما الصواب؟","options":["خطأ؛ الماء لا يزيل المواد الضارة، والجلسة طويلة","صحيح؛ الماء ينقّي الدخان من كل ضرره","صحيح، لكن للكبار فقط لأن رئاتهم أقوى وأكبر من رئاتنا","خطأ؛ لأن الماء نفسه يضر الرئة"],"answer":0,"explanation":"الماء لا يمسك المواد الضارة في الدخان، والجلسة الطويلة تُدخل إلى الرئتين دخاناً كثيراً.","level":"A","feedback_wrong":"هل يستطيع الماء أن يمسك كل ما في الدخان؟ ماذا قاسوا؟","feedback_by_option":{"1":"الماء لا يزيل المواد الضارة من الدخان.","2":"الدخان يؤذي رئات الكبار والصغار؛ ورئات الصغار أكثر تأثراً لأنها تنمو.","3":"الحكم «خطأ» صحيح، لكن السبب ليس الماء؛ الضرر في الدخان نفسه."}},{"id":"U04.L03.P3","objective":"U04.L03.O4","type":"choose_reason","prompt":"لماذا نعطس في المرفق لا في الكف؟","options":["لأن المرفق أقوى من الكف فيوقف العطسة ويحبسها كلها","لأن الكف تلمس الناس والأشياء بعدها فتنقل ما فيها","لأن المرفق أقرب إلى الفم من الكف","لا فرق؛ المهم أن نغطي بأي شيء"],"answer":1,"explanation":"الكف تلمس الناس والأشياء بعد العطسة فتنقل ما عليها، أما المرفق فلا نلمس به أحداً.","level":"A","feedback_wrong":"ماذا تفعل يدك بعد العطسة؟","feedback_by_option":{"0":"المرفق لا يحبس العطسة؛ يغطيها. والمهم ما نلمسه بعدها.","2":"الكف تصل إلى الفم أيضاً؛ الفرق فيما نلمسه بعد العطسة.","3":"هناك فرق: الكف تلمس الناس والأشياء بعدها فتنقل ما عليها."}}],"check":[{"id":"U04.L03.C1","objective":"U04.L03.O2","type":"fix_model","prompt":"افحص{|ي} نموذج التنفس الخاطئ كاملاً واكتب{|ي} كل خطأ وصوابه (فيه خمسة أخطاء).","answer":"1 الرئتان لهما عضلات تشفط → الحجاب الحاجز والأضلاع. 2 أنبوب من الرئة إلى العضلة → عبر الدم. 3 الرئة كيس فارغ → مئات الملايين من الحويصلات. 4 سهم ثاني أكسيد الكربون من الهواء إلى الدم → من الدم إلى الهواء. 5 الأنف أنبوب فارغ → مبطّن بمخاط وأهداب تنظّف الهواء.","level":"A","rubric":"R1"},{"id":"U04.L03.C2","objective":"U04.L03.O3","type":"explain_open","prompt":"في زيارة عائلية يدخّن أحد الأقارب في الغرفة وأنت{|ِ} فيها. ماذا تفعل{|ين}، وكيف تقول{|ين}ه؟","answer":"أخرج أو أفتح نافذة، وأطلب بأدب أن يُدخَّن خارج الغرفة، وأخبر أمي أو أبي؛ بلا توبيخ.","level":"A","rubric":"R1"},{"id":"U04.L03.C3","objective":"U04.L03.O1","type":"true_false_why","prompt":"«السعال مرض؛ كلما توقف السعال شُفيت الرئة». صح أم خطأ؟","answer":"خطأ؛ السعال حماية تُخرج المهيّج؛ المرض هو سبب التهيّج، والسعال علامته لا هو المرض.","level":"A","rubric":"R1"},{"id":"U04.L03.C4","objective":"U04.L03.O5","type":"explain_open","prompt":"صعد طفلان الدرج نفسه بالسرعة نفسها؛ أحدهما يعيش في بيت مدخَّن ويلهث أكثر. فسّر{|ي} بذكر الرئة والقلب والدم والدماغ.","answer":"الدخان أذى حويصلاته فقلّ سطح التبادل؛ ليحصل على الأكسجين نفسه يأمر الدماغ بتنفس أسرع، والقلب يدق أسرع ليدفع الدم الذي يحمله إلى العضلات.","level":"B","rubric":"R1"}],"concepts":[{"id":"cough_sneeze","term":{"ar":"السعال والعطاس","en":"Cough and sneeze","zh":"咳嗽与打喷嚏","pinyin":"késou yǔ dǎ pēntì","match":["السعال","العطاس","أسعل","تسعل","يعطس","أعطس"]},"priority":"core","atlas":{"layer":"respiratory","element":"airways"},"card":{"A":"دفعة هواء قوية مفاجئة تُخرج ما يهيّج مجاري الهواء: السعال من الفم، والعطاس من الأنف. حماية لا مرض.","B":"حسّاسات في جدار المجاري تلتقط المهيّج وترسل إشارة إلى الدماغ، فيأمر عضلات التنفس بشهيق عميق ثم دفعة قوية."}},{"id":"airway_defense","term":{"ar":"دفاع مجاري الهواء","en":"Airway defenses","zh":"气道防御","pinyin":"qìdào fángyù","match":["المخاط","الأهداب"]},"priority":"supporting","atlas":{"layer":"respiratory","element":"trachea"},"card":{"A":"الأنف والمجاري مبطّنة بمخاط لزج يحجز الغبار والميكروبات، وبأهداب — كرموش العين لكنها لا تُرى إلا بالمجهر — تتحرك كمكنسة فتدفعه إلى الخارج أو إلى الحلق لنبتلعه.","B":"الأهداب تتحرك كالمكنسة إلى الأعلى؛ الدخان يشلّها فيتراكم ما تحجزه ويسعل المدخّن."}},{"id":"smoke_harm","term":{"ar":"ضرر الدخان","en":"Smoke harm","zh":"烟雾危害","pinyin":"yānwù wēihài","match":["الدخان","دخان","التدخين","الشيشة"]},"priority":"core","atlas":{"layer":"respiratory","element":"alveoli"},"card":{"A":"دخان السجائر والشيشة يؤذي الأنابيب الدقيقة والحويصلات، ومن يجلس في الدخان يتنفسه أيضاً. الماء في الشيشة لا ينقّي الدخان.","B":"منظمة الصحة العالمية: التدخين يقتل أكثر من 8 ملايين إنسان كل سنة، منهم نحو 1.3 مليون لم يدخّنوا بل تنفسوا دخان غيرهم."}}],"experiment":{"title":"أفحص هواء بيتي وأعلّم أدب العطاس","materials":["ورقة فحص (في الدفتر): أماكن البيت والمدرسة","منديل ورقي","(للمعلم فقط) فلفل أسود مطحون في طبق للعرض من بعيد"],"steps":["امشِ{|ي} في بيتك{|ِ} واكتب{|ي} في الدفتر: أين الهواء نظيف (نافذة مفتوحة، لا دخان) وأين لا (دخان، غبار كثير، رائحة قوية).","{اختر|اختاري} شيئاً واحداً تستطيع{|ين} تغييره بأدب هذا الأسبوع (فتح نافذة، طلب التدخين خارج الغرفة، تنظيف غبار).","تدرّب{|ي} على أدب العطاس: ارفع{|ي} مرفقك{|ِ} إلى فمك{|ِ} وأنفك{|ِ} ثلاث مرات حتى تصير حركة تلقائية. ثم {علّمها|علّميها} لأخ أو صديق.","اغسل{|ي} يديك{|ِ} بالماء والصابون عشرين ثانية بعد كل سعال في الكف أو عطاس.","(عرض المعلم من بعيد) رشّة فلفل خفيفة في الهواء بعيداً عن الوجوه: من أحسّ بدغدغة في أنفه يعرف الآن كيف يبدأ العطاس. لا يشمّ أحد الطبق مباشرة.","سجّل{|ي} في الدفتر: ما الذي {غيّرته|غيّرتِه}، ومن {علّمته|علّمتِه} أدب العطاس."],"safety":["لا يشمّ الأطفال الفلفل مباشرة ولا يُرشّ قرب الوجوه؛ العرض للمعلم فقط ومن لديه ربو يبتعد.","لا نقترب من دخان لنجرّب؛ نتعلم عنه دون أن نتنفسه.","الطلب من الكبار بأدب واحترام؛ لا توبيخ ولا محاضرة."],"expected":"يكتشف الطفل مكاناً أو اثنين يحتاج هواؤهما إلى تحسين، ويُتقن حركة المرفق ويعلّمها لشخص آخر.","explain":"ما {فعلته|فعلتِه} هو ما يفعله الدماغ لرئتيك{|ِ}: يراقب ويحمي. أنت{|ِ} فحصت{|ِ} الهواء حولك{|ِ} كما تفحص الحسّاسات الهواء في مجاريك{|ِ}؛ وحركة المرفق تمنع قطرات عطستك{|ِ} من الوصول إلى رئة غيرك{|ِ} كما يمنع مخاط أنفك{|ِ} الغبار من الوصول إلى رئتك{|ِ}.","record":"قائمة فحص الهواء، الشيء الذي غيّرته، واسم من علّمته أدب العطاس.","alternatives":["إن لم يمكن فحص البيت: افحص{|ي} الصف والملعب.","إن لم يوجد فلفل: يكفي وصف الدغدغة التي تسبق العطاس."]},"find_the_error":[{"id":"FE1","atlas_variant":"lungs_with_muscles","error":"رئتان لهما عضلات تشفط الهواء","answer":"الحجاب الحاجز وعضلات الأضلاع توسّع الصدر؛ الرئتان لا عضلات فيهما تنفخهما","detects":"M43"},{"id":"FE2","atlas_variant":"lung_to_muscle_tube","error":"أنبوب من الرئة إلى عضلة الساق","answer":"الأكسجين يركب الدم عبر القلب","detects":"M03"},{"id":"FE3","atlas_variant":"empty_lung","error":"الرئة كيس فارغ","answer":"مئات الملايين من الحويصلات حولها شعيرات دموية","detects":"M25"},{"id":"FE4","atlas_variant":"co2_into_blood","error":"سهم ثاني أكسيد الكربون من الهواء إلى الدم","answer":"من الدم إلى الهواء ليخرج","detects":"M02"},{"id":"FE5","atlas_variant":"empty_nose","error":"الأنف أنبوب فارغ أملس","answer":"مبطّن بمخاط وأهداب تنظّف الهواء، وهو يدفّئه ويرطّبه","detects":"M45"}],"numbers":[{"text":"عطسة واحدة تدفع الهواء بسرعة كبيرة وتنثر آلاف القطرات الدقيقة؛ لذلك نغطيها بالمرفق.","source":["S1"]},{"text":"نحو 1.3 مليون إنسان يموتون كل سنة بسبب دخان لم يدخّنوه هم، بل تنفسوه من غيرهم.","source":["S4"]}],"true_size":[{"text":"غطّ{|ي} أنفك{|ِ} وفمك{|ِ} بمرفقك{|ِ}: المسافة من مرفقك{|ِ} إلى أنفك{|ِ} هي المسافة التي تقطعها قطرات عطستك{|ِ} في أقل من لحظة لو لم {تغطها|تغطيها}.","source":["S1"]}],"animal":{"text":"الخيل تتنفس عبر الأنف ولا تستطيع التحول إلى التنفس من الفم مثل الإنسان. وللطيور رئتان وأكياس هوائية تساعد على استمرار جريان الهواء عبر الرئتين. الأكياس تحرك الهواء، والتبادل يتم في الرئتين.","source":["S7","S8"]},"organ_letter":{"from":"الأنف","text":"أنا الأنف. تظنون أني للرائحة فقط. أنا بوّاب الرئتين: أدفّئ كل نَفَس وأرطّبه وأحجز غباره في مخاطي، وأهدابي الدقيقة تكنسه إلى الخارج طوال اليوم. حين يفوقني الغبار أعطس — فغطّني بمرفقك{|ِ} لا بكفك{|ِ}. وحين يأتيني دخان لا أستطيع تنقيته؛ أرجوك{|ِ} ابعد{|ي} عنه. مع التحية، بوّاب في منتصف وجهك{|ِ}."},"history":[{"who":"علماء الوبائيات في القرن العشرين","origin":"دول كثيرة","where_when":"1950–2000","did":"تتبّعوا عشرات آلاف الناس سنوات وقارنوا بعدل بين من يعيشون مع مدخّن ومن لا، فأثبتوا أن دخان الغير يؤذي؛ وعلى ذلك بُنيت قوانين منع التدخين في الأماكن المغلقة.","did_not":"لم يكتشفوا ذلك في تجربة واحدة ولا في يوم واحد؛ احتاج الأمر دراسات كثيرة متكررة قبل أن يصير اتفاقاً.","method_lesson":"المقارنة العادلة على أعداد كبيرة تكشف ما لا تكشفه الحالة الواحدة.","source":["S4"]}],"how_we_know":{"text":"كيف عرفنا أن دخان الغير يؤذي؟ لم يكفِ أن نظن؛ تتبّع العلماء عشرات آلاف الناس سنوات طويلة وقارنوا بعدل: من يعيشون مع مدخّن ومن لا يعيشون، مع تثبيت ما عدا ذلك (العمر، العمل، السكن). فوجدوا أن من لم يدخّن لكنه عاش في الدخان مرض أكثر. هذه هي المقارنة العادلة التي تعلمناها في الوحدة الأولى — لكن على ملايين الناس. ولهذا تمنع كثير من الدول التدخين في الأماكن المغلقة.","limit_question":"ما الذي لا يُظهره رسم السعال في هذا الدرس؟"},"what_changed":["ظُن طويلاً أن الدخان يضرّ المدخّن وحده؛ الدراسات بيّنت أن من حوله يتضرر أيضاً.","ظُن أن ماء الشيشة ينقّي الدخان؛ القياس بيّن أنه لا يزيل المواد الضارة."],"model_limits":["رسم السعال يُظهر الغبار كنقاط كبيرة؛ الحقيقي لا يُرى غالباً.","لا يُظهر الرسم الميكروبات في القطرات ولا الخلايا البيضاء التي تدافع (وحدة الدفاع).","نموذج الدرس لا يُظهر ماذا يحدث داخل الخلية بالأكسجين.","مقطع البطانة والأهداب مكبَّر طولياً دون رسم الأنف كاملاً؛ أثر الدخان مبسط.","خط التحكم في مخطط الشبكة ينتهي قرب عضلات الصدر؛ لا يعني أن الرئة عضلة تنقبض بذاتها."],"faith":{"opening":null,"closing":{"text":"لا ضرر ولا ضرار","reference":"ابن ماجه 2341","grade":"حسن","usage":"قيمة","reflection":"قال النبي ﷺ: «لا ضرر ولا ضرار». تعلّمنا اليوم أن دخاني لا يبقى في رئتي بل يدخل رئة من حولي، وأن عطستي تصل أنف غيري. القاعدة قصيرة وعملها كبير: لا أضرّ بنفسي، ولا أضرّ بغيري، ولا أردّ الضرر بضرر. فما الذي {ستفعله|ستفعلينه} هذا الأسبوع لهواء بيتك{|ِ}؟","reviewed":false,"highlight":"لا ضرر ولا ضرار","full_verified":true,"level":"نهي","concept":"النهي عن إلحاق الضرر بالنفس وبالغير؛ وهواء الغرفة مشترك.","avoid":"لا نجعل الطفل قاضياً على أهله المدخّنين؛ يطلب بأدب ولا يوبّخ. ولا نقول إن الحديث عن التدخين تحديداً؛ هو قاعدة عامة ونحن نطبّقها.","matn_note":"المتن كما في سنن ابن ماجه (2341، من حديث ابن عباس رضي الله عنهما)؛ ورقم 2340 حديث عبادة بلفظ «قضى أن لا ضرر ولا ضرار».","text_comparison_url":"https://hadithprophet.com/hadith-43660.html","text_compared_on":"2026-11-12","grading_review_required":true,"grading_review_note":"إسناد ابن ماجه (2341) فيه جابر الجعفي وهو ضعيف؛ حسّنه النووي بمجموع طرقه (الأربعون 32)، وصحّحه الألباني. يُعرض للطفل «حسن» مع ذكر من حسّنه، ويُراجع المراجع الشرعي هذا الحكم.","hadith_key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","narration":false,"source":"ابن ماجه 2341","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني","cards":[]}},"life":[{"situation":"عمّي يدخّن الشيشة في جلسة العائلة والأطفال حوله.","science":"دخان الشيشة يملأ الغرفة ويدخل حويصلات كل من فيها؛ الماء لا ينقّيه.","action":"آخذ الصغار إلى غرفة أخرى أو الشرفة، وأقول بأدب: «يا عمّي، هل تدخّن في الشرفة؟»، وأخبر أبي.","value":"أحمي الصغار وأحترم الكبار في الوقت نفسه.","why":"لماذا لا أسكت؟ لأن الضرر يقع الآن على رئات تنمو، ولأن الطلب بأدب ليس قلة احترام بل حرص على عمّي أيضاً. والنبي ﷺ نهى عن الضرر وعن مقابلة الضرر بالضرر: فأمنع الضرر عن الصغار دون أن أُلحق بعمّي إهانة.","reference":"ابن ماجه 2341","hadith":["ibnmajah:2341"],"cards":[{"key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","text":"لا ضرر ولا ضرار","narration":false,"source":"ابن ماجه 2341","grade":"حسن","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني"}],"verses":[]},{"situation":"أُصبت بزكام وأنا في الصف.","science":"سعالي وعطاسي ينثران قطرات فيها الميكروب نفسه الذي أمرضني.","action":"أعطس في مرفقي، وأغسل يدي، وأبقى في البيت إن أمكن حتى أتحسن.","value":"لا أنقل مرضي لغيري.","why":"لماذا أبقى؟ لأن يوماً في البيت أهون من صف كامل مريض. والنبي ﷺ كان إذا عطس غطّى فمه بيده أو ثوبه وخفض صوته: أدب يحمي الناس.","reference":"أبو داود 5029","hadith":["abudawud:5029"],"cards":[{"key":"abudawud:5029","lead":"عن أبي هريرة رضي الله عنه قال:","text":"كان رسول الله ﷺ إذا عطس وضع يده أو ثوبه على فيه، وخفض — أو غضّ — بها صوته","narration":false,"source":"أبو داود 5029","grade":"حسن صحيح","grader":"قاله الترمذي في روايته له (2745)"}],"verses":[]}],"open_questions":[{"q":"لماذا يعطس بعض الناس حين ينظرون فجأة إلى الشمس؟","why_open":"ظاهرة معروفة تحدث عند نحو ربع الناس، وسببها الدقيق في الأعصاب ما زال موضع بحث."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة خريطة هواء بيتك{|ِ}: علامة ✔ حيث الهواء نظيف و✘ حيث لا. ثم ارسم{|ي} طفلاً يعطس في مرفقه. المستوى ب: ارسم{|ي} الشبكة: عضلة تحتاج أكسجيناً ← الدماغ ← الرئة والقلب معاً.","label":["هواء نظيف ✔","دخان ✘","المرفق","— ب: الدماغ يأمر الرئة والقلب م
