const LD = {"id":"U03.T04","lesson":"U03.L04","first":false,"title":"اختبار: قضية الوحدة: أفحص نموذج الدورة الدموية","lessonTitle":"قضية الوحدة: أفحص نموذج الدورة الدموية","concepts":[],"check":[],"items":[{"id":"U03.L04.A1.a","objective":"U03.L04.O1","level":"A","type":"fix_model","prompt":"نموذج جديد فيه أربعة أخطاء (غير النموذج الذي تدربت{|ِ} عليه): القلب في الجانب الأيمن كله؛ الوريد يحمل الدم بعيداً عن القلب؛ الصفائح تحمل الأكسجين؛ الشعيرات مرسومة أعرض من الشرايين. اكتشف{|ي} وصحّح{|ي}.","answer":"القلب في المنتصف مائل يساراً؛ الوريد يعيد الدم إلى القلب؛ الكريّات الحمراء تحمل الأكسجين؛ الشعيرات الأرفع.","rubric":"R1"},{"id":"U03.L04.A1.b","objective":"U03.L04.O1","level":"A","type":"choose","prompt":"أي العبارات صحيحة في نموذج جيد للدورة؟","options":["التبادل يحدث في كل الأوعية","التبادل يحدث في القلب","التبادل يحدث في الأوردة","التبادل يحدث في الشعيرات فقط"],"answer":3,"explanation":"جدار الشريان والوريد أسمك من أن يعبره الأكسجين، أما جدار الشعيرة فرقيق جداً؛ لذلك يحدث التبادل في الشعيرات فقط.","feedback_by_option":{"0":"جدار الشريان والوريد سميك لا يعبره الأكسجين؛ فليست كل الأوعية.","1":"القلب يدفع الدم؛ والتبادل مع الخلايا في أوعية رقيقة الجدار.","2":"جدار الوريد أسمك من أن يعبره الأكسجين."},"alt":{"prompt":"أي عبارة يجب أن تكون في نموذج جيد للدورة؟","options":["الدم يمر بالرئتين مرة واحدة في اليوم","الشرايين تحمل الأكسجين، والأوردة تحمل الفضلات","القلب يصنع الدم ويدفعه","الشرايين تحمل الدم بعيداً عن القلب، والأوردة تعيده إليه"],"answer":3,"explanation":"الشريان يحمل الدم بعيداً عن القلب، والوريد يعيده إليه؛ فالقاعدة الاتجاه.","feedback_by_option":{"0":"الدم يمر بالرئتين في كل دورة، مرات كثيرة في اليوم.","1":"الأوعية تُعرَّف باتجاهها لا بما تحمله؛ والشريان الرئوي يحمل دماً قليل الأكسجين.","2":"القلب يدفع الدم فقط؛ والصنع في نخاع العظم."},"detects":"M06"}},{"id":"U03.L04.A1.c","objective":"U03.L04.O1","level":"A","type":"choose","prompt":"متى يكون تلوين الدم بالأزرق في نموذج للدورة الدموية مقبولاً؟","answer":0,"options":["إذا كُتب بوضوح أنه ترميز للدم القليل الأكسجين","إذا كان دم الأوردة فعلاً أزرق","لا يُقبل، لأن من يراه سيظن الدم أزرق ولو كُتب أنه ترميز","إذا كان الدم المرسوم داخل القلب، لا في العروق"],"explanation":"الدم أحمر دائماً (داكن حين يقلّ أكسجينه)؛ الأزرق ترميز مقبول إن قيل إنه ترميز، وخطأ إن قُدّم على أنه لون الدم.","detects":"M04","feedback_by_option":{"1":"دم الأوردة أحمر داكن لا أزرق؛ الأزرق مقبول حين يُكتب أنه ترميز.","2":"الترميز بالألوان مفيد ما دام مكتوباً أنه ترميز.","3":"الدم داخل القلب أحمر أيضاً؛ والترميز مقبول في أي موضع إذا قيل إنه ترميز."},"alt":{"prompt":"في نموذج زميل{ك|تكِ} كُتب على الوريد: «هنا الدم أزرق». كيف تصحّح{|ين} العبارة؟","options":["«هنا دم أزرق، لأنه ترك أكسجينه كله في خلايا الجسم»","«هنا دم أزرق لأنه بارد»","«هنا دم أحمر داكن قليل الأكسجين؛ والأزرق ترميز»","«لا خطأ؛ الدم في الأوردة أزرق»"],"answer":2,"explanation":"الدم أحمر دائماً، داكن حين يقلّ أكسجينه؛ والأزرق في النموذج ترميز يجب أن يُكتب أنه ترميز.","feedback_by_option":{"0":"دم الوريد فيه أكسجين أقل لا معدوم، ولونه أحمر داكن.","1":"البرودة لا تجعل الدم أزرق.","3":"الدم في الأوردة أحمر داكن؛ هذا خطأ يجب تصحيحه."},"detects":"M04"}},{"id":"U03.L04.A2.a","objective":"U03.L04.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة كريّة من عضلة الساق إلى الرئتين.","options":["شعيرة في الساق","وريد","يمين القلب","الشريان الرئوي","شعيرات الرئتين"],"answer":[0,1,2,3,4],"explanation":"من شعيرة الساق إلى وريد يعود إلى يمين القلب، الذي يدفعها في الشريان الرئوي إلى شعيرات الرئتين.","alt":{"prompt":"رتّب{|ي} رحلة كريّة حمراء من الرئتين إلى عضلة الذراع وعودتها.","options":["شعيرات الرئتين","يسار القلب","شريان","شعيرة في عضلة الذراع","وريد","يمين القلب"],"answer":[0,1,2,3,4,5],"explanation":"تمسك الكريّة الأكسجين في الرئتين وتعود إلى يسار القلب، فيدفعها في شريان إلى شعيرة في الذراع تترك فيها جزءاً من أكسجينها، ثم تعود في وريد إلى يمين القلب."}},{"id":"U03.L04.A2.b","objective":"U03.L04.O2","level":"A","type":"choose","prompt":"في أي موضعين تتبادل الكريّة الأكسجين؟","options":["القلب والأبهر","شعيرات الرئتين وشعيرات الجسم","الوريد والشريان","نخاع العظم والطحال"],"answer":1,"explanation":"تأخذ الكريّة الأكسجين في شعيرات الرئتين، وتتركه في شعيرات الجسم.","feedback_by_option":{"0":"جدار القلب والأبهر سميك؛ والتبادل يحدث في أوعية رقيقة جداً.","2":"جدار الشريان والوريد سميك لا يعبره الأكسجين.","3":"نخاع العظم يصنع الكريّات؛ والتبادل يحدث حيث الأوعية الرقيقة."},"alt":{"prompt":"أين تترك الكريّة الحمراء أكسجينها في رحلتها إلى الساق؟","options":["في وريد الساق","في شريان الساق الكبير","في شعيرات عضلة الساق","في القلب"],"answer":2,"explanation":"الكريّة تترك أكسجينها في الشعيرات لأن جدارها رقيق جداً، ثم تعود في وريد إلى القلب.","feedback_by_option":{"0":"حين تصل الكريّة إلى الوريد تكون قد تركت أكسجينها قبله.","1":"جدار الشريان سميك لا يعبره الأكسجين.","3":"القلب يدفع الكريّة ولا يأخذ منها أكسجين الخلايا."},"detects":"M03"}},{"id":"U03.L04.A2.c","objective":"U03.L04.O2","level":"A","type":"explain_open","prompt":"اكتب{|ي} قصة قصيرة من أربع جمل بلسان كريّة حمراء في رحلة واحدة، وسمِّ{|ي} فيها الوعاء في كل مرحلة.","answer":"{تذكر|تذكرين} الرئتين (أخذ الأكسجين)، القلب، الشريان، الشعيرة (تسليم)، الوريد، العودة.","rubric":"R1"},{"id":"U03.L04.A3.a","objective":"U03.L04.O3","level":"A","type":"explain_open","prompt":"صعد{|ت} طفل{|ة} الدرج {مسرعاً|مسرعةً} فوجد{|ت} قلبه{|ا} يدق بقوة ونفسه{|ا} سريعاً. فسّر{|ي} بثلاثة مفاهيم من الوحدة.","answer":"العضلات تحتاج أكسجيناً أكثر؛ الكريّات الحمراء تحمله؛ القلب يدق أسرع ليزيد النقل عبر الشرايين إلى الشعيرات؛ النبض هو ما يُحسّ.","rubric":"R1"},{"id":"U03.L04.A3.b","objective":"U03.L04.O3","level":"A","type":"choose_reason","prompt":"جرح صغير توقف نزفه وحده خلال دقائق، لكن الطبيب قال إن جرح الشريان لا يتوقف وحده. لماذا؟","options":["لأن دم الشريان لا صفائح فيه لتسد الجرح","لأن الشريان أزرق فلا يتجلط دمه","لأن الدم في الشريان تحت ضغط عالٍ ويخرج دفعات قوية","لأن الشريان عميق فلا يصل إليه الهواء الذي يجفف الدم"],"answer":2,"explanation":"الدم في الشريان تحت ضغط عالٍ ويخرج دفعات قوية مع كل ضربة، فيصعب على الصفائح أن تسدّه وحدها.","detects":"M04","feedback_by_option":{"0":"الصفائح في الدم كله؛ المشكلة في قوة الدفعات.","1":"الشريان ليس أزرق والدم فيه أحمر؛ الفرق في قوة اندفاع الدم فيه.","3":"الهواء ليس ما يوقف النزف؛ الصفائح وشبكة الألياف تفعل ذلك. والمشكلة هنا قوة الدفعات."},"alt":{"prompt":"لماذا نضغط بقطعة قماش نظيفة على جرح ينزف؟","options":["لنبرّد الجرح فيتوقف الدم من البرد","لنُدخل الدم إلى الجسم من جديد","لأن القماش يصنع صفائح","لنبطئ خروج الدم حتى يُسدّ الجرح"],"answer":3,"explanation":"الضغط يبطئ خروج الدم، فتلحق الصفائح بالالتصاق بحافة الوعاء وتتكون شبكة الألياف فتسدّ الجرح. وإذا لم يتوقف النزف نطلب بالغاً.","feedback_by_option":{"0":"التبريد ليس الهدف؛ الضغط يبطئ خروج الدم حتى يُسدّ الجرح.","1":"الدم الخارج لا يعود إلى الأوعية؛ الضغط يبطئ خروجه.","2":"الصفائح تُصنع في نخاع العظم؛ والقماش يساعدها بإبطاء خروج الدم."}}},{"id":"U03.L04.A3.c","objective":"U03.L04.O3","level":"A","type":"explain_open","prompt":"لماذا يصفّ الطبيب الدم في أنبوب قبل أن يقرأه؟ وماذا سيرى؟","answer":"ليفصل البلازما عن الخلايا؛ يرى سائلاً أصفر فوق خلايا حمراء وطبقة بيضاء رقيقة.","rubric":"R1"},{"id":"U03.L04.A4.a","objective":"U03.L04.O4","level":"B","type":"true_false_why","prompt":"«لو كان لنا قلب بحجرتين كالسمكة لعمل جسمنا كما هو». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لاختلط الدم الغني بالقليل الأكسجين ولانخفض الضغط إلى الجسم؛ الحجرات الأربع تفصل الدورتين وتعطي البطين الأيسر ضغطاً عالياً.","detects":"M22","rubric":"R1","alt":{"prompt":"«في قلبنا جدار يفصل جانبه الأيمن عن الأيسر، فلا يختلط الدم القليل الأكسجين بالدم الغني به». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الجدار والحجرات الأربع تفصل الدورتين، فيصل إلى الجسم دم غني بالأكسجين."}},{"id":"U03.L04.A4.b","objective":"U03.L04.O4","level":"B","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أشياء لا يُظهرها أي نموذج للدورة الدموية {رأيته|رأيتِه} في الوحدة.","answer":"الحركة المستمرة، الحجم الحقيقي للشعيرات، اللون الحقيقي، عدد الأوعية، الصمامات، دخول الأكسجين في الرئتين.","rubric":"R2"},{"id":"U03.L04.A4.c","objective":"U03.L04.O4","level":"B","type":"choose_reason","prompt":"لماذا جدار البطين الأيسر أسمك من الأيمن مع أنهما يدفعان الكمية نفسها تقريباً؟","options":["لأن الأيسر أكبر عمراً فتصلّب جداره","لأن الأيمن يستريح بين ضربة وأخرى، والأيسر لا يستريح","لأن الدم في الأيسر أثقل لأنه مليء بالأكسجين فيحتاج عضلة أقوى","لأن الأيسر يدفع إلى الجسم كله، والأيمن إلى الرئتين فقط"],"answer":3,"explanation":"البطين الأيسر يدفع الدم إلى الجسم كله، والأيمن إلى الرئتين القريبتين فقط، فيحتاج الأيسر قوة أكبر وجداراً أسمك.","feedback_by_option":{"0":"جانبا القلب ينموان معاً؛ فعمرهما واحد.","1":"البطينان ينقبضان معاً في كل ضربة؛ لا يستريح أحدهما والآخر يعمل.","2":"الدم المحمّل بالأكسجين ليس أثقل بما يُذكر؛ الفرق في المسافة التي يُدفع إليها."},"alt":{"prompt":"ماذا يحدث لو صار جدار البطين الأيسر ضعيفاً رقيقاً كجدار الأيمن؟","options":["لا يتغير شيء","لا يصل الدم بقوة كافية إلى الجسم كله","يصل إلى الرئتين دم أقل، لأن البطين الأيسر يدفع إليهما","يتوقف صنع الدم"],"answer":1,"explanation":"البطين الأيسر يدفع الدم إلى الجسم كله، فيحتاج جداراً سميكاً قوياً؛ فإذا ضعف لم يصل الدم إلى الجسم بقوة كافية.","feedback_by_option":{"0":"الجدار السميك هو ما يعطي البطين الأيسر قوته؛ فهل يبقى كل شيء كما هو؟","2":"البطين الأيسر يدفع إلى الجسم، لا إلى الرئتين.","3":"صنع الدم في نخاع العظم، لا في القلب."}}},{"id":"U03.L04.A5.a","objective":"U03.L04.O5","level":"B","type":"explain_open","prompt":"اكتب{|ي} سؤالاً واحداً لم تجب عنه هذه الوحدة عن الأكسجين، وحدد{|ي} في أي وحدة تتوقع{|ين} الجواب.","answer":"مثل: كيف يعبر الأكسجين من الهواء إلى الدم في الرئتين؟ → وحدة التنفس. أو: لماذا تحتاج الخلية الأكسجين؟ → وحدة الخلية والطاقة.","rubric":"R4"},{"id":"U03.L04.A5.b","objective":"U03.L04.O5","level":"B","type":"choose_reason","prompt":"عرف هارفي أن الدم يدور قبل أن يرى الشعيرات. كيف؟","options":["حسب كمية الدم التي يدفعها القلب فوجدها أكبر من أن تُصنع كل مرة من جديد","خمّن ذلك ثم صدّقه الناس دون أن يحسب أو يجرّب شيئاً","رأى الدم أزرق في الأوردة وأحمر في الشرايين فاستنتج أنه يدور بينهما","سأل الأطباء القدماء فأخبروه أن الدم يدور في الجسم"],"answer":0,"explanation":"حسب هارفي كمية الدم التي يدفعها القلب في نصف ساعة، فوجدها أكبر من أن يصنعها الجسم من جديد كل مرة، فلا بد أن الدم نفسه يدور.","detects":"M04","feedback_by_option":{"1":"هارفي لم يكتفِ بالتخمين؛ حسب وجرّب. ماذا حسب؟","2":"دم الأوردة أحمر داكن لا أزرق؛ هارفي حسب كمية الدم التي يدفعها القلب.","3":"الأطباء القدماء قبله ظنوا أن الدم يُصنع ويُستهلك؛ وهارفي خالفهم بالحساب والتجربة."},"alt":{"prompt":"كيف عرف العلماء بعد هارفي أن الشعيرات موجودة فعلاً؟","options":["رآها مالبيغي بالمجهر في رئة ضفدع","خمّنوا ذلك من كلام هارفي دون أن يروها","رأوها بالعين المجردة في جلد اليد الرقيق","لأن الدم أزرق في الأوردة"],"answer":0,"explanation":"توقّع هارفي طريقاً بين الشرايين والأوردة، ثم رأى مالبيغي الشعيرات بالمجهر سنة 1661، فثبت ما توقعه.","feedback_by_option":{"1":"العلم لا يكتفي بالتخمين؛ احتاجوا دليلاً يُرى.","2":"الشعيرات أدق من أن تُرى بالعين المجردة.","3":"الدم أحمر دائماً، واللون لا يثبت وجود الشعيرات."},"detects":"M04"}},{"id":"U03.L04.A5.c","objective":"U03.L04.O5","level":"B","type":"compare","prompt":"قارن{|ي}: ما الذي أثبتته التجربة على يدك{|ِ} (الوريد الممتلئ من جهة الأصابع)، وما الذي لم تستطع إثباته؟","answer":"أثبتت أن الدم في الوريد يسير نحو القلب فقط؛ لم تُثبت وجود الشعيرات ولا كيف يدخل الأكسجين.","rubric":"R4"}],"transfer":[{"id":"U03.L04.T1","objective":"U03.L04.O3","level":"A","type":"explain_open","prompt":"البيطري يقيس نبض الخروف في المزرعة من شريان في الفخذ الداخلي. لماذا لا يقيسه من ظهر اليد كما نفعل في الرسغ؟ (فكّر{|ي}: أين يكون الشريان قريباً من السطح؟)","answer":"النبض يُحسّ حيث يمر شريان كبير قريباً من الجلد فوق عظم؛ عند الحيوان ذلك موضع مختلف عن الإنسان بسبب شكل أطرافه وصوفه.","rubric":"R1"},{"id":"U03.L04.T2","objective":"U03.L04.O4","level":"B","type":"explain_open","prompt":"الزرافة رقبتها طويلة جداً والدماغ أعلى القلب بمترين. ماذا تتوقع{|ين} في قلبها وشرايين رقبتها مقارنة بنا؟ ولماذا؟","answer":"قلب أقوى وجدار بطين أيسر أسمك وضغط أعلى ليدفع الدم صعوداً ضد الجاذبية؛ وصمامات/جدران قوية في أوعية الرقبة.","rubric":"R1"}],"recall":[{"id":"U03.L04.D1","objective":"U03.L04.O2","level":"A","type":"sequence","prompt":"رتّب{|ي}: وريد، شريان، شعيرة، القلب — ابتداءً من القلب.","options":["القلب","شريان","شعيرة","وريد"],"answer":[0,1,2,3],"explanation":"من القلب في شريان إلى شعيرة، ثم في وريد عائداً إلى القلب."},{"id":"U03.L04.D2","objective":"U03.L04.O1","level":"A","type":"choose","prompt":"أين يُصنع الدم؟","options":["القلب","الرئتان","نخاع العظم"],"answer":2,"explanation":"الدم يُصنع في نخاع العظم.","feedback_by_option":{"0":"القلب يدفع الدم ولا يصنعه.","1":"في الرئتين يأخذ الدم الأكسجين، ولا تُصنع فيهما خلاياه."}},{"id":"U03.L04.D3","objective":"U03.L04.O4","level":"B","type":"choose","prompt":"لماذا دورتان؟","options":["حتى لا يختلط الدم الغني بالأكسجين بالقليل","لأن القلب كبير جداً فيحتاج دورتين كاملتين","لأن الرئتين اثنتان فلكل رئة دورة خاصة بها"],"answer":0,"explanation":"دورة إلى الرئتين ودورة إلى الجسم، فلا يختلط الدم الغني بالأكسجين بالدم القليل الأكسجين.","feedback_by_option":{"1":"حجم القلب ليس السبب؛ السبب ألا يختلط نوعان من الدم.","2":"الرئتان تأخذان الدم معاً من دورة واحدة؛ والدورتان: واحدة إلى الرئتين وأخرى إلى الجسم."}},{"id":"U03.L04.D4","objective":"U03.L04.O3","level":"A","type":"choose_reason","prompt":"بعد الركض صار نبضك{|ِ} سريعاً. أي تفسير يستعمل مفاهيم الوحدة صحيحاً؟","options":["الرئتان ترسلان الأكسجين إلى العضلات مباشرة بلا دم","القلب يصنع دماً جديداً وقت الركض","العضلات تحتاج أكسجيناً أكثر، فيدق القلب أسرع","الدم يصير أزرق ثم يحمرّ"],"answer":2,"explanation":"العضلات العاملة تحتاج أكسجيناً أكثر، والكريّات الحمراء تحمله؛ فيدق القلب أسرع ليدفع دماً أكثر في الشرايين إلى شعيرات العضلات.","feedback_by_option":{"0":"الرئة لا تتصل بالعضلات؛ الأكسجين يدخل الدم في الرئتين، والقلب يدفعه إليها.","1":"القلب يدفع الدم ولا يصنعه، في الركض وفي غيره.","3":"الدم أحمر دائماً، فاتح أو داكن."},"detects":"M03"},{"id":"U03.L04.D5","objective":"U03.L04.O5","level":"B","type":"choose","prompt":"أي هذه سؤال ما زال مفتوحاً في نهاية الوحدة، لا شيء أثبتناه؟","options":["هل يسير الدم في الوريد نحو القلب؟","هل يدور الدم في الجسم؟","كيف يدخل الأكسجين من الهواء إلى الدم؟","أين تُصنع خلايا الدم؟"],"answer":2,"explanation":"عرفنا بالدليل أن الدم يدور، وأنه يسير في الوريد نحو القلب، وأن خلاياه تُصنع في نخاع العظم؛ أما كيف يدخل الأكسجين من الهواء إلى الدم فسؤال نبحثه في الوحدة التالية.","feedback_by_option":{"0":"تجربة اليد أظهرت أن الوريد يمتلئ من جهة الأصابع، فالدم فيه يسير نحو القلب.","1":"دوران الدم أثبته هارفي بالحساب والتجربة.","3":"عرفنا أن خلايا الدم تُصنع في نخاع العظم."}}]};
