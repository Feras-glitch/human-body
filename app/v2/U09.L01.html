const LD = {"id":"U09.L01","first":true,"title":"الجلد: درع حي يتجدد","driving_question":"{اسم}، {سقطت|سقطتِ} على الأرض فانخدشت ركبتك{|ِ}، وبعد أسبوعين لم يبق للخدش أثر تقريباً. من أصلح الجلد؟ وأين ذهب الجلد القديم؟","central_fact":"الجلد عضو حي من طبقتين: البشرة في الخارج تتجدد كلها في نحو أربعة أسابيع وفيها الميلانين الذي يحمي من أشعة الشمس، والأدمة تحتها فيها الأوعية والأعصاب وغدد العرق وجذور الشعر؛ وهو حاجز يحمي ويحسّ، ويُصلح نفسه بعد الخدش الصغير.","next":"U09.L02","nexts":[{"id":"U09.L02","gated":false},{"id":"U09.L03","gated":false},{"id":"U09.L04","gated":false}],"hook":{"text":"{اسم}، الجلد الذي يغطي يدك{|ِ} الآن: هل هو نفسه الذي كان عليها حين {وُلدت|وُلدتِ}؟","options":["نعم، هو نفسه ويكبر معي","لا، يتبدل باستمرار بخلايا جديدة","يتبدل مرة واحدة حين نكبر","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["skin"],"highlight":["skin"],"zoom":"body"},"text":"{انظر|انظري} إلى ظهر يدك{|ِ}. هذا الغطاء الذي يلفّ جسمك{|ِ} كله، من رأسك{|ِ} إلى باطن قدميك{|ِ}، هو الجلد. وهو أكبر عضو في جسمك{|ِ}: لو فُرد جلد رجل كبير لغطّى سريراً مفرداً تقريباً، ووزنه نحو سُبع وزن الجسم. لكنه ليس كيساً ميتاً يلفّنا؛ إنه حي، يحسّ ويعمل ويُصلح نفسه. واليوم نفتحه طبقة طبقة."},{"id":"E2","level":"A","atlas":{"layers":["skin"],"highlight":["epidermis","dermis"],"zoom":"skin_section"},"text":"لو {نظرت|نظرتِ} إلى قطعة رقيقة جداً من الجلد بالمجهر لرأيت{|ِ} طبقتين. في الخارج البشرة: خلاياها العليا ميتة مسطحة كقشور صغيرة تتساقط كل يوم دون أن نراها، وتحتها خلايا حية تنقسم وتصعد لتحل محلها؛ فبشرتك{|ِ} كلها تتبدل في نحو أربعة أسابيع. وتحت البشرة الأدمة: فيها أوعية دموية دقيقة، وأعصاب تحسّ، وغدد عرق، وجذور الشعر، وألياف تجعل الجلد قوياً يتمدد ويعود. وتحتهما طبقة دهن تحفظ الدفء."},{"id":"E3","level":"A","atlas":{"layers":["skin","nervous"],"highlight":["epidermis","nerve_endings","fat_layer"],"zoom":"skin_section"},"text":"ماذا يفعل جلدك{|ِ} طوال اليوم؟ هو أولاً حاجز: يمنع ماء جسمك{|ِ} أن يتسرّب، ويمنع الميكروبات والأوساخ أن تدخل؛ لذلك {تسبح|تسبحين} ساعة ولا يدخل الماء إلى جسمك{|ِ}. وهو ثانياً حسّاس: أعصاب الأدمة تخبر دماغك{|ِ} باللمس والدفء والبرد والألم، كما {عرفت|عرفتِ} في درس الحواس. وهو ثالثاً وسادة: طبقة الدهن تحته تخفف الصدمات. وفي الدرس القادم نرى عملاً رابعاً: حفظ حرارة جسمك{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["skin"],"highlight":["melanin","epidermis"],"zoom":"skin_section"},"text":"لماذا تختلف ألوان الناس؟ في البشرة خلايا خاصة تصنع مادة ملوّنة اسمها الميلانين. والناس متقاربون في عدد هذه الخلايا، ويختلفون في كمية ما تصنعه: من صنعت خلاياه ميلانين أكثر كان جلده أغمق. والميلانين يمتص جزءاً من أشعة الشمس الضارة فيحمي الخلايا، لكنه لا يكفي وحده: كل لون يمكن أن يحترق بالشمس، ولو في يوم غائم. فنحمي جلدنا بالظل في منتصف النهار، وبالقبعة والملابس، وبواقي الشمس. واللون لا يجعل أحداً أقوى ولا أفضل من غيره."},{"id":"E5","level":"A","atlas":{"layers":["skin","blood"],"highlight":["scab","platelets","new_skin"],"zoom":"wound"},"text":"{انخدشت|انخدشتِ} ركبتك{|ِ}. ماذا يحدث بعدها؟ يخرج قليل من الدم، ثم يتخثر فيسدّ الخدش في دقائق، كما {عرفت|عرفتِ} عن الصفائح. ويجفّ الدم المتخثر فيصير قشرة الجرح: غطاءً صلباً يحمي ما تحته من الميكروبات. وفي الأيام الأولى يحمرّ المكان قليلاً وينتفخ لأن الجسم يدافع عنه. وتحت القشرة تنقسم خلايا الجلد من الحواف والأسفل، فيُبنى جلد جديد في نحو ثلاثة أسابيع، ثم تسقط القشرة وحدها. لذلك {اغسل|اغسلي} الخدش بماء وصابون لطيف و{غطّه|غطّيه}، ولا {تنزع|تنزعي} القشرة."},{"id":"E6","level":"B","atlas":{"layers":["skin"],"highlight":["keratin","epidermis","scar"],"zoom":"skin_section"},"text":"للمستوى ب: في طريق خلايا البشرة إلى السطح تمتلئ بمادة قوية اسمها الكيراتين، فتصير صلبة مسطحة؛ ومن الكيراتين يتكوّن شعرك{|ِ} وأظفارك{|ِ} أيضاً. وسُمك البشرة يختلف: نحو ثلث مليمتر عند المرفق، وحتى أربعة مليمترات في باطن القدم الذي يحمل وزنك{|ِ}. والجرح العميق الذي يصل الأدمة قد يلتئم بندبة: نسيج يسدّ الجرح، أصغر منه لكنه أضعف وأقل مرونة من الجلد حوله؛ أما الخدش السطحي فيعود جلداً كما كان."}],"practice":[{"id":"U09.L01.P1","after":"E2","objective":"U09.L01.O1","type":"choose","prompt":"أين توجد جذور الشعر والأعصاب وغدد العرق؟","options":["في سطح البشرة بين الخلايا الميتة","في الأدمة","في الدم الذي يجري تحت الجلد","في العضلات التي تحت طبقة الدهن"],"answer":1,"explanation":"الأدمة تحت البشرة، وفيها الأوعية والأعصاب وغدد العرق وجذور الشعر.","level":"A","feedback_wrong":"أي الطبقتين فيها أوعية وأعصاب؟","feedback_by_option":{"0":"سطح البشرة خلايا ميتة مسطحة تتساقط.","2":"الدم في أوعية داخل الأدمة، والجذور والغدد في الأدمة نفسها.","3":"العضلات أعمق من الجلد كله."}},{"id":"U09.L01.P2","after":"E2","objective":"U09.L01.O1","type":"choose_reason","prompt":"الخلايا التي على سطح جلدك{|ِ} الآن:","options":["ميتة مسطحة وستتساقط","حية تنقسم بسرعة لتحميك{|ِ}","تبقى معك{|ِ} طوال عمرك{|ِ} وتكبر","أعصاب صغيرة تحسّ باللمس"],"answer":0,"explanation":"سطح البشرة خلايا ميتة مسطحة تتساقط، وتحتها خلايا حية تحل محلها.","level":"A","feedback_wrong":"أين تنقسم الخلايا الجديدة: في الأعلى أم في الأسفل؟","feedback_by_option":{"1":"الحية في أسفل البشرة؛ السطح ميت.","2":"البشرة تتبدل كلها في نحو أربعة أسابيع.","3":"الأعصاب في الأدمة تحت البشرة."},"detects":"M97"},{"id":"U09.L01.P3","after":"E3","objective":"U09.L01.O2","type":"choose_reason","prompt":"{سبحت|سبحتِ} ساعة في المسبح. لماذا لم يدخل الماء إلى جسمك{|ِ}؟","options":["لأن الماء البارد لا يدخل الأجسام الدافئة أبداً","لأن العضلات تحت الجلد تشتدّ فتغلق الطريق","لأن الجلد حاجز لا ينفذ منه الماء بسهولة","لأن الدم يدفع الماء إلى الخارج كلما اقترب"],"answer":2,"explanation":"الجلد حاجز: يمنع ماء الجسم أن يخرج، والماء والميكروبات أن تدخل.","level":"A","feedback_wrong":"ما العمل الأول للجلد؟","feedback_by_option":{"0":"الحرارة ليست السبب؛ الجلد هو الحاجز.","1":"العضلات أعمق؛ الجلد نفسه يمنعه.","3":"الدم في أوعية مغلقة؛ الجلد هو الحاجز."}},{"id":"U09.L01.P4","after":"E4","objective":"U09.L01.O3","type":"choose","prompt":"ما الذي يجعل جلد بعض الناس أغمق من غيرهم؟","options":["عدد أكبر من الخلايا في الجلد كله","قوة أكبر في العظام والعضلات والجسم","كمية أكبر من الميلانين تصنعها خلاياهم","طعام وشراب يغيّران لون الجلد"],"answer":2,"explanation":"عدد الخلايا الصانعة متقارب؛ الفرق في كمية الميلانين.","level":"A","feedback_wrong":"ماذا تصنع الخلايا الخاصة في البشرة؟","feedback_by_option":{"0":"الناس متقاربون في عدد الخلايا؛ الفرق في كمية ما تصنعه.","1":"اللون لا علاقة له بالقوة.","3":"الطعام العادي لا يصنع لون الجلد؛ الميلانين يصنعه."},"detects":"M98"},{"id":"U09.L01.P5","after":"E5","objective":"U09.L01.O4","type":"sequence","prompt":"{رتّب|رتّبي} ما يحدث بعد خدش الركبة.","options":["يخرج قليل من الدم","يتخثر الدم فيسدّ الخدش","يجفّ فيصير قشرة","يُبنى جلد جديد تحت القشرة","تسقط القشرة وحدها"],"answer":[0,1,2,3,4],"explanation":"دم، ثم تخثر، ثم قشرة، ثم جلد جديد تحتها، ثم تسقط.","level":"A","feedback_wrong":"ما الذي يحمي الجرح وهو يُبنى من تحته؟"}],"check":[{"id":"U09.L01.C1","objective":"U09.L01.O1","type":"explain_open","prompt":"{صف|صفي} طبقتي الجلد: ماذا في كل واحدة منهما؟","answer":"البشرة في الخارج: خلايا ميتة مسطحة في الأعلى تتساقط وتحتها خلايا حية تنقسم. والأدمة تحتها: أوعية دموية وأعصاب وغدد عرق وجذور الشعر وألياف.","level":"A","rubric":"R1"},{"id":"U09.L01.C2","objective":"U09.L01.O1","type":"true_false_why","prompt":"«الجلد الذي على يدي الآن هو نفسه منذ وُلدت». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ البشرة تتبدل كلها في نحو أربعة أسابيع: خلايا ميتة تتساقط من الأعلى وخلايا جديدة تصعد من الأسفل.","level":"A","rubric":"R1"},{"id":"U09.L01.C3","objective":"U09.L01.O2","type":"explain_open","prompt":"{اذكر|اذكري} عملين للجلد، و{أعط|أعطي} مثالاً من يومك{|ِ} على أحدهما.","answer":"حاجز يمنع الماء والميكروبات (أسبح ولا يدخل الماء)، ويحسّ (أعرف أن الشاي حار قبل أن أحترق)، ويخفف الصدمات بطبقة الدهن.","level":"A","rubric":"R1"},{"id":"U09.L01.C4","objective":"U09.L01.O3","type":"true_false_why","prompt":"«من كان جلده غامقاً لا يحترق بالشمس، فلا يحتاج أن يحمي نفسه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الميلانين يحمي ولا يكفي وحده، وكل لون يمكن أن يحترق؛ فالجميع يحتاج الظل والقبعة والملابس وواقي الشمس.","level":"A","rubric":"R1"},{"id":"U09.L01.C5","objective":"U09.L01.O4","type":"fix_model","prompt":"قال أحد الأطفال: «انخدشتُ، فتركت الخدش متسخاً لأنه سيجف وحده، ثم نزعت القشرة ليشفى أسرع». {صحّح|صحّحي} له ما فعل.","answer":"يغسل الخدش بماء وصابون لطيف ويغطيه، ولا ينزع القشرة لأنها تحمي ما تحتها حتى يُبنى الجلد الجديد، ونزعها يبطئ الالتئام ويزيد الأثر.","level":"A","rubric":"R1"},{"id":"U09.L01.C6","objective":"U09.L01.O5","type":"explain_open","prompt":"لماذا يختفي الخدش السطحي بلا أثر، ويبقى أثر الجرح العميق؟","answer":"الخدش السطحي في البشرة التي تتجدد فيعود جلداً كما كان؛ والجرح العميق يصل الأدمة فيُسدّ بندبة أضعف وأقل مرونة من الجلد حوله.","level":"B","rubric":"R1"}],"concepts":[{"id":"epidermis","term":{"ar":"البشرة","en":"Epidermis","zh":"表皮","pinyin":"biǎopí","match":["البشرة","بشرتك"]},"priority":"core","atlas":{"layer":"skin","element":"epidermis"},"card":{"A":"الطبقة الخارجية من الجلد: خلاياها العليا ميتة مسطحة تتساقط كل يوم، وتحتها خلايا حية تنقسم وتصعد لتحل محلها.","B":"تتبدل كلها في نحو أربعة أسابيع، وسُمكها نحو ثلث مليمتر عند المرفق وحتى أربعة مليمترات في باطن القدم."}},{"id":"dermis","term":{"ar":"الأدمة","en":"Dermis","zh":"真皮","pinyin":"zhēnpí","match":["الأدمة"]},"priority":"core","atlas":{"layer":"skin","element":"dermis"},"card":{"A":"الطبقة تحت البشرة: فيها أوعية دموية دقيقة، وأعصاب تحسّ، وغدد عرق، وجذور الشعر، وألياف تجعل الجلد قوياً يتمدد ويعود.","B":"أليافها من الكولاجين؛ وتحتها طبقة دهن تحمي من الصدمات وتحفظ الدفء."}},{"id":"melanin","term":{"ar":"الميلانين","en":"Melanin","zh":"黑色素","pinyin":"hēisèsù","match":["الميلانين","ميلانين"]},"priority":"core","atlas":{"layer":"skin","element":"melanin"},"card":{"A":"مادة ملوّنة تصنعها خلايا خاصة في البشرة، تمتص جزءاً من أشعة الشمس الضارة فتحمي الخلايا؛ وكميتها تصنع لون الجلد والشعر والعينين.","B":"الناس متقاربون في عدد الخلايا التي تصنعه ويختلفون في كمية ما تصنعه؛ والشمس تزيد صنعه فيسمرّ الجلد، والسمرة لا تكفي للوقاية."}},{"id":"scab","term":{"ar":"قشرة الجرح","en":"Scab","zh":"痂","pinyin":"jiā","match":["قشرة الجرح","القشرة"]},"priority":"core","atlas":{"layer":"skin","element":"scab"},"card":{"A":"غطاء جاف صلب من الدم المتخثر فوق الجرح، يحميه من الميكروبات حتى يُبنى تحته جلد جديد، ثم يسقط وحده.","B":"في الدم المتخثر خيوط بروتين تحبس الصفائح وخلايا الدم كشبكة، فإذا جفّت صارت القشرة."}},{"id":"keratin","term":{"ar":"الكيراتين","en":"Keratin","zh":"角蛋白","pinyin":"jiǎodànbái","match":["الكيراتين"]},"priority":"supporting","atlas":{"layer":"skin","element":"keratin"},"card":{"A":"مادة قوية تمتلئ بها خلايا البشرة وهي تصعد إلى السطح فتصير صلبة، ومنها يتكوّن الشعر والأظفار أيضاً.","B":"هو بروتين؛ والخلايا التي تصنعه هي أكثر خلايا البشرة."}}],"experiment":{"title":"تفاحتان: هل يحمي القشر ما تحته؟","materials":["تفاحتان متشابهتان في الحجم واللون","عود أسنان أو شوكة نظيفة يستعملها الكبير","طبقان وورقتان للكتابة","قلم ودفتر الأطلس"],"steps":["{ضع|ضعي} كل تفاحة على طبق، و{اكتب|اكتبي} عند الأولى «سليمة» وعند الثانية «مخدوشة».","يخدش الكبير قشر التفاحة الثانية بعود الأسنان ثلاثة خدوش أو أربعة، دون أن يقطعها.","{اترك|اتركي} التفاحتين متجاورتين في مكان واحد في الغرفة، بعيداً عن الشمس المباشرة.","{انظر|انظري} إليهما كل يوم ثلاثة أيام إلى خمسة دون أن {تلمسهما|تلمسيهما}.","{سجّل|سجّلي} كل يوم: أين ظهر اللون البني أو الليونة أولاً؟"],"safety":["الخدش يقوم به الكبير بعود أسنان أو شوكة، لا بسكين.","لا نأكل التفاح بعد التجربة، ونرميه في كيس مغلق، ونغسل اليدين إن لمسناه.","من عنده حساسية من فاكهة ما يستعمل غيرها أو يكتفي بالمراقبة."],"expected":"يظهر اللون البني والليونة أولاً عند الخدوش وحولها، وتبقى التفاحة السليمة أطول دون تغيّر؛ وقد يختلف عدد الأيام بحسب الحرارة ونوع التفاح.","explain":"القشر حاجز يمنع الماء أن يخرج والميكروبات أن تدخل؛ فحيث انخدش خرج الماء ودخلت الميكروبات فبدأ الفساد. وجلدك{|ِ} حاجز مثله، لكنه يسدّ الخدش ويبني تحته جلداً جديداً، والتفاحة لا تفعل.","record":"اليوم 1: السليمة ___ المخدوشة ___ — اليوم 2: ___ ___ — اليوم 3: ___ ___ — أين ظهر التغيّر أولاً؟ ___","alternatives":["بدل التفاح: موزتان، أو حبتا طماطم.","من لا يستطيع الانتظار أياماً: صورتا التفاحتين بعد خمسة أيام في المشهد."]},"find_the_error":[{"id":"FE1","atlas_variant":"skin_dead_shell","error":"مقطع جلد مكتوب عليه: الجلد كله خلايا ميتة لا تتغير","answer":"سطح البشرة خلايا ميتة تتساقط، وتحتها خلايا حية تنقسم، فالبشرة تتبدل في نحو أربعة أسابيع","detects":"M97"},{"id":"FE2","atlas_variant":"pick_scab","error":"طفل ينزع قشرة الجرح ليشفى أسرع","answer":"القشرة تحمي ما تحتها حتى يُبنى الجلد الجديد؛ نزعها يبطئ الالتئام","detects":"M99"},{"id":"FE3","atlas_variant":"dark_no_sunburn","error":"لافتة على الشاطئ: صاحب الجلد الغامق لا يحتاج وقاية من الشمس","answer":"الميلانين يحمي ولا يكفي وحده؛ كل لون يمكن أن يحترق، والوقاية للجميع","detects":"M98"}],"numbers":[{"text":"خلايا بشرتك{|ِ} تتبدل كلها في نحو 28 يوماً: الجلد الذي {تلمسه|تلمسينه} اليوم ليس جلد الشهر الماضي.","source":["S2"]},{"text":"لو فُرد جلد رجل كبير لغطّى سريراً مفرداً تقريباً: نحو متر ونصف إلى مترين مربعين.","source":["S1"]}],"true_size":[{"text":"بشرتك{|ِ} عند المرفق نحو ثلث مليمتر: أرقّ من ثلاث ورقات من دفترك{|ِ} فوق بعضها؛ وفي باطن قدمك{|ِ} قد تبلغ أربعة مليمترات.","source":["S1"]}],"animal":null,"organ_letter":{"from":"جلدك{|ِ}","text":"مرحباً، أنا جلدك{|ِ}، أكبر ما في جسمك{|ِ} وأقربه إلى العالم. {تراني|تريني} كل يوم ولا {تنتبه|تنتبهين} لي: أمنع ماءك{|ِ} أن يتسرّب، والميكروبات أن تدخل، وأخبر دماغك{|ِ} بكل لمسة ودفء وبرد. وأنا أتبدل بهدوء: كل شهر تقريباً أصير بشرة جديدة، والقديمة تتساقط دون أن {تشعر|تشعري}. حين {تنخدش|تنخدشين} أسدّ الخدش بقشرة وأبني تحتها، فلا {تنزع|تنزعي} قشرتي، و{اغسل|اغسلي} الخدش و{غطّه|غطّيه}. واحمِ{|ي}ني من حرق الشمس بالظل والقبعة. ولوني من الميلانين الذي يحميني، لا ليجعلك{|ِ} أفضل من أحد أو أقل."},"history":[{"who":"أبو القاسم الزهراوي","origin":"قرطبة، الأندلس","where_when":"قرطبة، نحو 936–1013؛ كتابه «التصريف لمن عجز عن التأليف»","did":"جمع في آخر أجزاء كتابه الجراحة، ورسم فيه أكثر من مئتي أداة جراحية، ولعلها أول رسوم من نوعها. ووصف أنواعاً من الخيوط لخياطة الجروح، منها خيوط من أمعاء الحيوان، وفرّق بين جرح يُغلق فوراً وجرح يُترك يلتئم من قاعه، واستعمل القطن في تضميد الجروح.","did_not":"لم يعرف الميكروبات ولا التعقيم ولا التخدير الحديث، فكانت الجراحة في زمنه أخطر بكثير مما هي اليوم؛ وكثير من طرقه لم يعد مستعملاً.","method_lesson":"التوثيق بالرسم والوصف الدقيق حتى يتعلم غيرك ويعيد ما فعلت.","source":["S6"]}],"how_we_know":{"text":"كيف عرفنا ما في داخل الجلد؟ الجلد يبدو للعين قطعة واحدة. لكن حين قُطعت منه شرائح رقيقة جداً ونُظر إليها بالمجهر ظهرت طبقات: في أسفل البشرة خلايا ممتلئة متلاصقة، وكلما صعدنا صارت الخلايا أكثر تسطحاً وصلابة حتى السطح حيث تتساقط؛ ووُجد أن الخلية الجديدة تصل إلى السطح في نحو أربعة أسابيع. وتحت البشرة ظهرت الأدمة بأوعيتها وأعصابها وغددها.","limit_question":"ما الذي لا يُظهره رسم مقطع الجلد عن سُمكه الحقيقي؟"},"what_changed":["كان كثيرون يظنون أن الجرح يشفى أسرع إذا تُرك مكشوفاً ليجف؛ واليوم ينصح الأطباء بغسله بماء وصابون لطيف وتغطيته، وبألا تُنزع قشرته.","كان يُظن أن السمرة حماية صحية؛ واليوم نعرف أن الميلانين وحده لا يكفي، وأن تكرار حروق الشمس يؤذي الجلد."],"model_limits":["رسم مقطع الجلد يُظهر الطبقات سميكة بألوان واضحة؛ في الحقيقة البشرة في أكثر الجسم أرقّ من ثلاث ورقات، والألوان للتمييز.","التفاحة نموذج للجلد: قشرها يحمي ما تحته كما يحمي الجلد، لكنها لا تُصلح نفسها ولا تتجدد كما يفعل جلدنا.","الرسم يُظهر الخلايا كبيرة؛ في الحقيقة لا تُرى إلا بالمجهر."],"faith":{"opening":{"text":"وَمِنْ ءَايَـٰتِهِۦ خَلْقُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفُ أَلْسِنَتِكُمْ وَأَلْوَٰنِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍۢ لِّلْعَـٰلِمِينَ","reference":"الروم 22","grade":"قرآن","usage":"تفكر","reflection":"{انظر|انظري} حولك{|ِ} في الصف أو في المسجد أو في السوق: ألوان كثيرة ولغات كثيرة. والآية التي أمامك{|ِ} تجعل اختلاف ألسنة الناس وألوانهم من آيات الله، مع خلق السماوات والأرض، وتقول إن أهل العلم يرون فيها آيات. واليوم {ستعرف|ستعرفين} بالعلم مادة صغيرة في جلدك{|ِ} تصنع اللون وتحميه من الشمس. العلم يشرح كيف يتكوّن اللون، والآية تدعونا أن نتأمل الاختلاف آيةً لا سبباً للتفاخر. ما لونان {تراهما|ترينهما} في أهلك{|ِ} أو أصدقائك{|ِ}؟","reviewed":false,"quran_key":"30:22","hl_words":[5,7],"highlight":"واختلاف ألسنتكم وألوانكم","level":"تفكر","concept":"اختلاف ألوان الناس ولغاتهم آية للتأمل، لا سبب للتفاخر أو الاحتقار.","avoid":"لا نقول إن الآية تذكر الميلانين أو تشرح سبب اللون، ولا نجعل العلم دليلاً عليها؛ ولا نقارن الألوان جمالاً أو قوة.","cards":[]},"closing":null},"life":[{"situation":"في الرحلة المدرسية ركض زميلي في الشمس ساعات بلا قبعة، فصار وجهه أحمر يؤلمه في المساء.","science":"أشعة الشمس الزائدة تؤذي خلايا البشرة فتحترق، والميلانين لا يكفي وحده لحمايتها؛ والأشعة أقوى في منتصف النهار وتعبر الغيوم.","action":"في الرحلة القادمة ألبس قبعة وملابس تغطي، وأجلس في الظل في منتصف النهار، وأطلب من الكبار واقي الشمس وأعيده بعد ساعتين وبعد السباحة؛ وأذكّر أصدقائي بلطف.","value":"حفظ نعمة الجسد من الأذى.","why":"لماذا أحمي جلدي وهو لا يؤلمني الآن؟ لأن حرق الشمس يؤذي الخلايا قبل أن نحسّ بالألم، وتكراره يضرّ الجلد على المدى البعيد؛ والجسد أمانة نحفظها.","cards":[],"verses":[]},{"situation":"طفل جديد في الصف لونه أغمق من لون أكثرنا، وسمعت ولداً يناديه بلقب عن لونه ويضحك.","science":"لون الجلد من كمية الميلانين التي تصنعها خلايا البشرة، والناس متقاربون في عدد هذه الخلايا؛ اللون يحمي من الشمس، ولا يدل على قوة ولا ذكاء ولا قيمة.","action":"أناديه باسمه وأجلس معه، وأقول للولد بهدوء إن اللون لا يجعل أحداً أفضل من أحد، وأخبر المعلم إن تكرر اللقب.","value":"لا تفاضل باللون، ولا سخرية من أحد.","why":"لماذا لا يجعل اللون أحداً أفضل؟ لأنه كمية مادة واحدة في الجلد، لا أكثر. وفي الآية في البطاقة أن الله جعل الناس أمماً وجماعات ليعرف بعضهم بعضاً، وأن أكرمهم عنده أتقاهم، لا أفتحهم ولا أغمقهم.","reference":"الحجرات 13","quran":["49:13"],"cards":[],"verses":["49:13"]}],"open_questions":[{"q":"لماذا يترك جرحٌ ندبةً كبيرة بارزة عند بعض الناس ولا يتركها عند غيرهم؟","why_open":"يعرف العلماء أن عمق الجرح ومكانه والوراثة لها دور، لكن كيف تعرف الخلايا متى تتوقف عن البناء ما زال يُبحث."}],"notebook":{"draw":"ارسم{|ي} مقطعاً من الجلد كأنه شريحة كعكة: في الأعلى البشرة بخلايا مسطحة تتساقط وخلايا مستديرة في أسفلها، وتحتها الأدمة وفيها وعاء دموي أحمر وعصب أصفر وغدة عرق ملتفة وشعرة بجذرها، وفي الأسفل طبقة الدهن. ثم ارسم{|ي} بجانبه خدشاً بقشرته وجلداً جديداً تحتها. المستوى ب: ارسم{|ي} بشرة باطن القدم أسمك من بشرة المرفق.","label":["البشرة","خلايا ميتة تتساقط","خلايا حية تنقسم","الأدمة","وعاء دموي","عصب","غدة عرق","جذر الشعر","طبقة الدهن","قشرة الجرح","— ب: الكيراتين، الندبة"],"write":"أشرح: لماذا لا ينزل الماء إلى جسمي حين أسبح؟ ولماذا تختلف ألوان الناس، وهل يجعل اللون أحداً أفضل؟ وماذا أفعل حين أنخدش؟ وأكتب ما رأيته في التفاحتين."},"imgs":["U09.L01-E1","U09.L01-E2","U09.L01-E3","U09.L01-E4","U09.L01-E5","U09.L01-E6","U09.L01-exp","U09.L01-hist1","U09.L01-letter","U09.L01-life","U09.L01-title-boy","U09.L01-title-girl"]};
