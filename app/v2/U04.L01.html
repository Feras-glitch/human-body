const LD = {"id":"U04.L01","first":true,"title":"التنفس: كيف يدخل الهواء ويخرج؟","driving_question":"أنت{|ِ} تتنفس{|ين} الآن بلا أن تفكر{|ي}. من يحرّك الهواء إلى داخلك{|ِ} وخارجك{|ِ}؟","central_fact":"الهواء يدخل الرئتين لأن الحجاب الحاجز وعضلات الأضلاع توسّع الصدر، ويخرج حين ترتخي؛ والأنف والقصبة الهوائية طريقه؛ والدماغ يضبط سرعة التنفس بحسب حاجة الجسم.","next":"U04.L02","nexts":[{"id":"U04.L02","gated":false},{"id":"U04.L03","gated":false}],"hook":{"text":"{اسم}، ضع{|ي} يدك{|ِ} على بطنك{|ِ} وخذ{|ي} نفساً عميقاً. البطن ارتفع! لكن الهواء ذهب إلى الصدر… فلماذا تحرّك البطن؟","options":["الهواء نزل إلى البطن","شيء بين الصدر والبطن تحرّك","البطن يتنفس أيضاً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["respiratory","skeleton"],"highlight":["lungs","ribcage"],"zoom":"chest"},"text":"هذا صدرك{|ِ} من الداخل. داخل القفص الصدري عضوان إسفنجيان ورديّان، واحد في كل جهة: الرئتان. بينهما القلب الذي عرفناه، وهو يميل إلى اليسار، لذلك الرئة اليسرى أصغر قليلاً. الرئتان تمتلئان بالهواء وتنكمشان نحو عشرين مرة في كل دقيقة، وأنت{|ِ} لا تفكر{|ين} في ذلك."},{"id":"E2","level":"A","atlas":{"layers":["respiratory"],"highlight":["nose","trachea","bronchi"],"zoom":"head_chest"},"text":"كيف يصل الهواء إلى هناك؟ يدخل من الأنف أو الفم. الأنف أفضل: يدفّئ الهواء ويرطّبه ويحجز الغبار بشعره ومخاطه، لأن الهواء البارد الجاف يهيّج الرئتين. ثم يمر الهواء بالحنجرة في العنق، فينزل في أنبوب نسميه القصبة الهوائية؛ جسّ{|ي} مقدمة عنقك{|ِ}: حلقات صلبة تبقيها مفتوحة. في الصدر تتفرع القصبة إلى شعبتين، واحدة لكل رئة، ثم إلى أنابيب أدق فأدق، كشجرة مقلوبة، حتى تنتهي بحويصلات صغيرة جداً."},{"id":"E3","level":"A","atlas":{"layers":["respiratory","muscles"],"highlight":["diaphragm","ribcage"],"zoom":"chest","animate":"breathe"},"text":"والآن جواب سؤالنا: من يحرّك الهواء؟ ليس الرئتين؛ ليس فيهما عضلات تنفخهما. تحت الرئتين عضلة عريضة كالقبّة تفصل الصدر عن البطن نسميها الحجاب الحاجز. حين تنقبض تنبسط وتنزل، وفي الوقت نفسه تنقبض عضلات بين الأضلاع فترفع القفص الصدري إلى الأعلى والخارج. فيتسع الصدر، وتتمدد الرئتان، ويُسحب الهواء إلى الداخل. هذا الشهيق. ولأن الحجاب الحاجز نزل، دفع ما في البطن إلى الأمام: هذا سبب ارتفاع بطنك{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["respiratory","muscles"],"highlight":["diaphragm"],"zoom":"chest","animate":"exhale"},"text":"ثم ترتخي العضلات: يعود الحجاب الحاجز قبّة إلى الأعلى، وتهبط الأضلاع، فيضيق الصدر وتنكمش الرئتان ويخرج الهواء. هذا الزفير، ولا يحتاج جهداً وأنت{|ِ} هادئ{|ة}. شهيق وزفير: نَفَس واحد. تذكّر{|ي} درس العضلات: العضلة تسحب فقط؛ الحجاب الحاجز ينقبض فيسحب نفسه إلى الأسفل، ولا شيء «يدفع» الهواء إلى الرئتين."},{"id":"E5","level":"A","atlas":{"layers":["respiratory"],"highlight":["lungs"],"zoom":"body"},"text":"حين تركض{|ين} يصير تنفسك{|ِ} أسرع وأعمق. لماذا؟ لأن عضلاتك{|ِ} العاملة تحتاج مزيداً من الأكسجين وتصنع مزيداً من ثاني أكسيد الكربون، والدم ينقلهما، والقلب يسرّع النقل كما عرفنا. والدماغ يأمر عضلات التنفس أن تعمل أسرع ليدخل هواء أكثر. القلب والرئتان والعضلات يعملون معاً في اللحظة نفسها، لا واحداً بعد واحد."},{"id":"E6","level":"B","atlas":{"layers":["respiratory","nervous"],"highlight":["brainstem","lungs"],"zoom":"body"},"text":"للمستوى ب: من يضبط السرعة؟ الدماغ، تلقائياً. في الدماغ وقرب الأوعية حسّاسات تقيس كم ثاني أكسيد الكربون وكم أكسجين في الدم، ومراكز التنفس تعدّل السرعة والعمق بحسب الحاجة. أنت{|ِ} تستطيع{|ين} التدخل قليلاً: تحبس{|ين} نفسك{|ِ} أو تغني{|ن} أو تنفخ{|ين} شمعة؛ لكن الدماغ يعود فيأخذ القيادة، ولذلك لا تستطيع{|ين} أن «{تنسى|تنسي}» التنفس وأنت{|ِ} نائم{|ة}."},{"id":"E7","level":"B","atlas":{"layers":["respiratory"],"highlight":["trachea","pleura"],"zoom":"chest"},"text":"وتفصيلان صغيران. الأول: القصبة الهوائية والشعب تدعمها حلقات من الغضروف تبقيها مفتوحة، وإلا انطبقت كأنبوب مطاطي عند الشهيق. الثاني: الرئتان محاطتان بغشاء رقيق من طبقتين بينهما سائل زلق، فتنزلقان على جدار الصدر بلا احتكاك مع كل نَفَس — عشرون مرة في الدقيقة، طوال العمر."}],"practice":[{"id":"U04.L01.P1","objective":"U04.L01.O1","type":"locate_on_atlas","prompt":"اضغط{|ي} على موضع الرئتين.","answer":"lungs","level":"A","atlas_target":"lungs","feedback_wrong":"داخل القفص الصدري، في الصدر لا في البطن."},{"id":"U04.L01.P2","after":"E3","objective":"U04.L01.O2","type":"sequence","prompt":"رتّب{|ي} ما يحدث في الشهيق.","options":["ينقبض الحجاب الحاجز وينزل وترتفع الأضلاع","يتسع الصدر","تتمدد الرئتان","يدخل الهواء"],"answer":[0,1,2,3],"explanation":"تبدأ بالعضلات: ينقبض الحجاب الحاجز فينزل وترتفع الأضلاع، فيتسع الصدر، فتتمدد الرئتان معه، فيدخل الهواء.","level":"A","feedback_wrong":"{ابدأ|ابدئي} بالعضلة: ما أول ما يتحرك؟"},{"id":"U04.L01.P3","objective":"U04.L01.O4","type":"sequence","prompt":"رتّب{|ي} طريق الهواء من الخارج إلى الرئة.","options":["الأنف","الحنجرة","القصبة الهوائية","الشعبتان","الأنابيب الدقيقة والحويصلات"],"answer":[0,1,2,3,4],"explanation":"يدخل الهواء من الأنف، فيمر بالحنجرة إلى القصبة الهوائية في العنق، ثم تتفرع إلى شعبتين، ثم إلى أنابيب دقيقة تنتهي بالحويصلات.","level":"A","feedback_wrong":"من أين يدخل الهواء أولاً؟ وما الأنبوب الذي تجسّه في عنقك؟"},{"id":"U04.L01.P4","objective":"U04.L01.O3","type":"predict","prompt":"عدّ{|ي} أنفاسك{|ِ} في الراحة. ثم توقّع{|ي}: بعد دقيقة من القفز الخفيف هل يكون العدد أكبر أم أصغر أم مثله؟ ثم جرّب{|ي}.","options":["أصغر","أكبر","مثله"],"answer":1,"explanation":"العضلات في الحركة تحتاج أكسجيناً أكثر، فيزيد الدماغ عدد الأنفاس.","level":"A","feedback_wrong":"سجّل{|ي} ما قست{|ِ} فعلاً. الأرقام أمامك{|ِ}.","feedback_by_option":{"0":"الحركة تزيد حاجة العضلات إلى الأكسجين؛ فهل يقلّ التنفس؟","2":"جرّب{|ي} وعدّ{|ي}: العضلات العاملة تحتاج أكسجيناً أكثر؛ فهل يبقى العدد كما هو؟"}},{"id":"U04.L01.P5","objective":"U04.L01.O5","type":"choose_reason","prompt":"لماذا لا تستطيع{|ين} أن {تنسى|تنسي} التنفس وأنت{|ِ} نائم{|ة}؟","options":["لأن الدماغ يضبط التنفس تلقائياً بحسب الحاجة","لأن الرئتين عضلتان تتحركان بلا أمر من أحد","لأن الهواء يندفع إلى الأنف من غير أن يتسع الصدر","لأن القلب يدفع الهواء"],"answer":0,"explanation":"الدماغ يضبط التنفس تلقائياً بحسب حاجة الجسم، فيستمر ونحن نائمون دون أن نفكر فيه.","level":"B","feedback_wrong":"من يقيس حاجة الجسم ويأمر العضلات؟  ورديّان داخل القفص الصدري، واحد في كل جهة، يمتلئان بالهواء وينكمشان.","B":"الرئة اليسرى أصغر قليلاً لأن القلب يأخذ مكاناً في الجهة اليسرى. فيهما مئات الملايين من حويصلة صغيرة."}},{"id":"diaphragm","term":{"ar":"الحجاب الحاجز","en":"Diaphragm","zh":"横膈膜","pinyin":"hénggémó"},"priority":"core","atlas":{"layer":"respiratory","element":"diaphragm"},"card":{"A":"عضلة عريضة كالقبّة تحت الرئتين تفصل الصدر عن البطن. حين تنقبض تنزل فيتسع الصدر ويدخل الهواء.","B":"عضلة هيكلية تعمل وحدها حين تنساها وتطيعك حين تأمرها؛ لذلك تستطيع حبس نفسك قليلاً."}},{"id":"trachea","term":{"ar":"القصبة الهوائية","en":"Windpipe (trachea)","zh":"气管","pinyin":"qìguǎn","match":["القصبة"]},"priority":"core","atlas":{"layer":"respiratory","element":"trachea"},"card":{"A":"أنبوب في مقدمة العنق ينزل من الحنجرة إلى الصدر ويحمل الهواء إلى الرئتين. {جسّه|جسّيه}: حلقات صلبة تمنعه من الانطباق.","B":"يتفرع في الصدر إلى شعبتين، واحدة لكل رئة، ثم إلى أنابيب أدق فأدق كأغصان شجرة مقلوبة."}},{"id":"inhale_exhale","term":{"ar":"الشهيق والزفير","en":"Inhale and exhale","zh":"吸气与呼气","pinyin":"xīqì yǔ hūqì","match":["الشهيق","الزفير","شهيق","زفير"]},"priority":"core","atlas":{"layer":"respiratory","element":"lungs"},"card":{"A":"الشهيق: دخول الهواء. الزفير: خروجه. معاً نَفَسٌ واحد.","B":"الشهيق يحتاج عضلات تعمل؛ الزفير الهادئ يحدث بارتخائها فقط. عند الركض تساعد عضلات البطن على إخراج الهواء أسرع."}}],"experiment":{"title":"أعدّ أنفاسي وأحسّ حجابي الحاجز","materials":["ساعة أو مؤقت بالثواني (أو عدّاد التطبيق)","ورقة دفتر الأطلس وقلم","(للمستوى ب) زجاجة بلاستيكية مقصوصة القاع، بالون صغير، بالون كبير أو قفاز مطاطي، شريط لاصق"],"steps":["اجلس{|ي} هادئ{اً|ةً} دقيقتين وضع{|ي} كفك{|ِ} على بطنك{|ِ} فوق السرة.","عدّ{|ي} أنفاسك{|ِ} دقيقة كاملة: كل ارتفاع للبطن = نَفَس واحد (شهيق وزفير). لا تغيّر{|ي} طريقة تنفسك{|ِ} عمداً. سجّل{|ي} تحت «راحة».","لاحظ{|ي} يدك{|ِ}: ترتفع مع الشهيق لأن الحجاب الحاجز ينزل ويدفع البطن إلى الأمام، وتنخفض مع الزفير.","قف{|ي} واقفز{|ي} قفزات خفيفة أو امش{ِ|ي} سريعاً دقيقة واحدة.","اجلس{|ي} فوراً وعدّ{| } هادئ{|ة}: أي نحو 1,200 في الساعة، وأكثر من 25,000 في اليوم.","source":["S3"]},{"text":"في رئتيك{|ِ} مئات الملايين من الحويصلات الصغيرة جداً تمتلئ بالهواء مع كل شهيق.","source":["S2"]},{"text":"الطفل الهادئ يتنفس نحو 17 إلى 22 مرة في الدقيقة، والبالغ أقل قليلاً.","source":["S3"]}],"true_size":[{"text":"ضع{|ي} يديك{|ِ} على جانبي صدرك{|ِ} تحت الإبطين وخذ{|ي} نفساً عميقاً: المسافة التي اتسعت بها يداك{|ِ} هي ما تتمدد به رئتاك{|ِ} في الشهيق العميق.","source":["S1"]},{"text":"اربط{|ي} خيطاً حول صدرك{|ِ} عند الزفير، ثم خذ{|ي} نفساً عميقاً {وقس|وقيسي} كم زاد محيط صدرك{|ِ} بالسنتيمتر.","source":["S1"]}],"animal":{"text":"معظم الأسماك تأخذ الأكسجين الذائب في الماء عبر الخياشيم. والضفدع يتبادل الغازات برئتيه وبجلده الرطب. أما الدلفين فيتنفس الهواء برئتيه من فتحة التنفس فوق رأسه، ولذلك يصعد إلى السطح. تختلف وسائل التنفس بين الحيوانات.","source":["S6","S7"]},"organ_letter":{"from":"الحجاب الحاجز","text":"أنا الحجاب الحاجز. لا أحد يذكرني حين يتكلم عن التنفس؛ كلهم يقولون «الرئتان». لكن الرئتين لا تملكان عضلة واحدة؛ أنا الذي أعمل. أنقبض فأنزل، فيتسع الصدر ويدخل الهواء؛ وأرتخي فأعود قبّة ويخرج. عشرون مرة في الدقيقة، وأنت{|ِ} نائم{|ة} أيضاً. وحين تضحك{|ين} بقوة، أنا الذي أهتز. مع التحية، قبّة عريضة بين صدرك{|ِ} وبطنك{|ِ}."},"history":[{"who":"أنطوان لافوازييه","origin":"فرنسا","where_when":"باريس، 1770s–1790","did":"قاس بتجارب المسعر كمية الهواء التي يستهلكها التنفس وبيّن أنها تزيد مع الجهد والأكل والبرد، ووصف التنفس بأنه احتراق بطيء؛ أول قياس كمي للأيض التنفسي.","did_not":"لم يعرف أن الاحتراق يحدث داخل الخلايا لا في الرئتين (ظن أولاً أنه في الرئة)، ولم يعرف الهيموغلوبين ولا الميتوكوندريا.","method_lesson":"القياس الدقيق لما يدخل وما يخرج يكشف ما لا تراه العين.","source":["S5"],"text":"قبل نحو 250 سنة في باريس، وضع العالِم لافوازييه حيوانات صغيرة في صندوق محكم وقاس كم من الهواء يُستهلك بالتنفس، ثم قاس تنفس إنسان في الراحة وفي العمل. وجد أن الجسم يأخذ من الهواء أكثر حين يعمل أكثر، وقال: التنفس احتراق بطيء هادئ. لم يعرف أين يحدث بالضبط — ظنه في الرئة، وهو في الخلايا — لكنه قاس بدقة، وبالقياس بدأ علم التنفس."}],"how_we_know":{"text":"قبل نحو 250 سنة في باريس، وضع العالِم لافوازييه حيوانات صغيرة في صندوق محكم وقاس كم من الهواء «يُستهلك» بالتنفس، ثم قاس تنفس إنسان وهو جالس وهو يعمل وبعد الأكل وفي البرد، فوجد أن الجسم يأخذ من الهواء أكثر حين يعمل أكثر. وقال: التنفس يشبه احتراقاً بطيئاً هادئاً داخل الجسم. لم يكن يعرف كيف يحدث ذلك داخل الخلايا، لكنه قاس بدقة ما يدخل وما يخرج، وهذا بداية علم التنفس.","limit_question":"ما الذي لا يُظهره رسم الرئتين في هذا الدرس؟"},"what_changed":["ظُن قروناً أن التنفس يبرّد القلب فقط؛ القياس بيّن أن الجسم يأخذ من الهواء شيئاً ويُخرج شيئاً آخر.","ظُن أن الرئتين تسحبان الهواء بنفسيهما كمنفاخ له عضلات؛ الصواب أن العضلات حول الرئتين هي التي توسّع الصدر."],"model_limits":["رسم الرئتين يُظهرهما ككيسين فارغين؛ هما إسفنجيان مملوءان بمئات الملايين من الحويصلات.","الرسم ساكن؛ الحجاب الحاجز يتحرك نحو عشرين مرة في الدقيقة.","الرسم لا يُظهر الدم في الرئتين ولا كيف يدخل الأكسجين إليه (الدرس القادم).","نموذج البالون والزجاجة: رئة واحدة، بلا أضلاع، والبالون لا يبادل غازات.","في صورة الشهيق والزفير الترتيب أعلى/أسفل؛ اتساع البطن والأضلاع تمثيل تخطيطي.","الضوء في أسفل جذع الدماغ والدائرتان إشارات ومستشعرات رمزية لا أنابيب ولا أجهزة.","نموذج القارورة في صورة التجربة يشرح فرق الضغط ولا يمثل حركة الأضلاع."],"faith":{"opening":{"text":"نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ","reference":"البخاري 6412","grade":"صحيح","usage":"تفكر","reflection":"نَفَسٌ يدخل ويخرج عشرين مرة في الدقيقة ونحن لا ننتبه؛ هذه الصحة التي قال النبي ﷺ إن كثيراً من الناس مغبونون فيها: يملكونها ولا يشعرون بها حتى تنقص. اليوم ننتبه: نعدّ أنفاسنا ونسأل من يحرّكها.","reviewed":false,"highlight":"الصحة والفراغ","full_verified":true,"level":"خبر","concept":"الصحة نعمة لا نشعر بها حتى تنقص؛ الانتباه إليها شكر لها.","avoid":"لا نقول إن المريض مغبون أو مقصّر؛ الغبن في الغفلة عن النعمة لا في فقدها.","matn_note":"المتن كاملاً كما في صحيح البخاري، كتاب الرقاق؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://sunnah.com/bukhari:6412","text_compared_on":"2026-10-27","hadith_key":"bukhari:6412","lead":"عن ابن عباس رضي الله عنهما قال: قال النبي ﷺ:","narration":false,"source":"البخاري 6412","grader":"","cards":[]},"closing":null},"life":[{"situation":"زميل في الصف يصفر صدره ويستعمل بخاخاً، وبعض الأطفال يقلّدونه ويضحكون.","science":"عنده تضيق الأنابيب الدقيقة في الرئتين أحياناً فيصعب دخول الهواء، والبخاخ دواء يوسّعها في دقائق. ليس عدوى ولا عيباً.","action":"لا أضحك ولا أقلّد، وأساعده على أخذ بخاخه إن طلب، وأخبر المعلم فوراً إن ضاق نفسه.","value":"ضيق النفس ليس مزحة؛ من يختلف جسمه عن جسمي له عليّ احترام ومساعدة.","why":"لماذا؟ لأن ما أضحك عليه ثانية هو عنده خوف حقيقي: الهواء لا يدخل. وأنا تعلّمت اليوم أن الهواء لا يدخل وحده، فأعرف قيمة نَفَس سهل. والنبي ﷺ جعل سلامة المسلمين من لسان المسلم ويده علامةَ إسلامه، والأذى ممنوع مع كل إنسان؛ فلساني الذي يسخر يُؤذي كما تؤذي اليد.","reference":"البخاري 10؛ ونحوه عند مسلم 40","hadith":["bukhari:10"],"cards":[{"key":"bukhari:10","lead":"عن عبد الله بن عمرو رضي الله عنهما، عن النبي ﷺ قال:","text":"المسلم من سلم المسلمون من لسانه ويده، والمهاجر من هجر ما نهى الله عنه","narration":false,"source":"البخاري 10؛ ونحوه عند مسلم 40","grade":"صحيح","grader":""}],"verses":[]},{"situation":"في اللعب يتحدّى الأطفال بعضهم: من يحبس نفسه أطول؟","science":"حين أحبس نفسي يرتفع ثاني أكسيد الكربون في دمي فيأمرني الدماغ بالتنفس؛ وبعض الأطفال قد يفقدون الوعي قبل ذلك، خاصة تحت الماء.","action":"أرفض التحدي وأقترح لعبة أخرى، وأمنع أخي الأصغر منه.","value":"جسدي أمانة؛ لا أُخاطر به لأبدو شجاعاً.","why":"لماذا أرفض وأنا أستطيع؟ لأن الشجاعة أن أحمي نفسي ومن معي، لا أن أعرّض دماغي للخطر لثوانٍ من الإعجاب. والجسد الذي أُحسن استعماله اليوم هو الذي يحملني عمري كله.","reference":"البخاري 1975","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا نتثاءب؟","why_open":"توجد أفكار كثيرة (تبريد الدماغ، التنبيه، الإشارة للآخرين)، ولا يوجد جواب متفق عليه بعد؛ والعلماء يختبرونها."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة الصدر من الداخل وسمِّ{|ي}: الأنف، القصبة الهوائية، الرئتين، الحجاب الحاجز، القفص الصدري. ارسم{|ي} سهمين: أحدهما للشهيق (الحجاب الحاجز إلى الأسفل) والآخر للزفير. المستوى ب: {أضف|أضيفي} الشعبتين والأنابيب الدقيقة.","label":["الأنف","القصبة الهوائية","الرئتان","الحجاب الحاجز","القفص الصدري","— ب: الشعبتان"],"write":"أنفاسي في الدقيقة: في الراحة ____، بعد الحركة ____، بعد الراحة ____ (إن لم أعدّ: أفسّر أرقام ليلى 18 ثم 34 ثم 20). لماذا تغيّرت؟ ثم أشرح ماذا يفعل الحجاب الحاجز حين أشهق فيرتفع بطني."},"imgs":["U04.L01-E1","U04.L01-E2","U04.L01-E3","U04.L01-E4","U04.L01-E5","U04.L01-E6","U04.L01-E7","U04.L01-exp","U04.L01-hist1","U04.L01-letter","U04.L01-life","U04.L01-title-boy","U04.L01-title-girl"]};
