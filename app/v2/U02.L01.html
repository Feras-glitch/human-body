ع."],"safety":["جسّ خفيف على جسمك{|ِ} أنت{|ِ} فقط؛ لا نجسّ أحداً دون إذنه.","لا ضغط على العمود الفقري أو العنق، ولا اختبار مرونة أو ثني أحد.","من لديه إصابة أو جبيرة يشاهد ويعدّ على الرسم."],"expected":"يحسّ الطفل أربع عظام تحت الجلد، ويحسب 14 عظمة في أصابع اليد (4×3 + 2)، فيبدأ يفهم لماذا في اليد 27 عظمة.","explain":"عظامك{|ِ} ليست بعيدة؛ كثير منها تحت الجلد مباشرة. والأصابع الكثيرة العظام هي سبب مرونة يدك{|ِ}: كل مفصل بين عظمتين يسمح بحركة. في يدك{|ِ} 27 عظمة؛ في قدمك{|ِ} 26: أكثر من نصف عظامك{|ِ} في أطرافك{|ِ}. وما {جسسته|جسستِه} حي: لو كُسر لنزف وآلم ثم التأم.","record":"قائمة العظام الأربع، وعدد عظام الأصابع، ورسم يد بعظامها.","alternatives":["من يتعذر عليه الجس يعمل على صورة الأشعة أو رسم الأطلس.","بديل: عدّ{|ي} عظام الأصابع على صورة أشعة ليد."]},"find_the_error":[{"id":"FE1","atlas_variant":"ribs_around_stomach","error":"القفص الصدري مرسوم حول الأمعاء في أسفل البطن","answer":"الأضلاع حول القلب والرئتين في الصدر، وحافتها السفلية تغطي أعلى البطن فقط","detects":"M08"},{"id":"FE2","atlas_variant":"dry_bone","error":"مقطع عظم مصمت بلا نخاع ولا أوعية","answer":"العظم فيه نخاع وأوعية؛ حي","detects":"M32"}],"numbers":[{"text":"206 عظمة في البالغ، ونحو 300 في الرضيع: تلتحم مع النمو.","source":["S1"]},{"text":"في كل يد 27 عظمة، وفي كل قدم 26: أكثر من نصف عظام جسمك{|ِ} في يديك{|ِ} وقدميك{|ِ}.","source":["S1"]},{"text":"أصغر عظمة في جسمك{|ِ} في أذنك{|ِ} بحجم نصف حبة أرز تقريباً؛ وأكبرها في فخذك{|ِ} بطول ربع طولك{|ِ} تقريباً.","source":["S1"]}],"true_size":[{"text":"عظم فخذك{|ِ} طوله نحو ربع طولك{|ِ}: {قس|قيسي} من وركك{|ِ} إلى ركبتك{|ِ} وقارن{|ي}.","source":["S1"]},{"text":"أصغر عظمة فيك{|ِ} بحجم نصف حبة أرز تقريباً: ضع{|ي} حبة أرز على كفك{|ِ}، وتخيّل{|ي} نصفها في أذنك{|ِ}.","source":["S1"]}],"animal":{"text":"للزرافة سبع فقرات في رقبتها الطويلة، مثلنا تماماً — لكن كل فقرة بطول ساعدك تقريباً. وللطير عظام مجوفة خفيفة ليطير. والسمكة في الماء لا تحمل وزنها على عظامها كما نحمل نحن، فعظامها دقيقة كثيرة وهذا يحملها فلا تحتاج هيكلاً قوياً. الهيكل يُبنى على ما يحتاجه الجسم.","source":["S6"]},"organ_letter":{"from":"عظم الفخذ","text":"أنا أكبر عظمة فيك{|ِ}. يظنني الناس عصا، وأنا مصنع: في داخلي نخاع يصنع دماً كل ثانية، وفيّ أوعية وأعصاب، وحين أُكسر أبني نفسي من جديد. كنتُ في طفولتك{|ِ} أطول كل شهر قليلاً، وحين تقفز{|ين} أحسّ بالحمل فأقوى. لا {تتركني|تتركيني} جالساً طويلاً؛ أنا أحيا بالحركة."},"history":[{"who":"عبد اللطيف البغدادي","origin":"بغداد؛ عمل في مصر. مسلم","where_when":"القاهرة، نحو 1200","did":"فحص أكثر من ألفي جمجمة وهياكل كثيرة فوجد الفك السفلي في البالغ عظماً واحداً (يولد نصفين ويلتحمان في السنة الأولى)، مخالفاً جالينوس؛ ويُنسب إليه وصف العجز عظماً واحداً.","did_not":"لم يضع تشريحاً كاملاً جديداً.","method_lesson":"الملاحظة المباشرة تغلب سلطة الكتاب.","source":["S4"]},{"who":"فيلهلم رونتغن","origin":"ألمانيا","where_when":"1895","did":"اكتشف الأشعة السينية وصوّر بها عظام يد حية لأول مرة.","did_not":"لم يعرف في البداية طبيعة الأشعة ولا أخطارها عند الإفراط.","method_lesson":"الأداة الجديدة تكشف ما لا تراه العين.","source":["S5"]}],"how_we_know":{"text":"كيف نرى عظام شخص حي دون فتح جسمه؟ عام 1895 اكتشف الفيزيائي الألماني رونتغن أشعة تمر عبر اللحم وتوقفها العظام، وأول صورة لجزء من جسم إنسان كانت ليد زوجته بخاتمها. وقبله بسبعة قرون، لم يكن لدى عبد اللطيف البغدادي إلا عيناه وهياكل الموتى، ومع ذلك صحّح خطأً عمره ألف سنة في عظم الفك. الأداة تساعد، لكن النظر الصادق يأتي أولاً.","limit_question":"ما الذي لا يُظهره رسم الهيكل عن عظامك{|ِ} الحقيقية؟"},"what_changed":["ظُن أن العظام جامدة لا تتغير؛ هي تتجدد باستمرار.","ظُن أن الفك السفلي عظمان؛ هو عظم واحد."],"model_limits":["رسم الهيكل يُظهر العظام منفصلة وبيضاء؛ في الجسم تغطيها أنسجة وهي بلون عاجي وفيها أوعية.","الرسم لا يُظهر الغضروف اللين ولا النخاع.","الرسم ساكن؛ الهيكل يتحرك ويتجدد.","صورة الهيكل (E1) مختزلة الأشكال؛ لا تُستعمل لعدّ عظام الجسم أو فقراته.","مقطع العظم (E4) تبسيط بنيوي؛ توزيع النخاع الأحمر والأصفر يتغير مع العمر، وفقاعة الخلايا توضيحية لا خلايا تخرج من العظم.","صورتا النمو والقوة (E5، E6) رمزيتان بنسب تقريبية؛ صفيحة النمو قرب نهاية العظم نفسه، ومقارنة الفضاء ليست حالة ثابتة لكل الرواد."],"faith":{"opening":{"text":"لَقَدْ خَلَقْنَا ٱلْإِنسَـٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ","reference":"التين 4","grade":"قرآن","usage":"تفكر","reflection":"عظامك{|ِ} تحملك{|ِ} وتحميك{|ِ} وتتحرك بك{|ِ} وتصنع دمك{|ِ}. اليوم ننظر في هذا الإحكام نظرة علم: نجسّ عظامنا ونعدّها.","reviewed":false,"quran_key":"95:4","cards":[]},"closing":null},"life":[{"situation":"أقضي العصر كله أمام الشاشة.","science":"عظمي يُبنى الآن في الطفولة ويقوى بالحمل والحركة ويضعف بقلة الاستعمال.","action":"أتحرك كل يوم: مشي أو قفز أو لعب.","why":"الله أعطاني جسماً يقوى بالاستعمال؛ الحفاظ على النعمة هو أن أستعملها فيما خُلقت له، لا أن أتركها تضعف. والقوي الذي يحافظ على قوته أقدر على نفع نفسه وغيره.","value":"الجسد أمانة أبنيه الآن لعمري كله.","reference":"البخاري 1975","cards":[],"verses":[]},{"situation":"زميل لديه جبيرة مؤقتة أو إعاقة دائمة يستعمل كرسياً متحركاً.","science":"العظم المكسور يلتئم في أسابيع؛ وبعض الاختلافات في الجسم دائمة وطبيعية، وأصحابها يتعلمون ويلعبون ويبدعون بطرقهم.","action":"أساعده حين يطلب، وأشركه في اللعب بطريقة تناسبه، ولا أُشعره بالنقص ولا أنظر إليه نظرة شفقة.","why":"لماذا أحترمه؟ لأن الله وزّع النعم والقدرات بين الناس بطرق مختلفة: هذا يركض بسرعة، وذاك يرسم جيداً، وثالث يحفظ بسرعة، ورابع صبور وهادئ. لا أحد عنده كل شيء، ولا أحد عنده لا شيء. والله يختبر كل واحد منا بما أعطاه وبما لم يعطه: من أعطاه ساقين قويتين يُسأل: هل حافظ عليهما وشكر وساعد بهما؟ ومن ابتُلي بضعف أو مرض يُسأل: هل صبر واجتهد بما يستطيع؟ فالاختبار للاثنين، والدرجة عند الله بالعمل والتقوى لا بقوة الجسم. وقوتي نعمة أحافظ عليها بالحركة، وأشكرها بأن أساعد بها لا أن أتباهى بها. ولو كنت مكانه لأردت أن يعاملني الناس صديقاً لا مريضاً.","value":"المؤمن القوي خير، وفي كلٍّ خير: الخيرية بالعمل لا بالجسم.","reference":"مسلم 2664؛ الحجرات 13؛ الملك 2","cards":[],"verses":[]}],"open_questions":[{"q":"كيف يعرف العظم المكان الذي يحتاج إلى تقوية بالضبط حين نتحرك؟","why_open":"نعرف أن خلايا داخل العظم تحسّ الضغط، لكن كيف «تقرر» أين تبني وأين تهدم ما زال قيد البحث."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة هيكلاً بسيطاً وسمِّ{|ي}: الجمجمة، العمود الفقري، القفص الصدري، الحوض، عظم العضد، عظم الفخذ. المستوى ب: ارسم{|ي} مقطع عظم بثلاث طبقات (صلب، نخاع، أوعية).","label":["الجمجمة","العمود الفقري","القفص الصدري","الحوض","عظم العضد","عظم الفخذ","— ب: نخاع العظم"],"write":"العظام التي جسستها: ____. عدد عظام أصابع يدي: ____ (أعدّها بجسّ المفاصل). ثم أكتب دليلين على أن العظم حي، وبماذا يختلف عن عصا جافة."},"imgs":["U02.L01-E1","U02.L01-E2","U02.L01-E3","U02.L01-E4","U02.L01-E5","U02.L01-E6","U02.L01-exp","U02.L01-hist1","U02.L01-hist2","U02.L01-letter","U02.L01-life","U02.L01-title-boy","U02.L01-title-girl"]};
