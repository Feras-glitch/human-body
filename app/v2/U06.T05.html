const LD = {"id":"U06.T05","lesson":"U06.L05","first":false,"title":"اختبار: سكان الأمعاء، وقضية الوحدة: كيف صار الخبز سكراً؟","lessonTitle":"سكان الأمعاء، وقضية الوحدة: كيف صار الخبز سكراً؟","concepts":[],"check":[],"items":[{"id":"U06.L05.A1.a","objective":"U06.L05.O1","level":"A","type":"choose_reason","prompt":"معظم ميكروبات أمعائك{|ِ}:","options":["تُمرض","نافعة تعيش معك","لا تفعل شيئاً","تأتي من الطعام الفاسد فقط"],"answer":1,"explanation":"معظم ميكروبات الأمعاء نافعة تعيش معنا.","feedback_by_option":{"0":"بعض الميكروبات يُمرض، لكن معظم ما في أمعائك{|ِ} نافع يعيش معك{|ِ}.","2":"تعمل كثيراً: تكسّر الألياف، وتصنع فيتامينات، وتشغل المكان عن الضارة.","3":"بدأت تسكن أمعاءك{|ِ} منذ الولادة، ومع الرضاعة والطعام."},"detects":"M65","alt":{"prompt":"أي جملة عن ميكروبات أمعائك{|ِ} صحيحة؟","options":["تدخل الأمعاء حين نمرض، ثم تخرج إذا شُفينا","معظمها ضار، فالأفضل أن نقتلها","لا تعيش إلا في الطعام الفاسد","تعيش معك{|ِ} منذ الولادة، ومعظمها نافع"],"answer":3,"explanation":"تبدأ ميكروبات الأمعاء تسكننا منذ الولادة، ثم مع الرضاعة والطعام، ومعظمها نافع يعيش معنا بسلام.","feedback_by_option":{"0":"تعيش معنا ونحن أصحاء أيضاً.","1":"بعضها يُمرض، لكن معظمها نافع؛ وقتلها كلها يضر.","2":"تعيش في أمعائك{|ِ} تريليونات منها."},"detects":"M65"}},{"id":"U06.L05.A1.b","objective":"U06.L05.O1","level":"A","type":"true_false_why","prompt":"«بكتيريا الفم التي تصنع الحمض وسكان الأمعاء النافعون شيء واحد». صح أم خطأ؟","answer":"خطأ؛ الميكروبات أنواع كثيرة: بعضها يؤذي في مكان وبعضها ينفع في آخر.","rubric":"R1","alt":{"prompt":"«في الأمعاء الغليظة تريليونات من الميكروبات تعيش معنا بسلام». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تسكن أمعاءنا منذ الولادة، ومعظمها نافع، وقليل منها يُمرض."}},{"id":"U06.L05.A1.c","objective":"U06.L05.O1","level":"A","type":"explain_open","prompt":"من أين جاء أوائل سكان أمعائك{|ِ}؟ ولماذا لا يحاربهم دفاعك{|ِ}؟","answer":"من الأم عند الولادة ثم الرضاعة والطعام؛ الدفاع تعلّم أنهم أصدقاء.","rubric":"R1"},{"id":"U06.L05.A2.a","objective":"U06.L05.O2","level":"A","type":"choose","prompt":"بكتيريا الأمعاء تصنع فيتاميناً يحتاجه الدم ليتجلط ويوقف النزف. ماذا يحدث لو غابت هذه البكتيريا تماماً (كما في الفئران المعقّمة)؟","options":["يصير الدم أكثر تجلطاً لأن البكتيريا كانت تمنعه","لا يتغير شيء لأن الطعام وحده يكفي دائماً","يقلّ الفيتامين فيصعب على الدم أن يتجلط","تتوقف المعدة عن الهضم لأن البكتيريا تهضم فيها"],"answer":2,"explanation":"الفئران المعقّمة ينقصها فيتامين التجلط (K) ما لم يُضف إلى طعامها — فبكتيريا الأمعاء تصنع لنا جزءاً منه.","feedback_by_option":{"0":"البكتيريا تصنع فيتاميناً يساعد التجلط؛ فغيابها يُقلّه لا يزيده.","1":"الطعام يعطي بعضه، لكن الفئران المعقّمة نقص عندها ما لم يُضف إلى طعامها.","3":"المعدة تعمل وحدها؛ والبكتيريا تسكن الأمعاء الغليظة."},"alt":{"prompt":"لماذا يصعب على ميكروب ضار أن يستقر في أمعاء مليئة بسكانها النافعين؟","options":["لأن الأمعاء معقّمة","لأن النافعين يشغلون المكان والطعام","لأن حمض المعدة يملأ الأمعاء الغليظة كلها","لأن الضار لا يحب الظلام"],"answer":1,"explanation":"كل موضع يسكنه ميكروب نافع لا يجد الضار فيه مكاناً ولا طعاماً؛ وهذا من أعمال سكان الأمعاء.","feedback_by_option":{"0":"الأمعاء ليست معقّمة؛ فيها تريليونات من الميكروبات.","2":"حمض المعدة يهدأ في أول الأمعاء الدقيقة، ولا يصل الغليظة.","3":"الظلام ليس السبب؛ المكان والطعام مشغولان."}}},{"id":"U06.L05.A2.b","objective":"U06.L05.O2","level":"A","type":"explain_open","prompt":"كيف يحمينا «شغل المكان»؟","answer":"كل موضع يسكنه نافع لا يجد الضار فيه مكاناً ولا طعاماً.","rubric":"R1"},{"id":"U06.L05.A2.c","objective":"U06.L05.O2","level":"A","type":"true_false_why","prompt":"«ما لا نهضمه لا يضيع كله: سكان الأمعاء يكسّرون بعضه ويصنعون منه ما يغذي جدارها». صح أم خطأ؟","answer":"صح؛ الألياف التي لا نهضمها طعام لهم، وهم يصنعون منها ما ينفعنا.","rubric":"R1","alt":{"prompt":"«سكان الأمعاء يصنعون لنا بعض الفيتامينات، منها فيتامين يساعد الدم على التجلط». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يصنعون فيتامين K وغيره؛ والفئران التي نشأت بلا ميكروبات نقص عندها هذا الفيتامين."}},{"id":"U06.L05.A3.a","objective":"U06.L05.O3","level":"A","type":"choose_reason","prompt":"أي وجبة تطعم سكان أمعائك{|ِ} أكثر؟","options":["حلوى وعصير محلّى","شيبس","ماء فقط","عدس وخبز أسمر وتفاحة بقشرها"],"answer":3,"explanation":"العدس والخبز الأسمر والتفاح بقشره فيها ألياف كثيرة، والألياف طعام سكان الأمعاء.","feedback_by_option":{"0":"سكر الحلوى يُمتص قبل أن يصل إلى سكان الأمعاء؛ الذي يصلهم هو الألياف.","1":"الشيبس طعام مصنّع فيه ألياف قليلة.","2":"الماء مهم، لكن سكان الأمعاء يحتاجون أليافاً."},"detects":"M66","alt":{"prompt":"أي إضافة إلى الغداء تطعم سكان الأمعاء أكثر؟","options":["سلطة خضار وحبة برتقال","كوب عصير محلّى","قطعة شوكولاتة","كيس شيبس"],"answer":0,"explanation":"الخضار والفاكهة فيها ألياف كثيرة، والألياف طعام سكان الأمعاء.","feedback_by_option":{"1":"العصير المحلّى فيه سكر كثير وألياف قليلة.","2":"الشوكولاتة فيها سكر كثير، والسكر الكثير يُضعف تنوع سكان الأمعاء.","3":"الشيبس طعام مصنّع فيه ألياف قليلة."},"detects":"M66"}},{"id":"U06.L05.A3.b","objective":"U06.L05.O3","level":"A","type":"true_false_why","prompt":"«المضاد الحيوي لا يعالج الزكام لأن الزكام فيروس». صح أم خطأ؟","answer":"صح؛ المضاد يقتل بكتيريا فقط، ويُؤخذ بوصفة طبيب.","rubric":"R1","detects":"M67","alt":{"prompt":"«إذا شعرتُ بتحسن أوقفتُ المضاد الحيوي قبل انتهاء المدة التي وصفها الطبيب». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ المضاد الحيوي يُؤخذ كما وصفه الطبيب جرعةً ومدة، لا نوقفه ولا نزيده من عندنا.","detects":"M67"}},{"id":"U06.L05.A3.c","objective":"U06.L05.O3","level":"A","type":"explain_open","prompt":"لماذا نأخذ المضاد الحيوي كما وصفه الطبيب بالضبط، ولا نأخذه للزكام؟","answer":"لأنه يقتل البكتيريا النافعة مع الضارة، ولا يعمل على الزكام لأنه فيروس؛ والطبيب يقدّر الجرعة والمدة المناسبة، واستعماله بلا حاجة يساعد البكتيريا على مقاومته.","rubric":"R1"},{"id":"U06.L05.A4.a","objective":"U06.L05.O4","level":"A","type":"choose_reason","prompt":"أين يكتمل تحويل نشا الخبز إلى سكر؟","options":["في أول الأمعاء الدقيقة بعصارة البنكرياس","في الفم؛ اللعاب وحده يحوّل الخبز كله قبل أن نبلعه","في المعدة؛ الحمض يحوّل النشا إلى سكر","في الكبد؛ يصل الخبز إليه فيحوّله سكراً"],"answer":0,"explanation":"اللعاب يبدأ تحويل النشا، لكن التحويل يكتمل في الأمعاء الدقيقة: عصارة البنكرياس تكسّره، وجدار الأمعاء يُكمل تحويله إلى سكر.","feedback_by_option":{"1":"اللعاب يبدأ التحويل فقط، ولا يكمله في الفم.","2":"حمض المعدة لا يحوّل النشا إلى سكر.","3":"الخبز لا يصل الكبد أبداً؛ يصله السكر في الدم بعد الامتصاص."},"detects":"M51","alt":{"prompt":"ما عمل عصارة البنكرياس في الخبز؟","options":["تمتص السكر إلى الدم","تبدأ تحويل النشا في الفم","تخلط الخبز في المعدة","تكسّر النشا في أول الأمعاء الدقيقة"],"answer":3,"explanation":"عصارة البنكرياس تكسّر النشا في أول الأمعاء الدقيقة، ويُكمل جدار الأمعاء تحويله إلى سكر، ثم تمتصه الخملات.","feedback_by_option":{"0":"الخملات تمتص السكر بعد أن يتكسر النشا.","1":"في الفم يبدأ اللعاب.","2":"المعدة تخلط بعضلاتها."},"detects":"M51"}},{"id":"U06.L05.A4.b","objective":"U06.L05.O4","level":"A","type":"sequence","prompt":"رتّب{|ي}: ما يحدث للنشا.","options":["اللعاب يبدأ تحويله","المعدة تخلطه","عصارة البنكرياس تكسّره كله إلى سكر","السكر يعبر جدار الخملات إلى الدم","الكبد يخزّن الفائض","الخلية تطلق طاقته بالأكسجين"],"answer":[0,1,2,3,4,5],"explanation":"يبدأ اللعاب، فتخلط المعدة، ثم تكسّر عصارة البنكرياس النشا ويُكمل جدار الأمعاء تحويله إلى سكر، فيعبر السكر جدار الخملات إلى الدم، فيخزّن الكبد الفائض، وتُطلق الخلية طاقته بالأكسجين.","alt":{"prompt":"رتّب{|ي} رحلة السكر بعد أن يتكوّن في الأمعاء الدقيقة.","options":["يعبر جدار الخملة","يدخل شعيرة دموية","يمرّ بالكبد","يدفعه القلب إلى الجسم","تُطلق الخلية طاقته بالأكسجين"],"answer":[0,1,2,3,4],"explanation":"يعبر السكر جدار الخملة إلى شعيرة دموية، فيمرّ بالكبد، ثم يدفعه القلب إلى الجسم، فتُطلق الخلية طاقته بالأكسجين."}},{"id":"U06.L05.A4.c","objective":"U06.L05.O4","level":"A","type":"explain_open","prompt":"اكتب{|ي} الجملة التي تجمع الوحدتين الخامسة والسادسة.","answer":"الخبز يصير سكراً في الأمعاء الدقيقة، يدخل الدم عبر الخملات، يخزّنه الكبد، وتُطلق الخلية طاقته بالأكسجين.","rubric":"R1"},{"id":"U06.L05.A5.a","objective":"U06.L05.O5","level":"B","type":"choose_reason","prompt":"خطأ في النموذج: «الألياف تُمتَص إلى الدم كالسكر». الصواب؟","options":["صحيح؛ الألياف تُهضم وتُمتص إلى الدم كالسكر تماماً في الأمعاء","الألياف لا تُهضم ولا تُمتَص؛ تذهب إلى سكان الغليظة","تُمتَص في المعدة لأن الحمض يذيبها","تُمتَص في الفم مع اللعاب قبل البلع"],"answer":1,"explanation":"الألياف لا تُهضم ولا تُمتص؛ تمضي إلى الأمعاء الغليظة فيتغذى بها سكانها.","feedback_by_option":{"0":"الإنسان لا يهضم الألياف، فلا تُمتص.","2":"حمض المعدة لا يذيب الألياف؛ تمرّ كما هي تقريباً.","3":"الفم لا يمتص الألياف؛ تمرّ إلى الأمعاء."},"alt":{"prompt":"خطأ في نموذج: «ما يخرج مع البراز هو الطعام الذي لم نحتجه». الصواب؟","options":["البراز دم قديم","النموذج صحيح؛ البراز طعام زائد لم يحتجه الجسم","البراز ماء وألياف وميكروبات وخلايا متساقطة","البراز صفراء من الكبد"],"answer":2,"explanation":"ما يُهضم يُمتص؛ والبراز ماء وألياف لم تُهضم وميكروبات وخلايا متساقطة من جدار الأمعاء.","feedback_by_option":{"0":"البراز ليس دماً؛ لونه من صبغة في الصفراء.","1":"ما يُهضم يُمتص؛ وفي البراز أشياء لم تكن في الطعام أصلاً.","3":"في البراز صبغة من الصفراء، لكن معظمه ماء وألياف وميكروبات."},"detects":"M62"}},{"id":"U06.L05.A5.b","objective":"U06.L05.O5","level":"B","type":"explain_open","prompt":"ما الذي يدخل الدم وما الذي يخرج مع البراز من لقمة خبز أسمر؟","answer":"يدخل الدم: السكر (وقليل من بروتين الخبز)؛ يخرج: ألياف القشرة مع ماء وميكروبات وخلايا.","rubric":"R1"},{"id":"U06.L05.A5.c","objective":"U06.L05.O5","level":"B","type":"true_false_why","prompt":"«ما يخرج مع البراز كان كله في الخبز». صح أم خطأ؟","answer":"خطأ؛ فيه ميكروبات وخلايا متساقطة وصبغة صفراء لم تكن في الخبز.","rubric":"R1","alt":{"prompt":"«من لقمة الخبز الأسمر يدخل الدمَ السكرُ، وتخرج ألياف القشرة مع البراز». صح أم خطأ؟ ولماذا؟","answer":"صح؛ النشا يُهضم سكراً يدخل الدم، والألياف لا تُهضم فتمضي إلى الغليظة وتخرج مع البراز."}},{"id":"U06.L05.A6.a","objective":"U06.L05.O6","level":"B","type":"choose","prompt":"ما الذي حدث للفئران المعقّمة؟","options":["صارت أصح لأن الميكروبات كلها ضارة","لم يتغير شيء لأن الميكروبات لا عمل لها في الجسم أبداً","احتاجت طعاماً أكثر، ونقص فيتامين K، وضعف دفاعها","ماتت فوراً لأنها لا تعيش بلا ميكروبات"],"answer":2,"explanation":"الفئران بلا ميكروبات احتاجت طعاماً أكثر، ونقص عندها فيتامين K، وضعف دفاعها؛ فعرفنا أن للميكروبات عملاً.","detects":"M65","feedback_by_option":{"0":"ليست الميكروبات كلها ضارة؛ الفئران المعقّمة احتاجت طعاماً أكثر وضعف دفاعها.","1":"تغيّر الكثير؛ وهذا ما كشفته المقارنة.","3":"عاشت، لكنها احتاجت طعاماً أكثر، ونقص عندها فيتامين K، وضعف دفاعها."},"alt":{"prompt":"بعد أن أعطى العلماء الفئران المعقّمة ميكروبات عادية، ماذا حدث؟","options":["ماتت كلها","عادت أقرب إلى الفئران الطبيعية","لم يتغير فيها شيء، لأن الميكروبات لا عمل لها","صارت أصغر حجماً"],"answer":1,"explanation":"حين أُعطيت الفئران المعقّمة ميكروبات عادية عادت أقرب إلى الطبيعية؛ فثبت أن الفرق سببه الميكروبات لا شيء آخر.","feedback_by_option":{"0":"لم تمت؛ الميكروبات العادية نافعة في معظمها.","2":"تغيّرت؛ وهذا ما أثبت أن الفرق من الميكروبات.","3":"الحجم لم يكن ما تغيّر؛ عادت حاجتها إلى الطعام ودفاعها أقرب إلى الطبيعي."}}},{"id":"U06.L05.A6.b","objective":"U06.L05.O6","level":"B","type":"explain_open","prompt":"لماذا كان إعطاء الفئران المعقّمة ميكروبات عادية خطوة مهمة في التجربة؟","answer":"لإثبات أن الفرق سببه الميكروبات لا شيء آخر؛ عادت طبيعية حين عادوا.","rubric":"R1"},{"id":"U06.L05.A6.c","objective":"U06.L05.O6","level":"B","type":"true_false_why","prompt":"«لأن الرقم 10:1 تغيّر إلى 1:1 فالعلم غير موثوق». صح أم خطأ؟","answer":"خطأ؛ تصحيح الرقم دليل أن العلم يراجع نفسه؛ الفكرة (تريليونات نافعة) بقيت.","rubric":"R1","alt":{"prompt":"«تغيّر تقدير عدد ميكروبات الأمعاء مقارنة بخلايا الجسم، لكن فكرة أنها تريليونات أكثرها نافع بقيت». صح أم خطأ؟ ولماذا؟","answer":"صح؛ صحّح العلماء الرقم من 10 إلى 1 إلى نحو 1 إلى 1 بقياس أدق، وبقيت الفكرة: تريليونات تعيش معنا ومعظمها نافع."}}],"transfer":[{"id":"U06.L05.T1","objective":"U06.L05.O2","type":"explain_open","prompt":"البقرة تعيش على العشب وحده مع أن عصاراتها لا تهضمه. فسّر{|ي} بما {تعلمته|تعلمتِه}.","answer":"ميكروبات معدتها تكسّر العشب لها ثم تهضم البقرة نواتجه (والميكروبات نفسها).","level":"A","rubric":"R1"},{"id":"U06.L05.T2","objective":"U06.L05.O3","type":"explain_open","prompt":"إعلان يقول: «اشرب{|ي} هذا كل يوم لتصلح ميكروباتك وتصير سعيداً». ما الذي يقوله العالِم؟","answer":"ما يُثبَت: الألياف تطعمهم؛ ما لم يُثبَت: أن منتجاً بعينه يصنع السعادة؛ «ربما ولم نتأكد»، ولا نشتري وعداً.","level":"B","rubric":"R1"}],"recall":[{"id":"U06.L05.D1","objective":"U06.L05.O1","type":"choose","prompt":"معظم ميكروبات الأمعاء:","options":["ضارة","نافعة","لا توجد"],"answer":1,"explanation":"معظم ميكروبات الأمعاء نافعة.","level":"A","feedback_by_option":{"0":"بعض الميكروبات يُمرض، لكن معظم ما في أمعائك{|ِ} نافع يعيش معك{|ِ}.","2":"في أمعائك{|ِ} تريليونات منها، تعيش معك{|ِ} منذ الولادة."}},{"id":"U06.L05.D2","objective":"U06.L05.O4","type":"choose","prompt":"يكتمل تحويل الخبز إلى سكر في:","options":["المعدة بحمضها القوي","الفم باللعاب وحده","الأمعاء الدقيقة"],"answer":2,"explanation":"تحويل الخبز إلى سكر يكتمل في الأمعاء الدقيقة.","level":"A","feedback_by_option":{"0":"المعدة تخلط فقط؛ وحمضها لا يحوّل النشا إلى سكر.","1":"اللعاب يبدأ التحويل فقط؛ واللقمة لا تبقى في الفم حتى يكتمل."}},{"id":"U06.L05.D3","objective":"U06.L05.O3","type":"choose","prompt":"المضاد الحيوي:","options":["بوصفة وكما وصفه الطبيب","للزكام والإنفلونزا متى ظهرا","متى أحببنا دون أن نسأل أحداً"],"answer":0,"explanation":"المضاد الحيوي لا يؤخذ إلا بوصفة، وبالمدة التي حددها الطبيب.","level":"A","feedback_by_option":{"1":"الزكام والإنفلونزا من فيروسات، والمضاد الحيوي لا يعمل عليها.","2":"المضاد الحيوي يقتل النافع مع الضار؛ لا يؤخذ إلا بوصفة."}},{"id":"U06.L05.D4","objective":"U06.L05.O2","level":"A","type":"choose","prompt":"أي هذه من أعمال سكان الأمعاء النافعين؟","options":["يطحنون الطعام","يصنعون حمض المعدة","يمتصون السكر إلى الدم","يكسّرون أليافاً لا نهضمها، ويصنعون فيتامينات"],"answer":3,"explanation":"سكان الأمعاء يكسّرون أليافاً لا نهضمها، ويصنعون فيتامينات منها K، ويشغلون المكان فلا تجد الميكروبات الضارة موضعاً.","feedback_by_option":{"0":"الطحن عمل الأضراس في الفم.","1":"حمض المعدة تصنعه المعدة نفسها.","2":"الخملات تمتص السكر في الأمعاء الدقيقة."}},{"id":"U06.L05.D5","objective":"U06.L05.O5","level":"B","type":"choose","prompt":"في نموذج للهضم: «الخبز يصير سكراً في المعدة». ما الصواب؟","options":["المعدة تخلط فقط؛ والتحويل يكتمل في الأمعاء","صحيح؛ حمض المعدة القوي يحوّل النشا كله إلى سكر","يصير سكراً في الكبد","يصير سكراً في الأمعاء الغليظة"],"answer":0,"explanation":"اللعاب يبدأ تحويل النشا في الفم، والمعدة تخلط، ويكتمل التحويل في الأمعاء الدقيقة بعصارة البنكرياس وجدار الأمعاء.","feedback_by_option":{"1":"حمض المعدة لا يحوّل النشا إلى سكر.","2":"الخبز لا يصل الكبد؛ يصله السكر في الدم بعد الامتصاص.","3":"حين يصل الباقي إلى الغليظة يكون السكر قد امتُصّ."},"detects":"M51"},{"id":"U06.L05.D6","objective":"U06.L05.O6","level":"B","type":"choose","prompt":"كيف عرف العلماء أن ميكروبات الأمعاء نافعة؟","options":["رأوها بالمجهر فقط","قارنوا حيوانات بلا ميكروبات بأخرى معها","سألوا الناس عن شعورهم بعد أكل اللبن والخضار","خمّنوا ذلك"],"answer":1,"explanation":"قاعدة «مع وبدون»: قارن العلماء حيوانات نشأت بلا ميكروبات بأخرى طبيعية، فظهر ما تفعله الميكروبات.","feedback_by_option":{"0":"الرؤية تكشف وجودها لا عملها؛ والعمل تكشفه المقارنة.","2":"الشعور لا يكشف عمل الميكروبات؛ المقارنة تكشفه.","3":"العلم لا يكتفي بالتخمين."}}]};
