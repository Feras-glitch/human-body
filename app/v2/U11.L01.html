const LD = {"id":"U11.L01","first":true,"title":"جسمي فريق واحد: حين أركض","driving_question":"{اسم}، {ركضت|ركضتِ} دقيقتين في الفسحة: فلماذا {لهثت|لهثتِ}، ودقّ قلبك{|ِ}، و{عرقت|عرقتِ}، و{عطشت|عطشتِ}، ثم {نمت|نمتِ} نوماً عميقاً تلك الليلة؟","central_fact":"حين نركض تعمل أجهزة الجسم معاً كفريق: الدماغ والأعصاب يبدؤون الحركة، والتنفس والقلب يوصلان أكسجيناً أكثر إلى العضلات، والجلد يُخرج حرارتها بالعرق، والعطش والكليتان يحفظان الماء؛ ثم يعود كل شيء إلى حده في التعافي.","next":"U11.L02","nexts":[{"id":"U11.L02","gated":false},{"id":"U11.L03","gated":false}],"hook":{"text":"{اسم}، بعد الجري {تلهث|تلهثين}. لماذا في رأيك{|ِ}؟","options":["لأن رئتيّ تعبتا","لأن عضلاتي تطلب أكسجيناً أكثر","لأن قلبي ضعيف","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","muscles"],"highlight":["brain","motor_nerve"],"zoom":"body"},"text":"في عشر وحدات {عرفت|عرفتِ} أعضاء جسمك{|ِ} واحداً واحداً. وكل مجموعة من الأعضاء تعمل معاً لعمل واحد اسمها جهاز الجسم: الجهاز العصبي، والجهاز التنفسي، والجهاز الدوري، والجهاز الهضمي، وغيرها. واليوم نراها كلها في دقيقتين من الجري. يبدأ كل شيء في الدماغ: {تقرر|تقررين} أن {تركض|تركضي}، فتخرج الرسالة من الدماغ في الأعصاب إلى عضلات ساقيك{|ِ}، فتنقبض وتسحب العظام كما {عرفت|عرفتِ} في درس العضلات. خطوة واحدة، وفيها جهازان على الأقل."},{"id":"E2","level":"A","atlas":{"layers":["respiratory","circulatory"],"highlight":["lungs","heart","capillaries"],"zoom":"body"},"text":"العضلة التي تعمل تحتاج طاقة، والطاقة تُطلق في خلاياها من السكر بالأكسجين، كما {عرفت|عرفتِ} في درس الخلية. فتطلب العضلات أكسجيناً أكثر، وتُخرج ثاني أكسيد كربون أكثر. وفي دماغك{|ِ} حسّاسات تقيس ذلك في الدم، فتأمر بتنفس أسرع وأعمق، ويدق القلب أسرع ليوصل الدم بسرعة. وفي العضلة نفسها شيء جميل: شعيرات دموية كثيرة كانت مغلقة وهي مستريحة تنفتح الآن وتتسع، فيصل الدم إلى خلايا أكثر. فاللهاث ليس تعب الرئتين، بل فريق كامل يعمل."},{"id":"E3","level":"A","atlas":{"layers":["skin"],"highlight":["sweat_gland","hypothalamus"],"zoom":"body"},"text":"العضلات وهي تنقبض تصنع حرارة، فترتفع حرارة لماء ليعوّض العرق؛ والطعام ليعوّض الطاقة؛ والنوم لأن العضلات تُصلح نفسها فيه وتقوى.","level":"A","rubric":"R1"},{"id":"U11.L01.C5","objective":"U11.L01.O4","type":"fix_model","prompt":"عدّ سامي نبضه قبل الجري 15 ثانية، وبعده 30 ثانية، ثم قال: «نبضي بعد الجري صار ضعفين ونصفاً!». ما الخطأ في طريقته؟","answer":"لم يقس بالطريقة نفسها: مرة 15 ثانية ومرة 30 ثانية؛ يجب أن يعدّ الزمن نفسه في المرتين، أو يحوّل كل عدد إلى دقيقة.","level":"A","rubric":"R1"},{"id":"U11.L01.C6","objective":"U11.L01.O4","type":"true_false_why","prompt":"«بعد الجري يكفي أن نسأل عن الرئتين لنفهم ما حدث للجسم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تغيّر النبض والحرارة والعرق والعطش أيضاً، فلا يفسر ما حدث عضو واحد، بل أجهزة تعمل معاً.","level":"A","rubric":"R1"}],"concepts":[{"id":"body_system","term":{"ar":"جهاز الجسم","en":"Body system","zh":"人体系统","pinyin":"réntǐ xìtǒng","match":["جهاز الجسم","أجهزة الجسم","أجهزة جسمك","الأجهزة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"مجموعة أعضاء تعمل معاً لعمل واحد: الجهاز التنفسي يُدخل الهواء، والجهاز الدوري ينقل الدم، والجهاز العصبي يحمل الرسائل. وأجهزة الجسم كلها تعمل معاً كفريق.","B":"كل جهاز يعتمد على غيره: العضلة لا تعمل بلا أكسجين من الرئتين، ولا يصلها الأكسجين بلا قلب، ولا تبدأ بلا رسالة من العصب."}},{"id":"recovery","term":{"ar":"التعافي","en":"Recovery","zh":"恢复","pinyin":"huīfù","match":["التعافي","يتعافى","تعافي"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"ما يحدث بعد التوقف عن الجهد: يهدأ النبض والتنفس، وتنزل الحرارة، ويعوّض الجسم الماء والطاقة، ويُصلح نفسه في النوم.","B":"كلما اعتاد الجسم الحركة كان تعافيه أسرع."}},{"id":"homeostasis","term":{"ar":"الاتزان الداخلي","en":"Homeostasis","zh":"体内平衡","pinyin":"tǐnèi pínghéng","match":["الاتزان الداخلي"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"أن يحفظ الجسم ما في داخله في حدود ثابتة: الحرارة والماء والأكسجين.","B":"إذا أخرج الجهد شيئاً عن حده أعادته الأجهزة معاً: العرق للحرارة، والعطش والكليتان للماء، والتنفس والقلب للأكسجين."}}],"experiment":{"title":"قبل وبعد: ماذا يتغيّر في جسمي حين أقفز؟","materials":["ساعة فيها ثوانٍ أو مؤقّت","دفتر الأطلس وقلم","كوب ماء","مكان آمن للقفز"],"steps":["{اجلس|اجلسي} {هادئاً|هادئةً} دقيقتين، ثم {عُدّ|عُدّي} نبضك{|ِ} 30 ثانية من الرسغ و{اضربه|اضربيه} في 2، و{عُدّ|عُدّي} أنفاسك{|ِ} 30 ثانية و{اضربها|اضربيها} في 2. و{اكتب|اكتبي}: هل جلدك{|ِ} دافئ أم عادي؟","{اقفز|اقفزي} في مكانك{|ِ} أو {اركض|اركضي} في المكان دقيقتين، بإذن الكبار.","فور التوقف {عُدّ|عُدّي} النبض والأنفاس بالطريقة نفسها، و{لاحظ|لاحظي}: هل احمرّ وجهك{|ِ}؟ هل {عرقت|عرقتِ}؟ هل {عطشت|عطشتِ}؟","{استرح|استريحي} {جالساً|جالسةً} خمس دقائق، ثم {عُدّ|عُدّي} مرة ثالثة.","{اشرب|اشربي} الماء، و{سجّل|سجّلي} في آخر اليوم لون البول وعدد أكواب الماء."],"safety":["من عنده ربو أو مرض في القلب أو دوار يشارك بإذن أهله وطبيبه، ويتوقف فوراً إن ضاق نفسه أو دار رأسه.","القفز في مكان خالٍ بحذاء مناسب، بعيداً عن الحواف والأثاث، وفي الظل إن كان الجو حاراً.","لا نتسابق ولا نقارن أرقامنا بأرقام غيرنا: لكل جسم أرقامه."],"expected":"بعد القفز يزيد النبض وعدد الأنفاس كثيراً، وقد يحمرّ الوجه ويظهر عرق وعطش؛ وبعد خمس دقائق من الراحة يقترب النبض والتنفس من أرقام البداية.","explain":"العضلات العاملة طلبت أكسجيناً أكثر، فسرّع الدماغ التنفس والقلب. وصنعت حرارة، فقرّب الجسم الدم من الجلد فاحمرّ وأفرز العرق ليبرّده. والعرق أخذ ماءً، فجاء العطش. ثم في الراحة عاد كل شيء قريباً من حده: هذا التعافي.","record":"قبل: نبض ___ أنفاس ___ — بعد القفز: نبض ___ أنفاس ___ عرق؟ ___ عطش؟ ___ — بعد 5 دقائق: نبض ___ أنفاس ___ — آخر اليوم: أكواب الماء ___ لون البول ___","alternatives":["قياس أحد الكبار في البيت بعد صعود الدرج وهبوطه دقيقتين.","من لا يستطيع القفز: جدول قياسات طفل في المشهد، وتفسيره بالأجهزة."]},"find_the_error":[{"id":"FE1","atlas_variant":"systems_alone","error":"لوحة: كل جهاز في الجسم يعمل وحده","answer":"الأجهزة تعمل معاً كفريق: الدماغ والعضلات والرئتان والقلب والجلد والكليتان في جري واحد","detects":"M119"},{"id":"FE2","atlas_variant":"panting_lungs_weak","error":"ملصق: اللهاث يعني أن رئتيك ضعيفتان","answer":"اللهاث لأن العضلات تطلب أكسجيناً أكثر، ويهدأ بعد الراحة","detects":"M120"},{"id":"FE3","atlas_variant":"sweat_weak","error":"جملة في دفتر: العرق علامة الضعف","answer":"العرق يبرّد الجسم حين تصنع العضلات حرارة","detects":"M121"}],"numbers":[{"text":"في الراحة {تتنفس|تتنفسين} نحو 20 مرة في الدقيقة، وبعد الجري أكثر بكثير، ثم يعود العدد بعد دقائق من الراحة.","source":["S10"]},{"text":"ستون دقيقة من الحركة في اليوم: هذا ما توصي به منظمة الصحة العالمية لمن في عمرك{|ِ}.","source":["S12"]}],"true_size":[{"text":"العضلات نحو ثلث وزن جسم الكبير؛ وحين تعمل كلها في الجري تصنع حرارة كأنها مدفأة صغيرة داخلك{|ِ}، ولهذا يحتاج الجسم إلى العرق.","source":["S14"]}],"animal":null,"organ_letter":{"from":"القلب","text":"مرحباً، أنا قلبك{|ِ}، وأكتب إليك{|ِ} باسم الفريق كله. حين {قررت|قررتِ} أن {تركض|تركضي} لم أعمل وحدي: أرسل الدماغ الرسالة في الأعصاب، فانقبضت العضلات، وطلبت أكسجيناً، فأسرعت الرئتان وأسرعت أنا، وفتحت العضلات شعيراتها لتأخذ الدم. وصنعت العضلات حرارة، فأخرجها الجلد عرقاً، وجاءك{|ِ} العطش، وحفظت الكليتان الماء. ثم {توقفت|توقفتِ}، فهدأنا جميعاً في دقائق. نحن لا نتنافس، نحن فريق. فتحرك{|ي} كل يوم ساعة، و{اشرب|اشربي} الماء، و{نم|نامي} كفايتك{|ِ}؛ فهكذا نقوى معاً."},"history":[{"who":"أوغست كروغ","origin":"غرينو، الدنمارك","where_when":"جامعة كوبنهاغن، نحو 1919؛ جائزة نوبل 1920","did":"حقن في دم ضفادع وحيوانات صغيرة حبراً أسود فتلوّنت الشعيرات التي كانت مفتوحة، ثم عدّها بالمجهر، فوجد أن العضلة العاملة تفتح شعيرات أكثر بكثير من العضلة المستريحة، وأوسع.","did_not":"لم يدرس ذلك في أطفال ولا في الإنسان مباشرة، ولم يعرف كل ما يأمر الشعيرات أن تنفتح؛ وهذا ما بحثه العلماء بعده.","method_lesson":"أن نجعل الخفي مرئياً: صبغة بسيطة وعدّ صبور تحت المجهر غيّرا ما يظنه الناس.","source":["S4","S5"]}],"how_we_know":{"text":"كيف عرفنا أن العضلة العاملة يصلها دم أكثر؟ كان العلماء يظنون أن الدم يجري فيها أسرع فقط. ثم حقن العالم الدنماركي أوغست كروغ في دم ضفادع وحيوانات صغيرة حبراً أسود، فتلوّنت الشعيرات التي كانت مفتوحة، وعدّها بالمجهر: في العضلة العاملة شعيرات مفتوحة أكثر بكثير، وأوسع. ونال بذلك جائزة نوبل سنة 1920.","limit_question":"لماذا لا نستطيع أن نعرف من تجربة كروغ وحدها كيف يعمل الجسم كله في الجري؟"},"what_changed":["كان يُظن أن العضلة العاملة يصلها أكسجين أكثر لأن الدم يجري فيها أسرع؛ ثم أظهر كروغ أن شعيرات كثيرة كانت مغلقة تنفتح حين تعمل العضلة.","كان الناس يدرسون كل عضو وحده؛ واليوم يدرس العلماء كيف تتبادل الأجهزة الرسائل في الجسم كله."],"model_limits":["رسم «فريق الأجهزة» يجعلها لاعبين منفصلين يتبادلون الكرة؛ في الحقيقة تحدث أشياء كثيرة في اللحظة نفسها، والرسائل تجري في الدم والأعصاب معاً.","السلسلة المرسومة سهماً بعد سهم ترتيب للفهم؛ في الجسم يسرع التنفس والقلب معاً تقريباً، ولا ينتظر أحدهما الآخر.","تجربة النبض والتنفس تقيس بالعدّ باليد، وفيها خطأ صغير؛ والتكرار يقلّله."],"faith":{"opening":{"text":"مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد، إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى","reference":"مسلم 2586","grade":"صحيح","usage":"قيمة","reflection":"في هذا الدرس نرى أجهزة الجسم تعمل معاً: إذا تعبت العضلات أسرع القلب والرئتان، وعرق الجلد، وحفظت الكليتان الماء. والحديث في البطاقة يستعمل صورة الجسد ليعلّمنا خُلقاً: أن يكون المؤمنون في محبتهم ورحمتهم وعطفهم بعضهم على بعض كالجسد الواحد، إذا تألم عضو تألم له الجسد كله. والحديث لا يشرح أجهزة الجسم، والعلم لا يشرح الحديث؛ لكنه يسألنا: إذا تألم صديق أو جار، هل {تشعر|تشعرين} به و{تقف|تقفين} معه؟","reviewed":false,"hadith_key":"muslim:2586","highlight":"مثل الجسد","level":"ترغيب","concept":"التراحم بين الناس: نشعر بألم غيرنا ونقف معه كما يتجاوب الجسد كله لعضو منه.","avoid":"لا نقول إن الحديث يصف الجهاز العصبي أو تكامل الأجهزة أو الحمى علمياً، ولا نجعل العلم دليلاً عليه؛ هو تشبيه لتعليم التراحم.","lead":"عن النعمان بن بشير رضي الله عنهما قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2586","grader":"","cards":[]},"closing":{"text":"نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ","reference":"البخاري 6412","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن الجسم يقوى حين يتحرك ويشرب وينام كفايته. والحديث في البطاقة يذكر نعمتين يغفل عنهما كثير من الناس فلا ينتفعون بهما كما ينبغي: الصحة، والوقت الفارغ. وأنت{|ِ} اليوم {عندك|عندكِ} الاثنتان. والحديث لا يتكلم عن الجري ولا عن القلب؛ لكنه يدعونا إلى ألا نضيّع ما أُعطينا. كيف {ستجعل|ستجعلين} ساعة من وقتك{|ِ} الفارغ هذا الأسبوع حركة ولعباً؟","reviewed":false,"hadith_key":"bukhari:6412","highlight":"الصحة والفراغ","level":"ترغيب","concept":"الصحة والوقت نعمتان، ومن شكرهما أن ننتفع بهما في ما يقوّينا وينفعنا.","avoid":"لا نقول إن الحديث يأمر بالرياضة بعينها، ولا نحقّر من لا يستطيع الحركة لمرض؛ فلكل واحد ما يستطيعه.","lead":"عن ابن عباس رضي الله عنهما قال: قال النبي ﷺ:","narration":false,"source":"البخاري 6412","grader":"","cards":[]}},"life":[{"situation":"في مباراة في يوم حار جلس زميلي على الأرض شاحباً متعرقاً، والفريق يريد أن يكمل اللعب.","science":"العرق الكثير يُخرج ماءً وأملاحاً، والجسم في الحر قد لا يبرد كفاية؛ والشحوب والدوار والتعرق الكثير من علامات الإنهاك الحراري.","action":"أوقف اللعب وأخبر المعلم أو المدرب فوراً، ونأخذ زميلي إلى الظل، ونعطيه ماءً، ونبقى معه حتى يطمئن الكبار عليه.","value":"التراحم والوقوف مع من يتألم.","why":"لماذا أوقف اللعب من أجل زميل واحد؟ لأن جسمه يحتاج الآن ظلاً وماءً وكبيراً ينظر في حاله، وكما يتجاوب الجسد كله لعضو منه نقف نحن مع صاحبنا.","hadith":["muslim:2586"],"cards":[{"key":"muslim:2586","lead":"عن النعمان بن بشير رضي الله عنهما قال: قال رسول الله ﷺ:","text":"مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد، إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى","narration":false,"source":"مسلم 2586","grade":"صحيح","grader":""}],"verses":[]},{"situation":"بعد المدرسة أقضي الوقت كله على الشاشة، وأقول: الرياضة متعبة.","science":"الحركة المنتظمة تقوّي القلب والعضلات، وتجعل التعافي أسرع، والأطفال النشيطون ينامون أفضل؛ والتوصية ساعة في اليوم.","action":"أختار لعبة حركة أحبها، كالدراجة أو الكرة أو الحبل، ساعة في اليوم مع أهلي أو أصدقائي، وأشرب الماء قبلها وبعدها.","value":"شكر نعمة الصحة والوقت.","why":"لماذا أتحرك وأنا لا أحب التعب؟ لأن التعب الصغير اليوم يجعل الفريق كله في جسمي أقوى غداً؛ ومن الانتفاع بالصحة والفراغ ألا أتركهما يضيعان.","cards
