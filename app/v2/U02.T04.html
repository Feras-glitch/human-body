<script>
const LD = {"id":"U02.T04","lesson":"U02.L04","first":false,"title":"اختبار: قضية الوحدة: أبني ذراعاً تتحرك","lessonTitle":"قضية الوحدة: أبني ذراعاً تتحرك","concepts":[],"check":[],"items":[{"id":"U02.L04.A1.a","objective":"U02.L04.O1","type":"explain_open","prompt":"صف{|ي} نموذجك{|ِ} (أو النموذج المرسوم في الدرس): ما الذي يمثّل العظم؟ المفصل؟ العضلة؟ الوتر؟","answer":"الشريطان؛ الدبوس؛ الخيطان؛ مواضع الإلصاق.","level":"A","rubric":"R1"},{"id":"U02.L04.A1.b","objective":"U02.L04.O1","type":"choose","prompt":"لثني الساعد في النموذج:","answer":3,"explanation":"الثني يحتاج سحب الخيط الأمامي، والخيط الخلفي يرتخي ليسمح بالحركة، كالعضلتين في الذراع.","level":"A","options":["أسحب الخيطين معاً","أدفع الخيط الأمامي","أدير المفصل","أسحب الخيط الأمامي وأرخي الخلفي"],"feedback_by_option":{"0":"لو سحبت{|ِ} الخيطين معاً لشدّ كل واحد في جهة، فلا ينثني الساعد بسهولة.","1":"الخيط لا يُدفع، كما أن العضلة لا تدفع.","2":"المفصل لا يتحرك وحده؛ الخيط (العضلة) هو الذي يسحب الساعد."},"alt":{"prompt":"لمدّ الساعد في النموذج بعد ثنيه:","options":["أسحب الخيط الأمامي أكثر","أدفع الخيط الخلفي","أسحب الخيط الخلفي وأرخي الأمامي","أدير الدبوس (المفصل)"],"answer":2,"explanation":"المدّ بسحب الخيط الخلفي، والأمامي يرتخي ليسمح بالحركة، كالعضلتين في ذراعك{|ِ}.","feedback_by_option":{"0":"سحب الخيط الأمامي يثني الساعد أكثر، ولا يمدّه.","1":"الخيط لا يُدفع، كما أن العضلة لا تدفع.","3":"المفصل لا يحرّك الساعد؛ الخيط هو الذي يسحبه."},"detects":"M01"}},{"id":"U02.L04.A1.c","objective":"U02.L04.O1","type":"choose","prompt":"نموذج ذراع بخيط واحد (عضلة واحدة) يثني الساعد، والجاذبية تمدّه حين يرتخي الخيط. ماذا ينقصه ليشبه ذراعك{|ِ}؟","answer":1,"level":"A","options":["خيط أطول يثني الساعد أكثر","عضلة مقابلة تمدّ الساعد ولو ضد مقاومة","مفصل كروي يدور في كل اتجاه","لا ينقصه شيء؛ الجاذبية تمدّ الساعد في كل وضع"],"explanation":"الجاذبية تمدّ الساعد المرتخي فقط؛ {لتمدّه|لتمدّيه} ضد مقاومة (كدفع باب) أو {تمدّه|تمدّيه} وذراعك{|ِ} فوق رأسك{|ِ} تحتاج عضلة مقابلة — لذلك تعمل العضلات أزواجاً.","feedback_by_option":{"0":"خيط أطول يثني أكثر، لكنه لا يمدّ. فمن يمدّ الساعد ضد مقاومة؟","2":"المرفق رزّي ينثني في اتجاه واحد؛ والمشكلة في المدّ لا في الاتجاه.","3":"الجاذبية تمدّ الساعد المرتخي فقط؛ فكيف {تمدّه|تمدّينه} وذراعك{|ِ} فوق رأسك{|ِ}، أو وأنت{|ِ} تدفع{|ين} باباً؟"},"alt":{"prompt":"لماذا تستطيع{|ين} مدّ ذراعك{|ِ} وأنت{|ِ} تدفع{|ين} باباً ثقيلاً؟","options":["لأن المفصل يمدّ الذراع بلا عضلة","لأن الجاذبية تشدّ الذراع نحو الباب","لأن العضلة أمام العضد تدفع الساعد","لأن عضلة خلف العضد تسحب الساعد فتمدّه"],"answer":3,"explanation":"المدّ ضد مقاومة يحتاج عضلة تسحب: العضلة خلف العضد تنقبض فتمدّ المرفق. لهذا يحتاج النموذج خيطاً ثانياً، ولهذا تعمل العضلات أزواجاً.","feedback_by_option":{"0":"المفصل لا يتحرك وحده؛ عضلة تسحب العظم.","1":"الجاذبية تشدّ إلى الأسفل فقط، والباب أمامك{|ِ}؛ فمن يمدّ الذراع نحوه؟","2":"العضلة لا تدفع أبداً؛ الأمامية تثني فقط."}}},{"id":"U02.L04.A2.a","objective":"U02.L04.O2","type":"fix_model","prompt":"نموذج جديد فيه أربعة أخطاء (غير الذي تدربت{|ِ} عليه): عضلة تدفع، كتف لا يدور، عظم مرسوم كأنبوب فارغ بلا شيء، رباط يصل عضلة بعظم. اكتشف{|ي} وصحّح{|ي}.","answer":"تسحب؛ الكتف كروي يدور؛ العظم فيه نخاع؛ الرباط عظم–عظم والوتر عضلة–عظم.","level":"A","rubric":"R1"},{"id":"U02.L04.A2.b","objective":"U02.L04.O2","type":"choose","prompt":"أي نموذج ذراع صحيح؟","answer":1,"explanation":"العضلة تسحب فقط، فالذراع تحتاج عضلتين متقابلتين: واحدة تثني وأخرى تمدّ.","level":"A","options":["عضلة واحدة تدفع وتسحب","عضلتان متقابلتان تسحبان","عضلة على العظم بلا مفصل","مفصل بلا عضلات"],"feedback_by_option":{"0":"العضلة لا تدفع؛ تسحب فقط، فعضلة واحدة لا تكفي.","2":"بلا مفصل لا ينثني العظم؛ الحركة تحدث حيث يلتقي عظمان.","3":"المفصل لا يتحرك وحده؛ يحتاج عضلات تسحب العظام."},"alt":{"prompt":"في نموذج، الخيط الأمامي موصول بالعضد وحده ولا يصل إلى الساعد. ماذا يحدث حين تسحب{|ين} الخيط؟","options":["ينثني الساعد كالمعتاد، لأن الخيط ما زال مشدوداً","لا ينثني الساعد، لأن السحب لا يصل إليه","يمتد الساعد","يدور المفصل في كل اتجاه"],"answer":1,"explanation":"العضلة تصل عظمين عبر المفصل: حين تقصر تقرّب أحدهما من الآخر. فإذا وُصلت بعظم واحد لم تحرّك شيئاً.","feedback_by_option":{"0":"الساعد لا يتحرك إلا إذا وصله السحب؛ والخيط هنا لا يصل إليه.","2":"لا شيء يسحب الساعد هنا، فلا ينثني ولا يمتد.","3":"المرفق رزّي، ولا شيء هنا يسحب الساعد أصلاً."}}},{"id":"U02.L04.A2.c","objective":"U02.L04.O2","type":"explain_open","prompt":"لماذا يُعد رسم المرفق يدور كالكتف خطأً، ورسم الكتف يدور صواباً؟","answer":"شكل المفصل يحدد حركته: المرفق رزّي، الكتف كروي.","level":"A","rubric":"R1"},{"id":"U02.L04.A3.a","objective":"U02.L04.O3","type":"explain_open","prompt":"حين تقفز{|ين}: أي عظام تحملك{|ِ}، وأي مفاصل تنثني، وأي عضلات تسحب؟","answer":"عظام الساق والفخذ؛ الورك والركبة والكاحل؛ عضلات الفخذ والساق (ووتر أخيل).","level":"A","rubric":"R1"},{"id":"U02.L04.A3.b","objective":"U02.L04.O3","type":"choose_reason","prompt":"طفل في جبيرة ستة أسابيع. ما الذي يحدث لعظمه وعضلته؟","answer":0,"explanation":"العظم حي فيلتئم في الجبيرة، والعضلة التي لا تُستعمل تضمر قليلاً ثم تعود بالاستعمال.","level":"A","options":["العظم يلتئم، والعضلة تضمر قليلاً ثم تعود بالاستعمال","العظم يموت لأنه لا يتحرك، والعضلة تقوى لأنها تستريح","العضلة تتحول دهناً لأنها لا تعمل ستة أسابيع","يبقيان كما كانا حتى تُفك الجبيرة"],"feedback_by_option":{"1":"العظم حي يلتئم في الجبيرة ولا يموت؛ والعضلة التي لا تعمل تضمر ولا تقوى.","2":"العضلة لا تتحول إلى دهن؛ هما نسيجان مختلفان. هي تضمر قليلاً ثم تعود.","3":"العظم والعضلة حيّان يتغيران: العظم يلتئم، والعضلة تضمر قليلاً."},"alt":{"prompt":"التوى كاحل زميل في الملعب. ماذا حدث غالباً؟ وماذا نفعل؟","options":["تمزق رباط؛ نطلب بالغاً ولا نحرّك الكاحل","انكسرت العضلة؛ ندلّك الكاحل بقوة","خرج الغضروف من مكانه؛ نعيده بأيدينا فوراً ثم نكمل اللعب","التواء بسيط؛ يكمل اللعب فوراً ليتحرك الكاحل"],"answer":0,"explanation":"الالتواء: أُجبر المفصل خارج مداه فتمزق رباط. العظام سليمة غالباً، والطبيب وحده يفرّق. نطلب بالغاً، ولا نحرّك الكاحل، ولا نحاول إعادة شيء إلى مكانه.","feedback_by_option":{"1":"العضلة لا تنكسر، والتدليك القوي يزيد الأذى. الالتواء تمزق رباط.","2":"لا نحاول إعادة شيء إلى مكانه أبداً؛ هذا للطبيب. والالتواء تمزق رباط.","3":"الألم إشارة إلى إصابة، واللعب عليها قد يزيدها. نطلب بالغاً."}}},{"id":"U02.L04.A3.c","objective":"U02.L04.O3","type":"explain_open","prompt":"لماذا نُنصح بالإحماء قبل الرياضة؟ (استعمل{|ي} ما {تعرفه|تعرفينه} عن العضلات والمفاصل)","answer":"تدفئة العضلات والأوتار وتحريك المفاصل تدريجياً يهيئها للحركة، ويُعتقد أنه يقلل الإصابات.","level":"A","rubric":"R1"},{"id":"U02.L04.A4.a","objective":"U02.L04.O4","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أشياء لا يُظهرها نموذجك{|ِ} الورقي (أو النموذج المرسوم في الدرس).","answer":"الأعصاب، الدم والطاقة، الأربطة والغضروف، النمو والالتئام.","level":"B","rubric":"R2"},{"id":"U02.L04.A4.b","objective":"U02.L04.O4","type":"explain_open","prompt":"اكتب{|ي} سؤالاً مفتوحاً واحداً عن الحركة لم تجب عنه الوحدة، وفي أي وحدة تتوقع{|ين} جوابه.","answer":"من يأمر العضلة؟ → الأعصاب (U08). من أين طاقتها؟ → القلب والدم ثم الخلية (U03/U05).","level":"B","rubric":"R2"},{"id":"U02.L04.A4.c","objective":"U02.L04.O4","type":"compare","prompt":"قارن{|ي} بين ما يُظهره نموذجك{|ِ} الورقي (أو النموذج المرسوم في الدرس) وما يُظهره جناح الدجاج (أو صورته).","answer":"الورق: المبدأ الميكانيكي فقط؛ الجناح: عضلات حقيقية وأوتار وغضروف، لكنه لا يُظهر الأعصاب العاملة ولا الدم الجاري.","level":"B","rubric":"R2"}],"transfer":[{"id":"U02.L04.T1","objective":"U02.L04.O3","type":"explain_open","prompt":"الحصان في المزرعة يرفع ساقه ويضعها. أين تتوقع{|ين} المفصل والعضلتين والوتر في ساقه؟ وما الذي يشبه ذراعك{|ِ}؟","answer":"مفصل عند «الركبة»، عضلتان متقابلتان في الفخذ، أوتار طويلة إلى الحافر؛ المبدأ نفسه.","level":"A","rubric":"R1"},{"id":"U02.L04.T2","objective":"U02.L04.O4","type":"explain_open","prompt":"الروبوت تحرّك ذراعه محركات تدور في الاتجاهين. لماذا لا يحتاج أزواجاً كالجسم؟ وما الذي يشبه فيه الجسم؟","answer":"المحرك يدور في الاتجاهين فلا يحتاج زوجاً؛ يشبه الجسم في المفصل الذي يحدد الحركة.","level":"B","rubric":"R1"}],"recall":[{"id":"U02.L04.D1","objective":"U02.L04.O1","type":"choose","prompt":"العضلة في النموذج والجسم:","answer":1,"explanation":"العضلة تسحب ولا تدفع، في النموذج وفي الجسم.","level":"A","options":["تدفع","تسحب"],"feedback_by_option":{"0":"الخيط لا يدفع، والعضلة كذلك: كلاهما يسحب فقط."}},{"id":"U02.L04.D2","objective":"U02.L04.O2","type":"choose","prompt":"الوتر يربط:","answer":0,"explanation":"الوتر يربط العضلة بالعظم.","level":"A","options":["عضلة بعظم","عظماً بعظم"],"feedback_by_option":{"1":"الذي يربط عظماً بعظم هو الرباط؛ والوتر في طرف العضلة."}},{"id":"U02.L04.D3","objective":"U02.L04.O4","type":"choose","prompt":"ما لا يُظهره النموذج الورقي:","answer":1,"explanation":"النموذج يُظهر العضلتين والمفصل، لكنه لا يُظهر من يأمر العضلة بالانقباض؛ هذا سؤال نبحثه لاحقاً.","level":"B","options":["المفصل","من يأمر العضلة","العضلتان المتقابلتان"],"feedback_by_option":{"0":"المفصل في نموذجك{|ِ}: الدبوس الذي يدور عليه الساعد.","2":"العضلتان في نموذجك{|ِ}: الخيطان الأمامي والخلفي."}},{"id":"U02.L04.D4","objective":"U02.L04.O3","level":"A","type":"choose","prompt":"تحمل{|ين} حقيبة ثقيلة وذراعك{|ِ} مثنية عند المرفق. ما الذي يعمل؟","options":["الرباط يسحب الساعد إلى الأعلى","العضلة خلف العضد تدفع الساعد إلى الأعلى","العظام تحمل الحقيبة، والعضلات مرتخية","العضلة أمام العضد تسحب الساعد عبر الوتر"],"answer":3,"explanation":"ثلاثة مفاهيم معاً: العضلة أمام العضد تنقبض وتسحب، والوتر ينقل سحبها إلى عظم الساعد، والمرفق مفصل رزّي يبقى مثنياً ما دامت تسحب.","feedback_by_option":{"0":"الرباط يربط عظماً بعظم ولا يسحب؛ السحب عمل العضلة.","1":"العضلة لا تدفع؛ والتي تثني المرفق وتبقيه مثنياً أمام العضد.","2":"العظام تحمل، لكن لولا العضلة التي تسحب لامتدّ الساعد وسقطت الحقيبة."}}]};
