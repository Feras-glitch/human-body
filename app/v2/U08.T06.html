const LD = {"id":"U08.T06","lesson":"U08.L06","first":false,"title":"اختبار: مشاعري وجسمي","lessonTitle":"مشاعري وجسمي","concepts":[],"check":[],"items":[{"id":"U08.L06.A1.a","objective":"U08.L06.O1","level":"A","type":"choose_reason","prompt":"ألم البطن قبل حدث كبير:","options":["تمثيل من الطفل كي لا يذهب","قد يكون من القلق","من الطعام الفاسد في كل مرة","لا يحدث للأطفال"],"answer":1,"explanation":"مراسيل المزاج تضبط الهضم والألم أيضاً، فيُحس القلق في البطن.","feedback_by_option":{"0":"الألم حقيقي.","2":"قد يحدث بلا طعام فاسد.","3":"يحدث كثيراً للأطفال."},"detects":"M136","alt":{"prompt":"أين أكثر السيروتونين، أحد مراسيل المزاج؟","options":["في الشعر","في الأمعاء","في العظام","في الأظافر"],"answer":1,"explanation":"أكثره في الأمعاء.","feedback_by_option":{"0":"الشعر لا يصنعه.","2":"العظام ليست مكانه.","3":"الأظافر ليست مكانه."}}},{"id":"U08.L06.A1.b","objective":"U08.L06.O1","level":"A","type":"true_false_why","prompt":"«الغضب والحزن مشاعر سيئة، ومن يبكي ضعيف». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ المشاعر كلها طبيعية والبكاء ليس ضعفاً؛ المهم أن نعبّر بلا إيذاء ونطلب العون إن ثقل الشعور.","rubric":"R1","detects":"M135","alt":{"prompt":"«يغضب كل الناس أحياناً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الغضب شعور طبيعي، والمهم ألا نؤذي به أحداً."}},{"id":"U08.L06.A1.c","objective":"U08.L06.O1","level":"A","type":"explain_open","prompt":"{فسّر|فسّري} لصديق لماذا يسرع قلبه حين يغضب.","answer":"الدماغ يحس الغضب فيرسل رسائل إلى الجسم كما في استجابة الخطر، فيسرع القلب ويشتد التنفس.","rubric":"R1"},{"id":"U08.L06.A2.a","objective":"U08.L06.O2","level":"A","type":"choose","prompt":"أي هذه من طرق التهدئة؟","options":["ضرب الوسادة بقوة على أخي","التنفس البطيء والعدّ","الصراخ في وجه من أغضبني","تكسير الأقلام"],"answer":1,"explanation":"التنفس البطيء والعدّ يعيدان الجسم إلى الهدوء.","feedback_by_option":{"0":"هذا إيذاء لأخيك.","2":"الصراخ يؤذي.","3":"تكسير الأشياء غير مقبول."},"alt":{"prompt":"بعد أن {تهدأ|تهدئي}، أحسن خطوة:","options":["الكلام مع من أثق به","الانتقام ممن أغضبني","السكوت أسبوعاً كاملاً","الهروب من البيت ليلاً"],"answer":0,"explanation":"الكلام يحل المشكلة ويخفف الشعور.","feedback_by_option":{"1":"الانتقام يزيد المشكلة.","2":"الكتمان الطويل يُثقل.","3":"هذا خطر؛ الكلام أحسن."}}},{"id":"U08.L06.A2.b","objective":"U08.L06.O2","level":"A","type":"true_false_why","prompt":"«التعبير عن الغضب مقبول، أما إيذاء الناس أو الأشياء فلا». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نقول ما نشعر به بالكلام أو الرسم أو الحركة، بلا صراخ ولا ضرب ولا تكسير.","rubric":"R1","alt":{"prompt":"«إن طال الحزن أياماً ومنعني من النوم أطلب العون». صح أم خطأ؟ ولماذا؟","answer":"صح؛ أخبر كبيراً أثق به، وقد يأخذني إلى الطبيب أو المختص."}},{"id":"U08.L06.A2.c","objective":"U08.L06.O2","level":"A","type":"explain_open","prompt":"{اختر|اختاري} طريقة تهدئة لموقف القلق قبل الامتحان، و{اشرح|اشرحي} لماذا تنفع.","answer":"التنفس البطيء: شهيق إلى أربعة وزفير إلى ستة، لأنه يهدّئ القلب والجسم؛ أو الكلام مع أمي لأنها تطمئنني.","rubric":"R1"},{"id":"U08.L06.A3.a","objective":"U08.L06.O3","level":"A","type":"choose","prompt":"التنمر:","options":["خلاف مرة واحدة ثم صلح سريع","أذى مقصود يتكرر","مزاح يضحك فيه الجميع معاً","نصيحة من صديق يحبك ويخاف عليك"],"answer":1,"explanation":"أذى مقصود يتكرر، فيه قوة غير متكافئة.","feedback_by_option":{"0":"الخلاف مرة ليس تنمراً.","2":"المزاح يضحك فيه الجميع.","3":"النصيحة ليست أذى."},"alt":{"prompt":"من أنواع التنمر:","options":["الإقصاء ونشر الشائعات","دعوة زميل جديد إلى اللعب معنا","مساعدة صديق في الواجب الصعب","شكر المعلم بعد الدرس"],"answer":0,"explanation":"الإقصاء والشائعات تنمر اجتماعي.","feedback_by_option":{"1":"هذه دعوة لطيفة.","2":"هذه مساعدة.","3":"هذا أدب."}}},{"id":"U08.L06.A3.b","objective":"U08.L06.O3","level":"A","type":"true_false_why","prompt":"«التنمر مزاح، ومن يخبر الكبار واشٍ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ التنمر أذى يتكرر، ومن يخبر كبيراً ليوقفه يحمي صاحبه.","rubric":"R1","detects":"M137","alt":{"prompt":"«إن رأيت تنمراً فأحسن ما أفعله أن آتي بكبير يوقفه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكبير يوقفه في الحال، ولا أضحك ول _by_option":{"1":"كان طبيباً عالماً.","2":"الهاتف حديث.","3":"كان طبيباً كاتباً."},"alt":{"prompt":"عالج البلخي الخوف والحزن بـ:","options":["تغيير التفكير والوقاية","الضرب والتخويف","الكي بالنار في الرأس","السهر الطويل كل ليلة"],"answer":0,"explanation":"بالفكر والوقاية.","feedback_by_option":{"1":"لا.","2":"لم يذكر ذلك علاجاً للنفس.","3":"السهر يُتعب."}}},{"id":"U08.L06.A5.b","objective":"U08.L06.O5","level":"B","type":"true_false_why","prompt":"«حسم العلماء أن سكان الأمعاء يغيّرون مزاج الإنسان». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ وجدوا صلات في الحيوانات، لكن ما يحدث في الإنسان لم يُحسم بعد.","rubric":"R1","alt":{"prompt":"«الدماغ والأمعاء يتبادلان الرسائل». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مراسيل المزاج تعمل في الاثنين، ولذلك يُحس القلق في البطن."}},{"id":"U08.L06.A5.c","objective":"U08.L06.O5","level":"B","type":"explain_open","prompt":"قارن فكرة البلخي بطرق التهدئة التي تعلمتها اليوم.","answer":"كلاهما يرى أن للنفس صحة نعتني بها، والبلخي عالج بتغيير التفكير والوقاية، ونحن نتوقف ونتنفس ونفكر بهدوء ونطلب العون.","rubric":"R1"}],"transfer":[{"id":"U08.L06.T1","objective":"U08.L06.O2","type":"explain_open","prompt":"في الملعب أخذ ولد الكرة منك{|ِ} بقوة، {فشعرت|فشعرتِ} بالغضب. {صف|صفي} ما يحدث في جسمك{|ِ}، وماذا {تفعل|تفعلين} خطوة خطوة.","answer":"القلب يسرع والوجه يسخن؛ أتوقف وأبتعد قليلاً، وأتنفس ببطء وأعدّ، ثم أكلمه بهدوء أو أخبر المعلم.","level":"A","rubric":"R1"},{"id":"U08.L06.T2","objective":"U08.L06.O3","type":"explain_open","prompt":"{صمّم|صمّمي} ملصقاً لصفك{|ِ} عن التنمر: ما هو؟ وماذا يفعل الشاهد؟","answer":"التنمر أذى مقصود يتكرر من الأقوى؛ لا تضحك ولا تشارك، بل ائت بكبير يوقفه، وكن صديقاً لمن تأذى.","level":"A","rubric":"R1"}],"recall":[{"id":"U08.L06.D1","objective":"U08.L06.O1","type":"choose","prompt":"المشاعر كلها:","options":["طبيعية","سيئة كلها","تمثيل من الناس"],"answer":0,"explanation":"طبيعية، والمهم ما نفعله بها.","level":"A","feedback_by_option":{"1":"الغضب والحزن طبيعيان أيضاً.","2":"المشاعر حقيقية."}},{"id":"U08.L06.D2","objective":"U08.L06.O2","type":"choose","prompt":"من طرق التهدئة:","options":["التنفس البطيء","الصراخ على الناس","التكسير والضرب"],"answer":0,"explanation":"التنفس البطيء والعدّ.","level":"A","feedback_by_option":{"1":"الصراخ يؤذي.","2":"التكسير غير مقبول."}},{"id":"U08.L06.D3","objective":"U08.L06.O3","type":"choose","prompt":"إن رأيت تنمراً:","options":["آتي بكبير يوقفه","أضحك معهم كي لا يسخروا مني","أصوّره وأنشره"],"answer":0,"explanation":"آتي بكبير يوقفه.","level":"A","feedback_by_option":{"1":"الضحك يشارك في الأذى.","2":"النشر يزيد الأذى."}},{"id":"U08.L06.D4","objective":"U08.L06.O4","type":"choose","prompt":"صور الشاشات كثير منها:","options":["معدّل","حقيقي بلا تعديل","قديم"],"answer":0,"explanation":"معدّل بالمرشحات.","level":"A","feedback_by_option":{"1":"كثير منها معدّل.","2":"القِدم ليس المسألة."}},{"id":"U08.L06.D5","objective":"U08.L06.O5","type":"choose","prompt":"كتب البلخي عن:","options":["صحة النفس","الفلك والنجوم","الزراعة والري"],"answer":0,"explanation":"صحة النفس والبدن.","level":"B","feedback_by_option":{"1":"كتابه في الأبدان والأنفس.","2":"كتابه في الأبدان والأنفس."}}]};
