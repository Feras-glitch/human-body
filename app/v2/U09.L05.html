const LD = {"id":"U09.L05","first":false,"title":"الدواء: نافع ومحفوظ","driving_question":"{اسم}، لماذا لا {تأخذ|تأخذين} دواء أخيك{|ِ} وإن كان مرضك{|ِ} يشبه مرضه؟ وأين يُحفظ الدواء في البيت؟","central_fact":"الدواء نافع حين يؤخذ كما قال الطبيب أو الصيدلي من يد كبير، وقد يضر إذا زاد أو أخذه غير صاحبه؛ ولذلك لا نأخذ دواء غيرنا، ونحفظ الأدوية عالياً بعيداً عن الصغار؛ والكافيين منبّه لا يحتاجه الأطفال، والماء أول المشروبات.","next":null,"nexts":[],"hook":{"text":"{اسم}، أخوك{|ِ} عنده دواء للسعال، و{أنت|أنتِ} {تسعل|تسعلين} مثله. هل {تأخذ|تأخذين} منه؟","options":["نعم، المرض واحد","لا، أسأل الكبير أولاً","آخذ نصف المقدار","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"الدواء مادة تساعد الجسم على الشفاء أو تخفف الألم. وهو نافع حين نأخذه بالمقدار الذي يحدده الطبيب أو الصيدلي، ومن يد كبير نثق به: أمك{|ِ} أو أبيك{|ِ} أو الممرضة في المدرسة. والمقدار يختلف بالعمر والوزن والمرض، ولذلك لا {تختاره|تختارينه} بنفسك{|ِ}. وإذا زاد الدواء عن مقداره فقد يضر بدل أن ينفع. ولا {تأخذ|تأخذي} دواء من صديق، ولا من علبة {وجدتها|وجدتِها}."},{"id":"E2","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"الوصفة الطبية ورقة يكتبها الطبيب لشخص بعينه: أي دواء، وكم، ومتى، وإلى متى. اختارها لعمر صاحبها ووزنه ومرضه. فلا {تأخذ|تأخذي} دواء أخيك{|ِ} وإن كان مرضك{|ِ} يشبه مرضه، ولا {تعط|تعطي} دواءك{|ِ} أحداً. و{تذكّر|تذكّري} من درس الدفاع: المضاد الحيوي يقتل البكتيريا، ولا يعمل على الفيروسات كالزكام والإنفلونزا. ولذلك لا نأخذه للزكام، ولا نحفظ الباقي منه لمرة قادمة، ونأخذه كما وصفه الطبيب."},{"id":"E3","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"الأطفال الصغار يستكشفون بأيديهم وأفواههم، وبعض الأدوية حلوة الطعم ملونة. ولذلك تُحفظ الأدوية والمنظفات عالياً، بعيداً عن أيدي الصغار وأعينهم، ويُغلق غطاء الأمان بعد كل مرة. ولا نقول لطفل إن الدواء حلوى، حتى لو رفض أن يشربه. وعلى كل علبة تاريخ الانتهاء: التاريخ الذي لا يُستعمل الدواء بعده، ويقرؤه الكبير. وإن {رأيت|رأيتِ} صغيراً أمسك دواء أو ابتلع منه، {أخبر|أخبري} كبيراً فوراً، ولو لم {تكن|تكوني} {متأكداً|متأكدةً}."},{"id":"E4","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"brain"},"text":"الكافيين مادة منبّهة في القهوة والشاي والكولا، وكثيرة جداً في مشروبات الطاقة. وتقول الأكاديمية الأمريكية لطب الأطفال إن الكافيين والمنبّهات في مشروبات الطاقة لا مكان لها في غذاء الأطفال، وربطت الكافيين بآثار ضارة في الجهاز العصبي والقلب وهما ينموان. ومشروب الطاقة لا يعطي طاقة كالطعام؛ الطاقة من الطعام والنوم. وأول المشروبات الماء، كما {عرفت|عرفتِ} في درس الطبق المتوازن."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"وكيف نعرف أن الدواء نافع حقاً؟ باختبار الدواء: تجربة عادلة. قبل نحو ألف سنة كتب ابن سينا، من بخارى، في كتابه «القانون في الطب» شروطاً لذلك: أن نجرب الدواء على مرض واحد لا على أمراض مجتمعة، وأن ننظر متى يظهر أثره، وأن يتكرر أثره في أكثر الحالات لا في مرة واحدة، وأن تكون التجربة على الإنسان لأن الحيوان قد يختلف عنه."},{"id":"E6","level":"B","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"للمستوى ب: شروط ابن سينا خطوة كبيرة في الأمانة العلمية، لكنه بناها على نظرية الأخلاط، التي تقسم الأمراض إلى حارة وباردة، وقد تركها العلم. واليوم يُجرَّب الدواء على مجموعتين: واحدة تأخذه، وأخرى لا تأخذه، ولا يعرف المريض في أيهما هو، ثم يقارن العلماء. ولماذا لا تكفي تجربة مرة واحدة على شخص واحد؟ لأنه ربما شُفي وحده، أو لسبب آخر."}],"practice":[{"id":"U09.L05.P1","after":"E1","objective":"U09.L05.O1","type":"choose","prompt":"من يعطيك{|ِ} الدواء؟","options":["كبير تثق به بحسب الطبيب","صديق في الصف","أنا أختار من العلبة","جار لا أعرفه"],"answer":0,"explanation":"الكبير يعطيه بالمقدار الذي حدده الطبيب أو الصيدلي.","level":"A","feedback_wrong":"من يعرف المقدار المناسب لك{|ِ}؟","feedback_by_option":{"1":"الصديق لا يعرف مقدارك.","2":"المقدار يحدده الطبيب أو الصيدلي.","3":"لا نأخذ من غريب."}},{"id":"U09.L05.P2","after":"E2","objective":"U09.L05.O2","type":"choose","prompt":"لماذا لا {تأخذ|تأخذين} دواء أخيك{|ِ}؟","options":["لأن طعمه مرّ","لأن علبته صغيرة","لأن لونه غريب","لأن الطبيب اختاره لعمره ووزنه ومرضه"],"answer":3,"explanation":"الوصفة لشخص بعينه.","level":"A","feedback_wrong":"لمن كُتبت الوصفة؟","feedback_by_option":{"0":"الطعم ليس السبب.","1":"الحجم ليس السبب.","2":"اللون ليس السبب."},"detects":"M143"},{"id":"U09.L05.P3","after":"E3","objective":"U09.L05.O3","type":"choose","prompt":"أين يُحفظ الدواء في البيت؟","options":["على طاولة المطبخ","بجانب سرير الطفل","عالياً بعيداً عن أيدي الصغار وأعينهم","في حقيبة مفتوحة على الأرض"],"answer":2,"explanation":"عالياً، بعيداً عن الأيدي والأعين، والغطاء مغلق.","level":"A","feedback_wrong":"أين لا يصل الصغير ولا يرى؟","feedback_by_option":{"0":"يصل إليه الصغير.","1":"قريب من يد الصغير.","3":"الحقيبة على الأرض في متناوله."}},{"id":"U09.L05.P4","after":"E4","objective":"U09.L05.O4","type":"choose","prompt":"بعد مباراة في يوم حار، ماذا {تشرب|تشربين}؟","options":["مشروب طاقة","ماء","قهوة","كولا"],"answer":1,"explanation":"الماء أول المشروبات.","level":"A","feedback_wrong":"أي مشروب يحتاجه جسمك{|ِ} بعد العرق؟","feedback_by_option":{"0":"فيه منبّه كثير، وليس للأطفال.","2":"فيها كافيين.","3":"فيها كافيين وسكر."},"detects":"M146"},{"id":"U09.L05.P5","after":"E5","objective":"U09.L05.O5","type":"sequence","prompt":"{رتّب|رتّبي} خطوات اختبار دواء جديد اختباراً عادلاً.","options":["نختار مرضاً واحداً","نجرب الدواء على مرضى كثيرين","ننظر متى يظهر أثره","نسأل: هل تكرر الأثر في أكثر الحالات؟"],"answer":[0,1,2,3],"explanation":"مرض واحد، ثم حالات كثيرة، ثم وقت الأثر، ثم الحكم بتكرار الأثر.","level":"A","feedback_wrong":"ماذا نحتاج قبل أن نحكم؟"}],"check":[{"id":"U09.L05.C1","objective":"U09.L05.O1","type":"explain_open","prompt":"لماذا لا يختار الطفل مقدار دوائه بنفسه؟","answer":"لأن المقدار يختلف بالعمر والوزن والمرض، ويحدده الطبيب أو الصيدلي؛ والزيادة قد تضر.","level":"A","rubric":"R1"},{"id":"U09.L05.C2","objective":"U09.L05.O2","type":"true_false_why","prompt":"«المضاد الحيوي يشفي الزكام». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الزكام من فيروس، والمضاد الحيوي يعمل على البكتيريا لا على الفيروسات.","level":"A","rubric":"R1"},{"id":"U09.L05.C3","objective":"U09.L05.O3","type":"explain_open","prompt":"{وجدت|وجدتِ} أخاك{|ِ} الصغير يمسك علبة دواء مفتوحة. ماذا {تفعل|تفعلين}؟","answer":"آخذ العلبة بهدوء إن استطعت، وأخبر كبيراً فوراً ولو لم أكن متأكداً أنه ابتلع شيئاً.","level":"A","rubric":"R1"},{"id":"U09.L05.C4","objective":"U09.L05.O4","type":"true_false_why","prompt":"«الماء أول المشروبات للأطفال». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تقول الأكاديمية الأمريكية لطب الأطفال إن الماء هو المشروب الأول للأطفال.","level":"A","rubric":"R1"},{"id":"U09.L05.C5","objective":"U09.L05.O4","type":"explain_open","prompt":"قال سامي: «سأشرب مشروب طاقة قبل الامتحان لأركّز». بماذا {تنصحه|تنصحينه}؟","answer":"مشروبات الطاقة ليست للأطفال، وفيها منبّه كثير؛ التركيز يأتي من النوم الكافي والفطور والماء.","level":"A","rubric":"R1"},{"id":"U09.L05.C6","objective":"U09.L05.O5","type":"fix_model","prompt":"قالت ليلى: «جربت جارتنا الدواء مرة فشُفيت، إذن هو نافع لكل الناس». {صحّح|صحّحي} لها.","answer":"مرة واحدة لا تكفي: ربما شُفيت وحدها أو لسبب آخر؛ نحتاج حالات كثيرة يتكرر فيها الأثر، ومقارنة بمن لم يأخذه.","level":"B","rubric":"R1"}],"concepts":[{"id":"medicine","term":{"ar":"الدواء","en":"Medicine","zh":"药物","pinyin":"yàowù","match":["الدواء","دواء","الأدوية","أدوية"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"مادة تساعد الجسم على الشفاء أو تخفف الألم، إذا أُخذت بالمقدار الذي يحدده الطبيب أو الصيدلي.","B":"المقدار يختلف بالعمر والوزن والمرض، ولذلك لا يختاره الطفل."}},{"id":"prescription","term":{"ar":"الوصفة الطبية","en":"Prescription","zh":"处方","pinyin":"chǔfāng","match":["الوصفة الطبية","الوصفة","وصفة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"ورقة يكتبها الطبيب لشخص بعينه: أي دواء، وكم، ومتى، وإلى متى.","B":"لا تنتقل إلى غير صاحبها، وإن تشابه المرض."}},{"id":"expiry","term":{"ar":"تاريخ الانتهاء","en":"Expiry date","zh":"有效期","pinyin":"yǒuxiàoqī","match":["تاريخ الانتهاء"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"التاريخ المكتوب على العلبة الذي لا يُستعمل الدواء بعده؛ يقرؤه الكبير.","B":"الدواء القديم يُسلَّم للصيدلية أو يُتخلص منه كما ينصح الصيدلي."}},{"id":"caffeine","term":{"ar":"الكافيين","en":"Caffeine","zh":"咖啡因","pinyin":"kāfēiyīn","match":["الكافيين","كافيين"]},"priority":"core","atlas":{"layer":"nervous","element":"brain"},"card":{"A":"مادة منبّهة في القهوة والشاي والكولا، وكثيرة جداً في مشروبات الطاقة.","B":"تقول الأكاديمية الأمريكية لطب الأطفال إن الكافيين في مشروبات الطاقة لا مكان له في غذاء الأطفال."}},{"id":"fair_drug_test","term":{"ar":"اختبار الدواء","en":"Testing a medicine","zh":"药物试验","pinyin":"yàowù shìyàn","match":["اختبار الدواء"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"تجربة عادلة نعرف بها هل الدواء نافع: على مرض واحد، وفي حالات كثيرة، وعلى الإنسان.","B":"وضع ابن سينا شروطاً لها في «القانون»، وتطورت اليوم إلى تجارب فيها مجموعتان للمقارنة."}}],"experiment":{"title":"خريطة البيت الآمن","materials":["ورقة كبيرة","أقلام ملونة","ملصقات صغيرة خضراء وحمراء","بطاقات مصورة لأماكن في البيت","دفتر الأطلس"],"steps":["{ارسم|ارسمي} مخطط بيتك{|ِ} من فوق: المطبخ، والحمام، وغرفة النوم، والصالة.","مع أهلك{|ِ}: أين توضع الأدوية والمنظفات اليوم؟ {ضع|ضعي} عند كل مكان ملصقاً.","{اسأل|اسألي}: هل يصل إليه أخ صغير إذا وقف على كرسي؟ هل يراه؟ أخضر إن كان عالياً بعيداً عن العين، وأحمر إن كان قريباً.","{اقترح|اقترحي} مع أهلك{|ِ} مكاناً آمناً واحداً لكل الأدوية، عالياً ومغلقاً.","{اكتب|اكتبي} مع الكبير رقم الطوارئ في بلدكم بجانب الهاتف."],"safety":["لا يلمس الطفل علب الأدوية ولا المنظفات في هذه التجربة؛ الكبير هو الذي يحركها.","لا نفتح علبة دواء ولا نتذوقه.","لا اسم دواء على الخريطة؛ نكتب «أدوية» و«منظفات» فقط."],"expected":"كثير من البيوت فيها دواء على طاولة أو بجانب سرير أو في حقيبة، والمنظفات تحت المغسلة في متناول الصغار.","explain":"الصغار يستكشفون بأفواههم وأيديهم، وبعض الأدوية حلوة الطعم ملونة؛ والحفظ العالي المغلق يمنع الحوادث.","record":"أماكن خضراء ___ — أماكن حمراء ___ — مكاننا الآمن الجديد: ___ — رقم الطوارئ عندنا: ___","alternatives":["من لا يستطيع العمل مع أهله: يحلل مخطط بيت متخيَّل في المشهد.","المستوى ب: يصمم ملصقاً للأسرة بقواعد حفظ الدواء."]},"find_the_error":[{"id":"FE1","atlas_variant":"share_medicine","error":"ولد يعطي أخته من علبة دوائه","answer":"الوصفة لصاحبها؛ لا نعطي دواءنا أحداً","detects":"M143"},{"id":"FE2","atlas_variant":"medicine_counter","error":"علبة دواء مفتوحة على طاولة منخفضة وطفل صغير قريب","answer":"تُحفظ عالياً مغلقة بعيداً عن الصغار","detects":"M145"},{"id":"FE3","atlas_variant":"energy_drink","error":"لوحة: مشروب الطاقة يقوّي الأطفال","answer":"لا مكان له في غذاء الأطفال؛ الماء أولاً","detects":"M146"}],"numbers":[{"text":"نحو مئة طفل صغير كل يوم في الولايات المتحدة يُؤخذون إلى الطوارئ بعد أن وصلوا إلى أدوية.","source":["S4"]}],"true_size":[{"text":"نحو مئة طفل صغير كل يوم، في بلد واحد، يُؤخذون إلى الطوارئ بعد أن وصلوا إلى أدوية؛ والحفظ العالي المغلق يمنع أكثر ذلك.","source":["S4"]}],"animal":null,"organ_letter":{"from":"الكبد","text":"مرحباً، أنا كبدك{|ِ}. من أعمالي أنني أتعامل مع كثير مما يدخل جسمك{|ِ}، ومنه الدواء. حين يعطيك{|ِ} الكبير الدواء بالمقدار الذي قاله الطبيب، أقوم بعملي بهدوء. لكن إن زاد الدواء عن مقداره، أو أخذت{|ِ} دواء غيرك{|ِ}، صار عملي ثقيلاً. فلا {تأخذ|تأخذي} دواء إلا من يد كبير، و{ساعد|ساعدي} أهلك{|ِ} في حفظ الأدوية عالياً بعيداً عن الصغار. و{اشرب|اشربي} الماء بدل مشروبات الطاقة؛ نحن، أعضاءك{|ِ}، لا نحتاج منبّهاً لنعمل."},"history":[{"who":"ابن سينا (أبو علي الحسين)","origin":"بخارى (أوزبكستان اليوم)","where_when":"فارس، نحو 1012م (القرن الخامس الهجري)","did":"كتب في الكتاب الثاني من «القانون في الطب» شروطاً لاختبار الدواء المفرد: مرض واحد، وتكرر الأثر في أكثر الحالات، والنظر في وقت الأثر، والتجربة على الإنسان.","did_not":"لم يعرف المقارنة بمجموعة لا تأخذ الدواء، وبنى شروطه على نظرية الأخلاط التي تركها العلم.","method_lesson":"لا نحكم على الدواء من مرة واحدة؛ نجرب بعدل ونكرر وننظر.","source":["S7"]}],"how_we_know":{"text":"كيف نعرف أن الدواء نافع حقاً؟ قبل نحو ألف سنة كتب ابن سينا في «القانون في الطب» شروطاً لاختبار الدواء: أن نجربه على مرض واحد، وأن ننظر متى يظهر أثره، وأن يتكرر أثره في أكثر الحالات لا في مرة واحدة، وأن تكون التجربة على الإنسان لأن الحيوان قد يختلف. واليوم يجرب العلماء الدواء على مجموعتين ويقارنون، قبل أن يصل إلى الصيدلية.","limit_question":"لماذا تحتاج التجارب اليوم إلى مجموعة لا تأخذ الدواء؟"},"what_changed":["كان بعض الناس يظنون أن الدواء الأكثر يشفي أسرع؛ واليوم نعرف أن لكل دواء مقداراً يحدده الطبيب، وأن الزيادة قد تضر.","كانت الأدوية تُحفظ في أي مكان؛ واليوم صُنعت أغطية أمان، وتنصح الحملات بحفظها عالياً بعيداً عن الصغار."],"model_limits":["شروط ابن سينا خطوة مهمة، لكنها بُنيت على نظرية الأخلاط التي تركها العلم؛ والتجارب اليوم فيها مجموعات للمقارنة.","العدد من الطوارئ من الولايات المتحدة؛ يختلف من بلد إلى بلد، لكن الحفظ الآمن ينفع في كل بيت."],"faith":{"opening":null,"closing":{"text":"لا ضرر ولا ضرار","reference":"ابن ماجه 2341","grade":"حسن","usage":"قيمة","reflection":"عرفنا اليوم أن الدواء نافع إذا أُخذ كما ينبغي، وقد يضر إذا زاد أو أخذه غير صاحبه. والحديث في البطاقة قاعدة عظيمة: لا نؤذي أنفسنا ولا نؤذي غيرنا. والحديث لا يتكلم عن الأدوية بعينها، والعلم لا يشرحه؛ لكنه يعلّمنا أن نحفظ الدواء عن الصغار، ولا نعطي دواءنا أحداً، ولا نأخذ ما يضرنا. ما الذي {ستفعله|ستفعلينه} في بيتكم هذا الأسبوع؟","reviewed":false,"hadith_key":"ibnmajah:2341","highlight":"لا ضرر ولا ضرار","level":"ترغيب","concept":"لا نؤذي أنفسنا ولا غيرنا.","avoid":"لا نجعل الحديث حكماً على دواء بعينه، ولا نخوّف الطفل من الدواء الذي وصفه الطبيب.","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","narration":false,"source":"ابن ماجه 2341","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني","cards":[]}},"life":[{"situation":"أنا مريض، وأريد أن أشفى بسرعة، وأفكر أن آخذ من دواء في الخزانة.","science":"الدواء نافع بالمقدار الذي يحدده الطبيب، ومن يد كبير؛ والزيادة أو الدواء الخطأ قد يضر.","action":"أخبر أمي أو أبي بما أشعر به، وأنتظر أن يسألا الطبيب أو الصيدلي، وأرتاح وأشرب الماء.","value":"الأخذ بأسباب الشفاء كما ينبغي.","why":"لماذا أنتظر الكبير وأنا متعب؟ لأن الله جعل لكل داء شفاء، كما في الحديث في البطاقة، والشفاء نطلبه من بابه: الطبيب والمقدار الصحيح.","hadith":["bukhari:5678"],"cards":[{"key":"bukhari:5678","lead":"عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","text":"ما أنزل الله داءً إلا أنزل له شفاءً","narration":false,"source":"البخاري 5678","grade":"صحيح","grader":""}],"verses":[]},{"situation":"زملائي في النادي يشربون مشروبات الطاقة، ويقولون إنها تجعلهم أقوى.","science":"مشروبات الطاقة فيها منبّه كثير لا مكان له في غذاء الأطفال، والماء أول المشروبات.","action":"أشرب الماء وأحمل قارورتي، وأقول لهم بلطف ما تعلمته.","value":"الحرص على ما ينفع.","why":"لماذا لا أشرب مثلهم؟ لأني أحرص على ما ينفعني وأستعين بالله ولا أعجز، كما في الحديث في البطاقة، والماء ينفعني.","hadith":["muslim:2664"],"cards":[{"key":"muslim:2664","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير، احرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن «لو» تفتح عمل الشيطان","narration":false,"source":"مسلم 2664","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يختلف أثر الدواء نفسه بين شخصين؟","why_open":"يدرس العلماء أثر الجينات والعمر والغذاء في الدواء، وما زال كثير منه مجهولاً."}],"notebook":{"draw":"{ارسم|ارسمي} خزانة أدوية عالية مغلقة، وبجانبها ثلاث قواعد للدواء. المستوى ب: {اكتب|اكتبي} شروط ابن سينا الأربعة بلغتك{|ِ}.","label":["الدواء","الوصفة الطبية","تاريخ الانتهاء","الكافيين","— ب: اختبار الدواء"],"write":"أشرح: من يعطيني الدواء؟ ولماذا لا آخذ دواء غيري؟ وأين يُحفظ؟ وماذا أشرب بدل مشروب الطاقة؟"},"imgs":[]};
