تنقبض؟ ومن أين تأخذ طاقتها؟","limit_question":"اكتب{|ي} سؤالاً واحداً لم تجب عنه هذه الوحدة، وأين تتوقع{|ين} جوابه."},"what_changed":["راجع{|ي} الدروس: العظم الجاف الذي ليس جافاً، والعضلة التي لا تدفع، والطقطقة التي لا تؤذي."],"model_limits":["النموذج الورقي يُظهر المبدأ الميكانيكي (سحب عند مفصل) ويخفي: الأعصاب، الدم، الطاقة، الأربطة والغضروف، النمو والالتئام.","نموذجي الورقي يمتدّ أكثر من اللازم (يتجاوز الاستقامة)؛ مرفقك يتوقف عند الاستقامة لأن عظماً يوقفه.","في صورة التجميع (exp) الدبوس يحصر الحركة في مستوى واحد لكنه لا يمنع وحده فرط المدّ؛ ويلزم جزء حر من الخيط يسحبه الطفل حتى يعمل النموذج."],"faith":{"opening":null,"closing":{"text":"ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ","reference":"الملك 2","grade":"قرآن","usage":"غاية","reflection":"بنيت{|ِ} ذراعاً من ورق وعرفت{|ِ} كم في ذراعك{|ِ} من إحكام. والله خلق الحياة اختباراً، والاختبار ليس في القوة ولا في السرعة، بل في إحسان العمل: من استعمل ما أُعطي — جسمه وعقله ووقته — في الخير وأتقنه. ليست الآية عن الحركة فقط؛ هي عن كل ما تفعل{|ين}. وما {تعلّمته|تعلّمتِه} ليس لك{|ِ} وحدك{|ِ}: النبي ﷺ أخبر أن العلم الذي يُنتفع به من الأعمال التي يبقى أجرها لصاحبها بعد موته.","reviewed":false,"level":"خبر","concept":"الله خلق الحياة اختباراً. والاختبار ليس في القوة ولا في السرعة، بل في إحسان العمل: من استعمل ما أُعطي — جسمه وعقله ووقته — في الخير وأتقنه. الطفل الذي يتحرك ويتعلم ويساعد ويرفق بغيره يُحسن عمله بما عنده، كبيراً كان ما عنده أو صغيراً.","avoid":"ليست الآية عن الحركة والرياضة فقط، ولا تعني أن القوي أفضل؛ الأحسن عملاً قد يكون أضعف الناس جسماً.","quran_key":"67:2","highlight":"الذي خلق الموت والحياة ليبلوكم أيكم أحسن عملا","hl_words":[0,7],"hadith":["muslim:1631"],"cards":[{"key":"muslim:1631","lead":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم يُنتفع به، أو ولد صالح يدعو له","narration":false,"source":"مسلم 1631","grade":"صحيح","grader":""}]}},"life":[{"situation":"أحمل حقيبتي الثقيلة على كتف واحد كل يوم.","science":"العضلات تعمل أزواجاً متوازنة؛ الحمل الدائم على جهة يُجهد جهة ويضعف المقابلة ويُتعب الفقرات.","action":"أحمل الحقيبة على الكتفين وأخفف ما فيها.","value":"الجسد أمانة تُحفظ بالعادات الصغيرة.","why":"لماذا تهتم بحقيبة؟ لأن العادة الصغيرة المكررة كل يوم أقوى من الحدث الكبير مرة واحدة. الكتف الذي يحمل وحده يُجهد عضلاته ويُتعب العنق والظهر ويؤلمهما؛ الحمل على الكتفين يوزّع الحمل. الجسد أمانة أحفظها بعادات صغيرة لا بقرارات كبيرة.","cards":[],"verses":[]},{"situation":"أرى زميلاً سقط والتوى كاحله.","science":"الرباط تمزق؛ تحريك المفصل أو محاولة «إعادته» تزيد الضرر.","action":"لا أحركه ولا أُجبر الكاحل، أطلب بالغاً، وأبقى معه حتى يأتي.","value":"مساعدة المصاب وعدم إيذائه بجهل.","reference":"المائدة 32","why":"لماذا لا أساعده بتحريك الكاحل؟ لأن المساعدة بلا علم قد تؤذي أكثر من الإصابة نفسها: الرباط الممزق يحتاج إلى الثبات، والتحريك يزيد التمزق. المساعدة الحقيقية أحياناً هي أن أبقى بجواره وأنادي من يعرف. عظّم الله شأن إنقاذ النفس (سورة المائدة: الآية 32)، ومن ساعد بجهل فقد يؤذي وهو يظن أنه يُحسن.","cards":[],"verses":[]}],"open_questions":[{"q":"هل نستطيع صنع عضلة صناعية تسحب مثل عضلتنا وبكفاءتها وتُصلح نفسها؟","why_open":"المهندسون يصنعون «عضلات صناعية» من مواد مختلفة، ولم يصل أحد بعد إلى عضلة تُصلح نفسها وتنمو مثل الحية."}],"notebook":{"draw":"ألصق{|ي} أو ارسم{|ي} نموذجك{|ِ} بتسمياته: عظم، مفصل، عضلة، وتر. المستوى ب: {أضف|أضيفي} الرباط بلون آخر واكتب{|ي} «ما لا يُظهره نموذجي».","label":["العظم","المفصل","العضلة","الوتر","— ب: الرباط"],"write":"سؤالي المفتوح للوحدة القادمة: ____. ولماذا يحيّرني هذا السؤال؟"},"unit_review":{"text":"دروس هذه الوحدة قطع في آلة واحدة: العظم يحمل، والمفصل يسمح بالحركة، والعضلة تسحب، والوتر يوصل سحبها إلى العظم.","links":[{"lesson":"U02.L01","idea":"العظم حي: يدعم الجسم ويحميه، وينمو ويلتئم","title":"الهيكل: دعم وحماية وعظم حي"},{"lesson":"U02.L02","idea":"المفصل حيث تلتقي عظمتان، وشكله يحدد حركته","title":"المفاصل: حيث تلتقي العظام"},{"lesson":"U02.L03","idea":"العضلة تنقبض فتسحب ولا تدفع، فتعمل أزواجاً","title":"العضلات تسحب ولا تدفع"},{"lesson":"U02.L04","idea":"نبني نموذج ذراع ونفحص به ما تعلمناه","title":"قضية الوحدة: أبني ذراعاً تتحرك"}],"question":{"prompt":"حين {تثني|تثنين} مرفقك{|ِ} لترفع{|ي} كوباً، ماذا يحدث؟","options":["العضلة تدفع العظم إلى الأعلى","العظم يتحرك وحده دون عضلة","عضلة تنقبض فتسحب العظم عبر الوتر، والمفصل يسمح بالانثناء"],"answer":2,"why":"العضلة تسحب ولا تدفع، والوتر يوصل سحبها إلى العظم، والمفصل يسمح بالحركة: دروس الوحدة كلها في حركة واحدة."}},"imgs":["U02.L04-E1","U02.L04-E2","U02.L04-exp","U02.L04-hist1","U02.L04-letter","U02.L04-life","U02.L04-title-boy","U02.L04-title-girl"]};
