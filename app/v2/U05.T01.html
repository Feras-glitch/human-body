const LD = {"id":"U05.T01","lesson":"U05.L01","first":false,"title":"اختبار: الخلية: اللبنة الحية التي لا تراها","lessonTitle":"الخلية: اللبنة الحية التي لا تراها","concepts":[],"check":[],"items":[{"id":"U05.L01.A1.a","objective":"U05.L01.O1","level":"A","type":"choose","prompt":"الخلية هي:","options":["شيء صغير يسبح في الدم فقط","جزء صلب من العظم يقوّيه","نوع من الميكروبات يعيش داخل أجسامنا ويضرنا","اللبنة الحية التي يُبنى منها كل كائن حي"],"answer":3,"explanation":"الخلية هي اللبنة الحية التي يُبنى منها كل كائن حي، من أصغره إلى الإنسان.","feedback_by_option":{"0":"خلايا الدم نوع واحد؛ وكل أجزاء الجسم مبنية من خلايا.","1":"في العظم خلايا حية، لكن الخلية ليست جزءاً من العظم وحده.","2":"الميكروبات كائنات أخرى؛ ونحن مبنيّون من خلايانا."},"alt":{"prompt":"أي أجزاء الجسم مبنية من خلايا؟","options":["الجلد الذي رأينا خلاياه بالمجهر، أما العظم فمادة صلبة بلا خلايا","الدم، لأن خلاياه تسبح منفردة؛ أما الأعضاء فليست خلايا","الجلد والعضلة والعظم والدماغ، كلها","العضلات، أما الجلد فطبقة لا خلايا فيها"],"answer":2,"explanation":"كل جزء من الجسم مبني من خلايا: الجلد والعضلة والعظم والدماغ والدم.","feedback_by_option":{"0":"الجلد خلايا، والعضلة والعظم والدماغ خلايا أيضاً.","1":"رأينا خلايا الدم لأنها تسبح منفردة؛ والأجزاء الأخرى خلايا متراصة.","3":"العضلات خلايا، وكل أجزاء الجسم كذلك."},"detects":"M46"}},{"id":"U05.L01.A1.b","objective":"U05.L01.O1","level":"A","type":"true_false_why","prompt":"«جلدك مادة متصلة بلا خلايا». صح أم خطأ؟","answer":"خطأ؛ الجلد خلايا مسطحة متراصة لا تُرى بالعين.","rubric":"R1","detects":"M46","alt":{"prompt":"«العظم حي، وفيه خلايا لا نراها بالعين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العظم نسيج حي مبني من خلايا، ولذلك ينمو ويلتئم؛ والخلايا أصغر من أن تراها العين.","detects":"M46"}},{"id":"U05.L01.A1.c","objective":"U05.L01.O1","level":"A","type":"choose_reason","prompt":"كم خلية في جسمك{|ِ} تقريباً؟","options":["تريليونات","مئات","آلاف","واحدة كبيرة"],"answer":0,"explanation":"جسم الإنسان مبني من تريليونات الخلايا.","feedback_by_option":{"1":"في قطرة دم صغيرة وحدها ملايين الخلايا؛ فكم في الجسم كله؟","2":"أكثر بكثير: في قطرة دم صغيرة وحدها ملايين الخلايا.","3":"الجسم ليس خلية واحدة كبيرة؛ هو خلايا صغيرة جداً لا تُعدّ."},"alt":{"prompt":"لماذا نحتاج المجهر لنرى الخلايا؟","options":["لأنها داخل الجسم، ولا خلايا على سطحه","لأنها أصغر بكثير من أن تراها العين","لأنها تتحرك بسرعة كبيرة","لأنها لا توجد إلا تحت المجهر"],"answer":1,"explanation":"الخلية أصغر بكثير من أن تراها العين، والمجهر يكبّرها فنراها.","feedback_by_option":{"0":"الجلد على سطح الجسم خلايا أيضاً، ولا نراها بالعين.","2":"كثير من الخلايا لا يتحرك من مكانه، ومع ذلك لا نراه.","3":"الخلايا موجودة دائماً؛ المجهر يكبّرها فقط لنراها."}}},{"id":"U05.L01.A2.a","objective":"U05.L01.O2","level":"A","type":"locate_on_atlas","prompt":"اضغط{|ي} على السيتوبلازم.","atlas_target":"cytoplasm","answer":"cytoplasm","alt":{"type":"choose","prompt":"السيتوبلازم:","options":["سائل هلامي يملأ الخلية","غلاف يحيط بالخلية","مكان تعليمات الخلية","سائل الدم الأصفر الذي تسبح فيه الخلايا"],"answer":0,"explanation":"السيتوبلازم سائل هلامي يملأ الخلية، وفيه تحدث تفاعلاتها؛ والغشاء يحيط به، والنواة فيه.","feedback_by_option":{"1":"هذا الغشاء.","2":"هذه النواة.","3":"هذه البلازما، وهي خارج الخلايا."}}},{"id":"U05.L01.A2.b","objective":"U05.L01.O2","level":"A","type":"choose","prompt":"أين التعليمات التي تخبر الخلية ماذا تصنع؟","options":["في الغشاء","في النواة","في السيتوبلازم","خارج الخلية"],"answer":1,"explanation":"النواة تحفظ التعليمات التي تخبر الخلية ماذا تصنع.","feedback_by_option":{"0":"الغشاء يحيط بالخلية ويتحكم فيما يدخل ويخرج.","2":"السيتوبلازم سائل هلامي تحدث فيه التفاعلات.","3":"كل خلية تحمل تعليماتها داخلها."},"alt":{"prompt":"قال طفل: «النواة دماغ الخلية الذي يفكر». أي تشبيه أدق للنواة؟","options":["مطبخ تحدث فيه التفاعلات","دماغ يفكر ويقرر","باب يُدخل ويُخرج","دفتر وصفات فيه تعليمات مكتوبة"],"answer":3,"explanation":"النواة تحفظ التعليمات التي تخبر الخلية ماذا تصنع، كدفتر وصفات؛ لا تفكر ولا تقرر.","feedback_by_option":{"0":"المطبخ أقرب إلى السيتوبلازم الذي تحدث فيه التفاعلات.","1":"النواة لا تفكر ولا تقرر؛ فيها تعليمات تُتبع.","2":"الباب يشبه الغشاء الذي يتحكم فيما يدخل ويخرج."},"detects":"M47"}},{"id":"U05.L01.A2.c","objective":"U05.L01.O2","level":"A","type":"explain_open","prompt":"لماذا نشبّه النواة بدفتر وصفات لا بدماغ؟","answer":"لأن فيها تعليمات مكتوبة تُتبع، ولا تفكر ولا تقرر كالدماغ.","rubric":"R1","detects":"M47"},{"id":"U05.L01.A3.a","objective":"U05.L01.O3","level":"A","type":"choose","prompt":"خلية لها فروع طويلة تنقل الإشارات:","options":["كريّة حمراء","خلية جلد","خلية عصبية","خلية عضلية"],"answer":2,"explanation":"الخلية العصبية لها فروع طويلة تنقل الإشارات.","feedback_by_option":{"0":"الكريّة الحمراء قرص بلا فروع، يحمل الأكسجين.","1":"خلية الجلد مسطحة تغطي.","3":"الخلية العضلية طويلة رفيعة تقصر حين تعمل؛ أما الفروع الطويلة التي تنقل الإشارات فللخلية العصبية."},"detects":"M24","alt":{"prompt":"خلية على شكل قرص صغير مقعّر، تنزلق في الشعيرات وتحمل الأكسجين:","options":["الخلية العضلية","الخلية العصبية","الكريّة الحمراء","خلية الجلد"],"answer":2,"explanation":"الكريّة الحمراء قرص صغير مقعّر، ينزلق في الشعيرات الرفيعة ويحمل الأكسجين؛ الشكل يناسب العمل.","feedback_by_option":{"0":"الخلية العضلية طويلة تنقبض.","1":"الخلية العصبية متفرعة تنقل الإشارات.","3":"خلية الجلد مسطحة تغطي."},"detects":"M24"}},{"id":"U05.L01.A3.b","objective":"U05.L01.O3","level":"A","type":"explain_open","prompt":"لماذا الكريّة الحمراء قرص صغير مقعّر لا كرة كبيرة؟","answer":"ليزيد سطحها لحمل الأكسجين ولتنزلق في الشعيرات الرفيعة؛ الشكل يناسب العمل.","rubric":"R1"},{"id":"U05.L01.A3.c","objective":"U05.L01.O3","level":"A","type":"true_false_why","prompt":"«لو رأينا خلية واحدة لعرفنا شكل كل خلايا الجسم». صح أم خطأ؟","answer":"خطأ؛ نحو مئتي نوع بأشكال مختلفة تناسب أعمالها.","rubric":"R1","detects":"M24","alt":{"prompt":"«خلية العضلة وخلية الجلد مختلفتان في الشكل، لأن عمليهما مختلفان». صح أم خطأ؟ ولماذا؟","answer":"صح؛ خلية العضلة طويلة تنقبض، وخلية الجلد مسطحة تغطي؛ الشكل يناسب العمل.","detects":"M24"}},{"id":"U05.L01.A4.a","objective":"U05.L01.O4","level":"A","type":"choose_reason","prompt":"لماذا لم يعرف الناس الخلايا قبل 360 سنة؟","options":["لأنها لم تكن موجودة","لأنها كانت أكبر","لأن أحداً لم يسأل","لأن العين لا تراها واحتاجوا المجهر"],"answer":3,"explanation":"الخلايا أصغر من أن تراها العين، فلم تُكتشف إلا بعد أن صنع الناس المجهر.","feedback_by_option":{"0":"الخلايا موجودة منذ وُجد الإنسان؛ لكن رؤيتها احتاجت أداة.","1":"لو كانت أكبر لرآها الناس بأعينهم.","2":"كثيرون سألوا عن تركيب الجسم؛ لكن الجواب احتاج أداة ترى الصغير جداً."},"alt":{"prompt":"كيف رأى العلماء الخلية أول مرة؟","options":["بالنظر في المرآة","بالعين المجردة حين دققوا النظر","بالمجهر الذي يكبّر الأشياء الصغيرة","بالأشعة على العظام"],"answer":2,"explanation":"رأى العلماء الخلية أول مرة بالمجهر قبل نحو 360 سنة، لأنها أصغر من أن تراها العين.","feedback_by_option":{"0":"المرآة لا تكبّر الأشياء الصغيرة إلى هذا الحد.","1":"مهما دققنا النظر لا ترى العين خلية واحدة؛ هي أصغر من ذلك.","3":"الأشعة جاءت بعد ذلك بقرون، وهي تُظهر العظام لا الخلايا."}}},{"id":"U05.L01.A4.b","objective":"U05.L01.O4","level":"A","type":"true_false_why","prompt":"«معظم أجزاء الخلية الحقيقية شفافة، وألوان الرسم ترميز». صح أم خطأ؟","answer":"صح؛ العلماء يصبغونها أو يلوّنون رسمها لنميّز أجزاءها.","rubric":"R1","detects":"M25","alt":{"prompt":"«الخلية الحقيقية ملوّنة بالأحمر والأزرق والأخضر كما في الرسم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ معظم أجزاء الخلية شفافة، والألوان في الرسم ترميز لنميّز الأجزاء.","detects":"M25"}},{"id":"U05.L01.A4.c","objective":"U05.L01.O4","level":"A","type":"fix_model","prompt":"رسم فيه خلية بحجم حبة العنب في وسط الذراع. ما الخطأ؟","answer":"الخلية أصغر من عُشر مليمتر؛ الذراع مبنية من مليارات الخلايا لا خلية واحدة كبيرة.","rubric":"R2"},{"id":"U05.L01.A5.a","objective":"U05.L01.O5","level":"B","type":"choose","prompt":"الأجسام الصغيرة التي تصنع معظم طاقة الخلية:","options":["الميتوكوندريا","النواة","الغشاء","الكريّات"],"answer":0,"explanation":"الميتوكوندريا هي التي تُطلق معظم طاقة الخلية.","feedback_by_option":{"1":"النواة تحفظ التعليمات.","2":"الغشاء يتحكم فيما يدخل ويخرج.","3":"الكريّات خلايا في الدم، لا أجسام داخل كل خلية."},"alt":{"prompt":"الميتوكوندريا:","options":["سائل أصفر تسبح فيه خلايا الدم في الأوعية","تحفظ تعليمات الخلية","غلاف يحيط بالخلية","أجسام صغيرة تُطلق معظم طاقة الخلية"],"answer":3,"explanation":"الميتوكوندريا أجسام صغيرة داخل الخلية، تُطلق معظم الطاقة التي تحتاجها من الغذاء.","feedback_by_option":{"0":"هذه البلازما، وهي خارج الخلايا.","1":"هذه النواة.","2":"هذا الغشاء."}}},{"id":"U05.L01.A5.b","objective":"U05.L01.O5","level":"B","type":"explain_open","prompt":"أي خلية تتوقع{|ين} أن تحوي ميتوكوندريا أكثر: خلية عضلة القلب أم خلية الجلد؟ ولماذا؟","answer":"عضلة القلب؛ تعمل بلا توقف فتحتاج طاقة أكثر.","rubric":"R1"},{"id":"U05.L01.A5.c","objective":"U05.L01.O5","level":"B","type":"true_false_why","prompt":"«الميتوكوندريا تصنع الطاقة من لا شيء». صح أم خطأ؟","answer":"خطأ؛ تحتاج مادة خام (الغذاء) وأكسجيناً — تفصيله في الدرس القادم.","rubric":"R1","alt":{"prompt":"«الميتوكوندريا تحتاج غذاءً وأكسجيناً لتُطلق الطاقة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لا تصنع الطاقة من لا شيء: تحتاج مادة خاماً من الغذاء، وأكسجيناً من الهواء؛ وتفصيله في الدرس القادم."}},{"id":"U05.L01.A6.a","objective":"U05.L01.O6","level":"B","type":"sequence","prompt":"رتّب{|ي} من الأصغر إلى الأكبر — كل واحد يُبنى مما قبله:","options":["القلب (عضو)","خلية عضلية","الجهاز الدوري","نسيج عضلي"],"answer":[1,3,0,2],"explanation":"خلايا متشابهة تكوّن نسيجاً، وأنسجة تكوّن عضواً كالقلب، وأعضاء تعمل معاً تكوّن جهازاً.","alt":{"prompt":"رتّب{|ي} أجزاء الجهاز التنفسي من الأصغر إلى الأكبر:","options":["الجهاز التنفسي","خلية في جدار حويصلة","الرئة","نسيج الحويصلات"],"answer":[1,3,2,0],"explanation":"خلايا متشابهة تكوّن نسيج الحويصلات، والأنسجة تكوّن عضواً هو الرئة، والرئة مع غيرها تكوّن الجهاز التنفسي."}},{"id":"U05.L01.A6.b","objective":"U05.L01.O6","level":"B","type":"choose","prompt":"خلايا متشابهة تعمل معاً تكوّن:","options":["عضواً","نسيجاً","جهازاً","جسماً"],"answer":1,"explanation":"الخلايا المتشابهة التي تعمل معاً تكوّن نسيجاً.","feedback_by_option":{"0":"العضو أكبر: يُبنى من عدة أنسجة.","2":"الجهاز أكبر بكثير: عدة أعضاء تعمل معاً.","3":"الجسم أعلى المستويات: أجهزة كثيرة معاً."},"alt":{"prompt":"عدة أعضاء تعمل معاً لمهمة واحدة تكوّن:","options":["نسيجاً","جهازاً","خلية","عضواً أكبر"],"answer":1,"explanation":"الأعضاء التي تعمل معاً تكوّن جهازاً، كالقلب والأوعية والدم في الجهاز الدوري.","feedback_by_option":{"0":"النسيج أصغر: خلايا متشابهة.","2":"الخلية أصغر المستويات.","3":"الأعضاء معاً لا تصير عضواً واحداً؛ تكوّن مستوى أعلى."}}},{"id":"U05.L01.A6.c","objective":"U05.L01.O6","level":"B","type":"explain_open","prompt":"سمِّ{|ي} جهازاً درسناه، وعضواً فيه، ونسيجاً في ذلك العضو.","answer":"مثل: الجهاز التنفسي؛ الرئة؛ نسيج الحويصلات أو العضلة (الحجاب الحاجز).","rubric":"R1"}],"transfer":[{"id":"U05.L01.T1","objective":"U05.L01.O3","type":"explain_open","prompt":"في المدينة: سيارة الإسعاف سريعة وضيقة، والشاحنة بطيئة وواسعة. ما علاقة ذلك بخلايا جسمك{|ِ}؟","answer":"لكل عمل شكل يناسبه؛ الخلايا متخصصة كالمركبات: قرص للنقل، طويلة للسحب، متفرعة للإشارات.","level":"A","rubric":"R1"},{"id":"U05.L01.T2","objective":"U05.L01.O6","type":"explain_open","prompt":"المدرسة: تلاميذ ← صف ← مرحلة ← مدرسة. طابق{|ي} ذلك بسلّم الجسم.","answer":"خلية ← نسيج ← عضو ← جهاز ← جسم؛ كل مستوى مبني مما قبله ويعمل معاً.","level":"B","rubric":"R1"}],"recall":[{"id":"U05.L01.D1","objective":"U05.L01.O1","type":"choose","prompt":"جسمك مبني من:","options":["مادة متصلة كالعجين","ماء فقط في كيس","تريليونات الخلايا"],"answer":2,"explanation":"جسمك{|ِ} مبني من تريليونات الخلايا.","level":"A","feedback_by_option":{"0":"يبدو الجسم متصلاً للعين، لكن المجهر يُظهر أنه خلايا متراصة.","1":"في الجسم ماء كثير، لكنه داخل الخلايا وحولها؛ والجسم مبني من خلايا."}},{"id":"U05.L01.D2","objective":"U05.L01.O2","type":"choose","prompt":"أين تُحفظ تعليمات الخلية؟","options":["النواة","الغشاء","السيتوبلازم"],"answer":0,"explanation":"النواة تحفظ تعليمات الخلية.","level":"A","feedback_by_option":{"1":"الغشاء يحيط بالخلية ويتحكم فيما يدخل ويخرج.","2":"السيتوبلازم سا
