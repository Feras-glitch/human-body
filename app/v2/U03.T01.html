"U03.L01.O3","level":"A","type":"choose","prompt":"عدّ أحمد 22 نبضة في 15 ثانية وهو جالس، وعدّت ليلى 22 نبضة في 10 ثوانٍ بعد الجري. أيهما قلبه أسرع؟","options":["أحمد","ليلى","متساويان لأن العدد واحد","لا يمكن أن نقارن"],"answer":1,"explanation":"العدد نفسه في وقت أقصر يعني نبضاً أسرع: ليلى نحو 132 في الدقيقة وأحمد نحو 88 — والجري سرّع قلبها.","feedback_by_option":{"0":"العدد واحد، لكن أحمد احتاج وقتاً أطول ليبلغه؛ فقلبه أبطأ.","2":"العدد واحد، لكن الوقت مختلف. من بلغ العدد في وقت أقصر؟","3":"نستطيع: نقارن العدد في الوقت نفسه، أو نحسب لكل واحد في دقيقة."},"alt":{"prompt":"عدّت سلمى 20 نبضة في 15 ثانية، وعدّ خالد 30 نبضة في 30 ثانية. أيهما قلبه أسرع؟","options":["سلمى","خالد","متساويان","لا يمكن أن نقارن"],"answer":0,"explanation":"في دقيقة: سلمى 20 × 4 = 80، وخالد 30 × 2 = 60؛ فقلب سلمى أسرع مع أن عددها أصغر.","feedback_by_option":{"1":"عدد خالد أكبر، لكنه عدّ ضعف الوقت. احسب{|ي} لكل واحد في دقيقة.","2":"ليسا متساويين: في دقيقة كاملة، كم نبضة لكل واحد؟","3":"نستطيع: نحسب لكل واحد عدد نبضاته في دقيقة."}}},{"id":"U03.L01.A3.c","objective":"U03.L01.O3","level":"A","type":"predict","prompt":"بنت نبضها في الراحة 85. صعدت الدرج ثلاث طبقات. توقّع{|ي} نبضها فور الوصول، ثم بعد خمس دقائق جلوس.","options":["85 ثم 85","130 ثم 90","60 ثم 85","130 ثم 130"],"answer":1,"explanation":"النبض يرتفع فور الجهد، ثم ينخفض في الراحة عائداً نحو ما كان عليه.","feedback_by_option":{"0":"صعود الدرج جهد؛ فهل يبقى النبض كما هو فور الوصول؟","2":"الجهد يرفع النبض ولا يخفضه.","3":"بعد خمس دقائق جلوس يهدأ القلب؛ فهل يبقى النبض مرتفعاً كما كان؟"},"alt":{"prompt":"ولد نبضه في الراحة 80. ركض دقيقتين ثم جلس. ماذا يحدث لنبضه؟","options":["يبقى 80 طوال الوقت","يرتفع فور الركض، ثم ينخفض شيئاً فشيئاً نحو 80","ينخفض فور الركض لأن القلب تعب، ثم يرتفع في الجلوس","يرتفع ويبقى مرتفعاً ساعات"],"answer":1,"explanation":"النبض يرتفع مع الجهد، ثم ينخفض في الراحة عائداً نحو ما كان عليه.","feedback_by_option":{"0":"الركض جهد يحتاج فيه الجسم دماً أكثر؛ فهل يبقى النبض كما هو؟","2":"العكس: الجهد يرفع النبض، والراحة تخفضه
