const LD = {"id":"U08.L06","first":false,"title":"مشاعري وجسمي","driving_question":"{اسم}، لماذا يؤلمك{|ِ} بطنك{|ِ} قبل الامتحان؟ وماذا {تفعل|تفعلين} حين {تغضب|تغضبين} أو {تحزن|تحزنين}، أو حين يسخر أحد منك{|ِ} كل يوم؟","central_fact":"المشاعر كلها طبيعية ولها أثر في الجسم، لأن الدماغ يرسل رسائل إلى القلب والأمعاء والعضلات؛ ونستطيع أن نهدّئها بالتوقف والتنفس والحركة والكلام، وأن نطلب العون. والتنمر أذى مقصود يتكرر، ويوقفه كبير نخبره. وصور الشاشات المعدّلة ليست مقياساً لأجسامنا.","next":null,"nexts":[],"hook":{"text":"{اسم}، قبل امتحان مهم يؤلمك{|ِ} بطنك{|ِ}. لماذا في رأيك{|ِ}؟","options":["لأني أكلت شيئاً فاسداً","لأن القلق يصل إلى البطن","لأني أمثّل","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","digestive"],"highlight":["brain","stomach"],"zoom":"body"},"text":"في درس الخوف {عرفت|عرفتِ} أن الدماغ يرسل رسائل إلى القلب والرئتين حين يحس بالخطر. والخوف واحد من المشاعر: ما نحسّه في داخلنا، كالفرح والغضب والحزن والقلق. وكلها طبيعية، ولكل منها أثر في الجسم. فالمواد التي تنقل رسائل المزاج في الدماغ تعمل أيضاً في الأمعاء، وأكثر السيروتونين، أحد مراسيل المزاج، في الأمعاء نفسها. ولهذا يؤلم البطن عند كثير من الأطفال قبل الامتحان أو في أول يوم مدرسة. الألم حقيقي وليس تمثيلاً، لكن الألم الجديد أو الشديد يحتاج طبيباً."},{"id":"E2","level":"A","atlas":{"layers":["nervous","respiratory"],"highlight":["brain","lungs"],"zoom":"body"},"text":"يغضب كل الناس أحياناً، ويحزنون ويقلقون. والتعبير عن الشعور مقبول، أما الصراخ على الناس أو ضربهم أو تكسير الأشياء فليس مقبولاً. فماذا نفعل؟ التهدئة: أن نعيد الجسم والنفس إلى الهدوء. {توقف|توقفي} و{ابتعد|ابتعدي} قليلاً إلى مكان آخر، و{عُدّ|عُدّي}، و{تنفس|تنفسي} ببطء كما في درس الخوف، شهيق إلى أربعة وزفير إلى ستة. أو {تحرك|تحركي}، أو {ارسم|ارسمي} ما {تشعر|تشعرين} به، أو {اكتبه|اكتبيه}. ثم {تكلم|تكلمي} مع أحد والديك{|ِ} أو كبير {تثق|تثقين} به."},{"id":"E3","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"body"},"text":"وأحياناً يأتي الأذى من غيرنا. التنمر أذى مقصود يتكرر، من أحد أقوى أو يظن نفسه أقوى: كلام جارح، أو سخرية من الشكل أو اللون أو اللهجة، أو إقصاء من اللعب ونشر الشائعات، أو ضرب وأخذ أغراض، أو نشر صورة أو كلام على الشاشات. والمزاح غير التنمر: في المزاح يضحك الجميع، ويتوقف إذا طلب أحد. فإن وقع عليك{|ِ} تنمر فليس ذنبك{|ِ}: {ابتعد|ابتعدي}، و{أخبر|أخبري} كبيراً يوقفه. وإن {رأيته|رأيتِه} يقع على غيرك{|ِ} فلا {تضحك|تضحكي} ولا {تشارك|تشاركي}، بل {ائت|ائتي} بكبير يوقفه، {وكن|وكوني} {صديقاً|صديقةً} لمن تأذى."},{"id":"E4","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"وصورة الجسم: كيف نرى أجسامنا ونشعر بها. على الشاشات صور كثيرة منتقاة ومعدّلة بالمرشحات: وجوه بلا أي أثر، وأجسام غُيّر شكلها. ومن يقارن جسمه الحقيقي بها كثيراً قد يصير غير راضٍ عن نفسه. فلا {تقارن|تقارني} جسمك{|ِ} بصورة معدّلة، و{قدّر|قدّري} جسمك{|ِ} بما يفعله: يركض، ويحمل، ويعانق، ويتعلم. وجسمك{|ِ} يتغيّر وأنت{|ِ} {تكبر|تكبرين}، ولكل جسم شكله."},{"id":"E5","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"body"},"text":"ومتى نطلب العون؟ طلب العون أن نخبر أحد الكبار الذين نثق بهم حين يثقل علينا شعور أو يؤذينا أحد. وهو قوة لا ضعف. {اطلب|اطلبي} العون إن طال الحزن أو القلق أياماً، أو صار يمنعك{|ِ} من النوم أو الأكل أو اللعب، أو إن تكرر عليك{|ِ} تنمر. والكبير قد يأخذك{|ِ} إلى الطبيب أو المختص، وقلق الأطفال وحزنهم يتحسنان كثيراً بالعون المناسب."},{"id":"E6","level":"B","atlas":{"layers":["nervous","digestive"],"highlight":["brain","small_intestine"],"zoom":"body"},"text":"للمستوى ب: قبل أكثر من ألف ومئة سنة كتب الطبيب المسلم أبو زيد البلخي كتاب «مصالح الأبدان والأنفس»، فجعل للنفس صحة ومرضاً كما للبدن، وكتب عن الخوف والقلق والحزن والأفكار التي تتكرر بلا إرادة، ووصف لها علاجاً بتغيير طريقة التفكير وبالوقاية قبل أن يشتد الأمر. واليوم يدرس العلماء كيف يتبادل الدماغ والأمعاء الرسائل، وهل يؤثر سكان الأمعاء في المزاج؛ وهذا لم يُحسم بعد في الإنسان."}],"practice":[{"id":"U08.L06.P1","after":"E1","objective":"U08.L06.O1","type":"choose_reason","prompt":"لماذا يؤلم بطن بعض الأطفال قبل الامتحان؟","options":["لأنهم يكذبون كي لا يذهبوا","لأن القلق يصل إلى الأمعاء","لأن الطعام فاسد في كل مرة","لأن البطن لا علاقة له بالدماغ"],"answer":1,"explanation":"المواد التي تضبط المزاج تضبط الهضم والألم أيضاً، فيحسّ القلق في البطن.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: أين أكثر السيروتونين؟","feedback_by_option":{"0":"الألم حقيقي، وليس كذباً.","2":"قد يحدث بلا طعام فاسد.","3":"الدماغ والأمعاء يتبادلان الرسائل."},"detects":"M136"},{"id":"U08.L06.P2","after":"E2","objective":"U08.L06.O2","type":"choose","prompt":"{غضبت|غضبتِ} من أخيك{|ِ} لأنه كسر لعبتك{|ِ}. أي هذه أحسن أول خطوة؟","options":["أكسر شيئاً له","أتوقف وأتنفس ببطء ثم أتكلم","أصرخ عليه حتى يبكي","أكتم غضبي ولا أكلم أحداً عنه"],"answer":1,"explanation":"التوقف والتنفس يهدّئان الجسم، ثم الكلام يحل المشكلة بلا إيذاء.","level":"A","feedback_wrong":"ما الذي يهدّئ القلب السريع أولاً؟","feedback_by_option":{"0":"إيذاء الأشياء غير مقبول.","2":"الصراخ يؤذي ولا يحل.","3":"الكتمان الطويل يُثقل؛ الكلام بهدوء أحسن."}},{"id":"U08.L06.P3","after":"E3","objective":"U08.L06.O3","type":"choose","prompt":"أي هذه تنمر؟","options":["صديقان يتمازحان ويضحكان معاً","خلاف مرة على دور في اللعب ثم صلح","ولد أكبر يسخر من زميل كل يوم","معلم يصحح خطأ في الواجب"],"answer":2,"explanation":"أذى مقصود يتكرر من الأقوى: هذا تنمر.","level":"A","feedback_wrong":"{ابحث|ابحثي} عن التكرار والقوة غير المتكافئة.","feedback_by_option":{"0":"المزاح يضحك فيه الجميع.","1":"خلاف مرة واحدة ثم صلح ليس تنمراً.","3":"التصحيح تعليم لا أذى."},"detects":"M137"},{"id":"U08.L06.P4","after":"E4","objective":"U08.L06.O4","type":"choose","prompt":"رأت ريم صورة لبنت بوجه بلا أي أثر، فحزنت من وجهها. ماذا {تقول|تقولين} لها؟","options":["وجهك يجب أن يشبهها","الصورة معدّلة، ووجهك جميل","لا تنظري في المرآة بعد اليوم","استعملي مرشحاً في كل صورة"],"answer":1,"explanation":"الصور المعدّلة ليست حقيقية، والمقارنة بها تُتعب النفس.","level":"A","feedback_wrong":"هل الصورة على الشاشة كما هي في الحقيقة؟","feedback_by_option":{"0":"الصورة معدّلة، ولا يشبهها أحد حقاً.","2":"لا نحتاج أن نخاف من المرآة.","3":"المرشح يغيّر الصورة لا الحق ر|تذكّري} موقفاً {شعرت|شعرتِ} فيه بالقلق، كقبل امتحان أو رحلة جديدة.","{لوّن|لوّني} بالأزرق على رسم الجسم الأماكن التي {أحسست|أحسستِ} فيها بشيء: البطن، الصدر، اليدين…","{كرّر|كرّري} بالأحمر لموقف غضب، وبالأصفر لموقف فرح.","{جرّب|جرّبي} التنفس البطيء: شهيق إلى أربعة وزفير إلى ستة، ثلاث مرات، و{اكتب|اكتبي} هل تغيّر شيء.","{قارن|قارني} خريطتك{|ِ} بخريطة زميل أو أحد أهلك{|ِ}: ما المتشابه وما المختلف؟"],"safety":["لا يُطلب من أحد أن يحكي موقفه للصف؛ الخريطة له وحده إن أراد.","من تذكّر موقفاً يزعجه كثيراً يتوقف ويكلم كبيراً يثق به.","لا تعليق على رسم أحد ولا على جسمه."],"expected":"كثيرون يلونون البطن أو الصدر للقلق، والوجه واليدين والصدر للغضب، والجسم كله تقريباً للفرح؛ وتختلف الخرائط بين الناس. والتنفس البطيء يهدّئ عند كثيرين.","explain":"الدماغ يصنع الشعور ويرسل معه رسائل إلى القلب والأمعاء والعضلات، فنحسّه في أماكن من الجسم؛ والتنفس البطيء يشغّل مكابح الهدوء.","record":"القلق: ___ — الغضب: ___ — الفرح: ___ — بعد التنفس البطيء: ___","alternatives":["من لا يريد التلوين: يكتب كلمات بدل الألوان.","المستوى ب: يقرأ عن دراسات «خرائط المشاعر في الجسم» ويقارن خريطته بها."]},"find_the_error":[{"id":"FE1","atlas_variant":"crying_weak","error":"لوحة: من يبكي ضعيف","answer":"المشاعر كلها طبيعية، والبكاء ليس ضعفاً","detects":"M135"},{"id":"FE2","atlas_variant":"bully_joke","error":"جملة: هو يمزح فقط، كل يوم","answer":"الأذى الذي يتكرر من الأقوى تنمر، والكبير يوقفه","detects":"M137"},{"id":"FE3","atlas_variant":"filter_real","error":"إعلان: هكذا يجب أن يكون وجهك","answer":"الصورة معدّلة بالمرشحات، ولكل وجه وجسم شكله","detects":"M138"}],"numbers":[{"text":"أكثر السيروتونين، أحد مراسيل المزاج، ليس في الدماغ بل في الأمعاء.","source":["S4"]},{"text":"قبل أكثر من ألف ومئة سنة كتب أبو زيد البلخي أن للنفس صحة ومرضاً كما للبدن.","source":["S8"]}],"true_size":[{"text":"في أمعائك{|ِ} شبكة من الأعصاب كبيرة حتى سمّاها بعض العلماء «الدماغ الثاني»؛ ولهذا تصل إليها مشاعرك{|ِ}.","source":["S4"]}],"animal":null,"organ_letter":{"from":"الدماغ","text":"مرحباً، أنا دماغك{|ِ}. أنا الذي أصنع مشاعرك{|ِ} كلها: الفرح حين {تلعب|تلعبين}، والقلق قبل الامتحان، والغضب حين يُكسر شيء {تحبه|تحبينه}. وكلها طبيعية، وأنا أرسل معها رسائل إلى قلبك{|ِ} وأمعائك{|ِ}، ولذلك {تحس|تحسين} بها في جسمك{|ِ}. وحين يشتد شعور، ساعدني: {توقف|توقفي}، و{تنفس|تنفسي} ببطء، و{تكلم|تكلمي} مع من {تثق|تثقين} به. ولا {تصدّق|تصدّقي} أن جسمك{|ِ} يجب أن يشبه صور الشاشات؛ أنا أعرف كم يفعل جسمك{|ِ} من أشياء رائعة كل يوم."},"history":[{"who":"أبو زيد البلخي","origin":"بلخ. مسلم","where_when":"القرن التاسع الميلادي (الثالث الهجري)، «مصالح الأبدان والأنفس»","did":"جعل للنفس صحة ومرضاً كما للبدن، وكتب عن الخوف والقلق والحزن والأفكار المتكررة، ووصف لها علاجاً بتغيير التفكير وبالوقاية.","did_not":"لم يعرف النواقل العصبية ولا صلة الأمعاء بالمزاج كما نعرفها اليوم؛ وصف ما رآه في الناس وما فكّر فيه.","method_lesson":"أن نعتني بالنفس كما نعتني بالبدن، وأن نمنع المرض قبل أن يشتد.","source":["S8"]}],"how_we_know":{"text":"كيف عرف العلماء أن للمشاعر أثراً في البطن؟ لاحظ الأطباء أن آلام البطن تكثر عند الأطفال قبل الامتحانات وبدء المدرسة، ثم وجد العلماء أن المواد التي تحمل رسائل المزاج في الدماغ هي نفسها تعمل في الأمعاء، وأن أكثر السيروتونين هناك. وقبل ذلك بأكثر من ألف سنة كتب أبو زيد البلخي أن للنفس صحة ومرضاً كما للبدن، وأن الخوف والحزن يُعالَجان بالفكر والوقاية.","limit_question":"لماذا لا يعني ألم البطن قبل الامتحان أن كل ألم بطن سببه القلق؟"},"what_changed":["كان يُقال للطفل الحزين أو القلق: «لا شيء، انسَ»؛ واليوم نعلم أن تسمية الشعور والكلام عنه يساعدان.","كان التنمر يُعدّ «مزاح أطفال» يتركه الكبار؛ واليوم تعدّه المدارس أذى يجب إيقافه."],"model_limits":["خريطة الجسم التي نرسم عليها أين نحسّ الشعور تختلف من طفل إلى آخر؛ لا جواب واحداً صحيحاً.","طرق التهدئة تنفع كثيراً، لكنها لا تُغني عن الكبير والطبيب حين يطول الحزن أو القلق.","«ألم البطن من القلق» لا يعني أن كل ألم بطن من القلق؛ الألم الجديد أو الشديد يحتاج طبيباً."],"faith":{"opening":{"text":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","reference":"مسلم 2564","grade":"صحيح","usage":"قيمة","reflection":"في الحديث الذي في البطاقة أن الله لا ينظر إلى صورنا وأموالنا، بل إلى قلوبنا وأعمالنا. واليوم نتكلم عن مشاعرنا، وعن صورة الجسم وصور الشاشات المعدّلة. والحديث لا يتكلم عن المرشحات ولا عن الدماغ، والعلم لا يشرح الحديث؛ لكنه يعلّمنا أين نضع قيمة الإنسان: في قلبه وعمله، لا في شكله. ماذا {تحب|تحبين} في قلبك{|ِ} وعملك{|ِ}؟","reviewed":false,"hadith_key":"muslim:2564/suwar","highlight":"ولكن ينظر إلى قلوبكم وأعمالكم","level":"ترغيب","concept":"قيمة الإنسان في قلبه وعمله لا في شكله.","avoid":"لا نقول إن الشكل لا يهم في النظافة والعناية، ولا نجعل الحديث دليلاً علمياً على صورة الجسم.","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2564","grader":"","cards":[]},"closing":{"text":"المسلم أخو المسلم، لا يظلمه ولا يُسلمه، ومن كان في حاجة أخيه كان الله في حاجته، ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة، ومن ستر مسلماً ستره الله يوم القيامة","reference":"البخاري 2442؛ ومسلم 2580 بلفظ قريب","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن المشاعر طبيعية، وأن التنمر أذى نوقفه، وأن طلب العون قوة. والحديث في البطاقة يقول إن المسلم أخو المسلم لا يظلمه ولا يتركه لمن يؤذيه، ومن فرّج عن أخيه كربة فرّج الله عنه. والحديث لا يذكر التنمر بعينه؛ لكنه يعلّمنا ألا نترك من يتأذى وحده. من {ستقف|ستقفين} معه هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:2442","highlight":"لا يظلمه ولا يُسلمه","level":"ترغيب","concept":"لا نظلم أحداً ولا نتركه لمن يؤذيه، ونفرّج كرب الناس.","avoid":"لا نجعل نصرة المظلوم انتقاماً أو ضرباً؛ النصرة أن نأتي بكبير يوقف الأذى ونقف مع المتأذي.","lead":"عن عبد الله بن عمر رضي الله عنهما أن رسول الله ﷺ قال:","narration":false,"source":"البخاري 2442؛ ومسلم 2580 بلفظ قريب","grader":"","cards":[]}},"life":[{"situation":"في الصف يسمّي بعض الزملاء زميلاً جديداً اسماً يسخر من لهجته، كل يوم، وهو يسكت.","science":"هذا تنمر: أذى مقصود يتكرر من مجموعة على واحد؛ وأحسن ما يفعله الشاهد أن يأتي بكبير يوقفه.","action":"لا أضحك ولا أكرر الاسم، وأخبر المعلم، وأجلس مع الزميل الجديد وأعرّفه على أصدقائي.","value":"لا سخرية، ونصرة المتأذي.","why":"لماذا أتدخل وليس الأمر عني؟ لأن الآية في البطاقة تنهانا عن السخرية من الناس، فلعل من نسخر منه أفضل منا؛ والسكوت يترك صاحبنا وحده.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]},{"situation":"خسرنا المباراة بسبب خطأ صديقي، فغضبت جداً وأردت أن أصرخ عليه أمام الجميع.","science":"الغضب يسرّع القلب ويشد العضلات؛ والتوقف والنفَس البطيء يعيدان الجسم إلى الهدوء قبل أن نقول ما نندم عليه.","action":"أبتعد قليلاً، وأتنفس ببطء وأعدّ، ثم أقول له: لا بأس، نتدرب معاً للمباراة القادمة.","value":"ضبط الغضب.","why":"لماذا لا أصرخ وأنا محق في غضبي؟ لأن النبي ﷺ أوصى رجلاً بأن لا يغضب وكررها، كما في الحديث في البطاقة؛ وضبط الغضب قوة.","hadith":["bukhari:6116"],"cards":[{"key":"bukhari:6116","lead":"عن أبي هريرة رضي الله عنه:","text":"أن رجلاً قال للنبي ﷺ: أوصني، قال: «لا تغضب»، فردّد مراراً، قال: «لا تغضب»","narration":true,"source":"البخاري 6116","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كيف يتكلم الدماغ والأمعاء بالضبط، وهل يغيّر سكان الأمعاء مزاجنا؟","why_open":"يدرس العلماء ذلك اليوم، ووجدوا صلات في الحيوانات، لكن ما يحدث في الإنسان لم يُحسم بعد."}],"notebook":{"draw":"{ارسم|ارسمي} جسماً و{لوّن|لوّني} أين {تحس|تحسين} القلق والغضب والفرح. ثم {ارسم|ارسمي} يداً، و{اكتب|اكتبي} على أصابعها خمس طرق للتهدئة. المستوى ب: {ارسم|ارسمي} سهماً بين الدماغ والأمعاء في الاتجاهين.","label":["المشاعر","التهدئة","التنمر","صورة الجسم","طلب العون","— ب: الدماغ والأمعاء"],"write":"أشرح: لماذا يؤلم البطن مع القلق؟ وماذا أفعل حين أغضب؟ وماذا أفعل إن رأيت تنمراً؟"},"imgs":[]};
