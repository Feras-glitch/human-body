const LD = {"id":"U08.L04","first":false,"title":"ماذا يحدث في جسمي حين أخاف؟","driving_question":"{اسم}، قفز أخوك{|ِ} من خلف الباب وصرخ «بُووو!» فقفز قلبك{|ِ} وارتجفت يداك{|ِ}، ثم ضحك هو. ماذا حدث في جسمك{|ِ} في تلك الثانية؟ وهل كان مزاحاً بريئاً؟","central_fact":"حين يحسّ الدماغ بخطر يطلق إنذاراً يسرّع الجسم كله في ثوانٍ ليهرب أو يدافع: الأدرينالين يسرّع القلب والتنفس ويشدّ العضلات ويوقف الهضم؛ ثم تعيده مكابح الهدوء حين يزول الخطر. الإنذار مفيد حين يكون الخطر حقيقياً، ومؤذٍ حين نصنعه لغيرنا مزاحاً.","next":"U08.L05","hook":{"text":"{اسم}، فاجأك{|ِ} صوت عالٍ من خلفك{|ِ}. ما أول ما يحدث؟","options":["أقرر أن أخاف ثم يسرع قلبي","يسرع قلبي وأقفز قبل أن أفهم ما حدث","لا يتغير شيء في جسمي","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous"],"highlight":["eye","ear","amygdala"],"zoom":"head"},"text":"{تمشي|تمشين} على الرصيف، وفجأة تمرّ دراجة مسرعة قريباً منك{|ِ}، {فتقفز|فتقفزين} جانباً قبل أن {تفهم|تفهمي} ما رأيت{|ِ}! في عمق دماغك{|ِ} جزء صغير يعمل كجرس إنذار. يلتقط الخطر مما تراه عينك{|ِ} وتسمعه أذنك{|ِ}، ويطلق الإنذار بسرعة، أحياناً قبل أن يكمل الدماغ فهم الصورة. وهذا سبب أنك{|ِ} {قفزت|قفزتِ} أولاً، ثم {عرفت|عرفتِ} أنها دراجة."},{"id":"E2","level":"A","atlas":{"layers":["body","glands"],"highlight":["heart","lungs","pupils","muscles","stomach","adrenal"],"zoom":"body"},"text":"حين يرنّ الإنذار تنطلق رسائل في الأعصاب، فتطلق غدتان صغيرتان فوق الكليتين مادة في الدم اسمها الأدرينالين. وفي ثوانٍ يتغير جسمك{|ِ} كله: القلب يسرع ويدق بقوة ليدفع دماً أكثر، والتنفس يسرع، والعضلات تشتد مستعدة للحركة، والكبد يُخرج من مخزونه سكراً للطاقة، والبؤبؤ يتسع ليدخل ضوء أكثر، والفم يجف، والهضم يتباطأ فتحس{|ين} بشيء غريب في بطنك{|ِ}، وقد تقف شعيرات جلدك{|ِ} فتظهر القشعريرة. هذه كلها معاً: استجابة الخطر."},{"id":"E3","level":"A","atlas":{"layers":["body"],"highlight":["legs","arms","heart"],"zoom":"body"},"text":"لماذا يفعل الجسم هذا كله؟ ليهرب أو يدافع عن نفسه في ثوانٍ: دم أكثر وأكسجين وسكر أكثر للعضلات، وحواس متيقظة. فالخوف ليس عيباً: هو حارس يحميك{|ِ}. والشجاع ليس من لا يخاف، بل من يخاف ثم يتصرف بحكمة. لكن الإنذار يرنّ أحياناً بلا خطر حقيقي: صورة عنكبوت، أو سؤال مفاجئ من المعلم، أو كلمة جارحة؛ فيتصرف الجسم كأن أمامه خطراً. وهذا أيضاً طبيعي، ويمكن أن نتعلم كيف نهدّئه."},{"id":"E4","level":"A","atlas":{"layers":["nervous"],"highlight":["brake","heart","lungs"],"zoom":"body","animate":"breathing"},"text":"وحين يزول الخطر يضغط الجسم مكابحه: جزء من الجهاز العصبي يبطئ القلب والتنفس ويعيد الهضم. لكن ذلك يحتاج وقتاً، ولذلك يبقى قلبك{|ِ} سريعاً قليلاً بعد الفزع ولو {عرفت|عرفتِ} أنه لا خطر. {تستطيع|تستطيعين} أن {تساعد|تساعدي} المكابح: {تنفّس|تنفّسي} ببطء، شهيقاً من الأنف وزفيراً طويلاً من الفم، و{تكلّم|تكلّمي} مع كبير {تثق|تثقين} به، أو {امش|امشي} قليلاً بهدوء."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["heart","legs"],"zoom":"body"},"text":"قضية «المقلب المرعب»: أخ يختبئ خلف الباب ويقفز صارخاً على أخته في الظلام، ثم يضحك. ماذا حدث في جسمها؟ إنذار كامل: أدرينالين، وقلب يدق بقوة، وقد تسقط أو تصطدم بشيء. والفزع المفاجئ يرفع النبض والضغط، ونادراً قد يؤذي القلب، خاصة عند من عنده مرض لا نعرفه. والحكم من النص: نهى النبي ﷺ أن يروّع المسلم أخاه ولو كان مزاحاً، كما في الحديث في آخر الدرس؛ والأذى ممنوع مع كل إنسان. والحكمة بلغتنا: المزاح الجميل يضحك منه الجميع، أما الذي يضحك منه واحد ويفزع به آخر فليس مزاحاً."},{"id":"E6","level":"B","atlas":{"layers":["nervous","glands"],"highlight":["amygdala","adrenal_glands"],"zoom":"body"},"text":"جرس الإنذار في الدماغ اسمه اللوزة الدماغية. ترسل إنذارها إلى منطقة أخرى تشغّل الأعصاب التي تسرّع الجسم، فتطلق الغدتان الكظريتان الأدرينالين، ثم هرموناً آخر يُبقي الجسم متيقظاً ما دام الخطر قائماً. والغضب يشغّل الاستجابة نفسها: قلب سريع وعضلات مشدودة. ويقول بعض الناس: فرّغ غضبك بضرب الوسادة! لكن مراجعة 154 دراسة سنة 2024 وجدت أن ضرب الكيس لا يخفف الغضب وقد يزيده، وأن ما يهدّئ الجسم، كالتنفس العميق والاسترخاء وأخذ مهلة، يخففه."}],"practice":[{"id":"U08.L04.P1","objective":"U08.L04.O1","type":"choose","prompt":"ما المادة التي تطلقها الغدتان فوق الكليتين حين نخاف؟","options":["الأدرينالين","ال "رتّب{|ي} سلسلة الإنذار.","options":["العين ترى الخطر","اللوزة الدماغية تطلق الإنذار","الأعصاب تنبه الغدتين الكظريتين","الأدرينالين في الدم","القلب يسرع"],"answer":[0,1,2,3,4],"explanation":"حاسة، ثم إنذار في الدماغ، ثم أعصاب وغدتان، ثم أدرينالين، ثم القلب.","level":"B","feedback_wrong":"من أين يبدأ الإنذار، وأين ينتهي؟"}],"check":[{"id":"U08.L04.C1","objective":"U08.L04.O1","type":"explain_open","prompt":"اذكر{|ي} ثلاثة تغيّرات في الجسم عند الخوف، و{قل|قولي} كيف يفيد كل منها في الهرب.","answer":"القلب يسرع فيصل دم أكثر إلى العضلات؛ التنفس يسرع فيدخل أكسجين أكثر؛ العضلات تشتد فتتحرك بسرعة؛ السكر يخرج للطاقة؛ البؤبؤ يتسع فيدخل ضوء أكثر.","level":"A","rubric":"R1"},{"id":"U08.L04.C2","objective":"U08.L04.O2","type":"true_false_why","prompt":"«الشجاع لا يخاف أبداً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الخوف إنذار طبيعي يحمي الجسم، والشجاع يخاف ثم يتصرف بحكمة.","level":"A","rubric":"R1"},{"id":"U08.L04.C3","objective":"U08.L04.O3","type":"true_false_why","prompt":"«يعود القلب إلى هدوئه في لحظة زوال الخطر». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ مكابح الهدوء تحتاج وقتاً، فيبقى القلب سريعاً قليلاً بعد الفزع، والتنفس البطيء يساعد.","level":"A","rubric":"R1"},{"id":"U08.L04.C4","objective":"U08.L04.O4","type":"explain_open","prompt":"قال أحمد: «المقلب المرعب مزاح، والكل يضحك بعده». {أجبه|أجيبيه} بالعلم والقيمة.","answer":"العلم: الفزع المفاجئ يطلق إنذاراً كاملاً في الجسم، وقد يسقط المفزوع أو يتأذى قلبه نادراً. القيمة: نهى النبي ﷺ عن ترويع المسلم ولو مزاحاً، والأذى ممنوع مع كل إنسان؛ والمزاح الجميل يضحك منه الجميع.","level":"A","rubric":"R2"},{"id":"U08.L04.C5","objective":"U08.L04.O1","type":"true_false_why","prompt":"«عند الخوف يتسع البؤبؤ ويجف الفم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ هذا من استجابة الخطر: البؤبؤ يتسع ليُدخل ضوءاً أكثر، واللعاب يقلّ مع تباطؤ الهضم.","level":"A","rubric":"R1"},{"id":"U08.L04.C6","objective":"U08.L04.O5","type":"fix_model","prompt":"كتب زميل{ك|تكِ}: «الخوف في القلب، ولذلك يدق بقوة». {صحّح|صحّحي}.","answer":"الإنذار يبدأ في الدماغ (اللوزة)، فتطلق الغدتان الكظريتان الأدرينالين، فيسرع القلب؛ والقلب لا يخاف، بل نحسّ خفقانه.","level":"B","rubric":"R1"},{"id":"U08.L04.C7","objective":"U08.L04.O6","type":"explain_open","prompt":"في تجربة النبض: ما الذي يجب أن يبقى كما هو بين الطريقتين؟ ولماذا لم نُخف أحداً بدل القفز؟","answer":"يبقى القفز دقيقة واحدة، والجلوس دقيقتين، وطريقة عدّ النبض، والشخص نفسه، والراحة بين المرتين؛ ونغيّر طريقة التنفس وحدها. ولم نُخف أحداً لأن الترويع منهي عنه وقد يؤذي، والقفز يرفع النبض بلا أذى.","level":"B","rubric":"R2"}],"concepts":[{"id":"danger_response","term":{"ar":"استجابة الخطر","en":"Fight-or-flight response","zh":"战斗或逃跑反应","pinyin":"zhàndòu huò táopǎo fǎnyìng","match":["استجابة الخطر","استجابة الخوف"]},"priority":"core","atlas":{"layer":"body","element":"stress_response"},"card":{"A":"تغيّرات سريعة في الجسم كله حين يحسّ الدماغ بخطر، تجهزه للهرب أو الدفاع: القلب والتنفس أسرع، والعضلات مشدودة، والهضم يتباطأ.","B":"يسميها العلماء «القتال أو الهروب»، وقد يتجمد معها المرء لحظة؛ وتعمل الاستجابة نفسها في الغضب، وقد تبدأ قبل أن نفهم ما رأينا."}},{"id":"adrenaline","term":{"ar":"الأدرينالين","en":"Adrenaline","zh":"肾上腺素","pinyin":"shènshàngxiànsù","match":["الأدرينالين","أدرينالين"]},"priority":"core","atlas":{"layer":"glands","element":"adrenaline"},"card":{"A":"مادة تطلقها غدتان صغيرتان فوق الكليتين في الدم حين نخاف أو نغضب، فتجعل القلب أسرع والتنفس أسرع، وتُخرج السكر من مخزنه للطاقة.","B":"يسميه العلماء أيضاً الإبينفرين؛ ويرفع ضغط الدم، ويوسّع مجاري الهواء، ويجعل الحواس أشد انتباهاً."}},{"id":"calm_brake","term":{"ar":"مكابح الهدوء","en":"Rest-and-digest response","zh":"休息与消化反应","pinyin":"xiūxi yǔ xiāohuà fǎnyìng","match":["مكابح الهدوء","المكابح"]},"priority":"core","atlas":{"layer":"nervous","element":"parasympathetic"},"card":{"A":"عمل في الجهاز العصبي يعيد الجسم إلى الهدوء بعد زوال الخطر: يبطئ القلب والتنفس ويعيد الهضم؛ ويساعده التنفس البطيء بزفير طويل.","B":"يسميه العلماء جهاز «الراحة والهضم»؛ وهو والجهاز الذي يسرّع الجسم كدواسة الوقود والمكابح في السيارة."}},{"id":"amygdala","term":{"ar":"اللوزة الدماغية","en":"Amygdala","zh":"杏仁核","pinyin":"xìngrénhé","match":["اللوزة الدماغية","اللوزة"]},"priority":"supporting","atlas":{"layer":"nervous","element":"amygdala"},"card":{"A":"جزء صغير في عمق الدماغ يعمل كجرس إنذار: يلتقط الخطر مما تراه العين وتسمعه الأذن، ويطلق الإنذار بسرعة.","B":"ترسل إنذارها إلى منطقة أخرى في الدماغ تشغّل الأعصاب التي تسرّع الجسم؛ وقد يبدأ ذلك قبل أن تكمل مناطق الرؤية فهم ما رأته."}},{"id":"adrenal_glands","term":{"ar":"الغدتان الكظريتان","en":"Adrenal glands","zh":"肾上腺","pinyin":"shènshàngxiàn","match":["الغدتان الكظريتان","الغدتين الكظريتين","الغدة الكظرية","الكظريتان","الكظريتين"]},"priority":"supporting","atlas":{"layer":"glands","element":"adrenal"},"card":{"A":"غدتان صغيرتان كالقبعة فوق الكليتين، تطلقان الأدرينالين في الدم حين يأمرهما الجهاز العصبي.","B":"وتطلقان هرموناً آخر يُبقي الجسم متيقظاً ما دام الخطر قائماً، ثم يقلّ حين يزول."}}],"experiment":{"title":"النبض يعلو ثم يهدأ: ما الذي يهدّئه أسرع؟","materials":["ساعة أو مؤقت بالثواني","مكان آمن للقفز","جدول التجربة في الدفتر"],"steps":["اجلس{|ي} دقيقتين بهدوء، ثم {عُدّ|عُدّي} نبضك{|ِ} في الرسغ 30 ثانية و{اضرب|اضربي} العدد في 2: هذا نبض الراحة.","{اقفز|اقفزي} في مكانك{|ِ} دقيقة واحدة، ثم {عُدّ|عُدّي} نبضك{|ِ} فوراً 30 ثانية و{اضرب|اضربي} في 2.","الطريقة الأولى: اجلس{|ي} دقيقتين {تتنفس|تتنفسين} كعادتك{|ِ}، ثم {عُدّ|عُدّي} نبضك{|ِ}.","{استرح|استريحي} خمس دقائق حتى يقترب النبض من أوله، ثم {أعد|أعيدي} القفز دقيقة و{عُدّ|عُدّي} نبضك{|ِ} فوراً.","الطريقة الثانية: اجلس{|ي} دقيقتين {تتنفس|تتنفسين} ببطء: شهيق من الأنف وأنت{|ِ} {تعدّ|تعدّين} إلى 4، وزفير طويل من الفم وأنت{|ِ} {تعدّ|تعدّين} إلى 6. ثم {عُدّ|عُدّي} نبضك{|ِ}. قارن{|ي}: بعد أي الطريقتين كان النبض أقرب إلى نبض الراحة؟"],"safety":["لا نخيف أحداً لنقيس خوفه، ولا نفاجئ أحداً بصوت أو حركة؛ نرفع النبض بالقفز بدل الخوف.","ليست مسابقة؛ لا نقارن أرقام الأطفال، والاختلاف بينهم طبيعي.","توقف{|ي} فوراً واجلس{|ي} إن أحسست{|ِ} بدوار أو ألم أو ضيق نفس، و{أخبر|أخبري} الكبار؛ والإغماء أو ألم الصدر يُعرض على طبيب.","من عنده حالة معروفة في القلب أو التنفس يكتفي بالجزء الجالس (نبض الراحة والتنفس البطيء) باتفاق ولي الأمر، ومن يستعمل بخّاخ ربو يكون معه.","لا تُجرى في جو حار أو بعد صيام طويل؛ ونعدّ النبض في الرسغ لا في العنق."],"expected":"يرتفع النبض بعد القفز ثم ينخفض في الطريقتين. وقد يكون أقرب إلى نبض الراحة بعد التنفس البطيء، وقد لا يظهر فرق واضح في مرة واحدة: نسجّل ما نجده بأمانة، ونقارن بأرقام من أعاد التجربة أياماً.","explain":"القفز، كالخوف، يسرّع القلب لأن الجسم يحتاج ويستعد؛ وحين يزول السبب تعمل مكابح الهدوء فيعود النبض، لكنه يحتاج وقتاً. والزفير الطويل البطيء يساعد هذه المكابح. والتجربة لا تقيس الخوف نفسه، بل عودة الجسم إلى الهدوء؛ ولم نخف أحداً لنعرف ذلك.","record":"نبض الراحة ___ — بعد القفز (1) ___ وبعد دقيقتين عاديتين ___ — بعد القفز (2) ___ وبعد دقيقتين بتنفس بطيء ___","alternatives":["من لا يستطيع القفز: يصعد درجات ويهبطها دقيقة بهدوء، أو يكتفي بقياس نبض الراحة قبل التنفس البطيء وبعده.","من لا يجد نبضه: يضع كفه على منتصف صدره مائلاً إلى اليسار ويعدّ، أو يستعمل أرقام طفل في المشهد."]},"find_the_error":[{"id":"FE1","atlas_variant":"fear_in_heart","error":"رسم قلب مكتوب عليه: هنا يبدأ الخوف","answer":"الإنذار يبدأ في الدماغ، والقلب يسرع بأمر الأعصاب والأدرينالين","detects":"M07"},{"id":"FE2","atlas_variant":"fear_digestion_fast","error":"سهم عند المعدة مكتوب عليه: الخوف يسرّع الهضم","answer":"الخوف يبطئ الهضم أو يوقفه؛ والدم يتجه إلى العضلات"},{"id":"FE3","atlas_variant":"vent_anger","error":"ملصق في الصف: إذا غضبت فاضرب الوسادة لتفرغ غضبك","answer":"التنفس البطيء والهدوء وأخذ مهلة تخفف الغضب؛ والضرب لا يخففه وقد يزيده","detects":"M92"}],"numbers":[{"text":"قد تقفز{|ين} من أمام دراجة مسرعة قبل أن {تفهم|تفهمي} ما رأيت{|ِ}: الإنذار أسرع من الفهم.","source":["S1"]},{"text":"154 دراسة وأكثر من عشرة آلاف شخص: الغضب يخففه الهدوء، لا ضرب الوسادة.","source":["S6"]}],"true_size":[],"animal":{"text":"القطة الخائفة تنفش فروها فتبدو أكبر، بعضلات صغيرة عند أصل كل شعرة. ونحن نملك هذه العضلات أيضاً: حين نخاف أو نبرد تنقبض فتقف الشعرات وتظهر القشعريرة؛ لكن شعرنا قليل فلا نبدو أكبر.","source":["S7"]},"organ_letter":{"from":"الغدتان فوق كليتيك{|ِ}","text":"مرحباً، نحن الغدتان الصغيرتان، نجلس كقبعتين فوق كليتيك{|ِ}. حين يرنّ جرس الإنذار في دماغك{|ِ} تصلنا رسالة في الأعصاب، فنطلق الأدرينالين في دمك{|ِ}، فيسرع قلبك{|ِ} وتشتد عضلاتك{|ِ} لتهرب{|ي} أو {تدافع|تدافعي} عن نفسك{|ِ}. نحن نعمل لحمايتك{|ِ}، ولا {تخجل|تخجلي} من خوفك{|ِ}. لكننا نتعب إذا رنّ الجرس كثيراً بلا خطر؛ فإذا انتهى الخطر {تنفّس|تنفّسي} ببطء، و{دعنا|دعينا} نرتاح. وأرجوك{|ِ}: لا {تجعلنا|تجعلينا} نعمل في جسم أخيك{|ِ} بمقلب مرعب؛ له غدتان مثلنا، وقلب لا {تعرف|تعرفين} كل ما فيه."},"history":[{"who":"والتر برادفورد كانون","origin":"الولايات المتحدة","where_when":"جامعة هارفارد، كتابه سنة 1915 (1871–1945)","did":"درس الهضم في الحيوانات بالأشعة السينية بعد طعام يظهر في الصور، فلاحظ أن حركة المعدة تتوقف تماماً مع علامات الخوف أو الغضب؛ وتتبّع تغيّرات الجسم كله في الألم والجوع والخوف والغضب، ووصف تجهّزه للقتال أو الهروب، ثم سمّى ميل الجسم إلى التوازن «الاتزان الداخلي».","did_not":"لم يعرف دور اللوزة في الدماغ، ولا كل الهرمونات التي تشارك؛ وكثير من تجاربه على الحيوان لا تُجرى اليوم إلا بقواعد صارمة للرفق به.","method_lesson":"ملاحظة غريبة (معدة تتوقف) تقود إلى سؤال كبير (ماذا يفعل الخوف بالجسم كله؟).","source":["S3","S4"]}],"how_we_know":{"text":"كيف عرفنا أن الخوف يوقف الهضم؟ قبل أكثر من مئة سنة كان العالم الأمريكي والتر كانون يدرس الهضم بالأشعة السينية، بعد أن يأكل الحيوان طعاماً فيه مادة تظهر في صور الأشعة، فيرى المعدة تتحرك وتعصر. ولاحظ شيئاً غريباً: إذا غضب الحيوان أو خاف توقفت حركة معدته تماماً. فسأل: لماذا؟ وتتبّع ما يحدث في الجسم كله عند الخوف والغضب، وكتب ذلك في كتاب سنة 1915، ووصف كيف يتجهز الجسم للقتال أو الهروب. واليوم لا تُجرى التجارب على الحيوان إلا بقواعد تحميه من الأذى. ونحن في تجربتنا لا نخيف أحداً لنقيس خوفه؛ نرفع النبض بالقفز، ونقيس كيف يعود.","limit_question":"ما الذي لا تقيسه تجربة القفز من الخوف نفسه؟"},"what_changed":["كان كثيرون يظنون أن الخوف والمشاعر في القلب؛ ونعرف اليوم أن الإنذار يبدأ في الدماغ، والقلب يسرع بأمره.","انتشرت فكرة أن «تفريغ» الغضب بالضرب أو الصراخ يهدّئه؛ ومراجعة 154 دراسة سنة 2024 وجدت أن الهدوء يخففه والتفريغ لا يخففه.","ظُنّ أن الخوف الشديد لا يؤذي إلا في الخيال؛ والأطباء يعرفون اليوم أن الفزع المفاجئ قد يؤذي القلب نادراً."],"model_limits":["رسم الجسم عند الخوف يُظهر التغيّرات كلها معاً؛ في الحقيقة تحدث بسرعات مختلفة، وقد لا تظهر كلها عند كل الناس.","«جرس الإنذار» تشبيه: في الدماغ مناطق كثيرة تعمل معاً.","التجربة ترفع النبض بالقفز لا بالخوف؛ وتُظهر عودة الجسم إلى الهدوء، لا الخوف نفسه.","الأسهم في الرسم توحي بأن كل شيء يحدث بالترتيب؛ كثير منه يحدث في الوقت نفسه."],"faith":{"opening":null,"closing":{"text":"حدّثنا أصحاب محمد ﷺ أنهم كانوا يسيرون مع النبي ﷺ، فنام رجل منهم، فانطلق بعضهم إلى حبل معه فأخذه، ففزع، فقال رسول الله ﷺ: «لا يحلّ لمسلم أن يروّع مسلماً»","reference":"أبو داود 5004","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم بالعلم ما يفعله الفزع المفاجئ في الجسم: إنذار كامل وقلب يدق بقوة، وقد يسقط المفزوع أو يتأذى. والحديث الذي أمامك{|ِ} يحكي أن رجلاً من الصحابة نام في سفر، فأخذ بعض أصحابه حبله فاستيقظ فزعاً؛ فنهى النبي ﷺ أن يروّع المسلم أخاه. هذا هو الحكم من النص، والعلم يُرينا شيئاً من أثره في الجسم، والحكمة بلغتنا: المزاح الجميل يضحك منه الجميع، والذي يفزع به أحد ليس مزاحاً. والأذى ممنوع مع كل إنسان، مسلماً كان أو غير مسلم، كما في نهيه ﷺ عن الضرر (ابن ماجه 2341). والعلم لا يُثبت الحديث، والحديث لا يشرح الأدرينالين؛ لكن كليهما يدلنا على الرفق. ما المزاح الذي {تختاره|تختارينه} هذا الأسبوع ليضحك منه الجميع؟","reviewed":false,"hadith_key":"abudawud:5004","highlight":"لا يحلّ لمسلم أن يروّع مسلماً","level":"نهي","concept":"لا يحل ترويع المسلم ولو مزاحاً، والأذى ممنوع مع كل إنسان.","avoid":"لا نقول إن العلم أثبت الحديث أو إن الحديث يصف الأدرينالين؛ ولا نخيف الطفل من أن كل فزع قاتل: الأذى الشديد نادر، والنهي قائم لأن الترويع أذى في ذاته.","lead":"عن عبد الرحمن بن أبي ليلى قال:","narration":true,"source":"أبو داود 5004","grader":"صحّحه الألباني","cards":[]}},"life":[{"situation":"أخذ أخي لعبتي فغضبت جداً، وأحسست بقلبي يدق ويدي مشدودة، وأردت أن أضربه.","science":"الغضب يشغّل استجابة الخطر نفسها: أدرينالين وقلب سريع وعضلات مشدودة، فيصعب التفكير الهادئ. ومراجعة 154 دراسة وجدت أن التنفس العميق وأخذ مهلة يخففان الغضب، وأن «التفريغ» بالضرب لا يخففه.","action":"أبتعد خطوة، وأتنفس ببطء بزفير طويل وأنا أعدّ إلى ستة، ثم أطلب لعبتي بكلام هادئ، وإن لم يردّها أخبر أحد الكبار.","value":"ضبط النفس عند الغضب.","why":"لماذا أهدأ قبل أن أتكلم؟ لأن الجسم الغاضب مستعد للعراك لا للتفكير، والتنفس البطيء يساعد مكابح الهدوء. ورجل طلب من النبي ﷺ وصية فأوصاه ألا يغضب، وردّد ذلك مراراً، كما في البطاقة.","reference":"البخاري 6116","hadith":["bukhari:6116"],"cards":[{"key":"bukhari:6116","lead":"عن أبي هريرة رضي الله عنه:","text":"أن رجلاً قال للنبي ﷺ: أوصني، قال: «لا تغضب»، فردّد مراراً، قال: «لا تغضب»","narration":true,"source":"البخاري 6116","grade":"صحيح","grader":""}],"verses":[]},{"situation":"صديقي يمسك سكين الفاكهة أو المقص ويلوّح به نحو وجهي ضاحكاً: أنا أمزح!","science":"الحركة المفاجئة بشيء حاد تطلق إنذار الخوف، وقد ينتفض المفزوع فيُصاب خطأً، ولا أحد يضمن يده في المزاح.","action":"أقول له بهدوء وحزم: لا نمزح بالسكين، وأبتعد، وأخبر الكبار إن تكرر. وأنا لا أوجّه شيئاً حاداً نحو أحد ولو مزاحاً.","value":"حفظ الإخوان من الفزع والأذى.","why":"لماذا لا يجوز ولو كان مزاحاً؟ لأن الأذى لا ينتظر النية: اليد قد تزلّ، والمفزوع قد ينتفض. والنبي ﷺ أخبر أن من أشار إلى أخيه بحديدة تلعنه الملائكة حتى يتركها، ولو كان أخاه الشقيق، كما في البطاقة.","reference":"مسلم 2616","hadith":["muslim:2616"],"cards":[{"key":"muslim:2616","lead":"عن أبي هريرة رضي الله عنه قال: قال أبو القاسم ﷺ:","text":"من أشار إلى أخيه بحديدة، فإن الملائكة تلعنه حتى يدعه، وإن كان أخاه لأبيه وأمه","narration":false,"source":"مسلم 2616","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يخاف بعض الناس من أشياء لا تؤذي، كالعناكب الصغيرة أو الأماكن العالية الآمنة، ولا يخاف غيرهم منها؟","why_open":"يعرف العلماء أن للتجربة والتعلم والوراثة دوراً، لكن كيف تتجمع هذه لتصنع خوف شخص بعينه ما زال يُبحث."}],"notebook":{"draw":"ارسم{|ي} جسمك{|ِ} حين {تخاف|تخافين}، وعلى كل جزء سهماً وكلمة: الدماغ (إنذار)، القلب (أسرع)، الرئتان (أسرع)، العضلات (مشدودة)، البؤبؤ (يتسع)، الفم (جاف)، المعدة (تتباطأ)، الغدتان فوق الكليتين (أدرينالين). ثم ارسم{|ي} بجانبه جسمك{|ِ} بعد الهدوء. المستوى ب: ارسم{|ي} سلسلة الإنذار من العين إلى القلب.","label":["جرس الإنذار في الدماغ","الأدرينالين","القلب","الرئتان","العضلات","البؤبؤ","المعدة","مكابح الهدوء","— ب: اللوزة والغدتان الكظريتان"],"write":"أشرح: لماذا يسرع قلبي حين أخاف؟ وكيف أهدّئه؟ ولماذا لا أصنع مقلباً مرعباً لأحد؟ وأكتب أرقام نبضي في التجربة."},"imgs":["U08.L04-E1","U08.L04-E2","U08.L04-E4","U08.L04-E6"]};
