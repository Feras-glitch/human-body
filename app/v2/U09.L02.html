const LD = {"id":"U09.L02","first":false,"title":"الحرارة: كيف يبقى جسمي دافئاً لا حاراً؟","driving_question":"{اسم}، في الصيف {تتعرق|تتعرقين}، وفي البرد يقشعر جلدك{|ِ}، وحرارة داخل جسمك{|ِ} في الحالين قريبة من 37 درجة. كيف يعرف جسمك{|ِ}؟ ولماذا ترتفع حين {تمرض|تمرضين}؟","central_fact":"حرارة داخل الجسم قريبة من 37 درجة، يقيسها جزء في قاع الدماغ ويُصلحها: في الحر يتعرق الجلد فيبرد بالتبخر وتتسع أوعيته، وفي البرد تضيق أوعيته ويقشعر وترتجف العضلات فتصنع حرارة؛ وفي العدوى يرفع الدماغ الحرارة فتكون الحمى.","next":"U09.L03","hook":{"text":"{اسم}، {لعبت|لعبتِ} الكرة في الشمس ساعة فصار وجهك{|ِ} أحمر وجلدك{|ِ} مبللاً. لماذا؟","options":["لأن جسمي يُخرج حرارته الزائدة ويبرّد نفسه","لأن الشمس صبغت وجهي باللون الأحمر","لأن جسمي يُخرج ما فيه من أوساخ","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous","body"],"highlight":["brain","skin"],"zoom":"body"},"text":"في الصيف تشتد الشمس، وفي الشتاء يشتد البرد، ومع ذلك تبقى حرارة داخل جسمك{|ِ} قريبة من 37 درجة. كيف؟ في قاع دماغك{|ِ} جزء صغير يعمل كمنظّم الحرارة في البيت: يقيس حرارة دمك{|ِ} ويقارنها بالقيمة المناسبة، فإن زادت أمر الجسم أن يبرد، وإن نقصت أمره أن يدفأ. والحرارة لا تثبت تماماً: هي أقل في الصباح الباكر وأعلى بعد العصر، وترتفع حين {تركض|تركضين}، وتختلف قليلاً بين الناس."},{"id":"E2","level":"A","atlas":{"layers":["skin","circulatory"],"highlight":["sweat_gland","skin_vessels"],"zoom":"skin_section"},"text":"حين يسخن جسمك{|ِ} يفعل شيئين. أولاً: غدد العرق في الأدمة تُخرج ماءً فيه قليل من الملح إلى سطح الجلد، فيتبخر، والماء حين يتبخر يأخذ معه دفء الجلد فيبرد. والعرق لا يُخرج السموم؛ عمله التبريد. ثانياً: الأوعية الدموية في الجلد تتسع، فيمرّ فيها دم أكثر قرب السطح ويخرج دفؤه، ولذلك يحمرّ وجهك{|ِ}. وفي الجو الرطب يتبخر العرق ببطء فيقلّ التبريد، فنرتاح ونشرب أكثر."},{"id":"E3","level":"A","atlas":{"layers":["skin","muscles"],"highlight":["skin_vessels","hair_muscle","muscles"],"zoom":"skin_section"},"text":"وحين يبرد جسمك{|ِ} يفعل العكس. تضيق أوعية الجلد فيمرّ فيها دم أقل، فيبقى الدفء في الداخل ويبدو الجلد شاحباً. وتنقبض عضلات صغيرة عند جذور الشعر فتقف الشعرات ويقشعر الجلد، فتحبس قليلاً من الهواء الدافئ. فإن لم يكف ذلك جاء الارتجاف: عضلاتك{|ِ} تنقبض بسرعة مرة بعد مرة، فتصنع حرارة تدفئك{|ِ}. والملابس تساعد: تحبس هواءً دافئاً حول جسمك{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["nervous","blood"],"highlight":["brain","white_cells"],"zoom":"body"},"text":"حين تدخل الجسم ميكروبات تُمرضه، قد يرفع الدماغ الحرارة إلى نحو 38 أو أكثر: هذه الحمّى. تبدو غريبة، لكنها في الغالب علامة أن جسمك{|ِ} يقاوم، وتساعده على المقاومة. وقد يحسّ المحموم بالبرد ويرتجف وحرارته ترتفع، لأن جسمه يحفظ دفأه حتى يبلغ الرقم الجديد. وما يهم ليس الرقم وحده بل حالك{|ِ}: هل {تشرب|تشربين}؟ هل {تتنفس|تتنفسين} بسهولة؟ لذلك {أخبر|أخبري} أهلك{|ِ}، و{اشرب|اشربي} كثيراً، و{ارتح|ارتاحي}، ولا {تأخذ|تأخذي} دواءً وحدك{|ِ}: الدواء من الأهل والطبيب."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["head","muscles","skin"],"zoom":"body"},"text":"قد يتعب الجسم من حرّ أكثر مما يستطيع تبريده، كمن يلعب طويلاً في شمس الظهر بلا ماء ولا راحة: هذا الإنهاك الحراري. من علاماته دوار وصداع وغثيان، وتشنج في العضلات، وجلد شاحب يتعرق. ما العمل؟ {انتقل|انتقلي} إلى الظل أو مكان بارد، و{ارتح|ارتاحي}، و{اشرب|اشربي}، و{أخبر|أخبري} كبيراً فوراً. وإن صار أحد مشوشاً لا يعرف أين هو، فاطلبوا الإسعاف. والوقاية أسهل: الشرب قبل اللعب وفي أثنائه، وراحة في الظل، وملابس فاتحة واسعة."},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["hypothalamus"],"zoom":"head"},"text":"للمستوى ب: الجزء الذي يضبط الحرارة اسمه تحت المهاد، وهو نفسه يشارك في العطش. والحرارة الحقيقية حرارة الدماغ والأعضاء الداخلية، ولا نقيسها مباشرة؛ فالميزان في الفم أو الأذن أو على الجبهة أو تحت الإبط يقرأ أرقاماً مختلفة قليلاً. ورقم 37 جاء من أكثر من مليون قراءة جمعها الطبيب فوندرليش سنة 1868، ثم وجدت دراسة سنة 2023 أن متوسط الكبار اليوم نحو 36.6. والأطفال الصغار يتعرقون أبطأ، فيسخنون أسرع في الحر."}],"practice":[{"id":"U09.L02.P1","after":"E1","objective":"U09.L02.O1","type":"choose_reason","prompt":"قاس طفل حرارته في السابعة صباحاً فكانت 36.4، وفي الرابعة عصراً فكانت 36.9. ماذا يعني ذلك؟","options":["أنه مريض في العصر","أن الحرارة تتغير قليلاً خلال اليوم، وهذا طبيعي","أن الميزان معطّل لأن الحرارة لا تتغير أبداً","أنه لم يأكل في الصباح"],"answer":1,"explanation":"الحرارة أقل في الصباح الباكر وأعلى عصراً، والفرق القليل طبيعي.","level":"A","feedback_wrong":"متى تكون الحرارة أقل في اليوم؟","feedback_by_option":{"0":"36.9 ليست حرارة مرتفعة؛ المرض يرفعها إلى نحو 38 أو أكثر.","2":"الحرارة تتغير قليلاً، فلا يدل الفرق على عطل.","3":"ليس هذا سبب الفرق؛ ساعة اليوم تغيّر الحرارة."},"detects":"M20"},{"id":"U09.L02.P2","after":"E2","objective":"U09.L02.O2","type":"choose_reason","prompt":"لماذا يبرّدنا العرق؟","options":["لأنه يُخرج السموم الحارة من الدم","لأن الماء حين يتبخر عن الجلد يأخذ معه دفأه","لأنه بارد حين يخرج من الجسم","لأنه يُغلق الأوعية في الجلد"],"answer":1,"explanation":"التبخر يأخذ الدفء من الجلد فيبرد.","level":"A","feedback_wrong":"تذكّر{|ي} المنديل المبلل والهواء.","feedback_by_option":{"0":"العرق ماء وأملاح، وعمله التبريد.","2":"يخرج بحرارة الجسم؛ التبخر هو الذي يبرّد.","3":"في الحر تتسع الأوعية لا تُغلق."},"detects":"M21"},{"id":"U09.L02.P3","after":"E3","objective":"U09.L02.O3","type":"choose","prompt":"{خرجت|خرجتِ} في يوم بارد جداً بلا معطف. ماذا يفعل جسمك{|ِ}؟","options":["يتعرق ليبرد أكثر","يوسّع أوعية الجلد ليخرج الدفء","يضيّق أوعية الجلد ويرتجف ليصنع حرارة","يرفع حرارته إلى 38 درجة"],"answer":2,"explanation":"في البرد تضيق أوعية الجلد ويقشعر الجلد وترتجف العضلات.","level":"A","feedback_wrong":"ما الذي يحفظ الدفء ويصنعه؟","feedback_by_option":{"0":"التعرق في الحر.","1":"هذا في الحر.","3":"هذا في الحمى، لا في البرد العادي."}},{"id":"U09.L02.P4","after":"E4","objective":"U09.L02.O4","type":"choose_reason","prompt":"أختك{|ِ} حرارتها 38.5 وهي تلعب وتشرب جيداً، وأخوك{|ِ} حرارته 38 ولا يريد أن يشرب ولا يستيقظ إلا بصعوبة. أيهما يحتاج الطبيب أسرع؟","options":["الأخت، لأن رقمها أعلى","الأخ، لأن حاله أسوأ: لا يشرب ويصعب إيقاظه","لا أحد، فالحمى لا تحتاج طبيباً أبداً","كلاهما مثل بعض، فالرقم متقارب"],"answer":1,"explanation":"حال الطفل أهم من الرقم وحده؛ والأهل يقررون متى يُطلب الطبيب.","level":"A","feedback_wrong":"ما الأهم: الرقم أم حال الطفل؟","feedback_by_option":{"0":"الرقم وحده لا يكفي؛ حالها جيد.","2":"بعض الحالات تحتاج طبيباً؛ والأهل يقررون.","3":"الحال مختلف جداً، فلا يتساويان."},"detects":"M100"},{"id":"U09.L02.P5","after":"E5","objective":"U09.L02.O4","type":"sequence","prompt":"صديقك{|ِ} لعب طويلاً في الشمس فصار يشعر بدوار وصداع. {رتّب|رتّبي} ما تفعلانه.","options":["تنتقلان إلى الظل","يجلس ويرتاح","يشرب ماءً","تخبر كبيراً فوراً"],"answer":[0,1,2,3],"explanation":"الظل، فالراحة، فالشرب، مع إخبار كبير؛ وإن صار مشوشاً فالإسعاف.","level":"A","feedback_wrong":"ما أول ما يبعده عن الحر؟"}],"check":[{"id":"U09.L02.C1","objective":"U09.L02.O1","type":"true_false_why","prompt":"«حرارة الجسم السليم 37 تماماً في كل ساعة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ هي قريبة من 37 وتتغير قليلاً: أقل في الصباح الباكر وأعلى عصراً، وترتفع مع الرياضة، وتختلف بين الناس.","level":"A","rubric":"R1"},{"id":"U09.L02.C2","objective":"U09.L02.O2","type":"explain_open","prompt":"{اذكر|اذكري} شيئين يفعلهما الجسم في الحر، و{قل|قولي} كيف يبرّده كل منهما.","answer":"يتعرق فيتبخر العرق ويأخذ دفء الجلد؛ وتتسع أوعية الجلد فيمرّ دم أكثر قرب السطح ويخرج دفؤه.","level":"A","rubric":"R1"},{"id":"U09.L02.C3","objective":"U09.L02.O3","type":"explain_open","prompt":"لماذا {ترتجف|ترتجفين} حين {تخرج|تخرجين} من الماء البارد؟","answer":"الدماغ يحسّ أن الجسم يبرد فيأمر العضلات أن تنقبض بسرعة مرة بعد مرة، فتصنع حرارة تدفئ الجسم؛ وتضيق أوعية الجلد لتحفظ الدفء.","level":"A","rubric":"R1"},{"id":"U09.L02.C4","objective":"U09.L02.O4","type":"fix_model","prompt":"قال طفل: «حرارتي ارتفعت قليلاً، سآخذ دواءً من الخزانة وحدي ولن أخبر أحداً». {صحّح|صحّحي} له.","answer":"يخبر أهله فوراً، ويشرب ويرتاح؛ والدواء من الأهل أو الطبيب فقط، لأنهم يعرفون ما يناسبه وكميته، والحمى غالباً علامة على مقاومة الجسم.","level":"A","rubric":"R1"},{"id":"U09.L02.C5","objective":"U09.L02.O2","type":"true_false_why","prompt":"«في الجو الرطب جداً يبرّدنا العرق أقل». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في الهواء الرطب يتبخر العرق ببطء، والتبريد يأتي من التبخر، فنرتاح ونشرب أكثر.","level":"A","rubric":"R1"},{"id":"U09.L02.C6","objective":"U09.L02.O5","type":"explain_open","prompt":"قاس طفل حرارته مرة واحدة على جبهته فوجدها 37.6، فقال: «عندي حمى». ماذا {تنصحه|تنصحينه} ولماذا؟","answer":"قراءة واحدة من الجبهة تختلف عن الحرارة الداخلية، والحرارة تتغير بالساعة والنشاط؛ يرتاح ويعيد القياس بعد قليل، ويخبر أهله إن ارتفعت إلى نحو 38 أو أحسّ بتعب.","level":"B","rubric":"R1"}],"concepts":[{"id":"sweat_gland","term":{"ar":"غدة العرق","en":"Sweat gland","zh":"汗腺","pinyin":"hànxiàn","match":["غدة العرق","غدد العرق"]},"priority":"core","atlas":{"layer":"skin","element":"sweat_gland"},"card":{"A":"أنبوب صغير ملتفّ في الأدمة يُخرج العرق إلى سطح الجلد؛ والعرق ماء وأملاح، يتبخر فيأخذ معه دفء الجلد فيبرد.","B":"في جلد الإنسان ملايين منها، ومئات في كل مربع صغير من الجلد بحجم طابع البريد."}},{"id":"shivering","term":{"ar":"الارتجاف","en":"Shivering","zh":"发抖","pinyin":"fādǒu","match":["الارتجاف"]},"priority":"core","atlas":{"layer":"muscles","element":"shivering"},"card":{"A":"انقباضات سريعة متكررة في العضلات بأمر من الدماغ حين يبرد الجسم، تصنع حرارة تدفئه.","B":"العضلة تطلق الطاقة وهي تنقبض، وجزء منها يخرج حرارة، كما {عرفت|عرفتِ} في درس الطاقة."}},{"id":"fever","term":{"ar":"الحمّى","en":"Fever","zh":"发烧","pinyin":"fāshāo","match":["الحمى","حمى"]},"priority":"core","atlas":{"layer":"nervous","element":"fever_setpoint"},"card":{"A":"ارتفاع حرارة الجسم إلى نحو 38 درجة أو أكثر، لأن الدماغ يرفعها حين يقاوم الجسم عدوى؛ وهي علامة على المقاومة، وتُخبَر بها الأسرة.","B":"مواد يصنعها الجسم حين يقاوم الميكروبات تجعل الدماغ يضبط الحرارة على رقم أعلى، فيحفظ الجسم دفأه حتى يبلغه."}},{"id":"heat_exhaustion","term":{"ar":"الإنهاك الحراري","en":"Heat exhaustion","zh":"热衰竭","pinyin":"rè shuāijié","match":["الإنهاك الحراري"]},"priority":"supporting","atlas":{"layer":"body","element":"heat_exhaustion"},"card":{"A":"تعب يصيب من بقي طويلاً في حر شديد أو لعب فيه بلا ماء ولا راحة: دوار وصداع وغثيان وتشنج في العضلات وجلد شاحب يتعرق. علاجه الظل والراحة والسوائل، وطلب الكبار.","B":"إن صار المرء مشوشاً لا يعرف أين هو، أو جلده حار جاف، فتلك حالة أخطر تحتاج إسعافاً فوراً."}},{"id":"hypothalamus","term":{"ar":"تحت المهاد","en":"Hypothalamus","zh":"下丘脑","pinyin":"xiàqiūnǎo","match":["تحت المهاد"]},"priority":"supporting","atlas":{"layer":"nervous","element":"hypothalamus"},"card":{"A":"جزء صغير في قاع الدماغ يقيس حرارة الدم ويقارنها بالقيمة المناسبة، فيأمر الجسم أن يتعرق أو يرتجف.","B":"ويشارك أيضاً في العطش والجوع والنوم؛ وهو نفسه الذي مرّ في درس الخوف."}}],"experiment":{"title":"التبخر يبرّد: منديل مبلل ومنديل جاف","materials":["منديلان من قماش أو ورق","كوب ماء بحرارة الغرفة","مروحة ورقية أو كرتون للتهوية","ميزانا حرارة رقميان إن وُجدا (اختياري)"],"steps":["{بلّل|بلّلي} منديلاً بماء بحرارة الغرفة و{اعصره|اعصريه} جيداً، و{ضعه|ضعيه} على ظهر يدك{|ِ} اليمنى، و{ضع|ضعي} المنديل الجاف على ظهر اليسرى.","{حرّك|حرّكي} الهواء على اليدين معاً بالمروحة الورقية دقيقتين.","{انزع|انزعي} المنديلين، و{المس|المسي} خدّك{|ِ} بظهر كل يد: أيهما أبرد؟","إن وُجد ميزانا حرارة: {لفّ|لفّي} طرف أحدهما بمنديل مبلل والآخر بمنديل جاف، و{حرّك|حرّكي} الهواء عليهما خمس دقائق، ثم {اقرأ|اقرئي} الرقمين.","{سجّل|سجّلي} ما {أحسست|أحسستِ} به وما قرأته."],"safety":["ماء بحرارة الغرفة لا ساخن ولا مثلّج.","ميزان رقمي أو ميزان غرفة فقط؛ لا ميزان زئبق ولا زجاج.","نمسح الماء المنسكب كي لا ينزلق أحد."],"expected":"اليد التي كان عليها المنديل المبلل أبرد؛ وإن استُعمل ميزانان فالملفوف بالمبلل يقرأ أقل من الجاف بدرجة أو أكثر، ويزيد الفرق مع التهوية وفي الهواء الجاف.","explain":"الماء حين يتبخر يأخذ معه دفئاً من المنديل ومن الجلد تحته، فيبرد. وهذا ما يفعله عرقك{|ِ}: يتبخر عن جلدك{|ِ} فيبرّدك{|ِ}؛ والهواء المتحرك يسرّع التبخر، والهواء الرطب يبطئه.","record":"اليد الأبرد: ___ — الميزان الجاف ___ درجة، الميزان المبلل ___ درجة — الفرق ___","alternatives":["بدل المنديل: نقطة ماء على ظهر اليد ونقطة لا شيء على الأخرى، ثم النفخ عليهما.","من لا يستطيع التجربة: أرقام ميزانين في المشهد قبل التهوية وبعدها."]},"find_the_error":[{"id":"FE1","atlas_variant":"fixed_37","error":"لوحة: حرارة كل إنسان سليم 37 تماماً في كل ساعة","answer":"قريبة من 37 وتتغير قليلاً بالساعة والنشاط وبين الناس","detects":"M20"},{"id":"FE2","atlas_variant":"sweat_toxins","error":"سهم عند قطرة العرق مكتوب عليه: هنا تخرج السموم","answer":"العرق ماء وأملاح، وعمله التبريد بالتبخر","detects":"M21"},{"id":"FE3","atlas_variant":"fever_number_only","error":"لوحة: كلما ارتفع رقم الحمى زاد الخطر، ولا يهم حال الطفل","answer":"حال الطفل وشربه وتنفسه أهم من الرقم وحده؛ نخبر الأهل","detects":"M100"}],"numbers":[{"text":"رقم 37 جاء من أكثر من مليون قياس لنحو 25 ألف مريض قبل نحو 160 سنة.","source":["S8"]},{"text":"حرارتك{|ِ} في الصباح الباكر أقل منها في العصر: أعلى ما تكون نحو الساعة الرابعة بعد الظهر.","source":["S8"]}],"true_size":[{"text":"{أمسك|أمسكي} يد صديقك{|ِ} في يوم بارد: تبدو باردة، مع أن داخل جسمه قريب من 37. الجلد أبرد من الداخل، ولذلك يختلف الميزان بين الجبهة والفم.","source":["S1"]}],"animal":null,"organ_letter":{"from":"غدد العرق في جلدك{|ِ}","text":"مرحباً، نحن غدد العرق، ملايين الأنابيب الصغيرة الملتفة في جلدك{|ِ}. لا {تحبّ|تحبّين} عرقنا كثيراً، لكننا نعمل لأجلك{|ِ}: حين {تلعب|تلعبين} في الحر نُخرج ماءً قليلاً إلى سطح الجلد، فيتبخر ويأخذ معه الحرارة الزائدة، {فتبقى|فتبقين} {قريباً|قريبةً} من 37. نحتاج منك{|ِ} شيئاً واحداً: الماء. {اشرب|اشربي} قبل اللعب وفي أثنائه، و{استرح|استريحي} في الظل؛ فإن لم نجد ماءً تعبنا وتعبت{|ِ}. و{اغسل|اغسلي} جلدك{|ِ} بعد العرق، فرائحته من ميكروبات على الجلد، لا منا."},"history":[{"who":"كارل راينهولد أوغست فوندرليش","origin":"ألمانيا","where_when":"ألمانيا، نشر نتائجه سنة 1868","did":"جمع أكثر من مليون قراءة لحرارة نحو 25 ألف مريض، فخرج برقم 98.6 فهرنهايت، أي 37 درجة، الذي صار مرجعاً للأطباء والناس قرناً ونصفاً، وجعل قياس الحرارة عادة في فحص المريض.","did_not":"لم تكن موازينه كموازين اليوم، ولم يعرف أن متوسط الحرارة يختلف قليلاً بين زمن وزمن؛ ووجدت دراسة سنة 2023 من أكثر من ستمئة ألف قياس متوسطاً أقل قليلاً، نحو 36.6.","method_lesson":"القياس الكثير المتكرر يصنع رقماً نثق به، والقياس الجديد بأدوات أدق قد يصحّحه.","source":["S8"]}],"how_we_know":{"text":"كيف عرفنا أن حرارة الإنسان نحو 37؟ في سنة 1868 جمع الطبيب الألماني فوندرليش أكثر من مليون قراءة لنحو 25 ألف مريض، فخرج بالرقم الذي حفظه الناس قرناً ونصفاً. ثم جمع باحثون في جامعة ستانفورد سنة 2023 أكثر من ستمئة ألف قياس من الفم لكبار، فوجدوا المتوسط أقل قليلاً، نحو 36.6، ووجدوا أن ساعة اليوم أكثر ما يغيّره: أقل في الصباح الباكر وأعلى نحو العصر.","limit_question":"ما الذي لا تُظهره تجربة المنديل عن تبريد الجسم كله؟"},"what_changed":["حفظ الناس رقم 37 كأنه ثابت عند كل أحد؛ واليوم نعرف أن الحرارة الطبيعية مدى يختلف بالساعة والعمر والشخص، وأن متوسط الكبار اليوم أقل قليلاً.","كان كثيرون يخافون كل حمى؛ ويقول أطباء الأطفال اليوم إنها في الغالب علامة على مقاومة العدوى، وإن حال الطفل وشربه أهم من الرقم وحده."],"model_limits":["تشبيه «منظّم الحرارة في البيت» تقريب: الدماغ يستقبل رسائل من حسّاسات كثيرة في الجلد والدم، ويعمل مع أجزاء أخرى.","تجربة المنديل المبلل تُظهر التبريد بالتبخر وحده؛ الجسم يستعمل معه توسع الأوعية وأشياء أخرى معاً.","الرسم يُظهر العرق قطرات كبيرة؛ في الحقيقة أكثره يتبخر قبل أن نراه."],"faith":{"opening":null,"closing":{"text":"ما يصيب المسلم من نَصَب ولا وَصَب ولا همّ ولا حزن ولا أذى ولا غمّ، حتى الشوكة يُشاكها، إلا كفّر الله بها من خطاياه","reference":"البخاري 5641","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن الحمى في الغالب علامة أن الجسم يقاوم، وأن المرض يصيب الناس كلهم، الأقوياء والحريصين. والحديث في البطاقة يخبرنا أن ما يصيب المؤمن من تعب ومرض وهمّ، حتى الشوكة الصغيرة، لا يضيع عند الله. فالمرض ليس عيباً ولا علامة إهمال، والمريض يصبر ويطلب العلاج، ونحن نزوره ونخدمه. كيف {تهوّن|تهوّنين} على مريض في بيتك{|ِ}؟","reviewed":false,"hadith_key":"bukhari:5641","highlight":"حتى الشوكة يُشاكها، إلا كفّر الله بها من خطاياه","level":"خبر","concept":"المرض والتعب لا يضيعان عند الله، والصبر عليهما مع طلب العلاج خلق المؤمن؛ ولا لوم على مريض.","avoid":"لا نقول للطفل المريض إن مرضه بسبب ذنوبه، ولا نجعل الحديث سبباً لترك العلاج؛ ولا نربط الحمى نفسها بالحديث علمياً.","lead":"عن أبي سعيد الخدري وأبي هريرة رضي الله عنهما، عن النبي ﷺ قال:","narration":false,"source":"البخاري 5641","grader":"","cards":[]}},"life":[{"situation":"أخي الصغير حرارته مرتفعة، وهو يرتجف تحت البطانية، وأمي في المطبخ.","science":"الحمى في الغالب علامة أن جسمه يقاوم عدوى، وقد يحسّ بالبرد وحرارته ترتفع لأن جسمه يحفظ دفأه؛ وهو يفقد الماء أسرع، فيحتاج أن يشرب.","action":"أخبر أمي فوراً، وأحضر له الماء إن أذنت، ولا أعطيه دواءً من عندي، وأجلس معه أحكي له قصة، ثم أغسل يديّ.","value":"عيادة المريض والرحمة به.","why":"لماذا أخبر أمي ولا أعطيه دواءً؟ لأنها تعرف حاله وما يناسبه وكميته، والدواء الخطأ قد يؤذيه. ولماذا أجلس معه؟ لأن المريض يحتاج من يؤنسه، وقد أمرنا النبي ﷺ بعيادة المريض، كما في الحديث في البطاقة.","reference":"البخاري 5649","hadith":["bukhari:5649"],"cards":[{"key":"bukhari:5649","lead":"عن أبي موسى الأشعري رضي الله عنه قال: قال رسول الله ﷺ:","text":"أطعموا الجائع، وعودوا المريض، وفكّوا العاني","narration":false,"source":"البخاري 5649","grade":"صحيح","grader":""}],"verses":[]},{"situation":"في يوم صيفي حار لعبنا الكرة وقت الظهر، فقال صديقي إن رأسه يدور وإنه يريد أن يتقيأ.","science":"اللعب الطويل في الحر يجعل الجسم يسخن أكثر مما يبرّده العرق، ويفقد ماءً كثيراً، فيصيبه الإنهاك الحراري: دوار وصداع وغثيان.","action":"نتوقف عن اللعب وننتقل معه إلى الظل، ويجلس ويشرب الماء، وأنادي كبيراً فوراً؛ وفي المرة القادمة نلعب في الوقت الأبرد ونشرب قبل اللعب وفي أثنائه.","value":"حفظ النفس والأخذ بالأسباب، والإيثار: نترك الفوز لأجل الصديق.","why":"لماذا نتوقف ولو كنا سنفوز؟ لأن جسمه يحتاج أن يبرد ويستعيد ماءه، والاستمرار قد يزيد حاله سوءاً؛ وحفظ صحة الصديق أهم من أي مباراة.","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا صار متوسط حرارة الكبار اليوم أقل قليلاً مما قاسه فوندرليش؟","why_open":"يقترح العلماء أسباباً، منها اختلاف أدوات القياس وتغيّر صحة الناس وظروف حياتهم، ولم يُحسم السبب بعد."}],"notebook":{"draw":"ارسم{|ي} جسمك{|ِ} مرتين: في الحر وفي البرد. في رسم الحر: قطرات عرق وسهماً من الجلد إلى الهواء (تبخر)، ووجهاً أحمر وأوعية واسعة. وفي رسم البرد: جلداً شاحباً وشعرات واقفة، وعضلات تهتز، وأوعية ضيقة. وفي الرأس دائرة صغيرة: منظّم الحرارة. المستوى ب: اكتب{|ي} عند الدائرة «تحت المهاد».","label":["منظّم الحرارة في الدماغ","غدد العرق","تبخر","أوعية تتسع","أوعية تضيق","القشعريرة","الارتجاف","— ب: تحت المهاد"],"write":"أشرح: لماذا يحمرّ وجهي في الحر ويشحب في البرد؟ ولماذا أرتجف؟ وماذا أفعل إن أصابتني حمى أو أتعبني الحر؟ وأكتب نتيجة المنديلين."},"imgs":["U09.L02-E1","U09.L02-E2","U09.L02-E3","U09.L02-E4","U09.L02-E5","U09.L02-E6","U09.L02-exp","U09.L02-hist1","U09.L02-letter","U09.L02-life","U09.L02-title-boy","U09.L02-title-girl"]};
