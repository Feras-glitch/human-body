const LD = {"id":"U06.T04","lesson":"U06.L04","first":false,"title":"اختبار: الامتصاص ونهاية الطريق","lessonTitle":"الامتصاص ونهاية الطريق","concepts":[],"check":[],"items":[{"id":"U06.L04.A1.a","objective":"U06.L04.O1","level":"A","type":"choose_reason","prompt":"ما عمل الأمعاء الدقيقة الأهم؟","options":["تخزين الفضلات حتى نذهب إلى الحمام","طحن الطعام بعضلاتها كما تفعل الأسنان","صنع الصفراء التي تهضم الدهون","إكمال الهضم وامتصاص الغذاء إلى الدم"],"answer":3,"explanation":"الأمعاء الدقيقة تُكمل الهضم وتمتص الغذاء إلى الدم.","feedback_by_option":{"0":"الأمعاء الدقيقة ليست أنبوب فضلات؛ فيها يكتمل معظم الهضم ويعبر الغذاء إلى الدم.","1":"عضلات الأمعاء تدفع الطعام وتخلطه، ولا تطحنه كالأسنان.","2":"الصفراء يصنعها الكبد، وهي تفتّت الدهون ولا تهضمها."},"detects":"M55","alt":{"prompt":"قطعة خبز {أكلتها|أكلتِها}: أين يعبر غذاؤها إلى دمك{|ِ}؟","options":["في الأمعاء الغليظة","في المعدة","في الأمعاء الدقيقة","في الفم"],"answer":2,"explanation":"في الأمعاء الدقيقة يكتمل الهضم ويعبر الغذاء جدار الخملات إلى الدم؛ هناك يصير الطعام جزءاً منك{|ِ}.","feedback_by_option":{"0":"الغليظة تمتص الماء مما بقي.","1":"المعدة تخلط وتبدأ الهضم؛ والامتصاص بعدها.","3":"في الفم يبدأ الهضم، ولا يُمتص الغذاء هناك."},"detects":"M55"}},{"id":"U06.L04.A1.b","objective":"U06.L04.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة السكر من الأمعاء.","options":["يعبر جدار الخملة","يدخل شعيرة دموية","يصل الكبد","يصل القلب ثم الخلايا"],"answer":[0,1,2,3],"explanation":"يعبر السكر جدار الخملة إلى شعيرة دموية، فيصل الكبد أولاً، ثم القلب الذي يدفعه إلى الخلايا.","alt":{"prompt":"رتّب{|ي} رحلة لقمة الخبز من الفم إلى الدم.","options":["الفم: مضغ ولعاب","المريء: موجة عضلية","المعدة: خلط","الأمعاء الدقيقة: هضم كامل","الخملة: عبور إلى الدم"],"answer":[0,1,2,3,4],"explanation":"في الفم يبدأ الهضم، ثم يدفع المريء اللقمة إلى المعدة فتخلطها، ثم يكتمل الهضم في الأمعاء الدقيقة، ويعبر الغذاء جدار الخملات إلى الدم."}},{"id":"U06.L04.A1.c","objective":"U06.L04.O1","level":"A","type":"true_false_why","prompt":"«الطعام المهضوم يدخل الدم من الأمعاء الدقيقة لا من المعدة». صح أم خطأ؟","answer":"صح؛ بعد اكتمال الهضم، عبر الخملات وشعيراتها.","rubric":"R1","alt":{"prompt":"«السكر الذي يُمتص في الأمعاء يذهب في الدم إلى الكبد أولاً، ثم إلى القلب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ دم الأمعاء يمرّ بالكبد قبل القلب، فيخزّن الكبد الفائض ويعالج ما دخل."}},{"id":"U06.L04.A2.a","objective":"U06.L04.O2","level":"A","type":"explain_open","prompt":"لماذا تمتص المنشفة أكثر من الورقة؟ وما علاقة ذلك بأمعائك{|ِ}؟","answer":"نتوءاتها تجعل سطحها الحقيقي أكبر؛ الخملات تفعل الشيء نفسه في الأمعاء.","rubric":"R1"},{"id":"U06.L04.A2.b","objective":"U06.L04.O2","level":"A","type":"choose","prompt":"طول الأمعاء الدقيقة في الكبار نحو:","options":["نصف متر","متر واحد","3 إلى 5 أمتار","50 متراً"],"answer":2,"explanation":"طول الأمعاء الدقيقة في الكبار نحو 3 إلى 5 أمتار في الجسم الحي.","feedback_by_option":{"0":"الأمعاء الدقيقة أطول بكثير، وهي ملفوفة في البطن؛ طولها يعطيها سطحاً أكبر.","1":"الأمعاء الدقيقة أطول بكثير، وهي ملفوفة في البطن؛ طولها يعطيها سطحاً أكبر.","3":"50 متراً أطول بكثير من الحقيقة؛ هي ملفوفة، لكنها ليست بهذا الطول."},"detects":"M63","alt":{"prompt":"لماذا تلتفّ الأمعاء الدقيقة في البطن؟","options":["لأنها قصيرة فتلتفّ لتبدو أطول","لأنها طويلة جداً والبطن صغير","لتطحن الطعام بالالتفاف","لأن الالتفاف يخزّن الطعام أياماً"],"answer":1,"explanation":"الأمعاء الدقيقة طويلة جداً، نحو 3 إلى 5 أمتار في الكبير، فتلتفّ في البطن كالخرطوم في صندوق؛ والطول يزيد السطح.","feedback_by_option":{"0":"الأمعاء ليست قصيرة؛ هي أطول منك{|ِ} مرات.","2":"الالتفاف لا يطحن؛ عضلات الأمعاء تدفع الطعام وتخلطه.","3":"الأمعاء لا تخزّن الطعام أياماً."},"detects":"M63"}},{"id":"U06.L04.A2.c","objective":"U06.L04.O2","level":"A","type":"true_false_why","prompt":"«الخملات في الأمعاء كالحويصلات في الرئة». صح أم خطأ؟","answer":"صح؛ كلاهما يزيد السطح للتبادل عبر جدار رقيق بشعيرات.","rubric":"R1","alt":{"prompt":"«لو كانت الأمعاء الدقيقة ملساء من الداخل بلا خملات، لامتصّت الغذاء أسرع». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الخملات تزيد السطح الذي يعبر منه الغذاء؛ فبدونها يقلّ السطح ويبطؤ الامتصاص."}},{"id":"U06.L04.A3.a","objective":"U06.L04.O3","level":"A","type":"choose_reason","prompt":"مما يتكون البراز؟","options":["طعام زائد لم يحتجه الجسم بعد الوجبة فأخرجه كما هو","ماء وألياف لم تُهضم وميكروبات وخلايا متساقطة","دم قديم يخرج بعد أن تتعب الكريّات","صفراء من الكبد، وهي التي تعطيه لونه وحجمه"],"answer":1,"explanation":"البراز ماء وألياف لم تُهضم وميكروبات وخلايا متساقطة من جدار الأمعاء.","feedback_by_option":{"0":"ليس كل ما نأكله يخرج زائداً؛ ما يخرج ألياف لم تُهضم وماء وميكروبات وخلايا متساقطة من بطانة الأمعاء.","2":"البراز ليس دماً؛ لكن لونه البني يأتي من صبغة في الصفراء.","3":"في البراز صبغة من الصفراء تلوّنه، لكن معظمه ماء وألياف وميكروبات."},"detects":"M62","alt":{"prompt":"ماذا يحدث لألياف الخضار التي نأكلها؟","options":["تذهب إلى الرئتين","تُهضم كلها في المعدة وتصير دماً","تبقى في المعدة","لا تُهضم، فتخرج مع البراز"],"answer":3,"explanation":"الألياف لا يهضمها الإنسان، فتمرّ إلى الغليظة وتخرج مع البراز، وتعطيه حجماً يسهّل خروجه.","feedback_by_option":{"0":"الرئتان للهواء لا للطعام.","1":"الألياف لا يهضمها الإنسان، فلا تصير دماً.","2":"المعدة تُفرغ ما فيها خلال ساعات."},"detects":"M62"}},{"id":"U06.L04.A3.b","objective":"U06.L04.O3","level":"A","type":"explain_open","prompt":"اذكر{|ي} عملي الأمعاء الغليظة.","answer":"امتصاص الماء، وتحويل الباقي إلى براز وتخزينه في المستقيم حتى الخروج (وتسكنها ميكروبات نافعة).","rubric":"R1"},{"id":"U06.L04.A3.c","objective":"U06.L04.O3","level":"A","type":"true_false_why","prompt":"«الأمعاء الغليظة تصنع عصارات تهضم». صح أم خطأ؟","answer":"خطأ؛ الهضم انتهى في الدقيقة؛ الغليظة تمتص الماء.","rubric":"R1","alt":{"prompt":"«الأمعاء الغليظة تمتص الماء مما بقي، فيصير الباقي برازاً يُخزَّن في المستقيم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الهضم والامتصاص انتهيا في الدقيقة، والغليظة تمتص الماء وتحوّل الباقي إلى براز يُخزَّن حتى يخرج."}},{"id":"U06.L04.A4.a","objective":"U06.L04.O4","level":"A","type":"true_false_why","prompt":"«كتم الحاجة ساعات لا يضر». صح أم خطأ؟","answer":"خطأ؛ الغليظة تستمر في أخذ الماء فيجف البراز ويصعب.","rubric":"R1","detects":"M64","alt":{"prompt":"«قلة الشرب وكتم الحاجة يجعلان البراز أجف وأصعب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الغليظة تستمر في امتصاص الماء ما دام البراز فيها، فيجفّ إن قلّ الماء أو طال البقاء.","detects":"M64"}},{"id":"U06.L04.A4.b","objective":"U06.L04.O4","level":"A","type":"choose","prompt":"أي هذه يساعد على خروج سهل؟","options":["قلة الشرب","الجلوس طويلاً","ماء وألياف وحركة","كتم الحاجة"],"answer":2,"explanation":"الماء يُبقي البراز ليناً، والألياف تعطيه حجماً، والحركة تساعد الأمعاء على دفعه.","feedback_by_option":{"0":"قلة الشرب تجعل البراز أجف وأصعب.","1":"الحركة تساعد الأمعاء على الدفع؛ والجلوس الطويل يبطئها.","3":"الكتم يترك الغليظة تأخذ ماءً أكثر، فيجف البراز ويصعب."},"alt":{"prompt":"طفل يجد صعوبة في الخروج. أي نصيحة تناسبه؟","options":["يجلس ساعات أمام الشاشة","يأكل حلوى أكثر","يشرب ماءً ويأكل خضاراً ويتحرك","يكتم الحاجة حتى يكبر البراز ويخرج وحده"],"answer":2,"explanation":"الماء يُبقي البراز ليناً، والألياف في الخضار والفاكهة تعطيه حجماً، والحركة تساعد الأمعاء على دفعه.","feedback_by_option":{"0":"الجلوس الطويل يبطئ الأمعاء؛ الحركة تساعدها.","1":"الحلوى بلا ألياف لا تساعد.","3":"الكتم يترك الغليظة تأخذ ماءً أكثر، فيجف البراز ويصعب."}}},{"id":"U06.L04.A4.c","objective":"U06.L04.O4","level":"A","type":"explain_open","prompt":"ماذا تفعل{|ين} بعد الحمام ولماذا (من العلم ومن الطهارة)؟","answer":"الغسل بالماء ثم غسل اليدين بالصابون؛ في البراز ميكروبات كثيرة تنتقل باليد؛ والطهارة من الدين.","rubric":"R1"},{"id":"U06.L04.A5.a","objective":"U06.L04.O5","level":"B","type":"choose","prompt":"ما الذي يسلك طريق اللمف من الخملة؟","options":["السكر","الماء","الأملاح","أجزاء الدهون"],"answer":3,"explanation":"أجزاء الدهون تسلك طريق اللمف من الخملة، أما السكر فيدخل الشعيرات الدموية.","feedback_by_option":{"0":"السكر يدخل الشعيرات الدموية إلى الكبد.","1":"الماء يدخل الدم مباشرة.","2":"الأملاح تدخل الدم مباشرة."},"alt":{"prompt":"السكر الممتص في الخملة يدخل:","options":["الشعيرات الدموية","وعاء اللمف في وسط الخملة","المعدة","الرئتين"],"answer":0,"explanation":"السكر وقطع البروتين تدخل الشعيرات الدموية فتذهب إلى الكبد أولاً، أما أجزاء الدهون فتسلك طريق اللمف.","feedback_by_option":{"1":"طريق اللمف للدهون؛ والسكر يدخل الشعيرات الدموية.","2":"لا شيء يعود من الخملة إلى المعدة.","3":"الرئتان للهواء."}}},{"id":"U06.L04.A5.b","objective":"U06.L04.O5","level":"B","type":"explain_open","prompt":"لماذا يمرّ دم الأمعاء بالكبد أولاً قبل القلب؟","answer":"ليخزّن الكبد الفائض ويعالج ما دخل قبل أن يُوزَّع على الجسم.","rubric":"R1"},{"id":"U06.L04.A5.c","objective":"U06.L04.O5","level":"B","type":"true_false_why","prompt":"«كل ما يُمتَص يذهب إلى الكبد أولاً». صح أم خطأ؟","answer":"خطأ؛ الدهون عبر اللمف تصل الدم قرب القلب متجاوزة الكبد.","rubric":"R1","alt":{"prompt":"«أجزاء الدهون الممتصة تدخل اللمف أولاً، ثم تصل الدم قرب القلب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في وسط الخملة وعاء لمفاوي تدخله أجزاء الدهون، ثم يصبّ اللمف في الدم قرب القلب."}},{"id":"U06.L04.A6.a","objective":"U06.L04.O6","level":"B","type":"choose","prompt":"لماذا كان رقم «ملعب التنس» مبالغاً؟","options":["لأن تقديرات مبالغة ضُربت ببعضها فتضاعفت","لأن أمعاء الناس صغرت منذ ذلك الزمن","لأن ملاعب التنس صارت أكبر مما كانت","لأنه لم يُقس أبداً، بل اخترعه كاتب ونقله الناس عنه"],"answer":0,"explanation":"رقم «ملعب التنس» جاء من تقديرات مبالغة ضُرب بعضها في بعض فتضاعفت المبالغة.","feedback_by_option":{"1":"الأمعاء لم تتغير؛ الذي تغيّر طريقة القياس.","2":"ملاعب التنس لم تتغير؛ الرقم نفسه كان مبالغاً.","3":"قِيس فعلاً بتقديرات قديمة، لكن بعضها كان مبالغاً، فضُرب بعضها في بعض."},"alt":{"prompt":"قرأت{|ِ} رقماً في ثلاثة كتب. كيف تعرف{|ين} أنه صحيح؟","options":["أصدّق الكتاب الأحدث فقط","يكفي أنه في ثلاثة كتب","أسأل: من قاسه، وبأي أداة، ومتى","أصدّق الرقم الأكبر"],"answer":2,"explanation":"تكرار الرقم ليس دليلاً؛ نسأل من قاسه وبأي أداة ومتى، فقد تغيّره أدوات أدق.","feedback_by_option":{"0":"الأحدث ليس صحيحاً دائماً؛ المهم من قاس وكيف.","1":"تكرار الرقم في الكتب ليس دليلاً؛ قد ينقل بعضها عن بعض.","3":"الكِبر ليس دليلاً؛ رقم «ملعب التنس» كان كبيراً ومبالغاً."}}},{"id":"U06.L04.A6.b","objective":"U06.L04.O6","level":"B","type":"explain_open","prompt":"ما القاعدة التي نتعلمها من قصة الرقم؟","answer":"تكرار رقم في الكتب ليس دليلاً؛ نسأل: من قاس وبماذا؛ وقد يتغير.","rubric":"R1"},{"id":"U06.L04.A6.c","objective":"U06.L04.O6","level":"B","type":"true_false_why","prompt":"«30 متراً مربعاً رقم نهائي لن يتغير». صح أم خطأ؟","answer":"خطأ؛ أدوات أدق قد تغيّره؛ العلم يصحّح نفسه.","rubric":"R1","alt":{"prompt":"«قد يتغير رقم علمي حين تتحسن أدوات القياس، وهذا من قوة العلم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العلم يصحّح أرقامه حين تتحسن أدواته، كما حدث لرقم مساحة سطح الأمعاء."}}],"transfer":[{"id":"U06.L04.T1","objective":"U06.L04.O2","type":"explain_open","prompt":"مدفأة بزعانف معدنية كثيرة، وجذور شجرة بشعيرات دقيقة، وخملات أمعائك{|ِ}: ما الفكرة الواحدة؟","answer":"زيادة السطح للتبادل: حرارة، ماء، غذاء.","level":"A","rubric":"R1"},{"id":"U06.L04.T2","objective":"U06.L04.O4","type":"explain_open","prompt":"في رحلة طويلة بالحافلة يشرب بعضهم قليلاً «حتى لا يحتاج الحمام». ما رأيك{|ِ} من العلم؟","answer":"قلة الماء تجعل الغليظة تأخذ ماءً أكثر فيجف البراز ويصعب لاحقاً؛ الأفضل شرب كافٍ والاستجابة في المحطات.","level":"B","rubric":"R1"}],"recall":[{"id":"U06.L04.D1","objective":"U06.L04.O1","type":"choose","prompt":"يعبر الغذاء إلى الدم في:","options":["المعدة بعد أن تخلط الطعام","الغليظة مع الماء","الأمعاء الدقيقة"],"answer":2,"explanation":"الغذاء يعبر إلى الدم في الأمعاء الدقيقة.","level":"A","feedback_by_option":{"0":"المعدة تخلط وتبدأ الهضم؛ والامتصاص بعدها.","1":"الغليظة تمتص الماء مما بقي، بعد أن يُمتص الغذاء."}},{"id":"U06.L04.D2","objective":"U06.L04.O3","type":"choose","prompt":"الأمعاء الغليظة تمتص:","options":["الماء","السكر","البروتين"],"answer":0,"explanation":"الأمعاء الغليظة تمتص الماء.","level":"A","feedback_by_option":{"1":"السكر يُمتص قبلها، في الأمعاء الدقيقة.","2":"البروتين يُكسَّر ويُمتص قبلها، في الأمعاء الدقيقة."}},{"id":"U06.L04.D3","objective":"U06.L04.O5","type":"choose","
