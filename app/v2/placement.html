const LESSON = { id: 'placement', title: 'من أين أبدأ؟', next: 'index.html', home: 'index.html', check_ids: [] };
const UNITS = [{"id":"U01","title":"التوجيه والنماذج","first":"U01.L01","qs":[{"id":"P.U01.L01.A2.a","prompt":"أين الظهر بالنسبة إلى الصدر؟","options":["أعلى","أسفل","خلف","أمام"],"answer":2,"why":"الصدر في الجهة الأمامية من الجذع، والظهر في الجهة الخلفية المقابلة له.","perOption":{"0":"«أعلى» يعني أقرب إلى الرأس. الصدر والظهر على الارتفاع نفسه تقريباً؛ الفرق بينهما في الجهة: أيهما في الأمام؟","1":"الظهر ليس تحت الصدر؛ هما على الارتفاع نفسه تقريباً. ضع{|ي} يداً على صدرك{|ِ} وأخرى على ظهرك{|ِ}: أين تقع الثانية من الأولى؟","3":"العكس: الصدر هو الذي في الأمام، في جهة الوجه. فأين الظهر منه؟"}},{"id":"P.U01.L02.A1.a","prompt":"«الكلب يهزّ ذيله لأنه سعيد». ما الملاحظة فيها وما التخمين؟","options":["الملاحظة: سعيد؛ التخمين: يهزّ ذيله","الملاحظة: يهزّ ذيله؛ التخمين: سعيد","سعادته ملاحظة مثل هزّ ذيله، لأننا نرى الكلب أمامنا","هزّ ذيله تخمين مثل سعادته، لأننا لا نعرف ما في رأسه"],"answer":1,"why":"هزّ الذيل نراه فهو ملاحظة؛ أما «سعيد» فتفسير لما نراه، أي تخمين.","perOption":{"0":"«سعيد» لا نراه، بل نفسّر به ما نراه. الذي نراه هو هزّ الذيل.","2":"نرى الذيل يهتز، لكننا لا نرى السعادة؛ هي تفسير لما نراه.","3":"صحيح أننا لا نعرف ما في رأسه، لكننا نرى ذيله يهتز؛ وهذا ملاحظة."}}]},{"id":"U02","title":"الحركة: عظام ومفاصل وعضلات","first":"U02.L01","qs":[{"id":"P.U02.L01.A1.a","prompt":"ثلاث وظائف للهيكل:","options":["الدعم والهضم والتنفس","الحماية والتفكير والنوم","الدعم والحماية والحركة","الحركة والرؤية والسمع"],"answer":2,"why":"الهيكل يدعم الجسم فيقف، ويحمي الأعضاء الرخوة، ويتحرك مع العضلات عند المفاصل.","perOption":{"0":"الهضم عمل المعدة والأمعاء، والتنفس عمل الرئتين. ماذا يفعل الهيكل غير الدعم؟","1":"التفكير عمل الدماغ لا الهيكل، والنوم ليس وظيفة للعظام. ماذا يفعل الهيكل مع العضلات؟","3":"الرؤية للعينين والسمع للأذنين. ماذا يفعل الهيكل غير الحركة؟"}},{"id":"P.U02.L03.A1.b","prompt":"ما الذي ينقل سحب العضلة إلى العظم؟","options":["الرباط","الوتر","الغضروف","الجلد"],"answer":1,"why":"الوتر يربط العضلة بالعظم، فينقل سحبها إليه.","perOption":{"0":"الرباط يربط عظماً بعظم، ولا يتصل بالعضلة.","2":"الغضروف يغطي نهايتي العظمين عند المفصل، ولا يتصل بالعضلة.","3":"الجلد يغطي الجسم من الخارج، ولا ينقل سحب العضلة."}}]},{"id":"U03","title":"القلب والدم والأوعية","first":"U03.L01","qs":[{"id":"P.U03.L01.A2.a","prompt":"أي العبارات صحيحة؟","options":["القلب يدفع الدم","القلب يصنع الدم","القلب يخزّن الدم","القلب ينظّف الدم"],"answer":0,"why":"القلب مضخة: يدفع الدم. أما صنع الدم فهو عمل نخاع العظم.","perOption":{"1":"القلب لا يصنع الدم؛ خلايا الدم تُصنع داخل العظام، في نخاع العظم. القلب يدفعه فقط.","2":"القلب لا يخزّن الدم؛ يمتلئ ثم يدفعه مع كل ضربة.","3":"تنظيف الدم عمل أعضاء أخرى؛ والقلب يدفعه فقط."}},{"id":"P.U03.L02.A2.a","prompt":"لماذا الشعيرات هي محطات التبادل؟","options":["لأن جدارها رقيق جداً","لأنها الأقرب إلى القلب","لأنها الأكبر","لأن الدم فيها أسرع"],"answer":0,"why":"جدار الشعيرة رقيق جداً، فتعبره المواد بين الدم والخلايا.","perOption":{"1":"الشعيرات بين خلايا الجسم كله، لا قرب القلب وحده.","2":"الشعيرات أدقّ الأوعية لا أكبرها.","3":"الدم في الشعيرات أبطأ لا أسرع، وهذا يعطي وقتاً للتبادل؛ لكن السبب الأهم جدارها."}}]},{"id":"U04","title":"التنفس: الهواء والرئتان","first":"U04.L01","qs":[{"id":"P.U04.L01.A2.a","prompt":"ما الذي يسحب الهواء إلى الرئتين؟","options":["الرئتان نفساهما؛ تنتفخان بعضلاتهما","اتساع الصدر حين ينزل الحجاب الحاجز وترتفع الأضلاع","القلب؛ يسحب الهواء مع الدم في كل ضربة إلى الصدر والرئتين","الأنف؛ يسحب الهواء بقوة ويدفعه إلى الأسفل"],"answer":1,"why":"حين ينزل الحجاب الحاجز وترتفع الأضلاع يتسع الصدر، فتتمدد الرئتان ويدخل الهواء.","perOption":{"0":"الرئتان ليس فيهما عضلات تحركهما؛ الحجاب الحاجز وعضلات الأضلاع توسّع الصدر فتتمدد الرئتان.","2":"القلب يدفع الدم، ولا يسحب الهواء.","3":"الأنف ممرّ يدفّئ الهواء وينظّفه، لكنه لا يسحب الهواء."}},{"id":"P.U04.L02.A1.a","prompt":"ما الذي في نهاية أدق أنابيب الرئة؟","options":["عضلات صغيرة تشفط الهواء","فراغ واسع يتجمع فيه الهواء","حويصلات صغيرة حولها شعيرات","غضروف صلب يُبقي الأنبوب مفتوحاً"],"answer":2,"why":"أدق أنابيب الرئة تنتهي بحويصلات صغيرة تحيط بها الشعيرات.","perOption":{"0":"الرئة ليس فيها عضلات تشفط الهواء.","1":"لا فراغ واسع في الرئة؛ هي إسفنجة من حويصلات صغيرة جداً.","3":"الغضروف في جدار القصبة الهوائية والأنابيب الكبيرة، لا في نهايات أدق الأنابيب."}}]},{"id":"U05","title":"جسر الطاقة والخلية","first":"U05.L01","qs":[{"id":"P.U05.L01.A1.a","prompt":"الخلية هي:","options":["شيء صغير يسبح في الدم فقط","جزء صلب من العظم يقوّيه","نوع من الميكروبات يعيش داخل أجسامنا ويضرنا","اللبنة الحية التي يُبنى منها كل كائن حي"],"answer":3,"why":"الخلية هي اللبنة الحية التي يُبنى منها كل كائن حي، من أصغره إلى الإنسان.","perOption":{"0":"خلايا الدم نوع واحد؛ وكل أجزاء الجسم مبنية من خلايا.","1":"في العظم خلايا حية، لكن الخلية ليست جزءاً من العظم وحده.","2":"الميكروبات كائنات أخرى؛ ونحن مبنيّون من خلايانا."}},{"id":"P.U05.L02.A1.a","prompt":"أين الطاقة التي تستعملها خلاياك{|ِ}؟","options":["في الهواء","في الماء","في الغذاء (السكر)","في الدم نفسه"],"answer":2,"why":"الطاقة التي تستعملها الخلايا في الغذاء، في السكر.","perOption":{"0":"الطاقة ليست في الهواء؛ الأكسجين يُطلق الطاقة من السكر، كما تحتاج الشمعة الهواء لتُطلق ما في الشمع.","1":"الماء ضروري للجسم، لكنه لا يعطي طاقة.","3":"الدم يحمل السكر الذي فيه الطاقة، لكنه ليس مصدرها؛ مصدرها الغذاء."}}]},{"id":"U06","title":"الطعام: من اللقمة إلى الدم","first":"U06.L01","qs":[{"id":"P.U06.L02.A2.b","prompt":"ما الذي يبدأ حمض المعدة وعصاراتها تكسيره؟","options":["النشا","الماء","الفيتامينات","البروتين"],"answer":3,"why":"حمض المعدة وعصاراتها تبدأ تكسير البروتين.","perOption":{"0":"تحويل النشا يبدأ في الفم باللعاب.","1":"الماء لا يحتاج تكسيراً.","2":"الفيتامينات لا تُكسّر في المعدة؛ الحمض يبدأ بغذاء يكثر في اللحم والبيض."}},{"id":"P.U06.L06.A1.a","prompt":"النشويات والسكريات أهم مصدر لـ:","options":["بناء العظام","الطاقة","حماية الأعصاب","تجديد الجلد"],"answer":1,"why":"يكسرها الجسم إلى جلوكوز تستعمله الخلايا للطاقة.","perOption":{"0":"العظام تحتاج الكالسيوم.","2":"الدهون تحمي الأعصاب.","3":"البروتين يجدد الأنسجة."}}]},{"id":"U07","title":"الكليتان والماء","first":"U07.L01","qs":[{"id":"P.U07.L01.A3.a","prompt":"من نحو 150 لتراً تُرشَّح في اليوم عند الكبير، كم يخرج بولاً؟","options":["نحو لتر أو لترين","نحو 20 لتراً","نحو 75 لتراً، أي النصف","150 لتراً، أي كل ما رُشِّح"],"answer":0,"why":"يعود نحو 99 في المئة إلى الدم، فلا يخرج بولاً إلا لتر أو لتران في اليوم.","perOption":{"1":"20 لتراً كثير جداً؛ نحن لا نشرب ذلك كله. يعود أكثر من ذلك إلى الدم.","2":"لو خرج النصف لفقد الجسم ماءه في ساعات؛ يعود نحو 99 في المئة.","3":"لو خرج كل ما رُشِّح لفقد الجسم ماءه وسكّره؛ معظمه يعود."}},{"id":"P.U07.L03.A1.a","prompt":"أين أكثر الماء في جسمك{|ِ}؟","options":["داخل الخلايا","في المعدة بعد الشرب","في المثانة قبل الحمام","في العظام والأسنان"],"answer":0,"why":"أكثر ماء الجسم داخل الخلايا نفسها، والباقي في الدم وبين الخلايا.","perOption":{"1":"في المعدة ماء قليل يمرّ؛ أكثره داخل الخلايا.","2":"في المثانة بول ينتظر الخروج؛ وأكثر ماء الجسم داخل الخلايا.","3":"في العظام ماء قليل؛ أكثره داخل الخلايا."}}]},{"id":"U08","title":"الدماغ والأعصاب والحواس","first":"U08.L01","qs":[{"id":"P.U08.L01.A2.b","prompt":"الرسالة التي تسري في العصب:","options":["دم يجري من القلب داخل العصب","هواء يُنفخ في أنبوب العصب","صوت خفيف يسري داخل العصب","إشارة كهربائية سريعة"],"answer":3,"why":"الرسالة في العصب إشارة كهربائية صغيرة سريعة.","perOption":{"0":"الدم يغذي العصب كما يغذي كل الجسم، لكنه ليس الرسالة.","1":"العصب ليس أنبوب هواء؛ الرسالة إشارة كهربائية.","2":"لا صوت في العصب؛ الرسالة إشارة كهربائية."}},{"id":"P.U08.L02.A1.a","prompt":"ما عمل القزحية؟","options":["تجمع الضوء على الشبكية","تحمل الرسائل إلى الدماغ","تضبط حجم البؤبؤ","تصنع الدموع"],"answer":2,"why":"في القزحية عضلات صغيرة توسّع البؤبؤ وتضيّقه.","perOption":{"0":"هذا عمل العدسة مع القرنية.","1":"هذا عمل العصب البصري.","3":"الدموع تصنعها غدد فوق العين."}}]},{"id":"U09","title":"الجلد والدفاع والحرارة واللقاحات","first":"U09.L01","qs":[{"id":"P.U09.L01.A1.a","prompt":"الطبقة الخارجية من الجلد اسمها:","options":["الأدمة","طبقة الدهن","البشرة","الغشاء"],"answer":2,"why":"البشرة في الخارج، والأدمة تحتها.","perOption":{"0":"الأدمة تحت البشرة.","1":"طبقة الدهن تحت الأدمة.","3":"الغشاء يحيط بالخلية الواحدة."}},{"id":"P.U09.L03.A2.a","prompt":"ما عمل المخاط والأهداب في الأنف؟","options":["تحبس الميكروبات والغبار وتكنسها إلى الخارج","تصنع الأكسجين","تهضم الطعام","تصنع خلايا الدم"],"answer":0,"why":"المخاط اللزج يحبس، والأهداب تكنس.","perOption":{"1":"الأكسجين من الهواء.","2":"الهضم في الجهاز الهضمي.","3":"خلايا الدم في نخاع العظم."}}]},{"id":"U10","title":"النمو والبلوغ والخصوصية والحدود","first":"U10.L01","qs":[{"id":"P.U10.L01.A1.a","prompt":"حين تنقسم خلية من خلايا جسمك{|ِ} تصير:","options":["خليتين متماثلتين","خلية واحدة أكبر","خلايا دم","أربع خلايا مختلفة الأشكال"],"answer":0,"why":"تنسخ الخلية ما فيها ثم تنقسم خليتين متماثلتين.","perOption":{"1":"الانقسام يزيد العدد لا الحجم.","2":"كل خلايا الجسم تنقسم بالطريقة نفسها، لا الدم وحده.","3":"الانقسام الواحد يعطي اثنتين متماثلتين."}},{"id":"P.U10.L04.A2.a","prompt":"في أي مرحلة يتوقف الطول عادة؟","options":["الرضاعة","الطفولة","الرشد","بداية البلوغ"],"answer":2,"why":"في الرشد، بعد نهاية البلوغ.","perOption":{"0":"الرضيع يطول بسرعة.","1":"الطفل يطول كل سنة.","3":"في البلوغ طفرة طول."}}]},{"id":"U11","title":"قضايا التكامل","first":"U11.L01","qs":[{"id":"P.U11.L02.A1.b","prompt":"أول أكسيد الكربون في الدخان:","options":["يزيد الأكسجين في الدم ويقوّي القلب","يقلل الأكسجين في الدم","يقوّي العضلات في الرياضة","ينظّف الرئتين من الغبار والجراثيم"],"answer":1,"why":"يقلل الأكسجين الذي تحمله الخلايا الحمراء، فيتعب القلب والعضلات.","perOption":{"0":"يقلله لا يزيده.","2":"العضلات تتعب أسرع.","3":"الدخان يؤذي الرئتين ولا ينظفهما."}},{"id":"P.U11.L04.A1.a","prompt":"ما الدليل؟","options":["ما يقوله أكثر الناس في المجموعة","ملاحظات ومقارنات يكررها غيرنا","ما يقوله الشخص المشهور في الإعلان","ما نتمنى أن يكون صحيحاً من الأخبار"],"answer":1,"why":"الدليل ملاحظات وقياسات ومقارنات يكررها غيرنا فيجد مثلها.","perOption":{"0":"كثرة القائلين ليست دليلاً.","2":"الشهرة ليست دليلاً.","3":"التمني لا يجعل الشيء صحيحاً."}}]}] ;

<script>
/* اختبار تحديد المستوى الاختياري: سؤالان من كل وحدة بالترتيب، ويقف عند أول خطأ: الوحدة التي أخطأ فيها هي المقترحة للبداية.
   لا يُحتسب ولا يغيّر تقدّم أي درس؛ يحفظ الاقتراح وحده في atlas:placement فتبدأ منه «ابدأ» في الخريطة، والدروس كلها تبقى مفتوحة. */
/* لا نجوم هنا: الأسئلة للاقتراح لا للمكافأة */
award = function () {};
const QS = UNITS.flatMap(u => u.qs.map(q => ({ ...q, unit: u.id, unitTitle: u.title })));
const missedBefore = i => { const m = store.get('missed', {}); return QS.slice(0, i).some(q => m[q.id]); };
const weakUnit = () => { const m = store.get('missed', {}); const q = QS.find(q => m[q.id]); return q ? UNITS.find(u => u.id === q.unit) : null; };
const savePlacement = unit => { try { Atlas.storage.setItem('atlas:placement', JSON.stringify({ unit, at: Date.now() })); } catch (e) { Atlas.error(e.message); return false; } return true; };
const SCENES = [
  { id: 'intro', noBack: true, render() { ok(); return `<div class="scene"><div class="row" style="justify-content:center">${buddy(110, 'think')}</div><h2>من أين أبدأ؟</h2>
      <p>${tx('أسئلة قصيرة من كل وحدة، بترتيب الرحلة. ليست اختباراً يُحسب: تساعدنا أن نقترح لك{|ِ} من أين {تبدأ|تبدئين}.')}</p>
      <p>${tx('إن لم {تعرف|تعرفي} جواباً فلا بأس: معناه أن هذه الوحدة {تنتظرك|تنتظركِ}، ونقف عندها.')}</p>
      <p class="note">${tx('الدروس كلها مفتوحة، والاقتراح لا يمنعك{|ِ} من أي درس.')}</p></div>`; },
    after() { store.set('missed', {}); store.set('passed', {}); speak([tx('من أين أبدأ؟'), tx('أسئلة قصيرة من كل وحدة، بترتيب الرحلة. ليست اختباراً يُحسب.')]); } },
  ...QS.map((q, i) => ({ id: q.id, skip: () => missedBefore(i),
    render() { need(); return `<div class="scene"><span class="uchip">${q.unitTitle}</span>${choice({ id: q.id, prompt: q.prompt, options: q.options, answer: q.answer, why: q.why, perOption: q.perOption, graded: false })}</div>`; },
    after() { speak(tx(q.prompt)); } })),
  { id: 'result', noResume: true, render() { ok(); const w = weakUnit(); const all = !w;
      const head = all ? '{أجبت|أجبتِ} عن أسئلة الوحدات كلها!' : w.id === 'U01' ? 'نقترح أن {تبدأ|تبدئي} من أول الرحلة.' : `نقترح أن {تبدأ|تبدئي} من وحدة «${w.title}».`;
      const why = all ? '{تستطيع|تستطيعين} أن {تختار|تختاري} من الخريطة ما {تحب|تحبين}، أو أن {تبدأ|تبدئي} من الأول لتتعمق{|ي}.'
