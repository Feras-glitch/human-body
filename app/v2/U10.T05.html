const LD = {"id":"U10.T05","lesson":"U10.L05","first":false,"title":"اختبار: أجسام مختلفة","lessonTitle":"أجسام مختلفة","concepts":[],"check":[],"items":[{"id":"U10.L05.A1.a","objective":"U10.L05.O1","level":"A","type":"choose","prompt":"العصا البيضاء أداة عون:","options":["لمن لا يسمع","لمن عنده ربو","لمن لا يرى أو يرى قليلاً","لمن عنده حساسية"],"answer":2,"explanation":"للبصر.","feedback_by_option":{"0":"للسمع السماعة ولغة الإشارة.","1":"للربو البخاخ.","3":"الحساسية لها خطتها."},"alt":{"prompt":"طريقة برايل:","options":["كتابة بنقاط بارزة تُقرأ بالأصابع","لغة باليدين","نوع من النظارات","كرسي متحرك"],"answer":0,"explanation":"نقاط بارزة.","feedback_by_option":{"1":"هذه لغة الإشارة.","2":"ليست نظارة.","3":"ليست للحركة."}}},{"id":"U10.L05.A1.b","objective":"U10.L05.O1","level":"A","type":"true_false_why","prompt":"«لا بأس أن ألعب بكرسي زميلي المتحرك حين يتركه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أداة العون جزء من صاحبها، فلا نلمسها بلا إذنه.","rubric":"R1","alt":{"prompt":"«لغة الإشارة لغة كاملة لها قواعد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لغة باليدين والوجه، ولكل بلد تقريباً لغة إشارة."}},{"id":"U10.L05.A1.c","objective":"U10.L05.O1","level":"A","type":"explain_open","prompt":"زميلة جديدة تلبس سماعة في أذنها. {اكتب|اكتبي} ثلاثة أشياء تجعل حديثكما أسهل.","answer":"أكلمها ووجهي إليها؛ أتكلم بوضوح دون صراخ؛ أتعلم منها إشارات إن كانت تستعمل لغة الإشارة.","rubric":"R1"},{"id":"U10.L05.A2.a","objective":"U10.L05.O2","level":"A","type":"choose","prompt":"في السكري من النوع الأول:","options":["تضيق مجاري الهواء","لا يصنع البنكرياس رسالة ضبط السكر","تضعف العين","تنكسر العظام"],"answer":1,"explanation":"البنكرياس توقف عن صنع الرسالة الكيميائية.","feedback_by_option":{"0":"هذا الربو.","2":"ليس هذا السكري.","3":"لا علاقة له بالعظام."},"alt":{"prompt":"في الحساسية الشديدة من طعام:","options":["يرد جهاز الدفاع رداً شديداً","يتوقف البنكرياس","تضعف العضلات","يقل السمع"],"answer":0,"explanation":"رد شديد من جهاز الدفاع.","feedback_by_option":{"1":"هذا السكري.","2":"ليس هذا.","3":"ليس هذا."}}},{"id":"U10.L05.A2.b","objective":"U10.L05.O2","level":"A","type":"true_false_why","prompt":"«السكري من النوع الأول يأتي من أكل الحلوى الكثيرة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا يأتي من الطعام أو العادات؛ البنكرياس توقف عن صنع رسالة ضبط السكر.","rubric":"R1","detects":"M153","alt":{"prompt":"«الربو لا يعني أن الطفل لا يستطيع الرياضة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مع العلاج والخطة يلعب كثير منهم الرياضة."}},{"id":"U10.L05.A2.c","objective":"U10.L05.O2","level":"A","type":"explain_open","prompt":"زميلك{|ِ} يسعل ويصفر صدره بعد أن لعب في هواء بارد مغبر. {فسّر|فسّري} ما يحدث في جسمه.","answer":"قد تكون نوبة ربو: مجاري الهواء انتفخت وضاقت بسبب مثير كالبرد والغبار، فصعب مرور الهواء.","rubric":"R1"},{"id":"U10.L05.A3.a","objective":"U10.L05.O3","level":"A","type":"choose_reason","prompt":"هل {تلعب|تلعبين} مع زميل عنده صرع؟","options":["لا، حتى لا ينتقل إليّ","إن لبست قفازاً","لا، لأنه قد يغضب","نعم، الصرع لا يُعدي"],"answer":3,"explanation":"الصرع لا يُعدي.","feedback_by_option":{"0":"لا ينتقل باللعب.","1":"لا حاجة إلى قفاز.","2":"لا علاقة للغضب."},"detects":"M151","alt":{"prompt":"أكثر من يعيشون مع الصرع:","options":["يتعلمون ويعملون حياة عادية","لا يذهبون إلى المدرسة","لا يلعبون","يعيشون وحدهم"],"answer":0,"explanation":"يعيشون حياة عادية.","feedback_by_option":{"1":"يذهبون إلى المدارس العادية.","2":"يلعبون.","3":"ليس هذا صحيحاً."}}},{"id":"U10.L05.A3.b","objective":"U10.L05.O3","level":"A","type":"true_false_why","prompt":"«في نوبة الصرع نضع شيئاً في فم صاحبها». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قد يؤذي أسنانه أو يبلعه؛ نبعد ما يؤذيه، ونقلبه على جنبه برفق إن كان مستلقياً، وننادي كبيراً.","rubric":"R1","detects":"M154","alt":{"prompt":"«مع صديق عنده حساسية من طعام نغسل أيدينا بعد الأكل». صح أم خطأ؟ ولماذا؟","answer":"صح؛ قد يبقى على أيدينا شيء من الطعام الذي يتحسس منه."}},{"id":"U10.L05.A3.c","objective":"U10.L05.O3","level":"A","type":"explain_open","prompt":"في الملعب، صار صديقك{|ِ} يصفر صدره ويصعب عليه الكلام. {رتّب|رتّبي} ما {تفعله|تفعلينه}.","answer":"أبقى هادئاً وأطمئنه؛ أساعده على بخاخه إن كان معه؛ أنادي كبيراً فوراً، ويطلب الإسعاف إن لم يتحسن.","rubric":"R1"},{"id":"U10.L05.A4.a","objective":"U10.L05.O4","level":"A","type":"choose_reason","prompt":"زميلة تمشي بعكاز، ومعها أمها. {تريد|تريدين} أن {تدعوها|تدعيها} إلى اللعب. لمن {توجه|توجهين} الكلام؟","options":["إلى أمها","إلى المعلم","إليها هي","لا أدعوها"],"answer":2,"explanation":"نكلم الزميلة نفسها.","feedback_by_option":{"0":"الزميلة تجيب عن نفسها.","1":"{تستطيع|تستطيعين} أن {تدعوها|تدعيها} {بنفسك|بنفسكِ}.","3":"ندعوها ونعدّل اللعبة إن احتاجت."},"alt":{"prompt":"من الاحترام:","options":["أسأل قبل أن أساعد","أنظر إليه بشفقة","أتكلم عنه أمامه كأنه غائب","أضحك إن تعثر"],"answer":0,"explanation":"نسأل أولاً.","feedback_by_option":{"1":"الشفقة الجارحة تؤذي.","2":"نكلمه هو.","3":"لا نسخر."}}},{"id":"U10.L05.A4.b","objective":"U10.L05.O4","level":"A","type":"true_false_why","prompt":"«الزميل ذو الإعاقة يحتاج عوناً في كل شيء دائماً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يستطيع أشياء كثيرة وحده، ولذلك نسأل قبل أن نساعد.","rubric":"R1","alt":{"prompt":"«نعدّل اللعبة ليشارك فيها الجميع». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مثل كرة بجرس لمن لا يرى، أو قواعد تناسب الكرسي."}},{"id":"U10.L05.A4.c","objective":"U10.L05.O4","level":"A","type":"explain_open","prompt":"{عدّل|عدّلي} لعبة «الكراسي الموسيقية» أو لعبة {تحبها|تحبينها} ليشارك فيها زميل لا يسمع وزميل على كرسي متحرك.","answer":"مثال: نرفع بطاقة ملونة بدل الموسيقى ليراها من لا يسمع، ونجعل المسافات واسعة والمكان بلا درج للكرسي.","rubric":"R1"},{"id":"U10.L05.A5.a","objective":"U10.L05.O5","level":"B","type":"choose","prompt":"تصف منظمة الصحة العالمية الإعاقة بأنها:","options":["تأتي من الشخص وحده","تنتج من التقاء حالة صحية بالبيئة والشخص","مرض يُعدي","شيء نادر جداً"],"answer":1,"explanation":"التقاء الحالة الصحية بالبيئة والشخص.","feedback_by_option":{"0":"البيئة لها أثر كبير.","2":"الإعاقة لا تُعدي.","3":"نحو واحد من ستة."},"alt":{"prompt":"اخترع لويس برايل طريقته وهو في نحو:","options":["الخامسة عشرة","الخمسين","الثالثة","الثمانين"],"answer":0,"explanation":"نحو الخامسة عشرة.","feedback_by_option":{"1":"كان صغيراً.","2":"في الثالثة أصيبت عينه.","3":"كان صغيراً."}}},{"id":"U10.L05.A5.b","objective":"U10.L05.O5","level":"B","type":"true_false_why","prompt":"«المنحدر عند باب المدرسة يزيل عائقاً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يجعل الدخول ممكناً للكرسي المتحرك، وينفع غيره أيضاً كالعربات.","rubric":"R1","detects":"M152","alt":{"prompt":"«قُبلت طريقة برايل فوراً من كل المسؤولين». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ رفضها بعضهم أول الأمر، ثم اعتُمدت في العالم كله."}},{"id":"U10.L05.A5.c","objective":"U10.L05.O5","level":"B","type":"explain_open","prompt":"{اقترح|اقترحي} تعديلاً واحداً في مدرستك{|ِ} يزيل عائقاً، و{فسّر|فسّري} لمن ينفع.","answer":"مثال: لوحات بطريقة برايل على أبواب الصفوف تنفع من لا يرى؛ أو مصعد ينفع الكرسي المتحرك والمصاب.","rubric":"R1"}],"transfer":[{"id":"U10.L05.T1","objective":"U10.L05.O5","type":"explain_open","prompt":"{صمّم|صمّمي} حديقة ألعاب يلعب فيها الجميع: من يستعمل كرسياً متحركاً، ومن لا يرى، ومن لا يسمع. {اذكر|اذكري} ثلاثة أشياء فيها.","answer":"ممرات واسعة ومنحدرات وأرجوحة تناسب الكرسي؛ أرضية بملمس مختلف وكتابة برايل؛ لوحات مصورة وإشارات ضوئية.","level":"A","rubric":"R1"},{"id":"U10.L05.T2","objective":"U10.L05.O3","type":"explain_open","prompt":"صفّك{|ِ} يخطط لحفلة، وفي الصف زميل عنده سكري وزميلة عندها حساسية من طعام. ماذا {تقترح|تقترحين}؟","answer":"نسأل أهلهما والمعلم عما يناسبهما؛ نضع بطاقة بمكونات كل طعام؛ لا نشارك الأطباق دون سؤال؛ نجعل في الحفلة ألعاباً لا طعاماً فقط.","level":"A","rubric":"R1"}],"recall":[{"id":"U10.L05.D1","objective":"U10.L05.O1","type":"choose","prompt":"لغة الإشارة:","options":["لغة باليدين والوجه","كتابة بالنقاط","نظارة"],"answer":0,"explanation":"باليدين والوجه.","level":"A","feedback_by_option":{"1":"هذه برايل.","2":"لا."}},{"id":"U10.L05.D2","objective":"U10.L05.O2","type":"choose","prompt":"في الربو:","options":["تضيق مجاري الهواء","يتوقف البنكرياس","تضعف العين"],"answer":0,"explanation":"تضيق مجاري الهواء.","level":"A","feedback_by_option":{"1":"هذا السكري.","2":"لا."}},{"id":"U10.L05.D3","objective":"U10.L05.O3","type":"choose","prompt":"في نوبة الصرع:","options":["أنادي كبيراً ولا أضع شيئاً في الفم","أمسكه بقوة","أضع شيئاً في فمه"],"answer":0,"explanation":"ننادي كبيراً، ولا شيء في الفم.","level":"A","feedback_by_option":{"1":"لا نمسكه.","2":"لا."}},{"id":"U10.L05.D4","objective":"U10.L05.O4","type":"choose","prompt":"قبل أن أساعد زميلاً:","options":["أسأله","أدفع كرسيه","أسأل مرافقه"],"answer":0,"explanation":"نسأله هو.","level":"A","feedback_by_option":{"1":"نسأل أولاً.","2":"نكلمه هو."}},{"id":"U10.L05.D5","objective":"U10.L05.O5","type":"choose","prompt":"الإعاقة تصغر حين:","options":["نزيل العوائق","نتجاهله","نشفق عليه"],"answer":0,"explanation":"نزيل العوائق.","level":"B","feedback_by_option":{"1":"لا.","2":"الشفقة الجارحة لا تعين."}}]};
