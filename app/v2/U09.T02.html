const LD = {"id":"U09.T02","lesson":"U09.L02","first":false,"title":"اختبار: الحرارة: كيف يبقى جسمي دافئاً لا حاراً؟","lessonTitle":"الحرارة: كيف يبقى جسمي دافئاً لا حاراً؟","concepts":[],"check":[],"items":[{"id":"U09.L02.A1.a","objective":"U09.L02.O1","level":"A","type":"choose","prompt":"حرارة داخل جسم الإنسان السليم:","options":["37 تماماً في كل ساعة","قريبة من 37 وتتغير قليلاً خلال اليوم","تساوي حرارة الجو حوله","30 في الشتاء و40 في الصيف"],"answer":1,"explanation":"قريبة من 37، أقل في الصباح الباكر وأعلى عصراً.","feedback_by_option":{"0":"تتغير قليلاً، فليست ثابتة تماماً.","2":"الجسم يحفظ حرارته قريبة من 37 مهما تغيّر الجو.","3":"هذا تغيّر كبير جداً؛ الجسم يحفظها قريبة من 37."},"detects":"M20","alt":{"prompt":"متى تكون حرارة الجسم أعلى عادة؟","options":["في الصباح الباكر","بعد العصر","في منتصف الليل","لا تتغير أبداً"],"answer":1,"explanation":"أعلى ما تكون نحو الرابعة عصراً، وأقل في الصباح الباكر والليل.","feedback_by_option":{"0":"الصباح الباكر أقلها.","2":"الليل أقل من العصر.","3":"تتغير قليلاً خلال اليوم."}}},{"id":"U09.L02.A1.b","objective":"U09.L02.O1","level":"A","type":"true_false_why","prompt":"«في الدماغ جزء يقيس حرارة الجسم ويأمره أن يبرد أو يدفأ». صح أم خطأ؟ ولماذا؟","answer":"صح؛ جزء صغير في قاع الدماغ يقارن حرارة الدم بنحو 37، فيأمر بالتعرق أو بالارتجاف.","rubric":"R1","alt":{"prompt":"«الجلد وحده يقرر حرارة الجسم دون الدماغ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الجلد يحسّ ويبرّد ويدفئ، لكن الدماغ هو الذي يقارن ويأمر."}},{"id":"U09.L02.A1.c","objective":"U09.L02.O1","level":"A","type":"explain_open","prompt":"{ركضت|ركضتِ} عشر دقائق ثم {قست|قستِ} حرارتك{|ِ} فوجدتها أعلى قليلاً. هل {أنت|أنتِ} مريض{|ة}؟ ولماذا؟","answer":"لا، فالحرارة ترتفع قليلاً مع الرياضة لأن العضلات العاملة تطلق حرارة؛ ثم تعود بعد الراحة.","rubric":"R1"},{"id":"U09.L02.A2.a","objective":"U09.L02.O2","level":"A","type":"predict","prompt":"منديل مبلل على يد ومنديل جاف على الأخرى، ثم تهوية دقيقتين. أيّ اليدين تكون أبرد؟","options":["اليد ذات المنديل الجاف","اليد ذات المنديل المبلل","لا فرق بينهما","الأبرد هي التي لم تتحرك"],"answer":1,"explanation":"الماء يتبخر ويأخذ دفء الجلد، فتبرد اليد المبللة.","feedback_by_option":{"0":"الجاف لا تبخر فيه.","2":"التبخر يصنع الفرق.","3":"كلتاهما ساكنتان؛ التبخر هو الفرق."},"alt":{"prompt":"لماذا {تحسّ|تحسّين} بالبرد حين {تخرج|تخرجين} من المسبح والهواء يهبّ؟","options":["لأن الماء على جلدك{|ِ} يتبخر فيأخذ دفأه","لأن الماء يدخل إلى جسمك{|ِ}","لأن الهواء يُخرج الدم من الجلد","لأن الشمس اختفت فجأة"],"answer":0,"explanation":"التبخر يأخذ الدفء من الجلد، والهواء المتحرك يسرّعه.","feedback_by_option":{"1":"الجلد حاجز لا يُدخل الماء.","2":"الدم لا يخرج من الجلد.","3":"قد يحدث هذا في الظل أيضاً؛ السبب التبخر."}}},{"id":"U09.L02.A2.b","objective":"U09.L02.O2","level":"A","type":"true_false_why","prompt":"«العرق يُخرج السموم من الجسم، فكلما عرقنا أكثر نظف دمنا». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العرق ماء وأملاح وعمله التبريد بالتبخر، وتنظيف الدم من الفضلات عمل الكليتين والكبد.","rubric":"R1","detects":"M21","alt":{"prompt":"«من يعرق كثيراً في الحر يحتاج أن يشرب أكثر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العرق ماء يخرج من الجسم، فنعوّضه بالشرب كي لا يتعب الجسم."}},{"id":"U09.L02.A2.c","objective":"U09.L02.O2","level":"A","type":"choose_reason","prompt":"لماذا يحمرّ الوجه بعد الركض في الحر؟","options":["لأن الأوعية في الجلد تتسع فيمرّ فيها دم أكثر ليخرج الدفء","لأن الشمس تصبغ الجلد فوراً","لأن القلب يتوقف قليلاً","لأن الميلانين يقلّ فجأة"],"answer":0,"explanation":"اتساع أوعية الجلد يقرّب الدم الدافئ من السطح فيخرج دفؤه.","feedback_by_option":{"1":"الحمرة السريعة من الدم في الجلد.","2":"القلب يسرع مع الركض لا يتوقف.","3":"الميلانين لا يتغير في دقائق."},"alt":{"prompt":"حين يسخن الجسم، أوعية الجلد:","options":["تضيق","تتسع","تختفي","تمتلئ عرقاً"],"answer":1,"explanation":"تتسع فيمرّ دم أكثر قرب السطح ويخرج الدفء.","feedback_by_option":{"0":"تضيق في البرد.","2":"الأوعية لا تختفي.","3":"العرق في غدد العرق لا في الأوعية."}}},{"id":"U09.L02.A3.a","objective":"U09.L02.O3","level":"A","type":"choose_reason","prompt":"لماذا {ترتجف|ترتجفين} في البرد؟","options":["لأن العضلات تتعب من البرد","لأن العضلات تنقبض بسرعة فتصنع حرارة","لأن العظام تبرد فتهتز","لأن الدم يتجمد قليلاً"],"answer":1,"explanation":"الارتجاف انقباضات سريعة تُطلق حرارة تدفئ الجسم.","feedback_by_option":{"0":"ليس تعباً؛ هو عمل لصنع الحرارة.","2":"العضلات هي التي تهتز لا العظام.","3":"الدم لا يتجمد؛ يبقى قريباً من 37."},"alt":{"prompt":"القشعريرة في البرد سببها:","options":["عضلات صغيرة عند جذور الشعر تنقبض","شعر جديد ينمو فجأة","عرق يتجمد على الجلد","الجلد يتقلص كله"],"answer":0,"explanation":"عضلات صغيرة عند جذور الشعر تنقبض فتقف الشعرات.","feedback_by_option":{"1":"الشعر لا ينمو في ثوانٍ.","2":"لا عرق في البرد عادة.","3":"عضلات صغيرة عند جذور الشعر هي السبب."}}},{"id":"U09.L02.A3.b","objective":"U09.L02.O3","level":"A","type":"true_false_why","prompt":"«في البرد تضيق أوعية الجلد فيبقى الدفء في داخل الجسم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يمرّ دم أقل قرب السطح فيخرج دفء أقل، ويبدو الجلد شاحباً.","rubric":"R1","alt":{"prompt":"«الملابس تصنع الحرارة بنفسها فتدفئنا». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الجسم يصنع الحرارة، والملابس تحبس الهواء الدافئ حوله فتمنع خروجه."}},{"id":"U09.L02.A3.c","objective":"U09.L02.O3","level":"A","type":"explain_open","prompt":"لماذا تبدو يد صديقك{|ِ} شاحبة باردة بعد اللعب في الثلج، وداخل جسمه دافئ؟","answer":"ضاقت أوعية الجلد فمرّ فيها دم أقل، فبرد الجلد وشحب، وبقي الدفء في الداخل ليحمي الأعضاء.","rubric":"R1"},{"id":"U09.L02.A4.a","objective":"U09.L02.O4","level":"A","type":"choose_reason","prompt":"الحمى في الغالب:","options":["علامة أن الجسم يقاوم عدوى","مرض خطير بذاتها مهما كان الحال","عقوبة لمن لم يحرص على نفسه","سببها الجلوس قرب المدفأة"],"answer":0,"explanation":"الدماغ يرفع الحرارة حين يقاوم الجسم الميكروبات، وهي غالباً لا تضر بذاتها.","feedback_by_option":{"1":"حال الطفل أهم من الرقم، والحمى غالباً لا تضر بذاتها.","2":"المرض يصيب الجميع؛ لا لوم فيه.","3":"المدفأة تسخّن الجلد؛ الحمى من الدماغ حين يقاوم."},"detects":"M100","alt":{"prompt":"من يقرر أن يعطى المحموم دواءً؟","options":["المح d":"U09.L02.A5.b","objective":"U09.L02.O5","level":"B","type":"true_false_why","prompt":"«الميزان على الجبهة يقرأ حرارة الدماغ نفسها تماماً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الحرارة الحقيقية حرارة الدماغ والأعضاء الداخلية، والقياس من الجبهة أو الفم أو الإبط تقريبي يختلف قليلاً.","rubric":"R1","alt":{"prompt":"«الأطفال الصغار يبدؤون التعرق أبطأ من الكبار». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ضبطهم للحرارة أقل دقة، فيسخنون أسرع في الحر، ولذلك نحميهم من الحر أكثر."}},{"id":"U09.L02.A5.c","objective":"U09.L02.O5","level":"B","type":"explain_open","prompt":"وجد فوندرليش 37، ووجدت دراسة سنة 2023 نحو 36.6. هل أخطأ أحدهما؟ ماذا يعلّمنا ذلك عن العلم؟","answer":"لا يلزم أن أحدهما أخطأ؛ تغيّرت الأدوات والناس وطريقة القياس، والعلم يعيد القياس ويصحّح الرقم حين تأتي أدلة أدق.","rubric":"R1"}],"transfer":[{"id":"U09.L02.T1","objective":"U09.L02.O2","type":"explain_open","prompt":"في القرى الحارة تُحفظ مياه الشرب في جرّة من الفخار يرشح منها الماء قليلاً، فيبقى الماء فيها بارداً. {فسّر|فسّري} ذلك بما {تعلّمته|تعلّمتِه} عن العرق.","answer":"الماء الذي يرشح إلى سطح الجرة يتبخر فيأخذ دفأها، كما يتبخر العرق عن الجلد فيبرّده؛ فيبرد الماء داخلها.","level":"A","rubric":"R1"},{"id":"U09.L02.T2","objective":"U09.L02.O5","type":"explain_open","prompt":"لماذا ننصح بعدم ترك طفل صغير في سيارة مغلقة في الحر ولو دقائق قليلة؟","answer":"الحرارة في السيارة المغلقة ترتفع بسرعة، والطفل الصغير يتعرق أبطأ وضبطه للحرارة أقل دقة، فيسخن جسمه أسرع من الكبير وقد يتعرض لخطر شديد.","level":"B","rubric":"R1"}],"recall":[{"id":"U09.L02.D1","objective":"U09.L02.O1","type":"choose","prompt":"حرارة داخل الجسم السليم قريبة من:","options":["30 درجة","37 درجة","45 درجة"],"answer":1,"explanation":"قريبة من 37 وتتغير قليلاً.","level":"A","feedback_by_option":{"0":"أقل بكثير من حرارة الجسم.","2":"أعلى بكثير من حرارة الجسم."}},{"id":"U09.L02.D2","objective":"U09.L02.O2","type":"choose","prompt":"العرق يبرّدنا لأنه:","options":["يُخرج السموم والأوساخ من داخل الدم","يتبخر فيأخذ الدفء","بارد جداً"],"answer":1,"explanation":"التبخر يأخذ الدفء من الجلد.","level":"A","feedback_by_option":{"0":"عمله التبريد لا إخراج السموم.","2":"يخرج بحرارة الجسم."}},{"id":"U09.L02.D3","objective":"U09.L02.O3","type":"choose","prompt":"الارتجاف في البرد:","options":["يصنع حرارة","يبرّد الجسم","علامة مرض دائماً"],"answer":0,"explanation":"انقباضات سريعة تصنع حرارة.","level":"A","feedback_by_option":{"1":"يدفئ لا يبرّد.","2":"يحدث في البرد العادي أيضاً."}},{"id":"U09.L02.D4","objective":"U09.L02.O4","type":"choose","prompt":"الحمى غالباً:","options":["علامة أن الجسم يقاوم","مرض بذاتها دائماً","من الجلوس طويلاً في الشمس الحارة"],"answer":0,"explanation":"الدماغ يرفع الحرارة حين يقاوم الجسم عدوى.","level":"A","feedback_by_option":{"1":"غالباً علامة على المقاومة.","2":"الشمس قد تُتعب بالحر، والحمى من العدوى غالباً."}},{"id":"U09.L02.D5","objective":"U09.L02.O4","type":"choose","prompt":"من أتعبه الحر:","options":["يكمل اللعب حتى تنتهي المباراة كلها","ينتقل إلى الظل ويشرب","يأكل حلوى"],"answer":1,"explanation":"الظل والراحة والشرب وإخبار كبير.","level":"A","feedback_by_option":{"0":"الاستمرار يزيد التعب.","2":"يحتاج الظل والماء."}},{"id":"U09.L02.D6","objective":"U09.L02.O5","type":"choose","prompt":"قياس الحرارة من الجبهة:","options":["يساوي حرارة الدماغ تماماً","تقريبي يختلف قليلاً","لا معنى له"],"answer":1,"explanation":"كل قياس من موضع سهل تقريبي.","level":"B","feedback_by_option":{"0":"لا نقيس حرارة الدماغ مباشرة.","2":"له معنى، لكنه تقريبي."}}]};
