const LD = {"id":"U06.L02","first":false,"title":"الطريق: المريء والمعدة","driving_question":"{اسم}، هل تستطيع{|ين} أن تبلع{|ي} رشفة ماء وأنت{|ِ} مقلوب{|ة} رأساً على عقب؟ ولماذا لا تهضم معدتك{|ِ} نفسها وهي تهضم اللحم؟","central_fact":"عضلات الأنبوب الهضمي تدفع الطعام بموجة انقباض (الحركة الدودية) لا بالجاذبية؛ والمعدة كيس عضلي يخلط الطعام بحمض وعصارات ثم يُطلقه ببطء، ويحميه مخاط؛ وإشارة الشبع تتأخر فيُحسن الأكل على مهل.","next":"U06.L03","nexts":[{"id":"U06.L03","gated":false},{"id":"U06.L04","gated":false},{"id":"U06.L05","gated":false}],"hook":{"text":"{اسم}، لو شربت{|ِ} رشفة ماء ورأسك{|ِ} أخفض من بطنك{|ِ}، هل يصل الماء إلى المعدة أم يعود؟","options":["يعود لأن الجاذبية إلى أسفل","يصل لأن شيئاً يدفعه","يبقى في الحلق","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive","muscles"],"highlight":["esophagus"],"zoom":"chest","animate":"peristalsis"},"text":"بلعت{|ِ} اللقمة ودخلت المريء: أنبوب عضلي طوله نحو شبر ونصف خلف القصبة الهوائية. والآن انتبه{|ي}: اللقمة لا تسقط. جدار الأنبوب عضلات، والعضلة خلف اللقمة تنقبض فتضغطها إلى الأمام، والتي أمامها ترتخي لتفسح — ثم التالية والتالية، كموجة تمشي. نسميها الحركة الدودية. لذلك تبلع{|ين} وأنت{|ِ} {منحنٍ|منحنية}، ويأكل رواد الفضاء بلا جاذبية. وهي لا إرادية: لا تستطيع{|ين} إيقافها كما لا تستطيع{|ين} إيقاف قلبك{|ِ}."},{"id":"E2","level":"A","atlas":{"layers":["digestive"],"highlight":["stomach"],"zoom":"abdomen","animate":"churn"},"text":"بعد ثوانٍ تصل اللقمة المعدة: كيس عضلي في أعلى بطنك{|ِ} إلى اليسار، تحت الأضلاع، بحجم قبضتك{|ِ} وهو فارغ، ويتمدد حين يمتلئ. جداره ثلاث طبقات عضلية تعصر وتخلط في كل الاتجاهات، وتصبّ فيه غدد صغيرة حمضاً قوياً وعصارات. الحمض يساعد على تكسير البروتين — اللحم والبيض والبقول — ويقتل كثيراً من الميكروبات التي جاءت مع الطعام. وبعد ساعات قليلة يصير ما {أكلته|أكلتِه} سائلاً ثخيناً."},{"id":"E3","level":"A","atlas":{"layers":["digestive"],"highlight":["stomach_wall"],"zoom":"stomach_wall"},"text":"سؤال محيّر: حمض يهضم اللحم — ومعدتك{|ِ} لحم. فلماذا لا تهضم نفسها؟ حمايتان. الأولى: طبقة مخاط سميكة تغطي الجدار من الداخل فلا يلمسه الحمض. والثانية: خلايا الجدار تتجدد باستمرار؛ ما يتلف يُستبدل بعد أيام. حين تضعف الحماية يؤلم الجدار — وهذا ما يسمّيه الأطباء قرحة، ويعالجونه. ومعدتك{|ِ} الفارغة لا تذوب: قرقرتها موجات عضلية تتحرك في كيس فيه هواء، لا أكثر."},{"id":"E4","level":"A","atlas":{"layers":["digestive","nervous"],"highlight":["stomach","brain"],"zoom":"body","animate":"satiety_delay"},"text":"والآن شيء يفيدك{|ِ} في كل وجبة. حين تمتلئ المعدة تُرسل هي والأمعاء إشارات إلى الدماغ: «كفى». لكن الإشارات تحتاج دقائق لتصل وتُفهَم. فمن يأكل بسرعة يملأ معدته قبل أن يصله الشعور، ويأكل أكثر من حاجته ثم يثقل ويخمل. ومن يأكل على مهل ويتوقف قبل الامتلاء يشعر بالشبع في وقته ويبقى خفيفاً. الجسم نفسه يقول: ببطء، وبلا إسراف."},{"id":"E5","level":"B","atlas":{"layers":["digestive"],"highlight":["les","pylorus"],"zoom":"stomach"},"text":"للمستوى ب: للمعدة حارسان. في أعلاها صمام عضلي ينفتح لحظة مرور اللقمة ثم يُغلق، حتى لا يعود الحمض إلى المريء الذي ليست فيه طبقة المخاط السميكة التي تحمي المعدة — وحين يرتخي هذا الصمام تشعر بحرقة في الصدر، وهذا ما يسميه الكبار «الحموضة». وفي أسفلها صمام آخر يُطلق السائل الثخين إلى الأمعاء دفعات صغيرة، كلما هُضمت دفعة أُرسلت التالية، حتى لا تغرق الأمعاء. ولذلك يبقى الطعام في المعدة ساعات ولا يخرج دفعة واحدة."},{"id":"E6","level":"B","atlas":{"layers":["digestive"],"highlight":["stomach"],"zoom":"abdomen"},"text":"ولماذا نقول الأكل «على مهل» والتوقف «قبل الامتلاء» من العلم لا من الأدب فقط؟ لأن المعدة تتمدد، وإشارة الشبع تتأخر، والتخمة تُثقل الهضم وتُنعس وتُضعف التركيز. فمن ترك مكاناً في معدته أعطى عضلاتها مجالاً للخلط، وأعطى الإشارة وقتها."}],"practice":[{"id":"U06.L02.P1","objective":"U06.L02.O1","type":"predict","prompt":"رائد فضاء يأكل بلا جاذبية. هل يصل الطعام إلى معدته؟","options":["لا، يبقى في الفم","نعم، الموجة العضلية تدفعه في أي اتجاه","نعم لكن ببطء شديد لأنه بلا جاذبية"],"answer":1,"explanation":"الطعام لا ينزل بالجاذبية؛ موجة انقباض عضلية في المريء تدفعه في أي اتجاه، حتى بلا جاذبية.","level":"A","feedback_wrong":"ما الذي دفع ة نفسها، لكن الوقت مختلف؛ وإشارة الشبع تحتاج دقائق لتصل."}},{"id":"U06.L02.P5","objective":"U06.L02.O5","type":"choose_reason","prompt":"الصمام في أعلى المعدة يمنع:","options":["دخول الطعام","عودة الحمض إلى المريء","الهواء من الرئة","الدم"],"answer":1,"explanation":"المريء ليست فيه طبقة المخاط السميكة التي تحمي المعدة، والصمام العلوي يمنع الحمض من العودة إليه.","level":"B","feedback_wrong":"أي عضو ليست فيه طبقة المعدة الواقية يحتاج حماية من الحمض؟","feedback_by_option":{"0":"الصمام ينفتح ليدخل الطعام.","2":"الرئة ليست متصلة بالمعدة؛ طريق الهواء القصبة.","3":"الدم في الأوعية، لا في المعدة والمريء."}}],"check":[{"id":"U06.L02.C1","objective":"U06.L02.O1","type":"true_false_why","prompt":"«الطعام يسقط إلى المعدة بالجاذبية». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ موجة انقباض عضلية (الحركة الدودية) تدفعه، لذلك نبلع منحنين.","level":"A","rubric":"R1"},{"id":"U06.L02.C2","objective":"U06.L02.O2","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أعمال للمعدة.","answer":"تخلط بعضلاتها، تضيف حمضاً وعصارات تبدأ تكسير البروتين وتقتل ميكروبات، وتُطلق السائل ببطء إلى الأمعاء (وتتمدد لتخزن مؤقتاً).","level":"A","rubric":"R1"},{"id":"U06.L02.C3","objective":"U06.L02.O3","type":"fix_model","prompt":"قال زميل{ك|تكِ}: «معدتي الفارغة تقرقر لأنها تأكل نفسها». أصلح{|ي} الجملة.","answer":"القرقرة موجات عضلية في كيس فيه هواء؛ والمخاط والتجدد يحميان الجدار ممتلئاً وفارغاً.","level":"A","rubric":"R1"},{"id":"U06.L02.C4","objective":"U06.L02.O4","type":"explain_open","prompt":"لماذا ينصح الجسمُ نفسه بالأكل على مهل؟ اربط{|ي} بإشارة الشبع.","answer":"الإشارة تتأخر دقائق؛ البطء يعطيها وقتها فنتوقف عند الحاجة لا بعدها.","level":"A","rubric":"R1"},{"id":"U06.L02.C5","objective":"U06.L02.O1","type":"sequence","prompt":"رتّب{|ي} ما يحدث للقمة من البلع إلى الأمعاء.","options":["تدخل المريء","موجة عضلية تدفعها","تصل المعدة وتُخلط بالحمض","تصير سائلاً ثخيناً","تُطلق دفعات صغيرة إلى الأمعاء"],"answer":[0,1,2,3,4],"explanation":"تدخل اللقمة المريء، فتدفعها موجة عضلية إلى المعدة، فتُخلط بالحمض حتى تصير سائلاً ثخيناً، ثم تخرج دفعات صغيرة إلى الأمعاء.","level":"A"},{"id":"U06.L02.C6","objective":"U06.L02.O5","type":"explain_open","prompt":"ما الصمامان اللذان يحرسان المعدة وماذا يفعل كل منهما؟","answer":"العلوي يمنع عودة الحمض إلى المريء؛ السفلي يُطلق الطعام دفعات صغيرة إلى الأمعاء.","level":"B","rubric":"R1"},{"id":"U06.L02.C7","objective":"U06.L02.O6","type":"true_false_why","prompt":"«تجارب بومونت أفادت العلم فلا داعي للسؤال عن رضا سان مارتن». صح أم خطأ؟","answer":"خطأ؛ الفائدة لا تُلغي السؤال: اليوم لا تجربة على إنسان إلا برضاه الحر.","level":"B","rubric":"R1"}],"concepts":[{"id":"peristalsis","term":{"ar":"الحركة الدودية","en":"Peristalsis","zh":"蠕动","pinyin":"rúdòng","match":["الحركة الدودية","حركة دودية","موجة الانقباض"]},"priority":"core","atlas":{"layer":"digestive","element":"esophagus"},"card":{"A":"موجة انقباض تمشي في جدار الأنبوب: العضلة خلف اللقمة تضغط والتي أمامها ترتخي، فتُدفع اللقمة إلى الأمام — في أي اتجاه، حتى مقلوباً.","B":"تعمل في المريء والمعدة والأمعاء كلها؛ لا إرادية."}},{"id":"stomach","term":{"ar":"المعدة","en":"Stomach","zh":"胃","pinyin":"wèi","match":["المعدة","معدة","معدتك"]},"priority":"core","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"كيس عضلي في أعلى البطن إلى اليسار، يخلط الطعام بحمض وعصارات ويحوّله إلى سائل ثخين، ثم يُطلقه ببطء إلى الأمعاء.","B":"يتمدد حين يمتلئ؛ ويحرسه صمامان عضليان أعلاه وأسفله."}},{"id":"gastric_acid","term":{"ar":"حمض المعدة","en":"Stomach acid","zh":"胃酸","pinyin":"wèisuān","match":["حمض المعدة","الحمض"]},"priority":"core","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"سائل قوي تصنعه المعدة؛ يساعد على تكسير البروتين ويقتل كثيراً من الميكروبات التي تأتي مع الطعام.","B":"قوي كحمض في المختبر؛ يحمي المعدةَ منه مخاطٌ سميك وخلايا تتجدد كل أيام."}},{"id":"satiety","term":{"ar":"الشبع","en":"Fullness (satiety)","zh":"饱足感","pinyin":"bǎozúgǎn","match":["الشبع","شبع","أشبع"]},"priority":"supporting","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"إحساس «كفى» يأتي من الدماغ حين تصله إشارات من المعدة والأمعاء — وتصله متأخرة دقائق بعد أن تمتلئ.","B":"لذلك من يأكل سريعاً يتجاوز حاجته قبل الإشارة."}}],"experiment":{"title":"أبلع مقلوباً، وأصنع معدة في كيس","materials":["كوب ماء وقشة","جورب نايلون أو أنبوب قماش وكرة صغيرة","كيس بسحّاب، بسكويت سادة، قليل من الماء وملعقة خل (يمثل الحمض)","ساعة"],"steps":["بحضور بالغ: اشرب{|ي} رشفة ماء بالقشة وأنت{|ِ} {منحنٍ|منحنية} ورأسك{|ِ} أخفض من معدتك{|ِ} (على الأريكة ورأسك{|ِ} متدلٍّ قليلاً). هل وصل الماء؟ ماذا يعني ذلك؟","ضع{|ي} الكرة في الجورب واضغط{|ي} خلفها بأصابعك{|ِ} تتابعاً حتى تخرج من الطرف الآخر — هذه الحركة الدودية. جرّب{|ي} والجورب مقلوب إلى أعلى.","المعدة في كيس: ضع{|ي} بسكويتتين في الكيس مع قليل من الماء {وأغلقه|وأغلقيه}. اعصر{|ي} الكيس بيديك{|ِ} دقيقة كما تخلط المعدة. ماذا صار البسكويت؟","{أضف|أضيفي} ملعقة خل (حمض ضعيف) واعصر{|ي} دقيقة أخرى. الفرق؟","الآن تحدٍّ: امسك{|ي} الكيس من أسفل واضغط{|ي} بلطف لتُخرج{|ي} من فتحة صغيرة قليلاً قليلاً — هكذا تُطلق المعدة إلى الأمعاء، دفعات لا دفعة.","سجّل{|ي}: ثلاثة أشياء تفعلها المعدة {رأيتها|رأيتِها} في الكيس."],"safety":["الشرب والرأس منخفض بحضور بالغ فقط: رشفة واحدة صغيرة ثم الجلوس منتصباً؛ لا يُكرَّر، ولا تُجرى لمن عنده سعال أو زكام أو صعوبة في البلع.","لا تُقلب الرأس كاملاً ولا وقوف على اليدين؛ انحناء خفيف يكفي، ومن أحسّ بدوار يجلس.","من شَرِق: يجلس منتصباً ويسعل. وإن عجز عن السعال أو الكلام أو التنفس فهذا انسداد يحتاج إسعافاً فورياً من البالغ.","الخل لا يُشرب؛ الكيس يُرمى بعد التجربة وتُغسل اليدان.","لا نقارن بطون الأطفال ولا أحجامها."],"expected":"الماء يصل المعدة رغم الانحناء؛ الكرة تمشي في الجورب في أي اتجاه بالضغط المتتابع؛ البسكويت يصير عجينة سائلة أكثر مع الخل؛ الإخراج من الفتحة دفعات.","explain":"وصل الماء وأنت{|ِ} {منحنٍ|منحنية} لأن المريء لا ينتظر الجاذبية: موجة عضلية تدفع ما فيه، تماماً كأصابعك{|ِ} خلف الكرة. وفي الكيس رأيت{|ِ} ثلاثة أعمال للمعدة: تخلط بعضلاتها، وتضيف حمضاً وعصارات تكسّر، وتُطلق إلى الأمعاء دفعات صغيرة عبر صمام في أسفلها. وما لا يُظهره الكيس: الكيس بلاستيك لا يتأذى من الخل، أما معدتك{|ِ} فحمضها أقوى بكثير — ويحميها مخاط سميك وخلايا تتجدد.","record":"هل وصل الماء، وصف الكرة في الجورب، وحالة البسكويت قبل الخل وبعده، والأعمال الثلاثة.","alternatives":["من لا يناسبه الشرب منحنياً (سعال، زكام، صعوبة بلع، أو لا بالغ معه): يبلع ريقه وهو مستلقٍ على ظهره بلا ماء، ويضع يده على عنقه ليحسّ الحركة — البلع يعمل والأنبوب أفقي؛ والصورة تكمل الباقي.","بلا جورب: أنبوب ورقي ملفوف وكرة قطن.","بلا كيس: صورة مراحل العصر."]},"find_the_error":[{"id":"FE1","atlas_variant":"gravity_drop","error":"سهم «الجاذبية» يُسقط اللقمة في المريء","answer":"موجة عضلية تدفعها في أي اتجاه","detects":"M54"},{"id":"FE2","atlas_variant":"stomach_all","error":"«هنا يُهضم كل شيء ويدخل الدم» على المعدة","answer":"المعدة تخلط وتبدأ البروتين؛ الامتصاص في الأمعاء","detects":"M55"},{"id":"FE3","atlas_variant":"no_mucus","error":"حمض يلمس جدار المعدة مباشرة","answer":"طبقة مخاط بينهما وخلايا تتجدد","detects":"M56"}],"numbers":[{"text":"المريء أنبوب طوله نحو 25 سم، واللقمة تقطعه في ثوانٍ قليلة بالموجة العضلية.","source":["S2"]},{"text":"المعدة الفارغة بحجم قبضة، وتتمدد حين تمتلئ لتسع لتراً أو أكثر في الكبار؛ ولا تُقاس المعدة بين الأطفال.","source":["S2"]},{"text":"الطعام يبقى في المعدة ساعات قليلة ويخرج منها دفعات صغيرة.","source":["S1"]}],"true_size":[{"text":"اقبض{|ي} يدك{|ِ}: هذا حجم معدتك{|ِ} الآن إن كانت فارغة. وضعها تحت أضلاعك{|ِ} اليسرى — هناك تعمل.","source":["S2"]}],"animal":{"text":"للبقرة معدة ذات أربع حجرات، وتعيد الطعام لتمضغه مرة أخرى. ولدى الطيور جزء غدي يفرز العصارات وجزء عضلي يسمى القانصة يطحن الطعام. أما معدتنا فلها حجرة واحدة تخلط الطعام وتساعد على تكسيره ثم تدفعه إلى الأمعاء.","source":["S4"]},"organ_letter":{"from":"معدتك{|ِ}","text":"أنا كيس عضلي صغير بقبضتك{|ِ}، وأتمدد حين {تملؤني|تملئينني}. أخلط ما {ترسله|ترسلينه} بحمض قوي وأحمي نفسي منه بمخاط أجدده كل يوم. لا أحب الدفعة الواحدة الكبيرة: تشدّني وتُثقلني وتُنعسك{|ِ}. أرسل إلى الدماغ «كفى» لكن رسالتي تتأخر دقائق — فإن أكلت{|ِ} على مهل سمعتها في وقتها. وأرسل إلى الأمعاء دفعات صغيرة، كما ينبغي. اتركي{|ِ} لي ثلثاً فارغاً أتحرك فيه. مع التحية، معدة تريد أن تعمل براحة."},"history":[{"who":"وليم بومونت (وألكسيس سان مارتن)","origin":"الولايات المتحدة / كندا","where_when":"1822–1833، ميشيغان ثم نيويورك","did":"لاحظ الهضم مباشرة من فتحة في معدة سان مارتن، وبيّن أن عصارة المعدة تهضم كيميائياً حتى خارج الجسم، ونشر أكثر من مئتي تجربة (1833).","did_not":"لم يعرف الإنزيمات ولا البكتيريا؛ ولم تكن قواعد الرضا الحر كما هي اليوم — وهذا نقص أخلاقي يُذكر صراحة. ولم يكن أول من قال إن العصارة تهضم كيميائياً: سبقته تجارب على الحيوان (ريومور وسبالانزاني)، ونشر براوت سنة 1824 أن فيها حمضاً.","method_lesson":"الملاحظة المباشرة تفوق التخمين؛ والعلم يحتاج أخلاقاً كما يحتاج دقة.","source":["S3","S5"]}],"how_we_know":{"text":"كيف عرفنا ما يحدث داخل معدة حيّة؟ في 1822 أُصيب شاب كندي اسمه ألكسيس سان مارتن بطلقة في بطنه، وعالجه الطبيب وليم بومونت، لكن الجرح لم يلتئم تماماً وبقيت فتحة صغيرة إلى المعدة. على مدى سنوات، كان بومونت يُدخل قطع طعام مربوطة بخيط ويُخرجها بعد ساعات ليرى ماذا حدث، ويأخذ من عصارة المعدة ليجرّبها في كوب: فاكتشف أن الحمض يهضم اللحم حتى خارج الجسم. علم كثير — لكن أيضاً سؤال: كان سان مارتن فقيراً يعمل عند الطبيب، فهل كان حراً في أن يرفض؟ العلماء اليوم يضعون قاعدة: لا تجربة على إنسان إلا برضاه الحرّ الواضح.","limit_question":"ما الذي لا يُظهره رسم المعدة الثابت عن حجمها الحقيقي؟"},"what_changed":["ظُن أن المعدة تطبخ الطعام بالحرارة أو تطحنه فقط؛ ثم أظهرت تجارب على الحيوان أن عصارتها تهضم كيميائياً، وعُرف الحمض فيها سنة 1824، وأكّد بومونت ذلك في إنسان حيّ.","ظُن أن الطعام يسقط بالجاذبية؛ الصواب أن العضلات تدفعه."],"model_limits":["الموجة في الرسم مبالغ في تضييقها؛ الحقيقة انقباض لطيف لا يُرى من الخارج.","لون الحمض في الرسم ترميز؛ عصارة المعدة شبه شفافة.","المعدة تُرسم بحجم ثابت؛ الحقيقة تتمدد وتنكمش.","(صورة title-boy) وضعية ميل خفيف للتعبير عن عمل المريء؛ الصورة ليست تعليمات لتجربة الشرب مقلوبًا ولا تثبت وحدها الحركة الدودية. الأعضاء موضحة بإسقاط مبسط على الجسم المائل.","(صورة title-girl) وضعية ميل خفيف للتعبير عن عمل المريء؛ الصورة ليست تعليمات لتجربة الشرب مقلوبًا ولا تثبت وحدها الحركة الدودية. الأعضاء موضحة بإسقاط مبسط على الجسم المائل.","(صورة E1) حلقات الانقباض خلف اللقمة والأسهم للتتابع؛ شكل الموجة واتساع الأنبوب مبالغان للتوضيح. رائد الفضاء صغير ورمزي، ولمّاح لا يحمل بالونًا في هذا التكوين.","(صورة E2) اتجاهات العضلات الثلاثة عُرضت في رقعة مكبرة مسطحة بدل طبقات تشريحية متراكبة؛ القطرات رمز للعصارة وليست نارًا. المعدة أعلى البطن يسار الطفل.","(صورة E3) المخاط طبقة متصلة في الرسم؛ الحماية الفعلية تشمل أيضًا البيكربونات والوصلات الخلوية والتروية. أسهم التجدد رمز وليست خروج خلايا عائمة إلى المعدة.","(صورة E4) موضع الإضاءة العميق قرب قاعدة الدماغ تقريبي؛ الشبع شبكة إشارات عصبية وهرمونية، والساعة الرملية لا تحدد دقائق ثابتة.","(صورة E5) الحلقة العلوية هي المصرة المريئية السفلية عند اتصال المعدة، وليست المصرة المريئية العلوية الموجودة في الرقبة. المصرة العلوية المرسومة ليس لها حلقة بارزة بهذا الشكل حقيقة؛ رمز وظيفي.","(صورة E6) الأثلاث رمز تربوي على ثلاث دوائر مرافقة؛ المعدة لا تنقسم تشريحيًا إلى ثلاث حجرات ثابتة، ولا توجد سعة واحدة لكل طفل. لم يظهر الطفل والطبق في النسخة التخطيطية.","(صورة exp) الكيس والجورب نماذج للخلط والدفع لا يكرران كيمياء الهضم. إشراف بالغ؛ سوائل التجربة لا تُشرب.","(صورة letter) الوجه تشخيص قصصي مسموح في رسالة العضو فقط؛ الأحجام والابتسامات ليست تشريحًا حقيقيًا.","(صورة hist1) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة life) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات."],"faith":{"opening":null,"closing":{"text":"۞ يَـٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍۢ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ","reference":"الأعراف 31","grade":"قرآن","usage":"حكم","reflection":"الحكم جاء في الآية التي أمامك{|ِ}: نأكل ونشرب، ولا نُسرف. واليوم رأيت{|ِ} بعض حكمته في معدتك{|ِ}: كيس يتمدد، وإشارة شبع تتأخر، وتخمة تُثقل وتُنعس. وقال النبي ﷺ: «ما ملأ آدمي وعاءً شراً من بطن، بحسب ابن آدم أكلات يُقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنَفَسه» (الترمذي 2380، وقال: حديث حسن صحيح). النص يعطي الحكم، والعلم يبيّن الأثر، وأنت{|ِ} على المائدة تختار{|ين}: على مهل، وبلا إسراف.","reviewed":false,"quran_key":"7:31","hl_words":[7,10],"highlight":"وكلوا واشربوا ولا تسرفوا","cards":[]}},"life":[{"situation":"في الوليمة يحثّني الجميع: كُل أكثر!","science":"إشارة الشبع تتأخر دقائق؛ الأكل السريع والكثير يملأ المعدة قبل أن أشعر ويُثقلني ويُنعسني.","action":"أشكر وآكل على مهل وأتوقف قبل الامتلاء وأقول بأدب: اكتفيت.","value":"لا إسراف في الأكل والشرب (سورة الأعراف: الآية 31) — والجسد أمانة.","why":"لماذا أتوقف والطعام لذيذ والناس يحثون؟ لأن معدتي ترسل «كفى» متأخرة، فإن انتظرت الشعور أكلت فوق حاجتي؛ والنبي ﷺ جعل الثلث للطعام والثلث للشراب والثلث للنَّفَس، والأكل على مهل بلا امتلاء يعطي عضلات المعدة مجالاً لتخلط. الحكم من النص، والحكمة رأيتها في الكيس.","reference":"الأعراف 31؛ الترمذي 2380","hadith":["tirmidhi:2380"],"cards":[{"key":"tirmidhi:2380","lead":"عن المقدام بن معديكرب رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","text":"ما ملأ آدمي وعاءً شراً من بطن، بحسب ابن آدم أكلات يُقمن صلبه، فإن كان لا محالة فثلث لطعامه، وثلث لشرابه، وثلث لنَفَسه","narration":false,"source":"الترمذي 2380","grade":"حسن صحيح","grader":"قاله الترمذي"}],"verses":[]},{"situation":"أخي الصغير أكل كثيراً ثم تقيأ، فضحك عليه ابن عمي.","science":"القيء دفاع: المعدة تُخرج ما لا تحتمله بموجة معكوسة؛ لا يدل على ضعف.","action":"أساعده ليشطف فمه ويشرب رشفات ماء ويرتاح، وأخبر أمي، ولا أضحك عليه.","value":"الرحمة بالمريض والستر عليه.","why":"لماذا لا أضحك؟ لأن جسمه فعل ما يحميه، والمرض ليس عيباً؛ والنبي ﷺ أخبر أن المسلم أخو المسلم: لا يظلمه، ولا يخذله، ولا يحقره.","reference":"مسلم 2564","hadith":["muslim:2564/akhu"],"cards":[{"key":"muslim:2564/akhu","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"«لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً، المسلم أخو المسلم: لا يظلمه، ولا يخذله، ولا يحقره، التقوى ها هنا» ويشير إلى صدره ثلاث مرات، «بحسب امرئ من الشر أن يحقر أخاه المسلم، كل المسلم على المسلم حرام: دمه، وماله، وعرضه»","narration":true,"source":"مسلم 2564","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا يشعر بعض الناس بالجوع بعد الأكل بقليل وآخرون يشبعون طويلاً من الكمية نفسها؟","why_open":"إشارات الشبع تختلف بين الناس وبنوع الطعام والنوم؛ تفاصيل ذلك موضع بحث نشط."}],"notebook":{"draw":"ارسم{|ي} المريء والمعدة في جذع من الأمام، وأسهماً للموجة العضلية، والمعدة بطبقة مخاط من الداخل وحمض بينها. المستوى ب: أشّر{|ي} إلى الصمامين.","label":["المريء","موجة عضلية","المعدة","الحمض","طبقة المخاط","— ب: الصمام العلوي","— ب: الصمام السفلي"],"write":"أشرح: كيف يصل الطعام إلى المعدة حتى لو استلقيت؟ وماذا تفعل المعدة به؟ ولماذا لا تهضم نفسها؟ ولماذا آكل على مهل؟"},"imgs":["U06.L02-E1","U06.L02-E2","U06.L02-E3","U06.L02-E4","U06.L02-E5","U06.L02-E6","U06.L02-exp","U06.L02-hist1","U06.L02-letter","U06.L02-life","U06.L02-title-boy","U06.L02-title-girl"]};
