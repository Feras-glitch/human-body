const LD = {"id":"U04.T03","lesson":"U04.L03","first":false,"title":"اختبار: قضية الوحدة: الهواء الذي أتنفسه","lessonTitle":"قضية الوحدة: الهواء الذي أتنفسه","concepts":[],"check":[],"items":[{"id":"U04.L03.A1.a","objective":"U04.L03.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} خطوات العطاس.","options":["مهيّج يدغدغ الأنف","إشارة إلى الدماغ","شهيق عميق","دفعة هواء من الأنف"],"answer":[0,1,2,3],"explanation":"يدغدغ مهيّج الأنف، فتصل إشارة إلى الدماغ، فيأمر بشهيق عميق، ثم تخرج دفعة هواء قوية من الأنف.","alt":{"prompt":"رتّب{|ي} كيف ينظّف الأنف الهواء.","options":["يدخل الهواء ومعه غبار","يلتصق الغبار بشعر الأنف ومخاطه اللزج","تكنس الأهداب المخاط نحو الحلق","نبتلع المخاط أو نُخرجه"],"answer":[0,1,2,3],"explanation":"يحجز شعر الأنف ومخاطه الغبار، ثم تكنس الأهداب المخاط نحو الحلق فنبتلعه أو نُخرجه، فيصل إلى الرئتين هواء أنظف."}},{"id":"U04.L03.A1.b","objective":"U04.L03.O1","level":"A","type":"choose_reason","prompt":"لماذا نسعل حين ندخل غرفة مغبرّة؟","options":["لأن الرئة مريضة والغبار يكشف المرض","لأن الغبار يدغدغ المعدة فتطرده إلى الفم","لأن حسّاسات المجاري أحسّت بالغبار فأمر الدماغ بإخراجه","لأن الهواء البارد في الغرفة المغلقة يهيّج الحلق ويؤلمه كثيراً"],"answer":2,"explanation":"السعال حماية: حسّاسات المجاري أحسّت بالغبار، فأمر الدماغ بدفعة هواء تُخرجه.","feedback_by_option":{"0":"السعال لا يعني أن الرئة مريضة؛ هو حماية تُخرج ما يهيّج المجاري، كالغبار.","1":"الغبار يدخل مجاري الهواء لا المعدة؛ والسعال يُخرجه منها.","3":"الغرفة المغبرّة ليست باردة بالضرورة؛ الذي يهيّج المجاري هو الغبار."},"detects":"M45","alt":{"prompt":"طفل مصاب بالزكام يسعل. لماذا يسعل؟","options":["لأن المخاط الزائد يهيّج المجاري، فيُخرجه السعال","لأن السعال هو المرض نفسه","لأن الهواء البارد وحده يسبّب السعال دائماً","لأن قلبه يسرع"],"answer":0,"explanation":"السعال حماية: حسّاسات المجاري تحسّ بالمخاط الزائد، فيأمر الدماغ بدفعة هواء تُخرجه.","feedback_by_option":{"1":"المرض هو الزكام؛ والسعال حماية تُخرج المخاط.","2":"الهواء البارد قد يهيّج الحلق، لكن هنا مخاط الزكام هو ما يهيّج المجاري.","3":"القلب لا يسبّب السعال؛ السعال من حسّاسات المجاري والدماغ."},"detects":"M45"}},{"id":"U04.L03.A1.c","objective":"U04.L03.O1","level":"A","type":"explain_open","prompt":"كيف ينظّف الأنف الهواء قبل أن يصل إلى الرئتين؟","answer":"مخاط لزج يلتقط الغبار والميكروبات، وأهداب دقيقة تدفعه إلى الخارج أو إلى الحلق فنبتلعه.","rubric":"R1"},{"id":"U04.L03.A2.a","objective":"U04.L03.O2","level":"A","type":"fix_model","prompt":"في نموذج: أنبوب من الرئة إلى الذراع يحمل الأكسجين. صحّح{|ي}.","answer":"لا أنبوب؛ الأكسجين عبر الدم: حويصلة ← شعيرة دموية ← قلب ← شريان ← شعيرة دموية في الذراع.","rubric":"R1","detects":"M03"},{"id":"U04.L03.A2.b","objective":"U04.L03.O2","level":"A","type":"choose","prompt":"في النموذج: الرئتان لهما عضلات تشفط الهواء. ما الصواب؟","options":["صحيح؛ للرئتين عضلات قوية تشفط الهواء إلى داخلهما مع كل نَفَس","القلب يشفط الهواء مع كل ضربة ويرسله إلى الرئتين","الأنف يشفط الهواء بشعره ويدفعه إلى الصدر","الحجاب الحاجز وعضلات الأضلاع توسّع الصدر فيدخل الهواء"],"answer":3,"explanation":"الرئتان لا عضلات فيهما تشفط الهواء؛ الحجاب الحاجز وعضلات الأضلاع توسّع الصدر فيدخل الهواء.","feedback_by_option":{"0":"الرئتان ليس فيهما عضلات تشفط الهواء؛ الحجاب الحاجز وعضلات الأضلاع توسّع الصدر.","1":"القلب يدفع الدم لا الهواء.","2":"شعر الأنف يحجز الغبار، ولا يشفط الهواء."},"detects":"M43","alt":{"prompt":"في النموذج: «الأنف أنبوب فارغ يمرّ فيه الهواء كما هو». ما الصواب؟","options":["لا فرق بين الأنف والفم في تنظيف الهواء وتدفئته وترطيبه","الأنف يصنع الأكسجين","الأنف يشفط الهواء بعضلاته","الأنف مبطّن بمخاط وأهداب تنظّف الهواء، ويدفّئه"],"answer":3,"explanation":"الأنف ليس أنبوباً فارغاً: شعره ومخاطه يحجزان الغبار، وأهدابه تكنس المخاط، وهو يدفّئ الهواء ويرطّبه.","feedback_by_option":{"0":"الفم لا ينظّف الهواء كما ينظّفه الأنف بشعره ومخاطه.","1":"لا شيء في الجسم يصنع الأكسجين؛ يأتي من الهواء.","2":"الأنف لا يشفط الهواء؛ الحجاب الحاجز وعضلات الأضلاع توسّع الصدر."},"detects":"M02"}},{"id":"U04.L03.A2.c","objective":"U04.L03.O2","level":"A","type":"true_false_why","prompt":"«في النموذج الصحيح يعبر ثاني أكسيد الكربون من الدم إلى الحويصلة». صح أم خطأ؟","answer":"صح؛ ليخرج مع الزفير، بينما الأكسجين يعبر العكس.","rubric":"R1","alt":{"prompt":"«في النموذج الصحيح، الأكسجين يعبر من الدم إلى الحويصلة ليخرج مع الزفير». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الأكسجين يعبر من الحويصلة إلى الدم، وثاني أكسيد الكربون هو الذي يعبر من الدم إلى الحويصلة ليخرج."}},{"id":"U04.L03.A3.a","objective":"U04.L03.O3","level":"A","type":"choose_reason","prompt":"هل الشيشة أقل ضرراً من السجائر لأن دخانها يمر بالماء؟","options":["نعم؛ لأن الماء ينقّي الدخان من السموم","نعم إن كان الماء بارداً ونظيفاً ويُغيَّر في كل جلسة","لا؛ الماء لا يزيل المواد الضارة، والجلسة طويلة","العلماء مختلفون فيها، ولم يثبت ضررها"],"answer":2,"explanation":"الماء لا يزيل المواد الضارة من الدخان، وجلسة الشيشة طويلة فيدخل الرئتين دخان كثير.","feedback_by_option":{"0":"الماء لا ينقّي الدخان من مواده الضارة، وجلسة الشيشة تُدخل دخاناً كثيراً.","1":"برودة الماء ونظافته لا تغيّران شيئاً: الماء لا يزيل المواد الضارة من الدخان.","3":"نعرف: منظمة الصحة العالمية تقول إن الشيشة ضارة، والماء لا يزيل المواد الضارة."},"detects":"M44","alt":{"prompt":"رجل يقول: «أدخّن الشيشة ساعة كل يوم، وهي أخف من السجائر». ما الصواب؟","options":["الشيشة ضارة؛ والماء لا يزيل المواد الضارة","صحيح؛ ساعة واحدة لا تضر","صحيح إن كان التبغ بنكهة الفواكه والماء يُغيَّر كل يوم","الضرر على من يجلس قربه فقط"],"answer":0,"explanation":"منظمة الصحة العالمية تقول إن الشيشة ضارة: الماء لا يزيل المواد الضارة، وجلستها الطويلة تُدخل دخاناً كثيراً.","feedback_by_option":{"1":"ساعة من الشيشة تُدخل إلى الرئتين دخاناً كثيراً.","2":"النكهة تغيّر الرائحة والطعم، ولا تزيل المواد الضارة من الدخان.","3":"الضرر على المدخّن نفسه، وعلى من يجلس في الدخان أيضاً."},"detects":"M44"}},{"id":"U04.L03.A3.b","objective":"U04.L03.O3","level":"A","type":"explain_open","prompt":"لماذا يتضرر من يجلس في غرفة مدخَّنة وإن لم يدخّن؟","answer":"لأنه يتنفس الدخان نفسه فيدخل مجاريه وحويصلاته؛ والأطفال أكثر تأثراً لأن رئاتهم تنمو.","rubric":"R1"},{"id":"U04.L03.A3.c","objective":"U04.L03.O3","level":"A","type":"true_false_why","prompt":"«من يستعمل بخاخاً للربو ضعيف ومقصّر». صح أم خطأ؟","answer":"خطأ؛ الربو ليس عيباً ولا عدوى ولا تقصيراً؛ نساعد ولا نسخر.","rubric":"R1","detects":"M19","alt":{"prompt":"«الربو ليس عدوى، ومن يستعمل البخاخ نساعده ولا نسخر منه». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الربو مرض يصيب مجاري الهواء، لا عيب فيه ولا عدوى، والبخاخ دواء يساعد على التنفس.","detects":"M19"}},{"id":"U04.L03.A4.a","objective":"U04.L03.O4","level":"A","type":"choose","prompt":"الطريقة الصحيحة للعطاس:","options":["في الكف ثم أكمل اللعب","في المرفق أو منديل ثم غسل اليدين","في الهواء بعيداً","حبس العطسة"],"answer":1,"explanation":"العطاس في المرفق أو منديل يحجز الرذاذ، وغسل اليدين بعده يمنع نقل ما علق بهما.","feedback_by_option":{"0":"الكف تنقل ما عليها إلى كل ما نلمسه بعدها.","2":"القطرات تنتشر في الهواء وتصل إلى غيرنا؛ لذلك نغطيها.","3":"حبس العطسة قد يؤذي الأذن؛ نغطيها ونتركها تخرج."},"alt":{"prompt":"عطست{|ِ} في منديل. ماذا تفعل{|ين} بعدها؟","options":["أضع المنديل في جيبي لأستعمله مرة أخرى","أضع المنديل في جيبي وأكمل","أعطي المنديل لصديقي","أرمي المنديل وأغسل يديّ"],"answer":3,"explanation":"بعد العطاس في منديل نرميه ثم نغسل أيدينا، لأن اليدين لمستا ما فيه من قطرات.","feedback_by_option":{"0":"المنديل المستعمل فيه ميكروبات العطسة: يُرمى، وتُغسل اليدان اللتان لمستاه.","1":"المنديل المستعمل يحمل القطرات؛ نرميه ثم نغسل أيدينا.","2":"المنديل المستعمل ينقل ما فيه إلى صديقك{|ِ}."}}},{"id":"U04.L03.A4.b","objective":"U04.L03.O4","level":"A","type":"explain_open","prompt":"علّم{|ي} طفلاً أصغر لماذا نغطي العطسة. استعمل{|ي} كلمة «قطرات».","answer":"العطسة تنثر قطرات دقيقة فيها ميكروبات تصل إلى أنف غيرنا ورئته؛ المرفق يوقفها.","rubric":"R1"},{"id":"U04.L03.A4.c","objective":"U04.L03.O4","level":"A","type":"true_false_why","prompt":"«تغطية العطسة بالمرفق أفضل من حبسها بإغلاق الأنف والفم». صح أم خطأ؟","answer":"صح؛ دفعة العطسة قوية وحبسها قد يؤذي الأذن؛ نغطيها بالمرفق ونتركها تخرج.","rubric":"R1","alt":{"prompt":"«إذا عطست{|ِ} في كفك{|ِ} ثم صافحت{|ِ} صديقك{|ِ}، قد تنتقل إليه الميكروبات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ قطرات العطسة على الكف تنتقل إلى يده، ثم قد تصل إلى أنفه أو فمه؛ لذلك نعطس في المرفق ونغسل أيدينا."}},{"id":"U04.L03.A5.a","objective":"U04.L03.O5","level":"B","type":"choose_reason","prompt":"عند الركض يزيد التنفس والنبض معاً. من يأمر بذلك؟","options":["الرئة تأمر القلب","العضلة تأمر الرئة مباشرة","الدماغ بعد قياس حاجة العضلات","القلب يأمر الرئة"],"answer":2,"explanation":"الدماغ يقيس حاجة العضلات، ثم يأمر عضلات التنفس بالإسراع والقلب بالنبض أسرع، معاً.","feedback_by_option":{"0":"الرئة لا تأمر القلب؛ الدماغ يقيس حاجة العضلات ويأمر القلب والتنفس معاً.","1":"العضلة لا تتصل بالرئة؛ الإشارة تمرّ بعضو يقيس الحاجة ويأمر.","3":"القلب لا يأمر الرئة؛ كلاهما يتلقى الأمر من الدماغ."},"detects":"M22","alt":{"prompt":"حين تركض{|ين} يسرع نبضك{|ِ} وتنفسك{|ِ}. بماذا يحسّ الدماغ فيأمر بذلك؟","options":["بنقص الماء في الجسم","بارتفاع ثاني أكسيد الكربون في الدم","بارتفاع الأكسجين في الدم حين نلهث بسرعة","بتعب الرئتين"],"answer":1,"explanation":"العضلات العاملة تصنع ثاني أكسيد كربون أكثر، فيحسّ الدماغ بارتفاعه في الدم، فيأمر القلب والتنفس بالإسراع معاً.","feedback_by_option":{"0":"الماء مهم، لكن الإشارة هنا غاز تصنعه العضلات العاملة.","2":"العكس: العضلات العاملة تستعمل الأكسجين، والدماغ يحسّ بما تصنعه.","3":"الرئتان لا تتعبان فتُرسلان أوامر؛ الدماغ يحسّ بما في الدم."}}},{"id":"U04.L03.A5.b","objective":"U04.L03.O5","level":"B","type":"explain_open","prompt":"فسّر{|ي} بالشبكة (رئة، قلب، دم، دماغ) لماذا يلهث المدخّن أسرع على الدرج.","answer":"حويصلات أقل ← تبادل أقل ← الدماغ يأمر بتنفس أسرع ونبض أسرع ليوصل الدم الأكسجين نفسه إلى العضلات.","rubric":"R1"},{"id":"U04.L03.A5.c","objective":"U04.L03.O5","level":"B","type":"true_false_why","prompt":"«حين أركض يتسارع قلبي وتنفسي معاً تقريباً، والدماغ هو الذي يضبطهما». صح أم خطأ؟","answer":"صح؛ الحاجة واحدة (أكسجين أكثر للعضلات)، فيتسارعان معاً بأمر الدماغ، لا واحد بعد الآخر.","rubric":"R1","detects":"M22","alt":{"prompt":"«عند الركض يسرع التنفس أولاً، وبعد أن يمتلئ الدم بالأكسجي
