},{"id":"U10.L02.A5.a","objective":"U10.L02.O5","type":"choose","prompt":"معنى التكليف:","options":["أن يصير المسلم مسؤولاً عن عباداته","أن يصير غنياً يملك المال","أن يدخل المدرسة أول مرة في حياته","أن يطول"],"answer":0,"explanation":"التكليف يبدأ بالبلوغ: مسؤولية الصلاة والصوم والطهارة.","level":"A","feedback_by_option":{"1":"لا علاقة له بالمال.","2":"دخول المدرسة قبل البلوغ بكثير.","3":"الطول ليس التكليف."},"alt":{"prompt":"قبل البلوغ، الطفل في العبادات:","options":["يُؤاخذ بتركها","يتعوّدها ويُثاب عليها ولا يؤاخذ بتركها","لا يُثاب عليها","ممنوع منها"],"answer":1,"explanation":"يتعوّدها ويُثاب، ولا يؤاخذ.","feedback_by_option":{"0":"المؤاخذة بعد البلوغ.","2":"يُثاب عليها.","3":"ليس ممنوعاً؛ يتعوّدها."}}},{"id":"U10.L02.A5.b","objective":"U10.L02.O5","level":"A","type":"true_false_why","prompt":"{«إذا احتلم الشاب فوجد أثراً، يكفيه الوضوء». صح أم خطأ؟ ولماذا؟|«الحائض تقضي الصلاة التي فاتتها». صح أم خطأ؟ ولماذا؟}","answer":"خطأ؛ {يغتسل غسلاً كاملاً قبل أن يصلي.|لا تقضي الصلاة، وتقضي ما فاتها من صيام رمضان.}","rubric":"R1","alt":{"prompt":"{«الغسل الكامل واجب بعد الاحتلام إذا وُجد الأثر». صح أم خطأ؟ ولماذا؟|«الحائض لا تصلي ولا تصوم، وتغتسل إذا انقطع الدم». صح أم خطأ؟ ولماذا؟}","answer":"صح؛ هذا من أحكام الطهارة في البلوغ."}},{"id":"U10.L02.A5.c","objective":"U10.L02.O5","level":"A","type":"explain_open","prompt":"في الآية في الافتتاح أدب للبالغ في البيت. ما هو؟ ولماذا؟","answer":"أن يستأذن قبل الدخول على أهله كما يستأذن الكبار، لأن لكل واحد خصوصيته وأوقاتاً يخلو فيها بنفسه.","rubric":"R1"},{"id":"U10.L02.A6.a","objective":"U10.L02.O6","level":"B","type":"sequence","prompt":"{رتّب|رتّبي} سلسلة رسائل البلوغ.","options":["تحت المهاد في الدماغ","الغدة النخامية","{الخصيتان|المبيضان}","تغيّرات الجسم"],"answer":[0,1,2,3],"explanation":"تحت المهاد ← النخامية ← {الخصيتان|المبيضان} ← التغيّرات.","alt":{"type":"choose","prompt":"الهرمون الذي {تصنعه الخصيتان|يصنعه المبيضان}:","options":["{التستوستيرون|الإستروجين}","الإنسولين","السكرتين","هرمون النمو"],"answer":0,"explanation":"{ا
