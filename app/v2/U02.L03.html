":"jījiàn","match":["الأوتار","وتر"]},"priority":"core","atlas":{"layer":"muscles","element":"tendon"},"card":{"A":"حبل قوي يربط العضلة بالعظم. {جسّه|جسّيه} خلف كاحلك{|ِ} (وتر أخيل).","B":"لا ينقبض؛ ينقل سحب العضلة إلى العظم. الرباط يربط عظماً بعظم، والوتر عضلة بعظم."}},{"id":"contraction","term":{"ar":"الانقباض","en":"Contraction","zh":"收缩","pinyin":"shōusuō","match":["تنقبض","ينقبض"]},"priority":"core","atlas":{"layer":"muscles","element":"biceps"},"card":{"A":"حين تعمل العضلة تقصر وتثخن وتسحب. ضع{|ي} يدك{|ِ} على عضدك{|ِ} واثنِ{|ي} مرفقك{|ِ}.","B":"الانقباض يحتاج أكسجيناً وغذاءً من الدم؛ لذلك يسرع القلب عند الجري."}},{"id":"antagonist_pair","term":{"ar":"الزوج المتقابل","en":"Antagonistic pair","zh":"拮抗肌","pinyin":"jiékàngjī","match":["أزواج","زوج"]},"priority":"supporting","atlas":{"layer":"muscles","element":"triceps"},"card":{"A":"عضلتان على جانبي المفصل: واحدة تثني وواحدة تمدّ.","B":"في الذراع: ذات الرأسين تثني وثلاثية الرؤوس تمدّ. حين تنقبض إحداهما ترتخي الأخرى."}}],"experiment":{"title":"أحسّ عضلتَي ذراعي تتبادلان العمل","materials":["ذراعك{|ِ}","كتاب أو زجاجة ماء صغيرة"],"steps":["مدّ{|ي} ذراعك{|ِ} اليمنى وضع{|ي} كف اليسرى على مقدمة العضد (بين الكتف والمرفق).","اثنِ{|ي} المرفق ببطء وارفع{|ي} الكتاب نحو كتفك{|ِ}. ماذا تحسّ{|ين} تحت كفك{|ِ}؟ (العضلة الأمامية تثخن وتقصر: تنقبض وتسحب).","الآن انقل{|ي} كفك{|ِ} إلى خلف العضد ومدّ{|ي} الذراع ببطء ضد مقاومة خفيفة (ادفع{|ي} الكتاب نحو الطاولة). ماذا تحسّ{|ين}؟ (العضلة الخلفية تنقبض).","كرر{|ي} ثلاث مرات وسجّل{|ي}: في الثني تعمل ____، وفي المدّ تعمل ____.","جسّ{|ي} الوتر خلف كاحلك{|ِ} وارفع{|ي} كعبك{|ِ}: يشتد الوتر لأن عضلة الساق تسحبه.","ضع{|ي} كفك{|ِ} على بطنك{|ِ} وتنفس{|ي}: عضلة التنفس (الحجاب الحاجز) عضلة هيكلية، لكنها تعمل وحدها حين {تنساها|تنسينها} وتطيعك{|ِ} حين تأمر{|ين}ها — لذلك نقول: الهيكلية «غالباً» إرادية."],"safety":["حمل خفيف فقط؛ لا رفع أثقال ولا مسابقات قوة.","كل طفل على نفسه؛ لا نقارن أذرع الأطفال.","توقف عند أي ألم."],"expected":"تثخن العضلة الأمامية عند الثني وتثخن الخلفية عند المدّ، ولا يمكن الإحساس بأي عضلة «تدفع».","explain":"العضلة لا تفعل إلا شيئاً واحداً: تنقبض فتقصر وتسحب. لذلك يحتاج كل مفصل عضلتين متقابلتين: واحدة تسحب من الأمام فيثني، وواحدة تسحب من الخلف فيمدّ. وحين تعمل إحداهما ترتخي الأخرى. الأعصاب هي التي تنسّق بينهما، وهذا درس وحدة الأعصاب.","record":"الجملتان: في الثني تعمل ____، في المدّ تعمل ____. ورسم الذراع بعضلتين وسهمي سحب.","alternatives":["من يتعذر عليه حمل شيء يثني ويمدّ بلا حمل ويجسّ.","يمكن الإحساس بالزوج في الساق: ارفع{|ي} مقدمة القدم ثم الكعب."]},"find_the_error":[{"id":"FE1","atlas_variant":"muscle_pushing","error":"سهم «دفع» من العضلة إلى العظم","answer":"العضلة تسحب فقط","detects":"M01"},{"id":"FE2","atlas_variant":"single_muscle_arm","error":"ذراع بعضلة واحدة فقط تثني وتمدّ","answer":"يلزم زوج متقابل","detects":"M01"}],"numbers":[{"text":"أكثر من 600 عضلة في جسمك{|ِ}، ولا أحد يستطيع عدّها بدقة لأن بعضها يُعدّ عضلة واحدة أو عدة عضلات بحسب التعريف.","source":["S2d"]},{"text":"أقوى وتر فيك{|ِ} وتر أخيل خلف الكاحل: يحمل نحو 4 أضعاف وزنك{|ِ} حين تمشي{|ن}، وأكثر من 10 أضعاف حين تجري{|ن} أو تقفز{|ين}.","source":["S2c"]}],"true_size":[{"text":"جسّ{|ي} وتر أخيل خلف كاحلك{|ِ}: أثخن وتر فيك{|ِ}، بسُمك إصبعك{|ِ}؛ يحمل عند القفز أضعاف وزنك{|ِ}.","source":["S2"]}],"animal":{"text":"ساق الدجاجة التي {تأكلها|تأكلينها} هي عضلات حول عظم، والخيوط البيضاء القوية عند طرفها أوتار. والحصان يركض بأوتار طويلة في ساقيه تعمل كنوابض. والقطة تقفز نحو خمسة أضعاف طولها بعضلات خلفية قوية. المبدأ واحد: عضلة تسحب عظماً عند مفصل.","source":["S4"]},"organ_letter":{"from":"العضلة ذات الرأسين","text":"أنا العضلة التي تنتفخ حين تستعرض{|ين} قوتك{|ِ}. لكن اسمع{|ي}: أنا لا أدفع شيئاً، أسحب فقط. وحين تمدّ{|ين} ذراعك{|ِ} بقوة، أختي في الخلف هي التي تسحب؛ وحين تُنزل{|ين}ها ببطء أنا أُمسكها وهي تطول — لكني في الحالين أسحب، لا أدفع. نحن فريق لا بطل. وأُبنى بعد الجهد، في ساعات الراحة ومنها النوم، فلا تحرم{|ي}ني النوم."},"history":[{"who":"جالينوس","origin":"بيرغامون (تركيا اليوم) وروما؛ يوناني","where_when":"روما، نحو 160–210 م","did":"أثبت بتجارب على الحيوان أن العضلة لا تعمل بلا عصبها وأن قطع العصب يشلّ العضلة؛ وصف كثيراً من العضلات.","did_not":"أخطأ في أمور كثيرة في التشريح البشري لأنه شرّح حيوانات غالباً (الثقوب في الحاجز، الفك)، وصُحّحت أخطاؤه بعد قرون (ابن النفيس، البغدادي، فيزاليوس).","method_lesson":"نأخذ من كل عالم ما أثبته بالتجربة، لا كل ما قاله؛ والسلطة الطويلة ليست دليلاً.","source":["S3"]}],"how_we_know":{"text":"كيف عرفنا أن العضلة تسحب ولا تدفع؟ لم يكن الجواب في كتاب؛ كان في الملاحظة: حين ترفع ذراعك تنتفخ العضلة الأمامية وتقصر، وحين تمدها تنتفخ الخلفية. الطبيب اليوناني جالينوس قبل 1800 سنة أثبت بتجارب على الحيوان أن العضلات لا تتحرك إلا بإشارة من الأعصاب، وأن قطع العصب يشلّها. ومع ذلك أخطأ جالينوس في أشياء كثيرة؛ نأخذ من كل عالم ما أثبته لا كل ما قاله.","limit_question":"ما الذي لا يُظهره رسم الذراع عن عضلاتك{|ِ} الحقيقية؟"},"what_changed":["ظُن أن العضلة تنتفخ بـ«روح» أو هواء يدخلها؛ هي تقصر بانقباض أليافها.","ظُن أن ألم ما بعد التمرين من حمض يتراكم؛ هو تلف دقيق يتعافى."],"model_limits":["الرسم يُظهر عضلتين على الذراع؛ الحقيقة عشرات.","الرسم لا يُظهر الأعصاب التي تأمر العضلة ولا الدم الذي يغذيها.","الانتفاخ في الرسم مبالغ فيه.","مقارنة قصر العضلة وثخنها رمزية؛ حفظ الحجم تقريبي ولا يُقاس من الرسم.","الأعضاء في صورة النوم (E3) نوافذ منفصلة عن الجسم؛ مشهد قصصي لا خريطة تشريحية."],"faith":{"opening":null,"closing":{"text":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير، احرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن «لو» تفتح عمل الشيطان","reference":"مسلم 2664","grade":"صحيح","usage":"قيمة","reflection":"هذا الحديث يحبّب إلينا أن نحافظ على قوة أجسامنا: العضلة تقوى بالاستعمال، والقوي أقدر على نفع نفسه والناس. وهو ترغيب لا فرض كالصلاة؛ الإسلام يحبّب إلينا ما ينفعنا. وانتبه{|ي} إلى تمام الحديث: فيه أن في كلٍّ من القوي والضعيف خيراً. فالضعيف ليس أقل قيمة، وفيه مواطن يقوّي بها نفسه بما يستطيع، والقوة ليست عضلات فقط بل إرادة وصبر وعلم.","reviewed":false,"level":"ترغيب","concept":"هذا الحديث يحبّب إلينا أن نحافظ على قوة أجسامنا ونزيدها، لأن القوي أقدر على نفع نفسه وأهله والناس. وهو ترغيب لا فرض: ليس كالصلاة والصيام التي أُمرنا بها إلزاماً، بل توجيه يحبّب إلينا ما ينفعنا.","avoid":"لا يعني الحديث أن الضعيف أقل قيمة أو يُحقَّر؛ فالنبي ﷺ أخبر في الحديث نفسه أن في كلٍّ منهما خيراً: الضعيف فيه خير، وفيه مواطن يقوّي بها نفسه بما يستطيع، والقوة ليست الجسد وحده بل الإرادة والصبر والعلم.","body_effect":"العضلة تقوى بالاستعمال والنوم والغذاء، وتضمر بقلة الحركة.","highlight":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير","full_verified":true,"matn_note":"المتن كاملاً كما في المصدر؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://sunnah.com/muslim:2664","text_compared_on":"2026-10-27","hadith_key":"muslim:2664","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2664","grader":"","cards":[]}},"life":[{"situation":"أتباهى بقوة ذراعي أمام زميل أضعف.","science":"العضلة تقوى بالاستعمال والنوم؛ الفرق بين الأطفال في العمر والنمو لا في القيمة.","action":"لا أسخر من قوة أحد ولا أتحدى أحداً في مسابقات قوة مؤذية.","value":"القوة نعمة تُستعمل في النفع لا في التفاخر.","reference":"مسلم 2664","why":"لماذا لا أتباهى؟ لأن قوتي ليست من صنعي وحدي: الله خلقني بهذا الجسم، ونمت في بيت أطعمني، ونمت كفايتي. وزميلي الأضعف اليوم قد يكون أقوى غداً، أو أذكى في شيء آخر لا أراه. الله وزّع النعم بين الناس بأشكال مختلفة ليحتاج بعضنا بعضاً. والقوة التي تُحبّ هي التي تُستعمل في حمل الحقيبة عن متعب، لا في إذلال أحد.","cards":[],"verses":[]},{"situation":"أسهر طويلاً ثم أتمرن.","science":"العضلة تُبنى في الراحة والنوم لا أثناء الجهد.","action":"أنام كفايتي وأرتاح بعد اللعب.","value":"لجسدي عليّ حق.","reference":"البخاري 1975","why":"لماذا النوم؟ لأن العضلة لا تُبنى وأنا أركض بل وأنا نائم: الجسم يرمّم ما تمزّق في اللعب ويزيد عليه. من يسهر ثم يتمرن يهدم ولا يبني. لجسدي عليّ حق: حق النوم كما حق الطعام.","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا تؤلمنا العضلات بعد يوم أو يومين من تمرين جديد، لا في أثنائه؟","why_open":"نعرف أن الألم المتأخر ليس بسبب «حمض اللاكتيك» كما كان يُظن، لكن سببه الكامل لم يُحسم بعد."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة ذراعاً بعظمتين ومفصل المرفق وعضلتين متقابلتين، وضع{|ي} سهم سحب على كل عضلة، وسمِّ{|ي} الوتر. المستوى ب: اكتب{|ي} اسمي العضلتين {وأضف|وأضيفي} الرباط بلون مختلف.","label":["العضلة","الوتر","الانقباض","الزوج المتقابل","— ب: ذات الرأسين، ثلاثية الرؤوس، الرباط"],"write":"أشرح بكلماتي: لماذا تحتاج الذراع عضلتين لتنثني ثم تمتد؟ ماذا تفعل كل عضلة في الثني، وماذا تفعل في المدّ؟"},"imgs":["U02.L03-E1","U02.L03-E2","U02.L03-E3","U02.L03-E4","U02.L03-E5","U02.L03-exp","U02.L03-hist1","U02.L03-letter","U02.L03-life","U02.L03-title-boy","U02.L03-title-girl"]};
