 في أنبوب، فصارت طبقته العليا صفراء. ماذا نستنتج؟","options":["أن البلازما صفراء، والحمرة من الكريّات","أن الدم فسد","أن الدم كله أصفر في الحقيقة","أن الكريّات الحمراء صارت صفراء حين خرجت من الجسم"],"answer":0,"explanation":"البلازما سائل أصفر فاتح، والكريّات الحمراء الكثيرة هي التي تلوّن الدم؛ فإذا فُصلت ظهر لون البلازما.","feedback_by_option":{"1":"هذا ما يحدث لكل دم سليم حين يُفصل؛ لم يفسد.","2":"الطبقة السفلى حمراء؛ فالدم ليس أصفر كله.","3":"الكريّات الحمراء نزلت إلى الأسفل وبقيت حمراء."},"detects":"M27"}},{"id":"U03.L03.A1.c","objective":"U03.L03.O1","level":"A","type":"locate_on_atlas","prompt":"اضغط{|ي} على الخلايا البيضاء في رسم قطرة الدم.","atlas_target":"wbc","answer":"wbc","alt":{"type":"choose","prompt":"كيف تميّز{|ين} الصفائح في قطرة دم تحت المجهر؟","options":["أكبر الخلايا وأقلها عدداً","أصغر القطع في القطرة","أقراص حمراء كثيرة جداً","السائل الأصفر حول الخلايا"],"answer":1,"explanation":"الصفائح أصغر القطع في القطرة؛ والكريّات الحمراء أقراص كثيرة جداً، والخلايا البيضاء أكبر وأقل عدداً.","feedback_by_option":{"0":"هذه صفة الخلايا البيضاء.","2":"هذه الكريّات الحمراء.","3":"هذه البلازما."}}},{"id":"U03.L03.A2.a","objective":"U03.L03.O2","level":"A","type":"choose","prompt":"من يسدّ الجرح الصغير؟","options":["الكريّات الحمراء","الصفائح","الخلايا البيضاء","البلازما"],"answer":1,"explanation":"الصفائح أول من يصل إلى الجرح، فتلتصق بحافة الوعاء الممزق وتسدّه.","feedback_by_option":{"0":"الكريّات الحمراء تحمل الأكسجين؛ تُمسك في الخثرة لاحقاً، لكنها لا تبدأ السدّ.","2":"الخلايا البيضاء تدافع ضد الميكروبات الداخلة من الجرح، ولا تسدّه.","3":"البلازما سائل يحمل ما يحتاجه السدّ، لكن الذي يلتصق بحافة الجرح أولاً قطع صغيرة فيه."},"alt":{"prompt":"من يحمل المغذيات والفضلات في الدم؟","options":["الخلايا البيضاء","الصفائح","البلازما","الكريّات الحمراء"],"answer":2,"explanation":"البلازما سائل الدم: تحمل المغذيات والفضلات، وتسبح فيها الخلايا كلها.","feedback_by_option":{"0":"الخلايا البيضاء تدافع ضد الميكروبات.","1":"الصفائح تسدّ الجروح.","3":"الكريّات الحمراء تحمل الأكسجين."}}},{"id":"U03.L03.A2.b","objective":"U03.L03.O2","level":"A","type":"explain_open","prompt":"جرحت{|ِ} إصبعك{|ِ} بورقة. صف{|ي} ما يفعله كلٌّ من: الصفائح، والخلايا البيضاء، والكريّات الحمراء، والبلازما في الدقائق الأولى.","answer":"الصفائح تلتصق بحافة الجرح وتسدّه مع خيوط التجلط؛ البيضاء تهاجم الميكروبات الداخلة؛ الحمراء تستمر في نقل الأكسجين إلى الخلايا حول الجرح؛ البلازما تحمل ذلك كله ومعه مواد التجلط.","rubric":"R1"},{"id":"U03.L03.A2.c","objective":"U03.L03.O2","level":"A","type":"true_false_why","prompt":"«الخلايا البيضاء تقرر مهاجمة الميكروب». صح أم خطأ؟","answer":"خطأ؛ لا تقرر؛ تعمل بآليات: تبتلع أو تتعرف على علامات الميكروب.","detects":"M18","rubric":"R1","alt":{"prompt":"«الخلايا البيضاء تعمل بآليات: بعضها يبتلع ما يصادفه من ميكروبات، دون أن يخطط أو يقرر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لا أحد في الدم يخطط؛ الخلايا البيضاء تعمل بآليات: تبتلع، أو تتعرف على علامات على سطح الميكروب.","detects":"M18"}},{"id":"U03.L03.A3.a","objective":"U03.L03.O3","level":"A","type":"choose","prompt":"مصنع خلايا الدم هو:","options":["القلب","الرئتان","نخاع العظم","الكبد"],"answer":2,"explanation":"نخاع العظم هو مصنع خلايا الدم.","feedback_by_option":{"0":"القلب يدفع الدم فقط؛ خلايا الدم تُصنع في نخاع العظم.","1":"في الرئتين يأخذ الدم الأكسجين، ولا تُصنع فيهما خلاياه.","3":"الكبد له أعمال كثيرة، لكن خلايا الدم تُصنع داخل العظام."},"detects":"M06","alt":{"prompt":"أين تُصنع الكريّات الحمراء الجديدة كل يوم؟","options":["في القلب","داخل العظام، في نخاعها","في الدم نفسه وهو يجري","في الرئتين"],"answer":1,"explanation":"خلايا الدم تُصنع داخل العظام، في نخاع العظم، ثم تخرج إلى الدم.","feedback_by_option":{"0":"القلب يدفع الدم ولا يصنعه.","2":"الكريّات لا تتكاثر وهي تجري في الدم؛ تُصنع في مكان ثابت.","3":"في الرئتين يأخذ الدم الأكسجين، ولا تُصنع فيهما خلاياه."},"detects":"M06"}},{"id":"U03.L03.A3.b","objective":"U03.L03.O3","level":"A","type":"locate_on_atlas","prompt":"اضغط{|ي} على المكان الذي تُصنع فيه خلايا الدم.","atlas_target":"marrow","answer":"marrow","alt":{"type":"choose","prompt":"نخاع العظم الذي يصنع خلايا الدم هو:","options":["الحبل الشوكي في الظهر","الطبقة الصلبة الخارجية من العظم","نسيج طري داخل العظام","الغضروف عند المفاصل"],"answer":2,"explanation":"نخاع العظم نسيج طري داخل العظام، وفيه تُصنع خلايا الدم.","feedback_by_option":{"0":"الحبل الشوكي حبل أعصاب داخل الفقرات؛ اسمه قريب لكنه شيء آخر.","1":"الطبقة الصلبة غلاف يحمي؛ والمصنع في الداخل.","3":"الغضروف عند أطراف العظام في المفاصل، ولا يصنع الدم."}}},{"id":"U03.L03.A3.c","objective":"U03.L03.O3","level":"A","type":"choose_reason","prompt":"لماذا يحتاج الجسم إلى صنع كريّات حمراء جديدة كل يوم؟","options":["لأنها تخرج مع العرق كل يوم","لأن القلب يستهلكها ويكسرها في كل ضربة يدفعها","لأننا ننمو، والكبار لا يصنعون كريّات جديدة","لأن كل كريّة تعيش نحو أربعة أشهر ثم تموت"],"answer":3,"explanation":"الكريّة الحمراء تعيش نحو أربعة أشهر ثم تموت، فيصنع النخاع كريّات جديدة كل يوم بدلاً منها.","feedback_by_option":{"0":"العرق ماء وأملاح، ولا تخرج معه خلايا الدم.","1":"القلب يدفع الكريّات ولا يكسرها في كل ضربة.","2":"حتى الكبير الذي توقف عن النمو يصنع كريّات جديدة كل يوم؛ فما السبب؟"},"alt":{"prompt":"تبرّع رجل سليم بكيس من دمه، وبعد أسابيع عاد عدد كريّاته الحمراء كما كان. كيف؟","options":["لم يتغير شيء، لأن الكريّات لا تنقص","صنع قلبه دماً جديداً","عادت الكريّات من الكيس إلى جسمه","صنع نخاع عظمه كريّات جديدة"],"answer":3,"explanation":"نخاع العظم يصنع كريّات حمراء جديدة كل يوم ليعوّض ما يموت منها بعد نحو أربعة أشهر؛ وبعد التبرع يعوّض ما نقص خلال أسابيع.","feedback_by_option":{"0":"نقصت كريّاته بالتبرع ثم عادت؛ فمن صنعها؟","1":"القلب يدفع الدم ولا يصنعه.","2":"الكيس بقي خارج جسمه؛ فمن أين جاءت الكريّات الجديدة؟"},"detects":"M06"}},{"id":"U03.L03.A4.a","objective":"U03.L03.O4","level":"B","type":"sequence","prompt":"رتّب{|ي}: تجف قشرة / تتكون شبكة ألياف / تلتصق الصفائح / يتمزق الوعاء.","options":["يتمزق الوعاء","تلتصق الصفائح","تتكون شبكة ألياف","تجف قشرة"],"answer":[0,1,2,3],"explanation":"يتمزق الوعاء أولاً، فتلتصق الصفائح، ثم تتكون شبكة الألياف، وأخيراً تجف الخثرة قشرة.","alt":{"prompt"
