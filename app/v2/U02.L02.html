const LD = {"id":"U02.L02","first":false,"title":"المفاصل: حيث تلتقي العظام","driving_question":"لماذا تدور ذراعك{|ِ} من الكتف دورة كاملة، ولا ينثني مرفقك{|ِ} إلا في اتجاه واحد؟","central_fact":"المفصل موضع التقاء عظمتين؛ شكله يحدد حركته، وتربطه الأربطة ويلينه الغضروف، وله حدود لا تُجبر.","next":"U02.L03","nexts":[{"id":"U02.L03","gated":false},{"id":"U02.L04","gated":false}],"hook":{"text":"{اسم}، دوّر{|ي} ذراعك{|ِ} من الكتف دورة كاملة. سهل. الآن حاول{|ي} أن تدوّر{|ي} ساعدك{|ِ} حول المرفق الدورة نفسها. لماذا لا يستطيع؟","options":["المرفق أضعف","شكل المفصل مختلف","المرفق لم يتعلم بعد","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["skeleton"],"highlight":["joints"],"zoom":"body"},"text":"حيث تلتقي عظمتان يوجد مفصل. عدّ{|ي} معي على جسمك{|ِ}: الكتف، المرفق، الرسغ، مفاصل الأصابع، الورك، الركبة، الكاحل. في جسمك{|ِ} نحو 300 مفصل أو أكثر بحسب طريقة العدّ، أكثرها في يديك{|ِ} وقدميك{|ِ}. بلا مفاصل كان هيكلك{|ِ} قطعة واحدة لا تنثني."},{"id":"E2","level":"A","atlas":{"layers":["skeleton"],"highlight":["elbow","knee"],"zoom":"elbow","animate":"hinge"},"text":"انظر{|ي} إلى المرفق من الداخل. طرف عظمة يدخل في تجويف على شكل محور، كمفصل الباب. لذلك ينثني في اتجاه واحد ويمتد، ولا يدور دورة كاملة. (أما تدوير الكف لأعلى ولأسفل فمن مفصل صغير آخر بجوار المرفق بين عظمَي الساعد.) نسميه مفصلاً رزّياً، والركبة ومفاصل الأصابع الوسطى مثله."},{"id":"E3","level":"A","atlas":{"layers":["skeleton"],"highlight":["shoulder","hip"],"zoom":"shoulder","animate":"ball"},"text":"أما الكتف فرأس العظمة كرة تدخل في تجويف مستدير. الكرة تدور في كل اتجاه؛ لذلك ترفع{|ين} ذراعك{|ِ} {وتدوّرها|وتدوّرينها} {وتحرّكها|وتحرّكينها} إلى الخلف. نسميه مفصلاً كروياً، والورك مثله. وبعض المفاصل لا يتحرك أبداً: عظام الجمجمة ملتحمة لتحمي الدماغ."},{"id":"E4","level":"A","atlas":{"layers":["skeleton"],"highlight":["ligament","cartilage"],"zoom":"joint_section"},"text":"ما الذي يمنع العظمتين من الانفصال؟ أشرطة قوية متينة نسميها الأربطة تربطهما. وما الذي يمنع احتكاكهما؟ غضروف أملس لين يغطي نهايتيهما، وسائل _variant":"skull_hinge","error":"خطوط الجمجمة مرسومة كمفاصل متحركة","answer":"عظام الجمجمة ثابتة ملتحمة","detects":"M35"}],"numbers":[{"text":"لا يوجد في كتب التشريح عدد واحد معتمد لمفاصل الإنسان: مصدر طبي معروف يقول «نحو 350»، وتعطي تعريفات أخرى أرقاماً أقل أو أكثر بحسب ما يُعدّ مفصلاً.","source":["S3e"]},{"text":"الكتف مفصل كروي يتحرك في كل الاتجاهات تقريباً؛ المرفق مفصل رزّي ينثني نحو 150 درجة في اتجاه واحد فقط.","source":["S3d","S3f"]}],"true_size":[{"text":"افتح{|ي} باباً {وأغلقه|وأغلقيه} وانظر{|ي} إلى مفصله: هكذا مرفقك{|ِ}. ثم ضع{|ي} كرة صغيرة في كوب {وحرّكها|وحرّكيها}: هكذا كتفك{|ِ}.","source":["S1"]}],"animal":{"text":"مفصل كتف الخفاش يدور كالكتف عندنا، لكن أصابعه الطويلة بين أغشية الجناح لها مفاصل مثل أصابعك{|ِ}: جناح الخفاش يد. أما الثعبان فله مئات الفقرات ومفاصلها الصغيرة تجعله ينحني في كل اتجاه بلا أطراف.","source":["S5"]},"organ_letter":{"from":"مفصل الكتف","text":"أنا الكتف، أوسع مفاصلك{|ِ} حركة: كرة في تجويف، أدور حيث {تشاء|تشائين}. لكن اسمع{|ي} سري: كلما اتسعت حركتي قلّ ثباتي، وأربطتي هي التي تمسكني. حين يسحب أحدهم ذراعك{|ِ} بقوة «مزاحاً» فأنا من يتألم ويتمزق. لا تُجبر{|ي}ني، ولا تدع{|ي} أحداً يفعل."},"history":[{"who":"الزهراوي","origin":"قرطبة، الأندلس. مسلم","where_when":"نحو 1000","did":"ألّف «التصريف» وفيه مقالة في الجراحة رسم فيها نحو مئتي أداة ووصف رد الخلع وتثبيت الكسور؛ تُرجم وبقي مرجعاً في أوروبا قروناً.","did_not":"لم يعرف التخدير الحديث ولا التعقيم؛ كثير من طرقه لم يعد مستعملاً.","method_lesson":"التوثيق بالرسم والوصف حتى يستطيع غيرك إعادة ما فعلت.","source":["S4"]}],"how_we_know":{"text":"في قرطبة قبل أكثر من ألف سنة، كتب الطبيب الزهراوي كتاباً كبيراً وضع فيه رسوماً للأدوات التي يستعملها، وشرح كيف يُعاد المفصل المخلوع إلى مكانه وكيف تُثبَّت الكسور. ولماذا الرسم؟ حتى يستطيع طبيب لم يره قط أن يصنع الأداة ويعيد ما فعل. العلم الذي لا يُكتب ويُرسم بدقة يموت مع صاحبه.","limit_question":"ما الذي لا يُظهره رسم المفصل في هذا الدرس؟"},"what_changed":["ظُن أن طقطقة الأصابع تسبب التهاب المفاصل؛ الدراسات لم تجد ذلك."],"model_limits":["رسم المفصل يُظهر العظمين متباعدين ليُرى الغضروف؛ في الحقيقة متلاصقان بسائل رقيق.","الرسم لا يُظهر الأربطة كلها ولا المحفظة.","حركة الرسم ثنائية الأبعاد؛ الكتف يتحرك في ثلاثة أبعاد.","الأسهم حول المفاصل إرشاد للحركة لا قيم لمداها؛ المرفق أعقد مما يُرسم ويشاركه مفصل بين عظمَي الساعد في تدوير الكف.","العمود الفقري مختزل إلى وحدات متكررة لا كل الفقرات."],"faith":{"opening":null,"closing":{"text":"إنه خُلق كل إنسان من بني آدم على ستين وثلاثمائة مفصل، فمن كبّر الله، وحمد الله، وهلّل الله، وسبّح الله، واستغفر الله، وعزل حجراً عن طريق الناس أو شوكة أو عظماً عن طريق الناس، وأمر بمعروف أو نهى عن منكر، عدد تلك الستين والثلاثمائة السُّلامى، فإنه يمشي يومئذٍ وقد زحزح نفسه عن النار","reference":"مسلم 1007","grade":"صحيح","usage":"قيمة","reflection":"أخبرنا النبي ﷺ أن في الإنسان ثلاثمائة وستين مفصلاً. والعلماء حين يعدّون المفاصل يختلف عددهم بحسب تعريف المفصل: هل يُعدّ الثابت كالمتحرك؟ وهل تُعدّ الوصلات الصغيرة بين عظام الرسغ والقدم والأضلاع؟ فلا يوجد عندهم عدد واحد معتمد؛ مصدر طبي معروف يقول «نحو ثلاثمائة وخمسين»، ويختلف العدد بحسب ما يُعدّ. فنأخذ الخبر من الحديث كما هو، ونأخذ العدّ من العلم بطريقته، ولا نجعل أحدهما دليلاً على الآخر. والمقصود من الحديث أن كل مفصل تتحرك به نعمة، وعليك عنها شكر كل يوم: تسبيح، أو كلمة طيبة، أو أذى تزيله عن الطريق، أو إصلاح بين اثنين — وركعتا الضحى تجزئان عن ذلك كله (مسلم 720). ما أول مفصل {ستشكره|ستشكرينه} اليوم، وبماذا؟","reviewed":false,"level":"خبر","concept":"النبي ﷺ أخبرنا بعدد مفاصل الإنسان خبراً، والغرض من الحديث شكر هذه النعمة بالعمل كل يوم. والعلم يعدّ بطرقه ويختلف عدده بتعريف المفصل.","avoid":"لا نقول «أثبت العلم 360» لأن العلم لا يملك رقماً معتمداً، ولا نقول «الحديث خطأ» لأن العدّ يتبع التعريف؛ ننقل الخبر كما هو ونذكر عدّ العلماء بجانبه.","highlight":"على ستين وثلاثمائة مفصل","full_verified":true,"matn_note":"المتن كاملاً كما في المصدر؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://sunnah.com/muslim:1007a","text_compared_on":"2026-10-27","hadith_key":"muslim:1007","lead":"عن عائشة رضي الله عنها أن رسول الله ﷺ قال:","narration":false,"source":"مسلم 1007","grader":"","cards":[]}},"life":[{"situation":"أصدقائي يلعبون بشدّ الأذرع وثني الأصابع إلى الخلف، وبعضهم يسخر من زميل بكلمة جارحة.","science":"الأذى باليد: الأربطة تتمزق عند تجاوز مدى المفصل والكتف يُخلع بسهولة. الأذى باللسان: الكلمة الجارحة تُشعل في جسم السامع الاستجابة نفسها التي يُشعلها الخوف — يسرع قلبه ويضيق نفسه وتبرد يداه، وإن تكررت أفسدت نومه وتركيزه. والمتكلم نفسه حين يغضب ويشتم يرتفع نبضه وضغطه وتتوتر عضلاته، ويعتاد جسمه الغضب فيصير أسرع إليه.","action":"لا أُجبر مفصل أحد ولا أجرح أحداً بكلمة، وأرفض اللعب المؤذي والسخرية بوضوح.","value":"الأذى في المزاح أذى؛ لا ضرر ولا ضرار.","reference":"البخاري 10؛ ونحوه عند مسلم 40","why":"يدي ولساني نعمتان أُسأل عنهما: أُعين بهما أو أؤذي بهما. والنبي ﷺ جعل سلامة المسلمين من لسان المسلم ويده علامةَ إسلامه الحقيقي، والأذى ممنوع مع كل إنسان؛ وقدّم اللسان على اليد لأن جرح الكلمة يبقى بعد أن يلتئم جرح اليد. والمفصل الذي أُجبره لا يعود كما كان، والكلمة التي أقولها لا تعود؛ فالأذى في المزاح أذى حقيقي يبقى في الجسم والنفس.","hadith":["bukhari:10"],"cards":[{"key":"bukhari:10","lead":"عن عبد الله بن عمرو رضي الله عنهما، عن النبي ﷺ قال:","text":"المسلم من سلم المسلمون من لسانه ويده، والمهاجر من هجر ما نهى الله عنه","narration":false,"source":"البخاري 10؛ ونحوه عند مسلم 40","grade":"صحيح","grader":""}],"verses":[]},{"situation":"صديق يتباهى بمرونته ويطلب أن أثني ظهره.","science":"إجبار الظهر يمزّق أربطته وعضلاته، وفي الحالات الشديدة يهدد الأعصاب.","action":"أرفض وأشرح السبب.","value":"الرفض الواعي شجاعة.","why":"لماذا أرفض وأنا أحب صديقي؟ لأن داخل الفقرات حبل من الأعصاب يأمر الساقين والذراعين، وإن تأذّى فقد لا يُصلح. المرونة نعمة عند صديقي، لكن النعمة تُحفظ بالعناية لا بالاستعراض. الرفض هنا ليس جبناً؛ هو حفظ لصديقي من ضرر لا يراه.","cards":[],"verses":[]},{"situation":"تجادلت مع صديقي: كم مفصلاً في الجسم؟ هو يقول 300 وأنا أقول 360.","science":"العدد يتبع التعريف؛ كلا الرقمين يصح بتعريفه.","action":"قبل أن أجادل في رقم أسأل: ماذا نعدّ بالضبط؟ ثم نعدّ معاً.","why":"الناس تختلف تعريفاتهم وطرق عدّهم، وليس كل اختلاف في الأرقام خطأً من أحد. العاقل يبحث عن سبب الفرق قبل أن يحكم؛ وهذا ما يفعله العلماء، وهو من التثبت الذي أمرنا به.","value":"التبيّن قبل الحكم","reference":"الحجرات 6","cards":[],"verses":[]}],"open_questions":[{"q":"ما الذي يُصدر صوت طقطقة الأصابع بالضبط: تكوّن فقاعة في سائل المفصل أم انفجارها؟","why_open":"دراسة بالتصوير عام 2015 قالت: تكوّن الفقاعة. دراسة حسابية عام 2018 قالت: انفجار جزء منها. العلماء ما زالوا مختلفين، وهذا طبيعي في العلم."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة مفصلاً رزّياً ومفصلاً كروياً وسمِّ{|ي} فيهما: العظم، الغضروف، الرباط. المستوى ب: {أضف|أضيفي} رسم فقرتين بينهما غضروف.","label":["المفصل","رزّي","كروي","ثابت","الرباط","الغضروف"],"write":"جدول مسح مفاصلي وتصنيفها. ثم أشرح: لماذا لا أُجبر مفصلاً على حركة ليست من حركاته؟ ماذا قد يحدث للرباط أو للمفصل؟"},"imgs":["U02.L02-E1","U02.L02-E2","U02.L02-E3","U02.L02-E4","U02.L02-E5","U02.L02-E6","U02.L02-E7","U02.L02-exp","U02.L02-hist1","U02.L02-letter","U02.L02-life","U02.L02-title-boy","U02.L02-title-girl"]};
