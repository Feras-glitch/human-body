<script>
const LD = {"id":"U07.T01","lesson":"U07.L01","first":false,"title":"اختبار: الكليتان: مصفاتان تعيدان ما ينفع","lessonTitle":"الكليتان: مصفاتان تعيدان ما ينفع","concepts":[],"check":[],"items":[{"id":"U07.L01.A1.a","objective":"U07.L01.O1","level":"A","type":"choose_reason","prompt":"أين تقع الكليتان؟","options":["في أسفل البطن من الأمام","في الصدر حول القلب","في الظهر تحت آخر الأضلاع","في الحوض تحت السُّرّة"],"answer":2,"explanation":"الكليتان في الظهر تحت آخر الأضلاع، واحدة على كل جانب من العمود الفقري.","feedback_by_option":{"0":"في أسفل البطن من الأمام المثانة. الكليتان في الظهر.","1":"حول القلب الرئتان. الكليتان أسفل منهما، في الظهر.","3":"في الحوض المثانة. الكليتان أعلى، تحت آخر الأضلاع من الخلف."},"detects":"M69","alt":{"prompt":"{وضعت|وضعتِ} يديك{|ِ} على خصرك{|ِ} وأدرت{|ِ} الإبهامين إلى الخلف تحت آخر ضلع. ماذا تحت الإبهامين في العمق؟","options":["المعدة","الكليتان","المثانة","القلب"],"answer":1,"explanation":"تحت آخر الأضلاع من الخلف، على جانبي العمود الفقري، تقع الكليتان.","feedback_by_option":{"0":"المعدة في أعلى البطن من الأمام، يساراً.","2":"المثانة في أسفل البطن من الأمام.","3":"القلب في الصدر، فوق الحجاب الحاجز."},"detects":"M69"}},{"id":"U07.L01.A1.b","objective":"U07.L01.O1","level":"A","type":"locate_on_atlas","prompt":"حدّد{|ي} موضع الكليتين على رسم الظهر.","answer":"kidneys","atlas_target":"kidneys","alt":{"type":"choose","prompt":"للإنسان كليتان. كيف تتوزعان في الجسم؟","options":["واحدة على كل جانب من العمود الفقري","الاثنتان في الجانب الأيسر","واحدة في الصدر وأخرى في البطن","الاثنتان في الحوض"],"answer":0,"explanation":"الكليتان واحدة على كل جانب من العمود الفقري، في الظهر تحت آخر الأضلاع، واليمنى أنزل قليلاً.","feedback_by_option":{"1":"واحدة في كل جانب؛ والقلب هو المائل إلى اليسار.","2":"الاثنتان في الظهر، تحت الأضلاع، على مستوى واحد تقريباً.","3":"في الحوض المثانة؛ الكليتان أعلى منه."}}},{"id":"U07.L01.A1.c","objective":"U07.L01.O1","level":"A","type":"true_false_why","prompt":"«الكلية اليمنى أنزل قليلاً من اليسرى». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لأن الكبد الكبير فوقها يزيحها قليلاً إلى الأسفل.","rubric":"R1","alt":{"prompt":"«الكليتان قريبتان من الجلد في البطن من الأمام، فنستطيع أن نراهما تحته». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ هما في عمق الظهر تحميهما العضلات والدهن والأضلاع، فلا تُريان من فوق الجلد."}},{"id":"U07.L01.A2.a","objective":"U07.L01.O2","level":"A","type":"choose_reason","prompt":"ماذا يبقى في الدم ولا يعبر مصفاة الكلية؟","options":["الماء","السكر","الملح","خلايا الدم الحمراء"],"answer":3,"explanation":"خلايا الدم الحمراء كبيرة على المصفاة فتبقى في الدم؛ أما الماء والسكر والملح فتعبر.","feedback_by_option":{"0":"الماء يعبر المصفاة، ثم يعود معظمه إلى الدم في الأنبوب.","1":"السكر صغير ذائب فيعبر، ثم يعود كله تقريباً إلى الدم.","2":"الملح صغير ذائب فيعبر، ويعود منه ما يحتاجه الجسم."},"alt":{"prompt":"أخذنا قطرة من السائل المرشَّح في الكلية. ماذا نجد فيها؟","options":["ماء وسكراً وأملاحاً ويوريا","خلايا دم حمراء وبيضاء","دماً كاملاً كما هو","بروتينات كبيرة وخلايا"],"answer":0,"explanation":"السائل المرشَّح ماء وما ذاب فيه من أشياء صغيرة: سكر وأملاح ويوريا؛ والخلايا والبروتينات الكبيرة بقيت في الدم.","feedback_by_option":{"1":"الخلايا كبيرة على المصفاة فتبقى في الدم.","2":"لو عبر الدم كله لما كانت هناك مصفاة؛ الخلايا تبقى.","3":"البروتينات الكبيرة والخلايا تبقى في الدم."}}},{"id":"U07.L01.A2.b","objective":"U07.L01.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} ما يحدث للدم في الكلية.","options":["يدخل الدم الكلية من شريان","يُرشَّح في المصفاة الصغيرة (الكبة)","يمشي السائل المرشَّح في الأنبوب","يعود معظمه إلى الدم","ينزل الباقي بولاً نحو المثانة"],"answer":[0,1,2,3,4],"explanation":"يدخل الدم من الشريان، فيُرشَّح في الكبة، ويمشي المرشَّح في الأنبوب، فيعود معظمه إلى الدم، وينزل الباقي بولاً.","alt":{"prompt":"رتّب{|ي} رحلة قطرة سكر في دمك{|ِ} حين تمرّ في الكلية.","options":["تصل في الدم إلى الكلية","تعبر المصفاة مع الماء","تمشي في الأنبوب","تعود إلى الدم"],"answer":[0,1,2,3],"explanation":"السكر صغير فيعبر المصفاة مع الماء، ثم يعيده الأنبوب كله تقريباً إلى الدم؛ ولذلك لا يكون في البول عادة."}},{"id":"U07.L01.A2.c","objective":"U07.L01.O2","level":"A","type":"true_false_why","prompt":"«ما يُرشَّح في الكليتين في يوم واحد أكثر من مئة لتر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو 150 إلى 180 لتراً عند الكبير، لأن الدم يدور فيمرّ في الكليتين مرات كثيرة.","rubric":"R1","alt":{"prompt":"«خلايا الدم الحمراء تعبر مصفاة الكلية وتخرج في البول عادةً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الخلايا كبيرة فتبقى في الدم؛ وإن ظهر دم في البول نخبر الأهل والطبيب."}},{"id":"U07.L01.A3.a","objective":"U07.L01.O3","level":"A","type":"choose","prompt":"من نحو 150 لتراً تُرشَّح في اليوم عند الكبير، كم يخرج بولاً؟","options":["نحو لتر أو لترين","نحو 20 لتراً","نحو 75 لتراً، أي النصف","150 لتراً، أي كل ما رُشِّح"],"answer":0,"explanation":"يعود نحو 99 في المئة إلى الدم، فلا يخرج بولاً إلا لتر أو لتران في اليوم.","feedback_by_option":{"1":"20 لتراً كثير جداً؛ نحن لا نشرب ذلك كله. يعود أكثر من ذلك إلى الدم.","2":"لو خرج النصف لفقد الجسم ماءه في ساعات؛ يعود نحو 99 في المئة.","3":"لو خرج كل ما رُشِّح لفقد الجسم ماءه وسكّره؛ معظمه يعود."},"detects":"M70","alt":{"prompt":"لو لم يُعد الأنبوب شيئاً إلى الدم، ماذا يحدث؟","options":["يصير الجسم أنظف لأن الكلية أخرجت كل ما مرّ بها","لا يتغير شيء لأن الكلية تعمل كالعادة","يفقد الجسم ماءه وسكّره في ساعات","يمتلئ الدم بالماء"],"answer":2,"explanation":"بلا إعادة امتصاص يخرج كل المرشَّح، نحو 150 لتراً، فيفقد الجسم ماءه وسكّره سريعاً.","feedback_by_option":{"0":"إخراج كل شيء يُفقد الجسم ما يحتاجه؛ الكلية تعيد ما ينفع.","1":"الإعادة جزء من عمل الكلية؛ بدونها يتغير كل شيء.","3":"بل يقلّ ماء الدم، لأن كل المرشَّح يخرج."},"detects":"M70"}},{"id":"U07.L01.A3.b","objective":"U07.L01.O3","level":"A","type":"explain_open","prompt":"لماذا نقول إن الكليتين «تعيدان ما ينفع» ولا نكتفي بقول «تنظفان الدم»؟","answer":"لأنهما ترشّحان كل الصغير ثم تعيدان معظم الماء والسكر وما يلزم من الأملاح، ولا تُخرجان إلا الزائد مع الفضلات؛ عملهما توازن.","rubric":"R1","detects":"M14"},{"id":"U07.L01.A3.c","objective":"U07.L01.O3","level":"A","type":"true_false_why","prompt":"«عمل الكليتين أن تُخرجا من الدم كل ما فيه من ماء وأملاح». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تعيدان معظم الماء وما يلزم من الأملاح إلى الدم، ولا تُخرجان إلا الزائد مع الفضلات.","rubric":"R1","detects":"M14","alt":{"prompt":"«حين يحتاج الجسم ماءً تعيد الكليتان ماءً أكثر إلى الدم فيقلّ البول». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكليتان توازنان: تعيدان أكثر حين يحتاج الجسم، وتُخرجان أكثر حين يزيد الماء."}},{"id":"U07.L01.A4.a","objective":"U07.L01.O4","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة البروتين الزائد حتى يخرج.","options":["بروتين من الطعام","يُكسّره الجسم","يصنع الكبد اليوريا","يحملها الدم إلى الكليتين","تخرج في البول"],"answer":[0,1,2,3,4],"explanation":"يُكسّر الجسم البروتين، فيصنع الكبد اليوريا، ويحملها الدم إلى الكليتين فتُخرجانها في البول.","alt":{"prompt":"رتّب{|ي} رحلة قطرة ماء {شربتها|شربتِها} حتى تصير بولاً.","options":["الفم والمريء","المعدة ثم الأمعاء","تُمتص إلى الدم","تُرشَّح في الكلية","تنزل إلى المثانة"],"answer":[0,1,2,3,4],"explanation":"الماء يمرّ في الفم والمريء والمعدة، ثم تمتصه الأمعاء إلى الدم، فترشّحه الكلية، وما زاد ينزل بولاً إلى المثانة."}},{"id":"U07.L01.A4.b","objective":"U07.L01.O4","level":"A","type":"choose_reason","prompt":"{شربت|شربتِ} كوب ماء كبيراً، وبعد ساعة {احتجت|احتجتِ} إلى الحمام. ما الذي حدث للماء؟","options":["نزل من المعدة إلى المثانة مباشرة","امتُص إلى الدم ثم رشّحته الكليتان","صنعت منه المثانة البول","بقي في المعدة ساعة ثم خرج"],"answer":1,"explanation":"الماء يُمتص إلى الدم في الأمعاء، ثم ترشّحه الكليتان، وما زاد عن الحاجة ينزل بولاً إلى المثانة.","feedback_by_option":{"0":"لا أنبوب بين المعدة والمثانة؛ الماء يمرّ في الدم أولاً.","2":"المثانة تخزّن البول ولا تصنعه؛ تصنعه الكليتان من الدم.","3":"المعدة لا تُخرج الماء بولاً؛ يتابع إلى الأمعاء فيُمتص."},"detects":"M13","alt":{"prompt":"هل يوجد أنبوب يوصل الماء من المعدة إلى المثانة؟","options":["نعم، يمرّ فيه الماء مباشرة","نعم، لكنه للعصير وحده","لا؛ الماء يمرّ في الدم أولاً","لا؛ الماء يبقى في المعدة"],"answer":2,"explanation":"لا أنبوب بينهما: الماء يُمتص إلى الدم في الأمعاء، ثم ترشّحه الكليتان، وما زاد ينزل إلى المثانة.","feedback_by_option":{"0":"لا أنبوب بين المعدة والمثانة؛ لو كان لخرج الماء قبل أن ينفع الجسم.","1":"العصير والماء يسلكان الطريق نفسه: الأمعاء ثم الدم ثم الكليتان.","3":"الماء لا يبقى في المعدة؛ يتابع إلى الأمعاء فيُمتص."},"detects":"M13"}},{"id":"U07.L01.A4.c","objective":"U07.L01.O4","level":"A","type":"true_false_why","prompt":"«البول يتغير مع ما نشرب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكليتان تُخرجان ما زاد: إذا شربنا كثيراً خرج ماء أكثر فصار البول أكثر وأفتح، وإذا شربنا قليلاً قلّ وغمق.","rubric":"R1","alt":{"prompt":"«اليوريا تصنعها الكليتان من الماء». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يصنعها الكبد حين يُكسّر الجسم البروتين، والكليتان تُخرجانها في البول."}},{"id":"U07.L01.A5.a","objective":"U07.L01.O5","level":"B","type":"choose","prompt":"ما النفرون؟","options":["خلية دم بيضاء في الكلية","الأنبوب بين الكلية والمثانة","عضلة صغيرة تغلق مخرج المثانة","وحدة ترشيح: كبة وأنبوب"],"answer":3,"explanation":"النفرون وحدة ترشيح صغيرة جداً: كبة تُرشّح وأنبوب يعيد ما ينفع؛ وفي كل كلية نحو مليون منها.","feedback_by_option":{"0":"الخلايا البيضاء تدافع عن الجسم؛ النفرون وحدة ترشيح.","1":"هذا الحالب؛ يخرج من الكلية بعد أن يكتمل البول في النفرونات.","2":"العضلة التي تغلق مخرج المثانة شيء آخر، نعرفه في الدرس القادم."},"alt":{"prompt":"كم نفروناً في الكلية الواحدة تقريباً؟","options":["عشرة","ألف","نحو مليون","نحو مليار"],"answer":2,"explanation":"في كل كلية نحو مليون نفرون، كل منها أصغر من أن يُرى بالعين.","feedback_by_option":{"0":"أكثر بكثير؛ النفرون لا يُرى إلا بالمجهر لصغره.","1":"أكثر بكثير؛ نحو مليون في كل كلية.","3":"المليار أكثر من الحقيقة؛ نحو مليون في كل كلية."}}},{"id":"U07.L01.A5.b","objective":"U07.L01.O5","level":"B","type":"explain_open","prompt":"ارسم{|ي} نفروناً بالكلمات: أين يحدث الترشيح؟ وأين إعادة الامتصاص؟ وإلى أين يذهب الباقي؟","answer":"الترشيح في الكبة (شعيرات ملفوفة داخل كأس صغيرة)، وإعادة الامتصاص في الأنبوب الطويل الذي تحيطه شعيرات؛ والباقي يصبّ في وسط الكلية ثم ينزل في الحالب.","rubric":"R1"},{"id":"U07.L01.A5.c","objective":"U07.L01.O5","level":"B","type":"true_false_why","prompt":"«الكليتان تأخذان نحو ربع الدم الذي يضخه القلب في الراحة مع أن وزنهما صغير». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لأن عملهما على الدم نفسه: ترشّحانه ثم تعيدان ما ينفع.","rubric":"R1","alt":{"prompt":"«الكلية تحتاج دماً قليلاً لأنها صغيرة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تأخذ الكليتان نحو ربع ما يضخه القلب في الراحة، لأنهما ترشّحان الدم نفسه."}},{"id":"U07.L01.A6.a","objective":"U07.L01.O6","level":"B","type":"choose","prompt":"ماذا رأى جالينوس حين ربط الحالبين في حيوان حي؟","options":["امتلأ الحالبان وبقيت المثانة فارغة","امتلأت المثانة سريعاً","توقفت الكليتان عن العمل فوراً","خرج البول من الجلد"],"answer":0,"explanation":"امتلأ الحالبان فوق الرباط وبقيت المثانة فارغة، فلما فكّ الرباط امتلأت: البول يأتي من الكليتين عبر الحالبين.","feedback_by_option":{"1":"الرباط سدّ الطريق، فلم يصل البول إلى المثانة.","2":"استمرت الكليتان تصنعان البول، فامتلأ الحالبان فوق الرباط.","3":"لم يخرج البول من الجلد؛ تجمّع في الحالبين."},"alt":{"prompt":"ماذا استنتج جالينوس من تجربة ربط الحالبين؟","options":["البول يُصنع في المثانة","البول يأتي من الكليتين عبر الحالبين","البول يأتي من المعدة مباشرة","البول يُصنع في الحالبين"],"answer":1,"explanation":"المثانة بقيت فارغة والحالبان امتلآ؛ فالبول يأتي إليها من الكليتين عبر الحالبين.","feedback_by_option":{"0":"لو صُنع في المثانة لامتلأت والرباط مشدود؛ لكنها بقيت فارغة.","2":"الرباط على الحالبين وحدهما، وبه توقف البول؛ فطريقه من الكليتين.","3":"الحالبان ينقلان البول؛ امتلآ لأن الكليتين تصنعانه فوقهما."}}},{"id":"U07.L01.A6.b","objective":"U07.L01.O6","level":"B","type":"explain_open","prompt":"وجد ويرن وريتشاردز السكر في السائل حول الكبة، ولم يجداه في بول المثانة. ماذا يعني ذلك؟","answer":"أن السكر رُشِّح مع الماء، ثم أُعيد إلى الدم في الأنبوب قبل أن يصير بولاً: ترشيح أولاً ثم إعادة امتصاص.","rubric":"R1"},{"id":"U07.L01.A6.c","objective":"U07.L01.O6","level":"B","type":"true_false_why","prompt":"«رأى ويرن وريتشاردز السكر يعود إلى الد
