اب الحاجز فوق الرئتين، تحت العنق». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الحجاب الحاجز عضلة قبّية تحت الرئتين، تفصل الصدر عن البطن."}},{"id":"U04.L01.A2.a","objective":"U04.L01.O2","level":"A","type":"choose","prompt":"ما الذي يسحب الهواء إلى الرئتين؟","options":["الرئتان نفساهما؛ تنتفخان بعضلاتهما","اتساع الصدر حين ينزل الحجاب الحاجز وترتفع الأضلاع","القلب؛ يسحب الهواء مع الدم في كل ضربة إلى الصدر والرئتين","الأنف؛ يسحب الهواء بقوة ويدفعه إلى الأسفل"],"answer":1,"explanation":"حين ينزل الحجاب الحاجز وترتفع الأضلاع يتسع الصدر، فتتمدد الرئتان ويدخل الهواء.","feedback_by_option":{"0":"الرئتان ليس فيهما عضلات تحركهما؛ الحجاب الحاجز وعضلات الأضلاع توسّع الصدر فتتمدد الرئتان.","2":"القلب يدفع الدم، ولا يسحب الهواء.","3":"الأنف ممرّ يدفّئ الهواء وينظّفه، لكنه لا يسحب الهواء."},"detects":"M43","alt":{"prompt":"في الشهيق تتمدد الرئتان. لماذا؟","options":["لأن القلب دفع فيهما هواءً","لأن عضلات الرئتين انقبضت فشفطت الهواء إلى داخلهما","لأن الصدر اتسع حين نزل الحجاب الحاجز","لأن المعدة ضغطتهما"],"answer":2,"explanation":"الرئتان تتبعان الصدر: حين ينزل الحجاب الحاجز وترتفع الأضلاع يتسع الصدر، فتتمدد الرئتان ويدخل الهواء.","feedback_by_option":{"0":"القلب يدفع الدم لا الهواء.","1":"الرئتان ليس فيهما عضلات تحرّكهما.","3":"المعدة تحت الحجاب الحاجز، ولا تحرّك الرئتين."},"detects":"M43"}},{"id":"U04.L01.A2.b","objective":"U04.L01.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} ما يحدث في الزفير الهادئ.","options":["ترتخي عضلات التنفس","يعود الحجاب الحاجز قبّة ويضيق الصدر","تنكمش الرئتان","يخرج الهواء"],"answer":[0,1,2,3],"explanation":"في الزفير الهادئ ترتخي العضلات، فيعود الحجاب الحاجز قبّة ويضيق الصدر، فتنكمش الرئتان ويخرج الهواء.","alt":{"prompt":"رتّب{|ي} نَفَساً كاملاً: شهيقاً ثم زفيراً.","options":["ينقبض الحجاب الحاجز وينزل","يدخل الهواء","ترتخي العضلات ويعود الحجاب الحاجز قبّة","يخرج الهواء"],"answer":[0,1,2,3],"explanation":"في الشهيق ينقبض الحجاب الحاجز وينزل فيدخل الهواء، وفي الزفير ترتخي العضلات ويعود الحجاب الحاجز قبّة فيخرج الهواء."}},{"id":"U04.L01.A2.c","objective":"U04.L01.O2","level":"A","type":"explain_open","prompt":"لماذا نقول إن الحجاب الحاجز «يسحب» ولا «يدفع»؟","answer":"لأنه عضلة، والعضلة تنقبض فتقصر وتسحب فقط؛ حين تنقبض تنزل فيتسع الصدر ويقلّ الضغط داخله، فيدفع هواءُ الخارج نفسَه إلى الرئتين. العضلة لا تدفع الهواء.","rubric":"R1"},{"id":"U04.L01.A3.a","objective":"U04.L01.O3","level":"A","type":"choose","prompt":"كم يتنفس طفل هادئ في الدقيقة تقريباً؟","options":["نحو 2","نحو 20","نحو 200"],"answer":1,"explanation":"الطفل الهادئ يتنفس نحو عشرين مرة في الدقيقة.","feedback_by_option":{"0":"عدّ{|ي} أنفاسك{|ِ} دقيقة: ستجد{|ين} أكثر بكثير من نَفَسين.","2":"200 نَفَس في الدقيقة أكثر من ثلاثة أنفاس في الثانية! عدّ{|ي} أنفاسك{|ِ} لتعرف{|ي}."},"alt":{"prompt":"عدّ طفل أنفاسه وهو جالس هادئ 15 ثانية فكانت 5. كم نَفَساً تقريباً في الدقيقة؟","options":["نحو 5","نحو 20","نحو 60","نحو 100"],"answer":1,"explanation":"15 ثانية ربع دقيقة؛ 5 × 4 = 20 نَفَساً في الدقيقة، وهو قريب مما يتنفسه طفل هادئ.","feedback_by_option":{"0":"هذا عدد ربع دقيقة فقط؛ والدقيقة أربعة أرباع.","2":"60 تعني نَفَساً كل ثانية. اضرب{|ي} العدد في 4، لأن الدقيقة أربعة أرباع.","3":"هذا كثير جداً لطفل هادئ؛ والدقيقة أربعة أرباع فقط."}}},{"id":"U04.L01.A3.b","objective":"U04.L01.O3","level":"A","type":"predict","prompt":"طفل عدّ أنفاسه بعد الركض فوجدها 36. بعد خمس دقائق جلوس، هل تكون أكثر أم أقل؟","options":["أقل","أكثر","مثلها"],"answer":0,"explanation":"بعد الراحة تقلّ حاجة العضلات إلى الأكسجين، فيعود التنفس أبطأ.","feedback_by_option":{"1":"في الراحة تقلّ حاجة العضلات؛ فهل يزيد التنفس؟","2":"الجسم يهدأ في الراحة، والتنفس يعود أبطأ."},"alt":{"prompt":"طفلة تتنفس 20 مرة في الدقيقة وهي جالسة، ثم ركضت دقيقتين. تتوقع{|ين} عدد أنفاسها فور التوقف:","options":["أقل من 20","أكثر من 20","20 كما كانت"],"answer":1,"explanation":"بعد الركض تحتاج العضلات أكسجيناً أكثر، فيزيد الدماغ عدد الأنفاس، ثم يعود في الراحة.","feedback_by_option":{"0":"الركض يزيد حاجة العضلات إلى الأكسجين؛ فهل يقل التنفس؟","2":"الجهد يغيّر حاجة الجسم؛ فهل يبقى العدد كما هو؟"}}},{"id":"U04.L01.A3.c","objective":"U04.L01.O3","level":"A","type":"choose","prompt":"بدأت{|ِ} تركض{|ين}. متى يبدأ قلبك{|ِ} في الإسراع بالنسبة إلى تنفسك{|ِ}؟","answer":0,"detects":"M22","options":["في الوقت نفسه تقريباً","بعد أن يزيد التنفس بدقيقة","بعد أن تتوقف{|ي} عن الركض","لا يتغير القلب مع الركض"],"explanation":"يتسارعان معاً تقريباً لأن الحاجة واحدة: العضلات تطلب أكسجيناً أكثر، والدماغ يضبط القلب والتنفس معاً.","feedback_by_option":{"1":"القلب لا ينتظر التنفس؛ الدماغ يسرّع الاثنين معاً تقريباً منذ بداية الركض.","2":"القلب يسرع أثناء الركض لا بعده، حين تحتاج العضلات أكثر.","3":"جسّ{|ي} نبضك{|ِ} بعد الركض: ستجد{|ين}ه أسرع."},"alt":{"prompt":"حين {تبدأ|تبدئين} الركض:","options":["يسرع القلب والتنفس معاً تقريباً","يسرع التنفس أولاً، وبعد دقائق يسرع القلب","يسرع القلب، ويبقى التنفس كما هو","لا يتغير شيء حتى تتوقف{|ي}"],"answer":0,"explanation":"الجسم شبكة لا طابور: العضلات تطلب أكسجيناً أكثر، فيسرّع الدماغ القلب والتنفس معاً.","feedback_by_option":{"1":"لا ينتظر أحدهما الآخر؛ الحاجة واحدة فيسرعان معاً.","2":"التنفس يسرع أيضاً؛ لاحظ{|ي} لهاثك{|ِ} وأنت{|ِ} تركض{|ين}.","3":"القلب والتنفس يسرعان أثناء الركض نفسه."},"detects":"M22"}},{"id":"U04.L01.A4.a","objective":"U04.L01.O4","level":"A","type":"sequence","prompt":"رتّب{|ي} طريق الهواء.","options":["الفم أو الأنف","القصبة الهوائية","الشعبتان","الحويصلات"],"answer":[0,1,2,3],"explanation":"يدخل الهواء من الفم أو الأنف إلى القصبة الهوائية، ثم إلى الشعبتين، حتى يصل إلى الحويصلات.","alt":{"prompt":"رتّب{|ي} طريق الهواء وهو يخرج في الزفير، ابتداءً من الحويصلات.","options":["الحويصلات","الأنابيب الدقيقة","الشعبتان","القصبة الهوائية","الأنف أو الفم"],"answer":[0,1,2,3,4],"explanation":"في الزفير يسلك الهواء الطريق نفسه معكوساً: من الحويصلات إلى الأنابيب الدقيقة، فالشعبتين، فالقصبة الهوائية، ثم يخرج من الأنف أو الفم."}},{"id":"U04.L01.A4.b","objective":"U04.L01.O4","level":"A","type":"choose_reason","prompt":"من أين يأتي الأكسجين الذي في رئتيك{|ِ}؟","options":["تصنعه الرئتان","من الهواء الخارجي","من الدم","من الطعام"],"answer":1,"explanation":"الرئتان لا تصنعان الأكسجين؛ يأتي مع الهواء الذي نتنفسه من الخارج.","feedback_by_option":{"0":"الرئتان لا تصنعان الأكسجين؛ تنقلانه من الهواء الخارجي إلى الدم.","2":"الدم يأخذ الأكسجين من الرئتين، لا يعطيها إياه.","3":"الطعام يعطي الجسم الغذاء؛ والأكسجين في الهواء."},"detects":"M02","alt":{"prompt":"لماذا لا نستطيع التنفس تحت الماء؟","options":["لأن الأنف يُغلق تحت الماء","لأن الماء بارد","لأن رئتينا تأخذان الأكسجين من الهواء لا من الماء","لأن الرئتين تتوقفان عن العمل حين يلمس الماء الوجه"],"answer":2,"explanation":"الرئتان لا تصنعان الأكسجين؛ تنقلانه من الهواء إلى الدم. وتحت الماء لا هواء نتنفسه.","feedback_by_option":{"0":"قد يدخل الماء الأنف؛ والمشكلة أن الرئتين تحتاجان هواءً لا ماءً.","1":"حتى في الماء الدافئ لا نستطيع التنفس؛ السبب أن لا هواء هناك.","3":"الرئتان لا تتوقفان وحدهما؛ لكنهما لا تجدان هواءً تأخذ منه الأكسجين."},"detects":"M02"}},{"id":"U04.L01.A4.c","objective":"U04.L01.O4","level":"A","type":"choose_reason","prompt":"لماذا نغصّ أحياناً حين نتكلم ونأكل في الوقت نفسه؟","options":["لأن اللهاة أغلقت الأنف فلم نجد طريقاً للهواء","لأن المعدة امتلأت فردّت الطعام إلى الحلق","لأن لسان المزمار لم يغلق القصبة الهوائية فدخلها الطعام","لأن الكلام يجعل الأسنان تتوقف عن المضغ فنبلع قطعاً كبيرة"],"answer":2,"explanation":"لسان المزمار يغلق القصبة الهوائية حين نبلع؛ فإذا تكلمنا ونحن نأكل قد لا يغلقها في الوقت المناسب فيدخلها الطعام فنغصّ.","feedback_by_option":{"0":"الذي يغلق القصبة الهوائية عند البلع هو لسان المزمار، غطاء صغير فوق الحنجرة، لا اللهاة.","1":"الغصّة تحدث في الحلق حين يدخل شيء في طريق الهواء، لا من المعدة.","3":"المضغ مهم، لكن الغصّة تحدث حين يدخل الطعام القصبة الهوائية."},"detects":"M12","alt":{"prompt":"ما الذي يغلق مدخل القصبة الهوائية حين نبلع؟","options":["الأسنان","اللهاة","اللسان","لسان المزمار"],"answer":3,"explanation":"لسان المزمار غطاء صغير فوق الحنجرة، ينغلق على مدخل القصبة الهوائية حين نبلع، فيذهب الطعام إلى المريء.","feedback_by_option":{"0":"الأسنان تمضغ الطعام في الفم، بعيداً عن مدخل القصبة.","1":"اللهاة تساعد على سدّ طريق الأنف عند البلع، لا مدخل القصبة الهوائية.","2":"اللسان يدفع الطعام إلى الحلق، ولا يغلق القصبة."},"detects":"M12"}},{"id":"U04.L01.A5.a","objective":"U04.L01.O5","level":"B","type":"choose","prompt":"من يقرر سرعة تنفسك{|ِ} في أغلب الوقت؟","options":["أنا بإرادتي","الرئتان","القلب","الدماغ تلقائياً"],"answer":3,"explanation":"الدماغ يضبط سرعة التنفس تلقائياً في أغلب الوقت، ونستطيع التحكم فيه قليلاً فقط.","feedback_by_option":{"0":"نستطيع التحكم قليلاً، كحبس النفس، لكن أغلب الوقت يضبطه شيء آخر دون أن نفكر.","1":"الرئتان تتحركان بحركة الصدر، ولا تقرران السرعة.","2":"القلب يسرع مع التنفس، لكنه لا يقرر سرعة التنفس."},"alt":{"prompt":"تستطيع{|ين} أن تتنفس{|ي} ببطء حين تريد{|ين}، لكنك{|ِ} حين {تنسى|تنسين} الأمر يعود تنفسك{|ِ} كما كان. لماذا؟","options":["لأن الدماغ يعود فيضبط التنفس تلقائياً","لأن الرئتين تقرران متى تتنفسان وكم مرة","لأن القلب يأمر الرئتين","لأن الهواء يقرر"],"answer":0,"explanation":"نستطيع التحكم في التنفس قليلاً، لكن الدماغ يضبطه تلقائياً في أغلب الوقت، فيعود فيأخذ القيادة حين ننسى.","feedback_by_option":{"1":"الرئتان تتبعان حركة الصدر، ولا تقرران.","2":"القلب لا يأمر التنفس؛ الدماغ يضبط الاثنين.","3":"الهواء لا يقرر شيئاً؛ يدخل حين يتسع الصدر."}}},{"id":"U04.L01.A5.b","objective":"U04.L01.O5","level":"B","type":"explain_open","prompt":"تستطيع{|ين} أن تحبس{|ي} نفسك{|ِ} قليلاً ثم تضطر{|ين} إلى التنفس. ما الذي يحدث في جسمك{|ِ} بينهما؟","answer":"يتراكم ثاني أكسيد الكربون فتقيسه حسّاسات الدماغ فيأمر عضلات التنفس أن تعمل رغماً عني.","rubric":"R1"},{"id":"U04.L01.A5.c","objective":"U04.L01.O5","level":"B","type":"true_false_why","prompt":"«يمكن للطفل أن يؤذي نفسه بحبس نفسه حتى يُغمى عليه». صح أم خطأ؟","answer":"صح؛ لذلك لا تحدّي حبس النفس أبداً، فالدماغ قد يفقد الوعي قبل أن يعود التنفس في بعض الحالات.","rubric":"R1","alt":{"prompt":"«حبس النفس تحت الماء أطول وقت تحدٍّ آمن ما دام بالغ قريباً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قد يفقد المرء وعيه تحت الماء فجأة دون أن يحسّ بالحاجة إلى التنفس، فلا نتحدى حبس النفس أبداً، في الماء ولا خارجه."}},{"id":"U04.L01.A6.a","objective":"U04.L01.O6","level":"B","type":"fix_model","prompt":"في نموذج الزجاجة، لو ثقبنا جدار الزجاجة، هل يعمل النموذج؟ ولماذا؟","answer":"لا؛ الهواء يدخل من الثقب ولا يتسع الفراغ حول البالون، كما لو انثقب جدار الصدر.","rubric":"R2"},{"id":"U04.L01.A6.b","objective":"U04.L01.O6","level":"B","type":"choose_reason","prompt":"لماذا ينتفخ البالون الصغير حين نسحب الغشاء السفلي؟","options":["لأن الفراغ حول البالون اتسع فدخل الهواء من الفوهة","لأن الغشاء يدفع الهواء فيه","لأن البالون عضلة","لأن الزجاجة تضغطه"],"answer":0,"explanation":"سحب الغشاء يوسّع الفراغ حول البالون، فيدخل الهواء من الفوهة فينتفخ؛ كما يدخل الهواء الرئتين حين ينزل الحجاب الحاجز.","feedback_by_option":{"1":"الغشاء لا يلمس البالون؛ حين نسحبه يتسع الفراغ حول البالون.","2":"البالون لا يتحرك وحده، كما أن الرئة ليست عضلة.","3":"الزجاجة لا تتغير؛ الذي تغيّر هو الفراغ حول البالون حين سحبنا الغشاء."},"alt":{"prompt":"في نموذج الزجاجة، ماذا يحدث للبالون الصغير حين نترك الغشاء يعود إلى مكانه؟","options":["ينتفخ أكثر لأن الهواء يُدفع إليه","ينكمش ويخرج الهواء منه","ينفجر","لا يتغير"],"answer":1,"explanation":"حين يعود الغشاء يضيق الفراغ حول البالون فينكمش ويخرج الهواء، كما يحدث في الزفير حين يعود الحجاب الحاجز قبّة.","feedback_by_option":{"0":"عودة الغشاء تُضيّق الفراغ حول البالون؛ فهل ينتفخ؟","2":"البالون لا ينفجر؛ الفراغ حوله يضيق فقط فيخرج منه الهواء.","3":"الفراغ حول البالون تغيّر؛ فهل يبقى البالون كما هو؟"}}},{"id":"U04.L01.A6.c","objective":"U04.L01.O6","level":"B","type":"explain_open","prompt":"اذكر{|ي} شيئين يُظهرهما النموذج بصدق وشيئين لا يُظهرهما.","answer":"يُظهر: نزول الحجاب الحاجز يوسّع الصدر فيدخل الهواء، وارتخاؤه يُخرجه. لا يُظهر: الأضلاع، الرئة الثانية، تبادل الغازات، مرونة جدار الصدر.","rubric":"R2"}],"transfer":[{"id":"U04.L01.T1","objective":"U04.L01.O2","type":"explain_open","prompt":"المنفاخ اليدوي الذي يُستعمل لإشعال الفحم: حين تفتح{|ين} ذراعيه يدخل الهواء، وحين تضغط{|ين} يخرج. أي جزء في جسمك{|ِ} يشبه ذراعي المنفاخ؟ وأي جزء يشبه كيسه؟","answer":"الذراعان = الحجاب الحاجز وعضلات الأضلاع (هما اللذان يوسّعان ويضيّقان)؛ الكيس = الرئتان (تتبعان ولا تحرّكان).","level":"A","rubric":"R1"},{"id":"U04.L01.T2","objective":"U04.L01.O5","type":"explain_open","prompt":"الغوّاص يأخذ نفساً عميقاً قبل الغطس ومع ذلك لا يستطيع البقاء تحت الماء طويلاً. فسّر{|ي} بما {تعلمته|تعلمتِه}.","answer":"ثاني أكسيد الكربون يتراكم في دمه فتقيسه حسّاسات الدماغ ويأمره بالتنفس؛ لا يستطيع «نسيان» التنفس.","level":"B","rubric":"R1"}],"recall":[{"id":"U04.L01.D1","objective":"U04.L01.O2","type":"choose","prompt":"ما الذي يسحب الهواء إلى الرئتين؟","options":["الحجاب الحاجز وعضلات الأضلاع توسّعان الصدر","الرئتان نفساهما تنتفخان بعضلاتهما القوية","القلب يسحبه مع الدم في كل ضربة ثم يرسله إلى الرئتين"],"answer":0,"explanation":"الحجاب الحاجز وعضلات الأضلاع توسّع الصدر، فيدخل الهواء إلى الرئتين.","level":"A","feedback_by_option":{"1":"الرئتان ليس فيهما عضلات تحرّكهما؛ تتمددان حين يتسع الصدر.","2":"القلب يدفع الدم، ولا يسحب الهواء."}},{"id":"U04.L01.D2","objective":"U04.L01.O4","type":"choose","prompt":"الأنبوب الذي يحمل الهواء من العنق إلى الصدر:","options":["المريء الذي يمر خلفه","القصبة الهوائية","الوريد الكبير في العنق"],"answer":1,"explanation":"القصبة الهوائية تحمل الهواء من العنق إلى الصدر، والمريء خلفها يحمل الطعام.","level":"A","feedback_by_option":{"0":"المريء خلفها يحمل الطعام إلى المعدة.","2":"الوريد يحمل دماً إلى القلب، لا هواءً."}},{"id":"U04.L01.D3","objective":"U04.L01.O5","type":"choose","prompt":"من يضبط سرعة التنفس تلقائياً؟","options":["الرئتان","المعدة","الدماغ"],"answer":2,"explanation":"الدماغ يضبط سرعة التنفس تلقائياً بحسب حاجة الجسم.","level":"B","feedback_by_option":{"0":"الرئتان تتمددان وتنكمشان بحركة الصدر، ولا تقرران السرعة.","1":"المعدة تهضم الطعام، ولا علاقة لها بضبط التنفس."}},{"id":"U04.L01.D4","objective":"U04.L01.O1","level":"A","type":"choose","prompt":"العضلة التي على شكل قبّة تحت الرئتين، بين الصدر والبطن:","options":["القلب","القصبة الهوائية","المريء","الحجاب الحاجز"],"answer":3,"explanation":"الحجاب الحاجز عضلة على شكل قبّة تحت الرئتين، تفصل الصدر عن البطن.","feedback_by_option":{"0":"القلب في الصدر بين الرئتين، فوق الحجاب الحاجز.","1":"القصبة الهوائية أنبوب الهواء في العنق.","2":"المريء أنبوب الطعام خلف القصبة الهوائية."}},{"id":"U04.L01.D5","objective":"U04.L01.O3","level":"A","type":"choose_reason","prompt":"لماذا يسرع تنفسك{|ِ} بعد اللعب؟","options":["لأن الهواء صار أخف","لأن الرئتين تعبتا من اللعب فصارتا تعملان أسرع","لأن العضلات العاملة تحتاج هواءً أكثر","لأن القلب توقف قليلاً"],"answer":2,"explanation":"العضلات العاملة تحتاج أكسجيناً أكثر، فيزيد الدماغ عدد الأنفاس؛ ثم يعود التنفس أبطأ في الراحة.","feedback_by_option":{"0":"الهواء هو نفسه؛ الذي تغيّر حاجة الجسم.","1":"الرئتان لا تتعبان من اللعب؛ الذي تغيّر حاجة العضلات.","3":"القلب لا يتوقف؛ بل يسرع هو أيضاً."}},{"id":"U04.L01.D6","objective":"U04.L01.O6","level":"B","type":"choose","prompt":"في نموذج الزجاجة والبالون، ماذا يمثّل الغشاء المشدود على قاع الزجاجة؟","options":["القلب","الرئة","الأضلاع","الحجاب الحاجز"],"answer":3,"explanation":"الغشاء في قاع الزجاجة يمثّل الحجاب الحاجز: نسحبه إلى الأسفل فيتسع الفراغ ويدخل الهواء البالون الصغير (الرئة).","feedback_by_option":{"0":"النموذج لا يُظهر القلب؛ يمثّل الرئة والحجاب الحاجز فقط.","1":"البالون الصغير داخل الزجاجة هو الذي يمثّل الرئة.","2":"النموذج لا يُظهر الأضلاع؛ وهذا من حدوده."}}]};
