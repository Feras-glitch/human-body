const LD = {"id":"U01.T02","lesson":"U01.L02","first":false,"title":"اختبار: كيف نعرف؟ ألاحظ وأصف وأقيس","lessonTitle":"كيف نعرف؟ ألاحظ وأصف وأقيس","concepts":[],"check":[],"items":[{"id":"U01.L02.A1.a","objective":"U01.L02.O1","type":"choose","prompt":"«الكلب يهزّ ذيله لأنه سعيد». ما الملاحظة فيها وما التخمين؟","answer":1,"explanation":"هزّ الذيل نراه فهو ملاحظة؛ أما «سعيد» فتفسير لما نراه، أي تخمين.","feedback_by_option":{"0":"«سعيد» لا نراه، بل نفسّر به ما نراه. الذي نراه هو هزّ الذيل.","2":"نرى الذيل يهتز، لكننا لا نرى السعادة؛ هي تفسير لما نراه.","3":"صحيح أننا لا نعرف ما في رأسه، لكننا نرى ذيله يهتز؛ وهذا ملاحظة."},"level":"A","options":["الملاحظة: سعيد؛ التخمين: يهزّ ذيله","الملاحظة: يهزّ ذيله؛ التخمين: سعيد","سعادته ملاحظة مثل هزّ ذيله، لأننا نرى الكلب أمامنا","هزّ ذيله تخمين مثل سعادته، لأننا لا نعرف ما في رأسه"],"detects":"M31","alt":{"prompt":"«الطفلة تتثاءب لأنها تريد أن تنام». ما الملاحظة فيها وما التخمين؟","options":["رغبتها في النوم ملاحظة مثل تثاؤبها، لأن التثاؤب يعني النعاس","الملاحظة: تريد أن تنام؛ التخمين: تتثاءب","الملاحظة: تتثاءب؛ التخمين: تريد أن تنام","تثاؤبها تخمين مثل رغبتها في النوم، لأننا لا نرى ما في رأسها"],"answer":2,"explanation":"التثاؤب نراه فهو ملاحظة؛ أما «تريد أن تنام» فتفسير لما نراه، أي تخمين قد يصح وقد لا يصح.","feedback_by_option":{"0":"التثاؤب لا يعني النوم دائماً: قد نتثاءب من الملل، أو حين نرى غيرنا يتثاءب. فالرغبة في النوم تفسير.","1":"العكس: أيهما نراه بأعيننا، التثاؤب أم الرغبة في النوم؟","3":"نحن نرى شيئاً: نرى الطفلة تتثاءب، وهذا هو الملاحظة."},"detects":"M31"}},{"id":"U01.L02.A1.b","objective":"U01.L02.O1","type":"explain_open","prompt":"اكتب{|ي} عن صورة شخص يجلس على كرسي: ملاحظة واحدة وتخميناً واحداً، وسمِّ{|ي} كلاً منهما.","answer":"ملاحظة: يجلس/عيناه مغلقتان؛ تخمين: متعب/نائم.","level":"A","rubric":"R1"},{"id":"U01.L02.A1.c","objective":"U01.L02.O1","type":"true_false_why","prompt":"«الوصف الجيد يذكر ما نراه وما نظنه معاً دون تمييز». صح أم خطأ؟","answer":"خطأ؛ نفصل بينهما ونسمّي كلاً باسمه.","level":"A","rubric":"R1","alt":{"prompt":"«حين أصف صورة أكتب ما تُظهره الصورة، ثم أكتب ما أظنه وأسمّيه تخميناً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نفصل الملاحظة عن التخمين، ونسمّي كلاً منهما باسمه."}},{"id":"U01.L02.A2.a","objective":"U01.L02.O2","type":"choose","prompt":"قراءات: 25، 16، 19. الرقم الوسط:","answer":2,"explanation":"نرتب: 16، 19، 25. الرقم الوسط هو 19.","level":"A","options":["25","16","19","20"],"feedback_by_option":{"0":"25 أكبر القراءات. رتّب{|ي} الأرقام أولاً، ثم خذ{|ي} الذي في الوسط.","1":"16 أصغر القراءات. الرقم الوسط يقع بين الأصغر والأكبر بعد الترتيب.","3":"20 ليس من القراءات. الرقم الوسط واحد من الأرقام الثلاثة بعد ترتيبها."},"alt":{"prompt":"قراءات: 31، 27، 40. الرقم الوسط:","options":["27","31","40","33"],"answer":1,"explanation":"نرتب: 27، 31، 40. الرقم الوسط هو 31.","feedback_by_option":{"0":"27 أصغر القراءات. رتّب{|ي} الأرقام من الأصغر إلى الأكبر، ثم خذ{|ي} الذي في الوسط.","2":"40 أكبر القراءات، لا وسطها. رتّب{|ي} الأرقام أولاً.","3":"33 ليس من القراءات. الرقم الوسط واحد من الأرقام الثلاثة بعد ترتيبها."}}},{"id":"U01.L02.A2.b","objective":"U01.L02.O2","type":"choose_reason","prompt":"لماذا نكرر القياس ثلاث مرات؟","answer":3,"explanation":"القياس الواحد قد يكون صدفة؛ ثلاث محاولات تكشف القراءة الشاذة وتعطي رقماً نثق به أكثر.","feedback_by_option":{"0":"المحاولة الأولى ليست خاطئة دائماً؛ نكرر لنرى هل الرقم نفسه.","1":"لا نأخذ الأسرع ولا الأبطأ، بل الأوسط؛ فأي محاولة وحدها قد تكون صدفة.","2":"لا نجمع المرات الثلاث؛ نكررها لنرى هل الرقم نفسه، لأن القياس الواحد قد يكون صدفة."},"level":"A","options":["لأن المحاولة الأولى تكون للتدريب فنحذفها","لنختار أسرع محاولة لأنها الأصدق","لنحصل على رقم أكبر نجمعه من المرات الثلاث","لأن القياس الواحد قد يكون صدفة"],"detects":"M30","alt":{"prompt":"قاست سلمى طول قفزتها ثلاث مرات: 95، 98، 60 سم. لماذا لا نكتفي بمحاولة واحدة؟","options":["لأننا نجمع القراءات لنحصل على رقم أكبر","لأن المحاولة الأخيرة هي التي نحذفها","لأن أطول قفزة هي الصحيحة فنبحث عنها","لأن الواحدة قد تكون صدفة أو قراءة شاذة"],"answer":3,"explanation":"قياس واحد قد يكون صدفة، كأن تنزلق القدم؛ والقراءات الثلاث تكشف الشاذة منها (60) وتعطي رقماً نثق به: الوسط 95.","feedback_by_option":{"0":"لا نجمع القراءات لنصنع رقماً أكبر؛ نرتبها ونأخذ الوسط.","1":"المحاولة الأخيرة ليست خاطئة دائماً؛ هنا هي البعيدة عن غيرها، فكيف عرفنا ذلك لولا المحاولات الأخرى؟","2":"أطول قفزة قد تكون صدفة أيضاً. نأخذ الرقم الوسط بعد الترتيب، لا الأكبر."},"detects":"M30"}},{"id":"U01.L02.A2.c","objective":"U01.L02.O2","type":"explain_open","prompt":"سقطت المسطرة 20 سم. كم زمن ردّ الفعل تقريباً؟ ومن أين عرفت{|ِ}؟","answer":"نحو 0.20 ثانية؛ من الجدول.","level":"A","rubric":"R1"},{"id":"U01.L02.A3.a","objective":"U01.L02.O3","type":"true_false_why","prompt":"«كثير مما لا نراه بأعيننا موجود، والأدوات تكشفه». صح أم خطأ؟","answer":"صح؛ العين لا ترى الصغير جداً ولا ما خلف الجلد؛ المجهر والأشعة تكشفهما.","level":"A","detects":"M29","rubric":"R1","alt":{"prompt":"«الشيء الذي لا تراه عيني غير موجود». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العين لا ترى الأشياء الصغيرة جداً ولا ما خلف الجلد، والأدوات كالمجهر والأشعة تكشفها.","detects":"M29"}},{"id":"U01.L02.A3.b","objective":"U01.L02.O3","type":"choose","prompt":"أي أداة تُسمع بها دقات القلب؟","answer":0,"explanation":"السماعة تنقل أصوات داخل الجسم إلى أذن الطبيب، ومنها دقات القلب.","level":"A","options":["السماعة","المجهر","الأشعة","الميزان"],"feedback_by_option":{"1":"المجهر للرؤية: يكبّر الأشياء الصغيرة. والسؤال عن سماع الدقات.","2":"الأشعة تُظهر صورة العظام، ولا تنقل الأصوات.","3":"الميزان يقيس الثقل، ولا ينقل صوت القلب."},"alt":{"prompt":"أي أداة {تستعمل|تستعملين} {لترى|لتري} الكائنات الصغيرة جداً في قطرة ماء من بركة؟","options":["المجهر","الأشعة","السماعة","الميزان"],"answer":0,"explanation":"المجهر يكبّر صورة ما هو أصغر من أن تراه العين، فنرى الكائنات الصغيرة في قطرة الماء.","feedback_by_option":{"1":"الأشعة تُظهر العظام عبر الجلد، لا الكائنات الصغيرة في الماء.","2":"السماعة تنقل الأصوات، والسؤال عن رؤية شيء صغير جداً.","3":"الميزان يقيس الثقل، ولا يكبّر ما لا تراه العين."}}},{"id":"U01.L02.A3.c","objective":"U01.L02.O3","type":"choose","prompt":"الطبيب يرى الجنين في بطن أمه بـ:","answer":1,"explanation":"الموجات فوق الصوتية تُظهر الأعضاء الرخوة والجنين داخل البطن دون فتحه.","level":"A","options":["المجهر الذي يكبّر ما في البطن","الموجات فوق الصوتية","السماعة التي يضعها على البطن","المسطرة يقيس بها البطن"],"feedback_by_option":{"0":"المجهر يكبّر شيئاً صغيراً نضعه تحته، ولا يرى ما داخل البطن.","2":"السماعة تُسمع الطبيب صوتاً، لكنها لا تعطيه صورة يرى فيها الجنين.","3":"المسطرة تقيس البطن من الخارج، ولا تُظهر ما في داخله."},"alt":{"prompt":"سمعت الطبيبة صوت الهواء يدخل صدر مريض دون أن تفتحه. بأي أداة؟","options":["المسطرة","المجهر","السماعة","الميزان"],"answer":2,"explanation":"السماعة تنقل الأصوات من داخل الجسم إلى أذن الطبيب، ومنها صوت الهواء في الصدر.","feedback_by_option":{"0":"المسطرة تقيس الطول، ولا تنقل صوتاً.","1":"المجهر يكبّر صورة الأشياء الصغيرة، ولا يُسمعنا شيئاً.","3":"الميزان يقيس الثقل، ولا ينقل صوتاً."}}},{"id":"U01.L02.A4.a","objective":"U01.L02.O4","type":"choose_reason","prompt":"لتعرف{|ي} هل النوم الجيد يسرّع ردّ الفعل، تقيس{|ين}:","answer":2,"explanation":"المقارنة العادلة تغيّر شيئاً واحداً هو النوم، وتثبّت الباقي: الوقت والأداة وعدد المحاولات.","level":"B","options":["بعد نوم جيد بالمسطرة، وبعد نوم قليل بالمؤقت","مرة واحدة بعد نوم جيد","بعد نوم جيد وبعد نوم قليل، في الوقت نفسه من اليوم وبالمسطرة نفسها وثلاث محاولات"],"feedback_by_option":{"0":"تغيّر شيئان: النوم والأداة. لو اختلفت النتيجة، فمن السبب؟","1":"قياس واحد في حالة واحدة لا يقارن شيئاً؛ نحتاج الحالتين، وثلاث محاولات لكل منهما."},"alt":{"prompt":"لتعرف{|ي} هل الماء البارد يبطئ ردّ الفعل، تقيس{|ين}:","options":["بعد الماء البارد صباحاً، وبدونه ليلاً وأنت{|ِ} متعب{|ة}، ثلاث مرات لكل حالة","بعد الماء البارد بالمسطرة، وبدونه بالمؤقت","مرة واحدة بعد الماء البارد","مع الماء البارد وبدونه، بالطريقة نفسها، ثلاث مرات لكل حالة"],"answer":3,"explanation":"المقارنة العادلة تغيّر شيئاً واحداً هو الماء البارد، وتثبّت الباقي: الأداة والوقت وعدد المحاولات.","feedback_by_option":{"0":"تغيّر الماء والوقت والتعب معاً، فلا نعرف أيها صنع الفرق.","1":"تغيّر شيئان: الماء والأداة. لو اختلفت النتيجة، فمن السبب؟","2":"قياس واحد في حالة واحدة لا يقارن شيئاً؛ نحتاج الحالتين، وثلاث محاولات لكل منهما."}}},{"id":"U01.L02.A4.b","objective":"U01.L02.O4","type":"fix_model","prompt":"قارن سامي سرعة الجري بحذاء رياضي على عشب، وبحذاء عادي على رمل. ما الخلل؟","answer":"تغيّر الحذاء والأرض معاً؛ تثبّت الأرض وتغيّر الحذاء فقط.","level":"B","rubric":"R1"},{"id":"U01.L02.A4.c","objective":"U01.L02.O4","type":"explain_open","prompt":"صمّم{|ي} مقارنة عادلة لتعرف{|ي} هل اليد اليمنى أسرع من اليسرى. اذكر{|ي} ثلاثة أشياء تثبّتها.","answer":"المسطرة نفسها، الجلسة والوقت نفسه، عدد المحاولات نفسه، الشخص الذي يفلت نفسه.","level":"B","rubric":"R1"}],"transfer":[{"id":"U01.L02.T1","objective":"U01.L02.O2","type":"explain_open","prompt":"في المزرعة يقول العامل: «هذه النعجة تأكل أكثر من تلك». كيف تتحقق{|ين} بطريقة علمية؟","answer":"أزن العلف قبل وبعد لكل نعجة، ثلاثة أيام، وأقارن الرقم الوسط.","level":"A","rubric":"R1"},{"id":"U01.L02.T2","objective":"U01.L02.O4","type":"explain_open","prompt":"تريد{|ين} معرفة هل السماد يزيد طول النبات. عندك{|ِ} أصيصان. صمّم{|ي} المقارنة العادلة.","answer":"البذرة نفسها، التربة نفسها، الماء والضوء نفسهما؛ الفرق الوحيد: سماد في أحدهما؛ وتقيس الطول بالمسطرة كل أسبوع.","level":"B","rubric":"R1"}],"recall":[{"id":"U01.L02.D1","objective":"U01.L02.O1","type":"choose","prompt":"«الطفل يبكي» و«الطفل جائع»: أيهما ملاحظة؟","answer":1,"explanation":"البكاء نراه ونسمعه فهو ملاحظة؛ أما الجوع فتفسير لسبب البكاء.","level":"A","options":["جائع","يبكي"],"feedback_by_option":{"0":"الجوع لا نراه؛ هو تفسير لسبب البكاء. أي العبارتين نراها ونسمعها؟"}},{"id":"U01.L02.D2","objective":"U01.L02.O2","type":"choose","prompt":"لماذا ثلاث محاولات؟","answer":0,"explanation":"المحاولة الواحدة قد تكون صدفة، فنكرر لنثق بالنتيجة.","level":"A","options":["لأن الواحدة قد تكون صدفة","لرقم أكبر","لأن المعلم يحب التكرار"],"feedback_by_option":{"1":"لا نكرر لنكبّر الرقم؛ نكرر لنعرف هل الرقم يتكرر أم جاء صدفة.","2":"للتكرار سبب علمي: محاولة واحدة قد تخدعنا. ما الذي قد يخدعنا فيها؟"}},{"id":"U01.L02.D3","objective":"U01.L02.O4","type":"choose","prompt":"المقارنة العادلة تغيّر:","answer":0,"explanation":"في المقارنة العادلة نغيّر شيئاً واحداً ونثبّت كل ما عداه، لنعرف سبب الفرق.","level":"B","options":["شيئاً واحداً","شيئين أو ثلاثة معاً لنختصر الوقت","طريقة القياس في كل مرة"],"feedback_by_option":{"1":"لو غيّرنا أكثر من شيء معاً لما عرفنا أيها صنع الفرق.","2":"إن تغيّرت طريقة القياس لم نثق بالنتيجة؛ القياس يبقى واحداً، ونغيّر الشيء الذي نختبره وحده."}},{"id":"U01.L02.D4","objective":"U01.L02.O3","level":"A","type":"choose_reason","prompt":"قال أخي: «لا أصوات في بطني لأني لا أسمعها». ماذا {تقول|تقولين} له؟","options":["نسمعها بالمجهر","كلامه صحيح: ما لا نسمعه بآذاننا غير موجود في البطن","الأصوات في الرأس، لا في البطن","قد توجد أصوات لا تُسمع جيداً إلا بأداة كالسماعة"],"answer":3,"explanation":"ما لا تصل إليه حواسنا قد يكون موجوداً؛ السماعة تنقل أصواتاً من داخل الجسم لا تصل إلى أذننا وحدها.","feedback_by_option":{"0":"المجهر أداة للرؤية لا للسمع.","1":"ما لا نراه أو نسمعه قد يكون موجوداً؛ الأدوات تكشف ما لا تصل إليه حواسنا.","2":"في الجسم أصوات كثيرة، في الصدر والبطن؛ نحتاج أداة لنسمعها بوضوح."},"detects":"M29"}]};
