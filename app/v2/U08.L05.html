const LD = {"id":"U08.L05","first":false,"title":"الذاكرة والنوم","driving_question":"{اسم}، حفظت{|ِ} أمس عشر كلمات إنجليزية جديدة، واليوم لا {تتذكر|تتذكرين} إلا أربعاً! أين ذهبت البقية؟ وماذا كان دماغك{|ِ} يفعل وأنت{|ِ} نائم{|ة}؟","central_fact":"الذاكرة تُصنع في ثلاث مراحل: ننتبه ونتعلم، ثم يثبّت الدماغ الذكرى وكثير من ذلك في النوم، ثم نسترجعها. والنسيان طبيعي وأسرعه بعد التعلم مباشرة؛ ويقلّله الاسترجاع والمراجعة المتباعدة ونوم كافٍ من 9 إلى 12 ساعة للطفل.","next":"U08.L06","nexts":[{"id":"U08.L06","gated":false},{"id":"U08.L07","gated":false}],"hook":{"text":"{اسم}، غداً امتحان. ماذا {تفعل|تفعلين} الليلة؟","options":["أسهر الليل كله أقرأ الدرس","أسأل نفسي في الدرس، ثم أنام مبكراً","لا أراجع؛ سأتذكر كل شيء وحدي","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"head"},"text":"{تذكّر|تذكّري} وجه أمك{|ِ}، وطعم التمر، وطريقك{|ِ} إلى المدرسة: كلها محفوظة في دماغك{|ِ}. هذه هي الذاكرة: قدرة الدماغ على أن يحفظ ما نتعلمه ونعيشه، ثم يُخرجه حين نحتاجه. وصنع ذكرى يمرّ بثلاث مراحل: أولاً {تنتبه|تنتبهين} و{تتعلم|تتعلمين}، ثم يقوّي الدماغ الذكرى في دقائق وساعات وأيام، ثم {تُخرجها|تُخرجينها} حين {تحتاجها|تحتاجينها}. وبلا انتباه لا تبدأ الذكرى أصلاً: ما يمرّ بك{|ِ} وأنت{|ِ} مشغول{|ة} بغيره يضيع غالباً."},{"id":"E2","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"head"},"text":"لكننا ننسى. قبل نحو 140 سنة قاس عالم ألماني اسمه إبنغهاوس نسيانه، فوجد أنه ينسى أكثر ما حفظه في الساعات الأولى، ثم يبطؤ النسيان. فالنسيان طبيعي، ويفيد أحياناً: يترك ما لا نحتاجه. والذاكرة ليست كاميرا: حين نتذكر يعيد الدماغ بناء ما حدث من أجزاء، فقد يختلط فيه شيء. فكيف نقلل النسيان؟ بالاسترجاع: أن {تغلق|تغلقي} الكتاب و{تسأل|تسألي} نفسك{|ِ} ثم {تتحقق|تتحققي}؛ فكل مرة {تُخرج|تُخرجين} فيها المعلومة بنفسك{|ِ} تقوى أكثر مما لو {أعدت|أعدتِ} قراءتها. وبالتباعد: أن {تراجع|تراجعي} بعد يوم، ثم بعد أيام، لا كل شيء في ليلة واحدة."},{"id":"E3","level":"A","atlas":{"layers":["nervous"],"highlight":["brain"],"zoom":"head","animate":"night"},"text":"وفي الليل لا ينطفئ دماغك{|ِ}! النوم وقت عمل مهم له: يعيد تنشيط ذكريات يومك{|ِ} وينظر فيها من جديد فيقوّيها. ويسمي العلماء هذا تثبيت الذاكرة، ويحدث كثير منه في النوم. وفي تجربة على طلاب حفظوا كلمات بلغة جديدة في المساء، تذكّر من ناموا بعد الحفظ أكثر ممن سهروا الليل. وطفل في عمرك{|ِ}، من 6 إلى 12 سنة، يحتاج 9 إلى 12 ساعة نوم في اليوم؛ ومن ينام أقل يصعب عليه الانتباه والتعلم وضبط مشاعره."},{"id":"E4","level":"A","atlas":{"layers":["body"],"highlight":["eyes","brain"],"zoom":"head"},"text":"كيف {تنام|تنامين} جيداً؟ {أطفئ|أطفئي} الشاشات قبل النوم بساعة: ضوؤها قد يؤخر مادة في الجسم تساعد على النوم، والألعاب المثيرة تسرّع القلب فيصعب النوم. {اترك|اتركي} الهاتف خارج غرفة النوم. و{نم|نامي} و{استيقظ|استيقظي} في موعد ثابت كل يوم. وإن {أفزعك|أفزعكِ} شيء قبل النوم {فتذكر|فتذكري} مكابح الهدوء: نَفَس بطيء وزفير طويل، وكلام مع كبير {تثق|تثقين} به."},{"id":"E5","level":"B","atlas":{"layers":["nervous"],"highlight":["hippocampus"],"zoom":"head"},"text":"في عمق دماغك{|ِ}، بين أذنيك{|ِ}، جزء صغير يشبه فرس البحر اسمه الحُصين. يساعد على صنع الذكريات الجديدة: من تضرر حُصيناه يتذكر طفولته ويتكلم، لكنه لا يستطيع أن يصنع ذكريات جديدة، كما حدث لرجل شهير اسمه هنري مولايسون؛ كان يقابل الطبيب نفسه كل يوم كأنه يراه أول مرة. ومن قصته عرف العلماء أن صنع الذكرى الجديدة يحتاج هذا الجزء."},{"id":"E6","level":"B","atlas":{"layers":["nervous"],"highlight":["brain","eyes"],"zoom":"head","animate":"night"},"text":"والليل ليس نوماً واحداً: يمرّ الدماغ في دورات. أوله نوم يزداد عمقاً، وبعد نحو 90 دقيقة يأتي نوم الأحلام: تتحرك العينان بسرعة تحت الجفنين، وفيه أكثر الأحلام، وترتخي عضلات الذراعين والساقين مؤقتاً فلا {تجري|تجرين} في سريرك{|ِ} وأنت{|ِ} {تحلم|تحلمين} أنك{|ِ} {تجري|تجرين}. ثم تتكرر الدورات حتى الصباح. ويبدو أن تثبيت الذاكرة يحتاج النوم العميق ونوم الأحلام معاً؛ ولذلك نحتاج الليل كله."}],"practice":[{"id":"U08.L05.P1","objective":"U08.L05.O1","type":"choose","prompt":"متى تقوى الذكرى أكثر؟","options":["حين أقرأها مرة واحدة وأنا أشاهد التلفاز","حين أنتبه إليها ثم أسترجعها","حين أسمعها وأنا نائم","حين لا أفكر فيها أبداً"],"answer":1,"explanation":"الانتباه يبدأ الذكرى، والاسترجاع يقوّيها.","level":"A","feedback_wrong":"ما الذي يبدأ الذكرى، وما الذي يقوّيها؟","feedback_by_option":{"0":"الانتباه يذهب إلى التلفاز فتضعف الذكرى.","2":"النوم يثبّت ما تعلمناه قبله، لا ما نسمعه فيه.","3":"ما لا نفكر فيه يُنسى غالباً."}},{"id":"U08.L05.P2","objective":"U08.L05.O2","type":"choose_reason","prompt":"حفظت{|ِ} قائمة كلمات. متى {تنسى|تنسين} أكثرها؟","options":["في الساعات الأولى بعد الحفظ","بعد شهر كامل فقط","لا أنسى شيئاً مما حفظته","بالسرعة نفسها في كل يوم"],"answer":0,"explanation":"النسيان أسرع بعد الحفظ مباشرة، ثم يبطؤ.","level":"A","feedback_wrong":"ماذا وجد إبنغهاوس في منحناه؟","feedback_by_option":{"1":"أكثر النسيان يحدث قبل ذلك بكثير.","2":"النسيان طبيعي عند كل الناس.","3":"سريع في البداية ثم يبطؤ."}},{"id":"U08.L05.P3","objective":"U08.L05.O3","type":"choose","prompt":"كم ساعة يحتاج طفل عمره 6 إلى 12 سنة من النوم في اليوم؟","options":["5 إلى 6 ساعات","7 إلى 8 ساعات","9 إلى 12 ساعة","14 إلى 16 ساعة"],"answer":2,"explanation":"توصي الأكاديمية الأمريكية لطب النوم بـ9 إلى 12 ساعة لهذا العمر.","level":"A","feedback_wrong":"الطفل يحتاج نوماً أكثر من الكبير.","feedback_by_option":{"0":"هذا قليل جداً لطفل.","1":"هذا أقل من حاجتك{|ِ}.","3":"هذا أكثر من حاجة طفل في عمرك{|ِ}."},"detects":"M94"},{"id":"U08.L05.P4","objective":"U08.L05.O4","type":"choose","prompt":"أيّ طريقة تثبّت الدرس أكثر؟","options":["إعادة قراءة الدرس خمس مرات متتالية بصوت عالٍ","تظليل الجمل المهمة بالألوان","النوم والكتاب تحت الوسادة","إغلاق الكتاب وسؤال نفسي ثم التحقق"],"answer":3,"explanation":"الاسترجاع أنفع من إعادة القراءة والتظليل.","level":"A","feedback_wrong":"أيّها يجعلك{|ِ} {تُخرج|تُخرجين} المعلومة بنفسك{|ِ}؟","feedback_by_option":{"0":"إعادة القراءة أضعف من الاسترجاع.","1":"التظليل وحده لا يكفي.","2":"الكتاب تحت الوسادة لا يدخل الدماغ."},"detects":"M96"},{"id":"U08.L05.P5","objective":"U08.L05.O5","type":"sequence","prompt":"رتّب{|ي} ما يحدث للذكرى الجديدة.","options":["أنتبه وأتعلم","الحُصين يساعد على صنعها","في النوم يعيد الدماغ تنشيطها","أسترجعها حين أحتاجها"],"answer":[0,1,2,3],"explanation":"انتباه، ثم صنع، ثم تثبيت في النوم، ثم استرجاع.","level":"B","feedback_wrong":"ما الذي يأتي أولاً، وما الذي يأتي في الليل؟"}],"check":[{"id":"U08.L05.C1","objective":"U08.L05.O1","type":"explain_open","prompt":"ما المراحل الثلاث لصنع ذكرى؟ {مثّل|مثّلي} لكل منها من حفظ سورة.","answer":"أنتبه وأتعلم: أقرأ الآيات وأنا منتبه. التثبيت: يقوّيها الدماغ في الساعات والأيام التالية، وكثير منه في النوم. الاسترجاع: أسمّعها لنفسي أو في الصلاة.","level":"A","rubric":"R1"},{"id":"U08.L05.C2","objective":"U08.L05.O2","type":"true_false_why","prompt":"«النسيان طبيعي، ويكون أسرع بعد التعلم مباشرة ثم يبطؤ». صح أم خطأ؟ ولماذا؟","answer":"صح؛ هذا ما وجده إبنغهاوس ومن أعاد تجربته، والاسترجاع والمراجعة تقلل النسيان.","level":"A","rubric":"R1"},{"id":"U08.L05.C3","objective":"U08.L05.O3","type":"true_false_why","prompt":"«في النوم يعيد الدماغ تنشيط ذكريات اليوم فيقوّيها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدماغ يعمل في النوم، ويحدث فيه كثير من تثبيت الذاكرة.","level":"A","rubric":"R1"},{"id":"U08.L05.C4","objective":"U08.L05.O4","type":"explain_open","prompt":"{اكتب|اكتبي} خطة لحفظ جدول ضرب التسعة في أسبوع، {مستعملاً|مستعملةً} الاسترجاع والتباعد والنوم.","answer":"أحفظ اليوم الأول ثم أغطي الجدول وأكتبه من الذاكرة وأتحقق؛ أسمّعه بعد يوم، ثم بعد ثلاثة أيام، ثم بعد أسبوع؛ وأنام في موعدي كل ليلة.","level":"A","rubric":"R2"},{"id":"U08.L05.C5","objective":"U08.L05.O3","type":"true_false_why","prompt":"«الدماغ ينطفئ ويرتاح كله حين ننام». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الدماغ يعمل في النوم: يعيد تنشيط الذكريات ويثبّتها، ويمرّ بدورات من النوم.","level":"A","rubric":"R1"},{"id":"U08.L05.C6","objective":"U08.L05.O5","type":"fix_model","prompt":"كتب زميل{ك|تكِ}: «نحلم طوال الليل، ونتحرك في السرير كما نتحرك في الحلم». {صحّح|صحّحي}.","answer":"الليل دورات من نوم عميق ونوم أحلام، وأكثر الأحلام في نوم الأحلام؛ وفيه ترتخي عضلات الذراعين والساقين مؤقتاً فلا نتحرك بأحلامنا.","level":"B","rubric":"R1"},{"id":"U08.L05.C7","objective":"U08.L05.O6","type":"explain_open","prompt":"في تجربة القائمتين: ما الذي يبقى كما هو، وما الذي يتغير؟ ولماذا يبدأ نصف الصف بقائمة والنصف الآخر بالأخرى؟","answer":"يبقى الوقت (أربع دقائق لكل قائمة)، وعدد الكلمات، والنوم، ووقت الاختبار؛ وتتغير طريقة الحفظ وحدها. ونتبادل القائمتين حتى لا تكون إحداهما أسهل فتصنع الفرق.","level":"B","rubric":"R2"}],"concepts":[{"id":"memory","term":{"ar":"الذاكرة","en":"Memory","zh":"记忆","pinyin":"jìyì","match":["الذاكرة"]},"priority":"core","atlas":{"layer":"nervous","element":"memory"},"card":{"A":"قدرة الدماغ على أن يحفظ ما نتعلمه ونعيشه، ثم يُخرجه حين نحتاجه؛ وتقوى بالانتباه والاسترجاع والنوم.","B":"يميز العلماء ذاكرة قصيرة تحفظ رقماً ثواني، وذاكرة طويلة تحفظ سنوات؛ وذاكرة للمعلومات وأخرى للمهارات كركوب الدراجة."}},{"id":"retrieval","term":{"ar":"الاسترجاع","en":"Retrieval practice","zh":"提取练习","pinyin":"tíqǔ liànxí","match":["الاسترجاع"]},"priority":"core","atlas":{"layer":"nervous","element":"retrieval"},"card":{"A":"أن نُخرج المعلومة من الذاكرة بأنفسنا، كأن نغلق الكتاب ونسأل أنفسنا ثم نتحقق؛ وهو يقوّي الذكرى أكثر من إعادة القراءة.","B":"يسميه العلماء «التعلم بالاسترجاع»، ونفعه ثابت عند الأطفال من الرضع إلى المرحلة الابتدائية، ويزيد إذا تباعدت المراجعات."}},{"id":"consolidation","term":{"ar":"تثبيت الذاكرة","en":"Memory consolidation","zh":"记忆巩固","pinyin":"jìyì gǒnggù","match":["تثبيت الذاكرة"]},"priority":"core","atlas":{"layer":"nervous","element":"consolidation"},"card":{"A":"تقوية الذكرى الجديدة بعد التعلم حتى تبقى؛ يمتد دقائق وساعات وأياماً، ويحدث كثير منه في النوم.","B":"في النوم يعيد الدماغ تنشيط ذكريات اليوم وينظر فيها من جديد؛ ويبدو أنه يحتاج النوم العميق ونوم الأحلام معاً."}},{"id":"hippocampus","term":{"ar":"الحُصين","en":"Hippocampus","zh":"海马体","pinyin":"hǎimǎtǐ","match":["الحُصين","الحصين","حُصيناه"]},"priority":"supporting","atlas":{"layer":"nervous","element":"hippocampus"},"card":{"A":"جزء صغير في عمق الدماغ يشبه فرس البحر، يساعد على صنع الذكريات الجديدة.","B":"من تضرر حُصيناه يتذكر ماضيه لكنه لا يستطيع أن يصنع ذكريات جديدة، كما حدث لرجل شهير اسمه هنري مولايسون."}},{"id":"rem_sleep","term":{"ar":"نوم الأحلام","en":"REM sleep","zh":"快速眼动睡眠","pinyin":"kuàisù yǎndòng shuìmián","match":["نوم الأحلام","نوم حركة العين السريعة"]},"priority":"supporting","atlas":{"layer":"nervous","element":"rem_sleep"},"card":{"A":"جزء من نوم الليل تتحرك فيه العينان بسرعة تحت الجفنين، وفيه أكثر الأحلام، وترتخي عضلات الذراعين والساقين مؤقتاً فلا نتحرك بأحلامنا.","B":"يسميه العلماء نوم حركة العين السريعة؛ يأتي أول مرة بعد نحو 90 دقيقة من النوم، ثم يتكرر في دورات حتى الصباح."}}],"experiment":{"title":"أختبر نفسي أم أعيد القراءة؟","materials":["قائمتان من عشر كلمات (أ) و(ب) من كتاب المعلم","ورقة وقلم","ساعة أو مؤقت","ورقة تغطي القائمة"],"steps":["القائمة الأولى: {اقرأها|اقرئيها} أربع مرات، كل مرة دقيقة، ثم {اطوها|اطويها}.","القائمة الثانية: {اقرأها|اقرئيها} مرة واحدة دقيقة، ثم {غطّها|غطّيها} و{اكتب|اكتبي} ما {تتذكره|تتذكرينه} في دقيقة، ثم {تحقق|تحققي}؛ و{كرر|كرري} الكتابة والتحقق مرتين أخريين. هكذا {تأخذ|تأخذين} كل قائمة أربع دقائق.","لا {تنظر|تنظري} إلى القائمتين بعد ذلك، و{نم|نامي} في موعدك{|ِ}.","في اليوم التالي، دون أن {تنظر|تنظري}: {اكتب|اكتبي} كل ما {تتذكره|تتذكرينه} من القائمة الأولى، ثم من الثانية، و{عُدّ|عُدّي} الكلمات الصحيحة من كل منهما.","{قارن|قارني}: من أي القائمتين {تذكرت|تذكرتِ} أكثر؟ وفي الصف يبدأ نصف الأطفال بالقائمة (أ) والنصف الآخر بالقائمة (ب)، حتى لا تصنع قائمة أسهل الفرق."],"safety":["لا نسهر لنقيس أثر السهر، ولا نحرم أحداً من النوم؛ ننام في موعدنا.","ليست مسابقة؛ لا نقارن أرقام الأطفال، والاختلاف بينهم طبيعي.","من يصعب عليه الكتابة يقول الكلمات لأحد الكبار فيكتبها.","لا شاشات أثناء التجربة؛ نجلس في مكان هادئ ومضاء."],"expected":"يتذكر أكثر الأطفال كلمات أكثر من القائمة التي استرجعوها، وقد لا يظهر الفرق عند كل طفل أو في كل مرة: نسجل ما نجده بأمانة، ونجمع أرقام الصف.","explain":"حين {تكتب|تكتبين} من الذاكرة {تُخرج|تُخرجين} الكلمة بنفسك{|ِ}، وكل إخراج يقوّي الذكرى أكثر من أن {تراها|تريها} مرة أخرى؛ والنوم بين الحفظ والاختبار ساعد على تثبيت القائمتين معاً. والتجربة تقارن طريقتين في الوقت نفسه؛ ولم نحرم أحداً من النوم لنعرف أثره.","record":"القائمة الأولى (أ أو ب) بطريقة ___ : تذكرت ___ من 10 — القائمة الثانية بطريقة ___ : تذكرت ___ من 10","alternatives":["من لا يستطيع الكتابة: يقول الكلمات بصوت مسموع لأحد الكبار.","بدل الكلمات: عشر صور صغيرة يرسمها المعلم، تُسمّى بدل أن تُكتب."]},"find_the_error":[{"id":"FE1","atlas_variant":"brain_off_sleep","error":"رسم دماغ نائم مكتوب عليه: مطفأ حتى الصباح","answer":"الدماغ يعمل في النوم: يعيد تنشيط الذكريات ويثبّتها","detects":"M93"},{"id":"FE2","atlas_variant":"camera_memory","error":"رسم كاميرا داخل الرأس مكتوب عليه: الذاكرة تسجل كل شيء كما حدث","answer":"الدماغ يعيد بناء الذكرى من أجزاء، وقد يخطئ","detects":"M95"},{"id":"FE3","atlas_variant":"cram_poster","error":"ملصق: اسهر ليلة الامتحان واقرأ الدرس عشر مرات","answer":"راجع بالاسترجاع على أيام، ونم نوماً كافياً ليلة الامتحان","detects":"M94"}],"numbers":[{"text":"من 9 إلى 12 ساعة نوم في اليوم لطفل بين 6 و12 سنة.","source":["S1"]},{"text":"بعد نحو 90 دقيقة من النوم يأتي أول نوم للأحلام، ثم يتكرر في دورات حتى الصباح.","source":["S2"]}],"true_size":[],"animal":{"text":"الدلفين يتنفس الهواء ويعيش في الماء، فكيف ينام؟ ينام بنصف دماغه في كل مرة: النصف المستيقظ يقوده إلى سطح الماء ليتنفس، ويبقي عيناً مفتوحة يراقب بها رفاقه. ونحن ننام بالدماغ كله، فنحتاج مكاناً آمناً وليلاً كاملاً.","source":["S9"]},"organ_letter":{"from":"دماغك{|ِ} في الليل","text":"مساء الخير، أنا دماغك{|ِ}. حين {تغمض|تغمضين} عينيك{|ِ} في الليل لا أنطفئ: أفتح دفتر يومك{|ِ}، وأعيد ما {تعلّمته|تعلّمتِه}، وأقوّي ما يستحق البقاء. أحتاج تسع ساعات على الأقل؛ فإذا {سهرت|سهرتِ} مع الشاشة قصّرت عليّ الليل، فأضيّع بعض ما {تعبت|تعبتِ} فيه. وساعدني في النهار: {أغلق|أغلقي} الكتاب و{اسألني|اسأليني}، فكل سؤال يقوّيني، و{راجع|راجعي} معي بعد يوم وبعد أيام. وإن نسيت شيئاً فلا {تغضب|تغضبي} مني: النسيان جزء من عملي، أترك ما لا {تحتاجه|تحتاجينه} لأحفظ ما {تحتاجه|تحتاجينه}."},"history":[{"who":"هرمان إبنغهاوس","origin":"ألمانيا","where_when":"تجاربه بين 1880 و1885، وكتابه عن الذاكرة سنة 1885","did":"قاس النسيان أول مرة بطريقة علمية: صنع مقاطع لا معنى لها حتى لا يساعده المعنى، وكان هو وحده الشخص في التجربة؛ يحفظ قائمة حتى يتقنها، ثم يعيد حفظها بعد عشرين دقيقة أو ساعة أو يوم أو شهر، ويقيس ما وفّره من الوقت؛ فرسم منحنى النسيان: سريع ثم بطيء.","did_not":"لم يجرّب إلا على نفسه، ولم يعرف ما يحدث في الدماغ ولا في النوم؛ وجاء بعده من جرّب على أعداد أكبر، ومن أعاد تجربته سنة 2015.","method_lesson":"حين يصعب القياس نصنع أداة عادلة (مقاطع بلا معنى)، ونكرر بصبر، ثم يعيد غيرنا التجربة ليتأكد.","source":["S4"]}],"how_we_know":{"text":"كيف عرفنا شكل النسيان؟ قبل نحو 140 سنة أراد العالم الألماني هرمان إبنغهاوس أن يقيس النسيان. لكن الكلمات التي نعرفها يسهل حفظها لأن لها معنى، فصنع مقاطع لا معنى لها، كلٌّ منها ثلاثة حروف. وكان هو وحده الشخص في التجربة: يحفظ قائمة حتى يتقنها، ثم يعيد حفظها بعد عشرين دقيقة أو ساعة أو يوم أو شهر، ويقيس كم وفّر من الوقت في المرة الثانية. فوجد أن النسيان سريع في الساعات الأولى، ثم يبطؤ. وبعد أكثر من مئة سنة أعاد عالمان تجربته على شخص واحد أيضاً، فجاء المنحنى قريباً من منحناه. ولكن: تجربة على شخص واحد لا تكفي لنعرف كيف ينسى كل الناس؛ ولذلك جرّبها علماء كثيرون على أعداد أكبر.","limit_question":"لماذا لا تكفي تجربة على شخص واحد لنحكم على كل الناس؟"},"what_changed":["كان كثيرون يظنون أن الدماغ يتوقف ويرتاح كله في النوم؛ ونعرف اليوم أنه يعمل فيه عملاً مهماً.","ظُنّ أن الذاكرة تسجل الأحداث كما هي؛ ونعرف اليوم أنها تعيد بناءها من أجزاء فقد تخطئ.","انتشرت قبل نحو عشر سنوات فكرة أن النوم ينظّف الدماغ من الفضلات أسرع؛ ثم شككت فيها تجربة على الفئران سنة 2024، وما زال البحث جارياً."],"model_limits":["منحنى النسيان في المشهد توضيحي؛ سرعة النسيان تختلف بين الناس وبين المواد.","الرسم يرفع الذكرى إلى القمة بعد كل مراجعة؛ في الحقيقة قد لا نسترجع كل شيء.","«الحُصين يصنع الذكريات» تبسيط: مناطق كثيرة في الدماغ تعمل معاً.","تجربة القائمتين على طفل واحد لا تكفي للحكم؛ أرقام الصف معاً أوضح."],"faith":{"opening":{"text":"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًۭا","reference":"النبأ 9","grade":"قرآن","usage":"تفكر","reflection":"{تنام|تنامين} كل ليلة ساعات طويلة، فيرتاح جسمك{|ِ} من الحركة والعمل، ثم {تستيقظ|تستيقظين} في الصباح بنشاط جديد. والآية التي أمامك{|ِ} تذكّرنا بأن النوم من نعم الله علينا، ومعنى السُّبات عند المفسرين: راحة ينقطع فيها الإنسان عن السعي. واليوم ننظر نظرة علم في ما يحدث في الدماغ وأنت{|ِ} نائم{|ة}. والآية لا تصف دورات النوم ولا الذاكرة، والعلم لا يشرح الآية؛ لكن من عرف كم يعمل الدماغ في الليل عرف قدر النعمة. متى {تنام|تنامين} عادة؟ وهل {تأخذ|تأخذين} حقك{|ِ} من النوم؟","reviewed":false,"quran_key":"78:9","hl_words":[0,2],"highlight":"وجعلنا نومكم سباتا","level":"تفكر","concept":"النوم نعمة وراحة جعلها الله للإنسان، تستحق الشكر.","avoid":"لا نقول إن الآية تصف دورات النوم أو تثبيت الذاكرة، ولا إن العلم أثبتها؛ هي تذكير بنعمة النوم ودعوة إلى الشكر والتفكر.","cards":[]},"closing":{"text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","reference":"البخاري 1975","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن الدماغ يحتاج النوم ليثبّت ما تعلمناه، وأن السهر يضعف الانتباه والحفظ. وفي الحديث الذي أمامك{|ِ} أن الصحابي عبد الله بن عمرو كان يصوم النهار ويقوم الليل كله في العبادة، فأمره النبي ﷺ أن يقوم وينام، وأخبره أن لجسده عليه حقاً ولعينه عليه حقاً. هذا هو الإرشاد من النص؛ والعلم يُرينا شيئاً مما يحتاجه الجسد في الليل؛ والحكمة بلغتنا: النوم ليس كسلاً، بل حق للجسد. والسهر مع لعبة أو شاشة يأخذ من هذا الحق بلا فائدة. والعلم لا يُثبت الحديث، والحديث لا يصف دورات النوم. ما الموعد الذي {تختاره|تختارينه} لنومك{|ِ} هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:1975","highlight":"وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا","level":"ترغيب","concept":"للجسد على صاحبه حق، ومنه النوم الكافي.","avoid":"لا نقول إن الحديث يحدد عدد ساعات النوم أو إن العلم أثبته؛ ولا نجعله سبباً لأن يشعر الطفل بالذنب إن قلّ نومه لمرض أو ظرف لا يملكه.","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","narration":true,"source":"البخاري 1975","grader":"","cards":[]}},"life":[{"situation":"الليلة امتحان الرياضيات، وأفكر أن أسهر حتى الفجر أقرأ الدرس مرة بعد مرة.","science":"النوم بعد التعلم يثبّت الذاكرة، والسهر يضعف الانتباه في الامتحان؛ وإعادة القراءة أضعف من أن أختبر نفسي، والمراجعة على أيام أقوى من ليلة واحدة.","action":"أبدأ المراجعة قبل الامتحان بأيام؛ أحلّ أسئلة دون أن أنظر في الحل ثم أتحقق؛ وفي ليلة الامتحان أراجع قليلاً وأنام في موعدي.","value":"إعطاء الجسد حقه، والإتقان بالتدرج.","why":"لماذا أنام بدل أن أسهر؟ لأن دماغي يثبّت في النوم ما راجعته، وأنا متعب لا أنتبه للسؤال. والنبي ﷺ أمر صحابياً كان يسهر الليل في العبادة أن يقوم وينام، وأخبره أن لجسده عليه حقاً، كما في الحديث في آخر الدرس.","reference":"البخاري 1975","hadith":["bukhari:1975"],"cards":[{"key":"bukhari:1975","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","narration":true,"source":"البخاري 1975","grade":"صحيح","grader":""}],"verses":[]},{"situation":"حفظت سورة جديدة وأتقنتها، ثم بعد أسبوع وجدت أني نسيت نصفها.","science":"النسيان طبيعي وأسرعه في الأيام الأولى؛ والاسترجاع (أن أسمّع لنفسي دون أن أنظر) والمراجعة على أيام متباعدة والنوم الكافي تثبّت المحفوظ.","action":"أسمّع السورة لنفسي أو لأحد أهلي بعد يوم، ثم بعد ثلاثة أيام، ثم بعد أسبوع، وأقرأ منها في صلاتي؛ وإن أخطأت أنظر وأصحح ثم أعيد التسميع.","value":"تعاهد المحفوظ والصبر عليه.","why":"لماذا أراجع ما حفظته جيداً؟ لأن الذكرى تضعف إن تُركت، وكل تسميع يقوّيها. والنبي ﷺ أمر بتعاهد القرآن، وشبّه تفلّته ممن يتركه بتفلّت الإبل من الحبال التي تُعقل بها، كما في البطاقة.","reference":"مسلم 791","hadith":["muslim:791"],"cards":[{"key":"muslim:791","lead":"عن أبي موسى الأشعري رضي الله عنه عن النبي ﷺ قال:","text":"تعاهدوا هذا القرآن، فوالذي نفس محمد بيده لهو أشد تفلتاً من الإبل في عقلها","narration":false,"source":"مسلم 791","grade":"صحيح (متفق عليه)","grader":""}],"verses":[]}],"open_questions":[{"q":"هل ينظّف الدماغ نفسه من الفضلات في النوم أسرع من اليقظة؟","why_open":"انتشرت هذه الفكرة نحو عشر سنوات، ثم وجدت تجربة على الفئران سنة 2024 أن التنظيف كان أبطأ في النوم بنحو الثلث؛ والعلماء يواصلون البحث، ومتفقون على أن النوم مهم."}],"notebook":{"draw":"ارسم{|ي} منحنى النسيان: خط ينزل بسرعة ثم يبطؤ، ثم ارسم{|ي} فوقه منحنى آخر ترفعه مراجعات بعد يوم وثلاثة أيام وأسبوع. ثم ارسم{|ي} ساعة نومك{|ِ}: موعد النوم وموعد الاستيقاظ. المستوى ب: ارسم{|ي} دورات الليل: نوم عميق ثم نوم أحلام، مكررة.","label":["الذاكرة","الانتباه","الاسترجاع","المراجعة المتباعدة","تثبيت الذاكرة","ساعات نومي","— ب: الحُصين، نوم الأحلام"],"write":"أشرح: لماذا أنسى؟ وكيف أقلل النسيان؟ ولماذا أنام ليلة الامتحان؟ وأكتب نتائج تجربة القائمتين."},"imgs":["U08.L05-E1","U08.L05-E2","U08.L05-E3","U08.L05-E4","U08.L05-E5","U08.L05-E6","U08.L05-exp","U08.L05-hist1","U08.L05-letter","U08.L05-life","U08.L05-title-boy","U08.L05-title-girl"]};
