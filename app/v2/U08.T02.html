const LD = {"id":"U08.T02","lesson":"U08.L02","first":false,"title":"اختبار: العين: كيف نرى؟","lessonTitle":"العين: كيف نرى؟","concepts":[],"check":[],"items":[{"id":"U08.L02.A1.a","objective":"U08.L02.O1","level":"A","type":"choose","prompt":"ما عمل القزحية؟","options":["تجمع الضوء على الشبكية","تحمل الرسائل إلى الدماغ","تضبط حجم البؤبؤ","تصنع الدموع"],"answer":2,"explanation":"في القزحية عضلات صغيرة توسّع البؤبؤ وتضيّقه.","feedback_by_option":{"0":"هذا عمل العدسة مع القرنية.","1":"هذا عمل العصب البصري.","3":"الدموع تصنعها غدد فوق العين."},"alt":{"prompt":"ما الطبقة الشفافة اللامعة في مقدمة العين، يمرّ فيها الضوء أولاً؟","options":["الشبكية","القرنية","القزحية","الجفن"],"answer":1,"explanation":"القرنية طبقة شفافة في مقدمة العين، يمرّ فيها الضوء أولاً.","feedback_by_option":{"0":"الشبكية في مؤخرة العين.","2":"القزحية ملونة لا شفافة.","3":"الجفن يغطي العين ويحميها، والضوء لا يمرّ فيه."}}},{"id":"U08.L02.A1.b","objective":"U08.L02.O1","level":"A","type":"true_false_why","prompt":"«البؤبؤ نقطة سوداء مرسومة على العين، لا يتغير». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ البؤبؤ فتحة يدخل منها الضوء، وتبدو سوداء لأن داخل العين مظلم، ويتسع ويضيق مع الضوء.","rubric":"R1","alt":{"prompt":"«الجفن والرموش تحمي العين من الغبار». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الرموش تصدّ الغبار، والجفن يغلق العين ويوزّع عليها الدموع."}},{"id":"U08.L02.A1.c","objective":"U08.L02.O1","level":"A","type":"choose_reason","prompt":"لماذا {ترمش|ترمشين} كثيراً دون أن {تفكر|تفكري} في ذلك؟","options":["لتوزّع الدموع وتحمي العين","لأن الجفن ثقيل فينزل وحده","لتغيّر لون القزحية","لتريح الدماغ من الرؤية"],"answer":0,"explanation":"الرمش يوزّع الدموع فيغسل العين ويمنع جفافها ويحميها من الغبار.","feedback_by_option":{"1":"الجفن تحرّكه عضلات، ونرمش لحماية العين.","2":"لون القزحية لا يتغير بالرمش.","3":"الرمش قصير جداً؛ عمله حماية العين."},"alt":{"prompt":"ماذا يحدث للعين إن قلّ الرمش طويلاً أمام الشاشة؟","options":["تتسع القزحية","يتغير لون البؤبؤ","تقوى الشبكية","تجف وتتعب"],"answer":3,"explanation":"قلة الرمش تقلل توزيع الدموع، فتجف العين وتتعب.","feedback_by_option":{"0":"القزحية لا تتسع بقلة الرمش.","1":"البؤبؤ أسود دائماً لأن داخل العين مظلم.","2":"قلة الرمش تتعب العين ولا تقويها."}}},{"id":"U08.L02.A2.a","objective":"U08.L02.O2","level":"A","type":"choose_reason","prompt":"لماذا لا نرى شيئاً في غرفة مظلمة تماماً ولو فتحنا أعيننا؟","options":["لأن العين تتعب في الظلام","لأن البؤبؤ ينغلق في الظلام","لأن الدماغ ينام في الظلام","لأنه لا ضوء يدخل العين"],"answer":3,"explanation":"نرى بالضوء الذي يدخل العين من الأشياء؛ فإذا لم يكن ضوء لم نرَ.","feedback_by_option":{"0":"العين لا تتعب في لحظة؛ ينقصها الضوء.","1":"البؤبؤ يتسع في الظلام، لا ينغلق.","2":"الدماغ يقظ؛ لكن لا رسائل تصله لأنه لا ضوء."},"detects":"M82","alt":{"prompt":"{تقرأ|تقرئين} تحت المصباح. أيّ رسم يُظهر طريق الضوء الصحيح؟","options":["عين ← كتاب","مصباح ← عين ← كتاب","مصباح ← كتاب ← عين","كتاب ← مصباح ← عين"],"answer":2,"explanation":"الضوء يخرج من المصباح، ويرتد عن الكتاب، ويدخل العين.","feedback_by_option":{"0":"العين لا ترسل شيئاً؛ الضوء يدخلها.","1":"الضوء يصل الكتاب أولاً ثم يرتد إلى العين.","3":"الكتاب لا يضيء المصباح؛ المصباح مصدر الضوء."},"detects":"M82"}},{"id":"U08.L02.A2.b","objective":"U08.L02.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} طريق الضوء من الشجرة حتى {تراها|ترينها}.","options":["الضوء يرتد عن الشجرة","يمرّ في القرنية والبؤبؤ","تجمعه العدسة على الشبكية","رسائل في العصب البصري","الدماغ يصنع صورة الشجرة"],"answer":[0,1,2,3,4],"explanation":"من الشيء إلى القرنية والبؤبؤ، ثم العدسة والشبكية، ثم العصب البصري إلى الدماغ.","alt":{"prompt":"رتّب{|ي} من الأمام إلى الخلف ما يمرّ به الضوء في العين.","options":["القرنية","البؤبؤ","العدسة","الشبكية"],"answer":[0,1,2,3],"explanation":"القرنية في المقدمة، ثم فتحة البؤبؤ، ثم العدسة، ثم الشبكية في المؤخرة."}},{"id":"U08.L02.A2.c","objective":"U08.L02.O2","level":"A","type":"true_false_why","prompt":"«الشبكية تحوّل الضوء إلى رسائل كهربائية». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في الشبكية ملايين الخلايا التي تحسّ الضوء وتحوّله إلى رسائل تسري في العصب البصري إلى الدماغ.","rubric":"R1","alt":{"prompt":"«نرى لأن العين ترسل أشعة إلى الأشياء». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الضوء يأتي من الأشياء ويدخل العين، ولو كانت العين ترسل أشعة لرأينا في الظلام التام."}},{"id":"U08.L02.A3.a","objective":"U08.L02.O3","level":"A","type":"choose","prompt":"{دخلت|دخلتِ} غرفة مظلمة. بعد قليل {صرت|صرتِ} {ترى|ترين} أكثر. ماذا فعل بؤبؤك{|ِ}؟","options":["ضاق ليحمي الشبكية","انغلق ثم انفتح","تغيّر لونه","اتسع ليُدخل ضوءاً أكثر"],"answer":3,"explanation":"في الظلام يتسع البؤبؤ بمنعكس ليُدخل ضوءاً أكثر.","feedback_by_option":{"0":"يضيق في الضوء القوي، لا في الظلام.","1":"لا ينغلق؛ يتسع ويضيق.","2":"البؤبؤ يبقى أسود؛ يتغير حجمه."},"alt":{"prompt":"لماذا يضيق البؤبؤ في الضوء القوي؟","options":["ليحمي الشبكية من ضوء كثير","لأن العين تتعب","ليرى الألوان أوضح","لأننا نقرر ذلك"],"answer":0,"explanation":"يضيق بمنعكس ليقلل الضوء الداخل ويحمي الشبكية.","feedback_by_option":{"1":"يضيق في لحظات، قبل أي تعب.","2":"الألوان تحتاج ضوءاً كافياً، لا قليلاً.","3":"هو منعكس لا نقرره."}}},{"id":"U08.L02.A3.b","objective":"U08.L02.O3","level":"A","type":"true_false_why","prompt":"«النظر إلى الشمس بنظارة شمسية آمن». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ النظارة الشمسية لا تكفي، والنظر المباشر إلى الشمس يؤذي الشبكية ولو بلا ألم.","rubric":"R1","alt":{"prompt":"«تضييق البؤبؤ منعكس لا نقرره». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يحدث وحده خلال ثوانٍ حين يقوى الضوء، كالمنعكسات التي تعلمناها."}},{"id":"U08.L02.A3.c","objective":"U08.L02.O3","level":"A","type":"explain_open","prompt":"أخوك{|ِ} الصغير يريد أن ينظر إلى كسوف الشمس بعينيه. ماذا {تقول|تقولين} له؟ ولماذا؟","answer":"لا ينظر إلى الشمس أبداً ولو في الكسوف ولو بنظارة شمسية، لأن الشبكية تتأذى بلا ألم وقد يدوم الأذى؛ يُنظر إلى الكسوف بمرشّحات خاصة يجهزها الكبار.","rubric":"R1"},{"id":"U08.L02.A4.a","objective":"U08.L02.O4","level":"A","type":"choose","prompt":"البقعة العمياء في العين هي:","options":["موضع خروج العصب البصري من الشبكية","البؤبؤ حين يضيق","جزء من القزحية","مرض يصيب بعض الناس"],"answer":0,"explanation":"في موضع خروج العصب البصري لا خلايا تحسّ الضوء، وهي في كل عين.","feedback_by_option":{"1":"البؤبؤ يُدخل الضوء ولو ضاق.","2":"القزحية في المقدمة؛ البقعة العمياء في الشبكية.","3":"هي في عين كل إنسان سليم، وليست مرضاً."},"alt":{"prompt":"لماذا اختفت النقطة في تجربة البطاقة؟","options":["لأن البطاقة اقتربت كثيراً من الضوء","لأن عيني تعبت فأغمضتها","لأن صورتها وقعت على البقعة العمياء","لأن البؤبؤ ضاق"],"answer":2,"explanation":"عند تلك المسافة وقعت صورة النقطة على موضع خروج العصب البصري، ولا خلايا فيه تحسّ الضوء.","feedback_by_option":{"0":"النقطة عادت حين قرّبنا البطاقة أكثر؛ المسافة هي المهمة.","1":"العين المفتوحة ظلت تنظر إلى العلامة.","3":"البؤبؤ لم يتغير؛ الضوء نفسه."}}},{"id":"U08.L02.A4.b","objective":"U08.L02.O4","level":"A","type":"true_false_why","prompt":"«العين وحدها ترى، ولا عمل للدماغ في الرؤية». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العين تجمع الضوء وتحوّله إلى رسائل، والدماغ يصنع منها الصورة ويكمل البقعة العمياء.","rubric":"R1","detects":"M83","alt":{"prompt":"«بالعينين معاً تغطي كل عين ما لا تراه الأخرى». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ولذلك عادت النقطة حين فتحنا العينين؛ والدماغ يجمع ما تراه العينان."}},{"id":"U08.L02.A4.c","objective":"U08.L02.O4","level":"A","type":"choose_reason","prompt":"أُصيب العصب البصري في عين رجل، وعينه سليمة الشكل. ماذا يحدث؟","options":["تظل العين ترى، لأن العدسة تعمل","لا تصل رسائل هذه العين إلى الدماغ","يتغير لون قزحيته","يرى بها في الظلام"],"answer":1,"explanation":"العصب البصري يحمل رسائل الشبكية إلى الدماغ؛ إن أُصيب لم تصل الرسائل، فلا يرى بها جيداً.","feedback_by_option":{"0":"العدسة تجمع الضوء، لكن الرسائل لا تصل بلا العصب.","2":"العصب لا علاقة له بلون القزحية.","3":"لا أحد يرى في الظلام التام."},"detects":"M83","alt":{"prompt":"من يصنع الصورة التي نراها؟","options":["العدسة","القرنية","الجفن","الدماغ من رسائل العين"],"answer":3,"explanation":"الدماغ يصنع الصورة من الرسائل التي تصله في العصب البصري.","feedback_by_option":{"0":"العدسة تجمع الضوء فقط.","1":"القرنية يمرّ فيها الضوء.","2":"الجفن يحمي العين."},"detects":"M83"}},{"id":"U08.L02.A5.a","objective":"U08.L02.O5","level":"B","type":"choose","prompt":"أيّ الخلايا في الشبكية ترى الألوان؟","options":["العصي","خلايا القزحية","المخاريط","خلايا العدسة"],"answer":2,"explanation":"المخاريط ترى الألوان وتحتاج ضوءاً كافياً، وهي ثلاثة أنواع.","feedback_by_option":{"0":"العصي ترى الأسود والأبيض والأشكال في الضوء الخافت.","1":"القزحية ملونة لكنها لا ترى.","3":"العدسة تجمع الضوء، لا ترى الألوان."},"alt":{"prompt":"كم في كل عين من العصي تقريباً؟","options":["نحو 7 ملايين","نحو 120 مليوناً","نحو ألف","نحو مليار"],"answer":1,"explanation":"نحو 120 مليوناً من العصي، ونحو 7 ملايين من المخاريط.","feedback_by_option":{"0":"هذا عدد المخاريط تقريباً.","2":"أكثر بكثير: ملايين.","3":"أقل من ذلك: نحو 120 مليوناً."}}},{"id":"U08.L02.A5.b","objective":"U08.L02.O5","level":"B","type":"true_false_why","prompt":"«الصورة التي تقع على الشبكية مقلوبة، ومع ذلك نرى العالم معتدلاً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العدسة تقلب الصورة كالغرفة المظلمة ذات الثقب، والدماغ يبني ما نراه من الرسائل.","rubric":"R1","alt":{"prompt":"«العدسة ترقّ حين ننظر إلى شيء قريب». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تزداد سُمكاً للقريب وترقّ للبعيد."}},{"id":"U08.L02.A5.c","objective":"U08.L02.O5","level":"B","type":"explain_open","prompt":"في الليل {تنظر|تنظرين} إلى حديقة: {ترى|ترين} الأشجار والطريق، لكن لا {تميّز|تميّزين} ألوان الورد. فسّر{|ي}.","answer":"في الضوء الخافت تعمل العصي فنرى الأشكال، والمخاريط التي ترى الألوان تحتاج ضوءاً أكثر فلا تكاد تعمل.","rubric":"R1"},{"id":"U08.L02.A6.a","objective":"U08.L02.O6","level":"B","type":"choose","prompt":"بماذا استدل ابن الهيثم على أن الضوء يدخل العين ولا يخرج منها؟","options":["بأن العين تتعب آخر النهار","بأن الألوان تختلف","بأن للعين لوناً","بأننا لا نرى في الظلام التام"],"answer":3,"explanation":"لو كانت العين ترسل أشعة لرأينا في الظلام؛ ونحن لا نرى بلا ضوء يدخل العين.","feedback_by_option":{"0":"التعب لا يفصل بين الفكرتين.","1":"اختلاف الألوان لا يجيب عن اتجاه الضوء.","2":"لون العين لا يدل على اتجاه الضوء."},"detects":"M82","alt":{"prompt":"ماذا أضاف كبلر سنة 1604؟","options":["أن الصورة تقع على الشبكية مقلوبة","أن العين ترسل أشعة","أن البؤبؤ نقطة مرسومة","أن الدماغ لا يعمل في الرؤية"],"answer":0,"explanation":"قال إن العدسة تجمع الضوء على الشبكية فتتكون عليها صورة مقلوبة، كالغرفة المظلمة.","feedback_by_option":{"1":"هذه الفكرة القديمة التي ردّها ابن الهيثم قبله.","2":"البؤبؤ فتحة، وهذا لم يقله أحد من العلماء.","3":"الدماغ هو الذي يصنع الصورة."}}},{"id":"U08.L02.A6.b","objective":"U08.L02.O6","level":"B","type":"true_false_why","prompt":"«القراءة في الضوء الخافت تُتلف العين إلى الأبد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ تُتعب العين وقد تسبب صداعاً مؤقتاً، ولا دليل على أنها تتلفها؛ والضوء الكافي أريح.","rubric":"R1","detects":"M84","alt":{"prompt":"«الجلوس قريباً جداً من الشاشة يُتعب العين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يتعبها ويجففها مؤقتاً، ولا دليل على أنه يتلف البصر؛ وقد يكون علامة على أن الطفل يحتاج فحص عينيه."}},{"id":"U08.L02.A6.c","objective":"U08.L02.O6","level":"B","type":"choose_reason","prompt":"قالت جدة سارة: «لا تلبسي النظارة كثيراً، تُضعف عينيك». ما الصواب؟","options":["صدقت، النظارة تُضعف العين","تلبسها ساعة واحدة في اليوم فقط","النظارة لا تُضعف العين","تتركها لتقوى عينها وحدها"],"answer":2,"explanation":"النظارة تغيّر طريق الضوء قبل أن يدخل العين فيقع واضحاً على الشبكية، ولا تغيّر العين نفسها.","feedback_by_option":{"0":"هذا قول شائع، لكن أطباء العيون يقولون إنها لا تُضعفها.","1":"تلبسها كما وصف الطبيب؛ النظارة لا تُضعف العين.","3":"ترك النظارة لا يقوّي العين، ويتعبها."},"detects":"M85","alt":{"prompt":"أيّ عادة تريح العين في يوم طويل على الشاشة؟","options":["تقريب الشاشة من العين","النظر إلى شيء بعيد كل عشرين دقيقة","إغلاق الستائر وإطفاء الأنوار","عدم الرمش للتركيز"],"answer":1,"explanation":"قاعدة 20-20-20: كل 20 دقيقة ننظر 20 ثانية إلى شيء بعيد نحو ستة أمتار.","feedback_by_option":{"0":"التقريب يتعب العين أكثر.","2":"الظلام حول الشاشة يتعب العين.","3":"الرمش يحمي العين من الجفاف."}}}],"transfer":[{"id":"U08.L02.T1","objective":"U08.L02.O2","type":"explain_open",
