const LD = {"id":"U03.L02","first":false,"title":"طرق الدم: شرايين وأوردة وشعيرات","driving_question":"لماذا تظهر الأوعية في يدي زرقاء إذا كان الدم أحمر؟","central_fact":"يجري الدم في حلقة مغلقة من الأوعية: شرايين تحمله بعيداً عن القلب، وشعيرات رقيقة يحدث فيها التبادل مع الخلايا، وأوردة تعيده إلى القلب؛ والدم أحمر في كل هذه الطرق.","next":"U03.L03","nexts":[{"id":"U03.L03","gated":false},{"id":"U03.L04","gated":false}],"hook":{"text":"{اسم}، انظر{|ي} إلى ظهر يدك{|ِ}. {ترى|ترين} خطوطاً مزرقّة تحت الجلد؟ قلنا إن الدم أحمر. فما هذا الأزرق؟","options":["دم أزرق","ليس دماً","دم أحمر يبدو أزرق","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["circulatory"],"highlight":["heart","arteries"],"zoom":"body","animate":"flow"},"text":"في الدرس الماضي رأينا القلب يدفع الدم. اليوم نتبع الطرق. يخرج الدم من القلب في أوعية قوية نسميها الشرايين. الشريان يحمل الدم بعيداً عن القلب، إلى الرأس والذراعين والساقين وكل عضو."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["capillaries"],"zoom":"capillary","animate":"exchange"},"text":"كلما ابتعد الشريان عن القلب تفرّع وصغر، حتى يصير شعيرات أرفع من شعرة رأسك. جدار الشعيرة رقيق جداً: طبقة واحدة من الخلايا. هنا فقط يخرج الأكسجين والغذاء من الدم إلى الخلايا، وتدخل الفضلات من الخلايا إلى الدم. الشعيرات هي محطات التبادل."},{"id":"E3","level":"A","atlas":{"layers":["circulatory"],"highlight":["veins","heart"],"zoom":"body","animate":"flow"},"text":"بعد الشعيرات تتجمع الأوعية من جديد وتكبر حتى تصير أوردة. الوريد يعيد الدم إلى القلب. الدم فيه أبطأ، وجداره أرقّ. شريان يذهب، شعيرة تبادل، وريد يعود: هذه حلقة مغلقة لا تتوقف."},{"id":"E4","level":"A","atlas":{"layers":["circulatory"],"highlight":["veins"],"zoom":"hand_color","animate":"toggle_color"},"text":"والآن سؤالنا: لماذا تبدو أوردة يدك{|ِ} زرقاء؟ الدم داخلها أحمر داكن، لكن الضوء الأزرق يرتد من سطح الجلد قبل أن يصل إلى الوريد، والأحمر ينفذ أعمق فيبتلعه الدم الداكن داخل الوريد؛ فيعود من فوق الوريد أحمرٌ أقل مما يعود من الجلد حوله، فنراه مزرقّاً بالمقارنة. ولذلك في رسومنا نلوّن الدم القليل الأكسجين بالأزرق لنميّز اتجاهه. هذا ترميز، والدم أحمر دائماً. اضغط{|ي} على الزر {لترى|لتري} اللون الحقيقي."},{"id":"E5","level":"B","atlas":{"layers":["circulatory","respiratory"],"highlight":["right_heart","lungs","left_heart"],"zoom":"chest","animate":"two_loops"},"text":"للدم حلقتان لا حلقة واحدة. الحلقة القصيرة: من يمين القلب عبر الشريان الرئوي إلى الرئتين، يأخذ الدم الأكسجين ويترك ثاني أكسيد الكربون، ويعود عبر الأوردة الرئوية إلى يسار القلب. نسميها الدورة الرئوية."},{"id":"E6","level":"B","atlas":{"layers":["circulatory"],"highlight":["left_heart","arteries","capillaries","veins","right_heart"],"zoom":"body","animate":"two_loops"},"text":"والحلقة الطويلة: من يسار القلب عبر الشريان الأكبر، الأبهر، إلى الجسم كله، يسلّم الدم الأكسجين في الشعيرات ويحمل الفضلات، ثم يعود عبر الوريدين الأجوفين إلى يمين القلب. نسميها الدورة الجهازية. والحلقتان تدوران معاً في اللحظة نفسها: مع كل ضربة ينقبض البطينان معاً، دفعة إلى الرئتين ودفعة إلى الجسم."},{"id":"E7","level":"B","atlas":{"layers":["circulatory"],"highlight":["arteries","veins"],"zoom":"vessel_wall","animate":"pulse"},"text":"لماذا جدار الشريان سميك ومرن؟ لأن الدم يخرج من القلب بدفعة قوية؛ يتمدد الجدار مع الدفعة ثم يرتد، وهذا الارتداد هو النبض الذي عددناه. ولماذا في الأوردة صمامات؟ لأن الدم فيها بطيء ويصعد ضد الجاذبية من الساقين؛ الصمامات تمنع رجوعه، وعضلات الساق تدفعه حين تنقبض. وتذكّر{|ي}: الشريان يُعرَّف بالاتجاه لا بالأكسجين، فالشريان الرئوي شريان يحمل دماً قليل الأكسجين."}],"practice":[{"id":"U03.L02.P1","after":"E2","objective":"U03.L02.O1","level":"A","type":"choose","prompt":"وعاء يخرج منه سهم من القلب إلى الذراع. ما نوعه؟","options":["وريد","شعيرة","شريان"],"answer":2,"explanation":"الشريان يحمل الدم بعيداً عن القلب، والسهم هنا يخرج من القلب إلى الذراع.","feedback_wrong":"انظر{|ي} إلى اتجاه السهم بالنسبة إلى القلب: يبتعد أم يقترب؟","feedback_by_option":{"0":"الوريد يعيد الدم إلى القلب؛ والسهم هنا يخرج من القلب.","1":"الشعيرة دقيقة جداً بين الشريان والوريد، والسهم هنا يخرج من القلب مباشرة."}},{"id":"U03.L02.P2","after":"E3","objective":"U03.L02.O2","level":"A","type":"choose_reason","prompt":"أين يخرج الأكسجين من الدم إلى الخلايا؟","options":["في الشريان الكبير لأنه قوي","في الوريد لأنه بطيء","في القلب","في الشعيرات لأن جدارها رقيق"],"answer":3,"explanation":"جدار الشعيرة رقيق جداً، فيعبره الأكسجين من الدم إلى الخلايا.","feedback_wrong":"ما الذي يجب أن يكون رقيقاً حتى يمر شيء عبره؟","feedback_by_option":{"0":"قوة الشريان في جداره السميك، وهذا الجدار لا يعبره الأكسجين.","1":"حين يصل الدم إلى الوريد يكون قد ترك جزءاً من أكسجينه؛ التبادل قبله.","2":"القلب يدفع الدم فقط؛ والتبادل مع الخلايا يحدث في أوعية دقيقة بينها."}},{"id":"U03.L02.P3","after":"E4","objective":"U03.L02.O3","level":"A","type":"true_false_why","prompt":"«الدم في الأوردة أحمر داكن، مع أن الأوردة تبدو مزرقّة من خلف الجلد». صح أم خطأ؟ ولماذا تبدو مزرقّة؟","answer":"صح؛ الدم أحمر دائماً (داكن حين يقلّ أكسجينه). الضوء الأحمر ينفذ أعمق فيبتلعه دم الوريد، فيعود من فوق الوريد أحمرٌ أقل مما يعود من الجلد حوله، فيبدو مزرقّاً بالمقارنة.","rubric":"R1"},{"id":"U03.L02.P4","objective":"U03.L02.O4","level":"B","type":"sequence","prompt":"رتّب{|ي} الدورة الرئوية ابتداءً من البطين الأيمن.","options":["البطين الأيمن","الشريان الرئوي","الرئتان","الأوردة الرئوية","الأذين الأيسر"],"answer":[0,1,2,3,4],"explanation":"البطين الأيمن يدفع الدم في الشريان الرئوي إلى الرئتين فيأخذ الأكسجين، ثم تعيده الأوردة الرئوية إلى الأذين الأيسر.","feedback_wrong":"أين يأخذ الدم الأكسجين؟ وبأي وعاء يصل إلى هناك؟"},{"id":"U03.L02.P5","after":"E7","objective":"U03.L02.O5","level":"B","type":"choose_reason","prompt":"لماذا جدار الشريان أسمك من جدار الوريد؟","options":["لأن الدم يخرج فيه من القلب بدفعة قوية","لأنه أطول","لأنه يحمل أكسجيناً","لأنه أقرب إلى الجلد"],"answer":0,"explanation":"الدم يخرج من القلب في الشريان بدفعة قوية مع كل ضربة، فيحتاج الشريان جداراً سميكاً يتحمّلها.","feedback_wrong":"ما الذي يحدث لجدار الشريان مع كل ضربة قلب؟","feedback_by_option":{"1":"الطول لا يحتاج جداراً سميكاً؛ الذي يحتاجه تحمّل الدفعة القوية من القلب.","2":"الأكسجين لا يحتاج جداراً سميكاً؛ والشريان الرئوي جداره سميك ودمه قليل الأكسجين.","3":"كثير من الشرايين عميقة تحت العضلات، وأقرب الأوعية إلى الجلد أوردة."}}],"check":[{"id":"U03.L02.C1","objective":"U03.L02.O1","level":"A","type":"choose","prompt":"في رسم الساق وعاء يحمل الدم من القدم صعوداً نحو الجذع. ما نوعه؟","options":["شريان","شعيرة","وريد"],"answer":2,"explanation":"الوعاء الذي يعيد الدم من القدم إلى القلب وريد.","feedback_wrong":"من القدم نحو القلب: يبتعد عن القلب أم يعود إليه؟","feedback_by_option":{"0":"الشريان يحمل الدم من القلب نزولاً إلى القدم؛ وهذا يصعد نحو القلب.","1":"الشعيرة دقيقة داخل الأنسجة؛ وهذا وعاء يعيد الدم من القدم إلى القلب."}},{"id":"U03.L02.C2","objective":"U03.L02.O2","level":"A","type":"fix_model","prompt":"رسم زميل{ك|تكِ} سهماً كُتب عليه «أكسجين» يخرج من الأبهر الكبير إلى عضلة الذراع مباشرة. ما الخطأ؟","answer":"التبادل لا يحدث في الشريان الكبير السميك بل في الشعيرات رقيقة الجدار داخل العضلة.","rubric":"R1"},{"id":"U03.L02.C3","objective":"U03.L02.O3","level":"A","type":"choose_reason","prompt":"في رسم الدرس لونّا بعض الأوعية بالأزرق. لماذا؟","options":["لأن الدم فيها أزرق","لأن الأوردة باردة","ترميز لنميّز الدم القليل الأكسجين","خطأ في الرسم"],"answer":2,"explanation":"الدم أحمر دائماً. الأزرق في الرسم ترميز يميّز الدم القليل الأكسجين من الغني به.","feedback_wrong":"ما لون الدم حين يخرج من وريد مجروح؟","detects":"M04","feedback_by_option":{"0":"الدم أحمر دائماً؛ الأزرق في الرسم ترميز يميّز الدم القليل الأكسجين.","1":"البرودة لا تغيّر لون الدم؛ الأزرق علامة اخترناها في الرسم.","3":"ليس خطأً؛ اخترنا الأزرق عمداً ليميّز شيئاً. ماذا يميّز؟"}},{"id":"U03.L02.C4","objective":"U03.L02.O4","level":"B","type":"sequence","prompt":"رتّب{|ي} الحلقة كاملة ابتداءً من الأذين الأيمن.","options":["الأذين الأيمن","البطين الأيمن","الرئتان","الأذين الأيسر","البطين الأيسر","الجسم (الشعيرات)"],"answer":[0,1,2,3,4,5],"explanation":"الحلقة: الأذين الأيمن ثم البطين الأيمن يدفع إلى الرئتين، فيعود الدم إلى الأذين الأيسر ثم البطين الأيسر الذي يدفعه إلى الجسم.","feedback_wrong":"الدم يأخذ الأكسجين في الرئتين قبل أن يذهب إلى الجسم. من أي جانب يُدفع إلى الرئتين؟"},{"id":"U03.L02.C5","objective":"U03.L02.O5","level":"B","type":"true_false_why","prompt":"«كل الشرايين تحمل دماً غنياً بالأكسجين». صح أم خطأ؟ اذكر{|ي} مثالاً.","answer":"خطأ؛ الشريان الرئوي يحمل دماً قليل الأكسجين إلى الرئتين. الشريان يُعرَّف بالاتجاه.","rubric":"R1"}],"concepts":[{"id":"artery","term":{"ar":"الشريان","en":"Artery","zh":"动脉","pinyin":"dòngmài"},"priority":"core","atlas":{"layer":"circulatory","element":"arteries"},"card":{"A":"وعاء يحمل الدم بعيداً عن القلب. جداره قوي لأن الدم يخرج من القلب بدفعة قوية.","B":"جداره سميك ومرن يتمدد مع كل دفعة ثم يرتد؛ هذا الارتداد هو النبض. الشريان الرئوي شريان يحمل دماً قليل الأكسجين، فالشريان يُعرَّف بالاتجاه لا بالأكسجين."}},{"id":"vein","term":{"ar":"الوريد","en":"Vein","zh":"静脉","pinyin":"jìngmài"},"priority":"core","atlas":{"layer":"circulatory","element":"veins"},"card":{"A":"وعاء يعيد الدم إلى القلب. يبدو مزرقّاً تحت الجلد، لكن الدم داخله أحمر داكن.","B":"جداره أرقّ والدم فيه أبطأ، وفيه صمامات صغيرة تمنع رجوع الدم إلى الأسفل، وتساعده عضلات الساق حين تنقبض."}},{"id":"capillary","term":{"ar":"الشعيرة الدموية","en":"Capillary","zh":"毛细血管","pinyin":"máoxì xuèguǎn","match":["الشعيرات","شعيرة"]},"priority":"core","atlas":{"layer":"circulatory","element":"capillaries"},"card":{"A":"أرقّ وعاء في الجسم، أرفع من الشعرة. هنا يخرج الأكسجين والغذاء إلى الخلايا، وتدخل الفضلات إلى الدم.","B":"جدارها طبقة واحدة من الخلايا؛ لذلك يمر الأكسجين والمغذيات عبرها. تصل كل خلية في الجسم تقريباً إلى شعيرة قريبة."}},{"id":"pulmonary_circuit","term":{"ar":"الدورة الرئوية","en":"Pulmonary circulation","zh":"肺循环","pinyin":"fèi xúnhuán"},"priority":"supporting","atlas":{"layer":"circulatory","element":"loop_pulmonary"},"card":{"B":"الحلقة القصيرة: يمين القلب → الرئتان (يأخذ الدم الأكسجين ويترك ثاني أكسيد الكربون) → يسار القلب."}},{"id":"systemic_circuit","term":{"ar":"الدورة الجهازية","en":"Systemic circulation","zh":"体循环","pinyin":"tǐ xúnhuán"},"priority":"supporting","atlas":{"layer":"circulatory","element":"loop_systemic"},"card":{"B":"الحلقة الطويلة: يسار القلب → الجسم كله (يسلّم الدم الأكسجين ويحمل الفضلات) → يمين القلب."}}],"experiment":{"title":"أوردة يدي: أختفي وأظهر","materials":["يدك","كرسي","كوب ماء دافئ (ليس ساخناً) اختياري"],"steps":["اجلس{|ي} وأرخِ{|ي} ذراعك{|ِ} متدلية إلى جانب الكرسي نصف دقيقة. انظر{|ي} إلى ظهر يدك{|ِ}: هل تبرز الأوردة؟","الآن ارفع{|ي} اليد فوق رأسك{|ِ} نصف دقيقة ثم انظر{|ي} إليها مرة أخرى. ماذا حدث للأوردة؟","{أعد|أعيدي} اليد إلى الأسفل. راقب{|ي} عودة الأوردة.","تجربة هارفي: {اختر|اختاري} وريداً بارزاً مستقيماً في الساعد أو ظهر اليد، بعيداً عن موضع تفرّعه. ضع{|ي} إصبعاً على طرفه القريب من الأصابع واضغط{|ي}، ثم بإصبع ثانٍ بجانبه اضغط{|ي} {ومرّره|ومرّريه} نحو المرفق (نحو القلب) فيفرغ الجزء بينهما. ارفع{|ي} الإصبع الثاني: هل يمتلئ الوريد من جهة المرفق؟ ثم ارفع{|ي} الإصبع الأول: من أي جهة امتلأ؟","سجّل{|ي} في دفتر الأطلس: متى تبرز الأوردة، ومن أي جهة امتلأ الوريد."],"safety":["ضغط خفيف فقط؛ لا شدّ ولا ربط حول الذراع.","لا ماء ساخناً.","من لا تظهر أوردته بوضوح يكتفي بمشاهدة زميل بإذنه أو بصور الدرس؛ ظهور الأوردة يختلف باختلاف الجلد وهذا طبيعي."],"expected":"تبرز الأوردة حين تتدلى اليد (الدم يتجمع فيها بفعل الجاذبية) وتختفي حين تُرفع (يعود الدم بسهولة إلى القلب). وعند تفريغ جزء من الوريد يبقى فارغاً ما دام الإصبع الذي جهة الأصابع ضاغطاً (الصمام يمنع رجوع الدم من جهة المرفق)، ثم يمتلئ فوراً من جهة الأصابع حين يُرفع، لأن الدم في الأوردة يسير نحو القلب فقط. وإن امتلأ من الجهتين فالوريد اختير عند تفرّع: جرّب{|ي} وريداً أطول.","explain":"الأوردة تعيد الدم إلى القلب ببطء وضغط منخفض، فحين تتدلى يدك{|ِ} يتجمع الدم فيها وتنتفخ، وحين {ترفعها|ترفعينها} يعود الدم بسهولة فتضمر. والوريد يمتلئ من جهة الأصابع لأن الدم فيه يجري في اتجاه واحد نحو القلب، وفيه صمامات تمنع عودته. هذا بالضبط ما لاحظه هارفي قبل أربعة قرون واستنتج منه أن الدم يدور.","record":"جملتان: «الأوردة تبرز حين…» و«امتلأ الوريد من جهة…».","alternatives":["من يتعذر عليه رفع الذراع يراقب أوردة ظهر اليد أثناء فتح القبضة وإغلاقها عدة مرات.","بديل بصري: صورتا اليد في الوضعين في الدرس."]},"find_the_error":[{"id":"FE1","atlas_variant":"aorta_exchange_arrow","error":"سهم تبادل الأكسجين يخرج من الأبهر مباشرة إلى العضلة","answer":"التبادل في الشعيرات فقط","detects":"M03"},{"id":"FE2","atlas_variant":"pulmonary_artery_red","error":"الشريان الرئوي ملوّن بالأحمر (غني بالأكسجين)","answer":"الشريان الرئوي يحمل دماً قليل الأكسجين؛ لونه بالترميز أزرق","detects":"M26"},{"id":"FE3","atlas_variant":"single_loop","error":"حلقة واحدة من القلب إلى الجسم تعود إلى القلب دون المرور بالرئتين","answer":"لا بد من حلقة الرئتين لأخذ الأكسجين","detects":"M22"}],"numbers":[{"text":"أوعية جسمك لو وُصلت خطاً واحداً: عشرات آلاف الكيلومترات. الرقم المشهور «100 ألف كم» تقدير قديم لا يعرف أحد دقته — مثال على رقم مشهور بلا دليل قوي.","source":["S2","S3"]},{"text":"الشعيرة أرفع من شعرة رأسك؛ خلايا الدم الحمراء تمر فيها واحدة واحدة في طابور.","source":["S2"]},{"text":"يضخ قلب البالغ نحو 7,000 لتر في اليوم — احسب رقمك أنت في جواز السفر وسيكون أقل لأن قلبك أصغر — لكن الدم كله بضعة لترات فقط: الكمية نفسها تدور أكثر من ألف مرة.","source":["S3"]}],"true_size":[{"text":"الشعيرة الحقيقية أقصر من مليمتر وأرفع من شعرة. خذ{|ي} شعرة من رأسك{|ِ} {وضعها|وضعيها} على ورقة بيضاء: الشعيرة أرفع من هذه الشعرة بعشر مرات تقريباً.","source":["S2"]},{"text":"لو صحّ التقدير المشهور (نحو 100 ألف كم) فكم رحلة من القاهرة إلى أسوان (نحو 900 كم) في أوعيتك{|ِ}؟ احسب{|ي}، ثم اسأل{|ي}: كيف يمكن أن يقيس أحد هذا الرقم أصلاً؟","source":["S2"]}],"animal":{"text":"للسمكة دورة واحدة فقط: قلب بحجرتين يدفع الدم إلى الخياشيم ثم يستمر إلى الجسم ويعود. للضفدع قلب بثلاث حجرات يختلط فيه الدم قليلاً. للطيور والثدييات دورتان منفصلتان تماماً بقلب من أربع حجرات، وهذا يساعد الحيوانات النشيطة ذوات الحرارة الثابتة على إيصال أكسجين كثير بسرعة.","source":["S8"]},"organ_letter":{"from":"الشعيرة الدموية","text":"أنا شعيرة دموية. أنا أرفع من شعرة رأسك{|ِ}، ولا أحد يرسمني لأني لا أُرى. لكن الشريان الكبير الذي يتباهى بجداره السميك لا يعطي الخلايا شيئاً؛ أنا التي أسلّم الأكسجين والغذاء وأحمل الفضلات، لأن جداري طبقة واحدة فقط. الكريّات الحمراء تمر عندي في طابور واحدة واحدة. عددنا في جسمك{|ِ} بالمليارات، ولو وُصلنا خطاً واحداً للففنا الأرض. مع التحية، الأصغر والأهم."},"history":[{"who":"وليم هارفي","origin":"إنجلترا","where_when":"1628","did":"أثبت الدورة بتجربة الوريد المضغوط (يمتلئ من جهة الأطراف لا من جهة القلب) وبحساب كمية الدم المدفوعة.","did_not":"لم يرَ الشعيرات؛ بقيت الوصلة بين الشرايين والأوردة فرضية عنده.","method_lesson":"فكرة صحيحة قد تنتظر أداة ترى الدليل.","source":["S6"]},{"who":"مارتشيلو مالبيغي","origin":"إيطاليا","where_when":"بولونيا، 1661","did":"رأى الشعيرات بالمجهر في رئة الضفدع، فأغلق الحلقة التي تركها هارفي مفتوحة.","did_not":"لم يعرف كيف يعبر الأكسجين جدار الشعيرة (الانتشار عُرف لاحقاً).","method_lesson":"الأداة الجديدة تكشف ما لا تراه العين.","source":["S6"]}],"how_we_know":{"text":"عرف هارفي عام 1628 أن الدم يدور في حلقة، لكنه لم يرَ كيف ينتقل من الشرايين إلى الأوردة؛ كانت الوصلة أدق من أن تُرى. بعد وفاته بأربع سنوات، عام 1661، نظر الإيطالي مارتشيلو مالبيغي بالمجهر إلى رئة ضفدع فرأى الشعيرات لأول مرة، وأُغلقت الحلقة.","limit_question":"ما الذي لا يُظهره رسم الأوعية في هذا الدرس؟ (اذكر{|ي} شيئاً واحداً)"},"what_changed":["اعتُقد أن الشرايين تحمل هواءً لا دماً (لأنها تُوجد فارغة بعد الموت)؛ هي تحمل دماً.","لم تُعرف الوصلة بين الشرايين والأوردة حتى رؤية الشعيرات بالمجهر."],"model_limits":["الرسم يُظهر عدداً قليلاً من الأوعية؛ الحقيقية تملأ كل الجسم كشبكة لا يخلو منها مكان.","الشعيرات في الرسم مكبّرة آلاف المرات.","الأزرق ترميز؛ الدم أحمر دائماً.","الرسم لا يُظهر الصمامات داخل الأوردة ولا حركة الجدار في الشرايين.","خطوط الضوء في صورة الوريد الأزرق تبسيط للتشتت والامتصاص؛ ليست انعكاساً مرآوياً ولا كل عوامل الظاهرة.","الشعرة في صورة الشعيرة للمقارنة التقريبية فقط.","في صورة التجربة ضغط موضعي ثابت؛ الصورة لا تثبت اتجاه تفريغ الوريد وإعادة امتلائه؛ التجربة بيدك هي الدليل."],"faith":{"opening":null,"closing":null},"life":[{"situation":"أرى أوردة يد جدي بارزة زرقاء.","science":"الأوردة تبرز مع العمر وتبدو مزرقّة بسبب الجلد؛ الدم فيها أحمر.","action":"لا أعلّق على أجسام الناس ولا أسخر من شكل عضو.","value":"اختلاف الأجسام طبيعي والسخرية أذى.","why":"الله خلق الناس مختلفين في الأجسام والألوان والأشكال، وهذا الاختلاف آية من آياته لا عيب في أحد. جسم جدي حمله ثمانين سنة؛ أوردته البارزة علامة عمر لا علامة نقص. ومن يسخر من جسم غيره اليوم سيكبر هو أيضاً.","reference":"الروم 22؛ الحجرات 11","cards":[],"verses":[]},{"situation":"وقفت ساكناً طويلاً في طابور الصباح فشعرت بدوار.","science":"الدم يتجمع في أوردة الساقين حين تسكن العضلات.","action":"أحرّك أصابع قدمي وساقيّ قليلاً، وأجلس إن زاد الدوار.","value":"أعتني بنفسي وأنتبه لزميل يشحب لونه فأخبر المعلم.","why":"لماذا الدوار؟ لأن الدم لا يصعد من الساقين وحده: عضلات الساق تعصر الأوردة فترفعه. حين أقف ساكناً تماماً يبقى الدم في الأسفل ويقلّ ما يصل إلى الدماغ. تحريك الأصابع «مضخة» صغيرة. وزميلي الذي يشحب ليس ضعيفاً؛ جسمه يرسل علامة، وإخبار المعلم مساعدة لا وشاية.","cards":[],"verses":[]}],"open_questions":[{"q":"كيف «تعرف» الشعيرات الجديدة أين تنمو بالضبط حين يُصاب جزء من الجسم؟","why_open":"نعرف إشارات كيميائية تجذبها، لكن الخريطة الكاملة لكيفية توجيه الأوعية ما زالت تُدرس."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة حلقة واحدة: القلب، شريان يخرج، شعيرات في عضلة، وريد يعود. لوّن{|ي} الدم أحمر في الكل، واكتب{|ي} بجانب الرسم: «الأزرق في الكتب ترميز». المستوى ب: ارسم{|ي} الحلقتين وسمِّ{|ي} الأبهر والشريان الرئوي.","label":["شريان","شعيرة","وريد","القلب","— مستوى ب: الأبهر، الشريان الرئوي، الدورة الرئوية، الدورة الجهازية"],"write":"نتيجة تجربة اليد: ماذا حدث حين رفعت الإصبع الثاني، ثم الأول؟ ومن أي جهة امتلأ الوريد؟ وماذا يخبرني ذلك عن اتجاه الدم وعن الصمامات؟ (إن لم أجرّب: أستعين بما في الدرس عن صمامات الأوردة، وأشرح ما كان سيحدث لو كان الدم يسير في الاتجاه المعاكس.)"},"imgs":["U03.L02-E1","U03.L02-E2","U03.L02-E3","U03.L02-E4","U03.L02-E5","U03.L02-E6","U03.L02-E7","U03.L02-exp","U03.L02-hist1","U03.L02-hist2","U03.L02-letter","U03.L02-life","U03.L02-title-boy","U03.L02-title-girl"]};
