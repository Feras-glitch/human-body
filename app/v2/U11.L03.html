const LD = {"id":"U11.L03","first":false,"title":"كيف أحكم على معلومة صحية؟ علماء أخطؤوا","driving_question":"{اسم}، وصلت إلى هاتف أهلك{|ِ} رسالة: «هذا الشراب يُنظّف الكبد في ثلاثة أيام، أرسلها لكل من تحب». كيف {تعرف|تعرفين} أصادقة هي أم لا؟","central_fact":"الادعاء الصحي لا يُصدَّق لأن قائله مشهور أو لأنه انتشر، بل بالدليل: من قال، وكيف عرف، وهل قورن مقارنة عادلة، وماذا يقول أهل العلم؛ والعلماء الكبار أخطؤوا وصحّح الدليلُ خطأهم، والفكرة الصحيحة رُفضت أولاً ثم قبلها الدليل.","next":null,"nexts":[],"hook":{"text":"{اسم}، وصلتك{|ِ} رسالة صحية من صديق، وأرسلها مئة شخص قبله. هل {تصدّقها|تصدّقينها}؟","options":["نعم، ما دام كثيرون أرسلوها","لا، أسأل كيف عرف قائلها","أرسلها ولا أفكر","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"في عشر وحدات {تعلمت|تعلمتِ} كيف يعمل جسمك{|ِ}. والآن سؤال أخير: كيف {تحكم|تحكمين} على ما {تسمعه|تسمعينه} عن الصحة؟ الادعاء الصحي قول بأن شيئاً يفيد الصحة أو يضرها، كشراب أو طعام أو عادة. وقد يكون صحيحاً وقد يكون خطأ. فقبل أن {تصدّق|تصدّقي} {اسأل|اسألي} أربعة أسئلة: من قال؟ وكيف عرف؟ وهل قورن الأمر مقارنة عادلة؟ وماذا يقول غيره من أهل العلم؟ وما يجعلنا نصدّق اسمه الدليل: ملاحظات وقياسات ومقارنات يستطيع غيرنا أن يكررها."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["heart","septum"],"zoom":"heart"},"text":"هل يخطئ العلماء الكبار؟ نعم. قال الطبيب اليوناني جالينوس قبل نحو ألف وثمانمئة سنة إن في الحاجز بين جانبي القلب ثقوباً يمر منها الدم. ونقل ذلك الأطباء من بعده، ومنهم ابن سينا في كتابه «القانون» الذي دُرِّس قروناً، فانتقل الخطأ مع الكتاب. ثم جاء ابن النفيس في القاهرة قبل نحو ثمانمئة سنة، فقال: الحاجز صلب لا منفذ فيه، والدم يمر من الجانب الأيمن إلى الرئة ثم يعود إلى الأيسر، كما {عرفت|عرفتِ} في درس القلب. الذي صحّح الخطأ لم يكن شهرة ابن النفيس، بل الدليل."},{"id":"E3","level":"A","atlas":{"layers":["skin"],"highlight":["hands"],"zoom":"hands"},"text":"وقد يحدث العكس: فكرة صحيحة يرفضها الناس. في ڤيينا سنة 1847 لاحظ الطبيب زيملفايس أن الأمهات يمتن بعد الولادة في جناح الأطباء أكثر من جناح القابلات بكثير، فقارن بين الجناحين، وألزم الأطباء بتطهير أيديهم، فنزلت الوفيات في جناحه من نحو 18 في المئة إلى نحو 1. ومع ذلك رفض أكثر الأطباء فكرته، وفُصل من عمله، ولم تُقبل إلا بعد موته حين عرف العلماء الجراثيم، كما {عرفت|عرفتِ} في درس الدفاع. فكثرة الرافضين لا تجعل القول خطأ، وكثرة المؤيدين لا تجعله صواباً: الحكم للدليل."},{"id":"E4","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"وكيف نعرف أن علاجاً ينفع؟ بالمقارنة العادلة: مجموعتان من الناس متشابهتان، لا تختلفان إلا في العلاج، ثم نقيس النتيجة في الاثنتين. فإن تحسنت المجموعة التي أخذت العلاج أكثر من الأخرى كان ذلك دليلاً. أما قول أحدهم: «جرّبته فتحسنت» فليس دليلاً كافياً، لأنه ربما كان سيتحسن بلا علاج. و{احذر|احذري} كلمة «طبيعي»: ليس كل ما في الطبيعة آمناً، فالفطر البري طبيعي وبعضه سام. ولا {تجرّب|تجرّبي} دواءً أو خلطة من رسالة؛ الدواء من الطبيب والأهل."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"فماذا {تفعل|تفعلين} حين تصلك{|ِ} رسالة صحية؟ لا {تنشرها|تنشريها} قبل أن {تتحقق|تتحققي}. {اسأل|اسألي} الأسئلة الأربعة، و{اسأل|اسألي} الطبيب أو كبيراً {تثق|تثقين} به. وإن لم {تعرف|تعرفي} {فقل|فقولي}: لا أعرف بعد؛ فهذا جواب العالِم الأمين. وهذا آخر درس في رحلتك{|ِ} داخل جسمك{|ِ}: ما {تعلمته|تعلمتِه} أمانة، {فعلّمه|فعلّميه} غيرك{|ِ} بدقة، كما {تعلمته|تعلمتِه} بدليله."},{"id":"E6","level":"B","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"للمستوى ب: الديك يصيح قبل طلوع الشمس، فهل صياحه يُطلعها؟ لا. «حدث بعده» لا يعني «حدث بسببه». ولهذا يستعمل العلماء التجربة العمياء: لا يعرف المشارك أي شيء أخذ، علاجاً أم شيئاً يشبهه لا يعمل، فلا يؤثر ظنه في النتيجة. وهل يستطيع الأطفال أن يتعلموا هذا؟ في أوغندا تعلّم أطفال الصف الخامس في 60 مدرسة تسع حصص عن الادعاءات، ولم يتعلمها أطفال 60 مدرسة أخرى، فنجح 69% ممن تعلّموا في الاختبار مقابل 27%."}],"practice":[{"id":"U11.L03.P1","after":"E1","objective":"U11.L03.O1","type":"choose","prompt":"أي هذه الأسئلة يساعدك{|ِ} أكثر على الحكم على رسالة صحية؟","options":["كم مرة أُرسلت؟","كيف عرف قائلها؟","هل صورتها جميلة؟","هل أرسلها صديق أحبه؟"],"answer":1,"explanation":"نسأل كيف عرف القائل: هل عنده دليل من ملاحظة أو مقارنة؟","level":"A","feedback_wrong":"ما الذي يجعلنا نصدّق: الشهرة أم الدليل؟","feedback_by_option":{"0":"كثرة الإرسال ليست دليلاً.","2":"الصورة الجميلة لا تجعل القول صحيحاً.","3":"نحب الصديق، لكنه قد ينقل خطأ دون قصد."},"detects":"M123"},{"id":"U11.L03.P2","after":"E2","objective":"U11.L03.O2","type":"choose","prompt":"من صحّح خطأ ثقوب حاجز القلب؟","options":["جالينوس اليوناني","ابن سينا في القانون","ابن النفيس","زيملفايس في ڤيينا"],"answer":2,"explanation":"ابن النفيس قال إن الحاجز صلب وإن الدم يمر بالرئة.","level":"A","feedback_wrong":"{تذكّر|تذكّري} درس القلب.","feedback_by_option":{"0":"جالينوس هو صاحب القول بالثقوب.","1":"ابن سينا نقل قول جالينوس.","3":"زيملفايس في قصة غسل الأيدي."},"detects":"M124"},{"id":"U11.L03.P3","after":"E3","objective":"U11.L03.O3","type":"choose_reason","prompt":"لماذا رُفضت فكرة زيملفايس أولاً مع أنها صحيحة؟","options":["لأنه لم يقارن بين جناحين في المستشفى","لأن الوفيات زادت بعد غسل الأيدي في جناحه","لأن الأطباء لم يقتنعوا","لأن الأمهات رفضن غسل الأيدي في الجناح"],"answer":2,"explanation":"قارن ونقصت الوفيات، لكن أكثر الأطباء لم يقتنعوا حتى عُرفت الجراثيم.","level":"A","feedback_wrong":"هل كان الدليل ناقصاً أم القبول؟","feedback_by_option":{"0":"قارن بين جناح الأطباء وجناح القابلات.","1":"الوفيات نقصت كثيراً بعد غسل الأيدي.","3":"الرفض جاء من الأطباء."}},{"id":"U11.L03.P4","after":"E4","objective":"U11.L03.O4","type":"choose_reason","prompt":"قالت رسالة: «هذه العشبة طبيعية، فهي آمنة لكل الأطفال». ما الرد الصحيح؟","options":["صحيح، الطبيعي لا يضر أحداً من الأطفال","نسأل عن الدليل والطبيب","نجربها على أخي الصغير أولاً ونرى","نرسلها لكل الأصدقاء كي يستفيدوا"],"answer":1,"explanation":"بعض ما في الطبيعة يضر؛ نسأل عن الدليل، والدواء من الطبيب والأهل.","level":"A","feedback_wrong":"هل كل ما في الطبيعة آمن؟","feedback_by_option":{"0":"الفطر البري طبيعي وبعضه سام.","2":"لا نجرّب على أحد؛ الدواء من الطبيب.","3":"لا ننشر ما لم نتحقق منه."},"detects":"M125"},{"id":"U11.L03.P5","after":"E5","objective":"U11.L03.O4","type":"sequence","prompt":"{رتّب|رتّبي} ما {تفعله|تفعلينه} حين تصلك{|ِ} رسالة صحية.","options":["أقرؤها ولا أنشرها بعد","أسأل الأسئلة الأربعة","أسأل الطبيب أو كبيراً أثق به","أحكم: أصدّق، أو لا أصدّق، أو لا أعرف بعد"],"answer":[0,1,2,3],"explanation":"أتوقف عن النشر، ثم أسأل، ثم أرجع إلى أهل العلم، ثم أحكم.","level":"A","feedback_wrong":"ماذا {تفعل|تفعلين} قبل أن {تنشر|تنشري}؟"}],"check":[{"id":"U11.L03.C1","objective":"U11.L03.O1","type":"explain_open","prompt":"{اكتب|اكتبي} الأسئلة الأربعة التي {تسألها|تسألينها} عن أي ادعاء صحي.","answer":"من قال؟ وكيف عرف؟ وهل قورن مقارنة عادلة؟ وماذا يقول غيره من أهل العلم؟","level":"A","rubric":"R1"},{"id":"U11.L03.C2","objective":"U11.L03.O2","type":"true_false_why","prompt":"«ما دام ابن سينا قاله فهو صحيح». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ ابن سينا عالم كبير، لكنه نقل خطأ جالينوس في حاجز القلب، وصحّحه ابن النفيس بالدليل. الحكم للدليل لا للاسم.","level":"A","rubric":"R1"},{"id":"U11.L03.C3","objective":"U11.L03.O3","type":"explain_open","prompt":"ماذا تعلّمنا قصة زيملفايس عن «كل الناس يقولون»؟","answer":"أن كثرة القائلين لا تجعل القول صواباً ولا خطأ؛ أكثر الأطباء رفضوا فكرته الصحيحة، والدليل هو الذي حكم في النهاية.","level":"A","rubric":"R1"},{"id":"U11.L03.C4","objective":"U11.L03.O4","type":"fix_model","prompt":"قال سعيد: «أرسلت الرسالة لكل الصف لأنها قد تكون صحيحة، وإن كانت خطأ فلا ضرر». {صحّح|صحّحي} له.","answer":"قد تضر: قد يجرّب أحدهم شيئاً خطأ؛ نتحقق قبل أن ننشر، ونسأل الطبيب أو كبيراً موثوقاً.","level":"A","rubric":"R1"},{"id":"U11.L03.C5","objective":"U11.L03.O1","type":"true_false_why","prompt":"«الرسالة التي أُرسلت ألف مرة أصدق من التي أُرسلت مرة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ كثرة الإرسال ليست دليلاً؛ نسأل كيف عرف القائل وهل قورن الأمر مقارنة عادلة.","level":"A","rubric":"R1"},{"id":"U11.L03.C6","objective":"U11.L03.O4","type":"explain_open","prompt":"متى يكون «لا أعرف» جواباً جيداً؟","answer":"حين لا يكون عندي دليل؛ فأقول لا أعرف بعد، ثم أسأل وأبحث، ولا أقول ما لا أعلم.","level":"A","rubric":"R1"}],"concepts":[{"id":"health_claim","term":{"ar":"الادعاء الصحي","en":"Health claim","zh":"健康声明","pinyin":"jiànkāng shēngmíng","match":["الادعاء الصحي","ادعاء صحي","الادعاء","ادعاء"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"قول بأن شيئاً يفيد الصحة أو يضرها: طعام أو شراب أو عادة أو دواء. قد يكون صحيحاً وقد يكون خطأ، ولا نعرف حتى نتحقق.","B":"أكثر الادعاءات انتشاراً تعد بنتيجة سريعة أو كاملة، وهذا وحده سبب للتحقق."}},{"id":"evidence","term":{"ar":"الدليل","en":"Evidence","zh":"证据","pinyin":"zhèngjù","match":["الدليل","دليل","الأدلة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"ما يجعلنا نصدّق قولاً: ملاحظات وقياسات ومقارنات يستطيع غيرنا أن يكررها ويجد مثلها.","B":"الدليل الأقوى في العلاج مقارنة عادلة بين مجموعتين كبيرتين."}},{"id":"fair_test","term":{"ar":"المقارنة العادلة","en":"Fair comparison","zh":"公平比较","pinyin":"gōngpíng bǐjiào","match":["المقارنة العادلة","مقارنة عادلة"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"أن نقارن مجموعتين متشابهتين لا تختلفان إلا في الشيء الذي نختبره، ثم نقيس النتيجة في الاثنتين.","B":"وتصير أعدل إذا اختيرت المجموعتان بالقرعة، ولم يعرف المقيس أيهما أخذ ماذا."}},{"id":"blind_test","term":{"ar":"التجربة العمياء","en":"Blind test","zh":"盲法试验","pinyin":"mángfǎ shìyàn","match":["التجربة العمياء"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"تجربة لا يعرف فيها المشارك أي شيء أخذ، فلا يؤثر ظنه في النتيجة.","B":"إذا لم يعرف المشارك ولا من يقيس النتيجة سُمّيت تجربة عمياء مزدوجة."}}],"experiment":{"title":"مختبر الرسائل: أصدّق، لا أصدّق، أتحقق أولاً","materials":["خمس رسائل صحية متخيَّلة في بطاقات (في المشهد أو يكتبها المعلم)","بطاقة الأسئلة الأربعة","دفتر الأطلس وقلم"],"steps":["{اقرأ|اقرئي} الرسالة الأولى، و{اسأل|اسألي} الأسئلة الأربعة: من قال؟ كيف عرف؟ هل قورن مقارنة عادلة؟ ماذا يقول أهل العلم؟","{ضع|ضعي} علامة عند كل سؤال: هل في الرسالة جواب عنه؟","{احكم|احكمي}: أصدّق، أو لا أصدّق، أو أتحقق أولاً؛ و{اكتب|اكتبي} السبب في سطر.","{كرّر|كرّري} مع الرسائل الأربع الأخرى.","مع أهلك{|ِ}: {ابحثوا|ابحثي} عن رسالة صحية حقيقية وصلتكم، و{طبّقوا|طبّقي} عليها الأسئلة نفسها بلطف واحترام."],"safety":["لا نجرّب أي شراب أو دواء أو خلطة من رسالة؛ الدواء من الطبيب والأهل.","لا نسخر من أحد أرسل رسالة غير موثوقة؛ نسأل معه بلطف.","لا نفتح روابط غريبة ولا نعطي معلومات شخصية."],"expected":"أكثر الرسائل لا تجيب عن «كيف عرف؟» ولا عن «هل قورن؟»، فيكون الحكم «أتحقق أولاً» أو «لا أصدّق»؛ والرسالة التي تذكر جهة صحية معروفة ودليلاً مقارناً أقرب إلى التصديق.","explain":"الرسالة التي تعد بنتيجة سريعة وكاملة، ولا تذكر من قال ولا كيف عرف، وتطلب أن تُرسل لكل الناس، تحتاج تحققاً قبل التصديق؛ لأن الدليل هو الذي يحكم، لا الثقة بالمرسل ولا كثرة النشر.","record":"الرسالة 1: من قال؟ ___ كيف عرف؟ ___ مقارنة؟ ___ أهل العلم؟ ___ حكمي ___ — وهكذا للرسائل الخمس","alternatives":["المعلم يقرأ الرسائل بصوت عالٍ ويحكم الصف معاً.","من لا يستطيع الكتابة: يرفع بطاقة من ثلاث (أصدّق، لا أصدّق، أتحقق)."]},"find_the_error":[{"id":"FE1","atlas_variant":"famous_true","error":"ملصق: قالها طبيب مشهور، إذن هي صحيحة","answer":"الشهرة ليست دليلاً؛ نسأل كيف عرف وهل قورن","detects":"M123"},{"id":"FE2","atlas_variant":"old_books_true","error":"جملة في دفتر: ما في الكتب القديمة صحيح كله","answer":"العلماء الكبار أخطؤوا، كجالينوس في حاجز القلب، وصحّح الدليل الخطأ","detects":"M124"},{"id":"FE3","atlas_variant":"natural_safe","error":"إعلان: طبيعي، إذن آمن","answer":"ليس كل طبيعي آمناً؛ نسأل عن الدليل والطبيب","detects":"M125"}],"numbers":[{"text":"بقي قول جالينوس في ثقوب حاجز القلب نحو ألف سنة قبل أن يردّه ابن النفيس.","source":["S3"]},{"text":"في جناح زيملفايس نزلت الوفيات من نحو 18 من كل مئة أم إلى نحو واحدة من كل مئة.","source":["S5"]}],"true_size":[{"text":"بقي خطأ ثقوب حاجز القلب نحو ألف سنة في الكتب، وصحّحه طبيب واحد نظر بعينه وفكّر بالدليل.","source":["S3"]}],"animal":null,"organ_letter":{"from":"الدماغ","text":"مرحباً، أنا دماغك{|ِ}. رافقتك{|ِ} في عشر وحدات: {تعلمت|تعلمتِ} بي العظام والقلب والرئتين والطعام والماء والحواس والجلد والنمو. والآن أطلب منك{|ِ} شيئاً واحداً: لا {تصدّق|تصدّقي} كل ما يصلني من الشاشات والكلام. {اسألني|اسأليني}: من قال؟ كيف عرف؟ هل قورن؟ ماذا يقول أهل العلم؟ أنا أحب الأسئلة، وأقوى بها. وإن لم أعرف فدعني أقول: لا أعرف بعد، ثم نبحث معاً. وما {تعلمته|تعلمتِه} {علّمه|علّميه} غيرك{|ِ} كما هو، فهكذا يبقى العلم نافعاً."},"history":[{"who":"ابن النفيس","origin":"دمشق؛ عمل في القاهرة. مسلم","where_when":"القاهرة، نحو 1242، «شرح تشريح القانون»","did":"شرح كتاب ابن سينا، ولم يقبل كل ما فيه: ردّ قول جالينوس الذي نقله ابن سينا بأن في حاجز القلب ثقوباً، وقال إن الحاجز صلب وإن الدم يمر من الجانب الأيمن إلى الرئة ثم يعود إلى الأيسر.","did_not":"لم يصف دوران الدم كاملاً في حلقة يدفعها القلب (هارفي 1628)، ولم يرَ الشعيرات؛ وبقي وصفه شبه مجهول حتى أعيد اكتشافه سنة 1924.","method_lesson":"أن نحترم العلماء الكبار ونتعلم منهم، ثم نحكم على أقوالهم بالدليل لا بأسمائهم.","source":["S3","S4"]}],"how_we_know":{"text":"هل يستطيع طفل في عمرك{|ِ} أن يتعلم الحكم على الادعاءات الصحية؟ جرّب ذلك باحثون في أوغندا: في 120 مدرسة، تعلّم أطفال الصف الخامس في نصف المدارس تسع حصص عن الادعاءات، وأطفال النصف الآخر لم يتعلموها، ثم اختُبر الجميع. نجح 69% ممن تعلّموا مقابل 27% ممن لم يتعلموا، وبقي الفرق بعد سنة. وهذه نفسها مقارنة عادلة.","limit_question":"لماذا لا تكفي تجربة في بلد واحد لنقول إن الطريقة تنفع في كل مكان؟"},"what_changed":["كان الأطباء قروناً يتعلمون قلب جالينوس من الكتب؛ ثم صار التشريح والملاحظة هما الحكم، وصحّح ابن النفيس الحاجز.","كان الطبيب يحكم على العلاج بما رآه في مرضاه؛ واليوم يُحكم عليه بمقارنات عادلة بين مجموعات كبيرة."],"model_limits":["الأسئلة الأربعة تساعد ولا تكفي وحدها: بعض الأسئلة يحتاج طبيباً أو مختصاً ليجيب عنها.","قصص العلماء في الدرس مختصرة؛ في الحقيقة شارك في كل تصحيح أناس كثيرون وأخذ سنوات.","رسائل «مختبر الرسائل» متخيَّلة؛ الرسائل الحقيقية أكثر تنوعاً، وبعضها صحيح."],"faith":{"opening":{"text":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَـٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَـٰدِمِينَ","reference":"الحجرات 6","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} أمر بالتبيّن: إذا جاءنا خبر ممن لا نعرف صدقه تحققنا منه قبل أن نعمل به، كي لا نؤذي أحداً بجهل ثم نندم. واليوم نتعلم كيف نتبيّن حين يصلنا خبر عن الصحة: نسأل من قال، وكيف عرف، وهل قورن الأمر مقارنة عادلة. والآية لا تتكلم عن الطب ولا عن الرسائل الصحية بعينها، والعلم لا يشرح الآية؛ لكنها تعلّمنا خُلق التبيّن في كل خبر. متى {وصلك|وصلكِ} خبر {صدّقته|صدّقتِه} ثم {عرفت|عرفتِ} أنه غير صحيح؟","reviewed":false,"quran_key":"49:6","hl_words":[7,7],"highlight":"فتبينوا","level":"ترغيب","concept":"التبيّن قبل التصديق والعمل والنشر.","avoid":"لا نقول إن الآية تتكلم عن الطب أو الإنترنت، ولا نصف كل من أرسل رسالة خطأ بأنه فاسق؛ الآية تعلّم التبيّن.","cards":[]},"closing":{"text":"۞ وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَـٰلِحًۭا ۚ قَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ إِلَـٰهٍ غَيْرُهُۥ ۖ هُوَ أَنشَأَكُم مِّنَ ٱلْأَرْضِ وَٱسْتَعْمَرَكُمْ فِيهَا فَٱسْتَغْفِرُوهُ ثُمَّ تُوبُوٓا۟ إِلَيْهِ ۚ إِنَّ رَبِّى قَرِيبٌۭ مُّجِيبٌۭ","reference":"هود 61","grade":"قرآن","usage":"غاية","reflection":"هذا آخر درس في رحلتك{|ِ} داخل جسمك{|ِ}. وفي الآية التي أمامك{|ِ} أن الله خلقنا من الأرض وجعلنا نعمرها. وعمارة الأرض تبدأ بأن نفهم ما بين أيدينا، وأقرب ما بين أيدينا أجسادنا: عظاماً وقلباً ورئتين وطعاماً وماءً وحواس وجلداً ونمواً. ومن ابن النفيس في القاهرة إلى زيملفايس في ڤيينا، بنى العلم من سأل وتحقق وصحّح. والآية لا تشرح الجسم، والعلم لا يشرح الآية؛ لكنها تذكّرنا لماذا نتعلم. ماذا {ستعمر|ستعمرين} بما {تعلمته|تعلمتِه}؟","reviewed":false,"quran_key":"11:61","hl_words":[13,18],"highlight":"هو أنشأكم من الأرض واستعمركم فيها","level":"خبر","concept":"نتعلم لنعمر الأرض بالعلم النافع والعمل.","avoid":"لا نقول إن الآية تصف خلق الجسم علمياً، ولا نجعل العلم دليلاً عليها؛ هي تذكير بالغاية.","cards":[]}},"life":[{"situation":"في مجموعة العائلة وصلت رسالة تقول إن شراباً منزلياً يمنع كل الأمراض، والجميع يريد أن يرسلها لغيره.","science":"الرسالة لا تذكر من قال ولا كيف عرف ولا أي مقارنة، وتعد بنتيجة كاملة؛ وهذا كله يستدعي التحقق، وليس كل ما يُخلط في البيت آمناً للجميع.","action":"أقول بلطف: لنسأل الطبيب أو جهة صحية موثوقة قبل أن نجرّبها أو ننشرها؛ ولا أنشرها أنا.","value":"التبيّن، وألا أقول ما لا أعلم.","why":"لماذا لا أنشرها «احتياطاً»؟ لأنها إن كانت خطأ فقد يجرّبها أحد فيتأذى. وفي الآية في البطاقة نهي عن اتباع ما ليس لنا به علم، وأن السمع والبصر والقلب مسؤولة.","reference":"الإسراء 36","quran":["17:36"],"cards":[],"verses":["17:36"]},{"situation":"أنهيت المنهاج كله، وأخي الصغير يسألني كل يوم: لماذا يدق قلبي؟ ولماذا أعطش؟","science":"ما تعلمته له دليل ومصادر؛ وحين أشرحه بدقة وأقول «لا أعرف» فيما لا أعرفه، يتعلم أخي علماً صحيحاً.","action":"أجيبه بما تعلمته بكلمات بسيطة، وأريه تجربة صغيرة كعدّ النبض، وأقول له من أين عرفت؛ وما لا أعرفه نبحث عنه معاً.","value":"العلم النافع يُعلَّم ويبقى.","why":"لماذا أتعب نفسي في تعليمه؟ لأن العلم الذي يُنتفع به من الأعمال التي يبقى أجرها بعد صاحبها، كما في الحديث في البطاقة.","hadith":["muslim:1631"],"cards":[{"key":"muslim:1631","lead":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم يُنتفع به، أو ولد صالح يدعو له","narration":false,"source":"مسلم 1631","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"لماذا تنتشر الأخبار الخطأ أحياناً أسرع من الصحيحة؟","why_open":"يدرس العلماء ذلك اليوم، ومن تفسيراتهم أن الخبر الغريب أو المخيف يلفت الانتباه أكثر، لكن الصورة الكاملة لم تتضح بعد."}],"notebook":{"draw":"{ارسم|ارسمي} يداً، و{اكتب|اكتبي} على أربعة أصابع الأسئلة الأربعة، وعلى الإبهام: أسأل الطبيب أو كبيراً موثوقاً. ثم {ارسم|ارسمي} خطاً زمنياً: جالينوس ← ابن سينا ← ابن النفيس. المستوى ب: {ارسم|ارسمي} مجموعتين للمقارنة العادلة.","label":["الادعاء الصحي","الدليل","المقارنة العادلة","جالينوس","ابن سينا","ابن النفيس","زيملفايس","— ب: التجربة العمياء"],"write":"أشرح: كيف أحكم على رسالة صحية؟ وماذا تعلمني قصة ابن النفيس وقصة زيملفايس؟ وأكتب حكمي على الرسائل الخمس في مختبر الرسائل وسببه."},"imgs":["U11.L03-E1","U11.L03-E2","U11.L03-E3","U11.L03-E4","U11.L03-E5","U11.L03-E6"]};
