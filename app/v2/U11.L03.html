const LD = {"id":"U11.L03","first":false,"title":"الإنسان والحيوان","driving_question":"{اسم}، قلبك{|ِ} وقلب السمكة وقلب العصفور: هل هي متشابهة؟ وماذا نتعلم من أجسام الحيوانات، وكيف نرحمها؟","central_fact":"الإنسان وكثير من الحيوانات تشترك في أجهزة تعمل العمل نفسه بأشكال مختلفة: قلب السمك حجرتان وقلبنا أربع، والسمك يتنفس بالخياشيم، وعنق الزرافة فيه سبع فقرات مثلنا، والكلب يشم أكثر منا بكثير؛ والمقارنة تعلّمنا ولها حدود؛ والحيوان أمانة نرحمه ونغسل أيدينا بعد لمسه.","next":"U11.L04","nexts":[{"id":"U11.L04","gated":false}],"hook":{"text":"{اسم}، أي هذه فيها عظام في العنق بعدد ما في عنقك{|ِ}؟","options":["الزرافة","الثعبان","السمكة","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["skeleton"],"highlight":["spine"],"zoom":"body"},"text":"في هذا المنهاج {عرفت|عرفتِ} جسمك{|ِ} جهازاً جهازاً. فهل للحيوانات أجهزة مثلها؟ كثير منها نعم: قلب ودم، وتنفس، وهضم، وعظام وعضلات، وأعصاب وحواس؛ لكن بأشكال مختلفة. والإنسان من الفقاريات، وهي حيوانات لها عمود فقري، كالسمك والضفادع والطيور. ومن الفقاريات الثدييات، وهي حيوانات ترضع صغارها، كالإنسان والبقرة والزرافة والكلب."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["heart"],"zoom":"heart"},"text":"{تذكّر|تذكّري} أن في قلبك{|ِ} أربع حجرات. وفي الطيور والثدييات أربع أيضاً. أما الضفدع وسائر البرمائيات فقلبها ثلاث حجرات، وأما السمك فقلبه حجرتان فقط. والسمك يأخذ الأكسجين بالخياشيم: أعضاء في جانبي رأسه تأخذ الأكسجين الذائب في الماء. ويمر دمه في دورة واحدة: من القلب إلى الخياشيم ثم إلى الجسم."},{"id":"E3","level":"A","atlas":{"layers":["skeleton"],"highlight":["spine"],"zoom":"body"},"text":"كم فقرة في عنق الزرافة؟ سبع، مثل عنقك{|ِ} تماماً! لكن الفقرة الواحدة في عنق الزرافة أطول بكثير. فالجسم يعيد التصميم نفسه بأحجام مختلفة. وفي أنف الكلب ما يصل إلى 300 مليون مستقبل للشم، وفي أنفك{|ِ} نحو 6 ملايين؛ ولذلك يشم الكلب ما لا نشمه، ويعين الناس في البحث والإنقاذ."},{"id":"E4","level":"A","atlas":{"layers":["digestive"],"highlight":["stomach"],"zoom":"body"},"text":"والبقرة من المجترات: حيوانات تعيد العشب من معدتها إلى فمها لتمضغه مرة ثانية. ومعدتها أربعة أجزاء متصلة، أكبرها الكرش، وفيه ملايين الكائنات الدقيقة تهضم من العشب ما لا تهضمه البقرة وحدها. أما معدتك{|ِ} فبسيطة، ولا تهضم العشب؛ ولذلك لا نأكل العشب، ونأكل ما يناسب أجسامنا. فكل جسم يناسب عيشه."},{"id":"E5","level":"A","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"الحيوان يحتاج مثلنا إلى طعام وماء ومكان آمن. فإن {رعيت|رعيتِ} حيواناً، {أطعمه|أطعميه} و{اسقه|اسقيه}، ولا {تؤذه|تؤذيه} ولا {تحمّله|تحمّليه} ما لا يطيق. وقد يحمل الحيوان ميكروبات وهو يبدو سليماً، فـ{اغسل|اغسلي} يديك{|ِ} بالماء والصابون بعد لمسه أو اللعب معه أو لمس طعامه. والأطفال الصغار دون الخامسة يكون معهم كبير."},{"id":"E6","level":"B","atlas":{"layers":["body"],"highlight":["systems"],"zoom":"body"},"text":"للمستوى ب: التشريح المقارن: أن نقارن أجسام الكائنات جزءاً بجزء لنفهم كيف يعمل كل جسم. وقبل أكثر من ألف ومئة سنة كتب الجاحظ في البصرة «كتاب الحيوان» في سبعة مجلدات، ووصف فيه أكثر من 350 نوعاً، ودعا إلى المشاهدة بنفسه. وللمقارنة حدود: {تذكّر|تذكّري} من درس الدواء أن ابن سينا اشترط تجربة الدواء على الإنسان، لأن الحيوان قد يتأثر به على غير ما يتأثر الإنسان."}],"practice":[{"id":"U11.L03.P1","after":"E1","objective":"U11.L03.O1","type":"choose","prompt":"أي هذه من الثدييات؟","options":["السمكة","الضفدع","العصفور","البقرة"],"answer":3,"explanation":"البقرة ترضع صغارها.","level":"A","feedback_wrong":"أي حيوان يرضع صغاره؟","feedback_by_option":{"0":"السمكة من الفقاريات، لا ترضع.","1":"الضفدع من البرمائيات.","2":"العصفور من الطيور."}},{"id":"U11.L03.P2","after":"E2","objective":"U11.L03.O2","type":"choose","prompt":"كم حجرة في قلب السمكة؟","options":["أربع","حجرتان","ثلاث","ست"],"answer":1,"explanation":"أذين واحد وبطين واحد.","level":"A","feedback_wrong":"السمكة أقل من الضفدع.","feedback_by_option":{"0":"أربع في الطيور والثدييات.","2":"ثلاث في البرمائيات.","3":"لا يوجد قلب بست حجرات هنا."},"detects":"M155"},{"id":"U11.L03.P3","after":"E3","objective":"U11.L03.O2","type":"choose","prompt":"كم فقرة في عنق الزرافة؟","options":["سبعون","مئة","سبع، مثل الإنسان","ثلاث"],"answer":2,"explanation":"سبع، لكنها طويلة.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: العدد كعنقك{|ِ}.","feedback_by_option":{"0":"العدد نفسه كالإنسان.","1":"العدد نفسه كالإنسان.","3":"أكثر من ثلاث."},"detects":"M156"},{"id":"U11.L03.P4","after":"E4","objective":"U11.L03.O3","type":"choose","prompt":"لماذا تهضم البقرة العشب ولا نهضمه نحن؟","options":["لأن في معدتها كائنات دقيقة تهضمه","لأن أسنانها أكبر","لأنها تشرب ماء أكثر","لأنها تنام واقفة"],"answer":0,"explanation":"الكائنات الدقيقة في الكرش تهضم النبات.","level":"A","feedback_wrong":"ماذا يعيش في كرش البقرة؟","feedback_by_option":{"1":"الأسنان تمضغ ولا تهضم.","2":"الماء ليس السبب.","3":"لا علاقة للنوم."}},{"id":"U11.L03.P5","after":"E5","objective":"U11.L03.O4","type":"choose","prompt":"بعد اللعب مع القطة، ماذا {تفعل|تفعلين}؟","options":["آكل مباشرة","أمسح يدي بملابسي","أغسل يدي بالماء والصابون","أكمل اللعب، القطة نظيفة"],"answer":2,"explanation":"نغسل أيدينا بعد لمس الحيوان.","level":"A","feedback_wrong":"ما أفضل ما يحفظ الصحة مع الحيوان؟","feedback_by_option":{"0":"قد تنتقل الميكروبات إلى الطعام.","1":"لا يزيل الميكروبات.","3":"قد تحمل ميكروبات وهي تبدو سليمة."},"detects":"M157"}],"check":[{"id":"U11.L03.C1","objective":"U11.L03.O1","type":"explain_open","prompt":"{اذكر|اذكري} ثلاثة أجهزة يشترك فيها الإنسان والكلب.","answer":"القلب والدم؛ الرئتان للتنفس؛ المعدة والأمعاء للهضم؛ العظام والعضلات؛ الأعصاب والحواس.","level":"A","rubric":"R1"},{"id":"U11.L03.C2","objective":"U11.L03.O2","type":"true_false_why","prompt":"«في قلب العصفور أربع حجرات مثل قلب الإنسان». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في الطيور والثدييات أربع حجرات: أذينان وبطينان.","level":"A","rubric":"R1"},{"id":"U11.L03.C3","objective":"U11.L03.O2","type":"explain_open","prompt":"{رتّب|رتّبي} السمكة والضفدع والإنسان بعدد حجرات القلب، و{اكتب|اكتبي} العدد.","answer":"السمكة حجرتان، الضفدع ثلاث، الإنسان أربع.","level":"A","rubric":"R1"},{"id":"U11.L03.C4","objective":"U11.L03.O3","type":"explain_open","prompt":"لماذا يستعين الناس بالكلاب في البحث عن المفقودين؟","answer":"في أنف الكلب ما يصل إلى 300 مليون مستقبل للشم مقابل 6 ملايين عندنا، وجزء دماغه الذي يحلل الروائح أكبر نسبياً.","level":"A","rubric":"R1"},{"id":"U11.L03.C5","objective":"U11.L03.O4","type":"true_false_why","prompt":"«الحيوان الذي يبدو سليماً لا يحمل ميكروبات أبداً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ قد يحمل ميكروبات وهو يبدو سليماً؛ نغسل أيدينا بعد لمسه.","level":"A","rubric":"R1"},{"id":"U11.L03.C6","objective":"U11.L03.O5","type":"fix_model","prompt":"قال عمر: «نجح الدواء في الأرانب، إذن هو آمن للأطفال». {صحّح|صحّحي} له.","answer":"جسم الأرنب قد يختلف عن جسم الإنسان؛ يُجرب الدواء على الإنسان أيضاً، كما اشترط ابن سينا.","level":"B","rubric":"R1"}],"concepts":[{"id":"vertebrates","term":{"ar":"الفقاريات","en":"Vertebrates","zh":"脊椎动物","pinyin":"jǐzhuī dòngwù","match":["الفقاريات"]},"priority":"core","atlas":{"layer":"skeleton","element":"spine"},"card":{"A":"حيوانات لها عمود فقري، كالسمك والضفادع والطيور والثدييات، ومنها الإنسان.","B":"الحشرات ليست منها: هيكلها من الخارج."}},{"id":"mammals","term":{"ar":"الثدييات","en":"Mammals","zh":"哺乳动物","pinyin":"bǔrǔ dòngwù","match":["الثدييات"]},"priority":"core","atlas":{"layer":"body","element":"systems"},"card":{"A":"حيوانات ترضع صغارها، كالإنسان والبقرة والزرافة والكلب.","B":"كلها تتنفس الهواء برئتين، حتى الحوت والدلفين."}},{"id":"gills","term":{"ar":"الخياشيم","en":"Gills","zh":"鳃","pinyin":"sāi","match":["الخياشيم","خياشيم"]},"priority":"core","atlas":{"layer":"respiratory","element":"lungs"},"card":{"A":"أعضاء في جانبي رأس السمكة، تأخذ بها الأكسجين الذائب في الماء.","B":"يمر بها الدم في دورة واحدة قبل أن يذهب إلى الجسم."}},{"id":"ruminant","term":{"ar":"المجترات","en":"Ruminants","zh":"反刍动物","pinyin":"fǎnchú dòngwù","match":["المجترات","تجتر","الاجترار"]},"priority":"supporting","atlas":{"layer":"digestive","element":"stomach"},"card":{"A":"حيوانات تعيد العشب من معدتها إلى فمها لتمضغه مرة ثانية، كالبقرة والغنم والجمل.","B":"في معدتها ميكروبات تهضم من النبات ما لا تهضمه هي وحدها."}},{"id":"comparative_anatomy","term":{"ar":"التشريح المقارن","en":"Comparative anatomy","zh":"比较解剖学","pinyin":"bǐjiào jiěpōuxué","match":["التشريح المقارن"]},"priority":"supporting","atlas":{"layer":"body","element":"systems"},"card":{"A":"أن نقارن أجسام الكائنات جزءاً بجزء لنفهم كيف يعمل كل جسم.","B":"للمقارنة حدود: ما يصح في جسم حيوان قد لا يصح في جسم الإنسان."}}],"experiment":{"title":"جدول المقارنة: إنسان وسمكة وطائر وبقرة","materials":["جدول كبير بأربعة أعمدة","صور مرسومة لأربعة كائنات","مكعبات أو أزرار لتمثيل الحجرات والفقرات","دفتر الأطلس"],"steps":["{اكتب|اكتبي} في الجدول: القلب (عدد الحجرات)، والتنفس (رئتان أم خياشيم)، والهضم (معدة بسيطة أم أجزاء)، والعمود الفقري.","{مثّل|مثّلي} حجرات القلب بالمكعبات: اثنتان للسمكة، وأربع للطائر والبقرة والإنسان.","{مثّل|مثّلي} فقرات العنق: سبع مكعبات صغيرة للإنسان، وسبع طويلة للزرافة.","{ضع|ضعي} علامة عند ما يتشابه، وأخرى عند ما يختلف.","في البيت أو المدرسة: {اكتب|اكتبي} ثلاث قواعد لرعاية حيوان وللصحة معه."],"safety":["لا نشرّح حيواناً، ولا نؤذي حيواناً حياً في التجربة.","إن لمسنا حيواناً في المدرسة نغسل أيدينا بالماء والصابون بعده.","من عنده حساسية من الحيوانات يشارك بالصور."],"expected":"تتشابه الأجهزة في عملها، وتختلف في أشكالها وعدد أجزائها.","explain":"كل جسم يناسب عيشه: الماء للخياشيم، والعشب لمعدة البقرة، والعنق الطويل للزرافة؛ والمقارنة تعلّمنا كيف يعمل جسمنا.","record":"ما يتشابه ___ — ما يختلف ___ — أعجب شيء ___ — قواعد رعاية الحيوان ___","alternatives":["من لا يستطيع العمل بالمكعبات: يملأ الجدول بالرسم.","المستوى ب: يضيف عموداً للضفدع (ثلاث حجرات) ويشرح الفرق."]},"find_the_error":[{"id":"FE1","atlas_variant":"fish_four_chambers","error":"رسم: قلب السمكة أربع حجرات","answer":"قلب السمكة حجرتان","detects":"M155"},{"id":"FE2","atlas_variant":"giraffe_many_vertebrae","error":"رسم: عنق الزرافة بعشرين فقرة","answer":"سبع فقرات طويلة","detects":"M156"},{"id":"FE3","atlas_variant":"pet_no_wash","error":"طفل يأكل بعد اللعب مع الكلب دون غسل يديه","answer":"نغسل أيدينا بالماء والصابون بعد لمس الحيوان","detects":"M157"}],"numbers":[{"text":"حجرتان، ثلاث، أربع: حجرات القلب في السمك والبرمائيات والطيور والثدييات.","source":["S1"]},{"text":"سبع فقرات في عنق الزرافة، وسبع في عنقك{|ِ}.","source":["S2"]}],"true_size":[{"text":"فقرة واحدة في عنق الزرافة قد يقارب طولها ثلاثين سنتيمتراً، ومع ذلك عددها سبع مثل عنقك{|ِ}.","source":["S2"]}],"animal":null,"organ_letter":{"from":"القلب","text":"مرحباً، أنا قلبك{|ِ}، بحجراتي الأربع. هل {تعرف|تعرفين} أن لي أقارب كثيرين؟ قلب العصفور مثلي أربع حجرات، وقلب الضفدع ثلاث، وقلب السمكة حجرتان. كلنا نضخ الدم، كلٌّ بما يناسب جسمه. وحين {تطعم|تطعمين} قطة جائعة، أو {تسقي|تسقين} عصفوراً عطشان، فهناك قلب صغير يعمل مثلي تماماً. {ارحم|ارحمي} الحيوان، و{اغسل|اغسلي} يديك{|ِ} بعد أن {تلعب|تلعبي} معه، ونبقى نحن الاثنين بصحة."},"history":[{"who":"الجاحظ (أبو عثمان عمرو بن بحر)","origin":"البصرة (العراق اليوم)","where_when":"البصرة وبغداد، القرن الثالث الهجري (نحو 776–869م)","did":"كتب «كتاب الحيوان» في سبعة مجلدات، ووصف فيه أكثر من 350 نوعاً من الحيوان وبيئاتها وسلوكها، ودعا إلى النظر الدقيق والمشاهدة.","did_not":"لم يكتشف التطور ولا الانتقاء الطبيعي (ادعاء شائع يراه المؤرخون قراءة خاطئة)، ونقل في كتابه أخباراً وأقوالاً لم يتحقق منها كلها.","method_lesson":"النظر الدقيق بالعين أساس العلم، ومعه نسأل: هل تحققنا مما نُقل إلينا؟","source":["S6","S7"]}],"how_we_know":{"text":"كيف عرف العلماء قديماً أجسام الحيوانات؟ بالنظر الدقيق. في البصرة قبل أكثر من ألف ومئة سنة كتب الجاحظ «كتاب الحيوان» في سبعة مجلدات، ووصف فيه أكثر من ثلاثمئة وخمسين نوعاً من الحيوان، وكيف تعيش، وماذا تأكل؛ وكان يدعو إلى المشاهدة بنفسه. واليوم يقارن العلماء أجسام الحيوانات جزءاً بجزء، ويعرفون أن للمقارنة حدوداً.","limit_question":"لماذا لا يكفي أن نرى الشيء في حيوان لنقول إنه كذلك في الإنسان؟"},"what_changed":["كان بعض الناس يظنون أن طول عنق الزرافة من عظام كثيرة؛ واليوم نعرف أن فيه سبع فقرات مثلنا، لكنها طويلة جداً.","كانت الأدوية تُجرب على الحيوان ويُكتفى بذلك أحياناً؛ واليوم يُجرب الدواء على الإنسان أيضاً، كما اشترط ابن سينا قديماً."],"model_limits":["المقارنة في الدرس مبسطة؛ في كل مجموعة من الحيوانات اختلافات كثيرة.","الأرقام عن أنف الكلب تقريبية، وتختلف بين أنواع الكلاب."],"faith":{"opening":{"text":"وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ وَلَا طَـٰٓئِرٍۢ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَـٰبِ مِن شَىْءٍۢ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ","reference":"الأنعام 38","grade":"قرآن","usage":"قيمة","reflection":"في الآية التي أمامك{|ِ} أن الدواب والطيور أمم مثلنا. واليوم نقارن أجسامنا بأجسام بعض الحيوانات: القلب والتنفس والعظام والهضم. والآية لا تشرح حجرات القلب ولا فقرات العنق، والعلم لا يشرح الآية؛ لكنها تعلّمنا أن ننظر إلى الحيوان باحترام، فله حياته وعالمه. أي حيوان {ستنظر|ستنظرين} إليه هذا الأسبوع بعين جديدة؟","reviewed":false,"quran_key":"6:38","hl_words":[9,11],"highlight":"إلا أمم أمثالكم","level":"ترغيب","concept":"الحيوانات أمم لها حياتها.","avoid":"لا نجعل الآية دليلاً على التشريح المقارن، ولا نجعل العلم تفسيراً لها.","cards":[]},"closing":{"text":"«بينا رجل يمشي فاشتد عليه العطش، فنزل بئراً فشرب منها، ثم خرج فإذا هو بكلب يلهث يأكل الثرى من العطش، فقال: لقد بلغ هذا مثل الذي بلغ بي، فملأ خفه ثم أمسكه بفيه، ثم رقي فسقى الكلب، فشكر الله له فغفر له». قالوا: يا رسول الله، وإن لنا في البهائم أجراً؟ قال: «في كل كبد رطبة أجر»","reference":"البخاري 2363","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن للحيوان قلباً يضخ ورئتين أو خياشيم، وأنه يعطش ويجوع مثلنا. والحديث في البطاقة قصة رجل سقى كلباً عطشان فكان جزاؤه المغفرة، وفيه أن الرحمة بكل كائن حي لها أجر. والحديث لا يشرح أجسام الحيوانات، والعلم لا يشرحه؛ لكنه يعلّمنا الرحمة بكل حي. ما الذي {ستفعله|ستفعلينه} لحيوان هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:2363","highlight":"في كل كبد رطبة أجر","level":"ترغيب","concept":"الرحمة بالحيوان عمل له أجر.","avoid":"لا نشجع الطفل على الاقتراب من حيوان غريب أو خائف؛ الرحمة مع السلامة وبإشراف كبير.","lead":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","narration":true,"source":"البخاري 2363","grader":"","cards":[]}},"life":[{"situation":"في يوم حار رأيت قطة تلهث عند باب المدرسة، ولا ماء قريباً منها.","science":"الحيوان يحتاج الماء مثلنا، والحر يعطشه؛ والقطة الخائفة قد تخدش.","action":"أطلب من كبير أن نضع لها ماء في وعاء قريب، ولا أمسكها، وأغسل يدي إن لمست شيئاً منها.","value":"الرحمة بالحيوان مع السلامة.","why":"لماذا أهتم بقطة ليست لي؟ لأن في الرحمة بكل كائن حي أجراً، كما في الحديث في البطاقة.","hadith":["bukhari:2363"],"cards":[{"key":"bukhari:2363","lead":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"«بينا رجل يمشي فاشتد عليه العطش، فنزل بئراً فشرب منها، ثم خرج فإذا هو بكلب يلهث يأكل الثرى من العطش، فقال: لقد بلغ هذا مثل الذي بلغ بي، فملأ خفه ثم أمسكه بفيه، ثم رقي فسقى الكلب، فشكر الله له فغفر له». قالوا: يا رسول الله، وإن لنا في البهائم أجراً؟ قال: «في كل كبد رطبة أجر»","narration":true,"source":"البخاري 2363","grade":"صحيح","grader":""}],"verses":[]},{"situation":"عندنا في البيت عصفور في قفص، وأحياناً أنسى أن أضع له الماء.","science":"العصفور له قلب بأربع حجرات مثلي، ويعطش ويجوع، ويحتاج مكاناً نظيفاً.","action":"أضع لنفسي تذكيراً كل صباح: ماء وطعام، وأنظف القفص مع كبير، وأغسل يدي بعد ذلك.","value":"الأمانة في رعاية الحيوان.","why":"لماذا يهمني عصفور صغير؟ لأن الطيور أمم مثلنا، كما في الآية في البطاقة، وهو أمانة عندي.","reference":"الأنعام 38","quran":["6:38"],"cards":[],"verses":["6:38"]}],"open_questions":[{"q":"كيف يعرف الكلب صاحبه من رائحته وحدها بين آلاف الروائح؟","why_open":"ما زال العلماء يدرسون كيف يحلل دماغ الكلب خليط الروائح."}],"notebook":{"draw":"{ارسم|ارسمي} ثلاثة قلوب: سمكة (حجرتان)، وضفدع (ثلاث)، وإنسان (أربع)؛ وعنقين بسبع فقرات: إنسان وزرافة. المستوى ب: {اكتب|اكتبي} عن الجاحظ وحدود المقارنة.","label":["الفقاريات","الثدييات","الخياشيم","المجترات","— ب: التشريح المقارن"],"write":"أشرح: ما الذي يتشابه بين جسمي وأجسام الحيوانات؟ وما الذي يختلف؟ وكيف أرحم الحيوان وأحفظ صحتي معه؟"},"imgs":["U11.L03-E1","U11.L03-E2","U11.L03-E3","U11.L03-E4","U11.L03-E5","U11.L03-E6"]};
