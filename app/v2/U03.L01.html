l":{"text":"لقلب الطيور أربع حجرات مثلنا؛ قلب الضفدع ثلاث حجرات؛ قلب السمكة حجرتان فقط لأن دمها يمر بالخياشيم في دورة واحدة. وقلب الفيل يدق نحو 30 مرة في الدقيقة، وقلب الفأر أكثر من 500: الحيوان الأصغر قلبه أسرع.","source":["S8"]},"organ_letter":{"from":"القلب","text":"أنا القلب. أعرف أنكم ترسمونني بشكل ❤ وتقولون إني أحبّ وأخاف. الحقيقة أني عضلة بحجم قبضتك، أنقبض أكثر من مئة ألف مرة في اليوم ولا آخذ إجازة. حين تخاف{|ين}، الدماغ هو الذي يأمرني بالإسراع، وأنا أطيع، ثم أُخبره كيف حالي. أنا لا أقرر… لكني أُخبر. مع التحية، قبضة مخروطية في منتصف صدرك{|ِ}."},"history":[{"who":"ابن النفيس","origin":"دمشق؛ عمل في القاهرة. مسلم","where_when":"القاهرة، نحو 1242","did":"رفض قول جالينوس بوجود ثقوب في الحاجز بين بطيني القلب، وقال إن الدم يمر من الجانب الأيمن إلى الرئة ثم يعود إلى الأيسر (الدورة الرئوية).","did_not":"لم يصف الدورة الكاملة في حلقة مغلقة يدفعها القلب (هارفي 1628)، ولم يرَ الشعيرات (مالبيغي 1661)، وبقي وصفه شبه مجهول حتى 1924؛ وبقي يعتقد كجالينوس أن الدم يُستهلك في الجسم ولا يدور في حلقة.","method_lesson":"الاستنتاج من الدليل التشريحي ضد سلطة النص الموروث.","source":["S10","S6"],"text":"قبل نحو 780 سنة، في القاهرة، قال الطبيب ابن النفيس، مستنداً إلى ما رآه وإلى تفكيره، إن الحاجز بين جانبي القلب صلب لا ثقوب فيه، مع أن الكتب قالت قروناً إن فيه ثقوباً. فقال: إذن لا بد أن يمر الدم من الجانب الأيمن إلى الرئتين ثم يعود إلى الأيسر. لم يعرف ابن النفيس الدورة كلها، ولم يرَ الشعيرات؛ عرف جزءاً صحيحاً وقاله بدليله. وبعده بأربعة قرون أثبت هارفي أن الدم يدور في حلقة كاملة."},{"who":"وليم هارفي","origin":"إنجلترا","where_when":"1628","did":"أثبت بالتجربة والحساب أن الدم يدور في حلقة مغلقة يدفعها القلب.","did_not":"لم يرَ الوصلة بين الشرايين والأوردة (الشعيرات).","method_lesson":"الحساب يكشف ما لا تراه العين.","source":["S7"]}],"how_we_know":{"text":"قبل نحو 780 سنة، في القاهرة، درس الطبيب ابن النفيس (ت. 1288) القلب وقال إن الحاجز بين جانبيه صلب لا ثقوب فيه، وأن الدم لا بد أن يمر من الجانب الأيمن إلى الرئتين ثم يعود إلى الأيسر. صحّح بذلك فكرة سادت أكثر من ألف سنة منذ جالينوس.","limit_question":"ما الذي لا يُظهره رسم القلب في هذا الدرس؟ (اذكر{|ي} شيئاً واحداً)"},"what_changed":["اعتُقد قروناً أن الدم يمر عبر ثقوب في الحاجز بين جانبي القلب؛ لا ثقوب، والدم يمر عبر الرئتين.","اعتُقد أن الكبد هو مركز الدم وأن الدم يُستهلك ويُصنع من جديد باستمرار؛ الدم يدور ويُعاد استخدامه."],"model_limits":["الرسم يُظهر القلب أكبر من حجمه الحقيقي ليُرى بوضوح.","الرسم لا يُظهر أن القلب يتحرك وينقبض بلا توقف.","لا يُظهر الرسم الشرايين التاجية التي تغذي عضلة القلب نفسها.","اللون الأزرق للدم في الرسم ترميز؛ الدم أحمر دائماً.","رسم القلب (E2/E6) تجاويف أربع وحاجز متصل، ومسارا الخروج مبسوطان لتتبع التدفق؛ ليس مقطعاً جراحياً.","القبضة في صورة الصدر مرجع تقريبي للحجم لا قياس.","ضغط الإصبعين على الرسغ في الصورة لا يبيّن مقدار الضغط ولا يُستعمل قياساً طبياً."],"faith":{"opening":{"text":"وَفِىٓ أَنفُسِكُمْ ۚ أَفَلَا تُبْصِرُونَ","reference":"الذاريات 21","grade":"قرآن","usage":"تفكر","reflection":"دعانا الله إلى النظر في أنفسنا. اليوم ننظر نظرة علم: نعدّ نبضنا ونسأل لماذا يتغير.","reviewed":false,"quran_key":"51:21","cards":[]},"closing":{"text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","reference":"البخاري 1975","grade":"صحيح","usage":"قيمة","reflection":"قلبك{|ِ} ينقبض أكثر من مئة ألف مرة في اليوم بلا أن {تأمره|تأمريه}. والنبي ﷺ علّمنا أن للجسد على صاحبه حقاً. ما حق قلبك{|ِ} عليك{|ِ} هذا الأسبوع؟ حركة؟ نوم؟","reviewed":false,"highlight":"فإن لجسدك عليك حقا","full_verified":true,"matn_note":"المتن كاملاً كما في المصدر؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://sunnah.com/bukhari:1975","text_compared_on":"2026-10-27","hadith_key":"bukhari:1975","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","narration":true,"source":"البخاري 1975","grader":"","cards":[]}},"life":[{"situation":"أمزح مع أخي الصغير بأن أخيفه فجأة من خلف الباب.","science":"في جزء من الثانية يأمر دماغه قلبه بالإسراع، فيدق نحو 130 بدل 80، ويحتاج دقائق ليهدأ. الخوف المتكرر يُتعب الجسم ويُفسد النوم.","action":"لا أخيف أحداً «مزاحاً»، صغيراً كان أو كبيراً.","value":"ما يُفزع الناس ليس مزاحاً؛ راحة الآخرين أمانة في يدي.","reference":"أبو داود 5004","why":"لماذا الإفزاع ليس مزاحاً؟ لأن جسم أخي لا يفرّق بين الخطر الحقيقي والمزحة: القلب يسرع والنفَس يضيق واليدان ترتجفان، وقد يسقط أو يبكي أو يخاف من الباب أياماً. أنا أضحك ثانية وهو يحمل الخوف ساعات. النبي ﷺ نهى أن يُروَّع المسلم، لأن راحة الناس أمانة، ومن يراعي ذلك مع أخيه يراعيه مع كل إنسان.","hadith":["abudawud:5004"],"cards":[{"key":"abudawud:5004","lead":"عن عبد الرحمن بن أبي ليلى قال:","text":"حدّثنا أصحاب محمد ﷺ أنهم كانوا يسيرون مع النبي ﷺ، فنام رجل منهم، فانطلق بعضهم إلى حبل معه فأخذه، ففزع، فقال رسول الله ﷺ: «لا يحلّ لمسلم أن يروّع مسلماً»","narration":true,"source":"أبو داود 5004","grade":"صحيح","grader":"صحّحه الألباني"}],"verses":[]},{"situation":"صعدت الدرج مسرعاً فدق قلبي بقوة.","science":"عضلاتي طلبت أكسجيناً أكثر فأسرع قلبي ليوصله؛ هذا طبيعي ويعود بعد الراحة.","action":"لا أخاف من نبضي بعد الجري، وأتوقف وأجلس إن أحسست بدوار وأخبر بالغاً.","value":"أعرف جسمي فلا أقلق بلا سبب ولا أهمل علامة حقيقية.","why":"لماذا أتعلّم الفرق؟ لأن الخوف من كل نبضة يمنعني من اللعب، وإهمال كل علامة قد يخفي مرضاً. المعرفة تعطيني الاثنين معاً: أطمئن حين يكون السبب طبيعياً (ركضت)، وأنتبه حين لا يكون (دوار، ألم، نبض سريع بلا سبب). اعرف جسمك تعرف متى تقلق ومتى لا.","cards":[],"verses":[]}],"open_questions":[{"q":"سمكة الزرد تُصلح قلبها بعد الإصابة؛ لماذا لا يستطيع قلب الإنسان ذلك؟","why_open":"خلايا قلب السمكة تنقسم وتبني من جديد؛ خلايا قلبنا تكاد لا تنقسم بعد الولادة. لماذا الفرق؟ وهل يمكن إيقاظ هذه القدرة فينا؟ هذا بحث جارٍ."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة جذع إنسان وضع{|ي} القلب في موضعه الصحيح وبحجمه التقريبي (قبضة). المستوى ب: {أضف|أضيفي} مقطعاً للقلب بأربع حجرات وسهمين: يمين → رئتان، يسار → جسم.","label":["القلب","الصدر / عظم القص","وعاء دموي","النبض (الرسغ)","— مستوى ب: أذين، بطين، صمام"],"write":"جدول نبضي الثلاثي (إن لم أقِس: أفسّر أرقام أحمد 80 ثم 130 ثم 90)، وجملتان تفسّران لماذا تغيّر النبض ثم عاد."},"imgs":["U03.L01-E1","U03.L01-E2","U03.L01-E3","U03.L01-E4","U03.L01-E5","U03.L01-E6","U03.L01-E7","U03.L01-E8","U03.L01-exp","U03.L01-hist1","U03.L01-hist2","U03.L01-letter","U03.L01-life","U03.L01-title-boy","U03.L01-title-girl"]};
