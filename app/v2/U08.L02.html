ينين معاً؟","feedback_by_option":{"0":"تبقى في كل عين طول العمر.","2":"لا خلايا فيها تحسّ الضوء ولا الألوان.","3":"هي في الشبكية حيث يخرج العصب البصري."},"detects":"M83"},{"id":"U08.L02.P5","objective":"U08.L02.O5","type":"choose","prompt":"في غرفة شبه مظلمة {ترى|ترين} أشكال الأشياء، لكن ألوانها باهتة. لماذا؟","options":["الخلايا التي ترى الألوان تحتاج ضوءاً أكثر","الأشياء تفقد ألوانها في الظلام","البؤبؤ يضيق في الظلام","العدسة تتوقف عن العمل"],"answer":0,"explanation":"المخاريط ترى الألوان وتحتاج ضوءاً كافياً، والعصي تعمل في الضوء الخافت ولا ترى الألوان.","level":"B","feedback_wrong":"أيّ الخليتين تعمل في الضوء الخافت؟","feedback_by_option":{"1":"ألوان الأشياء باقية؛ الذي تغيّر خلايانا التي تعمل.","2":"البؤبؤ يتسع في الظلام لا يضيق.","3":"العدسة تعمل؛ لكن خلايا الألوان لا تجد ضوءاً كافياً."}}],"check":[{"id":"U08.L02.C1","objective":"U08.L02.O1","type":"true_false_why","prompt":"«الرمش يحمي العين لأنه يوزّع الدموع عليها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدموع تغسل الغبار والجراثيم وتمنع العين من الجفاف، والرمش يوزّعها.","level":"A","rubric":"R1"},{"id":"U08.L02.C2","objective":"U08.L02.O2","type":"explain_open","prompt":"اشرح{|ي} طريق الضوء من الكرة إلى دماغك{|ِ} حين {ترى|ترين} كرة حمراء.","answer":"الضوء يرتد عن الكرة فيدخل العين من القرنية والبؤبؤ، فتجمعه العدسة على الشبكية، فتحوّله خلاياها إلى رسائل كهربائية تسري في العصب البصري إلى الدماغ، فيصنع الدماغ صورة الكرة.","level":"A","rubric":"R1"},{"id":"U08.L02.C3","objective":"U08.L02.O3","type":"true_false_why","prompt":"«إذا لم تؤلمني عيني وأنا أنظر إلى الشمس فهي لم تتأذَّ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الشبكية قد تتأذى من الشمس بلا ألم وقت النظر، وتظهر العلامات بعد ساعات، وقد يدوم الأذى.","level":"A","rubric":"R1"},{"id":"U08.L02.C4","objective":"U08.L02.O4","type":"fix_model","prompt":"قال زميل{ك|تكِ}: «العين وحدها ترى، والدماغ للتفكير فقط». {صحّح|صحّحي} قوله.","answer":"العين تجمع الضوء وتحوّله إلى رسائل في العصب البصري، والدماغ يصنع منها الصورة، ويكمل البقعة العمياء؛ فالرؤية عمل العين والدماغ معاً.","level":"A","rubric":"R1"},{"id":"U08.L02.C5","objective":"U08.L02.O2","type":"true_false_why","prompt":"«في الغرفة المظلمة تماماً نرى قليلاً لأن العين تضيء». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ العين لا تضيء ولا ترسل أشعة، وفي الظلام التام لا يدخلها ضوء فلا نرى شيئاً.","level":"A","rubric":"R1"},{"id":"U08.L02.C6","objective":"U08.L02.O5","type":"explain_open","prompt":"لماذا تزداد العدسة سُمكاً حين {تقرأ|تقرئين} كتاباً قريباً؟","answer":"لتجمع ضوء الشيء القريب على الشبكية فتقع صورته واضحة؛ وحين ننظر بعيداً ترقّ.","level":"B","rubric":"R1"},{"id":"U08.L02.C7","objective":"U08.L02.O6","type":"explain_open","prompt":"كيف تساعدنا الغرفة المظلمة على أن نختار بين فكرتين: «العين ترسل أشعة» و«الضوء يدخل العين»؟","answer":"في الغرفة المظلمة تماماً لا نرى شيئاً ولو فتحنا أعيننا؛ فلو كانت العين ترسل أشعة لرأينا. وحين يدخل ضوء من ثقب نرى، وتظهر صور الأشياء الخارجية على الجدار: الضوء يأتي من الأشياء.","level":"B","rubric":"R2"}],"concepts":[{"id":"iris","term":{"ar":"القزحية","en":"Iris","zh":"虹膜","pinyin":"hóngmó","match":["القزحية","قزحية","قزحيتك","قزحيته"]},"priority":"core","atlas":{"layer":"eye","element":"iris"},"card":{"A":"الحلقة الملونة في العين: بنية أو سوداء أو خضراء أو زرقاء. فيها عضلات صغيرة توسّع الفتحة التي في وسطها أو تضيّقها.","B":"لون القزحية يختلف بين الناس، وعضلاتها تعمل بمنعكس: تضيّق الفتحة في الضوء القوي وتوسّعها في الخافت."}},{"id":"pupil","term":{"ar":"البؤبؤ","en":"Pupil","zh":"瞳孔","pinyin":"tóngkǒng","match":["البؤبؤ","بؤبؤ","بؤبؤك","بؤبؤه","البؤبؤين"]},"priority":"core","atlas":{"layer":"eye","element":"pupil"},"card":{"A":"الدائرة السوداء في وسط القزحية؛ ليست نقطة مرسومة بل فتحة يدخل منها الضوء، وتبدو سوداء لأن داخل العين مظلم.","B":"يضيق البؤبؤ في الضوء القوي ويتسع في الظلام خلال ثوانٍ، بلا قرار منا."}},{"id":"lens","term":{"ar":"العدسة","en":"Lens","zh":"晶状体","pinyin":"jīngzhuàngtǐ","match":["العدسة","عدسة","عدسة العين"]},"priority":"core","atlas":{"layer":"eye","element":"lens"},"card":{"A":"جزء شفاف خلف البؤبؤ يجمع الضوء على الشبكية في مؤخرة العين، كعدسة لمّاح حين يجمع ضوء الشمس.","B":"تتغير العدسة شكلاً: تزداد سُمكاً لنرى القريب، وترقّ لنرى البعيد."}},{"id":"retina","term":{"ar":"الشبكية","en":"Retina","zh":"视网膜","pinyin":"shìwǎngmó","match":["الشبكية","شبكية","شبكيتك","شبكية العين"]},"priority":"core","atlas":{"layer":"eye","element":"retina"},"card":{"A":"طبقة رقيقة في مؤخرة العين من الداخل، فيها ملايين الخلايا التي تحسّ الضوء وتحوّله إلى رسائل كهربائية.","B":"فيها نوعان من الخلايا: العصي للضوء الخافت والأشكال، والمخاريط للألوان؛ والصورة التي تقع عليها مقلوبة."}},{"id":"optic_nerve","term":{"ar":"العصب البصري","en":"Optic nerve","zh":"视神经","pinyin":"shìshénjīng","match":["العصب البصري","عصب البصر","العصبين البصريين"]},"priority":"core","atlas":{"layer":"eye","element":"optic_nerve"},"card":{"A":"العصب الذي يخرج من مؤخرة كل عين ويحمل رسائل الشبكية إلى الدماغ؛ والدماغ يصنع منها ما نراه.","B":"في موضع خروجه من الشبكية لا توجد خلايا تحسّ الضوء؛ وهذا هو البقعة العمياء في كل عين."}}],"experiment":{"title":"البؤبؤ والبقعة العمياء","materials":["مرآة","غرفة مضاءة جيداً","بطاقة بيضاء أو ورقة","قلم أسود","مسطرة"],"steps":["{قف|قفي} أمام المرآة في غرفة مضاءة، و{انظر|انظري} إلى عينك{|ِ} في المرآة لا إلى المصباح. كم حجم بؤبؤك{|ِ}؟","{غطّ|غطّي} عينيك{|ِ} بكفيك{|ِ} بلا ضغط وأنت{|ِ} {تعدّ|تعدّين} إلى ثلاثين، ثم {ارفع|ارفعي} كفيك{|ِ} و{انظر|انظري} فوراً إلى بؤبؤك{|ِ} في المرآة. ماذا يحدث له في الثواني الأولى؟","{ارسم|ارسمي} على البطاقة علامة + على اليسار، ونقطة سوداء كبيرة على يمينها، بينهما نحو 8 سنتيمترات.","{أغمض|أغمضي} عينك{|ِ} اليسرى، و{انظر|انظري} بعينك{|ِ} اليمنى إلى علامة + وحدها، والبطاقة على بعد ذراع. {قرّب|قرّبي} البطاقة ببطء نحو وجهك{|ِ} ونظرك{|ِ} ثابت على العلامة. متى تختفي النقطة؟ {قس|قيسي} المسافة بين البطاقة وعينك{|ِ}.","{افتح|افتحي} عينيك{|ِ} الاثنتين: هل عادت النقطة؟ لماذا لا {تلاحظ|تلاحظين} هذه البقعة في يومك{|ِ}؟"],"safety":["لا ننظر إلى الشمس أو إلى مصباح قوي مباشرة ولو لحظة، ولا من خلال نظارة شمسية أو عدسة مكبرة.","نغطي العينين بالكفين بلا ضغط عليهما.","المرآة الزجاجية توضع على سطح ثابت أو يمسكها أحد الكبار.","من يلبس نظارة يجرّب بها أو بدونها كما يرتاح."],"expected":"يبدو البؤبؤ كبيراً لحظة رفع الكفين، ثم يصغر خلال ثوانٍ. وتختفي النقطة السوداء عند مسافة معينة، ثم تعود إن قرّبت البطاقة أكثر أو أبعدتها؛ وتعود كاملة حين تفتح العينين.","explain":"البؤبؤ فتحة تضبطها القزحية: في الظلام تحت الكفين اتسع ليُدخل ضوءاً أكثر، وفي الضوء ضاق ليحمي الشبكية؛ وهذا منعكس كالذي تعلمناه في درس الأعصاب. والنقطة اختفت لأن صورتها وقعت على الموضع الذي يخرج منه العصب البصري من الشبكية، ولا خلايا فيه تحسّ الضوء؛ وبالعينين معاً تغطي كل عين ما لا تراه الأخرى، والدماغ يكمل الصورة فلا نلاحظ شيئاً.","record":"البؤبؤ بعد رفع الكفين: ___ ثم ___ — مسافة اختفاء النقطة: ___ سم","alternatives":["بلا مرآة: {انظر|انظري} إلى بؤبؤ أحد أهلك{|ِ} قبل أن يغطي عينيه بكفيه وبعد أن يرفعهما.","بلا بطاقة: {استعمل|استعملي} بطاقة البقعة العمياء في التطبيق على الشاشة."]},"find_the_error":[{"id":"FE1","atlas_variant":"eye_rays_out","error":"أسهم تخرج من العين إلى الشجرة، ومكتوب: العين ترسل نظرها","answer":"الضوء يأتي من الشجرة (أو يرتد عنها) ويدخل العين؛ والسهم في الاتجاه المعاكس","detects":"M82"},{"id":"FE2","atlas_variant":"image_in_eye","error":"رسم داخل العين مكتوب تحته: هنا نرى الصورة، ولا دور للدماغ","answer":"الشبكية تحوّل الضوء إلى رسائل، والدماغ يصنع الصورة التي نراها","detects":"M83"},{"id":"FE3","atlas_variant":"pupil_dark_small","error":"رسم عين في الظلام وبؤبؤها صغير جداً","answer":"في الظلام يتسع البؤبؤ ليُدخل ضوءاً أكثر"}],"numbers":[{"text":"في كل عين{|ِ} نحو 120 مليون خلية ترى في الضوء الخافت، ونحو 7 ملايين ترى الألوان.","source":["S2"]},{"text":"حين {تخرج|تخرجين} من غرفة مظلمة إلى الشمس يضيق بؤبؤك{|ِ} في ثوانٍ، بلا أن {تأمره|تأمريه}.","source":["S2"]}],"true_size":[],"animal":{"text":"لماذا تلمع عينا القطة في الظلام؟ خلف شبكيتها طبقة تشبه المرآة، يرتد عنها الضوء الذي عبر الشبكية فيمرّ فيها مرة ثانية، فتستفيد منه خلاياها أكثر وترى في ضوء يبدو لنا ظلاماً. والضوء الذي يخرج من عينيها هو هذا الضوء المرتد. أما نحن فليس في أعيننا هذه الطبقة.","source":["S10"]},"organ_letter":{"from":"شبكية عينك{|ِ}","text":"مرحباً، أنا الشبكية، أسكن في مؤخرة عينك{|ِ} في الظلام. لا أرى الشمس ولا القمر ولا وجه أمك{|ِ}؛ يصلني الضوء فقط، فتحوّله خلاياي، وهي أكثر من مئة مليون، إلى رسائل أرسلها في العصب البصري إلى دماغك{|ِ}، وهو الذي يصنع منها الصور. أنا رقيقة جداً، وأتأذى من الشمس دون أن أصرخ بألم؛ فلا {تنظر|تنظري} إليها أبداً. وحين {تقرأ|تقرئين} طويلاً على الشاشة {ارفع|ارفعي} عينيك{|ِ} كل قليل إلى شيء بعيد، و{العب|العبي} خارج البيت كل يوم؛ هكذا {تريحني|تريحينني}. وفي داخلي بقعة صغيرة لا أرى فيها شيئاً، لكن لا {تقلق|تقلقي}: الدماغ يكملها."},"history":[{"who":"ابن الهيثم (الحسن بن الحسن)","origin":"البصرة","where_when":"القاهرة، كتاب المناظر بعد نحو 1020 (965 – نحو 1040)","did":"قال إننا نرى لأن الضوء يدخل العين من الأشياء، ورأى أن أشعة تخرج من العين فكرة لا حاجة إليها؛ واستعمل الغرفة المظلمة ليبيّن أن الضوء يسير في خطوط مستقيمة، ووصف تجاربه بأدواتها ونتائجها، ودعا قارئه أن يعيدها.","did_not":"لم يعرف أن الصورة تقع على الشبكية؛ وفي النظرية التي بُنيت على كتابه كانت العدسة هي التي تحسّ الضوء، حتى بيّن كبلر موضع الصورة.","method_lesson":"التجربة تختار بين فكرتين، ولا نقبل قولاً حتى نعيد تجربته.","source":["S4","S5"]},{"who":"يوهانس كبلر","origin":"ألمانيا","where_when":"براغ، كتابه في البصريات سنة 1604","did":"قال إن العين تعمل كالغرفة المظلمة: يدخل الضوء من البؤبؤ، وتجمعه العدسة على الشبكية، فتتكون عليها صورة حقيقية مقلوبة.","did_not":"لم يشرح كيف يصنع الدماغ من الشبكية ما نراه معتدلاً؛ وهذا سؤال درسه العلماء بعده.","method_lesson":"البناء على من سبق وتصحيحه: بدأ من الغرفة المظلمة التي درسها من قبله.","source":["S5"]}],"how_we_know":{"text":"كيف عرفنا أن العين لا ترسل أشعة؟ قبل نحو ألف سنة، في القاهرة، كان العالم ابن الهيثم، المولود في البصرة، يجرّب ويقيس. لاحظ أن الضوء القوي يؤلم العين، وأننا لا نرى في الظلام التام ولو فتحنا أعيننا؛ فلو كانت العين ترسل أشعة لرأينا في الظلام. واستعمل غرفة مظلمة في جدارها ثقب صغير، فرأى صور الأشياء التي في الخارج على الجدار المقابل، وبيّن أن الضوء يسير في خطوط مستقيمة. ثم كتب «كتاب المناظر» ودعا كل قارئ أن يعيد تجاربه ولا يقبل كلامه بلا اختبار. وبعده بنحو ستمئة سنة قال الفلكي الألماني كبلر إن العين نفسها كالغرفة المظلمة: العدسة تجمع الضوء على الشبكية، فتقع عليها صورة مقلوبة.","limit_question":"ما الذي لا يُظهره رسم العين بخطوط قليلة من الضوء؟"},"what_changed":["ظنّ كثير من القدماء أن العين ترسل أشعة إلى الأشياء فتراها؛ ورجّح ابن الهيثم بتجاربه أن الضوء يدخل العين من الأشياء.","ظُنّ بعد ابن الهيثم أن العدسة هي التي تحسّ الضوء؛ ثم بيّن كبلر سنة 1604 أن الصورة تقع على الشبكية.","يتردد أن القراءة في الضوء الخافت والنظارة تُتلفان العين؛ والأطباء اليوم يقولون إنهما لا تتلفانها."],"model_limits":["رسم العين مقطع مسطح؛ العين كرة، والرسم يكبّرها كثيراً.","الأشعة في الرسم خطوط قليلة؛ الضوء يدخل العين من كل نقطة في المشهد معاً.","الرسم يُظهر صورة صغيرة على الشبكية؛ في الحقيقة لا توجد «صورة» يراها أحد داخل العين، بل خلايا تحس الضوء وترسل رسائل إلى الدماغ.","الرسم لا يُظهر الدموع والأوعية الدموية في العين."],"faith":{"opening":null,"closing":{"text":"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۚ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَـٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًۭا","reference":"الإسراء 36","grade":"قرآن","usage":"قيمة","reflection":"تعلّمت{|ِ} اليوم أن ما {تراه|ترينه} يصنعه الدماغ من ضوء يدخل العين، وأن الدماغ يكمل أحياناً ما لم تره العين، كالبقعة العمياء. فالعالِم الصغير لا يقول «رأيت» إلا ما رآه حقاً، ولا يجزم بما لم يتثبت منه. والآية التي أمامك{|ِ} تنهى أن نتبع ما ليس لنا به علم، وتخبر أن الإنسان مسؤول عن سمعه وبصره وقلبه. فنحن نُسأل عمّا ننظر إليه وعمّا نقول إننا رأيناه. والآية لا تصف العين ولا البقعة العمياء؛ هي تعلّمنا الأمانة في استعمال ما أُعطينا. بماذا {تستعمل|تستعملين} عينيك{|ِ} في الخير هذا الأسبوع؟","reviewed":false,"quran_key":"17:36","hl_words":[7,15],"highlight":"إن السمع والبصر والفؤاد كل أولئك كان عنه مسئولا","level":"نهي","concept":"لا نتبع ما لا نعلم، ونُسأل عن سمعنا وبصرنا وقلوبنا.","avoid":"لا نقول إن الآية تصف العين أو الرؤية تشريحياً، ولا نجعل البقعة العمياء أو عمل الدماغ دليلاً على الآية.","cards":[]}},"life":[{"situation":"ألعب على الجهاز اللوحي ساعات، فتتعب عيناي وتجفان، ولا أخرج للعب.","science":"النظر القريب الطويل يُتعب العين، ويقلّ معه الرمش فتجف؛ ولا دليل على أنه يتلفها، لكن الأطفال الذين أُضيف لهم لعب خارج الصف كل يوم قلّت عندهم الإصابة بقصر النظر في دراسة على مدارس في الصين.","action":"أتبع قاعدة 20-20-20: كل 20 دقيقة أنظر 20 ثانية إلى شيء بعيد نحو ستة أمتار وأرمش؛ وألعب خارج البيت كل يوم.","value":"للعين على صاحبها حق: الراحة والحماية.","why":"لماذا أنظر إلى البعيد؟ لأن العدسة تشتد لترى القريب وترتاح حين ترى البعيد، والرمش يعيد الدموع إلى العين. والنبي ﷺ أخبر عبد الله بن عمرو حين أكثر من السهر أن لعينه عليه حقاً، كما في البطاقة؛ ومن حقها أن نريحها.","reference":"البخاري 1975","hadith":["bukhari:1975"],"cards":[{"key":"bukhari:1975","lead":"عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:","text":"قال لي رسول الله ﷺ: «يا عبد الله، ألم أخبر أنك تصوم النهار وتقوم الليل؟» فقلت: بلى يا رسول الله. قال: «فلا تفعل، صم وأفطر، وقم ونم، فإن لجسدك عليك حقا، وإن لعينك عليك حقا، وإن لزوجك عليك حقا، وإن لزورك عليك حقا، وإن بحسبك أن تصوم كل شهر ثلاثة أيام، فإن لك بكل حسنة عشر أمثالها، فإن ذلك صيام الدهر كله». فشددت، فشدد علي، قلت: يا رسول الله، إني أجد قوة. قال: «فصم صيام نبي الله داود عليه السلام ولا تزد عليه». قلت: وما كان صيام نبي الله داود عليه السلام؟ قال: «نصف الدهر». فكان عبد الله يقول بعد ما كبر: يا ليتني قبلت رخصة النبي ﷺ.","narration":true,"source":"البخاري 1975","grade":"صحيح","grader":""}],"verses":[]},{"situation":"زميلي الجديد يلبس نظارة سميكة، وبعض الأولاد ينادونه بلقب يضحكون منه.","science":"النظارة عدسات تساعد العين على جمع الضوء على الشبكية فيرى صاحبها بوضوح؛ وهي لا تُضعف العين، وكثير من الناس يحتاجونها في عمر ما.","action":"أناديه باسمه، وأقول للأولاد إن النظارة تساعده كما يساعد الحذاء القدم، ولا أضحك من اللقب، وأجلس معه.","value":"لا سخرية ولا ألقاب جارحة.","why":"لماذا تساعده النظارة ولا تضره؟ لأنها تغيّر طريق الضوء قبل أن يدخل عينه، فتقع الصورة واضحة على الشبكية. والله نهى عن السخرية من الناس وعن مناداتهم بالألقاب التي يكرهونها، كما في الآية في البطاقة؛ فلعله خير ممن يسخر منه.","reference":"الحجرات 11","quran":["49:11"],"cards":[],"verses":["49:11"]}],"open_questions":[{"q":"لماذا يزداد قصر النظر عند الأطفال في بلاد كثيرة؟ ولماذا يقلّ عند من يلعبون خارج البيت أكثر؟","why_open":"رأت دراسات أن اللعب خارج البيت يقلله، لكن العلماء لم يحسموا السبب: أهو الضوء القوي في الخارج، أم النظر إلى البعيد، أم غيرهما؟ ويطلبون دراسات أطول."}],"notebook":{"draw":"ارسم{|ي} عينك{|ِ} من الأمام كما {تراها|ترينها} في المرآة: القزحية بلونها، والبؤبؤ في وسطها، والرموش والجفن. ثم ارسم{|ي} مقطع العين من الجانب كالدائرة: القرنية في المقدمة، والبؤبؤ، والعدسة خلفه، والشبكية في المؤخرة، والعصب البصري خارجاً إلى الدماغ؛ وارسم{|ي} سهم الضوء من شجرة إلى الشبكية. المستوى ب: ارسم{|ي} الشجرة على الشبكية مقلوبة.","label":["القزحية","البؤبؤ","القرنية","العدسة","الشبكية","العصب البصري","البقعة العمياء","— ب: الصورة المقلوبة"],"write":"أشرح: لماذا لا نرى في الظلام التام؟ وماذا يفعل البؤبؤ في الضوء القوي؟ وأكتب المسافة التي اختفت عندها النقطة في تجربتي."},"imgs":["U08.L02-E1","U08.L02-E2","U08.L02-E3","U08.L02-E4","U08.L02-E5","U08.L02-E6","U08.L02-exp","U08.L02-hist1","U08.L02-hist2","U08.L02-letter","U08.L02-life","U08.L02-title-boy","U08.L02-title-girl"]};
