<script>
const LD = {"id":"U05.T02","lesson":"U05.L02","first":false,"title":"اختبار: الطاقة: لماذا تحتاج الخلية الأكسجين؟","lessonTitle":"الطاقة: لماذا تحتاج الخلية الأكسجين؟","concepts":[],"check":[],"items":[{"id":"U05.L02.A1.a","objective":"U05.L02.O1","level":"A","type":"choose","prompt":"أين الطاقة التي تستعملها خلاياك{|ِ}؟","options":["في الهواء","في الماء","في الغذاء (السكر)","في الدم نفسه"],"answer":2,"explanation":"الطاقة التي تستعملها الخلايا في الغذاء، في السكر.","feedback_by_option":{"0":"الطاقة ليست في الهواء؛ الأكسجين يُطلق الطاقة من السكر، كما تحتاج الشمعة الهواء لتُطلق ما في الشمع.","1":"الماء ضروري للجسم، لكنه لا يعطي طاقة.","3":"الدم يحمل السكر الذي فيه الطاقة، لكنه ليس مصدرها؛ مصدرها الغذاء."},"detects":"M48","alt":{"prompt":"طفل لم يأكل منذ الصباح، فشعر بالتعب في الظهيرة مع أنه يتنفس جيداً. ما التفسير الأقرب؟","options":["خلاياه تنقصها طاقة الغذاء","الهواء فيه طاقة قليلة اليوم","رئتاه متعبتان","الأكسجين هو الطاقة وقد نفد"],"answer":0,"explanation":"الطاقة في الغذاء لا في الهواء؛ الأكسجين يُطلقها من السكر. فإذا نقص الغذاء نقصت الطاقة ولو كان التنفس جيداً.","feedback_by_option":{"1":"الهواء لا يحمل طاقة؛ الطاقة في الغذاء.","2":"رئتاه تعملان جيداً؛ الذي ينقص شيء آخر.","3":"الأكسجين ليس الطاقة؛ هو يُطلق طاقة الغذاء."},"detects":"M48"}},{"id":"U05.L02.A1.b","objective":"U05.L02.O1","level":"A","type":"sequence","prompt":"رتّب{|ي} المعادلة: ما يدخل ثم ما يخرج.","options":["سكر وأكسجين","طاقة","ثاني أكسيد الكربون وماء"],"answer":[0,1,2],"explanation":"يدخل السكر والأكسجين، فتُطلق الطاقة، ويخرج ثاني أكسيد الكربون والماء.","alt":{"prompt":"رتّب{|ي} ما يحدث لقطعة خبز {أكلتها|أكلتِها} حتى تتحرك عضلتك{|ِ}.","options":["تُهضم فتصير سكراً","يدخل السكر الدم","يصل الدم إلى خلية العضلة ومعه الأكسجين","تُطلق الخلية الطاقة فتنقبض العضلة"],"answer":[0,1,2,3],"explanation":"يُهضم الخبز فيصير سكراً يدخل الدم، فيحمله الدم مع الأكسجين إلى خلية العضلة، فتُطلق الخلية الطاقة وتنقبض العضلة."}},{"id":"U05.L02.A1.c","objective":"U05.L02.O1","level":"A","type":"explain_open","prompt":"اشرح{|ي} لطفل أصغر لماذا نتنفس، {مستعملاً|مستعملةً} كلمتي «سكر» و«أكسجين».","answer":"الخلية تأخذ السكر من الطعام والأكسجين من النفس لتطلق الطاقة؛ بلا أكسجين لا تُطلق الطاقة، ويخرج ثاني أكسيد الكربون مع الزفير.","rubric":"R1"},{"id":"U05.L02.A2.a","objective":"U05.L02.O2","level":"A","type":"sequence","prompt":"رتّب{|ي} طريق ثاني أكسيد الكربون من الخلية إلى الخارج.","options":["الخلية","الدم في الشعيرة","يمين القلب","الرئتان","الزفير"],"answer":[0,1,2,3,4],"explanation":"يخرج ثاني أكسيد الكربون من الخلية إلى الدم في الشعيرة، فيعود إلى يمين القلب، الذي يدفعه إلى الرئتين، فيخرج مع الزفير.","alt":{"prompt":"رتّب{|ي} طريق الأكسجين من الهواء إلى خلية في قدمك{|ِ}.","options":["الأنف","الرئتان","الدم في شعيرات الرئتين","القلب","شعيرة في القدم","الخلية"],"answer":[0,1,2,3,4,5],"explanation":"يدخل الأكسجين من الأنف إلى الرئتين، فيعبر إلى الدم في شعيراتها، فيدفعه القلب إلى شعيرة في القدم، ومنها إلى الخلية."}},{"id":"U05.L02.A2.b","objective":"U05.L02.O2","level":"A","type":"choose_reason","prompt":"من يوصل السكر والأكسجين إلى خلية في قدمك{|ِ}؟","options":["الرئة مباشرة","المعدة مباشرة","الأعصاب","الدم الذي يدفعه القلب"],"answer":3,"explanation":"الدم يحمل السكر والأكسجين، والقلب يدفعه إلى كل خلية في الجسم.","feedback_by_option":{"0":"الرئة لا تصل إلى قدمك{|ِ}؛ الأكسجين يدخل الدم في الرئتين، والقلب يدفع الدم إلى القدم.","1":"المعدة بعيدة عن القدم؛ وما يُهضم يدخل الدم أولاً.","2":"الأعصاب تحمل الإشارات، لا السكر والأكسجين."},"detects":"M03","alt":{"prompt":"خلية في دماغك{|ِ} تحتاج أكسجيناً. كيف يصلها؟","options":["يدخل من الأنف إلى الدماغ مباشرة","ترسله الرئة إليها بأنبوب مباشر","يحمله الدم من الرئتين، والقلب يدفعه إليها","تصنعه الخلية بنفسها"],"answer":2,"explanation":"الأكسجين يعبر في الرئتين إلى الدم، والقلب يدفع الدم إلى كل خلية، في الدماغ وغيره.","feedback_by_option":{"0":"الأنف طريق الهواء إلى الرئتين، لا إلى الدماغ.","1":"لا أنبوب من الرئة إلى الدماغ؛ الدم يحمل الأكسجين.","3":"الخلية تستعمل الأكسجين ولا تصنعه."},"detects":"M03"}},{"id":"U05.L02.A2.c","objective":"U05.L02.O2","level":"A","type":"true_false_why","prompt":"«الرئة والقلب والمعدة تعمل لخدمة الخلايا». صح أم خطأ؟","answer":"صح؛ الرئة تعطي الأكسجين، والهضم يعطي السكر، والقلب يدفع الدم الذي يوصلهما إلى كل خلية ويعيد الفضلات.","rubric":"R1","alt":{"prompt":"«لو توقف القلب لما وصل السكر ولا الأكسجين إلى الخلايا، ولو كان الطعام والهواء موجودين». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدم هو الذي يوصلهما إلى كل خلية، والقلب هو الذي يدفعه؛ فالأجهزة تعمل معاً لخدمة الخلايا."}},{"id":"U05.L02.A3.a","objective":"U05.L02.O3","level":"A","type":"choose_reason","prompt":"لماذا يدفأ جسمك{|ِ} حين تركض{|ين}؟","options":["لأن خلايا العضلات تطلق طاقة أكثر وجزء منها حرارة","لأن الهواء يحتك بالجلد بسرعة حين نركض فيسخنه كثيراً","لأن القلب ساخن ويرسل حرارته مع الدم","لأن الشمس تدفئك وأنت تركض في الخارج"],"answer":0,"explanation":"خلايا العضلات في الركض تُطلق طاقة أكثر، وجزء من هذه الطاقة يخرج حرارة.","feedback_by_option":{"1":"احتكاك الهواء لا يصنع هذا الدفء؛ الحرارة من داخلك{|ِ}.","2":"القلب ليس فرناً يرسل حرارته؛ كل خلية عاملة تُطلق حرارة.","3":"{تدفأ|تدفئين} حين تركض{|ين} في الظل أيضاً؛ الحرارة من داخلك{|ِ}."},"alt":{"prompt":"في يوم بارد لعبت{|ِ} الكرة نصف ساعة فشعرت{|ِ} بالدفء. من أين جاء الدفء؟","options":["من خلايا عضلاتك{|ِ} وهي تُطلق طاقة أكثر","من الهواء البارد","من ملابسك{|ِ} الصوفية وحدها، فهي تصنع الحرارة","من الكرة"],"answer":0,"explanation":"خلايا العضلات العاملة تُطلق طاقة أكثر، وجزء منها يخرج حرارة؛ والملابس تحفظها فقط.","feedback_by_option":{"1":"الهواء بارد؛ فلا يمكن أن يكون مصدر الدفء.","2":"الملابس تحفظ الحرارة ولا تصنعها.","3":"الكرة لا تعطي حرارة؛ الحرارة من داخلك{|ِ}."}}},{"id":"U05.L02.A3.b","objective":"U05.L02.O3","level":"A","type":"explain_open","prompt":"اربط{|ي} في جملة واحدة: العضلة، الأكسجين، التنفس، القلب، الحرارة.","answer":"العضلة العاملة تحتاج أكسجيناً أكثر فيزيد التنفس ويسرع القلب لينقله، وجزء من الطاقة يخرج حرارة.","rubric":"R1"},{"id":"U05.L02.A3.c","objective":"U05.L02.O3","level":"A","type":"true_false_why","prompt":"«حين أبدأ الركض يزيد تنفسي ونبضي معاً تقريباً، لأن عضلاتي تطلب أكسجيناً أكثر لتُطلق طاقة الغذاء». صح أم خطأ؟","answer":"صح؛ الخلية والتنفس والقلب يعملون معاً في اللحظة نفسها بأمر الدماغ، لا بالدور.","rubric":"R1","detects":"M22","alt":{"prompt":"«عند الركض تطلب الخلية الأكسجين أولاً، ثم بعد دقائق يسرع القلب، ثم بعد دقائق أخرى يسرع التنفس». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ يحدث ذلك كله معاً تقريباً: الخلية تطلب، والدماغ يأمر القلب والتنفس بالإسراع في الوقت نفسه.","detects":"M22"}},{"id":"U05.L02.A4.a","objective":"U05.L02.O4","level":"A","type":"true_false_why","prompt":"«في خلاياك نار صغيرة تحرق الطعام». صح أم خطأ؟","answer":"خطأ؛ تشبيه له حدود: لا لهب ولا دخان؛ إطلاق هادئ على خطوات صغيرة.","rubric":"R1","detects":"M49","alt":{"prompt":"«حين تُطلق الخلية الطاقة من السكر لا يخرج منها لهب ولا دخان». صح أم خطأ؟ ولماذا؟","answer":"صح؛ «الاحتراق» في الخلية تشبيه: الطاقة تخرج على خطوات صغيرة هادئة، وجزء منها حرارة لطيفة.","detects":"M49"}},{"id":"U05.L02.A4.b","objective":"U05.L02.O4","level":"A","type":"choose","prompt":"الشمعة تحت الكأس انطفأت لأن:","options":["الشمع نفد","قلّ الأكسجين حولها","الكأس بردتها","الضوء انعكس"],"answer":1,"explanation":"الشمع باقٍ، لكن الأكسجين تحت الكأس قلّ عن حاجة اللهب، وبلا أكسجين كافٍ لا يُطلق الشمع طاقته.","feedback_by_option":{"0":"الشمع باقٍ لم ينفد؛ فما الذي نقص؟","2":"الكأس لا تبرّد اللهب حتى ينطفئ؛ اللهب يحتاج شيئاً من الهواء.","3":"الضوء لا يطفئ اللهب؛ اللهب يحتاج شيئاً من الهواء."},"alt":{"prompt":"ما الذي يشترك فيه لهب الشمعة وخلاياك{|ِ}؟","options":["في الخلية لهب صغير كلهب الشمعة","كلاهما يحتاج وقوداً وأكسجيناً ويُخرج حرارة","الخلية تُخرج دخاناً ورماداً كالشمعة، لكننا لا نراه","لا شيء مشترك بينهما"],"answer":1,"explanation":"اللهب والخلية كلاهما يحتاج وقوداً وأكسجيناً، ويُخرج حرارة وثاني أكسيد الكربون وماء؛ لكن الخلية بلا لهب ولا دخان.","feedback_by_option":{"0":"لا لهب في الخلية؛ هذا من حدود التشبيه.","2":"الخلية لا تُخرج دخاناً.","3":"بينهما شبه: الوقود والأكسجين والحرارة."}}},{"id":"U05.L02.A4.c","objective":"U05.L02.O4","level":"A","type":"explain_open","prompt":"لماذا نقول إن إطلاق الطاقة في الخلية «كنزول الدرج درجة درجة» لا «كالقفز من السطح»؟","answer":"لأن الطاقة تخرج على خطوات صغيرة متحكم فيها فلا تؤذي الخلية؛ الاحتراق بالنار يخرجها دفعة واحدة.","rubric":"R1"},{"id":"U05.L02.A5.a","objective":"U05.L02.O5","level":"B","type":"choose","prompt":"أين يحدث معظم إطلاق الطاقة في الخلية؟","options":["في النواة","في الغشاء","في الميتوكوندريا","خارج الخلية"],"answer":2,"explanation":"معظم إطلاق الطاقة في الخلية يحدث في الميتوكوندريا.","feedback_by_option":{"0":"النواة تحفظ التعليمات.","1":"الغشاء يتحكم فيما يدخل ويخرج.","3":"الطاقة تُطلق داخل كل خلية، حيث تحتاجها."},"alt":{"prompt":"خلية فيها ميتوكوندريا كثيرة جداً. تتوقع{|ين} أنها:","options":["تخزّن الأكسجين لوقت الحاجة حين يقلّ","لا تحتاج طاقة","تصنع السكر","تعمل كثيراً وتحتاج طاقة كبيرة"],"answer":3,"explanation":"الميتوكوندريا تُطلق معظم طاقة الخلية؛ فالخلية التي فيها كثير منها تعمل كثيراً، كخلية عضلة القلب.","feedback_by_option":{"0":"الميتوكوندريا تستعمل الأكسجين ولا تخزّنه.","1":"كثرة الميتوكوندريا علامة على حاجة كبيرة إلى الطاقة، لا العكس.","2":"الميتوكوندريا لا تصنع السكر؛ تُطلق طاقته."}}},{"id":"U05.L02.A5.b","objective":"U05.L02.O5","level":"B","type":"explain_open","prompt":"لماذا تخزّن الخلية الطاقة في «عملات» صغيرة بدل أن تستعملها فوراً كلها؟","answer":"لتنفقها حين تحتاج وبالقدر الذي تحتاج: انقباض، بناء، إشارة؛ كالعملة الصغيرة لا الورقة الكبيرة.","rubric":"R1"},{"id":"U05.L02.A5.c","objective":"U05.L02.O5","level":"B","type":"true_false_why","prompt":"«الميتوكوندريا تصنع السكر». صح أم خطأ؟","answer":"خطأ؛ تُطلق طاقة السكر الذي يأتي من الطعام؛ لا تصنعه.","rubric":"R1","alt":{"prompt":"«الطاقة التي تُطلقها الميتوكوندريا تُخزَّن في جزيئات صغيرة، تنفقها الخلية في الانقباض والبناء وإرسال الإشارات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تُخزَّن في جزيء صغير (ATP) كالعملات الصغيرة، تنفقها الخلية حين تحتاج وبالقدر الذي تحتاج."}},{"id":"U05.L02.A6.a","objective":"U05.L02.O6","level":"B","type":"choose_reason","prompt":"طفل نائم. أي هذه يتوقف تماماً عن طلب الطاقة؟","options":["القلب؛ لأنه يستريح في النوم","الدماغ؛ لأن الأفكار تتوقف","عضلات التنفس؛ لأن الهواء يدخل وحده","لا شيء منها يتوقف تماماً"],"answer":3,"explanation":"القلب والدماغ وعضلات التنفس تعمل في النوم أيضاً، فالحاجة إلى الطاقة دائمة ما دام الجسم حياً — والحركة تزيدها فقط.","feedback_by_option":{"0":"القلب لا يستريح أبداً؛ يبطؤ في النوم ولا يتوقف.","1":"الدماغ يعمل في النوم: يضبط التنفس والقلب، ويحلم أحياناً.","2":"الهواء لا يدخل وحده؛ عضلات التنفس تعمل في النوم أيضاً."},"alt":{"prompt":"لماذا يحتاج المريض الذي يبقى في السرير أياماً إلى الطعام؟","options":["لا يحتاج طعاماً ما دام لا يتحرك ولا يتعب","لأن قلبه وتنفسه ودماغه تحتاج طاقة دائماً","ليقوّي رجليه، أما قلبه ودماغه فلا يحتاجان طاقة وهو مستلقٍ","لأن الطعام يصنع الأكسجين"],"answer":1,"explanation":"الجسم يعمل بلا توقف حتى وهو ساكن: القلب والتنفس والدماغ والبناء والدفء؛ فحاجته إلى الطاقة دائمة.","feedback_by_option":{"0":"الحركة تزيد الحاجة، لكن الحاجة موجودة دائماً ولو بلا حركة.","2":"الطاقة تحتاجها كل الخلايا، لا عضلات الرجلين فقط.","3":"الأكسجين من الهواء لا من الطعام."}}},{"id":"U05.L02.A6.b","objective":"U05.L02.O6","level":"B","type":"explain_open","prompt":"لماذا لا يستطيع الإنسان أن يترك الطعام أو النفس حتى وهو ساكن تماماً؟","answer":"لأن الحاجة إلى الطاقة دائمة: القلب والتنفس والدماغ والترميم والدفء تعمل بلا توقف.","rubric":"R1"},{"id":"U05.L02.A6.c","objective":"U05.L02.O6","level":"B","type":"true_false_why","prompt":"«الحركة هي التي تبدأ حاجة الجسم إلى الطاقة». صح أم خطأ؟","answer":"خطأ؛ الحركة تزيد الحاجة لكن الحاجة دائمة ما دام الجسم حياً.","rubric":"R1","alt":{"prompt":"«القلب والدماغ يحتاجان طاقة وأنت{|ِ} نائم{|ة}». صح أم خطأ؟ ولماذا؟","answer":"صح؛ القلب يدق والدماغ يضبط التنفس وأعمالاً أخرى في النوم أيضاً، فالحاجة إلى الطاقة دائمة."}}],"transfer":[{"id":"U05.L02.T1","objective":"U05.L02.O1","type":"explain_open","prompt":"السيارة تحتاج وقوداً وهواءً ويخرج من عادمها ثاني أكسيد الكربون وماء وحرارة. ما الذي يشبه خليتك{|ِ} هنا وما الذي يختلف؟","answer":"شبه: وقود + أكسجين → طاقة + ثاني أكسيد الكربون + ماء + حرارة. اختلاف: الخلية بلا لهب وعلى خطوات صغيرة، ووقودها سكر من الطعام.","level":"A","rubric":"R1"},{"id":"U05.L02.T2","objective":"U05.L02.O6","type":"explain_open","prompt":"الدب يبطئ في الشتاء نبضه وتنفسه وينام شهوراً بلا أكل. فسّر{|ي} كيف ينجح بما {تعلمته|تعلمتِه}.","answer":"يقلّل حاجة خلاياه إلى الطاقة فيكفيه مخزون الدهون؛ لكن الحاجة لا تصل إلى الصفر فالقلب والتنفس يستمران ببطء.","level":"B","rubric":"R1"}],"recall":[{"id":"U05.L02.D1","objective":"U05.L02.O1","type":"choose","prompt":"الأكسجين في الخلية:","options":["هو الطاقة نفسها","يُطلق الطاقة من السكر","يصنع السكر"],"answer":1,"explanation":"الأكسجين ليس طاقة؛ هو الذي يُطلق الطاقة من السكر.","level":"A","feedback_by_option":{"0":"الطاقة في الغذاء لا في الهواء؛ الأكسجين يُطلقها.","2":"السكر يأتي من الطعام؛ والأكسجين يُطلق طاقته."}},{"id":"U05.L02.D2","objective":"U05.L02.O3","type":"choose","prompt":"أدفأ حين أركض لأن:","options":["الهواء ساخن حولي فيدخل جسمي مع اللهاث ويدفئه كله","القلب يسخن من التعب فيرسل حرارته","خلايا العضلات تطلق طاقة أكثر وجزء منها حرارة"],"answer":2,"explanation":"خلايا العضلات في الركض تُطلق طاقة أكثر، وجزء منها يخرج حرارة.","level":"A","feedback_by_option":{"0":"حتى في يوم بارد يدفأ جسمك{|ِ} حين تركض{|ين}؛ الحرارة من داخلك{|ِ}.","1":"القلب لا يرسل حرارته؛ كل خلايا العضلات العاملة تُطلق حرارة."}},{"id":"U05.L02.D3","objective":"U05.L02.O5","type":"choose","prompt":"معظم إطلاق الطاقة يحدث في:","options":["الميتوكوندريا","النواة في وسط الخلية","الرئة حين نتنفس"],"answer":0,"explanation":"معظم إطلاق الطاقة يحدث في الميتوكوندريا داخل الخلية.","level":"B","feedback_by_option":{"1":"النواة تحفظ التعليمات.","2":"الرئة تأخذ الأكسجين من الهواء؛ وإطلاق الطاقة يحدث داخل كل خلية."}},{"id":"U05.L02.D4","objective":"U05.L02.O2","level":"A","type":"choose","prompt":"خلية في إصبع قدمك{|ِ} تحتاج سكراً وأكسجيناً. من أين يأتيانها؟","options":["السكر من الرئة والأكسجين من المعدة","يأتيان معاً من الهواء الذي نتنفسه","تصنعهما الخلية بنفسها من الماء","السكر من الطعام والأكسجين من الرئة"],"answer":3,"explanation":"الطعام يعطي السكر، والرئة تعطي الأكسجين، والدم الذي يدفعه القلب يوصلهما إلى كل خلية.","feedback_by_option":{"0":"العكس: السكر من الطعام، والأكسجين من الرئة.","1":"في الهواء أكسجين لا سكر.","2":"الخلية تستعملهما ولا تصنعهما."}},{"id":"U05.L02.D5","objective":"U05.L02.O4","level":"A","type":"choose","prompt":"نقول إن الخلية «تحرق» الغذاء. ما الفرق بينها وبين النار؟","options":["لا فرق أبداً","في الخلية نار صغيرة حقيقية","في الخلية لا لهب ولا دخان","النار لا تحتاج أكسجيناً والخلية تحتاجه"],"answer":2,"explanation":"«الاحتراق البطيء» تشبيه: كلاهما يحتاج وقوداً وأكسجيناً ويُخرج حرارة، لكن في الخلية لا لهب ولا دخان، والطاقة تخرج على خطوات صغيرة.","feedback_by_option":{"0":"هناك فرق: لا لهب ولا دخان في الخلية.","1":"لا نار في الخلية؛ «الاحتراق» تشبيه له حدود.","3":"النار تحتاج الأكسجين أيضاً؛ الشمعة تحت الكأس انطفأت حين قلّ."},"detects":"M49"},{"id":"U05.L02.D6","objective":"U05.L02.O6","level":"B","type":"choose","prompt":"متى يحتاج جسمك{|ِ} طاقة؟","options":["حين يتحرك؛ أما وهو ساكن فلا يحتاجها","دائماً، والحركة تزيد الحاجة","في النهار؛ أما في النوم فيتوقف عن صرفها","بعد الأكل مباشرة، ثم لا يحتاجها حتى الوجبة التالية"],"answer":1,"explanation":"الجسم يعمل بلا توقف حتى في النوم: القلب والتنفس والدماغ والبناء؛ فحاجته إلى الطاقة دائمة، والحركة تزيدها.","feedback_by_option":{"0":"حتى وأنت{|ِ} ساكن{|ة} يعمل قلبك{|ِ} وتنفسك{|ِ} ودماغك{|ِ}.","2":"في الليل يعمل القلب والتنفس والدماغ أيضاً.","3":"الأكل يعطي الطاقة؛ أما الحاجة إليها فدائمة."}}]};
