const LD = {"id":"U10.T04","lesson":"U10.L04","first":false,"title":"اختبار: من البداية إلى الشيخوخة","lessonTitle":"من البداية إلى الشيخوخة","concepts":[],"check":[],"items":[{"id":"U10.L04.A1.a","objective":"U10.L04.O1","level":"A","type":"choose_reason","prompt":"كيف يحصل الجنين على غذائه؟","options":["من الطعام في معدة أمه مباشرة","من دم أمه عبر الحبل السري","يأكل بفمه","من الهواء"],"answer":1,"explanation":"الغذاء يصل من دم الأم عبر الحبل السري.","feedback_by_option":{"0":"الجنين ليس في المعدة؛ الأم تهضم، ثم يصل الغذاء بالدم.","2":"لا يأكل بفمه في الرحم.","3":"لا يتنفس الهواء قبل الولادة."},"detects":"M147","alt":{"prompt":"الرحم:","options":["عضو في بطن الأم ينمو فيه الجنين","جزء من المعدة","عظم في الحوض","وعاء دموي"],"answer":0,"explanation":"ينمو فيه الجنين حتى يولد.","feedback_by_option":{"1":"ليس من المعدة.","2":"ليس عظماً.","3":"ليس وعاء دموياً."}}},{"id":"U10.L04.A1.b","objective":"U10.L04.O1","level":"A","type":"true_false_why","prompt":"«يبدأ الإنسان خلية واحدة اجتمعت فيها خلية من الأم وخلية من الأب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ثم تنقسم الخلية مرات كثيرة، ولهذا نشبه أمهاتنا وآباءنا.","rubric":"R1","alt":{"prompt":"«يولد الطفل عادة بعد نحو أربعين أسبوعاً في الرحم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو أربعين أسبوعاً، أي نحو تسعة أشهر."}},{"id":"U10.L04.A1.c","objective":"U10.L04.O1","level":"A","type":"explain_open","prompt":"سألك{|ِ} أخوك{|ِ} الصغير: «من أين جاءت السرّة؟». {أجبه|أجيبيه} بما {تعلمت|تعلمتِ}.","answer":"في الرحم كان الحبل السري يصلك بأمك، يأتيك منه الغذاء والأكسجين؛ وبعد الولادة قُطع، وبقيت السرّة أثره.","rubric":"R1"},{"id":"U10.L04.A2.a","objective":"U10.L04.O2","level":"A","type":"choose","prompt":"في أي مرحلة يتوقف الطول عادة؟","options":["الرضاعة","الطفولة","الرشد","بداية البلوغ"],"answer":2,"explanation":"في الرشد، بعد نهاية البلوغ.","feedback_by_option":{"0":"الرضيع يطول بسرعة.","1":"الطفل يطول كل سنة.","3":"في البلوغ طفرة طول."},"alt":{"prompt":"آخر مراحل العمر:","options":["الشيخوخة","الطفولة","البلوغ","الرضاعة"],"answer":0,"explanation":"الشيخوخة.","feedback_by_option":{"1":"الطفولة في أوله.","2":"البلوغ في وسطه.","3":"الرضاعة أوله."}}},{"id":"U10.L04.A2.b","objective":"U10.L04.O2","level":"A","type":"true_false_why","prompt":"«حدود مراحل العمر واحدة عند كل الناس بالضبط». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الحدود تقريبية، والناس يختلفون فيها.","rubric":"R1","alt":{"prompt":"«الطفولة مرحلة طول وتعلم كثير». صح أم خطأ؟ ولماذا؟","answer":"صح؛ يطول الطفل كل سنة ويتعلم كثيراً."}},{"id":"U10.L04.A2.c","objective":"U10.L04.O2","level":"A","type":"explain_open","prompt":"{اختر|اختاري} مرحلتين من مراحل العمر، و{قارن|قارني} بينهما في الطول والحركة.","answer":"مثال: الطفولة طول سريع وحركة كثيرة؛ الشيخوخة لا طول بل ينقص قليلاً، والحركة أبطأ لكنها تنفع.","rubric":"R1"},{"id":"U10.L04.A3.a","objective":"U10.L04.O3","level":"A","type":"choose_reason","prompt":"لماذا يقرّب بعض الكبار الكتاب أو يبعدونه ويلبسون نظارة القراءة؟","options":["لأن الكتاب صغير الحجم","لأنهم لا يحبون القراءة","لأن الضوء قوي","لأن العين يصعب عليها النظر القريب مع العمر"],"answer":3,"explanation":"مع العمر يصعب على العين التركيز على القريب.","feedback_by_option":{"0":"الحجم ليس السبب.","1":"كثير منهم يحبون القراءة.","2":"الضوء الجيد يعين ولا يضر."},"alt":{"prompt":"في الكبر قد يضعف سماع:","options":["الأصوات الحادة","كل الأصوات فجأة","الأصوات العالية جداً","صوت المطر"],"answer":0,"explanation":"الأصوات الحادة خاصة.","feedback_by_option":{"1":"ليس فجأة ولا كلها.","2":"الأصوات الحادة هي الأكثر.","3":"ليس هذا تحديداً."}}},{"id":"U10.L04.A3.b","objective":"U10.L04.O3","level":"A","type":"true_false_why","prompt":"«الكبار لا يستفيدون من الرياضة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الرياضة من أفضل ما يبطئ ضعف العظم والعضلة والمفاصل.","rubric":"R1","detects":"M149","alt":{"prompt":"«ينقص طول الإنسان قليلاً في الكبر». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لأن أقراص العمود الفقري ترق مع العمر."}},{"id":"U10.L04.A3.c","objective":"U10.L04.O3","level":"A","type":"explain_open","prompt":"جدك{|ِ} يمشي ببطء، ولا يحمل الأغراض الثقيلة، ويلبس نظارة للقراءة. {فسّر|فسّري} ذلك بثلاثة أجزاء من الجسم.","answer":"المفاصل أيبس والعضلات أضعف فيمشي ببطء؛ العضلات والعظام أضعف فلا يحمل الثقيل؛ العين يصعب عليها القريب فيلبس النظارة.","rubric":"R1"},{"id":"U10.L04.A4.a","objective":"U10.L04.O4","level":"A","type":"choose_reason","prompt":"جارك{|ِ} الكبير لا يسمعك{|ِ} جيداً. ماذا {تفعل|تفعلين}؟","options":["أتوقف عن الكلام معه","أكلمه بوضوح ووجهي إليه","أصرخ من بعيد","أضحك"],"answer":1,"explanation":"الوضوح والوجه المقابل يعينان من ضعف سمعه.","feedback_by_option":{"0":"الكلام معه برّ.","2":"الصراخ من بعيد لا يعين.","3":"لا نسخر."},"detects":"M150","alt":{"prompt":"من البر بالكبار:","options":["أحمل عنهم الثقيل","أسخر من بطئهم","أحكم عليهم بأعمارهم","أتركهم وحدهم دائماً"],"answer":0,"explanation":"حمل الثقيل عنهم.","feedback_by_option":{"1":"لا نسخر.","2":"الحكم بالعمر يضر.","3":"نزورهم ونكون معهم."}}},{"id":"U10.L04.A4.b","objective":"U10.L04.O4","level":"A","type":"true_false_why","prompt":"«الظن بأن الكبار ضعفاء أو عبء يضر بصحتهم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تقول منظمة الصحة العالمية إن التمييز بسبب العمر يضر بصحتهم.","rubric":"R1","alt":{"prompt":"«كثير من الكبار يتعلمون أشياء جديدة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الكبار يتعلمون ويتحركون، ويعرفون ما لا نعرف."}},{"id":"U10.L04.A4.c","objective":"U10.L04.O4","level":"A","type":"explain_open","prompt":"{خطّط|خطّطي} لزيارة كبير تعرفه: ماذا {تفعل|تفعلين} معه؟ ولماذا ينفعه كل شيء؟","answer":"أسلم وأكلمه بوضوح ووجهي إليه؛ أمشي معه قليلاً لأن الحركة تنفعه؛ أسمع قصصه؛ أحمل عنه ما يحتاج.","rubric":"R1"},{"id":"U10.L04.A5.a","objective":"U10.L04.O5","level":"B","type":"choose","prompt":"في تجربة دي كاسبر وفايفر، كيف «أجاب» المولود؟","options":["بالكلام","بالإشارة","بطريقة مص اللهاية","بالكتابة"],"answer":2,"explanation":"طريقة المص اختارت الصوت الذي يسمعه.","feedback_by_option":{"0":"المولود لا يتكلم.","1":"لا يشير.","3":"لا يكتب."},"alt":{"prompt":"الحبل السري متصل في الرحم بعضو اسمه:","options":["المشيمة","المعدة","الكلية","الرئة"],"answer":0,"explanation":"المشيمة.","feedback_by_option":{"1":"ليس المعدة.","2":"ليس الكلية.","3":"ليس الرئة."}}},{"id":"U10.L04.A5.b","objective":"U10.L04.O5","level":"B","type":"true_false_why","prompt":"«المولود لا يعرف صوت أمه حين يولد». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ في تجربة دي كاسبر وفايفر اختار المواليد صوت أمهاتهم أكثر.","rubric":"R1","detects":"M148","alt":{"prompt":"«المولود في التجربة كان حديث الولادة، فتعلّمُه صوت أمه كان على الأرجح قبل الولادة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لم يمض عليه وقت يكفي ليتعلمه بعد الولادة."}},{"id":"U10.L04.A5.c","objective":"U10.L04.O5","level":"B","type":"explain_open","prompt":"لماذا استعمل الباحثون صوت امرأة أخرى في التجربة، لا صوت الأم وحده؟","answer":"ليقارنوا: لو سمع صوت الأم وحده ما عرفنا هل يختاره أم يمص فقط؛ صوت امرأة أخرى يجعل المقارنة عادلة.","rubric":"R1"}],"transfer":[{"id":"U10.L04.T1","objective":"U10.L04.O3","type":"explain_open","prompt":"جدتك{|ِ} ستسكن معكم. {صمّم|صمّمي} غرفتها لتناسب ما يتغير في الكبر: الضوء، والممرات، وأماكن الأشياء.","answer":"ضوء جيد للعين؛ ممر بلا عوائق ومقابض للمفاصل والتوازن؛ الأشياء المهمة قريبة لا عالية ولا ثقيلة؛ ماء دافئ لا ساخن لأن الإحساس بالحرارة يقل.","level":"A","rubric":"R1"},{"id":"U10.L04.T2","objective":"U10.L04.O1","type":"explain_open","prompt":"ستولد لكم أخت قريباً. {اكتب|اكتبي} لها رسالة {تصف|تصفين} فيها كيف كانت تنمو قبل أن تولد.","answer":"بدأت خلية واحدة، ثم كبرت في الرحم، يأتيك الغذاء والأكسجين عبر الحبل السري، وكنت تسمعين صوت أمي؛ ثم وُلدت بعد نحو تسعة أشهر.","level":"A","rubric":"R1"}],"recall":[{"id":"U10.L04.D1","objective":"U10.L04.O1","type":"choose","prompt":"ينمو الجنين في:","options":["الرحم","المعدة","الرئة"],"answer":0,"explanation":"الرحم.","level":"A","feedback_by_option":{"1":"المعدة للطعام.","2":"الرئة للهواء."}},{"id":"U10.L04.D2","objective":"U10.L04.O2","type":"choose","prompt":"المرحلة بعد الطفولة:","options":["البلوغ","الرضاعة","الشيخوخة"],"answer":0,"explanation":"البلوغ.","level":"A","feedback_by_option":{"1":"قبلها.","2":"آخر العمر."}},{"id":"U10.L04.D3","objective":"U10.L04.O3","type":"choose","prompt":"يبطئ ضعف العظم في الكبر:","options":["الحركة","الجلوس","السهر"],"answer":0,"explanation":"الحركة.","level":"A","feedback_by_option":{"1":"يضعفه.","2":"لا يعين."}},{"id":"U10.L04.D4","objective":"U10.L04.O4","type":"choose","prompt":"نكلم من ضعف سمعه:","options":["بوضوح ووجهنا إليه","بالصراخ","من الخلف"],"answer":0,"explanation":"بوضوح ووجهنا إليه.","level":"A","feedback_by_option":{"1":"لا.","2":"يحتاج أن يرى وجهنا."}},{"id":"U10.L04.D5","objective":"U10.L04.O5","type":"choose","prompt":"المولود في التجربة اختار:","options":["صوت أمه","صوت امرأة أخرى","الصمت"],"answer":0,"explanation":"صوت أمه.","level":"B","feedback_by_option":{"1":"اختار صوت أمه أكثر.","2":"لا."}}]};
