const LD = {"id":"U10.L01","first":true,"title":"كيف أكبر؟","driving_question":"{اسم}، كان طولك{|ِ} يوم {وُلدت|وُلدتِ} نحو نصف متر. من أين جاء الباقي؟ ولماذا {تكون|تكونين} أطول قليلاً في الصباح منك{|ِ} في المساء؟","central_fact":"الجسم يكبر لأن خلاياه تنقسم، والعظام الطويلة تطول من صفيحة النمو قرب طرفيها حتى تتصلب في آخر البلوغ؛ والنمو يحتاج نوماً يُفرز فيه أكثر هرمون النمو، وغذاءً وحركة. وأكثر الاختلاف في الطول وراثي، فالطفل يُقارن بنفسه لا بغيره.","next":"U10.L02","nexts":[{"id":"U10.L02","gated":true},{"id":"U10.L03","gated":false},{"id":"U10.L04","gated":false}],"hook":{"text":"{اسم}، متى {تطول|تطولين} أكثر في رأيك{|ِ}؟","options":["في النهار وأنا أتحرك وآكل","في الليل وأنا نائم","لا أطول أبداً الآن","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["cells"],"highlight":["cell_division"],"zoom":"cells"},"text":"يوم {وُلدت|وُلدتِ} كان طولك{|ِ} نحو نصف متر، والآن صار أكثر بكثير. من أين جاء الباقي؟ {تذكّر|تذكّري} أن جسمك{|ِ} مبني من خلايا. وحين {تكبر|تكبرين} لا تنتفخ الخلايا القديمة كالبالون، بل تزداد عدداً. كيف؟ الخلية تنسخ ما فيها، ومنه تعليماتها، ثم تنقسم خليتين متماثلتين، وكل واحدة منهما تستطيع أن تنقسم من جديد. هذا انقسام الخلية. وبالانقسام نفسه يسدّ الجلد خدشك{|ِ} ويجدّد بشرتك{|ِ}، كما {عرفت|عرفتِ} في درس الجلد."},{"id":"E2","level":"A","atlas":{"layers":["skeleton"],"highlight":["growth_plate","femur"],"zoom":"leg"},"text":"فكيف {تطول|تطولين}؟ في درس العظام {عرفت|عرفتِ} أن العظم ينمو من نهاياته. والآن التفصيل: قرب طرفي كل عظم طويل، كعظم الفخذ وعظام الساق والساعد، طبقة من الغضروف الطري اسمها صفيحة النمو. فيها تنقسم الخلايا، ثم يصير الجديد عظماً، فيطول العظم من عند طرفيه لا من وسطه. وتبقى الصفيحة تعمل حتى آخر البلوغ، ثم تتصلب وتصير عظماً، فيتوقف ازدياد الطول؛ ولهذا لا يطول الكبار. والصفيحة أضعف من العظم الصلب، فإن {سقطت|سقطتِ} وآلمك{|ِ} مكان قرب مفصل فأخبر{|ي} الكبار ليعرضوك{|ِ} على الطبيب."},{"id":"E3","level":"A","atlas":{"layers":["nervous","skeleton"],"highlight":["pituitary","growth_plate"],"zoom":"body"},"text":"من يأمر الخلايا أن تنقسم وتنمو؟ في قاع دماغك{|ِ} جزء صغير يرسل في الدم رسالة كيميائية اسمها هرمون النمو، فتصل إلى العظم والعضلة وتأمرها أن تنمو. وأكثر هذه الرسالة يُرسل وأنت{|ِ} {نائم|نائمة}؛ فالنوم الكافي جزء من نموك{|ِ}، كما {عرفت|عرفتِ} أن النوم يعمل ولا يضيع. والخلايا الجديدة تحتاج مواد تُبنى منها: طعاماً متنوعاً فيه البروتين والحليب والخضار، والحركة تقوّي العظم والعضلة. لكن انتبه{|ي}: الطعام الزائد والفيتامينات الزائدة لا تجعلك{|ِ} أطول، بل قد تزيد وزنك{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["cells"],"highlight":["dna","nucleus"],"zoom":"cells"},"text":"لماذا يختلف الناس في الطول؟ في نواة كل خلية من خلاياك{|ِ} تعليمات مكتوبة تقول للجسم كيف يُبنى، اسمها الحمض النووي. نصفها جاءك{|ِ} من أمك{|ِ} ونصفها من أبيك{|ِ}؛ لهذا {تشبه|تشبهين} أهلك{|ِ}. وهذا الانتقال اسمه الوراثة. وأكثر الاختلاف في الطول بين الناس وراثي، والباقي من الغذاء والصحة. والأطفال يختلفون في سرعة النمو وفي موعده: بعضهم يطول مبكراً وبعضهم متأخراً، والبنات في الغالب قبل الأولاد بسنتين. لذلك لا يقارن الطبيب طفلاً بزملائه، بل بنفسه: هل يطول عاماً بعد عام؟ والطول لا يجعل أحداً أقوى ولا أفضل."},{"id":"E5","level":"A","atlas":{"layers":["skeleton"],"highlight":["spine","discs"],"zoom":"spine"},"text":"وسرّ صغير: {أنت|أنتِ} أطول قليلاً في الصباح منك{|ِ} في المساء! بين فقرات عمودك{|ِ} الفقري أقراص طرية كالوسائد. في النهار، وأنت{|ِ} {واقف|واقفة} و{تمشي|تمشين} و{تحمل|تحملين} حقيبتك{|ِ}، تنضغط قليلاً فيقصر طولك{|ِ}؛ وفي الليل وأنت{|ِ} {مستلقٍ|مستلقية} تمتلئ من جديد. وجد العلماء أن طول الأطفال يقل من الصباح إلى بعد الظهر نحو نصف سنتيمتر في المتوسط، وأكثره في الساعات الأولى بعد الاستيقاظ. هذا ليس نمواً ولا نقصاً؛ ولهذا نقيس الطول دائماً في الوقت نفسه من اليوم."},{"id":"E6","level":"B","atlas":{"layers":["cells"],"highlight":["chromosome"],"zoom":"cells"},"text":"للمستوى ب: الحمض النووي خيط طويل جداً ملفوف في حزم اسمها الكروموسومات: في كل خلية من خلايا جسمك{|ِ} 46 كروموسوماً في 23 زوجاً، من كل زوج واحد من أمك{|ِ} وواحد من أبيك{|ِ}. فهل الطول وراثة فقط؟ تابعت منظمة الصحة العالمية بين 1997 و2003 أكثر من ثمانية آلاف طفل صغير من ست دول، منها عُمان والهند وغانا والبرازيل، في بيوت فيها غذاء جيد ورعاية، فوجدتهم ينمون نمواً متشابهاً. فالوراثة تفسر أكثر الاختلاف بين الأفراد، والغذاء والصحة يفسران كثيراً من الاختلاف بين البلاد."}],"practice":[{"id":"U10.L01.P1","after":"E1","objective":"U10.L01.O1","type":"choose","prompt":"كيف يزداد عدد الخلايا في جسمك{|ِ} وأنت{|ِ} {تكبر|تكبرين}؟","options":["تنتفخ الخلية حتى تصير بحجم كبير","الخلية تنسخ ما فيها ثم تنقسم خليتين","تأتي خلايا جديدة من الطعام كما هي","تتجمع الخلايا الصغيرة فتصير خلية واحدة"],"answer":1,"explanation":"الخلية تنسخ ما فيها ثم تنقسم خليتين متماثلتين، وكل منهما تستطيع الانقسام من جديد.","level":"A","feedback_wrong":"هل يزداد حجم الخلية أم عددها؟","feedback_by_option":{"0":"الخلايا لا تنتفخ بلا حد؛ عددها هو الذي يزداد.","2":"الطعام مواد تُبنى منها الخلايا، لا خلايا جاهزة.","3":"هذا عكس ما يحدث: الواحدة تصير اثنتين."}},{"id":"U10.L01.P2","after":"E2","objective":"U10.L01.O2","type":"choose_reason","prompt":"من أين يطول عظم الفخذ؟","options":["من وسطه","من سطحه الخارجي كله","من صفيحتي النمو قرب طرفيه","من العضلة الملتصقة به"],"answer":2,"explanation":"قرب طرفي العظم الطويل صفيحتا نمو من الغضروف، منهما يُضاف عظم جديد.","level":"A","feedback_wrong":"أين الغضروف الطري في العظم الطويل؟","feedback_by_option":{"0":"الوسط صلب؛ الطول يُضاف عند الطرفين.","1":"السطح يزداد سُمكاً قليلاً، والطول من الطرفين.","3":"العضلة تحرّك العظم ولا تطيله."},"detects":"M110"},{"id":"U10.L01.P3","after":"E3","objective":"U10.L01.O3","type":"choose","prompt":"متى يُرسل جسمك{|ِ} أكثر هرمون النمو؟","options":["وأنت{|ِ} {تجري|تجرين} في الملعب","بعد الأكل مباشرة","وأنت{|ِ} {نائم|نائمة}","وأنت{|ِ} {جالس|جالسة} في الصف"],"answer":2,"explanation":"أكثر هرمون النمو يُفرز في النوم، ولذلك فالنوم الكافي جزء من النمو.","level":"A","feedback_wrong":"{تذكّر|تذكّري}: النوم يعمل ولا يضيع.","feedback_by_option":{"0":"الحركة تقوّي العظم والعضلة، لكن أكثر الهرمون يأتي في النوم.","1":"الطعام مواد للبناء، وليس هو وقت أكثر الهرمون.","3":"في الصف يُفرز قليل، والأكثر في النوم."},"detects":"M108"},{"id":"U10.L01.P4","after":"E4","objective":"U10.L01.O4","type":"choose_reason","prompt":"سلمى أقصر من زميلاتها هذه السنة. ما أصح ما نقوله؟","options":["فيها مرض لأنها أقصر","يكفي أن تأكل أكثر لتلحق بهن","توقفت عن النمو","الأطفال يختلفون في موعد النمو، والمهم أن تطول عاماً بعد عام"],"answer":3,"explanation":"الأطفال يختلفون في سرعة النمو وموعده، والطبيب يقارن الطفل بنفسه مع الزمن.","level":"A","feedback_wrong":"من نقارن سلمى به: بزميلاتها أم بنفسها؟","feedback_by_option":{"0":"القِصر وحده ليس مرضاً؛ أكثر الاختلاف وراثي وموعد النمو يختلف.","1":"الأكل الزائد لا يزيد الطول بل الوزن.","2":"صفيحة النمو تعمل حتى آخر البلوغ، وكثيرون يطولون متأخرين."},"detects":"M107"},{"id":"U10.L01.P5","after":"E5","objective":"U10.L01.O1","type":"sequence","prompt":"{رتّب|رتّبي} ما يحدث لطولك{|ِ} في يوم وليلة.","options":["أستيقظ وأنا في أطول طولي","أقف وأمشي فتنضغط الأقراص بين الفقرات","يقصر طولي قليلاً في النهار","أنام فتمتلئ الأقراص من جديد"],"answer":[0,1,2,3],"explanation":"صباحاً أطول، ثم تنضغط الأقراص في النهار فيقصر الطول قليلاً، ثم تمتلئ في النوم.","level":"A","feedback_wrong":"متى تنضغط الأقراص: في الوقوف أم في الاستلقاء؟"}],"check":[{"id":"U10.L01.C1","objective":"U10.L01.O1","type":"explain_open","prompt":"{اشرح|اشرحي} بكلماتك{|ِ}: كيف صار طولك{|ِ} أكثر من نصف متر؟","answer":"خلايا جسمي تنقسم: كل خلية تنسخ ما فيها ثم تصير خليتين، فيزداد عدد الخلايا ويكبر الجسم؛ والعظام الطويلة تطول من صفائح النمو.","level":"A","rubric":"R1"},{"id":"U10.L01.C2","objective":"U10.L01.O2","type":"true_false_why","prompt":"«الرجل الكبير يستطيع أن يطول إذا أكل كثيراً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ صفائح النمو عند الكبير تصلّبت وصارت عظماً في آخر البلوغ، فلا يطول العظم بعدها مهما أكل.","level":"A","rubric":"R1"},{"id":"U10.L01.C3","objective":"U10.L01.O3","type":"explain_open","prompt":"{اذكر|اذكري} ثلاثة أشياء تساعد جسمك{|ِ} على النمو، و{فسّر|فسّري} واحداً منها.","answer":"النوم الكافي لأن أكثر هرمون النمو يُفرز فيه؛ والطعام المتنوع لأن الخلايا الجديدة تُبنى منه؛ والحركة لأنها تقوّي العظم والعضلة.","level":"A","rubric":"R1"},{"id":"U10.L01.C4","objective":"U10.L01.O4","type":"true_false_why","prompt":"«الطفل الأطول في الصف هو الأقوى والأفضل». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أكثر الاختلاف في الطول وراثي، والأطفال يختلفون في موعد النمو، والطول لا يدل على قوة ولا قيمة.","level":"A","rubric":"R1"},{"id":"U10.L01.C5","objective":"U10.L01.O1","type":"fix_model","prompt":"قاس أحمد طوله صباحاً فكان 135 سنتيمتراً، ثم قاسه قبل النوم فكان 134.5، فقال: «قصرت! جسمي يصغر». {صحّح|صحّحي} له.","answer":"لم يصغر؛ الأقراص بين فقراته انضغطت في النهار وستمتلئ في النوم فيعود طوله. ولكي يعرف نموه يقيس في الوقت نفسه من اليوم بعد أشهر.","level":"A","rubric":"R1"},{"id":"U10.L01.C6","objective":"U10.L01.O4","type":"explain_open","prompt":"لماذا {تشبه|تشبهين} أمك{|ِ} أو أباك{|ِ} في أشياء؟","answer":"لأن في كل خلية من خلاياي تعليمات، الحمض النووي، نصفها من أمي ونصفها من أبي؛ وهذه الوراثة.","level":"A","rubric":"R1"}],"concepts":[{"id":"cell_division","term":{"ar":"انقسام الخلية","en":"Cell division","zh":"细胞分裂","pinyin":"xìbāo fēnliè","match":["انقسام الخلية","الانقسام","تنقسم"]},"priority":"core","atlas":{"layer":"cells","element":"cell_division"},"card":{"A":"الخلية تنسخ ما فيها، ومنه تعليماتها، ثم تنقسم خليتين متماثلتين. هكذا يكبر الجسم ويُصلح نفسه.","B":"النوع الذي يبني الجسم ينسخ الكروموسومات الـ46 كلها، فتأخذ كل خلية جديدة نسخة كاملة."}},{"id":"growth_plate","term":{"ar":"صفيحة النمو","en":"Growth plate","zh":"生长板","pinyin":"shēngzhǎngbǎn","match":["صفيحة النمو","صفيحتا النمو","صفائح النمو"]},"priority":"core","atlas":{"layer":"skeleton","element":"growth_plate"},"card":{"A":"طبقة من الغضروف قرب طرفي العظم الطويل عند الأطفال، يُضاف منها عظم جديد فيطول العظم.","B":"تتصلب وتصير عظماً في آخر البلوغ: عند البنات غالباً بين 13 و15 سنة، وعند الأولاد بين 15 و17؛ فيتوقف ازدياد الطول."}},{"id":"growth_hormone","term":{"ar":"هرمون النمو","en":"Growth hormone","zh":"生长激素","pinyin":"shēngzhǎng jīsù","match":["هرمون النمو","الهرمون","هرمون"]},"priority":"core","atlas":{"layer":"nervous","element":"pituitary"},"card":{"A":"الهرمون رسالة كيميائية يحملها الدم. وهرمون النمو يرسله جزء صغير في قاع الدماغ، فيأمر خلايا العظم والعضلة أن تنمو، وأكثره يُفرز في النوم.","B":"الجزء الذي يفرزه اسمه الغدة النخامية، وهو بحجم حبة البازلاء تقريباً."}},{"id":"dna","term":{"ar":"الحمض النووي","en":"DNA","zh":"脱氧核糖核酸","pinyin":"tuōyǎng hétáng hésuān","match":["الحمض النووي"]},"priority":"core","atlas":{"layer":"cells","element":"dna"},"card":{"A":"التعليمات المكتوبة في نواة كل خلية، تقول للجسم كيف يُبنى ويعمل. نصفها جاءك من أمك ونصفها من أبيك.","B":"هو جزيء طويل جداً ملفوف في 46 كروموسوماً."}},{"id":"heredity","term":{"ar":"الوراثة","en":"Heredity","zh":"遗传","pinyin":"yíchuán","match":["الوراثة","وراثي","وراثية"]},"priority":"core","atlas":{"layer":"cells","element":"dna"},"card":{"A":"انتقال الصفات من الأبوين إلى الأبناء بالتعليمات التي في الخلايا؛ ولهذا يشبه الطفل أهله.","B":"أكثر الاختلاف في الطول بين الناس وراثي، والباقي من الغذاء والصحة والبيئة."}},{"id":"chromosome","term":{"ar":"الكروموسوم","en":"Chromosome","zh":"染色体","pinyin":"rǎnsètǐ","match":["الكروموسوم","كروموسوماً","الكروموسومات"]},"priority":"supporting","atlas":{"layer":"cells","element":"chromosome"},"card":{"A":"حزمة ملفوفة من الحمض النووي داخل النواة.","B":"في كل خلية من خلايا الجسم 46 كروموسوماً في 23 زوجاً: من كل زوج واحد من الأم وواحد من الأب."}}],"experiment":{"title":"أطول في الصباح؟ قياس طولي مرتين في اليوم","materials":["شريط قياس أو مسطرة طويلة","كتاب مقوّى ذو غلاف صلب","شريط لاصق ورقي وقلم رصاص","دفتر الأطلس"],"steps":["{ألصق|ألصقي} شريطاً لاصقاً ورقياً طويلاً على جدار أو باب بإذن الكبار، من الأرض إلى ما فوق رأسك{|ِ}.","بعد الاستيقاظ مباشرة {قف|قفي} حافي القدمين ظهرك{|ِ} وكعباك{|ِ} على الجدار، و{انظر|انظري} أمامك{|ِ}. يضع الكبير الكتاب مسطحاً على رأسك{|ِ} ويعلّم على الشريط تحته، ويكتب «صباح».","قبل النوم {كرّر|كرّري} القياس بالطريقة نفسها، ويكتب الكبير «مساء».","{قس|قيسي} المسافة بين العلامتين بالمليمتر.","{كرّر|كرّري} ثلاثة أيام، و{سجّل|سجّلي} الفرق كل يوم."],"safety":["الكبير يضع الكتاب ويعلّم؛ لا نقف على كرسي ولا نضع شيئاً ثقيلاً على الرأس.","الشريط الورقي بإذن الكبار كي لا يتلف الطلاء، ولا نكتب على الجدار مباشرة.","القياس شيء خاص: لا نقارن طولنا بطول أحد، ولا نسخر من طول أحد."],"expected":"علامة المساء أدنى من علامة الصباح بقليل: بضعة مليمترات، وقد تبلغ سنتيمتراً؛ وقد لا يظهر فرق إن لم يكن القياس دقيقاً، فالتكرار ثلاثة أيام يساعد.","explain":"بين فقرات عمودك{|ِ} الفقري أقراص طرية كالوسائد. في النهار وأنت{|ِ} {واقف|واقفة} و{تمشي|تمشين} تنضغط قليلاً فيقصر طولك{|ِ}، وفي النوم وأنت{|ِ} {مستلقٍ|مستلقية} تمتلئ من جديد. هذا ليس نمواً؛ النمو يُرى حين {تقيس|تقيسين} في الوقت نفسه من اليوم بعد أشهر.","record":"اليوم 1: صباحاً ___ مساءً ___ الفرق ___ مم — اليوم 2: ___ ___ ___ — اليوم 3: ___ ___ ___ — متوسط الفرق ___ مم","alternatives":["قياس أحد الكبار في البيت صباحاً ومساءً بالطريقة نفسها.","من لا يستطيع التجربة: قياسات طفل في المشهد، وحساب الفرق منها."]},"find_the_error":[{"id":"FE1","atlas_variant":"bone_grows_middle","error":"رسم عظم فخذ مكتوب عليه: العظم يطول من وسطه","answer":"العظم الطويل يطول من صفيحتي النمو قرب طرفيه","detects":"M110"},{"id":"FE2","atlas_variant":"tall_is_better","error":"لوحة في صف مكتوب عليها: الأطول هو الأقوى والأفضل","answer":"أكثر الاختلاف في الطول وراثي، والطول لا يدل على قوة ولا قيمة","detects":"M107"},{"id":"FE3","atlas_variant":"eat_more_grow","error":"ملصق على الثلاجة: كُل ضعف طعامك تصبح أطول","answer":"الطعام المتنوع يكفي، والزيادة تزيد الوزن لا الطول","detects":"M109"}],"numbers":[{"text":"يوم {وُلدت|وُلدتِ} كان طولك{|ِ} نحو 50 سنتيمتراً، أي نصف متر.","source":["S8"]},{"text":"في عمرك{|ِ} {تطول|تطولين} نحو 6 إلى 7 سنتيمترات كل سنة: قريباً من طول إصبعك{|ِ} الأوسط.","source":["S1"]}],"true_size":[{"text":"في عمرك{|ِ} {تطول|تطولين} نحو 6 إلى 7 سنتيمترات في السنة: أقل من نصف مليمتر في الأسبوع، فلا {تراه|ترينه} في المرآة، لكن علامة الباب تُظهره بعد أشهر.","source":["S1"]}],"animal":null,"organ_letter":{"from":"صفيحة النمو","text":"مرحباً، أنا صفيحة النمو، طبقة طرية من الغضروف قرب طرف عظم فخذك{|ِ}، ولي أخوات في ساقيك{|ِ} وساعديك{|ِ} ويديك{|ِ} وقدميك{|ِ}. {أنت|أنتِ} لا {تراني|تريني}، لكني أعمل كل يوم: خلاياي تنقسم، والجديد منها يصير عظماً، فيطول عظمك{|ِ} قليلاً قليلاً. وأكثر ما أعمل حين {تنام|تنامين}، فلا {تسهر|تسهري}. أعطني طعاماً متنوعاً وحركة في الهواء، وإن {سقطت|سقطتِ} وآلمك{|ِ} مكان قريب من مفصل فأخبر{|ي} الكبار، فأنا أضعف من العظم. وسأبقى معك{|ِ} حتى آخر البلوغ، ثم أتصلب وأصير عظماً وأستريح. ولا {تقارن|تقارني} طولك{|ِ} بطول أحد: لكل صفيحة موعدها."},"history":[{"who":"ابن الجزّار القيرواني","origin":"القيروان، تونس","where_when":"القيروان، نحو 895–980؛ كتابه «سياسة الصبيان وتدبيرهم»","did":"خصّ الأطفال بكتاب كامل في اثنين وعشرين باباً: كيف يُعتنى بهم ويُغذَّون، وما يصيبهم من أمراض تعيق نموهم، كالتسنين ومشكلات البطن، وكيف تُعالج في زمنه.","did_not":"لم يعرف الخلايا ولا صفائح النمو ولا الهرمونات ولا منحنيات النمو؛ وكثير من علاجاته لم يعد مستعملاً، ولا يُعمل بها اليوم إلا بما يقوله الطبيب.","method_lesson":"أن ننظر إلى الأطفال بعناية خاصة: نلاحظهم ونسجّل ما يصيبهم في كتاب يتعلم منه من بعدنا.","source":["S9"]}],"how_we_know":{"text":"كيف عرفنا كيف ينمو الأطفال؟ بالقياس المتكرر لآلاف الأطفال سنوات. بين 1997 و2003 تابعت منظمة الصحة العالمية 8,440 طفلاً من ست دول، منها عُمان، في بيوت فيها غذاء جيد ورعاية، فوجدت أنهم ينمون نمواً متشابهاً في مناطق العالم الكبرى. ومن هذه القياسات صُنعت منحنيات النمو التي يتابع بها الطبيب نمو كل طفل مع الزمن.","limit_question":"لماذا لا يكفي منحنى النمو وحده ليقول إن طفلاً بعينه متأخر؟"},"what_changed":["كان كثيرون يظنون أن كثرة الطعام والفيتامينات تجعل الطفل أطول؛ واليوم نعرف أن الوراثة تحدد أكثر الاختلاف في الطول، وأن الإفراط في الطعام يزيد الوزن لا الطول.","كانت منحنيات النمو تُبنى من أطفال بلد واحد؛ ثم بنت منظمة الصحة العالمية منحنيات لأطفال الصغار من ست دول بعد أن وجدت نموهم متشابهاً حين تتوفر الرعاية."],"model_limits":["رسم الخلية وهي تنقسم يُظهرها كبيرة بخطوات واضحة؛ في الحقيقة لا تُرى إلا بالمجهر، والانقسام يأخذ وقتاً ومراحل لا يُظهرها الرسم.","رسم صفيحة النمو يجعلها خطاً واضحاً ملوّناً؛ في الحقيقة طبقة رقيقة من الغضروف لا تُرى إلا في صورة الأشعة.","تجربة «أطول في الصباح» تقيس تغيّراً يعود كل ليلة، لا نمواً؛ والنمو الحقيقي يُرى بالقياس في الوقت نفسه من اليوم بعد أشهر.","منحنى النمو متوسطات لكثير من الأطفال؛ لا يقول وحده إن طفلاً بعينه متأخر أو متقدم، والطبيب وحده يقرأه."],"faith":{"opening":{"text":"وَٱللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَـٰتِكُمْ لَا تَعْلَمُونَ شَيْـًۭٔا وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَـٰرَ وَٱلْأَفْـِٔدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ","reference":"النحل 78","grade":"قرآن","usage":"تفكر","reflection":"وُلد كل واحد منا صغيراً بطول نصف متر، لا يعرف شيئاً. والآية التي أمامك{|ِ} تذكّرنا بأن الله أخرجنا من بطون أمهاتنا لا نعلم شيئاً، ثم جعل لنا وسائل نتعلم بها، لعلنا نشكر. واليوم ننظر نظرة علم في كيف يكبر الجسم: خلايا تنقسم، وعظام تطول. والآية لا تشرح الخلايا ولا العظام، والعلم لا يشرح الآية؛ لكن من عرف كيف كبر من نصف متر إلى ما هو عليه عرف قدر النعمة. ماذا {تستطيع|تستطيعين} اليوم ولم تكن{|ي} {تستطيعه|تستطيعينه} وأنت{|ِ} {رضيع|رضيعة}؟","reviewed":false,"quran_key":"16:78","hl_words":[1,7],"highlight":"أخرجكم من بطون أمهاتكم لا تعلمون شيئا","level":"تفكر","concept":"وُلدنا صغاراً لا نعلم شيئاً، والنمو في الجسم والعلم نعمة تستحق الشكر.","avoid":"لا نقول إن الآية تصف انقسام الخلايا أو صفائح النمو، ولا نجعل العلم دليلاً عليها؛ هي تذكير بنعمة الخلق والعلم ودعوة إلى الشكر.","cards":[]},"closing":{"text":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير، احرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن «لو» تفتح عمل الشيطان","reference":"مسلم 2664","grade":"صحيح","usage":"قيمة","reflection":"عرفنا اليوم أن الطول أكثره وراثة، وأن ما بيدك{|ِ} هو النوم الكافي والطعام المتنوع والحركة. والحديث في البطاقة يقول: احرص على ما ينفعك، ولا تعجز؛ فهذا هو الذي بيدك{|ِ}. ويقول: وفي كلٍّ خير؛ فالقصير والطويل، والسريع النمو والبطيء، في كلٍّ منهم خير، والقوة ليست طولاً بل إرادة وعمل وعلم. والحديث لا يتكلم عن الطول ولا عن صفائح النمو؛ لكنه يعلّمنا أن نعمل بما نستطيع ونرضى بما قدّر الله. ما الشيء النافع الذي {ستحرص|ستحرصين} عليه هذا الأسبوع؟","reviewed":false,"hadith_key":"muslim:2664","highlight":"احرص على ما ينفعك واستعن بالله ولا تعجز","level":"ترغيب","concept":"نعمل بما ينفعنا مما بأيدينا، ولا نقارن ولا نتحسّر على ما ليس بأيدينا.","avoid":"لا نقول إن الحديث يتكلم عن الطول أو النمو، ولا نجعل القوة طولاً أو عضلات؛ ولا نحقّر الضعيف، ففي الحديث نفسه أن في كلٍّ خيراً.","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2664","grader":"","cards":[]}},"life":[{"situation":"في الطابور الصباحي ضحك بعض الأولاد من زميل قصير وقالوا له: «أنت مثل أخينا الصغير».","science":"أكثر الاختلاف في الطول وراثي، والأطفال يختلفون في موعد النمو، وصفائح النمو تبقى تعمل سنوات؛ والطول لا يدل على قوة ولا ذكاء ولا قيمة.","action":"أقف بجانب زميلي وأناديه باسمه، وأقول للأولاد بهدوء إن الطول لا يجعل أحداً أفضل، وإن كل واحد يطول في موعده؛ وأخبر المعلم إن تكرر ذلك.","value":"لا تفاضل بالطول، ولا سخرية من أحد.","why":"لماذا لا يجعل الطول أحداً أفضل؟ لأنه في أكثره تعليمات ورثها كل منا لم يخترها. وفي الآية في البطاقة أن الله جعل الناس أمماً وجماعات ليعرف بعضهم بعضاً، وأن أكرمهم عنده أتقاهم، لا أطولهم.","reference":"الحجرات 13","quran":["49:13"],"cards":[],"verses":["49:13"]},{"situation":"أريد أن أسهر كل ليلة على الألعاب، وأقول لنفسي: النوم لا يفيدني بشيء.","science":"أكثر هرمون النمو يُفرز في النوم، والأقراص بين الفقرات تمتلئ فيه، والدماغ يرتّب فيه ما تعلّمه؛ والسهر يأخذ من هذا كله.","action":"أطفئ الشاشة قبل النوم بساعة، وأنام في وقت ثابت، وأخبر أهلي إن صعب علي النوم.","value":"حفظ نعمة الجسد، والحرص على ما ينفعني.","why":"لماذا أنام وأنا لا أشعر بالتعب؟ لأن الجسم يعمل في النوم أعمالاً لا يعملها في اليقظة، ومنها النمو؛ ومن الحرص على ما ينفع أن أعطي جسمي حقه.","cards":[],"verses":[]}],"open_questions":[{"q":"هل يحتاج الجسم إلى النوم العميق بالتحديد ليُفرز هرمون النمو؟","why_open":"كان يُظن ذلك، ثم وجدت دراسة صغيرة سنة 2022 أن تقطيع النوم العميق ليلة واحدة عند 14 طفلاً لم يغيّر إفرازه؛ والعلماء يحتاجون دراسات أكبر وأطول."},{"q":"ما الذي يجعل صفيحة النمو تتوقف عن العمل في عمر معين؟","why_open":"يعرف العلماء أن هرمونات البلوغ لها دور كبير، لكن كيف «تعرف» خلايا الغضروف أن وقت التوقف حان ما زال يُبحث."}],"notebook":{"draw":"{ارسم|ارسمي} عظم الفخذ ولوّن{|ي} قرب طرفيه شريطين: صفيحتي النمو. ثم {ارسم|ارسمي} بجانبه خلية تصير خليتين ثم أربعاً. المستوى ب: {ارسم|ارسمي} زوجاً من الكروموسومات بلونين: واحد من الأم وواحد من الأب.","label":["صفيحة النمو","الغضروف","عظم الفخذ","انقسام الخلية","هرمون النمو","الحمض النووي","الأقراص بين الفقرات","— ب: الكروموسوم، 23 زوجاً"],"write":"أشرح: كيف صار طولي أكثر من نصف متر؟ ولماذا يحتاج نموي إلى النوم؟ ولماذا لا أقارن طولي بطول زملائي؟ وأكتب ما وجدته حين قست طولي صباحاً ومساءً."},"imgs":["U10.L01-E1","U10.L01-E2","U10.L01-E3","U10.L01-E4","U10.L01-E5","U10.L01-E6","U10.L01-exp","U10.L01-hist1","U10.L01-letter","U10.L01-life","U10.L01-title-boy","U10.L01-title-girl"]};
