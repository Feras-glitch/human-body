const LD = {"id":"U04.L02","first":false,"title":"الرئتان من الداخل: من الهواء إلى الدم","driving_question":"الهواء يدخل رئتيك{|ِ}… فكيف يصل الأكسجين إلى عضلة قدمك{|ِ}؟","central_fact":"في مئات الملايين من الحويصلات الرقيقة يعبر الأكسجين من الهواء إلى الدم ويعبر ثاني أكسيد الكربون من الدم إلى الهواء؛ والدم — لا الرئة — هو الذي يوصل الأكسجين إلى كل خلية.","next":"U04.L03","hook":{"text":"{اسم}، قرّب{|ي} ظهر كفك{|ِ} من فمك{|ِ} وأخرج{|ي} زفيراً. دافئ ورطب! الهواء الذي دخل كان جافاً وأبرد. ماذا حدث له في الداخل؟","options":["لا شيء؛ هو الهواء نفسه","أخذ من الجسم شيئاً وترك شيئاً","الرئة سخّنته فقط","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["respiratory"],"highlight":["bronchioles","alveoli"],"zoom":"lung_inside"},"text":"لندخل الرئة. الأنابيب تتفرع وتدق حتى تنتهي بعناقيد من أكياس صغيرة جداً نسميها الحويصلات الهوائية. في رئتيك{|ِ} مئات الملايين من الحويصلات؛ لذلك الرئة إسفنجية لا كيس فارغ. وحول كل حويصلة شبكة من الشعيرات الدموية التي عرفناها في وحدة الدم: جدار رقيق جداً من طبقة خلايا واحدة."},{"id":"E2","level":"A","atlas":{"layers":["respiratory","circulatory"],"highlight":["alveolus","capillary"],"zoom":"alveolus","animate":"exchange"},"text":"هنا يحدث الأهم: تبادل الغازات. الهواء الذي دخل فيه أكسجين كثير، والدم القادم من الجسم فيه أكسجين قليل. فيعبر الأكسجين جدار الحويصلة الرقيق إلى الدم. وفي الوقت نفسه يعبر ثاني أكسيد الكربون — الذي صنعته خلايا الجسم — من الدم إلى الحويصلة ليخرج مع الزفير. لا أنبوب ولا مضخة: جداران رقيقان وغازان يعبرانهما في اتجاهين."},{"id":"E3","level":"A","atlas":{"layers":["circulatory","respiratory"],"highlight":["pulmonary_vein","heart_left","aorta","leg_capillary"],"zoom":"body","animate":"o2_journey"},"text":"والآن جواب سؤالنا: كيف يصل الأكسجين إلى عضلة قدمك{|ِ}؟ ليس من الرئة مباشرة؛ لا أنبوب يربطهما. الأكسجين يركب الدم: من الحويصلة إلى الشعيرة، إلى يسار القلب، فالشريان الكبير، فشرايين أصغر، حتى شعيرة داخل عضلة القدم، حيث يترك الدم الأكسجين للخلايا ويأخذ منها ثاني أكسيد الكربون. ثم يعود الدم إلى يمين القلب فإلى الرئتين ليبدأ من جديد. الدم هو الناقل، والرئة محطة التحميل."},{"id":"E4","level":"A","atlas":{"layers":["respiratory"],"highlight":["alveoli"],"zoom":"alveolus"},"text":"ولماذا كان زفيرك{|ِ} دافئاً رطباً؟ لأن الهواء مرّ بحويصلات رطبة في جسم دافئ، فخرج محمّلاً بالماء. ولو قرّبت{|ِ} مرآة باردة لرأيت{|ِ} الماء قطرات. الزفير ليس الهواء الذي دخل: ترك فيك{|ِ} أكسجيناً، وأخذ منك{|ِ} ثاني أكسيد الكربون وماءً. لكن انتبه{|ي}: ما زال في الزفير أكسجين كثير؛ لم تأخذ{|ي} إلا جزءاً منه."},{"id":"E5","level":"B","atlas":{"layers":["circulatory"],"highlight":["red_cell"],"zoom":"cell"},"text":"للمستوى ب: كيف يركب الأكسجين الدم؟ داخل الكريّة الحمراء مادة حمراء نسميها الهيموغلوبين، تمسك الأكسجين حيث هو كثير (شعيرات الرئتين) وتتركه حيث هو قليل (شعيرات الجسم). لذلك تصير الكريّة أحمر فاتحاً في الرئة وأحمر داكناً في العضلة — وليس أزرق أبداً. أما ثاني أكسيد الكربون فيحمله الدم بثلاث طرق: قليل منه ذائب كما هو، وبعضه على الكريّات الحمراء، ومعظمه يتحوّل إلى مادة أخرى ذائبة في البلازما، ثم يعود ثاني أكسيد كربون في الرئتين فنزفره."},{"id":"E6","level":"B","atlas":{"layers":["respiratory"],"highlight":["alveoli"],"zoom":"lung_inside"},"text":"لماذا مئات الملايين من الحويصلات الصغيرة بدل كيسين كبيرين؟ لأن التبادل يحتاج مساحة: كل حويصلة سطح صغير، ومجموع مئات الملايين من السطوح الصغيرة مساحة واسعة جداً. والحويصلات مرنة ومغطاة بمادة تمنعها من الانطباق عند الزفير. والدخان والغبار الكثير يؤذيان الأنابيب الدقيقة والحويصلات فيصعب التبادل؛ لذلك يلهث من يدخّن حين يصعد الدرج — سنفحص هذا في قضية الوحدة."}],"practice":[{"id":"U04.L02.P1","objective":"U04.L02.O1","type":"choose","prompt":"لماذا الرئة إسفنجية؟","options":["لأن فيها مئات الملايين من الحويصلات الصغيرة","لأنها مليئة بالدم فقط","لأنها كيس من المطاط","لأنها مليئة بالماء"],"answer":0,"explanation":"الرئة إسفنجية لأن فيها مئات الملايين من الحويصلات الصغيرة المملوءة بالهواء.","level":"A","feedback_wrong":"ما الذي في نهاية الأنابيب الدقيقة؟","feedback_by_option":{"1":"في الرئة دم كثير في الشعيرات، لكن أكثرها هواء في حويصلات صغيرة.","2":"لو كانت كيساً لكانت  وتتركه في شعيرات الجسم"],"answer":3,"explanation":"الكريّة تمسك الأكسجين حيث يكثر، في شعيرات الرئتين، وتتركه حيث يقلّ، في شعيرات الجسم.","level":"B","feedback_wrong":"أين الأكسجين كثير فتمسكه، وأين قليل فتتركه؟","feedback_by_option":{"0":"العكس: في الرئة يكثر الأكسجين، وفي العضلة يُستعمل.","1":"القلب يدفع الكريّات ولا يعطيها أكسجيناً.","2":"لو لم تتركه لما وصل إلى الخلايا؛ الكريّة تتركه حيث يقلّ."}}],"check":[{"id":"U04.L02.C1","objective":"U04.L02.O1","type":"true_false_why","prompt":"«الرئة ليست كيساً فارغاً، بل إسفنجة مليئة بحويصلات صغيرة جداً». صح أم خطأ؟ ولماذا؟","answer":"صح؛ فيها مئات الملايين من الحويصلات حولها شعيرات، ولذلك هي إسفنجية.","level":"A","rubric":"R1"},{"id":"U04.L02.C2","objective":"U04.L02.O2","type":"fix_model","prompt":"رسم زميل{ك|تكِ} سهم ثاني أكسيد الكربون من الهواء إلى الدم في الحويصلة. ما الخطأ؟","answer":"ثاني أكسيد الكربون يعبر من الدم إلى الهواء ليخرج؛ الأكسجين هو الذي يعبر إلى الدم.","level":"A","rubric":"R1"},{"id":"U04.L02.C3","objective":"U04.L02.O3","type":"choose_reason","prompt":"لاعب يركض فتحتاج عضلات ساقيه أكسجيناً أكثر. من يوصله إليها؟","options":["الدم الذي يدفعه القلب","الرئة ترسله مباشرة بأنبوب","الهواء يدخل من الجلد","العضلة تصنعه"],"answer":0,"explanation":"لا أنبوب من الرئة إلى الساق؛ الدم يحمل الأكسجين والقلب يدفعه إلى العضلات.","level":"A","feedback_wrong":"هل يوجد أنبوب من الرئة إلى الساق؟","detects":"M03","feedback_by_option":{"1":"لا أنبوب من الرئة إلى الساق؛ الدم يحمل الأكسجين، والقلب يدفعه.","2":"الجلد لا يأخذ أكسجيناً يكفي العضلات؛ الطريق من الرئتين عبر الدم.","3":"العضلة تستعمل الأكسجين ولا تصنعه؛ يأتيها من الهواء عبر الدم."}},{"id":"U04.L02.C4","objective":"U04.L02.O4","type":"explain_open","prompt":"في الشتاء نرى «بخاراً» يخرج من أفواهنا. فسّر{|ي} بما {تعلمته|تعلمتِه}.","answer":"الزفير رطب دافئ لأنه مرّ بالحويصلات الرطبة؛ في الهواء البارد يتكثف ماؤه قطرات دقيقة فنراه.","level":"A","rubric":"R1"},{"id":"U04.L02.C5","objective":"U04.L02.O5","type":"true_false_why","prompt":"«الدم العائد من العضلة إلى الرئتين حويصلة وجدار الشعيرة، كلاهما من طبقة خلايا واحدة."}},{"id":"oxygen","term":{"ar":"الأكسجين","en":"Oxygen","zh":"氧气","pinyin":"yǎngqì","match":["أكسجين","أكسجيناً"]},"priority":"core","atlas":{"layer":"respiratory","element":"alveoli"},"card":{"A":"غاز في الهواء لا نراه ولا نشمه، تحتاجه كل خلية في جسمك{|ِ}. الرئتان تنقلانه إلى الدم ولا تصنعانه.","B":"لماذا تحتاجه الخلية؟ لتطلق الطاقة من الغذاء — هذا درس الخلية القادم."}},{"id":"co2","term":{"ar":"ثاني أكسيد الكربون","en":"Carbon dioxide","zh":"二氧化碳","pinyin":"èryǎnghuàtàn","match":["ثاني أكسيد"]},"priority":"core","atlas":{"layer":"respiratory","element":"alveoli"},"card":{"A":"غاز تصنعه خلايا الجسم وهي تعمل، يحمله الدم إلى الرئتين فيخرج مع الزفير.","B":"الدماغ يقيسه في الدم؛ حين يرتفع يأمر بتنفس أسرع (الدرس السابق)."}},{"id":"hemoglobin","term":{"ar":"الهيموغلوبين","en":"Hemoglobin","zh":"血红蛋白","pinyin":"xuèhóngdànbái"},"priority":"supporting","atlas":{"layer":"circulatory","element":"red_cell"},"card":{"A":"المادة الحمراء داخل الكريّة الحمراء التي تمسك الأكسجين في الرئتين وتتركه في الجسم.","B":"بروتين فيه حديد؛ لذلك يحتاج الجسم حديداً من الطعام ليصنع كريّات تحمل أكسجيناً كافياً (كاللحم والكبد والبيض والعدس والفول والخضار الورقية)."}}],"experiment":{"title":"ماذا يخرج مع زفيري؟ المرآة والبالون","materials":["مرآة صغيرة باردة ({ضعها|ضعيها} دقيقة في الثلاجة أو تحت ماء بارد {وجففها|وجففيها})","بالون","ساعة بالثواني","ورقة دفتر الأطلس"],"steps":["قرّب{|ي} المرآة الباردة من فمك{|ِ} وأخرج{|ي} زفيراً هادئاً عليها. ماذا {ترى|ترين}؟ المس{|ي} الضباب: ما هو؟","انتظر{|ي} حتى يختفي الضباب. كرر{|ي} بعد أن تتنفس{|ي} من الأنف بدل الفم: هل الضباب أكثر أم أقل؟","{مطّ|مطّي} البالون بيديك{|ِ} عدة مرات ليلين. خذ{|ي} نفساً عادياً ثم انفخ{|ي} هواءه كله في البالون — سيحتاج المطاط دفعة في البداية، فلا {تخرج|تخرجي} أكثر من هواء ذلك النَّفَس — ثم أمسك{|ي} فوهته: هذا حجم نَفَس واحد تقريباً. {اربطه|اربطيه} أو {قس|قيسي} عرضه بالمسطرة.","خذ{|ي} أعمق نفس تستطيع{|ين} وانفخ{|ي} زفيراً واحداً كاملاً في بالون آخر. قارن{|ي} الحجمين.","عدّ{|ي}: كم كلمة تستطيع{|ين} قولها بصوت عادٍ في زفير واحد؟ سجّل{|ي} الرقم.","سجّل{|ي} في الدفتر: ما كان على المرآة، وكم كبر بالون النفس العميق مقارنة بالعادي."],"safety":["البالون غير المنفوخ وقطعه الممزقة خطر اختناق: لا يبقى في الفم، ويُجمع الممزق فوراً، والنفخ بحضور بالغ؛ ومن لديه حساسية من المطاط (اللاتكس) يستعمل الكيس الورقي البديل.","نفخة واحدة ثم تنفس عادي؛ لا نفخ متكرر سريع (قد يسبب دواراً). من أحسّ بدوار يجلس.","لا نتبادل البالونات ولا المرآة بين الأطفال (لعاب)؛ لكل طفل أداته أو تُغسل بينهم.","من لديه ربو لا ينفخ البالون إلا بإذن."],"expected":"تتضبب المرآة بقطرات ماء دقيقة؛ بالون النفس العميق أكبر بوضوح من بالون النفس العادي؛ عدد الكلمات في زفير واحد محدود (نحو 20–40).","explain":"الضباب قطرات ماء: الهواء الذي خرج من رئتيك{|ِ} رطب ودافئ لأنه مرّ بحويصلات رطبة، فتكثّف الماء على المرآة الباردة. هذا دليل أن الزفير ليس الهواء نفسه الذي دخل: ترك فيك{|ِ} أكسجيناً وأخذ منك{|ِ} ماءً وثاني أكسيد كربون. وبالون النفس العميق يبيّن أن رئتيك{|ِ} تستطيعان أن تأخذا أكثر بكثير مما تأخذانه في الراحة؛ هذا الاحتياطي هو ما {تستعمله|تستعملينه} حين تركض{|ين}.","record":"رسم المرآة بالضباب، ورسم البالونين بحجميهما، وعدد الكلمات في زفير واحد.","alternatives":["إن لم توجد مرآة: زجاج نافذة بارد أو ملعقة معدنية باردة.","إن لم يوجد بالون: كيس ورقي صغير يُنفخ ويُمسك فمه (لا كيس بلاستيكي: خطر اختناق)."]},"find_the_error":[{"id":"FE1","atlas_variant":"lung_to_muscle_tube","error":"أنبوب مرسوم من الرئة إلى عضلة الساق يحمل الأكسجين","answer":"لا أنبوب؛ الأكسجين يركب الدم من الحويصلة إلى القلب إلى الشعيرات","detects":"M03"},{"id":"FE2","atlas_variant":"co2_into_blood","error":"سهم ثاني أكسيد الكربون من الهواء إلى الدم","answer":"ثاني أكسيد الكربون يخرج من الدم إلى الهواء؛ الأكسجين يدخل","detects":"M02"}],"numbers":[{"text":"مئات الملايين من الحويصلات في رئتيك{|ِ} — لو {عددتها|عددتِها} واحدة في الثانية بلا توقف لاحتجت{|ِ} إلى سنوات كثيرة بلا نوم.","source":["S1"]},{"text":"جدار الحويصلة وجدار الشعيرة معاً أرقّ من ورقة الدفتر بكثير؛ لذلك يعبرهما الأكسجين في أقل من ثانية.","source":["S2"]}],"true_size":[{"text":"حويصلة واحدة أصغر من نقطة القلم؛ ضع{|ي} نقطة بالقلم على ورقة وتخيّل{|ي} مئات الملايين نقطة في صدرك{|ِ}.","source":["S1"]},{"text":"انفخ{|ي} بالوناً بزفير واحد هادئ: هذا حجم الهواء الذي يدخل ويخرج مع كل نَفَس تقريباً.","source":["S2"]}],"animal":{"text":"خياشيم السمكة تفعل ما تفعله حويصلاتنا لكن مع الماء: صفائح رقيقة جداً تمر عليها الماء ويعبر الأكسجين الذائب منها إلى الدم. وجلد الضفدع الرطب يبادل الغازات أيضاً، لذلك لا يستطيع الضفدع أن يعيش بجلد جاف. الفكرة واحدة: جدار رقيق ورطب وسطح واسع.","source":["S6"]},"organ_letter":{"from":"حويصلة هوائية","text":"أنا حويصلة واحدة من مئات الملايين. أصغر من أن {تراني|تريني}، وجداري أرقّ من أن {تتخيّله|تتخيّليه}. مع كل نَفَس يمرّ بي هواء جديد، فأناول الدمَ أكسجيناً وآخذ منه ثاني أكسيد الكربون، في أقل من ثانية، عشرين مرة في الدقيقة، طوال عمرك{|ِ}. الدخان يؤذيني ولا أستطيع الهرب. مع التحية، كيس صغير رطب في عمق صدرك{|ِ}."},"history":[{"who":"ابن النفيس","origin":"دمشق؛ عمل في القاهرة. مسلم","where_when":"القاهرة، نحو 1242","did":"قال إن الدم يمر من يمين القلب إلى الرئتين ليختلط بالهواء ثم يعود إلى يسار القلب، ورفض وجود ثقوب في الحاجز — استدلالاً من التشريح والعقل.","did_not":"لم يرَ الحويصلات ولا الشعيرات (لا مجهر)، ولم يصف الدورة الكاملة، وبقي وصفه شبه مجهول حتى 1924.","method_lesson":"الاستدلال الصحيح قد يسبق الأداة التي تُثبته.","source":["S4"]},{"who":"مارتشيلو مالبيغي","origin":"إيطاليا","where_when":"بولونيا، 1661","did":"رأى بالمجهر في رئة الضفدع الحويصلات الهوائية والشعيرات التي تصل الشرايين بالأوردة، فأغلق الحلقة التي تركها هارفي مفتوحة.","did_not":"لم يعرف أن الأكسجين يعبر جدار الحويصلة (لافوازييه والكيمياء لاحقاً)، ولم يعرف وظيفة الدم في حمله.","method_lesson":"الأداة الجديدة تُري ما كان استدلالاً.","source":["S5"]}],"how_we_know":{"text":"قبل نحو 780 سنة في القاهرة، قال ابن النفيس إن الدم يذهب من يمين القلب إلى الرئتين «ليختلط بالهواء» ثم يعود إلى يسار القلب — من فكره واستدلاله لا من رؤية. وبعده بأربعة قرون، في إيطاليا، وضع مالبيغي رئة ضفدع تحت مجهر بسيط فرأى بعينه ما استدل عليه ابن النفيس بعقله: أكياساً هوائية دقيقة تحيط بها أوعية أرفع من الشعرة يمر فيها الدم. الفكرة الصحيحة تسبق أحياناً الأداة التي تُثبتها.","limit_question":"ما الذي لا يُظهره رسم الحويصلة في هذا الدرس؟"},"what_changed":["ظُن قروناً أن الدم يُستهلك في الجسم ويُصنع من جديد؛ الصواب أنه يدور ويتجدد ما يحمله.","ظُن أن الرئة تبرّد القلب؛ الصواب أنها تبادل الغازات مع الدم."],"model_limits":["رسم الحويصلة يُظهر حويصلة واحدة كبيرة؛ في الحقيقة مئات الملايين بحجم لا تراه العين.","الألوان ترميز: الأكسجين ليس أزرق ولا أحمر، وثاني أكسيد الكربون لا لون له.","الرسم ساكن؛ التبادل يحدث مع كل نَفَس بلا توقف.","الرسم لا يُظهر ماذا تفعل الخلية بالأكسجين (الوحدة القادمة).","في مقطع الحويصلة لم تُرسم كل الطبقات المجهرية (لا غشاء قاعدي مستقل).","البقع الأربع في رمز الهيموغلوبين ليست نواة؛ الكريّة بلا نواة.","مقارنة الكيس الأملس بالحويصلات الكثيرة ومقارنة المنشفة رمزيتان لا حساباً مقاساً للمساحة."],"faith":{"opening":null,"closing":{"text":"وَإِن تَعُدُّوا۟ نِعْمَةَ ٱللَّهِ لَا تُحْصُوهَآ ۗ إِنَّ ٱللَّهَ لَغَفُورٌۭ رَّحِيمٌۭ","reference":"النحل 18","grade":"قرآن","usage":"تفكر","reflection":"مئات الملايين من الحويصلات تعمل في صدرك{|ِ} الآن، ونَفَس كل دقيقة عشرون مرة، وأنت{|ِ} لم تعدّ{|ي} واحداً منها قط. وفي الآية التي أمامك{|ِ}: لو أردنا عدّ نعم الله ما أحصيناها. اليوم عددنا ما استطعنا — أنفاساً وكلمات في زفير — ووجدنا أن الحصر فوق طاقتنا. ما الذي تشكر{|ين} عليه اليوم بنَفَس هادئ؟","reviewed":false,"quran_key":"16:18","hl_words":[0,5],"highlight":"وإن تعدوا نعمة الله لا تحصوها","level":"تفكر","concept":"النعم أكثر من أن تُحصى؛ محاولة عدّها تعلّمنا الشكر لا الحصر.","avoid":"لا نقول إن الآية تذكر الرئتين أو الحويصلات؛ هي عامة في كل النعم، ونحن نقرؤها ونحن ننظر في نعمة واحدة.","cards":[]}},"life":[{"situation":"في بيت قريب لنا يدخّن أحدهم في الغرفة ونحن فيها.","science":"دخان السيجارة أو الشيشة يصل إلى حويصلاتي أنا أيضاً ويؤذي أنابيبي الدقيقة، لا رئة المدخّن وحده.","action":"أخرج إلى الهواء أو أفتح النافذة، وأطلب بأدب أن يُدخَّن خارج الغرفة، وأخبر أمي أو أبي.","value":"رئتي أمانة، ولي أن أطلب هواءً نظيفاً بأدب.","why":"لماذا أطلب وأنا الصغير؟ لأن الضرر لا ينتظر أن أكبر: كل نَفَس في غرفة مدخَّنة يدخل دخاناً إلى مئات الملايين من الحويصلات لا تستطيع الهرب. والأدب في الطلب يحفظ حق القريب في الاحترام وحقي في الهواء معاً؛ والنبي ﷺ نهى عن الضرر وعن مقابلة الضرر بالضرر: فلا أضرّ بغيري، وأطلب بأدب أن يُرفع الضرر عني.","reference":"ابن ماجه 2341","hadith":["ibnmajah:2341"],"cards":[{"key":"ibnmajah:2341","lead":"عن ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ:","text":"لا ضرر ولا ضرار","narration":false,"source":"ابن ماجه 2341","grade":"حسن","grader":"حسّنه النووي بمجموع طرقه، وصحّحه الألباني"}],"verses":[]},{"situation":"صديق يعطس ويسعل في وجهي حين نلعب.","science":"السعال والعطاس يدفعان من الرئتين والأنف قطرات دقيقة تحمل ميكروبات تدخل أنفي ورئتي مع الهواء.","action":"أغطي أنا فمي بمرفقي حين أعطس، وأطلب منه بلطف أن يفعل، ونغسل أيدينا.","value":"أحمي هواء غيري كما أحب أن يُحمى هوائي.","why":"لماذا بالمرفق لا بالكف؟ لأن الكف تلمس كل شيء بعدها فتنقل ما فيها. وأصل الأدب من النبي ﷺ: كان إذا عطس غطّى فمه بيده أو ثوبه وخفض صوته؛ والكمّ عند المرفق ثوب يغطي العطسة ويُبقي الكف نظيفة. فأدب العطاس حماية للناس قبل أن يكون ذوقاً.","reference":"أبو داود 5029","hadith":["abudawud:5029"],"cards":[{"key":"abudawud:5029","lead":"عن أبي هريرة رضي الله عنه قال:","text":"كان رسول الله ﷺ إذا عطس وضع يده أو ثوبه على فيه، وخفض — أو غضّ — بها صوته","narration":false,"source":"أبو داود 5029","grade":"حسن صحيح","grader":"قاله الترمذي في روايته له (2745)"}],"verses":[]}],"open_questions":[{"q":"كيف تعرف الحويصلة أن تبقى مفتوحة ولا تنطبق مع كل زفير مهما صغرت؟","why_open":"نعرف أن مادة خاصة تغطيها تقلل التوتر، لكن كيف يُضبط إنتاجها بدقة مع كل نَفَس ما زال موضع بحث."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة حويصلة واحدة وحولها شعيرة، وسهمين: الأكسجين إلى الدم، وثاني أكسيد الكربون إلى الهواء. ثم ارسم{|ي} طريق الأكسجين إلى عضلة القدم بالأسهم. المستوى ب: لوّن{|ي} الكريّة فاتحة في الرئة وداكنة في العضلة.","label":["الحويصلة","الشعيرة","أكسجين →","← ثاني أكسيد الكربون","يسار القلب","عضلة القدم"],"write":"ماذا ظهر على المرآة حين نفخت عليها،
