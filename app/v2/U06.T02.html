const LD = {"id":"U06.T02","lesson":"U06.L02","first":false,"title":"اختبار: الطريق: المريء والمعدة","lessonTitle":"الطريق: المريء والمعدة","concepts":[],"check":[],"items":[{"id":"U06.L02.A1.a","objective":"U06.L02.O1","level":"A","type":"choose_reason","prompt":"ما الذي يحرّك الطعام في المريء؟","options":["الجاذبية تسحبه إلى الأسفل","الهواء الذي نبلعه معه","موجة انقباض عضلية","اللعاب يزلقه وحده إلى المعدة"],"answer":2,"explanation":"موجة انقباض عضلية في جدار المريء تدفع الطعام إلى المعدة.","feedback_by_option":{"0":"لو كانت الجاذبية هي السبب لما استطعنا البلع ونحن مقلوبون، ولما أكل رواد الفضاء؛ موجة عضلية هي التي تدفعه.","1":"الهواء لا يدفع اللقمة؛ جدار المريء نفسه ينقبض.","3":"اللعاب يجعل اللقمة زلقة، لكنه لا يحرّكها؛ الحركة من عضلات المريء."},"detects":"M54","alt":{"prompt":"يشرب الحصان ورأسه منخفض، فيصعد الماء في مريئه إلى معدته. لماذا؟","options":["لأن الماء يصعد وحده","لأن عضلات المريء تدفع الماء بموجة متتابعة","لأن الحصان يتنفس الماء","لأن الجاذبية تسحبه إلى الأعلى"],"answer":1,"explanation":"الحركة الدودية: عضلات المريء تنقبض خلف الماء موجةً متتابعة فتدفعه ولو كان صاعداً؛ فالجاذبية ليست ما يوصل الطعام.","feedback_by_option":{"0":"الماء لا يصعد وحده؛ شيء يدفعه.","2":"الحصان لا يتنفس الماء؛ يبلعه.","3":"الجاذبية تسحب إلى الأسفل لا إلى الأعلى."},"detects":"M54"}},{"id":"U06.L02.A1.b","objective":"U06.L02.O1","level":"A","type":"explain_open","prompt":"صف{|ي} الحركة الدودية بكلماتك{|ِ} {مستعملاً|مستعملةً} «خلف» و«أمام».","answer":"العضلة خلف اللقمة تنقبض وتضغطها والتي أمامها ترتخي، ثم التالية — موجة تمشي.","rubric":"R1"},{"id":"U06.L02.A1.c","objective":"U06.L02.O1","level":"A","type":"true_false_why","prompt":"«لا أستطيع إيقاف موجة البلع في المريء بإرادتي بعد أن تبدأ». صح أم خطأ؟","answer":"صح؛ هي لا إرادية كالقلب؛ أستطيع فقط أن أختار متى أبلع.","rubric":"R1","alt":{"prompt":"«في الحركة الدودية تنقبض عضلات المريء خلف اللقمة، وترتخي التي أمامها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تنقبض العضلات خلف اللقمة فتضغطها، وترتخي التي أمامها، ثم تنتقل الموجة إلى الأمام."}},{"id":"U06.L02.A2.a","objective":"U06.L02.O2","level":"A","type":"true_false_why","prompt":"«المعدة تهضم كل الطعام وتُدخله الدم». صح أم خطأ؟","answer":"خطأ؛ تخلط وتبدأ تكسير البروتين وتُطلق ببطء؛ الامتصاص في الأمعاء.","rubric":"R1","detects":"M55","alt":{"prompt":"«معظم امتصاص الغذاء إلى الدم يحدث في الأمعاء، لا في المعدة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ المعدة تخلط وتبدأ تكسير البروتين وتُطلق الطعام ببطء، ومعظم الهضم والامتصاص في الأمعاء الدقيقة.","detects":"M55"}},{"id":"U06.L02.A2.b","objective":"U06.L02.O2","level":"A","type":"choose","prompt":"ما الذي يبدأ حمض المعدة وعصاراتها تكسيره؟","options":["النشا","الماء","الفيتامينات","البروتين"],"answer":3,"explanation":"حمض المعدة وعصاراتها تبدأ تكسير البروتين.","feedback_by_option":{"0":"تحويل النشا يبدأ في الفم باللعاب.","1":"الماء لا يحتاج تكسيراً.","2":"الفيتامينات لا تُكسّر في المعدة؛ الحمض يبدأ بغذاء يكثر في اللحم والبيض."},"alt":{"prompt":"أي طعام يبدأ هضمه في المعدة أكثر من غيره؟","options":["السكر الذائب","الخبز (النشا)","الماء","اللحم والبيض (البروتين)"],"answer":3,"explanation":"حمض المعدة وعصاراتها تبدأ تكسير البروتين، الذي يكثر في اللحم والبيض.","feedback_by_option":{"0":"السكر الذائب لا يبدأ تكسيره في المعدة.","1":"النشا يبدأ هضمه في الفم باللعاب.","2":"الماء لا يحتاج هضماً."}}},{"id":"U06.L02.A2.c","objective":"U06.L02.O2","level":"A","type":"explain_open","prompt":"لماذا تُطلق المعدة الطعام دفعات صغيرة لا دفعة واحدة؟","answer":"حتى تهضم الأمعاء كل دفعة قبل التالية ولا تغرق.","rubric":"R1"},{"id":"U06.L02.A3.a","objective":"U06.L02.O3","level":"A","type":"choose_reason","prompt":"لماذا لا يذيب الحمض جدار المعدة؟","options":["لأن المخاط يحميه وخلاياه تتجدد","لأن الحمض ضعيف","لأن الجدار معدن","لأن الطعام يمتص الحمض"],"answer":0,"explanation":"المخاط يحمي جدار المعدة من الحمض، وخلايا الجدار تتجدد.","feedback_by_option":{"1":"حمض المعدة قوي؛ الذي يحمي الجدار طبقة المخاط، وخلاياه التي تتجدد.","2":"جدار المعدة عضلة حية لا معدن.","3":"الحمض يبقى في المعدة ممتلئة وفارغة؛ والحماية من طبقة على الجدار."},"detects":"M56","alt":{"prompt":"لماذا تقرقر المعدة الفارغة؟","options":["لأنها تأكل نفسها حين لا تجد طعاماً تهضمه فيها","موجات عضلية تحرّك ما فيها من هواء وسائل","لأن الحمض يغلي","لأن القلب يدق فيها"],"answer":1,"explanation":"القرقرة صوت موجات عضلية تحرّك الهواء والسائل في المعدة والأمعاء؛ والمخاط يحمي الجدار دائماً.","feedback_by_option":{"0":"المخاط يحميها ممتلئة وفارغة؛ فلا تأكل نفسها.","2":"الحمض لا يغلي؛ الصوت من حركة عضلات.","3":"القلب في الصدر؛ والقرقرة في البطن من المعدة والأمعاء."},"detects":"M56"}},{"id":"U06.L02.A3.b","objective":"U06.L02.O3","level":"A","type":"true_false_why","prompt":"«المعدة الفارغة تأكل نفسها فتقرقر». صح أم خطأ؟","answer":"خطأ؛ القرقرة موجات عضلية وهواء؛ الحماية قائمة دائماً.","rubric":"R1","alt":{"prompt":"«خلايا جدار المعدة تتجدد باستمرار، وهذا جزء من حمايتها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ مع طبقة المخاط، تتجدد خلايا الجدار باستمرار، فيبقى سليماً رغم الحمض."}},{"id":"U06.L02.A3.c","objective":"U06.L02.O3","level":"A","type":"explain_open","prompt":"ماذا يحدث لو ضعفت طبقة المخاط؟ ومن يعالج ذلك؟","answer":"يلمس الحمض الجدار فيؤلم (قرحة)؛ الطبيب يعالج — لا نخاف ولا نعالج أنفسنا.","rubric":"R1"},{"id":"U06.L02.A4.a","objective":"U06.L02.O4","level":"A","type":"choose_reason","prompt":"لماذا يأكل من يأكل سريعاً أكثر من حاجته؟","options":["لأن الطعام ألذ سريعاً","لأن إشارة الشبع تصل الدماغ متأخرة دقائق","لأن المعدة تصغر","لأن اللعاب يقل"],"answer":1,"explanation":"إشارة الشبع تصل الدماغ متأخرة دقائق، فمن يأكل سريعاً يأكل أكثر من حاجته قبل أن تصل.","detects":"M57","feedback_by_option":{"0":"اللذة ليست السبب؛ المشكلة في توقيت إشارة الشبع.","2":"المعدة لا تصغر بالأكل السريع؛ الإشارة تتأخر.","3":"قلة المضغ قد تقلل اللعاب، لكن السبب الأهم تأخر إشارة الشبع."},"alt":{"prompt":"لماذا يُنصح بالانتظار دقائق قبل أخذ صحن ثانٍ؟","options":["لأن الطعام يبرد","لأن المعدة تحتاج أن تفرغ تماماً أولاً","لأن إشارة الشبع تصل الدماغ متأخرة دقائق","لأن الأسنان تتعب"],"answer":2,"explanation":"إشارة الشبع تصل الدماغ متأخرة دقائق؛ فإذا انتظرنا قليلاً عرفنا هل نحتاج طعاماً أكثر حقاً.","feedback_by_option":{"0":"حرارة الطعام ليست السبب؛ المهم توقيت إشارة الشبع.","1":"المعدة لا تفرغ في دقائق؛ لكن إشارة الشبع تحتاج دقائق لتصل.","3":"الأسنان لا تتعب في وجبة؛ السبب توقيت إشارة الشبع."},"detects":"M57"}},{"id":"U06.L02.A4.b","objective":"U06.L02.O4","level":"A","type":"explain_open","prompt":"اذكر{|ي} فعلين عمليين على المائدة يناسبان معدتك{|ِ}، ولماذا.","answer":"الأكل على مهل (وقت للإشارة)، والتوقف قبل الامتلاء (مجال للخلط وبلا ثقل)، وعدم الأكل والفم ملآن.","rubric":"R1"},{"id":"U06.L02.A4.c","objective":"U06.L02.O4","level":"A","type":"true_false_why","prompt":"«التخمة تجعلني أنشط لأن الوقود كثير». صح أم خطأ؟","answer":"خطأ؛ التخمة تُثقل الهضم وتُنعس وتُضعف التركيز.","rubric":"R1","alt":{"prompt":"«الأكل على مهل والتوقف قبل الامتلاء يناسبان المعدة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ البطء يعطي إشارة الشبع وقتها، والتوقف قبل الامتلاء يترك مجالاً للخلط ويمنع الثقل."}},{"id":"U06.L02.A5.a","objective":"U06.L02.O5","level":"B","type":"choose","prompt":"الحرقة في الصدر بعد وجبة كبيرة سببها غالباً:","options":["الرئة؛ امتلأت بالهواء بعد الأكل فضغطت على الصدر","القلب؛ تعب من الوجبة الكبيرة فأحرق الصدر","ارتخاء الصمام العلوي فعاد الحمض إلى المريء","الأسنان؛ مضغت كثيراً فتعب الصدر"],"answer":2,"explanation":"إذا ارتخى الصمام العلوي بعد وجبة كبيرة عاد بعض الحمض إلى المريء، فنحسّ حرقة في الصدر.","feedback_by_option":{"0":"الرئتان لا تمتلئان بسبب الأكل؛ الحرقة من شيء عاد من المعدة.","1":"القلب لا يُحرق الصدر بعد الأكل؛ الحرقة من المريء.","3":"المضغ لا يتعب الصدر؛ الحرقة من حمض عاد إلى المريء."},"alt":{"prompt":"ما عمل الصمام في أسفل المعدة؟","options":["يُطلق الطعام إلى الأمعاء دفعات صغيرة","يمنع عودة الحمض إلى المريء","يُدخل الطعام إلى المعدة","يصنع الحمض"],"answer":0,"explanation":"الصمام السفلي يُطلق الطعام إلى الأمعاء دفعات صغيرة، والعلوي يمنع عودة الحمض إلى المريء.","feedback_by_option":{"1":"هذا عمل الصمام العلوي.","2":"الطعام يدخل المعدة من أعلاها، من المريء.","3":"الحمض تصنعه خلايا في جدار المعدة، لا الصمام."}}},{"id":"U06.L02.A5.b","objective":"U06.L02.O5","level":"B","type":"explain_open","prompt":"لماذا يؤلم الحمض المريء ولا يؤلم المعدة؟","answer":"المريء بلا طبقة مخاط سميكة كالمعدة.","rubric":"R1"},{"id":"U06.L02.A5.c","objective":"U06.L02.O5","level":"B","type":"true_false_why","prompt":"«الصمام السفلي يفتح مرة واحدة فتفرغ المعدة كلها». صح أم خطأ؟","answer":"خطأ؛ دفعات صغيرة متتابعة خلال ساعات.","rubric":"R1","alt":{"prompt":"«إذا ارتخى الصمام العلوي بعد وجبة كبيرة، قد يعود الحمض إلى المريء فنحسّ حرقة». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الصمام العلوي يمنع عودة الحمض، والمريء بلا طبقة مخاط سميكة كالمعدة، فيؤلمه الحمض."}},{"id":"U06.L02.A6.a","objective":"U06.L02.O6","level":"B","type":"choose","prompt":"كيف عرف بومونت أن الحمض يهضم اللحم كيميائياً؟","options":["بالتخمين ثم كتب ما ظنه في كتاب","بالأشعة التي صوّر بها المعدة من الخارج فرأى الطعام يذوب داخلها","بقراءة كتب جالينوس ونقل ما فيها","بإدخال طعام من فتحة المعدة وإخراجه، وتجريب عصارتها في كوب"],"answer":3,"explanation":"أدخل بومونت الطعام من فتحة في المعدة وأخرجه ليرى ما حدث له، وجرّب عصارتها في كوب خارج الجسم.","feedback_by_option":{"0":"العلم لا يُبنى على التخمين؛ بومونت جرّب ولاحظ.","1":"الأشعة لم تكن موجودة في زمن بومونت؛ اكتُشفت بعده بنحو سبعين سنة.","2":"بومونت لاحظ بنفسه بدل أن ينقل عن الكتب."},"alt":{"prompt":"ماذا فعل بومونت ليرى عمل عصارة المعدة خارج الجسم؟","options":["أخذ عصارة من المعدة ووضع فيها طعاماً في كوب","صوّر المعدة بالأشعة","سأل المريض عما يشعر به فقط","قرأ عن ذلك في الكتب القديمة"],"answer":0,"explanation":"أخذ بومونت عصارة المعدة ووضع فيها طعاماً في كوب فرآها تهضمه خارج الجسم؛ فعرف أن في الهضم عملاً كيميائياً.","feedback_by_option":{"1":"الأشعة لم تكن موجودة في زمنه.","2":"ما يشعر به المريض لا يكفي؛ بومونت لاحظ وجرّب.","3":"بومونت جرّب ولاحظ بنفسه بدل أن ينقل."}}},{"id":"U06.L02.A6.b","objective":"U06.L02.O6","level":"B","type":"explain_open","prompt":"ما القاعدة الأخلاقية التي نتعلمها من قصة سان مارتن؟","answer":"لا تجربة على إنسان إلا برضاه الحر الواضح؛ الفائدة العلمية لا تلغي حق الإنسان.","rubric":"R1"},{"id":"U06.L02.A6.c","objective":"U06.L02.O6","level":"B","type":"choose","prompt":"لاحظ بومونت الهضم في معدة رجل واحد. ماذا نحتاج لنعمّم ما رآه على كل الناس؟","answer":0,"options":["تكرار الملاحظة عند أناس آخرين","أن يكون الرجل قوياً سليماً","أن نصدّقه لأنه طبيب مشهور","لا شيء؛ حالة واحدة تكفي دائماً"],"explanation":"الملاحظة المباشرة قوية، لكن حالة واحدة قد تختلف عن غيرها؛ التكرار عند أناس آخرين هو ما يسمح بالتعميم.","feedback_by_option":{"1":"قوته لا تجعله يشبه كل الناس؛ نحتاج ملاحظات عند غيره.","2":"الشهرة ليست دليلاً؛ الدليل تكرار الملاحظة.","3":"حالة واحدة قد تختلف عن غيرها؛ التكرار هو ما يسمح بالتعميم."},"alt":{"prompt":"لاحظ طفل أن قطته تأكل أكثر في الشتاء. ماذا يحتاج قبل أن يقول: «كل القطط تأكل أكثر في الشتاء»؟","options":["أن يصدّقه أبوه","أن تكون قطته سمينة","أن يلاحظ قططاً أخرى كثيرة","أن يلاحظ قطته وقتاً أطول في الشتاء نفسه"],"answer":2,"explanation":"حالة واحدة قد تختلف عن غيرها؛ التعميم يحتاج تكرار الملاحظة عند أفراد كثيرين، كما احتاج العلماء بعد بومونت.","feedback_by_option":{"0":"التصديق ليس دليلاً؛ الدليل تكرار الملاحظة.","1":"حال قطة واحدة لا يكفي لتعميم على القطط كلها.","3":"قطة واحدة قد تختلف عن غيرها؛ التعميم يحتاج تكراراً."}}}],"transfer":[{"id":"U06.L02.T1","objective":"U06.L02.O1","type":"explain_open","prompt":"كيف تشرب الزرافة الماء ورأسها أخفض من معدتها بأمتار؟","answer":"بالحركة الدودية في مريئها الطويل؛ الموجة تدفع الماء إلى أعلى ضد الجاذبية.","level":"A","rubric":"R1"},{"id":"U06.L02.T2","objective":"U06.L02.O4","type":"explain_open","prompt":"في وليمة كبيرة يقول الجميع «كل، كل!». ماذا تفعل{|ين} بأدب وبعلم؟","answer":"أشكر وآكل على مهل وأتوقف قبل الامتلاء وأقول إني اكتفيت؛ إشارة الشبع تتأخر والتخمة تُثقل.","level":"B","rubric":"R1"}],"recall":[{"id":"U06.L02.D1","objective":"U06.L02.O1","type":"choose","prompt":"يتحرك الطعام في المريء بـ:","options":["الجاذبية","موجة عضلية","الهواء"],"answer":1,"explanation":"موجة عضلية تدفع الطعام في المريء.","level":"A","detects":"M54","feedback_by_option":{"0":"لو كانت الجاذبية لما بلعنا ونحن مستلق
