const LD = {"id":"U02.T03","lesson":"U02.L03","first":false,"title":"اختبار: العضلات تسحب ولا تدفع","lessonTitle":"العضلات تسحب ولا تدفع","concepts":[],"check":[],"items":[{"id":"U02.L03.A1.a","objective":"U02.L03.O1","type":"true_false_why","prompt":"«العضلة تدفع العظم لتمدّ الذراع». صح أم خطأ؟","answer":"خطأ؛ العضلة تسحب فقط؛ المدّ بسحب العضلة المقابلة.","level":"A","detects":"M01","rubric":"R1","alt":{"prompt":"«حين {تمدّ|تمدّين} ذراعك{|ِ} تسحب العضلة الخلفية عظم الساعد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ العضلة تسحب فقط، والمدّ بسحب العضلة التي خلف العضد.","detects":"M01"}},{"id":"U02.L03.A1.b","objective":"U02.L03.O1","type":"choose","prompt":"ما الذي ينقل سحب العضلة إلى العظم؟","answer":1,"explanation":"الوتر يربط العضلة بالعظم، فينقل سحبها إليه.","level":"A","options":["الرباط","الوتر","الغضروف","الجلد"],"feedback_by_option":{"0":"الرباط يربط عظماً بعظم، ولا يتصل بالعضلة.","2":"الغضروف يغطي نهايتي العظمين عند المفصل، ولا يتصل بالعضلة.","3":"الجلد يغطي الجسم من الخارج، ولا ينقل سحب العضلة."},"alt":{"prompt":"حين تنقبض العضلة أمام العضد يُسحب عظم الساعد. ما الذي يصل بينهما؟","options":["غضروف المفصل","رباط بين عظمين","عظم صغير بينهما","وتر في طرف العضلة"],"answer":3,"explanation":"في طرف العضلة وتر متين يتصل بالعظم، فينقل سحبها إليه.","feedback_by_option":{"0":"غضروف المفصل يغطي نهايتي العظمين، ولا يتصل بالعضلة.","1":"الرباط يربط عظماً بعظم؛ والسؤال عما يصل العضلة بالعظم.","2":"لا عظم بين العضلة والعظم الذي تسحبه؛ الذي يصلهما حبل متين في طرف العضلة."}}},{"id":"U02.L03.A1.c","objective":"U02.L03.O1","type":"sequence","prompt":"رتّب{|ي} ما يحدث عند ثني المرفق.","answer":[0,1,2,3],"explanation":"تبدأ الحركة بالعضلة: تنقبض فتقصر، فتسحب الوتر، فيُسحب عظم الساعد، فينثني المرفق.","level":"A","options":["العضلة تنقبض وتقصر","الوتر يُسحب","عظم الساعد يُسحب","المرفق ينثني"],"alt":{"prompt":"رتّب{|ي} ما يحدث عند مدّ المرفق.","options":["العضلة خلف العضد تنقبض وتقصر","وترها يُسحب","عظم الساعد يُسحب من خلف المرفق","المرفق يمتد"],"answer":[0,1,2,3],"explanation":"المدّ سحب أ  والمعدة في جدارها عضلات ملساء.","feedback_by_option":{"0":"القلب عضلة كله، وفي جدار المعدة والأمعاء عضلات ملساء؛ العضلات ليست في الأطراف فقط.","2":"المعدة تتحرك وتخلط الطعام بعضلات ملساء في جدارها.","3":"عضلات القلب والمعدة تعمل دون أمر منا؛ العضلة الإرادية نوع واحد من ثلاثة."},"level":"A","options":["العضلات في الأطراف، والقلب ليس عضلة","القلب عضلة والمعدة فيها عضلات ملساء","المعدة ليس فيها عضلات","كل العضلات إرادية"],"detects":"M39","alt":{"prompt":"أين توجد عضلات في جسمك{|ِ}؟","options":["في الذراعين والساقين والقلب والمعدة والأمعاء","في الذراعين والساقين والظهر، والقلب ليس عضلة","في الذراعين، والساقان تحركهما العظام بلا عضلات","في القلب والمعدة، أما الذراعان والساقان فتحركها المفاصل"],"answer":0,"explanation":"العضلات في الجسم كله: هيكلية في الذراعين والساقين، وقلبية في القلب، وملساء في جدار المعدة والأمعاء.","feedback_by_option":{"1":"القلب عضلة كله، وفي جدار المعدة والأمعاء عضلات ملساء.","2":"الساقان فيهما عضلات قوية، والقلب عضلة كله.","3":"القلب عضلة، وفي ذراعيك{|ِ} وساقيك{|ِ} عضلات أيضاً."},"detects":"M39"}},{"id":"U02.L03.A3.b","objective":"U02.L03.O3","type":"choose","prompt":"تصنيف الحركات: ثني الذراع / هضم الطعام / نبض القلب:","answer":2,"explanation":"ثني الذراع بإرادتنا فعضلاته هيكلية، والهضم بعضلات ملساء، ونبض القلب بعضلة قلبية.","level":"A","options":["ملساء / هيكلية / قلبية","قلبية / ملساء / هيكلية","هيكلية / ملساء / قلبية"],"feedback_by_option":{"0":"ثني الذراع بإرادتك{|ِ}، فعضلاته ليست ملساء؛ والهضم لا {تأمره|تأمرينه}.","1":"العضلة القلبية في القلب وحده، لا في الذراع."},"alt":{"prompt":"صنّف{|ي}: نبض القلب / الركض / حركة الأمعاء:","options":["هيكلية / ملساء / قلبية","قلبية / هيكلية / ملساء","ملساء / قلبية / هيكلية"],"answer":1,"explanation":"نبض القلب بعضلة قلبية، والركض بعضلات هيكلية إرادية، وحركة الأمعاء بعضلات ملساء.","feedback_by_option":{"0":"الأول نبض القلب: أي عضلة تصنعه؟","2":"الركض بإرادتك{|ِ}، فعضلاته هيكلية لا قلبية."}}},{"id":"U02.L03.A3.c","objective":"U02.L03.O3","type":"explain_open","prompt":"اذكر{|ي} عضلة تعمل وأنت{|ِ} نائم{|ة} و استعمال وتضعف بقلته، كما رأينا في الذراع التي خرجت من الجبيرة.","3":"الطعام يعطي العضلة ما تُبنى به، لكن البناء نفسه يحدث في الراحة والنوم."},"alt":{"prompt":"لاعب يتمرن كل يوم بقوة ولا ينام إلا قليلاً. ماذا يحدث لعضلاته غالباً؟","options":["لا يتغير شيء، فالنوم لا علاقة له بالعضلات","تقوى أسرع، لأن تمرينه أكثر","تتحول إلى دهن","لا تقوى كما ينبغي، لأن البناء يحتاج راحة ونوماً"],"answer":3,"explanation":"التمرين يُجهد العضلة، والبناء يحدث في الراحة والنوم بعده؛ فمن لا ينام كفايته لا تقوى عضلاته كما ينبغي.","feedback_by_option":{"0":"النوم جزء من بناء العضلة: فيه تُبنى وتقوى.","1":"التمرين وحده لا يكفي: البناء يحدث في الراحة والنوم، فقلة النوم تبطئه.","2":"العضلة لا تتحول إلى دهن؛ هما نسيجان مختلفان."}}}],"transfer":[{"id":"U02.L03.T1","objective":"U02.L03.O2","type":"explain_open","prompt":"ساق الدجاجة في الطبق: اللحم عضلات، والخيوط البيضاء القوية أوتار. أين تتوقع{|ين} العضلة التي تثني ركبة الدجاجة والتي تمدّها؟","answer":"واحدة في جهة وواحدة في الجهة المقابلة من العظم؛ المبدأ نفسه.","level":"A","rubric":"R1"},{"id":"U02.L03.T2","objective":"U02.L03.O1","type":"explain_open","prompt":"في الرافعة الهيدروليكية ذراع تُدفع بأسطوانة. كيف يختلف هذا عن ذراعك{|ِ}؟","answer":"الآلة تدفع؛ الجسم يسحب فقط ويحتاج زوجاً.","level":"B","rubric":"R1"}],"recall":[{"id":"U02.L03.D1","objective":"U02.L03.O1","type":"choose","prompt":"العضلة:","answer":1,"explanation":"العضلة تسحب ولا تدفع.","level":"A","options":["تدفع","تسحب"],"feedback_by_option":{"0":"العضلة لا تدفع أبداً. حين تمدّ{|ين} ذراعك{|ِ} تسحب عضلة من الجهة الأخرى."}},{"id":"U02.L03.D2","objective":"U02.L03.O2","type":"choose","prompt":"لمدّ المرفق تعمل:","answer":0,"explanation":"لمدّ المرفق تسحب العضلة الخلفية، لأن الأمامية لا تستطيع الدفع.","level":"A","options":["العضلة الخلفية","العضلة الأمامية"],"feedback_by_option":{"1":"الأمامية تثني المرفق بالسحب، ولا تستطيع الدفع. فمن يسحب ليمدّه؟"}},{"id":"U02.L03.D3","objective":"U02.L03.O4","type":"choose","prompt":"الوتر يربط:","answer":1,"explanation":"الوتر يربط العضلة بالعظم.","level":"B","options":["عظماً بعظم","عضلة بعظم"],"feedback_by_option":{"0":"الذي يربط عظماً بعظم هو الرباط. والوتر في طرف العضلة."}},{"id":"U02.L03.D4","objective":"U02.L03.O3","level":"A","type":"choose","prompt":"أي عضلة {تحرّكها|تحرّكينها} بإرادتك{|ِ}؟","options":["عضلات الأوعية الدموية","عضلة القلب","عضلات المعدة","عضلة الفخذ"],"answer":3,"explanation":"عضلة الفخذ هيكلية إرادية: تتحرك حين {تأمرها|تأمرينها}. أما القلب والمعدة والأوعية فعضلاتها تعمل دون أمر منا.","feedback_by_option":{"0":"عضلات الأوعية ملساء لا إرادية؛ لا {تأمرها|تأمرينها}.","1":"القلب يعمل ليلاً ونهاراً دون أمرك{|ِ}.","2":"عضلات المعدة ملساء، تعمل دون أمرك{|ِ}."}}]};
