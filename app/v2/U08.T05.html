const LD = {"id":"U08.T05","lesson":"U08.L05","first":false,"title":"اختبار: الذاكرة والنوم","lessonTitle":"الذاكرة والنوم","concepts":[],"check":[],"items":[{"id":"U08.L05.A1.a","objective":"U08.L05.O1","level":"A","type":"choose","prompt":"ما أول ما يلزم لنتذكر شيئاً؟","options":["أن نقرأه ونحن نلعب","أن ننتبه إليه","أن ننام قبل أن نراه","أن نكتبه بلون أحمر"],"answer":1,"explanation":"بلا انتباه لا تبدأ الذكرى؛ ثم يثبّتها الدماغ ونسترجعها.","feedback_by_option":{"0":"اللعب يأخذ الانتباه.","2":"النوم يثبّت ما تعلمناه قبله، لا ما لم نره.","3":"اللون قد يلفت النظر، لكن الأساس الانتباه."},"alt":{"prompt":"أيّ مراحل الذاكرة يحدث كثير منها في النوم؟","options":["الانتباه","الاسترجاع","التثبيت","القراءة"],"answer":2,"explanation":"في النوم يعيد الدماغ تنشيط الذكريات فيثبّتها.","feedback_by_option":{"0":"الانتباه يكون ونحن مستيقظون نتعلم.","1":"نسترجع حين نحتاج المعلومة، ونحن مستيقظون.","3":"القراءة جزء من التعلم في النهار."}}},{"id":"U08.L05.A1.b","objective":"U08.L05.O1","level":"A","type":"true_false_why","prompt":"«نتذكر ما انتبهنا إليه أكثر مما مرّ بنا ونحن مشغولون بغيره». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الانتباه أول مراحل صنع الذكرى، وما يمرّ بلا انتباه يضيع غالباً.","rubric":"R1","alt":{"prompt":"«الذكرى تثبت في لحظة التعلم، ولا تحتاج وقتاً بعده». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ التثبيت يمتد دقائق وساعات وأياماً، وكثير منه في النوم."}},{"id":"U08.L05.A1.c","objective":"U08.L05.O1","level":"A","type":"choose_reason","prompt":"لماذا {تتذكر|تتذكرين} اسم صديق جديد أكثر إذا {ناديته|ناديتِه} به عدة مرات في اليوم؟","options":["لأن الاسم صار أقصر","لأن الصديق صار أطول","لأن الأسماء كلها تبقى في الذاكرة إلى الأبد","لأن كل استرجاع للاسم يقوّي ذكراه"],"answer":3,"explanation":"كل مرة {تُخرج|تُخرجين} فيها الاسم من ذاكرتك{|ِ} تقوى ذكراه.","feedback_by_option":{"0":"الاسم لم يتغير؛ ذكراه هي التي قويت.","1":"طول الصديق لا علاقة له بالذاكرة.","2":"الأسماء تُنسى أيضاً إن لم نستعملها."},"alt":{"prompt":"لماذا {تنسى|تنسين} أين {وضعت|وضعتِ} المفتاح إذا {وضعته|وضعتِه} وأنت{|ِ} {تتكلم|تتكلمين} في الهاتف؟","options":["لأن الانتباه كان في المكالمة","لأن المفتاح صغير","لأن الهاتف يمسح ما في الذاكرة من كلمات","لأن اليد لا تتذكر"],"answer":0,"explanation":"بلا انتباه لا تبدأ الذكرى.","feedback_by_option":{"1":"الصغير يُتذكر إن انتبهنا إليه.","2":"الهاتف لا يمسح الذاكرة؛ يأخذ الانتباه.","3":"الدماغ هو الذي يتذكر، والانتباه كان في مكان آخر."}}},{"id":"U08.L05.A2.a","objective":"U08.L05.O2","level":"A","type":"choose","prompt":"أيّ هذه يصف النسيان بعد الحفظ؟","options":["سريع في البداية ثم يبطؤ","بطيء في البداية ثم يسرع جداً","بالسرعة نفسها كل يوم","لا يحدث إلا للكبار"],"answer":0,"explanation":"هذا منحنى النسيان الذي رسمه إبنغهاوس.","feedback_by_option":{"1":"العكس: أكثره في البداية.","2":"يتغير: سريع ثم بطيء.","3":"ينسى الصغار والكبار."},"alt":{"prompt":"لماذا قد يتذكر صديقان رحلة واحدة بتفاصيل مختلفة؟","options":["لأن أحدهما يكذب دائماً","لأن الذاكرة تعيد بناء ما حدث من أجزاء","لأن الرحلة نفسها تغيّرت بعد أن انتهت بأيام","لأن الذاكرة كاميرا"],"answer":1,"explanation":"الدماغ يبني الذكرى من أجزاء حين نتذكر، فقد يختلط فيها شيء.","feedback_by_option":{"0":"قد يكون كلاهما صادقاً؛ الذاكرة تخطئ.","2":"الرحلة انتهت؛ الذكرى هي التي تختلف.","3":"لو كانت كاميرا لتطابقت الروايتان."},"detects":"M95"}},{"id":"U08.L05.A2.b","objective":"U08.L05.O2","level":"A","type":"true_false_why","prompt":"«الذاكرة كالكاميرا: تحفظ كل شيء كما حدث تماماً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الدماغ يعيد بناء الذكرى من أجزاء حين نتذكر، فقد يخطئ أو ينسى.","rubric":"R1","detects":"M95","alt":{"prompt":"«نسيان بعض التفاصيل أمر طبيعي يحدث لكل الناس». صح أم خطأ؟ ولماذا؟","answer":"صح؛ النسيان طبيعي، ويترك ما لا نحتاجه، والمراجعة تحفظ ما نحتاجه."}},{"id":"U08.L05.A2.c","objective":"U08.L05.O2","level":"A","type":"explain_open","prompt":"وجدت{|ِ} أنك{|ِ} {نسيت|نسيتِ} نصف الكلمات بعد يوم. هل ذاكرتك{|ِ} ضعيفة؟ {فسّر|فسّري} بما تعلّمت{|ِ}.","answer":"لا؛ النسيان طبيعي وأسرعه في الساعات الأولى بعد الحفظ، ثم يبطؤ؛ والاسترجاع والمراجعة المتباعدة والنوم الكافي تقلله.","rubric":"R1"},{"id":"U08.L05.A3.a","objective":"U08.L05.O3","level":"A","type":"choose","prompt":"كم ساعة نوم يحتاجها طفل في التاسعة من عمره في اليوم؟","options":["من 6 إلى 7","من 7 إلى 8","من 9 إلى 12","أكثر من 14"],"answer":2,"explanation":"من 9 إلى 12 ساعة لطفل بين 6 و12 سنة.","feedback_by_option":{"0":"هذا قليل جداً لطفل.","1":"هذا أقل من حاجته.","3":"هذا أكثر من حاجة طفل في التاسعة."},"alt":{"prompt":"ماذا يفعل الدماغ في النوم؟","options":["ينطفئ تماماً حتى الصباح","يعيد تنشيط ذكريات اليوم ويقوّيها","يمسح كل ما تعلمناه في النهار ليبدأ من جديد","يتوقف عن التحكم في التنفس"],"answer":1,"explanation":"النوم وقت عمل مهم للدماغ، ومنه تثبيت الذاكرة.","feedback_by_option":{"0":"الدماغ نشيط في النوم.","2":"بل يقوّي ما تعلمناه.","3":"الدماغ يبقى يتحكم في التنفس ونحن نائمون."},"detects":"M93"}},{"id":"U08.L05.A3.b","objective":"U08.L05.O3","level":"A","type":"true_false_why","prompt":"«قلة النوم تجعل الانتباه في الصف أصعب». صح أم خطأ؟ ولماذا؟","answer":"صح؛ من قلّ نومه صعب عليه التركيز والتعلم وضبط مشاعره.","rubric":"R1","alt":{"prompt":"«من سهر ليلة بعد التعلم يعوّض كل شيء بنوم طويل في الليلة التالية». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ في تجربة على طلاب بقي أثر السهر في الحفظ حتى بعد ليلة نوم تعويضية؛ والأفضل نوم كافٍ كل ليلة."}},{"id":"U08.L05.A3.c","objective":"U08.L05.O3","level":"A","type":"choose_reason","prompt":"امتحانك{|ِ} غداً. أيّ الخطط أنفع؟","options":["أسهر حتى الفجر أقرأ الدرس مرة بعد مرة","لا أراجع شيئاً ولا أنام","أنام في الصف أثناء الامتحان","أسأل نفسي في الدرس ثم أنام نوماً كافياً"],"answer":3,"explanation":"الاسترجاع يقوّي الذكرى، والنوم بعده يثبّتها، والنائم جيداً ينتبه في الامتحان.","feedback_by_option":{"0":"السهر يضعف الانتباه، وإعادة القراءة أضعف من الاسترجاع.","1":"بلا مراجعة ولا نوم تضعف الذاكرة والانتباه.","2":"النوم في الليل لا في الامتحان."},"detects":"M94","alt":{"prompt":"لماذا ننام بعد أن نتعلم شيئاً جديداً؟","options":["لأن النوم يثبّت ما تعلمناه","لأن الدماغ ينطفئ فيرتاح","لأن النوم يمسح الدرس","لأن الأحلام تعلّمنا الدرس كاملاً"],"answer":0,"explanation":"في النوم يحدث كثير من تثبيت الذاكرة.","feedback_by_option":{"1":"الدماغ لا ينطفئ في النوم.","2":"بل يقوّيه.","3":"الأحلام لا تعلّمنا الدرس؛ الدماغ يثبّت ما تعلمناه قبل النوم."},"detects":"M93"}},{"id":"U08.L05.A4.a","objective":"U08.L05.O4","level":"A","type":"choose","prompt":"{تريد|تريدين} أن {تحفظ|تحفظي} عشر كلمات جديدة. أيّ طريقة تنفع أكثر؟","options":["قراءتها عشر مرات متتالية بصوت مرتفع","تظليلها بالأصفر","إخفاؤها ثم محاولة كتابتها","النظر إليها قبل النوم دقيقة"],"answer":2,"explanation":"الاسترجاع أنفع من إعادة القراءة والتظليل.","feedback_by_option":{"0":"إعادة القراءة أضعف من الاسترجاع.","1":"التظليل وحده لا يكفي.","3":"النظر دقيقة لا يقوّي الذكرى كالاسترجاع."},"detects":"M96","alt":{"prompt":"ما المراجعة المتباعدة؟","options":["مراجعة الدرس كله في ليلة واحدة","مراجعة على أيام متفرقة","مراجعة وأنا بعيد عن المكتب","مراجعة الدروس الصعبة فقط"],"answer":1,"explanation":"أن نراجع بعد يوم، ثم بعد أيام، لا كل شيء مرة واحدة.","feedback_by_option":{"0":"هذا عكس التباعد.","2":"التباعد في الأيام لا في المكان.","3":"نراجع كل ما نحتاجه على أيام."}}},{"id":"U08.L05.A4.b","objective":"U08.L05.O4","level":"A","type":"true_false_why","prompt":"«ترك الشاشات قبل النوم بساعة يساعد على النوم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ ضوء الشاشات قد يعطّل هرمون النوم، والألعاب المثيرة ترفع النبض فتؤخر النوم.","rubric":"R1","alt":{"prompt":"«إعادة قراءة الدرس مرات كثيرة أنفع من أن أختبر نفسي فيه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الاسترجاع أنفع من إعادة القراءة، لأن إخراج المعلومة بنفسي يقوّي ذكراها.","detects":"M96"}},{"id":"U08.L05.A4.c","objective":"U08.L05.O4","level":"A","type":"explain_open","prompt":"أخوك{|ِ} يحفظ سورة جديدة وينساها بعد أيام. {اقترح|اقترحي} عليه خطة بالعلم، {واذكر|واذكري} ما يرشد إليه الحديث.","answer":"يقرأ جزءاً ثم يغلق المصحف ويسمّع لنفسه ويتحقق، ويراجع بعد يوم ثم بعد ثلاثة أيام ثم بعد أسبوع، وينام نوماً كافياً. والنبي ﷺ أمر بتعاهد القرآن لأنه يتفلت ممن تركه.","rubric":"R2"},{"id":"U08.L05.A5.a","objective":"U08.L05.O5","level":"B","type":"choose","prompt":"ما الجزء الذي يساعد على صنع الذكريات الجديدة؟","options":["المخيخ","الحُصين","جذع الدماغ","الحبل الشوكي"],"answer":1,"explanation":"الحُصين، في عمق الدماغ، يساعد على صنع الذكريات الجديدة.","feedback_by_option":{"0":"المخيخ للتوازن وتنسيق الحركة.","2":"جذع الدماغ للتنفس ونبض القلب.","3":"الحبل الشوكي يحمل الرسائل ويصنع المنعكسات."},"alt":{"prompt":"متى يأتي نوم الأحلام أول مرة في الليل؟","options":["قبل الاستيقاظ فقط","في أول دقيقة من النوم مباشرة","لا يأتي عند الأطفال","بعد نحو 90 دقيقة من النوم"],"answer":3,"explanation":"بعد نحو 90 دقيقة، ثم يتكرر في دورات.","feedback_by_option":{"0":"يتكرر طوال الليل، لا قبل الاستيقاظ فقط.","1":"أول الليل نوم يزداد عمقاً.","2":"الأطفال يحلمون أيضاً."}}},{"id":"U08.L05.A5.b","objective":"U08.L05.O5","level":"B","type":"choose_reason","prompt":"لماذا لا نقفز من السرير حين نحلم أننا نجري؟","options":["لأن الأحلام لا تحدث إلا ونحن مستيقظون","لأن عضلات الساقين ترتخي مؤقتاً في نوم الأحلام","لأن الدماغ ينطفئ في النوم","لأن السرير يمسكنا"],"answer":1,"explanation":"في نوم الأحلام ترتخي عضلات الذراعين والساقين مؤقتاً فلا نمثّل أحلامنا.","feedback_by_option":{"0":"الأحلام تحدث في النوم.","2":"الدماغ نشيط جداً في نوم الأحلام.","3":"السرير لا يمسكنا؛ العضلات ترتخي."},"alt":{"prompt":"لماذا يعجز من تضرر حُصيناه عن تذكّر ما حدث له اليوم مع أنه يتذكر طفولته؟","options":["لأن الحُصين يساعد على صنع الذكريات الجديدة","لأن طفولته كانت أجمل","لأن الذكريات القديمة في القلب","لأنه لا ينام أبداً"],"answer":0,"explanation":"الذكريات القديمة محفوظة، لكن صنع الجديد يحتاج الحُصين.","feedback_by_option":{"1":"الجمال لا يفسّر ذلك.","2":"الذكريات في الدماغ لا في القلب.","3":"المشكلة في صنع الذكرى، لا في النوم."}}},{"id":"U08.L05.A5.c","objective":"U08.L05.O5","level":"B","type":"true_false_why","prompt":"«يمرّ الدماغ في الليل بدورات من نوم عميق ونوم أحلام». صح أم خطأ؟ ولماذا؟","answer":"صح؛ أول نوم أحلام بعد نحو 90 دقيقة، ثم تتكرر الدورات حتى الصباح.","rubric":"R1","alt":{"prompt":"«نحلم طوال الليل من أوله إلى آخره ولا يوجد نوم غير الأحلام». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الليل دورات من نوم عميق ونوم أحلام، وأكثر الأحلام في نوم الأحلام."}},{"id":"U08.L05.A6.a","objective":"U08.L05.O6","level":"B","type":"choose","prompt":"على من أجرى إبنغهاوس تجاربه في النسيان؟","options":["على مئة طالب في جامعته","على الفئران في المختبر","على نفسه وحده","على أطفال المدارس"],"answer":2,"explanation":"كان هو وحده الشخص في تجاربه.","feedback_by_option":{"0":"لم يكن معه غيره.","1":"لم يجرّب على الحيوانات.","3":"جرّب على نفسه، وهو رجل كبير."},"alt":{"prompt":"لماذا استعمل إبنغهاوس مقاطع لا معنى لها؟","options":["ليقيس الحفظ بلا معانٍ يعرفها مسبقاً","لأنه لم يكن يعرف كلمات كثيرة في لغته","لأنها أجمل في الصوت","لأنها أطول من الكلمات"],"answer":0,"explanation":"الكلمات المعروفة يسهل حفظها لمعناها، فتفسد المقارنة.","feedback_by_option":{"1":"كان عالماً يعرف لغته جيداً.","2":"الجمال لم يكن غرضه.","3":"كل مقطع ثلاثة حروف فقط."}}},{"id":"U08.L05.A6.b","objective":"U08.L05.O6","level":"B","type":"choose_reason","prompt":"في تجربة القائمتين، ما الذي يجعل المقارنة عادلة؟","options":["قائمة سهلة للاسترجاع وقائمة أصعب منها لإعادة القراءة","وقت أطول لإعادة القراءة","اختبار قائمة غداً والأخرى بعد أسبوع","الوقت نفسه وقائمتان متشابهتان، وتتغير الطريقة وحدها"],"answer":3,"explanation":"نثبّت الوقت والقوائم والنوم ووقت الاختبار، ونغيّر طريقة الحفظ وحدها.","feedback_by_option":{"0":"قائمة أسهل تصنع فرقاً ليس من الطريقة.","1":"وقت أطول يغيّر شيئين معاً.","2":"وقت اختبار مختلف يغيّر شيئين معاً."},"alt":{"prompt":"لماذا يبدأ نصف الصف بالقائمة (أ) والنصف الآخر بالقائمة (ب)؟","options":["لأن القوائم قليلة","حتى لا تكون إحدى القائمتين أسهل فتصنع الفرق","لأن كل طفل يجب أن يحفظ عشرين كلمة في اليوم الواحد","لأن المعلم يحب التغيير"],"answer":1,"explanation":"التبادل يمنع أن يأتي الفرق من صعوبة القائمة لا من الطريقة.","feedback_by_option":{"0":"عدد القوائم ليس السبب.","2":"عدد الكلمات واحد في الحالتين.","3":"السبب علمي: العدل في المقارنة."}}},{"id":"U08.L05.A6.c","objective":"U08.L05.O6","level":"B","type":"true_false_why","prompt":"«تجربة على شخص واحد تكفي لنعرف كيف
