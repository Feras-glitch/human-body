const LD = {"id":"U05.L01","first":true,"title":"الخلية: اللبنة الحية التي لا تراها","driving_question":"قلنا في كل وحدة «الخلايا تحتاج الأكسجين». فما الخلية؟ وهل أنت{|ِ} مبني{|ة} منها كما يُبنى البيت من الطوب؟","central_fact":"كل جزء من جسمك مبني من خلايا صغيرة جداً لا تُرى إلا بالمجهر، لكل خلية غشاء وسيتوبلازم، ولأغلبها نواة، والخلايا متخصصة بأشكال تناسب أعمالها، وفي أغلبها ميتوكوندريا تُطلق الطاقة من الغذاء.","next":"U05.L02","nexts":[{"id":"U05.L02","gated":false},{"id":"U05.L03","gated":false}],"hook":{"text":"{اسم}، لو كبّرنا طرف إصبعك{|ِ} آلاف المرات، ماذا تتوقع{|ين} أن نرى: عجيناً متصلاً، أم شيئاً آخر؟","options":["عجيناً متصلاً كالصلصال","حجرات صغيرة متراصة كجدار من الطوب","فراغاً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["cell"],"highlight":["skin_cells"],"zoom":"skin_to_cell","animate":"zoom_in"},"text":"لنكبّر معاً: إصبعك{|ِ}، ثم جلده، ثم ما لا {تراه|ترينه} العين. حجرات صغيرة متراصة، كل واحدة حية: هذه الخلايا. كل جزء من جسمك{|ِ} مبني منها — الجلد والعضلة والعظم والدماغ — كما يُبنى البيت من الطوب، لكن كل طوبة هنا حية: تأكل وتتنفس وتعمل. في جسمك{|ِ} تريليونات منها، والتريليون مليون مليون. وكل كائن حي — نملة أو شجرة أو فيل — مبني من خلايا أيضاً."},{"id":"E2","level":"A","atlas":{"layers":["cell"],"highlight":["membrane","cytoplasm","nucleus"],"zoom":"cell"},"text":"لندخل خلية واحدة مكبَّرة. يحيط بها جدار رقيق نسميه غشاء الخلية؛ يحفظها ويتحكم فيما يدخل إليها — كالأكسجين والغذاء — وما يخرج منها — كالفضلات. داخلها سائل هلامي نسميه السيتوبلازم، وفيه تحدث أعمال الخلية كلها. وفي وسطها جسم أكبر نسميه النواة: فيها التعليمات التي تخبر الخلية ماذا تصنع — كدفتر وصفات لا كدماغ يفكر."},{"id":"E3","level":"A","atlas":{"layers":["cell"],"highlight":["red_cell","muscle_cell","nerve_cell","skin_cell"],"zoom":"cell_types"},"text":"هل الخلايا كلها متشابهة؟ لا. تذكّر{|ي} الكريّة الحمراء: قرص مقعّر بلا نواة، شكله يناسب حمل الأكسجين والانزلاق في الشعيرات. الخلية العضلية طويلة رفيعة تنقبض فتقصر. الخلية العصبية لها فروع طويلة تنقل الإشارات من مكان إلى مكان. خلية الجلد مسطحة تتراصّ مع أخواتها لتغطي. الشكل يناسب العمل، وفي جسمك{|ِ} نحو مئتي نوع."},{"id":"E4","level":"A","atlas":{"layers":["cell"],"highlight":["cell"],"zoom":"cell"},"text":"ولماذا لم يعرف الناس الخلايا إلا قبل 360 سنة؟ لأن الخلية أصغر من أن تراها العين — معظم خلاياك{|ِ} أصغر من عُشر مليمتر. احتاج الأمر إلى المجهر، الأداة التي عرفناها في الوحدة الأولى. ورسمنا للخلية نموذج: مكبَّر آلاف المرات، ملوّن لنميّز أجزاءه مع أنها شفافة غالباً، وساكن مع أن ما في الخلية يتحرك كل لحظة."},{"id":"E5","level":"B","atlas":{"layers":["cell"],"highlight":["mitochondria"],"zoom":"cell"},"text":"للمستوى ب: في السيتوبلازم أجسام صغيرة كثيرة محاطة بغشاء نسميها الميتوكوندريا، تُطلق من الغذاء معظم الطاقة التي تحتاجها الخلية لتعمل. الخلايا التي تعمل أكثر فيها ميتوكوندريا أكثر: خلية العضلة فيها مئات، وخلية الجلد أقل بكثير. من أين تأتي هذه الطاقة؟ ومن أين تأتي المادة الخام؟ هذا جواب السؤال الذي أجّلناه ثلاث وحدات — في الدرس القادم."},{"id":"E6","level":"B","atlas":{"layers":["cell","muscles","circulatory"],"highlight":["tissue","organ","system"],"zoom":"levels"},"text":"والآن نجمع كل ما تعلمناه في سلّم واحد. خلايا متشابهة تعمل معاً تكوّن نسيجاً: خلايا عضلية كثيرة = نسيج عضلي. أنسجة مختلفة معاً تكوّن عضواً: القلب عضلة وأوعية وأعصاب وغلاف. أعضاء تعمل معاً تكوّن جهازاً: القلب والأوعية والدم = الجهاز الدوري. وأجهزة معاً = جسمك{|ِ}. كل وحدة درسناها كانت جهازاً، واليوم نزلنا إلى الطوبة."}],"practice":[{"id":"U05.L01.P1","after":"E2","objective":"U05.L01.O2","type":"locate_on_atlas","prompt":"اضغط{|ي} على النواة في رسم الخلية.","answer":"nucleus","level":"A","atlas_target":"nucleus","feedback_wrong":"الجسم الأكبر في وسط الخلية؛ فيه تعليمات الخلية."},{"id":"U05.L01.P2","objective":"U05.L01.O2","type":"choose_reason","prompt":"ما الذي يتحكم فيما يدخل الخلية وما يخرج منها؟","options":["النواة","السيتوبلازم","غشاء الخلية","الدم"],"answer":2,"explanation":"غشاء الخلية يحيط بها من الخارج، فهو الذي يتحكم فيما يدخلها وما يخرج منها.","level":"A","feedback_wrong":"ما الذي يحيط بالخلية من الخارج؟","feedback_by_option":{"0":"النواة تحفظ التعليمات في داخل الخلية.","1":"السيتوبلازم داخل الخلية؛ والذي يتحكم في الدخول والخروج على حدودها.","3":"الدم خارج الخلية، يحمل إليها ما تحتاجه؛ والذي يتحكم في الدخول على حدودها."}},{"id":"U05.L01.P3","objective":"U05.L01.O3","type":"choose","prompt":"خلية طويلة رفيعة تقصر حين تعمل. ما هي؟","options":["كريّة حمراء","خلية جلد","خلية عصبية","خلية عضلية"],"answer":3,"explanation":"الخلية العضلية طويلة رفيعة، وحين تعمل تقصر فتنقبض العضلة.","level":"A","feedback_wrong":"أي نسيج تعلمنا أنه ينقبض فيقصر؟","feedback_by_option":{"0":"الكريّة الحمراء قرص صغير يحمل الأكسجين.","1":"خلية الجلد مسطحة تغطي.","2":"الخلية العصبية متفرعة تنقل الإشارات، ولا تقصر لتحرّك شيئاً."}},{"id":"U05.L01.P4","objective":"U05.L01.O1","type":"choose_reason","prompt":"لماذا لا {ترى|ترين} خلايا جلدك{|ِ} حين تنظر{|ين} إلى يدك{|ِ}؟","options":["لأنها أصغر من أن تراها العين وتحتاج مجهراً","لأنها غير موجودة في الجلد","لأنها شفافة فقط","لأنها تختبئ تحت الجلد"],"answer":0,"explanation":"خلايا الجلد أصغر من أن تراها العين، ونحتاج المجهر لنراها.","level":"A","feedback_wrong":"ما الأداة التي تكشف ما يصغر عن عُشر مليمتر؟","feedback_by_option":{"1":"الجلد مبني من خلايا؛ نراها بالمجهر.","2":"كثير منها شفاف فعلاً، لكن السبب الأهم أنها صغيرة جداً.","3":"الجلد نفسه خلايا، ولا شيء يختبئ تحته."}},{"id":"U05.L01.P5","objective":"U05.L01.O5","type":"choose_reason","prompt":"في خلية العضلة ميتوكوندريا أكثر من خلية الجلد. لماذا؟","options":["لأنها أكبر","لأنها تعمل أكثر فتحتاج طاقة أكثر","لأنها أقرب إلى القلب","لأن الجلد لا يحتاج طاقة أبداً"],"answer":1,"explanation":"الميتوكوندريا تُطلق معظم طاقة الخلية، وخلية العضلة تعمل أكثر فتحتاج طاقة أكثر.","level":"B","feedback_wrong":"ماذا تصنع الميتوكوندريا؟ ومن يحتاجه أكثر؟","feedback_by_option":{"0":"الحجم ليس السبب؛ عدد الميتوكوندريا يتبع العمل.","2":"الموضع ليس السبب؛ خلايا عضلات القدم فيها ميتوكوندريا كثيرة أيضاً.","3":"كل خلية تحتاج طاقة، لكن خلية العضلة تحتاج أكثر."}}],"check":[{"id":"U05.L01.C1","objective":"U05.L01.O1","type":"true_false_why","prompt":"«الخلايا توجد في الدم فقط؛ أما العضلة والعظم فمادة متصلة». صح أم خطأ؟","answer":"خطأ؛ كل جزء من الجسم مبني من خلايا؛ خلايا الدم تسبح منفردة فرأيناها، والباقي خلايا متراصة.","level":"A","rubric":"R1"},{"id":"U05.L01.C2","objective":"U05.L01.O2","type":"locate_on_atlas","prompt":"في هذا الرسم المختلف لخلية، اضغط{|ي} على الغشاء.","answer":"membrane","level":"A","atlas_target":"membrane","feedback_wrong":"الخط الرقيق الذي يحيط بالخلية كلها من الخارج."},{"id":"U05.L01.C3","objective":"U05.L01.O3","type":"choose_reason","prompt":"خلية مسطحة تتراصّ مع أخواتها كبلاط الأرض. أين تتوقع{|ين} أن تجدها؟","options":["في الدم حيث تسبح الخلايا","في العضلة التي تنقبض","في الجلد الذي يغطي الجسم","في العصب الذي ينقل الأوامر"],"answer":2,"explanation":"الخلايا المسطحة المتراصّة تصنع غطاءً متصلاً، وهذا عمل الجلد الذي يغطي الجسم.","level":"A","feedback_wrong":"أي عمل يناسبه الشكل المسطح المتراصّ؟","feedback_by_option":{"0":"خلايا الدم تسبح منفردة، ولا تتراصّ كالبلاط.","1":"خلية العضلة طويلة رفيعة تنقبض.","3":"الخلية العصبية متفرعة طويلة تنقل الأوامر."}},{"id":"U05.L01.C4","objective":"U05.L01.O4","type":"explain_open","prompt":"اذكر{|ي} شيئين في رسم الخلية لا يطابقان الحقيقة.","answer":"الحجم (مكبَّر آلاف المرات)، الألوان (شفافة غالباً)، السكون (ما فيها يتحرك)، أنها «عامة» (كلها متخصصة).","level":"A","rubric":"R2","figure":"U05.L01-E2"},{"id":"U05.L01.C5","objective":"U05.L01.O2","type":"fix_model","prompt":"قال زميل{ك|تكِ}: «النواة دماغ صغير يفكر ويقرر». صحّح{|ي}.","answer":"النواة فيها تعليمات مكتوبة تخبر الخلية ماذا تصنع، كدفتر وصفات؛ لا تفكر ولا تقرر كالدماغ.","level":"A","rubric":"R1"},{"id":"U05.L01.C6","objective":"U05.L01.O6","type":"sequence","prompt":"رتّب{|ي} من الأصغر إلى الأكبر.","options":["خلية","نسيج","عضو","جهاز","جسم"],"answer":[0,1,2,3,4],"explanation":"الخلايا المتشابهة تكوّن نسيجاً، والأنسجة تكوّن عضواً، والأعضاء تكوّن جهازاً، والأجهزة معاً تكوّن الجسم.","level":"B","feedback_wrong":"ما الذي يُبنى من خلايا متشابهة؟ وما الذي يُبنى من أنسجة؟"},{"id":"U05.L01.C7","objective":"U05.L01.O6","type":"explain_open","prompt":"القلب عضو. اذكر{|ي} نسيجين على الأقل فيه، والجهاز الذي ينتمي إليه.","answer":"نسيج عضلي، أوعية دموية، أعصاب، غلاف؛ الجهاز الدوري (القلب والأوعية والدم).","level":"B","rubric":"R1"}],"concepts":[{"id":"cell","term":{"ar":"الخلية","en":"Cell","zh":"细胞","pinyin":"xìbāo","match":["خلية","الخلايا","خلايا"]},"priority":"core","atlas":{"layer":"cell","element":"cell"},"card":{"A":"اللبنة الحية التي يُبنى منها كل كائن حي. صغيرة جداً لا تراها العين؛ في جسمك{|ِ} تريليونات منها.","B":"البالغ فيه بين 10 و100 تريليون خلية بحسب التقدير؛ كل خلية تتغذى وتعمل، وكثير منها يموت ويُستبدل باستمرار."}},{"id":"membrane","term":{"ar":"غشاء الخلية","en":"Cell membrane","zh":"细胞膜","pinyin":"xìbāomó","match":["الغشاء","غشاء"]},"priority":"core","atlas":{"layer":"cell","element":"membrane"},"card":{"A":"الجدار الرقيق الذي يحيط بالخلية ويتحكم فيما يدخل إليها وما يخرج منها.","B":"ليس جداراً مغلقاً؛ فيه قنوات تمرّ منها مواد معينة فقط، كبوّاب يعرف من يدخل."}},{"id":"cytoplasm","term":{"ar":"السيتوبلازم","en":"Cytoplasm","zh":"细胞质","pinyin":"xìbāozhì"},"priority":"core","atlas":{"layer":"cell","element":"cytoplasm"},"card":{"A":"السائل الهلامي الذي يملأ الخلية وتحدث فيه أعمالها.","B":"ليس ماءً فارغاً؛ مليء بآلاف المواد والأجسام الصغيرة التي تعمل."}},{"id":"nucleus","term":{"ar":"النواة","en":"Nucleus","zh":"细胞核","pinyin":"xìbāohé"},"priority":"core","atlas":{"layer":"cell","element":"nucleus"},"card":{"A":"تحفظ تعليمات الخلية: ماذا تصنع وكيف تعمل — كدفتر وصفات تقرأ منه الخلية، لا كدماغ يفكر.","B":"التعليمات مكتوبة في مادة اسمها الحمض النووي (DNA)؛ تفاصيلها في وحدة النمو. والكريّة الحمراء الناضجة من الخلايا القليلة التي لا نواة فيها."}},{"id":"mitochondria","term":{"ar":"الميتوكوندريا","en":"Mitochondria","zh":"线粒体","pinyin":"xiànlìtǐ"},"priority":"supporting","atlas":{"layer":"cell","element":"mitochondria"},"card":{"A":"أجسام صغيرة داخل الخلية تُطلق معظم الطاقة التي تحتاجها من الغذاء.","B":"الخلايا التي تعمل أكثر فيها ميتوكوندريا أكثر. ومن أين تأتي هذه الطاقة؟ الدرس القادم."}},{"id":"tissue_organ","term":{"ar":"النسيج والعضو","en":"Tissue and organ","zh":"组织与器官","pinyin":"zǔzhī yǔ qìguān","match":["النسيج","نسيج","أنسجة"]},"priority":"supporting","atlas":{"layer":"cell","element":"tissue"},"card":{"A":"خلايا متشابهة معاً = نسيج (كالعضلة). أنسجة معاً = عضو (كالقلب). أعضاء معاً = جهاز (كالدوري).","B":"الجسم طبقات: خلية ← نسيج ← عضو ← جهاز ← جسم؛ كل وحدة تعلمناها كانت جهازاً."}}],"experiment":{"title":"أبني خلية وأرى حجرات هوك","materials":["كيس بلاستيكي شفاف صغير بسحّاب (الغشاء)","جيلي أو ماء بقليل من الصمغ الشفاف (السيتوبلازم)","حبة عنب أو كرة صغيرة (النواة)","حبات أرز أو فاصولياء صغيرة (الميتوكوندريا)","(اختياري بإشراف) قطعة فلّين أو بصلة ومجهر مدرسي أو عدسة قوية"],"steps":["{املأ|املئي} الكيس بالجيلي إلى نصفه: هذا السيتوبلازم.","ضع{|ي} حبة العنب في الوسط: النواة. ثم رشّ{|ي} حبات الأرز: الميتوكوندريا.","أغلق{|ي} السحّاب: الكيس هو الغشاء. اضغط{|ي} عليه بلطف: الغشاء يحفظ الشكل ويمنع ما بداخله من الخروج.","اكتب{|ي} تحت النموذج: ما يُظهره نموذجي: ____. ما لا يُظهره: ____ (الحجم؟ الحركة؟ الأعمال؟).","(اختياري) انظر{|ي} إلى قشرة بصل رقيقة جداً تحت مجهر مدرسي: حجرات متراصة كجدار من الطوب — هذا ما رآه هوك في الفلّين.","اكسر{|ي} بيضة في طبق (مع الكبار): الصفار خلية واحدة كبيرة؛ النقطة الصغيرة البيضاء عليه هي حيث يبدأ الكتكوت. البياض والقشرة ليسا من الخلية."],"safety":["الكيس يبقى مغلقاً ولا يُفتح بالأسنان؛ الجيلي لا يُؤكل بعد اللمس.","المجهر وقشرة البصل بإشراف بالغ؛ لا ننظر إلى الشمس أو ضوء قوي عبر العدسة.","نغسل الأيدي بعد البيضة.","حبات العنب والأرز بعيداً عن الإخوة الأصغر من خمس سنوات (خطر الاختناق)."],"expected":"نموذج بثلاثة أجزاء واضحة وقائمة بما لا يُظهره؛ وتحت المجهر حجرات متراصة؛ والصفار خلية واحدة.","explain":"ما {بنيته|بنيتِه} نموذج: الكيس يُظهر أن للخلية غشاءً يحفظ ما فيها ويتحكم فيما يدخل ويخرج؛ الجيلي يُظهر أن داخلها سائلاً تحدث فيه الأعمال؛ وحبة العنب تُظهر النواة. لكن خليتك{|ِ} الحقيقية أصغر من هذا النموذج آلاف المرات، وليست ساكنة: ما فيها يتحرك ويعمل كل لحظة. وحجرات البصل التي {رأيتها|رأيتِها} هي نفسها الفكرة التي سمّاها هوك «خلايا» منذ 360 سنة.","record":"رسم النموذج بأجزائه الثلاثة، وجملتان: ما يُظهره وما لا يُظهره.","alternatives":["إن لم يوجد كيس بسحّاب: بالون شفاف يُملأ بالماء وحبة داخله.","إن لم يوجد مجهر: صورة مجهرية لقشرة البصل من الدرس."]},"find_the_error":[{"id":"FE1","atlas_variant":"all_cells_same","error":"كل خلايا الجسم مرسومة كرات متشابهة","answer":"الخلايا متخصصة: قرص، طويلة، متفرعة، مسطحة","detects":"M24"},{"id":"FE2","atlas_variant":"nucleus_as_brain","error":"النواة مرسومة دماغاً صغيراً بوجه يفكر","answer":"النواة فيها تعليمات؛ لا تفكر","detects":"M47"}],"numbers":[{"text":"تريليون = مليون مليون. لو {عددتَ|عددتِ} خلية في كل ثانية {لاحتجتَ|لاحتجتِ} إلى أكثر من 30 ألف سنة لتعدّ{|ي} تريليوناً واحداً.","source":["S1"]},{"text":"معظم خلاياك{|ِ} أصغر من عُشر مليمتر؛ لذلك لا تراها العين، ويراها المجهر.","source":["S2"]},{"text":"البيضة: صفار بيضة الدجاج خلية واحدة كبيرة — من أكبر الخلايا التي {تراها|ترينها} بعينك{|ِ}.","source":["S5"]}],"true_size":[{"text":"ضع{|ي} نقطة بالقلم على ورقة: في عرض هذه النقطة تصطف نحو عشر خلايا من خلاياك{|ِ}.","source":["S2"]},{"text":"اكسر{|ي} بيضة مع الكبار: الصفار خلية واحدة. تخيّل{|ي} خلاياك{|ِ} أصغر منها أكثر من ألف مرة في الطول.","source":["S5"]}],"animal":{"text":"كل الكائنات الحية مبنية من خلايا: الفيل والنملة والشجرة والفطر. الفيل ليس له خلايا أكبر من خلايا الفأر؛ له خلايا أكثر. وبعض الكائنات خلية واحدة فقط تعيش وحدها في قطرة ماء — هي التي رآها ليفينهوك تتحرك.","source":["S1"]},"organ_letter":{"from":"خلية عضلية في ساقك{|ِ}","text":"أنا خلية واحدة من تريليونات. طويلة رفيعة، أقصر حين {تأمرني|تأمرينني} فتتحرك ساقك{|ِ}. لي غشاء يُدخل الأكسجين والغذاء ويُخرج فضلاتي، ونواة فيها وصفاتي، ومئات الميتوكوندريا تُطلق لي الطاقة من الغذاء — ولذلك ألهث حين تركض{|ين}. لا {تراني|ترينني}، لكني أعمل منذ ولدت{|ِ}. مع التحية، طوبة حية في جدار ساقك{|ِ}."},"history":[{"who":"روبرت هوك","origin":"إنجلترا","where_when":"لندن، 1665","did":"نظر بمجهر مركّب صنعه إلى شريحة فلّين فرأى حجرات متراصة سمّاها «خلايا»، ونشرها في كتابه «ميكروغرافيا».","did_not":"لم يعرف أن ما رآه جدران خلايا ميتة فارغة، ولم يقل إن كل الكائنات مبنية من خلايا (نظرية الخلية بعد قرنين).","method_lesson":"الأداة تكشف ما لم يُسأل عنه بعد؛ والاسم قد يسبق الفهم.","source":["S6"]},{"who":"أنطوني فان ليفينهوك","origin":"هولندا","where_when":"دلفت، 1674–1677","did":"بعدسات صغيرة صقلها بنفسه رأى كائنات دقيقة حية تتحرك في ماء البحيرة واللعاب، ووصفها في رسائل إلى الجمعية الملكية.","did_not":"لم يعرف ما هي ولا علاقتها بالمرض (باستور وكوخ بعد قرنين)، ولم يشارك طريقة صنع عدساته.","method_lesson":"الملاحظة الدقيقة المتكررة والتسجيل الأمين يصنعان العلم ولو لم يفهم صاحبها كل ما رأى.","source":["S6"]}],"how_we_know":{"text":"قبل نحو 360 سنة في لندن، نظر روبرت هوك بمجهر صنعه بنفسه إلى شريحة رقيقة من الفلّين فرأى حجرات صغيرة متراصة ذكّرته بحجرات الرهبان، فسمّاها «خلايا» (cells) — والاسم بقي إلى اليوم. وبعده بسنوات رأى ليفينهوك في هولندا كائنات حية دقيقة تتحرك في قطرة ماء. لم يعرف هوك أن ما رآه جدران خلايا ميتة، ولم يعرف أن كل الكائنات مبنية من خلايا؛ احتاج ذلك إلى قرنين من المجاهر الأفضل. الاسم جاء قبل الفهم، والأداة سبقت النظرية.","limit_question":"ما الذي لا يُظهره رسم الخلية في هذا الدرس؟"},"what_changed":["ظُن أن الجسم مادة متصلة كالعجين؛ المجهر بيّن أنه مبني من وحدات.","ظُن أن الخلية «كيس ماء بسيط»؛ هي مدينة صغيرة مزدحمة بالأعمال."],"model_limits":["رسم الخلية مكبَّر آلاف المرات؛ الحقيقية لا تُرى بالعين.","الألوان في الرسم ترميز؛ معظم أجزاء الخلية شفافة بلا لون.","الرسم ساكن ومسطح؛ الخلية كرة أو شكل ثلاثي الأبعاد يتحرك ما فيه باستمرار.","نموذج الكيس والهلام يُظهر البنية لا الحجم ولا الأعمال.","الرسم يُظهر خلية «عامة»؛ لا توجد خلية عامة في الجسم، كلها متخصصة.","(صورة E1) أربع درجات تكبير منفصلة. الخلايا الجلدية كبلاطات مستطيلة نموذج مبسط، لا وصف لكل طبقات الجلد أو لكل أشكال خلاياه.","(صورة E2) الغشاء رقيق؛ العلامتان الصغيرتان على الغشاء رمز لمسارات عبور انتقائية، لا ثقوب كبيرة دائمة. النواة لا تتخذ قرارات واعية، والبقعة الأغمق داخلها رمز للنوية.","(صورة E3) المقارنة للأشكال وليست بنفس التكبير العددي؛ الأحجام والأطوال الفعلية مختلفة جداً. الليف العضلي طويل ومتعدد الأنوية الطرفية، والخلية الحمراء الناضجة بلا نواة ولا ميتوكوندريا. ليست كل خلية مطابقة للنموذج العام ذي النواة الواحدة.","(صورة E4) فلين نباتي ميت وحجرات فارغة، لا جلد حيواني ولا خلايا حية. شبكة سداسية مثالية للتبسيط وليست نسخاً من رسم هوك الأصلي. المشهد التاريخي تصور قصصي لا توثيق لملامحه أو غرفته؛ أزيل الأطفال المعاصرون والقبة المتأخرة من خلفية النافذة.","(صورة E5) الميتوكوندريا مرسومة بمقاطع تكشف طيات الغشاء الداخلي. مقارنة العدد بين العضلة والجلد نوعية وليست تعداداً ثابتاً لجميع أنواع الخلايا أو مراحل نشاطها.","(صورة E6) سلم الخلية ثم النسيج ثم العضو ثم الجهاز ثم الكائن، من الأسفل إلى الأعلى. التمثيلات المختصرة ليست خرائط تفصيلية للقلب أو الأوعية.","(صورة exp) العنبة والأرز والكيس والجيلي تشبيهات لأجزاء الخلية، وليست خلايا أو عضيات حقيقية. غشاء الخلية ينظم العبور أكثر من كيس بلاستيكي. يظهر طفلان في التجربة بدلاً من الطفل وحده؛ العنبة واحدة وحبات الأرز متعددة.","(صورة hist1) المجهر صفيحة نحاسية بعدسة دقيقة وليس أنبوباً حديثاً. وعاء ماء البركة أكبر من العينة الصغيرة للفهم البصري؛ المشهد تصور تاريخي مع لمّاح الخيالي.","(صورة hist2) مقارنة أعلى/أسفل بدل اليسار/اليمين: جدران فلين فارغة ثم نموذج خلية حية مختارة. ليست كل الخلايا الحية بشكل النموذج أو بلون النواة المرسوم.","(صورة letter) الوجه على النواة والذراع البنفسجية من رسم الشخصية؛ لا للنواة أو الغشاء ذراعان حقيقيتان ولا تحمل الخلية ظرفاً. الفقاعات الزرقاء زخرفة للهلام، وليست شرحاً لعضيات إضافية.","(صورة life) مشهدان رأسيان بدل جانبيين. القشرة جافة واليدان بعيدتان، والتكبير يوضح إعادة البناء تحتها دون أن يحدد كل طبقات الجلد أو زمن الالتئام.","(صورة title-boy) تكبير البصل مستطيلات متراصة بنواة واحدة لكل خلية؛ أزيلت الميتوكوندريا الفردية من مشهد المجهر المدرسي. اللون البنفسجي تمثيل توضيحي للنواة، وقد تحتاج رؤيتها الفعلية إلى تحضير وصبغة. جدران الخلايا النباتية تختلف عن غشاء الخلية الحيوانية."],"faith":{"opening":{"text":"ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَـٰمًۭا وَقُعُودًۭا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَـٰذَا بَـٰطِلًۭا سُبْحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ","reference":"آل عمران 191","grade":"قرآن","usage":"تفكر","reflection":"التفكر في الخلق عبادة. اليوم نتفكر في أصغر ما فينا: طوبة حية لا تراها العين، وفي جسمك{|ِ} منها تريليونات، كل واحدة تعمل الآن. ننظر نظرة علم: ما هي، وما أجزاؤها، ولماذا تختلف.","reviewed":false,"quran_key":"3:191","hl_words":[7,11],"highlight":"ويتفكرون في خلق السموات والأرض","level":"تفكر","concept":"التفكر في الخلق عبادة؛ والعلم طريق النظر.","avoid":"لا نقول إن الآية تذكر الخلية؛ هي دعوة عامة للتفكر ونحن نطبّقها على ما ندرس.","cards":[]},"closing":null},"life":[{"situation":"جُرحت ركبتي وبعد أسبوع صار مكانها جلد جديد.","science":"خلايا الجلد انقسمت وصنعت خلايا جديدة سدّت مكان الجرح تحت القشرة؛ كل يوم يصنع جسمي مليارات الخلايا الجديدة بلا أن أشعر.","action":"أترك القشرة ولا أنزعها، وأغسل الجرح وأغطيه، وأعطي جسمي نوماً وطعاماً ليبني.","value":"جسمي يعمل لي وأنا نائم؛ شكر النعمة أن أعينه لا أن أعطّله.","why":"لماذا لا أنزع القشرة؟ لأن تحتها ورشة من خلايا تبني جلداً جديداً، ونزعها يهدم ما بُني ويفتح الباب للميكروبات. وما يبنيه جسمي بلا أمر مني نعمة؛ والله تعالى دعانا أن نبصر في أنفسنا — واليوم أبصرت ورشة لا تُرى.","reference":"الذاريات 21","quran":["51:21"],"cards":[],"verses":["51:21"]},{"situation":"سألني أخي الصغير: كم خلية فيك؟ فقلت رقماً دقيقاً بثقة.","science":"العلماء أنفسهم لا يملكون رقماً دقيقاً؛ التقديرات بين 10 و100 تريليون.","action":"أقول: «تريليونات، ولا أحد يعرف العدد بالضبط»، ولا أخترع رقماً لأبدو عارفاً.","value":"«لا أعرف بالضبط» جواب عالِم.","why":"لماذا لا أخترع رقماً؟ لأن أخي سيصدّقني وينقله، فأكون قد نشرت خطأً باسمي. والنبي ﷺ عدّ من ينقل كل ما يسمعه بلا تثبّت واقعاً في الكذب — فكيف بمن يقول ما لم يسمعه أصلاً؟ الصدق في حدود ما أعرف هو العلم.","reference":"مسلم، المقدمة 5","hadith":["muslim:intro-5"],"cards":[{"key":"muslim:intro-5","lead":"عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","text":"كفى بالمرء كذباً أن يحدّث بكل ما سمع","narration":false,"source":"مسلم، المقدمة 5","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كم خلية في جسم الإنسان بالضبط؟","why_open":"لا يوجد رقم متفق عليه؛ التقديرات بين 10 و100 تريليون بحسب طريقة الحساب، وأكثرها شيوعاً نحو 37 تريليوناً. العدّ ما زال تقديراً."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة خلية وسمِّ{|ي}: الغشاء، السيتوبلازم، النواة. ثم ارسم{|ي} أربع خلايا متخصصة بأشكالها (كريّة، عضلية، عصبية، جلدية) واكتب{|ي} عمل كل واحدة. المستوى ب: {أضف|أضيفي} الميتوكوندريا وسلّم خلية ← نسيج ← عضو ← جهاز.","label":["الغشاء","السيتوبلازم","النواة","كريّة حمراء","خلية عضلية","خلية عصبية","خلية جلد","— ب: الميتوكوندريا"],"write":"لماذا لم يعرف الناس الخلايا قبل المجهر؟ ثم أختار خليتين وأشرح كيف يناسب شكل كل منهما عملها. وأكتب شيئاً واحداً لا يُظهره نموذجي."},"imgs":["U05.L01-E1","U05.L01-E2","U05.L01-E3","U05.L01-E4","U05.L01-E5","U05.L01-E6","U05.L01-exp","U05.L01-hist1","U05.L01-hist2","U05.L01-letter","U05.L01-life","U05.L01-title-boy","U05.L01-title-girl"]};
