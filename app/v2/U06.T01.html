const LD = {"id":"U06.T01","lesson":"U06.L01","first":false,"title":"اختبار: الفم: أول محطة في الطريق","lessonTitle":"الفم: أول محطة في الطريق","concepts":[],"check":[],"items":[{"id":"U06.L01.A1.a","objective":"U06.L01.O1","level":"A","type":"choose","prompt":"السن المدببة التي تمزق:","options":["الناب","القاطع","الضرس","اللسان"],"answer":0,"explanation":"الناب سن مدببة تمزّق الطعام.","feedback_by_option":{"1":"القاطع مسطح حاد يقطع.","2":"الضرس عريض يطحن.","3":"اللسان ليس سناً؛ يحرّك اللقمة ويتذوقها."},"alt":{"prompt":"الأسنان التي لها رأسان وتهرس الطعام، بين الأنياب والأضراس:","options":["الأنياب","القواطع","الضواحك","الأضراس"],"answer":2,"explanation":"الضواحك بين الأنياب والأضراس، لها رأسان تهرس بهما الطعام.","feedback_by_option":{"0":"الأنياب مدببة تمزّق.","1":"القواطع في الأمام، مسطحة حادة تقطع.","3":"الأضراس في الخلف، عريضة تطحن."}}},{"id":"U06.L01.A1.b","objective":"U06.L01.O1","level":"A","type":"explain_open","prompt":"لو كانت أسنانك{|ِ} كلها قواطع، ماذا يصعب عليك{|ِ}؟","answer":"الطحن؛ القواطع تقطع ولا تطحن، فتبقى اللقم كبيرة.","rubric":"R1"},{"id":"U06.L01.A1.c","objective":"U06.L01.O1","level":"A","type":"true_false_why","prompt":"«كل الأسنان لها الشكل نفسه». صح أم خطأ؟","answer":"خطأ؛ أربعة أشكال لأربعة أعمال.","rubric":"R1","alt":{"prompt":"«الناب مدبب لأنه يمزّق، والضرس عريض لأنه يطحن». صح أم خطأ؟ ولماذا؟","answer":"صح؛ شكل كل سن يناسب عمله: القواطع تقطع، والأنياب تمزّق، والضواحك تهرس، والأضراس تطحن."}},{"id":"U06.L01.A2.a","objective":"U06.L01.O2","level":"A","type":"choose_reason","prompt":"أين يبدأ الهضم؟","options":["في المعدة","في الفم","في الأمعاء","في الدم"],"answer":1,"explanation":"الهضم يبدأ في الفم: الأسنان تقطع وتطحن، واللعاب يبدأ تحويل النشا.","feedback_by_option":{"0":"الهضم يبدأ قبل المعدة: في الفم تصغّر الأسنان اللقمة ويبدأ اللعاب تحويل النشا.","2":"الأمعاء في آخر الطريق تقريباً؛ والبداية حيث تعمل الأسنان واللعاب.","3":"الدم ينقل ما هُضم، ولا يبدأ فيه الهضم."},"detects":"M51","alt":{"prompt":"ما الذي يصل إلى المعدة بعد أن نبلع؟","options":["عجينة مبللة بدأ هضمها في الفم","اللقمة كما دخلت الفم، لأن البلع سريع","سكر خالص","ماء فقط"],"answer":0,"explanation":"الهضم يبدأ في الفم: الأسنان تصغّر اللقمة، واللعاب يبلّلها ويبدأ تحويل النشا؛ فيصل إلى المعدة عجينة مبللة.","feedback_by_option":{"1":"الأسنان قطعت اللقمة وطحنتها، واللعاب بلّلها؛ فهل تصل كما هي؟","2":"اللعاب بدأ تحويل بعض النشا إلى سكر، لكن ما يصل عجينة فيها أشياء كثيرة.","3":"اللقمة ليست ماءً؛ صارت عجينة مبللة."},"detects":"M51"}},{"id":"U06.L01.A2.b","objective":"U06.L01.O2","level":"A","type":"explain_open","prompt":"اذكر{|ي} عملين للعاب.","answer":"يبلّل الطعام ليسهل بلعه، ويبدأ تحويل النشا إلى سكر، ويصلح الأسنان بمعادنه.","rubric":"R1"},{"id":"U06.L01.A2.c","objective":"U06.L01.O2","level":"A","type":"true_false_why","prompt":"«فمي يسيل لعاباً حين أشمّ الطعام قبل أن آكل». صح أم خطأ؟","answer":"صح؛ الأعصاب تأمر الغدد استعداداً للطعام.","rubric":"R1","alt":{"prompt":"«اللعاب ماء فقط، لا عمل له في الهضم». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ اللعاب يبلّل الطعام ليسهل بلعه، وفيه مادة تبدأ تحويل النشا إلى سكر."}},{"id":"U06.L01.A3.a","objective":"U06.L01.O3","level":"A","type":"choose_reason","prompt":"ما الذي يمنع اللقمة من دخول القصبة الهوائية؟","options":["الأسنان تحبسها حتى نبلع ببطء","لا حاجة لمانع: الطعام والهواء طريقهما واحد","لسان المزمار يغلق القصبة لحظة البلع","اللعاب يثقلها فتسقط في المريء وحدها"],"answer":2,"explanation":"لسان المزمار غطاء يغلق القصبة الهوائية لحظة البلع، فتذهب اللقمة إلى المريء.","feedback_by_option":{"0":"الأسنان في الفم، بعيدة عن مدخل القصبة؛ والحارس عند الحلق.","1":"للطعام طريق وللهواء طريق: المريء خلف القصبة الهوائية، ويلتقيان في الحلق فقط؛ لذلك يلزم غطاء يغلق القصبة لحظة البلع.","3":"اللعاب يبلّل اللقمة لكنه لا يحدد طريقها؛ لسان المزمار هو الذي يغلق القصبة لحظة البلع."},"detects":"M68","alt":{"prompt":"يفترق طريق الطعام وطريق الهواء في الحلق. أين يذهب كل منهما؟","options":["الطعام إلى القصبة، والهواء إلى المريء","الطعام والهواء معاً إلى المعدة","كلاهما إلى الرئتين","الطعام إلى المريء، والهواء إلى القصبة الهوائية"],"answer":3,"explanation":"الطعام والهواء يفترقان في الحلق: الطعام إلى المريء، والهواء إلى القصبة الهوائية؛ ولسان المزمار يغلق القصبة لحظة البلع.","feedback_by_option":{"0":"العكس: القصبة للهواء، والمريء للطعام.","1":"طريق الهواء إلى الرئتين يمرّ بالقصبة؛ والمعدة طريق الطعام.","2":"الطعام لا يذهب إلى الرئتين؛ لسان المزمار يغلق طريقهما."},"detects":"M68"}},{"id":"U06.L01.A3.b","objective":"U06.L01.O3","level":"A","type":"sequence","prompt":"رتّب{|ي} رحلة اللقمة في الفم والحلق.","options":["قطع وطحن بالأسنان","تبليل باللعاب","اللسان يدفعها للخلف","الغطاء يغلق القصبة","تنزلق في المريء"],"answer":[0,1,2,3,4],"explanation":"تقطع الأسنان اللقمة وتطحنها، ويبلّلها اللعاب، ثم يدفعها اللسان إلى الخلف، فيغلق الغطاء القصبة، فتنزلق في المريء.","alt":{"prompt":"رتّب{|ي} رحلة قطعة تفاح من القضمة إلى المعدة.","options":["تقطع القواطع قطعة من التفاحة","تطحنها الأضراس ويبلّلها اللعاب","يدفعها اللسان إلى الخلف","تنزلق في المريء","تصل إلى المعدة"],"answer":[0,1,2,3,4],"explanation":"تقطع القواطع القطعة، وتطحنها الأضراس ويبلّلها اللعاب، ثم يدفعها اللسان إلى الخلف فتنزلق في المريء حتى المعدة."}},{"id":"U06.L01.A3.c","objective":"U06.L01.O3","level":"A","type":"explain_open","prompt":"لماذا نقول «لا تتكلم والفم ملآن»؟ أعط{|ي} سبباً من الدرس.","answer":"الكلام يحتاج طريق الهواء مفتوحاً والبلع يحتاجه مغلقاً؛ معاً قد تدخل قطعة في القصبة فنشرق.","rubric":"R1"},{"id":"U06.L01.A4.a","objective":"U06.L01.O4","level":"A","type":"choose_reason","prompt":"من يصنع الحمض الذي يذيب المينا؟","options":["السكر نفسه حين يلمس المينا يذيبها","اللعاب حين يكثر في الفم","الأسنان حين تحتك ببعضها","البكتيريا التي تأكل السكر"],"answer":3,"explanation":"البكتيريا في الطبقة اللزجة تأكل السكر وتصنع الحمض الذي يذيب المينا.","feedback_by_option":{"0":"السكر نفسه لا يذيب المينا؛ البكتيريا تأكله وتصنع الحمض الذي يذيبها.","1":"اللعاب يحمي الأسنان ويعيد معادنها؛ ولا يصنع الحمض.","2":"احتكاك الأسنان لا يصنع حمضاً."},"detects":"M52","alt":{"prompt":"لماذا ينصح طبيب الأسنان بتنظيف الأسنان بعد الحلوى؟","options":["لأن الحلوى تليّن الأسنان مباشرة","لأن السكر نفسه يحفر السن","لنبيّض الأسنان فقط","لنزيل البكتيريا وبقايا السكر"],"answer":3,"explanation":"التنظيف يزيل البكتيريا وبقايا السكر التي تصنع منها الحمض، والفلورايد في المعجون يساعد على إعادة المعادن.","feedback_by_option":{"0":"الحلوى لا تليّن الأسنان مباشرة؛ الحمض الذي تصنعه البكتيريا يذيب المينا.","1":"السكر لا يحفر السن بنفسه؛ البكتيريا تصنع منه حمضاً.","2":"اللون ليس الهدف؛ الهدف إزالة البكتيريا وغذائها."},"detects":"M52"}},{"id":"U06.L01.A4.b","objective":"U06.L01.O4","level":"A","type":"explain_open","prompt":"ما الذي يعيد معادن السن بعد هجوم الحمض؟","answer":"اللعاب بمعادنه (كالسيوم وفوسفات) والفلورايد من المعجون، إذا أُعطي السن وقتاً.","rubric":"R1"},{"id":"U06.L01.A4.c","objective":"U06.L01.O4","level":"A","type":"true_false_why","prompt":"«التسوس في أوله (البقعة البيضاء) يمكن أن يتوقف بالفلورايد والتنظيف وتقليل السكر». صح أم خطأ؟","answer":"صح؛ اللعاب والفلورايد يعيدان المعادن إلى المينا إن قلّت هجمات الحمض.","rubric":"R1","alt":{"prompt":"«إذا أعطينا الأسنان وقتاً بين الوجبات، يعيد اللعاب إليها بعض المعادن التي أذابها الحمض». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في اللعاب معادن تعود إلى المينا، ويساعدها الفلورايد، إذا قلّت هجمات الحمض."}},{"id":"U06.L01.A5.a","objective":"U06.L01.O5","level":"B","type":"choose_reason","prompt":"ما الأخطر على الأسنان؟","options":["رشفات محلّاة كل نصف ساعة طول اليوم","قطعة حلوى كبيرة مرة واحدة مع الغداء","تفاحة","خبز"],"answer":0,"explanation":"تكرار السكر طول اليوم يُبقي الحمض يعمل بلا راحة، أما الحلوى مرة واحدة فيعقبها وقت يصلح فيه اللعاب.","feedback_by_option":{"1":"المرة الواحدة يعقبها وقت للإصلاح؛ والتكرار لا يعطي هذا الوقت.","2":"التفاحة مرة واحدة يعقبها وقت للإصلاح؛ والخطر في التكرار طول اليوم.","3":"الخبز مع الوجبة يعقبه وقت للإصلاح؛ والخطر في التكرار طول اليوم."},"alt":{"prompt":"أي عادة أرحم بالأسنان؟","options":["مصّ حلوى صغيرة كل ساعة","رشف عصير محلّى طول اليوم","الحلوى مع الوجبة ثم تنظيف الأسنان","أكل الحلوى بعد تنظيف الليل"],"answer":2,"explanation":"الحلوى مع الوجبة مرة واحدة
