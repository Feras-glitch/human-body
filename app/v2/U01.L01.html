,"type":"true_false_why","prompt":"«البطن منطقة فيها أعضاء كثيرة، والمعدة واحد منها فقط». صح أم خطأ؟ ولماذا؟","answer":"صح؛ البطن منطقة، والمعدة عضو واحد من أعضاء كثيرة فيها.","level":"A","rubric":"R1"},{"id":"U01.L01.C3","objective":"U01.L01.O2","type":"explain_open","prompt":"صف{|ي} موضع الأذن بجملتين تستعملان اتجاهين مختلفين.","answer":"مثل: الأذن على جانب الرأس بعيدة عن خط المنتصف؛ وهي أعلى العنق / خلف العين.","level":"A","rubric":"R1"},{"id":"U01.L01.C4","objective":"U01.L01.O3","type":"explain_open","prompt":"أمامك{|ِ} رسم لليد فيه الأصابع ملوّنة بألوان مختلفة. اذكر{|ي} شيئاً يُظهره وشيئاً لا يطابق الحقيقة.","answer":"يُظهر عدد الأصابع ومواضعها؛ الألوان ليست حقيقية.","level":"A","rubric":"R2"},{"id":"U01.L01.C5","objective":"U01.L01.O4","type":"choose","prompt":"في صورة أشعة للصدر كُتب حرف R على يسار الصورة. لماذا؟","answer":0,"explanation":"صورة الأشعة تُقرأ كأن المريض يواجهنا، فيمينه يظهر على يسار الصورة، والحرف R يذكّر بذلك.","level":"B","options":["لأن يمين المريض يظهر على يسار الصورة","خطأ في الطباعة يجب أن يُصحَّح قبل أن تُقرأ الصورة","لأن قلب هذا المريض على اليمين","ليتذكر الطبيب اسم المريض"],"feedback_wrong":"تذكّر{|ي} المصافحة.","feedback_by_option":{"1":"ليس خطأً: الأطباء يكتبونه عمداً. الصورة تُقرأ كأن المريض يواجهنا؛ فأين يقع يمينه منا؟","2":"الحرف R يُكتب على صور الصدر كلها، لا على صور من قلبه في اليمين وحدهم. هو يدل على جهة من جسم المريض.","3":"الحرف R يرمز إلى اليمين بالإنجليزية، لا إلى اسم المريض. لماذا يحتاج الطبيب أن يعرف أين يمين المريض في الصورة؟"}},{"id":"U01.L01.C6","objective":"U01.L01.O2","type":"choose","prompt":"أين البطن بالنسبة إلى الصدر؟","answer":2,"explanation":"الصدر والبطن في الجذع: الصدر أعلى، والبطن أسفل منه.","level":"A","options":["أعلى منه","خلفه","أسفل منه","أبعد عن المنتصف منه"],"feedback_wrong":"{انظر|انظري} إلى جذعك{|ِ}: أيهما فوق الآخر؟","feedback_by_option":{"0":"الصدر هو الأعلى. أين البطن منه؟","1":"خلف الصدر الظهر لا البطن.","3":"البطن في منتصف الجذع مثل الصدر، لكنه تحته."}}],"concepts":[{"id":"trunk","term":{"ar": وقيسي} المسافة من طرف الأصابع إلى طرف الأصابع (الباع)، وسجّل{|ي}.","قارن{|ي} الرقمين. هل هما متقاربان؟","اخلع{|ي} الحذاء وضع{|ي} قدمك{|ِ} على ساعدك{|ِ} من فوق الكمّ، من المرفق إلى الرسغ. أيهما أطول؟ (النتيجة تختلف بين الناس.)","ارسم{|ي} شكل جسم بسيطاً في الدفتر وسمِّ{|ي} عليه: الرأس، العنق، الصدر، البطن، الظهر، العضد، الساعد، اليد، الفخذ، الساق، القدم.","اكتب{|ي} تحت الرسم شيئاً واحداً لا يُظهره رسمك{|ِ} عن جسمك{|ِ} الحقيقي."],"safety":["القياس على نفسك{|ِ} أو بإذن زميل؛ لا نقيس أحداً دون إذنه.","لا نقارن الأطوال بين الأطفال ولا نعلّق على أجسام الآخرين؛ الاختلاف طبيعي."],"expected":"الباع يقارب الطول (الفرق غالباً أقل من 5 سم)؛ أما القدم والساعد فقد يتقاربان وقد لا — سجّل{|ي} ما وجدت.","explain":"أجسامنا متناسبة بنِسب متقاربة بين الناس مع اختلاف الأحجام؛ لذلك يستطيع الرسام أن يرسم جسماً «نموذجياً». لكنها نِسب تقريبية: جسمك{|ِ} الحقيقي قد يختلف قليلاً، وهذا طبيعي، وهذا بالضبط ما لا يُظهره النموذج.","record":"جدول: طولي / باعي / الفرق، وقدمي / ساعدي. ورسم الخريطة بتسمياتها.","alternatives":["من يتعذر عليه الوقوف يقيس الباع جالساً ويقيس طول الساعد والقدم فقط.","يمكن استعمال خيط بدل شريط القياس ثم قياس الخيط بالمسطرة."]},"find_the_error":[{"id":"FE1","atlas_variant":"stomach_label_on_abdomen","error":"كلمة «المعدة» مكتوبة على البطن كلها","answer":"البطن منطقة؛ المعدة عضو صغير داخلها","detects":"M08"},{"id":"FE2","atlas_variant":"hand_called_arm","error":"كلمة «اليد» على الطرف العلوي كله","answer":"اليد الجزء الأخير فقط؛ قبلها الساعد ثم العضد","detects":"M40"}],"numbers":[{"text":"مدّ{|ي} ذراعيك{|ِ} جانباً: المسافة بين طرفي أصابعك{|ِ} تساوي طولك{|ِ} تقريباً. {قس|قيسي} وتحقق{|ي}.","source":["S3"]},{"text":"يقول كثيرون إن طول القدم يقارب طول الساعد (من المرفق إلى الرسغ). هل هذا صحيح عندك{|ِ}؟ ضع{|ي} القدم على الساعد {وقس|وقيسي} — النتيجة تختلف من شخص لآخر.","source":["S3b"]}],"true_size":[{"text":"ارسم{|ي} محيط جسمك{|ِ} على ورق كبير (أو محيط كفك{|ِ} على ورقة) وسمِّ{|ي} المناطق عليه: هذا نموذج بحجمك{|ِ} الحقيقي.","source":["S3"]}],"animal":{"text":"للقطة الأجزاء نفسها بأسماء مشابهة: رأس وعنق وجذع وأطراف. لكن «ركبة» القطة الخلفية أعلى مما تظن، وما يبدو ركبة معكوسة هو كاحلها. الخريطة واحدة والنِّسب مختلفة.","source":["S5"]},"organ_letter":{"from":"خريطة الجسم","text":"أنا الرسم الأول في كتابك{|ِ}. أبدو بسيطاً: رأس وجذع وأطراف. لكني أحمل سراً: كل طبيب في العالم يستعمل خريطتي نفسها واتجاهاتي نفسها، من القاهرة إلى طوكيو، حتى لا يُخطئ أحد في جانب أو موضع. أنا لست جسمك{|ِ}؛ أنا خريطته. والخريطة لا تُظهر كل شيء، لكنها تمنعك{|ِ} من الضياع."},"history":[{"who":"عبد اللطيف البغدادي","origin":"بغداد؛ عمل في مصر. مسلم","where_when":"القاهرة، نحو 1200–1202","did":"فحص أكثر من ألفي جمجمة وهياكل كثيرة أثناء مجاعة مصر فوجد أن الفك السفلي في البالغ عظم واحد لا عظمان، مخالفاً جالينوس.","did_not":"لم يضع تشريحاً كاملاً جديداً، ولم تنتشر ملاحظاته انتشاراً واسعاً.","method_lesson":"الملاحظة المباشرة تغلب سلطة الكتاب.","source":["S4"]}],"how_we_know":{"text":"قبل نحو 800 سنة، في مجاعة ضربت مصر، نظر الطبيب عبد اللطيف البغدادي إلى أكثر من ألفي جمجمة وهياكل كثيرة في القاهرة، فوجد أن الفك السفلي عظم واحد، مع أن الكتب قالت ألف سنة إنه عظمان. لم يصدّق الكتاب على حساب ما رأت عيناه. هذا أول درس لنا: ما نراه ونصفه بدقة أقوى مما نسمعه.","limit_question":"ما الذي لا يُظهره رسم الجسم في هذا الدرس؟ (اذكر{|ي} شيئاً واحداً)"},"what_changed":["ظُن أن الفك السفلي عظمان حتى فحصه البغدادي."],"model_limits":["الرسم يُظهر شخصاً واحداً؛ أجسام الناس تختلف في الشكل والحجم واللون والقدرات.","حدود المناطق في الرسم خطوط واضحة؛ في الجسم تتداخل.","الرسم ساكن؛ الجسم يتحرك ويتغير."],"faith":{"opening":{"text":"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۚ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَـٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًۭا","reference":"الإسراء 36","grade":"قرآن","usage":"قيمة","reflection":"لا نقول ما لا نعلم. في هذا المنهاج كله، حين لا نعرف نقول: «لا أعرف بعد»، ثم ننظر ونقيس. هذه أول عادة نتعلمها اليوم.","reviewed":false,"quran_key":"17:36","cards":[]},"closing":{"text":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","reference":"مسلم 2564","grade":"صحيح","usage":"قيمة","reflection":"تعلّمنا اليوم خريطة الجسم: رؤوس وأجذاع وأطراف تختلف أحجامها وأشكالها بين الناس. والله لا ينظر إلى الصور، بل إلى القلوب والأعمال. فلا نحكم على أحد من جسمه، ولا نسخر من شكل أحد.","reviewed":false,"full_verified":true,"matn_note":"متن قصير كامل","hadith_key":"muslim:2564/suwar","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"مسلم 2564","grader":"","cards":[]}},"life":[{"situation":"صديقي أقصر مني أو أطول.","science":"الطول يحدده الوراثة والغذاء والنوم والعمر، ونِسب الجسم متقاربة بين الناس مع اختلاف الأحجام.","action":"لا أقارن أجسام الأصدقاء ولا أعلّق على جسم أحد.","value":"الناس يتفاضلون بأعمالهم لا بأجسامهم.","why":"الله وزّع النعم: هذا طويل وذاك قصير، هذا سريع وذاك قوي الذاكرة. لو تساوى الناس في كل شيء ما احتاج أحد أحداً؛ الاختلاف يجعلنا نكمّل بعضنا. والتفاضل عند الله بالتقوى والعمل النافع، لا بالطول ولا باللون.","reference":"الحجرات 13؛ الروم 22","cards":[],"verses":[]},{"situation":"أصف للطبيب مكان ألم.","science":"أسماء المناطق والاتجاهات واحدة في العالم كله لتفادي الخطأ.","action":"أسمّي المنطقة والاتجاه بدقة بدل «هنا».","value":"الدقة في الوصف تمنع الضرر.","why":"لماذا أتعلّم أسماء المناطق؟ لأن الطبيب لا يرى ما أحسّه أنا؛ هو يعتمد على كلامي. كلمة «هنا» تضيع، و«أسفل البطن من اليمين» تصل. الله رزقني لساناً ينقل ما في جسمي؛ فأستعمله بدقة ليساعدني من يريد مساعدتي.","cards":[],"verses":[]}],"open_questions":[{"q":"لماذا يستعمل أغلب الناس اليد اليمنى، وبعضهم اليسرى؟","why_open":"نعرف أن للوراثة والدماغ دوراً، لكن السبب الكامل لم يُفهم بعد. العلماء ما زالوا يبحثون."}],"notebook":{"draw":"ارسم{|ي} من الذاكرة شكل جسم وسمِّ{|ي} عليه المناطق الإحدى عشرة. المستوى ب: اكتب{|ي} «يمين» و«يسار» على الجانبين الصحيحين كأن الرسم يواجهك{|ِ}.","label":["الرأس","العنق","الصدر","البطن","الظهر","العضد","الساعد","اليد","الفخذ","الساق","القدم"],"write":"طولي ____ وباعي ____ (إن لم أقِس نفسي: أقيس أحد أهلي، أو أكتب ما أتوقعه ولماذا). هل الباع قريب من الطول؟ ثم أكتب شيئاً واحداً لا يُظهره رسمي، ولماذا تركه الرسم مع أنه
