const LD = {"id":"U06.L05","first":false,"title":"سكان الأمعاء، وقضية الوحدة: كيف صار الخبز سكراً؟","driving_question":"{اسم}، في أمعائك{|ِ} الآن تريليونات من الكائنات الحية التي ليست أنت{|ِ} — فهل هي ضيوف أم عمال أم أعداء؟ ثم: أغلق{|ي} القضية: كيف صار الخبز سكراً في دمك{|ِ}؟","central_fact":"في الأمعاء الغليظة تريليونات من الميكروبات النافعة تكسّر الألياف وتصنع فيتامينات وتحرس المكان، يطعمها الطعام النباتي ويضرها السكر الكثير والمضاد الحيوي بلا حاجة؛ والخبز صار سكراً على طول الطريق: لعاب، خلط، عصارة البنكرياس، خملات، كبد، خلية.","next":"U06.L06","nexts":[{"id":"U06.L06","gated":false}],"hook":{"text":"{اسم}، في أمعائك{|ِ} الآن تريليونات من الكائنات الحية الصغيرة التي ليست خلاياك{|ِ}. ما شعورك{|ِ}؟","options":["أريد التخلص منها كلها","ربما بعضها نافع؟","هذا مستحيل","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["digestive"],"highlight":["large_intestine"],"zoom":"colon","animate":"microbes"},"text":"سكان الأمعاء، أو الميكروبيوم، اسم نستعمله هنا لجماعة الكائنات الدقيقة في الأمعاء. في الدرس الماضي قلنا إن في الأمعاء الغليظة ميكروبات. والآن العدد: تريليونات — قريب من عدد خلايا جسمك{|ِ} كلها — من مئات الأنواع، بكتيريا في معظمها. ميكروب؟ نعم: كائن حي لا يُرى إلا بالمجهر. لكن انتبه{|ي}: ليست كلها سواء. في الفم رأينا بكتيريا تصنع حمضاً يؤذي السن. وفي وحدة الدفاع سنرى ميكروبات تُمرض. أما معظم سكان أمعائك{|ِ} فيعيشون معك{|ِ} بسلام منذ يوم ولادتك{|ِ} — أخذت{|ِ} أوائلهم من أمك{|ِ} — وجهاز دفاعك{|ِ} يعرفهم أصدقاء."},{"id":"E2","level":"A","atlas":{"layers":["digestive"],"highlight":["large_intestine"],"zoom":"colon","animate":"fiber_break"},"text":"ماذا يفعلون؟ ثلاثة أعمال. الأول: يأكلون ما لا تستطيع{|ين} هضمه — الألياف من الخضار والفاكهة والحبوب الكاملة — ويصنعون منها مواد تغذي جدار أمعائك{|ِ} نفسه. الثاني: يصنعون فيتامينات، منها واحد يحتاجه دمك{|ِ} ليتجلط عند الجرح. الثالث: يشغلون المكان؛ كل موضع يسكنه ميكروب نافع لا يجد الميكروب الضار فيه مكاناً ولا طعاماً. ليسوا ضيوفاً ولا أعداء: عمال يعيشون في البيت."},{"id":"E3","level":"A","atlas":{"layers":["digestive"],"highlight":["large_intestine"],"zoom":"colon"},"text":"ومن يطعمهم؟ أنت{|ِ}. أقوى ما يغيّر سكان أمعائك{|ِ} هو طعامك{|ِ}، ويستجيبون في أيام. الألياف طعامهم: فاكهة بقشرها، خضار، عدس وفول، خبز أسمر وشوفان. أما السكر الكثير والطعام المصنّع فلا يصلهم شيء منه تقريباً — يُمتَص قبلهم — ويفضّل أنواعاً أقل نفعاً فيقل التنوع. والتنوع علامة صحتهم. تغيير صغير واحد في طعامك{|ِ} تحسّه أمعاؤك{|ِ} قبل أن {تحسّه|تحسّيه} أنت{|ِ}."},{"id":"E4","level":"A","atlas":{"layers":["digestive"],"highlight":["large_intestine"],"zoom":"colon","animate":"antibiotic"},"text":"وشيء مهم عن دواء {تعرفه|تعرفينه}: المضاد الحيوي. دواء يقتل البكتيريا، وينقذ حياة حين تهاجمنا بكتيريا ضارة. لكنه لا يميّز: يقتل النافع مع الضار، فيترك أمعاءك{|ِ} أسابيع حتى يعود سكانها. ثلاث قواعد: لا يُؤخذ إلا بوصفة طبيب؛ ولا يعمل على الزكام لأن الزكام فيروس لا بكتيريا؛ ويُؤخذ كما وصفه الطبيب بالجرعة والمدة نفسها، فلا نوقفه ولا نزيده من عندنا، وإن ظهر ما يقلق نسأل الطبيب. واستعماله بلا حاجة يساعد البكتيريا على مقاومته. دواء ثمين يُستعمل بحكمة."},{"id":"E5","level":"A","atlas":{"layers":["digestive","circulatory"],"highlight":["mouth","stomach","duodenum","villus","liver","cell"],"zoom":"body","animate":"bread_case"},"text":"والآن نغلق القضية التي فتحناها في الوحدة الماضية: كيف صار الخبز سكراً؟ المحطة الأولى، الفم: الأسنان تصغّر واللعاب يبدأ تحويل النشا — الخبز الحلو. الثانية، المعدة: خلط بالحمض وتسليم دفعات؛ النشا ينتظر. الثالثة، الأمعاء الدقيقة: عصارة البنكرياس تكسّر النشا إلى قطع صغيرة، ومواد على جدار الأمعاء تُكمل تحويلها إلى سكر. الرابعة، الخملات: السكر يعبر الجدار إلى الدم. الخامسة، الكبد: يخزّن الفائض ويُطلقه بين الوجبات. السادسة، الخلية: يصل السكر فيُطلق الأكسجين طاقته — وهذه الوحدة الخامسة. قشرة الخبز الأسمر؟ ألياف، تتابع إلى السكان في الغليظة. لا شيء يضيع."},{"id":"E6","level":"B","atlas":{"layers":["digestive"],"highlight":["large_intestine"],"zoom":"colon"},"text":"للمستوى ب: كيف نختبر عمل ميكروبات الأمعاء؟ نجح الباحثون في تربية حيوانات بلا ميكروبات قابلة للكشف، ثم قارنوها بحيوانات لها ميكروبات مع ضبط الغذاء والظروف. وفي تجربة على فئران بالغة، غيّرت إضافة ميكروبات الأمعاء طريقة معالجة الغذاء وتخزين الطاقة. المقارنة مع الميكروبات وبدونها تكشف عملها؛ ولا تعني أن كل ميكروب نافع أو أن كل نتيجة في الفأر تنطبق علينا. وتقدير عدد البكتيريا بالنسبة إلى خلايا الإنسان قريب من واحد لواحد في نماذج للبالغين، لكنه ليس نسبة ثابتة لكل شخص، ولا يعني أن نصف وزن الجسم بكتيريا."},{"id":"E7","level":"B","atlas":{"layers":["digestive"],"highlight":["body"],"zoom":"body"},"text":"وحدود ما نعرف: ستسمع{|ين} أن «الأمعاء دماغ ثانٍ» وأن الميكروبات تصنع المزاج. هناك إشارات مثيرة في الفئران وبعض الدراسات في الناس، لكن الأدلة ما زالت غير حاسمة، وكثير مما يُباع باسم «ميكروبات نافعة» لم يُثبَت. العالِم يقول: «ربما، ولم نتأكد بعد». وما نتأكد منه اليوم يكفي: أطعمهم أليافاً، ولا تقتلهم بلا سبب، واغسل{|ي} يديك{|ِ} — لأن ميكروبات أمعائك{|ِ} نافعة في مكانها، لا على يدك{|ِ} ولا في طعام غيرك{|ِ}."}],"practice":[{"id":"U06.L05.P1","objective":"U06.L05.O1","type":"choose_reason","prompt":"ميكروبات أمعائك{|ِ}:","options":["معظمها نافع يعيش معك منذ الولادة","لا توجد","أعداء يجب أن نتخلص منها","جاءت من الطعام الفاسد الذي أكلناه"],"answer":0,"explanation":"معظم ميكروبات الأمعاء نافعة، بدأت تسكن أمعاءنا منذ الولادة وتعيش معنا.","level":"A","feedback_wrong":"من أين جاء أوائلهم؟","feedback_by_option":{"1":"في أمعائك{|ِ} تريليونات منها.","2":"بعضها يُمرض، لكن معظمها نافع؛ وقتلها كلها يضرك{|ِ}.","3":"بدأت تسكن أمعاءك{|ِ} منذ الولادة، لا من الطعام الفاسد."}},{"id":"U06.L05.P2","objective":"U06.L05.O2","type":"choose_reason","prompt":"أي هذه ليس من أعمال سكان الأمعاء؟","options":["تكسير الألياف","صنع حمض المعدة","صنع فيتامينات","شغل المكان عن الضارة"],"answer":1,"explanation":"حمض المعدة تصنعه المعدة نفسها، أما سكان الأمعاء فيعيشون في الأمعاء.","level":"A","feedback_wrong":"أين يعيشون؟ وأين يُصنع الحمض؟","feedback_by_option":{"0":"تكسير الألياف من أعمالهم فعلاً؛ والسؤال عما ليس من أعمالهم.","2":"صنع فيتامينات، منها K، من أعمالهم فعلاً؛ والسؤال عما ليس من أعمالهم.","3":"شغل المكان عن الضارة من أعمالهم فعلاً؛ والسؤال عما ليس من أعمالهم."}},{"id":"U06.L05.P3","objective":"U06.L05.O3","type":"choose_reason","prompt":"ما الذي يطعم سكان الأمعاء؟","options":["السكر والحلوى لأنها أسرع ما يُهضم","الماء الذي نشربه؛ فهم لا يأكلون من طعامنا","الألياف من الخضار والفاكهة والحبوب","اللحم، لأنه أغنى طعام بالبروتين"],"answer":2,"explanation":"الألياف لا نهضمها، فتصل إلى الأمعاء الغليظة طعاماً لسكانها.","level":"A","feedback_wrong":"ما الذي لا تهضمه أنت فيصل إليهم؟","feedback_by_option":{"0":"السكر يُمتص قبل أن يصلهم، والكثير منه يُضعف تنوعهم.","1":"هم يعيشون على ما لا نهضمه من طعامنا.","3":"اللحم يُهضم ويُمتص معظمه قبلهم؛ وطعامهم ما لا نهضمه."}},{"id":"U06.L05.P4","objective":"U06.L05.O4","type":"sequence","prompt":"رتّب{|ي} محطات الخبز حتى يصير سكراً في الخلية.","options":["الفم: اللعاب يبدأ","المعدة: خلط ودفعات","أول الأمعاء الدقيقة: عصارة البنكرياس تكسّر إلى سكر","الخملات: يعبر إلى الدم","الكبد: تخزين","الخلية: طاقة بالأكسجين"],"answer":[0,1,2,3,4,5],"explanation":"يبدأ اللعاب في الفم، فتخلط المعدة، ثم تكسّر عصارة البنكرياس النشا ويُكمل جدار الأمعاء تحويله إلى سكر، فيعبر من الخملات إلى الدم، فيخزّن الكبد الفائض، وتُطلق الخلية طاقته بالأكسجين.","level":"A","feedback_wrong":"أين يكتمل تحويل النشا؟ وأين يعبر؟"},{"id":"U06.L05.P5","objective":"U06.L05.O6","type":"choose_reason","prompt":"لماذا ربّى العلماء فئراناً بلا ميكروبات؟","options":["ليحموها من كل الأمراض فتعيش أطول من غيرها","لأنها أنظف وأسهل في المختبر","لا سبب علمي؛ كانت تجربة للتسلية","ليروا ماذا يحدث بدونها فيعرفوا عملها"],"answer":3,"explanation":"قاعدة «مع وبدون»: قارن العلماء فئراناً بلا ميكروبات بفئران معها، ليعرفوا ما تفعله الميكروبات.","level":"B","feedback_wrong":"قاعدة: مع وبدون.","feedback_by_option":{"0":"الهدف لم يكن حمايتها؛ أرادوا أن يعرفوا عمل الميكروبات.","1":"تربيتها أصعب لا أسهل؛ تحتاج أماكن معقّمة تماماً.","2":"كان لها سبب علمي: المقارنة «مع وبدون»."}}],"check":[{"id":"U06.L05.C1","objective":"U06.L05.O1","type":"true_false_why","prompt":"«معظم الميكروبات في أمعائنا نافعة أو مسالمة، وبعضها فقط يُمرض». صح أم خطأ؟ ولماذا؟","answer":"صح؛ تريليونات منها تعيش معنا وتساعدنا، والممرض قليل منها.","level":"A","rubric":"R1"},{"id":"U06.L05.C2","objective":"U06.L05.O2","type":"explain_open","prompt":"اذكر{|ي} ثلاثة أعمال لسكان الأمعاء.","answer":"تكسير الألياف، صنع فيتامينات (K)، شغل المكان عن الضارة (وتدريب الدفاع).","level":"A","rubric":"R1"},{"id":"U06.L05.C3","objective":"U06.L05.O3","type":"fix_model","prompt":"قال زميل{ك|تكِ}: «الألياف لا فائدة منها لأننا لا نهضمها». أصلح{|ي}.","answer":"هي طعام السكان الذين يصنعون منها ما يغذي الأمعاء وتجعل الخروج سهلاً.","level":"A","rubric":"R1"},{"id":"U06.L05.C4","objective":"U06.L05.O3","type":"explain_open","prompt":"اذكر{|ي} ثلاث قواعد للمضاد الحيوي وسبب كل واحدة.","answer":"بوصفة فقط (يقتل النافع)، لا للزكام (فيروس)، يُؤخذ كما وصفه الطبيب جرعةً ومدة (لا نوقفه ولا نزيده من عندنا).","level":"A","rubric":"R1"},{"id":"U06.L05.C5","objective":"U06.L05.O4","type":"explain_open","prompt":"أغلق{|ي} القضية في أربع جمل: أين بدأ تحويل الخبز، أين اكتمل، أين عبر، وأين أُطلقت طاقته.","answer":"بدأ في الفم باللعاب؛ اكتمل في أول الأمعاء الدقيقة بعصارة البنكرياس؛ عبر الخملات إلى الدم ثم الكبد؛ أُطلقت طاقته في الخلية بالأكسجين.","level":"A","rubric":"R1"},{"id":"U06.L05.C6","objective":"U06.L05.O5","type":"choose_reason","prompt":"في النموذج الخاطئ: «السكر يدخل الدم من المعدة». الصواب؟","options":["يدخل من الأمعاء الدقيقة عبر الخملات","صحيح؛ المعدة تمتص كل السكر","يدخل من الفم مع اللعاب قبل أن نبلع الطعام","لا يدخل الدم؛ يبقى في الأمعاء"],"answer":0,"explanation":"المعدة لا تمتص السكر؛ يدخل السكر الدم من الأمعاء الدقيقة عبر الخملات.","level":"B","feedback_by_option":{"1":"المعدة تخلط ولا تمتص السكر؛ والامتصاص بعدها.","2":"الفم يبدأ الهضم، ولا يدخل السكر الدم منه.","3":"السكر يدخل الدم ويصل الخلايا؛ وهذا هدف الهضم."}},{"id":"U06.L05.C7","objective":"U06.L05.O6","type":"true_false_why","prompt":"«رؤية الميكروبات في الأمعاء تكفي لنعرف أنها نافعة». صح أم خطأ؟","answer":"خطأ؛ نحتاج المقارنة بدونها (الفئران المعقّمة) لنعرف عملها.","level":"B","rubric":"R1"}],"concepts":[{"id":"microbe","term":{"ar":"الميكروب","en":"Microbe","zh":"微生物","pinyin":"wēishēngwù","match":["الميكروب","ميكروب","الميكروبات","ميكروبات"]},"priority":"core","atlas":{"layer":"digestive","element":"large_intestine"},"card":{"A":"كائن حي صغير جداً لا يُرى إلا بالمجهر: بكتيريا وغيرها. بعضها يُمرض، وأكثر ما في أمعائك{|ِ} نافع يعيش معك{|ِ}.","B":"كلمة عامة تشمل البكتيريا والفطريات الدقيقة والفيروسات؛ وليست كلها كائنات بالمعنى نفسه."}},{"id":"microbiome","term":{"ar":"سكان الأمعاء (الميكروبيوم)","en":"Gut microbiome","zh":"肠道微生物组","pinyin":"chángdào wēishēngwù zǔ","match":["سكان الأمعاء","الميكروبيوم","ميكروبيوم"]},"priority":"core","atlas":{"layer":"digestive","element":"large_intestine"},"card":{"A":"مجموع الميكروبات التي تعيش في أمعائك{|ِ} — تريليونات من مئات الأنواع — تأكل ما لا {تهضمه|تهضمينه} وتصنع لك{|ِ} فيتامينات وتحرس المكان.","B":"تتشكل منذ الولادة وتتغير بالطعام بسرعة؛ التنوع علامة صحة."}},{"id":"fiber","term":{"ar":"الألياف","en":"Fiber","zh":"膳食纤维","pinyin":"shànshí xiānwéi","match":["الألياف","ألياف"]},"priority":"core","atlas":{"layer":"digestive","element":"large_intestine"},"card":{"A":"أجزاء من النبات (خضار، فاكهة، حبوب كاملة، بقول) لا تستطيع عصاراتك{|ِ} هضمها — لكنها طعام سكان أمعائك{|ِ}، وتجعل الخروج سهلاً.","B":"الميكروبات تخمّرها وتصنع منها مواد تغذي خلايا الأمعاء نفسها."}},{"id":"antibiotic","term":{"ar":"المضاد الحيوي","en":"Antibiotic","zh":"抗生素","pinyin":"kàngshēngsù","match":["المضاد الحيوي","مضاد حيوي","المضادات الحيوية"]},"priority":"supporting","atlas":{"layer":"digestive","element":"large_intestine"},"card":{"A":"دواء يقتل البكتيريا؛ ينقذ حياة حين يصفه الطبيب، لكنه يقتل النافع مع الضار — فلا يُؤخذ إلا بوصفة، وكما وصفه الطبيب بالضبط.","B":"لا يعمل على الفيروسات (كالزكام)؛ وسوء استعماله يجعل البكتيريا تقاومه."}}],"experiment":{"title":"أطعم سكان أمعائي، وأغلق القضية","materials":["ورقة كبيرة بالمحطات الست","ألوان","قائمة طعام يوم (ما أكلته أمس)","بطاقة المضاد الحيوي"],"steps":["اكتب{|ي} ما {أكلته|أكلتِه} أمس. ضع{|ي} علامة ✓ أمام كل طعام فيه ألياف (خضار، فاكهة بقشرها، خبز أسمر، شوفان، عدس، فول، فاصولياء) وعلامة ○ أمام الحلويات والمشروبات المحلّاة والشيبس.","عدّ{|ي}: كم ✓ وكم ○؟ من أطعمت{|ِ} أكثر أمس: سكان أمعائك{|ِ} أم بكتيريا أسنانك{|ِ}؟ (لا مقارنة بين الأطفال.)","{اختر|اختاري} تغييراً واحداً صغيراً لهذا الأسبوع يطعم سكان أمعائك{|ِ}: فاكهة بقشرها، خبز أسمر، طبق عدس… {اكتبه|اكتبيه}.","القضية: على الورقة الكبيرة ارسم{|ي} رحلة لقمة الخبز في ست محطات: الفم، المعدة، أول الأمعاء الدقيقة، الخملات، الكبد، الخلية. اكتب{|ي} عند كل محطة ما يحدث للنشا/السكر بكلمة واحدة.","اشرح{|ي} القضية لشخص لم يتعلمها في دقيقتين، {واسأله|واسأليه} في النهاية: «أين يدخل السكر الدم؟»","اكتب{|ي} في الدفتر الجملة الواحدة التي تجمع الوحدتين الخامسة والسادسة: «الخبز يصير سكراً في ____، يدخل الدم في ____، يخزّنه ____، وتُطلق طاقته ____ بالأكسجين.»"],"safety":["لا تُقارن قوائم طعام الأطفال ولا تُعلَّق على أجسامهم؛ التغيير الذي يختاره الطفل لنفسه.","لا يُغيَّر دواء أو مضاد حيوي بسبب الدرس؛ من كان يأخذ دواءً يكمله كما وصف الطبيب.","لا نصائح حمية ولا منتجات."],"expected":"قائمة بعلامات، وتغيير واحد مختار، وخريطة بست محطات صحيحة، وشرح يجيب فيه المستمع: «في الأمعاء الدقيقة».","explain":"الألياف التي لا {تهضمها|تهضمينها} ليست ضائعة: تصل الأمعاء الغليظة طعاماً لتريليونات السكان، فيصنعون منها ما يغذي جدار أمعائك{|ِ} ويحرسون المكان ويصنعون فيتامينات. والسكر الكثير يطعم بكتيريا الفم ويُضعف تنوع سكان الأمعاء. وأما القضية فقد أُغلقت: الخبز نشا، بدأه اللعاب، وخلطته المعدة، وكسّرته عصارة البنكرياس إلى سكر في أول الأمعاء الدقيقة، وعبر الخملات إلى الدم، فمرّ بالكبد الذي خزّن الفائض، ووصل خلية عضلتك{|ِ} حيث أطلق الأكسجين طاقته. وحدتان في جملة.","record":"عدد ✓ و○، والتغيير المختار، والخريطة، وجواب المستمع، والجملة الجامعة.","alternatives":["بلا قائمة أمس: قائمة يوم مدرسي نموذجي.","بلا مستمع: تسجيل صوتي."]},"find_the_error":[{"id":"FE1","atlas_variant":"all_germs_bad","error":"كل الميكروبات مرسومة وحوشاً حمراء في الأمعاء","answer":"معظم سكان الأمعاء نافع","detects":"M65"},{"id":"FE2","atlas_variant":"sugar_from_stomach","error":"سهم السكر يدخل الدم من المعدة","answer":"من الأمعاء الدقيقة عبر الخملات","detects":"M51"},{"id":"FE3","atlas_variant":"bread_in_stomach","error":"«الخبز يصير سكراً هنا» على المعدة","answer":"يبدأ في الفم ويكتمل بعصارة البنكرياس في الأمعاء الدقيقة","detects":"M51"},{"id":"FE4","atlas_variant":"fiber_useless","error":"الألياف تذهب إلى سلة مهملات","answer":"طعام السكان وتسهيل الخروج","detects":"M66"},{"id":"FE5","atlas_variant":"antibiotic_cold","error":"مضاد حيوي يُعطى لرسم أنف يرشح","answer":"الزكام فيروس؛ المضاد للبكتيريا وبوصفة","detects":"M67"}],"numbers":[{"text":"تريليونات الميكروبات في أمعائك{|ِ} — عددها قريب من عدد خلاياك{|ِ} كلها — من مئات الأنواع، ومعظم وزنها في الأمعاء الغليظة.","source":["S4"]},{"text":"من أول لقمة إلى بدء ظهور سكرها في الدم: نحو عشر دقائق، ويبلغ أعلاه بعد نحو ساعة؛ ومن السكر في الدم إلى خلية في ساقك{|ِ}: أقل من دقيقة.","source":["S1","S_ADA"]}],"true_size":[{"text":"ضع{|ي} يدك{|ِ} أسفل سُرّتك{|ِ}: تحتها الآن تريليونات من الكائنات تعمل لك{|ِ} — وهي تأكل الآن ما {أكلته|أكلتِه} أمس.","source":["S4"]}],"animal":{"text":"تساعد ميكروبات الكرش البقرة على تكسير ألياف لا تهضمها عصاراتها وحدها. والكوالا له جهاز هضمي متكيف مع أوراق الكافور؛ ولا تعود قدرته على تحمل مركباتها إلى الميكروبات وحدها، فلجسمه وإنزيمات كبده دور مهم أيضًا. لا نعمم عمل كائن واحد على كل الحيوانات.","source":["S6","S8"]},"organ_letter":{"from":"بكتيريا واحدة في أمعائك{|ِ} الغليظة","text":"لست أنت{|ِ}، لكني أعيش فيك{|ِ} منذ يومك{|ِ} الأول. آكل ما لا تستطيع{|ين} — قشرة التفاحة وحبة العدس — وأصنع لك{|ِ} مما آكل غذاءً لجدار أمعائك{|ِ} وفيتاميناً لدمك{|ِ}، وأقف في مكاني فلا يجد الغريب الضار موضعاً. حين تأكل{|ين} حلوى طول اليوم لا يصلني شيء وأضعف. وحين تأخذ{|ين} مضاداً حيوياً بلا حاجة أموت أنا وأهلي، ويبقى المكان خالياً لمن هو أسوأ. {أطعمني|أطعميني} أليافاً، واغسل{|ي} يديك{|ِ} — فأنا نافعة هنا لا على يدك{|ِ}. مع التحية، واحدة من تريليونات."},"history":[{"who":"إيلي متشنيكوف","origin":"روسيا (أوكرانيا اليوم)","where_when":"باريس، 1900s","did":"اقترح أن بكتيريا الأمعاء تؤثر في الصحة والشيخوخة، ودعا إلى اللبن المتخمّر ودرسه هو وتلاميذه؛ ونال نوبل 1908 على أبحاثه في المناعة (البلعمة)، لا على فكرة اللبن.","did_not":"رأى أن الأمعاء الغليظة لا نفع لها للإنسان، ونعرف اليوم أن بكتيرياها تكسّر ما بقي من الطعام وتصنع فيتامين K. وتقرر مراجعة علمية حديثة أن علاجه باللبن لم يثبت علمياً أنه يؤخّر الشيخوخة.","method_lesson":"فكرة صحيحة في أصلها قد تحمل ادعاءات زائدة؛ نفصل الثابت عن المبالغ.","source":["S7","S1","S10"]}],"how_we_know":{"text":"كيف نختبر عمل ميكروبات الأمعاء؟ نجح الباحثون في تربية حيوانات بلا ميكروبات قابلة للكشف، ثم قارنوها بحيوانات لها ميكروبات مع ضبط الغذاء والظروف. وفي تجربة على فئران بالغة، غيّرت إضافة ميكروبات الأمعاء طريقة معالجة الغذاء وتخزين الطاقة. المقارنة مع الميكروبات وبدونها تكشف عملها؛ ولا تعني أن كل ميكروب نافع أو أن كل نتيجة في الفأر تنطبق علينا.","limit_question":"ما الذي يُوحي به رسم «الحارس» للميكروب خطأً؟"},"what_changed":["ظُنت كل الميكروبات أعداءً (بعد باستور وكوخ)؛ الصواب أن معظم ما يعيش فينا نافع أو مسالم.","قيل «10 ميكروبات لكل خلية»؛ قياس 2016 جعلها نحو 1:1 — الرقم تغيّر والفكرة بقيت."],"model_limits":["الميكروبات في الرسم كرات ملوّنة كبيرة؛ الحقيقة أصغر من خلاياك{|ِ} نحو 10 إلى 20 مرة في الطول، وبلا لون.","رسم «الحارس» للميكروب النافع تشبيه؛ لا نيّة له؛ ينافس على الغذاء والمكان فقط.","خريطة القضية خط واحد؛ الحقيقة ملايين اللقم والمسارات معاً.","(صورة title-boy) حُصرت النقاط في الغليظة لإبراز موضوع الدرس؛ هذا لا يعني خلو الأمعاء الدقيقة من ميكروبات. الألوان والوهج رمزان للتنوع لا ألوان حقيقية للكائنات.","(صورة title-girl) حُصرت النقاط في الغليظة لإبراز موضوع الدرس؛ هذا لا يعني خلو الأمعاء الدقيقة من ميكروبات. الألوان والوهج رمزان للتنوع لا ألوان حقيقية للكائنات.","(صورة E1) انتقال الميكروبات للأم/المولود هنا رمز لأحد المصادر؛ الاستعمار يتأثر بالولادة والتغذية والبيئة أيضًا، وليس مسارًا وحيدًا أو عدوى لازمة.","(صورة E2) نقاط التغذية تمثل نواتج تخمير الألياف مثل الأحماض الدهنية قصيرة السلسلة؛ لا تدخل الألياف الكاملة للخلايا. إنتاج الفيتامينات والمنافسة ليسا صفتين لكل الميكروبات أو ضمانًا للحماية.","(صورة E3) التنوع اللوني رسم نوعي لتأثير نمط غذائي مع الزمن؛ لا يمكن استنتاج تركيب ميكروبيوم شخص أو صحته من وجبة واحدة.","(صورة E4) التقويم يرمز إلى اتباع الوصفة والمدة التي يحددها الطبيب، لا إلى الإصرار على مدة ثابتة إذا عدّلها الطبيب. المضادات لا تعالج الزكام الفيروسي، وتعافي الميكروبيوم ليس مضمونًا بنفس الشكل أو الزمن.","(صورة E5) ست محطات مفهومية ضمن جذع مبسط، لا خريطة جسم كاملة. الأسهم الذهبية تختصر التتابع، وبعد الخملات تكون المغذيات في الدم ثم الكبد ثم أنسجة الجسم، وليس لقمة كاملة. المرور بالقلب والرئتين مختصر.","(صورة E6) مشهد حيوان تجريبي رمزي بلا ألم؛ ليست الفئران الخالية من الجراثيم دائمًا أصغر أو مريضة، ولا تضمن إعادة ميكروبات أي مصدر تحسن الصحة. حجرة/قفازات العزل مبسطة، والسهم إلى الفأر التالي يختصر متابعة الحالة.","(صورة E7) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات.","(صورة exp) الدوائر الست فارغة مقصودًا ليشرح الطفل المحطات شفهيًا؛ الإصبع يشير إلى الرابعة في تسلسل يبدأ أعلى اليسار ثم أعلى الوسط ثم أعلى اليمين ثم أسفل اليمين.","(صورة letter) الشخصية بقيت بيضية أكثر من كروية؛ الأسواط والوجه تشخيص قصصي، وليس كل ميكروبات الأمعاء كروية أو ذات أسواط.","(صورة letter) الوجه تشخيص قصصي مسموح في رسالة العضو فقط؛ الأحجام والابتسامات ليست تشريحًا حقيقيًا.","(صورة hist1) تصور فني للشخصية والمكان والأدوات؛ الملامح غير موثّقة، وليس توثيقًا بصريًا للحظة تاريخية بعينها.","(صورة life) مشهد قصصي تعليمي؛ تعابير الشخصيات والأحجام والإضاءة فنية وليست قياسات."],"faith":{"opening":null,"closing":{"text":"طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة","reference":"البخاري 5392؛ مسلم 2058","grade":"صحيح (متفق عليه)","usage":"قيمة","reflection":"تتبعنا لقمة الخبز في خمسة دروس: أسنان ولعاب، ومعدة تخلط، وأعضاء تعمل بصمت، وخملات تعبّر، وتريليونات من السكان يأكلون ما لا نهضم. كل ذلك ليصير الخبز سكراً في دمك{|ِ}. وقال النبي ﷺ: «طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة». فالقليل المشارَك يكفي، وعلى مائدتك{|ِ} مكان لواحد آخر. بمن تشارك{|ين} طعامك{|ِ} هذا الأسبوع؟","reviewed":false,"hadith_key":"bukhari:5392","lead":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","narration":false,"source":"البخاري 5392؛ مسلم 2058","grader":"","cards":[]}},"life":[{"situation":"أمي تقول خذ{|ي} مضاداً حيوياً من الصيدلية لأن عندك زكاماً.","science":"الزكام فيروس والمضاد لا يعمل عليه؛ وسيقتل سكان أمعائي النافعين بلا فائدة، وسوء الاستعمال يجعل البكتيريا تقاوم الدواء.","action":"أقول لأمي بأدب ما تعلمته، وأقترح أن نسأل الطبيب قبل أي دواء.","value":"برّ الوالدين لا يمنع النصيحة بأدب؛ وحفظ الدواء النافع أمانة للجميع.","why":"لماذا أتكلم مع أمي وهي أدرى؟ لأن النصيحة بأدب برّ لا عقوق، والدواء الذي يُستعمل بلا حاجة يضعف للجميع لا لي وحدي؛ والنبي ﷺ جعل الدين نصيحة، والنصيحة لأمي من أحب النصائح.","reference":"مسلم 55","hadith":["muslim:55"],"cards":[{"key":"muslim:55","lead":"عن تميم الداري رضي الله عنه أن النبي ﷺ قال:","text":"«الدين النصيحة». قلنا: لمن؟ قال: «لله، ولكتابه، ولرسوله، ولأئمة المسلمين، وعامتهم»","narration":true,"source":"مسلم 55","grade":"صحيح","grader":""}],"verses":[]},{"situation":"في المدرسة طبق فاكهة واحد وزميلان بلا طعام.","science":"القليل من الطعام يُهضم ويُمتص بكفاءة؛ جسمي يعمل على لقمة واحدة بخمسة أجهزة.","action":"أقسم الفاكهة وأشاركهما.","value":"طعام الاثنين كافي الثلاثة.","why":"لماذا أشارك ولا أشبع وحدي؟ لأني رأيت كم يعمل جسمي على القليل فيكفيه، ولأن مائدة النبي ﷺ كانت تتسع لمن جاء: «طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة».","reference":"البخاري 5392","cards":[],"verses":[]}],"open_questions":[{"q":"هل تؤثر ميكروبات الأمعاء في المزاج والنوم كما يقول بعض الباحثين؟","why_open":"هناك إشارات في الحيوان وبعض الدراسات في الإنسان، لكن الأدلة ما زالت غير حاسمة؛ لا نقول «نعم» قبل أن يستقر العلم."}],"notebook":{"draw":"ارسم{|ي} الأمعاء الغليظة وفيها سكانها (نقاط ملوّنة كثيرة) وألياف تصل إليهم، وبجوارها خريطة القضية بست محطات من الفم إلى الخلية. المستوى ب: {أضف|أضيفي} فأرين: معقّم وعادي، وما الفرق.","label":["سكان الأمعاء","ألياف","فيتامينات","الفم","المعدة","أول الأمعاء الدقيقة","الخملات","الكبد","الخلية","— ب: فأر معقّم / عادي"],"write":"أشرح: من يسكن أمعائي، وماذا يأكل، وماذا يفعل لي؟ ولماذا لا آخذ المضاد الحيوي للزكام؟ ثم أحكي رحلة الخبز من فمي حتى تُطلق خليتي طاقته."},"imgs":["U06.L05-E1","U06.L05-E2","U06.L05-E3","U06.L05-E4","U06.L05-E5","U06.L05-E6","U06.L05-E7","U06.L05-exp","U06.L05-hist1","U06.L05-letter","U06.L05-life","U06.L05-title-boy","U06.L05-title-girl"]};
