const LD = {"id":"U07.L03","first":false,"title":"الماء في جسمي: الميزان والعطش","driving_question":"{اسم}، يخرج ماؤك{|ِ} كل يوم من طرق كثيرة، بعضها لا تراه. فكيف يعرف جسمك{|ِ} أنه يحتاج ماءً؟ وكم {تحتاج|تحتاجين} أن تشرب{|ي}؟","central_fact":"الماء نحو نصف وزن الجسم أو أكثر، يدخل بالشراب والطعام ويخرج بالبول والعرق والنفَس والجلد؛ والدماغ يحفظ الميزان: يُشعرنا بالعطش ويرسل إلى الكليتين رسالة تعيدان بها الماء أو تُخرجان الزائد.","next":null,"hook":{"text":"{اسم}، لو وضعنا الماء الذي في جسمك{|ِ} وحده في كفة ميزان، فكم يكون من وزنك{|ِ}؟","options":["قليلاً، كوباً أو كوبين","نحو نصف وزني أو أكثر","كل وزني تقريباً","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["cells","circulatory"],"highlight":["cell","blood"],"zoom":"body","animate":"water_fill"},"text":"لو وزنّا الماء الذي في جسمك{|ِ} وحده لكان نحو نصف وزنك{|ِ} أو أكثر! عند الرضيع نحو ثلاثة أرباع وزنه ماء، وعند الكبير نحو النصف. أين هذا الماء؟ أكثره داخل الخلايا نفسها، والباقي في الدم وبين الخلايا. هذا هو ماء الجسم. الماء يحمل الغذاء والأكسجين في الدم، ويحمل الفضلات إلى الكليتين، ويبرّد الجسم بالعرق، ويملأ الخلايا لتعمل. ولهذا نحتاجه كل يوم: الجسم لا يحتفظ بالماء الزائد مخزوناً لوقت الحاجة، بل تُخرجه الكليتان."},{"id":"E2","level":"A","atlas":{"layers":["urinary","respiratory","skin"],"highlight":["kidney","lungs","skin"],"zoom":"body","animate":"water_scale"},"text":"تخيّل{|ي} ميزاناً بكفتين. في كفة ما يدخل: الشراب، وهو أكثره؛ والطعام — ففي الخضار والفاكهة والحساء ماء كثير، ونحو خُمس ما نحتاجه أو أكثر قليلاً يأتي من الطعام؛ وقليل يصنعه الجسم نفسه داخل الخلايا وهو يُطلق الطاقة. وفي الكفة الأخرى ما يخرج: البول، وهو أكثره؛ والعرق؛ والنفَس — نعم، في كل زفير بخار ماء لا تراه؛ ومن الجلد بلا عرق ظاهر؛ وقليل في البراز. عند الكبير يدخل نحو لترين ونصف ويخرج نحو لترين ونصف كل يوم. هذا هو توازن الماء: ما يدخل يساوي ما يخرج تقريباً."},{"id":"E3","level":"A","atlas":{"layers":["nervous","circulatory"],"highlight":["brain","blood"],"zoom":"head","animate":"thirst_signal"},"text":"فكيف يعرف جسمك{|ِ} أن الكفتين لم تتساويا؟ حين ينقص الماء يصير الدم أكثر تركيزاً، كالعصير حين يقلّ ماؤه. وفي قاع الدماغ حسّاسات صغيرة تشعر بهذا التركيز، فيُشعرك{|ِ} الدماغ بالعطش: يجفّ فمك{|ِ} وترغب{|ين} في الشرب. العطش رسالة مفيدة؛ نستجيب لها ولا نؤجلها. وفي الحر واللعب نفقد ماءً أكثر بالعرق والنفَس، فنشرب قبل أن يشتد العطش، وعلى مراحل."},{"id":"E4","level":"A","atlas":{"layers":["nervous","urinary"],"highlight":["brain","kidney"],"zoom":"body","animate":"message_to_kidney"},"text":"وفي الوقت نفسه يرسل الدماغ رسالة في الدم إلى الكليتين: أعيدا ماءً أكثر. فتعيد الكليتان معظم الماء إلى الدم، فيقلّ البول ويغمق — تذكّر{|ي} لوحة الألوان. وحين تشرب{|ي} أكثر من حاجتك{|ِ} يتوقف الدماغ عن إرسال الرسالة، فتُخرج الكليتان الزائد، ويكثر البول ويفتح لونه بعد قليل. ميزان لا يتوقف: لا يبقى ماء الجسم ثابتاً تماماً، بل يتأرجح قليلاً ثم يعود إلى نطاقه، كدرّاجة تميل ثم تعتدل."},{"id":"E5","level":"A","atlas":{"layers":["digestive"],"highlight":["mouth"],"zoom":"body","animate":"cups"},"text":"كم تشرب{|ين}؟ يُنصح الطفل من 4 إلى 8 سنوات بنحو 5 أكواب من السوائل في اليوم، ومن هو أكبر بنحو 7 إلى 8 أكواب — وأكثر في الحر والرياضة. والماء أفضلها. العصير المعلّب والمشروبات الغازية فيها ماء، لكن فيها سكراً كثيراً يضر الأسنان والجسم. اشرب{|ي} على مراحل طوال اليوم، واحمل{|ي} قارورة ماء {تعيد|تعيدين} ملأها، وراقب{|ي} لون البول. وإذا نقص ماء الجسم عن حاجته فهذا اسمه الجفاف، ومن علاماته: عطش، وصداع، وتعب، ودوار، وبول قليل غامق. حينها نشرب ونستريح في الظل، ونخبر الكبار إن لم نتحسن."},{"id":"E6","level":"B","atlas":{"layers":["nervous","endocrine","urinary"],"highlight":["brain","pituitary","kidney"],"zoom":"head"},"text":"للمستوى ب: الرسالة التي يرسلها الدماغ إلى الكليتين مادة كيميائية تسير في الدم اسمها الهرمون المضاد لإدرار البول. حين تقيس حسّاسات الدماغ أن الدم صار مركّزاً، يُطلَق الهرمون من غدة صغيرة تحت الدماغ؛ فيصل إلى الكليتين فتستعيدان ماءً أكثر من أنابيبهما، فيقلّ البول ويتركّز. فإذا عاد الدم إلى تركيزه المعتاد قلّ الهرمون، فخرج ماء أكثر. هذه تغذية راجعة: النتيجة نفسها توقف السبب، كمكيّف الهواء الذي يتوقف حين تبلغ الغرفة الحرارة المطلوبة، ثم يعمل من جديد حين تبتعد عنها."},{"id":"E7","level":"B","atlas":{"layers":["skin","respiratory"],"highlight":["skin","lungs"],"zoom":"body"},"text":"وكيف عرفنا أن الجسم يفقد ماءً لا نراه؟ قبل نحو أربعمئة سنة صنع الطبيب سانتوريو في مدينة بادوا كرسياً معلّقاً بميزان، وظل سنوات طويلة يزن نفسه، ويزن طعامه وشرابه وما يُخرجه. فوجد أن ما يُخرجه مما يُرى أقل بكثير مما يأكل ويشرب، والفرق يذهب بطريق لا يُرى: من الجلد والنفَس. لم يرَ الماء يخرج، لكن الميزان رآه. القياس يكشف ما لا تراه العين."}],"practice":[{"id":"U07.L03.P1","objective":"U07.L03.O1","type":"choose","prompt":"الماء في جسمك{|ِ} نحو:","options":["عُشر وزنك{|ِ}","نصف وزنك{|ِ} أو أكثر","كل وزنك{|ِ}","ما في الدم من ماء، لا أكثر"],"answer":1,"explanation":"نحو نصف وزن الجسم أو أكثر ماء، وأكثره داخل الخلايا.","level":"A","feedback_wrong":"ماذا كان جواب الميزان في أول الدرس؟","feedback_by_option":{"0":"أكثر بكثير؛ نحو النصف أو أكثر.","2":"في الجسم أيضاً عظام وبروتين ودهن؛ الماء نحو النصف أو أكثر.","3":"أكثر ماء الجسم داخل الخلايا، لا في الدم وحده."}},{"id":"U07.L03.P2","objective":"U07.L03.O2","type":"choose_reason","prompt":"أيّ هذه طريق يخرج منه الماء ولا نراه عادة؟","options":["البول","النفَس","الدموع حين نبكي","الماء الذي نشربه"],"answer":1,"explanation":"في كل زفير بخار ماء لا نراه، إلا على مرآة باردة.","level":"A","feedback_wrong":"ماذا ظهر على المرآة الباردة؟","feedback_by_option":{"0":"البول نراه؛ والسؤال عن طريق لا نراه.","2":"الدموع نراها، وهي قليلة.","3":"الشرب يُدخل الماء، لا يُخرجه."}},{"id":"U07.L03.P3","objective":"U07.L03.O3","type":"predict","prompt":"لعبت{|ِ} ساعة في الحر ولم تشرب{|ي}. ماذا يحدث غالباً؟","options":["يكثر البول ويفتح لونه","لا يتغير شيء لأن الجسم يخزّن الماء","أعطش، ويقلّ البول ويغمق"],"answer":2,"explanation":"نقص الماء يُشعرنا بالعطش، والدماغ يطلب من الكليتين أن تعيدا ماءً أكثر، فيقلّ البول ويغمق.","level":"A","feedback_wrong":"ماذا يفعل الدماغ والكليتان حين ينقص الماء؟","feedback_by_option":{"0":"هذا ما يحدث حين نشرب أكثر من حاجتنا.","1":"الجسم لا يخزّن الزائد؛ ونقص الماء يظهر عطشاً وبولاً قليلاً."}},{"id":"U07.L03.P4","objective":"U07.L03.O4","type":"choose","prompt":"أيّ هذه أفضل لعطشك{|ِ} اليومي؟","options":["الماء","مشروب غازي","عصير معلّب محلّى","مشروب رياضي ملوّن"],"answer":0,"explanation":"الماء يروي بلا سكر؛ والمشروبات المحلاة فيها سكر كثير يضر الأسنان والجسم.","level":"A","feedback_wrong":"أيها يروي بلا سكر؟","feedback_by_option":{"1":"فيه ماء، لكن فيه سكراً كثيراً.","2":"العصير المعلّب فيه سكر كثير؛ الماء أفضل للعطش.","3":"المشروبات الرياضية فيها سكر أيضاً؛ ليست شراب كل يوم."}},{"id":"U07.L03.P5","objective":"U07.L03.O5","type":"choose","prompt":"ماذا يفعل الهرمون المضاد لإدرار البول؟","options":["يكبّر المثانة","يصنع العطش في الفم","يُخرج ماءً أكثر من الجلد","يجعل الكليتين تعيدان ماءً أكثر"],"answer":3,"explanation":"يُطلقه الدماغ حين يتركز الدم، فتعيد الكليتان ماءً أكثر ويقلّ البول.","level":"B","feedback_wrong":"إلى أي عضو تصل رسالة الدماغ؟","feedback_by_option":{"0":"المثانة لا تتأثر به مباشرة؛ الكليتان تتأثران.","1":"العطش إحساس يُطلقه الدماغ؛ والهرمون رسالة إلى الكليتين.","2":"الهرمون يعمل في الكليتين لا في الجلد."}}],"check":[{"id":"U07.L03.C1","objective":"U07.L03.O1","type":"explain_open","prompt":"لماذا نحتاج الماء كل يوم، ولا يكفي أن نشرب كثيراً مرة في الأسبوع؟","answer":"لأن الماء يخرج كل يوم (بول وعرق ونفَس)، والجسم لا يخزّن الزائد: الكليتان تُخرجانه، فنحتاج ماءً جديداً كل يوم.","level":"A","rubric":"R1"},{"id":"U07.L03.C2","objective":"U07.L03.O2","type":"fix_model","prompt":"رسم زميل{ك|تكِ} ميزان الماء: في كفة الدخول الشرب، وفي كفة الخروج البول وحده. ماذا ينقص؟","answer":"في الدخول: الطعام وقليل يصنعه الجسم. وفي الخروج: العرق والنفَس والجلد والبراز.","level":"A","rubric":"R1"},{"id":"U07.L03.C3","objective":"U07.L03.O3","type":"true_false_why","prompt":"«حين ينقص ماء الجسم يقلّ البول ويغمق». صح أم خطأ؟ ولماذا؟","answer":"صح؛ الدماغ يرسل رسالة إلى الكليتين فتعيدان ماءً أكثر إلى الدم.","level":"A","rubric":"R1"},{"id":"U07.L03.C4","objective":"U07.L03.O3","type":"explain_open","prompt":"اكتب{|ي} بكلماتك{|ِ} ما يحدث بالترتيب حين ينقص ماء الجسم.","answer":"يتركز الدم، فتشعر حسّاسات الدماغ، فيُشعرنا بالعطش ويرسل رسالة إلى الكليتين، فتعيدان ماءً أكثر ويقلّ البول؛ نشرب فيعود الميزان.","level":"A","rubric":"R1"},{"id":"U07.L03.C5","objective":"U07.L03.O4","type":"true_false_why","prompt":"«العصير المحلّى أفضل من الماء للعطش كل يوم لأن فيه ماءً وسكراً». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ فيه ماء، لكن السكر الكثير يضر الأسنان والجسم؛ الماء أفضل للعطش اليومي.","level":"A","rubric":"R1"},{"id":"U07.L03.C6","objective":"U07.L03.O5","type":"explain_open","prompt":"لماذا نسمّي ميزان الماء في الجسم تغذية راجعة؟","answer":"لأن النتيجة توقف السبب: نقص الماء يُطلق الهرمون فتعيد الكليتان الماء، فإذا عاد الماء قلّ الهرمون.","level":"B","rubric":"R1"},{"id":"U07.L03.C7","objective":"U07.L03.O6","type":"true_false_why","prompt":"«رأى سانتوريو بعينه الماء يخرج من جلده». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لم يره؛ عرفه بالميزان: ما يخرج مما يُرى أقل مما يدخل، والفرق ذهب بطريق لا يُرى.","level":"B","rubric":"R1"}],"concepts":[{"id":"body_water","term":{"ar":"ماء الجسم","en":"Body water","zh":"体内水分","pinyin":"tǐnèi shuǐfèn","match":["ماء الجسم","ماء جسمك","ماء جسمي","ماء جسمه"]},"priority":"core","atlas":{"layer":"cells","element":"body_water"},"card":{"A":"الماء الذي في الجسم كله: نحو نصف وزن الكبير أو أكثر، وأكثر عند الرضيع؛ أكثره داخل الخلايا، والباقي في الدم وبين الخلايا.","B":"نحو 50 إلى 60 في المئة من وزن الكبير، ونحو 75 في المئة من وزن الرضيع؛ وأكثر من نصفه داخل الخلايا."}},{"id":"water_balance","term":{"ar":"توازن الماء","en":"Water balance","zh":"水平衡","pinyin":"shuǐ pínghéng","match":["توازن الماء","ميزان الماء"]},"priority":"core","atlas":{"layer":"urinary","element":"water_balance"},"card":{"A":"أن يدخل الجسم كل يوم ماء بقدر ما يخرج منه تقريباً: بالشراب والطعام، مقابل البول والعرق والنفَس والبراز.","B":"نحو لترين ونصف يدخلان ويخرجان كل يوم عند الكبير؛ ونحو 230 مل منها يصنعها الجسم نفسه داخل الخلايا."}},{"id":"thirst","term":{"ar":"العطش","en":"Thirst","zh":"口渴","pinyin":"kǒukě","match":["العطش","عطش","عطشت","عطشان","تعطش","نعطش"]},"priority":"core","atlas":{"layer":"nervous","element":"thirst_center"},"card":{"A":"شعور يرسله الدماغ حين ينقص ماء الدم، فيدفعنا إلى الشرب.","B":"حسّاسات في قاع الدماغ تقيس تركيز الدم؛ فإذا زاد التركيز أطلقت الإحساس بالعطش."}},{"id":"dehydration","term":{"ar":"الجفاف","en":"Dehydration","zh":"脱水","pinyin":"tuōshuǐ","match":["الجفاف","جفاف"]},"priority":"core","atlas":{"layer":"urinary","element":"dehydration"},"card":{"A":"نقص الماء في الجسم عن حاجته؛ من علاماته: عطش وصداع وتعب ودوار، وبول قليل غامق.","B":"يزيد خطره في الحر والرياضة والمرض بالإسهال أو القيء؛ الشرب على مراحل يقي منه، والجفاف الشديد يحتاج الطبيب."}},{"id":"adh","term":{"ar":"الهرمون المضاد لإدرار البول","en":"Antidiuretic hormone (ADH)","zh":"抗利尿激素","pinyin":"kànglìniào jīsù","match":["الهرمون المضاد لإدرار البول","المضاد لإدرار البول"]},"priority":"supporting","atlas":{"layer":"endocrine","element":"adh"},"card":{"A":"رسالة كيميائية يرسلها الدماغ في الدم إلى الكليتين حين ينقص الماء، فتعيدان ماءً أكثر.","B":"يُطلق من غدة صغيرة تحت الدماغ حين يتركز الدم؛ فيقلّ البول ويتركز، ويقلّ الهرمون حين يعود الماء."}}],"experiment":{"title":"المرآة الباردة والكيس الشفاف وجدول يومي","materials":["مرآة صغيرة أو ملعقة معدنية من الثلاجة","كيس بلاستيكي شفاف صغير بحجم اليد","كوب قياس (250 مل) وكوبك المعتاد","جدول اليوم في الدفتر، ولوحة ألوان البول من الدرس الماضي"],"steps":["انفخ{|ي} نفَساً دافئاً على المرآة الباردة أو الملعقة. ماذا ترى{|ين}؟ هذا ماء خرج مع نفَسك{|ِ}.","{أدخل|أدخلي} يدك{|ِ} في الكيس الشفاف و{اجمع|اجمعي} فمه حول الرسغ بيدك{|ِ} الأخرى برفق عشر دقائق، بلا شدّ ولا ربط. ماذا يظهر على جدار الكيس؟","{صبّ|صبّي} كوبك{|ِ} المعتاد في كوب القياس: كم مل يحمل؟","سجّل{|ي} في جدول يوم كامل: كل كوب ماء أو حليب أو عصير {تشربه|تشربينه}، ولون البول صباحاً وظهراً ومساءً على اللوحة.","في آخر اليوم {اجمع|اجمعي} الأكواب: هل قاربت{|ِ} 5 أكواب إن كنت{|ِ} في الثامنة، أو 7 إلى 8 إن كنت{|ِ} أكبر؟ وهل فتح لون البول حين شربت{|ِ} أكثر؟","اكتب{|ي}: من أين دخل الماء إلى جسمي اليوم؟ ومن أين خرج؟ وما الذي لم أره يخرج؟"],"safety":["الكيس على اليد فقط، لا يُربط ولا يُشدّ حول الرسغ، ولا يُوضع على الرأس أو الوجه أبداً، ويُنزع إن ضايقك.","الملعقة من الثلاجة لا من المجمّد، ولا تُلصق باللسان أو الشفتين.","من عنده تعليمات طبية في الشرب (مرض في القلب أو الكلى) يتبع طبيبه لا الجدول.","لا نقارن كميات شرب الزملاء ولا ألوان بولهم أمام الصف؛ الجدول لك وحدك ولأهلك."],"expected":"تتغطى المرآة الباردة بضباب أو قطرات صغيرة؛ يظهر على جدار الكيس رذاذ ماء بعد دقائق؛ والبول يفتح لونه في الأيام التي يكثر فيها الشرب.","explain":"الضباب على المرآة ماء خرج مع نفَسك{|ِ}، والرذاذ في الكيس ماء خرج من جلدك{|ِ} ولو لم تشعر{|ي} بعرق. هذان طريقان لا نراهما عادة، وهما ما اكتشفه سانتوريو بالميزان قبل أربعمئة سنة. فميزان الماء له كفتان: يدخل الماء بالشراب والطعام، ويخرج بالبول والعرق والنفَس والجلد. وحين تشرب{|ي} كفايتك{|ِ} يفتح لون البول، لأن الكليتين تُخرجان ما زاد؛ وحين ينقص الماء يُشعرك{|ِ} الدماغ بالعطش ويطلب من الكليتين أن تعيدا ماءً أكثر.","record":"ما رأيته على المرآة وفي الكيس، وحجم كوبي، وعدد الأكواب، وألوان البول في اليوم، والجواب.","alternatives":["بلا مرآة: زجاج نافذة باردة في الصباح، أو كوب ماء بارد من الخارج.","بلا كيس: قفاز بلاستيكي يُلبس عشر دقائق ثم يُنزع وتُنظر يد الداخل.","بلا كوب قياس: زجاجة ماء صغيرة مكتوب عليها حجمها."]},"find_the_error":[{"id":"FE1","atlas_variant":"only_urine","error":"ميزان الماء: في كفة الخروج البول وحده","answer":"يخرج الماء أيضاً بالعرق والنفَس والجلد والبراز","detects":"M75"},{"id":"FE2","atlas_variant":"juice_best","error":"لافتة: العصير المحلّى أفضل من الماء للعطش","answer":"الماء يروي بلا سكر؛ والمحلّى يضر الأسنان والجسم","detects":"M76"},{"id":"FE3","atlas_variant":"store_water","error":"خزان ماء مرسوم في البطن مكتوب عليه: احتياطي لأسبوع","answer":"الجسم لا يخزّن الماء الزائد؛ الكليتان تُخرجانه، فنشرب كل يوم","detects":"M77"}],"numbers":[{"text":"نحو ثلاثة أرباع وزن الرضيع ماء، ونحو النصف أو أكثر قليلاً عند الكبير.","source":["S1"]},{"text":"عند الكبير يدخل نحو لترين ونصف من الماء كل يوم ويخرج مثلها؛ ونحو 230 مل منها — قرابة كوب — يصنعها الجسم بنفسه.","source":["S2"]},{"text":"نحو خُمس ما نحتاجه من الماء إلى ربعه تقريباً يأتي من الطعام: الخضار والفاكهة والحساء.","source":["S4"]}],"true_size":[{"text":"املأ{|ي} 7 أكواب ماء و{صفّها|صفّيها} على الطاولة: هذا تقريباً ما يحتاجه طفل في العاشرة من السوائل في يوم عادي، يشربه على مراحل لا مرة واحدة.","source":["S3"]}],"animal":{"text":"جرذ الكنغر الصغير في صحارى أمريكا نادراً ما يشرب، وقد لا يشرب أبداً! يأخذ حاجته من الماء من البذور الجافة التي يأكلها: حين يُطلق جسمه الطاقة منها يتكوّن ماء قليل. ويقضي نهاره الحار في جحر تحت الرمل، وبوله وبرازه مركّزان جداً فلا يضيع ماؤه.","source":["S7"]},"organ_letter":{"from":"قطرة ماء في دمك{|ِ}","text":"مرحباً، أنا قطرة ماء. أمس كنت في كوبك{|ِ}، ثم عبرت جدار أمعائك{|ِ} إلى دمك{|ِ}. اليوم حملت سكراً إلى خلية في ساقك{|ِ}، وحملت يوريا إلى كليتيك{|ِ}. مررت في مصفاتهما مرات، وفي كل مرة أعادتني الكليتان لأنك{|ِ} كنت{|ِ} {تحتاجني|تحتاجينني}. وغداً؟ ربما أخرج مع زفيرك{|ِ} بخاراً لا تراه، أو مع عرقك{|ِ} وأنت{|ِ} تلعب{|ين}، أو في البول. لا أبقى عندك{|ِ} طويلاً، فلا {تنسني|تنسيني}: {اشربني|اشربيني} مع أخواتي على مراحل طوال اليوم. مع التحية، قطرة في ميزانك{|ِ}."},"history":[{"who":"سانتوريو سانتوريو","origin":"إيطاليا","where_when":"بادوا، نشر كتابه عام 1614","did":"جلس على كرسي معلّق بميزان، ووزن نفسه أكثر من ثلاثين سنة قبل الأكل والشرب وبعدهما، ووزن ما يُخرجه؛ فوجد أن ما يخرج مما يُرى أقل مما يدخل، فاستنتج أن جزءاً يخرج من الجلد والنفَس بلا أن يُرى، وسمّاه التعرّق غير المحسوس.","did_not":"لم تُحفظ أرقامه الأصلية، ولم يعرف كيف يخرج هذا الماء ولا ما الذي يضبط ميزانه؛ عرف العلماء ذلك بعده بقرون.","method_lesson":"إذا لم تستطع أن ترى الشيء فقِس ما يدخل وما يخرج.","source":["S6"]}],"how_we_know":{"text":"كيف نعرف أن الجسم يفقد ماءً لا نراه؟ قبل نحو أربعمئة سنة، في مدينة بادوا الإيطالية، جلس الطبيب سانتوريو على كرسي معلّق بميزان، وظل أكثر من ثلاثين سنة يزن نفسه قبل الأكل والشرب وبعدهما، ويزن طعامه وشرابه وما يُخرجه. فلاحظ أن ما يُخرجه مما يُرى أقل بكثير مما يأكل ويشرب. أين ذهب الفرق؟ استنتج أنه يخرج من الجلد ومع النفَس بلا أن يُرى، وسمّاه «التعرّق غير المحسوس». لم يرَ الماء يخرج، لكن الميزان رآه. واليوم نستطيع أن نرى بعضه بأنفسنا: نَفَس على مرآة باردة، ويد في كيس شفاف.","limit_question":"ما الذي لا يُظهره رسم ميزان الماء بكفتين متساويتين؟"},"what_changed":["كان يُظن أن ما يدخل الجسم يخرج كله مما يُرى (بول وبراز)؛ ثم كشف ميزان سانتوريو ماءً يخرج من الجلد والنفَس بلا أن يُرى.","يُقال أحياناً إن الجسم يخزّن الماء الزائد لوقت الحاجة؛ والأدق أن الكليتين تُخرجان الفائض خلال ساعات، فنحتاج ماءً جديداً كل يوم."],"model_limits":["الميزان بكفتين تبسيط: الكفتان لا تتساويان في كل لحظة، بل تتأرجحان ثم تعودان طوال اليوم.","الرسم يُظهر الماء أزرق في الجسم؛ ماء الجسم شفاف، وهو داخل الخلايا لا في خزان.","أرقام الأكواب تقريب لمجموعة أطفال؛ حاجة كل طفل تتغير بحجمه وطقسه ونشاطه وطعامه.","الكيس على اليد يجمع ماء الجلد مع شيء من العرق؛ ولا يقيس ما يخرج من الجسم كله."],"faith":{"opening":{"text":"۞ يَـٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍۢ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ","reference":"الأعراف 31","grade":"قرآن","usage":"حكم","reflection":"في الآية التي أمامك{|ِ} حكم واضح: نأكل ونشرب، ولا نُسرف. واليوم ننظر في جسمك{|ِ} فنرى ميزاناً للماء: يدخل بقدر ويخرج بقدر، وكليتان تُخرجان ما زاد، ودماغ يُشعرك{|ِ} بالعطش حين ينقص. العلم لا يشرح الآية، والآية لا تشرح العلم؛ لكن من رأى ميزان الماء في جسده فهم أن الاعتدال رفق بالجسد. فما الإسراف في الماء؟ أن نُكثر من المحلّى، أو نترك الصنبور يجري بلا حاجة، أو نشرب لنتسابق لا لنرتوي.","reviewed":false,"quran_key":"7:31","hl_words":[8,10],"highlight":"واشربوا ولا تسرفوا","level":"نهي","concept":"الشرب نعمة، والإسراف فيه منهي عنه؛ والاعتدال يشمل الشراب واستعمال الماء.","avoid":"لا نجعل ميزان الماء في الجسم دليلاً على الآية، ولا الآية دليلاً على أرقام الحاجة؛ ولا نُخيف الطفل من الشرب.","cards":[]},"closing":{"text":"كان النبي ﷺ يغسل — أو كان يغتسل — بالصاع إلى خمسة أمداد، ويتوضأ بالمد","reference":"البخاري 201؛ مسلم 325","grade":"صحيح (متفق عليه)","usage":"قيمة","reflection":"الماء نعمة نشربه ونتطهر به. وكان النبي ﷺ يتوضأ بالقليل منه، بالمدّ، وهو ملء الكفين المجتمعتين، ويغتسل بأربعة أمداد إلى خمسة. فالاعتدال في الماء ليس في الشرب وحده: نتوضأ ونغتسل بما يكفي، ولا نترك الصنبور يجري ونحن نفرك أيدينا أو أسناننا. الماء الذي لا نهدره اليوم يجده غيرنا غداً. ما الذي {ستفعله|ستفعلينه} لتوفّر الماء في بيتك{|ِ}؟","reviewed":false,"highlight":"ويتوضأ بالمد","full_verified":true,"level":"خبر","concept":"الاعتدال في استعمال الماء، وألا يُهدر ولو كان وفيراً.","avoid":"لا نعطي الطفل مقدار المدّ باللتر (يختلف العلماء في تقديره)، ولا نجعل قلة الماء في الوضوء مدعاة لتقصير في الطهارة.","matn_note":"المتن كاملاً بلفظ البخاري (كتاب الوضوء)، و«أو» شكّ من الراوي؛ يُقابَل حرفياً على الأصل عند المراجعة الشرعية","text_comparison_url":"https://hadeethenc.com/ar/browse/hadith/8387","text_compared_on":"2026-11-19","hadith_key":"bukhari:201","lead":"عن أنس رضي الله عنه قال:","narration":false,"source":"البخاري 201؛ مسلم 325","grader":"","cards":[]}},"life":[{"situation":"في الحر أشرب العصير المعلّب والمشروبات الغازية بدل الماء لأنها ألذّ.","science":"فيها ماء، لكن فيها سكراً كثيراً؛ والمشروبات المحلاة أكبر مصدر للسكر المضاف عند كثير من الناس، وكثرتها تضر الأسنان والجسم. والماء يروي بلا سكر.","action":"أحمل قارورة ماء أعيد ملأها، وأضيف إليها شريحة ليمون أو خيار إن أردت طعماً، وأجعل العصير قليلاً ومع الطعام.","value":"حفظ النفس والاعتدال في الشراب.","why":"لماذا الماء مع أن العصير أطيب طعماً؟ لأن الطعم الحلو لا يعني أن الشراب أنفع. العطش طلب من جسمك{|ِ} للماء، والماء وحده يعطيه ما طلب بلا سكر يأكل أسنانك{|ِ}. والحلو لا بأس به قليلاً مع الطعام؛ أما العطش فجوابه الماء.","cards":[],"verses":[]},{"situation":"بعد اللعب أشرب كوباً كبيراً دفعة واحدة بسرعة، فأشعر بثقل في بطني.","science":"بعد اللعب يكون الجسم قد فقد ماءً بالعرق والنفَس؛ والماء يُمتص من الأمعاء إلى الدم، والكليتان تُخرجان ما زاد. الشرب على دفعات يعطي الجسم ما يحتاجه دون أن نملأ المعدة مرة واحدة.","action":"أشرب على مهل، رشفات أتنفس بينها بعيداً عن الكوب، وأكرر بعد دقائق.","value":"الأدب في الشرب والرفق بالجسد.","why":"لماذا أتنفس بعيداً عن الكوب؟ ليبقى الماء نظيفاً لي ولغيري، ولأشرب على مهل. ومعنى الحديث في البطاقة أن النبي ﷺ كان يشرب على ثلاث دفعات: يُبعد الإناء عن فمه فيتنفس ثم يعود؛ وقد نهى عن التنفس داخل الإناء.","reference":"مسلم 2028","hadith":["muslim:2028"],"cards":[{"key":"muslim:2028","lead":"عن أنس بن مالك رضي الله عنه:","text":"أن رسول الله ﷺ كان يتنفس في الإناء ثلاثاً","narration":false,"source":"مسلم 2028","grade":"صحيح","grader":""}],"verses":[]}],"open_questions":[{"q":"كم يحتاج جسمك{|ِ} أنت{|ِ} من الماء بالضبط اليوم؟","why_open":"الحاجة تتغير بالعمر والحجم والطقس والنشاط والطعام؛ الأرقام المنصوح بها تقديرات لمجموعات من الناس، لا رقم دقيق لكل شخص في كل يوم."}],"notebook":{"draw":"ارسم{|ي} ميزاناً بكفتين. في كفة الدخول: كوب ماء، وطبق خضار وفاكهة، ونقطة صغيرة للماء الذي يصنعه الجسم. وفي كفة الخروج: البول، وقطرة عرق، وسحابة صغيرة عند الفم للنفَس، ونقاط على الجلد. ثم ارسم{|ي} سهماً من الدماغ إلى الكليتين واكتب{|ي}: أعيدا الماء. المستوى ب: {اكتب|اكتبي} على السهم اسم الهرمون المضاد لإدرار البول، وارسم{|ي} سهماً يعود إلى الدماغ واكتب{|ي}: تغذية راجعة.","label":["الشراب","الطعام","ماء يصنعه الجسم","البول","العرق","النفَس","الجلد","الدماغ والعطش","— ب: الهرمون المضاد لإدرار البول"],"write":"أشرح: من أين يدخل الماء إلى جسمي ومن أين يخرج؟ وكيف يعرف جسمي أنه يحتاج ماءً؟ ثم أكتب خطتي للشرب في يوم مدرسي."},"imgs":[]};
