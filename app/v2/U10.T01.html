const LD = {"id":"U10.T01","lesson":"U10.L01","first":false,"title":"اختبار: كيف أكبر؟","lessonTitle":"كيف أكبر؟","concepts":[],"check":[],"items":[{"id":"U10.L01.A1.a","objective":"U10.L01.O1","level":"A","type":"choose","prompt":"حين تنقسم خلية من خلايا جسمك{|ِ} تصير:","options":["خليتين متماثلتين","خلية واحدة أكبر","خلايا دم","أربع خلايا مختلفة الأشكال"],"answer":0,"explanation":"تنسخ الخلية ما فيها ثم تنقسم خليتين متماثلتين.","feedback_by_option":{"1":"الانقسام يزيد العدد لا الحجم.","2":"كل خلايا الجسم تنقسم بالطريقة نفسها، لا الدم وحده.","3":"الانقسام الواحد يعطي اثنتين متماثلتين."},"alt":{"prompt":"قبل أن تنقسم الخلية:","options":["تنسخ ما فيها ومنه تعليماتها","ترمي نواتها","تتحول إلى عظم","تخرج من الجسم"],"answer":0,"explanation":"تنسخ ما فيها، ومنه التعليمات، فتأخذ كل خلية جديدة نسخة.","feedback_by_option":{"1":"النواة فيها التعليمات، والخلية تنسخها لا ترميها.","2":"خلايا الغضروف وحدها يحل محلها عظم في صفيحة النمو.","3":"الخلية الجديدة تبقى تعمل في الجسم."}}},{"id":"U10.L01.A1.b","objective":"U10.L01.O1","level":"A","type":"true_false_why","prompt":"«الانقسام نفسه الذي ينمّيني يُصلح خدشي». صح أم خطأ؟ ولماذا؟","answer":"صح؛ خلايا الجلد عند حواف الخدش وأسفله تنقسم فتملأ مكانه، كما تنقسم الخلايا حين أنمو.","rubric":"R1","alt":{"prompt":"«أكبر لأن خلاياي تنتفخ كالبالون». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أكبر لأن خلاياي تنقسم فيزداد عددها."}},{"id":"U10.L01.A1.c","objective":"U10.L01.O1","level":"A","type":"choose_reason","prompt":"قاست ريم طولها صباحاً ثم مساءً فوجدته أقل بنصف سنتيمتر. السبب:","options":["أنها مريضة","أن الأقراص بين فقراتها انضغطت في النهار","أن عظامها صغرت","أن الشريط تمدد"],"answer":1,"explanation":"الأقراص بين الفقرات تنضغط في النهار وتمتلئ في النوم، فيعود الطول.","feedback_by_option":{"0":"هذا يحدث لكل الناس كل يوم، وليس مرضاً.","2":"العظام لا تصغر؛ الأقراص الطرية هي التي تنضغط.","3":"الفرق يتكرر بأدوات مختلفة؛ السبب في الجسم."},"alt":{"prompt":"لماذا نقيس طول الطفل في الوقت نفسه من اليوم؟","options":["لأن الشريط يتغير","لأن الطول يقل قليلاً في النهار ويعود في الليل","لأن الطفل يطول في الصباح","لأن الطبيب يريد ذلك بلا سبب"],"answer":1,"explanation":"الطول يتغير قليلاً خلال اليوم، فالمقارنة الصحيحة في الوقت نفسه.","feedback_by_option":{"0":"الشريط ثابت؛ الذي يتغير هو الجسم.","2":"النمو لا يحدث في الصباح فقط؛ الذي يتغير هو انضغاط الأقراص.","3":"للقياس في الوقت نفسه سبب: تغيّر الطول خلال اليوم."}}},{"id":"U10.L01.A2.a","objective":"U10.L01.O2","level":"A","type":"choose","prompt":"صفيحة النمو مصنوعة من:","options":["عضلة","عظم صلب","جلد","غضروف"],"answer":3,"explanation":"صفيحة النمو غضروف طري يُضاف منه عظم جديد.","feedback_by_option":{"0":"العضلة تحرّك العظم ولا تطيله.","1":"هي تصير عظماً صلباً في آخر البلوغ، فيتوقف الطول.","2":"الجلد يغطي الجسم من الخارج."},"detects":"M110","alt":{"prompt":"أين توجد صفيحتا النمو في عظم الفخذ؟","options":["في وسطه","قرب طرفيه","داخل نخاعه","في الركبة خارج العظم"],"answer":1,"explanation":"قرب طرفي العظم الطويل.","feedback_by_option":{"0":"الوسط صلب، والطول يُضاف عند الطرفين.","2":"النخاع يصنع الدم، والصفيحة قرب الطرفين.","3":"الصفيحة جزء من العظم نفسه قرب طرفه."}}},{"id":"U10.L01.A2.b","objective":"U10.L01.O2","level":"A","type":"true_false_why","prompt":"«الكبار لا يطولون لأن صفائح النمو عندهم تصلّبت». صح أم خطأ؟ ولماذا؟","answer":"صح؛ في آخر البلوغ تتصلب صفائح النمو وتصير عظماً، فلا يُضاف طول بعدها.","rubric":"R1","alt":{"prompt":"«صفيحة النمو أقوى من العظم الصلب». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ هي غضروف أضعف من العظم، ولذلك تحتاج إصابات الأطفال قرب المفاصل إلى طبيب."}},{"id":"U10.L01.A2.c","objective":"U10.L01.O2","level":"A","type":"explain_open","prompt":"سقط أخوك{|ِ} الصغير وصار يؤلمه مكان قرب ركبته. لماذا لا نقول «لا شيء» ونترك الأمر؟","answer":"لأن قرب المفصل عند الأطفال صفيحة نمو أضعف من العظم، وقد تُصاب؛ فنخبر الكبار ليعرضوه على الطبيب.","rubric":"R1"},{"id":"U10.L01.A3.a","objective":"U10.L01.O3","level":"A","type":"choose_reason","prompt":"يريد ماجد أن يطول بسرعة. أي هذه يساعده فعلاً؟","options":["أن يأكل ضعف طعامه","أن يأخذ فيتامينات كثيرة بلا طبيب","أن ينام كفايته ويأكل طعاماً متنوعاً ويتحرك","أن يسهر ليتحرك أكثر"],"answer":2,"explanation":"النوم الكافي والطعام المتنوع والحركة تدعم النمو؛ والزيادة لا تزيد الطول.","feedback_by_option":{"0":"الطعام الزائد يزيد الوزن لا الطول.","1":"الفيتامينات الزائدة لا تزيد الطول، والدواء من الطبيب والأهل فقط.","3":"السهر يُنقص النوم الذي يُفرز فيه أكثر هرمون النمو."},"detects":"M109","alt":{"prompt":"ما الذي لا يزيد الطول؟","options":["النوم الكافي","الطعام المتنوع","الطعام الزائد عن الحاجة","الحركة المنتظمة"],"answer":2,"explanation":"الزيادة تزيد الوزن لا الطول.","feedback_by_option":{"0":"النوم يُفرز فيه أكثر هرمون النمو.","1":"الخلايا الجديدة تُبنى من الطعام المتنوع.","3":"الحركة تقوّي العظم والعضلة."}}},{"id":"U10.L01.A3.b","objective":"U10.L01.O3","level":"A","type":"choose","prompt":"هرمون النمو:","options":["رسالة كيميائية يرسلها الدماغ في الدم","عظم صغير في الركبة","طعام يُشترى من الصيدلية للأطفال","عضلة في الساق"],"answer":0,"explanation":"رسالة كيميائية يرسلها جزء صغير في قاع الدماغ في الدم، وأكثرها في النوم.","feedback_by_option":{"1":"هذه صفيحة النمو ربما؛ الهرمون رسالة في الدم.","2":"الهرمون يصنعه الجسم نفسه، ولا يُعطى للأطفال إلا بقرار طبيب في حالات خاصة.","3":"العضلة تنمو بأمر الهرمون، وليست هي."},"detects":"M108","alt":{"prompt":"أكثر هرمون النمو يُفرز:","options":["في الأكل","في النوم","في الجري","في الحمّام"],"answer":1,"explanation":"أكثره في النوم؛ فالنوم الكافي جزء من النمو.","feedback_by_option":{"0":"الطعام مواد للبناء.","2":"الحركة تقوّي، والأكثر في النوم.","3":"لا علاقة للحمّام بالهرمون."}}},{"id":"U10.L01.A3.c","objective":"U10.L01.O3","level":"A","type":"true_false_why","prompt":"«النوم وقت ضائع لا يفيد جسمي في النمو». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أكثر هرمون النمو يُفرز في النوم، والأقراص بين الفقرات تمتلئ فيه أيضاً.","rubric":"R1","detects":"M108","alt":{"prompt":"«الفيتامينات الكثيرة تجعل الطفل أطول». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الغذاء المتنوع يكفي، والزيادة لا تزيد الطول، والطول يحدده أكثره الوراثة."}},{"id":"U10.L01.A4.a","objective":"U10.L01.O4","level":"A","type":"choose","prompt":"التعليمات التي في نواة كل خلية تقول للجسم كيف يُبنى. اسمها:","options":["هرمون النمو","الغضروف","الحمض النووي","العصب"],"answer":2,"explanation":"الحمض النووي: تعليمات نصفها من الأم ونصفها من الأب.","feedback_by_option":{"0":"الهرمون رسالة في الدم، لا تعليمات في النواة.","1":"الغضروف مادة طرية في صفيحة النمو.","3":"العصب يحمل الرسائل إلى الدماغ ومنه."},"alt":{"prompt":"التعليمات في خلاياك{|ِ} جاءتك{|ِ}:","options":["من الأم دون الأب","من الأب دون الأم","نصفها من الأم ونصفها من الأب","من الطعام"],"answer":2,"explanation":"نصفها من الأم ونصفها من الأب؛ ولهذا نشبه الأهل.","feedback_by_option":{"0":"الأب أعطى النصف الآخر.","1":"الأم أعطت النصف الآخر.","3":"الطعام مواد للبناء لا تعليمات."}}},{"id":"U10.L01.A4.b","objective":"U10.L01.O4","level":"A","type":"true_false_why","prompt":"«الطفل الأقصر في الصف متأخر وفيه شيء خطأ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ أكثر الاختلاف في الطول وراثي، والأطفال يختلفون في موعد النمو، والمهم أن يطول هو عاماً بعد عام.","rubric":"R1","detects":"M107","alt":{"prompt":"«الطبيب يعرف نمو الطفل بمقارنته بأطول زملائه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الطبيب يقارن الطفل بنفسه مع الزمن: هل يستمر في النمو بمعدل طبيعي."}},{"id":"U10.L01.A4.c","objective":"U10.L01.O4","level":"A","type":"explain_open","prompt":"أخوان يأكلان الطعام نفسه وينامان في الوقت نفسه، وأحدهما أطول من الآخر. {فسّر|فسّري}.","answer":"لأن أكثر الاختلاف في الطول وراثي: لكل منهما مزيج مختلف من التعليمات من الأبوين؛ وقد يختلف موعد نموهما أيضاً.","rubric":"R1"},{"id":"U10.L01.A5.a","objective":"U10.L01.O5","level":"B","type":"choose","prompt":"كم كروموسوماً في كل خلية من خلايا جسمك{|ِ}؟","options":["23","46","100","2"],"answer":1,"explanation":"46 كروموسوماً في 23 زوجاً، من كل زوج واحد من الأم وواحد من الأب.","feedback_by_option":{"0":"23 عدد الأزواج، والكروموسومات 46.","2":"العدد في خلايا الإنسان 46.","3":"اثنان في كل زوج، والأزواج 23."},"alt":{"prompt":"في كل زوج من الكروموسومات:","options":["اثنان من الأم","اثنان من الأب","واحد من الأم وواحد من الأب","كروموسوم واحد"],"answer":2,"explanation":"من كل زوج واحد من الأم وواحد من الأب.","feedback_by_option":{"0":"الأم أعطت واحداً من كل زوج.","1":"الأب أعطى واحداً من كل زوج.","3":"الزوج اثنان."}}},{"id":"U10.L01.A5.b","objective":"U10.L01.O5","level":"B","type":"true_false_why","prompt":"«الأطفال في البلاد المختلفة ينمون مختلفين مهما توفر لهم الغذاء والرعاية». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ دراسة منظمة الصحة العالمية على أطفال من ست دول وجدت نموهم متشابهاً حين تُلبّى حاجاتهم من الصحة والرعاية.","rubric":"R1","alt":{"prompt":"«الوراثة تفسر أكثر الاختلاف في الطول بين أفراد البلد الواحد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نحو 80% من الاختلاف في الطول بين الأفراد وراثي، والباقي غذاء وصحة."}},{"id":"U10.L01.A5.c","objective":"U10.L01.O5","level":"B","type":"explain_open","prompt":"متوسط الطول في بعض البلاد زاد كثيراً في مئة سنة. هل تغيّرت الوراثة بهذه السرعة؟ {فسّر|فسّري}.","answer":"لا؛ الوراثة لا تتغير في جيلين أو ثلاثة. الذي تغيّر الغذاء والصحة والرعاية، وهي تفسر كثيراً من الاختلاف بين البلاد والأزمان.","rubric":"R1"}],"transfer":[{"id":"U10.L01.T1","objective":"U10.L01.O4","type":"explain_open","prompt":"قال صديقك{|ِ} الحزين: «أنا أقصر من كل الصف، لن أصير قوياً أبداً». ماذا {تقول|تقولين} له؟ ولماذا؟","answer":"أطمئنه: الأطفال يختلفون في موعد النمو، وكثيرون يطولون متأخرين؛ وأكثر الطول وراثي ولا يدل على قوة ولا قيمة؛ والقوة بالحركة والنوم والغذاء، وبالعلم والخلق أيضاً.","level":"A","rubric":"R1"},{"id":"U10.L01.T2","objective":"U10.L01.O3","type":"explain_open","prompt":"{صمّم|صمّمي} خطة أسبوع تساعد جسمك{|ِ} على النمو، و{فسّر|فسّري} كل بند فيها.","answer":"نوم كافٍ كل ليلة لأن أكثر هرمون النمو يُفرز فيه؛ طعام متنوع فيه بروتين وحليب وخضار لأن الخلايا الجديدة تُبنى منه؛ حركة ولعب في الهواء لأنها تقوّي العظم والعضلة؛ وقياس الطول في الوقت نفسه من اليوم كل شهر.","level":"A","rubric":"R1"}],"recall":[{"id":"U10.L01.D1","objective":"U10.L01.O1","type":"choose","prompt":"يكبر الجسم لأن:","options":["الخلايا تنتفخ","الخلايا تنقسم فيزداد عددها","العظام تتمدد بالماء"],"answer":1,"explanation":"الخلية تنسخ ما فيها ثم تنقسم.","level":"A","feedback_by_option":{"0":"العدد يزداد لا الحجم وحده.","2":"العظم يطول بعظم جديد من صفيحة النمو."}},{"id":"U10.L01.D2","objective":"U10.L01.O2","type":"choose","prompt":"العظم الطويل يطول من:","options":["قرب طرفيه","وسطه","سطحه كله","نخاعه"],"answer":0,"explanation":"من صفيحتي النمو قرب طرفيه.","level":"A","feedback_by_option":{"1":"الوسط صلب.","2":"الطول يُضاف عند الطرفين.","3":"النخاع يصنع الدم."}},{"id":"U10.L01.D3","objective":"U10.L01.O3","type":"choose","prompt":"أكثر هرمون النمو يُفرز:","options":["في الأكل","في الجري","في النوم","في المدرسة"],"answer":2,"explanation":"أكثره في النوم.","level":"A","feedback_by_option":{"0":"الطعام مواد البناء.","1":"الحركة تقوّي، والأكثر في النوم.","3":"يُفرز قليل في النهار."}},{"id":"U10.L01.D4","objective":"U10.L01.O4","type":"choose","prompt":"نقارن نمو الطفل:","options":["بأطول زملائه","بنفسه مع الزمن","بأقصر زملائه"],"answer":1,"explanation":"الطفل يُقارن بنفسه: هل يطول عاماً بعد عام؟","level":"A","feedback_by_option":{"0":"الأطفال يختلفون في موعد النمو.","2":"المقارنة بغيره لا تقول شيئاً عن نموه."}},{"id":"U10.L01.D5","objective":"U10.L01.O4","type":"choose","prompt":"الحمض النووي:","options":["تعليمات في نواة كل خلية","هرمون في الدم","غضروف في العظم"],"answer":0,"explanation":"تعليمات نصفها من الأم ونصفها من الأب.","level":"A","feedback_by_option":{"1":"الهرمون رسالة في الدم.","2":"الغضروف في صفيحة النمو."}},{"id":"U10.L01.D6","objective":"U10.L01.O1","type":"choose","prompt":"لماذا {تكون|تكونين} أطول قليلاً في الصباح؟","options":["لأنك{|ِ} {نمَوت|نمَوتِ} في الليل كثيراً","لأن الأقراص بين الفقرات امتلأت في النوم","لأنك{|ِ} {أكلت|أكلتِ} العشاء"],"answer":1,"explanation":"الأقراص تمتلئ في الاستلقاء وتنضغط في النهار.","level":"A","feedback_by_option":{"0":"النمو بطيء جداً لا يُرى في ليلة.","2":"العشاء لا يغيّر الطول."}},{"id":"U10.L01.D7","objective":"U10.L01.O5","type":"choose","prompt":"عدد الكروموسومات في خلية الجسم:","options":["23",
