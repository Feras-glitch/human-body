const LD = {"id":"U11.T03","lesson":"U11.L03","first":false,"title":"اختبار: كيف أحكم على معلومة صحية؟ علماء أخطؤوا","lessonTitle":"كيف أحكم على معلومة صحية؟ علماء أخطؤوا","concepts":[],"check":[],"items":[{"id":"U11.L03.A1.a","objective":"U11.L03.O1","level":"A","type":"choose","prompt":"ما الدليل؟","options":["ما يقوله أكثر الناس في المجموعة","ملاحظات ومقارنات يكررها غيرنا","ما يقوله الشخص المشهور في الإعلان","ما نتمنى أن يكون صحيحاً من الأخبار"],"answer":1,"explanation":"الدليل ملاحظات وقياسات ومقارنات يكررها غيرنا فيجد مثلها.","feedback_by_option":{"0":"كثرة القائلين ليست دليلاً.","2":"الشهرة ليست دليلاً.","3":"التمني لا يجعل الشيء صحيحاً."},"alt":{"prompt":"أي هذه دليل على أن علاجاً ينفع؟","options":["أرسله كثيرون في يوم واحد","إعلانه جميل ومؤثر ومليء بالألوان","تحسن آخذوه أكثر من مجموعة مشابهة","قال صاحبه إنه جرّبه بنفسه وتحسن"],"answer":2,"explanation":"المقارنة العادلة بين مجموعتين دليل.","feedback_by_option":{"0":"الكثرة ليست دليلاً.","1":"الإعلان يقنع ولا يُثبت.","3":"تجربة شخص واحد لا تكفي."}}},{"id":"U11.L03.A1.b","objective":"U11.L03.O1","level":"A","type":"true_false_why","prompt":"«إذا قالها طبيب مشهور أو أرسلها كثيرون فهي صحيحة». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ الشهرة وكثرة النشر ليستا دليلاً؛ نسأل كيف عرف وهل قورن وماذا يقول أهل العلم.","rubric":"R1","detects":"M123","alt":{"prompt":"«من الأسئلة الجيدة عن أي ادعاء صحي: كيف عرف قائله؟». صح أم خطأ؟ ولماذا؟","answer":"صح؛ لأن الدليل هو الذي يحكم، فنسأل من أين جاء القائل بقوله."}},{"id":"U11.L03.A1.c","objective":"U11.L03.O1","level":"A","type":"choose_reason","prompt":"رسالة تقول: «هذا الشراب يشفي كل الأمراض في يوم، أرسلها فوراً». ما الذي يجعلها تحتاج تحققاً؟","options":["أنها قصيرة وفيها كلمات قليلة","تعد بنتيجة كاملة بلا دليل","أنها عن الشراب لا عن الطعام","أنها وصلت صباحاً قبل المدرسة"],"answer":1,"explanation":"الوعد بنتيجة سريعة كاملة بلا دليل، مع طلب النشر فوراً، علامة تستدعي التحقق.","feedback_by_option":{"0":"الطول لا يحكم على الصدق.","2":"الرسائل عن الشراب قد تصح وقد تخطئ.","3":"وقت الوصول لا علاقة له."},"alt":{"prompt":"قبل أن {تنشر|تنشري} رسالة صحية:","options":["أنشرها فوراً","أتحقق منها","أغيّر كلماتها","أضيف إليها صورة"],"answer":1,"explanation":"نتحقق قبل أن ننشر.","feedback_by_option":{"0":"النشر قبل التحقق قد يضر غيرنا.","2":"تغيير الكلمات لا يجعلها صحيحة.","3":"الصورة لا تضيف دليلاً."}}},{"id":"U11.L03.A2.a","objective":"U11.L03.O2","level":"A","type":"choose_reason","prompt":"ماذا تعلّمنا قصة جالينوس وابن سينا وابن النفيس؟","options":["أن العلماء الكبار لا يخطئون في الطب","أن الكتب القديمة صحيحة كلها بلا استثناء","أن ابن النفيس كان أشهر منهما في زمنه","أن الدليل يصحح خطأ الكبار"],"answer":3,"explanation":"أخطأ جالينوس ونقل ابن سينا خطأه، وصحّحه ابن النفيس بالدليل.","feedback_by_option":{"0":"أخطأ جالينوس في حاجز القلب.","1":"الخطأ بقي قروناً في الكتب.","2":"لم تكن الشهرة هي التي صحّحت، بل الدليل."},"detects":"M124","alt":{"prompt":"بماذا قال ابن النفيس إن حاجز القلب صلب؟","options":["بالشهرة","بالدليل والنظر","بالقرعة","بتصويت الأطباء"],"answer":1,"explanation":"بالنظر والدليل، ضد ما في الكتب الموروثة.","feedback_by_option":{"0":"الشهرة كانت لجالينوس وابن سينا.","2":"القرعة ليست طريقة علم.","3":"لم يصوّت أحد؛ الدليل حكم."}}},{"id":"U11.L03.A2.b","objective":"U11.L03.O2","level":"A","type":"true_false_why","prompt":"«ابن سينا عالم كبير، فلا يمكن أن ينقل خطأ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ نقل في «القانون» قول جالينوس بثقوب حاجز القلب، وكان خطأ صحّحه ابن النفيس.","rubric":"R1","alt":{"prompt":"«العلم يصحح نفسه حين يظهر دليل جديد». صح أم خطأ؟ ولماذا؟","answer":"صح؛ كما صحّح ابن النفيس قول جالينوس في حاجز القلب بالدليل."}},{"id":"U11.L03.A2.c","objective":"U11.L03.O2","level":"A","type":"sequence","prompt":"{رتّب|رتّبي} قصة حاجز القلب.","options":["جالينوس يقول: في الحاجز ثقوب","ابن سينا ينقل القول في «القانون»","الخطأ يبقى قروناً في الكتب","ابن النفيس يقول: الحاجز صلب والدم يمر بالرئة"],"answer":[0,1,2,3],"explanation":"القول، ثم النقل، ثم البقاء قروناً، ثم التصحيح بالدليل.","alt":{"type":"choose","prompt":"أين يمر الدم من الجانب الأيمن إلى الأيسر عند ابن النفيس؟","options":["من ثقوب الحاجز","من الرئة","من الكبد","من المعدة"],"answer":1,"explanation":"من الرئة؛ والحاجز صلب.","feedback_by_option":{"0":"هذا قول جالينوس الذي ردّه.","2":"الكبد ليس طريق الدم بين جانبي القلب.","3":"المعدة في الجهاز الهضمي."}}},{"id":"U11.L03.A3.a","objective":"U11.L03.O3","level":"A","type":"choose","prompt":"ماذا فعل زيملفايس ليعرف السبب؟","options":["قارن جناحين وغيّر شيئاً واحداً","سأل أشهر الأطباء في ڤيينا وأوروبا","قرأ كتب جالينوس القديمة كلها مرة أخرى","انتظر أن يتغير الحال وحده سنوات"],"answer":0,"explanation":"قارن بين جناحين، وغيّر شيئاً واحداً، وقاس النتيجة.","feedback_by_option":{"1":"الشهرة لا تجيب؛ المقارنة أجابت.","2":"كتب جالينوس لم تكن فيها الجراثيم.","3":"لم ينتظر؛ غيّر وقاس."},"alt":{"prompt":"بعد تطهير الأيدي في جناح زيملفايس، الوفيات:","options":["زادت","بقيت كما هي","نقصت كثيراً","لم تُقس"],"answer":2,"explanation":"من نحو 18 في المئة إلى نحو 1.","feedback_by_option":{"0":"نقصت ولم تزد.","1":"تغيّرت كثيراً.","3":"قيست وسُجّلت."}}},{"id":"U11.L03.A3.b","objective":"U11.L03.O3","level":"A","type":"true_false_why","prompt":"«الفكرة التي يرفضها أكثر الناس خطأ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ رفض أكثر الأطباء فكرة زيملفايس وكانت صحيحة؛ الحكم للدليل لا لعدد الرافضين.","rubric":"R1","alt":{"prompt":"«قُبلت فكرة زيملفايس بعد أن عرف العلماء الجراثيم». صح أم خطأ؟ ولماذا؟","answer":"صح؛ بعد موته جاءت أعمال باستور في الجراثيم ففُهم لماذا ينفع غسل الأيدي."}},{"id":"U11.L03.A3.c","objective":"U11.L03.O3","level":"A","type":"explain_open","prompt":"قال صديقك{|ِ}: «كل الصف يقول إن هذا صحيح، إذن هو صحيح». {أجب|أجيبي} بقصة من الدرس.","answer":"كثرة القائلين ليست دليلاً؛ أكثر الأطباء رفضوا زيملفايس وكان محقاً، والكتب قروناً قالت بثقوب الحاجز وكانت مخطئة.","rubric":"R1"},{"id":"U11.L03.A4.a","objective":"U11.L03.O4","level":"A","type":"choose_reason","prompt":"خالتك{|ِ} تقول: «هذه الخلطة طبيعية، أعطوها للأطفال». ماذا {تقول|تقولين} بلطف؟","options":["نسأل الطبيب أولاً","نعطيها لأخي الصغير ونرى ما يحدث","ما في الطبيعة دواء للأطفال كلهم","نرسل الوصفة للجميع في المجموعة"],"answer":0,"explanation":"بعض ما في الطبيعة يضر، والدواء للأطفال من الطبيب والأهل.","feedback_by_option":{"1":"لا نجرّب على أحد.","2":"بعض ما في الطبيعة سام.","3":"لا ننشر ما لم نتحقق منه."},"detects":"M125","alt":{"prompt":"الفطر البري:","options":["طبيعي وبعضه سام","آمن لأنه طبيعي","دواء لكل مرض","لا يأكله أحد من الناس"],"answer":0,"explanation":"طبيعي، وبعضه سام؛ فالطبيعي ليس آمناً بالضرورة.","feedback_by_option":{"1":"الطبيعي ليس آمناً بالضرورة.","2":"لا دليل على ذلك.","3":"بعضه يؤكل بعد أن يعرفه أهل الخبرة."}}},{"id":"U11.L03.A4.b","objective":"U11.L03.O4","level":"A","type":"true_false_why","prompt":"«قول ”لا أعرف“ عيب يجب أن أخفيه». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ «لا أعرف بعد» جواب أمين حين لا يكون عندي دليل، ثم أسأل وأبحث.","rubric":"R1","alt":{"prompt":"«إذا لم أكن متأكداً من رسالة صحية فالأحسن ألا أنشرها». صح أم خطأ؟ ولماذا؟","answer":"صح؛ قد تضر غيري إن كانت خطأ، فأتحقق أولاً."}},{"id":"U11.L03.A4.c","objective":"U11.L03.O4","level":"A","type":"explain_open","prompt":"{اكتب|اكتبي} رداً مهذباً على قريب أرسل رسالة صحية بلا دليل في مجموعة العائلة.","answer":"شكراً لك؛ هل نعرف من قالها وكيف عرف؟ لنسأل الطبيب أو جهة صحية موثوقة قبل أن نجرّبها أو ننشرها.","rubric":"R1"},{"id":"U11.L03.A5.a","objective":"U11.L03.O5","level":"B","type":"choose_reason","prompt":"قال أحمد: «شربت شراب الزنجبيل فشُفيت من الزكام في خمسة أيام». ما المشكلة في استنتاجه؟","options":["أن الزنجبيل مرّ الطعم ولا يحبه الأطفال","أن الزكام قد يشفى وحده","أن خمسة أيام قليلة على الزكام","أن أحمد صغير لا يفهم في الطب"],"answer":1,"explanation":"الزكام يشفى غالباً وحده؛ نحتاج مقارنة عادلة لنعرف أثر الشراب.","feedback_by_option":{"0":"الطعم لا يحكم على النفع.","2":"المدة ليست المشكلة؛ المشكلة غياب المقارنة.","3":"العمر ليس المشكلة؛ طريقة الاستنتاج هي."},"detects":"M126","alt":{"prompt":"الديك يصيح قبل طلوع الشمس. هذا مثال على:","options":["أن الديك يُطلع الشمس كل صباح","أن «بعده» لا يعني «بسببه»","تجربة عمياء على الطيور","مقارنة عادلة بين ديكين"],"answer":1,"explanation":"الشمس تطلع بعد الصياح لا بسببه.","feedback_by_option":{"0":"الشمس تطلع بلا صياح أيضاً.","2":"لا تجربة هنا.","3":"لا مجموعتين هنا."}}},{"id":"U11.L03.A5.b","objective":"U11.L03.O5","level":"B","type":"true_false_why","prompt":"«في التجربة العمياء يعرف المشارك أي شيء أخذ». صح أم خطأ؟ ولماذا؟","answer":"خطأ؛ لا يعرف، كي لا يؤثر ظنه في النتيجة.","rubric":"R1","alt":{"prompt":"«وجدت تجربة أوغندا أن الأطفال في الصف الخامس يستطيعون تعلّم الحكم على الادعاءات». صح أم خطأ؟ ولماذا؟","answer":"صح؛ نجح 69% ممن تعلموا مقابل 27% ممن لم يتعلموا، وبقي الفرق بعد سنة."}},{"id":"U11.L03.A5.c","objective":"U11.L03.O5","level":"B","type":"explain_open","prompt":"{صف|صفي} مقارنة عادلة تعرف بها هل شراب الزنجبيل يقصّر الزكام.","answer":"مجموعتان كبيرتان متشابهتان من المصابين بالزكام، تُختاران بالقرعة؛ واحدة تشرب الزنجبيل وأخرى شراباً يشبهه بلا زنجبيل، ولا يعرف أحد ماذا شرب؛ ثم نقارن عدد أيام الزكام في الاثنتين.","rubric":"R1"}],"transfer":[{"id":"U11.L03.T1","objective":"U11.L03.O1","type":"explain_open","prompt":"إعلان يقول: «جهاز صغير على الرسغ يُذيب الدهون بلا رياضة، جرّبه مليون شخص». {طبّق|طبّقي} عليه الأسئلة الأربعة.","answer":"من قال؟ الشركة التي تبيعه؛ كيف عرف؟ لا يذكر؛ هل قورن؟ لا مقارنة عادلة، و«جرّبه مليون» ليس دليلاً؛ ماذا يقول أهل العلم؟ نسأل جهة صحية؛ فالحكم: لا أصدّق حتى أتحقق.","level":"A","rubric":"R1"},{"id":"U11.L03.T2","objective":"U11.L03.O4","type":"explain_open","prompt":"{اختر|اختاري} شيئاً واحداً {تعلمته|تعلمتِه} في هذا المنهاج، و{اكتب|اكتبي} كيف {تعلّمه|تعلّمينه} أخاك{|ِ} الصغير بدقة، ومن أين {تعرف|تعرفين} أنه صحيح.","answer":"مثال: الأوردة ليست زرقاء والدم فيها أحمر غامق؛ أشرح له ذلك بصورة الجلد والضوء، وأقول إني عرفته من درس القلب ومصادره.","level":"A","rubric":"R1"}],"recall":[{"id":"U11.L03.D1","objective":"U11.L03.O1","type":"choose","prompt":"ما يجعلنا نصدّق ادعاءً صحياً:","options":["كثرة من أرسلوه","الدليل","شهرة قائله"],"answer":1,"explanation":"الدليل.","level":"A","feedback_by_option":{"0":"الكثرة ليست دليلاً.","2":"الشهرة ليست دليلاً."}},{"id":"U11.L03.D2","objective":"U11.L03.O2","type":"choose","prompt":"صحّح خطأ ثقوب حاجز القلب:","options":["ابن سينا في القانون","جالينوس اليوناني","ابن النفيس"],"answer":2,"explanation":"ابن النفيس.","level":"A","feedback_by_option":{"0":"ابن سينا نقل الخطأ.","1":"جالينوس صاحب الخطأ."}},{"id":"U11.L03.D3","objective":"U11.L03.O3","type":"choose","prompt":"فكرة زيملفايس:","options":["رُفضت أولاً وكانت صحيحة","كانت خطأ فرفضها الأطباء","قبلها الأطباء كلهم في يومها"],"answer":0,"explanation":"رُفضت أولاً، وقُبلت بعد موته.","level":"A","feedback_by_option":{"1":"كانت صحيحة، ونقصت بها الوفيات.","2":"رفضها أكثر الأطباء."}},{"id":"U11.L03.D4","objective":"U11.L03.O4","type":"choose","prompt":"«طبيعي» تعني:","options":["آمن مهما كان مقداره","من الطبيعة، وقد يضر","دواء لكل مرض عند الأطفال"],"answer":1,"explanation":"من الطبيعة، وليس آمناً بالضرورة.","level":"A","feedback_by_option":{"0":"بعض الطبيعي سام.","2":"لا دليل على ذلك."}},{"id":"U11.L03.D5","objective":"U11.L03.O5","type":"choose","prompt":"«حدث بعده»:","options":["يعني حدث بسببه حتماً","لا يعني حدث بسببه","يعني أنها تجربة عمياء"],"answer":1,"explanation":"نحتاج مقارنة عادلة لنعرف السبب.","level":"B","feedback_by_option":{"0":"الديك يصيح قبل الشمس ولا يُطلعها.","2":"التجربة العمياء أمر آخر."}}]};
