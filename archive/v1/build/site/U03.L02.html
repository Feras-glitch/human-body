<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>الأطلس الحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: atlas (SVG body) on one side, lesson panel on the other; stacked on phones. Paper-like ground, blood-red accent, teal for oxygen coding. */
:root{
  --bg:#f6f1e8; --panel:#fffdf8; --fg:#2b2320; --muted:#6f6259; --line:#e3d9cb;
  --accent:#b4232c; --accent-soft:#f3d9d8; --ox:#c8323b; --deox:#3a5f9c; --teal:#1f7a74; --teal-soft:#d6ebe8;
  --ok:#2e7d4f; --warn:#b26a00; --bone:#efe6d2; --lung:#e9b9b4; --muscle:#d98b7e; --skin:#f1dcc7;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1715; --panel:#242020; --fg:#f1e9df; --muted:#b4a79b; --line:#3a332e;
  --accent:#e05560; --accent-soft:#3d2224; --ox:#e05560; --deox:#6f93d6; --teal:#4fb3ab; --teal-soft:#1d3634;
  --ok:#5fc08a; --warn:#e0a640; --bone:#5a5248; --lung:#7a4a48; --muscle:#8a4f46; --skin:#5c4a3d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1b1715; --panel:#242020; --fg:#f1e9df; --muted:#b4a79b; --line:#3a332e;
  --accent:#e05560; --accent-soft:#3d2224; --ox:#e05560; --deox:#6f93d6; --teal:#4fb3ab; --teal-soft:#1d3634;
  --ok:#5fc08a; --warn:#e0a640; --bone:#5a5248; --lung:#7a4a48; --muscle:#8a4f46; --skin:#5c4a3d; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.3px}
.lesson-id{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.atlas{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.atlas{position:static}}
.atlas-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.atlas-head h2{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:700}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}
svg.body{width:100%;max-width:100%;height:auto;display:block;aspect-ratio:400/620}
svg.body text{font-family:var(--body);font-size:12px;fill:var(--fg)}
.organ{cursor:pointer;transition:filter .2s,opacity .2s}
.organ:hover{filter:brightness(1.08)}
.region{pointer-events:all}
.region.hl{fill:var(--teal-soft)!important;opacity:.55;stroke:var(--teal)!important}
.hl{filter:drop-shadow(0 0 6px var(--accent)) brightness(1.1);stroke:var(--accent)!important;stroke-width:2.5!important}
.dim{opacity:.22}
.layer[hidden]{display:none}
.target-ok{stroke:var(--ok)!important;stroke-width:3!important}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}}
.beating{animation:beat 1s ease-in-out infinite;transform-origin:215px 240px;transform-box:view-box}
@keyframes dash{to{stroke-dashoffset:-40}}
.flowing{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes pulse{0%,100%{r:5;opacity:1}50%{r:9;opacity:.5}}
.pulsing{animation:pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.beating,.flowing,.pulsing{animation:none}}
.card{margin-top:10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;min-height:3.2em}
.card b{font-family:var(--display)}
.card .en{color:var(--muted);font-size:.85rem;direction:ltr;display:inline-block}
.limits{margin-top:8px}
.limits summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:.9rem}
.limits ul{margin:6px 0 0;padding-right:18px;font-size:.9rem;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.steps button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:.82rem;font-weight:600}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.steps button.done::before{content:"✓ ";color:var(--ok)}
h1{font-family:var(--display);font-size:1.6rem;margin:0 0 4px;text-wrap:balance;line-height:1.3}
h3{font-family:var(--display);font-size:1.15rem;margin:14px 0 6px}
.q{font-family:var(--display);font-size:1.25rem;color:var(--accent);margin:4px 0 10px}
p{margin:.4em 0}
.say{display:flex;gap:10px;align-items:flex-start}
.say p{flex:1;min-width:0;font-size:1.08rem}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--accent);color:#fff}
.btn.sec{background:var(--teal-soft);color:var(--teal)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.opt .n{display:inline-block;min-width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--panel));color:var(--ok)}
.fb.hint{background:color-mix(in srgb,var(--warn) 14%,var(--panel));color:var(--warn)}
.item{border-top:1px solid var(--line);padding-block:12px}
.item .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pulse-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:480px){.pulse-box{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);text-align:center}
.slot .lbl{font-size:.85rem;color:var(--muted)}
.slot .val{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.2}
.slot .val small{font-size:.8rem;color:var(--muted);font-family:var(--body)}
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.tap{width:120px;height:120px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-family:var(--display);font-size:1.1rem;font-weight:700;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.tap:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.tap:disabled{background:var(--line);box-shadow:none;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.6rem}
.safety{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-right:4px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:.92rem;margin-top:10px}
.safety ul,ol{padding-right:20px;margin:.3em 0}
.numbers{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:8px}
.num{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.95rem}
canvas#draw{width:100%;max-width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background:var(--panel);touch-action:none;display:block}
textarea{width:100%;min-height:80px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg)}
.tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 8px;background:var(--teal-soft);color:var(--teal);font-weight:600;vertical-align:middle}
.tag.b{background:var(--accent-soft);color:var(--accent)}
.foot{margin-top:18px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:10px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.profile{max-width:640px;margin:24px auto}
.pf-grid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
@media (max-width:480px){.pf-grid{grid-template-columns:1fr}}
.pf-photo{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;width:160px;height:160px;border:2px dashed var(--line);border-radius:50%;cursor:pointer;color:var(--muted);overflow:hidden;background:var(--bg);font-size:.95rem;line-height:1.4}
.pf-photo img{width:100%;height:100%;object-fit:cover}
#pfName{width:100%;font:inherit;font-size:1.2rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.pf-gender button{font-size:1.05rem;padding:8px 18px}
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none">الأطلس الحي</a> <small>علمٌ يُنتفع به · جسم الإنسان للأطفال 8–12</small></div>
  <div class="row" style="margin:0">
    <button class="chip" id="whoami" hidden title="تغيير الملف" style="display:flex;align-items:center;gap:6px"><img id="whoImg" alt="" width="26" height="26" style="border-radius:50%;object-fit:cover" hidden><span id="whoName"></span></button>
    <span class="lesson-id" id="lessonId"></span>
    <button class="chip" id="parentBtn">👨‍👩‍👧 ولي الأمر / المعلم</button>
    <div class="seg" role="group" aria-label="المستوى">
      <button id="lvA" aria-pressed="true">مستوى أ · 8–9</button>
      <button id="lvB" aria-pressed="false">مستوى ب · 10–12</button>
    </div>
  </div>
</header>

<section class="panel profile" id="profileScreen" hidden aria-label="الدخول">
  <h1>مرحباً! من أنت؟</h1>
  <p class="meta">اسمك وصورتك يبقيان على هذا الجهاز فقط ولا يُرسلان إلى أي مكان.</p>
  <div class="pf-grid">
    <label class="pf-photo" for="pfFile"><img id="pfPreview" alt="" hidden><span id="pfPh">📷<br>أضف صورتك<br><small>(اختياري)</small></span><input type="file" id="pfFile" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none"></label>
    <div>
      <label for="pfName"><b>اسمي</b></label>
      <input id="pfName" type="text" maxlength="24" placeholder="اكتب اسمك" autocomplete="off">
      <div class="seg pf-gender" role="group" aria-label="أنا" style="margin-top:10px">
        <button id="pfBoy" aria-pressed="false">👦 ولد</button>
        <button id="pfGirl" aria-pressed="false">👧 بنت</button>
      </div>
      <p class="fb hint" id="pfErr" hidden></p>
      <div class="row"><button class="btn" id="pfGo">ابدأ</button></div>
    </div>
  </div>
</section>
<section class="panel" id="reviewScreen" hidden aria-label="تقييم ولي الأمر">
  <div class="row" style="margin:0 0 8px"><h1 style="flex:1">تقييم ولي الأمر / المعلم</h1><button class="btn ghost" id="reviewClose">عودة إلى الدرس</button></div>
  <div id="pinGate">
    <p class="meta">هذه الشاشة للبالغ المشرف. <span id="pinHint"></span></p>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="رقم من 4 أرقام" style="font:inherit;font-size:1.2rem;padding:8px 12px;border:1px solid var(--line);border-radius:10px;width:12em;background:var(--bg);color:var(--fg)">
    <button class="btn" id="pinGo">دخول</button><p class="fb hint" id="pinErr" hidden></p>
  </div>
  <div id="reviewBody" hidden></div>
</section>
<div class="grid">
  <section class="atlas" aria-label="الأطلس">
    <div class="atlas-head">
      <h2 id="atlasTitle">الجسم من الأمام</h2>
      <div class="layers" id="layerChips"></div>
    </div>
    <svg class="body" viewBox="0 0 400 620" xmlns="http://www.w3.org/2000/svg" aria-label="رسم تعليمي لجسم الإنسان من الأمام">
      <g id="viewBody">
        <!-- skin / outline -->
        <g class="layer" data-layer="skin" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5">
          <ellipse cx="200" cy="54" rx="34" ry="40"/>
          <rect x="184" y="88" width="32" height="30" rx="8"/>
          <path d="M132 118h136c16 0 24 10 24 26v160c0 16-8 26-24 26H132c-16 0-24-10-24-26V144c0-16 8-26 24-26z"/>
          <path d="M108 140l-14 20c-6 10-8 20-8 32l8 150c0 10 8 16 16 16s16-6 16-16l-6-150 14-36z"/>
          <path d="M292 140l14 20c6 10 8 20 8 32l-8 150c0 10-8 16-16 16s-16-6-16-16l6-150-14-36z"/>
          <path d="M132 326h62l-6 150c0 10 2 30 2 110 0 12-8 18-20 18s-20-6-20-18V480z"/>
          <path d="M268 326h-62l6 150c0 10-2 30-2 110 0 12 8 18 20 18s20-6 20-18V480z"/>
        </g>

        <!-- مناطق الجسم (طبقة شفافة للتحديد) -->
        <g class="layer" data-layer="regions" fill="transparent" stroke="none">
          <ellipse id="head" class="organ region" data-concept="head" cx="200" cy="54" rx="34" ry="40"/>
          <rect id="neck" class="organ region" data-concept="neck" x="184" y="88" width="32" height="30"/>
          <rect id="chest" class="organ region" data-concept="chest" x="112" y="118" width="176" height="110"/>
          <rect id="abdomen" class="organ region" data-concept="abdomen" x="112" y="228" width="176" height="100"/>
          <rect id="trunk" class="organ region" data-concept="trunk" x="108" y="118" width="184" height="212" fill="none" stroke="none" pointer-events="none"/>
          <path id="upper_arm" class="organ region" data-concept="limbs" d="M108 140l-14 20c-6 10-8 20-8 32l4 60 30-4-4-56 14-36z"/>
          <path id="forearm" class="organ region" data-concept="limbs" d="M90 252l4 90c0 6 4 10 8 12l18-2-6-104z"/>
          <path id="thigh" class="organ region" data-concept="limbs" d="M132 326h62l-4 150h-56z"/>
          <path id="lower_leg" class="organ region" data-concept="limbs" d="M134 476h56l-2 110h-50z"/>
          <path id="limbs" class="organ region" data-concept="limbs" d="M268 326h-62l6 150h56z" />
          <rect id="whole_body" class="organ region" data-concept="model" x="60" y="10" width="280" height="600" fill="none" stroke="none" pointer-events="none"/>
          <rect id="right_side" x="200" y="10" width="140" height="600" fill="none" stroke="none" pointer-events="none"/>
        </g>
        <!-- muscles (legs only, for E8) -->
        <g class="layer" data-layer="muscles" hidden>
          <path id="leg_muscles" class="organ" data-concept="leg_muscles" d="M168 356c8 40 10 90 6 150 10 4 20 4 30 0-2-60 2-110 8-150-14-6-30-6-44 0zM204 356c6 40 10 90 8 150 10 4 20 4 30 0-4-60 0-110 6-150-14-6-30-6-44 0z" fill="var(--muscle)" stroke="var(--accent)" stroke-width="1" opacity=".9"/>
          <text x="330" y="440" text-anchor="start">عضلات الساق</text>
        </g>
        <!-- skeleton: ribcage + sternum + spine -->
        <g class="layer" data-layer="skeleton" id="skeleton">
          <line x1="200" y1="118" x2="200" y2="330" stroke="var(--bone)" stroke-width="7" opacity=".7"/>
          <g id="ribcage" class="organ" data-concept="chest" fill="none" stroke="var(--bone)" stroke-width="5" stroke-linecap="round">
            <path d="M200 140c-36 4-66 20-78 44M200 140c36 4 66 20 78 44"/>
            <path d="M200 164c-40 4-72 22-84 48M200 164c40 4 72 22 84 48"/>
            <path d="M200 188c-42 6-74 26-86 52M200 188c42 6 74 26 86 52"/>
            <path d="M200 212c-40 8-70 28-82 54M200 212c40 8 70 28 82 54"/>
            <path d="M200 236c-34 10-60 28-72 50M200 236c34 10 60 28 72 50"/>
            <rect x="193" y="136" width="14" height="118" rx="6" fill="var(--bone)" stroke="none"/>
          </g>
          <text x="214" y="132" text-anchor="start" font-size="11">عظم القص</text>
          <!-- عظام ومفاصل الهيكل -->
          <ellipse id="skull" class="organ" data-concept="skull" cx="200" cy="54" rx="30" ry="36" fill="var(--bone)" stroke="var(--line)" opacity=".9"/>
          <path id="spine" class="organ" data-concept="spine" d="M200 118v212" stroke="var(--bone)" stroke-width="10" stroke-dasharray="8 3" fill="none"/>
          <path id="pelvis" class="organ" data-concept="pelvis" d="M150 300c10-14 90-14 100 0 8 12 4 30-10 36-14 6-66 6-80 0-14-6-18-24-10-36z" fill="var(--bone)" stroke="var(--line)"/>
          <path id="humerus" class="organ" data-concept="limbs" d="M104 150l-10 92" stroke="var(--bone)" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path id="femur" class="organ" data-concept="limbs" d="M165 336l-4 134" stroke="var(--bone)" stroke-width="14" stroke-linecap="round" fill="none"/>
          <path id="tibia" class="organ" data-concept="limbs" d="M160 484l-2 100" stroke="var(--bone)" stroke-width="10" stroke-linecap="round" fill="none"/>
          <g id="joints" class="organ" data-concept="joint" fill="var(--teal)" opacity=".85">
            <circle id="shoulder" class="organ" data-concept="ball_socket" cx="108" cy="146" r="9"/>
            <circle id="elbow" class="organ" data-concept="hinge_joint" cx="94" cy="248" r="8"/>
            <circle id="wrist" class="organ" data-concept="joint" cx="92" cy="346" r="7"/>
            <circle id="hip" class="organ" data-concept="ball_socket" cx="166" cy="334" r="9"/>
            <circle id="knee" class="organ" data-concept="hinge_joint" cx="161" cy="478" r="8"/>
            <circle id="ankle" class="organ" data-concept="joint" cx="158" cy="586" r="7"/>
            <circle id="neck_pivot" class="organ" data-concept="joint" cx="200" cy="118" r="6"/>
          </g>
          <text x="330" y="60" font-size="11">الجمجمة</text>
          <text x="330" y="320" font-size="11">الحوض</text>
          <text x="20" y="250" font-size="11">المرفق</text>
          <text x="20" y="146" font-size="11">الكتف</text>
          <text x="330" y="480" font-size="11">الركبة</text>
        </g>
        <!-- respiratory (lungs) -->
        <g class="layer" data-layer="respiratory">
          <path id="lungs" class="organ" data-concept="lungs" d="M186 150c-30 6-58 36-60 86-1 30 6 60 22 68 14 6 30 2 38-10V150zM214 150c30 6 58 36 60 86 1 30-6 60-22 68-14 6-30 2-38-10V150z" fill="var(--lung)" stroke="var(--line)" opacity=".85"/>
        </g>
        <!-- circulatory -->
        <g class="layer" data-layer="circulatory">
          <!-- veins (coded blue) -->
          <g id="veins" stroke="var(--deox)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8">
            <path class="vessel" d="M208 200V92c0-10 2-20 2-32"/>

ضوح يكتفي بمشاهدة زميل بإذنه أو بصور الدرس؛ ظهور الأوردة يختلف باختلاف الجلد وهذا طبيعي."],"expected":"تبرز الأوردة حين تتدلى اليد (الدم يتجمع فيها بفعل الجاذبية) وتختفي حين تُرفع (يعود الدم بسهولة إلى القلب). وعند تفريغ جزء من الوريد يمتلئ من جهة الأصابع لا من جهة الرسغ، لأن الدم في الأوردة يسير نحو القلب فقط والصمامات تمنع رجوعه.","explain":"الأوردة تعيد الدم إلى القلب ببطء وضغط منخفض، فحين تتدلى يدك{|ِ} يتجمع الدم فيها وتنتفخ، وحين ترفعها{|ِ} يعود الدم بسهولة فتضمر. والوريد يمتلئ من جهة الأصابع لأن الدم فيه يجري في اتجاه واحد نحو القلب، وفيه صمامات تمنع عودته. هذا بالضبط ما لاحظه هارفي قبل أربعة قرون واستنتج منه أن الدم يدور.","record":"جملتان: «الأوردة تبرز حين…» و«امتلأ الوريد من جهة…».","alternatives":["من يتعذر عليه رفع الذراع يراقب أوردة ظهر اليد أثناء فتح القبضة وإغلاقها عدة مرات.","بديل بصري: صورتا اليد في الوضعين في الدرس."]},"flow":{"hook":{"text":"{اسم}، انظر{|ي} إلى ظهر يدك{|ِ}. ترى{|ين} خطوطاً مزرقّة تحت الجلد؟ قلنا إن الدم أحمر. فما هذا الأزرق؟","options":["دم أزرق","ليس دماً","دم أحمر يبدو أزرق","لا أعرف بعد"]},"explain":[{"id":"E1","level":"A","atlas":{"layers":["circulatory"],"highlight":["heart","arteries"],"zoom":"body","animate":"flow"},"text":"في الدرس الماضي رأينا القلب يدفع الدم. اليوم نتبع الطرق. يخرج الدم من القلب في أوعية قوية نسميها الشرايين. الشريان يحمل الدم بعيداً عن القلب، إلى الرأس والذراعين والساقين وكل عضو."},{"id":"E2","level":"A","atlas":{"layers":["circulatory"],"highlight":["capillaries"],"zoom":"capillary","animate":"exchange"},"text":"كلما ابتعد الشريان عن القلب تفرّع وصغر، حتى يصير شعيرات أرفع من شعرة رأسك. جدار الشعيرة رقيق جداً: طبقة واحدة من الخلايا. هنا فقط يخرج الأكسجين والغذاء من الدم إلى الخلايا، وتدخل الفضلات من الخلايا إلى الدم. الشعيرات هي محطات التبادل."},{"id":"E3","level":"A","atlas":{"layers":["circulatory"],"highlight":["veins","heart"],"zoom":"body","animate":"flow"},"text":"بعد الشعيرات تتجمع الأوعية من جديد وتكبر حتى تصير أوردة. الوريد يعيد الدم إلى القلب. الدم فيه أبطأ، وجداره أرقّ. شريان يذهب، شعيرة تبادل، وريد يعود: هذه حلقة مغلقة لا تتوقف."},{"id":"E4","level":"A","atlas":{"layers":["circulatory"],"highlight":["veins"],"zoom":"hand_color","animate":"toggle_color"},"text":"والآن سؤالنا: لماذا تبدو أوردة يدك{|ِ} زرقاء؟ الدم داخلها أحمر داكن، لكن الضوء الأزرق يرتد من سطح الجلد قبل أن يصل إلى الوريد، والأحمر ينفذ أعمق فيبتلعه الدم الداكن داخل الوريد؛ فيعود من فوق الوريد أحمرٌ أقل مما يعود من الجلد حوله، فنراه مزرقّاً بالمقارنة. ولذلك في رسومنا نلوّن الدم القليل الأكسجين بالأزرق لنميّز اتجاهه. هذا ترميز، والدم أحمر دائماً. اضغط{|ي} على الزر لترى{|ي} اللون الحقيقي."},{"id":"E5","level":"B","atlas":{"layers":["circulatory","respiratory"],"highlight":["right_heart","lungs","left_heart"],"zoom":"chest","animate":"two_loops"},"text":"للدم حلقتان لا حلقة واحدة. الحلقة القصيرة: من يمين القلب عبر الشريان الرئوي إلى الرئتين، يأخذ الدم الأكسجين ويترك ثاني أكسيد الكربون، ويعود عبر الأوردة الرئوية إلى يسار القلب. نسميها الدورة الرئوية."},{"id":"E6","level":"B","atlas":{"layers":["circulatory"],"highlight":["left_heart","arteries","capillaries","veins","right_heart"],"zoom":"body","animate":"two_loops"},"text":"والحلقة الطويلة: من يسار القلب عبر الشريان الأكبر، الأبهر، إلى الجسم كله، يسلّم الدم الأكسجين في الشعيرات ويحمل الفضلات، ثم يعود عبر الوريدين الأجوفين إلى يمين القلب. نسميها الدورة الجهازية. والحلقتان تدوران معاً في اللحظة نفسها: مع كل ضربة ينقبض البطينان معاً، دفعة إلى الرئتين ودفعة إلى الجسم."},{"id":"E7","level":"B","atlas":{"layers":["circulatory"],"highlight":["arteries","veins"],"zoom":"vessel_wall","animate":"pulse"},"text":"لماذا جدار الشريان سميك ومرن؟ لأن الدم يخرج من القلب بدفعة قوية؛ يتمدد الجدار مع الدفعة ثم يرتد، وهذا الارتداد هو النبض الذي عددناه. ولماذا في الأوردة صمامات؟ لأن الدم فيها بطيء ويصعد ضد الجاذبية من الساقين؛ الصمامات تمنع رجوعه، وعضلات الساق تدفعه حين تنقبض. وتذكّر{|ي}: الشريان يُعرَّف بالاتجاه لا بالأكسجين، فالشريان الرئوي شريان يحمل دماً قليل الأكسجين."}],"practice":[{"id":"U03.L02.P1","objective":"U03.L02.O1","level":"A","type":"choose","promp وشاية."}],"organ_letter":{"from":"الشعيرة الدموية","text":"أنا شعيرة دموية. أنا أرفع من شعرة رأسك{|ِ}، ولا أحد يرسمني لأني لا أُرى. لكن الشريان الكبير الذي يتباهى بجداره السميك لا يعطي الخلايا شيئاً؛ أنا التي أسلّم الأكسجين والغذاء وأحمل الفضلات، لأن جداري طبقة واحدة فقط. الكريّات الحمراء تمر عندي في طابور واحدة واحدة. عددنا في جسمك{|ِ} بالمليارات، ولو وُصلنا خطاً واحداً للففنا الأرض. مع التحية، الأصغر والأهم."},"passport":[{"id":"vessel_length","label":"طول أوعيتي لو وُصلت خطاً","inputs":[],"formula":"نحو 100,000 كم (تقدير)","unit":"كم","note":"محيط الأرض 40,000 كم: كم مرة تلف أوعيتك{|ِ} الأرض؟"},{"id":"pumped_day","label":"كم لتراً يضخ قلبي في اليوم","inputs":["نبضي في الراحة"],"formula":"نبضي في الراحة × 60 × 24 × 0.05 لتر لكل ضربة تقريباً","unit":"لتر","note":"تقدير بحجم ضربة 50 مل للطفل؛ قارن{|ي} بخزان ماء البيت"}],"find_the_error":[{"id":"FE1","atlas_variant":"aorta_exchange_arrow","error":"سهم تبادل الأكسجين يخرج من الأبهر مباشرة إلى العضلة","answer":"التبادل في الشعيرات فقط","detects":"M03"},{"id":"FE2","atlas_variant":"pulmonary_artery_red","error":"الشريان الرئوي ملوّن بالأحمر (غني بالأكسجين)","answer":"الشريان الرئوي يحمل دماً قليل الأكسجين؛ لونه بالترميز أزرق","detects":"M26"},{"id":"FE3","atlas_variant":"single_loop","error":"حلقة واحدة من القلب إلى الجسم تعود إلى القلب دون المرور بالرئتين","answer":"لا بد من حلقة الرئتين لأخذ الأكسجين","detects":"M22"}],"true_size":[{"text":"الشعيرة الحقيقية أقصر من مليمتر وأرفع من شعرة. خذ{|ي} شعرة من رأسك{|ِ} وضعها{|ِ} على ورقة بيضاء: الشعيرة أرفع من هذه الشعرة بعشر مرات تقريباً.","source":["S2"]},{"text":"لو صحّ التقدير المشهور (نحو 100 ألف كم) فكم رحلة من القاهرة إلى أسوان (نحو 900 كم) في أوعيتك{|ِ}؟ احسب{|ي}، ثم اسأل{|ي}: كيف يمكن أن يقيس أحد هذا الرقم أصلاً؟","source":["S2"]}],"audio":{},"has_gendered_text":true};
</script>
<script>
(function(){
const hide = (el, b) => el && el.toggleAttribute('hidden', !!b);
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pstore = { get(){ try{ return JSON.parse(localStorage.getItem('atlas:profile')||'null') }catch(e){ return null } }, set(v){ try{ localStorage.setItem('atlas:profile', JSON.stringify(v)) }catch(e){} } };
let profile = pstore.get();
function expand(text, gender, name){ let t=text; if(name) t=t.replace(/\{اسم\}/g,name); else t=t.replace(/،?\s*يا \{اسم\}/g,'').replace(/\{اسم\}،\s*/g,'').replace(/\{اسم\}/g,''); return t.replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(_,m,f)=>gender==='f'?f:m); }
const tx = (t) => typeof t==='string' ? expand(t, profile?.gender||'m', profile?.name||null) : t;
const hasG = (t) => /\{[^{}|]*\|[^{}|]*\}/.test(t||'');
const akey = (k, t) => (DATA.audio && DATA.audio[k]) ? k : (hasG(t) ? k + '.' + (profile?.gender||'m') : k);
const store = { get(k,d){ try{ const v=localStorage.getItem('atlas:'+DATA.id+':'+k); return v?JSON.parse(v):d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem('atlas:'+DATA.id+':'+k, JSON.stringify(v)) }catch(e){} } };
let level = store.get('level','A');
let step = store.get('step',0);
const progress = store.get('progress',{});   // itemId -> {ok, hints}
const pulse = store.get('pulse',{rest:null,move:null,after:null});
const stepsDef = [
  {id:'hook',  name:'سؤال'},
  {id:'exp',   name:'تجربتي'},
  {id:'explain',name:'الأطلس يشرح'},
  {id:'practice',name:'أتدرب'},
  {id:'check', name:'أتحقق'},
  {id:'notebook',name:'دفتري'},
  {id:'know',  name:'كيف عرفنا؟'},
  {id:'dedicate', name:'أهدي'},
];
const LAYERS = {skin:'الجلد',regions:'المناطق',skeleton:'الهيكل',respiratory:'التنفس',circulatory:'الدم',muscles:'العضلات'};
let lastSpoken = '', lastKey = '';
let audioEl = null;

$('#lessonId').textContent = DATA.id + ' · إصدار ' + DATA.version.content;

$('#foot').innerHTML = `آخر مراجعة علمية: ${DATA.version.science_reviewed_on} · المحتوى مولَّد من ملف الدرس المصدر ${DATA.id}.json · التقدم محفوظ على هذا الجهاز فقط.`;
$('#limitsList').innerHTML = DATA.model_limits.map(l=>`<li>${l}</li>`).join('');

// ---------- atlas ----------
function setLayers(list){
  $$('.layer').forEach(g => hide(g, !list.includes(g.dataset.layer)));
  $$('#layerChips .chip').forEach(c => c.setAttribute('aria-pressed', String(list.includes(c.dataset.layer))));
}
$('#layerChips').innerHTML = Object.entries(LAYERS).map(([k,v])=>`<button class="chip" data-layer="${k}" aria-pressed="true">${v}</button>`).join('');
$$('#layerChips .chip').forEach(c => c.onclick = () => { const g = $(`.layer[data-layer="${c.dataset.layer}"]`); hide(g, !g.hasAttribute('hidden')); c.setAttribute('aria-pressed', String(!g.hasAttribute('hidden'))); });
const VIEWS = {body:['viewBody','الجسم من الأمام'], section:['viewSection','مقطع داخل القلب'], compare:['viewCompare','رمز ورسم حقيقي'], arm:['viewArm','الذراع: عظم ومفصل وعضلتان'], joint:['viewJoint','داخل المفصل'], bone:['viewBone','داخل العظم'], tube:['viewTube','أنبوب الدم المفصول'], cells:['viewCells','قطرة دم مكبّرة'], capillary:['viewCapillary','الشعيرة: محطة التبادل'], tools:['viewTools','أدوات نعرف بها']};
const ZOOM2VIEW = {heart_section:'section', compare_shape:'compare', arm:'arm', three_types:'arm', joint_section:'joint', elbow:'joint', shoulder:'joint', compare_joints:'joint', bone_section:'bone', baby_vs_adult:'bone', tube:'tube', cells:'cells', wound:'cells', capillary:'capillary', vessel_wall:'capillary', hand_color:'capillary', instruments:'tools', scene_two_pictures:'tools', ruler_drop:'tools', fair_test:'tools'};
function view(name){
  for (const [k,[id,title]] of Object.entries(VIEWS)) hide($('#'+id), k !== name);
  $('#atlasTitle').textContent = (VIEWS[name]||VIEWS.body)[1];
}
function clearFx(){ $$('.hl,.dim,.beating,.flowing,.pulsing,.target-ok').forEach(e => e.classList.remove('hl','dim','beating','flowing','pulsing','target-ok')); }
function applyAtlas(a){
  clearFx();
  if(!a){ view('body'); setLayers(Object.keys(LAYERS)); return; }
  const needView = (id) => { for (const [k,[vid]] of Object.entries(VIEWS)) { const el = document.getElementById(vid); if (el && el.querySelector('#'+CSS.escape(id))) return k; } return null; };
  const z = a.zoom || 'body';
  const vname = ZOOM2VIEW[z] || 'body';
  view(vname);
  if(a.layers && vname==='body') setLayers(['skin','regions',...a.layers]);
  const hl = a.highlight || [];
  const map = {right_heart:['right_atrium','right_ventricle'], left_heart:['left_atrium','left_ventricle'], atria:['right_atrium','left_atrium'], ventricles:['right_ventricle','left_ventricle'], vessels:['arteries','veins'], neck_artery:['neck_artery'], wrist_artery:['wrist_artery']};
  hl.flatMap(h => map[h] || [h]).forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('hl'); });
  if(vname==='body' && hl.length){ const first = document.getElementById((map[hl[0]]||[hl[0]])[0]); if(first){ const vn = needView(first.id); if(vn && vn!=='body' && !ZOOM2VIEW[z]) view(vn); } }
  if(a.animate==='beat') $('#heart').classList.add('beating');
  if(a.animate==='flow' || a.animate==='flow_fast') $$('#arteries .vessel, #veins .vessel').forEach(v=>v.classList.add('flowing'));
  if(a.animate==='pulse') $$('.pulse-point').forEach(p=>p.classList.add('pulsing'));
  if(a.animate==='two_loops') $$('#viewSection [id^=arrow]').forEach(p=>p.classList.add('flowing'));
}
// concept cards (reference layer: always available)
let locateHandler = null;
$$('.organ').forEach(el => el.addEventListener('click', () => {
  if(locateHandler){ locateHandler(el.id); return; }
  const c = DATA.concepts.find(x => x.id === el.dataset.concept);
  if(!c){ $('#conceptCard').innerHTML = `<b>${el.dataset.concept==='lungs'?'الرئتان':el.dataset.concept==='leg_muscles'?'عضلات الساق':el.id}</b> — بطاقة هذا العضو في درس آخر.`; return; }
  const txt = (level==='B' && c.card.B) ? c.card.B : (c.card.A || c.card.B);
  $('#conceptCard').innerHTML = `<b>${c.term.ar}</b> <span class="en">${c.term.en} · ${c.term.zh} <i>${c.term.pinyin}</i></span><br>${txt}`;
}));

// ---------- level ----------
function setLevel(l){ level = l; store.set('level',l); $('#lvA').setAttribute('aria-pressed', String(l==='A')); $('#lvB').setAttribute('aria-pressed', String(l==='B')); render(); }
$('#lvA').onclick = () => setLevel('A'); $('#lvB').onclick = () => setLevel('B');
const inLevel = x => !x.level || x.level==='A' || level==='B';

// ---------- speech ----------
function speak(t, key){
  if(!t) return;
  if(audioEl){ audioEl.pause(); audioEl = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const file = key && DATA.audio && (DATA.audio[key] || DATA.audio[key + '.' + (profile?.gender||'m')]);
  if(file){ // تسجيل بشري مطابق للبصمة إن وُجد، وإلا القارئ الآلي (D09)
    audioEl = new Audio('audio/' + file);
    audioEl.onerror = () => { audioEl = null; tts(t); };
    audioEl.play().catch(() => { audioEl = null; tts(t); });
    return;
  }
  tts(t);
}
function tts(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ar';
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ar')); if(v) u.voice = v;
  u.rate = .92; speechSynthesis.speak(u);
}
$('#speak').onclick = () => speak(lastSpoken, lastKey);

// ---------- items ----------
function renderItem(it, mount, {graded=true}={}){
  const wrap = document.createElement('div'); wrap.className='item';
  const saved = progress[it.id];
  wrap.innerHTML = `<div class="meta">${it.id}${it.level?' · مستوى '+(it.level==='A'?'أ':'ب'):''}</div><p>${tx(it.prompt)}</p>`;
  const fb = document.createElement('div');
  const done = (ok, hint) => {
    fb.className = 'fb ' + (ok?'ok':'hint'); fb.textContent = tx(ok ? (it.feedback_correct || 'صحيح.') : (hint || it.feedback_wrong || (profile?.gender==='f'?'حاولي مرة أخرى.':'حاول مرة أخرى.')));
    if(graded){ const p = progress[it.id] || {hints:0, ok:false}; if(ok) p.ok = true; else p.hints++; progress[it.id]=p; store.set('progress',progress); markSteps(); }
  };
  if(it.type==='locate_on_atlas'){
    const b = document.createElement('button'); b.className='btn sec'; b.textContent = 'اضغط على الموضع في الرسم';
    b.onclick = () => { b.textContent='…اضغط الآن على الرسم'; const vn = (()=>{ for (const [k,[vid]] of Object.entries(VIEWS)) { const el = document.getElementById(vid); if (el && el.querySelector('#'+CSS.escape(it.atlas_target))) return k; } return 'body'; })(); view(vn); if(vn==='body') setLayers(Object.keys(LAYERS));
      locateHandler = (id) => { locateHandler=null; b.textContent='اضغط على الموضع في الرسم'; const ok = id===it.answer; if(ok){ document.getElementById(id)?.classList.add('target-ok'); } done(ok); }; };
    wrap.append(b);
  } else if(['choose','choose_reason','predict'].includes(it.type) && it.options){
    const opts = document.createElement('div'); opts.className='opts';
    it.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<span class="n">${i+1}.</span> ${tx(o)}`;
      b.onclick=()=>{ const ok = i===it.answer; $$('.opt',opts).forEach(x=>x.classList.remove('right','wrong')); b.classList.add(ok?'right':'wrong'); done(ok); }; opts.append(b); });
    wrap.append(opts);
  } else if(it.type==='sequence'){
    const opts = document.createElement('div'); opts.className='opts'; let picked=[];
    const hint = document.createElement('p'); hint.className='meta'; hint.textContent='اضغط العناصر بالترتيب الصحيح.';
    const shuffled = it.options.map((o,i)=>({o,i})).sort(()=>Math.random()-.5);
    shuffled.forEach(({o,i})=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o;
      b.onclick=()=>{ if(b.getAttribute('aria-pressed')==='true') return; picked.push(i); b.setAttribute('aria-pressed','true'); b.innerHTML=`<span class="n">${picked.length}.</span> ${o}`;
        if(picked.length===it.options.length){ const ok = picked.every((v,k)=>v===it.answer[k]); done(ok); if(!ok){ setTimeout(()=>{ picked=[]; $$('.opt',opts).forEach(x=>{x.removeAttribute('aria-pressed'); x.textContent=x.textContent.replace(/^\d+\.\s*/,'');}); },1500);} } }; opts.append(b); });
    wrap.append(hint, opts);
  } else { // open: explain_open, true_false_why, fix_model, compare
    const ta = document.createElement('textarea'); ta.id = 'ta_'+it.id.replace(/\W/g,'_'); ta.placeholder='اكتب جوابك، أو قله لمعلمك/ولي أمرك بصوتك.'; ta.value = (saved && saved.text) || '';
    const b = document.createElement('button'); b.className='btn ghost'; b.textContent='أظهر الإجابة النموذجية (بعد أن أجيب)';
    const model = document.createElement('div'); model.className='fb ok'; model.hidden = true; model.innerHTML = `<b>إجابة نموذجية:</b> ${it.answer}${it.rubric?` <span class="tag">يُقيّمه إنسان بالمعيار ${it.rubric}</span>`:''}`;
    ta.oninput = () => { progress[it.id] = Object.assign(progress[it.id]||{}, {text: ta.value}); store.set('progress',progress); };
    b.onclick = () => { model.hidden = false; if(graded){ progress[it.id] = Object.assign(progress[it.id]||{}, {answered:true}); store.set('progress',progress); markSteps(); } };
    wrap.append(ta, b, model);
  }
  wrap.append(fb); mount.append(wrap);
}

// ---------- stages ----------
const stage = $('#stage');
let explainIdx = store.get('explainIdx',0);
function render(){
  stage.innerHTML=''; lastSpoken='';
  const s = stepsDef[step].id;
  $('#prev').disabled = step===0; $('#next').textContent = step===stepsDef.length-1 ? 'أنهيتُ الدرس' : 'التالي';
  if(s==='hook'){
    applyAtlas({layers:['skeleton','circulatory'], highlight:['heart']});
    const fo = DATA.faith?.opening;

function markSteps(){
  const okAll = ids => ids.length && ids.every(id => progress[id] && (progress[id].ok || progress[id].answered));
  const done = {
    hook: !!store.get('hook'), exp: pulse.rest!=null && pulse.move!=null,
    explain: DATA.flow.explain.filter(inLevel).every(sc => store.get('seen',[]).includes(sc.id)),
    practice: okAll(DATA.flow.practice.filter(inLevel).map(i=>i.id)), check: okAll(DATA.flow.check.filter(inLevel).map(i=>i.id)),
    notebook: !!store.get('notebook'), know: !!store.get('limitAns'), dedicate: ['pending','approved'].includes(store.get('dedication',{}).status),
  };
  $$('#steps button').forEach((b,i)=>b.classList.toggle('done', !!done[stepsDef[i].id]));
}
$('#steps').innerHTML = stepsDef.map((s,i)=>`<button data-i="${i}">${i+1}. ${s.name}</button>`).join('');
$$('#steps button').forEach(b => b.onclick = () => { step = +b.dataset.i; store.set('step',step); render(); });
$('#prev').onclick = () => { if(step>0){ step--; store.set('step',step); render(); } };
$('#next').onclick = () => { if(step<stepsDef.length-1){ step++; store.set('step',step); render(); } else { stage.innerHTML += `<div class="fb ok">${profile?.gender==='f'?`أحسنتِ يا ${profile.name}، أنهيتِ درس ${DATA.id}. ما أثبتِّه مستقلةً محفوظ هنا؛ ما يحتاج تقييم إنسان (الرسم والشرح) اعرضيه على معلمتك أو ولي أمرك.`:`أحسنت يا ${profile?.name||''}، أنهيت درس ${DATA.id}. ما أثبتّه مستقلاً محفوظ هنا؛ ما يحتاج تقييم إنسان (الرسم والشرح) اعرضه على معلمك أو ولي أمرك.`}</div>`; } };

function greetName(){ const n = profile?.name||''; return profile?.gender==='f' ? `أهلاً يا ${n}` : `أهلاً يا ${n}`; }
function showProfile(edit){
  const sc = $('#profileScreen'); sc.hidden = false; $('.grid').hidden = true;
  $('#pfName').value = profile?.name||''; let g = profile?.gender||null; let photo = profile?.photo||null;
  const setG = v => { g=v; $('#pfBoy').setAttribute('aria-pressed', String(v==='m')); $('#pfGirl').setAttribute('aria-pressed', String(v==='f')); };
  setG(g);
  const showPhoto = () => { if(photo){ $('#pfPreview').src=photo; $('#pfPreview').hidden=false; $('#pfPh').hidden=true; } };
  showPhoto();
  $('#pfBoy').onclick=()=>setG('m'); $('#pfGirl').onclick=()=>setG('f');
  $('#pfFile').onchange = ev => { const f = ev.target.files[0]; if(!f) return; const im = new Image(); const url = URL.createObjectURL(f);
    im.onload = () => { const c = document.createElement('canvas'); const S=256; c.width=c.height=S; const x=c.getContext('2d'); const r=Math.min(im.width,im.height); x.drawImage(im,(im.width-r)/2,(im.height-r)/2,r,r,0,0,S,S); photo=c.toDataURL('image/jpeg',.8); URL.revokeObjectURL(url); showPhoto(); }; im.src=url; };
  $('#pfGo').onclick = () => { const name = $('#pfName').value.trim(); const err=$('#pfErr');
    if(!name){ err.textContent='اكتب اسمك أولاً.'; err.hidden=false; return; } if(!g){ err.textContent='اختر: ولد أم بنت؟'; err.hidden=false; return; }
    profile = {name, gender:g, photo}; pstore.set(profile); sc.hidden=true; $('.grid').hidden=false; applyProfile(); render(); };
}
function applyProfile(){
  $('#title').textContent = DATA.title.ar; $('#dq').textContent = tx(DATA.driving_question);
  if(!profile) return;
  $('#whoami').hidden = false; $('#whoName').textContent = profile.name; if(profile.photo){ $('#whoImg').src=profile.photo; $('#whoImg').hidden=false; }
  document.title = `الأطلس الحي — ${profile.name}`;
}
$('#whoami').onclick = () => showProfile(true);
if(!profile){ showProfile(false); } else { applyProfile(); }

// ---------- شاشة ولي الأمر / المعلم ----------
const RUB = Object.fromEntries((DATA.assessment.rubrics||[]).map(r=>[r.for,r.levels]));
function openItems(){ const all=[...DATA.flow.check, ...DATA.assessment.items, ...DATA.assessment.transfer]; return all.filter(it => ['explain_open','true_false_why','fix_model','compare'].includes(it.type) && inLevel(it)); }
function renderReview(){
  const body = $('#reviewBody'); const items = openItems();
  const saved = store.get('drawing'); const ded = store.get('dedication',null);
  const score = (id, k) => (progress[id]||{}).human?.[k];
  body.innerHTML = `<p class="meta">الطفل: <b>${profile?.name||'—'}</b> · الدرس ${DATA.id} · ${items.length} إجابة مفتوحة تحتاج تقييم إنسان. الدرجات: 0 لا يذكر الفكرة · 1 صحيحة غير مكتملة · 2 صحيحة كاملة بلغته.</p>
    <h3>١. الإجابات المفتوحة</h3>` +
    items.map(it => { const p = progress[it.id]||{}; const lv = RUB[it.rubric]||RUB['R1']||{};
      return `<div class="item"><div class="meta">${it.id} · هدف ${it.objective.split('.').pop()}</div><p><b>${tx(it.prompt)}</b></p>
        <div class="card" style="margin:6px 0"><b>إجابة الطفل:</b> ${p.text ? p.text.replace(/</g,'&lt;') : '<span class="meta">لم يكتب؛ قد يكون أجاب شفهياً</span>'}</div>
        <details><summary class="meta" style="cursor:pointer">الإجابة النموذجية والمعيار</summary><p>${it.answer}</p><ul class="meta">${['0','1','2'].map(k=>`<li><b>${k}</b>: ${lv[k]||''}</li>`).join('')}</ul></details>
        <div class="row" style="margin-top:6px">${['0','1','2'].map(k=>`<button class="opt" data-score="${k}" data-item="${it.id}" aria-pressed="${String(score(it.id,'score')==+k)}">${k}</button>`).join('')}<input class="meta" data-note="${it.id}" placeholder="ملاحظة (اختياري)" value="${(p.human?.note||'').replace(/"/g,'&quot;')}" style="flex:1;min-width:8em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"></div></div>`; }).join('') +
    `<h3>٢. دفتر الأطلس (الرسم من الذاكرة)</h3><p class="meta">${tx(DATA.flow.notebook.draw)}</p>${saved?`<img src="${saved}" alt="رسم الطفل" style="max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff">`:'<p class="meta">لا رسم محفوظ في التطبيق؛ قيّم الرسم الورقي.</p>'}
     <div class="row" style="margin-top:6px">${['0','1','2'].map(k=>`<button class="opt" data-score="${k}" data-item="__notebook" aria-pressed="${String(score('__notebook','score')==+k)}">${k}</button>`).join('')}<span class="meta">${(RUB['R3-notebook']||{})['2']||''}</span></div>
    <h3>٣. الإهداء</h3>${ded && ded.status!=='draft' ? `<div class="card"><b>${({teach:'أعلّمك مفهوماً',share:'أشاركك تجربتي',dare:'أتحدّاك'})[ded.type]||''}</b> · ${ded.concept||''}<br>${(ded.text||'').replace(/</g,'&lt;')||'<span class="meta">صوتي / بلا نص</span>'}<br><span class="meta">الحالة: ${ded.status==='approved'?'معتمد ✓':'بانتظار الاعتماد'}</span></div>
      <div class="row"><button class="btn" id="dedApprove">اعتماد للمشاركة (الدقة العلمية 2)</button><button class="btn ghost" id="dedReturn">إعادة للتصحيح</button><input id="dedNote" placeholder="ما الذي يجب تصحيحه؟" style="flex:1;min-width:10em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"></div>` : '<p class="meta">لا إهداء مرسل بعد.</p>'}
    <h3>٤. ملخص</h3><div class="numbers">${(()=>{ const ok = Object.values(progress).filter(p=>p.ok).length; const tried = Object.values(progress).filter(p=>p.ok||p.hints||p.answered).length; const hum = items.filter(it=>(progress[it.id]||{}).human).length; return `<div class="num"><b>${ok}</b><br><span class="meta">بند آلي صحيح</span></div><div class="num"><b>${tried}</b><br><span class="meta">بند جُرّب</span></div><div class="num"><b>${hum} / ${items.length}</b><br><span class="meta">إجابة مفتوحة قُيّمت</span></div><div class="num"><b>${pulse.rest?pulse.rest+' / '+(pulse.move||'—'):'—'}</b><br><span class="meta">نبض راحة / حركة</span></div>`; })()}</div>
    <p class="meta">هذه المؤشرات للمتابعة لا للحكم؛ النجاح بعد تلميح يُسجَّل «بمساعدة». يُقيَّم الفهم العلمي منفصلاً عن القراءة والكتابة.</p>`;
  $$('[data-score]',body).forEach(b => b.onclick = () => { const id=b.dataset.item; progress[id]=Object.assign(progress[id]||{},{human:Object.assign((progress[id]||{}).human||{},{score:+b.dataset.score,by:'adult',at:Date.now()})}); store.set('progress',progress); $$(`[data-item="${CSS.escape(id)}"]`,body).forEach(x=>x.setAttribute('aria-pressed', String(x===b))); });
  $$('[data-note]',body).forEach(i => i.onchange = () => { const id=i.dataset.note; progress[id]=Object.assign(progress[id]||{},{human:Object.assign((progress[id]||{}).human||{},{note:i.value})}); store.set('progress',progress); });
  const da=$('#dedApprove'); if(da){ da.onclick=()=>{ const d=store.get('dedication',{}); d.status='approved'; d.note=''; store.set('dedication',d); renderReview(); };
    $('#dedReturn').onclick=()=>{ const d=store.get('dedication',{}); d.status='draft'; d.note=$('#dedNote').value; store.set('dedication',d); renderReview(); }; }
}
function openReview(){
  $('.grid').hidden = true; $('#profileScreen').hidden = true; $('#reviewScreen').hidden = false;
  let pin=null; try{ pin=localStorage.getItem('atlas:pin'); }catch(e){}
  $('#pinHint').textContent = pin ? 'أدخل الرقم.' : 'أول مرة: اختر رقماً من 4 أرقام يفتح هذه الشاشة لاحقاً.';
  $('#pinGate').hidden=false; $('#reviewBody').hidden=true; $('#pin').value='';
  $('#pinGo').onclick=()=>{ const v=$('#pin').value.trim(); if(!/^\d{4}$/.test(v)){ $('#pinErr').textContent='أربعة أرقام.'; $('#pinErr').hidden=false; return; }
    if(!pin){ try{ localStorage.setItem('atlas:pin',v); }catch(e){} pin=v; }
    if(v!==pin){ $('#pinErr').textContent='الرقم غير صحيح.'; $('#pinErr').hidden=false; return; }
    $('#pinGate').hidden=true; $('#reviewBody').hidden=false; renderReview(); };
}
$('#parentBtn').onclick=openReview;
$('#reviewClose').onclick=()=>{ $('#reviewScreen').hidden=true; $('.grid').hidden=false; render(); };
setLevel(level);
})();
</script>
